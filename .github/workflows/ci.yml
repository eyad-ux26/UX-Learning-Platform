name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens
      - run: npm run validate
      - name: Content bundle is up to date
        run: |
          npm run build -w @uxgate/content
          git diff --exit-code -- packages/content/dist
      - name: Generated tokens are up to date
        run: git diff --exit-code -- packages/tokens/dist
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
