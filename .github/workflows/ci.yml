name: CI
on:
  pull_request:
  push:
    branches: [main]
# CI only reads the code: the token it gets cannot push, comment or change settings.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens
      - run: npm run validate
      - name: Content bundle is up to date
        run: |
          npm run build -w @uxgate/content
          git diff --exit-code -- packages/content/dist
      - name: Generated tokens are up to date
        run: git diff --exit-code -- packages/tokens/dist
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: No Pro lesson content in public files
        run: node apps/web/scripts/check-static.mjs
      - name: Accessibility and keyboard checks
        working-directory: apps/web
        env:
          UG_DEV_FIXTURE: "1"
        run: |
          npx playwright-core install --with-deps chromium
          npx next start -p 3100 &
          npx wait-on -t 60000 http://localhost:3100/en
          node scripts/a11y.mjs
          node scripts/keyboard.mjs
          node scripts/flow.mjs http://localhost:3100 en 390
          node scripts/flow.mjs http://localhost:3100 ar 1440
          node scripts/theme.mjs
