version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # next-intl 4.5+ depends on @swc/core, whose native binding fails to load in the Cloudflare
      # build image ("Failed to load native binding" when next.config.ts loads). Pinned to 4.4.0
      # until that is understood. See the tracking issue for next-intl.
      - dependency-name: next-intl
        versions: [">=4.5.0"]
      # Major jumps are planned work, not weekly noise. Next 16 needs the OpenNext adapter checked first;
      # TypeScript 7 and js-yaml 5 fail our CI today. Remove an entry when we schedule that upgrade.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
