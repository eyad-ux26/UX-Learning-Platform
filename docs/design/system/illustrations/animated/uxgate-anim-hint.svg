<svg id="ahint-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="ahint-t"><title id="ahint-t">Light bulb</title><style>#ahint-svg [class^="a-"],#ahint-svg [class*=" a-"]{transform-box:fill-box;transform-origin:center}#ahint-svg .a-tw{animation:hint-tw 1.8s ease-in-out infinite}#ahint-svg .a-d2{animation-delay:.6s}#ahint-svg .a-d3{animation-delay:1.2s}@keyframes hint-tw{0%,100%{transform:scale(.4);opacity:.35}50%{transform:scale(1);opacity:1}}#ahint-svg .a-glow{animation:hint-glow 1.8s ease-in-out infinite alternate}@keyframes hint-glow{from{opacity:.15}to{opacity:.6}}#ahint-svg .a-rays{animation:hint-rays 1.8s ease-in-out infinite alternate}@keyframes hint-rays{from{opacity:.2}to{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="ahint-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><filter id="ahint-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><radialGradient id="ahint-r3" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFE9A0"/><stop offset=".6" stop-color="#FFC53F"/><stop offset="1" stop-color="#D9860A"/></radialGradient><linearGradient id="ahint-g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E3F0F6"/><stop offset="1" stop-color="#A9C7D6"/></linearGradient><linearGradient id="ahint-g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FCFF"/><stop offset=".55" stop-color="#D4EEF7"/><stop offset="1" stop-color="#9CC6D8"/></linearGradient><linearGradient id="ahint-g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A5B7C"/><stop offset=".55" stop-color="#0E3D5E"/><stop offset="1" stop-color="#012E4B"/></linearGradient><filter id="ahint-b7" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter><filter id="ahint-lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#012E4B" flood-opacity=".14"/></filter></defs><ellipse class="ug-floor" cx="120" cy="214" rx="40" ry="9" fill="#012E4B" opacity="0.16" filter="url(#ahint-b1)"/><g filter="url(#ahint-lift)"><circle class="a-glow" cx="120" cy="94" r="64" fill="#FFD25A" opacity=".35" filter="url(#ahint-b2)"/><path d="M120 46A48 48 0 0 1 154 128C148 136 146 142 146 150H94C94 142 92 136 86 128A48 48 0 0 1 120 46Z" fill="url(#ahint-r3)"/><path d="M108 148V118L114 108L120 118L126 108L132 118V148" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><rect x="94" y="150" width="52" height="12" rx="5" fill="url(#ahint-g4)"/><rect x="96" y="164" width="48" height="12" rx="5" fill="url(#ahint-g5)"/><path d="M104 178H136C136 190 128 196 120 196C112 196 104 190 104 178Z" fill="url(#ahint-g6)"/><path d="M96 70C88 84 88 100 94 112C96 96 102 84 112 74Z" fill="#fff" opacity="0.8" filter="url(#ahint-b7)"/><path class="a-rays" d="M120 22V32M66 44L73 51M174 44L167 51M50 94H60M180 94H190" stroke="#FFC53F" stroke-width="5" stroke-linecap="round"/></g></svg>