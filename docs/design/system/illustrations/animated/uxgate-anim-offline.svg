<svg id="aoffline-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="aoffline-t"><title id="aoffline-t">Offline</title><style>#aoffline-svg [class^="a-"],#aoffline-svg [class*=" a-"]{transform-box:fill-box;transform-origin:center}#aoffline-svg .a-tw{animation:offline-tw 1.8s ease-in-out infinite}#aoffline-svg .a-d2{animation-delay:.6s}#aoffline-svg .a-d3{animation-delay:1.2s}@keyframes offline-tw{0%,100%{transform:scale(.4);opacity:.35}50%{transform:scale(1);opacity:1}}#aoffline-svg .a-float{animation:offline-float 3s ease-in-out infinite}@keyframes offline-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}#aoffline-svg .a-badge{animation:offline-badge 3s ease-in-out infinite}@keyframes offline-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="aoffline-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><radialGradient id="aoffline-r2" cx="0.35" cy="0.25" r="0.95"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#E3F0F6"/><stop offset="1" stop-color="#A9C7D6"/></radialGradient><filter id="aoffline-b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter><linearGradient id="aoffline-g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9C98"/><stop offset=".55" stop-color="#F2545B"/><stop offset="1" stop-color="#B92537"/></linearGradient><filter id="aoffline-lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#012E4B" flood-opacity=".14"/></filter></defs><ellipse class="ug-floor" cx="120" cy="214" rx="64" ry="9" fill="#012E4B" opacity="0.16" filter="url(#aoffline-b1)"/><g filter="url(#aoffline-lift)"><g class="a-float"><path d="M72 168C50 168 38 152 38 136C38 118 52 106 70 106C74 80 94 62 120 62C146 62 164 78 170 100C190