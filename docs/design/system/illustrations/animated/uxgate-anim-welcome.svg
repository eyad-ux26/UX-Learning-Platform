<svg id="awelcome-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="awelcome-t"><title id="awelcome-t">Open gate</title><style>#awelcome-svg [class^="a-"],#awelcome-svg [class*=" a-"]{transform-box:fill-box;transform-origin:center}#awelcome-svg .a-tw{animation:welcome-tw 1.8s ease-in-out infinite}#awelcome-svg .a-d2{animation-delay:.6s}#awelcome-svg .a-d3{animation-delay:1.2s}@keyframes welcome-tw{0%,100%{transform:scale(.4);opacity:.35}50%{transform:scale(1);opacity:1}}#awelcome-svg .a-door{transform-origin:0% 50%;animation:welcome-door 1.6s cubic-bezier(.3,.7,.2,1) .3s both}@keyframes welcome-door{from{transform:scaleX(1.4)}to{transform:scaleX(.8)}}#awelcome-svg .a-light{animation:welcome-light 1.6s ease-out .5s both}@keyframes welcome-light{from{opacity:0}to{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><filter id="awelcome-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><linearGradient id="awelcome-g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A5B7C"/><stop offset=".55" stop-color="#0E3D5E"/><stop offset="1" stop-color="#012E4B"/></linearGradient><radialGradient id="awelcome-r3" cx="0.5" cy="0.55" r="0.8"><stop offset="0" stop-color="#C2F5FF"/><stop offset=".6" stop-color="#6AD9F7"/><stop offset="1" stop-color="#1C9CC9"/></radialGradient><filter id="awelcome-b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter><linearGradient id="awelcome-g5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E3F0F6"/><stop offset="1" stop-color="#A9C7D6"/></linearGradient><linearGradient id="awelcome-g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FCFF"/><stop offset=".55" stop-color="#D4EEF7"/><stop offset="1" stop-color="#9CC6D8"/></linearGradient><linearGradient id="awelcome-g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A0"/><stop offset=".55" stop-color="#FFC53F"/><stop offset="1" stop-color="#D9860A"/></linearGradient><filter id="awelcome-b8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter><filter id="awelcome-lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#012E4B" flood-opacity=".14"/></filter></defs><ellipse class="ug-floor" cx="120" cy="214" rx="64" ry="9" fill="#012E4B" opacity="0.16" filter="url(#awelcome-b1)"/><g filter="url(#awelcome-lift)"><path d="M70 196V84C70 54 92 34 120 34C148 34 170 54 170 84V196Z" fill="url(#awelcome-g2)"/><path d="M82 196V88C82 64 98 48 120 48C142 48 158 64 158 88V196Z" fill="#C2F5FF"/><path d="M82 196V88C82 64 98 48 120 48C142 48 158 64 158 88V196Z" fill="url(#awelcome-r3)" opacity=".6"/><path class="a-light" d="M120 196L64 214H176Z" fill="#78E4FC" opacity=".35" filter="url(#awelcome-b4)"/><g class="a-door"><path d="M82 196V88C82 70 92 56 106 50L136 64V206L82 196Z" fill="url(#awelcome-g5)"/><path d="M136 64V206" stroke="url(#awelcome-g6)" stroke-width="6"/><circle cx="124" cy="132" r="5" fill="url(#awelcome-g7)"/><path d="M90 96C88 120 88 160 90 188C94 160 94 122 98 92Z" fill="#fff" opacity="0.7" filter="url(#awelcome-b8)"/></g><g transform="translate(186 50) scale(1)"><path class="a-tw" fill="#78E4FC" d="M0-9C1-3 3-1 9 0 3 1 1 3 0 9-1 3-3 1-9 0-3-1-1-3 0-9Z"/></g><g transform="translate(54 66) scale(0.7)"><path class="a-tw a-d2" fill="#FFC53F" d="M0-9C1-3 3-1 9 0 3 1 1 3 0 9-1 3-3 1-9 0-3-1-1-3 0-9Z"/></g></g></svg>