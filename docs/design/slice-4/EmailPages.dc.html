<helmet>

<!-- The mail client bar is a MOCK. Below it is the email itself: one 600px column, solid colours, the button ledge drawn as a bottom border, every image with alt text, no web fonts required (system fallback). -->
<div class="{{rootCls}}" lang="{{lang}}" dir="{{dir}}" data-theme="{{theme}}">
  <div class="em-client">
    <span class="native-cap"><span>MOCK</span>Mail app</span>
    <span class="from">UXGate &lt;hello@uxgate.org&gt;</span>
    <span class="{{subjCls}}">{{e.subj}}</span>
    <span class="{{preCls}}">{{e.pre}}</span>
  </div>
  <div style="flex: 1; overflow: hidden;">
    <div class="em" role="article" aria-label="{{e.subj}}">
      <div class="em-head"><img src="{{logo}}" alt="UXGate"></div>
      <div class="em-card">
        <img class="em-ill" src="{{e.ill}}" alt="{{e.illAlt}}">
        <h1>{{e.h1}}</h1>
        <sc-for list="{{e.ps}}" as="p" hint-placeholder-count="1"><p>{{p}}</p></sc-for>
        <sc-if value="{{e.hasBox}}" hint-placeholder-val="{{true}}">
          <div class="em-box"><img src="{{e.boxImg}}" alt=""><div class="grow"><b>{{e.boxT}}</b><span>{{e.boxS}}</span></div></div>
        </sc-if>
        <sc-if value="{{e.hasRows}}" hint-placeholder-val="{{false}}">
          <div class="em-rows"><sc-for list="{{e.rows}}" as="w" hint-placeholder-count="4"><div><span>{{w.k}}</span><b>{{w.v}}</b></div></sc-for></div>
        </sc-if>
        <a href="#{{view}}" class="em-btn">{{e.btn}}</a>
        <sc-for list="{{e.notes}}" as="n" hint-placeholder-count="1"><p class="muted">{{n}}</p></sc-for>
        <sc-if value="{{e.hasCode}}" hint-placeholder-val="{{false}}"><p class="em-code">{{e.code}}</p></sc-if>
        <sc-if value="{{e.hasSafety}}" hint-placeholder-val="{{false}}"><p class="muted">{{e.safety}}</p></sc-if>
      </div>
      <div class="em-foot">
        <span>{{e.why}}</span>
        <sc-if value="{{e.hasLinks}}" hint-placeholder-val="{{true}}">
          <span><sc-for list="{{e.links}}" as="l" hint-placeholder-count="2"><a href="#{{l.id}}" class="hit">{{l.label}}</a>{{l.sep}}</sc-for></span>
        </sc-if>
        <span>{{c.addr}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
