id: P01-U02
free: false
title:
  en: "Pick the right control"
  ar: "اختر عنصر التحكّم المناسب"
skill:
  en: "Choose the control that matches the answer: one or many, typed or picked, shown or searched."
  ar: "اختر عنصر التحكّم الذي يناسب الإجابة: واحدة أم عدة، تُكتب أم تُختار، تُعرض أم يُبحث فيها."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P01-U02-01
    title: { en: "Use a toggle only for instant settings", ar: "استخدم الـ Toggle للإعدادات الفورية فقط" }
    can_do: { en: "Use a toggle when the change happens at once, and a checkbox when it waits for a button.", ar: "استخدم الـ Toggle عندما يحدث التغيير فورًا، والـ Checkbox عندما ينتظر الضغط على زر." }
  - id: SK-P01-U02-02
    title: { en: "One answer or several, shown not hidden", ar: "إجابة واحدة أم عدة، معروضة لا مخفية" }
    can_do: { en: "Use radio buttons for one of a few, checkboxes for any number, and skip the dropdown for short lists.", ar: "استخدم الـ Radio buttons لإجابة واحدة من خيارات قليلة، والـ Checkboxes لأي عدد، وتجنّب القائمة المنسدلة للقوائم القصيرة." }
  - id: SK-P01-U02-03
    title: { en: "Choose defaults with care", ar: "اختر القيم الافتراضية بعناية" }
    can_do: { en: "Preselect a safe, common choice, and never preselect a guess about someone personally.", ar: "اختر مسبقًا خيارًا آمنًا وشائعًا، ولا تختر مسبقًا أبدًا تخمينًا عن شخص بعينه." }
  - id: SK-P01-U02-04
    title: { en: "Let people type what they know", ar: "دع الناس يكتبون ما يعرفونه" }
    can_do: { en: "Use a typed field for values people know by heart, like a year or a date far away.", ar: "استخدم حقلًا للكتابة للقيم التي يحفظها الناس، مثل سنة أو تاريخ بعيد." }
  - id: SK-P01-U02-05
    title: { en: "Show only the choices that are available", ar: "اعرض الخيارات المتاحة فقط" }
    can_do: { en: "Grey out dates and times that can't be booked, instead of rejecting them afterwards.", ar: "اجعل التواريخ والأوقات غير المتاحة باهتة، بدل رفضها بعد اختيارها." }
  - id: SK-P01-U02-06
    title: { en: "Pick the right control for numbers", ar: "اختر العنصر المناسب للأرقام" }
    can_do: { en: "Use a stepper for small counts with a usual value, typing for large or exact numbers, and a text box beside any slider.", ar: "استخدم الـ Stepper للأعداد الصغيرة ذات القيمة المعتادة، والكتابة للأرقام الكبيرة أو الدقيقة، ومربع نص بجانب أي Slider." }
  - id: SK-P01-U02-07
    title: { en: "Treat codes as text made of digits", ar: "تعامل مع الرموز كنص من أرقام" }
    can_do: { en: "Give IDs and codes a text field with the number pad, so leading zeros and length stay intact.", ar: "أعطِ الأرقام التعريفية والرموز حقلًا نصيًا بلوحة أرقام، حتى تبقى الأصفار الأولى والطول كما هي." }
  - id: SK-P01-U02-08
    title: { en: "Make long lists searchable and forgiving", ar: "اجعل القوائم الطويلة قابلة للبحث ومتسامحة" }
    can_do: { en: "Let people type to narrow long lists, suggest matches for typos, and pin common options without preselecting them.", ar: "دع الناس يكتبون لتضييق القوائم الطويلة، واقترح نتائج للأخطاء الإملائية، وثبّت الخيارات الشائعة في الأعلى دون اختيارها مسبقًا." }
