id: P01-U01
free: true
title:
  en: "Ask only what you need"
  ar: "اسأل فقط عمّا تحتاجه"
skill:
  en: "Decide which information a form needs now, mark what's optional, and ask it in a way people can answer."
  ar: "حدّد المعلومات التي يحتاجها النموذج الآن، ووضّح ما هو اختياري، واسأل عنها بطريقة يستطيع الناس الإجابة عنها."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P01-U01-01
    title: { en: "Cut the fields the form doesn't need", ar: "احذف الحقول التي لا يحتاجها النموذج" }
    can_do: { en: "Remove fields nobody uses, while keeping every field the task really needs.", ar: "احذف الحقول التي لا يستخدمها أحد، مع الإبقاء على كل حقل تحتاجه المهمّة فعلًا." }
  - id: SK-P01-U01-02
    title: { en: "Postpone what can wait", ar: "أجّل ما يمكن أن ينتظر" }
    can_do: { en: "Move questions that are needed only later to the step where they're needed.", ar: "انقل الأسئلة التي تُحتاج لاحقًا فقط إلى الخطوة التي تُحتاج فيها." }
  - id: SK-P01-U01-03
    title: { en: "Explain why you ask for personal details", ar: "اشرح لماذا تطلب البيانات الشخصية" }
    can_do: { en: "Say at the field who sees a personal detail and what it's used for.", ar: "قل عند الحقل مَن يرى المعلومة الشخصية وفيمَ تُستخدم." }
  - id: SK-P01-U01-04
    title: { en: "Mark required and optional fields", ar: "وضّح الحقول المطلوبة والاختيارية" }
    can_do: { en: "Put a star on every required field and label the few optional ones, at the field.", ar: "ضع نجمة على كل حقل مطلوب واكتب «اختياري» على الحقول الاختيارية القليلة، عند الحقل نفسه." }
  - id: SK-P01-U01-05
    title: { en: "Keep the check true to the label", ar: "اجعل التحقّق مطابقًا للعنوان" }
    can_do: { en: "Make sure a field labelled optional is never blocked when left empty.", ar: "تأكّد أن الحقل المكتوب عليه «اختياري» لا يُمنع أبدًا إذا تُرك فارغًا." }
  - id: SK-P01-U01-06
    title: { en: "Ask for a name in one field", ar: "اطلب الاسم في حقل واحد" }
    can_do: { en: "Use one full-name field that fits every naming pattern.", ar: "استخدم حقلًا واحدًا للاسم الكامل يناسب كل أنماط الأسماء." }
  - id: SK-P01-U01-07
    title: { en: "Accept numbers the way people write them", ar: "اقبل الأرقام كما يكتبها الناس" }
    can_do: { en: "Accept spaces, dashes and country codes in phone numbers, and tidy them for people.", ar: "اقبل المسافات والشَرطات ومفاتيح الدول في أرقام الهواتف، ونظّمها بدلًا من الناس." }
  - id: SK-P01-U01-08
    title: { en: "Use labels and formats people understand", ar: "استخدم عناوين وصيغًا يفهمها الناس" }
    can_do: { en: "Replace internal terms with plain words, and spell out months in dates.", ar: "استبدل المصطلحات الداخلية بكلمات بسيطة، واكتب أسماء الشهور في التواريخ." }
