id: P02
title:
  en: "Find and Fix Usability"
  ar: "اكتشف مشكلات الاستخدام وأصلحها"
subtitle:
  en: "Use the 10 usability heuristics to spot what makes a screen hard to use, and pick the fix that helps."
  ar: "استخدم مبادئ الاستخدام العشرة (Usability heuristics) لتكتشف ما يجعل الشاشة صعبة الاستخدام، وتختار الإصلاح الذي يساعد."
