C06ar: "تعال نشوف أمثلة من أمثلة الـ Recognition rather than recall: الـ Compare. اليوزر عندك يبقى عنده Need إنه يقارن بين أكتر من Product أو أكتر من Item. في المثال ده، إنت بتشتري Mobile phone جديد، وعايز تقارن الكاميرا بتاعته والـ Processor، وباقي الـ Features بتاعته، بموبايلات تانية. عندك حل من اتنين كديزاينر عشان تساعد اليوزر يقوم بالمهمة دي. أولًا: إنك عادي تخلّيه يدخل على صفحة الموبايل يشوف الـ Details بتاعته، وبعد كده يطلع ويدخل على موبايل تاني، ويبدأ يفتكر، يعمل Recall للمعلومات بتاعة الموبايل الأولاني، ويقارنها بالموبايل التاني. وده طبعًا بيعتمد على الـ Recall، ومش أحسن حاجة. الحل التاني إنك توفّر Comparison features زي ده، زي حالة GSM Arena: بيوفّر لليوزر إنه يعمل مقارنة بين الموبايلات، ويبقى بيعمل Recognition للداتا. عايز يشوف الـ Body عامل إزاي، أو الـ Weight، أو مين فيه شريحتين ومين شريحة واحدة، ومجرد ما يبص على المعلومة خلاص بيعمل لها Recognition. طيب، فيه مشكلة في التصميم ده. عايزكم تبصّوا معايا على الـ Website وتحاولوا تفكّروا إيه هي المشكلة. أنا دلوقتي هبص على الموبايلات وبعمل Scrolling. تفتكر إيه المشكلة في الـ Recognition rather than recall، According للـ Heuristic ده؟ أنا بصّيت هنا على الـ Features أو على الـ Battery مثلًا، وهنا محتاج أفتكر: مين كان أول موبايل، ومين كان تاني موبايل، ومين كان تالت موبايل، وإلا أضطر أطلع فوق وأنزل تحت، أطلع فوق وأنزل تحت. فالـ Usability بلا شك هتتأثّر. تعالوا أوريكم مثال تاني قدّم المهمة دي بشكل أنجح، وهو Mailchimp في الـ Pricing plans بتاعته. بص هنا، هو برضو بيدّيني مقارنة، ولما بعمل Scroll ما عملش زي GSM Arena، إني خلاص ما بقيتش عارف أول Column ده كان إيه وتالت Column كان إيه. لأ، هو هنا عمل Fixation، ثبّت الـ Titles أو الـ Headers بتاعة الـ Table الخاص بالمقارنة. فطول ما أنا ماشي في المقارنة، شايف: دي الـ Premium، ودي حاجات الـ Standard، ودي حاجات الـ Essentials. وما إلى ذلك من الوسائل اللي بتحقّق الـ Recognition rather than recall."
C06en: "Let's look at examples of recognition rather than recall: comparing. Your users need to compare several products or items. In this example, you're buying a new phone and want to compare its camera, processor and other features with other phones. As a designer, you have one of two ways to help. First: just let people open each phone's page and see its details, then leave and open another phone, and start recalling the first phone's details to compare them with the second. That relies on recall, and it's not the best. The second way is to offer comparison features like this one, as GSM Arena does: it lets people compare phones side by side, so they recognise the data. Want to see the body, the weight, or which takes two SIM cards? One look at the information and they recognise it. But there's a problem in this design. Look at the website with me and try to work out what it is. I'm looking at the phones and scrolling. What's the problem, according to recognition rather than recall? I'm looking at the features, say the battery, and now I have to remember which was the first phone, the second and the third, or keep scrolling up and down, up and down. Usability will certainly suffer. Let me show you another example that does this better: Mailchimp's pricing plans. It also gives me a comparison, but when I scroll it doesn't do what GSM Arena did, where I lose track of which column is which. No, it fixes the titles, the headers of the comparison table. So all the way down I can see: this is Premium, this is Standard, this is Essentials. These are the kinds of ways to achieve recognition rather than recall."
C07ar: "هتلاقي المثال ده بيبرز جدًا في الـ Design tools بالنسبة لك كـ Designers. لو إنت بتستخدم Figma أو أي Design tool، هتلاقي إن دايمًا فيه Shortcuts. وده المثال اللي معانا: زي ما إنت شايف في Figma، أي Tool بتوقف عليها، بتعمل عليها Hovering أو بتضغط عليها، بيقول لك إيه الـ Keyboard shortcut اللي ممكن تستخدمه. ودايمًا خلّي بالك: الـ Keyboard أسرع من الماوس. يعني إنك تروح بالماوس توقف على الـ Tool وتضغط عليها، أبطأ بكتير من إنك تضغط على حرف على الـ Keyboard فيجيب لك الـ Tool. فاليوزر يبقى عنده الـ Capability إنه يضغط على حروف بسرعة، وده بيعمل Enhance للـ Experience جدًا. عشان كده تلاقي إن الـ Designer اللي بقى له مثلًا أربع خمس سنين بيستخدم الـ Tool، غير الـ Designer اللي بقى له شهر أو كام أسبوع بيستخدم نفس الـ Tool، خاصةً لما تـ Provide موضوع الـ Shortcuts. بتلاقي فرق في السرعة كبير جدًا، على قد ما الشخص القديم ده متمكّن من الـ Shortcuts وفاهمها بطريقة صحيحة. بتلاقي فعلًا إن الـ Expert هو Expert، وعنده Level of efficiency أعلى وسرعة أعلى. فالـ Efficiency هي السرعة. فدايمًا حاول تخلّي الشخص الـ Expert يخلّص المهام بتاعته بسرعة أكبر، ومن ضمن الوسائل الـ Keyboard shortcuts زي ما ذكرنا، مش بس في الـ Design tools. إنت عارف إن فيه بعض الـ Actions محتاجة Shortcuts لأنها Repetitive. مش مهم في الحالة دي إن الـ Shortcuts تبقى ظاهرة للمبتدئين، لكن تبقى سهلة الوصول بالنسبة لأي User، بحيث إنه لو عايز يتعلّمها وعايز يتطوّر تبقى Accessible بالنسبة له. زي المثال هنا الخاص بـ Figma: مجرد ما بنعمل Hovering على الـ Tool، أو بيضغط عليها، بيبدأ يظهر له الـ Shortcut اللي ممكن يـ Access بيه الـ Tool دي على طول، وفي نفس الوقت بيدّيه Documentation كامل لكل الـ Shortcuts اللي موجودة في السيستم."
C07en: "You'll see this clearly in design tools. If you use Figma or any design tool, there are always shortcuts. Here's our example: in Figma, when you hover over any tool or click it, it tells you which keyboard shortcut you can use. And remember: the keyboard is faster than the mouse. Moving the mouse to a tool and clicking it is much slower than pressing one letter to get the tool. So users can press letters quickly, and that improves the experience a lot. That's why a designer who has used a tool for four or five years differs from one who has used it for a month or a few weeks, especially when you provide shortcuts. There's a huge difference in speed, as much as the experienced person has mastered the shortcuts. You find that the expert really is an expert, with a higher level of efficiency and speed. Efficiency means speed. So always try to let experts finish their tasks faster. Keyboard shortcuts are one way, as we said, and not just in design tools. Some actions need shortcuts because they're repetitive. It doesn't matter that beginners don't see these shortcuts, but they should be easy for anyone to reach, so whoever wants to learn and improve can get to them. Like this Figma example: just hovering over or clicking a tool shows the shortcut that opens it directly, and it also gives full documentation of every shortcut in the system."
C08ar: "تعال نبص على المثال ده: إيه رأيك فيه بالنسبة لموضوع الـ Signal to noise ratio؟ ده مثال المفروض إنك من هنا بتحجز رحلة، بتحجز طيارة. زي ما إنت شايف، ده شكل الـ Website. هنا الـ Signal عالية ولا الـ Noise عالية؟ هل الـ Signal أعلى من الـ Noise هنا؟ هل فعلًا المصمم هنا قدر يتعامل مع الـ Noise، الحاجات اللي ممكن تكون Visual elements أو Options أو Actions مش مهمة بالنسبة لسياق اليوزر؟ هنا بوضوح ما وُفّقش إنه يحقّق الـ Signal to noise ratio. ليه؟ لأن زي ما إنت شايف، فيه ألوان كتير، وصور كتير، و Options كتير جدًا، بالنسبة لواحد داخل عايز يحجز طيارة. ممكن يكون أهم حاجة بالنسبة له: هو رايح فين، ويدخل التاريخ، ويبحث. ممكن يبقى فيه بعض الـ Options وبعض المعلومات، وممكن يحسّسه بإحساس إنه هيسافر والحاجات الجميلة دي كلها، لكن مش بصورة مالية الخلفية بالشكل ده، مالية ألوان ومالية تفاصيل. كل ده هينافس، زي ما اتفقنا، الـ Visuals أو العناصر البصرية الأكثر أهمية في السياق ده. طيب، هتشوف تقريبًا نفس الـ Goal أو نفس الـ Function محقّقة بشكل أفضل بكتير في Google Flights. هتلاقي إن الفوكس الأساسي على المربع اللي في النص، اللي من خلاله اليوزر بيدخل هو رايح فين. وهتلاقي الزرار اللي اسمه Explore واخد Elevation، واخد Shadow، وبارز وباللون الـ Primary. استخدام اللون الـ Primary هنا بطريقة عقلانية جدًا. قدر يوصّل Feeling إنك مسافر، يعني فيه حتى Emotion في الموضوع، لكن بطريقة هادية، بطريقة ما تخلّيش اليوزر يـ Lose الفوكس أو يفقد تركيزه عن المهمة الأساسية أو الجزء الأساسي اللي هو محتاج يركّز فيه، وهو إنه يبدأ يدخل هو رايح فين، وإيه التاريخ، ويبدأ يـ Explore الـ Flights المتاحة."
C08en: "Let's look at this example. What do you think of it, in terms of the signal-to-noise ratio? Here you're supposed to book a trip, a flight. As you can see, this is what the website looks like. Is the signal high here, or the noise? Is the signal higher than the noise? Did the designer manage the noise, the visual elements, options or actions that don't matter in the user's context? Clearly, here he didn't get the signal-to-noise ratio right. Why? Because, as you can see, there are lots of colours, lots of images and far too many options for someone who wants to book a flight. What matters most to them may be where they're going, entering the date, and searching. There can be some options and some information, and it can give a feeling of travel and all those lovely things, but not with an image filling the background like this, full of colours and details. All of that will compete, as we agreed, with the visual elements that matter most in this context. Now, you'll see almost the same goal, the same function, done much better in Google Flights. The main focus is on the box in the middle, where the user enters where they're going. And the Explore button has elevation and a shadow, and stands out in the primary colour, used very sensibly. It conveys the feeling of travelling, there's even some emotion in it, but calmly, in a way that doesn't make the user lose focus on the main task, the main part they need to concentrate on, which is entering where they're going and the date, and starting to explore the available flights."
