C01ar: "النص قيد الإعداد."
C01en: "Transcript pending."
C02ar: "ببساطة، تعالى نفترض إنك دلوقتي بتعمل Application لدكتور صيدلي صديقك، عنده ما شاء الله سلسلة من الصيدليات، وعايز يعمل برنامج يدير من خلاله الصيدليات، والدكاترة اللي شغالين معاه يدوّروا على الدوا بشكل سريع. وإنت قررت إنك مش هتعمل Research، ومش هتعتني بفكرة الـ Matching between the system and real world. ساعتها ممكن تقول: والله، أنا هرتّب الأدوية في السيستم ده إزاي؟ فتبدأ تفترض إنه Make sense إن أدوية مرضى السكر تبقى مع بعض، وأدوية مرضى الكبد مع بعض، فتبدأ تعمل Categories للأدوية، أو تصنّفها بناءً على المرض. وبعدين تطوّر المنتج، والـ Developers يشتغلوا عليه، وشركتك تشتغل عليه، وبعدين ينزل للصيدلية، والصيدلي يتفاجئ إنه مترتّب بطريقة هو مش متعوّد عليها أصلًا. هي كانت Make sense بالنسبة لك كـ Designer، لكن دي مش الطريقة اللي الدكاترة الصيادلة بيدوّروا بيها على الأدوية. الطريقة اللي هو متعوّد عليها هي الترتيب الأبجدي. وإنت هنا افترضت طريقة شايف إنها Make sense بالنسبة لك، بناءً على تجربتك الـ Real world الشخصية، باعتبارك غالبًا بتبقى مريض، مش دكتور صيدلي ولا دكتور، بتروح الأقسام المختلفة في المستشفى. فدي حياتك الواقعية، فقلت: والله، هقسّمها بناءً على الأقسام المختلفة أو الأمراض المختلفة. هنا إنت فوّت الـ Matching between system and real world، وأكيد المنتج اللي إنت عملته مش هينجح. وأول ما حد يبدأ يماتش البرنامج في الديزاين بتاعه، وفي طريقة ترتيب الأدوية بالطريقة اللي الصيدلي بيفكّر بيها، هينجح أكتر منك بكتير، وهيكون أسهل بكتير بالنسبة للمستخدمين، لأنهم Already متعوّدين على الطريقة دي في حياتهم الواقعية."
C02en: "Simply put, imagine you're building an application for a pharmacist friend who owns a chain of pharmacies, and wants software to run the pharmacies, so the pharmacists working with him can find medicines quickly. And you decided not to do any research, and not to care about matching the system to the real world. Then you might ask yourself how to arrange the medicines, and assume it makes sense to keep diabetes medicines together, and liver medicines together, so you start making categories, sorting the medicines by disease. Then you build the product, the developers work on it, your company works on it, and it goes out to the pharmacy, and the pharmacist is surprised that it's arranged in a way he's not used to at all. It made sense to you as a designer, but that's not how pharmacists look for medicines. What they're used to is alphabetical order. Here you assumed a way that made sense to you, based on your own real-world experience, since you're usually a patient, not a pharmacist or a doctor, and you visit the different departments of a hospital. That's your real life, so you split them by departments or diseases. Here you missed the match between the system and the real world, and the product you made certainly won't succeed. The first one who matches the software, and the way medicines are arranged, to how the pharmacist thinks, will succeed far more than you, and be much easier for users, because they're already used to that way in their real lives."
C03ar: "مثال Wayfair هنا: لما بتضغط على الـ Reviews، بيفتح لك صفحة فيها تفاصيل الـ Reviews. طبعًا إنت هنا أول خطوة كانت إنك فاتح الـ Home page بتاع الـ Website، وبعدين دخلت على الكرسي، فتحت المنتج اللي إنت مهتم بيه، وبعد كده فتحت الـ Reviews. هنا مثال جيد، ليه؟ لأنه لما داس Back رجّعه على المنتج اللي كان فيه. تطبيقات تانية مش بتعمل ده، بتقع في المشكلة إنها لما بيدوس Back بترجّعه لأول صفحة خالص، وهي الـ Home page. ودي من مسؤولياتك كديزاينر: إنك تخلّي كل حاجة واضحة، والمستخدم عارف لما هيضغط هنا هيروح فين بالظبط، حتى الـ Back. الـ Back، الناس أو المستخدمين دايمًا متعوّدين إنها بترجّعهم خطوة واحدة بس، فإنت ما تقعش في الغلطة دي، لأنها برضو بتأثّر على الـ User control. الـ User control مش بس إني أدّيله مخرج، أنا أدّيله مخرج للمكان اللي هو متوقّع يخرج له، مش أدّيله زرار Back يرجّعه تلات خطوات. ده مثلًا من ضمن الأمثلة اللي ما حقّقتش الـ User control and freedom بشكل جيد. هنا المستخدم بيشوف Flights أو رحلات طيران مناسبة له، بيدوّر وبيحدّد هو إيه الرحلة، وبيبدأ يشوف رحلات الطيران المتاحة. لما بيبدأ يخش في خطوات أكتر ويبدأ يحجز، ولما بيقرّر المستخدم يرجع، بيرجع لأول صفحة بيبدأ يبحث فيها عن رحلات الطيران، مش بيرجع لرحلات الطيران اللي كانت متاحة له بناءً على عوامل التصفية اللي هو قرّرها، وبناءً عليه هو محتاج يدوّر من أول وجديد، مش يشوف بديل من ضمن النتائج اللي طلعت له في البداية."
C03en: "Take Wayfair here: when you tap Reviews, a page opens with the review details. Your first step was opening the website's home page, then you went to the chair, opened the product you liked, and then opened the reviews. This is a good example. Why? Because when he pressed Back, it took him back to the product he was on. Other apps don't do this. They fall into the problem that pressing Back takes you all the way to the first page, the home page. And that's your job as a designer: make everything clear, so users know exactly where a tap will take them, even Back. People are always used to Back taking them just one step back, so don't make that mistake, because it also hurts user control. User control isn't just giving people an exit; it's an exit to the place they expect, not a Back button that takes them three steps back. Here's an example that didn't get user control and freedom right. The user is looking for suitable flights, searching and choosing a trip, and starts seeing the available flights. When they go further in and start booking, and then decide to go back, they land on the first page, where they start searching for flights, not on the flights that were available based on the filters they had chosen, so they have to search all over again, instead of picking another option from the results they first got."
