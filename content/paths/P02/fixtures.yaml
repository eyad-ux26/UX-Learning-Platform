# Clip transcripts (C01en, C01ar, ...), shown under each clip and used as its summary source.
C01ar: "تعالى نشوف مع بعض مثال كويس جدًا عن التطبيق السيئ للـ Feedback: Paymob، الـ Payment gateway اللي اسمها Paymob. تعالى نبص عليه مع بعض. هنا أنا كنت بحاول أدخل Password جديد، عشان كنت ناسي الـ Password القديم بتاعي. وزي ما إنتوا شايفين، أنا بدخّل الـ 2 Passwords وبدوس Submit new password، وما فيش أي حاجة بتتعمل. مجرد ما بيطلع لي Loader، وبعدين ما فيش أي حاجة بتحصل. ما بيقولّيش: هل الـ 2 Passwords مش Matching؟ ولا أنا عامل حاجة غلط تانية؟ ولا الأكاونت اتوقف؟ ولا إيه بالظبط؟ أول خطوة خدتها أول ما الموقف ده حصل معايا: بدأت أدوّر على Payment gateway تانية أحاول أتعامل معاها. ببساطة أنا مش عارف ليه، مش عارف إيه سبب إني مش عارف أدخل على الأكاونت بتاعي. ده بسبب إيه؟ بسبب إنه ما كانش فيه Feedback لحاجة فعلًا تهمّني في السياق ده. فمحتاج إن السيستم يرد عليّ. هو عارف المعلومة دي، السيستم هنا عارف المعلومة دي، لكن الديزاينر ما خدش باله من الـ Case دي، وما راعاش إن في الحالة دي ممكن جدًا يكون فيه أسباب ما تخلّيش المستخدم يعرف يكمّل، زي إن الأكاونت يبقى Deactivated، أو... أنا حتى الآن مش عارف إيه السبب الرئيسي. ممكن أكون دخّلت الـ Password بشكل خاطئ، ممكن يكون أسباب كتير، لكن طبيعي إني أعرف إيه السبب اللي مخلّيني مش عارف أدخل، ومش مخلّيني أعرف أتجاوز مرحلة إني أعمل Create للـ Password."
C01en: "Let's look together at a very good example of feedback done badly: Paymob, the payment gateway. Let's look at it. Here I was trying to enter a new password, because I'd forgotten my old one. As you can see, I enter the two passwords and press Submit new password, and nothing happens. A loader appears, and then nothing at all. It doesn't tell me: do the two passwords not match? Did I do something else wrong? Was the account stopped? What exactly? The first thing I did when this happened was start looking for another payment gateway to work with. Simply, I don't know why I can't get into my account. Why? Because there was no feedback about something that really mattered to me here. The system needs to answer me. It knows this information, the system knows it, but the designer didn't think of this case, and didn't consider that there could be reasons that stop the user from continuing, like the account being deactivated, or... Even now I don't know the main reason. Maybe I entered the password wrongly; there could be many reasons, but it's only natural that I should know what's stopping me from getting in, and from getting past creating the password."
C02ar: "ببساطة، تعالى نفترض إنك دلوقتي بتعمل Application لدكتور صيدلي صديقك، عنده ما شاء الله سلسلة من الصيدليات، وعايز يعمل برنامج يدير من خلاله الصيدليات، والدكاترة اللي شغالين معاه يدوّروا على الدوا بشكل سريع. وإنت قررت إنك مش هتعمل Research، ومش هتعتني بفكرة الـ Matching between the system and real world. ساعتها ممكن تقول: والله، أنا هرتّب الأدوية في السيستم ده إزاي؟ فتبدأ تفترض إنه Make sense إن أدوية مرضى السكر تبقى مع بعض، وأدوية مرضى الكبد مع بعض، فتبدأ تعمل Categories للأدوية، أو تصنّفها بناءً على المرض. وبعدين تطوّر المنتج، والـ Developers يشتغلوا عليه، وشركتك تشتغل عليه، وبعدين ينزل للصيدلية، والصيدلي يتفاجئ إنه مترتّب بطريقة هو مش متعوّد عليها أصلًا. هي كانت Make sense بالنسبة لك كـ Designer، لكن دي مش الطريقة اللي الدكاترة الصيادلة بيدوّروا بيها على الأدوية. الطريقة اللي هو متعوّد عليها هي الترتيب الأبجدي. وإنت هنا افترضت طريقة شايف إنها Make sense بالنسبة لك، بناءً على تجربتك الـ Real world الشخصية، باعتبارك غالبًا بتبقى مريض، مش دكتور صيدلي ولا دكتور، بتروح الأقسام المختلفة في المستشفى. فدي حياتك الواقعية، فقلت: والله، هقسّمها بناءً على الأقسام المختلفة أو الأمراض المختلفة. هنا إنت فوّت الـ Matching between system and real world، وأكيد المنتج اللي إنت عملته مش هينجح. وأول ما حد يبدأ يماتش البرنامج في الديزاين بتاعه، وفي طريقة ترتيب الأدوية بالطريقة اللي الصيدلي بيفكّر بيها، هينجح أكتر منك بكتير، وهيكون أسهل بكتير بالنسبة للمستخدمين، لأنهم Already متعوّدين على الطريقة دي في حياتهم الواقعية."
C02en: "Simply put, imagine you're building an application for a pharmacist friend who owns a chain of pharmacies, and wants software to run the pharmacies, so the pharmacists working with him can find medicines quickly. And you decided not to do any research, and not to care about matching the system to the real world. Then you might ask yourself how to arrange the medicines, and assume it makes sense to keep diabetes medicines together, and liver medicines together, so you start making categories, sorting the medicines by disease. Then you build the product, the developers work on it, your company works on it, and it goes out to the pharmacy, and the pharmacist is surprised that it's arranged in a way he's not used to at all. It made sense to you as a designer, but that's not how pharmacists look for medicines. What they're used to is alphabetical order. Here you assumed a way that made sense to you, based on your own real-world experience, since you're usually a patient, not a pharmacist or a doctor, and you visit the different departments of a hospital. That's your real life, so you split them by departments or diseases. Here you missed the match between the system and the real world, and the product you made certainly won't succeed. The first one who matches the software, and the way medicines are arranged, to how the pharmacist thinks, will succeed far more than you, and be much easier for users, because they're already used to that way in their real lives."
C03ar: "مثال Wayfair هنا: لما بتضغط على الـ Reviews، بيفتح لك صفحة فيها تفاصيل الـ Reviews. طبعًا إنت هنا أول خطوة كانت إنك فاتح الـ Home page بتاع الـ Website، وبعدين دخلت على الكرسي، فتحت المنتج اللي إنت مهتم بيه، وبعد كده فتحت الـ Reviews. هنا مثال جيد، ليه؟ لأنه لما داس Back رجّعه على المنتج اللي كان فيه. تطبيقات تانية مش بتعمل ده، بتقع في المشكلة إنها لما بيدوس Back بترجّعه لأول صفحة خالص، وهي الـ Home page. ودي من مسؤولياتك كديزاينر: إنك تخلّي كل حاجة واضحة، والمستخدم عارف لما هيضغط هنا هيروح فين بالظبط، حتى الـ Back. الـ Back، الناس أو المستخدمين دايمًا متعوّدين إنها بترجّعهم خطوة واحدة بس، فإنت ما تقعش في الغلطة دي، لأنها برضو بتأثّر على الـ User control. الـ User control مش بس إني أدّيله مخرج، أنا أدّيله مخرج للمكان اللي هو متوقّع يخرج له، مش أدّيله زرار Back يرجّعه تلات خطوات. ده مثلًا من ضمن الأمثلة اللي ما حقّقتش الـ User control and freedom بشكل جيد. هنا المستخدم بيشوف Flights أو رحلات طيران مناسبة له، بيدوّر وبيحدّد هو إيه الرحلة، وبيبدأ يشوف رحلات الطيران المتاحة. لما بيبدأ يخش في خطوات أكتر ويبدأ يحجز، ولما بيقرّر المستخدم يرجع، بيرجع لأول صفحة بيبدأ يبحث فيها عن رحلات الطيران، مش بيرجع لرحلات الطيران اللي كانت متاحة له بناءً على عوامل التصفية اللي هو قرّرها، وبناءً عليه هو محتاج يدوّر من أول وجديد، مش يشوف بديل من ضمن النتائج اللي طلعت له في البداية."
C03en: "Take Wayfair here: when you tap Reviews, a page opens with the review details. Your first step was opening the website's home page, then you went to the chair, opened the product you liked, and then opened the reviews. This is a good example. Why? Because when he pressed Back, it took him back to the product he was on. Other apps don't do this. They fall into the problem that pressing Back takes you all the way to the first page, the home page. And that's your job as a designer: make everything clear, so users know exactly where a tap will take them, even Back. People are always used to Back taking them just one step back, so don't make that mistake, because it also hurts user control. User control isn't just giving people an exit; it's an exit to the place they expect, not a Back button that takes them three steps back. Here's an example that didn't get user control and freedom right. The user is looking for suitable flights, searching and choosing a trip, and starts seeing the available flights. When they go further in and start booking, and then decide to go back, they land on the first page, where they start searching for flights, not on the flights that were available based on the filters they had chosen, so they have to search all over again, instead of picking another option from the results they first got."
C04ar: "الـ Pattern باختصار: إن إنت عندك مجموعة من الـ Components مع بعض كوّنوا Pattern أو Layout معين، إنت بتستخدم الـ Layout ده لحل مشكلة معينة، أو لأداء Function معينة، في Context أو سياقات معينة. ما ينفعش برضو إنك تغيّر الـ Pattern ده، الحاجة اللي هي عبارة عن مجموعة من الـ Components. زي ما إنت شايف، هو هنا مستخدم Form بيملا فيها الـ User بعض التفاصيل. لو بصّيت معايا، هتلاقي إنه في المثال ده الـ Next button كان أول Button ناحية الشمال، وزرار Finish later كان في النص. في تاني خطوة، زرار Finish later بقى آخر زرار، وزرار Back بقى هو اللي في الأول مكان الـ Next، والـ Next بقى هو اللي في النص. طبعًا ده Inconsistency في الـ Pattern. والمستخدم هنا لو اتعوّد إنه يضغط مثلًا على الـ Next في مكان معين، وارد جدًا إنه لما يخلّص الخطوة اللي بعدها، ييجي يدوس Next، يلاقي نفسه داس Back، عشان زرار Back هو اللي جه مكان زرار Next. وهكذا في باقي الـ Buttons، وفي أي Components أو أي Pattern بنغيّر فيه أماكن الـ Components. طيب، الحل إيه؟ برضو Airbnb، زي ما إنت شايف، منتهى التناسق والانتظام: حط الـ Next في مكان ثابت طول الـ Steps، والـ Back في مكان ثابت طول الـ Steps، والـ Exit موجود فوق على الشمال، بـ Hierarchy أقل، لكن في مكان برضو ثابت. محافظ على الأماكن الخاصة بالـ Buttons في الـ Pattern اللي استخدموه طول الخطوات، فهنا حقّق الـ Consistency في الـ Pattern. وبالمناسبة، تحقيق الـ Consistency في الـ Patterns كمان إنه لما ييجي يستخدم موضوع الـ Steps ده في مكان تاني، حتى لو مش بيعمل نفس الـ Function أو نفس المهمة، يحاول يحافظ برضو على الـ Pattern كما هو."
C04en: "In short, a pattern is a group of components that together form a certain pattern or layout, which you use to solve a certain problem or perform a certain function, in certain contexts. You also shouldn't change that pattern, that group of components. As you can see, he uses a form where the user fills in some details. Look with me: in this example, the Next button was the first button on the left, and Finish later was in the middle. In the second step, Finish later became the last button, Back took Next's place at the start, and Next moved to the middle. That's an inconsistency in the pattern. If users got used to pressing Next in a certain place, it's very likely that after the next step they press Next and find they pressed Back, because Back took Next's place. The same goes for the other buttons, and any components or pattern where we move things around. So what's the fix? Airbnb, as you can see, is perfectly consistent: Next stays in one fixed place through all the steps, and Back in another, and Exit is at the top left, with lower hierarchy but also in a fixed place. The button positions stay the same through every step, so the pattern is consistent. And by the way, consistent patterns also mean that when the steps are used elsewhere, even for a different task, the pattern is kept as it is."
C05ar: "طيب، تعالى نعرف كده خطوات بسيطة نتوقّع بيها الـ Slips أولًا، أو الـ Unconscious errors. أول Guideline محتاج تراعيه عشان تتوقّع الـ Slipping errors، أو الأخطاء الـ Unconscious: إنك تحاول توفّر Helpful constraints، أو محدّدات تساعد اليوزر إنه ما يختارش حاجة بالغلط هي أصلًا غير واقعية. زي مثلًا لو هو بيحجز أي حاجة، غالبًا أو أكيد هو بيحجزها في المستقبل، مش هيبقى بيحجزها في الماضي، فطبيعي إن التاريخ اللي هو بيحطّه يكون في المستقبل. فما ينفعش إنك توفّر له أصلًا الـ Options اللي في الماضي، عشان لو بالغلط اختار حاجة في الماضي أو ضغط على حاجة في الماضي بالغلط، خلاص، إنت عامل له Already error prevention: إنت عملتها Dimmed أو Disabled، زي ما شايفين حاليًا في المثال الخاص بـ Airbnb: اليوزر بيدخّل الـ Date اللي عايز يعمل فيه Check in، فالديزاين عمل كل التواريخ اللي فاتت Dimmed أو Disabled، بحيث إنه لو نفترض إنه داس على 14 بالغلط بدل 21، فكده كده أصلًا السيستم مش هيستجيب، لأنه Disabled أصلًا، مش Clickable، مش قابل إنه يتم اختياره أصلًا. كذلك ده بيخلّينا نتوقّى الـ Conscious errors، by the way. يعني لو إنت تصوّرت إن اليوزر برضه ممكن يفتكر إن يوليو ده هو أغسطس، يعني هو عايز يحجز مثلًا يوم 10 أغسطس، وهو ما شافش كلمة يوليو، وما شافش كلمة أغسطس دي، وافترض إن كل التواريخ اللي قدّامه دي مكتوبة كلها باللون الأسود، كلها ينفع يختارها. فهو ممكن يروح يختار يوم عشرة، وهو مش شايف عشرة إيه، وهو فاكر إنه عشرة أغسطس، فيبقى هنا وقع في Mistake، لأنك برضه ما كنتش مراعي إن الأيام اللي فاتت دي، كده كده لو اختارها هيبقى Error، فتفتح المساحة لوقوع الإيرورز، سواء الـ Slips، وده المعتاد في مثل هذه الحالات، أو الـ Mistakes زي ما ذكرنا في المثال ده."
C05en: "Now let's look at a few simple steps to anticipate slips first, the unconscious errors. The first guideline for anticipating slips, unconscious errors, is to provide helpful constraints, limits that stop the user from picking, by mistake, something that isn't realistic in the first place. For example, when someone books anything, they're surely booking it for the future, not the past, so naturally the date they enter is in the future. So you shouldn't offer them past options at all, so that if they tap a past date by mistake, you've already prevented the error: you've made those dates dimmed, disabled, as we see in this Airbnb example: the user enters the check-in date, and the design makes every past date dimmed or disabled, so if, say, they tap 14 by mistake instead of 21, the system simply won't respond, because it's disabled, not clickable, it can't be picked at all. And by the way, this also protects against conscious errors. Imagine the user thinks July is August, say they want to book 10 August, and they didn't notice the words July or August, and assumed every date in front of them, all in black, could be picked. So they pick the 10th, without seeing which month, thinking it's 10 August, and here they've made a mistake, because you didn't account for the fact that picking those past days would be an error anyway, so you open the door to errors: slips, which are usual in cases like this, or mistakes, as in this example."
C06ar: "تعال نشوف أمثلة من أمثلة الـ Recognition rather than recall: الـ Compare. اليوزر عندك يبقى عنده Need إنه يقارن بين أكتر من Product أو أكتر من Item. في المثال ده، إنت بتشتري Mobile phone جديد، وعايز تقارن الكاميرا بتاعته والـ Processor، وباقي الـ Features بتاعته، بموبايلات تانية. عندك حل من اتنين كديزاينر عشان تساعد اليوزر يقوم بالمهمة دي. أولًا: إنك عادي تخلّيه يدخل على صفحة الموبايل يشوف الـ Details بتاعته، وبعد كده يطلع ويدخل على موبايل تاني، ويبدأ يفتكر، يعمل Recall للمعلومات بتاعة الموبايل الأولاني، ويقارنها بالموبايل التاني. وده طبعًا بيعتمد على الـ Recall، ومش أحسن حاجة. الحل التاني إنك توفّر Comparison features زي ده، زي حالة GSM Arena: بيوفّر لليوزر إنه يعمل مقارنة بين الموبايلات، ويبقى بيعمل Recognition للداتا. عايز يشوف الـ Body عامل إزاي، أو الـ Weight، أو مين فيه شريحتين ومين شريحة واحدة، ومجرد ما يبص على المعلومة خلاص بيعمل لها Recognition. طيب، فيه مشكلة في التصميم ده. عايزكم تبصّوا معايا على الـ Website وتحاولوا تفكّروا إيه هي المشكلة. أنا دلوقتي هبص على الموبايلات وبعمل Scrolling. تفتكر إيه المشكلة في الـ Recognition rather than recall، According للـ Heuristic ده؟ أنا بصّيت هنا على الـ Features أو على الـ Battery مثلًا، وهنا محتاج أفتكر: مين كان أول موبايل، ومين كان تاني موبايل، ومين كان تالت موبايل، وإلا أضطر أطلع فوق وأنزل تحت، أطلع فوق وأنزل تحت. فالـ Usability بلا شك هتتأثّر. تعالوا أوريكم مثال تاني قدّم المهمة دي بشكل أنجح، وهو Mailchimp في الـ Pricing plans بتاعته. بص هنا، هو برضو بيدّيني مقارنة، ولما بعمل Scroll ما عملش زي GSM Arena، إني خلاص ما بقيتش عارف أول Column ده كان إيه وتالت Column كان إيه. لأ، هو هنا عمل Fixation، ثبّت الـ Titles أو الـ Headers بتاعة الـ Table الخاص بالمقارنة. فطول ما أنا ماشي في المقارنة، شايف: دي الـ Premium، ودي حاجات الـ Standard، ودي حاجات الـ Essentials. وما إلى ذلك من الوسائل اللي بتحقّق الـ Recognition rather than recall."
C06en: "Let's look at examples of recognition rather than recall: comparing. Your users need to compare several products or items. In this example, you're buying a new phone and want to compare its camera, processor and other features with other phones. As a designer, you have one of two ways to help. First: just let people open each phone's page and see its details, then leave and open another phone, and start recalling the first phone's details to compare them with the second. That relies on recall, and it's not the best. The second way is to offer comparison features like this one, as GSM Arena does: it lets people compare phones side by side, so they recognise the data. Want to see the body, the weight, or which takes two SIM cards? One look at the information and they recognise it. But there's a problem in this design. Look at the website with me and try to work out what it is. I'm looking at the phones and scrolling. What's the problem, according to recognition rather than recall? I'm looking at the features, say the battery, and now I have to remember which was the first phone, the second and the third, or keep scrolling up and down, up and down. Usability will certainly suffer. Let me show you another example that does this better: Mailchimp's pricing plans. It also gives me a comparison, but when I scroll it doesn't do what GSM Arena did, where I lose track of which column is which. No, it fixes the titles, the headers of the comparison table. So all the way down I can see: this is Premium, this is Standard, this is Essentials. These are the kinds of ways to achieve recognition rather than recall."
C07ar: "هتلاقي المثال ده بيبرز جدًا في الـ Design tools بالنسبة لك كـ Designers. لو إنت بتستخدم Figma أو أي Design tool، هتلاقي إن دايمًا فيه Shortcuts. وده المثال اللي معانا: زي ما إنت شايف في Figma، أي Tool بتوقف عليها، بتعمل عليها Hovering أو بتضغط عليها، بيقول لك إيه الـ Keyboard shortcut اللي ممكن تستخدمه. ودايمًا خلّي بالك: الـ Keyboard أسرع من الماوس. يعني إنك تروح بالماوس توقف على الـ Tool وتضغط عليها، أبطأ بكتير من إنك تضغط على حرف على الـ Keyboard فيجيب لك الـ Tool. فاليوزر يبقى عنده الـ Capability إنه يضغط على حروف بسرعة، وده بيعمل Enhance للـ Experience جدًا. عشان كده تلاقي إن الـ Designer اللي بقى له مثلًا أربع خمس سنين بيستخدم الـ Tool، غير الـ Designer اللي بقى له شهر أو كام أسبوع بيستخدم نفس الـ Tool، خاصةً لما تـ Provide موضوع الـ Shortcuts. بتلاقي فرق في السرعة كبير جدًا، على قد ما الشخص القديم ده متمكّن من الـ Shortcuts وفاهمها بطريقة صحيحة. بتلاقي فعلًا إن الـ Expert هو Expert، وعنده Level of efficiency أعلى وسرعة أعلى. فالـ Efficiency هي السرعة. فدايمًا حاول تخلّي الشخص الـ Expert يخلّص المهام بتاعته بسرعة أكبر، ومن ضمن الوسائل الـ Keyboard shortcuts زي ما ذكرنا، مش بس في الـ Design tools. إنت عارف إن فيه بعض الـ Actions محتاجة Shortcuts لأنها Repetitive. مش مهم في الحالة دي إن الـ Shortcuts تبقى ظاهرة للمبتدئين، لكن تبقى سهلة الوصول بالنسبة لأي User، بحيث إنه لو عايز يتعلّمها وعايز يتطوّر تبقى Accessible بالنسبة له. زي المثال هنا الخاص بـ Figma: مجرد ما بنعمل Hovering على الـ Tool، أو بيضغط عليها، بيبدأ يظهر له الـ Shortcut اللي ممكن يـ Access بيه الـ Tool دي على طول، وفي نفس الوقت بيدّيه Documentation كامل لكل الـ Shortcuts اللي موجودة في السيستم."
C07en: "You'll see this clearly in design tools. If you use Figma or any design tool, there are always shortcuts. Here's our example: in Figma, when you hover over any tool or click it, it tells you which keyboard shortcut you can use. And remember: the keyboard is faster than the mouse. Moving the mouse to a tool and clicking it is much slower than pressing one letter to get the tool. So users can press letters quickly, and that improves the experience a lot. That's why a designer who has used a tool for four or five years differs from one who has used it for a month or a few weeks, especially when you provide shortcuts. There's a huge difference in speed, as much as the experienced person has mastered the shortcuts. You find that the expert really is an expert, with a higher level of efficiency and speed. Efficiency means speed. So always try to let experts finish their tasks faster. Keyboard shortcuts are one way, as we said, and not just in design tools. Some actions need shortcuts because they're repetitive. It doesn't matter that beginners don't see these shortcuts, but they should be easy for anyone to reach, so whoever wants to learn and improve can get to them. Like this Figma example: just hovering over or clicking a tool shows the shortcut that opens it directly, and it also gives full documentation of every shortcut in the system."
C08ar: "تعال نبص على المثال ده: إيه رأيك فيه بالنسبة لموضوع الـ Signal to noise ratio؟ ده مثال المفروض إنك من هنا بتحجز رحلة، بتحجز طيارة. زي ما إنت شايف، ده شكل الـ Website. هنا الـ Signal عالية ولا الـ Noise عالية؟ هل الـ Signal أعلى من الـ Noise هنا؟ هل فعلًا المصمم هنا قدر يتعامل مع الـ Noise، الحاجات اللي ممكن تكون Visual elements أو Options أو Actions مش مهمة بالنسبة لسياق اليوزر؟ هنا بوضوح ما وُفّقش إنه يحقّق الـ Signal to noise ratio. ليه؟ لأن زي ما إنت شايف، فيه ألوان كتير، وصور كتير، و Options كتير جدًا، بالنسبة لواحد داخل عايز يحجز طيارة. ممكن يكون أهم حاجة بالنسبة له: هو رايح فين، ويدخل التاريخ، ويبحث. ممكن يبقى فيه بعض الـ Options وبعض المعلومات، وممكن يحسّسه بإحساس إنه هيسافر والحاجات الجميلة دي كلها، لكن مش بصورة مالية الخلفية بالشكل ده، مالية ألوان ومالية تفاصيل. كل ده هينافس، زي ما اتفقنا، الـ Visuals أو العناصر البصرية الأكثر أهمية في السياق ده. طيب، هتشوف تقريبًا نفس الـ Goal أو نفس الـ Function محقّقة بشكل أفضل بكتير في Google Flights. هتلاقي إن الفوكس الأساسي على المربع اللي في النص، اللي من خلاله اليوزر بيدخل هو رايح فين. وهتلاقي الزرار اللي اسمه Explore واخد Elevation، واخد Shadow، وبارز وباللون الـ Primary. استخدام اللون الـ Primary هنا بطريقة عقلانية جدًا. قدر يوصّل Feeling إنك مسافر، يعني فيه حتى Emotion في الموضوع، لكن بطريقة هادية، بطريقة ما تخلّيش اليوزر يـ Lose الفوكس أو يفقد تركيزه عن المهمة الأساسية أو الجزء الأساسي اللي هو محتاج يركّز فيه، وهو إنه يبدأ يدخل هو رايح فين، وإيه التاريخ، ويبدأ يـ Explore الـ Flights المتاحة."
C08en: "Let's look at this example. What do you think of it, in terms of the signal-to-noise ratio? Here you're supposed to book a trip, a flight. As you can see, this is what the website looks like. Is the signal high here, or the noise? Is the signal higher than the noise? Did the designer manage the noise, the visual elements, options or actions that don't matter in the user's context? Clearly, here he didn't get the signal-to-noise ratio right. Why? Because, as you can see, there are lots of colours, lots of images and far too many options for someone who wants to book a flight. What matters most to them may be where they're going, entering the date, and searching. There can be some options and some information, and it can give a feeling of travel and all those lovely things, but not with an image filling the background like this, full of colours and details. All of that will compete, as we agreed, with the visual elements that matter most in this context. Now, you'll see almost the same goal, the same function, done much better in Google Flights. The main focus is on the box in the middle, where the user enters where they're going. And the Explore button has elevation and a shadow, and stands out in the primary colour, used very sensibly. It conveys the feeling of travelling, there's even some emotion in it, but calmly, in a way that doesn't make the user lose focus on the main task, the main part they need to concentrate on, which is entering where they're going and the date, and starting to explore the available flights."
C09ar: "مثلًا في المثال الخاص بـ Airbnb: دي الشاشة المعتادة لو بتبحثوا عن أي صفحة، أو دخلتوا لينك تابع لـ Airbnb سلاش أي حاجة، أو تابع لأي موقع، لكن الصفحة دي مش موجودة في الموقع أصلًا، فبيطلع لك Error كده، اللي هو 404. وده بيكونش معبّر: اليوزر مش فاهم إيه 404 دي، يعني مش دي اللغة اللي هو بيتكلم بيها. طيب، هنا Airbnb عمل إيه؟ اللي عملوه هنا إنه استخدم User language، ما استخدمش 404، لأنها حاجة مش مفهومة بالنسبة لليوزر، مش هو ده المصطلح اللي بيتعامل بيه لما بيقع في مشكلة زي دي، ولا هو ده المصطلح اللي هيفهمه. لكن هنا Airbnb نجح إنه يستخدم User language، يقول له: إحنا مش لاقيين الـ Page اللي إنت بتدوّر عليها، لكن ممكن تستخدم الحلول الفلانية، والحلول دي طبعًا ليها علاقة بشق الـ Recovery. لكن In general، خلّينا نقول كده: الـ Error state هنا ناجحة جدًا، إنها تستخدم User language، وإنها توفّر لي Recognition واضح للخطأ وحالة الخطأ، بطريقة لطيفة و Engaging، وحاطّة Illustration، وخلّت الموضوع لطيف في نفس الوقت، وما استخدمت Links ممكن أروح لها، وفي الآخر Site map، من خلالها يقدر يورّيني كل الـ Links أو كل الصفحات اللي موجودة في Airbnb، لو الـ Suggestions اللي فوق دي ما كانتش كافية بالنسبة لي. كذلك من الـ Guidelines عشان تحقّق Communication جيد للـ Error messages: إنك تستخدم ألفاظ مختصرة وواضحة، بخلاف اللي مستخدَم هنا في Paymob: هتلاقي إن الألفاظ بدأت تدخل في جملتين، وجملتين أصلًا مش معبّرين، مش بيعرّفوني الخطأ في إيه بالظبط. كذلك من الـ Guidelines عشان تحقّق Communication جيد للـ Error messages: إنك تستخدم Positive tone، يعني ما تبقاش بتبكّت أو بتلوم اليوزر على خطأ هو عمله. ده من الحاجات الممنوعة في الـ UX writing."
C09en: "For example, Airbnb: this is the usual screen when you look for a page, or open a link on Airbnb slash anything, or on any site, but that page doesn't exist on the site, so you get an error like this, a 404. And that isn't meaningful: users don't understand what 404 means. It's not the language they speak. So what did Airbnb do here? They used the user's language, not 404, because that means nothing to users, it's not the term they use when they hit a problem like this, or one they'd understand. Airbnb succeeded in using the user's language: we can't find the page you're looking for, but you can use these options, and those options are part of recovery. But in general, let's say this error state is very successful, in using the user's language and giving clear recognition of the error and the error state, in a friendly, engaging way, with an illustration that keeps it light, and it gives links I can go to, and at the end a site map that shows every link or page on Airbnb, in case the suggestions above weren't enough for me. Another guideline for good error-message communication: use short, clear words, unlike what Paymob uses here: the wording runs into two sentences, and they don't really say anything, they don't tell me what exactly is wrong. Another guideline: use a positive tone, meaning don't scold or blame users for a mistake they made. That's one of the things to avoid in UX writing."
C10ar: "المهم في الـ Reactive help إنه يبقى مُعبّر، الكلام فيه واضح ومفهوم، ويكون مفصّل، لأنه بيروح للكتالوج مش عايز يلاقي رؤوس أقلام، عايز يشوف كلام تفصيلي يجاوب عن كل سؤال فعلًا موجود عند اليوزر. من الـ Guidelines الخاصة بالـ Reactive help كمان: إنك تعمل Chunking للـ Content، تبدأ تجمع المعلومات الـ Related ببعض مع بعض، تعمل Visual hierarchy، تدرّج بصري، علشان ما تبقاش كل حاجة على نفس مستوى الأولوية البصرية، وتحط الـ Keywords المهمة، زي ما إحنا شايفين هنا، بلون مختلف، والحاجة اللي ليها Link بلون مختلف. تبدأ تقسّم الـ Help بتاعك أصلًا لـ Destinations أساسية، ثم Titles، وتحت كل Title الـ Content، وتقسّم النقاط الخاصة بكل Title في Bullet points أو Numbered lists، زي ما بنشوف في مثال Figma، علشان التنقّل في التفاصيل الكتير يبقى أسهل. وطبعًا إنك تستخدم Breadcrumb بتعرّفك المكان اللي إنت فيه في الـ Help center أو الـ Documentation الكامل، ده شيء مهم جدًا. مثال أخفق في تحقيق كل ده: المثال اللي قدامنا ده، تكست كله على بعضه، مش عارف أنا جيت منين أصلًا، ما فيش ترتيب، ما فيش Titles، فطبعًا الـ Scannability أصعب، واليوزر هياخد هنا وقت أكتر علشان يوصل للمعلومة المفيدة اللي بيدوّر عليها. من الحاجات اللي ممكن تستفيد بيها هنا: إنك توظّف Graphics وتوظّف Videos، لكن ما تستغناش عن المعلومات المكتوبة عشان حطّيت Video، لأ، حط كتابة داعمة للـ Video، لأن الشخص ممكن يبقى عايز يقرأ، ومش مناسب له يشغّل Video، وحتى لو شغّل الـ Video، يبقى بيبص على الـ Video وفي نفس الوقت شايف الـ Steps مكتوبة قدامه. Recognition over recall زي ما ذكرنا، بيخفّف الحمل على الـ Memory: مش محتاج يحفظ كل خطوة سمعها في الـ Video، لأ، مكتوبة قدامه بشكل واضح ويقدر يرجع لها في أي وقت. كذلك من أهم الحاجات اللي محتاج تراعيها في الـ Reactive help: إنك تخلّي الـ Search واضح، لأني داخل هنا غالبًا هحتاج أعمل Search على حاجة معينة. بخلاف اللي حصل في المثال ده: الـ Search هنا بـ Low contrast ratio، بلون أبيض على لون فاتح قوي، مش واخد الـ Hierarchy الكافية. هنا في Shopify الـ Search واخد Border، وواخد الأولوية البصرية بتاعته، وواضح أكتر، وده مناسب لأهمية الـ Search في أي Help center. كذلك لما اليوزر يبحث عن حاجة معينة، حلو جدًا إنك تعمل Highlight للـ Keyword اللي بحث بيها، بحيث يبقى سهل عليه يعمل Scan للمواضيع، ويسهل عليه ياخد الخطوة اللي بعدها، ويقرّر هيدخل على أنهي مقال أو أنهي Topic يغطّي مشكلته بشكل أفضل."
C10en: "What matters in reactive help is that it's expressive, clear and detailed, because people who go to the manual don't want bullet headlines, they want detail that answers every question they actually have. Another reactive-help guideline: chunk the content, grouping related information together, and build a visual hierarchy, so not everything has the same visual priority, and put the important keywords, as we see here, in a different colour, and anything with a link in a different colour. Divide your help into main destinations, then titles, with the content under each title, and split each title's points into bullet points or numbered lists, like the Figma example, so moving through lots of detail is easier. And of course use a breadcrumb that shows where you are in the help centre or the full documentation. That's very important. Here's an example that fails at all of this: one block of text, I can't tell where I came from, no order, no titles, so it's harder to scan, and the user takes longer to reach the useful information they're looking for. You can also use graphics and videos here, but don't drop the written information just because you added a video, no, add text that supports the video, because some people want to read and can't play a video, and even if they do, they can watch it while seeing the steps written in front of them. Recognition over recall, as we said, it lightens the load on memory: no need to memorise every step heard in the video; they're written clearly, to go back to any time. Another key point in reactive help: make search clear, because I've probably come here to search for something. Unlike this example, where search has a low contrast ratio, white on a very light colour, without enough hierarchy. Here in Shopify, search has a border and its visual priority, and is clearer, which suits how important search is in any help centre. And when users search for something, it's great to highlight the keyword they searched, so they can scan the topics easily, and take the next step, deciding which article or topic covers their problem best."
