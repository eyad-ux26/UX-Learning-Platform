id: P02-U02
free: false
title:
  en: "Let people back out, and keep things the same"
  ar: "دَع الناس يتراجعون، واجعل التصميم متّسقًا"
skill:
  en: "Find and fix screens that trap people or don't let them undo, and screens that change words, looks or behaviour people already know (heuristics 3 and 4)."
  ar: "اكتشف وأصلح الشاشات التي تحبس الناس أو لا تتيح لهم التراجع، والشاشات التي تغيّر كلمات أو أشكالًا أو سلوكًا يعرفه الناس أصلًا (المبدآن 3 و4: تحكّم المستخدم وحريته (User control and freedom)، والاتساق والمعايير (Consistency and standards))."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P02-U02-01
    title: { en: "Give a clear way out", ar: "أعطِ مخرجًا واضحًا" }
    can_do: { en: "Give every task, overlay and step a Cancel, Close or Back that is easy to find, clearly labelled, and quick to use.", ar: "أعطِ كل مهمة ونافذة وخطوة زر «إلغاء» أو «إغلاق» أو «رجوع» سهل الرؤية، واضح الاسم، وسريع الاستخدام." }
  - id: SK-P02-U02-02
    title: { en: "Let people undo and go back where they expect", ar: "دَع الناس يتراجعون ويعودون إلى حيث يتوقعون" }
    can_do: { en: "Make Back return people one step, to exactly where they came from, and give a visible Undo for changes they may regret.", ar: "اجعل «رجوع» يعيد الناس خطوة واحدة، إلى المكان الذي جاؤوا منه بالضبط، وأعطِ «تراجع» ظاهرًا للتغييرات التي قد يندمون عليها." }
  - id: SK-P02-U02-03
    title: { en: "Keep the same thing the same everywhere", ar: "اجعل الشيء الواحد بالشكل نفسه في كل مكان" }
    can_do: { en: "Use one word, one look and one place for the same action across every screen of a product.", ar: "استخدم كلمة واحدة وشكلًا واحدًا ومكانًا واحدًا للإجراء نفسه في كل شاشات المنتج." }
  - id: SK-P02-U02-04
    title: { en: "Follow the conventions people bring from other products", ar: "اتبع العادات المألوفة (Conventions) التي يأتي بها الناس من منتجات أخرى" }
    can_do: { en: "Use the icons, controls and patterns people already know from other sites and apps, unless breaking them clearly helps the task.", ar: "استخدم الأيقونات والعناصر والأنماط التي يعرفها الناس أصلًا من مواقع وتطبيقات أخرى، إلا إذا كانت مخالفتها تساعد المهمة بوضوح." }
