id: P02-U02-L02
mode: lesson
minutes: 8
title:
  en: "Keep things the same"
  ar: "اجعل التصميم متّسقًا"
speaker: karim
sources:
  - title: { en: "Consistency and Standards (Usability Heuristic #4) (NN/g)", ar: "الاتساق والمعايير (Consistency and standards)، مبدأ الاستخدام 4 (NN/g)" }
    url: "https://www.nngroup.com/articles/consistency-and-standards/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-016: { en: "One action, one look and place", ar: "إجراء واحد، شكل ومكان واحد" }
  MC-P02-017: { en: "Different words make people wonder", ar: "الكلمات المختلفة تجعل الناس يتساءلون" }
  MC-P02-018: { en: "A new pattern costs people effort", ar: "النمط الجديد يكلّف الناس جهدًا" }
  MC-P02-019: { en: "Brand style doesn't replace a known icon", ar: "أسلوب العلامة التجارية لا يحلّ محل أيقونة معروفة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "The button that moved", ar: "الزر الذي تحرّك" }
    mock:
      app: nafaqat
      frame: wide
      url: nafaqat.example/claims/new
      navbar: { links: [ { en: "Leave", ar: "الإجازات" }, { en: "Expenses", ar: "المصروفات" }, { en: "My requests", ar: "طلباتي" } ], active: 1, actions: [ { icon: bell }, { icon: user } ] }
      blocks:
        - { kind: title, text: { en: "Expense claim", ar: "طلب مصروفات" } }
        - { kind: field, label: { en: "Amount", ar: "المبلغ" }, text: { en: "EGP 1,250", ar: "1,250 جنيه" }, filled: true, gap: m }
        - { kind: field, label: { en: "Receipt", ar: "الإيصال" }, text: "taxi-03-nov.jpg", filled: true, icon: paperclip, gap: m }
        - kind: row
          gap: l
          blocks:
            - { kind: button, text: { en: "Send", ar: "أرسِل" }, note: { en: "The leave form has Cancel here", ar: "في نموذج الإجازة يقع «إلغاء» هنا" } }
            - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, style: text }
    body:
      en: "I build the web app a company's staff use to request time off and claim expenses. Each form was built by a different developer.\n\nIn the leave form, **Submit** is green on the right. In the expense form, **Send** is blue on the left, where Cancel sits in the leave form. Staff keep cancelling claims they meant to send."
      ar: "أبني تطبيق الويب الذي يستخدمه موظفو شركة لطلب الإجازات واسترداد المصروفات. وكل نموذج بناه مطوّر مختلف.\n\nفي نموذج الإجازة، زر **إرسال** أخضر على اليمين. وفي نموذج المصروفات، زر **أرسِل** أزرق على اليسار، في مكان «إلغاء» في نموذج الإجازة. والموظفون يلغون باستمرار طلبات كانوا يريدون إرسالها."
  - id: S02
    type: tune
    part: try
    skill: SK-P02-U02-03
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Consistency and standards (NN/g): a product should use the same patterns everywhere inside it. The fix is one label, one colour and one position for the main action on every form."
      ar: "جرّب أولًا. الاتساق والمعايير (NN/g): يجب أن يستخدم المنتج الأنماط نفسها في كل مكان داخله. والإصلاح هو اسم واحد ولون واحد ومكان واحد للإجراء الرئيسي في كل نموذج."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "they should use the same patterns everywhere inside the system" }
    prompt:
      en: "What's the best fix?"
      ar: "ما أفضل إصلاح ليتوقف الموظفون عن إلغاء طلباتهم بالخطأ؟"
    mock:
      app: nafaqat
      frame: wide
      url: nafaqat.example/leave/new
      navbar: { links: [ { en: "Leave", ar: "الإجازات" }, { en: "Expenses", ar: "المصروفات" }, { en: "My requests", ar: "طلباتي" } ], active: 0, actions: [ { icon: bell }, { icon: user } ] }
      blocks:
        - { kind: title, text: { en: "Leave request", ar: "طلب إجازة" } }
        - { kind: field, label: { en: "First day", ar: "أول يوم" }, text: { en: "Sun 9 Nov", ar: "الأحد 9 نوفمبر" }, filled: true, icon: calendar-blank, gap: m }
        - kind: row
          gap: l
          blocks:
            - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, style: text }
            - { kind: button, text: { en: "Submit", ar: "إرسال" } }
    options:
      - id: same
        text: {"en": "Use one button style for every form: same word, same colour, same place", "ar": "أستخدم شكل زر واحدًا لكل النماذج: الكلمة نفسها، واللون نفسه، والمكان نفسه"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/expenses/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 1, "actions": [{"icon": "bell"}, {"icon": "user"}]}
          blocks:
            - {"kind": "title", "text": {"en": "Expense claim", "ar": "طلب مصروفات"}}
            - {"kind": "field", "label": {"en": "Amount", "ar": "المبلغ"}, "text": {"en": "EGP 180", "ar": "180 جنيه"}, "filled": true, "gap": "m"}
            - {"kind": "row", "gap": "l", "blocks": [{"kind": "button", "text": {"en": "Cancel", "ar": "إلغاء"}, "style": "text"}, {"kind": "button", "text": {"en": "Submit", "ar": "إرسال"}}], "note": {"en": "Same word, colour and place as the leave form", "ar": "الكلمة واللون والمكان نفسها كما في نموذج الإجازة"}}
      - id: confirm
        text: {"en": "Ask \"Are you sure you want to cancel?\" in the expense form", "ar": "أسأل «هل أنت متأكد أنك تريد الإلغاء؟» في نموذج المصروفات"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/expenses/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 1, "actions": [{"icon": "bell"}, {"icon": "user"}]}
          blocks:
            - {"kind": "title", "text": {"en": "Expense claim", "ar": "طلب مصروفات"}}
            - {"kind": "field", "label": {"en": "Amount", "ar": "المبلغ"}, "text": {"en": "EGP 180", "ar": "180 جنيه"}, "filled": true, "gap": "m"}
            - {"kind": "row", "gap": "l", "blocks": [{"kind": "button", "text": {"en": "Send", "ar": "أرسِل"}}, {"kind": "button", "text": {"en": "Cancel", "ar": "إلغاء"}, "style": "text"}]}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Are you sure you want to cancel?", "ar": "هل أنت متأكد أنك تريد الإلغاء؟"}}, {"kind": "button", "text": {"en": "Yes, cancel", "ar": "نعم، ألغِ"}, "gap": "m"}, {"kind": "button", "style": "text", "text": {"en": "No", "ar": "لا"}, "gap": "s"}]}
      - id: bold
        text: {"en": "Make Send bigger and bolder in the expense form", "ar": "أكبّر زر «أرسِل» وأجعل خطّه أعرض في نموذج المصروفات"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/expenses/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 1, "actions": [{"icon": "bell"}, {"icon": "user"}]}
          blocks:
            - {"kind": "title", "text": {"en": "Expense claim", "ar": "طلب مصروفات"}}
            - {"kind": "field", "label": {"en": "Amount", "ar": "المبلغ"}, "text": {"en": "EGP 180", "ar": "180 جنيه"}, "filled": true, "gap": "m"}
            - {"kind": "row", "gap": "l", "blocks": [{"kind": "button", "text": {"en": "Send", "ar": "أرسِل"}, "size": "l", "weight": "bold"}, {"kind": "button", "text": {"en": "Cancel", "ar": "إلغاء"}, "style": "text"}], "note": {"en": "Send is still where Cancel sits in the leave form", "ar": "ما زال «أرسِل» في مكان «إلغاء» في نموذج الإجازة"}}
    answer: [same]
    misconceptions:
      - id: MC-P02-016
        when: [confirm, bold]
        feedback:
          en: "Staff still reach for the place where the main button was in the other form. Patching one form leaves the two forms working differently."
          ar: "ما زال الموظفون يضغطون حيث كان الزر الرئيسي في النموذج الآخر. وإصلاح نموذج واحد فقط يترك النموذجين يعملان بطريقتين مختلفتين."
    hints:
      - en: "Why do staff click Cancel? What did the other form teach them?"
        ar: "لماذا يضغط الموظفون «إلغاء»؟ ماذا علّمهم النموذج الآخر؟"
    correct:
      en: "Make the same action look and sit the same everywhere."
      ar: "اجعل الإجراء نفسه بالشكل والمكان نفسيهما في كل مكان."
    explain:
      en: "Staff learn where the main button is from the first form they use. When every form keeps it in the same place, with the same word and colour, that habit works for them instead of against them."
      ar: "يتعلّم الموظفون مكان الزر الرئيسي من أول نموذج يستخدمونه. وحين يبقيه كل نموذج في المكان نفسه، بالكلمة واللون نفسيهما، تعمل هذه العادة لصالحهم لا ضدهم."

  - id: S09
    type: video
    part: concept
    title: { en: "Consistency and standards", ar: "الاتساق والمعايير (Consistency and standards)" }
    video: ebf7df23-5f3d-4df7-ab63-cb6667d0e536
    duration: 122
    transcript:
      - { t: 2.5, en: "In short, a pattern is a group of components that together form a certain pattern or layout,", ar: "الـ Pattern باختصار: إن إنت عندك مجموعة من الـ Components مع بعض كوّنوا Pattern أو Layout معين،" }
      - { t: 9.82, en: "which you use to solve a certain problem or perform a certain function, in certain contexts.", ar: "إنت بتستخدم الـ Layout ده لحل مشكلة معينة، أو لأداء Function معينة، في Context أو سياقات معينة." }
      - { t: 18.94, en: "You also shouldn't change that pattern, that group of components.", ar: "ما ينفعش برضو إنك تغيّر الـ Pattern ده، الحاجة اللي هي عبارة عن مجموعة من الـ Components." }
      - { t: 24.52, en: "As you can see, he uses a form where the user fills in some details. Look with me: in this example, the Next button was the first button on the left, and Finish later was in the middle.", ar: "زي ما إنت شايف، هو هنا مستخدم Form بيملا فيها الـ User بعض التفاصيل. لو بصّيت معايا، هتلاقي إنه في المثال ده الـ Next button كان أول Button ناحية الشمال، وزرار Finish later كان في النص." }
      - { t: 38.26, en: "In the second step, Finish later became the last button, Back took Next's place at the start, and Next moved to the middle.", ar: "في تاني خطوة، زرار Finish later بقى آخر زرار، وزرار Back بقى هو اللي في الأول مكان الـ Next، والـ Next بقى هو اللي في النص." }
      - { t: 47.16, en: "That's an inconsistency in the pattern. If users got used to pressing Next in a certain place,", ar: "طبعًا ده Inconsistency في الـ Pattern. والمستخدم هنا لو اتعوّد إنه يضغط مثلًا على الـ Next في مكان معين،" }
      - { t: 56.56, en: "it's very likely that after the next step they press Next and find they pressed Back, because Back took Next's place. The same goes for the other buttons, and any components or pattern where we move things around.", ar: "وارد جدًا إنه لما يخلّص الخطوة اللي بعدها، ييجي يدوس Next، يلاقي نفسه داس Back، عشان زرار Back هو اللي جه مكان زرار Next. وهكذا في باقي الـ Buttons، وفي أي Components أو أي Pattern بنغيّر فيه أماكن الـ Components." }
      - { t: 69.62, en: "So what's the fix? Airbnb, as you can see, is perfectly consistent: Next stays in one fixed place through all the steps, and Back in another,", ar: "طيب، الحل إيه؟ برضو Airbnb، زي ما إنت شايف، منتهى التناسق والانتظام: حط الـ Next في مكان ثابت طول الـ Steps، والـ Back في مكان ثابت طول الـ Steps،" }
      - { t: 83.22, en: "and Exit is at the top left, with lower hierarchy but also in a fixed place. The button positions stay the same through every step, so the pattern is consistent.", ar: "والـ Exit موجود فوق على الشمال، بـ Hierarchy أقل، لكن في مكان برضو ثابت. محافظ على الأماكن الخاصة بالـ Buttons في الـ Pattern اللي استخدموه طول الخطوات، فهنا حقّق الـ Consistency في الـ Pattern." }
      - { t: 99.24, en: "And by the way, consistent patterns also mean that when the steps are used elsewhere, even for a different task, the pattern is kept as it is.", ar: "وبالمناسبة، تحقيق الـ Consistency في الـ Patterns كمان إنه لما ييجي يستخدم موضوع الـ Steps ده في مكان تاني، حتى لو مش بيعمل نفس الـ Function أو نفس المهمة، يحاول يحافظ برضو على الـ Pattern كما هو." }

  - id: S03
    type: card
    part: concept
    icons: [layers, eye, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The fourth heuristic: people should not have to wonder whether different words, situations or actions mean the same thing.\n\n- **Internal consistency:** inside your product, the same action uses the same word, look and place on every screen.\n- **External consistency:** people spend most of their time in other products, so follow the conventions they bring from there.\n- **Break a convention only** when it clearly helps the task, because a new pattern costs people effort to learn."
      ar: "مبدأ الاستخدام (Usability heuristic) الرابع هو الاتساق والمعايير (Consistency and standards): يجب ألّا يضطر الناس إلى التساؤل إن كانت الكلمات أو المواقف أو الإجراءات المختلفة تعني الشيء نفسه.\n\n- **الاتساق الداخلي (Internal consistency):** داخل منتجك، يستخدم الإجراء نفسه الكلمة والشكل والمكان نفسها في كل شاشة.\n- **الاتساق الخارجي (External consistency):** يقضي الناس أغلب وقتهم في منتجات أخرى، فاتبع العادات المألوفة (Conventions) التي يأتون بها من هناك.\n- **لا تخالف المألوف** إلا إذا كان ذلك يساعد المهمة بوضوح، لأن النمط الجديد يكلّف الناس جهدًا ليتعلّموه."

  - id: S04
    type: tune
    part: guided
    skill: SK-P02-U02-03
    rules: [R06]
    value:
      en: "Consistency and standards (NN/g): users should not have to wonder whether different words mean the same thing. Three names for one action make people suspect three different results."
      ar: "الاتساق والمعايير (NN/g): لا يجب أن يتساءل المستخدمون إن كانت الكلمات المختلفة تعني الشيء نفسه. وثلاثة أسماء لإجراء واحد تجعل الناس يظنون أن لها ثلاث نتائج مختلفة."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "Users should not have to wonder whether different words, situations, or actions mean the same thing." }
    scenario:
      en: "In the same app, the button that takes a draft request away is called **Remove** on one screen, **Delete** on another and **Discard** on a third. They all do the same thing."
      ar: "في التطبيق نفسه، الزر الذي يحذف مسودّة الطلب اسمه **أزِل** في شاشة، و**احذف** في أخرى، و**تجاهَل** في ثالثة. وكلها تفعل الشيء نفسه."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    mock:
      app: nafaqat
      frame: wide
      url: nafaqat.example/requests/drafts
      navbar: { links: [ { en: "Leave", ar: "الإجازات" }, { en: "Expenses", ar: "المصروفات" }, { en: "My requests", ar: "طلباتي" } ], active: 2 }
      blocks:
        - { kind: title, text: { en: "Drafts", ar: "المسودّات" } }
        - { kind: listitem, icon: airplane-tilt, text: { en: "Leave · 9–12 Nov", ar: "إجازة · من 9 إلى 12 نوفمبر" }, value: { en: "Remove", ar: "أزِل" }, gap: m }
        - { kind: listitem, icon: receipt, text: { en: "Taxi · EGP 180", ar: "تاكسي · 180 جنيه" }, value: { en: "Delete", ar: "احذف" }, gap: s }
        - { kind: listitem, icon: laptop, text: { en: "Laptop bag · EGP 650", ar: "حقيبة لابتوب · 650 جنيه" }, value: { en: "Discard", ar: "تجاهَل" }, gap: s }
    options:
      - id: one
        text: {"en": "Pick one word, \"Delete draft\", and use it on every screen", "ar": "أختار كلمة واحدة، «احذف المسودّة»، وأستخدمها في كل شاشة"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/requests/drafts"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 2}
          blocks:
            - {"kind": "title", "text": {"en": "Drafts", "ar": "المسودّات"}}
            - {"kind": "listitem", "icon": "airplane-tilt", "text": {"en": "Leave · 9–12 Nov", "ar": "إجازة · من 9 إلى 12 نوفمبر"}, "value": {"en": "Delete draft", "ar": "احذف المسودّة"}, "gap": "m"}
            - {"kind": "listitem", "icon": "receipt", "text": {"en": "Taxi · EGP 180", "ar": "تاكسي · 180 جنيه"}, "value": {"en": "Delete draft", "ar": "احذف المسودّة"}, "gap": "s"}
            - {"kind": "listitem", "icon": "laptop", "text": {"en": "Laptop bag · EGP 650", "ar": "حقيبة لابتوب · 650 جنيه"}, "value": {"en": "Delete draft", "ar": "احذف المسودّة"}, "gap": "s"}
      - id: keep
        text: {"en": "Keep them; each one fits its screen's tone", "ar": "أبقيها؛ فكل كلمة تناسب أسلوب شاشتها"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/requests/drafts"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 2}
          blocks:
            - {"kind": "title", "text": {"en": "Drafts", "ar": "المسودّات"}}
            - {"kind": "listitem", "icon": "airplane-tilt", "text": {"en": "Leave · 9–12 Nov", "ar": "إجازة · من 9 إلى 12 نوفمبر"}, "value": {"en": "Remove", "ar": "أزِل"}, "gap": "m"}
            - {"kind": "listitem", "icon": "receipt", "text": {"en": "Taxi · EGP 180", "ar": "تاكسي · 180 جنيه"}, "value": {"en": "Delete", "ar": "احذف"}, "gap": "s"}
            - {"kind": "listitem", "icon": "laptop", "text": {"en": "Laptop bag · EGP 650", "ar": "حقيبة لابتوب · 650 جنيه"}, "value": {"en": "Discard", "ar": "تجاهَل"}, "gap": "s"}
      - id: icon
        text: {"en": "Replace all three with a bin icon and no word", "ar": "أضع مكانها كلها أيقونة سلة مهملات دون كلمة"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/requests/drafts"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}, {"en": "My requests", "ar": "طلباتي"}], "active": 2}
          blocks:
            - {"kind": "title", "text": {"en": "Drafts", "ar": "المسودّات"}}
            - {"kind": "listitem", "icon": "airplane-tilt", "text": {"en": "Leave · 9–12 Nov", "ar": "إجازة · من 9 إلى 12 نوفمبر"}, "value": "🗑", "gap": "m"}
            - {"kind": "listitem", "icon": "receipt", "text": {"en": "Taxi · EGP 180", "ar": "تاكسي · 180 جنيه"}, "value": "🗑", "gap": "s"}
            - {"kind": "listitem", "icon": "laptop", "text": {"en": "Laptop bag · EGP 650", "ar": "حقيبة لابتوب · 650 جنيه"}, "value": "🗑", "gap": "s"}
    answer: [one]
    misconceptions:
      - id: MC-P02-017
        when: [keep]
        feedback:
          en: "Staff will wonder if \"Discard\" keeps a copy that \"Delete\" doesn't. Different words for one action create doubts that aren't there."
          ar: "سيتساءل الموظفون إن كانت «تجاهَل» تحتفظ بنسخة لا تحتفظ بها «احذف». والكلمات المختلفة لإجراء واحد تخلق شكوكًا لا أساس لها."
      - id: MC-P02-016
        when: [icon]
        feedback:
          en: "An icon alone removes the doubt about words but adds a new one: what exactly does the bin delete here?"
          ar: "الأيقونة وحدها تزيل الشك في الكلمات لكنها تضيف شكًا جديدًا: ما الذي تحذفه السلة هنا بالضبط؟"
    hints:
      - en: "Seeing three different words, what might staff think?"
        ar: "حين يرى الموظفون ثلاث كلمات مختلفة، ماذا قد يظنون؟"
    correct:
      en: "One action, one word."
      ar: "إجراء واحد، كلمة واحدة."
    explain:
      en: "When the same action always has the same name, staff learn it once and trust it everywhere. Save different words for actions that really do different things."
      ar: "حين يحمل الإجراء نفسه الاسم نفسه دائمًا، يتعلّمه الموظفون مرة ويثقون به في كل مكان. واحتفظ بالكلمات المختلفة للإجراءات التي تفعل فعلًا أشياء مختلفة."

  - id: S05
    type: tune
    part: guided
    skill: SK-P02-U02-04
    rules: [R06]
    value:
      en: "Consistency and standards (NN/g): when asking for data such as dates, use industry standards. Most sites use a calendar date picker; an open field makes people guess the format."
      ar: "الاتساق والمعايير (NN/g): حين تطلب بيانات مثل التواريخ، استخدم معايير المجال. فأغلب المواقع تستخدم منتقي تاريخ بشكل تقويم؛ أما الحقل المفتوح فيجعل الناس يخمّنون الصيغة."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "most sites use a calendar date picker when asking users to input dates." }
    scenario:
      en: "The leave form asks for the first day off in an empty text field. Staff type \"3/11\", \"Nov 3\", \"3-11-2026\", and half the requests come back with the wrong dates."
      ar: "نموذج الإجازة يطلب أول يوم إجازة في حقل نصي فارغ. فيكتب الموظفون «3/11» و«3 نوفمبر» و«3-11-2026»، ويعود نصف الطلبات بتواريخ خاطئة."
    prompt:
      en: "How should the form ask for the date?"
      ar: "كيف يطلب النموذج التاريخ لتصل كل الطلبات بتاريخ صحيح؟"
    mock:
      app: nafaqat
      frame: wide
      url: nafaqat.example/leave/new
      navbar: { links: [ { en: "Leave", ar: "الإجازات" }, { en: "Expenses", ar: "المصروفات" } ], active: 0 }
      blocks:
        - { kind: title, text: { en: "Leave request", ar: "طلب إجازة" } }
        - { kind: field, label: { en: "First day off", ar: "أول يوم إجازة" }, text: "3/11", filled: true, focus: true, gap: m, note: { en: "Others typed \"Nov 3\" and \"3-11-2026\"", ar: "كتب آخرون «3 نوفمبر» و«3-11-2026»" } }
        - { kind: field, label: { en: "Days", ar: "عدد الأيام" }, text: "4", filled: true, gap: m }
    options:
      - id: hint
        text: {"en": "Keep the field and add \"Use YYYY-MM-DD\" under it", "ar": "يبقى الحقل مع إضافة «استخدم الصيغة YYYY-MM-DD» تحته"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/leave/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}], "active": 0}
          blocks:
            - {"kind": "title", "text": {"en": "Leave request", "ar": "طلب إجازة"}}
            - {"kind": "field", "label": {"en": "First day off", "ar": "أول يوم إجازة"}, "text": "3/11", "filled": true, "focus": true, "gap": "m", "note": {"en": "Others typed \"Nov 3\" and \"3-11-2026\"", "ar": "كتب آخرون «3 نوفمبر» و«3-11-2026»"}, "hint": {"en": "Use YYYY-MM-DD", "ar": "استخدم الصيغة YYYY-MM-DD"}}
            - {"kind": "field", "label": {"en": "Days", "ar": "عدد الأيام"}, "text": "4", "filled": true, "gap": "m"}
      - id: picker
        text: {"en": "A date field that opens a calendar, like other booking forms", "ar": "حقل تاريخ يفتح تقويمًا، مثل نماذج الحجز الأخرى"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/leave/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}], "active": 0}
          blocks:
            - {"kind": "title", "text": {"en": "Leave request", "ar": "طلب إجازة"}}
            - {"kind": "field", "label": {"en": "First day off", "ar": "أول يوم إجازة"}, "text": {"en": "Tue 3 Nov 2026", "ar": "الثلاثاء 3 نوفمبر 2026"}, "filled": true, "focus": true, "icon": "calendar-blank", "gap": "m"}
            - {"kind": "calendar", "months": [{"title": {"en": "November 2026", "ar": "نوفمبر 2026"}, "start": 0, "days": 30}], "pick": [0, 3], "gap": "s"}
            - {"kind": "field", "label": {"en": "Days", "ar": "عدد الأيام"}, "text": "4", "filled": true, "gap": "m"}
      - id: three
        text: {"en": "Three dropdowns: year, then month, then day", "ar": "ثلاث قوائم منسدلة (Dropdowns): السنة، ثم الشهر، ثم اليوم"}
        mock:
          app: "nafaqat"
          frame: "wide"
          url: "nafaqat.example/leave/new"
          navbar: {"links": [{"en": "Leave", "ar": "الإجازات"}, {"en": "Expenses", "ar": "المصروفات"}], "active": 0}
          blocks:
            - {"kind": "title", "text": {"en": "Leave request", "ar": "طلب إجازة"}}
            - {"kind": "row", "gap": "m", "blocks": [{"kind": "select", "label": {"en": "Year", "ar": "السنة"}, "text": "2026", "filled": true}, {"kind": "select", "label": {"en": "Month", "ar": "الشهر"}, "text": {"en": "November", "ar": "نوفمبر"}, "filled": true}, {"kind": "select", "label": {"en": "Day", "ar": "اليوم"}, "text": "3", "filled": true}]}
            - {"kind": "field", "label": {"en": "Days", "ar": "عدد الأيام"}, "text": "4", "filled": true, "gap": "m"}
    answer: [picker]
    misconceptions:
      - id: MC-P02-018
        when: [hint, three]
        feedback:
          en: "Staff must read the rule or work through three lists before they can enter a date. A calendar is what they already use on every booking site."
          ar: "على الموظفين أن يقرؤوا القاعدة أو يمرّوا بثلاث قوائم قبل أن يُدخلوا التاريخ. أما التقويم فهو ما يستخدمونه أصلًا في كل موقع حجز."
    hints:
      - en: "How do other sites ask you to pick a date for a trip or an appointment?"
        ar: "كيف تطلب منك المواقع الأخرى اختيار تاريخ لرحلة أو موعد؟"
    correct:
      en: "Use the control people already know: a calendar."
      ar: "استخدم العنصر الذي يعرفه الناس أصلًا: التقويم."
    explain:
      en: "A calendar removes the question of format, shows the weekday, and works the way staff expect from other sites."
      ar: "التقويم يُنهي الحيرة حول طريقة كتابة التاريخ، ويُظهر يوم الأسبوع، ويعمل كما يتوقع الموظفون من المواقع الأخرى."

  - id: S06
    type: compare
    speaker: sara
    part: contrast
    skill: SK-P02-U02-04
    rules: [R11]
    value:
      en: "Consistency and standards (NN/g): choose icons that match how other sites show the same idea. Stick to the standard magnifying glass for search, so people recognise it."
      ar: "الاتساق والمعايير (NN/g): اختر أيقونات تطابق طريقة المواقع الأخرى في عرض الفكرة نفسها. والتزم بالعدسة المكبّرة المعروفة للبحث، حتى يعرفها الناس."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "stick to the standard magnifying glass for search, so that users will easily recognize it." }
    scenario:
      en: "I'm designing a travel app with a nature theme. The brand team suggested binoculars for the search button."
      ar: "أصمّم تطبيقًا للسفر بطابع الطبيعة. واقترح فريق العلامة التجارية منظارًا لزر البحث."
    prompt:
      en: "Which version will people find search in?"
      ar: "في أيّ نسخة يجد الناس زر البحث بسرعة؟"
    a:
      label: { en: "Version A: binoculars", ar: "النسخة A: أيقونة منظار للبحث" }
      mock:
        app: zad
        appbar: { logo: true, actions: [ { icon: binoculars, aria: { en: "Search", ar: "بحث" } } ] }
        blocks:
          - { kind: image, art: desert, size: l }
          - { kind: heading, text: { en: "Weekend in Siwa", ar: "عطلة في سيوة" }, gap: m }
          - { kind: price, text: { en: "from EGP 4,900", ar: "من 4,900 جنيه" } }
    b:
      label: { en: "Version B: magnifying glass", ar: "النسخة B: أيقونة عدسة مكبّرة للبحث" }
      mock:
        app: zad
        appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
        blocks:
          - { kind: image, art: desert, size: l }
          - { kind: heading, text: { en: "Weekend in Siwa", ar: "عطلة في سيوة" }, gap: m }
          - { kind: price, text: { en: "from EGP 4,900", ar: "من 4,900 جنيه" } }
    answer: b
    misconceptions:
      - id: MC-P02-019
        when: [a]
        feedback:
          en: "Binoculars fit the theme, but people scan for a magnifying glass when they want to search. Many will read the binoculars as \"explore\" or \"view\", or miss them."
          ar: "المنظار يناسب الطابع، لكن الناس يبحثون بأعينهم عن العدسة المكبّرة حين يريدون البحث. وكثيرون سيفهمون المنظار على أنه «استكشف» أو «شاهد»، أو لن يلاحظوه."
    correct:
      en: "B: the icon people already look for."
      ar: "B: الأيقونة التي يبحث عنها الناس أصلًا."
    explain:
      en: "The magnifying glass means search in almost every app people use. The nature theme can live in colours and photos, not in the icons people need to recognise."
      ar: "العدسة المكبّرة تعني البحث في كل التطبيقات التي يستخدمها الناس تقريبًا. ويمكن أن يظهر طابع الطبيعة في الألوان والصور، لا في الأيقونات التي يحتاج الناس إلى معرفتها."

  - id: S07
    type: tune
    speaker: sara
    part: independent
    skill: SK-P02-U02-04
    rules: [R14]
    value:
      en: "Consistency and standards (NN/g): conventions such as the shopping-cart icon tell people where the items they plan to buy are. A brand-themed icon breaks that link."
      ar: "الاتساق والمعايير (NN/g): الأعراف مثل أيقونة عربة التسوق تخبر الناس أين المنتجات التي ينوون شراءها. والأيقونة المصمّمة على طابع العلامة التجارية تقطع هذا الربط."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "the shopping-cart icon shows the items you plan to purchase" }
    scenario:
      en: "For a fashion shop's website, the marketing team wants the cart icon at the top to be a clothes hanger, \"to feel more like us\". There is no word next to it."
      ar: "في موقع متجر ملابس، يريد فريق التسويق أن تكون أيقونة السلة في الأعلى شمّاعة ملابس، «لتشبهنا أكثر». ولا توجد كلمة بجانبها."
    prompt:
      en: "What should I recommend?"
      ar: "بماذا أنصح فريق التسويق ليجد الزوار السلة بسهولة؟"
    mock:
      app: lamha
      frame: wide
      url: lamha.example/women/dresses
      navbar: { links: [ { en: "Women", ar: "نساء" }, { en: "Men", ar: "رجال" }, { en: "Kids", ar: "أطفال" } ], active: 0, actions: [ { icon: coat-hanger, count: 2, aria: { en: "Cart", ar: "السلة" } }, { icon: user } ] }
      blocks:
        - kind: row
          blocks:
            - { kind: card, art: shirt, blocks: [ { kind: small, text: { en: "Linen dress", ar: "فستان كتان" } }, { kind: price, text: { en: "EGP 890", ar: "890 جنيه" } } ] }
            - { kind: card, art: shirt, blocks: [ { kind: small, text: { en: "Cotton abaya", ar: "عباية قطن" } }, { kind: price, text: { en: "EGP 1,150", ar: "1,150 جنيه" } } ] }
    options:
      - id: hanger
        text: {"en": "Use the hanger; it's memorable and fits the brand", "ar": "نستخدم الشمّاعة؛ فهي مميزة وتناسب العلامة التجارية"}
        mock:
          app: "lamha"
          frame: "wide"
          url: "lamha.example/women/dresses"
          navbar: {"links": [{"en": "Women", "ar": "نساء"}, {"en": "Men", "ar": "رجال"}, {"en": "Kids", "ar": "أطفال"}], "active": 0, "actions": [{"icon": "coat-hanger", "count": 2, "aria": {"en": "Cart", "ar": "السلة"}}, {"icon": "user"}]}
          blocks:
            - {"kind": "row", "blocks": [{"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Linen dress", "ar": "فستان كتان"}}, {"kind": "price", "text": {"en": "EGP 890", "ar": "890 جنيه"}}]}, {"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Cotton abaya", "ar": "عباية قطن"}}, {"kind": "price", "text": {"en": "EGP 1,150", "ar": "1,150 جنيه"}}]}]}
      - id: tour
        text: {"en": "Use the hanger, with a tour on the first visit that explains it", "ar": "نستخدم الشمّاعة، مع جولة تعريفية في الزيارة الأولى تشرحها"}
        mock:
          app: "lamha"
          frame: "wide"
          url: "lamha.example/women/dresses"
          navbar: {"links": [{"en": "Women", "ar": "نساء"}, {"en": "Men", "ar": "رجال"}, {"en": "Kids", "ar": "أطفال"}], "active": 0, "actions": [{"icon": "coat-hanger", "count": 2, "aria": {"en": "Cart", "ar": "السلة"}}, {"icon": "user"}]}
          blocks:
            - {"kind": "row", "blocks": [{"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Linen dress", "ar": "فستان كتان"}}, {"kind": "price", "text": {"en": "EGP 890", "ar": "890 جنيه"}}]}, {"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Cotton abaya", "ar": "عباية قطن"}}, {"kind": "price", "text": {"en": "EGP 1,150", "ar": "1,150 جنيه"}}]}]}
          overlay: {"type": "banner", "blocks": [{"kind": "text", "text": {"en": "New here? The hanger at the top is your cart.", "ar": "جديد هنا؟ الشمّاعة في الأعلى هي سلّتك."}}, {"kind": "link", "text": {"en": "Got it", "ar": "فهمت"}, "gap": "xs"}]}
      - id: cart
        text: {"en": "Keep a standard bag or cart icon with the item count, and use the brand style elsewhere", "ar": "نُبقي أيقونة حقيبة أو عربة معروفة مع عدد المنتجات، ونستخدم أسلوب العلامة التجارية في مكان آخر"}
        mock:
          app: "lamha"
          frame: "wide"
          url: "lamha.example/women/dresses"
          navbar: {"links": [{"en": "Women", "ar": "نساء"}, {"en": "Men", "ar": "رجال"}, {"en": "Kids", "ar": "أطفال"}], "active": 0, "actions": [{"icon": "shopping-bag", "count": 2, "aria": {"en": "Cart", "ar": "السلة"}}, {"icon": "user"}]}
          blocks:
            - {"kind": "row", "blocks": [{"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Linen dress", "ar": "فستان كتان"}}, {"kind": "price", "text": {"en": "EGP 890", "ar": "890 جنيه"}}]}, {"kind": "card", "art": "shirt", "blocks": [{"kind": "small", "text": {"en": "Cotton abaya", "ar": "عباية قطن"}}, {"kind": "price", "text": {"en": "EGP 1,150", "ar": "1,150 جنيه"}}]}]}
    answer: [cart]
    misconceptions:
      - id: MC-P02-019
        when: [hanger]
        feedback:
          en: "A hanger usually means clothes or a wardrobe. Shoppers who look for their cart won't think to tap it."
          ar: "الشمّاعة تعني عادة الملابس أو خزانة الملابس. والمتسوّقون الذين يبحثون عن سلّتهم لن يفكروا في الضغط عليها."
      - id: MC-P02-018
        when: [tour]
        feedback:
          en: "A tour teaches a new meaning that people would not need to learn with a standard icon, and most skip tours anyway."
          ar: "الجولة تعلّم معنى جديدًا لا يحتاج الناس إلى تعلّمه مع أيقونة معروفة، وأغلبهم يتخطّون الجولات على أي حال."
    hints:
      - en: "Where do shoppers look for their cart on other shops, and what do they expect to see?"
        ar: "أين يبحث المتسوّقون عن سلّتهم في المتاجر الأخرى، وماذا يتوقعون أن يروا؟"
    correct:
      en: "Keep the convention where people rely on it."
      ar: "حافظ على المألوف (Convention) حين يعتمد عليه الناس."
    explain:
      en: "Shoppers bring the cart or bag icon with them from every other shop. Keeping it means they find their items at once; the brand can shine in the photos and colours."
      ar: "اعتاد المتسوّقون أيقونة العربة أو الحقيبة في كل متجر آخر. والحفاظ عليها يعني أنهم يجدون منتجاتهم فورًا؛ ويمكن أن تبرز العلامة التجارية في الصور والألوان."

  - id: S08
    type: card
    part: recap
    icons: [layers, eye, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Inside your product,** one action keeps one word, one look and one place.\n- **With other products,** use the icons and controls people already know: a calendar for dates, a magnifying glass for search, a cart for the cart.\n- **Put brand style** in colours and images, not in the controls people need to recognise.\n\nNext: the skill check for this unit."
      ar: "- **داخل منتجك،** يحتفظ الإجراء الواحد بكلمة واحدة وشكل واحد ومكان واحد.\n- **مع المنتجات الأخرى،** استخدم الأيقونات والعناصر التي يعرفها الناس أصلًا: تقويم للتواريخ، وعدسة مكبّرة للبحث، وعربة للسلة.\n- **ضع أسلوب العلامة التجارية** في الألوان والصور، لا في العناصر التي يحتاج الناس إلى معرفتها.\n\nالتالي: اختبار المهارة لهذه الوحدة."
