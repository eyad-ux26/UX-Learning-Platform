      url: khabar.example/economy/rent-prices-2026
      navbar: { links: [ { en: "News", ar: "أخبار" }, { en: "Economy", ar: "اقتصاد" }, { en: "Sport", ar: "رياضة" } ], active: 1 }
      blocks:
        - { kind: title, text: { en: "Rents rose 12% this year", ar: "ارتفاع الإيجارات 12% هذا العام" } }
        - {"kind": "text", "text": {"en": "Prices rose fastest in", "ar": "ارتفعت الأسعار أسرع في"}, "gap": "m"}
        - {"kind": "link", "text": {"en": "new cities", "ar": "المدن الجديدة"}, "gap": "xs", "note": {"en": "Blue and underlined, but not links", "ar": "زرقاء مسطّرة، لكنها ليست روابط"}}
        - {"kind": "text", "text": {"en": "while older districts stayed flat. Tenants are moving to", "ar": "بينما بقيت الأحياء القديمة ثابتة. ويتجه المستأجرون إلى"}, "gap": "xs"}
        - {"kind": "link", "text": {"en": "shared flats", "ar": "الشقق المشتركة"}, "gap": "xs"}
        - {"kind": "text", "text": {"en": "to save.", "ar": "للتوفير."}, "gap": "xs"}
    options:
      - id: keep
        text: {"en": "Keep them; readers will get used to it", "ar": "تبقى؛ وسيعتاد القرّاء عليها"}
        mock:
          app: "khabar"
          frame: "wide"
          url: "khabar.example/economy/rent-prices-2026"
          navbar: {"links": [{"en": "News", "ar": "أخبار"}, {"en": "Economy", "ar": "اقتصاد"}, {"en": "Sport", "ar": "رياضة"}], "active": 1}
          blocks:
            - {"kind": "title", "text": {"en": "Rents rose 12% this year", "ar": "ارتفاع الإيجارات 12% هذا العام"}}
            - {"kind": "text", "text": {"en": "Prices rose fastest in", "ar": "ارتفعت الأسعار أسرع في"}, "gap": "m"}
            - {"kind": "link", "text": {"en": "new cities", "ar": "المدن الجديدة"}, "gap": "xs", "note": {"en": "Blue and underlined, but not links", "ar": "زرقاء مسطّرة، لكنها ليست روابط"}}
            - {"kind": "text", "text": {"en": "while older districts stayed flat. Tenants are moving to", "ar": "بينما بقيت الأحياء القديمة ثابتة. ويتجه المستأجرون إلى"}, "gap": "xs"}
            - {"kind": "link", "text": {"en": "shared flats", "ar": "الشقق المشتركة"}, "gap": "xs"}
            - {"kind": "text", "text": {"en": "to save.", "ar": "للتوفير."}, "gap": "xs"}
      - id: bold
        text: {"en": "Show important phrases in bold, and keep blue underline for links only", "ar": "تُعرض العبارات المهمة بخط عريض، ويبقى الأزرق المسطّر للروابط فقط"}
        mock:
          app: "khabar"
          frame: "wide"
          url: "khabar.example/economy/rent-prices-2026"
          navbar: {"links": [{"en": "News", "ar": "أخبار"}, {"en": "Economy", "ar": "اقتصاد"}, {"en": "Sport", "ar": "رياضة"}], "active": 1}
          blocks:
