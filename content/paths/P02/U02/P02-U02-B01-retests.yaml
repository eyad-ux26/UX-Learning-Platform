            - {"kind": "link", "text": {"en": "Read more: how rents are set", "ar": "اقرأ أيضًا: كيف تُحدَّد الإيجارات"}, "gap": "s", "note": {"en": "Blue underline: links only", "ar": "الأزرق المسطّر للروابط فقط"}}
