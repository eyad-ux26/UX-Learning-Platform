id: P02-U02-B01
mode: bank
title:
  en: "Re-tests: let people back out, and keep things the same"
  ar: "إعادة اختبار: دَع الناس يتراجعون، وأبقِ الأشياء كما هي"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "User Control and Freedom (Usability Heuristic #3) (NN/g)", ar: "تحكّم المستخدم وحريته (مبدأ الاستخدام 3) (NN/g)" }
    url: "https://www.nngroup.com/articles/user-control-and-freedom/"
  - title: { en: "Consistency and Standards (Usability Heuristic #4) (NN/g)", ar: "الاتساق والمعايير (مبدأ الاستخدام 4) (NN/g)" }
    url: "https://www.nngroup.com/articles/consistency-and-standards/"
steps:
  # SK-P02-U02-01: give a clear way out
  - id: S01
    type: choose
    speaker: sara
    part: retest
    skill: SK-P02-U02-01
    value:
      en: "Re-test, user control and freedom (NN/g): exits should be easy to find and well signposted, like in a building. A full-screen video with a hidden exit leaves people stuck."
      ar: "إعادة اختبار، تحكّم المستخدم وحريته (NN/g): يجب أن تكون المخارج سهلة الإيجاد وواضحة العلامات، كما في المباني. والفيديو بملء الشاشة بمخرج مخفي يترك الناس عالقين."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "Like in a physical space, exits should be easy to find and well signposted so that they will be discovered when needed." }
    scenario:
      en: "I'm designing a cooking video app. Videos open full screen, and the controls, including the way out, only appear if you tap a small spot in the corner."
      ar: "أصمّم تطبيقًا لفيديوهات الطبخ. تُفتح الفيديوهات بملء الشاشة، ولا تظهر أزرار التحكم، ومنها طريق الخروج، إلا إذا ضغطت نقطة صغيرة في الزاوية."
    prompt:
      en: "What should I change?"
      ar: "ماذا أغيّر؟"
    mock:
      app: tabkha
      theme: dark
      blocks:
        - { kind: image, art: food-grill, size: xl, note: { en: "Controls appear only after a tap on this corner", ar: "تظهر الأزرار فقط بعد الضغط على هذه الزاوية" } }
        - { kind: small, text: "⋯", tone: faint }
    options:
      - { id: tap, text: { en: "Show the controls, with a clear ✕ Close, whenever people tap anywhere on the video", ar: "أُظهر أزرار التحكم، ومعها «✕ إغلاق» واضح، كلما ضغط الناس على أي مكان في الفيديو" } }
      - { id: swipe, text: { en: "Let people swipe down with two fingers to leave", ar: "أتيح للناس السحب لأسفل بإصبعين للخروج" } }
      - { id: end, text: { en: "Close the video by itself when it ends", ar: "أُغلق الفيديو وحده حين ينتهي" } }
    answer: [tap]
    misconceptions:
      - id: MC-P02-013
        when: [swipe, end]
        feedback:
          en: "Neither gives people a way out they can see. Someone who wants to leave halfway still has to guess."
          ar: "لا تعطي أيٌّ منهما الناسَ مخرجًا يرونه. ومن يريد الخروج في المنتصف ما زال عليه أن يخمّن."
    correct:
      en: "Make the exit easy to find."
      ar: "اجعل المخرج سهل الإيجاد."
    explain:
      en: "Tapping anywhere is what people try first, and a labelled Close then shows them exactly how to leave."
      ar: "الضغط على أي مكان هو أول ما يجرّبه الناس، ثم يريهم «إغلاق» المكتوب بالضبط كيف يخرجون."

  - id: S02
    type: choose
    speaker: tarek
    part: retest
    skill: SK-P02-U02-01
    value:
      en: "Re-test, user control and freedom (NN/g): an ✕ can be mistaken for Close rather than Cancel. In a money transfer, label the exit with what it does."
      ar: "إعادة اختبار، تحكّم المستخدم وحريته (NN/g): قد تُفهم علامة ✕ على أنها «إغلاق» لا «إلغاء». وفي تحويل المال، اكتب على المخرج ما يفعله."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "sometimes X can be mistaken for Close, rather than Cancel." }
    scenario:
      en: "In our banking app, the transfer screen has a small ✕ at the top. Some customers tap it to close the screen and think the transfer still went through. Others don't dare tap it."
      ar: "في تطبيق البنك عندنا، في شاشة التحويل علامة ✕ صغيرة في الأعلى. يضغطها بعض العملاء ليغلقوا الشاشة ويظنون أن التحويل تمّ. وآخرون لا يجرؤون على ضغطها."
    prompt:
      en: "What should the exit look like?"
      ar: "كيف يجب أن يبدو المخرج؟"
    mock:
      app: rasid
      appbar: { title: { en: "Transfer", ar: "تحويل" }, actions: [ { icon: x, aria: { en: "Close", ar: "إغلاق" } } ] }
      blocks:
        - { kind: listitem, avatar: { text: "Omar Hany" }, text: { en: "Omar Hany", ar: "عمر هاني" }, sub: "EG38 •••• 4417" }
        - { kind: price, text: { en: "EGP 3,500", ar: "3,500 جنيه" }, size: l, gap: m }
      footer:
        - { kind: button, text: { en: "Send money", ar: "حوّل المبلغ" } }
    options:
      - { id: x, text: { en: "Keep the ✕; it's a known icon", ar: "تبقى ✕؛ فهي أيقونة معروفة" } }
      - { id: label, text: { en: "A \"Cancel transfer\" button next to \"Send money\"", ar: "زر «ألغِ التحويل» بجانب «حوّل المبلغ»" } }
      - { id: red, text: { en: "Make the ✕ red", ar: "أجعل ✕ حمراء" } }
    answer: [label]
    misconceptions:
      - id: MC-P02-013
        when: [x, red]
        feedback:
          en: "The ✕ still doesn't say whether it cancels the transfer or only closes the screen. With money involved, people need to be sure."
          ar: "ما زالت ✕ لا تقول إن كانت تلغي التحويل أم تغلق الشاشة فقط. وحين يتعلق الأمر بالمال، يحتاج الناس إلى اليقين."
    correct:
      en: "Say exactly what the exit does."
      ar: "قل بالضبط ما يفعله المخرج."
    explain:
      en: "\"Cancel transfer\" leaves no doubt: no money moves. Customers can leave calmly, or stay and send."
      ar: "«ألغِ التحويل» لا تترك أي شك: لن يتحرّك أي مال. فيستطيع العملاء المغادرة بهدوء، أو البقاء والتحويل."

  # SK-P02-U02-02: let people undo and go back where they expect
  - id: S03
    type: choose
    speaker: nour
    part: retest
    skill: SK-P02-U02-02
    value:
      en: "Re-test, user control and freedom (NN/g): when people make many changes in a row, support multiple undo and redo. Undoing only the last change is often not enough."
      ar: "إعادة اختبار، تحكّم المستخدم وحريته (NN/g): حين يُجري الناس تغييرات كثيرة متتالية، ادعم التراجع والإعادة لعدة خطوات. فالتراجع عن آخر تغيير فقط لا يكفي غالبًا."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "If users are likely to make many actions in short succession, support multiple Undo and Redo." }
    scenario:
      en: "Doctors in my clinic write visit notes in our system. Its Undo only takes back the very last change. One doctor deleted a paragraph, typed two lines, and couldn't get the paragraph back."
      ar: "يكتب الأطباء في عيادتي ملاحظات الزيارة في نظامنا. و«تراجع» فيه يلغي آخر تغيير فقط. حذف طبيب فقرة، ثم كتب سطرين، فلم يستطع استعادة الفقرة."
    prompt:
      en: "What should the notes editor support?"
      ar: "ماذا يجب أن يدعم محرّر الملاحظات؟"
    mock:
      app: raha
      frame: wide
      url: raha.example/staff/visits/2291/notes
      navbar: { links: [ { en: "Today", ar: "اليوم" }, { en: "Patients", ar: "المرضى" } ], active: 1, actions: [ { icon: arrow-counter-clockwise, aria: { en: "Undo", ar: "تراجع" } } ] }
      blocks:
        - { kind: title, text: { en: "Visit notes · Ahmed Samy", ar: "ملاحظات الزيارة · أحمد سامي" } }
        - { kind: text, text: { en: "BP 130/85. Advised less salt.\nFollow up in 2 weeks.", ar: "الضغط 130/85. نُصح بتقليل الملح.\nمتابعة بعد أسبوعين." }, gap: m, note: { en: "A deleted paragraph sat here. Undo only brings back the last line.", ar: "كانت هنا فقرة محذوفة. «تراجع» يعيد آخر سطر فقط." } }
    options:
      - { id: multi, text: { en: "Undo and Redo for many steps, in the toolbar and with Ctrl+Z", ar: "«تراجع» و«إعادة» لخطوات كثيرة، في شريط الأدوات ومع Ctrl+Z" } }
      - { id: confirm, text: { en: "A warning before deleting any text", ar: "تحذير قبل حذف أي نص" } }
      - { id: save, text: { en: "Auto-save every minute", ar: "حفظ تلقائي كل دقيقة" } }
    answer: [multi]
    misconceptions:
      - id: MC-P02-015
        when: [confirm]
        feedback:
          en: "A warning on every delete would interrupt doctors all day, and still not help once they've typed more."
          ar: "التحذير مع كل حذف سيقاطع الأطباء طوال اليوم، ولن يساعد بعد أن يكتبوا المزيد."
      - id: MC-P02-014
        when: [save]
        feedback:
          en: "Auto-save keeps the mistake too. It protects against losing work, not against a change you want to take back."
          ar: "الحفظ التلقائي يحفظ الخطأ أيضًا. فهو يحمي من ضياع العمل، لا من تغيير تريد التراجع عنه."
    correct:
      en: "Let people step back as far as they need."
      ar: "دَع الناس يرجعون بقدر ما يحتاجون."
    explain:
      en: "With many steps of undo, the doctor can go back past the two lines to the deleted paragraph, then redo anything worth keeping."
      ar: "مع تراجع لخطوات كثيرة، يستطيع الطبيب أن يرجع إلى ما قبل السطرين حتى الفقرة المحذوفة، ثم يعيد ما يستحق البقاء."

  - id: S04
    type: choose
    speaker: rami
    part: retest
    skill: SK-P02-U02-02
    value:
      en: "Re-test, user control and freedom (NN/g): where possible, build forms where people can use the browser's Back button. Losing everything on Back punishes a normal habit."
      ar: "إعادة اختبار، تحكّم المستخدم وحريته (NN/g): ابنِ النماذج، حيثما أمكن، بحيث يستطيع الناس استخدام زر الرجوع في المتصفح. وضياع كل شيء عند الرجوع عقاب على عادة طبيعية."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "Where possible, build forms where users can use the browser's Back button." }
    scenario:
      en: "I'm designing a 3-page job application website. If an applicant presses the browser's Back button on page 3 to fix page 2, they get \"Session expired\" and must start over."
      ar: "أصمّم موقعًا للتقديم على الوظائف في 3 صفحات. وإن ضغط المتقدّم زر الرجوع في المتصفح وهو في الصفحة 3 ليصلح الصفحة 2، تظهر له «انتهت الجلسة» وعليه أن يبدأ من جديد."
    prompt:
      en: "What should I ask the developers for?"
      ar: "ماذا أطلب من المطوّرين؟"
    mock:
      app: wazifa
      frame: wide
      url: wazifa.example/apply/ux-designer/step-2
      blocks:
        - { kind: icon, icon: clock-countdown, size: l, color: brand }
        - { kind: title, text: { en: "Session expired", ar: "انتهت الجلسة" }, gap: s }
        - { kind: small, text: { en: "Please start your application again.", ar: "يرجى بدء طلبك من جديد." } }
        - { kind: button, text: { en: "Start again", ar: "ابدأ من جديد" }, gap: m, note: { en: "After browser Back on page 3", ar: "بعد زر الرجوع في المتصفح وهو في الصفحة 3" } }
    options:
      - { id: block, text: { en: "Disable the browser's Back button on these pages", ar: "تعطيل زر الرجوع في المتصفح في هذه الصفحات" } }
      - { id: work, text: { en: "Make browser Back open page 2 with everything still filled in", ar: "أن يفتح زر الرجوع في المتصفح الصفحة 2 وكل ما فيها ما زال مكتوبًا" } }
      - { id: note, text: { en: "Add a note: \"Don't use your browser's Back button\"", ar: "إضافة ملاحظة: «لا تستخدم زر الرجوع في المتصفح»" } }
    answer: [work]
    misconceptions:
      - id: MC-P02-012
        when: [block, note]
        feedback:
          en: "People press Back without thinking. Blocking it or warning them in text still leaves them stuck, or losing their work."
          ar: "يضغط الناس «رجوع» دون تفكير. وتعطيله أو التحذير منه بنص ما زال يتركهم عالقين، أو يُضيّع عملهم."
    correct:
      en: "Back takes them one page back, work kept."
      ar: "«رجوع» يعيدهم صفحة واحدة، مع بقاء عملهم."
    explain:
      en: "Applicants expect Back to show the previous page as they left it. Keeping their answers lets them fix page 2 and carry on."
      ar: "يتوقع المتقدّمون أن يُظهر «رجوع» الصفحة السابقة كما تركوها. والاحتفاظ بإجاباتهم يتيح لهم إصلاح الصفحة 2 والمتابعة."

  # SK-P02-U02-03: keep the same thing the same everywhere
  - id: S05
    type: choose
    speaker: youssef
    part: retest
    skill: SK-P02-U02-03
    value:
      en: "Re-test, consistency and standards (NN/g): internal consistency shows in colours: one primary colour for all text links and primary buttons. Different colours for the same role confuse people."
      ar: "إعادة اختبار، الاتساق والمعايير (NN/g): يظهر الاتساق الداخلي في الألوان: لون أساسي واحد لكل الروابط والأزرار الرئيسية. والألوان المختلفة للدور نفسه تربك الناس."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "an application may use orange as its primary color, which is then applied to all text links and primary buttons." }
    scenario:
      en: "On my shop's product pages, **Add to cart** is orange. On the cart page, **Checkout** is grey, and grey is also the colour of disabled buttons elsewhere on the site."
      ar: "في صفحات المنتجات بمتجري، زر **أضف إلى السلة** برتقالي. وفي صفحة السلة، زر **إتمام الشراء** رمادي، والرمادي هو أيضًا لون الأزرار المعطّلة في باقي الموقع."
    prompt:
      en: "What should I do with the Checkout button?"
      ar: "ماذا أفعل بزر «إتمام الشراء»؟"
    mock:
      app: dar
      appbar: { title: { en: "Cart", ar: "السلة" }, back: true }
      blocks:
        - { kind: listitem, art: box, text: { en: "Electric drill 650 W", ar: "مثقاب كهربائي 650 وات" }, value: { en: "EGP 1,250", ar: "1,250 جنيه" } }
        - { kind: listitem, art: box, text: { en: "Drill bits, 10 pcs", ar: "بنط مثقاب، 10 قطع" }, value: { en: "EGP 180", ar: "180 جنيه" }, gap: s }
        - { kind: price, text: { en: "Total EGP 1,430", ar: "الإجمالي 1,430 جنيه" }, gap: m }
      footer:
        - { kind: button, text: { en: "Checkout", ar: "إتمام الشراء" }, tone: off }
    options:
      - { id: orange, text: { en: "Make it orange, like every other main button", ar: "أجعله برتقاليًا، مثل كل الأزرار الرئيسية الأخرى" } }
      - { id: grey, text: { en: "Keep it grey; the cart page has a calmer style", ar: "أُبقيه رماديًا؛ فلصفحة السلة أسلوب أهدأ" } }
      - { id: arrow, text: { en: "Keep it grey and add an arrow →", ar: "أُبقيه رماديًا وأضيف سهمًا ←" } }
    answer: [orange]
    misconceptions:
      - id: MC-P02-016
        when: [grey, arrow]
        feedback:
          en: "Customers have learned that grey means \"can't press yet\". A grey Checkout looks like it doesn't work."
          ar: "تعلّم العملاء أن الرمادي يعني «لا يمكن الضغط بعد». فيبدو «إتمام الشراء» الرمادي كأنه لا يعمل."
    correct:
      en: "Same role, same colour."
      ar: "الدور نفسه، اللون نفسه."
    explain:
      en: "Every main action on the site is orange, so customers look for orange to move on. Checkout is the most important main action of all."
      ar: "كل إجراء رئيسي في الموقع برتقالي، فيبحث العملاء عن البرتقالي ليتقدّموا. و«إتمام الشراء» أهم إجراء رئيسي على الإطلاق."

  - id: S06
    type: choose
    speaker: mona
    part: retest
    skill: SK-P02-U02-03
    value:
      en: "Re-test, consistency and standards (NN/g): decide once how forms show things like required fields, and make sure every form is designed the same way."
      ar: "إعادة اختبار، الاتساق والمعايير (NN/g): قرّر مرة واحدة كيف تُظهر النماذج أشياء مثل الحقول المطلوبة، وتأكّد أن كل النماذج مصمّمة بالطريقة نفسها."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "make sure that each form on the site is designed in the same way." }
    scenario:
      en: "Two designers on my team made the sign-up and the checkout forms. Sign-up marks required fields with a red star. Checkout marks the optional ones with \"(optional)\" and nothing on required fields."
      ar: "صمّم مصمّمان في فريقي نموذجَي التسجيل والدفع. نموذج التسجيل يضع نجمة حمراء على الحقول المطلوبة. ونموذج الدفع يكتب «(اختياري)» على الحقول الاختيارية ولا يضع شيئًا على المطلوبة."
    prompt:
      en: "What should the team do?"
      ar: "ماذا يجب أن يفعل الفريق؟"
    mock:
      app: dar
      appbar: { title: { en: "Delivery", ar: "التوصيل" }, back: true }
      blocks:
        - { kind: field, label: { en: "Address", ar: "العنوان" }, text: "" }
        - { kind: field, label: { en: "Floor (optional)", ar: "الدور (اختياري)" }, text: "", gap: m }
        - { kind: field, label: { en: "Phone", ar: "الهاتف" }, text: "", gap: m, note: { en: "Sign-up marks required fields with a red *", ar: "نموذج التسجيل يضع * حمراء على الحقول المطلوبة" } }
      footer:
        - { kind: button, text: { en: "Continue to payment", ar: "تابع إلى الدفع" } }
    options:
      - { id: both, text: { en: "Leave both; each form is clear on its own", ar: "يتركان الاثنين؛ فكل نموذج واضح وحده" } }
      - { id: one, text: { en: "Pick one way, add it to our design system, and use it on every form", ar: "يختاران طريقة واحدة، ويضيفانها إلى الـ Design system، ويستخدمانها في كل النماذج" } }
      - { id: legend, text: { en: "Add a legend at the top of each form explaining its marks", ar: "يضيفان شرحًا أعلى كل نموذج يوضّح علاماته" } }
    answer: [one]
    misconceptions:
      - id: MC-P02-016
        when: [both, legend]
        feedback:
          en: "A customer who learned \"no star means optional\" at sign-up will skip required fields at checkout. Explaining two systems is harder than having one."
          ar: "العميل الذي تعلّم في التسجيل أن «غياب النجمة يعني اختياري» سيتخطّى الحقول المطلوبة في الدفع. وشرح نظامين أصعب من وجود نظام واحد."
    correct:
      en: "One rule, written down, used everywhere."
      ar: "قاعدة واحدة، مكتوبة، تُستخدم في كل مكان."
    explain:
      en: "Putting the choice in the design system means every new form gets it right without anyone deciding again."
      ar: "وضع القرار في الـ Design system يعني أن كل نموذج جديد يلتزم به دون أن يقرّر أحد من جديد."

  # SK-P02-U02-04: follow the conventions people bring from other products
  - id: S07
    type: choose
    speaker: karim
    part: retest
    skill: SK-P02-U02-04
    value:
      en: "Re-test, consistency and standards (NN/g): blue underlined text is clickable, a convention people know from the whole web. Using it for plain emphasis makes people click and get nothing."
      ar: "إعادة اختبار، الاتساق والمعايير (NN/g): النص الأزرق المسطّر قابل للضغط، وهو عُرف يعرفه الناس من الويب كله. واستخدامه للتأكيد فقط يجعل الناس يضغطون فلا يحدث شيء."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "Blue underlined text is clickable" }
    scenario:
      en: "In a news website I'm building, the editors want important phrases in articles to stand out, so they made them blue and underlined. They aren't links."
      ar: "في موقع إخباري أبنيه، يريد المحرّرون أن تبرز العبارات المهمة في المقالات، فجعلوها زرقاء مسطّرة. وهي ليست روابط."
    prompt:
      en: "What should I suggest?"
      ar: "بماذا أقترح؟"
    mock:
      app: khabar
      frame: wide
      url: khabar.example/economy/rent-prices-2026
      navbar: { links: [ { en: "News", ar: "أخبار" }, { en: "Economy", ar: "اقتصاد" }, { en: "Sport", ar: "رياضة" } ], active: 1 }
      blocks:
        - { kind: title, text: { en: "Rents rose 12% this year", ar: "الإيجارات ارتفعت 12% هذا العام" } }
        - { kind: text, text: { en: "Prices rose fastest in **new cities**, while older districts stayed flat. Tenants are moving to **shared flats** to save.", ar: "ارتفعت الأسعار أسرع في **المدن الجديدة**، بينما بقيت الأحياء القديمة ثابتة. ويتجه المستأجرون إلى **الشقق المشتركة** للتوفير." }, gap: m, note: { en: "Bold phrases are blue and underlined, but not links", ar: "العبارات البارزة زرقاء مسطّرة، لكنها ليست روابط" } }
    options:
      - { id: keep, text: { en: "Keep them; readers will get used to it", ar: "تبقى؛ وسيعتاد القرّاء عليها" } }
      - { id: bold, text: { en: "Show important phrases in bold, and keep blue underline for links only", ar: "تُعرض العبارات المهمة بخط عريض، ويبقى الأزرق المسطّر للروابط فقط" } }
      - { id: tip, text: { en: "Keep them, and show \"Not a link\" when people hover", ar: "تبقى، مع ظهور «ليس رابطًا» حين يمرّ الناس عليها بالمؤشر" } }
    answer: [bold]
    misconceptions:
      - id: MC-P02-018
        when: [keep, tip]
        feedback:
          en: "Readers will keep clicking, because every other site taught them that blue underline is a link. Then they'll stop trusting the real links too."
          ar: "سيستمر القرّاء في الضغط، لأن كل المواقع الأخرى علّمتهم أن الأزرق المسطّر رابط. ثم سيتوقفون عن الثقة في الروابط الحقيقية أيضًا."
    correct:
      en: "Leave the link style for links."
      ar: "اترك شكل الرابط للروابط."
    explain:
      en: "Bold gives emphasis without promising a click. Blue underline keeps its one meaning, so real links stay easy to spot."
      ar: "الخط العريض يعطي التأكيد دون أن يعِد بالضغط. ويحتفظ الأزرق المسطّر بمعناه الوحيد، فتبقى الروابط الحقيقية سهلة الرؤية."

  - id: S08
    type: choose
    speaker: hana
    part: retest
    skill: SK-P02-U02-04
    value:
      en: "Re-test, consistency and standards (NN/g): don't reinvent common components such as notifications, modals and pulldown menus. A custom spinning menu makes people learn a new control."
      ar: "إعادة اختبار، الاتساق والمعايير (NN/g): لا تعِد اختراع العناصر الشائعة مثل الإشعارات والنوافذ والقوائم المنسدلة. والقائمة الدوّارة الخاصة تجبر الناس على تعلّم عنصر جديد."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "when it comes to designing common components such as notifications, modals, pulldown menus, and so on." }
    scenario:
      en: "A web agency proposed a fun menu for my gym's website: a wheel that spins to show one section at a time. You drag it to reach the next one."
      ar: "اقترحت شركة تصميم قائمة مرحة لموقع ناديّ: عجلة تدور لتعرض قسمًا واحدًا في كل مرة، وتسحبها لتصل إلى القسم التالي."
    prompt:
      en: "Should I accept it?"
      ar: "هل أقبلها؟"
    mock:
      app: nashat
      frame: wide
      url: nashat.example
      blocks:
        - { kind: image, art: gym, size: m }
        - { kind: icon, icon: circle-notch, size: l, color: brand, gap: m, note: { en: "Drag to spin: one section at a time", ar: "اسحب لتدوير العجلة: قسم واحد في كل مرة" } }
        - { kind: heading, text: { en: "Timetable", ar: "الجدول" }, gap: s }
    options:
      - { id: yes, text: { en: "Yes; it makes the site memorable", ar: "نعم؛ فهي تجعل الموقع لا يُنسى" } }
      - { id: both, text: { en: "Yes, with a short animation showing how to drag it", ar: "نعم، مع حركة قصيرة توضّح كيف تُسحب" } }
      - { id: no, text: { en: "No; ask for a standard menu that shows all sections at once", ar: "لا؛ أطلب قائمة عادية تعرض كل الأقسام مرة واحدة" } }
    answer: [no]
    misconceptions:
      - id: MC-P02-018
        when: [yes, both]
        feedback:
          en: "Visitors come to find the timetable or prices, not to learn a new menu. They can't even see which sections exist until they spin through them."
          ar: "يأتي الزوار ليجدوا الجدول أو الأسعار، لا ليتعلّموا قائمة جديدة. ولا يستطيعون حتى أن يروا الأقسام الموجودة حتى يدوّروها كلها."
    correct:
      en: "Use the menu people already know."
      ar: "استخدم القائمة التي يعرفها الناس أصلًا."
    explain:
      en: "A standard menu shows every section at a glance and works the way visitors expect. Personality can come from photos, colours and words."
      ar: "القائمة العادية تُظهر كل الأقسام من نظرة واحدة وتعمل كما يتوقع الزوار. ويمكن أن تأتي الشخصية من الصور والألوان والكلمات."
