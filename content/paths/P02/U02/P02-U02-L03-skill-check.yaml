id: P02-U02-L03
mode: check
minutes: 6
title:
  en: "Skill check: let people back out, and keep things the same"
  ar: "اختبار المهارة: دَع الناس يتراجعون، واجعل التصميم متّسقًا"
speaker: hana
sources:
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
  - title: { en: "User Control and Freedom (Usability Heuristic #3) (NN/g)", ar: "تحكّم المستخدم وحريته (User control and freedom)، مبدأ الاستخدام 3 (NN/g)" }
    url: "https://www.nngroup.com/articles/user-control-and-freedom/"
  - title: { en: "Consistency and Standards (Usability Heuristic #4) (NN/g)", ar: "الاتساق والمعايير (Consistency and standards)، مبدأ الاستخدام 4 (NN/g)" }
    url: "https://www.nngroup.com/articles/consistency-and-standards/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana's gym, online", ar: "نادي هناء على الإنترنت" }
    mock:
      app: nashat
      appbar: { logo: true, actions: [ { icon: bell } ] }
      tabbar: { active: 0, items: [ { icon: calendar-blank, text: { en: "Classes", ar: "الحصص" } }, { icon: ticket, text: { en: "Bookings", ar: "حجوزاتي" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
      blocks:
        - { kind: card, art: gym, blocks: [ { kind: heading, text: { en: "New: evening Pilates", ar: "جديد: Pilates مسائي" } }, { kind: small, text: { en: "Sun and Wed, 8 pm", ar: "الأحد والأربعاء، 8 م" } } ] }
    body:
      en: "My gym has a new website and app. Before we tell all our members, help me check four things that confused people in our first test.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "للنادي الذي أملكه موقع وتطبيق جديدان. وقبل أن نخبر كل الأعضاء، ساعدني في مراجعة أربعة أشياء أربكت الناس في أول تجربة لنا.\n\nهذا اختبار مهارة: دون تلميحات، وسترى نتيجتك في النهاية."

  - id: S02
    type: choose
    part: check
    skill: SK-P02-U02-01
    value:
      en: "Check, user control and freedom (NN/g): people need a clearly marked emergency exit. A sign-up window with only \"Start free trial\" traps people who just want to look around."
      ar: "اختبار، تحكّم المستخدم وحريته (NN/g): يحتاج الناس إلى مخرج طوارئ واضح. ونافذة التسجيل التي ليس فيها إلا «ابدأ التجربة المجانية» تحبس من يريدون التصفّح فقط."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: 'They need a clearly marked "emergency exit" to leave the unwanted action without having to go through an extended process.' }
    scenario:
      en: "When visitors open our class timetable, a window covers it: \"Start your free week!\" Its only button is **Start free trial**. Many visitors leave the site."
      ar: "حين يفتح الزوار جدول الحصص، تغطّيه نافذة: «ابدأ أسبوعك المجاني!». وزرّها الوحيد **ابدأ التجربة المجانية**. ويغادر كثير من الزوار الموقع."
    prompt:
      en: "What should the window have?"
      ar: "ماذا نضيف إلى النافذة ليصل الزوار إلى الجدول إن لم يريدوا العرض؟"
    mock:
      app: nashat
      frame: wide
      url: nashat.example/timetable
      navbar: { links: [ { en: "Timetable", ar: "الجدول" }, { en: "Prices", ar: "الأسعار" }, { en: "Branches", ar: "الفروع" } ], active: 0 }
      blocks:
        - { kind: table, head: [ { en: "Time", ar: "الوقت" }, { en: "Class", ar: "الحصة" } ], rows: [ [ "6:00 pm", { en: "Yoga", ar: "يوغا" } ], [ "7:00 pm", "Spinning" ] ] }
      overlay:
        type: dialog
        blocks:
          - { kind: image, art: gym, size: s }
          - { kind: heading, text: { en: "Start your free week!", ar: "ابدأ أسبوعك المجاني!" }, gap: s }
          - { kind: button, text: { en: "Start free trial", ar: "ابدأ التجربة المجانية" }, gap: m }
    options:
      - { id: close, text: { en: "A clear ✕ and a \"Just browsing\" link that opens the timetable", ar: "علامة ✕ واضحة ورابط «أتصفّح فقط» يفتح الجدول" } }
      - { id: timer, text: { en: "Close by itself after 15 seconds", ar: "أن تُغلق وحدها بعد 15 ثانية" } }
      - { id: escape, text: { en: "Close when people press the Esc key", ar: "أن تُغلق حين يضغط الناس مفتاح Esc" } }
    answer: [close]
    misconceptions:
      - id: MC-P02-013
        when: [timer, escape]
        feedback:
          en: "Visitors can't see either way out. Most won't wait 15 seconds or guess a key; they'll just leave."
          ar: "لا يرى الزوار أيًّا من الطريقتين للخروج. وأغلبهم لن ينتظروا 15 ثانية ولن يخمّنوا مفتاحًا؛ بل سيغادرون ببساطة."
    correct:
      en: "A visible exit, in words people understand."
      ar: "مخرج ظاهر، بكلمات يفهمها الناس."
    explain:
      en: "The ✕ is where people look to close a window, and \"Just browsing\" says plainly that they can skip the offer and still see the classes."
      ar: "علامة ✕ هي ما يبحث عنه الناس لإغلاق النافذة، و«أتصفّح فقط» تقول بوضوح إنهم يستطيعون تخطّي العرض ورؤية الحصص."

  - id: S03
    type: choose
    part: check
    skill: SK-P02-U02-02
    value:
      en: "Check, user control and freedom (NN/g): support undo. A booking cancelled by a mis-tap, with its spot given away at once, can't be taken back."
      ar: "اختبار، تحكّم المستخدم وحريته (NN/g): ادعم التراجع. والحجز الذي يُلغى بضغطة خاطئة، ويُعطى مكانه لغيره فورًا، لا يمكن استرجاعه."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "Support undo and redo." }
    scenario:
      en: "In the app, **Cancel booking** sits right under the class name. Members sometimes tap it by mistake, and their spot goes at once to the first person on the waiting list."
      ar: "في التطبيق، زر **ألغِ الحجز** تحت اسم الحصة مباشرة. ويضغطه الأعضاء أحيانًا بالخطأ، فيذهب مكانهم فورًا إلى أول شخص في قائمة الانتظار."
    prompt:
      en: "What should happen after the tap?"
      ar: "ماذا يحدث بعد الضغطة حتى لا يخسر العضو مكانه بالخطأ؟"
    mock:
      app: nashat
      appbar: { title: { en: "My bookings", ar: "حجوزاتي" } }
      blocks:
        - kind: card
          blocks:
            - { kind: listitem, art: gym, text: { en: "Spinning · Thu 7 pm", ar: "Spinning · الخميس 7 م" }, sub: { en: "Coach Omar · 18 of 20 spots taken", ar: "المدرّب عمر · حُجز 18 من 20 مكانًا" } }
            - { kind: link, text: { en: "Cancel booking", ar: "ألغِ الحجز" }, style: dangerlink, gap: xs, note: { en: "One tap cancels and gives the spot away", ar: "ضغطة واحدة تلغي وتعطي المكان لغيرك" } }
    options:
      - { id: nothing, text: { en: "Nothing new; members should be more careful", ar: "لا شيء جديد؛ على الأعضاء أن ينتبهوا أكثر" } }
      - { id: undo, text: { en: "Show \"Booking cancelled · Undo\", and hold the spot for a few seconds before passing it on", ar: "يظهر «أُلغي الحجز · تراجع»، ويبقى المكان محجوزًا بضع ثوانٍ قبل أن ينتقل لغيره" } }
      - { id: rebook, text: { en: "Let them join the waiting list again", ar: "يُتاح لهم الانضمام إلى قائمة الانتظار مرة أخرى" } }
    answer: [undo]
    misconceptions:
      - id: MC-P02-014
        when: [nothing, rebook]
        feedback:
          en: "A mis-tap shouldn't cost a member their spot. Going to the back of the waiting list doesn't give it back."
          ar: "يجب ألّا تكلّف الضغطة الخاطئة العضوَ مكانه. والعودة إلى آخر قائمة الانتظار لا تعيده إليه."
    correct:
      en: "Give a visible undo before the change becomes final."
      ar: "أعطِ تراجعًا ظاهرًا قبل أن يصبح التغيير نهائيًا."
    explain:
      en: "Holding the spot for a few seconds makes a real undo possible, and the message offers it right where the member is looking."
      ar: "إبقاء المكان محجوزًا بضع ثوانٍ يجعل التراجع الحقيقي ممكنًا، والرسالة تعرضه حيث ينظر العضو."

  - id: S04
    type: choose
    part: check
    skill: SK-P02-U02-03
    value:
      en: "Check, consistency and standards (NN/g): internal consistency is consistency within a product. One thing with three names in three tabs makes members think they are three things."
      ar: "اختبار، الاتساق والمعايير (NN/g): الاتساق الداخلي هو الاتساق داخل المنتج. والشيء الواحد بثلاثة أسماء في ثلاثة أقسام يجعل الأعضاء يظنون أنه ثلاثة أشياء."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "Internal consistency relates to consistency within a product or a family of products" }
    scenario:
      en: "The same group workouts are called **Classes** in the timetable, **Sessions** in My bookings, and **Workouts** in the receipts."
      ar: "الحصص الجماعية نفسها اسمها **حصص** في الجدول، و**جلسات** في «حجوزاتي»، و**تمارين** في الإيصالات."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل ليعرف أحمد أن طلبه تأخّر؟"
    mock:
      app: nashat
      appbar: { title: { en: "Spinning · Thu 7 pm", ar: "Spinning · الخميس 7 م" }, back: true }
      blocks:
        - { kind: tabs, options: [ { en: "Classes", ar: "حصص" }, { en: "Sessions", ar: "جلسات" }, { en: "Workouts", ar: "تمارين" } ], value: 1, note: { en: "One thing, three names", ar: "شيء واحد بثلاثة أسماء" } }
        - { kind: listitem, icon: receipt, text: { en: "Receipt: 1 workout · EGP 120", ar: "الإيصال: تمرين واحد · 120 جنيه" }, gap: m }
    options:
      - { id: one, text: { en: "Call them \"Classes\" everywhere", ar: "أسمّيها «حصصًا» في كل مكان" } }
      - { id: variety, text: { en: "Keep the variety; it makes the app sound less repetitive", ar: "أُبقي التنوّع؛ فهو يجعل التطبيق أقل تكرارًا" } }
      - { id: glossary, text: { en: "Add a help page explaining that the three words mean the same", ar: "أضيف صفحة مساعدة تشرح أن الكلمات الثلاث تعني الشيء نفسه" } }
    answer: [one]
    misconceptions:
      - id: MC-P02-017
        when: [variety, glossary]
        feedback:
          en: "Members will wonder if a \"session\" is a personal training slot and a \"class\" is a group one. Few will read a help page to find out."
          ar: "سيتساءل الأعضاء إن كانت «الجلسة» تدريبًا شخصيًا و«الحصة» تدريبًا جماعيًا. وقليلون سيقرؤون صفحة مساعدة ليعرفوا."
    correct:
      en: "One name for one thing."
      ar: "اسم واحد لشيء واحد."
    explain:
      en: "\"Classes\" everywhere lets members match what they booked with what they see on the timetable and the receipt, with no doubt."
      ar: "«الحصص» في كل مكان تجعل الأعضاء يربطون ما حجزوه بما يرونه في الجدول والإيصال، دون أي شك."

  - id: S05
    type: choose
    part: check
    skill: SK-P02-U02-04
    value:
      en: "Check, consistency and standards (NN/g): the homepage link is a standard of navigation design; people expect it in the same place on every site."
      ar: "اختبار، الاتساق والمعايير (NN/g): رابط الصفحة الرئيسية من معايير تصميم التنقل؛ ويتوقعه الناس في المكان نفسه في كل موقع."
    ref: { url: "https://www.nngroup.com/articles/consistency-and-standards/", quote: "a standard in navigation design is the homepage link." }
    scenario:
      en: "On our website, the gym's logo sits at the top of every page, but clicking it does nothing. The only Home link is in the footer."
      ar: "في موقعنا، شعار النادي في أعلى كل صفحة، لكن الضغط عليه لا يفعل شيئًا. ورابط «الرئيسية» الوحيد في أسفل الصفحة."
    prompt:
      en: "What should I change?"
      ar: "ماذا أغيّر ليجد الناس طريقة الخروج من الفيديو بسهولة؟"
    mock:
      app: nashat
      frame: wide
      url: nashat.example/prices
      navbar: { links: [ { en: "Timetable", ar: "الجدول" }, { en: "Prices", ar: "الأسعار" }, { en: "Branches", ar: "الفروع" } ], active: 1 }
      blocks:
        - { kind: title, text: { en: "Membership prices", ar: "أسعار الاشتراك" }, note: { en: "Clicking the Nashat logo does nothing", ar: "الضغط على شعار نشاط لا يفعل شيئًا" } }
        - kind: row
          gap: m
          blocks:
            - { kind: card, blocks: [ { kind: heading, text: "Silver" }, { kind: price, text: { en: "EGP 600", ar: "600 جنيه" }, per: { en: "/ month", ar: "/ شهريًا" } } ] }
            - { kind: card, blocks: [ { kind: heading, text: "Gold" }, { kind: price, text: { en: "EGP 900", ar: "900 جنيه" }, per: { en: "/ month", ar: "/ شهريًا" } } ] }
        - { kind: small, text: { en: "Home · About · Contact", ar: "الرئيسية · من نحن · تواصل معنا" }, tone: faint, gap: l }
    options:
      - { id: footer, text: { en: "Nothing; the footer link works", ar: "لا شيء؛ فرابط أسفل الصفحة يعمل" } }
      - { id: logo, text: { en: "Make the logo go to the home page, as on other sites", ar: "أجعل الضغط على الشعار يفتح الصفحة الرئيسية، كما في المواقع الأخرى" } }
      - { id: button, text: { en: "Add a big \"Home\" button in the middle of every page", ar: "أضيف زر «الرئيسية» كبيرًا في وسط كل صفحة" } }
    answer: [logo]
    misconceptions:
      - id: MC-P02-018
        when: [footer, button]
        feedback:
          en: "People bring the habit of clicking the logo from other sites. A link at the very bottom, or a big new button, makes them learn something new instead."
          ar: "اعتاد الناس في المواقع الأخرى أن يضغطوا الشعار. والرابط في أسفل الصفحة، أو زر جديد كبير، يجعلهم يتعلّمون شيئًا جديدًا بدلًا من ذلك."
    correct:
      en: "Follow the habit people already have."
      ar: "اتبع العادة الموجودة أصلًا لدى الناس."
    explain:
      en: "On most sites, the logo at the top is the way home. Making ours work the same means members get home without thinking."
      ar: "في أغلب المواقع، الشعار في الأعلى هو طريق العودة إلى الرئيسية. وجعل شعارنا يعمل بالطريقة نفسها يعني أن الأعضاء يعودون دون تفكير."
