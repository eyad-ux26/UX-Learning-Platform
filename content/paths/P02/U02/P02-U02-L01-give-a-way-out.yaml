id: P02-U02-L01
mode: lesson
minutes: 8
title:
  en: "Give people a way out"
  ar: "أعطِ الناس مخرجًا"
speaker: mona
sources:
  - title: { en: "User Control and Freedom (Usability Heuristic #3) (NN/g)", ar: "تحكّم المستخدم وحريته (مبدأ الاستخدام 3) (NN/g)" }
    url: "https://www.nngroup.com/articles/user-control-and-freedom/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-012: { en: "Back should go back one step", ar: "يجب أن يعيد «رجوع» خطوة واحدة" }
  MC-P02-013: { en: "A hidden exit isn't an exit", ar: "المخرج المخفي ليس مخرجًا" }
  MC-P02-014: { en: "An undo people can't catch doesn't help", ar: "التراجع الذي لا يلحقه الناس لا يساعد" }
  MC-P02-015: { en: "Asking every time is not the same as undo", ar: "السؤال في كل مرة ليس مثل التراجع" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Thirty photos, gone", ar: "ثلاثون صورة ضاعت" }
    mock:
      app: taba
      appbar: { title: { en: "Your prints · 30 photos", ar: "صورك للطباعة · 30 صورة" }, back: true }
      blocks:
        - kind: row
          blocks:
            - { kind: image, art: photo, size: s }
            - { kind: image, art: beach, size: s }
            - { kind: image, art: family, size: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: image, art: city-night, size: s }
            - { kind: image, art: desert, size: s }
            - { kind: image, art: people, size: s }
        - { kind: small, text: { en: "10 × 15 cm · glossy · EGP 240", ar: "10 × 15 سم · لامع · 240 جنيه" }, gap: m }
      footer:
        - { kind: button, text: { en: "Continue to checkout", ar: "تابع إلى الدفع" } }
      overlay:
        type: full
        close: true
        blocks:
          - { kind: image, art: beach, size: xl, note: { en: "Phone Back from here goes to Home", ar: "زر الرجوع في الهاتف من هنا يذهب إلى الرئيسية" } }
    body:
      en: "My team makes a photo printing app. Salma picked 30 photos to print, then opened one to look at it full screen.\n\nTo leave the photo, she pressed her phone's Back button. The app took her all the way to the home screen, and her 30 picks were gone."
      ar: "يصنع فريقي تطبيقًا لطباعة الصور. اختارت سلمى 30 صورة لتطبعها، ثم فتحت واحدة لتراها بملء الشاشة.\n\nولكي تخرج من الصورة، ضغطت زر الرجوع في هاتفها. فأخذها التطبيق إلى الشاشة الرئيسية مباشرة، وضاعت اختياراتها الثلاثون."
  - id: S02
    type: choose
    part: try
    skill: SK-P02-U02-02
    rules: [R12]
    confidence: true
    value:
      en: "Try first. User control and freedom (NN/g): people often take a full-screen overlay for a new page and press Back to leave it. Back should then do what Close does: one step back."
      ar: "جرّب أولًا. تحكّم المستخدم وحريته (NN/g): كثيرًا ما يظن الناس أن النافذة التي تملأ الشاشة صفحة جديدة، فيضغطون «رجوع» ليخرجوا منها. وحينها يجب أن يفعل «رجوع» ما يفعله «إغلاق»: خطوة واحدة إلى الوراء."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "ensure the Back button has the same effect as a Close link." }
    prompt:
      en: "What should happen when Salma presses Back on the full-screen photo?"
      ar: "ماذا يجب أن يحدث حين تضغط سلمى «رجوع» وهي على الصورة بملء الشاشة؟"
    mock:
      app: taba
      appbar: { title: { en: "Photo 7 of 30", ar: "الصورة 7 من 30" } }
      theme: dark
      blocks:
        - { kind: image, art: beach, size: xl }
        - { kind: row, gap: m, blocks: [ { kind: iconbtn, icon: x, aria: { en: "Close", ar: "إغلاق" } }, { kind: small, text: { en: "Phone Back pressed", ar: "ضُغط زر الرجوع في الهاتف" } } ] }
    options:
      - { id: warn, text: { en: "Keep going home, but first ask \"Leave and lose your selection?\"", ar: "يذهب إلى الرئيسية كما هو، لكن بعد سؤال: «هل تغادر وتفقد اختياراتك؟»" } }
      - { id: close, text: { en: "Close the photo and return to her 30 picks, as the ✕ does", ar: "يغلق الصورة ويعيدها إلى اختياراتها الثلاثين، كما يفعل ✕" } }
      - { id: bigger, text: { en: "Make the ✕ bigger so she uses it instead", ar: "يكبّر زر ✕ لتستخدمه بدلًا من «رجوع»" } }
    answer: [close]
    misconceptions:
      - id: MC-P02-012
        when: [warn, bigger]
        feedback:
          en: "Salma didn't want to leave the order. She only wanted to stop looking at one photo. Back should take her one step back, to where she came from."
          ar: "لم تُرد سلمى أن تترك الطلب. أرادت فقط أن تتوقف عن النظر إلى صورة واحدة. ويجب أن يعيدها «رجوع» خطوة واحدة، إلى حيث جاءت."
    hints:
      - en: "Where was Salma just before she opened the photo?"
        ar: "أين كانت سلمى قبل أن تفتح الصورة مباشرة؟"
    correct:
      en: "Back goes back one step: to her picks."
      ar: "«رجوع» يعيد خطوة واحدة: إلى اختياراتها."
    explain:
      en: "To Salma, the full-screen photo looks like a new page, so Back is the natural way out. Making Back act like Close returns her exactly where she expects, with nothing lost."
      ar: "تبدو الصورة بملء الشاشة لسلمى كأنها صفحة جديدة، فيكون «رجوع» هو المخرج الطبيعي. وجعل «رجوع» يعمل مثل «إغلاق» يعيدها بالضبط حيث تتوقع، دون أن تفقد شيئًا."

  - id: S09
    type: video
    part: concept
    title: { en: "User control and freedom", ar: "تحكّم المستخدم وحريته (User control and freedom)" }
    video: f0c82de8-03c9-46aa-af25-3cc102c55ba8
    duration: 116
    transcript:
      - { t: 2.5, en: "Take Wayfair here: when you tap Reviews, a page opens with the review details.", ar: "مثال Wayfair هنا: لما بتضغط على الـ Reviews، بيفتح لك صفحة فيها تفاصيل الـ Reviews." }
      - { t: 10.5, en: "Your first step was opening the website's home page, then you went to the chair, opened the product you liked, and then opened the reviews.", ar: "طبعًا إنت هنا أول خطوة كانت إنك فاتح الـ Home page بتاع الـ Website، وبعدين دخلت على الكرسي، فتحت المنتج اللي إنت مهتم بيه، وبعد كده فتحت الـ Reviews." }
      - { t: 22.5, en: "This is a good example. Why? Because when he pressed Back, it took him back to the product he was on.", ar: "هنا مثال جيد، ليه؟ لأنه لما داس Back رجّعه على المنتج اللي كان فيه." }
      - { t: 28.5, en: "Other apps don't do this. They fall into the problem that pressing Back takes you all the way to the first page, the home page.", ar: "تطبيقات تانية مش بتعمل ده، بتقع في المشكلة إنها لما بيدوس Back بترجّعه لأول صفحة خالص، وهي الـ Home page." }
      - { t: 36.5, en: "And that's your job as a designer: make everything clear, so users know exactly where a tap will take them, even Back.", ar: "ودي من مسؤولياتك كديزاينر: إنك تخلّي كل حاجة واضحة، والمستخدم عارف لما هيضغط هنا هيروح فين بالظبط، حتى الـ Back." }
      - { t: 48.5, en: "People are always used to Back taking them just one step back, so don't make that mistake,", ar: "الـ Back، الناس أو المستخدمين دايمًا متعوّدين إنها بترجّعهم خطوة واحدة بس، فإنت ما تقعش في الغلطة دي،" }
      - { t: 56.5, en: "because it also hurts user control. User control isn't just giving people an exit; it's an exit to the place they expect,", ar: "لأنها برضو بتأثّر على الـ User control. الـ User control مش بس إني أدّيله مخرج، أنا أدّيله مخرج للمكان اللي هو متوقّع يخرج له،" }
      - { t: 66.5, en: "not a Back button that takes them three steps back.", ar: "مش أدّيله زرار Back يرجّعه تلات خطوات." }
      - { t: 70.5, en: "Here's an example that didn't get user control and freedom right. The user is looking for suitable flights,", ar: "ده مثلًا من ضمن الأمثلة اللي ما حقّقتش الـ User control and freedom بشكل جيد. هنا المستخدم بيشوف Flights أو رحلات طيران مناسبة له،" }
      - { t: 80.5, en: "searching and choosing a trip, and starts seeing the available flights. When they go further in and start booking,", ar: "بيدوّر وبيحدّد هو إيه الرحلة، وبيبدأ يشوف رحلات الطيران المتاحة. لما بيبدأ يخش في خطوات أكتر ويبدأ يحجز،" }
      - { t: 88.5, en: "and then decide to go back, they land on the first page, where they start searching for flights,", ar: "ولما بيقرّر المستخدم يرجع، بيرجع لأول صفحة بيبدأ يبحث فيها عن رحلات الطيران،" }
      - { t: 94.5, en: "not on the flights that were available based on the filters they had chosen,", ar: "مش بيرجع لرحلات الطيران اللي كانت متاحة له بناءً على عوامل التصفية اللي هو قرّرها،" }
      - { t: 102.5, en: "so they have to search all over again, instead of picking another option from the results they first got.", ar: "وبناءً عليه هو محتاج يدوّر من أول وجديد، مش يشوف بديل من ضمن النتائج اللي طلعت له في البداية." }

  - id: S03
    type: card
    part: concept
    icons: [cut, layers, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The third heuristic: people often do things by mistake or change their minds, so they need a **clearly marked emergency exit**, like the exit sign in a building.\n\n- **Always give a way out:** Cancel, Close or Back, easy to find and clearly labelled.\n- **Back goes back one step,** to exactly where people came from, not to the start.\n- **Support undo**, and before a risky action, explain what will happen and offer Cancel."
      ar: "المبدأ الثالث: كثيرًا ما يفعل الناس أشياء بالخطأ أو يغيّرون رأيهم، فيحتاجون إلى **مخرج طوارئ واضح**، مثل علامة الخروج في أي مبنى.\n\n- **أعطِ دائمًا طريقًا للخروج:** «إلغاء» أو «إغلاق» أو «رجوع»، سهل الإيجاد وواضح الاسم.\n- **«رجوع» يعيد خطوة واحدة،** إلى حيث جاء الناس بالضبط، لا إلى البداية.\n- **ادعم التراجع (Undo)**، وقبل الإجراء الخطِر، اشرح ما سيحدث واعرض «إلغاء»."

  - id: S04
    type: choose
    part: guided
    skill: SK-P02-U02-01
    rules: [R06]
    value:
      en: "User control and freedom (NN/g): people should be able to cancel a purchase or a money transfer at any point. The Cancel option should be easy to find and quick to use."
      ar: "تحكّم المستخدم وحريته (NN/g): يجب أن يستطيع الناس إلغاء الشراء أو تحويل المال في أي لحظة. وخيار «إلغاء» يجب أن يكون سهل الإيجاد وسريع الاستخدام."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "The Cancel option should be easy to find and quick to execute." }
    scenario:
      en: "Our app also lets people send a photo book as a gift, in four steps. Each step has only a **Continue** button. People who change their minds close the whole app."
      ar: "يتيح تطبيقنا أيضًا إرسال ألبوم صور هديةً، في أربع خطوات. وفي كل خطوة زر **متابعة** فقط. ومن يغيّر رأيه يغلق التطبيق كله."
    prompt:
      en: "What should each step have?"
      ar: "ماذا يجب أن يكون في كل خطوة؟"
    mock:
      app: taba
      appbar: { title: { en: "Send a photo book", ar: "أرسل ألبوم صور" } }
      blocks:
        - { kind: progress, value: 50, label: { en: "Step 2 of 4", ar: "الخطوة 2 من 4" } }
        - { kind: heading, text: { en: "Who is it for?", ar: "لمن الهدية؟" }, gap: m }
        - { kind: field, label: { en: "Name", ar: "الاسم" }, text: { en: "e.g. Nada", ar: "مثال: ندى" }, gap: s }
        - { kind: field, label: { en: "Address", ar: "العنوان" }, text: { en: "Street, building, flat", ar: "الشارع، العمارة، الشقة" }, gap: m }
      footer:
        - { kind: button, text: { en: "Continue", ar: "متابعة" }, note: { en: "The only button on every step", ar: "الزر الوحيد في كل خطوة" } }
    options:
      - { id: back, text: { en: "Nothing new: the phone's Back button can undo the steps one by one", ar: "لا شيء جديد: زر الرجوع في الهاتف يستطيع التراجع عن الخطوات واحدة واحدة" } }
      - { id: cancel, text: { en: "A \"Cancel\" link next to Continue, and a \"Back\" at the top", ar: "رابط «إلغاء» بجانب «متابعة»، و«رجوع» في الأعلى" } }
      - { id: x, text: { en: "A small ✕ in the corner of the last step only", ar: "علامة ✕ صغيرة في زاوية الخطوة الأخيرة فقط" } }
    answer: [cancel]
    misconceptions:
      - id: MC-P02-013
        when: [back, x]
        feedback:
          en: "Pressing Back three times to quit is slow, and many people don't know it works. A ✕ only at the end comes too late. The exit has to be visible on every step."
          ar: "الضغط على «رجوع» ثلاث مرات للخروج بطيء، وكثير من الناس لا يعرفون أنه يعمل. و✕ في النهاية فقط تأتي متأخرة. يجب أن يكون المخرج ظاهرًا في كل خطوة."
    hints:
      - en: "How many taps does it take to quit from step 3 right now?"
        ar: "كم ضغطة يحتاجها الخروج من الخطوة 3 الآن؟"
    correct:
      en: "A visible Cancel on every step."
      ar: "زر «إلغاء» ظاهر في كل خطوة."
    explain:
      en: "Cancel lets people quit in one tap from any step, and Back lets them fix the step before. Knowing they can get out makes people more willing to start."
      ar: "«إلغاء» يتيح للناس الخروج بضغطة واحدة من أي خطوة، و«رجوع» يتيح لهم تعديل الخطوة السابقة. ومعرفة أنهم يستطيعون الخروج تجعل الناس أكثر استعدادًا للبدء."

  - id: S05
    type: choose
    part: guided
    skill: SK-P02-U02-02
    rules: [R06]
    value:
      en: "User control and freedom (NN/g): give people a visible option to undo, where they expect it, and long enough to use. An Undo that vanishes in three seconds only helps those who are very quick."
      ar: "تحكّم المستخدم وحريته (NN/g): أعطِ الناس خيار تراجع ظاهرًا، في المكان الذي يتوقعونه، ولمدة تكفي لاستخدامه. والتراجع الذي يختفي في ثلاث ثوانٍ لا يساعد إلا السريعين جدًا."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "give users a visible option to undo an action on the UI" }
    scenario:
      en: "People can delete photos from an album. A small \"Undo\" appears for three seconds, then the photos are gone for good. We get many sad emails."
      ar: "يستطيع الناس حذف صور من الألبوم. يظهر «تراجع» صغير لثلاث ثوانٍ، ثم تُحذف الصور نهائيًا. وتصلنا رسائل حزينة كثيرة."
    prompt:
      en: "What should we change?"
      ar: "ماذا نغيّر؟"
    mock:
      app: suwar
      appbar: { title: { en: "Summer 2026", ar: "صيف 2026" }, back: true, actions: [ { icon: dots-three-vertical } ] }
      blocks:
        - kind: row
          blocks:
            - { kind: image, art: beach, size: s }
            - { kind: image, art: photo, size: s }
            - { kind: image, art: cafe, size: s }
      overlay:
        type: toast
        blocks:
          - { kind: row, blocks: [ { kind: text, text: { en: "3 photos deleted", ar: "حُذفت 3 صور" } }, { kind: link, text: { en: "Undo", ar: "تراجع" } } ], note: { en: "Disappears after 3 s", ar: "يختفي بعد 3 ثوانٍ" } }
    options:
      - { id: dialog, text: { en: "Ask \"Delete these photos?\" before every delete", ar: "نسأل «هل تحذف هذه الصور؟» قبل كل حذف" } }
      - { id: longer, text: { en: "Keep Undo on screen for about ten seconds, and keep deleted photos in \"Recently deleted\" for 30 days", ar: "نُبقي «تراجع» على الشاشة نحو عشر ثوانٍ، ونحتفظ بالصور المحذوفة في «المحذوفة مؤخرًا» 30 يومًا" } }
      - { id: shake, text: { en: "Let people shake the phone to undo", ar: "نتيح للناس هزّ الهاتف للتراجع" } }
    answer: [longer]
    misconceptions:
      - id: MC-P02-015
        when: [dialog]
        feedback:
          en: "A question before every delete gets in the way of people who delete a lot, and they learn to tap Yes without reading. It also can't help someone who regrets it tomorrow."
          ar: "السؤال قبل كل حذف يعطّل من يحذفون كثيرًا، فيتعلّمون ضغط «نعم» دون قراءة. ولا يساعد من يندم غدًا."
      - id: MC-P02-014
        when: [shake]
        feedback:
          en: "Shaking is invisible: most people never find out it exists, so they still can't get their photos back."
          ar: "الهزّ غير ظاهر: أغلب الناس لا يعرفون أصلًا أنه موجود، فلا يستطيعون استعادة صورهم."
    hints:
      - en: "When do people usually notice they deleted the wrong photo?"
        ar: "متى يلاحظ الناس عادة أنهم حذفوا الصورة الخطأ؟"
    correct:
      en: "Make undo visible, and long enough to use."
      ar: "اجعل التراجع ظاهرًا، ولمدة تكفي لاستخدامه."
    explain:
      en: "Ten seconds catches a wrong tap, and \"Recently deleted\" catches the regret that comes later. People stay in control without being stopped every time."
      ar: "عشر ثوانٍ تكفي للحاق بضغطة خاطئة، و«المحذوفة مؤخرًا» تلحق بالندم الذي يأتي لاحقًا. فيبقى الناس متحكّمين دون أن يُوقَفوا في كل مرة."

  - id: S06
    type: compare
    speaker: rami
    part: contrast
    skill: SK-P02-U02-01
    rules: [R11]
    value:
      en: "User control and freedom (NN/g): make exits easy to find and understand. Add a text label to the exit icon, or use plain words such as Back and Close."
      ar: "تحكّم المستخدم وحريته (NN/g): اجعل المخارج سهلة الإيجاد والفهم. أضِف اسمًا مكتوبًا إلى أيقونة الخروج، أو استخدم كلمات واضحة مثل «رجوع» و«إغلاق»."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "Accompany icons with text labels or substitute icons with plain text." }
    scenario:
      en: "I'm designing the settings screen of a learning app. Many older learners say they get stuck inside it."
      ar: "أصمّم شاشة الإعدادات في تطبيق تعليمي. ويقول كثير من المتعلمين الأكبر سنًا إنهم يعلقون داخلها."
    prompt:
      en: "Which version helps them get out?"
      ar: "أيّ نسخة تساعدهم على الخروج؟"
    a:
      label: { en: "Version A: an icon only", ar: "النسخة A: أيقونة فقط" }
      mock:
        app: mozakra
        appbar: { title: { en: "Settings", ar: "الإعدادات" } }
        blocks:
          - { kind: small, text: "‹", tone: faint }
          - { kind: listitem, icon: bell, text: { en: "Daily reminder", ar: "تذكير يومي" }, toggle: true, gap: s }
          - { kind: listitem, icon: speaker-high, text: { en: "Sound effects", ar: "المؤثرات الصوتية" }, toggle: false, gap: s }
          - { kind: listitem, icon: text-aa, text: { en: "Text size", ar: "حجم الخط" }, value: { en: "Large", ar: "كبير" }, chevron: true, gap: s }
    b:
      label: { en: "Version B: icon and word", ar: "النسخة B: أيقونة وكلمة" }
      mock:
        app: mozakra
        appbar: { title: { en: "Settings", ar: "الإعدادات" }, back: true }
        blocks:
          - { kind: link, icon: caret-left, text: { en: "Back", ar: "رجوع" } }
          - { kind: listitem, icon: bell, text: { en: "Daily reminder", ar: "تذكير يومي" }, toggle: true, gap: s }
          - { kind: listitem, icon: speaker-high, text: { en: "Sound effects", ar: "المؤثرات الصوتية" }, toggle: false, gap: s }
          - { kind: listitem, icon: text-aa, text: { en: "Text size", ar: "حجم الخط" }, value: { en: "Large", ar: "كبير" }, chevron: true, gap: s }
    answer: b
    misconceptions:
      - id: MC-P02-013
        when: [a]
        feedback:
          en: "A thin \"‹\" in grey is easy to miss and doesn't say what it does. For many people, that means no way out."
          ar: "علامة «‹» رفيعة رمادية سهلة التفويت، ولا تقول ما تفعله. وهذا يعني عند كثير من الناس أنه لا مخرج."
    correct:
      en: "B: the exit says what it is."
      ar: "B: المخرج يقول ما هو."
    explain:
      en: "\"‹ Back\" is easy to spot and leaves no doubt. An exit only works if people notice it and trust what it will do."
      ar: "«‹ رجوع» سهلة الرؤية ولا تترك أي شك. فالمخرج لا ينفع إلا إذا لاحظه الناس ووثقوا بما سيفعله."

  - id: S07
    type: choose
    speaker: youssef
    part: independent
    skill: SK-P02-U02-02
    rules: [R14]
    confidence: true
    value:
      en: "User control and freedom (NN/g): whenever people open a new page or view, they should be able to go back to where they came from. Back from a product should return to the filtered results, not to the start."
      ar: "تحكّم المستخدم وحريته (NN/g): كلما فتح الناس صفحة أو شاشة جديدة، يجب أن يستطيعوا العودة إلى حيث جاؤوا. والرجوع من صفحة المنتج يجب أن يعيدهم إلى النتائج المفلترة، لا إلى البداية."
    ref: { url: "https://www.nngroup.com/articles/user-control-and-freedom/", quote: "Whenever users click a link to open a new page, screen or view, they should always be able to go back to where they came from." }
    scenario:
      en: "In my online shop, a customer filters drills by price and brand, then opens one. When she taps Back, she lands on the shop's home page, and her filters are gone."
      ar: "في متجري الإلكتروني، تفلتر عميلة المثاقب حسب السعر والماركة، ثم تفتح واحدًا منها. وحين تضغط «رجوع»، تصل إلى الصفحة الرئيسية للمتجر، وتضيع فلاترها."
    prompt:
      en: "Where should Back take her?"
      ar: "إلى أين يجب أن يأخذها «رجوع»؟"
    mock:
      app: dar
      appbar: { logo: true, actions: [ { icon: magnifying-glass }, { icon: shopping-cart } ] }
      tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: squares-four, text: { en: "Departments", ar: "الأقسام" } }, { icon: user, text: { en: "Account", ar: "حسابي" } } ] }
      blocks:
        - { kind: searchbar, text: { en: "Search Dar", ar: "ابحث في دار" }, note: { en: "After Back from the drill", ar: "بعد «رجوع» من صفحة المثقاب" } }
        - { kind: card, art: washing-machine, blocks: [ { kind: heading, text: { en: "Washers week", ar: "أسبوع الغسالات" } }, { kind: small, text: { en: "Up to 20% off", ar: "خصم حتى 20%" } } ], gap: m }
        - kind: chips
          gap: m
          items:
            - { text: { en: "Tools", ar: "أدوات" } }
            - { text: { en: "Kitchen", ar: "المطبخ" } }
            - { text: { en: "Shoes", ar: "أحذية" } }
    options:
      - { id: home, text: { en: "The home page, so she can start a fresh search", ar: "الصفحة الرئيسية، لتبدأ بحثًا جديدًا" } }
      - { id: results, text: { en: "The drill results, with her price and brand filters still set", ar: "نتائج المثاقب، مع بقاء فلاتر السعر والماركة" } }
      - { id: category, text: { en: "The Tools category page, without filters", ar: "صفحة قسم الأدوات، دون فلاتر" } }
    answer: [results]
    misconceptions:
      - id: MC-P02-012
        when: [home, category]
        feedback:
          en: "She wanted to compare this drill with the others she found. Sending her further back makes her filter everything again."
          ar: "أرادت أن تقارن هذا المثقاب بالمثاقب الأخرى التي وجدتها. وإرجاعها أبعد من ذلك يجعلها تفلتر كل شيء من جديد."
    hints:
      - en: "What was on her screen just before she opened the drill?"
        ar: "ماذا كان على شاشتها قبل أن تفتح المثقاب مباشرة؟"
    correct:
      en: "Back to exactly where she was."
      ar: "رجوع إلى حيث كانت بالضبط."
    explain:
      en: "People expect Back to undo their last move only. Returning her to the same results, filters and all, lets her keep comparing."
      ar: "يتوقع الناس أن «رجوع» يلغي آخر خطوة فقط. وإعادتها إلى النتائج نفسها، بفلاترها كلها، تتيح لها أن تكمل المقارنة."

  - id: S08
    type: card
    part: recap
    icons: [cut, layers, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Always leave a clear exit:** Cancel, Close or Back on every step, with words, not just an icon.\n- **Back means one step back,** to exactly where people were, with their choices kept.\n- **Make undo visible and long enough,** and keep deleted things for a while.\n\nNext: keep things the same, inside your product and with others."
      ar: "- **اترك دائمًا مخرجًا واضحًا:** «إلغاء» أو «إغلاق» أو «رجوع» في كل خطوة، بكلمات لا بأيقونة فقط.\n- **«رجوع» يعني خطوة واحدة،** إلى حيث كان الناس بالضبط، مع بقاء اختياراتهم.\n- **اجعل التراجع ظاهرًا ولمدة كافية،** واحتفظ بالأشياء المحذوفة فترة.\n\nالتالي: أبقِ الأشياء كما هي، داخل منتجك ومع المنتجات الأخرى."
