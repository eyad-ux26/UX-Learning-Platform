id: P02-U01
free: true
title:
  en: "Keep people informed, in their words"
  ar: "أخبِر الناس بما يحدث، بكلماتهم"
skill:
  en: "Find and fix screens that leave people guessing what happened, or that speak in terms and orders people don't use (heuristics 1 and 2)."
  ar: "اكتشف وأصلح الشاشات التي تترك الناس يخمّنون ما حدث، أو تتكلم بمصطلحات وترتيب لا يستخدمه الناس (المبدآن 1 و2: وضوح حالة النظام (Visibility of system status)، وتطابق النظام مع العالم الحقيقي (Match between the system and the real world))."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P02-U01-01
    title: { en: "Show the result of every action, right away", ar: "أظهِر نتيجة كل إجراء فورًا" }
    can_do: { en: "Give immediate, visible feedback when people act, and show progress (a spinner for a short wait, steps or a percentage for a long one) so they never wonder if it worked.", ar: "أظهِر ردًّا فوريًا (Feedback) على كل ما يفعله الناس، وأظهِر التقدّم (مؤشر دوّار لانتظار قصير، وخطوات أو نسبة لانتظار طويل) حتى لا يتساءلوا إن كان الإجراء قد نجح." }
  - id: SK-P02-U01-02
    title: { en: "Tell people about changes that affect them", ar: "أخبِر الناس بالتغييرات التي تؤثر فيهم" }
    can_do: { en: "Never let something that matters to people change silently: say what changed, where it happened, and what they can do now.", ar: "لا تدَع شيئًا يهمّ الناس يتغيّر بصمت: قل ما الذي تغيّر، وأين حدث، وما الذي يستطيعون فعله الآن." }
  - id: SK-P02-U01-03
    title: { en: "Use the words your users use", ar: "استخدم الكلمات التي يستخدمها مستخدموك" }
    can_do: { en: "Replace internal jargon, technical terms and unexplained abbreviations with the words people use for the same thing.", ar: "اكتب الكلمات التي يستخدمها الناس بدل المصطلحات الداخلية والتقنية والاختصارات غير المشروحة." }
  - id: SK-P02-U01-04
    title: { en: "Follow the order and conventions people know", ar: "اتبع الترتيب والعادات المألوفة (Conventions) التي يعرفها الناس" }
    can_do: { en: "Organize information the way your users already do in their work and life, and keep familiar controls and symbols looking like what people expect.", ar: "رتّب المعلومات كما يرتّبها مستخدموك أصلًا في عملهم وحياتهم، واجعل العناصر والرموز المألوفة تبدو كما يتوقعها الناس." }
