id: P02-U01-B01
mode: bank
title:
  en: "Re-tests: keep people informed, in their words"
  ar: "إعادة اختبار: أخبِر الناس بما يحدث، بكلماتهم"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Visibility of System Status (Usability Heuristic #1) (NN/g)", ar: "وضوح حالة النظام (Visibility of system status)، مبدأ الاستخدام 1 (NN/g)" }
    url: "https://www.nngroup.com/articles/visibility-system-status/"
  - title: { en: "Progress Indicators Make a Slow System Less Insufferable (NN/g)", ar: "مؤشرات التقدّم تجعل النظام البطيء أقل إزعاجًا (NN/g)" }
    url: "https://www.nngroup.com/articles/progress-indicators/"
  - title: { en: "Match Between the System and the Real World (Usability Heuristic #2) (NN/g)", ar: "تطابق النظام مع العالم الحقيقي (Match between the system and the real world)، مبدأ الاستخدام 2 (NN/g)" }
    url: "https://www.nngroup.com/articles/match-system-real-world/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
steps:
  # SK-P02-U01-01: show the result of every action, right away
  - id: S01
    type: tune
    speaker: karim
    part: retest
    skill: SK-P02-U01-01
    value:
      en: "Re-test, visibility of system status (NN/g): feedback can be as simple as a change on the button people pressed. A note app that saves with no sign leaves people pressing Save again and again."
      ar: "إعادة اختبار، ظهور حالة النظام (NN/g): قد يكون الردّ بسيطًا مثل تغيير على الزر الذي ضغطه الناس. وتطبيق الملاحظات الذي يحفظ دون أي علامة يجعل الناس يضغطون «احفظ» مرة بعد مرة."
    ref: { url: "https://www.nngroup.com/articles/visibility-system-status/", quote: "Such feedback can be as simple as a change of color once the user has clicked on a button" }
    scenario:
      en: "I'm building a note-taking app. When people tap **Save**, the note saves in a moment, but nothing on the screen changes. People tap Save three or four times to be sure."
      ar: "أبني تطبيقًا لتدوين الملاحظات. حين يضغط الناس **احفظ**، تُحفظ الملاحظة في لحظة، لكن لا يتغيّر شيء على الشاشة. فيضغط الناس «احفظ» ثلاث أو أربع مرات ليتأكدوا."
    prompt:
      en: "What's the right feedback?"
      ar: "ما الـ Feedback (الإشارة على الشاشة) التي تُخبر الناس أن الملاحظة حُفظت؟"
    mock:
      app: satr
      appbar: { title: { en: "Shopping list", ar: "قائمة المشتريات" }, back: true, actions: [ { icon: floppy-disk, aria: { en: "Save", ar: "احفظ" } } ] }
      keyboard: text
      blocks:
        - { kind: text, text: { en: "Milk, eggs, bread\nRice 2 kg\nTomatoes", ar: "حليب، بيض، عيش\nأرز 2 كجم\nطماطم" } }
        - { kind: small, text: { en: "Save tapped 3 times, no change on screen", ar: "ضغطوا «احفظ» 3 مرات، ولم يتغيّر شيء على الشاشة" }, tone: faint, gap: m }
    options:
      - id: dialog
        text: {"en": "A dialog: \"Your note was saved\", with OK", "ar": "نافذة منبثقة (Dialog): «حُفظت ملاحظتك»، مع زر «حسنًا»"}
        mock:
          app: "satr"
          appbar: {"title": {"en": "Shopping list", "ar": "قائمة المشتريات"}, "back": true, "actions": [{"icon": "floppy-disk", "aria": {"en": "Save", "ar": "احفظ"}}]}
          keyboard: "text"
          blocks:
            - {"kind": "text", "text": {"en": "Milk, eggs, bread\nRice 2 kg\nTomatoes", "ar": "حليب، بيض، عيش\nأرز 2 كجم\nطماطم"}}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Your note was saved", "ar": "حُفظت ملاحظتك"}}, {"kind": "button", "text": {"en": "OK", "ar": "حسنًا"}, "gap": "m"}]}
      - id: inline
        text: {"en": "The button turns into \"✓ Saved\", and \"Saved just now\" appears under the title", "ar": "يتحوّل الزر إلى «✓ حُفظت»، ويظهر «حُفظت الآن» تحت العنوان"}
        mock:
          app: "satr"
          appbar: {"title": {"en": "Shopping list", "ar": "قائمة المشتريات"}, "back": true, "actions": [{"icon": "check-circle", "aria": {"en": "Saved", "ar": "حُفظت"}}]}
          keyboard: "text"
          blocks:
            - {"kind": "small", "icon": "check", "text": {"en": "✓ Saved just now", "ar": "✓ حُفظت الآن"}, "color": "green"}
            - {"kind": "text", "text": {"en": "Milk, eggs, bread\nRice 2 kg\nTomatoes", "ar": "حليب، بيض، عيش\nأرز 2 كجم\nطماطم"}}
      - id: none
        text: {"en": "Nothing; saving is so fast that people don't need to know", "ar": "لا شيء؛ فالحفظ سريع جدًا ولا يحتاج الناس إلى معرفته"}
        mock:
          app: "satr"
          appbar: {"title": {"en": "Shopping list", "ar": "قائمة المشتريات"}, "back": true, "actions": [{"icon": "floppy-disk", "aria": {"en": "Save", "ar": "احفظ"}}]}
          keyboard: "text"
          blocks:
            - {"kind": "text", "text": {"en": "Milk, eggs, bread\nRice 2 kg\nTomatoes", "ar": "حليب، بيض، عيش\nأرز 2 كجم\nطماطم"}}
            - {"kind": "small", "text": {"en": "Save tapped 3 times, no change on screen", "ar": "ضغطوا «احفظ» 3 مرات، ولم يتغيّر شيء على الشاشة"}, "tone": "faint", "gap": "m"}
    answer: [inline]
    misconceptions:
      - id: MC-P02-006
        when: [dialog]
        feedback:
          en: "A dialog for every save stops people's writing to make them tap OK. A quick change in place says the same thing without stopping them."
          ar: "نافذة مع كل حفظ توقف الكتابة لتجبر الناس على ضغط «حسنًا». أما التغيير السريع في مكان الضغط فيوصل الرسالة نفسها دون أن يوقفهم."
      - id: MC-P02-002
        when: [none]
        feedback:
          en: "Fast or not, people can't see that it saved. That's why they keep tapping."
          ar: "سريعًا كان أم لا، لا يرى الناس أن الملاحظة حُفظت. ولهذا يستمرون في الضغط."
    correct:
      en: "A small, quick change where people tapped."
      ar: "تغيير صغير سريع حيث ضغط الناس."
    explain:
      en: "\"✓ Saved\" answers the tap at once, and \"Saved just now\" stays as a reminder, so nobody needs to tap again."
      ar: "«✓ حُفظت» تردّ على الضغطة فورًا، و«حُفظت الآن» تبقى تذكيرًا، فلا يحتاج أحد إلى الضغط مرة أخرى."

  - id: S02
    type: tune
    speaker: mona
    part: retest
    skill: SK-P02-U01-01
    value:
      en: "Re-test, progress indicators (NN/g): percent-done indicators are the most informative wait feedback. A three-minute export needs one; a spinner leaves people guessing."
      ar: "إعادة اختبار، مؤشرات التقدّم (NN/g): مؤشرات النسبة المنجزة أكثر أنواع ردود الانتظار إفادة. والتصدير الذي يستغرق ثلاث دقائق يحتاج إليها؛ أما المؤشر الدوّار فيترك الناس يخمّنون."
    ref: { url: "https://www.nngroup.com/articles/progress-indicators/", quote: "Percent-done progress indicators are the most informative type of wait-animation feedback." }
    scenario:
      en: "My team makes a video editing website. Exporting a finished video takes about three minutes. Right now we show a spinning circle, and many people close the tab thinking it froze."
      ar: "يصنع فريقي موقعًا لتحرير الفيديو. وتصدير الفيديو النهائي يستغرق نحو ثلاث دقائق. نعرض الآن دائرة تدور، ويغلق كثير من الناس الصفحة ظانّين أنها توقفت."
    prompt:
      en: "What should we show instead?"
      ar: "ماذا نعرض بدلًا منها؟"
    mock:
      app: { name: { en: "Montaj", ar: "مونتاج" }, color: "#9333EA", icon: film-strip, domain: montaj.example }
      frame: wide
      url: montaj.example/projects/wedding-film/export
      blocks:
        - { kind: image, art: photo, size: l }
        - { kind: title, text: { en: "Exporting \"Wedding film\"", ar: "جارٍ تصدير «فيلم الزفاف»" }, gap: m }
        - { kind: icon, icon: spinner-gap, size: l, color: brand, gap: m, note: { en: "Spinning for 1 minute", ar: "يدور منذ دقيقة" } }
    options:
      - id: bigger
        text: {"en": "A bigger spinner with \"Almost there…\"", "ar": "دائرة أكبر مع «اقتربنا…»"}
        mock:
          app: {"name": {"en": "Montaj", "ar": "مونتاج"}, "color": "#9333EA", "icon": "film-strip", "domain": "montaj.example"}
          frame: "wide"
          url: "montaj.example/projects/wedding-film/export"
          blocks:
            - {"kind": "image", "art": "photo", "size": "l"}
            - {"kind": "title", "text": {"en": "Exporting \"Wedding film\"", "ar": "جارٍ تصدير «فيلم الزفاف»"}, "gap": "m"}
            - {"kind": "icon", "icon": "spinner-gap", "size": "xl", "color": "brand", "gap": "m", "note": {"en": "Spinning for 1 minute", "ar": "يدور منذ دقيقة"}}
            - {"kind": "small", "text": {"en": "Almost there…", "ar": "اقتربنا…"}, "gap": "s"}
      - id: percent
        text: {"en": "A bar with \"Exporting: 45% · about 2 minutes left\"", "ar": "شريط مع «جارٍ التصدير: 45% · بقي نحو دقيقتين»"}
        mock:
          app: {"name": {"en": "Montaj", "ar": "مونتاج"}, "color": "#9333EA", "icon": "film-strip", "domain": "montaj.example"}
          frame: "wide"
          url: "montaj.example/projects/wedding-film/export"
          blocks:
            - {"kind": "image", "art": "photo", "size": "l"}
            - {"kind": "title", "text": {"en": "Exporting \"Wedding film\"", "ar": "جارٍ تصدير «فيلم الزفاف»"}, "gap": "m"}
            - {"kind": "progress", "value": 45, "label": {"en": "Exporting: 45% · about 2 minutes left", "ar": "جارٍ التصدير: 45% · بقي نحو دقيقتين"}, "gap": "m"}
      - id: tips
        text: {"en": "Video editing tips that change every few seconds", "ar": "نصائح في تحرير الفيديو تتغيّر كل بضع ثوانٍ"}
        mock:
          app: {"name": {"en": "Montaj", "ar": "مونتاج"}, "color": "#9333EA", "icon": "film-strip", "domain": "montaj.example"}
          frame: "wide"
          url: "montaj.example/projects/wedding-film/export"
          blocks:
            - {"kind": "image", "art": "photo", "size": "l"}
            - {"kind": "title", "text": {"en": "Exporting \"Wedding film\"", "ar": "جارٍ تصدير «فيلم الزفاف»"}, "gap": "m"}
            - {"kind": "icon", "icon": "spinner-gap", "size": "l", "color": "brand", "gap": "m"}
            - {"kind": "tip", "text": {"en": "Tip: press J, K and L to move through your clips faster.", "ar": "نصيحة: اضغط J وK وL لتتنقّل بين المقاطع أسرع."}, "gap": "m", "note": {"en": "A new tip every 5 s", "ar": "نصيحة جديدة كل 5 ثوانٍ"}}
    answer: [percent]
    misconceptions:
      - id: MC-P02-003
        when: [bigger, tips]
        feedback:
          en: "People still can't tell how far along the export is. After a minute of not knowing, many will still give up."
          ar: "ما زال الناس لا يعرفون إلى أين وصل التصدير. وبعد دقيقة من الحيرة، سيترك كثيرون الصفحة."
    correct:
      en: "A long wait needs a percentage and time left."
      ar: "الانتظار الطويل يحتاج إلى نسبة ووقت متبقٍّ."
    explain:
      en: "The bar shows the export moving, and \"2 minutes left\" lets people decide to wait or do something else and come back."
      ar: "الشريط يُظهر أن التصدير يتقدّم، و«بقي نحو دقيقتين» تساعد الناس على أن يقرّروا: ينتظرون، أو ينشغلون بشيء آخر ثم يعودون."

  # SK-P02-U01-02: tell people about changes that affect them
  - id: S03
    type: tune
    speaker: sara
    part: retest
    skill: SK-P02-U01-02
    value:
      en: "Re-test, visibility of system status (NN/g): no action with consequences to users should happen without telling them. A different driver and car must show on the trip screen."
      ar: "إعادة اختبار، ظهور حالة النظام (NN/g): يجب ألّا يحدث أي إجراء يؤثّر في المستخدمين دون أن نُخبرهم. فإذا تغيّر السائق والسيارة، يجب أن يظهر ذلك في شاشة الرحلة."
    ref: { url: "https://www.nngroup.com/articles/visibility-system-status/", quote: "no action with consequences to users should be taken without informing them." }
    scenario:
      en: "I'm designing a ride app. Sometimes a driver cancels and we quietly give the ride to another driver nearby. The trip screen keeps showing the first car: a white Toyota."
      ar: "أصمّم تطبيقًا لطلب السيارات. أحيانًا يلغي السائق، فنعطي الرحلة لسائق آخر قريب دون أن نُخبر الراكب. وتظل شاشة الرحلة تعرض السيارة الأولى: تويوتا بيضاء."
    prompt:
      en: "What should the rider see when the driver changes?"
      ar: "ماذا يجب أن يرى الراكب حين يتغيّر السائق؟"
    mock:
      app: mishwar
      appbar: { title: { en: "Your ride", ar: "مشوارك" } }
      blocks:
        - { kind: image, art: map-route, size: l }
        - { kind: listitem, avatar: { text: "Mahmoud", art: man-2 }, text: { en: "Mahmoud · ★ 4.9", ar: "محمود · ★ 4.9" }, sub: { en: "White Toyota Corolla · ق ص 4721", ar: "تويوتا كورولا بيضاء · ق ص 4721" }, value: { en: "3 min", ar: "3 د" }, gap: m }
        - { kind: small, text: { en: "Mahmoud cancelled; Karim's grey Hyundai is coming.", ar: "ألغى محمود الرحلة، وكريم في الطريق بسيارة هيونداي رمادية." }, tone: faint, gap: s, note: { en: "Known to the app, not shown", ar: "يعرفه التطبيق، ولا يظهر" } }
    options:
      - id: same
        text: {"en": "Nothing new; a car is still coming", "ar": "لا شيء جديد؛ فما زالت هناك سيارة قادمة"}
        mock:
          app: "mishwar"
          appbar: {"title": {"en": "Your ride", "ar": "مشوارك"}}
          blocks:
            - {"kind": "image", "art": "map-route", "size": "l"}
            - {"kind": "listitem", "avatar": {"text": "Mahmoud", "art": "man-2"}, "text": {"en": "Mahmoud · ★ 4.9", "ar": "محمود · ★ 4.9"}, "sub": {"en": "White Toyota Corolla · ق ص 4721", "ar": "تويوتا كورولا بيضاء · ق ص 4721"}, "value": {"en": "3 min", "ar": "3 د"}, "gap": "m"}
            - {"kind": "small", "text": {"en": "Mahmoud cancelled; Karim's grey Hyundai is coming.", "ar": "ألغى محمود الرحلة، وكريم في الطريق بسيارة هيونداي رمادية."}, "tone": "faint", "gap": "s", "note": {"en": "Known to the app, not shown", "ar": "يعرفه التطبيق، ولا يظهر"}}
      - id: update
        text: {"en": "\"Your driver changed\", with the new driver's name, car, plate and arrival time", "ar": "«تغيّر سائقك»، مع اسم السائق الجديد وسيارته ورقم اللوحة وموعد الوصول"}
        mock:
          app: "mishwar"
          appbar: {"title": {"en": "Your ride", "ar": "مشوارك"}}
          blocks:
            - {"kind": "image", "art": "map-route", "size": "l"}
            - {"kind": "banner", "tone": "info", "icon": "arrows-clockwise", "text": {"en": "Your driver changed: Karim is on the way", "ar": "تغيّر سائقك: كريم في الطريق إليك"}, "gap": "m"}
            - {"kind": "listitem", "avatar": {"text": "Karim", "art": "man-1"}, "text": {"en": "Karim · ★ 4.8", "ar": "كريم · ★ 4.8"}, "sub": {"en": "Grey Hyundai Elantra · ن ر 2954", "ar": "هيونداي إلنترا رمادية · ن ر 2954"}, "value": {"en": "5 min", "ar": "5 د"}, "gap": "s"}
      - id: later
        text: {"en": "Tell them in the trip receipt afterwards", "ar": "نخبره في إيصال الرحلة بعد انتهائها"}
        mock:
          app: "mishwar"
          appbar: {"title": {"en": "Your ride", "ar": "مشوارك"}}
          blocks:
            - {"kind": "image", "art": "map-route", "size": "l"}
            - {"kind": "listitem", "avatar": {"text": "Mahmoud", "art": "man-2"}, "text": {"en": "Mahmoud · ★ 4.9", "ar": "محمود · ★ 4.9"}, "sub": {"en": "White Toyota Corolla · ق ص 4721", "ar": "تويوتا كورولا بيضاء · ق ص 4721"}, "value": {"en": "3 min", "ar": "3 د"}, "gap": "m"}
            - {"kind": "small", "text": {"en": "Mahmoud cancelled; Karim's grey Hyundai is coming.", "ar": "ألغى محمود الرحلة، وكريم في الطريق بسيارة هيونداي رمادية."}, "tone": "faint", "gap": "s", "note": {"en": "Told only in the receipt, after the trip", "ar": "يُذكر في الإيصال فقط، بعد الرحلة"}}
    answer: [update]
    misconceptions:
      - id: MC-P02-004
        when: [same, later]
        feedback:
          en: "The rider is standing on the street looking for a white Toyota. A different car may pass right by without them knowing it's theirs."
          ar: "الراكب يقف في الشارع يبحث عن تويوتا بيضاء. وقد تمرّ سيارة مختلفة بجانبه دون أن يعرف أنها سيارته."
    correct:
      en: "Tell them now, with what they need to find the car."
      ar: "أخبِره الآن، بما يحتاجه ليجد السيارة."
    explain:
      en: "The change affects what the rider is doing right now, so it belongs on the trip screen with the details that let them spot the new car."
      ar: "التغيير يؤثر في ما يفعله الراكب الآن، فمكانه شاشة الرحلة، مع التفاصيل التي تساعده على التعرّف على السيارة الجديدة."

  - id: S04
    type: tune
    speaker: nour
    part: retest
    skill: SK-P02-U01-02
    value:
      en: "Re-test, visibility of system status (NN/g): backstage events that affect people can be shown with notifications or indicators. A doctor running late is exactly such an event."
      ar: "إعادة اختبار، ظهور حالة النظام (NN/g): الأحداث التي تجري خلف الكواليس وتمسّ الناس يمكن إظهارها بالإشعارات أو المؤشرات. وتأخّر الطبيب حدث من هذا النوع تمامًا."
    ref: { url: "https://www.nngroup.com/articles/visibility-system-status/", quote: "To communicate backstage events that may impact users, you can use either notifications or indicators." }
    scenario:
      en: "In my clinic, Dr. Samir is running 40 minutes late today. Patients with afternoon bookings still see \"5:00 pm\" in the app, and they all arrive and wait."
      ar: "في عيادتي، يتأخر د. سمير اليوم 40 دقيقة. ومرضى مواعيد العصر ما زالوا يرون «5:00 مساءً» في التطبيق، فيأتون جميعًا وينتظرون."
    prompt:
      en: "What should the app do?"
      ar: "ماذا يجب أن يفعل التطبيق؟"
    mock:
      app: raha
      appbar: { title: { en: "My visits", ar: "زياراتي" } }
      tabbar: { active: 1, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: calendar-check, text: { en: "Visits", ar: "زياراتي" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
      blocks:
        - kind: card
          blocks:
            - { kind: listitem, avatar: { text: "Dr. Samir", art: doctor }, text: { en: "Dr. Samir Fahmy", ar: "د. سمير فهمي" }, sub: { en: "Internal medicine", ar: "باطنة" } }
            - { kind: heading, text: { en: "Today · 5:00 pm", ar: "اليوم · 5:00 مساءً" }, gap: s }
            - { kind: small, text: { en: "Raha Clinic, Dokki", ar: "عيادة راحة، الدقي" } }
        - { kind: small, text: { en: "Dr. Samir is running 40 minutes late.", ar: "د. سمير متأخر 40 دقيقة." }, tone: faint, gap: m, note: { en: "Known to the clinic, not shown", ar: "تعرفه العيادة، ولا يظهر" } }
    options:
      - id: notify
        text: {"en": "Show \"Dr. Samir is running about 40 minutes late: expected 5:40 pm\" on the booking, and send a notification", "ar": "يعرض «د. سمير متأخر نحو 40 دقيقة: الموعد المتوقع 5:40 مساءً» على الحجز، ويرسل إشعارًا"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "My visits", "ar": "زياراتي"}}
          tabbar: {"active": 1, "items": [{"icon": "house", "text": {"en": "Home", "ar": "الرئيسية"}}, {"icon": "calendar-check", "text": {"en": "Visits", "ar": "زياراتي"}}, {"icon": "user", "text": {"en": "Me", "ar": "حسابي"}}]}
          blocks:
            - {"kind": "banner", "tone": "warn", "icon": "clock", "text": {"en": "Dr. Samir is running about 40 minutes late: expected 5:40 pm", "ar": "د. سمير متأخر نحو 40 دقيقة: الموعد المتوقع 5:40 مساءً"}, "note": {"en": "Also sent as a notification", "ar": "ويصل أيضًا كإشعار"}}
            - {"kind": "card", "blocks": [{"kind": "listitem", "avatar": {"text": "Dr. Samir", "art": "doctor"}, "text": {"en": "Dr. Samir Fahmy", "ar": "د. سمير فهمي"}, "sub": {"en": "Internal medicine", "ar": "باطنة"}}, {"kind": "heading", "text": {"en": "Today · 5:00 pm", "ar": "اليوم · 5:00 مساءً"}, "gap": "s"}, {"kind": "small", "text": {"en": "Raha Clinic, Dokki", "ar": "عيادة راحة، الدقي"}}]}
      - id: desk
        text: {"en": "Nothing; the front desk will explain when they arrive", "ar": "لا شيء؛ سيشرح الاستقبال حين يصلون"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "My visits", "ar": "زياراتي"}}
          tabbar: {"active": 1, "items": [{"icon": "house", "text": {"en": "Home", "ar": "الرئيسية"}}, {"icon": "calendar-check", "text": {"en": "Visits", "ar": "زياراتي"}}, {"icon": "user", "text": {"en": "Me", "ar": "حسابي"}}]}
          blocks:
            - {"kind": "card", "blocks": [{"kind": "listitem", "avatar": {"text": "Dr. Samir", "art": "doctor"}, "text": {"en": "Dr. Samir Fahmy", "ar": "د. سمير فهمي"}, "sub": {"en": "Internal medicine", "ar": "باطنة"}}, {"kind": "heading", "text": {"en": "Today · 5:00 pm", "ar": "اليوم · 5:00 مساءً"}, "gap": "s"}, {"kind": "small", "text": {"en": "Raha Clinic, Dokki", "ar": "عيادة راحة، الدقي"}}]}
            - {"kind": "small", "text": {"en": "Dr. Samir is running 40 minutes late.", "ar": "د. سمير متأخر 40 دقيقة."}, "tone": "faint", "gap": "m", "note": {"en": "Not shown; the front desk explains on arrival", "ar": "لا يظهر؛ يشرح الاستقبال عند الوصول"}}
      - id: hours
        text: {"en": "Add \"Waiting times may vary\" to the clinic's page", "ar": "يضيف «قد تختلف أوقات الانتظار» إلى صفحة العيادة"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "My visits", "ar": "زياراتي"}}
          tabbar: {"active": 1, "items": [{"icon": "house", "text": {"en": "Home", "ar": "الرئيسية"}}, {"icon": "calendar-check", "text": {"en": "Visits", "ar": "زياراتي"}}, {"icon": "user", "text": {"en": "Me", "ar": "حسابي"}}]}
          blocks:
            - {"kind": "card", "blocks": [{"kind": "listitem", "avatar": {"text": "Dr. Samir", "art": "doctor"}, "text": {"en": "Dr. Samir Fahmy", "ar": "د. سمير فهمي"}, "sub": {"en": "Internal medicine", "ar": "باطنة"}}, {"kind": "heading", "text": {"en": "Today · 5:00 pm", "ar": "اليوم · 5:00 مساءً"}, "gap": "s"}, {"kind": "small", "text": {"en": "Raha Clinic, Dokki", "ar": "عيادة راحة، الدقي"}}]}
            - {"kind": "small", "icon": "info", "text": {"en": "Raha Clinic: waiting times may vary.", "ar": "عيادة راحة: قد تختلف أوقات الانتظار."}, "gap": "m"}
            - {"kind": "small", "text": {"en": "Dr. Samir is running 40 minutes late.", "ar": "د. سمير متأخر 40 دقيقة."}, "tone": "faint", "gap": "m", "note": {"en": "Known to the clinic, not shown", "ar": "تعرفه العيادة، ولا يظهر"}}
    answer: [notify]
    misconceptions:
      - id: MC-P02-004
        when: [desk]
        feedback:
          en: "By then the patients have already left work early and sat in the waiting room. The app knew and said nothing."
          ar: "حينها يكون المرضى قد غادروا عملهم مبكرًا وجلسوا في غرفة الانتظار. والتطبيق كان يعرف ولم يقل شيئًا."
      - id: MC-P02-005
        when: [hours]
        feedback:
          en: "A general warning doesn't tell any patient that today's booking is late, or by how much."
          ar: "التحذير العام لا يخبر أي مريض أن موعد اليوم متأخر، ولا بكم."
    correct:
      en: "Show the delay on the booking, and reach them before they leave."
      ar: "أظهِر التأخير على الحجز، وأبلغهم قبل أن يخرجوا."
    explain:
      en: "Patients check their booking for the time, so the delay and new time go there. The notification reaches those who don't open the app."
      ar: "يراجع المرضى حجزهم ليعرفوا الموعد، فالتأخير والموعد الجديد مكانهما هناك. والإشعار يصل إلى من لا يفتح التطبيق."

  # SK-P02-U01-03: use the words your users use
  - id: S05
    type: tune
    speaker: hana
    part: retest
    skill: SK-P02-U01-03
    value:
      en: "Re-test, match between the system and the real world (NN/g): never assume your understanding of words matches your users'. Billing terms from the payment system aren't what members say."
      ar: "إعادة اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): لا تفترض أبدًا أن فهمك للكلمات يطابق فهم مستخدميك. ومصطلحات الفوترة من نظام الدفع ليست ما يقوله الأعضاء."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Never assume your understanding of words or concepts will match" }
    scenario:
      en: "Members of my gym can stop paying for a month while they travel. In the app, the option is called \"Suspend billing cycle\". Members keep asking me how to freeze their membership."
      ar: "يستطيع أعضاء النادي الرياضي الذي أديره أن يتوقفوا عن الدفع شهرًا أثناء السفر. وفي التطبيق اسم هذا الخيار «تعليق دورة الفوترة». والأعضاء يسألونني دائمًا كيف يجمّدون اشتراكهم."
    prompt:
      en: "What should the option be called?"
      ar: "ماذا نسمّي هذا الخيار ليجده الأعضاء بسهولة؟"
    mock:
      app: nashat
      appbar: { title: { en: "Membership", ar: "الاشتراك" }, back: true }
      blocks:
        - kind: card
          blocks:
            - { kind: heading, text: { en: "Gold · monthly", ar: "Gold · شهري" } }
            - { kind: price, text: { en: "EGP 900", ar: "900 جنيه" }, per: { en: "/ month", ar: "/ شهريًا" } }
            - { kind: small, text: { en: "Renews 1 Dec", ar: "يتجدّد 1 ديسمبر" } }
        - { kind: listitem, icon: pause-circle, text: { en: "Suspend billing cycle", ar: "تعليق دورة الفوترة" }, chevron: true, gap: m, ring: true }
        - { kind: listitem, icon: credit-card, text: { en: "Payment method", ar: "طريقة الدفع" }, chevron: true, gap: s }
    options:
      - id: freeze
        text: {"en": "\"Freeze my membership\"", "ar": "«جمّد اشتراكي»"}
        mock:
          app: "nashat"
          appbar: {"title": {"en": "Membership", "ar": "الاشتراك"}, "back": true}
          blocks:
            - {"kind": "card", "blocks": [{"kind": "heading", "text": {"en": "Gold · monthly", "ar": "Gold · شهري"}}, {"kind": "price", "text": {"en": "EGP 900", "ar": "900 جنيه"}, "per": {"en": "/ month", "ar": "/ شهريًا"}}, {"kind": "small", "text": {"en": "Renews 1 Dec", "ar": "يتجدّد 1 ديسمبر"}}]}
            - {"kind": "listitem", "icon": "snowflake", "text": {"en": "Freeze my membership", "ar": "جمّد اشتراكي"}, "chevron": true, "gap": "m", "ring": true}
            - {"kind": "listitem", "icon": "credit-card", "text": {"en": "Payment method", "ar": "طريقة الدفع"}, "chevron": true, "gap": "s"}
      - id: keep
        text: {"en": "\"Suspend billing cycle\", with a help page", "ar": "«تعليق دورة الفوترة»، مع صفحة مساعدة"}
        mock:
          app: "nashat"
          appbar: {"title": {"en": "Membership", "ar": "الاشتراك"}, "back": true}
          blocks:
            - {"kind": "card", "blocks": [{"kind": "heading", "text": {"en": "Gold · monthly", "ar": "Gold · شهري"}}, {"kind": "price", "text": {"en": "EGP 900", "ar": "900 جنيه"}, "per": {"en": "/ month", "ar": "/ شهريًا"}}, {"kind": "small", "text": {"en": "Renews 1 Dec", "ar": "يتجدّد 1 ديسمبر"}}]}
            - {"kind": "listitem", "icon": "pause-circle", "text": {"en": "Suspend billing cycle", "ar": "تعليق دورة الفوترة"}, "chevron": true, "gap": "m", "ring": true}
            - {"kind": "link", "icon": "question", "text": {"en": "Help: what is a billing cycle suspension?", "ar": "مساعدة: ما معنى تعليق دورة الفوترة؟"}, "gap": "s"}
            - {"kind": "listitem", "icon": "credit-card", "text": {"en": "Payment method", "ar": "طريقة الدفع"}, "chevron": true, "gap": "s"}
      - id: hold
        text: {"en": "\"Account hold (billing)\"", "ar": "«إيقاف الحساب (الفوترة)»"}
        mock:
          app: "nashat"
          appbar: {"title": {"en": "Membership", "ar": "الاشتراك"}, "back": true}
          blocks:
            - {"kind": "card", "blocks": [{"kind": "heading", "text": {"en": "Gold · monthly", "ar": "Gold · شهري"}}, {"kind": "price", "text": {"en": "EGP 900", "ar": "900 جنيه"}, "per": {"en": "/ month", "ar": "/ شهريًا"}}, {"kind": "small", "text": {"en": "Renews 1 Dec", "ar": "يتجدّد 1 ديسمبر"}}]}
            - {"kind": "listitem", "icon": "pause-circle", "text": {"en": "Account hold (billing)", "ar": "إيقاف الحساب (الفوترة)"}, "chevron": true, "gap": "m", "ring": true}
            - {"kind": "listitem", "icon": "credit-card", "text": {"en": "Payment method", "ar": "طريقة الدفع"}, "chevron": true, "gap": "s"}
    answer: [freeze]
    misconceptions:
      - id: MC-P02-008
        when: [keep]
        feedback:
          en: "Members won't recognise \"billing cycle\" as the thing they're looking for, so they won't even open the help page."
          ar: "لن يعرف الأعضاء أن «دورة الفوترة» هي ما يبحثون عنه، فلن يفتحوا صفحة المساعدة أصلًا."
      - id: MC-P02-007
        when: [hold]
        feedback:
          en: "\"Account hold\" sounds like something the gym does to you, and it isn't the word members use."
          ar: "«إيقاف الحساب» يوحي بأن النادي هو الذي يوقف حسابك، وهي ليست الكلمة التي يستخدمها الأعضاء."
    correct:
      en: "Use the word members already say."
      ar: "استخدم الكلمة التي يقولها الأعضاء أصلًا."
    explain:
      en: "Members are already asking for \"freeze\", so that word will catch their eye in the menu. The billing system can keep its own term behind the scenes."
      ar: "الأعضاء يسألون أصلًا عن «التجميد»، فهذه الكلمة ستلفت نظرهم في القائمة. ويستطيع نظام الفوترة أن يحتفظ بمصطلحه خلف الكواليس."

  - id: S06
    type: tune
    speaker: youssef
    part: retest
    skill: SK-P02-U01-03
    value:
      en: "Re-test, match between the system and the real world (NN/g): people should understand meaning without looking up a word. A telecom term as a field label stops checkout."
      ar: "إعادة اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): يجب أن يفهم الناس المعنى دون أن يبحثوا عن معنى كلمة. فإذا كان عنوان الحقل مصطلحًا من عالم الاتصالات، توقّف الناس عن الدفع."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Ensure that users can understand meaning without having to go look up a word" }
    scenario:
      en: "The delivery company's form on my checkout page asks for **MSISDN**. Many customers stop there."
      ar: "نموذج شركة التوصيل في صفحة الدفع عندي يطلب **MSISDN**. ويتوقف كثير من العملاء عنده."
    prompt:
      en: "What should the field's label be?"
      ar: "ماذا نكتب في عنوان الحقل (Label)؟"
    mock:
      app: dar
      frame: wide
      url: dar.example/checkout/delivery
      blocks:
        - { kind: title, text: { en: "Delivery details", ar: "بيانات التوصيل" } }
        - { kind: field, label: { en: "Full name", ar: "الاسم بالكامل" }, text: { en: "Mohamed Adel", ar: "محمد عادل" }, filled: true, gap: m }
        - { kind: field, label: "MSISDN", text: "", gap: m, focus: true }
        - { kind: button, text: { en: "Continue to payment", ar: "تابع إلى الدفع" }, gap: m }
    options:
      - id: msisdn
        text: {"en": "\"MSISDN (subscriber number)\"", "ar": "«MSISDN (رقم المشترك)»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/delivery"
          blocks:
            - {"kind": "title", "text": {"en": "Delivery details", "ar": "بيانات التوصيل"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": {"en": "Mohamed Adel", "ar": "محمد عادل"}, "filled": true, "gap": "m"}
            - {"kind": "field", "label": {"en": "MSISDN (subscriber number)", "ar": "MSISDN (رقم المشترك)"}, "text": "", "gap": "m", "focus": true}
            - {"kind": "button", "text": {"en": "Continue to payment", "ar": "تابع إلى الدفع"}, "gap": "m"}
      - id: mobile
        text: {"en": "\"Mobile number, so the courier can call you\"", "ar": "«رقم الموبايل، ليتصل بك المندوب»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/delivery"
          blocks:
            - {"kind": "title", "text": {"en": "Delivery details", "ar": "بيانات التوصيل"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": {"en": "Mohamed Adel", "ar": "محمد عادل"}, "filled": true, "gap": "m"}
            - {"kind": "field", "label": {"en": "Mobile number, so the courier can call you", "ar": "رقم الموبايل، ليتصل بك المندوب"}, "text": "", "gap": "m", "focus": true}
            - {"kind": "button", "text": {"en": "Continue to payment", "ar": "تابع إلى الدفع"}, "gap": "m"}
      - id: contact
        text: {"en": "\"Contact ID\"", "ar": "«معرّف التواصل»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/delivery"
          blocks:
            - {"kind": "title", "text": {"en": "Delivery details", "ar": "بيانات التوصيل"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": {"en": "Mohamed Adel", "ar": "محمد عادل"}, "filled": true, "gap": "m"}
            - {"kind": "field", "label": {"en": "Contact ID", "ar": "معرّف التواصل"}, "text": "", "gap": "m", "focus": true}
            - {"kind": "button", "text": {"en": "Continue to payment", "ar": "تابع إلى الدفع"}, "gap": "m"}
    answer: [mobile]
    misconceptions:
      - id: MC-P02-009
        when: [msisdn]
        feedback:
          en: "\"Subscriber number\" is still telecom language. Customers would wonder if it's their phone number, an account number, or something on their SIM card."
          ar: "«رقم المشترك» ما زال لغة شركات الاتصالات. وسيتساءل العملاء إن كان رقم الهاتف، أم رقم حساب، أم شيئًا على شريحة الهاتف."
      - id: MC-P02-007
        when: [contact]
        feedback:
          en: "\"Contact ID\" could mean an email, a username or a number. Customers would have to guess."
          ar: "«معرّف التواصل» قد يعني بريدًا إلكترونيًا أو اسم مستخدم أو رقمًا. وسيضطر العملاء إلى التخمين."
    correct:
      en: "Plain words, and why you need it."
      ar: "كلمات بسيطة، وسبب طلبه."
    explain:
      en: "Everyone knows what a mobile number is, and \"so the courier can call you\" tells them why it's needed."
      ar: "الكل يعرف معنى رقم الموبايل، و«ليتصل بك المندوب» تخبرهم لماذا نطلبه."

  # SK-P02-U01-04: follow the order and conventions people know
  - id: S07
    type: compare
    speaker: tarek
    part: retest
    skill: SK-P02-U01-04
    value:
      en: "Re-test, match between the system and the real world (NN/g): we associate more with up and less with down. A fan control with \"faster\" at the bottom works against that habit."
      ar: "إعادة اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): نربط «الأكثر» بالأعلى و«الأقل» بالأسفل. ومفتاح المروحة الذي يضع «أسرع» في الأسفل يعمل ضد هذه العادة."
    ref: { url: "https://www.nngroup.com/articles/match-system-real-world/", quote: "we associate more with up and less with down" }
    scenario:
      en: "In the smart home app I manage, people change a ceiling fan's speed with two buttons, one above the other."
      ar: "في تطبيق المنزل الذكي الذي أديره، يغيّر الناس سرعة مروحة السقف بزرّين، أحدهما فوق الآخر."
    prompt:
      en: "Which version will people use without mistakes?"
      ar: "أيّ نسخة سيستخدمها الناس دون أخطاء؟"
    a:
      label: { en: "Version A: slower on top", ar: "النسخة A: الأبطأ في الأعلى" }
      mock:
        app: { name: { en: "Beity", ar: "بيتي" }, color: "#0D9488", icon: house-line, domain: beity.example }
        appbar: { title: { en: "Living room", ar: "الصالة" }, back: true }
        blocks:
          - kind: card
            blocks:
              - { kind: listitem, icon: fan, text: { en: "Ceiling fan", ar: "مروحة السقف" }, toggle: true }
              - { kind: button, icon: minus, text: { en: "Slower", ar: "أبطأ" }, style: outline, gap: m }
              - { kind: progress, value: 40, label: { en: "Speed 2 of 5", ar: "السرعة 2 من 5" }, gap: s }
              - { kind: button, icon: plus, text: { en: "Faster", ar: "أسرع" }, style: outline, gap: s }
    b:
      label: { en: "Version B: faster on top", ar: "النسخة B: الأسرع في الأعلى" }
      mock:
        app: { name: { en: "Beity", ar: "بيتي" }, color: "#0D9488", icon: house-line, domain: beity.example }
        appbar: { title: { en: "Living room", ar: "الصالة" }, back: true }
        blocks:
          - kind: card
            blocks:
              - { kind: listitem, icon: fan, text: { en: "Ceiling fan", ar: "مروحة السقف" }, toggle: true }
              - { kind: button, icon: plus, text: { en: "Faster", ar: "أسرع" }, style: outline, gap: m }
              - { kind: progress, value: 40, label: { en: "Speed 2 of 5", ar: "السرعة 2 من 5" }, gap: s }
              - { kind: button, icon: minus, text: { en: "Slower", ar: "أبطأ" }, style: outline, gap: s }
    answer: b
    misconceptions:
      - id: MC-P02-011
        when: [a]
        feedback:
          en: "Most people reach for the top button to turn things up. In A, that slows the fan down, the opposite of what they meant."
          ar: "أغلب الناس يضغطون الزر العلوي ليرفعوا السرعة. وفي A، هذا يُبطئ المروحة، أي عكس ما قصدوه."
    correct:
      en: "B: up means more."
      ar: "B: الأعلى يعني الأكثر."
    explain:
      en: "B follows a habit people already have from volume buttons, lifts and taps: more is up, less is down."
      ar: "B تتبع عادة موجودة أصلًا لدى الناس من أزرار الصوت والمصاعد والصنابير: الأكثر في الأعلى، والأقل في الأسفل."

  - id: S08
    type: tune
    speaker: rami
    part: retest
    skill: SK-P02-U01-04
    value:
      en: "Re-test, match between the system and the real world (NN/g): present information in a natural and logical way. In a recipe, ingredients follow the order of cooking, not the alphabet."
      ar: "إعادة اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): اعرض المعلومات بطريقة طبيعية ومنطقية. ففي الوصفة، تتبع المكوّنات ترتيب الطبخ، لا الترتيب الأبجدي."
    ref: { url: "https://www.nngroup.com/articles/match-system-real-world/", quote: "information should be presented in a natural and logical way" }
    scenario:
      en: "I'm designing a recipe app. To keep it tidy, I listed each recipe's ingredients from A to Z."
      ar: "أصمّم تطبيقًا للوصفات. ولكي يبدو مرتبًا، رتّبت مكوّنات كل وصفة أبجديًا."
    prompt:
      en: "How should the ingredients be ordered?"
      ar: "كيف نرتّب المكوّنات ليجد الطاهي ما يحتاجه أثناء الطبخ؟"
    mock:
      app: tabkha
      appbar: { title: { en: "Chicken kabsa", ar: "كبسة دجاج" }, back: true, actions: [ { icon: heart } ] }
      blocks:
