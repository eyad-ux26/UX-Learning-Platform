id: P02-U01-L03
mode: check
minutes: 6
title:
  en: "Skill check: keep people informed, in their words"
  ar: "اختبار المهارة: أخبِر الناس بما يحدث، بكلماتهم"
speaker: youssef
sources:
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
  - title: { en: "Visibility of System Status (Usability Heuristic #1) (NN/g)", ar: "وضوح حالة النظام (Visibility of system status)، مبدأ الاستخدام 1 (NN/g)" }
    url: "https://www.nngroup.com/articles/visibility-system-status/"
  - title: { en: "Match Between the System and the Real World (Usability Heuristic #2) (NN/g)", ar: "تطابق النظام مع العالم الحقيقي (Match between the system and the real world)، مبدأ الاستخدام 2 (NN/g)" }
    url: "https://www.nngroup.com/articles/match-system-real-world/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Youssef's online shop", ar: "متجر يوسف الإلكتروني" }
    mock:
      app: dar
      frame: wide
      url: dar.example
      navbar: { links: [ { en: "Tools", ar: "أدوات" }, { en: "Kitchen", ar: "المطبخ" }, { en: "Offers", ar: "العروض" } ], active: 0, search: { en: "Search Dar", ar: "ابحث في دار" }, actions: [ { icon: shopping-cart, count: 1 }, { icon: user } ] }
      blocks:
        - { kind: title, text: { en: "Everything for your home", ar: "كل ما يحتاجه بيتك" } }
        - kind: row
          gap: m
          blocks:
            - { kind: card, art: washing-machine, blocks: [ { kind: small, text: { en: "Washers", ar: "غسالات" } } ] }
            - { kind: card, art: fridge, blocks: [ { kind: small, text: { en: "Fridges", ar: "ثلاجات" } } ] }
            - { kind: card, art: box, blocks: [ { kind: small, text: { en: "Tools", ar: "أدوات" } } ] }
    body:
      en: "I sell home tools online, and my customers keep calling me with the same questions. Help me find what my site does wrong in four places.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "أبيع أدوات منزلية عبر الإنترنت، وعملائي يتصلون بي دائمًا بالأسئلة نفسها. ساعدني على اكتشاف أخطاء موقعي في أربعة مواضع.\n\nهذا اختبار مهارة: دون تلميحات، وسترى نتيجتك في النهاية."

  - id: S02
    type: tune
    part: check
    skill: SK-P02-U01-01
    value:
      en: "Check, visibility of system status (NN/g): present feedback as quickly as possible. During a six-second card payment, people need to see that it's in progress, or they tap again or leave."
      ar: "اختبار، ظهور حالة النظام (NN/g): قدّم الردّ بأسرع ما يمكن. فخلال دفع بالبطاقة يستغرق ست ثوانٍ، يحتاج الناس أن يروا أنه جارٍ، وإلا ضغطوا مرة أخرى أو غادروا."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Present feedback to the user as quickly as possible (ideally, immediately)." }
    scenario:
      en: "When customers tap **Pay**, the bank takes about six seconds to confirm the card. Meanwhile the page doesn't change. Some customers get charged twice."
      ar: "حين يضغط العملاء **ادفع**، يستغرق البنك نحو ست ثوانٍ ليؤكد البطاقة. وخلال ذلك لا تتغيّر الصفحة. وبعض العملاء يُخصم منهم المبلغ مرتين."
    prompt:
      en: "What should happen right after the tap?"
      ar: "ماذا يجب أن يحدث بعد الضغطة مباشرة؟"
    mock:
      app: dar
      frame: wide
      url: dar.example/checkout/pay
      blocks:
        - { kind: title, text: { en: "Payment", ar: "الدفع" } }
        - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, text: "4921 •••• •••• 7710", filled: true, icon: credit-card, gap: m }
        - { kind: price, text: { en: "Total EGP 3,450", ar: "الإجمالي 3,450 جنيه" }, gap: m }
        - { kind: button, text: { en: "Pay", ar: "ادفع" }, gap: m, note: { en: "6 s after the tap, nothing changed", ar: "بعد الضغط بـ 6 ثوانٍ، لم يتغيّر شيء" } }
    options:
      - id: confirm
        text: {"en": "Ask \"Are you sure you want to pay?\" first", "ar": "أسأل أولًا: «هل أنت متأكد أنك تريد الدفع؟»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/pay"
          blocks:
            - {"kind": "title", "text": {"en": "Payment", "ar": "الدفع"}}
            - {"kind": "field", "label": {"en": "Card number", "ar": "رقم البطاقة"}, "text": "4921 •••• •••• 7710", "filled": true, "icon": "credit-card", "gap": "m"}
            - {"kind": "price", "text": {"en": "Total EGP 3,450", "ar": "الإجمالي 3,450 جنيه"}, "gap": "m"}
            - {"kind": "button", "text": {"en": "Pay", "ar": "ادفع"}, "gap": "m"}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Are you sure you want to pay?", "ar": "هل أنت متأكد أنك تريد الدفع؟"}}, {"kind": "small", "text": {"en": "EGP 3,450", "ar": "3,450 جنيه"}, "gap": "s"}, {"kind": "button", "text": {"en": "Pay", "ar": "ادفع"}, "gap": "m", "note": {"en": "After this tap: 6 s with no change", "ar": "بعد هذه الضغطة: 6 ثوانٍ دون أي تغيير"}}, {"kind": "button", "style": "text", "text": {"en": "Cancel", "ar": "إلغاء"}, "gap": "s"}]}
      - id: progress
        text: {"en": "Disable the button and show \"Confirming with your bank…\" with a spinner", "ar": "أعطّل الزر وأعرض «جارٍ التأكيد مع البنك…» مع مؤشر دوّار"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/pay"
          blocks:
            - {"kind": "title", "text": {"en": "Payment", "ar": "الدفع"}}
            - {"kind": "field", "label": {"en": "Card number", "ar": "رقم البطاقة"}, "text": "4921 •••• •••• 7710", "filled": true, "icon": "credit-card", "gap": "m"}
            - {"kind": "price", "text": {"en": "Total EGP 3,450", "ar": "الإجمالي 3,450 جنيه"}, "gap": "m"}
            - {"kind": "button", "icon": "spinner-gap", "tone": "off", "text": {"en": "Confirming with your bank…", "ar": "جارٍ التأكيد مع البنك…"}, "gap": "m"}
      - id: wait
        text: {"en": "Nothing, until the order confirmation page loads", "ar": "لا شيء، حتى تظهر صفحة تأكيد الطلب"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/checkout/pay"
          blocks:
            - {"kind": "title", "text": {"en": "Payment", "ar": "الدفع"}}
            - {"kind": "field", "label": {"en": "Card number", "ar": "رقم البطاقة"}, "text": "4921 •••• •••• 7710", "filled": true, "icon": "credit-card", "gap": "m"}
            - {"kind": "price", "text": {"en": "Total EGP 3,450", "ar": "الإجمالي 3,450 جنيه"}, "gap": "m"}
            - {"kind": "button", "text": {"en": "Pay", "ar": "ادفع"}, "gap": "m", "note": {"en": "6 s after the tap, nothing changed", "ar": "بعد الضغط بـ 6 ثوانٍ، لم يتغيّر شيء"}}
    answer: [progress]
    misconceptions:
      - id: MC-P02-002
        when: [wait]
        feedback:
          en: "Six still seconds is exactly what makes customers think the tap failed and tap again."
          ar: "ست ثوانٍ لا يتغيّر فيها شيء هي بالضبط ما يجعل العملاء يظنون أن الضغطة فشلت فيضغطون مرة أخرى."
      - id: MC-P02-001
        when: [confirm]
        feedback:
          en: "A question before paying adds a step, but after it the page still sits still for six seconds."
          ar: "السؤال قبل الدفع يضيف خطوة، لكن الصفحة بعده تبقى ست ثوانٍ دون أي تغيير."
    correct:
      en: "Show at once that the payment is in progress."
      ar: "أظهِر فورًا أن الدفع جارٍ."
    explain:
      en: "The spinner and the words say the tap worked and what the shop is waiting for. Disabling the button removes the reason, and the chance, to pay twice."
      ar: "المؤشر الدوّار والكلمات يقولان إن الضغطة وصلت، وما الذي ينتظره المتجر. وتعطيل الزر يمنع الدفع مرتين، فلا يبقى سبب ولا فرصة لذلك."

  - id: S03
    type: tune
    part: check
    skill: SK-P02-U01-02
    value:
      en: "Check, visibility of system status (NN/g): clearly tell people what the system's state is. A delay the shop knows about must show on the order, with the new time."
      ar: "اختبار، ظهور حالة النظام (NN/g): أخبِر الناس بوضوح بحالة النظام. والتأخير الذي يعرفه المتجر يجب أن يظهر على الطلب، مع الموعد الجديد."
    ref: { url: "https://www.nngroup.com/articles/visibility-system-status/", quote: "Sites and apps should clearly communicate to users what the system" }
    scenario:
      en: "The courier company told me Ahmed's order will arrive tomorrow instead of today. His order page still says \"Arriving today\"."
      ar: "أخبرتني شركة الشحن أن طلب أحمد سيصل غدًا بدل اليوم. وصفحة طلبه ما زالت تقول «يصل اليوم»."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل ليعرف أحمد أن طلبه تأخّر؟"
    mock:
      app: dar
      appbar: { title: { en: "Order #48213", ar: "الطلب ‎#48213" }, back: true }
      blocks:
        - { kind: listitem, art: box, text: { en: "Electric drill · Kettle", ar: "مثقاب كهربائي · غلاية" }, sub: { en: "2 items · EGP 2,140", ar: "منتجان · 2,140 جنيه" } }
        - { kind: badge, text: { en: "Arriving today", ar: "يصل اليوم" }, tone: good, icon: truck, gap: m }
        - { kind: progress, value: 75, label: { en: "Out for delivery", ar: "خرج للتوصيل" }, gap: s }
        - { kind: small, text: { en: "The courier's update: arriving tomorrow.", ar: "تحديث شركة الشحن: يصل غدًا." }, tone: faint, gap: m, note: { en: "Known to the shop, not shown", ar: "يعرفه المتجر، ولا يظهر" } }
    options:
      - id: keep
        text: {"en": "Leave it; he'll get the order tomorrow anyway", "ar": "أترك الصفحة كما هي؛ فسيستلم الطلب غدًا على أي حال"}
        mock:
          app: "dar"
          appbar: {"title": {"en": "Order #48213", "ar": "الطلب ‎#48213"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "box", "text": {"en": "Electric drill · Kettle", "ar": "مثقاب كهربائي · غلاية"}, "sub": {"en": "2 items · EGP 2,140", "ar": "منتجان · 2,140 جنيه"}}
            - {"kind": "badge", "text": {"en": "Arriving today", "ar": "يصل اليوم"}, "tone": "good", "icon": "truck", "gap": "m"}
            - {"kind": "progress", "value": 75, "label": {"en": "Out for delivery", "ar": "خرج للتوصيل"}, "gap": "s"}
            - {"kind": "small", "text": {"en": "The courier's update: arriving tomorrow.", "ar": "تحديث شركة الشحن: يصل غدًا."}, "tone": "faint", "gap": "m", "note": {"en": "Known to the shop, not shown", "ar": "يعرفه المتجر، ولا يظهر"}}
      - id: email
        text: {"en": "Send a newsletter saying deliveries may be slower this week", "ar": "أرسل نشرة بريدية تقول إن التوصيل قد يكون أبطأ هذا الأسبوع"}
        mock:
          app: "dar"
          appbar: {"title": {"en": "Order #48213", "ar": "الطلب ‎#48213"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "box", "text": {"en": "Electric drill · Kettle", "ar": "مثقاب كهربائي · غلاية"}, "sub": {"en": "2 items · EGP 2,140", "ar": "منتجان · 2,140 جنيه"}}
            - {"kind": "badge", "text": {"en": "Arriving today", "ar": "يصل اليوم"}, "tone": "good", "icon": "truck", "gap": "m"}
            - {"kind": "progress", "value": 75, "label": {"en": "Out for delivery", "ar": "خرج للتوصيل"}, "gap": "s"}
            - {"kind": "small", "text": {"en": "The courier's update: arriving tomorrow.", "ar": "تحديث شركة الشحن: يصل غدًا."}, "tone": "faint", "gap": "m", "note": {"en": "Only a newsletter: \"Deliveries may be slower this week\"", "ar": "نشرة بريدية فقط: «قد يكون التوصيل أبطأ هذا الأسبوع»"}}
      - id: update
        text: {"en": "Change the order to \"Delayed: arriving tomorrow by 2 pm\", and send him a message with the reason", "ar": "أغيّر الطلب إلى «تأخّر: يصل غدًا قبل 2 ظهرًا»، وأرسل له رسالة بالسبب"}
        mock:
          app: "dar"
          appbar: {"title": {"en": "Order #48213", "ar": "الطلب ‎#48213"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "box", "text": {"en": "Electric drill · Kettle", "ar": "مثقاب كهربائي · غلاية"}, "sub": {"en": "2 items · EGP 2,140", "ar": "منتجان · 2,140 جنيه"}}
            - {"kind": "badge", "text": {"en": "Delayed: arriving tomorrow by 2 pm", "ar": "تأخّر: يصل غدًا قبل 2 ظهرًا"}, "tone": "warn", "icon": "clock", "gap": "m"}
            - {"kind": "progress", "value": 75, "label": {"en": "Out for delivery", "ar": "خرج للتوصيل"}, "gap": "s"}
            - {"kind": "small", "icon": "chat-text", "gap": "m", "text": {"en": "Message sent to Ahmed: the courier moved his delivery to tomorrow.", "ar": "أُرسلت رسالة إلى أحمد: نقلت شركة الشحن توصيل طلبه إلى الغد."}}
    answer: [update]
    misconceptions:
      - id: MC-P02-004
        when: [keep]
        feedback:
          en: "Ahmed will stay home waiting today, then call to ask where his order is."
          ar: "سيبقى أحمد في البيت ينتظر اليوم، ثم يتصل ليسأل أين طلبه."
      - id: MC-P02-005
        when: [email]
        feedback:
          en: "A general note doesn't tell Ahmed that his own order is late, or when it will come."
          ar: "الملاحظة العامة لا تخبر أحمد أن طلبه هو الذي تأخّر، ولا متى سيصل."
    correct:
      en: "Show the change on his order, with the new time."
      ar: "أظهِر التغيير على طلبه، مع الموعد الجديد."
    explain:
      en: "The order page is where Ahmed checks, so it must say what's true now. The message reaches him even if he doesn't open the app."
      ar: "صفحة الطلب هي المكان الذي يراجعه أحمد، فيجب أن تعرض الموعد الصحيح الآن. والرسالة تصل إليه حتى لو لم يفتح التطبيق."

  - id: S04
    type: tune
    part: check
    skill: SK-P02-U01-03
    value:
      en: "Check, match between the system and the real world (NN/g): the design should speak the users' language. Warehouse codes mean nothing to shoppers."
      ar: "اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): يجب أن يتكلم التصميم بلغة المستخدمين. ورموز المخازن لا تعني شيئًا للمشترين."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "The design should speak the users' language." }
    scenario:
      en: "My product pages show stock as **SKU status: WH-1 available**. My team set it up that way."
      ar: "صفحات المنتجات عندي تعرض المخزون هكذا: **حالة الـ SKU: متاح في WH-1**. فريقي أعدّها بهذه الطريقة."
    prompt:
      en: "What should customers see?"
      ar: "ماذا يرى العملاء ليعرفوا إن كان المنتج متوفرًا؟"
    mock:
      app: dar
      frame: wide
      url: dar.example/tools/electric-drill-650w
      navbar: { links: [ { en: "Tools", ar: "أدوات" }, { en: "Kitchen", ar: "المطبخ" } ], active: 0, actions: [ { icon: shopping-cart } ] }
      blocks:
        - { kind: image, art: box, size: m }
        - { kind: title, text: { en: "Electric drill 650 W", ar: "مثقاب كهربائي 650 وات" }, gap: s }
        - { kind: price, text: { en: "EGP 1,250", ar: "1,250 جنيه" } }
        - { kind: small, text: { en: "SKU status: WH-1 available", ar: "حالة الـ SKU: متاح في WH-1" }, gap: s, ring: true }
        - { kind: button, icon: shopping-cart, text: { en: "Add to cart", ar: "أضف إلى السلة" }, gap: m }
    options:
      - id: plain
        text: {"en": "\"In stock: delivered within 2 days\"", "ar": "«متوفّر: يصل خلال يومين»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/tools/electric-drill-650w"
          navbar: {"links": [{"en": "Tools", "ar": "أدوات"}, {"en": "Kitchen", "ar": "المطبخ"}], "active": 0, "actions": [{"icon": "shopping-cart"}]}
          blocks:
            - {"kind": "image", "art": "box", "size": "m"}
            - {"kind": "title", "text": {"en": "Electric drill 650 W", "ar": "مثقاب كهربائي 650 وات"}, "gap": "s"}
            - {"kind": "price", "text": {"en": "EGP 1,250", "ar": "1,250 جنيه"}}
            - {"kind": "small", "text": {"en": "In stock: delivered within 2 days", "ar": "متوفّر: يصل خلال يومين"}, "gap": "s", "ring": true}
            - {"kind": "button", "icon": "shopping-cart", "text": {"en": "Add to cart", "ar": "أضف إلى السلة"}, "gap": "m"}
      - id: tip
        text: {"en": "The same text, with ⓘ explaining SKU and WH-1", "ar": "النص نفسه، مع أيقونة ⓘ تشرح الـ SKU والـ WH-1"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/tools/electric-drill-650w"
          navbar: {"links": [{"en": "Tools", "ar": "أدوات"}, {"en": "Kitchen", "ar": "المطبخ"}], "active": 0, "actions": [{"icon": "shopping-cart"}]}
          blocks:
            - {"kind": "image", "art": "box", "size": "m"}
            - {"kind": "title", "text": {"en": "Electric drill 650 W", "ar": "مثقاب كهربائي 650 وات"}, "gap": "s"}
            - {"kind": "price", "text": {"en": "EGP 1,250", "ar": "1,250 جنيه"}}
            - {"kind": "small", "text": {"en": "SKU status: WH-1 available", "ar": "حالة الـ SKU: متاح في WH-1"}, "gap": "s", "ring": true, "icon": "info", "note": {"en": "ⓘ SKU = product code · WH-1 = warehouse 1", "ar": "ⓘ الـ SKU = رمز المنتج · WH-1 = المخزن 1"}}
            - {"kind": "button", "icon": "shopping-cart", "text": {"en": "Add to cart", "ar": "أضف إلى السلة"}, "gap": "m"}
      - id: code
        text: {"en": "\"Available (warehouse 1)\"", "ar": "«متاح (المخزن 1)»"}
        mock:
          app: "dar"
          frame: "wide"
          url: "dar.example/tools/electric-drill-650w"
          navbar: {"links": [{"en": "Tools", "ar": "أدوات"}, {"en": "Kitchen", "ar": "المطبخ"}], "active": 0, "actions": [{"icon": "shopping-cart"}]}
          blocks:
            - {"kind": "image", "art": "box", "size": "m"}
            - {"kind": "title", "text": {"en": "Electric drill 650 W", "ar": "مثقاب كهربائي 650 وات"}, "gap": "s"}
            - {"kind": "price", "text": {"en": "EGP 1,250", "ar": "1,250 جنيه"}}
            - {"kind": "small", "text": {"en": "Available (warehouse 1)", "ar": "متاح (المخزن 1)"}, "gap": "s", "ring": true}
            - {"kind": "button", "icon": "shopping-cart", "text": {"en": "Add to cart", "ar": "أضف إلى السلة"}, "gap": "m"}
    answer: [plain]
    misconceptions:
      - id: MC-P02-008
        when: [tip]
        feedback:
          en: "Customers would have to open an explanation to learn whether they can buy the product. Say it plainly instead."
          ar: "سيضطر العملاء إلى فتح شرح ليعرفوا إن كانوا يستطيعون شراء المنتج. قل ذلك بوضوح بدلًا من ذلك."
      - id: MC-P02-007
        when: [code]
        feedback:
          en: "Which warehouse holds the item is our business. Customers want to know if they can have it, and when."
          ar: "أي مخزن فيه المنتج شأننا نحن. أما العملاء فيريدون أن يعرفوا إن كانوا يستطيعون الحصول عليه، ومتى."
    correct:
      en: "Say what it means for the customer."
      ar: "قل ما يعنيه ذلك للعميل."
    explain:
      en: "\"In stock\" and a delivery time answer the two things a shopper asks. The codes can stay in the team's own system."
      ar: "«متوفّر» وموعد التوصيل يجيبان السؤالين اللذين يسألهما المشتري. ويمكن أن تبقى الرموز في نظام الفريق نفسه."

  - id: S05
    type: tune
    part: check
    skill: SK-P02-U01-04
    value:
      en: "Check, match between the system and the real world (NN/g): people build mental models from their experience. Shoppers look for a tool by what it does, not by which supplier sold it to the shop."
      ar: "اختبار، التوافق بين النظام والعالم الحقيقي (NN/g): يبني الناس نماذجهم الذهنية من خبرتهم. فالمشتري يبحث عن الأداة بما تفعله، لا بالمورّد الذي باعها للمتجر."
    ref: { url: "https://www.nngroup.com/articles/match-system-real-world/", quote: "people build mental models or theories of how a system works based on their past experiences with real-world objects" }
    scenario:
      en: "My shop's menu is grouped by the suppliers I buy from: \"Al-Nour Trading\", \"Delta Imports\", \"Cairo Tools Co.\". It's how I organize my own stock."
      ar: "قائمة متجري مقسّمة حسب الموردين الذين أشتري منهم: «النور للتجارة» و«دلتا للاستيراد» و«القاهرة للأدوات». وهي الطريقة التي أنظّم بها مخزوني."
    prompt:
