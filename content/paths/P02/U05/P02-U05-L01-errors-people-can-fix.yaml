id: P02-U05-L01
mode: lesson
minutes: 8
title:
  en: "Error messages people can act on"
  ar: "رسائل خطأ تساعد الناس على الإصلاح"
speaker: sara
sources:
  - title: { en: "Error-Message Guidelines (NN/g)", ar: "إرشادات رسائل الخطأ (NN/g)" }
    url: "https://www.nngroup.com/articles/error-message-guidelines/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-036: { en: "Codes and jargon don't explain", ar: "الرموز والمصطلحات لا تشرح" }
  MC-P02-037: { en: "Say what to do next", ar: "قل ما يجب فعله بعد ذلك" }
  MC-P02-038: { en: "Show the error at its source", ar: "أظهِر الخطأ عند مصدره" }
  MC-P02-039: { en: "Don't flag errors too early", ar: "لا تُظهر الخطأ مبكرًا جدًا" }
  MC-P02-040: { en: "Don't blame people", ar: "لا تلُم الناس" }
  MC-P02-041: { en: "Keep what people typed", ar: "احتفظ بما كتبه الناس" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Error 05", ar: "الخطأ 05" }
    mock:
      app: volta
      frame: wide
      url: volta.example/checkout/payment
      navbar: { links: [ { en: "Laptops", ar: "لابتوب" }, { en: "Phones", ar: "هواتف" } ], active: 0, actions: [ { icon: shopping-cart, count: 1 } ] }
      blocks:
        - { kind: title, text: { en: "Payment", ar: "الدفع" } }
        - { kind: banner, icon: warning-circle, tone: bad, text: { en: "Error 05: DO_NOT_HONOR. Transaction failed.", ar: "Error 05: DO_NOT_HONOR. فشلت العملية." }, gap: m }
        - { kind: listitem, art: laptop, text: { en: "Laptop 14\", 16 GB", ar: "لابتوب 14 بوصة، 16 GB" }, value: { en: "EGP 24,500", ar: "24,500 جنيه" }, gap: m }
        - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, text: "4921 •••• •••• 7710", filled: true, icon: credit-card, gap: m }
        - { kind: button, text: { en: "Pay EGP 24,500", ar: "ادفع 24,500 جنيه" }, gap: m }
    body:
      en: "I'm redesigning the checkout of an online electronics shop. Hany tried to pay for a laptop and saw this message.\n\nHe didn't know if his card was blocked, if he'd typed something wrong, or if the shop was broken. He bought the laptop somewhere else."
      ar: "أعيد تصميم صفحة الدفع في متجر إلكترونيات على الإنترنت. حاول هاني أن يدفع ثمن لابتوب فرأى هذه الرسالة.\n\nلم يعرف إن كانت بطاقته موقوفة، أم أنه كتب شيئًا خطأ، أم أن المتجر به عطل. فاشترى اللابتوب من مكان آخر."
  - id: S02
    type: choose
    part: try
    skill: SK-P02-U05-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Help users recover from errors (NN/g): error messages should use plain language with no codes, say precisely what the problem is, and suggest a solution."
      ar: "جرّب أولًا. ساعد المستخدمين على التعافي من الأخطاء (NN/g): يجب أن تستخدم رسائل الخطأ لغة بسيطة دون رموز، وتقول المشكلة بدقة، وتقترح حلًا."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Error messages should be expressed in plain language (no error codes), precisely indicate the problem, and constructively suggest a solution." }
    prompt:
      en: "What should the message say?"
      ar: "ماذا يجب أن تقول الرسالة؟"
    mock:
      app: volta
      frame: wide
      url: volta.example/checkout/payment
      blocks:
        - { kind: banner, icon: warning-circle, tone: bad, text: { en: "Error 05: DO_NOT_HONOR. Transaction failed.", ar: "Error 05: DO_NOT_HONOR. فشلت العملية." } }
        - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, text: "4921 •••• •••• 7710", filled: true, icon: credit-card, gap: m }
        - { kind: button, text: { en: "Pay EGP 24,500", ar: "ادفع 24,500 جنيه" }, gap: m }
    options:
      - { id: generic, text: { en: "\"Something went wrong. Please try again.\"", ar: "«حدث خطأ ما. حاول مرة أخرى.»" } }
      - { id: plain, text: { en: "\"Your bank declined this payment. You haven't been charged. Try another card, or call your bank to allow it.\"", ar: "«رفض البنك هذه العملية. لم يُخصم منك شيء. جرّب بطاقة أخرى، أو اتصل بالبنك ليسمح بها.»" } }
      - { id: code, text: { en: "\"Error 05 (DO_NOT_HONOR). Contact support with this code.\"", ar: "«Error 05 (DO_NOT_HONOR). تواصل مع الدعم بهذا الرمز.»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P02-037
        when: [generic]
        feedback:
          en: "\"Try again\" will fail the same way, because the bank will decline again. Hany still doesn't know what happened or what would work."
          ar: "«حاول مرة أخرى» ستفشل بالطريقة نفسها، لأن البنك سيرفض مرة أخرى. وما زال هاني لا يعرف ما حدث ولا ما الذي سينجح."
      - id: MC-P02-036
        when: [code]
        feedback:
          en: "The code means something to the payment team, not to Hany. Sending him to support for a declined card wastes his time and ours."
          ar: "الرمز يعني شيئًا لفريق الدفع، لا لهاني. وإرساله إلى الدعم بسبب بطاقة مرفوضة يضيّع وقته ووقتنا."
    hints:
      - en: "After reading it, would Hany know what happened and what to try?"
        ar: "بعد قراءتها، هل سيعرف هاني ما حدث وما الذي يجرّبه؟"
    correct:
      en: "What happened, in plain words, and what to do."
      ar: "ما حدث، بكلمات بسيطة، وما يجب فعله."
    explain:
      en: "The message names the cause (the bank declined), calms the worry (no charge) and gives two ways forward. Hany can fix it without leaving."
      ar: "الرسالة تذكر السبب (البنك رفض)، وتطمئنه (لم يُخصم شيء)، وتعطي طريقين للمتابعة. فيستطيع هاني إصلاح الأمر دون أن يغادر."

  - id: S09
    type: video
    part: concept
    title: { en: "Help users recognize, diagnose and recover from errors", ar: "مساعدة الناس على ملاحظة الأخطاء وفهمها وإصلاحها (Help users recognize, diagnose, and recover from errors)" }
    video: 7af55f5c-c0e4-4efa-a841-34e042b35be0
    duration: 124
    transcript:
      - { t: 2.5, en: "For example, Airbnb: this is the usual screen when you look for a page, or open a link on Airbnb slash anything, or on any site,", ar: "مثلًا في المثال الخاص بـ Airbnb: دي الشاشة المعتادة لو بتبحثوا عن أي صفحة، أو دخلتوا لينك تابع لـ Airbnb سلاش أي حاجة، أو تابع لأي موقع،" }
      - { t: 11.76, en: "but that page doesn't exist on the site, so you get an error like this, a 404. And that isn't meaningful:", ar: "لكن الصفحة دي مش موجودة في الموقع أصلًا، فبيطلع لك Error كده، اللي هو 404. وده بيكونش معبّر:" }
      - { t: 22.74, en: "users don't understand what 404 means. It's not the language they speak.", ar: "اليوزر مش فاهم إيه 404 دي، يعني مش دي اللغة اللي هو بيتكلم بيها." }
      - { t: 27.66, en: "So what did Airbnb do here? They used the user's language, not 404, because that means nothing to users,", ar: "طيب، هنا Airbnb عمل إيه؟ اللي عملوه هنا إنه استخدم User language، ما استخدمش 404، لأنها حاجة مش مفهومة بالنسبة لليوزر،" }
      - { t: 36.16, en: "it's not the term they use when they hit a problem like this, or one they'd understand.", ar: "مش هو ده المصطلح اللي بيتعامل بيه لما بيقع في مشكلة زي دي، ولا هو ده المصطلح اللي هيفهمه." }
      - { t: 41.34, en: "Airbnb succeeded in using the user's language: we can't find the page you're looking for, but you can use these options,", ar: "لكن هنا Airbnb نجح إنه يستخدم User language، يقول له: إحنا مش لاقيين الـ Page اللي إنت بتدوّر عليها، لكن ممكن تستخدم الحلول الفلانية،" }
      - { t: 50.22, en: "and those options are part of recovery. But in general, let's say this error state is very successful,", ar: "والحلول دي طبعًا ليها علاقة بشق الـ Recovery. لكن In general، خلّينا نقول كده: الـ Error state هنا ناجحة جدًا،" }
      - { t: 59.7, en: "in using the user's language and giving clear recognition of the error and the error state, in a friendly, engaging way, with an illustration that keeps it light,", ar: "إنها تستخدم User language، وإنها توفّر لي Recognition واضح للخطأ وحالة الخطأ، بطريقة لطيفة و Engaging، وحاطّة Illustration، وخلّت الموضوع لطيف في نفس الوقت،" }
      - { t: 73.34, en: "and it gives links I can go to, and at the end a site map that shows every link or page on Airbnb, in case the suggestions above weren't enough for me.", ar: "وما استخدمت Links ممكن أروح لها، وفي الآخر Site map، من خلالها يقدر يورّيني كل الـ Links أو كل الصفحات اللي موجودة في Airbnb، لو الـ Suggestions اللي فوق دي ما كانتش كافية بالنسبة لي." }
      - { t: 85.92, en: "Another guideline for good error-message communication: use short, clear words,", ar: "كذلك من الـ Guidelines عشان تحقّق Communication جيد للـ Error messages: إنك تستخدم ألفاظ مختصرة وواضحة،" }
      - { t: 91.98, en: "unlike what Paymob uses here: the wording runs into two sentences, and they don't really say anything, they don't tell me what exactly is wrong.", ar: "بخلاف اللي مستخدَم هنا في Paymob: هتلاقي إن الألفاظ بدأت تدخل في جملتين، وجملتين أصلًا مش معبّرين، مش بيعرّفوني الخطأ في إيه بالظبط." }
      - { t: 103.56, en: "Another guideline: use a positive tone, meaning don't scold or blame users for a mistake they made.", ar: "كذلك من الـ Guidelines عشان تحقّق Communication جيد للـ Error messages: إنك تستخدم Positive tone، يعني ما تبقاش بتبكّت أو بتلوم اليوزر على خطأ هو عمله." }
      - { t: 114.72, en: "That's one of the things to avoid in UX writing.", ar: "ده من الحاجات الممنوعة في الـ UX writing." }

  - id: S03
    type: card
    part: concept
    icons: [warn, text, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The ninth heuristic: when something goes wrong, help people **notice it, understand it and fix it**.\n\n- **Make it noticeable,** right next to what caused it.\n- **Say it in plain words,** precisely, without codes or blame.\n- **Offer the way out:** a fix, a suggestion, and keep everything people already entered."
      ar: "مبدأ الاستخدام (Usability heuristic) التاسع هو مساعدة الناس على ملاحظة الأخطاء وفهمها وإصلاحها (Help users recognize, diagnose, and recover from errors): حين يحدث خطأ، ساعد الناس على **ملاحظته وفهمه وإصلاحه**.\n\n- **اجعله ملحوظًا،** بجانب ما سبّبه مباشرة.\n- **قله بكلمات بسيطة،** وبدقة، دون رموز أو لوم.\n- **اعرض طريق الخروج:** إصلاحًا أو اقتراحًا، واحتفظ بكل ما أدخله الناس."

  - id: S04
    type: choose
    part: guided
    skill: SK-P02-U05-02
    rules: [R06]
    value:
      en: "Error-message guidelines (NN/g): display the error close to its source, so people connect the message with what needs fixing."
      ar: "إرشادات رسائل الخطأ (NN/g): اعرض الخطأ قريبًا من مصدره، حتى يربط الناس الرسالة بما يحتاج إلى إصلاح."
    ref: { url: "https://www.nngroup.com/articles/error-message-guidelines/", quote: "Display the error message close to the error's source." }
    scenario:
      en: "The delivery form has 9 fields. When something is wrong, one red line appears at the very top: \"Please fix the errors below.\" People scroll up and down looking for them."
      ar: "نموذج التوصيل فيه 9 حقول. وحين يوجد خطأ، يظهر سطر أحمر واحد في أعلى الصفحة: «يرجى إصلاح الأخطاء أدناه.» فيصعد الناس وينزلون بحثًا عنها."
    prompt:
      en: "Where should the errors appear?"
      ar: "أين تظهر الأخطاء ليصلحها الناس دون بحث؟"
    mock:
      app: volta
      appbar: { title: { en: "Delivery details", ar: "بيانات التوصيل" }, back: true }
      blocks:
        - { kind: banner, icon: warning-circle, tone: bad, text: { en: "Please fix the errors below.", ar: "يرجى إصلاح الأخطاء أدناه." } }
        - { kind: field, label: { en: "Full name", ar: "الاسم بالكامل" }, text: { en: "Hany Fouad", ar: "هاني فؤاد" }, filled: true, gap: m }
        - { kind: field, label: { en: "City", ar: "المدينة" }, text: { en: "Giza", ar: "الجيزة" }, filled: true, gap: s }
        - { kind: field, label: { en: "Street", ar: "الشارع" }, text: { en: "Haram St", ar: "شارع الهرم" }, filled: true, gap: s }
        - { kind: field, label: { en: "Building", ar: "العمارة" }, text: "", gap: s, note: { en: "Fields 5 to 9 are below the fold", ar: "الحقول من 5 إلى 9 خارج الشاشة، في الأسفل" } }
      footer:
        - { kind: button, text: { en: "Continue", ar: "متابعة" } }
    options:
      - { id: field, text: { en: "Under each field that needs fixing, with the field outlined, and the page scrolls to the first one", ar: "تحت كل حقل يحتاج إلى إصلاح، مع إطار حول الحقل، وتنتقل الصفحة إلى أول حقل منها" } }
      - { id: list, text: { en: "A list of all errors at the top", ar: "قائمة بكل الأخطاء في الأعلى" } }
      - { id: popup, text: { en: "A pop-up listing the errors, closed with OK", ar: "نافذة منبثقة تعرض الأخطاء، تُغلق بزر «حسنًا»" } }
    answer: [field]
    misconceptions:
      - id: MC-P02-038
        when: [list, popup]
        feedback:
          en: "People read the list, then have to find each field and remember what was wrong with it. A pop-up disappears the moment they start fixing."
          ar: "يقرأ الناس القائمة، ثم عليهم أن يجدوا كل حقل ويتذكّروا ما الخطأ فيه. والنافذة المنبثقة تختفي في اللحظة التي يبدؤون فيها الإصلاح."
    hints:
      - en: "Where are people looking when they fix a mistake?"
        ar: "أين ينظر الناس حين يصلحون خطأ؟"
    correct:
      en: "Put each error next to its field."
      ar: "ضع كل خطأ بجانب حقله."
    explain:
      en: "The message sits where the fix happens, so people read it and correct the field in one place. Scrolling to the first one saves the hunt."
      ar: "الرسالة في مكان الإصلاح، فيقرؤها الناس ويصحّحون الحقل في المكان نفسه. والانتقال إلى أول خطأ يوفّر عناء البحث."

  - id: S05
    type: choose
    part: guided
    skill: SK-P02-U05-02
    rules: [R06]
    value:
      en: "Error-message guidelines (NN/g): presenting errors too early is a hostile pattern, like grading a test before the student has answered. Check a field once people have finished with it."
      ar: "إرشادات رسائل الخطأ (NN/g): إظهار الأخطاء مبكرًا جدًا نمط عدائي، مثل تصحيح الاختبار قبل أن يجيب الطالب. تحقّق من الحقل بعد أن ينتهي الناس منه."
    ref: { url: "https://www.nngroup.com/articles/error-message-guidelines/", quote: "Presenting errors too early is a hostile pattern." }
    scenario:
      en: "As soon as people type the first letter of their email, the field turns red: \"Invalid email\". It stays red until they finish typing the whole address."
      ar: "بمجرد أن يكتب الناس أول حرف من بريدهم الإلكتروني، يتحوّل الحقل إلى الأحمر: «بريد غير صالح». ويظل أحمر حتى ينتهوا من كتابة العنوان كله."
    prompt:
      en: "When should the email field check the address?"
      ar: "متى يجب أن يتحقّق حقل البريد من العنوان؟"
    mock:
      app: volta
      appbar: { title: { en: "Create account", ar: "أنشئ حسابًا" }, back: true }
      keyboard: text
      blocks:
        - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "m", filled: true, focus: true, error: { en: "Invalid email", ar: "بريد غير صالح" }, note: { en: "Red after the first letter", ar: "أحمر بعد أول حرف" } }
    options:
      - { id: blur, text: { en: "When people leave the field or press Continue", ar: "حين يغادر الناس الحقل أو يضغطون «متابعة»" } }
      - { id: keys, text: { en: "On every key, as now, but in orange instead of red", ar: "مع كل حرف، كما الآن، لكن بالبرتقالي بدل الأحمر" } }
      - { id: end, text: { en: "Only after payment, when the receipt can't be sent", ar: "فقط بعد الدفع، حين يتعذّر إرسال الإيصال" } }
    answer: [blur]
    misconceptions:
      - id: MC-P02-039
        when: [keys]
        feedback:
          en: "A softer colour is still a warning about an address people haven't finished typing. It tells them they're wrong while they're doing it right."
          ar: "اللون الأهدأ ما زال تحذيرًا من عنوان لم ينتهِ الناس من كتابته. فهو يخبرهم أنهم مخطئون وهم يكتبون الصواب."
      - id: MC-P02-038
        when: [end]
        feedback:
          en: "By then people have left the form and the receipt is lost. The check should come while the mistake is still easy to fix."
          ar: "حينها يكون الناس قد تركوا النموذج وضاع الإيصال. يجب أن يأتي التحقّق والخطأ ما زال سهل الإصلاح."
    hints:
      - en: "Is \"m\" a wrong email, or an email that isn't finished yet?"
        ar: "هل «m» بريد خطأ، أم بريد لم يكتمل بعد؟"
    correct:
      en: "Check when people are done with the field."
      ar: "تحقّق حين ينتهي الناس من الحقل."
    explain:
      en: "Checking when people leave the field catches a real mistake early, without scolding them halfway through typing."
      ar: "التحقّق حين يغادر الناس الحقل يكتشف الخطأ الحقيقي مبكرًا، دون أن يوبّخهم وهم في منتصف الكتابة."

  - id: S06
    type: compare
    speaker: karim
    part: contrast
    skill: SK-P02-U05-01
    rules: [R11]
    value:
      en: "Error-message guidelines (NN/g): use a positive tone and don't blame the user. Avoid words like invalid, illegal or incorrect; say what will work."
      ar: "إرشادات رسائل الخطأ (NN/g): استخدم نبرة إيجابية ولا تلُم المستخدم. تجنّب كلمات مثل «غير صالح» و«غير مسموح» و«خطأ»؛ وقل ما الذي سينجح."
    ref: { url: "https://www.nngroup.com/articles/error-message-guidelines/", quote: "Take a positive tone and don't blame the user." }
    scenario:
      en: "I'm building a train ticket website. When people type their birth date in the wrong order, we show a message under the field."
      ar: "أبني موقعًا لتذاكر القطارات. وحين يكتب الناس تاريخ ميلادهم بترتيب خاطئ، نعرض رسالة تحت الحقل."
    prompt:
      en: "Which message is better?"
      ar: "أيّ رسالة تساعد الراكب على تصحيح التاريخ دون أن يشعر باللوم؟"
    a:
      label: { en: "Version A", ar: "النسخة A: رسالة تقول إن الإدخال غير صالح" }
      mock:
        app: rehla
        frame: wide
        url: rehla.example/intercity/passenger
        blocks:
          - { kind: title, text: { en: "Passenger details", ar: "بيانات الراكب" } }
          - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "1998/24/03", filled: true, error: { en: "Invalid input! Illegal date format.", ar: "إدخال غير صالح! صيغة تاريخ غير مسموحة." }, gap: m }
    b:
      label: { en: "Version B", ar: "النسخة B: رسالة تشرح طريقة كتابة التاريخ" }
      mock:
        app: rehla
        frame: wide
        url: rehla.example/intercity/passenger
        blocks:
          - { kind: title, text: { en: "Passenger details", ar: "بيانات الراكب" } }
          - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "1998/24/03", filled: true, error: { en: "Enter the day, then the month: 24/03/1998", ar: "اكتب اليوم ثم الشهر: 24/03/1998" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P02-040
        when: [a]
        feedback:
          en: "\"Invalid\" and \"illegal\" sound like an accusation and still don't say how to write the date."
          ar: "«غير صالح» و«غير مسموح» تبدوان اتهامًا، وما زالتا لا تقولان كيف يُكتب التاريخ."
    correct:
      en: "B: calm, and it shows the right way."
      ar: "B: هادئة، وتُظهر الطريقة الصحيحة."
    explain:
      en: "B uses the person's own date to show the format, so fixing it takes a second. No blame, just the next step."
      ar: "تستخدم B تاريخ الشخص نفسه لتوضّح الصيغة، فيستغرق الإصلاح ثانية. لا لوم، بل الخطوة التالية فقط."

  - id: S07
    type: choose
    speaker: hana
    part: independent
    skill: SK-P02-U05-02
    rules: [R14]
    confidence: true
    value:
      en: "Error-message guidelines (NN/g): preserve the user's input. Let people fix the error by editing what they entered, not by starting over."
      ar: "إرشادات رسائل الخطأ (NN/g): احتفظ بما أدخله المستخدم. دَع الناس يصلحون الخطأ بتعديل ما أدخلوه، لا بالبدء من جديد."
    ref: { url: "https://www.nngroup.com/articles/error-message-guidelines/", quote: "Let users correct errors by editing their original action instead of starting over." }
    scenario:
      en: "My gym's membership form has 12 fields. If the phone number has a mistake, the page reloads with every field empty and a message at the top."
      ar: "نموذج الاشتراك في النادي الذي أملكه فيه 12 حقلًا. وإن كان في رقم الهاتف خطأ، يُعاد تحميل الصفحة وكل الحقول فارغة، مع رسالة في الأعلى."
    prompt:
      en: "What should happen instead?"
      ar: "ماذا يجب أن يحدث بدلًا من ذلك؟"
    mock:
      app: nashat
      frame: wide
      url: nashat.example/join
      navbar: { links: [ { en: "Timetable", ar: "الجدول" }, { en: "Prices", ar: "الأسعار" }, { en: "Join", ar: "اشترك" } ], active: 2 }
      blocks:
        - { kind: banner, icon: warning-circle, tone: bad, text: { en: "There was a problem with your form.", ar: "حدثت مشكلة في النموذج." } }
        - { kind: field, label: { en: "Full name", ar: "الاسم بالكامل" }, text: "", gap: m }
        - { kind: field, label: { en: "Phone", ar: "الهاتف" }, text: "", gap: s }
        - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "", gap: s, note: { en: "All 12 answers cleared after one typo", ar: "مُسحت الإجابات الـ 12 بسبب خطأ واحد" } }
    options:
      - { id: keep, text: { en: "Keep all 12 answers, mark the phone field, and say what to fix there", ar: "إبقاء الإجابات الاثنتي عشرة، وتمييز حقل الهاتف، وقول ما يجب إصلاحه فيه" } }
      - { id: clear, text: { en: "Clear only the phone field", ar: "مسح حقل الهاتف فقط" } }
      - { id: save, text: { en: "Keep the empty form, but add \"Fill in again carefully\"", ar: "إبقاء النموذج فارغًا، مع إضافة «املأ مرة أخرى بعناية»" } }
    answer: [keep]
    misconceptions:
      - id: MC-P02-041
        when: [clear, save]
        feedback:
          en: "Clearing the phone field hides the very digits people need to see to spot the mistake, and an empty form makes them redo 12 answers for one typo."
          ar: "مسح حقل الهاتف يُخفي الأرقام التي يحتاج الناس إلى رؤيتها ليكتشفوا الخطأ، والنموذج الفارغ يجعلهم يعيدون 12 إجابة بسبب خطأ واحد."
    hints:
      - en: "What do people need on screen to fix a typo in their number?"
        ar: "ماذا يحتاج الناس على الشاشة ليصلحوا خطأً في رقمهم؟"
    correct:
      en: "Keep everything; point to the one fix."
      ar: "احتفظ بكل شيء؛ وأشِر إلى الإصلاح الوحيد."
    explain:
      en: "With their answers kept and the number still in the field, people see the typo, correct one digit and continue."
      ar: "حين تبقى إجاباتهم ويبقى الرقم في الحقل، يرى الناس الخطأ، ويصحّحون رقمًا واحدًا، ويتابعون."

  - id: S08
    type: card
    part: recap
    icons: [warn, text, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Say what happened and what to do,** in plain words, without codes or blame.\n- **Put the error next to its cause,** and show it once people are done, not while they type.\n- **Keep what people entered,** so a fix is one small edit.\n\nNext: help people find help."
      ar: "- **قل ما حدث وما يجب فعله،** بكلمات بسيطة، دون رموز أو لوم.\n- **ضع الخطأ بجانب سببه،** وأظهِره بعد أن ينتهي الناس، لا أثناء الكتابة.\n- **احتفظ بما أدخله الناس،** حتى يكون الإصلاح تعديلًا صغيرًا.\n\nالتالي: ساعد الناس على إيجاد المساعدة."
