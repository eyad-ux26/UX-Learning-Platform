id: P02-U05
free: false
title:
  en: "Help people recover, and find help"
  ar: "ساعد الناس على إصلاح أخطائهم، وعلى إيجاد المساعدة"
skill:
  en: "Find and fix error messages that confuse or blame people, and help that is hard to find or follow (heuristics 9 and 10)."
  ar: "اكتشف وأصلح رسائل الخطأ التي تربك الناس أو تلومهم، والمساعدة التي يصعب إيجادها أو اتباعها (المبدآن 9 و10: مساعدة الناس على ملاحظة الأخطاء وفهمها وإصلاحها (Help users recognize, diagnose, and recover from errors)، والمساعدة والتوثيق (Help and documentation))."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P02-U05-01
    title: { en: "Write errors people understand and can fix", ar: "اكتب رسائل خطأ يفهمها الناس ويعرفون كيف يصلحونها" }
    can_do: { en: "Say what went wrong in plain words, precisely, without blame, and suggest a way to fix it.", ar: "قل ما الخطأ بكلمات بسيطة، وبدقة، ودون لوم، واقترح طريقة لإصلاحه." }
  - id: SK-P02-U05-02
    title: { en: "Show errors where and when they help", ar: "أظهِر الأخطاء في المكان والوقت المناسبين" }
    can_do: { en: "Place the error next to its cause, make it noticeable, show it only once people are done, and keep what they typed.", ar: "ضع الخطأ بجانب سببه، واجعله ملحوظًا، وأظهِره فقط بعد أن ينتهي الناس، واحتفظ بما كتبوه." }
  - id: SK-P02-U05-03
    title: { en: "Offer help at the moment it's needed", ar: "قدّم المساعدة في لحظة الحاجة" }
    can_do: { en: "Give short help in context, next to the task it's about, and make any tour or tip easy to skip.", ar: "قدّم مساعدة قصيرة في سياقها، بجانب المهمة التي تخصّها، واجعل أي جولة أو نصيحة سهلة التخطّي." }
  - id: SK-P02-U05-04
    title: { en: "Make help easy to search and follow", ar: "اجعل المساعدة سهلة البحث والاتباع" }
    can_do: { en: "Organize help around people's tasks, make it searchable, and write it as short, concrete steps that are easy to scan.", ar: "نظّم المساعدة حول مهام الناس، واجعلها قابلة للبحث، واكتبها خطوات قصيرة محددة سهلة التصفّح." }
