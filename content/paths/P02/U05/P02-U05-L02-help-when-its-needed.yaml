id: P02-U05-L02
mode: lesson
minutes: 8
title:
  en: "Help that's there when it's needed"
  ar: "مساعدة تجدها حين تحتاجها"
speaker: nour
sources:
  - title: { en: "Help and Documentation (Usability Heuristic #10) (NN/g)", ar: "المساعدة والتوثيق (Help and documentation)، مبدأ الاستخدام 10 (NN/g)" }
    url: "https://www.nngroup.com/articles/help-and-documentation/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-042: { en: "A long manual isn't findable help", ar: "الدليل الطويل ليس مساعدة يسهل إيجادها" }
  MC-P02-043: { en: "Help belongs next to the question", ar: "المساعدة مكانها بجانب السؤال" }
  MC-P02-044: { en: "Steps beat paragraphs", ar: "الخطوات أفضل من الفقرات" }
  MC-P02-045: { en: "Forced tours get skipped", ar: "الجولات المفروضة تُتخطّى" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Page 27 of the manual", ar: "الصفحة 27 من الدليل" }
    mock:
      app: raha
      appbar: { title: { en: "Help", ar: "مساعدة" }, back: true }
      blocks:
        - { kind: listitem, icon: file-pdf, text: { en: "Raha Clinic app user manual", ar: "دليل مستخدم تطبيق عيادة راحة" }, sub: { en: "v3.2 · 40 pages · PDF", ar: "الإصدار 3.2 · 40 صفحة · PDF" } }
        - { kind: image, art: document, size: l, gap: m, note: { en: "Page 27 of 40 has the answer", ar: "الإجابة في الصفحة 27 من 40" } }
    body:
      en: "Our clinic app has a **Help** button. It opens a 40-page PDF manual.\n\nMr. Fathy wanted to move his appointment to next week. He opened Help, scrolled for a while, gave up, and called the front desk. The answer was on page 27."
      ar: "في تطبيق عيادتنا زر **مساعدة**. وهو يفتح دليلًا بصيغة PDF من 40 صفحة.\n\nأراد الأستاذ فتحي أن ينقل موعده إلى الأسبوع القادم. ففتح «مساعدة»، ومرّر الصفحات فترة، ثم استسلم واتصل بالاستقبال. وكانت الإجابة في الصفحة 27."
  - id: S02
    type: tune
    part: try
    skill: SK-P02-U05-04
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Help and documentation (NN/g): help should be easy to search and focused on the user's task. A 40-page manual is neither; task-named answers with search are both."
      ar: "جرّب أولًا. المساعدة والتوثيق (NN/g): يجب أن تكون المساعدة سهلة البحث ومركّزة على مهمة المستخدم. والدليل من 40 صفحة ليس كذلك؛ أما الإجابات التي تحمل أسماء المهام، مع مربع بحث، فتحقّق الأمرين."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Help and documentation content should be easy to search and focused on the user's task." }
    prompt:
      en: "What should Help open instead?"
      ar: "ماذا يجب أن يفتح زر «مساعدة» بدلًا من ذلك؟"
    mock:
      app: raha
      appbar: { title: { en: "Help", ar: "مساعدة" }, back: true }
      blocks:
        - { kind: image, art: document, size: l }
        - { kind: small, text: { en: "1. Introduction · 2. Installing the app · 3. Account settings …", ar: "1. مقدمة · 2. تثبيت التطبيق · 3. إعدادات الحساب …" }, gap: m }
    options:
      - id: index
        text: {"en": "The same PDF, with a table of contents on the first page", "ar": "ملف PDF نفسه، مع فهرس في الصفحة الأولى"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Help", "ar": "مساعدة"}, "back": true}
          blocks:
            - {"kind": "image", "art": "document", "size": "l"}
            - {"kind": "small", "text": {"en": "Contents: 1. Introduction · 2. Installing the app · 3. Account settings … 14. Appointments", "ar": "الفهرس: 1. مقدمة · 2. تثبيت التطبيق · 3. إعدادات الحساب … 14. المواعيد"}, "gap": "m", "note": {"en": "Still the same PDF", "ar": "ما زال ملف PDF نفسه"}}
      - id: tasks
        text: {"en": "A search box, and short answers named by task: \"Change my appointment\", \"Cancel a visit\", \"Get my results\"", "ar": "مربع بحث، وإجابات قصيرة مسمّاة بالمهام: «غيّر موعدي»، «ألغِ زيارة»، «احصل على نتائجي»"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Help", "ar": "مساعدة"}, "back": true}
          blocks:
            - {"kind": "searchbar", "text": {"en": "Search help", "ar": "ابحث في المساعدة"}}
            - {"kind": "listitem", "icon": "calendar-blank", "text": {"en": "Change my appointment", "ar": "غيّر موعدي"}, "chevron": true, "gap": "m"}
            - {"kind": "listitem", "icon": "x-circle", "text": {"en": "Cancel a visit", "ar": "ألغِ زيارة"}, "chevron": true, "gap": "s"}
            - {"kind": "listitem", "icon": "file-text", "text": {"en": "Get my results", "ar": "احصل على نتائجي"}, "chevron": true, "gap": "s"}
      - id: call
        text: {"en": "Just the front desk's phone number", "ar": "رقم هاتف الاستقبال فقط"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Help", "ar": "مساعدة"}, "back": true}
          blocks:
            - {"kind": "icon", "icon": "phone", "size": "l", "color": "brand"}
            - {"kind": "heading", "text": {"en": "Call the front desk", "ar": "اتصل بالاستقبال"}, "gap": "s"}
            - {"kind": "button", "icon": "phone", "text": "02 3333 4455", "gap": "m"}
    answer: [tasks]
    misconceptions:
      - id: MC-P02-042
        when: [index]
        feedback:
          en: "A table of contents helps a little, but patients still have to guess which chapter covers their task and read through it on a phone."
          ar: "الفهرس يساعد قليلًا، لكن ما زال على المرضى أن يخمّنوا أيّ فصل يغطي مهمتهم ويقرؤوه على الهاتف."
      - id: MC-P02-043
        when: [call]
        feedback:
          en: "A phone number is useful as a last resort, but sending everyone to the front desk is the problem we have now."
          ar: "رقم الهاتف مفيد حلًّا أخيرًا، لكن إرسال الجميع إلى الاستقبال هو المشكلة التي نعاني منها الآن."
    hints:
      - en: "How would Mr. Fathy describe what he wanted to do?"
        ar: "بأيّ كلمات يصف الأستاذ فتحي ما أراد فعله؟"
    correct:
      en: "Searchable answers, named by what people want to do."
      ar: "إجابات قابلة للبحث، مسمّاة بما يريد الناس فعله."
    explain:
      en: "Patients think in tasks like \"change my appointment\". Matching those words, with search, takes them straight to the answer."
      ar: "يفكر المرضى بالمهام مثل «غيّر موعدي». ومطابقة هذه الكلمات، مع البحث، تأخذهم مباشرة إلى الإجابة."

  - id: S09
    type: video
    part: concept
    title: { en: "Help and documentation", ar: "المساعدة والتوثيق (Help and documentation)" }
    video: 2ee9eb89-5784-424c-9089-d3f1011e80fe
    duration: 184
    transcript:
      - { t: 2.5, en: "What matters in reactive help is that it's expressive, clear and detailed, because people who go to the manual don't want bullet headlines,", ar: "المهم في الـ Reactive help إنه يبقى مُعبّر، الكلام فيه واضح ومفهوم، ويكون مفصّل، لأنه بيروح للكتالوج مش عايز يلاقي رؤوس أقلام،" }
      - { t: 11.7, en: "they want detail that answers every question they actually have.", ar: "عايز يشوف كلام تفصيلي يجاوب عن كل سؤال فعلًا موجود عند اليوزر." }
      - { t: 14.7, en: "Another reactive-help guideline: chunk the content, grouping related information together,", ar: "من الـ Guidelines الخاصة بالـ Reactive help كمان: إنك تعمل Chunking للـ Content، تبدأ تجمع المعلومات الـ Related ببعض مع بعض،" }
      - { t: 23.7, en: "and build a visual hierarchy, so not everything has the same visual priority,", ar: "تعمل Visual hierarchy، تدرّج بصري، علشان ما تبقاش كل حاجة على نفس مستوى الأولوية البصرية،" }
      - { t: 29.7, en: "and put the important keywords, as we see here, in a different colour, and anything with a link in a different colour.", ar: "وتحط الـ Keywords المهمة، زي ما إحنا شايفين هنا، بلون مختلف، والحاجة اللي ليها Link بلون مختلف." }
      - { t: 38.7, en: "Divide your help into main destinations, then titles, with the content under each title,", ar: "تبدأ تقسّم الـ Help بتاعك أصلًا لـ Destinations أساسية، ثم Titles، وتحت كل Title الـ Content،" }
      - { t: 47.7, en: "and split each title's points into bullet points or numbered lists, like the Figma example, so moving through lots of detail is easier.", ar: "وتقسّم النقاط الخاصة بكل Title في Bullet points أو Numbered lists، زي ما بنشوف في مثال Figma، علشان التنقّل في التفاصيل الكتير يبقى أسهل." }
      - { t: 62.7, en: "And of course use a breadcrumb that shows where you are in the help centre or the full documentation. That's very important.", ar: "وطبعًا إنك تستخدم Breadcrumb بتعرّفك المكان اللي إنت فيه في الـ Help center أو الـ Documentation الكامل، ده شيء مهم جدًا." }
      - { t: 71.7, en: "Here's an example that fails at all of this: one block of text, I can't tell where I came from, no order, no titles,", ar: "مثال أخفق في تحقيق كل ده: المثال اللي قدامنا ده، تكست كله على بعضه، مش عارف أنا جيت منين أصلًا، ما فيش ترتيب، ما فيش Titles،" }
      - { t: 80.7, en: "so it's harder to scan, and the user takes longer to reach the useful information they're looking for.", ar: "فطبعًا الـ Scannability أصعب، واليوزر هياخد هنا وقت أكتر علشان يوصل للمعلومة المفيدة اللي بيدوّر عليها." }
      - { t: 86.7, en: "You can also use graphics and videos here, but don't drop the written information just because you added a video,", ar: "من الحاجات اللي ممكن تستفيد بيها هنا: إنك توظّف Graphics وتوظّف Videos، لكن ما تستغناش عن المعلومات المكتوبة عشان حطّيت Video،" }
      - { t: 98.7, en: "no, add text that supports the video, because some people want to read and can't play a video,", ar: "لأ، حط كتابة داعمة للـ Video، لأن الشخص ممكن يبقى عايز يقرأ، ومش مناسب له يشغّل Video،" }
      - { t: 104.7, en: "and even if they do, they can watch it while seeing the steps written in front of them. Recognition over recall, as we said,", ar: "وحتى لو شغّل الـ Video، يبقى بيبص على الـ Video وفي نفس الوقت شايف الـ Steps مكتوبة قدامه. Recognition over recall زي ما ذكرنا،" }
      - { t: 113.7, en: "it lightens the load on memory: no need to memorise every step heard in the video; they're written clearly, to go back to any time.", ar: "بيخفّف الحمل على الـ Memory: مش محتاج يحفظ كل خطوة سمعها في الـ Video، لأ، مكتوبة قدامه بشكل واضح ويقدر يرجع لها في أي وقت." }
      - { t: 122.7, en: "Another key point in reactive help: make search clear, because I've probably come here to search for something.", ar: "كذلك من أهم الحاجات اللي محتاج تراعيها في الـ Reactive help: إنك تخلّي الـ Search واضح، لأني داخل هنا غالبًا هحتاج أعمل Search على حاجة معينة." }
      - { t: 131.7, en: "Unlike this example, where search has a low contrast ratio, white on a very light colour, without enough hierarchy.", ar: "بخلاف اللي حصل في المثال ده: الـ Search هنا بـ Low contrast ratio، بلون أبيض على لون فاتح قوي، مش واخد الـ Hierarchy الكافية." }
      - { t: 140.7, en: "Here in Shopify, search has a border and its visual priority, and is clearer, which suits how important search is in any help centre.", ar: "هنا في Shopify الـ Search واخد Border، وواخد الأولوية البصرية بتاعته، وواضح أكتر، وده مناسب لأهمية الـ Search في أي Help center." }
      - { t: 152.7, en: "And when users search for something, it's great to highlight the keyword they searched, so they can scan the topics easily,", ar: "كذلك لما اليوزر يبحث عن حاجة معينة، حلو جدًا إنك تعمل Highlight للـ Keyword اللي بحث بيها، بحيث يبقى سهل عليه يعمل Scan للمواضيع،" }
      - { t: 165.7, en: "and take the next step, deciding which article or topic covers their problem best.", ar: "ويسهل عليه ياخد الخطوة اللي بعدها، ويقرّر هيدخل على أنهي مقال أو أنهي Topic يغطّي مشكلته بشكل أفضل." }

  - id: S03
    type: card
    part: concept
    icons: [search, idea, list]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The tenth heuristic: it's best if the design needs no explanation, but sometimes **help is needed, and it should be easy to find and use**.\n\n- **Make it searchable** and organized around people's tasks.\n- **Offer help in context:** a short tip right where the question comes up, not a long tour first.\n- **Keep it short and concrete:** numbered steps people can follow."
      ar: "مبدأ الاستخدام (Usability heuristic) العاشر هو المساعدة والتوثيق (Help and documentation): الأفضل أن يكون التصميم واضحًا دون شرح، لكن أحيانًا **تكون المساعدة ضرورية، ويجب أن تكون سهلة الإيجاد والاستخدام**.\n\n- **اجعلها قابلة للبحث** ومنظّمة حول مهام الناس.\n- **قدّم المساعدة في سياقها:** نصيحة قصيرة حيث يظهر السؤال، لا جولة طويلة في البداية.\n- **اجعلها قصيرة ومحددة:** خطوات مرقّمة يستطيع الناس اتباعها."

  - id: S04
    type: tune
    part: guided
    skill: SK-P02-U05-03
    rules: [R06]
    value:
      en: "Help and documentation (NN/g): pull revelations show contextual tips relevant to the user's task, so they're less likely to be ignored. Help about the insurance number belongs next to that field."
      ar: "المساعدة والتوثيق (NN/g): المساعدة عند الطلب تعرض نصائح في سياقها تخصّ مهمة المستخدم، فيقلّ احتمال تجاهلها. والمساعدة الخاصة برقم التأمين مكانها بجانب هذا الحقل."
    ref: { url: "https://www.nngroup.com/articles/help-and-documentation/", quote: "Pull revelations show contextual tips that are relevant to the user" }
    scenario:
      en: "When booking, patients must enter their insurance number. Many don't know where to find it, so they leave the booking to search the FAQ."
      ar: "عند الحجز، يجب على المرضى إدخال رقم التأمين. وكثيرون لا يعرفون أين يجدونه، فيتركون الحجز ليبحثوا في الأسئلة الشائعة."
    prompt:
      en: "Where should the help be?"
      ar: "أين نضع المساعدة حتى لا يترك المرضى الحجز؟"
    mock:
      app: raha
      appbar: { title: { en: "Book a visit", ar: "احجز زيارة" }, back: true }
      blocks:
        - { kind: progress, value: 75, label: { en: "Step 3 of 4", ar: "الخطوة 3 من 4" } }
        - { kind: field, label: { en: "Insurance number", ar: "رقم التأمين" }, text: "", focus: true, gap: m, note: { en: "Many don't know where to find it", ar: "كثيرون لا يعرفون أين يجدونه" } }
      footer:
        - { kind: button, text: { en: "Continue", ar: "متابعة" } }
    options:
      - id: tip
        text: {"en": "A \"Where do I find it?\" link under the field, showing a picture of the card with the number marked", "ar": "رابط «أين أجده؟» تحت الحقل، يعرض صورة البطاقة وعليها الرقم مميّزًا"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Book a visit", "ar": "احجز زيارة"}, "back": true}
          blocks:
            - {"kind": "progress", "value": 75, "label": {"en": "Step 3 of 4", "ar": "الخطوة 3 من 4"}}
            - {"kind": "field", "label": {"en": "Insurance number", "ar": "رقم التأمين"}, "text": "", "focus": true, "gap": "m"}
            - {"kind": "link", "icon": "question", "gap": "s", "text": {"en": "Where do I find it?", "ar": "أين أجده؟"}}
            - {"kind": "image", "art": "bank-card", "size": "m", "gap": "s", "note": {"en": "The number is marked on the card", "ar": "الرقم مميّز على البطاقة"}}
          footer:
            - {"kind": "button", "text": {"en": "Continue", "ar": "متابعة"}}
      - id: faq
        text: {"en": "A clearer FAQ entry about insurance numbers", "ar": "سؤال أوضح عن رقم التأمين في الأسئلة الشائعة"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Book a visit", "ar": "احجز زيارة"}, "back": true}
          blocks:
            - {"kind": "progress", "value": 75, "label": {"en": "Step 3 of 4", "ar": "الخطوة 3 من 4"}}
            - {"kind": "field", "label": {"en": "Insurance number", "ar": "رقم التأمين"}, "text": "", "focus": true, "gap": "m", "note": {"en": "The answer is in the FAQ, outside the booking", "ar": "الإجابة في الأسئلة الشائعة، خارج الحجز"}}
          footer:
            - {"kind": "button", "text": {"en": "Continue", "ar": "متابعة"}}
      - id: intro
        text: {"en": "Explain it in the app's welcome tour", "ar": "شرحه في الجولة الترحيبية للتطبيق"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Book a visit", "ar": "احجز زيارة"}, "back": true}
          blocks:
            - {"kind": "progress", "value": 75, "label": {"en": "Step 3 of 4", "ar": "الخطوة 3 من 4"}}
            - {"kind": "field", "label": {"en": "Insurance number", "ar": "رقم التأمين"}, "text": "", "focus": true, "gap": "m", "note": {"en": "Explained once, in the welcome tour", "ar": "شُرح مرة واحدة، في الجولة الترحيبية"}}
          footer:
            - {"kind": "button", "text": {"en": "Continue", "ar": "متابعة"}}
    answer: [tip]
    misconceptions:
      - id: MC-P02-043
        when: [faq, intro]
        feedback:
          en: "Both are away from the moment the question comes up. Patients would leave the booking to find the FAQ, or remember a tour from weeks ago."
          ar: "كلاهما بعيد عن لحظة ظهور السؤال. فسيترك المرضى الحجز ليجدوا الأسئلة الشائعة، أو سيحاولون تذكّر جولة رأوها قبل أسابيع."
    hints:
      - en: "Where is the patient when the question comes up?"
        ar: "أين يكون المريض حين يظهر السؤال؟"
    correct:
      en: "Help right where the question comes up."
      ar: "المساعدة حيث يظهر السؤال."
    explain:
      en: "The link appears only where it's needed and shows exactly where to look on the card. Patients answer and keep booking."
      ar: "الرابط يظهر فقط حيث يُحتاج، ويُظهر بالضبط أين ينظر المريض على البطاقة. فيجيب ويكمل الحجز."

  - id: S05
    type: tune
    part: guided
    skill: SK-P02-U05-04
    rules: [R06]
    value:
      en: "Help and documentation (NN/g): support scanning with the rules of writing for the web: chunks, clear hierarchy, highlighted keywords and numbered lists. People in trouble don't read paragraphs."
      ar: "المساعدة والتوثيق (NN/g): ادعم التصفّح السريع بقواعد الكتابة للويب: أجزاء قصيرة، وتسلسل واضح، وكلمات مفتاحية بارزة، وقوائم مرقّمة. فمن يواجه مشكلة لا يقرأ الفقرات."
    ref: { url: "https://www.nngroup.com/articles/help-and-documentation/", quote: "Support scanning by using the rules of writing for the web." }
    scenario:
      en: "Our answer about changing an appointment is one long paragraph: why changes are allowed, our policy on late changes, and somewhere in the middle, how to do it."
      ar: "إجابتنا عن تغيير الموعد فقرة طويلة واحدة: لماذا يُسمح بالتغيير، وسياستنا في التغيير المتأخر، وفي مكان ما في المنتصف، طريقة التغيير."
    prompt:
      en: "How should the answer be written?"
      ar: "كيف تُكتب الإجابة ليغيّر المريض موعده بسهولة؟"
    mock:
      app: raha
      appbar: { title: { en: "Change my appointment", ar: "تغيير موعدي" }, back: true }
      blocks:
        - { kind: text, text: { en: "We allow patients to change appointments because plans change, and our policy is to keep schedules flexible. Changes made less than 24 hours before the visit may have a fee. To change it, open My visits, tap the visit and choose Change time, then pick a new slot. Changes are confirmed by text message.", ar: "نسمح للمرضى بتغيير المواعيد لأن الخطط تتغيّر، وسياستنا أن تبقى المواعيد مرنة. وقد تُفرض رسوم على التغيير قبل الزيارة بأقل من 24 ساعة. ولتغييره، افتح «زياراتي» واضغط الزيارة واختر «غيّر الموعد»، ثم اختر موعدًا جديدًا. ويُؤكَّد التغيير برسالة نصية." }, note: { en: "The steps are in the middle of the paragraph", ar: "الخطوات في منتصف الفقرة" } }
    options:
      - id: steps
        text: {"en": "Numbered steps first (1. Open My visits 2. Tap the visit 3. Tap Change time), then the late-change rule in one line", "ar": "خطوات مرقّمة أولًا (1. افتح زياراتي 2. اضغط الزيارة 3. اضغط «غيّر الموعد»)، ثم قاعدة التغيير المتأخر في سطر واحد"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Change my appointment", "ar": "تغيير موعدي"}, "back": true}
          blocks:
            - {"kind": "list", "style": "number", "items": [{"en": "Open **My visits**", "ar": "افتح **زياراتي**"}, {"en": "Tap the visit", "ar": "اضغط الزيارة"}, {"en": "Tap **Change time** and pick a new slot", "ar": "اضغط **غيّر الموعد** واختر موعدًا جديدًا"}]}
            - {"kind": "small", "color": "muted", "gap": "s", "text": {"en": "Less than 24 hours before the visit, a fee may apply.", "ar": "غيّر موعدك قبل الزيارة بـ 24 ساعة على الأقل، حتى لا تُطلب منك أي رسوم."}}
      - id: bold
        text: {"en": "The same paragraph, with the key sentence in bold", "ar": "الفقرة نفسها، مع الجملة المهمة بخط عريض"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Change my appointment", "ar": "تغيير موعدي"}, "back": true}
          blocks:
            - {"kind": "text", "text": {"en": "We allow patients to change appointments because plans change, and our policy is to keep schedules flexible. Changes made less than 24 hours before the visit may have a fee. **To change it, open My visits, tap the visit and choose Change time, then pick a new slot.** Changes are confirmed by text message.", "ar": "نسمح للمرضى بتغيير المواعيد لأن الخطط تتغيّر، وسياستنا أن تبقى المواعيد مرنة. وقد تُفرض رسوم على التغيير قبل الزيارة بأقل من 24 ساعة. **ولتغييره، افتح «زياراتي» واضغط الزيارة واختر «غيّر الموعد»، ثم اختر موعدًا جديدًا.** ويُؤكَّد التغيير برسالة نصية."}, "note": {"en": "Still in the middle, now in bold", "ar": "ما زالت في المنتصف، لكن بخط عريض"}}
      - id: video
        text: {"en": "Replace it with a 3-minute video", "ar": "وضع فيديو مدته 3 دقائق مكانها"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Change my appointment", "ar": "تغيير موعدي"}, "back": true}
          blocks:
            - {"kind": "image", "art": "clinic", "size": "l", "text": "▶ 3:00", "note": {"en": "A 3-minute video, no text", "ar": "فيديو مدته 3 دقائق، بلا نص"}}
    answer: [steps]
    misconceptions:
      - id: MC-P02-044
        when: [bold]
        feedback:
          en: "Bold helps people spot one sentence, but they still have to turn a paragraph into actions in their head."
          ar: "الخط العريض يساعد الناس على رؤية جملة واحدة، لكن ما زال عليهم أن يحوّلوا الفقرة إلى خطوات في أذهانهم."
      - id: MC-P02-042
        when: [video]
        feedback:
          en: "A video can help as an extra, but many people can't play sound or don't want to watch three minutes for three taps."
          ar: "الفيديو قد يساعد إضافةً، لكن كثيرين لا يستطيعون تشغيل الصوت أو لا يريدون مشاهدة ثلاث دقائق من أجل ثلاث ضغطات."
    hints:
      - en: "What does someone with the app open in one hand need to see?"
        ar: "ماذا يحتاج إلى رؤيته من يمسك التطبيق مفتوحًا بيد واحدة؟"
    correct:
      en: "Concrete steps people can follow."
      ar: "خطوات محددة يستطيع الناس اتباعها."
    explain:
      en: "Numbered steps can be followed one by one while using the app. The policy still matters, so it stays, short, after the steps."
      ar: "الخطوات المرقّمة يمكن اتباعها واحدة واحدة أثناء استخدام التطبيق. والسياسة ما زالت مهمة، فتبقى قصيرة بعد الخطوات."

  - id: S06
    type: compare
    speaker: rami
    part: contrast
    skill: SK-P02-U05-03
    rules: [R11]
    value:
      en: "Help and documentation (NN/g): push revelations should be easy to ignore. A tour that can't be skipped stalls people from using the app, especially those who don't need it."
      ar: "المساعدة والتوثيق (NN/g): المساعدة المفروضة يجب أن يسهل تجاهلها. والجولة التي لا يمكن تخطّيها تعطّل الناس عن استخدام التطبيق، خاصة من لا يحتاجونها."
    ref: { url: "https://www.nngroup.com/articles/help-and-documentation/", quote: "Push revelations should be easy to ignore (e.g., by dismissing them)." }
    scenario:
      en: "I'm designing a photo editing app. On first launch, we want to point out a few tools."
      ar: "أصمّم تطبيقًا لتعديل الصور. وعند أول تشغيل، نريد أن نُبرز بعض الأدوات."
    prompt:
      en: "Which first launch is better?"
      ar: "أيّ نسخة تتيح للناس أن يبدؤوا تعديل صورهم بسرعة؟"
    a:
      label: { en: "Version A: a 7-step tour", ar: "النسخة A: جولة من 7 خطوات" }
      mock:
        app: suwar
        theme: dark
        blocks:
          - { kind: image, art: beach, size: xl }
        overlay:
          type: dialog
          blocks:
            - { kind: small, text: { en: "Tip 1 of 7: This is the Crop tool.", ar: "النصيحة 1 من 7: هذه أداة القص." } }
            - { kind: button, text: { en: "Next", ar: "التالي" }, gap: m }
    b:
      label: { en: "Version B: one skippable tip", ar: "النسخة B: نصيحة واحدة يمكن تخطّيها" }
      mock:
        app: suwar
        theme: dark
        blocks:
          - { kind: image, art: beach, size: xl }
          - { kind: tip, text: { en: "Tap any tool to see what it does", ar: "اضغط أي أداة لترى ما تفعله" } }
          - { kind: link, text: { en: "Got it", ar: "فهمت" }, gap: xs }
    answer: b
    misconceptions:
      - id: MC-P02-045
        when: [a]
        feedback:
          en: "Seven tips with no skip stand between people and their photo. Most tap Next without reading, and remember none of it later."
          ar: "سبع نصائح دون تخطٍّ تقف بين الناس وصورتهم. وأغلبهم يضغطون «التالي» دون قراءة، ولا يتذكّرون شيئًا منها لاحقًا."
    correct:
      en: "B: brief, and easy to dismiss."
      ar: "B: قصيرة، وسهلة الإغلاق."
    explain:
      en: "B gives one useful hint, lets people start editing at once, and leaves the rest to discover when they tap a tool."
      ar: "تعطي B تلميحًا مفيدًا واحدًا، وتتيح للناس بدء التعديل فورًا، وتترك الباقي ليكتشفوه حين يضغطون أداة."

  - id: S07
    type: tune
    speaker: tarek
    part: independent
    skill: SK-P02-U05-04
    rules: [R14]
    value:
      en: "Help and documentation (NN/g): when there's a lot of help content, highlight the content that is viewed most, so people find common answers fast."
      ar: "المساعدة والتوثيق (NN/g): حين يكثر محتوى المساعدة، أبرِز المحتوى الأكثر مشاهدة، حتى يجد الناس الإجابات الشائعة بسرعة."
    ref: { url: "https://www.nngroup.com/articles/help-and-documentation/", quote: "Highlight top content that is frequently viewed." }
    scenario:
      en: "Our bank's help centre has 300 articles in alphabetical order. Half of all visits are about three things: a blocked card, a failed transfer and a forgotten password."
      ar: "مركز المساعدة في بنكنا فيه 300 مقال بترتيب أبجدي. ونصف الزيارات كلها عن ثلاثة أشياء: بطاقة موقوفة، وتحويل فاشل، وكلمة مرور منسية."
    prompt:
      en: "What should the help centre's first screen show?"
      ar: "ماذا تعرض الشاشة الأولى في مركز المساعدة ليجد أغلب الزوار إجابتهم بسرعة؟"
    mock:
      app: rasid
      appbar: { title: { en: "Help centre", ar: "مركز المساعدة" }, back: true }
      blocks:
        - { kind: listitem, text: { en: "Account statements", ar: "أماكن ماكينات الصرف" }, chevron: true }
        - { kind: listitem, text: { en: "ATM locations", ar: "بطاقة موقوفة" }, chevron: true, gap: s }
        - { kind: listitem, text: { en: "Beneficiaries", ar: "كشوف الحساب" }, chevron: true, gap: s }
        - { kind: listitem, text: { en: "Blocked card", ar: "المستفيدون" }, chevron: true, gap: s, note: { en: "300 articles, A to Z", ar: "300 مقال، أبجديًا" } }
        - { kind: more, text: { en: "+296 more articles, about 18 screens", ar: "+296 مقالًا آخر، في نحو 18 شاشة" } }
    options:
      - id: top
        text: {"en": "A search box, the three top questions as big buttons, and topics like Cards, Transfers and Sign-in", "ar": "مربع بحث، والأسئلة الثلاثة الأشهر أزرارًا كبيرة، وموضوعات مثل البطاقات والتحويلات وتسجيل الدخول"}
        mock:
          app: "rasid"
          appbar: {"title": {"en": "Help centre", "ar": "مركز المساعدة"}, "back": true}
          blocks:
            - {"kind": "searchbar", "text": {"en": "Search help", "ar": "ابحث في المساعدة"}}
            - {"kind": "button", "style": "outline", "icon": "credit-card", "text": {"en": "My card is blocked", "ar": "بطاقتي موقوفة"}, "gap": "m"}
            - {"kind": "button", "style": "outline", "icon": "arrows-left-right", "text": {"en": "My transfer failed", "ar": "فشل تحويلي"}, "gap": "s"}
            - {"kind": "button", "style": "outline", "icon": "key", "text": {"en": "I forgot my password", "ar": "نسيت كلمة المرور"}, "gap": "s"}
            - {"kind": "chips", "gap": "m", "items": [{"text": {"en": "Cards", "ar": "البطاقات"}}, {"text": {"en": "Transfers", "ar": "التحويلات"}}, {"text": {"en": "Sign-in", "ar": "تسجيل الدخول"}}]}
      - id: abc
        text: {"en": "All 300 articles, A to Z, so nothing is hidden", "ar": "كل المقالات الثلاثمئة أبجديًا، حتى لا يُخفى شيء"}
        mock:
          app: "rasid"
          appbar: {"title": {"en": "Help centre", "ar": "مركز المساعدة"}, "back": true}
          blocks:
            - {"kind": "listitem", "text": {"en": "Account statements", "ar": "أماكن ماكينات الصرف"}, "chevron": true}
            - {"kind": "listitem", "text": {"en": "ATM locations", "ar": "بطاقة موقوفة"}, "chevron": true, "gap": "s"}
            - {"kind": "listitem", "text": {"en": "Beneficiaries", "ar": "كشوف الحساب"}, "chevron": true, "gap": "s"}
            - {"kind": "listitem", "text": {"en": "Blocked card", "ar": "المستفيدون"}, "chevron": true, "gap": "s", "note": {"en": "All 300, A to Z: nothing hidden, nothing first", "ar": "كلها، أبجديًا: لا شيء مخفي، ولا شيء في المقدمة"}}
            - {"kind": "more", "text": {"en": "+296 more articles, about 18 screens", "ar": "+296 مقالًا آخر، في نحو 18 شاشة"}}
      - id: new
        text: {"en": "The newest articles first", "ar": "أحدث المقالات أولًا"}
        mock:
          app: "rasid"
          appbar: {"title": {"en": "Help centre", "ar": "مركز المساعدة"}, "back": true}
          blocks:
            - {"kind": "listitem", "text": {"en": "New: pay bills with a QR code", "ar": "جديد: ادفع الفواتير برمز QR"}, "chevron": true}
            - {"kind": "listitem", "text": {"en": "Card fees for 2027", "ar": "رسوم البطاقات لعام 2027"}, "chevron": true, "gap": "s"}
            - {"kind": "listitem", "text": {"en": "Cashback on travel", "ar": "الاسترداد النقدي على السفر"}, "chevron": true, "gap": "s"}
            - {"kind": "listitem", "text": {"en": "Saving goals", "ar": "أهداف الادخار"}, "chevron": true, "gap": "s", "note": {"en": "Newest first; blocked card is far down", "ar": "الأحدث أولًا؛ و«بطاقة موقوفة» في الأسفل بعيدًا"}}
    answer: [top]
    misconceptions:
      - id: MC-P02-042
        when: [abc, new]
        feedback:
          en: "Half the visitors need one of three answers. A long alphabetical or date list makes all of them dig for it."
          ar: "نصف الزوار يحتاجون إلى واحدة من ثلاث إجابات. والقائمة الطويلة الأبجدية أو حسب التاريخ تجعلهم جميعًا يبحثون عنها."
    hints:
      - en: "What do most visitors come to the help centre for?"
        ar: "لماذا يأتي أغلب الزوار إلى مركز المساعدة؟"
    correct:
      en: "Put the most needed answers first."
      ar: "ضع أولًا الإجابات التي يحتاجها الناس أكثر."
    explain:
      en: "Half the visitors find their answer in one tap, search covers the rest, and topics group the other 297 articles by task."
      ar: "نصف الزوار يجدون إجابتهم بضغطة واحدة، والبحث يغطي الباقي، والموضوعات تجمع المقالات الـ 297 الأخرى حسب المهمة."

  - id: S08
    type: card
    part: recap
    icons: [search, idea, list]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Make help searchable** and named by people's tasks, with the most needed answers first.\n- **Help in context:** a short tip where the question comes up; tours brief and easy to skip.\n- **Write steps, not paragraphs,** so people can follow along.\n\nNext: the skill check for this unit, the last one in the path."
      ar: "- **اجعل المساعدة قابلة للبحث** ومسمّاة بمهام الناس، مع الإجابات التي يحتاجونها أكثر أولًا.\n- **مساعدة في السياق:** نصيحة قصيرة حيث يظهر السؤال؛ والجولات قصيرة وسهلة التخطّي.\n- **اكتب خطوات لا فقرات،** حتى يستطيع الناس اتباعها.\n\nالتالي: اختبار المهارة لهذه الوحدة، وهي الأخيرة في المسار."
