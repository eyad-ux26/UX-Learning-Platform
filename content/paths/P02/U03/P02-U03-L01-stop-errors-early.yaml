id: P02-U03-L01
mode: lesson
minutes: 8
title:
  en: "Stop errors before they happen"
  ar: "امنع الأخطاء قبل أن تقع"
speaker: tarek
sources:
  - title: { en: "Preventing User Errors: Avoiding Unconscious Slips (NN/g)", ar: "منع أخطاء المستخدمين: تجنّب الزلّات غير الواعية (NN/g)" }
    url: "https://www.nngroup.com/articles/slips/"
  - title: { en: "Confirmation Dialogs Can Prevent User Errors — If Not Overused (NN/g)", ar: "نوافذ التأكيد تمنع أخطاء المستخدمين، إن لم يُبالَغ فيها (NN/g)" }
    url: "https://www.nngroup.com/articles/confirmation-dialog/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-020: { en: "A warning after the mistake is too late", ar: "التحذير بعد الخطأ يأتي متأخرًا" }
  MC-P02-021: { en: "Strict formats cause the errors they reject", ar: "الصيغ الصارمة تسبّب الأخطاء التي ترفضها" }
  MC-P02-022: { en: "A vague confirmation gets a blind Yes", ar: "حين يكون سؤال التأكيد مبهمًا، يضغط الناس «نعم» دون تفكير" }
  MC-P02-023: { en: "Confirming routine actions wears people out", ar: "تأكيد الإجراءات الروتينية يُرهق الناس" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Back before she left", ar: "عادت قبل أن تسافر" }
    mock:
      app: rehla
      appbar: { title: { en: "Round trip", ar: "ذهاب وعودة" }, back: true }
      blocks:
        - { kind: listitem, icon: bus, text: { en: "Cairo → Aswan", ar: "القاهرة ← أسوان" }, sub: { en: "1 passenger", ar: "راكب واحد" } }
        - { kind: field, label: { en: "Leave", ar: "الذهاب" }, text: { en: "Wed 12 Nov", ar: "الأربعاء 12 نوفمبر" }, filled: true, icon: calendar-blank, gap: m }
        - { kind: field, label: { en: "Return", ar: "العودة" }, text: { en: "Sun 2 Nov", ar: "الأحد 2 نوفمبر" }, filled: true, icon: calendar-blank, gap: m, note: { en: "Accepted, 10 days before the trip", ar: "قبِله التطبيق، مع أنه قبل الرحلة بعشرة أيام" } }
        - { kind: price, text: { en: "EGP 820", ar: "820 جنيه" }, gap: m }
      footer:
        - { kind: button, text: { en: "Book both trips", ar: "احجز الرحلتين" } }
    body:
      en: "I manage a bus ticket app. Marwa booked a trip from Cairo to Aswan on the 12th, and a return on the 2nd. She meant the 22nd.\n\nThe app accepted it. She found out at the station on the 22nd, with no seat."
      ar: "أدير تطبيقًا لتذاكر الحافلات. حجزت مروة رحلة من القاهرة إلى أسوان يوم 12، ورحلة عودة يوم 2. وكانت تقصد يوم 22.\n\nقبِل التطبيق الحجز. واكتشفت الخطأ في المحطة يوم 22، ولم يكن لها مقعد."
  - id: S02
    type: tune
    part: try
    skill: SK-P02-U03-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Preventing slips (NN/g): when clear rules define what's acceptable, constrain the input. A return can't come before the departure, so the calendar shouldn't let people pick it."
      ar: "جرّب أولًا. منع الزلّات (NN/g): حين تحدّد قواعد واضحة ما هو مقبول، ضع حدودًا للإدخال. فالعودة لا يمكن أن تسبق الذهاب، لذلك يجب ألّا يسمح التقويم باختيار يوم قبله."
    ref: { url: "https://www.nngroup.com/articles/slips/", quote: "A helpful constraint here will force users to pick a date range that fits." }
    prompt:
      en: "What would have stopped Marwa's mistake?"
      ar: "ما الذي كان سيمنع خطأ مروة؟"
    mock:
      app: rehla
      appbar: { title: { en: "Return date", ar: "تاريخ العودة" }, back: true }
      blocks:
        - { kind: small, text: { en: "Leaving Wed 12 Nov", ar: "الذهاب الأربعاء 12 نوفمبر" } }
        - { kind: calendar, months: [ { title: { en: "November 2026", ar: "نوفمبر 2026" }, start: 0, days: 30 } ], pick: [0, 2], gap: s, note: { en: "Every day can be picked", ar: "كل الأيام قابلة للاختيار" } }
    options:
      - id: email
        text: {"en": "Send the tickets by email so she can check them", "ar": "إرسال التذاكر بالبريد لتراجعها"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Return date", "ar": "تاريخ العودة"}, "back": true}
          blocks:
            - {"kind": "small", "text": {"en": "Leaving Wed 12 Nov", "ar": "الذهاب الأربعاء 12 نوفمبر"}}
            - {"kind": "calendar", "months": [{"title": {"en": "November 2026", "ar": "نوفمبر 2026"}, "start": 0, "days": 30}], "pick": [0, 2], "gap": "s", "note": {"en": "Every day can be picked; tickets come by email after", "ar": "كل الأيام قابلة للاختيار؛ وتصل التذاكر بالبريد بعدها"}}
      - id: limit
        text: {"en": "In the return calendar, grey out every day before the 12th", "ar": "في تقويم العودة، تعطيل كل الأيام قبل يوم 12"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Return date", "ar": "تاريخ العودة"}, "back": true}
          blocks:
            - {"kind": "small", "text": {"en": "Leaving Wed 12 Nov", "ar": "الذهاب الأربعاء 12 نوفمبر"}}
            - {"kind": "calendar", "months": [{"title": {"en": "November 2026", "ar": "نوفمبر 2026"}, "start": 0, "days": 30}], "before": [0, 12], "gap": "s", "note": {"en": "Days before the 12th are greyed out", "ar": "الأيام قبل يوم 12 معطّلة"}, "today": [0, 12]}
      - id: error
        text: {"en": "Show an error after she taps Book: \"Check your dates\"", "ar": "إظهار خطأ بعد أن تضغط «احجز»: «راجع التواريخ»"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Return date", "ar": "تاريخ العودة"}, "back": true}
          blocks:
            - {"kind": "small", "text": {"en": "Leaving Wed 12 Nov", "ar": "الذهاب الأربعاء 12 نوفمبر"}}
            - {"kind": "calendar", "months": [{"title": {"en": "November 2026", "ar": "نوفمبر 2026"}, "start": 0, "days": 30}], "pick": [0, 2], "gap": "s", "note": {"en": "Every day can be picked", "ar": "كل الأيام قابلة للاختيار"}}
            - {"kind": "banner", "tone": "bad", "icon": "warning-circle", "text": {"en": "Check your dates", "ar": "راجع التواريخ"}, "gap": "m", "note": {"en": "Shown after she taps Book", "ar": "يظهر بعد أن تضغط «احجز»"}}
    answer: [limit]
    misconceptions:
      - id: MC-P02-020
        when: [email, error]
        feedback:
          en: "Both come after the slip. An email is easy to skim past, and an error makes her fix what the app could have made impossible."
          ar: "كلاهما يأتي بعد الزلّة. فالبريد قد تقرؤه بسرعة دون انتباه، ورسالة الخطأ تجعلها تُصلح خطأً كان التطبيق يستطيع منعه أصلًا."
    hints:
      - en: "Is a return on the 2nd ever a valid choice for a trip that leaves on the 12th?"
        ar: "هل العودة يوم 2 اختيار صحيح أصلًا لرحلة تبدأ يوم 12؟"
    correct:
      en: "Make the wrong choice impossible."
      ar: "اجعل الاختيار الخطأ مستحيلًا."
    explain:
      en: "If days before the departure can't be picked, the slip simply can't happen. The best error message is the one people never need to see."
      ar: "إذا كانت الأيام التي قبل الذهاب غير قابلة للاختيار، فلن تقع الزلّة أصلًا. وأفضل رسالة خطأ هي التي لا يحتاج الناس إلى رؤيتها."

  - id: S09
    type: video
    part: concept
    title: { en: "Error prevention", ar: "منع الأخطاء (Error prevention)" }
    video: 439876ad-b22f-436a-b886-7837e88486fb
    duration: 128
    transcript:
      - { t: 2.5, en: "Now let's look at a few simple steps to anticipate slips first, the unconscious errors.", ar: "طيب، تعالى نعرف كده خطوات بسيطة نتوقّع بيها الـ Slips أولًا، أو الـ Unconscious errors." }
      - { t: 7.5, en: "The first guideline for anticipating slips, unconscious errors, is to provide helpful constraints,", ar: "أول Guideline محتاج تراعيه عشان تتوقّع الـ Slipping errors، أو الأخطاء الـ Unconscious: إنك تحاول توفّر Helpful constraints،" }
      - { t: 16.56, en: "limits that stop the user from picking, by mistake, something that isn't realistic in the first place.", ar: "أو محدّدات تساعد اليوزر إنه ما يختارش حاجة بالغلط هي أصلًا غير واقعية." }
      - { t: 22.78, en: "For example, when someone books anything, they're surely booking it for the future, not the past,", ar: "زي مثلًا لو هو بيحجز أي حاجة، غالبًا أو أكيد هو بيحجزها في المستقبل، مش هيبقى بيحجزها في الماضي،" }
      - { t: 29.06, en: "so naturally the date they enter is in the future. So you shouldn't offer them past options at all,", ar: "فطبيعي إن التاريخ اللي هو بيحطّه يكون في المستقبل. فما ينفعش إنك توفّر له أصلًا الـ Options اللي في الماضي،" }
      - { t: 36.0, en: "so that if they tap a past date by mistake, you've already prevented the error: you've made those dates dimmed, disabled,", ar: "عشان لو بالغلط اختار حاجة في الماضي أو ضغط على حاجة في الماضي بالغلط، خلاص، إنت عامل له Already error prevention: إنت عملتها Dimmed أو Disabled،" }
      - { t: 45.48, en: "as we see in this Airbnb example: the user enters the check-in date,", ar: "زي ما شايفين حاليًا في المثال الخاص بـ Airbnb: اليوزر بيدخّل الـ Date اللي عايز يعمل فيه Check in،" }
      - { t: 53.58, en: "and the design makes every past date dimmed or disabled, so if, say, they tap 14 by mistake instead of 21,", ar: "فالديزاين عمل كل التواريخ اللي فاتت Dimmed أو Disabled، بحيث إنه لو نفترض إنه داس على 14 بالغلط بدل 21،" }
      - { t: 63.46, en: "the system simply won't respond, because it's disabled, not clickable, it can't be picked at all.", ar: "فكده كده أصلًا السيستم مش هيستجيب، لأنه Disabled أصلًا، مش Clickable، مش قابل إنه يتم اختياره أصلًا." }
      - { t: 70.68, en: "And by the way, this also protects against conscious errors. Imagine the user thinks July is August,", ar: "كذلك ده بيخلّينا نتوقّى الـ Conscious errors، by the way. يعني لو إنت تصوّرت إن اليوزر برضه ممكن يفتكر إن يوليو ده هو أغسطس،" }
      - { t: 80.84, en: "say they want to book 10 August, and they didn't notice the words July or August,", ar: "يعني هو عايز يحجز مثلًا يوم 10 أغسطس، وهو ما شافش كلمة يوليو، وما شافش كلمة أغسطس دي،" }
      - { t: 88.9, en: "and assumed every date in front of them, all in black, could be picked. So they pick the 10th, without seeing which month, thinking it's 10 August,", ar: "وافترض إن كل التواريخ اللي قدّامه دي مكتوبة كلها باللون الأسود، كلها ينفع يختارها. فهو ممكن يروح يختار يوم عشرة، وهو مش شايف عشرة إيه، وهو فاكر إنه عشرة أغسطس،" }
      - { t: 100.66, en: "and here they've made a mistake, because you didn't account for the fact that picking those past days would be an error anyway,", ar: "فيبقى هنا وقع في Mistake، لأنك برضه ما كنتش مراعي إن الأيام اللي فاتت دي، كده كده لو اختارها هيبقى Error،" }
      - { t: 112.54, en: "so you open the door to errors: slips, which are usual in cases like this, or mistakes, as in this example.", ar: "فتفتح المساحة لوقوع الإيرورز، سواء الـ Slips، وده المعتاد في مثل هذه الحالات، أو الـ Mistakes زي ما ذكرنا في المثال ده." }

  - id: S03
    type: card
    part: concept
    icons: [warn, target, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The fifth heuristic: good error messages matter, but the **best designs prevent problems in the first place**.\n\n- **Slips** happen when people are on autopilot. Prevent them with limits, good defaults and forgiving formats.\n- **Mistakes** happen when the design doesn't match what people think. Prevent them by showing what they need and warning early.\n- **Confirm only serious actions,** and say exactly what will happen, so the question isn't answered without reading."
      ar: "مبدأ الاستخدام (Usability heuristic) الخامس هو منع الأخطاء (Error prevention): رسائل الخطأ الجيدة مهمة، لكن **أفضل التصميمات تمنع المشكلات من البداية**.\n\n- **الزلّات (Slips)** تحدث حين يعمل الناس بحكم العادة دون تركيز. امنعها بالحدود، والقيم الافتراضية الجيدة (Defaults)، وقبول أكثر من طريقة للكتابة.\n- **الأخطاء الواعية (Mistakes)** تحدث حين لا يطابق التصميم ما يظنه الناس. امنعها بعرض ما يحتاجونه والتحذير مبكرًا.\n- **لا تطلب التأكيد إلا للإجراءات الخطيرة،** وقل بالضبط ما سيحدث، حتى لا يضغط الناس «نعم» دون قراءة."

  - id: S04
    type: tune
    part: guided
    skill: SK-P02-U03-01
    rules: [R06]
    value:
      en: "Preventing slips (NN/g): use forgiving formatting. Clean up spaces and dashes behind the scenes instead of rejecting what people naturally type."
      ar: "منع الزلّات (NN/g): اقبل أكثر من طريقة للكتابة. احذف المسافات والشرطات خلف الكواليس بدل أن ترفض ما يكتبه الناس بشكل طبيعي."
    ref: { url: "https://www.nngroup.com/articles/slips/", quote: "Do some behind-the-scenes data scrubbing to remove parentheses or other characters that users may type, rather than frustrating them with an inflexible format." }
    scenario:
      en: "At checkout, the phone field rejects anything but 11 digits in a row. People type \"010 1234 5678\", get \"Invalid number\", and many give up."
      ar: "في صفحة الدفع، يرفض حقل الهاتف أي شيء غير 11 رقمًا متتاليًا. فيكتب الناس «010 1234 5678»، فيظهر «رقم غير صالح»، ويترك كثيرون الشراء."
    prompt:
      en: "What should the field do?"
      ar: "ماذا يفعل الحقل حتى لا يتوقف الناس عند رقم الهاتف؟"
    mock:
      app: rehla
      appbar: { title: { en: "Checkout", ar: "الدفع" }, back: true }
      keyboard: number
      blocks:
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "010 1234 5678", filled: true, error: { en: "Invalid number", ar: "رقم غير صالح" }, focus: true }
        - { kind: price, text: { en: "EGP 820", ar: "820 جنيه" }, gap: m }
    options:
      - id: hint
        text: {"en": "Keep the rule, and add \"No spaces\" under the field", "ar": "تبقى القاعدة، مع إضافة «بدون مسافات» تحت الحقل"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Checkout", "ar": "الدفع"}, "back": true}
          keyboard: "number"
          blocks:
            - {"kind": "field", "label": {"en": "Mobile number", "ar": "رقم الموبايل"}, "text": "010 1234 5678", "filled": true, "error": {"en": "Invalid number", "ar": "رقم غير صالح"}, "focus": true, "hint": {"en": "No spaces", "ar": "بدون مسافات"}}
            - {"kind": "price", "text": {"en": "EGP 820", "ar": "820 جنيه"}, "gap": "m"}
      - id: forgive
        text: {"en": "Accept spaces and dashes, remove them behind the scenes, and show the number in groups as people type", "ar": "يقبل المسافات والشرطات، ويحذفها خلف الكواليس، ويعرض الرقم مقسّمًا أثناء الكتابة"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Checkout", "ar": "الدفع"}, "back": true}
          keyboard: "number"
          blocks:
            - {"kind": "field", "label": {"en": "Mobile number", "ar": "رقم الموبايل"}, "text": "010 1234 5678", "filled": true, "focus": true, "trail": "check-circle", "note": {"en": "Spaces are fine; grouped as you type", "ar": "المسافات مقبولة؛ ويُقسَّم الرقم أثناء الكتابة"}}
            - {"kind": "price", "text": {"en": "EGP 820", "ar": "820 جنيه"}, "gap": "m"}
      - id: three
        text: {"en": "Split it into three boxes of 3, 4 and 4 digits", "ar": "يقسّمه إلى ثلاثة مربعات من 3 و4 و4 أرقام"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "Checkout", "ar": "الدفع"}, "back": true}
          keyboard: "number"
          blocks:
            - {"kind": "row", "blocks": [{"kind": "field", "label": {"en": "Mobile number", "ar": "رقم الموبايل"}, "text": "010", "filled": true}, {"kind": "field", "label": " ", "text": "1234", "filled": true}, {"kind": "field", "label": " ", "text": "5678", "filled": true, "focus": true}]}
            - {"kind": "price", "text": {"en": "EGP 820", "ar": "820 جنيه"}, "gap": "m"}
    answer: [forgive]
    misconceptions:
      - id: MC-P02-021
        when: [hint, three]
        feedback:
          en: "People still have to type the way the database wants. Spaces help them check the number, and split boxes break pasting and jumping between parts."
          ar: "ما زال على الناس أن يكتبوا بالطريقة التي تريدها قاعدة البيانات. والمسافات تساعدهم على مراجعة الرقم، والمربعات المقسّمة تفسد اللصق والتنقل بين الأجزاء."
    hints:
      - en: "Why do people type the spaces in the first place?"
        ar: "لماذا يكتب الناس المسافات أصلًا؟"
    correct:
      en: "Accept what people type, and clean it up yourself."
      ar: "اقبل ما يكتبه الناس، ونظّفه بنفسك."
    explain:
      en: "Groups of digits are easier to read and check, so people catch their own typos. The system can strip the spaces in a moment; the person shouldn't have to."
      ar: "مجموعات الأرقام أسهل في القراءة والمراجعة، فيكتشف الناس أخطاءهم في الكتابة. ويستطيع النظام حذف المسافات في لحظة؛ فلا داعي لأن يفعل الشخص ذلك."

  - id: S05
    type: tune
    part: guided
    skill: SK-P02-U03-02
    rules: [R06, R15]
    value:
      en: "Confirmation dialogs (NN/g): instead of Yes/No, give buttons that say what will happen. Naming the trip and the refund lets people catch a mistake before they confirm."
      ar: "نوافذ التأكيد (NN/g): بدل «نعم/لا»، أعطِ أزرارًا تقول ما سيحدث. وذكر الرحلة والمبلغ المسترد يتيح للناس اكتشاف الخطأ قبل أن يؤكدوا."
    ref: { url: "https://www.nngroup.com/articles/confirmation-dialog/", quote: "Instead of Yes/No answers, provide response options that summarize what will happen for each possible response." }
    scenario:
      en: "Cancelling a ticket can't be undone, and only 80% is refunded. Right now the app asks: \"Are you sure? Yes / No\"."
      ar: "إلغاء التذكرة لا يمكن التراجع عنه، ولا يُسترد إلا 80% من ثمنها. والآن يسأل التطبيق: «هل أنت متأكد؟ نعم / لا»."
    prompt:
      en: "What should the confirmation say?"
      ar: "ماذا تقول نافذة التأكيد ليعرف الناس ما سيخسرونه قبل الإلغاء؟"
    mock:
      app: rehla
      appbar: { title: { en: "My tickets", ar: "تذاكري" } }
      blocks:
        - { kind: listitem, icon: bus, text: { en: "Cairo → Aswan · 12 Nov", ar: "القاهرة ← أسوان · 12 نوفمبر" }, sub: { en: "9:00 pm · seat 14 · EGP 450", ar: "9:00 م · المقعد 14 · 450 جنيه" } }
      overlay:
        type: dialog
        blocks:
          - { kind: heading, text: { en: "Are you sure?", ar: "هل أنت متأكد؟" } }
          - kind: row
            gap: m
            blocks:
              - { kind: button, text: { en: "Yes", ar: "نعم" } }
              - { kind: button, text: { en: "No", ar: "لا" }, style: outline }
    options:
      - id: same
        text: {"en": "Keep it short: \"Are you sure? Yes / No\"", "ar": "يبقى قصيرًا: «هل أنت متأكد؟ نعم / لا»"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "My tickets", "ar": "تذاكري"}}
          blocks:
            - {"kind": "listitem", "icon": "bus", "text": {"en": "Cairo → Aswan · 12 Nov", "ar": "القاهرة ← أسوان · 12 نوفمبر"}, "sub": {"en": "9:00 pm · seat 14 · EGP 450", "ar": "9:00 م · المقعد 14 · 450 جنيه"}}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Are you sure?", "ar": "هل أنت متأكد؟"}}, {"kind": "row", "gap": "m", "blocks": [{"kind": "button", "text": {"en": "Yes", "ar": "نعم"}}, {"kind": "button", "text": {"en": "No", "ar": "لا"}, "style": "outline"}]}]}
      - id: specific
        text: {"en": "\"Cancel Cairo → Aswan, 12 Nov? You'll get EGP 360 of 450 back.\" Buttons: Cancel ticket / Keep ticket", "ar": "«إلغاء رحلة القاهرة ← أسوان، 12 نوفمبر؟ سيُردّ لك 360 جنيهًا من 450». الأزرار: ألغِ التذكرة / أبقِ التذكرة"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "My tickets", "ar": "تذاكري"}}
          blocks:
            - {"kind": "listitem", "icon": "bus", "text": {"en": "Cairo → Aswan · 12 Nov", "ar": "القاهرة ← أسوان · 12 نوفمبر"}, "sub": {"en": "9:00 pm · seat 14 · EGP 450", "ar": "9:00 م · المقعد 14 · 450 جنيه"}}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Cancel Cairo → Aswan, 12 Nov?", "ar": "إلغاء رحلة القاهرة ← أسوان، 12 نوفمبر؟"}}, {"kind": "small", "gap": "s", "text": {"en": "You'll get EGP 360 of 450 back.", "ar": "سيُردّ لك 360 جنيهًا من 450."}}, {"kind": "button", "style": "danger", "text": {"en": "Cancel ticket", "ar": "ألغِ التذكرة"}, "gap": "m"}, {"kind": "button", "style": "outline", "text": {"en": "Keep ticket", "ar": "أبقِ التذكرة"}, "gap": "s"}]}
      - id: twice
        text: {"en": "Ask \"Are you sure?\" twice in a row", "ar": "يسأل «هل أنت متأكد؟» مرتين متتاليتين"}
        mock:
          app: "rehla"
          appbar: {"title": {"en": "My tickets", "ar": "تذاكري"}}
          blocks:
            - {"kind": "listitem", "icon": "bus", "text": {"en": "Cairo → Aswan · 12 Nov", "ar": "القاهرة ← أسوان · 12 نوفمبر"}, "sub": {"en": "9:00 pm · seat 14 · EGP 450", "ar": "9:00 م · المقعد 14 · 450 جنيه"}}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Are you sure?", "ar": "هل أنت متأكد؟"}, "note": {"en": "Asked a second time", "ar": "يُسأل للمرة الثانية"}}, {"kind": "row", "gap": "m", "blocks": [{"kind": "button", "text": {"en": "Yes", "ar": "نعم"}}, {"kind": "button", "text": {"en": "No", "ar": "لا"}, "style": "outline"}]}]}
    answer: [specific]
    misconceptions:
      - id: MC-P02-022
        when: [same, twice]
        feedback:
          en: "\"Are you sure?\" doesn't say which ticket or how much money is lost, so people tap Yes out of habit. Asking twice just builds the habit faster."
          ar: "«هل أنت متأكد؟» لا تقول أي تذكرة ولا كم من المال سيضيع، فيضغط الناس «نعم» بحكم العادة. والسؤال مرتين يرسّخ هذه العادة أسرع."
    hints:
      - en: "Could someone notice they picked the wrong ticket from the dialog as it is?"
        ar: "هل يستطيع أحد أن يلاحظ أنه اختار التذكرة الخطأ من النافذة بشكلها الحالي؟"
    correct:
      en: "Name the trip, the loss and each button's result."
      ar: "اذكر الرحلة والخسارة ونتيجة كل زر."
    explain:
      en: "The trip and date let people spot the wrong ticket, the refund shows what it costs, and \"Cancel ticket / Keep ticket\" makes each choice clear without reading the question again."
      ar: "الرحلة والتاريخ يجعلان الناس يلاحظون التذكرة الخطأ، والمبلغ المسترد يُظهر التكلفة، و«ألغِ التذكرة / أبقِ التذكرة» تجعل كل اختيار واضحًا دون قراءة السؤال مرة أخرى."

  - id: S06
    type: compare
    speaker: karim
    part: contrast
    skill: SK-P02-U03-02
    rules: [R11]
    value:
      en: "Confirmation dialogs (NN/g): don't use them for routine actions. If you cry wolf too often, people stop reading, and the dialog loses its power to prevent errors."
      ar: "نوافذ التأكيد (NN/g): لا تستخدمها للإجراءات الروتينية. فإن أكثرتَ من التحذير، توقّف الناس عن القراءة، وفقدت النافذة قدرتها على منع الأخطاء."
    ref: { url: "https://www.nngroup.com/articles/confirmation-dialog/", quote: "Do not use confirmation dialogs for routine actions." }
    scenario:
      en: "I'm building a podcast app. People add episodes to playlists all day. Removing an episode from a playlist is easy to redo."
      ar: "أبني تطبيقًا للبودكاست (Podcast). يضيف الناس الحلقات إلى قوائم التشغيل طوال اليوم. وإذا حذفوا حلقة من القائمة، فمن السهل إعادتها."
    prompt:
      en: "Which version handles removing an episode better?"
      ar: "أيّ نسخة تجعل حذف حلقة سريعًا ويمكن إصلاحه؟"
    a:
      label: { en: "Version A: confirm every time", ar: "النسخة A: تأكيد في كل مرة" }
      mock:
        app: naghma
        appbar: { title: { en: "Road trip", ar: "حلقات للسفر" }, back: true }
        blocks:
          - { kind: listitem, icon: music-note, text: { en: "Start your morning", ar: "ابدأ صباحك" }, sub: "3:45" }
          - { kind: listitem, icon: music-note, text: { en: "Money talk", ar: "حديث المال" }, sub: "4:10", gap: s }
          - { kind: listitem, icon: music-note, text: { en: "Stories of the Nile", ar: "حكايات النيل" }, sub: "3:20", gap: s }
        overlay:
          type: dialog
          blocks:
            - { kind: heading, text: { en: "Remove this episode?", ar: "حذف هذه الحلقة؟" } }
            - { kind: button, text: { en: "Remove", ar: "احذف" }, gap: m }
            - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, style: text, gap: s }
    b:
      label: { en: "Version B: remove, with Undo", ar: "النسخة B: حذف فوري مع زر «تراجع»" }
      mock:
        app: naghma
        appbar: { title: { en: "Road trip", ar: "حلقات للسفر" }, back: true }
        blocks:
          - { kind: listitem, icon: music-note, text: { en: "Start your morning", ar: "ابدأ صباحك" }, sub: "3:45" }
          - { kind: listitem, icon: music-note, text: { en: "Stories of the Nile", ar: "حكايات النيل" }, sub: "3:20", gap: s }
        overlay:
          type: toast
          blocks:
            - { kind: row, blocks: [ { kind: text, text: { en: "\"Money talk\" removed", ar: "حُذفت «حديث المال»" } }, { kind: link, text: { en: "Undo", ar: "تراجع" } } ] }
    answer: b
    misconceptions:
      - id: MC-P02-023
        when: [a]
        feedback:
          en: "Asking every time slows down something people do often, and they soon tap Remove without reading. Then the dialog protects nothing."
          ar: "السؤال في كل مرة يبطئ شيئًا يفعله الناس كثيرًا، وسرعان ما يضغطون «احذف» دون قراءة. وحينها لا تحمي النافذة شيئًا."
    correct:
      en: "B: easy to fix, so no need to ask."
      ar: "B: سهل الإصلاح، فلا حاجة إلى السؤال."
    explain:
      en: "A removed episode is easy to get back, so Undo is enough. Save confirmations for the rare actions that can't be taken back, so people still read them."
      ar: "الحلقة المحذوفة سهلة الاسترجاع، فيكفي «تراجع». واحتفظ بالتأكيد للإجراءات النادرة التي لا يمكن التراجع عنها، حتى يظل الناس يقرؤونه."

  - id: S07
    type: tune
    speaker: nour
    part: independent
    skill: SK-P02-U03-01
    rules: [R14]
    confidence: true
    value:
      en: "Preventing slips (NN/g): offer reasonable defaults that fit people's real goals, then let them adjust. Typing a time from scratch invites slips such as am instead of pm."
      ar: "منع الزلّات (NN/g): قدّم قيمًا افتراضية معقولة تناسب أهداف الناس الحقيقية، ثم دَعهم يعدّلونها. وكتابة الوقت من الصفر تفتح الباب لزلّات مثل «صباحًا» بدل «مساءً»."
    ref: { url: "https://www.nngroup.com/articles/slips/", quote: "start by offering reasonable defaults that are likely to fit their real-world goals" }
    scenario:
      en: "Our clinic's app reminds patients to take their medicine. They type each reminder time by hand. Several patients set 8:00 am when they meant 8:00 pm."
      ar: "يذكّر تطبيق عيادتنا المرضى بموعد الدواء. ويكتبون كل وقت تذكير بأيديهم. وضبط عدد من المرضى 8:00 صباحًا وهم يقصدون 8:00 مساءً."
    prompt:
      en: "What should the reminder screen offer?"
      ar: "ماذا تعرض شاشة التذكير لتمنع الخلط بين الصباح والمساء؟"
    mock:
      app: raha
      appbar: { title: { en: "Medicine reminder", ar: "تذكير الدواء" }, back: true }
      keyboard: number
      blocks:
        - { kind: listitem, art: medicine, text: { en: "Metformin 500 mg", ar: "ميتفورمين 500 مجم" }, sub: { en: "Twice a day", ar: "مرتين يوميًا" } }
        - { kind: field, label: { en: "Reminder 1", ar: "التذكير 1" }, text: { en: "8:00 am", ar: "8:00 ص" }, filled: true, gap: m }
        - { kind: field, label: { en: "Reminder 2", ar: "التذكير 2" }, text: { en: "8:00 am", ar: "8:00 ص" }, filled: true, focus: true, gap: m, note: { en: "Meant 8:00 pm", ar: "كان يقصد 8:00 مساءً" } }
    options:
      - id: presets
        text: {"en": "Presets that match the prescription, such as \"Twice a day: 9 am and 9 pm\", that patients can adjust", "ar": "اختيارات جاهزة تطابق الوصفة، مثل «مرتين يوميًا: 9 صباحًا و9 مساءً»، يستطيع المرضى تعديلها"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Medicine reminder", "ar": "تذكير الدواء"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "medicine", "text": {"en": "Metformin 500 mg", "ar": "ميتفورمين 500 مجم"}, "sub": {"en": "Twice a day", "ar": "مرتين يوميًا"}}
            - {"kind": "badge", "icon": "sparkle", "gap": "m", "text": {"en": "Twice a day, from your prescription", "ar": "مرتين يوميًا، حسب وصفتك"}}
            - {"kind": "listitem", "icon": "sun", "text": {"en": "Morning", "ar": "صباحًا"}, "value": {"en": "9:00 am", "ar": "9:00 ص"}, "chevron": true, "gap": "m"}
            - {"kind": "listitem", "icon": "moon", "text": {"en": "Evening", "ar": "مساءً"}, "value": {"en": "9:00 pm", "ar": "9:00 م"}, "chevron": true, "gap": "s"}
      - id: bold
        text: {"en": "Make am and pm bigger and bolder in the field", "ar": "تكبير «ص» و«م» وكتابتهما بخط أعرض في الحقل"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Medicine reminder", "ar": "تذكير الدواء"}, "back": true}
          keyboard: "number"
          blocks:
            - {"kind": "listitem", "art": "medicine", "text": {"en": "Metformin 500 mg", "ar": "ميتفورمين 500 مجم"}, "sub": {"en": "Twice a day", "ar": "مرتين يوميًا"}}
            - {"kind": "field", "label": {"en": "Reminder 1", "ar": "التذكير 1"}, "text": {"en": "8:00 AM", "ar": "8:00 ص"}, "filled": true, "gap": "m", "weight": "bold", "px": 18}
            - {"kind": "field", "label": {"en": "Reminder 2", "ar": "التذكير 2"}, "text": {"en": "8:00 AM", "ar": "8:00 ص"}, "filled": true, "focus": true, "gap": "m", "note": {"en": "Meant 8:00 pm", "ar": "كان يقصد 8:00 مساءً"}, "weight": "bold", "px": 18}
      - id: check
        text: {"en": "Ask \"Is this time right?\" after every reminder", "ar": "سؤال «هل هذا الوقت صحيح؟» بعد كل تذكير"}
        mock:
          app: "raha"
          appbar: {"title": {"en": "Medicine reminder", "ar": "تذكير الدواء"}, "back": true}
          keyboard: "number"
          blocks:
            - {"kind": "listitem", "art": "medicine", "text": {"en": "Metformin 500 mg", "ar": "ميتفورمين 500 مجم"}, "sub": {"en": "Twice a day", "ar": "مرتين يوميًا"}}
            - {"kind": "field", "label": {"en": "Reminder 1", "ar": "التذكير 1"}, "text": {"en": "8:00 am", "ar": "8:00 ص"}, "filled": true, "gap": "m"}
            - {"kind": "field", "label": {"en": "Reminder 2", "ar": "التذكير 2"}, "text": {"en": "8:00 am", "ar": "8:00 ص"}, "filled": true, "focus": true, "gap": "m", "note": {"en": "Meant 8:00 pm", "ar": "كان يقصد 8:00 مساءً"}}
          overlay: {"type": "dialog", "blocks": [{"kind": "heading", "text": {"en": "Is this time right?", "ar": "هل هذا الوقت صحيح؟"}}, {"kind": "small", "text": {"en": "Reminder 2: 8:00 am", "ar": "التذكير 2: 8:00 صباحًا"}, "gap": "s"}, {"kind": "button", "text": {"en": "Yes", "ar": "نعم"}, "gap": "m"}, {"kind": "button", "style": "text", "text": {"en": "Change", "ar": "غيّر"}, "gap": "s"}]}
    answer: [presets]
    misconceptions:
      - id: MC-P02-020
        when: [bold, check]
        feedback:
          en: "Patients still type every time by hand, so the same slip can happen. A question after each one is quickly answered without looking."
          ar: "ما زال المرضى يكتبون كل وقت بأيديهم، فيمكن أن تقع الزلّة نفسها. والسؤال بعد كل تذكير يجيب عنه الناس بسرعة دون أن ينظروا."
    hints:
      - en: "Does the app already know how often the medicine should be taken?"
        ar: "هل يعرف التطبيق أصلًا كم مرة يجب أن يؤخذ الدواء؟"
    correct:
      en: "Start from a good default."
      ar: "ابدأ من قيمة افتراضية جيدة."
    explain:
      en: "The prescription already says how often. Starting from sensible times means most patients just confirm, and nobody has to type am or pm."
      ar: "الوصفة تقول أصلًا كم مرة. والبدء من أوقات معقولة يعني أن أغلب المرضى يؤكدون فقط، ولا يحتاج أحد إلى كتابة «صباحًا» أو «مساءً»."

  - id: S08
    type: card
    part: recap
    icons: [warn, target, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Make wrong choices impossible** where a clear rule exists, such as a return before the departure.\n- **Start from good defaults, and accept what people type,** then clean it up yourself.\n- **Confirm only what's serious,** name what will happen, and use Undo for everyday actions.\n\nNext: don't make people remember what you can show."
      ar: "- **اجعل الاختيار الخطأ مستحيلًا** حيث توجد قاعدة واضحة، مثل العودة قبل الذهاب.\n- **ابدأ من قيم افتراضية جيدة، واقبل ما يكتبه الناس،** ثم نظّفه بنفسك.\n- **لا تطلب التأكيد إلا للخطير،** واذكر ما سيحدث، واستخدم «تراجع» للإجراءات اليومية.\n\nالتالي: لا تُجبر الناس على تذكّر ما تستطيع أن تعرضه."
