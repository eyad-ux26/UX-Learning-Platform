id: P02-U03-L02
mode: lesson
minutes: 8
title:
  en: "Show it, don't make them remember"
  ar: "اعرضه، ولا تجبرهم على تذكّره"
speaker: rami
sources:
  - title: { en: "Memory Recognition and Recall in User Interfaces (NN/g)", ar: "التعرّف والتذكّر في الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/recognition-and-recall/"
  - title: { en: "Preventing User Errors: Avoiding Conscious Mistakes (NN/g)", ar: "منع أخطاء المستخدمين: تجنّب الأخطاء الواعية (NN/g)" }
    url: "https://www.nngroup.com/articles/user-mistakes/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-024: { en: "Scrolling back up means remembering", ar: "الصعود لأعلى يعني التذكّر" }
  MC-P02-025: { en: "Don't make people carry details between steps", ar: "لا تجعل الناس يحملون التفاصيل بين الخطوات" }
  MC-P02-026: { en: "An icon alone has to be remembered", ar: "الأيقونة وحدها يجب تذكّرها" }
  MC-P02-027: { en: "Hidden choices are forgotten choices", ar: "الاختيارات المخفية اختيارات منسية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Which phone was that?", ar: "أيّ هاتف كان ذلك؟" }
    body:
      en: "I'm designing a page where people compare up to three phones. The table is long: screen, camera, battery, weight, price and more.\n\nIn our test, Adel scrolled down to the battery row, then scrolled all the way back up. He had forgotten which column was which phone."
      ar: "أصمّم صفحة يقارن فيها الناس حتى ثلاثة هواتف. والجدول طويل: الشاشة، والكاميرا، والبطارية، والوزن، والسعر، وغيرها.\n\nفي تجربتنا، نزل عادل إلى صف البطارية، ثم صعد إلى أعلى الصفحة مرة أخرى. فقد نسي أيّ عمود لأيّ هاتف."
    mock:
      width: 300
      blocks:
        - { kind: meta, text: { en: "Battery: 5000 · 4500 · 4800 mAh", ar: "البطارية: 5000 · 4500 · 4800 mAh" } }
        - { kind: meta, text: { en: "Weight: 190 · 172 · 201 g", ar: "الوزن: 190 · 172 · 201 جرام" }, gap: s }
        - { kind: meta, text: { en: "Price: 14,999 · 18,500 · 12,300", ar: "السعر: 14,999 · 18,500 · 12,300" }, gap: s }

  - id: S02
    type: choose
    part: try
    skill: SK-P02-U03-03
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Recognition rather than recall (NN/g): people should not have to remember information from one part of the interface to another. Keeping the phone names fixed at the top removes the need."
      ar: "جرّب أولًا. التعرّف بدل التذكّر (NN/g): لا يجب أن يضطر الناس إلى تذكّر معلومة من جزء في الواجهة إلى جزء آخر. وتثبيت أسماء الهواتف في الأعلى يلغي هذه الحاجة."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "The user should not have to remember information from one part of the interface to another." }
    prompt:
      en: "What should I change?"
      ar: "ماذا أغيّر؟"
    options:
      - { id: sticky, text: { en: "Keep the row with the phone names fixed at the top while people scroll", ar: "أثبّت صف أسماء الهواتف في الأعلى أثناء التمرير" } }
      - { id: colors, text: { en: "Give each phone a colour, explained once at the top", ar: "أعطي كل هاتف لونًا، يُشرح مرة واحدة في الأعلى" } }
      - { id: short, text: { en: "Show fewer rows so the table is shorter", ar: "أعرض صفوفًا أقل ليقصر الجدول" } }
    answer: [sticky]
    misconceptions:
      - id: MC-P02-024
        when: [colors]
        feedback:
          en: "Now Adel has to remember which colour is which phone instead. He'll still scroll up to check."
          ar: "الآن على عادل أن يتذكّر أيّ لون لأيّ هاتف بدلًا من ذلك. وسيظل يصعد ليتأكد."
      - id: MC-P02-027
        when: [short]
        feedback:
          en: "Fewer rows hides details people came to compare, and the names still scroll away."
          ar: "الصفوف الأقل تُخفي تفاصيل جاء الناس ليقارنوها، والأسماء ما زالت تختفي مع التمرير."
    hints:
      - en: "What does Adel need to see next to the battery numbers?"
        ar: "ماذا يحتاج عادل أن يرى بجانب أرقام البطارية؟"
    correct:
      en: "Keep the names in view."
      ar: "أبقِ الأسماء ظاهرة."
    explain:
      en: "With the names always on screen, every row can be read on its own. Adel recognises the phone instead of remembering the column."
      ar: "حين تبقى الأسماء على الشاشة دائمًا، يمكن قراءة كل صف وحده. فيتعرّف عادل على الهاتف بدل أن يتذكّر العمود."

  - id: S03
    type: card
    part: concept
    icons: [eye, list, idea]
    video:
      src: clips/P02-C06.mp4
      captions: { ar: P02-C06.ar.vtt, en: P02-C06.en.vtt }
      who: { en: "UXGate instructor", ar: "مدرّب UXGate" }
      transcript:
        en: "@C06en"
        ar: "@C06ar"
    title: { en: "Recognition rather than recall", ar: "التعرّف بدل التذكّر (Recognition rather than recall)" }
    body:
      en: "The sixth heuristic: **reduce people's memory load by making things visible**. Recognising something you see is much easier than recalling it from memory.\n\n- **Keep needed information in view,** such as table headers, chosen filters and the search words.\n- **Let people pick from options** rather than type from memory: menus, suggestions, recent items.\n- **Pair icons with labels,** because only a few icons are understood by everyone."
      ar: "المبدأ السادس: **خفّف العبء على ذاكرة الناس بجعل الأشياء ظاهرة**. فالتعرّف على شيء تراه أسهل بكثير من تذكّره.\n\n- **أبقِ المعلومات المطلوبة ظاهرة،** مثل عناوين الجدول، والفلاتر المختارة، وكلمات البحث.\n- **دَع الناس يختارون من خيارات** بدل أن يكتبوا من الذاكرة: القوائم، والاقتراحات، والعناصر الحديثة.\n- **ضع اسمًا مع كل أيقونة،** لأن عددًا قليلًا فقط من الأيقونات يفهمه الجميع."

  - id: S04
    type: choose
    part: guided
    skill: SK-P02-U03-03
    rules: [R06]
    value:
      en: "Preventing mistakes (NN/g): in multistep tasks, display the contextual information people need instead of making them keep it in memory between steps."
      ar: "منع الأخطاء الواعية (NN/g): في المهام متعددة الخطوات، اعرض المعلومات التي يحتاجها الناس بدل أن تجبرهم على حفظها في الذاكرة بين الخطوات."
    ref: { url: "https://www.nngroup.com/articles/user-mistakes/", quote: "strive to display the contextual information that users need to complete a task." }
    scenario:
      en: "On the same shop, buying a phone has three steps. Step 1 shows the colour and storage people chose. On step 3, they choose an insurance plan whose price depends on that phone, but the phone isn't shown any more."
      ar: "في المتجر نفسه، لشراء الهاتف ثلاث خطوات. الخطوة 1 تعرض اللون والسعة التي اختارها الناس. وفي الخطوة 3، يختارون خطة تأمين يعتمد سعرها على هذا الهاتف، لكن الهاتف لم يعد ظاهرًا."
    prompt:
      en: "What should step 3 show?"
      ar: "ماذا يجب أن تعرض الخطوة 3؟"
    options:
      - { id: summary, text: { en: "A short summary at the top: \"Phone X · Blue · 256 GB · EGP 18,500\"", ar: "ملخصًا قصيرًا في الأعلى: «هاتف X · أزرق · 256 GB · 18,500 جنيه»" } }
      - { id: back, text: { en: "A \"Back to step 1\" link to check the phone", ar: "رابط «عُد إلى الخطوة 1» لمراجعة الهاتف" } }
      - { id: nothing, text: { en: "Nothing; people just chose it a minute ago", ar: "لا شيء؛ فقد اختاره الناس قبل دقيقة" } }
    answer: [summary]
    misconceptions:
      - id: MC-P02-025
        when: [back, nothing]
        feedback:
          en: "People get interrupted, or compare two phones before buying. Going back, or trusting their memory, invites a wrong insurance choice."
          ar: "يُقاطَع الناس، أو يقارنون هاتفين قبل الشراء. والعودة إلى الخلف، أو الاعتماد على الذاكرة، يفتح الباب لاختيار تأمين خاطئ."
    hints:
      - en: "Imagine the buyer got a phone call between step 1 and step 3."
        ar: "تخيّل أن المشتري تلقّى مكالمة هاتفية بين الخطوة 1 والخطوة 3."
    correct:
      en: "Bring the details to the step that needs them."
      ar: "أحضِر التفاصيل إلى الخطوة التي تحتاجها."
    explain:
      en: "The summary puts the phone right next to the plan that depends on it, so people decide by looking, not remembering."
      ar: "الملخص يضع الهاتف بجانب الخطة التي تعتمد عليه، فيقرّر الناس بالنظر، لا بالتذكّر."

  - id: S05
    type: choose
    part: guided
    skill: SK-P02-U03-04
    rules: [R06]
    value:
      en: "Recognition rather than recall (NN/g): information needed to use the design, such as labels and menu items, should be visible. Icons without labels must be remembered or tapped to find out."
      ar: "التعرّف بدل التذكّر (NN/g): المعلومات اللازمة لاستخدام التصميم، مثل الأسماء وعناصر القوائم، يجب أن تكون ظاهرة. والأيقونات دون أسماء يجب تذكّرها أو الضغط عليها لمعرفتها."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Information required to use the design (e.g. field labels or menu items) should be visible or easily retrievable when needed." }
    scenario:
      en: "Our shop's app has five icons in the bottom bar, with no words: a house, a grid, a heart, a box and a person. People keep opening the wrong one to find their orders."
      ar: "في تطبيق متجرنا خمس أيقونات في الشريط السفلي، دون كلمات: بيت، وشبكة مربعات، وقلب، وصندوق، وشخص. والناس يفتحون الأيقونة الخطأ باستمرار ليجدوا طلباتهم."
    prompt:
      en: "What should I change?"
      ar: "ماذا أغيّر؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Home", ar: "الرئيسية" } }
        - { kind: image, size: m, gap: s }
        - kind: row
          gap: xl
          blocks:
            - { kind: small, text: "⌂" }
            - { kind: small, text: "▦" }
            - { kind: small, text: "♡" }
            - { kind: small, text: "▣" }
            - { kind: small, text: "◯" }
    options:
      - { id: labels, text: { en: "Put a short word under each icon: Home, Shop, Saved, Orders, Account", ar: "أضع كلمة قصيرة تحت كل أيقونة: الرئيسية، والمتجر، والمحفوظات، والطلبات، والحساب" } }
      - { id: tour, text: { en: "Show a tour that explains the icons on first launch", ar: "أعرض جولة تشرح الأيقونات عند أول تشغيل" } }
      - { id: hold, text: { en: "Show each icon's name when people press and hold it", ar: "أُظهر اسم كل أيقونة حين يضغط الناس عليها مطولًا" } }
    answer: [labels]
    misconceptions:
      - id: MC-P02-026
        when: [tour, hold]
        feedback:
          en: "Both still ask people to remember what each icon means, or to find out by testing. A word under the icon answers it every single time."
          ar: "كلاهما ما زال يطلب من الناس أن يتذكّروا معنى كل أيقونة، أو يكتشفوه بالتجربة. أما الكلمة تحت الأيقونة فتجيب في كل مرة."
    hints:
      - en: "Which of these icons could mean more than one thing?"
        ar: "أيّ هذه الأيقونات قد تعني أكثر من شيء واحد؟"
    correct:
      en: "Show the label with the icon."
      ar: "اعرض الاسم مع الأيقونة."
    explain:
      en: "A box could be orders, deliveries or storage; a heart could be saved items or health. With a word under each one, people recognise the right tab at a glance."
      ar: "الصندوق قد يعني الطلبات أو التوصيل أو التخزين؛ والقلب قد يعني المحفوظات أو الصحة. ومع كلمة تحت كل أيقونة، يتعرّف الناس على القسم الصحيح من نظرة."

  - id: S06
    type: compare
    speaker: mona
    part: contrast
    skill: SK-P02-U03-03
    rules: [R11]
    value:
      en: "Recognition rather than recall (NN/g): promote recognition by making information visible and easy to reach. Chosen filters shown at the top of the results keep people from forgetting them."
      ar: "التعرّف بدل التذكّر (NN/g): ادعم التعرّف بجعل المعلومات ظاهرة وسهلة الوصول. والفلاتر المختارة المعروضة أعلى النتائج تمنع الناس من نسيانها."
    ref: { url: "https://www.nngroup.com/articles/recognition-and-recall/", quote: "How do you promote recognition? By making information and interface functions visible and easily accessible." }
    scenario:
      en: "My team makes a shoe shop app. Filters open in a side panel. Once it closes, the results show nothing about which filters are on."
      ar: "يصنع فريقي تطبيقًا لمتجر أحذية. تُفتح الفلاتر في لوحة جانبية. وبعد أن تُغلق، لا تُظهر النتائج شيئًا عن الفلاتر المفعّلة."
    prompt:
      en: "Which results screen is better?"
      ar: "أيّ شاشة نتائج أفضل؟"
    a:
      label: { en: "Version A: filters hidden", ar: "النسخة A: الفلاتر مخفية" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Shoes · 12 results", ar: "أحذية · 12 نتيجة" } }
          - { kind: link, text: { en: "Filters", ar: "الفلاتر" }, gap: s }
          - { kind: image, size: s, gap: m }
          - { kind: image, size: s, gap: s }
    b:
      label: { en: "Version B: filters shown", ar: "النسخة B: الفلاتر ظاهرة" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Shoes · 12 results", ar: "أحذية · 12 نتيجة" } }
          - kind: chips
            items:
              - { text: { en: "Size 42", ar: "مقاس 42" }, x: true }
              - { text: { en: "Running", ar: "جري" }, x: true }
              - { text: { en: "Under EGP 2,000", ar: "أقل من 2000 جنيه" }, x: true }
          - { kind: image, size: s, gap: m }
          - { kind: image, size: s, gap: s }
    answer: b
    misconceptions:
      - id: MC-P02-027
        when: [a]
        feedback:
          en: "Coming back the next day, people see only 12 shoes and think that's all the shop has. They've forgotten the filters they set."
          ar: "حين يعود الناس في اليوم التالي، يرون 12 حذاءً فقط ويظنون أن هذا كل ما في المتجر. فقد نسوا الفلاتر التي اختاروها."
    correct:
      en: "B: people can see what's narrowing the results."
      ar: "B: يرى الناس ما الذي يضيّق النتائج."
    explain:
      en: "The chips show every active filter and remove it in one tap. Nobody has to remember what they chose or open the panel to check."
      ar: "الشرائح (Chips) تُظهر كل فلتر مفعّل، وتحذفه بضغطة واحدة. فلا يحتاج أحد أن يتذكّر ما اختاره أو يفتح اللوحة ليتأكد."

  - id: S07
    type: choose
    speaker: youssef
    part: independent
    skill: SK-P02-U03-04
    rules: [R14]
    value:
      en: "Recognition rather than recall (NN/g): lists of recently viewed items help people finish a purchase they started days ago, without remembering the product's name."
      ar: "التعرّف بدل التذكّر (NN/g): قوائم العناصر التي شوهدت مؤخرًا تساعد الناس على إكمال شراء بدؤوه قبل أيام، دون أن يتذكّروا اسم المنتج."
    ref: { url: "https://www.nngroup.com/articles/recognition-and-recall/", quote: "These lists help users remember to finish a purchase that they may have started a few days ago." }
    scenario:
      en: "Customers in my tools shop often look at a product, leave, and come back days later to buy it. Many call me because they can't find it again: they don't remember its name."
      ar: "عملاء متجر الأدوات عندي كثيرًا ما ينظرون إلى منتج، ثم يغادرون، ويعودون بعد أيام ليشتروه. ويتصل بي كثيرون لأنهم لا يجدونه مرة أخرى: فهم لا يتذكّرون اسمه."
    prompt:
      en: "What would help them most?"
      ar: "ما الذي يساعدهم أكثر؟"
    options:
      - { id: recent, text: { en: "A \"Recently viewed\" row with photos on the home page", ar: "صف «شوهدت مؤخرًا» بالصور في الصفحة الرئيسية" } }
      - { id: search, text: { en: "A bigger search box on the home page", ar: "مربع بحث أكبر في الصفحة الرئيسية" } }
      - { id: email, text: { en: "Tell them to note product names before leaving", ar: "أن أطلب منهم تدوين أسماء المنتجات قبل المغادرة" } }
    answer: [recent]
    misconceptions:
      - id: MC-P02-026
        when: [search, email]
        feedback:
          en: "Search needs the name they've forgotten, and writing names down puts the memory work back on the customer."
          ar: "البحث يحتاج إلى الاسم الذي نسوه، وتدوين الأسماء يعيد عبء التذكّر على العميل."
    hints:
      - en: "What do customers still remember about the product, even without its name?"
        ar: "ماذا يتذكّر العملاء عن المنتج، حتى دون اسمه؟"
    correct:
      en: "Show them what they saw, so they can recognise it."
      ar: "اعرض لهم ما رأوه، ليتعرّفوا عليه."
    explain:
      en: "Customers may forget a name but they know the drill when they see its photo. The row turns a hard memory task into a quick glance."
      ar: "قد ينسى العملاء الاسم، لكنهم يعرفون المثقاب حين يرون صورته. والصف يحوّل مهمة تذكّر صعبة إلى نظرة سريعة."

  - id: S08
    type: card
    part: recap
    icons: [eye, list, idea]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Keep what people need in view:** fixed headers, a summary of earlier choices, visible filters.\n- **Let people pick, not recall:** recent items, suggestions and menus.\n- **Words with icons,** because most icons can mean more than one thing.\n\nNext: the skill check for this unit."
      ar: "- **أبقِ ما يحتاجه الناس ظاهرًا:** عناوين ثابتة، وملخص للاختيارات السابقة، وفلاتر ظاهرة.\n- **دَع الناس يختارون لا يتذكّرون:** العناصر الحديثة، والاقتراحات، والقوائم.\n- **كلمات مع الأيقونات،** لأن أغلب الأيقونات قد تعني أكثر من شيء.\n\nالتالي: اختبار المهارة لهذه الوحدة."
