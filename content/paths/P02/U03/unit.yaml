id: P02-U03
free: false
title:
  en: "Stop errors early, and don't make people remember"
  ar: "امنع الأخطاء مبكرًا، ولا تُجبر الناس على التذكّر"
skill:
  en: "Find and fix screens that let easy mistakes through, and screens that make people remember what the design could show them (heuristics 5 and 6)."
  ar: "اكتشف وأصلح الشاشات التي تسمح بالأخطاء السهلة، والشاشات التي تجبر الناس على تذكّر ما يمكن أن يعرضه التصميم لهم (المبدآن 5 و6)."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P02-U03-01
    title: { en: "Design out easy slips", ar: "صمّم بحيث تختفي الزلّات السهلة" }
    can_do: { en: "Prevent slips with helpful limits, good defaults and input formats that accept what people naturally type.", ar: "امنع الزلّات بحدود مفيدة، وقيم افتراضية جيدة، وصيغ إدخال تقبل ما يكتبه الناس بشكل طبيعي." }
  - id: SK-P02-U03-02
    title: { en: "Confirm only what's serious, and say exactly what will happen", ar: "لا تطلب التأكيد إلا للخطير، وقل بالضبط ما سيحدث" }
    can_do: { en: "Ask for confirmation only before actions with serious, lasting effects, and name what will happen on the dialog and its buttons.", ar: "اطلب التأكيد فقط قبل الإجراءات ذات الأثر الكبير الدائم، واذكر ما سيحدث في النافذة وعلى أزرارها." }
  - id: SK-P02-U03-03
    title: { en: "Keep what people need in view", ar: "أبقِ ما يحتاجه الناس أمامهم" }
    can_do: { en: "Show the information people need at the moment they need it, instead of making them carry it in their heads from another screen or step.", ar: "اعرض المعلومات التي يحتاجها الناس في اللحظة التي يحتاجونها فيها، بدل أن تجبرهم على حملها في أذهانهم من شاشة أو خطوة أخرى." }
  - id: SK-P02-U03-04
    title: { en: "Let people pick instead of recall", ar: "دَع الناس يختارون بدل أن يتذكّروا" }
    can_do: { en: "Give options people can recognise: labels on icons, recent items, suggestions and visible menus.", ar: "أعطِ خيارات يتعرّف عليها الناس: أسماء على الأيقونات، وعناصر حديثة، واقتراحات، وقوائم ظاهرة." }
