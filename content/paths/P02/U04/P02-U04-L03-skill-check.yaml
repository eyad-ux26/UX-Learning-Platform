id: P02-U04-L03
mode: check
minutes: 6
title:
  en: "Skill check: speed up regulars, cut the clutter"
  ar: "اختبار المهارة: سرّع المعتادين، واحذف الزحام"
speaker: karim
sources:
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
  - title: { en: "Aesthetic and Minimalist Design (Usability Heuristic #8) (NN/g)", ar: "التصميم الجمالي البسيط (مبدأ الاستخدام 8) (NN/g)" }
    url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Karim's task manager", ar: "مدير المهام لكريم" }
    body:
      en: "I'm building a task manager for small teams. People use it all day, every day. Help me review four parts of it.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "أبني أداة لإدارة المهام للفِرق الصغيرة. ويستخدمها الناس طوال اليوم، كل يوم. ساعدني في مراجعة أربعة أجزاء منها.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."

  - id: S02
    type: choose
    part: check
    skill: SK-P02-U04-01
    value:
      en: "Check, flexibility and efficiency (NN/g): provide accelerators like keyboard shortcuts and touch gestures, alongside the slower visible path."
      ar: "اختبار، المرونة والكفاءة (NN/g): قدّم مسرّعات مثل اختصارات لوحة المفاتيح وإيماءات اللمس، بجانب الطريق الظاهر الأبطأ."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Provide accelerators like keyboard shortcuts and touch gestures." }
    scenario:
      en: "To mark a task done, people open the task, tap ⋯ and choose **Mark as done**. A typical user does this 30 times a day."
      ar: "لكي يضع الناس علامة «تمّت» على مهمة، يفتحونها، ويضغطون ⋯، ويختارون **ضع علامة «تمّت»**. والمستخدم العادي يفعل ذلك 30 مرة في اليوم."
    prompt:
      en: "What should I add?"
      ar: "ماذا أضيف؟"
    options:
      - { id: fast, text: { en: "A checkbox on each task in the list, plus a swipe and a keyboard key; keep the menu option too", ar: "مربع اختيار على كل مهمة في القائمة، مع سحب ومفتاح في لوحة المفاتيح؛ مع إبقاء خيار القائمة أيضًا" } }
      - { id: move, text: { en: "Move \"Mark as done\" to the top of the ⋯ menu", ar: "نقل «ضع علامة تمّت» إلى أعلى قائمة ⋯" } }
      - { id: gesture, text: { en: "Replace the menu option with a swipe only", ar: "استبدال خيار القائمة بالسحب فقط" } }
    answer: [fast]
    misconceptions:
      - id: MC-P02-030
        when: [move]
        feedback:
          en: "It saves a moment, but people still open each task and a menu, 30 times a day."
          ar: "هذا يوفّر لحظة، لكن الناس ما زالوا يفتحون كل مهمة وقائمة، 30 مرة في اليوم."
      - id: MC-P02-029
        when: [gesture]
        feedback:
          en: "A swipe alone is hidden: new users won't find it, and they'd lose the visible way that worked."
          ar: "السحب وحده مخفي: لن يجده المستخدمون الجدد، وسيفقدون الطريقة الظاهرة التي كانت تعمل."
    correct:
      en: "Add fast paths, keep the visible one."
      ar: "أضِف طرقًا سريعة، وأبقِ الطريق الظاهر."
    explain:
      en: "The checkbox is visible to everyone and fast, the swipe and key speed up experts, and the menu option is still there for anyone who looks for it."
      ar: "مربع الاختيار ظاهر للجميع وسريع، والسحب والمفتاح يسرّعان الخبراء، وخيار القائمة ما زال موجودًا لمن يبحث عنه."

  - id: S03
    type: choose
    part: check
    skill: SK-P02-U04-02
    value:
      en: "Check, flexibility and efficiency (NN/g): allow users to tailor frequent actions. Reassigning 30 tasks is one decision repeated 30 times; let people do it once."
      ar: "اختبار، المرونة والكفاءة (NN/g): دَع المستخدمين يكيّفون الإجراءات المتكررة. وإعادة إسناد 30 مهمة قرار واحد يتكرّر 30 مرة؛ فدَع الناس ينفّذونه مرة واحدة."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Allow users to tailor frequent actions." }
    scenario:
      en: "When someone leaves a team, a manager must hand their 30 open tasks to a new person, opening and reassigning each one."
      ar: "حين يترك أحد الفريق، يجب على المدير أن يسلّم مهامه الثلاثين المفتوحة لشخص جديد، بفتح كل مهمة وإعادة إسنادها."
    prompt:
      en: "What should the app let managers do?"
      ar: "ماذا يجب أن يتيح التطبيق للمديرين؟"
    options:
      - { id: bulk, text: { en: "Filter by person, select all, and reassign them in one action", ar: "الفلترة حسب الشخص، واختيار الكل، وإعادة الإسناد بإجراء واحد" } }
      - { id: support, text: { en: "Email our support team to move the tasks", ar: "مراسلة فريق الدعم لنقل المهام" } }
      - { id: faster, text: { en: "A faster assignee dropdown inside each task", ar: "قائمة أسرع لاختيار المسؤول داخل كل مهمة" } }
    answer: [bulk]
    misconceptions:
      - id: MC-P02-028
        when: [faster, support]
        feedback:
          en: "Each task is still handled one at a time, by the manager or by someone else, with the same chance of missing one."
          ar: "ما زالت كل مهمة تُعالج وحدها، من المدير أو من غيره، مع الاحتمال نفسه لنسيان واحدة."
    correct:
      en: "One action for many items."
      ar: "إجراء واحد لعناصر كثيرة."
    explain:
      en: "Selecting all of one person's tasks and reassigning them together takes seconds and leaves none behind."
      ar: "اختيار كل مهام شخص واحد وإعادة إسنادها معًا يستغرق ثواني ولا يترك أي مهمة خلفه."

  - id: S04
    type: choose
    part: check
    skill: SK-P02-U04-03
    value:
      en: "Check, aesthetic and minimalist design (NN/g): don't let unnecessary elements distract people from the information they really need. Fourteen charts bury the one number team leads check every morning."
      ar: "اختبار، التصميم الجمالي البسيط (NN/g): لا تدَع العناصر غير الضرورية تشتّت الناس عن المعلومات التي يحتاجونها فعلًا. وأربعة عشر رسمًا بيانيًا تدفن الرقم الوحيد الذي يراجعه قادة الفرق كل صباح."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Don't let unnecessary elements distract users from the information they really need." }
    scenario:
      en: "The team dashboard shows 14 charts. In interviews, team leads said they open it each morning for one thing: which tasks are overdue, and whose."
      ar: "لوحة الفريق تعرض 14 رسمًا بيانيًا. وفي المقابلات، قال قادة الفرق إنهم يفتحونها كل صباح لشيء واحد: أيّ المهام متأخرة، ولمن."
    prompt:
      en: "What should the dashboard lead with?"
      ar: "بماذا يجب أن تبدأ اللوحة؟"
    options:
      - { id: overdue, text: { en: "An \"Overdue\" list grouped by person at the top; the charts move to a Reports page", ar: "قائمة «متأخرة» مجمّعة حسب الشخص في الأعلى؛ وتنتقل الرسوم إلى صفحة التقارير" } }
      - { id: bigger, text: { en: "Keep all 14 charts and make the overdue chart bigger", ar: "إبقاء الرسوم الأربعة عشر وتكبير رسم المتأخرات" } }
      - { id: tabs, text: { en: "Split the 14 charts into 3 tabs", ar: "تقسيم الرسوم الأربعة عشر إلى 3 أقسام" } }
    answer: [overdue]
    misconceptions:
      - id: MC-P02-032
        when: [bigger]
        feedback:
          en: "A bigger chart still sits among 13 others, and a chart is slower to read than a list of names and tasks."
          ar: "الرسم الأكبر ما زال بين 13 رسمًا آخر، والرسم أبطأ في القراءة من قائمة أسماء ومهام."
      - id: MC-P02-033
        when: [tabs]
        feedback:
          en: "Tabs just hide the charts in a different way. Team leads still have to find the one thing they came for."
          ar: "الأقسام تُخفي الرسوم بطريقة أخرى فقط. وما زال على قادة الفرق أن يجدوا الشيء الوحيد الذي جاؤوا من أجله."
    correct:
      en: "Lead with what people came for."
      ar: "ابدأ بما جاء الناس من أجله."
    explain:
      en: "The overdue list answers the morning question at a glance. The charts are still there for the rarer moments someone needs them."
      ar: "قائمة المتأخرات تجيب سؤال الصباح من نظرة. والرسوم ما زالت موجودة للحظات الأندر التي يحتاجها فيها أحد."

  - id: S05
    type: choose
    part: check
    skill: SK-P02-U04-04
    value:
      en: "Check, aesthetic and minimalist design (NN/g): if people cannot find or discover the necessary elements, those elements do not exist for them. Due dates hidden for a cleaner list are lost information."
      ar: "اختبار، التصميم الجمالي البسيط (NN/g): إن لم يستطع الناس إيجاد العناصر الضرورية أو اكتشافها، فهي غير موجودة بالنسبة لهم. وتواريخ الاستحقاق المخفية لتبدو القائمة أنظف معلومات ضائعة."
    ref: { url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/", quote: "if our users cannot find or discover the necessary elements, as far as they are concerned, those elements do not exist." }
    scenario:
      en: "In a redesign, we removed due dates from the task list to make it cleaner. They now appear only inside each task. Missed deadlines went up."
      ar: "في إعادة التصميم، حذفنا تواريخ الاستحقاق من قائمة المهام لتبدو أنظف. وأصبحت تظهر داخل كل مهمة فقط. فزادت المواعيد الفائتة."
    prompt:
      en: "What should we do?"
      ar: "ماذا نفعل؟"
    options:
      - { id: back, text: { en: "Bring the due date back to each row, short and quiet, and highlight it when it's close", ar: "إعادة تاريخ الاستحقاق إلى كل صف، قصيرًا وهادئًا، مع إبرازه حين يقترب" } }
      - { id: emails, text: { en: "Keep the clean list, and email people about due dates", ar: "إبقاء القائمة النظيفة، وإرسال بريد للناس عن المواعيد" } }
      - { id: hover, text: { en: "Show the date when people hover over a task", ar: "إظهار التاريخ حين يمرّ الناس على المهمة بالمؤشر" } }
    answer: [back]
    misconceptions:
      - id: MC-P02-034
        when: [emails, hover]
        feedback:
          en: "People plan their day from the list. A date hidden behind a hover, or in an inbox, isn't there when they decide what to do next."
          ar: "يخطّط الناس يومهم من القائمة. والتاريخ المخفي خلف المرور بالمؤشر، أو في البريد، غير موجود حين يقرّرون ما يفعلونه بعد ذلك."
    correct:
      en: "The due date is signal; keep it in view."
      ar: "تاريخ الاستحقاق إشارة؛ أبقِه ظاهرًا."
    explain:
      en: "A short date on each row adds little clutter and tells people what's urgent. Clean shouldn't mean missing what people plan with."
      ar: "التاريخ القصير على كل صف يضيف زحامًا قليلًا ويخبر الناس بما هو عاجل. والنظافة لا يجب أن تعني فقدان ما يخطّط به الناس."
