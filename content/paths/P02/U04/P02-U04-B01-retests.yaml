id: P02-U04-B01
mode: bank
title:
  en: "Re-tests: speed up regulars, cut the clutter"
  ar: "إعادة اختبار: سرّع المعتادين، واحذف الزوائد"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Flexibility and Efficiency of Use (Usability Heuristic #7) (NN/g)", ar: "المرونة وكفاءة الاستخدام (Flexibility and efficiency of use)، مبدأ الاستخدام 7 (NN/g)" }
    url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/"
  - title: { en: "Aesthetic and Minimalist Design (Usability Heuristic #8) (NN/g)", ar: "تصميم بسيط وجميل بلا زيادات (Aesthetic and minimalist design)، مبدأ الاستخدام 8 (NN/g)" }
    url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة (10 Usability heuristics) لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
steps:
  # SK-P02-U04-01: add shortcuts that don't get in the way
  - id: S01
    type: choose
    speaker: sara
    part: retest
    skill: SK-P02-U04-01
    value:
      en: "Re-test, flexibility and efficiency (NN/g): a usable accelerator is discoverable but unobtrusive. A swipe as the only way to delete is neither: most people never find it."
      ar: "إعادة اختبار، المرونة والكفاءة (NN/g): المسرّع الجيد سهل الاكتشاف ولا يزعج أحدًا. والسحب كطريقة وحيدة للحذف ليس كذلك: فأغلب الناس لا يجدونه أبدًا."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "The trick for designing a usable accelerator is making it discoverable (which mobile keyboard gestures lack) but unobtrusive." }
    scenario:
      en: "In a shopping list app I'm designing, the only way to remove an item is to swipe it left. Many people in our test kept the items they'd bought, because they never found out how."
      ar: "في تطبيق لقوائم التسوق أصمّمه، الطريقة الوحيدة لحذف عنصر هي سحبه إلى اليسار. وكثير من الناس في تجربتنا أبقوا العناصر التي اشتروها، لأنهم لم يعرفوا كيف يحذفونها."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل ليعرف أحمد أن طلبه تأخّر؟"
    mock:
      app: qaima
      appbar: { title: { en: "Groceries", ar: "البقالة" }, back: true }
      blocks:
        - { kind: listitem, icon: circle, text: { en: "Milk", ar: "حليب" } }
        - { kind: listitem, icon: circle, text: { en: "Bread", ar: "عيش" }, gap: s, swipe: { text: { en: "Remove", ar: "احذف" }, tone: bad }, note: { en: "The only way to remove: swipe left", ar: "الطريقة الوحيدة للحذف: اسحب لليسار" } }
        - { kind: listitem, icon: circle, text: { en: "Tomatoes", ar: "طماطم" }, gap: s }
    options:
      - { id: both, text: { en: "Add a visible way, such as a checkbox or ⋯ > Remove, and keep the swipe as a shortcut", ar: "إضافة طريقة ظاهرة، مثل الـ Checkbox (مربع الاختيار) أو ⋯ ← احذف، مع إبقاء السحب اختصارًا" } }
      - { id: tour, text: { en: "Keep swipe only, and show a tour about it once", ar: "إبقاء السحب فقط، مع جولة تعريفية عنه مرة واحدة" } }
      - { id: icon, text: { en: "Keep swipe only, with an arrow icon on each row", ar: "إبقاء السحب فقط، مع أيقونة سهم على كل صف" } }
    answer: [both]
    misconceptions:
      - id: MC-P02-029
        when: [tour, icon]
        feedback:
          en: "The shortcut is still the only way. People who skip the tour or misread the arrow remain stuck."
          ar: "ما زال الاختصار هو الطريقة الوحيدة. ومن يتخطّى الجولة أو يسيء فهم السهم يظل عالقًا."
    correct:
      en: "A visible way for everyone, a shortcut for regulars."
      ar: "طريقة ظاهرة للجميع، واختصار للمعتادين."
    explain:
      en: "Everyone can remove items with the visible control, and people who discover the swipe get a faster way. Nobody is stuck."
      ar: "يستطيع الجميع حذف العناصر بالعنصر الظاهر، ومن يكتشف السحب يحصل على طريقة أسرع. ولا يعلق أحد."

  - id: S02
    type: choose
    speaker: tarek
    part: retest
    skill: SK-P02-U04-01
    value:
      en: "Re-test, flexibility and efficiency (NN/g): novices rely on clearly labelled menus, while experienced users learn shortcuts and gestures for the same task. Removing the menus to look fast leaves novices behind."
      ar: "إعادة اختبار، المرونة والكفاءة (NN/g): يعتمد المبتدئون على القوائم الواضحة، بينما يتعلّم المعتادون الاختصارات والإيماءات للمهمة نفسها. وحذف القوائم ليبدو التطبيق سريعًا يترك المبتدئين خلفه."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "Novice users rely heavily on step-by-step wizards or clearly labeled menus, for example, while more-experienced users learn keyboard shortcuts or touchscreen gestures to complete the same task." }
    scenario:
      en: "Our power users love the gestures in our banking app. The team now wants to remove the menu of actions and keep gestures only, \"to make it faster for everyone\"."
      ar: "يحب المستخدمون المتمرّسون الإيماءات (Gestures) في تطبيق البنك عندنا. والفريق يريد الآن حذف قائمة الإجراءات والإبقاء على الإيماءات فقط، «لنجعله أسرع للجميع»."
    prompt:
      en: "What should I decide?"
      ar: "ماذا أقرّر بشأن قائمة الإجراءات؟"
    mock:
      app: rasid
      appbar: { title: { en: "Cards", ar: "البطاقات" } }
      blocks:
        - { kind: listitem, art: bank-card, text: { en: "Visa ending 4821", ar: "Visa تنتهي بـ 4821" }, sub: { en: "Swipe for freeze, limits, PIN", ar: "اسحب للتجميد والحدود والرقم السري" }, swipe: { text: { en: "Freeze", ar: "جمّد" }, tone: warn }, note: { en: "Menu of actions to be removed", ar: "قائمة الإجراءات التي سيحذفها الفريق" } }
    options:
      - { id: keep, text: { en: "Keep both: the labelled menu for everyone, gestures as a faster way", ar: "إبقاء الاثنين: القائمة الواضحة للجميع، والإيماءات طريقة أسرع" } }
      - { id: gestures, text: { en: "Gestures only; new users will learn them", ar: "الإيماءات فقط؛ وسيتعلّمها المستخدمون الجدد" } }
      - { id: setting, text: { en: "Gestures only, with the menu as an option deep in Settings", ar: "الإيماءات فقط، مع القائمة خيارًا في عمق الإعدادات" } }
    answer: [keep]
    misconceptions:
      - id: MC-P02-031
        when: [gestures, setting]
        feedback:
          en: "New and occasional customers would have no visible way to act, and few would find a setting to bring the menu back."
          ar: "لن يجد العملاء الجدد ومن يستخدمون التطبيق أحيانًا أي طريقة ظاهرة لتنفيذ ما يريدون، وقليلون سيجدون إعدادًا يعيد القائمة."
    correct:
      en: "Shortcuts add speed; they don't replace the clear path."
      ar: "الاختصارات تضيف سرعة؛ ولا تحلّ محل الطريقة الواضحة."
    explain:
      en: "Power users keep their gestures and everyone else keeps a menu they can read. Both groups get what they need from the same app."
      ar: "يحتفظ المتمرّسون بإيماءاتهم، ويحتفظ الباقون بقائمة يستطيعون قراءتها. وتحصل المجموعتان على ما تحتاجانه من التطبيق نفسه."

  # SK-P02-U04-02: let people repeat work in one go
  - id: S03
    type: choose
    speaker: hana
    part: retest
    skill: SK-P02-U04-02
    value:
      en: "Re-test, flexibility and efficiency (NN/g): a simple form of personalization saves settings across one user's sessions. Members who always book at the same branch shouldn't pick it every time."
      ar: "إعادة اختبار، المرونة والكفاءة (NN/g): من أبسط أشكال التخصيص حفظ الإعدادات بين جلسات المستخدم الواحد. والأعضاء الذين يحجزون دائمًا في الفرع نفسه لا يجب أن يختاروه في كل مرة."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "a simplistic approach to personalization that saves settings across one user" }
    scenario:
      en: "My gym has three branches. Every time members book a class, the app asks them to pick a branch first, though almost all of them always go to the same one."
      ar: "للنادي الذي أملكه ثلاثة فروع. وفي كل مرة يحجز فيها الأعضاء حصة، يطلب منهم التطبيق اختيار الفرع أولًا، مع أن أغلبهم يذهبون دائمًا إلى الفرع نفسه."
    prompt:
      en: "What should the app do?"
      ar: "ماذا يجب أن يفعل التطبيق؟"
    mock:
      app: nashat
      appbar: { title: { en: "Book a class", ar: "احجز حصة" }, back: true }
      blocks:
        - { kind: heading, text: { en: "Choose a branch", ar: "اختر الفرع" } }
        - { kind: radio, text: { en: "Nasr City", ar: "مدينة نصر" }, gap: m }
        - { kind: radio, text: { en: "Maadi", ar: "المعادي" }, gap: xs }
        - { kind: radio, text: { en: "Sheikh Zayed", ar: "الشيخ زايد" }, gap: xs, note: { en: "Asked on every booking", ar: "يُطلب في كل حجز" } }
      footer:
        - { kind: button, text: { en: "Next", ar: "التالي" } }
    options:
      - { id: remember, text: { en: "Open on the last branch they used, with an easy way to switch", ar: "يفتح على آخر فرع استخدمه العضو، مع طريقة سهلة للتغيير" } }
      - { id: one, text: { en: "Show all three branches' classes in one long list", ar: "يعرض حصص الفروع الثلاثة في قائمة طويلة واحدة" } }
      - { id: ask, text: { en: "Keep asking; members might change branch", ar: "يستمر في السؤال؛ فقد يغيّر الأعضاء الفرع" } }
    answer: [remember]
    misconceptions:
      - id: MC-P02-031
        when: [ask, one]
        feedback:
          en: "The app already knows where each member goes. Asking every time, or mixing in two branches they never visit, makes every booking longer."
          ar: "التطبيق يعرف أصلًا أين يذهب كل عضو. والسؤال في كل مرة، أو عرض حصص فرعين لا يزورهما، يجعل كل حجز أطول."
    correct:
      en: "Remember the choice, allow a change."
      ar: "تذكّر الاختيار، واسمح بالتغيير."
    explain:
      en: "Starting from their usual branch saves a step on every booking, and the switch keeps members free to go elsewhere."
      ar: "البدء من الفرع المعتاد يوفّر خطوة في كل حجز، وإمكانية التغيير تسمح للأعضاء بالذهاب إلى فرع آخر متى أرادوا."

  - id: S04
    type: choose
    speaker: youssef
    part: retest
    skill: SK-P02-U04-02
    value:
      en: "Re-test, flexibility and efficiency (NN/g): accelerators are secondary, faster ways to do the same task. Marking many orders as shipped together is a faster path next to the one-by-one way."
      ar: "إعادة اختبار، المرونة والكفاءة (NN/g): المسرّعات طرق ثانوية أسرع لأداء المهمة نفسها. ووضع علامة «شُحن» على طلبات كثيرة معًا طريق أسرع بجانب طريقة الواحد تلو الآخر."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "Accelerators are secondary ways of accomplishing the same task that function as faster (but typically less obvious) methods." }
    scenario:
      en: "Every afternoon the courier picks up about 30 orders from my shop. Then I open each order in my dashboard and tap **Mark as shipped**, so customers get their tracking message."
      ar: "كل يوم بعد الظهر يأخذ المندوب نحو 30 طلبًا من متجري. ثم أفتح كل طلب في لوحة التحكم وأضغط **ضع علامة «شُحن»**، لتصل إلى العملاء رسالة التتبع."
    prompt:
      en: "What would save me the most time?"
      ar: "ما الذي يوفّر عليّ أكبر قدر من الوقت؟"
    mock:
      app: dar
      frame: wide
      url: dar.example/seller/orders?status=packed
      navbar: { links: [ { en: "Products", ar: "المنتجات" }, { en: "Orders", ar: "الطلبات" } ], active: 1 }
      blocks:
        - { kind: title, text: { en: "Packed today (30)", ar: "جُهّزت اليوم (30)" } }
        - { kind: listitem, icon: package, text: { en: "#48213 · Ahmed Samy", ar: "‎#48213 · أحمد سامي" }, chevron: true, gap: m }
        - { kind: listitem, icon: package, text: { en: "#48214 · Mona Adel", ar: "‎#48214 · منى عادل" }, chevron: true, gap: s }
        - { kind: listitem, icon: package, text: { en: "#48215 · Hany Fouad", ar: "‎#48215 · هاني فؤاد" }, chevron: true, gap: s, note: { en: "Open each, tap Mark as shipped", ar: "افتح كل طلب، واضغط «شُحن»" } }
    options:
      - { id: bulk, text: { en: "Select today's packed orders in the list and mark them all shipped at once", ar: "اختيار طلبات اليوم المجهّزة في القائمة ووضع علامة «شُحن» عليها كلها مرة واحدة" } }
      - { id: button, text: { en: "A bigger Mark as shipped button inside each order", ar: "زر «شُحن» أكبر داخل كل طلب" } }
      - { id: later, text: { en: "Send the tracking messages the next morning instead", ar: "إرسال رسائل التتبع في صباح اليوم التالي بدلًا من ذلك" } }
    answer: [bulk]
    misconceptions:
      - id: MC-P02-028
        when: [button, later]
        feedback:
          en: "I'd still open 30 orders one by one, or customers would wait a day for news. The work is the same action repeated."
          ar: "سأظل أفتح 30 طلبًا واحدًا واحدًا، أو سينتظر العملاء يومًا ليعرفوا. فالعمل هو الإجراء نفسه مكررًا."
    correct:
      en: "Do the repeated action once, for all."
      ar: "نفّذ الإجراء المتكرر مرة واحدة، للجميع."
    explain:
      en: "A bulk action turns 30 visits into one, and customers get their messages right away. Single orders can still be marked one at a time."
      ar: "الإجراء الجماعي (Bulk action) يحوّل فتح 30 طلبًا إلى خطوة واحدة، وتصل الرسائل إلى العملاء فورًا. ويظل ممكنًا وضع العلامة على طلب واحد وحده."

  # SK-P02-U04-03: cut what competes with the essentials
  - id: S05
    type: choose
    speaker: nour
    part: retest
    skill: SK-P02-U04-03
    value:
      en: "Re-test, aesthetic and minimalist design (NN/g): keep the content and visual design focused on the essentials. A booking confirmation is for the date, the time and the place."
      ar: "إعادة اختبار، التصميم الجمالي البسيط (NN/g): اجعل المحتوى والتصميم البصري مركّزين على الأساسيات. فتأكيد الحجز هو للتاريخ والوقت والمكان."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Keep the content and visual design of UI focused on the essentials." }
    scenario:
      en: "Our booking confirmation screen starts with a large banner for our new dental department, then health tips, then a rating request. The appointment details are at the bottom."
      ar: "شاشة تأكيد الحجز عندنا تبدأ بـ Banner كبير لقسم الأسنان الجديد، ثم نصائح صحية، ثم طلب تقييم. وتفاصيل الموعد في الأسفل."
    prompt:
      en: "What should the screen lead with?"
      ar: "بماذا تبدأ الشاشة ليجد المرضى تفاصيل موعدهم فورًا؟"
    mock:
      app: raha
      appbar: { title: { en: "Booked!", ar: "تمّ الحجز!" } }
      blocks:
        - { kind: card, art: clinic, blocks: [ { kind: heading, text: { en: "Our new dental department is open!", ar: "افتتحنا قسم الأسنان الجديد!" } } ] }
        - { kind: list, style: bullet, items: [ { en: "Drink 8 glasses of water", ar: "اشرب 8 أكواب ماء" }, { en: "Walk 30 minutes a day", ar: "امشِ 30 دقيقة يوميًا" } ], gap: m }
        - { kind: small, text: { en: "Rate us ★★★★★", ar: "قيّمنا ★★★★★" }, gap: m }
        - { kind: small, text: { en: "Dr. Samir · Sun 9 Nov, 5 pm · Dokki", ar: "د. سمير · الأحد 9 نوفمبر، 5 م · الدقي" }, gap: m, note: { en: "The booking details, at the bottom", ar: "تفاصيل الحجز، في الأسفل" } }
    options:
      - { id: details, text: { en: "Doctor, date, time and address, with Add to calendar; the rest goes below or away", ar: "الطبيب والتاريخ والوقت والعنوان، مع «أضف إلى التقويم»؛ والباقي ينزل إلى الأسفل أو يُحذف" } }
      - { id: bold, text: { en: "Keep the order, but make the appointment details bold", ar: "يبقى الترتيب، مع جعل تفاصيل الموعد بخط عريض" } }
      - { id: banner, text: { en: "Shrink the dental banner a little", ar: "تصغير Banner قسم الأسنان قليلًا" } }
    answer: [details]
    misconceptions:
      - id: MC-P02-032
        when: [bold, banner]
        feedback:
          en: "The details still sit under a banner, tips and a rating request. Patients have to dig for the one thing this screen is for."
          ar: "ما زالت التفاصيل تحت Banner ونصائح وطلب تقييم. وعلى المرضى أن يبحثوا عن الشيء الوحيد الذي وُجدت الشاشة من أجله."
    correct:
      en: "Lead with the essentials of the task."
      ar: "ابدأ بأساسيات المهمة."
    explain:
      en: "After booking, patients want to check when and where. Leading with that, and moving the rest down, makes the screen do its job."
      ar: "بعد الحجز، يريد المرضى التأكد من الموعد والمكان. والبدء بذلك، وإنزال الباقي، يجعل الشاشة تؤدي وظيفتها."

  - id: S06
    type: compare
    speaker: rami
    part: retest
    skill: SK-P02-U04-03
    value:
      en: "Re-test, aesthetic and minimalist design (NN/g): aesthetics matter, but clarity always wins over visual flourish. Moving decoration that hides the offer works against the page's goal."
      ar: "إعادة اختبار، التصميم الجمالي البسيط (NN/g): الجمال مهم، لكن الوضوح يغلب الزخرفة البصرية دائمًا. والزخرفة المتحركة التي تُخفي العرض تعمل ضد هدف الصفحة."
    ref: { url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/", quote: "Clarity will always win over visual flourish." }
    scenario:
      en: "I designed the landing page for an online English course. Version A has floating shapes, a looping background video and the price inside a spinning badge."
      ar: "صمّمت صفحة الهبوط (Landing page) لدورة إنجليزية على الإنترنت. النسخة A فيها أشكال تطفو وتتحرّك، وفيديو خلفية يتكرّر، والسعر داخل شارة تدور."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تجعل الزوار يفهمون الدورة وسعرها بسرعة؟"
    a:
      label: { en: "Version A: lots of motion", ar: "النسخة A: حركة كثيرة" }
      mock:
        app: kalima
        frame: wide
        url: kalima.example/english-8-weeks
        blocks:
          - { kind: image, art: city-night, size: l, note: { en: "Looping video and floating shapes", ar: "فيديو يتكرر وأشكال تطفو" } }
          - { kind: badge, text: { en: "✦ EGP 900 ✦", ar: "✦ 900 جنيه ✦" }, note: { en: "Spinning badge", ar: "شارة تدور" } }
          - { kind: small, text: { en: "Speak with confidence", ar: "تحدّث بثقة" }, gap: s }
    b:
      label: { en: "Version B: calm and clear", ar: "النسخة B: هادئة وواضحة" }
      mock:
        app: kalima
        frame: wide
        url: kalima.example/english-8-weeks
        blocks:
          - { kind: title, text: { en: "Speak English with confidence in 8 weeks", ar: "تحدّث الإنجليزية بثقة في 8 أسابيع" } }
          - { kind: list, style: check, items: [ { en: "Live classes twice a week", ar: "حصص مباشرة مرتين أسبوعيًا" }, { en: "Groups of 8", ar: "مجموعات من 8" } ], gap: s }
          - { kind: price, text: { en: "EGP 900", ar: "900 جنيه" }, gap: s }
          - { kind: button, text: { en: "Join the course", ar: "انضم إلى الدورة" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P02-035
        when: [a]
        feedback:
          en: "The motion pulls the eye away from what visitors came to learn: what the course is, how it works and what it costs."
          ar: "الحركة تسحب العين بعيدًا عمّا جاء الزوار ليعرفوه: ما هي الدورة، وكيف تعمل، وكم تكلّف."
    correct:
      en: "B: clear first, beautiful within that."
      ar: "B: الوضوح أولًا، والجمال في إطاره."
    explain:
      en: "B can still look attractive, but the promise, the format and the price are read first. Decoration that hides them costs sign-ups."
      ar: "يمكن أن تبدو B جذابة أيضًا، لكن الوعد وطريقة الدراسة والسعر تُقرأ أولًا. والزخرفة التي تُخفيها تُفقدك مشتركين."

  # SK-P02-U04-04: keep everything the task needs
  - id: S07
    type: choose
    speaker: mona
    part: retest
    skill: SK-P02-U04-04
    value:
      en: "Re-test, aesthetic and minimalist design (NN/g): too few elements hurt usability by leaving out necessary ones. Hiding all navigation on a desktop site to look clean leaves people without a map."
      ar: "إعادة اختبار، التصميم الجمالي البسيط (NN/g): العناصر القليلة جدًا تضرّ سهولة الاستخدام لأنها تُسقط عناصر ضرورية. وإخفاء كل التنقل في موقع للكمبيوتر ليبدو نظيفًا يترك الناس دون خريطة."
    ref: { url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/", quote: "Having too few elements would inhibit utility and usability with the absence of necessary elements" }
    scenario:
      en: "For a calmer look, my team hid the whole menu of a university website behind a ☰ icon, even on large desktop screens. Visits to the admissions pages dropped."
      ar: "لكي يبدو موقع إحدى الجامعات أهدأ، أخفى فريقي القائمة كلها خلف أيقونة ☰ (Hamburger menu)، حتى على شاشات الكمبيوتر الكبيرة. فقلّت زيارات صفحات القبول."
    prompt:
      en: "What should we do on desktop?"
      ar: "ماذا نفعل على شاشات الكمبيوتر ليجد الزوار صفحات القبول؟"
    mock:
      app: jamia
      frame: wide
      url: jamia.example
      navbar: { links: [], actions: [ { icon: list, aria: { en: "Menu", ar: "القائمة" } } ] }
      blocks:
        - { kind: image, art: city-night, size: l }
        - { kind: title, text: { en: "Welcome to Jami'a", ar: "مرحبًا بك في «جامعة»" }, gap: m, note: { en: "All sections behind ☰, even on a big screen", ar: "كل الأقسام خلف ☰، حتى على شاشة كبيرة" } }
    options:
      - { id: show, text: { en: "Show the main sections in a visible top menu, and keep ☰ for small screens", ar: "إظهار الأقسام الرئيسية في قائمة علوية ظاهرة، وإبقاء ☰ للشاشات الصغيرة" } }
      - { id: label, text: { en: "Keep ☰, and add the word \"Menu\" next to it", ar: "إبقاء ☰، مع إضافة كلمة «القائمة» بجانبها" } }
      - { id: home, text: { en: "Put admission links in a slider on the home page", ar: "وضع روابط القبول في شريط متحرّك في الصفحة الرئيسية" } }
    answer: [show]
    misconceptions:
      - id: MC-P02-034
        when: [label, home]
        feedback:
          en: "The sections are still out of sight. Visitors can't see what the site offers, and a slider shows each link only for a few seconds."
          ar: "ما زالت الأقسام بعيدة عن النظر. فلا يرى الزوار ما يقدّمه الموقع، والشريط المتحرّك يعرض كل رابط لثوانٍ قليلة فقط."
    correct:
      en: "Show what people navigate by when there's room."
      ar: "اعرض أقسام التنقل حين تتّسع المساحة."
    explain:
      en: "On a wide screen there's room for the main sections, and seeing them tells visitors where admissions are. Hiding them was minimal in looks, not in effort."
      ar: "على الشاشة العريضة مساحة للأقسام الرئيسية، ورؤيتها تخبر الزوار أين صفحات القبول. وإخفاؤها جعل الشكل بسيطًا، لكنه صعّب الاستخدام."

  - id: S08
    type: choose
    speaker: karim
    part: retest
    skill: SK-P02-U04-04
    value:
      en: "Re-test, aesthetic and minimalist design (NN/g): a good design maximises usability with just enough elements. Removing the words from a toolbar makes it look lighter but makes every icon a guess."
      ar: "إعادة اختبار، التصميم الجمالي البسيط (NN/g): التصميم الجيد يرفع سهولة الاستخدام بعناصر كافية فقط. وحذف الكلمات من شريط الأدوات يجعله أخف شكلًا، لكنه يجعل كل أيقونة تخمينًا."
    ref: { url: "https://www.nngroup.com/articles/aesthetic-minimalist-design/", quote: "a good design should strive to maximize utility and usability with just enough elements on the page." }
    scenario:
      en: "In the invoice editor I'm building, the designer replaced the toolbar's buttons \"Add line\", \"Discount\", \"Tax\" and \"Send\" with icons only, to look lighter."
      ar: "في محرّر الفواتير الذي أبنيه، وضع المصمم أيقونات فقط مكان أزرار شريط الأدوات «أضف سطرًا» و«خصم» و«ضريبة» و«أرسل»، ليبدو أخف."
    prompt:
      en: "What should I suggest?"
      ar: "ماذا أقترح على المحرّرين؟"
    mock:
      app: fatoora
      frame: wide
      url: fatoora.example/invoices/1042
      navbar: { links: [], actions: [ { icon: plus }, { icon: percent }, { icon: receipt }, { icon: paper-plane-tilt } ] }
      blocks:
        - { kind: title, text: { en: "Invoice #1042", ar: "فاتورة ‎#1042" }, note: { en: "Add line, Discount, Tax, Send: icons only", ar: "أضف سطرًا، خصم، ضريبة، أرسل: أيقونات فقط" } }
        - { kind: table, head: [ { en: "Item", ar: "الصنف" }, { en: "Qty", ar: "الكمية" }, { en: "Price", ar: "السعر" } ], rows: [ [ { en: "Electric kettle", ar: "غلاية كهربائية" }, "2", "1,100" ], [ { en: "Toaster", ar: "محمصة" }, "1", "850" ] ], gap: m }
    options:
      - { id: words, text: { en: "Bring the words back next to the icons", ar: "إعادة الكلمات بجانب الأيقونات" } }
      - { id: tips, text: { en: "Keep icons only, with tooltips on hover", ar: "إبقاء الأيقونات فقط، مع Tooltips عند المرور بالمؤشر" } }
      - { id: guide, text: { en: "Keep icons only, and add a legend in the help page", ar: "إبقاء الأيقونات فقط، مع شرح لها في صفحة المساعدة" } }
    answer: [words]
    misconceptions:
      - id: MC-P02-034
        when: [tips, guide]
        feedback:
          en: "People still have to hover or look up each icon to know whether it adds tax or sends the invoice. With money involved, a wrong guess is costly."
          ar: "ما زال على الناس أن يمرّوا على كل أيقونة أو يبحثوا عنها ليعرفوا إن كانت تضيف الضريبة أم ترسل الفاتورة. وحين يتعلق الأمر بالمال، يكون التخمين الخاطئ مكلفًا."
    correct:
      en: "Labels are just enough, not too much."
      ar: "الأسماء قدر كافٍ، وليست زيادة."
    explain:
      en: "Four short words cost little space and remove all doubt. That's the \"just enough\" a minimal design aims for."
      ar: "أربع كلمات قصيرة لا تكلّف إلا مساحة صغيرة وتزيل كل شك. وهذا هو «القدر الكافي» الذي يهدف إليه التصميم البسيط."
