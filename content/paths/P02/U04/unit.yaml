id: P02-U04
free: false
title:
  en: "Speed up regulars, cut the clutter"
  ar: "سرّع المعتادين، واحذف الزحام"
skill:
  en: "Find and fix designs that slow down people who use them often, and screens where extra content buries what the task needs (heuristics 7 and 8)."
  ar: "اكتشف وأصلح التصميمات التي تبطئ من يستخدمونها كثيرًا، والشاشات التي يدفن فيها المحتوى الزائد ما تحتاجه المهمة (المبدآن 7 و8)."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P02-U04-01
    title: { en: "Add shortcuts that don't get in the way", ar: "أضِف اختصارات لا تعيق أحدًا" }
    can_do: { en: "Give regular users faster ways to do frequent tasks, make them easy to discover, and keep the clear, slower path for beginners.", ar: "أعطِ المستخدمين المعتادين طرقًا أسرع للمهام المتكررة، واجعلها سهلة الاكتشاف، وأبقِ الطريق الواضح الأبطأ للمبتدئين." }
  - id: SK-P02-U04-02
    title: { en: "Let people repeat work in one go", ar: "دَع الناس يكرّرون العمل دفعة واحدة" }
    can_do: { en: "Let people act on many items at once, reuse what they did before, and automate predictable repeated tasks.", ar: "دَع الناس يتعاملون مع عناصر كثيرة مرة واحدة، ويعيدون استخدام ما فعلوه من قبل، ويجعلون المهام المتكررة المتوقعة تلقائية." }
  - id: SK-P02-U04-03
    title: { en: "Cut what competes with the essentials", ar: "احذف ما ينافس الأساسيات" }
    can_do: { en: "Remove or move back information that is irrelevant or rarely needed, so what people need for the task stands out.", ar: "احذف المعلومات غير المهمة أو النادرة الاستخدام، أو أخّرها، حتى يبرز ما يحتاجه الناس للمهمة." }
  - id: SK-P02-U04-04
    title: { en: "Keep everything the task needs", ar: "أبقِ كل ما تحتاجه المهمة" }
    can_do: { en: "Keep labels, signs and information people need for the task, even when a cleaner look tempts you to remove them.", ar: "أبقِ الأسماء والعلامات والمعلومات التي يحتاجها الناس للمهمة، حتى حين يغريك شكل أنظف بحذفها." }
