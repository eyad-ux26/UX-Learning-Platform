id: P02-U04-L01
mode: lesson
minutes: 8
title:
  en: "Speed up the people who come back"
  ar: "سرّع من يعودون كثيرًا"
speaker: youssef
sources:
  - title: { en: "Flexibility and Efficiency of Use (Usability Heuristic #7) (NN/g)", ar: "المرونة وكفاءة الاستخدام (مبدأ الاستخدام 7) (NN/g)" }
    url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "مبادئ الاستخدام العشرة لتصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P02-028: { en: "One at a time doesn't scale", ar: "واحدًا واحدًا لا يناسب الكثير" }
  MC-P02-029: { en: "A shortcut nobody finds doesn't help", ar: "الاختصار الذي لا يجده أحد لا يساعد" }
  MC-P02-030: { en: "Don't make regulars repeat the beginner path", ar: "لا تجبر المعتادين على تكرار طريق المبتدئين" }
  MC-P02-031: { en: "Use what you already know about people", ar: "استخدم ما تعرفه أصلًا عن الناس" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Fifty prices, one by one", ar: "خمسون سعرًا، واحدًا واحدًا" }
    body:
      en: "Every month my supplier raises prices, and I update my shop. In my dashboard, that means opening each product, editing the price and saving it.\n\nLast month it was 50 products. It took me a whole evening, and I made two typos."
      ar: "كل شهر يرفع المورّد الأسعار، فأحدّث متجري. وفي لوحة التحكم، يعني هذا فتح كل منتج، وتعديل سعره، وحفظه.\n\nفي الشهر الماضي كانت 50 منتجًا. أخذ ذلك مني مساءً كاملًا، وأخطأت في الكتابة مرتين."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Edit product", ar: "تعديل منتج" } }
        - { kind: meta, text: { en: "Paint roller, 23 cm", ar: "رولة دهان، 23 سم" }, gap: s }
        - { kind: field, label: { en: "Price", ar: "السعر" }, text: { en: "EGP 120", ar: "120 جنيه" }, filled: true, gap: m }
        - { kind: button, text: { en: "Save", ar: "احفظ" }, gap: l }

  - id: S02
    type: choose
    part: try
    skill: SK-P02-U04-02
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Flexibility and efficiency (NN/g): flexible systems let people choose the method that works best for them. Someone changing 50 prices needs a way to change them together."
      ar: "جرّب أولًا. المرونة والكفاءة (NN/g): الأنظمة المرنة تتيح للناس اختيار الطريقة الأنسب لهم. ومن يغيّر 50 سعرًا يحتاج إلى طريقة لتغييرها معًا."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "Flexible systems are efficient because people can choose the method that works best for them." }
    prompt:
      en: "What would help me most?"
      ar: "ما الذي يساعدني أكثر؟"
    options:
      - { id: bulk, text: { en: "Select many products and raise all their prices at once, by an amount or a %", ar: "أختار منتجات كثيرة وأرفع أسعارها كلها مرة واحدة، بمبلغ أو بنسبة" } }
      - { id: faster, text: { en: "Make the product edit page load faster", ar: "أن تُفتح صفحة تعديل المنتج أسرع" } }
      - { id: next, text: { en: "Add a \"Save and open next product\" button", ar: "إضافة زر «احفظ وافتح المنتج التالي»" } }
    answer: [bulk]
    misconceptions:
      - id: MC-P02-028
        when: [faster, next]
        feedback:
          en: "Both make each edit a little quicker, but I still type 50 prices by hand. The time and the typos come from doing the same thing 50 times."
          ar: "كلاهما يجعل كل تعديل أسرع قليلًا، لكنني ما زلت أكتب 50 سعرًا بيدي. والوقت والأخطاء يأتيان من فعل الشيء نفسه 50 مرة."
    hints:
      - en: "What is the same about all 50 changes?"
        ar: "ما الشيء المشترك بين التعديلات الخمسين كلها؟"
    correct:
      en: "Act on many items at once."
      ar: "تعامل مع عناصر كثيرة مرة واحدة."
    explain:
      en: "A price rise is one decision applied to many products. Selecting them and raising them together turns an evening of typing into a minute, with no typos. Editing one product at a time still works for small changes."
      ar: "رفع الأسعار قرار واحد يُطبَّق على منتجات كثيرة. واختيارها ورفعها معًا يحوّل مساءً من الكتابة إلى دقيقة، دون أخطاء. ويظل تعديل منتج واحد ممكنًا للتغييرات الصغيرة."

  - id: S09
    type: video
    part: concept
    title: { en: "Flexibility and efficiency of use", ar: "المرونة وكفاءة الاستخدام (Flexibility and efficiency of use)" }
    video: 01c466c4-49a1-4f60-bc6c-5d06e9225ccc
    duration: 128
    transcript:
      - { t: 2.5, en: "You'll see this clearly in design tools. If you use Figma or any design tool, there are always shortcuts.", ar: "هتلاقي المثال ده بيبرز جدًا في الـ Design tools بالنسبة لك كـ Designers. لو إنت بتستخدم Figma أو أي Design tool، هتلاقي إن دايمًا فيه Shortcuts." }
      - { t: 12.12, en: "Here's our example: in Figma, when you hover over any tool or click it, it tells you which keyboard shortcut you can use.", ar: "وده المثال اللي معانا: زي ما إنت شايف في Figma، أي Tool بتوقف عليها، بتعمل عليها Hovering أو بتضغط عليها، بيقول لك إيه الـ Keyboard shortcut اللي ممكن تستخدمه." }
      - { t: 24.12, en: "And remember: the keyboard is faster than the mouse. Moving the mouse to a tool and clicking it is much slower than pressing one letter to get the tool.", ar: "ودايمًا خلّي بالك: الـ Keyboard أسرع من الماوس. يعني إنك تروح بالماوس توقف على الـ Tool وتضغط عليها، أبطأ بكتير من إنك تضغط على حرف على الـ Keyboard فيجيب لك الـ Tool." }
      - { t: 34.12, en: "So users can press letters quickly, and that improves the experience a lot.", ar: "فاليوزر يبقى عنده الـ Capability إنه يضغط على حروف بسرعة، وده بيعمل Enhance للـ Experience جدًا." }
      - { t: 44.12, en: "That's why a designer who has used a tool for four or five years differs from one who has used it for a month or a few weeks,", ar: "عشان كده تلاقي إن الـ Designer اللي بقى له مثلًا أربع خمس سنين بيستخدم الـ Tool، غير الـ Designer اللي بقى له شهر أو كام أسبوع بيستخدم نفس الـ Tool،" }
      - { t: 52.12, en: "especially when you provide shortcuts. There's a huge difference in speed, as much as the experienced person has mastered the shortcuts.", ar: "خاصةً لما تـ Provide موضوع الـ Shortcuts. بتلاقي فرق في السرعة كبير جدًا، على قد ما الشخص القديم ده متمكّن من الـ Shortcuts وفاهمها بطريقة صحيحة." }
      - { t: 66.12, en: "You find that the expert really is an expert, with a higher level of efficiency and speed. Efficiency means speed.", ar: "بتلاقي فعلًا إن الـ Expert هو Expert، وعنده Level of efficiency أعلى وسرعة أعلى. فالـ Efficiency هي السرعة." }
      - { t: 76.12, en: "So always try to let experts finish their tasks faster. Keyboard shortcuts are one way, as we said, and not just in design tools.", ar: "فدايمًا حاول تخلّي الشخص الـ Expert يخلّص المهام بتاعته بسرعة أكبر، ومن ضمن الوسائل الـ Keyboard shortcuts زي ما ذكرنا، مش بس في الـ Design tools." }
      - { t: 86.12, en: "Some actions need shortcuts because they're repetitive. It doesn't matter that beginners don't see these shortcuts,", ar: "إنت عارف إن فيه بعض الـ Actions محتاجة Shortcuts لأنها Repetitive. مش مهم في الحالة دي إن الـ Shortcuts تبقى ظاهرة للمبتدئين،" }
      - { t: 96.12, en: "but they should be easy for anyone to reach, so whoever wants to learn and improve can get to them.", ar: "لكن تبقى سهلة الوصول بالنسبة لأي User، بحيث إنه لو عايز يتعلّمها وعايز يتطوّر تبقى Accessible بالنسبة له." }
      - { t: 104.12, en: "Like this Figma example: just hovering over or clicking a tool shows the shortcut that opens it directly,", ar: "زي المثال هنا الخاص بـ Figma: مجرد ما بنعمل Hovering على الـ Tool، أو بيضغط عليها، بيبدأ يظهر له الـ Shortcut اللي ممكن يـ Access بيه الـ Tool دي على طول،" }
      - { t: 114.12, en: "and it also gives full documentation of every shortcut in the system.", ar: "وفي نفس الوقت بيدّيه Documentation كامل لكل الـ Shortcuts اللي موجودة في السيستم." }

  - id: S03
    type: card
    part: concept
    icons: [target, layers, person]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "The seventh heuristic: the same product should suit **both beginners and experts**. Shortcuts that beginners don't notice can speed experts up.\n\n- **Accelerators** such as keyboard shortcuts: show them next to the command, so people learn them over time.\n- **Repeated work in one go:** bulk actions, and automating predictable steps.\n- **Personalize:** use what people did before to shorten what they do next."
      ar: "المبدأ السابع: يجب أن يناسب المنتج نفسه **المبتدئين والخبراء معًا**. والاختصارات التي لا يلاحظها المبتدئون تستطيع أن تسرّع الخبراء.\n\n- **المسرّعات (Accelerators)** مثل اختصارات لوحة المفاتيح: اعرضها بجانب الأمر، ليتعلّمها الناس مع الوقت.\n- **العمل المتكرر دفعة واحدة:** الإجراءات الجماعية (Bulk actions)، وجعل الخطوات المتوقعة تلقائية.\n- **التخصيص (Personalization):** استخدم ما فعله الناس من قبل لتختصر ما سيفعلونه بعد ذلك."

  - id: S04
    type: choose
    part: guided
    skill: SK-P02-U04-01
    rules: [R06]
    value:
      en: "Flexibility and efficiency (NN/g): make accelerators discoverable but unobtrusive. The classic way is to show keyboard shortcuts next to their commands in menus or toolbars."
      ar: "المرونة والكفاءة (NN/g): اجعل المسرّعات سهلة الاكتشاف دون أن تزعج أحدًا. والطريقة الكلاسيكية هي عرض اختصارات لوحة المفاتيح بجانب أوامرها في القوائم وأشرطة الأدوات."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "The classic solution for keyboard-shortcut accelerators is to show them next to the associated commands in a menu or toolbar." }
    scenario:
      en: "My dashboard does have keyboard shortcuts: N for a new product, / for search, E to edit. They're listed on a help page. I only found out last week."
      ar: "في لوحة التحكم عندي اختصارات لوحة مفاتيح فعلًا: N لمنتج جديد، و/ للبحث، وE للتعديل. وهي مكتوبة في صفحة مساعدة. ولم أعرف بها إلا الأسبوع الماضي."
    prompt:
      en: "How should the dashboard make them known?"
      ar: "كيف تعرّف لوحة التحكم الناس بها؟"
    options:
      - { id: inline, text: { en: "Show each shortcut next to its button or menu item, and in its tooltip", ar: "عرض كل اختصار بجانب زرّه أو عنصره في القائمة، وفي الـ Tooltip الخاص به" } }
      - { id: popup, text: { en: "A pop-up on every login listing all shortcuts", ar: "نافذة منبثقة عند كل تسجيل دخول تعرض كل الاختصارات" } }
      - { id: help, text: { en: "Keep them on the help page; experts will find them", ar: "إبقاؤها في صفحة المساعدة؛ وسيجدها الخبراء" } }
    answer: [inline]
    misconceptions:
      - id: MC-P02-029
        when: [help]
        feedback:
          en: "Few people read help pages, so even daily users like me never learn the shortcuts."
          ar: "قليلون يقرؤون صفحات المساعدة، فحتى من يستخدم اللوحة يوميًا مثلي لا يتعلّم الاختصارات أبدًا."
      - id: MC-P02-030
        when: [popup]
        feedback:
          en: "A list at every login gets in everyone's way, beginners included, and is closed without reading."
          ar: "قائمة عند كل تسجيل دخول تعيق الجميع، ومنهم المبتدئون، وتُغلق دون قراءة."
    hints:
      - en: "Where are people looking at the moment a shortcut could save them time?"
        ar: "أين ينظر الناس في اللحظة التي يمكن أن يوفّر فيها الاختصار وقتهم؟"
    correct:
      en: "Show the shortcut where the action is."
      ar: "اعرض الاختصار حيث يكون الإجراء."
    explain:
      en: "Beginners can ignore the small \"N\" next to New product, but people who see it every day start using it. The shortcut teaches itself, without getting in anyone's way."
      ar: "يستطيع المبتدئون تجاهل «N» الصغيرة بجانب «منتج جديد»، أما من يراها كل يوم فيبدأ في استخدامها. فالاختصار يعلّم نفسه، دون أن يعيق أحدًا."

  - id: S05
    type: choose
    part: guided
    skill: SK-P02-U04-01
    rules: [R06]
    value:
      en: "Flexibility and efficiency (NN/g): a step-by-step wizard helps the first time but becomes extra clicks on later repetitions. Let people who know the task skip it."
      ar: "المرونة والكفاءة (NN/g): المعالج خطوة بخطوة يساعد في المرة الأولى، لكنه يصبح ضغطات زائدة في المرات التالية. فدَع من يعرف المهمة يتخطّاه."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "the extra clicks to guide users through a wizard might be necessary to lead someone through a task the first time but extraneous for future repetitions." }
    scenario:
      en: "Adding a product walks me through 6 screens with tips on each: name, photos, price, stock, delivery, review. I add about 10 products a week."
      ar: "إضافة منتج تأخذني في 6 شاشات فيها نصائح: الاسم، والصور، والسعر، والمخزون، والتوصيل، والمراجعة. وأضيف نحو 10 منتجات كل أسبوع."
    prompt:
      en: "What should change?"
      ar: "ماذا يجب أن يتغيّر؟"
    options:
      - { id: remove, text: { en: "Remove the step-by-step screens for everyone", ar: "حذف الشاشات المتتالية للجميع" } }
      - { id: oneform, text: { en: "Keep the guided steps for new sellers, and offer a \"Quick add\" form on one page for those who know it", ar: "إبقاء الخطوات الموجّهة للبائعين الجدد، وعرض نموذج «إضافة سريعة» في صفحة واحدة لمن يعرف الطريقة" } }
      - { id: tips, text: { en: "Keep the 6 screens, but hide the tips", ar: "إبقاء الشاشات الست، مع إخفاء النصائح" } }
    answer: [oneform]
    misconceptions:
      - id: MC-P02-030
        when: [tips]
        feedback:
          en: "Without the tips, it's still six screens and six taps on Next for every product."
          ar: "دون النصائح، ما زالت ست شاشات وست ضغطات على «التالي» لكل منتج."
      - id: MC-P02-031
        when: [remove]
        feedback:
          en: "New sellers lose the guidance they need the first time. Experts and beginners need different paths."
          ar: "يفقد البائعون الجدد الإرشاد الذي يحتاجونه في المرة الأولى. فالخبراء والمبتدئون يحتاجون طريقين مختلفين."
    hints:
      - en: "Who needs the guided steps, and who doesn't?"
        ar: "من يحتاج الخطوات الموجّهة، ومن لا يحتاجها؟"
    correct:
      en: "Two paths: guided for beginners, quick for regulars."
      ar: "طريقان: موجّه للمبتدئين، وسريع للمعتادين."
    explain:
      en: "The guided steps still help new sellers learn, while one page lets regulars add a product in a minute. Each person picks the way that suits them."
      ar: "تظل الخطوات الموجّهة تساعد البائعين الجدد على التعلّم، بينما تتيح الصفحة الواحدة للمعتادين إضافة منتج في دقيقة. ويختار كل شخص الطريقة التي تناسبه."

  - id: S06
    type: compare
    speaker: karim
    part: contrast
    skill: SK-P02-U04-02
    rules: [R11]
    value:
      en: "Flexibility and efficiency (NN/g): provide personalization by tailoring content and functionality to each person. A food app that knows your past orders can offer them again in one tap."
      ar: "المرونة والكفاءة (NN/g): قدّم التخصيص بملاءمة المحتوى والوظائف لكل شخص. وتطبيق الطعام الذي يعرف طلباتك السابقة يستطيع أن يعرضها عليك مرة أخرى بضغطة واحدة."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Provide personalization by tailoring content and functionality for individual users." }
    scenario:
      en: "I'm building a food delivery app. Most orders are repeats: the same people order the same meals from the same places."
      ar: "أبني تطبيقًا لتوصيل الطعام. وأغلب الطلبات مكررة: الناس أنفسهم يطلبون الوجبات نفسها من الأماكن نفسها."
    prompt:
      en: "Which home screen suits them better?"
      ar: "أيّ شاشة رئيسية تناسبهم أكثر؟"
    a:
      label: { en: "Version A: the same for everyone", ar: "النسخة A: واحدة للجميع" }
      mock:
        width: 260
        blocks:
          - { kind: field, text: { en: "Search restaurants or dishes", ar: "ابحث عن مطاعم أو أطباق" } }
          - { kind: heading, text: { en: "Popular near you", ar: "الأشهر بالقرب منك" }, gap: m }
          - { kind: image, size: s, gap: s }
          - { kind: image, size: s, gap: s }
    b:
      label: { en: "Version B: with Order again", ar: "النسخة B: مع «اطلب مرة أخرى»" }
      mock:
        width: 260
        blocks:
          - { kind: field, text: { en: "Search restaurants or dishes", ar: "ابحث عن مطاعم أو أطباق" } }
          - { kind: heading, text: { en: "Order again", ar: "اطلب مرة أخرى" }, gap: m }
          - { kind: meta, text: { en: "Koshary, large + salad · Koshary El Nil", ar: "كشري كبير + سلطة · كشري النيل" }, gap: s }
          - { kind: button, text: { en: "Reorder · EGP 95", ar: "أعد الطلب · 95 جنيه" }, gap: xs }
          - { kind: heading, text: { en: "Popular near you", ar: "الأشهر بالقرب منك" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P02-031
        when: [a]
        feedback:
          en: "Regulars have to search the place, find the dish, choose the size and add the salad again, every time, though the app already knows their order."
          ar: "على المعتادين أن يبحثوا عن المكان، ويجدوا الطبق، ويختاروا الحجم، ويضيفوا السلطة من جديد، في كل مرة، مع أن التطبيق يعرف طلبهم أصلًا."
    correct:
      en: "B: use what the app already knows."
      ar: "B: استخدم ما يعرفه التطبيق أصلًا."
    explain:
      en: "\"Order again\" turns five steps into one tap for people who repeat orders, while newcomers still see search and popular places."
      ar: "«اطلب مرة أخرى» تحوّل خمس خطوات إلى ضغطة واحدة لمن يكرّرون طلباتهم، بينما يظل الجدد يرون البحث والأماكن الشهيرة."

  - id: S07
    type: choose
    speaker: nour
    part: independent
    skill: SK-P02-U04-02
    rules: [R14]
    value:
      en: "Flexibility and efficiency (NN/g): let people automate repetitive tasks with predictable steps. A monthly refill of the same medicine is exactly that."
      ar: "المرونة والكفاءة (NN/g): دَع الناس يجعلون المهام المتكررة ذات الخطوات المتوقعة تلقائية. وإعادة صرف الدواء نفسه كل شهر مثال على ذلك تمامًا."
    ref: { url: "https://www.nngroup.com/articles/flexibility-efficiency-heuristic/", quote: "allowing expert users to automate repetitious or tedious tasks that have predictable steps." }
    scenario:
      en: "Our clinic's app also has a pharmacy. Many patients take the same medicine for years, and order it every month by searching for it, choosing the dose and checking out."
      ar: "في تطبيق عيادتنا صيدلية أيضًا. وكثير من المرضى يتناولون الدواء نفسه لسنوات، ويطلبونه كل شهر بالبحث عنه، واختيار الجرعة، وإتمام الشراء."
    prompt:
      en: "What should the app offer them?"
      ar: "ماذا يجب أن يقدّم لهم التطبيق؟"
    options:
      - { id: auto, text: { en: "\"Refill every month\": the same order goes out on a set day, with a reminder two days before to change or skip it", ar: "«أعِد الصرف كل شهر»: يُرسل الطلب نفسه في يوم محدد، مع تذكير قبلها بيومين لتعديله أو تخطّيه" } }
      - { id: banner, text: { en: "A banner on the home page: \"Don't forget your medicine!\"", ar: "Banner في الصفحة الرئيسية: «لا تنسَ دواءك!»" } }
      - { id: search, text: { en: "Better search, so the medicine is found faster", ar: "بحثًا أفضل، ليُعثر على الدواء أسرع" } }
    answer: [auto]
    misconceptions:
      - id: MC-P02-028
        when: [banner, search]
        feedback:
          en: "Patients still repeat the whole order by hand every month. The steps are the same each time, so the app can do them."
          ar: "ما زال المرضى يكرّرون الطلب كله بأيديهم كل شهر. والخطوات نفسها في كل مرة، فيستطيع التطبيق أن يقوم بها."
