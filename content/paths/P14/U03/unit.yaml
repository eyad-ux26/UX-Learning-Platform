id: P14-U03
free: false
title:
  en: "Help people find it"
  ar: "ساعد الناس على إيجاد ما يبحثون عنه"
skill:
  en: "Design search suggestions, no-results pages and filters that lead people to what they came for."
  ar: "صمّم اقتراحات البحث وصفحات «لا توجد نتائج» والفلاتر بحيث توصل الناس إلى ما جاؤوا من أجله."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U03-01
    title: { en: "Suggest only searches that find something", ar: "لا تقترح إلا عمليات بحث تجد شيئًا" }
    can_do: { en: "Offer a search suggestion only when it leads to good, relevant results.", ar: "لا تعرض اقتراح بحث إلا إذا كان يوصل إلى نتائج جيدة ومرتبطة بما يبحث عنه الناس." }
  - id: SK-P14-U03-02
    title: { en: "Show what the suggestion adds", ar: "وضّح ما يضيفه الاقتراح" }
    can_do: { en: "Style the suggested part differently from what people typed: highlight the added words when suggestions complete the query, and the typed words when they can appear anywhere.", ar: "اجعل شكل الجزء المقترح مختلفًا عمّا كتبه الناس: أبرز الكلمات المضافة حين تُكمل الاقتراحات ما كُتب، وأبرز الكلمات المكتوبة حين قد تظهر في أي مكان." }
  - id: SK-P14-U03-03
    title: { en: "Turn no results into a next step", ar: "حوّل «لا توجد نتائج» إلى خطوة تالية" }
    can_do: { en: "Say clearly that nothing matched, offer ways forward like a spelling fix, similar searches or fewer words, and keep the tone plain, never mocking.", ar: "قل بوضوح إنه لا توجد نتائج، واعرض طرقًا للمتابعة مثل تصحيح الإملاء أو عمليات بحث مشابهة أو كلمات أقل، وأبقِ الأسلوب بسيطًا، دون سخرية أبدًا." }
  - id: SK-P14-U03-04
    title: { en: "Name filters so people can predict them", ar: "سمِّ الفلاتر بحيث يتوقّع الناس محتواها" }
    can_do: { en: "Use filter categories and values that people can understand and predict: no vague labels, no internal codes or jargon.", ar: "استخدم فئات وقيم فلاتر يفهمها الناس ويتوقّعون محتواها: بدون أسماء مبهمة، وبدون رموز داخلية أو مصطلحات صعبة." }
  - id: SK-P14-U03-05
    title: { en: "Offer the filters people need, in their order", ar: "قدّم الفلاتر التي يحتاجها الناس، بترتيب أهميتها لهم" }
    can_do: { en: "Cover the aspects people really filter by, and put the most general and most used categories first.", ar: "غطِّ الجوانب التي يفلتر بها الناس فعلًا، وضع الفئات الأعمّ والأكثر استخدامًا أولًا." }
