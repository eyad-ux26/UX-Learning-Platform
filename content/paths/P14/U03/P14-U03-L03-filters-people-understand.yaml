id: P14-U03-L03
mode: lesson
minutes: 8
title:
  en: "Filters people understand"
  ar: "فلاتر يفهمها الناس"
speaker: youssef
sources:
  - title: { en: "Defining Helpful Filter Categories and Values for Better UX (NN/g)", ar: "تحديد فئات وقيم فلاتر مفيدة لتجربة أفضل (NN/g)" }
    url: "https://www.nngroup.com/articles/filter-categories-values/"
review_labels:
  MC-P14-030: { en: "Filters must cover what people filter by", ar: "الفلاتر يجب أن تغطّي ما يفلتر به الناس" }
  MC-P14-031: { en: "A filter label must say what's inside", ar: "اسم الفلتر يجب أن يقول ما بداخله" }
  MC-P14-032: { en: "General, most-used filters come first", ar: "الفلاتر العامة والأكثر استخدامًا تأتي أولًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Youssef's shoe store", ar: "متجر يوسف للأحذية" }
    body:
      en: "I run an online shoe store. Its filter panel has **Item type**, **Color**, **Price** and **Brand**.\n\nIn interviews, customers say they scroll through pages of shoes that turn out not to come in their size."
      ar: "أدير متجر أحذية على الإنترنت. وفي لوحة الفلاتر فيه: **نوع العنصر**، و**اللون**، و**السعر**، و**الماركة**.\n\nوفي المقابلات، يقول العملاء إنهم يتصفّحون صفحات من الأحذية ثم يكتشفون أنها غير متوفّرة بمقاسهم."
    mock:
      app: dar
      appbar: &fbar { title: { en: "Filters", ar: "الفلاتر" }, actions: [ { icon: x, aria: { en: "Close", ar: "إغلاق" } } ] }
      blocks: &shoes
        - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
        - { kind: accordion, text: { en: "Item type", ar: "نوع العنصر" }, gap: s }
        - { kind: accordion, text: { en: "Color", ar: "اللون" } }
        - { kind: accordion, text: { en: "Price", ar: "السعر" } }
        - { kind: accordion, text: { en: "Brand", ar: "الماركة" } }
      footer: &show86
        - { kind: button, text: { en: "Show 86 results", ar: "اعرض 86 نتيجة" } }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U03-05
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Filter categories (NN/g): they must cover the most important aspects of whatever users will be filtering. For shoes, size decides whether a pair is even an option."
      ar: "جرّب أولًا. فئات الفلاتر (NN/g): يجب أن تغطّي أهم جوانب ما سيفلتره الناس. وفي الأحذية، المقاس هو ما يحدّد إن كان الحذاء خيارًا أصلًا."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "must cover the most important aspects of whatever users will be filtering" }
    prompt:
      en: "The team can add one filter this month. Try each one. Which should ship?"
      ar: "يستطيع الفريق إضافة فلتر واحد هذا الشهر. جرّب كل فلتر. أيّ فلتر يحلّ المشكلة التي ذكرها العملاء في المقابلات؟"
    start: season
    options:
      - id: season
        text: { en: "Collection season", ar: "موسم المجموعة" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - { kind: accordion, text: { en: "Collection season", ar: "موسم المجموعة" }, open: true, gap: s, blocks: [ { kind: check, text: { en: "Spring–Summer 2026", ar: "ربيع وصيف 2026" } }, { kind: check, text: { en: "Autumn–Winter 2026", ar: "خريف وشتاء 2026" }, gap: s } ] }
            - { kind: accordion, text: { en: "Item type", ar: "نوع العنصر" } }
            - { kind: accordion, text: { en: "Color", ar: "اللون" } }
          footer: *show86
      - id: size
        text: { en: "Size", ar: "المقاس" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - kind: accordion
              text: { en: "Size", ar: "المقاس" }
              open: true
              gap: s
              blocks:
                - kind: row
                  blocks:
                    - { kind: chip, text: "39" }
                    - { kind: chip, text: "40" }
                    - { kind: chip, text: "41" }
                    - { kind: chip, text: "42" }
                    - { kind: chip, text: "43" }
            - { kind: accordion, text: { en: "Item type", ar: "نوع العنصر" } }
            - { kind: accordion, text: { en: "Color", ar: "اللون" } }
          footer: *show86
      - id: warehouse
        text: { en: "Warehouse", ar: "المخزن" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - { kind: accordion, text: { en: "Warehouse", ar: "المخزن" }, open: true, gap: s, blocks: [ { kind: check, text: { en: "Cairo – Obour", ar: "القاهرة – العبور" } }, { kind: check, text: { en: "Alexandria – Borg", ar: "الإسكندرية – برج العرب" }, gap: s } ] }
            - { kind: accordion, text: { en: "Item type", ar: "نوع العنصر" } }
            - { kind: accordion, text: { en: "Color", ar: "اللون" } }
          footer: *show86
    answer: [size]
    misconceptions:
      - id: MC-P14-030
        when: [season, warehouse]
        feedback:
          en: "Customers don't shop by season or by where the stock is kept. They still scroll past shoes that don't come in their size, which is what they told the team."
          ar: "العملاء لا يتسوّقون حسب الموسم ولا حسب مكان المخزون. وسيظلّون يمرّون على أحذية غير متوفّرة بمقاسهم، وهذا ما قالوه للفريق."
    hints:
      - en: "What did customers say wastes their time?"
        ar: "ماذا قال العملاء إنه يضيّع وقتهم؟"
    correct:
      en: "Size: it's what customers filter shoes by."
      ar: "المقاس: هو ما يفلتر به العملاء الأحذية."
    explain:
      en: "With Size, customers only see shoes they can actually buy. That's the problem they described in the interviews."
      ar: "مع فلتر المقاس، لا يرى العملاء إلا الأحذية التي يمكنهم شراؤها فعلًا. وهذه هي المشكلة التي وصفوها في المقابلات."

  - id: S10
    type: video
    part: concept
    title: { en: "Filters people understand", ar: "فلاتر يفهمها الناس" }
    video: 065a75c7-3ac8-458f-97be-95b5441b86fc
    duration: 369
    transcript:
      - { t: 2.5, en: "To talk about filter guidelines, we first need to understand filter categories and filter values. A filter category is the main heading with many choices under it to filter by,", ar: "لو بدأنا نتكلم عن الـ Guidelines بتاعة الـ Filters، محتاجين نفهم أول حاجة فكرة الـ Filter category والـ Filter value. الـ Filter category هي العناوين الرئيسية اللي تحتها اختيارات كتير عشان أعمل Filter منها،" }
      - { t: 14.2, en: "and filter values are the choices under those headings. For example a category could be price or color: under price there are different ranges, and under color there are values like red, green and yellow.", ar: "والـ Filter values هي الاختيارات الموجودة تحت العناوين دي. على سبيل المثال الـ Category ممكن يكون Price أو اللون، وتحته مجموعة Values: Price تحته Ranges مختلفة، واللون تحته Values زي أحمر وأخضر وأصفر وهكذا." }
      - { t: 30.8, en: "So the headings are the categories, and what's under them are the values. Why do we need this? To give guidelines, or best practices, for these headings and the values under them, which we should watch as we design filters.", ar: "فالعناوين دي هي الـ Categories، والـ Values اللي تحتها هي الـ Filter values. ليه بنعرف ده؟ عشان نقول بعض الـ Guidelines، أو الـ Best practices، على العناوين دي وعلى الـ Values اللي تحتها، اللي محتاجين ناخد بالنا منها ونحن بنصمّم Filters." }
      - { t: 48.7, en: "We need to keep four things in mind: categories and the values under them should be appropriate, predictable, free of jargon (hard or unclear terms), and prioritized, ordered by what users need or use most.", ar: "محتاجين ناخد في الاعتبار أربع حاجات: إن الـ Filter categories والـ Values تحتها تكون Appropriate يعني مناسبة، وPredictable يعني متوقّعة، وFree of jargon يعني خالية من المصطلحات الصعبة أو غير المفهومة، وPrioritized يعني مترتّبة بالأولوية بناءً على اللي اليوزر محتاجه أو بيستخدمه أكتر." }
      - { t: 73.25, en: "Let's take them one by one. The first is appropriate: the values and categories in filters should suit what users want to filter by. Sometimes I put a value under a category that users don't need and never use.", ar: "خلّونا نفصّلهم واحدة واحدة. أول نقطة إنها تكون مناسبة: مهم إن الـ Values أو الـ Categories في الفلاتر تكون مناسبة للي اليوزرز عايزين يعملوا Filter عليه. ممكن أحيانًا أحط Value تحت Category معيّنة واليوزرز مش محتاجينها ومش بيستخدموها نهائيًا." }
      - { t: 94.36, en: "To make sure they're appropriate we need detailed user research on the specific items in the website or product, to understand which categories and values users need: what they're looking for, what their needs are, and which factors they search by to reach the items they want. That's the first point.", ar: "وعشان نتأكد إن الـ Categories والـ Values مناسبة، محتاجين نعمل Detailed user research على الـ Items المعيّنة في الـ Website أو الـ Product، عشان نفهم اليوزرز محتاجين أنهي Categories وأنهي Values جواها، يعني بيدوّروا على إيه وإيه احتياجاتهم، وبيدوّروا على أي Factors عشان يوصلوا للـ Items اللي عايزينها. ده أول نقطة." }
      - { t: 131.96, en: "Second, the values under each category should be predictable to users. What does that mean? The category's label itself should tell me what values are likely to be under it.", ar: "تاني حاجة إن الـ Values اللي تحت كل Category تكون متوقّعة بالنسبة لليوزرز. يعني إيه متوقّعة؟ معناها إن الـ Label بتاع الـ Category نفسه يكون موضّح لي احتمال تكون إيه الـ Values الموجودة تحته." }
      - { t: 150.06, en: "To do that, category labels need to be clear, not vague, so I can predict the values under them. For example, in this example one category was called item type and another style.", ar: "وعشان نعمل ده، محتاجين الـ Labels بتاعة الـ Categories تكون واضحة، مش غامضة، تخلّيني أتوقّع الـ Values اللي ممكن تكون تحتها. على سبيل المثال، في المثال ده كان عندنا Category اسمه Item type وCategory اسمه Style." }
      - { t: 167.06, en: "When they ran usability testing on this, most users ignored the item type category because it wasn't clear to them, they couldn't predict the values under it, and they went straight to style. Item type is too general to tell what's under it, while style was understandable.", ar: "لما عملوا Usability testing على المثال ده، أغلب المستخدمين تجاهلوا الـ Category بتاع Item type لأنه مش مفهوم لهم، مش متوقّعين الـ Values اللي ممكن تكون تحته، وكانوا بيدخلوا على طول على Style. فـ Item type عنوان عام جدًا مش مفهوم منه إيه تحته، لكن Style كان مفهوم." }
      - { t: 193.96, en: "So the headings themselves must be understandable, especially if we use accordions with closed categories that open to show their values. Or we can use a pattern like Amazon's, which leaves every filter open by default, so I see all the values and understand each category from what's under it.", ar: "فمحتاجين نخلّي العناوين نفسها تكون مفهومة، وبالذات لو بنستخدم Accordions بنخلّي فيها الـ Categories مقفولة ولما أضغط عليها بتفتح وتبيّن الـ Values. أو ممكن نستخدم Pattern زي اللي في Amazon، اللي بيخلّي الفلاتر كلها مفتوحة By default، فأنا شايف كل الـ Values وأعرف معنى كل Category لأني شايف اللي تحتها." }
      - { t: 219.56, en: "Third, values and categories should be free of jargon. The difference from the last point is that I may read a category or value and not understand it at all, because it's an unfamiliar term, maybe a bit scientific, or one that some people read one way and some another.", ar: "تالت نقطة إن الـ Values والـ Categories تكون Free of jargon. الفرق بينها وبين اللي فاتت إني ممكن أقرا Category أو Value ومافهمش معناها أصلًا لأنها مصطلح مش مفهوم أو مش دارج بين كل الناس، ممكن يكون علمي شوية، أو ليه دلالات بعض الناس فهمها وبعضهم لأ." }
      - { t: 242.46, en: "Like the website in front of us: one category was behavior, but the values under it were purple, orange and green. Many users might not understand them: what do purple, orange and green mean, exactly? That's a different problem from the previous point.", ar: "زي المثال في الـ Website اللي قدامنا: واحدة من الـ Categories كانت Behavior، لكن الـ Values تحتها كانت مكتوبة Purple وOrange وGreen. فكانت مصطلحات ممكن مش مفهومة لمستخدمين كتير: إيه معنى Purple وOrange وGreen؟ بتدل على إيه بالضبط؟ ودي حالة مختلفة عن النقطة اللي فاتت." }
      - { t: 272.56, en: "The last guideline is that filters are prioritized, ordered by how much users use them and how important they are to the website. To know that we need research, to see what users use most or what matters most to them, so that comes first, then the next, and so on.", ar: "آخر نقطة في الـ Guidelines بتاعة الفلاتر إنها تكون Prioritized، يعني مترتّبة حسب الأولوية: حسب استخدام المستخدمين ليها أكتر، وحسب أهميتها بالنسبة للـ Website. وعشان نعرف ده محتاجين نعمل Research عشان نشوف اليوزرز بيستخدموا إيه أكتر أو إيه الأهم بالنسبة لهم، فيكون في الأول وبعده اللي بعده وهكذا." }
      - { t: 295.66, en: "For example, the first filter was asset type: I need to choose the kind of asset I'm looking for in the first place, and that may be the most important thing for me. After that, license: free or premium, and so on.", ar: "على سبيل المثال، أول حاجة في الفلاتر كانت Asset type: أنا محتاج أحدد نوع الأصل اللي بدوّر عليه أصلًا، وده ممكن يكون أهم حاجة بالنسبة لي. بعد كده License: هل هو Free ولا Premium وهكذا." }
      - { t: 313.66, en: "Ordering filters by how much users use them matters, because as a user I'll mostly use the first two or three, so they need to be clearly visible and easy to use. If I want a less common filter, I can scroll down for it.", ar: "فترتيب الفلاتر حسب أولوية استخدام اليوزرز ليها من الحاجات المهمة، لأن كـ User في الآخر في الأغلب هستخدم أول 2 أو 3 Filters، فلازم يكونوا ظاهرين بوضوح وأستخدمهم بسهولة. ولو عايز Filter أقل استخدامًا، ممكن ساعتها أنزل أدوّر عليه." }
      - { t: 332.56, en: "Notice also that when they added a new filter, AI generated, it sat at the top so users would notice it. It was in a closed accordion with an icon beside it that opens a tooltip explaining what the filter means. I can open and use it, but it's at the top so I know it's there.", ar: "ولاحظوا برضه في المثال لما أضافوا Filter جديد، AI generated، كان موجود في الأول عشان كـ User آخد بالي إن فيه Filter جديد. كان في Accordion ومقفول، وجنبه Icon بيطلع منها Tooltip بتشرح الفلتر ده معناه إيه. فممكن أفتحه وأستخدمه، بس هو فوق عشان أعرف إنه موجود." }
      - { t: 358.86, en: "These are the guidelines to keep in mind as we design filters.", ar: "وهي دي الـ Guidelines اللي محتاجين ناخد بالنا منها ونحن بنصمّم الفلاتر." }

  - id: S03
    type: card
    part: concept
    icons: [target, eye, text, order]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "Filters let people leave out what doesn't fit, like a price range, a rating or a place. Each filter has a **category** (such as Price) and **values** under it (such as Under EGP 500). Both need four things:\n\n- **Appropriate:** they cover what people really filter by. User research shows what that is.\n- **Predictable:** from the category name, people can guess the values inside. Vague names like \"Item type\" get skipped.\n- **Free of jargon:** no internal codes or terms only the team knows.\n- **Prioritized:** the most general and most used categories come first, more specific ones lower down."
      ar: "الفلاتر تجعل الناس يستبعدون ما لا يناسبهم، مثل نطاق سعر أو تقييم أو مكان. ولكل فلتر **فئة** (مثل السعر) و**قيم** تحتها (مثل أقل من 500 جنيه). والاثنتان تحتاجان أربعة أشياء:\n\n- **مناسبة:** تغطّي ما يفلتر به الناس فعلًا. والـ User research (بحث المستخدمين) يوضّح ما هو.\n- **متوقَّعة:** من اسم الفئة، يخمّن الناس القيم التي بداخلها. والأسماء المبهمة مثل «نوع العنصر» يتخطّاها الناس.\n- **بدون مصطلحات صعبة:** لا رموز داخلية ولا كلمات لا يعرفها إلا الفريق.\n- **مرتّبة بالأولوية:** الفئات الأعمّ والأكثر استخدامًا أولًا، والأكثر تخصّصًا في الأسفل."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U03-04
    rules: [R06, R15]
    value:
      en: "Filter categories (NN/g): as much as possible, avoid filter categories with vague labels like Item Type. People can't guess that sandals sit under it, so they skip it."
      ar: "فئات الفلاتر (NN/g): قدر الإمكان، تجنّب الفئات ذات الأسماء المبهمة مثل «نوع العنصر». فالناس لا يخمّنون أن الصنادل تحتها، فيتخطّونها."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "As much as possible, avoid filter categories with vague labels like Item Type." }
    scenario:
      en: "Customers looking for sandals in my store never open **Item type**. That's where sandals, boots, sneakers and heels are."
      ar: "العملاء الذين يبحثون عن صنادل في متجري لا يفتحون **نوع العنصر** أبدًا. وهناك توجد الصنادل والبوتات والأحذية الرياضية والكعب العالي."
    prompt:
      en: "Try each version of that filter. Which one should ship?"
      ar: "جرّب كل نسخة من هذا الفلتر. أيّ نسخة تجعل من يبحث عن صنادل يعرف أين يجدها؟"
    start: item
    options:
      - id: item
        text: { en: "Keep \"Item type\"", ar: "أبقِ «نوع العنصر»" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - { kind: accordion, text: { en: "Item type", ar: "نوع العنصر" }, gap: s }
            - { kind: accordion, text: { en: "Size", ar: "المقاس" } }
            - { kind: accordion, text: { en: "Color", ar: "اللون" } }
          footer: *show86
      - id: style
        text: { en: "\"Shoe style\", with sandals, boots, sneakers and heels shown", ar: "«شكل الحذاء»، وتظهر تحته الصنادل والبوتات والرياضية والكعب" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - kind: accordion
              text: { en: "Shoe style", ar: "شكل الحذاء" }
              open: true
              gap: s
              blocks:
                - { kind: check, text: { en: "Sandals", ar: "صنادل" } }
                - { kind: check, text: { en: "Boots", ar: "بوتات" }, gap: s }
                - { kind: check, text: { en: "Sneakers", ar: "أحذية رياضية" }, gap: s }
                - { kind: check, text: { en: "Heels", ar: "كعب عالٍ" }, gap: s }
            - { kind: accordion, text: { en: "Size", ar: "المقاس" } }
          footer: *show86
      - id: more
        text: { en: "Move these values into \"More filters\"", ar: "انقل هذه القيم إلى «فلاتر أخرى»" }
        mock:
          app: dar
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Dar · Women's shoes", ar: "دار · أحذية نسائية" } }
            - { kind: accordion, text: { en: "Size", ar: "المقاس" }, gap: s }
            - { kind: accordion, text: { en: "Color", ar: "اللون" } }
            - { kind: accordion, text: { en: "More filters", ar: "فلاتر أخرى" } }
          footer: *show86
    answer: [style]
    misconceptions:
      - id: MC-P14-031
        when: [item, more]
        feedback:
          en: "\"Item type\" and \"More filters\" don't say what's inside, so someone looking for sandals has no reason to open them. The values stay hidden behind a name nobody can predict."
          ar: "«نوع العنصر» و«فلاتر أخرى» لا يقولان ما بداخلهما، فمن يبحث عن صنادل ليس لديه سبب ليفتحهما. والقيم تبقى مخفية خلف اسم لا يتوقّعه أحد."
    hints:
      - en: "From the name alone, would you guess that sandals are inside?"
        ar: "من الاسم وحده، هل ستخمّن أن الصنادل بداخله؟"
    correct:
      en: "A name that predicts the values, with the values in view."
      ar: "اسم يدلّ على القيم، والقيم ظاهرة."
    explain:
      en: "\"Shoe style\" tells people what kind of choice it is, and the visible values show sandals right away."
      ar: "«شكل الحذاء» يقول للناس نوع الاختيار، والقيم الظاهرة تعرض الصنادل فورًا."

  - id: S05
    type: tune
    speaker: tarek
    part: guided
    skill: SK-P14-U03-04
    rules: [R06, R15]
    confidence: true
    value:
      en: "Filter values (NN/g): unintelligible jargon has no place in filters. Class letters are how the rental company sorts its fleet, not how customers think about cars."
      ar: "قيم الفلاتر (NN/g): المصطلحات غير المفهومة لا مكان لها في الفلاتر. وحروف الفئات هي طريقة شركة التأجير في ترتيب سياراتها، لا طريقة تفكير العملاء في السيارات."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "Unintelligible jargon has no place in filters." }
    scenario:
      en: "In the car rental app I manage, the filter **Class** has the values **A**, **B**, **C** and **D**: the codes our company uses inside its offices."
      ar: "في تطبيق تأجير السيارات الذي أديره، في فلتر **الفئة** القيم **A** و**B** و**C** و**D**: وهي الرموز التي تستخدمها شركتنا داخل مكاتبها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل المستأجرين يعرفون ما تعنيه كل قيمة في الفلتر من النظرة الأولى، دون ضغطة إضافية؟"
    start: codes
    options:
      - id: codes
        text: { en: "Keep the codes A to D", ar: "أبقِ الرموز من A إلى D" }
        mock:
          app: dawra
          appbar: *fbar
          blocks:
            - { kind: image, art: car, size: s, alt: { en: "Rental car", ar: "سيارة إيجار" } }
            - { kind: heading, text: { en: "Class", ar: "الفئة" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: "A" }
                - { kind: chip, text: "B" }
                - { kind: chip, text: "C" }
                - { kind: chip, text: "D" }
          footer: &show24
            - { kind: button, text: { en: "Show 24 cars", ar: "اعرض 24 سيارة" } }
      - id: info
        text: { en: "Keep the codes, with an ⓘ that explains them", ar: "أبقِ الرموز، مع ⓘ يشرحها" }
        mock:
          app: dawra
          appbar: *fbar
          blocks:
            - { kind: image, art: car, size: s, alt: { en: "Rental car", ar: "سيارة إيجار" } }
            - kind: row
              gap: m
              blocks:
                - { kind: heading, text: { en: "Class", ar: "الفئة" } }
                - { kind: iconbtn, icon: info, aria: { en: "What the classes mean", ar: "معنى الفئات" } }
            - kind: row
              blocks:
                - { kind: chip, text: "A" }
                - { kind: chip, text: "B" }
                - { kind: chip, text: "C" }
                - { kind: chip, text: "D" }
          footer: *show24
      - id: plain
        text: { en: "\"Car size\": Small, Medium, Large, 7 seats", ar: "«حجم السيارة»: صغيرة، متوسطة، كبيرة، 7 مقاعد" }
        mock:
          app: dawra
          appbar: *fbar
          blocks:
            - { kind: image, art: car, size: s, alt: { en: "Rental car", ar: "سيارة إيجار" } }
            - { kind: heading, text: { en: "Car size", ar: "حجم السيارة" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, icon: car-simple, text: { en: "Small", ar: "صغيرة" } }
                - { kind: chip, icon: car-simple, text: { en: "Medium", ar: "متوسطة" } }
                - { kind: chip, icon: car-profile, text: { en: "Large", ar: "كبيرة" } }
                - { kind: chip, icon: van, text: { en: "7 seats", ar: "7 مقاعد" } }
          footer: *show24
    answer: [plain]
    misconceptions:
      - id: MC-P14-031
        when: [codes, info]
        feedback:
          en: "Customers don't know what class C means. An ⓘ only helps those who think to open it, and they still have to remember the code while they choose."
          ar: "العملاء لا يعرفون ماذا تعني الفئة C. والـ ⓘ لا يساعد إلا من يفكّر في فتحه، وسيظلّ عليه أن يتذكّر الرمز وهو يختار."
    hints:
      - en: "Would a first-time customer know which letter fits a family of six?"
        ar: "هل سيعرف عميل يستخدم التطبيق لأول مرة أيّ حرف يناسب عائلة من ستة أفراد؟"
    correct:
      en: "Plain words people already use."
      ar: "كلمات بسيطة يستخدمها الناس أصلًا."
    explain:
      en: "\"7 seats\" answers the question a family of six actually has. No code to learn, no extra tap."
      ar: "«7 مقاعد» تجيب عن السؤال الذي لدى عائلة من ستة أفراد فعلًا. بدون رمز يحفظونه، وبدون ضغطة إضافية."

  - id: S06
    type: tune
    speaker: karim
    part: guided
    skill: SK-P14-U03-05
    rules: [R06, R15]
    value:
      en: "Filter categories (NN/g): consider placing the most general, high-level filter categories at the top of the list. First-time buyers decide on brand and budget long before lens mounts."
      ar: "فئات الفلاتر (NN/g): فكّر في وضع الفئات الأعمّ والأشمل في أعلى القائمة. ومن يشتري أول كاميرا يقرّر الماركة والميزانية قبل نوع تركيب العدسة بكثير."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "consider placing the most general, high-level filter categories at the top of the list" }
    scenario:
      en: "I'm building a camera store's website. Most visitors are buying their first camera. The filter panel lists **Lens mount**, **Max aperture** and **Sensor size** first, then **Brand** and **Price**."
      ar: "أبني موقع متجر كاميرات. وأغلب الزوار يشترون أول كاميرا لهم. ولوحة الفلاتر تعرض أولًا **تركيب العدسة** و**أقصى فتحة عدسة** و**حجم الحساس**، ثم **الماركة** و**السعر**."
    prompt:
      en: "Try each order. Which one should ship?"
      ar: "جرّب كل ترتيب. أيّ ترتيب يناسب أغلب الزوار، الذين يشترون أول كاميرا لهم، دون أن يُخفي شيئًا عن الخبراء؟"
    start: tech
    options:
      - id: tech
        text: { en: "Keep the technical filters first", ar: "أبقِ الفلاتر التقنية أولًا" }
        mock:
          app: kadr
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Kadr · Cameras", ar: "كادر · كاميرات" } }
            - { kind: accordion, text: { en: "Lens mount", ar: "تركيب العدسة" }, gap: s }
            - { kind: accordion, text: { en: "Max aperture", ar: "أقصى فتحة عدسة" } }
            - { kind: accordion, text: { en: "Sensor size", ar: "حجم الحساس" } }
            - { kind: accordion, text: { en: "Brand", ar: "الماركة" } }
            - { kind: accordion, text: { en: "Price", ar: "السعر" } }
          footer: &show42
            - { kind: button, text: { en: "Show 42 cameras", ar: "اعرض 42 كاميرا" } }
      - id: general
        text: { en: "Brand and Price first, technical ones below", ar: "الماركة والسعر أولًا، والتقنية تحتهما" }
        mock:
          app: kadr
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Kadr · Cameras", ar: "كادر · كاميرات" } }
            - { kind: accordion, text: { en: "Brand", ar: "الماركة" }, gap: s }
            - { kind: accordion, text: { en: "Price", ar: "السعر" } }
            - { kind: accordion, text: { en: "Sensor size", ar: "حجم الحساس" } }
            - { kind: accordion, text: { en: "Lens mount", ar: "تركيب العدسة" } }
            - { kind: accordion, text: { en: "Max aperture", ar: "أقصى فتحة عدسة" } }
          footer: *show42
      - id: abc
        text: { en: "Alphabetical order", ar: "ترتيب أبجدي" }
        mock:
          app: kadr
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Kadr · Cameras", ar: "كادر · كاميرات" } }
            - { kind: accordion, text: { en: "Brand", ar: "أقصى فتحة عدسة" }, gap: s }
            - { kind: accordion, text: { en: "Lens mount", ar: "تركيب العدسة" } }
            - { kind: accordion, text: { en: "Max aperture", ar: "حجم الحساس" } }
            - { kind: accordion, text: { en: "Price", ar: "السعر" } }
            - { kind: accordion, text: { en: "Sensor size", ar: "الماركة" } }
          footer: *show42
    answer: [general]
    misconceptions:
      - id: MC-P14-032
        when: [tech, abc]
        feedback:
          en: "A first-time buyer meets terms like lens mount and aperture before the two filters they actually use first. The order should follow what most visitors need, not the alphabet or the specs sheet."
          ar: "من يشتري أول كاميرا يقابل مصطلحات مثل تركيب العدسة وفتحة العدسة قبل الفلترين اللذين يستخدمهما أولًا فعلًا. والترتيب يجب أن يتبع ما يحتاجه أغلب الزوار، لا الأبجدية ولا ورقة المواصفات."
    hints:
      - en: "Which two choices does a first-time buyer make first?"
        ar: "ما أول اختيارين يحدّدهما من يشتري كاميرا لأول مرة؟"
    correct:
      en: "General and most used first."
      ar: "الأعمّ والأكثر استخدامًا أولًا."
    explain:
      en: "Brand and Price come first for the beginners who are most of the visitors. Experts still find the technical filters just below."
      ar: "الماركة والسعر يأتيان أولًا للمبتدئين، وهم أغلب الزوار. والخبراء يجدون الفلاتر التقنية تحتهما مباشرة."

  - id: S07
    type: compare
    speaker: mona
    part: contrast
    skill: SK-P14-U03-05
    rules: [R11]
    value:
      en: "Filter categories (NN/g): they must cover the most important aspects of whatever users will be filtering, and research shows which aspects those are. Here the research is clear: width decides whether a sofa fits."
      ar: "فئات الفلاتر (NN/g): يجب أن تغطّي أهم جوانب ما سيفلتره الناس، والبحث يوضّح ما هي هذه الجوانب. والبحث هنا واضح: العرض يحدّد إن كانت الكنبة ستناسب المكان."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "must cover the most important aspects of whatever users will be filtering" }
    scenario:
      en: "My team designs a furniture store's sofa page. Research shows most customers measure their wall before shopping, and the wrong width is the top reason sofas are returned."
      ar: "يصمّم فريقي صفحة الكنب في متجر أثاث. ويُظهر البحث أن أغلب العملاء يقيسون الحائط قبل التسوّق، وأن العرض الخطأ هو أول سبب لإرجاع الكنب."
    prompt:
      en: "Which filter panel should ship?"
      ar: "أيّ لوحة فلاتر تساعد العملاء على إيجاد كنبة بعرض يناسب حائطهم؟"
    a:
      label: { en: "Version A: Color, Material, Price", ar: "النسخة A: اللون، الخامة، السعر" }
      mock:
        app: beit
        appbar: *fbar
        blocks:
          - { kind: small, text: { en: "Beit · Sofas", ar: "بيت · كنب" } }
          - { kind: accordion, text: { en: "Color", ar: "اللون" }, gap: s }
          - { kind: accordion, text: { en: "Material", ar: "الخامة" } }
          - { kind: accordion, text: { en: "Price", ar: "السعر" } }
        footer: &show31
          - { kind: button, text: { en: "Show 31 sofas", ar: "اعرض 31 كنبة" } }
    b:
      label: { en: "Version B: Width, Price, Color", ar: "النسخة B: العرض، السعر، اللون" }
      mock:
        app: beit
        appbar: *fbar
        blocks:
          - { kind: small, text: { en: "Beit · Sofas", ar: "بيت · كنب" } }
          - kind: accordion
            text: { en: "Width", ar: "العرض" }
            open: true
            gap: s
            blocks:
              - kind: row
                blocks:
                  - { kind: chip, text: { en: "Up to 180 cm", ar: "حتى 180 سم" } }
                  - { kind: chip, text: { en: "180–220 cm", ar: "من 180 إلى 220 سم" } }
                  - { kind: chip, text: { en: "Over 220 cm", ar: "أكثر من 220 سم" } }
          - { kind: accordion, text: { en: "Price", ar: "السعر" } }
          - { kind: accordion, text: { en: "Color", ar: "اللون" } }
        footer: *show31
    answer: b
    misconceptions:
      - id: MC-P14-030
        when: [a]
        feedback:
          en: "Customers arrive with a measurement and no way to use it. They open sofa after sofa to check the width, and some still buy one that doesn't fit."
          ar: "يأتي العملاء ومعهم القياس بدون طريقة لاستخدامه. فيفتحون كنبة بعد كنبة ليتأكّدوا من العرض، وبعضهم يشتري مع ذلك كنبة لا تناسب."
    correct:
      en: "B: it filters by what customers decide on."
      ar: "B: تفلتر بما يقرّر به العملاء."
    explain:
      en: "Width comes first, in ranges customers can match to their tape measure. Price and Color follow."
      ar: "العرض يأتي أولًا، بنطاقات يطابقها العملاء مع قياسهم. ثم يأتي السعر واللون."

  - id: S08
    type: tune
    speaker: sara
    part: independent
    skill: SK-P14-U03-04
    rules: [R14]
    value:
      en: "Filter values (NN/g): unintelligible jargon has no place in filters. RO, BB, HB and FB are hotel industry codes; most travellers just want to know which meals are included."
      ar: "قيم الفلاتر (NN/g): المصطلحات غير المفهومة لا مكان لها في الفلاتر. وRO وBB وHB وFB رموز يستخدمها قطاع الفنادق؛ وأغلب المسافرين يريدون فقط أن يعرفوا ما الوجبات المشمولة."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "Unintelligible jargon has no place in filters." }
    scenario:
      en: "I'm designing a hotel booking site. Its **Board** filter shows **RO**, **BB**, **HB** and **FB**, the codes hotels send with their prices."
      ar: "أصمّم موقعًا لحجز الفنادق. وفلتر **Board** (نظام الوجبات) فيه يعرض **RO** و**BB** و**HB** و**FB**، وهي الرموز التي ترسلها الفنادق مع أسعارها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل المسافرين يعرفون ما سيأكلونه في الفندق بنظرة واحدة، دون شرح؟"
    start: codes
    options:
      - id: codes
        text: { en: "Keep the codes", ar: "أبقِ الرموز" }
        mock:
          app: nuzul
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Nuzul · Hurghada · 3 nights", ar: "نُزُل · الغردقة · 3 ليالٍ" } }
            - { kind: heading, text: "Board", gap: m }
            - { kind: check, text: "RO", gap: s }
            - { kind: check, text: "BB", gap: s }
            - { kind: check, text: "HB", gap: s }
            - { kind: check, text: "FB", gap: s }
          footer: &show57
            - { kind: button, text: { en: "Show 57 hotels", ar: "اعرض 57 فندقًا" } }
      - id: legend
        text: { en: "Keep the codes, with a key at the bottom of the page", ar: "أبقِ الرموز، مع شرح لها في أسفل الصفحة" }
        mock:
          app: nuzul
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Nuzul · Hurghada · 3 nights", ar: "نُزُل · الغردقة · 3 ليالٍ" } }
            - { kind: heading, text: "Board", gap: m }
            - { kind: check, text: "RO", gap: s }
            - { kind: check, text: "BB", gap: s }
            - { kind: check, text: "HB", gap: s }
            - { kind: check, text: "FB", gap: s }
            - { kind: small, text: { en: "RO = room only, BB = bed and breakfast, HB = half board, FB = full board", ar: "RO = غرفة فقط، BB = مبيت وإفطار، HB = نصف إقامة، FB = إقامة كاملة" }, gap: l }
          footer: *show57
      - id: meals
        text: { en: "\"Meals included\": None, Breakfast, Breakfast and dinner, All meals", ar: "«الوجبات المشمولة»: بدون، إفطار، إفطار وعشاء، كل الوجبات" }
        mock:
          app: nuzul
          appbar: *fbar
          blocks:
            - { kind: small, text: { en: "Nuzul · Hurghada · 3 nights", ar: "نُزُل · الغردقة · 3 ليالٍ" } }
            - { kind: heading, text: { en: "Meals included", ar: "الوجبات المشمولة" }, gap: m }
            - { kind: check, text: { en: "None", ar: "بدون" }, gap: s }
            - { kind: check, text: { en: "Breakfast", ar: "إفطار" }, gap: s }
            - { kind: check, text: { en: "Breakfast and dinner", ar: "إفطار وعشاء" }, gap: s }
            - { kind: check, text: { en: "All meals", ar: "كل الوجبات" }, gap: s }
          footer: *show57
    answer: [meals]
    misconceptions:
      - id: MC-P14-031
        when: [codes, legend]
        feedback:
          en: "Many travellers don't know what HB stands for, and a key at the bottom of the page is easy to miss and has to be remembered while choosing."
          ar: "كثير من المسافرين لا يعرفون ماذا يعني HB، والشرح في أسفل الصفحة قد لا يلاحظه أحد، ويجب تذكّره أثناء الاختيار."
    correct:
      en: "Say what's included, in plain words."
      ar: "قل ما هو مشمول، بكلمات بسيطة."
    explain:
      en: "\"Breakfast and dinner\" needs no key. Travellers pick the meals they want in one look."
      ar: "«إفطار وعشاء» لا تحتاج شرحًا. ويختار المسافرون الوجبات التي يريدونها بنظرة واحدة."

  - id: S09
    type: card
    part: recap
    icons: [target, text, order]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Cover what people filter by**, like size for shoes or width for sofas.\n- **Names that predict the values**, in plain words: no vague labels, no internal codes.\n- **General and most-used first**, specialist filters lower down.\n\nNext: the skill check, on new cases."
      ar: "- **غطِّ ما يفلتر به الناس**، مثل المقاس للأحذية أو العرض للكنب.\n- **أسماء تدلّ على القيم**، بكلمات بسيطة: بدون أسماء مبهمة، وبدون رموز داخلية.\n- **الأعمّ والأكثر استخدامًا أولًا**، والفلاتر المتخصّصة في الأسفل.\n\nالتالي: اختبار المهارة، على حالات جديدة."
