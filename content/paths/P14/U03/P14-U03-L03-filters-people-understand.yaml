id: P14-U03-L03
mode: lesson
minutes: 8
title:
  en: "Filters people understand"
  ar: "فلاتر يفهمها الناس"
sources:
  - title: { en: "Defining Helpful Filter Categories and Values for Better UX (NN/g)", ar: "تحديد فئات وقيم فلاتر مفيدة لتجربة أفضل (NN/g)" }
    url: "https://www.nngroup.com/articles/filter-categories-values/"
review_labels:
  MC-P14-030: { en: "Filters must cover what people filter by", ar: "الفلاتر يجب أن تغطّي ما يفلتر به الناس" }
  MC-P14-031: { en: "A filter label must say what's inside", ar: "اسم الفلتر يجب أن يقول ما بداخله" }
  MC-P14-032: { en: "General, most-used filters come first", ar: "الفلاتر العامة والأكثر استخدامًا تأتي أولًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Lamia's shoe store", ar: "متجر الأحذية للمياء" }
    body:
      en: "Lamia works on an online shoe store. Its filter panel has **Item type**, **Color**, **Price** and **Brand**.\n\nIn interviews, customers say they scroll through pages of shoes that turn out not to come in their size."
      ar: "تعمل لمياء على متجر أحذية على الإنترنت. وفي لوحة الفلاتر فيه: **نوع العنصر**، و**اللون**، و**السعر**، و**الماركة**.\n\nوفي المقابلات، يقول العملاء إنهم يتصفّحون صفحات من الأحذية ثم يكتشفون أنها غير متوفّرة بمقاسهم."
    mock:
      width: 300
      blocks: &shoes
        - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
        - { kind: heading, text: { en: "Item type ▾", ar: "نوع العنصر ▾" }, gap: m }
        - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
        - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
        - { kind: heading, text: { en: "Brand ▾", ar: "الماركة ▾" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U03-05
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Filter categories (NN/g): they must cover the most important aspects of whatever users will be filtering. For shoes, size decides whether a pair is even an option."
      ar: "جرّب أولًا. فئات الفلاتر (NN/g): يجب أن تغطّي أهم جوانب ما سيفلتره الناس. وفي الأحذية، المقاس هو ما يحدّد إن كان الحذاء خيارًا أصلًا."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "must cover the most important aspects of whatever users will be filtering" }
    prompt:
      en: "The team can add one filter this month. Try each one. Which should ship?"
      ar: "يستطيع الفريق إضافة فلتر واحد هذا الشهر. جرّب كل فلتر. أيّها يجب أن يُطلق؟"
    start: season
    options:
      - id: season
        text: { en: "Collection season", ar: "موسم المجموعة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Collection season", ar: "موسم المجموعة" }, gap: m }
            - { kind: check, text: { en: "Spring–Summer 2026", ar: "ربيع وصيف 2026" }, gap: s }
            - { kind: check, text: { en: "Autumn–Winter 2026", ar: "خريف وشتاء 2026" }, gap: s }
            - { kind: heading, text: { en: "Item type ▾", ar: "نوع العنصر ▾" }, gap: m }
            - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
      - id: size
        text: { en: "Size", ar: "المقاس" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Size", ar: "المقاس" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: "39" }
                - { kind: chip, text: "40" }
                - { kind: chip, text: "41" }
                - { kind: chip, text: "42" }
                - { kind: chip, text: "43" }
            - { kind: heading, text: { en: "Item type ▾", ar: "نوع العنصر ▾" }, gap: m }
            - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
      - id: warehouse
        text: { en: "Warehouse", ar: "المخزن" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Warehouse", ar: "المخزن" }, gap: m }
            - { kind: check, text: { en: "Cairo – Obour", ar: "القاهرة – العبور" }, gap: s }
            - { kind: check, text: { en: "Alexandria – Borg", ar: "الإسكندرية – برج العرب" }, gap: s }
            - { kind: heading, text: { en: "Item type ▾", ar: "نوع العنصر ▾" }, gap: m }
            - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
    answer: [size]
    misconceptions:
      - id: MC-P14-030
        when: [season, warehouse]
        feedback:
          en: "Customers don't shop by season or by where the stock is kept. They still scroll past shoes that don't come in their size, which is what they told the team."
          ar: "العملاء لا يتسوّقون حسب الموسم ولا حسب مكان المخزون. وسيظلّون يمرّون على أحذية غير متوفّرة بمقاسهم، وهذا ما قالوه للفريق."
    hints:
      - en: "What did customers say wastes their time?"
        ar: "ماذا قال العملاء إنه يضيّع وقتهم؟"
    correct:
      en: "Size: it's what customers filter shoes by."
      ar: "المقاس: هو ما يفلتر به العملاء الأحذية."
    explain:
      en: "With Size, customers only see shoes they can actually buy. That's the problem they described in the interviews."
      ar: "مع فلتر المقاس، لا يرى العملاء إلا الأحذية التي يمكنهم شراؤها فعلًا. وهذه هي المشكلة التي وصفوها في المقابلات."

  - id: S03
    type: card
    part: concept
    icons: [target, eye, text, order]
    video:
      src: clips/P14-C09.mp4
      captions: { ar: P14-C09.ar.vtt, en: P14-C09.en.vtt }
      who: { en: "Eyad Mahmoud, UX designer · UXGate", ar: "إياد محمود، مصمم UX · UXGate" }
      transcript:
        en: "To talk about filter guidelines, we first need to understand filter categories and filter values. A filter category is the main heading with many choices under it to filter by, and filter values are the choices under those headings. For example a category could be price or color: under price there are different ranges, and under color there are values like red, green and yellow. So the headings are the categories, and what's under them are the values. Why do we need this? To give guidelines, or best practices, for these headings and the values under them, which we should watch as we design filters. We need to keep four things in mind: categories and the values under them should be appropriate, predictable, free of jargon (hard or unclear terms), and prioritized, ordered by what users need or use most. Let's take them one by one. The first is appropriate: the values and categories in filters should suit what users want to filter by. Sometimes I put a value under a category that users don't need and never use. To make sure they're appropriate we need detailed user research on the specific items in the website or product, to understand which categories and values users need: what they're looking for, what their needs are, and which factors they search by to reach the items they want. That's the first point. Second, the values under each category should be predictable to users. What does that mean? The category's label itself should tell me what values are likely to be under it. To do that, category labels need to be clear, not vague, so I can predict the values under them. For example, in this example one category was called item type and another style. When they ran usability testing on this, most users ignored the item type category because it wasn't clear to them, they couldn't predict the values under it, and they went straight to style. Item type is too general to tell what's under it, while style was understandable. So the headings themselves must be understandable, especially if we use accordions with closed categories that open to show their values. Or we can use a pattern like Amazon's, which leaves every filter open by default, so I see all the values and understand each category from what's under it. Third, values and categories should be free of jargon. The difference from the last point is that I may read a category or value and not understand it at all, because it's an unfamiliar term, maybe a bit scientific, or one that some people read one way and some another. Like the website in front of us: one category was behavior, but the values under it were purple, orange and green. Many users might not understand them: what do purple, orange and green mean, exactly? That's a different problem from the previous point. The last guideline is that filters are prioritized, ordered by how much users use them and how important they are to the website. To know that we need research, to see what users use most or what matters most to them, so that comes first, then the next, and so on. For example, the first filter was asset type: I need to choose the kind of asset I'm looking for in the first place, and that may be the most important thing for me. After that, license: free or premium, and so on. Ordering filters by how much users use them matters, because as a user I'll mostly use the first two or three, so they need to be clearly visible and easy to use. If I want a less common filter, I can scroll down for it. Notice also that when they added a new filter, AI generated, it sat at the top so users would notice it. It was in a closed accordion with an icon beside it that opens a tooltip explaining what the filter means. I can open and use it, but it's at the top so I know it's there. These are the guidelines to keep in mind as we design filters."
        ar: "لو بدأنا نتكلم عن الـ Guidelines بتاعة الـ Filters، محتاجين نفهم أول حاجة فكرة الـ Filter category والـ Filter value. الـ Filter category هي العناوين الرئيسية اللي تحتها اختيارات كتير عشان أعمل Filter منها، والـ Filter values هي الاختيارات الموجودة تحت العناوين دي. على سبيل المثال الـ Category ممكن يكون Price أو اللون، وتحته مجموعة Values: Price تحته Ranges مختلفة، واللون تحته Values زي أحمر وأخضر وأصفر وهكذا. فالعناوين دي هي الـ Categories، والـ Values اللي تحتها هي الـ Filter values. ليه بنعرف ده؟ عشان نقول بعض الـ Guidelines، أو الـ Best practices، على العناوين دي وعلى الـ Values اللي تحتها، اللي محتاجين ناخد بالنا منها ونحن بنصمّم Filters. محتاجين ناخد في الاعتبار أربع حاجات: إن الـ Filter categories والـ Values تحتها تكون Appropriate يعني مناسبة، وPredictable يعني متوقّعة، وFree of jargon يعني خالية من المصطلحات الصعبة أو غير المفهومة، وPrioritized يعني مترتّبة بالأولوية بناءً على اللي اليوزر محتاجه أو بيستخدمه أكتر. خلّونا نفصّلهم واحدة واحدة. أول نقطة إنها تكون مناسبة: مهم إن الـ Values أو الـ Categories في الفلاتر تكون مناسبة للي اليوزرز عايزين يعملوا Filter عليه. ممكن أحيانًا أحط Value تحت Category معيّنة واليوزرز مش محتاجينها ومش بيستخدموها نهائيًا. وعشان نتأكد إن الـ Categories والـ Values مناسبة، محتاجين نعمل Detailed user research على الـ Items المعيّنة في الـ Website أو الـ Product، عشان نفهم اليوزرز محتاجين أنهي Categories وأنهي Values جواها، يعني بيدوّروا على إيه وإيه احتياجاتهم، وبيدوّروا على أي Factors عشان يوصلوا للـ Items اللي عايزينها. ده أول نقطة. تاني حاجة إن الـ Values اللي تحت كل Category تكون متوقّعة بالنسبة لليوزرز. يعني إيه متوقّعة؟ معناها إن الـ Label بتاع الـ Category نفسه يكون موضّح لي احتمال تكون إيه الـ Values الموجودة تحته. وعشان نعمل ده، محتاجين الـ Labels بتاعة الـ Categories تكون واضحة، مش غامضة، تخلّيني أتوقّع الـ Values اللي ممكن تكون تحتها. على سبيل المثال، في المثال ده كان عندنا Category اسمه Item type وCategory اسمه Style. لما عملوا Usability testing على المثال ده، أغلب المستخدمين تجاهلوا الـ Category بتاع Item type لأنه مش مفهوم لهم، مش متوقّعين الـ Values اللي ممكن تكون تحته، وكانوا بيدخلوا على طول على Style. فـ Item type عنوان عام جدًا مش مفهوم منه إيه تحته، لكن Style كان مفهوم. فمحتاجين نخلّي العناوين نفسها تكون مفهومة، وبالذات لو بنستخدم Accordions بنخلّي فيها الـ Categories مقفولة ولما أضغط عليها بتفتح وتبيّن الـ Values. أو ممكن نستخدم Pattern زي اللي في Amazon، اللي بيخلّي الفلاتر كلها مفتوحة By default، فأنا شايف كل الـ Values وأعرف معنى كل Category لأني شايف اللي تحتها. تالت نقطة إن الـ Values والـ Categories تكون Free of jargon. الفرق بينها وبين اللي فاتت إني ممكن أقرا Category أو Value ومافهمش معناها أصلًا لأنها مصطلح مش مفهوم أو مش دارج بين كل الناس، ممكن يكون علمي شوية، أو ليه دلالات بعض الناس فهمها وبعضهم لأ. زي المثال في الـ Website اللي قدامنا: واحدة من الـ Categories كانت Behavior، لكن الـ Values تحتها كانت مكتوبة Purple وOrange وGreen. فكانت مصطلحات ممكن مش مفهومة لمستخدمين كتير: إيه معنى Purple وOrange وGreen؟ بتدل على إيه بالضبط؟ ودي حالة مختلفة عن النقطة اللي فاتت. آخر نقطة في الـ Guidelines بتاعة الفلاتر إنها تكون Prioritized، يعني مترتّبة حسب الأولوية: حسب استخدام المستخدمين ليها أكتر، وحسب أهميتها بالنسبة للـ Website. وعشان نعرف ده محتاجين نعمل Research عشان نشوف اليوزرز بيستخدموا إيه أكتر أو إيه الأهم بالنسبة لهم، فيكون في الأول وبعده اللي بعده وهكذا. على سبيل المثال، أول حاجة في الفلاتر كانت Asset type: أنا محتاج أحدد نوع الأصل اللي بدوّر عليه أصلًا، وده ممكن يكون أهم حاجة بالنسبة لي. بعد كده License: هل هو Free ولا Premium وهكذا. فترتيب الفلاتر حسب أولوية استخدام اليوزرز ليها من الحاجات المهمة، لأن كـ User في الآخر في الأغلب هستخدم أول 2 أو 3 Filters، فلازم يكونوا ظاهرين بوضوح وأستخدمهم بسهولة. ولو عايز Filter أقل استخدامًا، ممكن ساعتها أنزل أدوّر عليه. ولاحظوا برضه في المثال لما أضافوا Filter جديد، AI generated، كان موجود في الأول عشان كـ User آخد بالي إن فيه Filter جديد. كان في Accordion ومقفول، وجنبه Icon بيطلع منها Tooltip بتشرح الفلتر ده معناه إيه. فممكن أفتحه وأستخدمه، بس هو فوق عشان أعرف إنه موجود. وهي دي الـ Guidelines اللي محتاجين ناخد بالنا منها ونحن بنصمّم الفلاتر."
    title: { en: "Filters people understand", ar: "فلاتر يفهمها الناس" }
    body:
      en: "Filters let people leave out what doesn't fit, like a price range, a rating or a place. Each filter has a **category** (such as Price) and **values** under it (such as Under EGP 500). Both need four things:\n\n- **Appropriate:** they cover what people really filter by. User research shows what that is.\n- **Predictable:** from the category name, people can guess the values inside. Vague names like \"Item type\" get skipped.\n- **Free of jargon:** no internal codes or terms only the team knows.\n- **Prioritized:** the most general and most used categories come first, more specific ones lower down."
      ar: "الفلاتر تجعل الناس يستبعدون ما لا يناسبهم، مثل نطاق سعر أو تقييم أو مكان. ولكل فلتر **فئة** (مثل السعر) و**قيم** تحتها (مثل أقل من 500 جنيه). والاثنتان تحتاجان أربعة أشياء:\n\n- **مناسبة:** تغطّي ما يفلتر به الناس فعلًا. والـ User research (بحث المستخدمين) يوضّح ما هو.\n- **متوقَّعة:** من اسم الفئة، يخمّن الناس القيم التي بداخلها. والأسماء المبهمة مثل «نوع العنصر» يتخطّاها الناس.\n- **بدون مصطلحات صعبة:** لا رموز داخلية ولا كلمات لا يعرفها إلا الفريق.\n- **مرتّبة بالأولوية:** الفئات الأعمّ والأكثر استخدامًا أولًا، والأكثر تخصّصًا في الأسفل."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U03-04
    rules: [R06, R15]
    value:
      en: "Filter categories (NN/g): as much as possible, avoid filter categories with vague labels like Item Type. People can't guess that sandals sit under it, so they skip it."
      ar: "فئات الفلاتر (NN/g): قدر الإمكان، تجنّب الفئات ذات الأسماء المبهمة مثل «نوع العنصر». فالناس لا يخمّنون أن الصنادل تحتها، فيتخطّونها."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "As much as possible, avoid filter categories with vague labels like Item Type." }
    scenario:
      en: "Customers looking for sandals in Lamia's store never open **Item type**. That's where sandals, boots, sneakers and heels are."
      ar: "العملاء الذين يبحثون عن صنادل في متجر لمياء لا يفتحون **نوع العنصر** أبدًا. وهناك توجد الصنادل والبوتات والأحذية الرياضية والكعب العالي."
    prompt:
      en: "Try each version of that filter. Which one should ship?"
      ar: "جرّب كل نسخة من هذا الفلتر. أيّها يجب أن تُطلق؟"
    start: item
    options:
      - id: item
        text: { en: "Keep \"Item type\"", ar: "أبقِ «نوع العنصر»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Item type ▾", ar: "نوع العنصر ▾" }, gap: m }
            - { kind: heading, text: { en: "Size ▾", ar: "المقاس ▾" }, gap: m }
            - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
      - id: style
        text: { en: "\"Shoe style\", with sandals, boots, sneakers and heels shown", ar: "«شكل الحذاء»، وتظهر تحته الصنادل والبوتات والرياضية والكعب" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Shoe style", ar: "شكل الحذاء" }, gap: m }
            - { kind: check, text: { en: "Sandals", ar: "صنادل" }, gap: s }
            - { kind: check, text: { en: "Boots", ar: "بوتات" }, gap: s }
            - { kind: check, text: { en: "Sneakers", ar: "أحذية رياضية" }, gap: s }
            - { kind: check, text: { en: "Heels", ar: "كعب عالٍ" }, gap: s }
            - { kind: heading, text: { en: "Size ▾", ar: "المقاس ▾" }, gap: m }
      - id: more
        text: { en: "Move these values into \"More filters\"", ar: "انقل هذه القيم إلى «فلاتر أخرى»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Size ▾", ar: "المقاس ▾" }, gap: m }
            - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
            - { kind: heading, text: { en: "More filters ▾", ar: "فلاتر أخرى ▾" }, gap: m }
    answer: [style]
    misconceptions:
      - id: MC-P14-031
        when: [item, more]
        feedback:
          en: "\"Item type\" and \"More filters\" don't say what's inside, so someone looking for sandals has no reason to open them. The values stay hidden behind a name nobody can predict."
          ar: "«نوع العنصر» و«فلاتر أخرى» لا يقولان ما بداخلهما، فمن يبحث عن صنادل ليس لديه سبب ليفتحهما. والقيم تبقى مخفية خلف اسم لا يتوقّعه أحد."
    hints:
      - en: "From the name alone, would you guess that sandals are inside?"
        ar: "من الاسم وحده، هل ستخمّن أن الصنادل بداخله؟"
    correct:
      en: "A name that predicts the values, with the values in view."
      ar: "اسم يُنبئ بالقيم، والقيم ظاهرة."
    explain:
      en: "\"Shoe style\" tells people what kind of choice it is, and the visible values show sandals right away."
      ar: "«شكل الحذاء» يقول للناس نوع الاختيار، والقيم الظاهرة تعرض الصنادل فورًا."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U03-04
    rules: [R06, R15]
    confidence: true
    value:
      en: "Filter values (NN/g): unintelligible jargon has no place in filters. Class letters are how the rental company sorts its fleet, not how customers think about cars."
      ar: "قيم الفلاتر (NN/g): المصطلحات غير المفهومة لا مكان لها في الفلاتر. وحروف الفئات هي طريقة شركة التأجير في ترتيب سياراتها، لا طريقة تفكير العملاء في السيارات."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "Unintelligible jargon has no place in filters." }
    scenario:
      en: "Marwan works on a car rental app. Its filter **Class** has the values **A**, **B**, **C** and **D**: the codes the company uses inside its offices."
      ar: "يعمل مروان على تطبيق لتأجير السيارات. وفي فلتر **الفئة** القيم **A** و**B** و**C** و**D**: وهي الرموز التي تستخدمها الشركة داخل مكاتبها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: codes
    options:
      - id: codes
        text: { en: "Keep the codes A to D", ar: "أبقِ الرموز من A إلى D" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Class", ar: "الفئة" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: "A" }
                - { kind: chip, text: "B" }
                - { kind: chip, text: "C" }
                - { kind: chip, text: "D" }
      - id: info
        text: { en: "Keep the codes, with an ⓘ that explains them", ar: "أبقِ الرموز، مع ⓘ يشرحها" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - kind: row
              blocks:
                - { kind: heading, text: { en: "Class", ar: "الفئة" } }
                - { kind: iconbtn, text: "ⓘ" }
            - kind: row
              blocks:
                - { kind: chip, text: "A" }
                - { kind: chip, text: "B" }
                - { kind: chip, text: "C" }
                - { kind: chip, text: "D" }
      - id: plain
        text: { en: "\"Car size\": Small, Medium, Large, 7 seats", ar: "«حجم السيارة»: صغيرة، متوسطة، كبيرة، 7 مقاعد" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Car size", ar: "حجم السيارة" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: { en: "Small", ar: "صغيرة" } }
                - { kind: chip, text: { en: "Medium", ar: "متوسطة" } }
                - { kind: chip, text: { en: "Large", ar: "كبيرة" } }
                - { kind: chip, text: { en: "7 seats", ar: "7 مقاعد" } }
    answer: [plain]
    misconceptions:
      - id: MC-P14-031
        when: [codes, info]
        feedback:
          en: "Customers don't know what class C means. An ⓘ only helps those who think to open it, and they still have to remember the code while they choose."
          ar: "العملاء لا يعرفون ماذا تعني الفئة C. والـ ⓘ لا يساعد إلا من يفكّر في فتحه، وسيظلّ عليه أن يتذكّر الرمز وهو يختار."
    hints:
      - en: "Would a first-time customer know which letter fits a family of six?"
        ar: "هل سيعرف عميل لأول مرة أيّ حرف يناسب عائلة من ستة أفراد؟"
    correct:
      en: "Plain words people already use."
      ar: "كلمات بسيطة يستخدمها الناس أصلًا."
    explain:
      en: "\"7 seats\" answers the question a family of six actually has. No code to learn, no extra tap."
      ar: "«7 مقاعد» تجيب عن السؤال الذي لدى عائلة من ستة أفراد فعلًا. بدون رمز يحفظونه، وبدون ضغطة إضافية."

  - id: S06
    type: tune
    part: guided
    skill: SK-P14-U03-05
    rules: [R06, R15]
    value:
      en: "Filter categories (NN/g): consider placing the most general, high-level filter categories at the top of the list. First-time buyers decide on brand and budget long before lens mounts."
      ar: "فئات الفلاتر (NN/g): فكّر في وضع الفئات الأعمّ والأشمل في أعلى القائمة. ومن يشتري أول كاميرا يقرّر الماركة والميزانية قبل نوع تركيب العدسة بكثير."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "consider placing the most general, high-level filter categories at the top of the list" }
    scenario:
      en: "Fouad's camera store. Most visitors are buying their first camera. The filter panel lists **Lens mount**, **Max aperture** and **Sensor size** first, then **Brand** and **Price**."
      ar: "متجر الكاميرات لفؤاد. وأغلب الزوار يشترون أول كاميرا لهم. ولوحة الفلاتر تعرض أولًا **تركيب العدسة** و**أقصى فتحة عدسة** و**حجم الحساس**، ثم **الماركة** و**السعر**."
    prompt:
      en: "Try each order. Which one should ship?"
      ar: "جرّب كل ترتيب. أيّها يجب أن يُطلق؟"
    start: tech
    options:
      - id: tech
        text: { en: "Keep the technical filters first", ar: "أبقِ الفلاتر التقنية أولًا" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Lens mount ▾", ar: "تركيب العدسة ▾" }, gap: m }
            - { kind: heading, text: { en: "Max aperture ▾", ar: "أقصى فتحة عدسة ▾" }, gap: m }
            - { kind: heading, text: { en: "Sensor size ▾", ar: "حجم الحساس ▾" }, gap: m }
            - { kind: heading, text: { en: "Brand ▾", ar: "الماركة ▾" }, gap: m }
            - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
      - id: general
        text: { en: "Brand and Price first, technical ones below", ar: "الماركة والسعر أولًا، والتقنية تحتهما" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Brand ▾", ar: "الماركة ▾" }, gap: m }
            - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
            - { kind: heading, text: { en: "Sensor size ▾", ar: "حجم الحساس ▾" }, gap: m }
            - { kind: heading, text: { en: "Lens mount ▾", ar: "تركيب العدسة ▾" }, gap: m }
            - { kind: heading, text: { en: "Max aperture ▾", ar: "أقصى فتحة عدسة ▾" }, gap: m }
      - id: abc
        text: { en: "Alphabetical order", ar: "ترتيب أبجدي" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Brand ▾", ar: "أقصى فتحة عدسة ▾" }, gap: m }
            - { kind: heading, text: { en: "Lens mount ▾", ar: "تركيب العدسة ▾" }, gap: m }
            - { kind: heading, text: { en: "Max aperture ▾", ar: "حجم الحساس ▾" }, gap: m }
            - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
            - { kind: heading, text: { en: "Sensor size ▾", ar: "الماركة ▾" }, gap: m }
    answer: [general]
    misconceptions:
      - id: MC-P14-032
        when: [tech, abc]
        feedback:
          en: "A first-time buyer meets terms like lens mount and aperture before the two filters they actually use first. The order should follow what most visitors need, not the alphabet or the specs sheet."
          ar: "من يشتري أول كاميرا يقابل مصطلحات مثل تركيب العدسة وفتحة العدسة قبل الفلترين اللذين يستخدمهما أولًا فعلًا. والترتيب يجب أن يتبع ما يحتاجه أغلب الزوار، لا الأبجدية ولا ورقة المواصفات."
    hints:
      - en: "Which two choices does a first-time buyer make first?"
        ar: "ما الاختياران اللذان يقوم بهما من يشتري لأول مرة أولًا؟"
    correct:
      en: "General and most used first."
      ar: "الأعمّ والأكثر استخدامًا أولًا."
    explain:
      en: "Brand and Price come first for the beginners who are most of the visitors. Experts still find the technical filters just below."
      ar: "الماركة والسعر يأتيان أولًا للمبتدئين، وهم أغلب الزوار. والخبراء يجدون الفلاتر التقنية تحتهما مباشرة."

  - id: S07
    type: compare
    part: contrast
    skill: SK-P14-U03-05
    rules: [R11]
    value:
      en: "Filter categories (NN/g): they must cover the most important aspects of whatever users will be filtering, and research shows which aspects those are. Here the research is clear: width decides whether a sofa fits."
      ar: "فئات الفلاتر (NN/g): يجب أن تغطّي أهم جوانب ما سيفلتره الناس، والبحث يوضّح ما هي هذه الجوانب. والبحث هنا واضح: العرض يحدّد إن كانت الكنبة ستناسب المكان."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "must cover the most important aspects of whatever users will be filtering" }
    scenario:
      en: "A furniture store's sofa page. Research shows most customers measure their wall before shopping, and the wrong width is the top reason sofas are returned."
      ar: "صفحة الكنب في متجر أثاث. ويُظهر البحث أن أغلب العملاء يقيسون الحائط قبل التسوّق، وأن العرض الخطأ هو أول سبب لإرجاع الكنب."
    prompt:
      en: "Which filter panel should ship?"
      ar: "أيّ لوحة فلاتر يجب أن تُطلق؟"
    a:
      label: { en: "Version A: Color, Material, Price", ar: "النسخة A: اللون، الخامة، السعر" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
          - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
          - { kind: heading, text: { en: "Material ▾", ar: "الخامة ▾" }, gap: m }
          - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
    b:
      label: { en: "Version B: Width, Price, Color", ar: "النسخة B: العرض، السعر، اللون" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
          - { kind: heading, text: { en: "Width", ar: "العرض" }, gap: m }
          - kind: row
            blocks:
              - { kind: chip, text: { en: "Up to 180 cm", ar: "حتى 180 سم" } }
              - { kind: chip, text: { en: "180–220 cm", ar: "180–220 سم" } }
              - { kind: chip, text: { en: "Over 220 cm", ar: "أكثر من 220 سم" } }
          - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
          - { kind: heading, text: { en: "Color ▾", ar: "اللون ▾" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-030
        when: [a]
        feedback:
          en: "Customers arrive with a measurement and no way to use it. They open sofa after sofa to check the width, and some still buy one that doesn't fit."
          ar: "يأتي العملاء ومعهم القياس بدون طريقة لاستخدامه. فيفتحون كنبة بعد كنبة ليتأكّدوا من العرض، وبعضهم يشتري مع ذلك كنبة لا تناسب."
    correct:
      en: "B: it filters by what customers decide on."
      ar: "B: تفلتر بما يقرّر به العملاء."
    explain:
      en: "Width comes first, in ranges customers can match to their tape measure. Price and Color follow."
      ar: "العرض يأتي أولًا، بنطاقات يطابقها العملاء مع قياسهم. ثم يأتي السعر واللون."

  - id: S08
    type: tune
    part: independent
    skill: SK-P14-U03-04
    rules: [R14]
    value:
      en: "Filter values (NN/g): unintelligible jargon has no place in filters. RO, BB, HB and FB are hotel industry codes; most travellers just want to know which meals are included."
      ar: "قيم الفلاتر (NN/g): المصطلحات غير المفهومة لا مكان لها في الفلاتر. وRO وBB وHB وFB رموز يستخدمها قطاع الفنادق؛ وأغلب المسافرين يريدون فقط أن يعرفوا ما الوجبات المشمولة."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "Unintelligible jargon has no place in filters." }
    scenario:
      en: "Rania designs a hotel booking site. Its **Board** filter shows **RO**, **BB**, **HB** and **FB**, the codes hotels send with their prices."
      ar: "تصمّم رانيا موقعًا لحجز الفنادق. وفلتر **Board** فيه يعرض **RO** و**BB** و**HB** و**FB**، وهي الرموز التي ترسلها الفنادق مع أسعارها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: codes
    options:
      - id: codes
        text: { en: "Keep the codes", ar: "أبقِ الرموز" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: "Board" , gap: m }
            - { kind: check, text: "RO", gap: s }
            - { kind: check, text: "BB", gap: s }
            - { kind: check, text: "HB", gap: s }
            - { kind: check, text: "FB", gap: s }
      - id: legend
        text: { en: "Keep the codes, with a key at the bottom of the page", ar: "أبقِ الرموز، مع شرح لها في أسفل الصفحة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: "Board", gap: m }
            - { kind: check, text: "RO", gap: s }
            - { kind: check, text: "BB", gap: s }
            - { kind: check, text: "HB", gap: s }
            - { kind: check, text: "FB", gap: s }
            - { kind: small, text: { en: "RO = room only, BB = bed and breakfast, HB = half board, FB = full board", ar: "RO = غرفة فقط، BB = مبيت وإفطار، HB = نصف إقامة، FB = إقامة كاملة" }, gap: l }
      - id: meals
        text: { en: "\"Meals included\": None, Breakfast, Breakfast and dinner, All meals", ar: "«الوجبات المشمولة»: بدون، إفطار، إفطار وعشاء، كل الوجبات" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Meals included", ar: "الوجبات المشمولة" }, gap: m }
            - { kind: check, text: { en: "None", ar: "بدون" }, gap: s }
            - { kind: check, text: { en: "Breakfast", ar: "إفطار" }, gap: s }
            - { kind: check, text: { en: "Breakfast and dinner", ar: "إفطار وعشاء" }, gap: s }
            - { kind: check, text: { en: "All meals", ar: "كل الوجبات" }, gap: s }
    answer: [meals]
    misconceptions:
      - id: MC-P14-031
        when: [codes, legend]
        feedback:
          en: "Many travellers don't know what HB stands for, and a key at the bottom of the page is easy to miss and has to be remembered while choosing."
          ar: "كثير من المسافرين لا يعرفون ماذا يعني HB، والشرح في أسفل الصفحة سهل التجاهل، ويجب تذكّره أثناء الاختيار."
    correct:
      en: "Say what's included, in plain words."
      ar: "قل ما هو مشمول، بكلمات بسيطة."
    explain:
      en: "\"Breakfast and dinner\" needs no key. Travellers pick the meals they want in one look."
      ar: "«إفطار وعشاء» لا تحتاج شرحًا. ويختار المسافرون الوجبات التي يريدونها بنظرة واحدة."

  - id: S09
    type: card
    part: recap
    icons: [target, text, order]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Cover what people filter by**, like size for shoes or width for sofas.\n- **Names that predict the values**, in plain words: no vague labels, no internal codes.\n- **General and most-used first**, specialist filters lower down.\n\nNext: the skill check, on new cases."
      ar: "- **غطِّ ما يفلتر به الناس**، مثل المقاس للأحذية أو العرض للكنب.\n- **أسماء تُنبئ بالقيم**، بكلمات بسيطة: بدون أسماء مبهمة، وبدون رموز داخلية.\n- **الأعمّ والأكثر استخدامًا أولًا**، والفلاتر المتخصّصة في الأسفل.\n\nالتالي: اختبار المهارة، على حالات جديدة."
