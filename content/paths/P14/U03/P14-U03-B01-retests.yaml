  - id: S08
    type: tune
    skill: SK-P14-U03-04
    part: retest
    value:
      en: "Re-test, filter categories (NN/g): as much as possible, avoid filter categories with vague labels like Item Type. \"Details\" hides storage, the filter phone buyers look for."
      ar: "إعادة اختبار، فئات الفلاتر (NN/g): قدر الإمكان، تجنّب الفئات ذات الأسماء المبهمة مثل «نوع العنصر». و«تفاصيل» تُخفي سعة التخزين، وهي الفلتر الذي يبحث عنه مشترو الهواتف."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "As much as possible, avoid filter categories with vague labels like Item Type." }
    scenario:
      en: "Mohsen's phone store. Storage options (128 GB, 256 GB, 512 GB) sit inside a filter called **Details**. Buyers often ask support how to filter by storage."
      ar: "متجر الهواتف لمحسن. خيارات سعة التخزين (128 GB، و256 GB، و512 GB) موجودة داخل فلتر اسمه **تفاصيل**. وكثيرًا ما يسأل المشترون الدعم عن طريقة الفلترة حسب السعة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: details
    options:
      - id: details
        text: { en: "Keep \"Details\"", ar: "أبقِ «تفاصيل»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Brand ▾", ar: "الماركة ▾" }, gap: m }
            - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
            - { kind: heading, text: { en: "Details ▾", ar: "تفاصيل ▾" }, gap: m }
      - id: storage
        text: { en: "A \"Storage\" filter with its values shown", ar: "فلتر «سعة التخزين» وقيمه ظاهرة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Brand ▾", ar: "الماركة ▾" }, gap: m }
            - { kind: heading, text: { en: "Price ▾", ar: "السعر ▾" }, gap: m }
            - { kind: heading, text: { en: "Storage", ar: "سعة التخزين" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: "128 GB" }
                - { kind: chip, text: "256 GB" }
                - { kind: chip, text: "512 GB" }
