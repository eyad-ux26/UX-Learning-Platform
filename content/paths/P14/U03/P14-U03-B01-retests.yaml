    misconceptions:
      - id: MC-P14-031
        when: [details]
        feedback:
          en: "\"Details\" could mean anything, so buyers don't open it, and they contact support instead."
          ar: "«تفاصيل» قد تعني أي شيء، فلا يفتحها المشترون، ويتواصلون مع الدعم بدلًا من ذلك."
    correct:
      en: "Name it after what's inside."
      ar: "سمِّه بما بداخله."
    explain:
      en: "\"Storage\" is the word buyers already use, and the values are right there to tap."
      ar: "«سعة التخزين» هي الكلمة التي يستخدمها المشترون أصلًا، والقيم أمامهم للضغط عليها."

  # SK-P14-U03-05: offer the filters people need, in their order
  - id: S09
    type: tune
    skill: SK-P14-U03-05
    part: retest
    value:
      en: "Re-test, filter categories (NN/g): they must cover the most important aspects of whatever users will be filtering. Hungry customers choose by how fast the food arrives."
      ar: "إعادة اختبار، فئات الفلاتر (NN/g): يجب أن تغطّي أهم جوانب ما سيفلتره الناس. والعميل الجائع يختار حسب سرعة وصول الأكل."
    ref: { url: "https://www.nngroup.com/articles/filter-categories-values/", quote: "must cover the most important aspects of whatever users will be filtering" }
    scenario:
      en: "Soha's food delivery app. Interviews show that most people order when they're already hungry and care most about how soon the food arrives. The app can add one filter."
      ar: "تطبيق توصيل الطعام لسها. وتُظهر المقابلات أن أغلب الناس يطلبون وهم جائعون أصلًا، وأن أكثر ما يهمّهم هو موعد وصول الأكل. ويستطيع التطبيق إضافة فلتر واحد."
    prompt:
      en: "Try each filter. Which one should ship?"
      ar: "جرّب كل فلتر. أيّها يجب أن يُطلق؟"
    start: year
    options:
      - id: year
        text: { en: "Year the restaurant opened", ar: "سنة افتتاح المطعم" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Opened in", ar: "سنة الافتتاح" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: { en: "Before 2010", ar: "قبل 2010" } }
                - { kind: chip, text: { en: "2010–2020", ar: "2010–2020" } }
                - { kind: chip, text: { en: "After 2020", ar: "بعد 2020" } }
      - id: time
        text: { en: "Delivery time", ar: "وقت التوصيل" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: heading, text: { en: "Delivery time", ar: "وقت التوصيل" }, gap: m }
            - kind: row
              blocks:
                - { kind: chip, text: { en: "Under 30 min", ar: "أقل من 30 دقيقة" } }
                - { kind: chip, text: { en: "Under 45 min", ar: "أقل من 45 دقيقة" } }
    answer: [time]
    misconceptions:
      - id: MC-P14-030
        when: [year]
        feedback:
          en: "Almost nobody chooses dinner by when the restaurant opened. The filter people need, delivery time, is still missing."
          ar: "لا أحد تقريبًا يختار عشاءه حسب سنة افتتاح المطعم. والفلتر الذي يحتاجه الناس، وقت التوصيل، ما زال غير موجود."
    correct:
      en: "Delivery time: what hungry people decide on."
      ar: "وقت التوصيل: ما يقرّر به الجائعون."
    explain:
      en: "With \"Under 30 min\", people see only the places that can feed them soon."
      ar: "مع «أقل من 30 دقيقة»، لا يرى الناس إلا الأماكن التي توصل الأكل قريبًا."

