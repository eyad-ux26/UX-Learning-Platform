id: P14-U04-L03
mode: lesson
minutes: 8
title:
  en: "Toggles that act now"
  ar: "Toggles تعمل في الحال"
sources:
  - title: { en: "Toggle-Switch Guidelines (NN/g)", ar: "إرشادات الـ Toggle switch (NN/g)" }
    url: "https://www.nngroup.com/articles/toggle-switch-guidelines/"
review_labels:
  MC-P14-038: { en: "Match the control to when the change happens", ar: "اختر العنصر بحسب وقت حدوث التغيير" }
  MC-P14-040: { en: "Keep toggle labels short and direct", ar: "اجعل اسم الـ Toggle قصيرًا ومباشرًا" }
  MC-P14-041: { en: "A lone state word reads as the label", ar: "كلمة الحالة الوحيدة تُقرأ كأنها الاسم" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Bassant's flight app", ar: "تطبيق الطيران لبسنت" }
    body:
      en: "Bassant designs a flight booking app. Under the \"From\" field there's a toggle: include nearby airports.\n\nPeople fill in the trip, then tap Search to see flights."
      ar: "تصمّم بسنت تطبيقًا لحجز رحلات الطيران. وتحت خانة «من» يوجد Toggle: أضف المطارات القريبة.\n\nيملأ الناس بيانات الرحلة، ثم يضغطون «ابحث» ليروا الرحلات."
    mock:
      width: 300
      blocks:
        - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Cairo (CAI)", ar: "القاهرة (CAI)" }, filled: true }
        - { kind: toggle, text: { en: "Include nearby airports", ar: "أضف المطارات القريبة" }, gap: s }
        - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Dubai (DXB)", ar: "دبي (DXB)" }, filled: true, gap: m }
        - { kind: button, text: { en: "Search", ar: "ابحث" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U04-04
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Toggle switches (NN/g): toggle switches should take immediate effect and shouldn't need Save or Submit. Here the airports only change the results after Search, so the control should be one that waits."
      ar: "جرّب أولًا. الـ Toggle switches (NN/g): يجب أن يكون للـ Toggle أثر فوري، ولا يحتاج إلى «حفظ» أو «إرسال». وهنا لا تغيّر المطارات النتائج إلا بعد «ابحث»، فالعنصر المناسب هو عنصر ينتظر."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "Toggle switches should take immediate effect" }
    prompt:
      en: "Nearby airports only change the results once people tap Search. Try each control. Which one should ship?"
      ar: "المطارات القريبة لا تغيّر النتائج إلا حين يضغط الناس «ابحث». جرّب كل عنصر. أيّها يجب أن يُطلق؟"
    start: toggle
    options:
      - id: toggle
        text: { en: "A toggle", ar: "Toggle" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Cairo (CAI)", ar: "القاهرة (CAI)" }, filled: true }
            - { kind: toggle, text: { en: "Include nearby airports", ar: "أضف المطارات القريبة" }, gap: s }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Dubai (DXB)", ar: "دبي (DXB)" }, filled: true, gap: m }
            - { kind: button, text: { en: "Search", ar: "ابحث" }, gap: m }
      - id: check
        text: { en: "A checkbox", ar: "Checkbox" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Cairo (CAI)", ar: "القاهرة (CAI)" }, filled: true }
            - { kind: check, text: { en: "Include nearby airports", ar: "أضف المطارات القريبة" }, gap: s }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Dubai (DXB)", ar: "دبي (DXB)" }, filled: true, gap: m }
            - { kind: button, text: { en: "Search", ar: "ابحث" }, gap: m }
    answer: [check]
    misconceptions:
      - id: MC-P14-038
        when: [toggle]
        feedback:
          en: "A toggle looks like a light switch: flip it and something happens. Here nothing changes until Search, so people flip it, see no change, and wonder whether it worked."
          ar: "الـ Toggle يشبه مفتاح النور: تضغطه فيحدث شيء. وهنا لا يتغيّر شيء حتى «ابحث»، فيضغطه الناس ولا يرون تغييرًا، ويتساءلون هل نجح."
    hints:
      - en: "When do people see the effect of this choice?"
        ar: "متى يرى الناس أثر هذا الاختيار؟"
    correct:
      en: "It waits for Search: a checkbox."
      ar: "ينتظر «ابحث»: Checkbox."
    explain:
      en: "A checkbox is part of the search, like the city fields. People tick it and expect it to count when they tap Search, which is exactly what happens."
      ar: "الـ Checkbox جزء من البحث، مثل خانات المدن. يختاره الناس ويتوقّعون أن يُحسب حين يضغطون «ابحث»، وهذا بالضبط ما يحدث."

  - id: S03
    type: card
    part: concept
    icons: [toggle, check, text, eye]
    video:
      src: clips/P14-C12.mp4
      captions: { ar: P14-C12.ar.vtt, en: P14-C12.en.vtt }
      who: { en: "Eyad Mahmoud, UX designer · UXGate", ar: "إياد محمود، مصمم UX · UXGate" }
      transcript:
        en: "(Transcript is added when the clip is cut.)"
        ar: "(يُضاف نص الفيديو بعد قصّ المقطع.)"
    title: { en: "A toggle acts the moment it's flipped", ar: "الـ Toggle يعمل لحظة الضغط عليه" }
    body:
      en: "A toggle is a digital on/off switch, like the light switch in a room: flip it and the change happens at once.\n\n- **Instant changes only.** If nothing happens until people tap Search or Save, use a checkbox or radio buttons instead.\n- **Short, direct label.** Say it aloud with \"on\" or \"off\" after it: \"Direct flights only: on\" makes sense. Avoid long or negative labels.\n- **Unmistakable state.** Use a strong colour for On. If you show state words, show both Off and On, one on each side; one word alone reads like the toggle's name."
      ar: "الـ Toggle مفتاح تشغيل وإيقاف رقمي، مثل مفتاح النور في الغرفة: تضغطه فيحدث التغيير فورًا.\n\n- **للتغييرات الفورية فقط.** إن كان لا شيء يحدث حتى يضغط الناس «ابحث» أو «حفظ»، فاستخدم Checkbox أو Radio buttons بدلًا منه.\n- **اسم قصير ومباشر.** قل الاسم بصوت عالٍ وبعده «تشغيل» أو «إيقاف»: «رحلات مباشرة فقط: تشغيل» جملة مفهومة. وتجنّب الأسماء الطويلة أو المنفية.\n- **حالة واضحة بلا لبس.** استخدم لونًا قويًا لحالة التشغيل. وإن كتبت كلمات الحالة، فاكتب «إيقاف» و«تشغيل» معًا، كل واحدة في جهة؛ فالكلمة الوحيدة تُقرأ كأنها اسم الـ Toggle."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U04-02
    rules: [R06, R15]
    value:
      en: "Toggle switches (NN/g): keep labels for toggle switches short and direct. A long, negative label makes people work out what On means before they can use it."
      ar: "الـ Toggle switches (NN/g): اجعل أسماء الـ Toggles قصيرة ومباشرة. فالاسم الطويل المنفي يجعل الناس يفكّرون في معنى التشغيل قبل أن يستخدموه."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "Keep labels for toggle switches short and direct." }
    scenario:
      en: "On the results page, a toggle changes the list right away. When it's on, the list shows direct flights only."
      ar: "في صفحة النتائج، يوجد Toggle يغيّر القائمة فورًا. وحين يكون في وضع التشغيل، تعرض القائمة الرحلات المباشرة فقط."
    prompt:
      en: "Try each label. Which one should ship?"
      ar: "جرّب كل اسم. أيّها يجب أن يُطلق؟"
    start: hide
    options:
      - id: hide
        text: { en: "\"Don't show flights that aren't direct\"", ar: "«لا تعرض الرحلات غير المباشرة»" }
        mock:
          width: 300
          blocks:
            - { kind: toggle, text: { en: "Don't show flights that aren't direct", ar: "لا تعرض الرحلات غير المباشرة" } }
            - { kind: divider, gap: s }
            - { kind: text, text: { en: "**08:40 → 12:15**  Direct  ·  EGP 9,800", ar: "**08:40 ← 12:15**  مباشرة  ·  9,800 جنيه" }, gap: s }
            - { kind: text, text: { en: "**10:05 → 17:30**  1 stop  ·  EGP 7,200", ar: "**10:05 ← 17:30**  توقّف واحد  ·  7,200 جنيه" }, gap: s }
      - id: direct
        text: { en: "\"Direct flights only\"", ar: "«رحلات مباشرة فقط»" }
        mock:
          width: 300
          blocks:
            - { kind: toggle, text: { en: "Direct flights only", ar: "رحلات مباشرة فقط" } }
            - { kind: divider, gap: s }
            - { kind: text, text: { en: "**08:40 → 12:15**  Direct  ·  EGP 9,800", ar: "**08:40 ← 12:15**  مباشرة  ·  9,800 جنيه" }, gap: s }
            - { kind: text, text: { en: "**10:05 → 17:30**  1 stop  ·  EGP 7,200", ar: "**10:05 ← 17:30**  توقّف واحد  ·  7,200 جنيه" }, gap: s }
      - id: setting
        text: { en: "\"Flight stops visibility setting\"", ar: "«إعداد ظهور الرحلات ذات التوقّف»" }
        mock:
          width: 300
          blocks:
            - { kind: toggle, text: { en: "Flight stops visibility setting", ar: "إعداد ظهور الرحلات ذات التوقّف" } }
            - { kind: divider, gap: s }
            - { kind: text, text: { en: "**08:40 → 12:15**  Direct  ·  EGP 9,800", ar: "**08:40 ← 12:15**  مباشرة  ·  9,800 جنيه" }, gap: s }
            - { kind: text, text: { en: "**10:05 → 17:30**  1 stop  ·  EGP 7,200", ar: "**10:05 ← 17:30**  توقّف واحد  ·  7,200 جنيه" }, gap: s }
    answer: [direct]
    misconceptions:
      - id: MC-P14-040
        when: [hide]
        feedback:
          en: "Say it with \"on\": \"Don't show flights that aren't direct: on.\" People have to untangle two negatives to know what they'll see."
          ar: "قلها مع «تشغيل»: «لا تعرض الرحلات غير المباشرة: تشغيل». فيضطر الناس إلى فكّ نفيين ليعرفوا ماذا سيرون."
      - id: MC-P14-040
        when: [setting]
        feedback:
          en: "\"Flight stops visibility setting: on\" still doesn't say what appears. A long technical label slows people down and hides the meaning."
          ar: "«إعداد ظهور الرحلات ذات التوقّف: تشغيل» ما زالت لا تقول ماذا سيظهر. فالاسم الطويل التقني يبطئ الناس ويخفي المعنى."
    hints:
      - en: "Read each label with \"on\" after it. Which sentence is clear?"
        ar: "اقرأ كل اسم وبعده «تشغيل». أيّ جملة واضحة؟"
    correct:
      en: "Short and direct: \"Direct flights only\"."
      ar: "قصير ومباشر: «رحلات مباشرة فقط»."
    explain:
      en: "\"Direct flights only: on\" reads as a plain sentence, and the list changes to match the moment people flip it."
      ar: "«رحلات مباشرة فقط: تشغيل» جملة بسيطة، وتتغيّر القائمة لتطابقها لحظة الضغط على الـ Toggle."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U04-05
    rules: [R06, R15]
    confidence: true
    value:
      en: "Toggle switches (NN/g): if only one descriptor is present beside a toggle, it can be taken for a toggle label. Show both Off and On, one on each side."
      ar: "الـ Toggle switches (NN/g): إن كانت بجانب الـ Toggle كلمة وصف واحدة فقط، فقد تُفهم على أنها اسمه. اكتب «إيقاف» و«تشغيل» معًا، كل واحدة في جهة."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "If only one descriptor is present beside a toggle, it can be taken for a toggle label." }
    scenario:
      en: "In the app settings, a toggle sends a reminder to check in for each flight. Its name, \"Check-in reminders\", sits above it. The designer wants a state word next to the switch. Right now the reminders are off."
      ar: "في إعدادات التطبيق، يوجد Toggle يرسل تذكيرًا بإنهاء إجراءات السفر لكل رحلة. واسمه «تذكير بإجراءات السفر» مكتوب فوقه. ويريد المصمّم كلمة حالة بجانب المفتاح. والتذكير الآن متوقّف."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: on
    options:
      - id: on
        text: { en: "The word \"On\" beside the switch", ar: "كلمة «تشغيل» بجانب المفتاح" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Check-in reminders", ar: "تذكير بإجراءات السفر" } }
            - { kind: toggle, text: { en: "On", ar: "تشغيل" }, gap: xs }
      - id: off
        text: { en: "The word \"Off\" beside the switch", ar: "كلمة «إيقاف» بجانب المفتاح" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Check-in reminders", ar: "تذكير بإجراءات السفر" } }
            - { kind: toggle, text: { en: "Off", ar: "إيقاف" }, gap: xs }
      - id: both
        text: { en: "\"Off\" and \"On\", one on each side", ar: "«إيقاف» و«تشغيل»، كل واحدة في جهة" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Check-in reminders", ar: "تذكير بإجراءات السفر" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Off", ar: "إيقاف" } }
                - { kind: toggle, text: "" }
                - { kind: meta, text: { en: "On", ar: "تشغيل" } }
    answer: [both]
    misconceptions:
      - id: MC-P14-041
        when: [on]
        feedback:
          en: "The switch is off, but the only word beside it says \"On\". Is that the state, or what flipping it does? Some people will think the reminders already work."
          ar: "المفتاح متوقّف، لكن الكلمة الوحيدة بجانبه تقول «تشغيل». هل هذه هي الحالة، أم ما يفعله الضغط عليه؟ وسيظن بعض الناس أن التذكير يعمل بالفعل."
      - id: MC-P14-041
        when: [off]
        feedback:
          en: "One word beside a switch reads like its name. Does flipping it turn \"Off\" on? People can't be sure whether they're switching reminders on or off."
          ar: "الكلمة الوحيدة بجانب المفتاح تُقرأ كأنها اسمه. هل الضغط عليه يشغّل «إيقاف»؟ فلا يتأكّد الناس هل يشغّلون التذكير أم يوقفونه."
    hints:
      - en: "Flip the switch in each version. Does the word still tell the truth?"
        ar: "اضغط المفتاح في كل نسخة. هل ما زالت الكلمة صحيحة؟"
    correct:
      en: "Both words, one on each side."
      ar: "الكلمتان معًا، كل واحدة في جهة."
    explain:
      en: "With Off on one side and On on the other, the knob points at the current state, and no word can be mistaken for the setting's name."
      ar: "حين تكون «إيقاف» في جهة و«تشغيل» في الجهة الأخرى، يشير المفتاح إلى الحالة الحالية، ولا تُفهم أي كلمة على أنها اسم الإعداد."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U04-02
    rules: [R11]
    value:
      en: "Toggle switches (NN/g): when in doubt, say the label aloud and append \"on/off\" to the end. \"Price display: on\" doesn't say what changes; \"Show total for all travellers: on\" does."
      ar: "الـ Toggle switches (NN/g): إن لم تكن متأكدًا، فقل الاسم بصوت عالٍ وأضف بعده «تشغيل/إيقاف». «طريقة عرض السعر: تشغيل» لا تقول ما الذي يتغيّر؛ أما «اعرض الإجمالي لكل المسافرين: تشغيل» فتقول."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "When in doubt, say the label aloud and append \"on/off\" to the end." }
    scenario:
      en: "A family of four searches for flights. A toggle on the results page switches prices at once from one traveller to the total for everyone."
      ar: "أسرة من أربعة أفراد تبحث عن رحلات. وفي صفحة النتائج يوجد Toggle يحوّل الأسعار فورًا من سعر المسافر الواحد إلى الإجمالي لكل الأسرة."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: \"Price display\"", ar: "النسخة A: «طريقة عرض السعر»" }
      mock:
        width: 260
        blocks:
          - { kind: toggle, text: { en: "Price display", ar: "طريقة عرض السعر" } }
          - { kind: text, text: { en: "**08:40 → 12:15**  EGP 9,800", ar: "**08:40 ← 12:15**  9,800 جنيه" }, gap: s }
    b:
      label: { en: "Version B: \"Show total for all travellers\"", ar: "النسخة B: «اعرض الإجمالي لكل المسافرين»" }
      mock:
        width: 260
        blocks:
          - { kind: toggle, text: { en: "Show total for all travellers", ar: "اعرض الإجمالي لكل المسافرين" } }
          - { kind: text, text: { en: "**08:40 → 12:15**  EGP 9,800", ar: "**08:40 ← 12:15**  9,800 جنيه" }, gap: s }
    answer: b
    misconceptions:
      - id: MC-P14-040
        when: [a]
        feedback:
          en: "\"Price display: on\" means nothing. People have to flip it and compare numbers to find out what it does, and may book thinking EGP 9,800 is the family total."
          ar: "«طريقة عرض السعر: تشغيل» بلا معنى. فيضطر الناس إلى الضغط عليه ومقارنة الأرقام ليعرفوا ماذا يفعل، وقد يحجزون وهم يظنون أن 9,800 جنيه هي إجمالي الأسرة."
    correct:
      en: "B: it says what turning it on does."
      ar: "B: تقول ماذا يفعل التشغيل."
    explain:
      en: "\"Show total for all travellers: on\" is a clear sentence, so the family knows which price they're looking at before they flip anything."
      ar: "«اعرض الإجمالي لكل المسافرين: تشغيل» جملة واضحة، فتعرف الأسرة أي سعر تنظر إليه قبل أن تضغط أي شيء."

  - id: S07
    type: tune
    part: independent
    skill: SK-P14-U04-04
    rules: [R14]
    value:
      en: "Toggle switches (NN/g): toggle switches are digital on/off switches and should take immediate effect. Lights that change the moment people tap are exactly that, so an extra Apply step only adds doubt."
      ar: "الـ Toggle switches (NN/g): الـ Toggle مفتاح تشغيل وإيقاف رقمي، ويجب أن يكون أثره فوريًا. والأنوار التي تتغيّر لحظة الضغط هي هذا بالضبط، فخطوة «تطبيق» الإضافية لا تضيف إلا الشك."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "Toggle switches are digital on/off switches." }
    scenario:
      en: "Yousra designs a smart-home app. The lights in each room can switch on or off straight from the phone, with no delay."
      ar: "تصمّم يسرا تطبيقًا للبيت الذكي. ويمكن تشغيل الأنوار في كل غرفة أو إطفاؤها من الموبايل مباشرة، دون تأخير."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: check
    options:
      - id: check
        text: { en: "Checkboxes, then an Apply button", ar: "Checkboxes، ثم زر «تطبيق»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Lights", ar: "الأنوار" } }
            - { kind: check, text: { en: "Living room", ar: "غرفة المعيشة" }, selected: true, gap: s }
            - { kind: check, text: { en: "Kitchen", ar: "المطبخ" } }
            - { kind: check, text: { en: "Bedroom", ar: "غرفة النوم" } }
            - { kind: button, text: { en: "Apply", ar: "تطبيق" }, gap: m }
      - id: radio
        text: { en: "On and Off radio buttons for each room, then Save", ar: "Radio buttons «تشغيل» و«إطفاء» لكل غرفة، ثم «حفظ»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Living room", ar: "غرفة المعيشة" } }
            - { kind: radio, text: { en: "On", ar: "تشغيل" }, selected: true, gap: xs }
            - { kind: radio, text: { en: "Off", ar: "إطفاء" } }
            - { kind: heading, text: { en: "Kitchen", ar: "المطبخ" }, gap: s }
            - { kind: radio, text: { en: "On", ar: "تشغيل" }, gap: xs }
            - { kind: radio, text: { en: "Off", ar: "إطفاء" }, selected: true }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }
      - id: toggle
        text: { en: "A toggle for each room that works at once", ar: "Toggle لكل غرفة يعمل فورًا" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Lights", ar: "الأنوار" } }
            - { kind: toggle, text: { en: "Living room", ar: "غرفة المعيشة" }, selected: true, gap: s }
            - { kind: toggle, text: { en: "Kitchen", ar: "المطبخ" } }
            - { kind: toggle, text: { en: "Bedroom", ar: "غرفة النوم" } }
    answer: [toggle]
    misconceptions:
      - id: MC-P14-038
        when: [check, radio]
        feedback:
          en: "The lights can change the moment people tap, but this version makes them wait for a button. People tap a room, nothing happens, and they wonder whether the house heard them."
          ar: "الأنوار يمكن أن تتغيّر لحظة الضغط، لكن هذه النسخة تجعل الناس ينتظرون زرًا. فيضغطون على غرفة، ولا يحدث شيء، ويتساءلون هل استجاب البيت."
    correct:
      en: "An instant change: a toggle per room."
      ar: "تغيير فوري: Toggle لكل غرفة."
    explain:
      en: "Each toggle works like the switch on the wall: flip it and the light changes, with nothing else to press."
      ar: "كل Toggle يعمل مثل المفتاح على الحائط: تضغطه فيتغيّر النور، دون أي شيء آخر للضغط عليه."

  - id: S08
    type: card
    part: recap
    icons: [toggle, text, eye]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Toggles for instant changes only;** a choice that waits for Search or Save is a checkbox.\n- **Short, direct labels** that make sense with \"on\" after them.\n- **Both Off and On**, or no state word at all, so the state can't be misread.\n\nNext: the skill check."
      ar: "- **الـ Toggle للتغييرات الفورية فقط؛** والاختيار الذي ينتظر «ابحث» أو «حفظ» يكون Checkbox.\n- **أسماء قصيرة ومباشرة** تكون مفهومة حين تأتي بعدها «تشغيل».\n- **«إيقاف» و«تشغيل» معًا**، أو بدون كلمة حالة أصلًا، حتى لا تُفهم الحالة خطأً.\n\nالتالي: اختبار المهارة."
