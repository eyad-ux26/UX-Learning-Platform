id: P14-U04
free: false
title:
  en: "Choices people can trust"
  ar: "اختيارات يثق بها الناس"
skill:
  en: "Design checkboxes, radio buttons and toggles that look standard, read clearly and act when people expect."
  ar: "صمّم الـ Checkboxes والـ Radio buttons والـ Toggles بحيث يكون شكلها معتادًا، وكلامها واضحًا، وتعمل في الوقت الذي يتوقّعه الناس."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U04-01
    title: { en: "Keep the standard look and layout", ar: "حافظ على الشكل والترتيب المعتادين" }
    can_do: { en: "Use square checkboxes and round radio buttons, one choice per line, with the whole row tappable.", ar: "استخدم Checkbox مربعًا وRadio button دائريًا، واختيارًا واحدًا في كل سطر، واجعل السطر كله قابلًا للضغط." }
  - id: SK-P14-U04-02
    title: { en: "Word choices so they read at a glance", ar: "اكتب الاختيارات بحيث تُفهم بنظرة واحدة" }
    can_do: { en: "Write positive, active labels that say what turning the choice on does, short enough to read at a glance.", ar: "اكتب أسماء إيجابية تقول ما يحدث حين تختار الخيار، وقصيرة بحيث تُقرأ بنظرة واحدة." }
  - id: SK-P14-U04-03
    title: { en: "Give radio buttons a complete set and a start", ar: "اجعل الـ Radio buttons كاملة، وابدأ باختيار" }
    can_do: { en: "Cover every answer people may have, with \"Other\" or \"None\" when needed, and start with one choice selected.", ar: "غطِّ كل إجابة قد تكون عند الناس، وأضف «أخرى» أو «لا شيء» عند الحاجة، وابدأ باختيار واحد محدَّد." }
  - id: SK-P14-U04-04
    title: { en: "Match the control to when the change happens", ar: "اختر العنصر بحسب وقت حدوث التغيير" }
    can_do: { en: "Use a toggle only for a change that happens the moment it's flipped; use checkboxes and radio buttons for settings that a button applies, and a button for actions.", ar: "استخدم الـ Toggle فقط لتغيير يحدث لحظة الضغط عليه؛ واستخدم الـ Checkbox والـ Radio button لإعدادات يطبّقها زر، واستخدم زرًا للأفعال." }
  - id: SK-P14-U04-05
    title: { en: "Make a toggle's state unmistakable", ar: "اجعل حالة الـ Toggle واضحة بلا لبس" }
    can_do: { en: "Show whether a toggle is on or off without a lone state word that reads like its label: name the setting, and show both Off and On if you show either.", ar: "وضّح هل الـ Toggle يعمل أم لا، دون كلمة حالة وحيدة تُقرأ كأنها اسمه: اكتب اسم الإعداد، وإن كتبت كلمة حالة فاكتب الكلمتين «إيقاف» و«تشغيل»." }
