  # SK-P14-U04-05: make a toggle's state unmistakable
  - id: S09
    type: tune
    skill: SK-P14-U04-05
    part: retest
    value:
      en: "Re-test, toggle switches (NN/g): stick to on/off and include both off and on, one on each side of the toggle, to avoid confusion."
      ar: "إعادة اختبار، الـ Toggle switches (NN/g): التزم بكلمتي تشغيل وإيقاف، واكتبهما معًا، كل واحدة في جهة من الـ Toggle، حتى لا يحدث لبس."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "If only one descriptor is present beside a toggle, it can be taken for a toggle label." }
    scenario:
      en: "Ola's security app has a toggle for VPN protection, with its name, \"VPN protection\", above it. The designer wants a state word next to the switch. Protection is off right now."
      ar: "في تطبيق الحماية لعُلا يوجد Toggle لحماية الـ VPN، واسمه «حماية VPN» مكتوب فوقه. ويريد المصمّم كلمة حالة بجانب المفتاح. والحماية الآن متوقّفة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: active
    options:
      - id: active
        text: { en: "The word \"Active\" beside the switch", ar: "كلمة «نشطة» بجانب المفتاح" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "VPN protection", ar: "حماية VPN" } }
            - { kind: toggle, text: { en: "Active", ar: "نشطة" }, gap: xs }
      - id: both
        text: { en: "\"Off\" and \"On\", one on each side", ar: "«إيقاف» و«تشغيل»، كل واحدة في جهة" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "VPN protection", ar: "حماية VPN" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Off", ar: "إيقاف" } }
                - { kind: toggle, text: "" }
                - { kind: meta, text: { en: "On", ar: "تشغيل" } }
    answer: [both]
    misconceptions:
      - id: MC-P14-041
        when: [active]
        feedback:
          en: "The switch is off, but the only word beside it says \"Active\". People may believe they're protected when they aren't."
          ar: "المفتاح متوقّف، لكن الكلمة الوحيدة بجانبه تقول «نشطة». فقد يظن الناس أنهم محميّون وهم ليسوا كذلك."
    correct:
      en: "Both words, one on each side."
      ar: "الكلمتان معًا، كل واحدة في جهة."
    explain:
      en: "The knob sits on Off now and moves to On when flipped, so the state is never in doubt."
      ar: "المفتاح عند «إيقاف» الآن، وينتقل إلى «تشغيل» عند الضغط، فلا يكون هناك شك في الحالة."

  - id: S10
    type: tune
    skill: SK-P14-U04-05
    part: retest
    value:
      en: "Re-test, toggle switches (NN/g): if only one descriptor is present beside a toggle, it can be taken for a toggle label. Put the setting's own name beside the switch instead."
      ar: "إعادة اختبار، الـ Toggle switches (NN/g): إن كانت بجانب الـ Toggle كلمة وصف واحدة فقط، فقد تُفهم على أنها اسمه. ضع اسم الإعداد نفسه بجانب المفتاح بدلًا منها."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "If only one descriptor is present beside a toggle, it can be taken for a toggle label." }
    scenario:
      en: "In Osama's family-tracking app, a toggle shares your location with your family. Sharing is on right now."
      ar: "في تطبيق متابعة العائلة لأسامة، يوجد Toggle يشارك موقعك مع عائلتك. والمشاركة تعمل الآن."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: off
    options:
      - id: off
        text: { en: "Name above, the word \"Off\" beside the switch", ar: "الاسم فوق، وكلمة «إيقاف» بجانب المفتاح" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Location sharing", ar: "مشاركة الموقع" } }
            - { kind: toggle, text: { en: "Off", ar: "إيقاف" }, selected: true, gap: xs }
      - id: name
        text: { en: "The name beside the switch, no state word", ar: "الاسم بجانب المفتاح، بدون كلمة حالة" }
        mock:
          width: 300
          blocks:
            - { kind: toggle, text: { en: "Share my location with family", ar: "شارك موقعي مع العائلة" }, selected: true }
    answer: [name]
    misconceptions:
      - id: MC-P14-041
        when: [off]
        feedback:
          en: "Sharing is on, yet the word beside the switch says \"Off\". Is that the state, or what the switch does? People may think their location is private."
          ar: "المشاركة تعمل، لكن الكلمة بجانب المفتاح تقول «إيقاف». هل هذه الحالة، أم ما يفعله المفتاح؟ فقد يظن الناس أن موقعهم خاص."
    correct:
      en: "Name beside the switch; the switch shows the state."
      ar: "الاسم بجانب المفتاح؛ والمفتاح يوضّح الحالة."
    explain:
      en: "\"Share my location with family\" next to a switch that's on reads plainly as \"I'm sharing\"."
      ar: "«شارك موقعي مع العائلة» بجانب مفتاح يعمل تُقرأ ببساطة: «أنا أشارك موقعي»."
