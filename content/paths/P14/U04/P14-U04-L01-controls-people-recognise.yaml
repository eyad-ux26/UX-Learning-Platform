id: P14-U04-L01
mode: lesson
minutes: 8
title:
  en: "Controls people recognise"
  ar: "عناصر يعرفها الناس"
sources:
  - title: { en: "Checkboxes vs. Radio Buttons (NN/g)", ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g)" }
    url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/"
  - title: { en: "Checkboxes: Design Guidelines (NN/g)", ar: "الـ Checkboxes: إرشادات التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/"
review_labels:
  MC-P14-033: { en: "Keep the standard shape: square for many, circle for one", ar: "حافظ على الشكل المعتاد: مربع للمتعدد، ودائرة للواحد" }
  MC-P14-034: { en: "One choice per line, so each marker has one label", ar: "اختيار واحد في كل سطر، حتى يكون لكل علامة اسم واحد" }
  MC-P14-035: { en: "Say what choosing it does, in positive words", ar: "قل ما يحدث عند الاختيار، بكلمات إيجابية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Amira's sandwich app", ar: "تطبيق الساندوتشات لأميرة" }
    body:
      en: "Amira designs the ordering app for a sandwich shop. After picking a sandwich, people can add extras: cheese, tomato and pickles, as many as they like.\n\nThe brand team drew all the markers in the app as small circles, to match the round dots in the logo."
      ar: "تصمّم أميرة تطبيق الطلبات لمحل ساندوتشات. وبعد اختيار الساندوتش، يمكن للناس أن يضيفوا إضافات: جبنة وطماطم ومخلل، بالعدد الذي يريدونه.\n\nورسم فريق الهوية كل العلامات في التطبيق على شكل دوائر صغيرة، لتشبه النقاط الدائرية في الشعار."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Add extras", ar: "أضف إضافات" } }
        - { kind: check, marker: round, text: { en: "Cheese  +10", ar: "جبنة  +10" }, selected: true, gap: s }
        - { kind: check, marker: round, text: { en: "Tomato  +5", ar: "طماطم  +5" } }
        - { kind: check, marker: round, text: { en: "Pickles  +5", ar: "مخلل  +5" } }
        - { kind: button, text: { en: "Add to order", ar: "أضف إلى الطلب" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U04-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Checkboxes (NN/g): users expect checkboxes to look like checkboxes, squares, and you should never use circles as checkboxes. A circle tells people they can pick only one."
      ar: "جرّب أولًا. الـ Checkboxes (NN/g): يتوقّع الناس أن يبدو الـ Checkbox مثل الـ Checkbox، أي مربعًا، ولا يجب أبدًا استخدام الدوائر كـ Checkboxes. فالدائرة تقول للناس إنهم يستطيعون اختيار واحد فقط."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/", quote: "Never use circles as checkboxes." }
    prompt:
      en: "People can add any number of extras. Try each list, and tap the extras. Which one should ship?"
      ar: "يمكن للناس إضافة أي عدد من الإضافات. جرّب كل قائمة، واضغط على الإضافات. أيّها يجب أن تُطلق؟"
    start: round
    options:
      - id: round
        text: { en: "Round markers that allow many, as the brand team drew them", ar: "علامات دائرية تسمح بأكثر من اختيار، كما رسمها فريق الهوية" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Add extras", ar: "أضف إضافات" } }
            - { kind: check, marker: round, text: { en: "Cheese  +10", ar: "جبنة  +10" }, selected: true, gap: s }
            - { kind: check, marker: round, text: { en: "Tomato  +5", ar: "طماطم  +5" } }
            - { kind: check, marker: round, text: { en: "Pickles  +5", ar: "مخلل  +5" } }
      - id: radio
        text: { en: "Radio buttons", ar: "Radio buttons" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Add extras", ar: "أضف إضافات" } }
            - { kind: radio, text: { en: "Cheese  +10", ar: "جبنة  +10" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Tomato  +5", ar: "طماطم  +5" } }
            - { kind: radio, text: { en: "Pickles  +5", ar: "مخلل  +5" } }
      - id: square
        text: { en: "Square checkboxes", ar: "Checkboxes مربعة" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Add extras", ar: "أضف إضافات" } }
            - { kind: check, text: { en: "Cheese  +10", ar: "جبنة  +10" }, selected: true, gap: s }
            - { kind: check, text: { en: "Tomato  +5", ar: "طماطم  +5" } }
            - { kind: check, text: { en: "Pickles  +5", ar: "مخلل  +5" } }
    answer: [square]
    misconceptions:
      - id: MC-P14-033
        when: [round]
        feedback:
          en: "Round markers read as radio buttons: pick one. Many people will add cheese and stop, never trying a second extra."
          ar: "العلامات الدائرية تُقرأ كأنها Radio buttons: اختر واحدًا. فكثيرون سيضيفون الجبنة ويتوقّفون، ولن يجرّبوا إضافة ثانية."
      - id: MC-P14-033
        when: [radio]
        feedback:
          en: "Radio buttons allow only one: tapping tomato clears the cheese. Extras can be any number, so this list loses orders."
          ar: "الـ Radio buttons تسمح باختيار واحد فقط: الضغط على الطماطم يلغي الجبنة. والإضافات يمكن أن تكون بأي عدد، فهذه القائمة تُضيّع طلبات."
    hints:
      - en: "What does a round marker usually let people do?"
        ar: "ماذا تسمح العلامة الدائرية للناس بأن يفعلوا عادةً؟"
    correct:
      en: "Any number: square checkboxes."
      ar: "أي عدد: Checkboxes مربعة."
    explain:
      en: "Squares say \"tick any\" before anyone reads a word, so people add cheese and pickles without a second thought. The brand can live in colour and type, not in the control's shape."
      ar: "المربعات تقول «اختر ما تريد» قبل أن يقرأ أحد أي كلمة، فيضيف الناس الجبنة والمخلل دون تفكير. ويمكن أن تظهر الهوية في الألوان والخطوط، لا في شكل العنصر."

  - id: S03
    type: card
    part: concept
    icons: [list, eye, text, ok]
    video:
      src: clips/P14-C10.mp4
      captions: { ar: P14-C10.ar.vtt, en: P14-C10.en.vtt }
      who: { en: "Eyad Mahmoud, UX designer · UXGate", ar: "إياد محمود، مصمم UX · UXGate" }
      transcript:
        en: "(Transcript is added when the clip is cut.)"
        ar: "(يُضاف نص الفيديو بعد قصّ المقطع.)"
    title: { en: "Controls people already know", ar: "عناصر يعرفها الناس من قبل" }
    body:
      en: "Checkboxes and radio buttons are so familiar that people use them without thinking. A design pattern only helps while it looks like itself.\n\n- **Radio buttons** pick exactly one from a set. **Checkboxes** pick any number, or none.\n- **Standard look:** a checkbox is a small square that shows a tick; a radio button is a small circle with a dot inside. Don't swap or restyle the shapes.\n- **One choice per line:** stack the options. If they must sit side by side, leave clear space so each marker belongs to one label.\n- **Positive, active words:** say what ticking does, like \"Send me offers\", not \"Don't send me offers\"."
      ar: "الـ Checkboxes والـ Radio buttons مألوفة جدًا، فيستخدمها الناس دون تفكير. والـ Design pattern لا يفيد إلا ما دام شكله هو الشكل المعتاد.\n\n- **الـ Radio buttons** لاختيار واحد فقط من مجموعة. **والـ Checkboxes** لاختيار أي عدد، أو لا شيء.\n- **الشكل المعتاد:** الـ Checkbox مربع صغير تظهر فيه علامة صح؛ والـ Radio button دائرة صغيرة بداخلها نقطة. لا تبدّل الشكلين ولا تغيّرهما.\n- **اختيار واحد في كل سطر:** ضع الاختيارات تحت بعضها. وإن اضطررت إلى وضعها جنبًا إلى جنب، فاترك مسافة واضحة حتى تنتمي كل علامة إلى اسم واحد.\n- **كلمات إيجابية وواضحة:** قل ما يحدث عند الاختيار، مثل «أرسل لي العروض»، لا «لا ترسل لي العروض»."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U04-02
    rules: [R06, R15]
    value:
      en: "Checkboxes (NN/g): ensure that all your label statements are worded positively. Negatively worded statements force users to contemplate double negatives, leading to errors."
      ar: "الـ Checkboxes (NN/g): تأكّد أن كل أسماء الاختيارات مكتوبة بصيغة إيجابية. فالصيغ المنفية تجبر الناس على التفكير في نفي النفي، وهذا يؤدي إلى أخطاء."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/", quote: "Negatively worded statements force users to contemplate double negatives, leading to errors." }
    scenario:
      en: "At checkout, Amira adds one checkbox about plastic cutlery. The shop wants to send cutlery only to people who ask for it."
      ar: "في صفحة الدفع، تضيف أميرة Checkbox واحدًا عن أدوات المائدة البلاستيكية. والمحل يريد إرسال الأدوات فقط لمن يطلبها."
    prompt:
      en: "Try each label. Which one should ship?"
      ar: "جرّب كل اسم. أيّها يجب أن يُطلق؟"
    start: dont
    options:
      - id: dont
        text: { en: "\"Don't add plastic cutlery\"", ar: "«لا تضف أدوات مائدة بلاستيكية»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your order", ar: "طلبك" } }
            - { kind: text, text: { en: "Chicken sandwich × 2", ar: "ساندوتش فراخ × 2" }, gap: s }
            - { kind: check, text: { en: "Don't add plastic cutlery", ar: "لا تضف أدوات مائدة بلاستيكية" }, gap: m }
            - { kind: button, text: { en: "Place order", ar: "أرسل الطلب" }, gap: m }
      - id: skip
        text: { en: "\"Don't skip plastic cutlery\"", ar: "«لا تتجاهل أدوات المائدة البلاستيكية»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your order", ar: "طلبك" } }
            - { kind: text, text: { en: "Chicken sandwich × 2", ar: "ساندوتش فراخ × 2" }, gap: s }
            - { kind: check, text: { en: "Don't skip plastic cutlery", ar: "لا تتجاهل أدوات المائدة البلاستيكية" }, gap: m }
            - { kind: button, text: { en: "Place order", ar: "أرسل الطلب" }, gap: m }
      - id: add
        text: { en: "\"Add plastic cutlery\"", ar: "«أضف أدوات مائدة بلاستيكية»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your order", ar: "طلبك" } }
            - { kind: text, text: { en: "Chicken sandwich × 2", ar: "ساندوتش فراخ × 2" }, gap: s }
            - { kind: check, text: { en: "Add plastic cutlery", ar: "أضف أدوات مائدة بلاستيكية" }, gap: m }
            - { kind: button, text: { en: "Place order", ar: "أرسل الطلب" }, gap: m }
    answer: [add]
    misconceptions:
      - id: MC-P14-035
        when: [dont, skip]
        feedback:
          en: "A tick here means \"don't\", so people have to work through a negative: does ticking bring cutlery, or stop it? Some will guess wrong."
          ar: "علامة الصح هنا تعني «لا»، فيضطر الناس إلى فهم صيغة منفية: هل الاختيار يأتي بالأدوات أم يمنعها؟ وسيخمّن بعضهم خطأً."
    hints:
      - en: "Read the label aloud with \"yes\" in front of it. Is the meaning clear?"
        ar: "اقرأ الاسم بصوت عالٍ وقبله كلمة «نعم». هل المعنى واضح؟"
    correct:
      en: "Positive: \"Add plastic cutlery\"."
      ar: "صيغة إيجابية: «أضف أدوات مائدة بلاستيكية»."
    explain:
      en: "A tick now means yes to cutlery, and an empty box means none. Nobody has to untangle a double negative while they're hungry."
      ar: "علامة الصح الآن تعني نعم للأدوات، والمربع الفارغ يعني بدونها. ولا يحتاج أحد إلى فكّ نفي النفي وهو جائع."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U04-02
    rules: [R06, R15]
    value:
      en: "Checkboxes vs. radio buttons (NN/g): use positive and active wording for checkbox labels. A label that names only a topic doesn't say whether ticking turns it on or off."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): استخدم صيغة إيجابية تصف فعلًا في أسماء الـ Checkboxes. فالاسم الذي يذكر الموضوع فقط لا يقول هل الاختيار يشغّله أم يوقفه."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "Use positive and active wording for checkbox labels" }
    scenario:
      en: "Under the delivery address there's one checkbox. When it's ticked, the shop sends a text message when the driver is close."
      ar: "تحت عنوان التوصيل يوجد Checkbox واحد. وحين يكون مختارًا، يرسل المحل رسالة نصية حين يقترب المندوب."
    prompt:
      en: "Try each label. Which one should ship?"
      ar: "جرّب كل اسم. أيّها يجب أن يُطلق؟"
    start: sms
    options:
      - id: sms
        text: { en: "\"SMS\"", ar: "«SMS»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Address", ar: "العنوان" }, text: { en: "12 Nile St, Floor 3", ar: "12 شارع النيل، الدور 3" }, filled: true }
            - { kind: check, text: { en: "SMS", ar: "SMS" }, gap: m }
      - id: text
        text: { en: "\"Text me when the driver is close\"", ar: "«أرسل لي رسالة حين يقترب المندوب»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Address", ar: "العنوان" }, text: { en: "12 Nile St, Floor 3", ar: "12 شارع النيل، الدور 3" }, filled: true }
            - { kind: check, text: { en: "Text me when the driver is close", ar: "أرسل لي رسالة حين يقترب المندوب" }, gap: m }
      - id: pref
        text: { en: "\"SMS notification preference\"", ar: "«تفضيل إشعارات SMS»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Address", ar: "العنوان" }, text: { en: "12 Nile St, Floor 3", ar: "12 شارع النيل، الدور 3" }, filled: true }
            - { kind: check, text: { en: "SMS notification preference", ar: "تفضيل إشعارات SMS" }, gap: m }
    answer: [text]
    misconceptions:
      - id: MC-P14-035
        when: [sms, pref]
        feedback:
          en: "This label names a topic, not what happens. Does a tick mean \"send me texts\", \"no texts\", or \"I prefer texts over calls\"?"
          ar: "هذا الاسم يذكر موضوعًا، لا ما يحدث. هل علامة الصح تعني «أرسل لي رسائل»، أم «بدون رسائل»، أم «أفضّل الرسائل على المكالمات»؟"
    hints:
      - en: "After reading the label, do you know what ticking it will do?"
        ar: "بعد قراءة الاسم، هل تعرف ماذا سيحدث حين تختاره؟"
    correct:
      en: "Active: say what ticking does."
      ar: "اكتب فعلًا: قل ما يحدث عند الاختيار."
    explain:
      en: "\"Text me when the driver is close\" describes the result of the tick, so people know exactly what they're agreeing to."
      ar: "«أرسل لي رسالة حين يقترب المندوب» تصف نتيجة الاختيار، فيعرف الناس بالضبط على ماذا يوافقون."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U04-01
    rules: [R11]
    value:
      en: "Checkboxes vs. radio buttons (NN/g): lay out your lists vertically, with one choice per line, and space buttons and labels so it's abundantly clear which choice goes with which label. In one tight line, each circle sits as close to the word before it as to the word after it."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): رتّب القوائم رأسيًا، اختيارًا واحدًا في كل سطر، واترك مسافات تجعل واضحًا تمامًا أي اختيار يتبع أي اسم. وفي سطر واحد ضيّق، تكون كل دائرة قريبة من الكلمة التي قبلها بقدر قربها من الكلمة التي بعدها."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "Lay out your lists vertically, with one choice per line." }
    scenario:
      en: "Each sandwich comes in one bread: white, brown or baladi. To save space, the first design puts the three choices in one line."
      ar: "كل ساندوتش يأتي بنوع خبز واحد: أبيض أو أسمر أو بلدي. ولتوفير المساحة، يضع التصميم الأول الاختيارات الثلاثة في سطر واحد."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: one line", ar: "النسخة A: سطر واحد" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Bread", ar: "الخبز" } }
          - { kind: text, text: { en: "◉ White ○ Brown ○ Baladi", ar: "◉ أبيض ○ أسمر ○ بلدي" }, gap: s }
    b:
      label: { en: "Version B: one choice per line", ar: "النسخة B: اختيار واحد في كل سطر" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Bread", ar: "الخبز" } }
          - { kind: radio, text: { en: "White", ar: "أبيض" }, selected: true, gap: s }
          - { kind: radio, text: { en: "Brown", ar: "أسمر" } }
          - { kind: radio, text: { en: "Baladi", ar: "بلدي" } }
    answer: b
    misconceptions:
      - id: MC-P14-034
        when: [a]
        feedback:
          en: "Look at the middle circle: is it Brown's, or the end of White? With equal gaps, people can't tell which bread each circle picks, and some will tap the wrong one."
          ar: "انظر إلى الدائرة الوسطى: هل هي للأسمر، أم هي نهاية الأبيض؟ مع مسافات متساوية، لا يعرف الناس أي خبز تختاره كل دائرة، وسيضغط بعضهم على الخطأ."
    correct:
      en: "B: each circle has one label."
      ar: "B: لكل دائرة اسم واحد."
    explain:
      en: "Stacked, each circle sits right next to its own word, and people scan straight down the list. Three short lines cost less space than a wrong bread."
      ar: "حين تكون تحت بعضها، تقع كل دائرة بجانب كلمتها مباشرة، ويتصفّح الناس القائمة من أعلى إلى أسفل. وثلاثة أسطر قصيرة تكلّف مساحة أقل من خبز خطأ."

  - id: S07
    type: tune
    part: independent
    skill: SK-P14-U04-01
    rules: [R14]
    value:
      en: "Checkboxes vs. radio buttons (NN/g): a radio button should be a small circle that has a solid circle inside it when selected. The account type is exactly one, so it needs the shape that says \"pick one\"."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): الـ Radio button يجب أن يكون دائرة صغيرة بداخلها دائرة ممتلئة عند اختياره. ونوع الحساب واحد فقط، فيحتاج إلى الشكل الذي يقول «اختر واحدًا»."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "A radio button should be a small circle that has a solid circle inside it when selected." }
    scenario:
      en: "Karim designs a bank app. When opening an account online, people choose exactly one account type: savings, current or payroll."
      ar: "يصمّم كريم تطبيقًا لبنك. وحين يفتح الناس حسابًا عبر التطبيق، يختارون نوع حساب واحدًا فقط: توفير أو جاري أو حساب راتب."
    prompt:
      en: "Try each list, and tap the choices. Which one should ship?"
      ar: "جرّب كل قائمة، واضغط على الاختيارات. أيّها يجب أن تُطلق؟"
    start: square
    options:
      - id: square
        text: { en: "Pick-one buttons drawn as squares", ar: "أزرار اختيار واحد مرسومة كمربعات" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Account type", ar: "نوع الحساب" } }
            - { kind: radio, marker: square, text: { en: "Savings", ar: "توفير" }, selected: true, gap: s }
            - { kind: radio, marker: square, text: { en: "Current", ar: "جاري" } }
            - { kind: radio, marker: square, text: { en: "Payroll", ar: "حساب راتب" } }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: check
        text: { en: "Checkboxes", ar: "Checkboxes" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Account type", ar: "نوع الحساب" } }
            - { kind: check, text: { en: "Savings", ar: "توفير" }, selected: true, gap: s }
            - { kind: check, text: { en: "Current", ar: "جاري" } }
            - { kind: check, text: { en: "Payroll", ar: "حساب راتب" } }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: radio
        text: { en: "Round radio buttons", ar: "Radio buttons دائرية" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Account type", ar: "نوع الحساب" } }
            - { kind: radio, text: { en: "Savings", ar: "توفير" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Current", ar: "جاري" } }
            - { kind: radio, text: { en: "Payroll", ar: "حساب راتب" } }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: [radio]
    misconceptions:
      - id: MC-P14-033
        when: [square]
        feedback:
          en: "Squares say \"tick any\". People may try to tick savings and current, then wonder why the first one cleared itself."
          ar: "المربعات تقول «اختر ما تريد». فقد يحاول الناس اختيار التوفير والجاري معًا، ثم يتساءلون لماذا أُلغي الأول وحده."
      - id: MC-P14-033
        when: [check]
        feedback:
          en: "Checkboxes let people tick two types, or none, but the bank needs exactly one. The form would have to reject the answer afterwards."
          ar: "الـ Checkboxes تسمح للناس باختيار نوعين، أو لا شيء، لكن البنك يحتاج إلى نوع واحد بالضبط. فسيضطر النموذج إلى رفض الإجابة بعدها."
    correct:
      en: "Exactly one: round radio buttons."
      ar: "واحد فقط: Radio buttons دائرية."
    explain:
      en: "Circles say \"pick one\" at a glance, and the control behaves the way it looks: choosing current moves the dot from savings."
      ar: "الدوائر تقول «اختر واحدًا» بنظرة واحدة، والعنصر يعمل كما يبدو: اختيار الجاري ينقل النقطة من التوفير."

  - id: S08
    type: card
    part: recap
    icons: [eye, list, text]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Standard shapes:** squares for any number, circles for exactly one, whatever the brand style.\n- **One choice per line**, so each marker clearly belongs to its label.\n- **Positive, active labels** that say what ticking does.\n\nNext: radio buttons that cover every answer, and controls that wait for a button."
      ar: "- **الأشكال المعتادة:** مربعات لأي عدد، ودوائر لاختيار واحد فقط، مهما كان شكل الهوية.\n- **اختيار واحد في كل سطر**، حتى تنتمي كل علامة إلى اسمها بوضوح.\n- **أسماء إيجابية** تقول ما يحدث عند الاختيار.\n\nالتالي: Radio buttons تغطي كل الإجابات، وعناصر تنتظر الضغط على زر."
