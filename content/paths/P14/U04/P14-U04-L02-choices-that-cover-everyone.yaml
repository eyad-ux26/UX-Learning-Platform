id: P14-U04-L02
mode: lesson
minutes: 8
title:
  en: "Choices that cover everyone"
  ar: "اختيارات تناسب الجميع"
sources:
  - title: { en: "Checkboxes vs. Radio Buttons (NN/g)", ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g)" }
    url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/"
  - title: { en: "Radio Buttons: Select One by Default or Leave All Unselected? (NN/g)", ar: "الـ Radio buttons: اختيار واحد افتراضيًا أم تركها كلها فارغة؟ (NN/g)" }
    url: "https://www.nngroup.com/articles/radio-buttons-default-selection/"
review_labels:
  MC-P14-036: { en: "Start radio buttons with one choice selected", ar: "ابدأ الـ Radio buttons باختيار محدَّد" }
  MC-P14-037: { en: "Cover every answer, with \"Other\" when needed", ar: "غطِّ كل الإجابات، وأضف «أخرى» عند الحاجة" }
  MC-P14-038: { en: "Match the control to when the change happens", ar: "اختر العنصر بحسب وقت حدوث التغيير" }
  MC-P14-039: { en: "Make the label tappable, not only the box", ar: "اجعل الاسم قابلًا للضغط، لا المربع وحده" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Shahd's freelance app", ar: "تطبيق العمل الحر لشهد" }
    body:
      en: "Shahd designs the sign-up for a freelance jobs app. One screen asks people for their main field of work.\n\nThe team listed the three fields with the most members today."
      ar: "تصمّم شهد صفحات التسجيل في تطبيق لوظائف العمل الحر. وتسأل إحدى الشاشات الناس عن مجال عملهم الأساسي.\n\nووضع الفريق المجالات الثلاثة التي فيها أكبر عدد من الأعضاء اليوم."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Your main field", ar: "مجال عملك الأساسي" } }
        - { kind: radio, text: { en: "Design", ar: "تصميم" }, selected: true, gap: s }
        - { kind: radio, text: { en: "Programming", ar: "برمجة" } }
        - { kind: radio, text: { en: "Marketing", ar: "تسويق" } }
        - { kind: button, text: { en: "Next", ar: "التالي" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U04-03
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Checkboxes vs. radio buttons (NN/g): radio buttons require exactly one choice, so the options must be comprehensive. If that's impossible, offer \"Other\" with a type-in field."
      ar: "جرّب أولًا. الـ Checkboxes مقابل الـ Radio buttons (NN/g): الـ Radio buttons تحتاج إلى اختيار واحد بالضبط، فيجب أن تغطي الاختيارات كل الإجابات. وإن كان هذا مستحيلًا، فأضف «أخرى» مع خانة للكتابة."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "If it's impossible to be comprehensive, offer a button labeled \"Other,\" supplemented by a type-in field." }
    prompt:
      en: "Mona, a translator, is signing up. Try each version. Which one should ship?"
      ar: "منى مترجمة، وتسجّل الآن في التطبيق. جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: three
    options:
      - id: three
        text: { en: "The three biggest fields", ar: "المجالات الثلاثة الأكبر" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your main field", ar: "مجال عملك الأساسي" } }
            - { kind: radio, text: { en: "Design", ar: "تصميم" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Programming", ar: "برمجة" } }
            - { kind: radio, text: { en: "Marketing", ar: "تسويق" } }
      - id: long
        text: { en: "A longer list of ten fields", ar: "قائمة أطول فيها عشرة مجالات" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your main field", ar: "مجال عملك الأساسي" } }
            - { kind: radio, text: { en: "Design", ar: "تصميم" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Programming", ar: "برمجة" } }
            - { kind: radio, text: { en: "Marketing", ar: "تسويق" } }
            - { kind: radio, text: { en: "Writing", ar: "كتابة" } }
            - { kind: radio, text: { en: "Video editing", ar: "مونتاج فيديو" } }
            - { kind: radio, text: { en: "Accounting", ar: "محاسبة" } }
            - { kind: radio, text: { en: "Data entry", ar: "إدخال بيانات" } }
            - { kind: radio, text: { en: "Voice-over", ar: "تعليق صوتي" } }
            - { kind: radio, text: { en: "Photography", ar: "تصوير" } }
            - { kind: radio, text: { en: "Customer support", ar: "خدمة عملاء" } }
      - id: other
        text: { en: "The three fields, plus \"Other\" with a box to type in", ar: "المجالات الثلاثة، ومعها «أخرى» وخانة للكتابة" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Your main field", ar: "مجال عملك الأساسي" } }
            - { kind: radio, text: { en: "Design", ar: "تصميم" }, gap: s }
            - { kind: radio, text: { en: "Programming", ar: "برمجة" } }
            - { kind: radio, text: { en: "Marketing", ar: "تسويق" } }
            - { kind: radio, text: { en: "Other", ar: "أخرى" }, selected: true }
            - { kind: field, text: { en: "Translation", ar: "ترجمة" }, filled: true, gap: xs }
    answer: [other]
    misconceptions:
      - id: MC-P14-037
        when: [three]
        feedback:
          en: "Mona has no true answer here. She'll pick the closest wrong field, so clients looking for translators never find her, or she'll give up."
          ar: "لا توجد إجابة صحيحة لمنى هنا. فستختار أقرب مجال خطأ، فلا يجدها العملاء الذين يبحثون عن مترجمين، أو ستتوقّف عن التسجيل."
      - id: MC-P14-037
        when: [long]
        feedback:
          en: "Ten fields still miss translation, and everyone now reads a long list. A longer list never covers everyone; \"Other\" does."
          ar: "عشرة مجالات ما زالت لا تشمل الترجمة، وأصبح الجميع يقرأ قائمة طويلة. فالقائمة الأطول لا تغطي الجميع أبدًا؛ أما «أخرى» فتغطيهم."
    hints:
      - en: "Can Mona give a true answer in each version?"
        ar: "هل تستطيع منى أن تعطي إجابة صحيحة في كل نسخة؟"
    correct:
      en: "Add \"Other\" with a box to type in."
      ar: "أضف «أخرى» مع خانة للكتابة."
    explain:
      en: "The common fields stay one tap away, and anyone else can say exactly what they do. The team also learns which fields to add next."
      ar: "تبقى المجالات الشائعة على بُعد ضغطة واحدة، ويستطيع أي شخص آخر أن يكتب ما يعمله بالضبط. ويعرف الفريق أيضًا أي مجالات يضيفها لاحقًا."

  - id: S03
    type: card
    part: concept
    icons: [radio, ok, other, warn, pick]
    video:
      src: clips/P14-C11.mp4
      captions: { ar: P14-C11.ar.vtt, en: P14-C11.en.vtt }
      who: { en: "Eyad Mahmoud, UX designer · UXGate", ar: "إياد محمود، مصمم UX · UXGate" }
      transcript:
        en: "(Transcript is added when the clip is cut.)"
        ar: "(يُضاف نص الفيديو بعد قصّ المقطع.)"
    title: { en: "Choices that work for everyone", ar: "اختيارات تناسب الجميع" }
    body:
      en: "A radio button set asks for exactly one answer, so it has to have one for everybody.\n\n- **Few options? Show them** as radio buttons rather than a dropdown, so people can see and compare every choice.\n- **Start with one selected.** Once picked, a radio button can't be cleared. If not answering is valid, add a choice like \"None\" or \"No preference\".\n- **Cover every answer.** If you can't list them all, add \"Other\" with a box to type in. Don't nest radio buttons under other radio buttons.\n- **Settings, not actions.** Ticking a box or picking a radio button changes a setting. A button makes something happen.\n- **The whole row is the target:** people can tap the circle or box, or its label."
      ar: "مجموعة الـ Radio buttons تطلب إجابة واحدة بالضبط، فيجب أن يكون فيها إجابة لكل شخص.\n\n- **الاختيارات قليلة؟ اعرضها** كـ Radio buttons بدلًا من Dropdown، حتى يرى الناس كل الاختيارات ويقارنوا بينها.\n- **ابدأ باختيار محدَّد.** فبعد الاختيار، لا يمكن إلغاء الـ Radio button. وإن كان عدم الإجابة مقبولًا، فأضف اختيارًا مثل «لا شيء» أو «لا يهم».\n- **غطِّ كل الإجابات.** وإن لم تستطع ذكرها كلها، فأضف «أخرى» مع خانة للكتابة. ولا تضع Radio buttons داخل Radio buttons أخرى.\n- **إعدادات، لا أفعال.** اختيار Checkbox أو Radio button يغيّر إعدادًا. أما الزر فهو الذي يجعل شيئًا يحدث.\n- **السطر كله قابل للضغط:** يستطيع الناس الضغط على الدائرة أو المربع، أو على الاسم."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U04-03
    rules: [R06, R15]
    value:
      en: "Radio buttons (NN/g): you cannot click or tap a selected radio button to deselect it. Checkboxes vs. radio buttons (NN/g): when people may not want to choose, provide a radio button for it, such as one labelled \"None\", and start there."
      ar: "الـ Radio buttons (NN/g): لا يمكن الضغط على Radio button محدَّد لإلغاء اختياره. والـ Checkboxes مقابل الـ Radio buttons (NN/g): حين قد لا يريد الناس الاختيار، أضف Radio button لذلك، مثل «لا شيء»، وابدأ به."
    ref: { url: "https://www.nngroup.com/articles/radio-buttons-default-selection/", quote: "But you cannot click or tap a selected radio button to deselect it." }
    scenario:
      en: "On their profile, freelancers can say when clients may call them: in the morning or in the evening. Many freelancers don't mind when."
      ar: "في الملف الشخصي، يستطيع المستقلّون أن يحددوا متى يتصل بهم العملاء: صباحًا أو مساءً. وكثير منهم لا يهمّهم الوقت."
    prompt:
      en: "Try each version, and try to clear a choice after picking it. Which one should ship?"
      ar: "جرّب كل نسخة، وحاول إلغاء الاختيار بعد أن تختاره. أيّها يجب أن تُطلق؟"
    start: empty
    options:
      - id: empty
        text: { en: "Morning and Evening, nothing selected", ar: "صباحًا ومساءً، دون اختيار محدَّد" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Best time for calls", ar: "أفضل وقت للمكالمات" } }
            - { kind: radio, text: { en: "Morning", ar: "صباحًا" }, gap: s }
            - { kind: radio, text: { en: "Evening", ar: "مساءً" } }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }
      - id: morning
        text: { en: "Morning and Evening, Morning selected", ar: "صباحًا ومساءً، و«صباحًا» محدَّد" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Best time for calls", ar: "أفضل وقت للمكالمات" } }
            - { kind: radio, text: { en: "Morning", ar: "صباحًا" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Evening", ar: "مساءً" } }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }
      - id: any
        text: { en: "Add \"Any time\", selected", ar: "أضف «أي وقت»، وهو محدَّد" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Best time for calls", ar: "أفضل وقت للمكالمات" } }
            - { kind: radio, text: { en: "Any time", ar: "أي وقت" }, selected: true, gap: s }
            - { kind: radio, text: { en: "Morning", ar: "صباحًا" } }
            - { kind: radio, text: { en: "Evening", ar: "مساءً" } }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }
    answer: [any]
    misconceptions:
      - id: MC-P14-036
        when: [empty]
        feedback:
          en: "Pick Morning, then try to clear it: you can't. Freelancers who don't mind are pushed into a time they didn't mean, or leave the profile half done."
          ar: "اختر «صباحًا» ثم حاول إلغاءه: لا تستطيع. فالمستقلّ الذي لا يهمّه الوقت يُجبَر على وقت لم يقصده، أو يترك الملف ناقصًا."
      - id: MC-P14-036
        when: [morning]
        feedback:
          en: "Most people keep the default. Freelancers who don't mind will look like morning-only, and evening clients will skip them."
          ar: "أغلب الناس يُبقون الاختيار الافتراضي. فالمستقلّون الذين لا يهمّهم الوقت سيبدون كأنهم متاحون صباحًا فقط، وسيتجاهلهم عملاء المساء."
    hints:
      - en: "Where does a freelancer who doesn't mind belong in each version?"
        ar: "أين مكان المستقلّ الذي لا يهمّه الوقت في كل نسخة؟"
    correct:
      en: "Give \"don't mind\" its own choice, and start there."
      ar: "اجعل «لا يهم» اختيارًا مستقلًا، وابدأ به."
    explain:
      en: "\"Any time\" is a true answer for many people and a safe start for everyone. Anyone with a real preference changes it in one tap."
      ar: "«أي وقت» إجابة صحيحة لكثير من الناس، وبداية آمنة للجميع. ومن عنده تفضيل حقيقي يغيّره بضغطة واحدة."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U04-04
    rules: [R06, R15]
    confidence: true
    value:
      en: "Checkboxes vs. radio buttons (NN/g): use checkboxes and radio buttons only to change settings, not as action buttons that make something happen. Deleting is an action, so it needs a button."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): استخدم الـ Checkboxes والـ Radio buttons لتغيير الإعدادات فقط، لا كأزرار تجعل شيئًا يحدث. والحذف فعل، فيحتاج إلى زر."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "Use checkboxes and radio buttons only to change settings, not as action buttons that make something happen." }
    scenario:
      en: "Freelancers write proposals to clients, and the app keeps unsent proposals as drafts. Shahd needs a way to delete a draft from its screen."
      ar: "يكتب المستقلّون عروضًا للعملاء، ويحفظ التطبيق العروض التي لم تُرسل كمسوّدات. وتحتاج شهد إلى طريقة لحذف المسوّدة من شاشتها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: check
    options:
      - id: check
        text: { en: "A checkbox that deletes the draft as soon as it's ticked", ar: "Checkbox يحذف المسوّدة بمجرد اختياره" }
        mock:
          width: 300
          caption: { en: "Ticking deletes at once", ar: "الاختيار يحذف فورًا" }
          blocks:
            - { kind: heading, text: { en: "Draft: Logo for a café", ar: "مسوّدة: شعار لمقهى" } }
            - { kind: text, text: { en: "Hello, I'd love to design your logo…", ar: "مرحبًا، يسعدني تصميم شعاركم…" }, tone: faint, gap: s }
            - { kind: check, text: { en: "Delete this draft", ar: "احذف هذه المسوّدة" }, gap: m }
            - { kind: button, text: { en: "Send proposal", ar: "أرسل العرض" }, gap: m }
      - id: button
        text: { en: "A \"Delete draft\" button", ar: "زر «احذف المسوّدة»" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Draft: Logo for a café", ar: "مسوّدة: شعار لمقهى" } }
            - { kind: text, text: { en: "Hello, I'd love to design your logo…", ar: "مرحبًا، يسعدني تصميم شعاركم…" }, tone: faint, gap: s }
            - { kind: button, text: { en: "Send proposal", ar: "أرسل العرض" }, gap: m }
            - { kind: button, style: dangerlink, text: { en: "Delete draft", ar: "احذف المسوّدة" }, gap: s }
      - id: radio
        text: { en: "Radio buttons, Keep or Delete, that act as soon as one is picked", ar: "Radio buttons، «احتفظ» أو «احذف»، تعمل بمجرد اختيار أحدها" }
        mock:
          width: 300
          caption: { en: "Picking Delete deletes at once", ar: "اختيار «احذف» يحذف فورًا" }
          blocks:
            - { kind: heading, text: { en: "Draft: Logo for a café", ar: "مسوّدة: شعار لمقهى" } }
            - { kind: text, text: { en: "Hello, I'd love to design your logo…", ar: "مرحبًا، يسعدني تصميم شعاركم…" }, tone: faint, gap: s }
            - { kind: radio, text: { en: "Keep draft", ar: "احتفظ بالمسوّدة" }, selected: true, gap: m }
            - { kind: radio, text: { en: "Delete draft", ar: "احذف المسوّدة" } }
            - { kind: button, text: { en: "Send proposal", ar: "أرسل العرض" }, gap: m }
    answer: [button]
    misconceptions:
      - id: MC-P14-038
        when: [check, radio]
        feedback:
          en: "Checkboxes and radio buttons look like settings that wait for a button, so people tap them freely to see what they do. Here one tap destroys a proposal before anyone confirms."
          ar: "الـ Checkboxes والـ Radio buttons تبدو كإعدادات تنتظر زرًا، فيضغط الناس عليها بحرية ليروا ماذا تفعل. وهنا ضغطة واحدة تحذف عرضًا قبل أن يؤكّد أحد."
    hints:
      - en: "Is deleting a setting you choose, or something that happens?"
        ar: "هل الحذف إعداد تختاره، أم شيء يحدث؟"
    correct:
      en: "An action: a button."
      ar: "فعل: زر."
    explain:
      en: "A button says \"press me and it happens\", which is exactly what deleting is. The checkboxes and radio buttons stay free for real settings."
      ar: "الزر يقول «اضغطني ويحدث الأمر»، وهذا بالضبط ما هو الحذف. وتبقى الـ Checkboxes والـ Radio buttons للإعدادات الحقيقية."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U04-01
    rules: [R11]
    value:
      en: "Checkboxes vs. radio buttons (NN/g): let users select an option by clicking on either the box itself or its label. Checkboxes (NN/g): don't force users to tap a too-small box."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): اسمح للناس باختيار الخيار بالضغط على المربع نفسه أو على اسمه. والـ Checkboxes (NN/g): لا تجبر الناس على الضغط على مربع صغير جدًا."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "Let users select an option by clicking on either the button/box itself or its label" }
    scenario:
      en: "Freelancers pick which job types to get alerts for. Shahd's team built two versions of the list."
      ar: "يختار المستقلّون أنواع الوظائف التي تصلهم تنبيهات عنها. وبنى فريق شهد نسختين من القائمة."
    prompt:
      en: "Tap the words in each version, not the boxes. Which version should ship?"
      ar: "اضغط على الكلمات في كل نسخة، لا على المربعات. أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A", ar: "النسخة A" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Alert me about", ar: "نبّهني عن" } }
          - { kind: check, hit: box, text: { en: "Full-time jobs", ar: "وظائف بدوام كامل" }, gap: s }
          - { kind: check, hit: box, text: { en: "Part-time jobs", ar: "وظائف بدوام جزئي" } }
          - { kind: check, hit: box, text: { en: "One-off projects", ar: "مشروعات لمرة واحدة" } }
    b:
      label: { en: "Version B", ar: "النسخة B" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Alert me about", ar: "نبّهني عن" } }
          - { kind: check, text: { en: "Full-time jobs", ar: "وظائف بدوام كامل" }, gap: s }
          - { kind: check, text: { en: "Part-time jobs", ar: "وظائف بدوام جزئي" } }
          - { kind: check, text: { en: "One-off projects", ar: "مشروعات لمرة واحدة" } }
    answer: b
    misconceptions:
      - id: MC-P14-039
        when: [a]
        feedback:
          en: "In A only the small box responds. People tap the words, nothing happens, and they tap again or think it's broken. On a phone, a 20-pixel box is a hard target."
          ar: "في A يستجيب المربع الصغير وحده. فيضغط الناس على الكلمات، ولا يحدث شيء، فيضغطون مرة أخرى أو يظنون أن التطبيق معطّل. وعلى الموبايل، مربع حجمه 20 بكسل هدف صعب."
    correct:
      en: "B: the whole row is tappable."
      ar: "B: السطر كله قابل للضغط."
    explain:
      en: "In B the box and its words make one big target, so a quick tap anywhere on the line works, also for people with shaky hands or large fingers."
      ar: "في B يشكّل المربع وكلماته هدفًا واحدًا كبيرًا، فتنجح ضغطة سريعة في أي مكان على السطر، حتى لمن يده غير ثابتة أو أصابعه كبيرة."

  - id: S07
    type: tune
    part: independent
    skill: SK-P14-U04-03
    rules: [R14]
    value:
      en: "Checkboxes vs. radio buttons (NN/g): make sure the options are both comprehensive and clearly distinct. People book visits for many relatives and friends, so a short list of relations always misses someone."
      ar: "الـ Checkboxes مقابل الـ Radio buttons (NN/g): تأكّد أن الاختيارات تغطي كل الإجابات ومختلفة بوضوح عن بعضها. والناس يحجزون زيارات لكثير من الأقارب والأصدقاء، فقائمة قصيرة من صلات القرابة تنسى أحدًا دائمًا."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-vs-radio-buttons/", quote: "Because radio buttons require exactly one choice, make sure that the options are both comprehensive and clearly distinct" }
    scenario:
      en: "Adel designs a clinic booking app. Before picking a time, people answer one question: who is this visit for? Nesma wants to book for her grandmother."
      ar: "يصمّم عادل تطبيقًا لحجز مواعيد عيادة. وقبل اختيار الوقت، يجيب الناس عن سؤال واحد: لمن هذه الزيارة؟ ونسمة تريد الحجز لجدّتها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: two
    options:
      - id: two
        text: { en: "Me, or my child", ar: "لي، أو لطفلي" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Who is this visit for?", ar: "لمن هذه الزيارة؟" } }
            - { kind: radio, text: { en: "Me", ar: "لي" }, selected: true, gap: s }
            - { kind: radio, text: { en: "My child", ar: "لطفلي" } }
      - id: family
        text: { en: "Me, my child, my husband or wife, my parent", ar: "لي، لطفلي، لزوجي أو زوجتي، لأحد والديّ" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Who is this visit for?", ar: "لمن هذه الزيارة؟" } }
            - { kind: radio, text: { en: "Me", ar: "لي" }, selected: true, gap: s }
            - { kind: radio, text: { en: "My child", ar: "لطفلي" } }
            - { kind: radio, text: { en: "My husband or wife", ar: "لزوجي أو زوجتي" } }
            - { kind: radio, text: { en: "My parent", ar: "لأحد والديّ" } }
      - id: else
        text: { en: "Me, my child, or someone else, with a box for their name", ar: "لي، لطفلي، أو لشخص آخر، مع خانة لاسمه" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Who is this visit for?", ar: "لمن هذه الزيارة؟" } }
            - { kind: radio, text: { en: "Me", ar: "لي" }, gap: s }
            - { kind: radio, text: { en: "My child", ar: "لطفلي" } }
            - { kind: radio, text: { en: "Someone else", ar: "لشخص آخر" }, selected: true }
            - { kind: field, label: { en: "Their full name", ar: "اسمه بالكامل" }, text: { en: "Fatma Hassan", ar: "فاطمة حسن" }, filled: true, gap: s }
    answer: [else]
    misconceptions:
      - id: MC-P14-037
        when: [two, family]
        feedback:
          en: "Nesma's grandmother isn't on the list. She has to pick a wrong relation, and the clinic records the wrong patient, or she calls instead."
          ar: "جدّة نسمة ليست في القائمة. فستضطر إلى اختيار صلة قرابة خطأ، فتسجّل العيادة مريضًا خطأ، أو ستتصل بالهاتف بدلًا من ذلك."
    correct:
      en: "\"Someone else\", with their name."
      ar: "«لشخص آخر»، مع اسمه."
    explain:
      en: "Two common answers stay one tap away, and \"someone else\" covers grandmothers, friends and neighbours, with the name the clinic actually needs."
      ar: "تبقى الإجابتان الشائعتان على بُعد ضغطة واحدة، و«لشخص آخر» تشمل الجدّات والأصدقاء والجيران، مع الاسم الذي تحتاجه العيادة فعلًا."

  - id: S08
    type: card
    part: recap
    icons: [other, ok, pick, eye]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Cover every answer:** add \"Other\" or \"Someone else\" with a box, instead of a longer list.\n- **Start with one selected**, and give \"don't mind\" its own choice.\n- **Settings, not actions:** deleting and sending belong on buttons.\n- **The whole row is the target**, words included.\n\nNext: toggles, the control that acts the moment you flip it."
      ar: "- **غطِّ كل الإجابات:** أضف «أخرى» أو «لشخص آخر» مع خانة، بدلًا من قائمة أطول.\n- **ابدأ باختيار محدَّد**، واجعل «لا يهم» اختيارًا مستقلًا.\n- **إعدادات، لا أفعال:** الحذف والإرسال مكانهما الأزرار.\n- **السطر كله هدف للضغط**، والكلمات أيضًا.\n\nالتالي: الـ Toggle، العنصر الذي يعمل لحظة الضغط عليه."
