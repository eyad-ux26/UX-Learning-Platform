id: P14-U06-L03
mode: lesson
minutes: 8
title:
  en: "A date input for every date"
  ar: "طريقة إدخال مناسبة لكل تاريخ"
speaker: sara
sources:
  - title: { en: "Date-Input Form Fields: UX Design Guidelines (NN/g)", ar: "حقول إدخال التاريخ: إرشادات التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/date-input/"
review_labels:
  MC-P14-065: { en: "Calendars fit near dates; type far, known dates", ar: "التقويم للتواريخ القريبة؛ واكتب التواريخ البعيدة المعروفة" }
  MC-P14-066: { en: "Day/month/year drop-downs add many steps", ar: "الـ Dropdowns لليوم والشهر والسنة تضيف خطوات كثيرة" }
  MC-P14-067: { en: "Scrolling pickers fit near dates and times only", ar: "الـ Scrolling picker يناسب التواريخ القريبة والأوقات فقط" }
  MC-P14-068: { en: "Show a date range on a calendar, two months side by side", ar: "اعرض الفترة على تقويم، بشهرين جنبًا إلى جنب" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Sara's hotel bookings", ar: "سارة وحجوزات الفندق" }
    body:
      en: "I'm designing the booking site of a beach hotel. Guests pick their stay, often over a weekend or a holiday that crosses into the next month. To create an account, they also give their date of birth.\n\nThe site has three kinds of dates, and each may need a different input."
      ar: "أصمّم موقع الحجز لفندق على البحر. يختار النزلاء فترة إقامتهم، غالبًا في عطلة نهاية أسبوع أو إجازة تمتد إلى الشهر التالي. ولإنشاء حساب، يذكرون أيضًا تاريخ ميلادهم.\n\nفي الموقع ثلاثة أنواع من التواريخ، وقد يحتاج كل نوع إلى طريقة إدخال مختلفة."
    mock:
      app: nuzul
      appbar: {"title": {"en": "Book your stay", "ar": "احجز إقامتك"}, "back": true}
      blocks:
        - {"kind": "listitem", "art": "beach", "text": {"en": "Coral Bay Resort · Hurghada", "ar": "منتجع كورال باي · الغردقة"}, "sub": {"en": "★ 4.7 · Beach front", "ar": "★ 4.7 · على البحر"}}
        - {"kind": "select", "label": {"en": "Check-in and check-out", "ar": "الوصول والمغادرة"}, "text": {"en": "Choose dates", "ar": "اختر التواريخ"}}
        - {"kind": "stepper", "label": {"en": "Guests", "ar": "النزلاء"}, "text": "2", "min": 1, "max": 6}
      footer:
        - {"kind": "button", "text": {"en": "See rooms", "ar": "اعرض الغرف"}}

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U06-04
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Date input (NN/g): calendar pickers are especially useful for selecting a date range. In those situations, they often display two months side by side."
      ar: "جرّب أولًا. إدخال التاريخ (NN/g): التقويم مفيد بشكل خاص لاختيار فترة بين تاريخين. وفي هذه الحالات، يعرض غالبًا شهرين جنبًا إلى جنب."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Calendar pickers are especially useful for selecting a date range." }
    prompt:
      en: "A guest wants the New Year's week, from Monday 28 December to Sunday 3 January. Try each version. Which one should ship?"
      ar: "يريد أحد النزلاء أسبوع رأس السنة، من الإثنين 28 ديسمبر إلى الأحد 3 يناير. جرّب كل نسخة. أيّ نسخة تسمح له باختيار إقامته ورؤيتها كاملة بأقل خطوات؟"
    start: drop
    options:
      - id: drop
        text: { en: "Day, month and year drop-downs, twice", ar: "Dropdowns لليوم والشهر والسنة، مرتين" }
        mock:
          app: nuzul
          appbar: {"title": {"en": "Book your stay", "ar": "احجز إقامتك"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "beach", "text": {"en": "Coral Bay Resort · Hurghada", "ar": "منتجع كورال باي · الغردقة"}, "sub": {"en": "2 guests", "ar": "نزيلان"}}
            - {"kind": "small", "text": {"en": "Check-in", "ar": "الوصول"}}
            - {"kind": "row", "blocks": [{"kind": "select", "text": {"en": "Day", "ar": "اليوم"}}, {"kind": "select", "text": {"en": "Month", "ar": "الشهر"}}, {"kind": "select", "text": {"en": "Year", "ar": "السنة"}}]}
            - {"kind": "small", "text": {"en": "Check-out", "ar": "المغادرة"}, "gap": "s"}
            - {"kind": "row", "blocks": [{"kind": "select", "text": {"en": "Day", "ar": "اليوم"}}, {"kind": "select", "text": {"en": "Month", "ar": "الشهر"}}, {"kind": "select", "text": {"en": "Year", "ar": "السنة"}}]}
          footer:
            - {"kind": "button", "text": {"en": "See rooms", "ar": "اعرض الغرف"}}
      - id: typed
        text: { en: "Two fields to type the dates", ar: "حقلان لكتابة التاريخين" }
        mock:
          app: nuzul
          appbar: {"title": {"en": "Book your stay", "ar": "احجز إقامتك"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "beach", "text": {"en": "Coral Bay Resort · Hurghada", "ar": "منتجع كورال باي · الغردقة"}, "sub": {"en": "2 guests", "ar": "نزيلان"}}
            - {"kind": "field", "label": {"en": "Check-in", "ar": "الوصول"}, "hint": {"en": "DD/MM/YYYY", "ar": "يوم/شهر/سنة"}, "hintFirst": true, "text": ""}
            - {"kind": "field", "label": {"en": "Check-out", "ar": "المغادرة"}, "hint": {"en": "DD/MM/YYYY", "ar": "يوم/شهر/سنة"}, "hintFirst": true, "text": ""}
          footer:
            - {"kind": "button", "text": {"en": "See rooms", "ar": "اعرض الغرف"}}
      - id: calendar
        text: { en: "A calendar showing two months, the stay as a range", ar: "تقويم يعرض شهرين، والإقامة فترة واحدة" }
        mock:
          app: nuzul
          appbar: {"title": {"en": "Book your stay", "ar": "احجز إقامتك"}, "back": true}
          blocks:
            - {"kind": "listitem", "art": "beach", "text": {"en": "Coral Bay Resort · Hurghada", "ar": "منتجع كورال باي · الغردقة"}, "sub": {"en": "2 guests", "ar": "نزيلان"}}
            - {"kind": "calendar", "months": [{"title": {"en": "December 2026", "ar": "ديسمبر 2026"}, "start": 2, "days": 31}, {"title": {"en": "January 2027", "ar": "يناير 2027"}, "start": 5, "days": 31}], "from": [0, 28], "to": [1, 3], "text": {"en": "Mon 28 Dec – Sun 3 Jan · 6 nights", "ar": "من الإثنين 28 ديسمبر إلى الأحد 3 يناير · 6 ليالٍ"}}
          footer:
            - {"kind": "button", "text": {"en": "See rooms", "ar": "اعرض الغرف"}}
    answer: [calendar]
    misconceptions:
      - id: MC-P14-066
        when: [drop]
        feedback:
          en: "Six drop-downs: open, scroll and pick, six times. And nothing shows that the 28th is a Monday or that the stay is six nights."
          ar: "ستة Dropdowns: فتح ثم تمرير ثم اختيار، ست مرات. ولا شيء يوضّح أن يوم 28 هو الإثنين، أو أن الإقامة ست ليالٍ."
      - id: MC-P14-068
        when: [typed]
        feedback:
          en: "Typing is quick, but people plan holidays by weekdays: \"Monday to Sunday\". Here they must work out the dates elsewhere, then check the range in their head."
          ar: "الكتابة سريعة، لكن الناس يخططون للإجازات بأيام الأسبوع: «من الإثنين إلى الأحد». وهنا عليهم أن يعرفوا التواريخ من مكان آخر، ثم يراجعوا الفترة في أذهانهم."
    hints:
      - en: "The guest thinks \"Monday to Sunday, across New Year\". Which version shows that?"
        ar: "النزيل يفكّر «من الإثنين إلى الأحد، مرورًا برأس السنة». أيّ نسخة توضّح ذلك؟"
    correct:
      en: "A two-month calendar with the range."
      ar: "تقويم بشهرين مع الفترة."
    explain:
      en: "Two taps choose the stay, and the guest sees the weekdays, the whole range across both months, and the number of nights at once."
      ar: "ضغطتان تكفيان لاختيار الإقامة، ويرى النزيل أيام الأسبوع، والفترة كاملة عبر الشهرين، وعدد الليالي مرة واحدة."

  - id: S09
    type: video
    part: concept
    title: { en: "Date inputs", ar: "طرق إدخال التاريخ" }
    video: a19a0530-65b0-436c-977a-6430ae5d3592
    duration: 211
    transcript:
      - { t: 2.5, en: "The last pattern, or topic, under input controls is the date input. Date input covers more than one pattern, and", ar: "الـ Pattern أو العنوان الأخير اللي معانا تحت الـ Input controls هو الـ Date input. الـ Date input تحته أكتر من" }
      - { t: 10.75, en: "we can use any of them depending on what exactly I need, to let the user enter the date they want.", ar: "Pattern، ممكن نستخدم أي واحد فيهم على حسب أنا محتاج أعمل إيه بالضبط، عشان أخلّي اليوزر يدخل التاريخ اللي هو عايزه." }
      - { t: 19.0, en: "If we look at the patterns under date input, the first is calendar pickers. We've almost all used a calendar picker: it shows me a calendar", ar: "لو بدأنا نشوف الـ Patterns اللي تحت الـ Date input، هنلاقي أول حاجة الـ Calendar pickers. الـ Calendar picker تقريبًا كلنا استخدمناه: فكرته إنه بيظهر لي" }
      - { t: 28.68, en: "of a given month, and I choose the day from that month. Of course it suits picking a date close to today very well. And if I", ar: "Calendar بيوضّح لي شهر معين، وأبدأ أختار اليوم من الشهر ده. وطبعًا مناسب جدًا لو باختار تاريخ قريب من التاريخ اللي أنا فيه حاليًا. وبرضه لو عامل" }
      - { t: 38.35, en: "add a dropdown, or any other pattern or component that lets me change the year easily, it can suit even going back years or forward years,", ar: "مثلًا Drop down، أو أي نوع من الـ Patterns أو الـ Components التانية اللي بتخلّيني أغيّر السنة بسهولة، فممكن يكون مناسب حتى لو عايز أرجع سنين" }
      - { t: 48.02, en: "so it's easy to pick something in the year range I need. Calendar pickers are among the most frequently used patterns, and we've probably all used them.", ar: "قديمة أو أقدّم سنين قدام، فيكون سهل إني أختار حاجة في Range السنة اللي محتاجها. فالـ Calendar pickers من الـ Patterns المستخدمة بشكل متكرر، وغالبًا كلنا استخدمناها." }
      - { t: 57.7, en: "They're also very well suited to choosing a date range. If I want to choose a specific range, the best thing to use is pretty much a calendar picker. I can show two months, like this example,", ar: "ومناسبة جدًا جدًا برضه لو عايز أختار Date range. لو عايز أختار Range معين، أفضل حاجة ممكن نستخدمها تقريبًا هي الـ Calendar picker. ممكن أوضّح شهرين، زي المثال اللي قدامنا،" }
      - { t: 68.4, en: "as on most sites that need the user to enter a range of dates: two months appear side by side like this, so if they choose a date or range from the end of the first month into", ar: "واللي موجود في أغلب المواقع اللي محتاجة إن اليوزر يدخل فيها Range من التواريخ: يظهر قدامه شهرين بالشكل ده، عشان لو بدأ يختار تاريخ أو Range من آخر الشهر الأول" }
      - { t: 79.1, en: "the second, say the start of the second month, both show in front of them. The range is marked on the calendar, so they see it clearly. It's one of the best patterns for this case in particular.", ar: "لغاية الشهر التاني، مثلًا بداية الشهر التاني، يظهروا قدامه. والـ Range ده متحدد على الـ Calendar، فيبقى شايفه واضح. فهو من أفضل الـ Patterns اللي تُستخدم في الحالة دي تحديدًا." }
      - { t: 89.8, en: "The second pattern in date inputs is scrolling date pickers: I scroll until I reach the date I want, there may be several columns side by side, and they can include a time", ar: "الـ Pattern التاني في الـ Date inputs هو الـ Scrolling date pickers: إني بعمل Scroll لغاية ما أوصل للتاريخ اللي عايزه، وممكن يكون في أكتر من" }
      - { t: 101.56, en: "too if I want to enter one. Of course I won't use it, especially if I want to go to a far date, long ago or far ahead. I can use it to", ar: "عمود جنب بعض، وممكن يكون معاهم كمان وقت لو عايز أدخل وقت معين. وطبعًا مش هستخدمه خصوصًا لو عايز أروح لتاريخ بعيد، تاريخ قديم أو قدام جدًا." }
      - { t: 113.32, en: "pick a near date, or to control the time: the time is all 24 hours, so I control the hours and minutes. But I won't go back months with a scrolling date picker;", ar: "ممكن أستخدمه عشان أختار تاريخ قريب، أو لو عايز أتحكم في الوقت، والوقت كله 24 ساعة، فهتحكم في الساعات والدقايق. لكن مش هرجع مثلًا شهور بالـ" }
      - { t: 125.08, en: "it won't be the most suitable, since I really move through a small range of dates. And if I'm choosing more than one date, a scrolling date picker may not be the best", ar: "Scrolling date pickers، مش هتكون أنسب حاجة: فعلًا هتحرك في Range قليل من التواريخ. وبرضه لو هختار أكتر من تاريخ، الـ Scrolling date pickers ممكن يكون مش" }
      - { t: 136.84, en: "choice: the space can be small, and it won't be productive or help me choose quickly. I can let users simply type the date, and typing can be faster and better in that case.", ar: "أفضل اختيار: المساحة ممكن تكون صغيرة، ومش هيكون Productive ولا هيساعدني أختار بسرعة. ممكن أخلّي اليوزرز يكتبوا التاريخ أصلًا، والكتابة ممكن تكون أسرع وأفضل في الحالة دي." }
      - { t: 148.6, en: "The next pattern under date inputs is using dropdowns to choose the year, day and month. This pattern has a problem: it raises the interaction cost. I open the", ar: "الـ Pattern اللي بعد كده تحت الـ Date inputs إني أستخدم Drop down أختار بيه السنة واليوم والشهر. الـ Pattern ده فيه مشكلة إني هزوّد الـ Interaction cost:" }
      - { t: 157.9, en: "dropdown, maybe scroll inside it and choose the month, open another dropdown, scroll and choose the day, open and choose the year, and so on. So I have a", ar: "هبدأ أفتح الـ Drop down، ممكن أعمل Scroll جوه الـ Drop down وأختار الشهر، وأفتح Drop down تاني وأعمل Scroll وأختار اليوم، وأفتح وأختار السنة، وهكذا. فهنا عندي" }
      - { t: 167.2, en: "bit more interaction cost to choose a single date, and it's generally never one of the preferred patterns for choosing a date. The patterns we covered before can be better.", ar: "Interaction cost أكتر شوية عشان أختار تاريخ واحد، فهو دايمًا مش من الـ Patterns المفضلة في اختيار التاريخ عمومًا. الـ Patterns اللي قلناها قبل كده ممكن تكون أفضل." }
      - { t: 176.5, en: "The last pattern is typing: I type the date. As long as I show the user where to type the day, where the month goes and where the year goes. I can move the user straight to the month as", ar: "والـ Pattern الأخير معانا هو الـ Typing: إني أكتب التاريخ. بمجرد ما أوضّح لليوزر هو يكتب اليوم فين والشهر فين والسنة فين. ممكن أخلّي اليوزر أول" }
      - { t: 185.95, en: "soon as they type the day, then to the year, or they type the month, it moves them to the day and then the year, and so on. When they type the month, for example, the slash appears and takes them", ar: "ما يكتب اليوم ينقله مباشرة للشهر، وبعدين للسنة، أو يكتب الشهر فينقله لليوم وبعدين للسنة، وهكذا. لما يكتب الشهر مثلًا، الشَّرطة تترسم وتوديه لليوم، ولما يكتب" }
      - { t: 195.39, en: "to the day, and when they type the day it takes them to the year, so they understand exactly where they're typing. Then typing is one of the easiest kinds of input we can use to let someone enter a date.", ar: "اليوم توديه للسنة، فيبقى فاهم هو بيكتب فين بالضبط. وساعتها يكون الـ Typing من أسهل أنواع الـ Inputs اللي ممكن نستخدمها عشان نخلّي المستخدم يدخل تاريخ معين." }

  - id: S03
    type: card
    part: concept
    icons: [layers, eye, list, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "There's more than one way to enter a date. Pick the one that fits the date people need.\n\n- **Calendar pickers:** best for dates close to today, and for ranges. A year drop-down lets people jump further. For a range, show two months side by side so a stay can cross from one month into the next.\n- **Scrolling pickers:** fine for a near date or a time of day, such as hours and minutes. Not for dates far in the past or future, or for several dates.\n- **Day, month and year drop-downs:** open, scroll and pick three times. A high interaction cost, so avoid them.\n- **Typing:** often the easiest, especially for dates people know by heart, such as a birthdate. Show where the day, month and year go, and move to the next part by itself."
      ar: "توجد أكثر من طريقة لإدخال التاريخ. اختر الطريقة التي تناسب التاريخ الذي يحتاجه الناس.\n\n- **التقويم (Calendar picker):** الأفضل للتواريخ القريبة من اليوم، وللفترات. ويتيح Dropdown للسنة الانتقال إلى تاريخ أبعد. وللفترة، اعرض شهرين جنبًا إلى جنب لكي تمتد الإقامة من شهر إلى الشهر التالي.\n- **الـ Scrolling picker:** مناسب لتاريخ قريب أو لوقت في اليوم، مثل الساعات والدقائق. وليس للتواريخ البعيدة في الماضي أو المستقبل، ولا لعدة تواريخ.\n- **Dropdowns لليوم والشهر والسنة:** فتح ثم تمرير ثم اختيار، ثلاث مرات. وهذا Interaction cost عالٍ، فتجنّبها.\n- **الكتابة:** غالبًا الأسهل، خاصة للتواريخ التي يحفظها الناس، مثل تاريخ الميلاد. وضّح مكان اليوم والشهر والسنة، وانتقل إلى الجزء التالي تلقائيًا."

  - id: S04
    type: compare
    part: guided
    skill: SK-P14-U06-04
    rules: [R06]
    value:
      en: "Date input (NN/g): calendar pickers should be used for events close to the present time, within less than a year. For a birthdate, it would be faster to simply type the year."
      ar: "إدخال التاريخ (NN/g): يجب استخدام التقويم للأحداث القريبة من الوقت الحالي، خلال أقل من سنة. أما تاريخ الميلاد، فكتابة السنة ببساطة أسرع."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Calendar pickers should be used for events close to the present time — within less than a year." }
    scenario:
      en: "To create an account, guests enter their date of birth. Most were born between 1960 and 2005."
      ar: "لإنشاء حساب، يُدخل النزلاء تاريخ ميلادهم. وأغلبهم وُلدوا بين 1960 و2005."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تساعد آية على اختيار الخطة المناسبة لسيارتها؟"
    a:
      label: { en: "Version A: a calendar that opens on this month", ar: "النسخة A: تقويم يفتح على الشهر الحالي" }
      mock:
        app: nuzul
        appbar: {"title": {"en": "Create account", "ar": "أنشئ حسابًا"}, "back": true}
        blocks:
          - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": {"en": "Nada Samir", "ar": "ندى سمير"}, "filled": true}
          - {"kind": "small", "text": {"en": "Date of birth", "ar": "تاريخ الميلاد"}}
          - {"kind": "calendar", "months": [{"title": {"en": "‹  November 2026  ›", "ar": "‹  نوفمبر 2026  ›"}, "start": 0, "days": 30}], "today": [0, 2]}
        footer:
          - {"kind": "button", "text": {"en": "Continue", "ar": "تابع"}}
    b:
      label: { en: "Version B: three labelled fields to type", ar: "النسخة B: ثلاثة حقول لها أسماء للكتابة" }
      mock:
        app: nuzul
        appbar: {"title": {"en": "Create account", "ar": "أنشئ حسابًا"}, "back": true}
        blocks:
          - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": {"en": "Nada Samir", "ar": "ندى سمير"}, "filled": true}
          - {"kind": "small", "text": {"en": "Date of birth", "ar": "تاريخ الميلاد"}}
          - {"kind": "row", "blocks": [{"kind": "field", "label": {"en": "Day", "ar": "اليوم"}, "text": ""}, {"kind": "field", "label": {"en": "Month", "ar": "الشهر"}, "text": ""}, {"kind": "field", "label": {"en": "Year", "ar": "السنة"}, "text": ""}]}
        footer:
          - {"kind": "button", "text": {"en": "Continue", "ar": "تابع"}}
    answer: b
    misconceptions:
      - id: MC-P14-065
        when: [a]
        feedback:
          en: "Someone born in March 1985 must tap back more than 490 months, or hunt for a hidden way to change the year. A calendar shines near today, not 40 years away."
          ar: "من وُلد في مارس 1985 عليه أن يرجع أكثر من 490 شهرًا، أو يبحث عن طريقة مخفية لتغيير السنة. والتقويم مفيد قرب اليوم، لا قبل 40 سنة."
    correct:
