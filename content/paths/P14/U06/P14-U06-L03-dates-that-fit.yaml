id: P14-U06-L03
mode: lesson
minutes: 8
title:
  en: "A date input for every date"
  ar: "طريقة إدخال مناسبة لكل تاريخ"
sources:
  - title: { en: "Date-Input Form Fields: UX Design Guidelines (NN/g)", ar: "حقول إدخال التاريخ: إرشادات التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/date-input/"
review_labels:
  MC-P14-065: { en: "Calendars fit near dates; type far, known dates", ar: "التقويم للتواريخ القريبة؛ واكتب التواريخ البعيدة المعروفة" }
  MC-P14-066: { en: "Day/month/year drop-downs add many steps", ar: "الـ Dropdowns لليوم والشهر والسنة تضيف خطوات كثيرة" }
  MC-P14-067: { en: "Scrolling pickers fit near dates and times only", ar: "الـ Scrolling picker يناسب التواريخ القريبة والأوقات فقط" }
  MC-P14-068: { en: "Show a date range on a calendar, two months side by side", ar: "اعرض الفترة على تقويم، بشهرين جنبًا إلى جنب" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Omar's hotel bookings", ar: "حجوزات الفندق لعمر" }
    body:
      en: "Omar designs the booking site of a beach hotel. Guests pick their stay, often over a weekend or a holiday that crosses into the next month. To create an account, they also give their date of birth.\n\nThe site has three kinds of dates, and each may need a different input."
      ar: "يصمّم عمر موقع الحجز لفندق على البحر. يختار النزلاء فترة إقامتهم، غالبًا في عطلة نهاية أسبوع أو إجازة تمتد إلى الشهر التالي. ولإنشاء حساب، يذكرون أيضًا تاريخ ميلادهم.\n\nفي الموقع ثلاثة أنواع من التواريخ، وقد يحتاج كل نوع إلى طريقة إدخال مختلفة."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Book your stay", ar: "احجز إقامتك" } }
        - { kind: select, label: { en: "Check-in and check-out", ar: "الوصول والمغادرة" }, text: { en: "Choose dates", ar: "اختر التواريخ" }, gap: s }
        - { kind: stepper, label: { en: "Guests", ar: "النزلاء" }, text: "2", min: 1, max: 6 }
        - { kind: button, text: { en: "See rooms", ar: "اعرض الغرف" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U06-04
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Date input (NN/g): calendar pickers are especially useful for selecting a date range. In those situations, they often display two months side by side."
      ar: "جرّب أولًا. إدخال التاريخ (NN/g): التقويم مفيد بشكل خاص لاختيار فترة بين تاريخين. وفي هذه الحالات، يعرض غالبًا شهرين جنبًا إلى جنب."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Calendar pickers are especially useful for selecting a date range." }
    prompt:
      en: "A guest wants the New Year's week, from Monday 28 December to Sunday 3 January. Try each version. Which one should ship?"
      ar: "يريد أحد النزلاء أسبوع رأس السنة، من الإثنين 28 ديسمبر إلى الأحد 3 يناير. جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: drop
    options:
      - id: drop
        text: { en: "Day, month and year drop-downs, twice", ar: "Dropdowns لليوم والشهر والسنة، مرتين" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Check-in", ar: "الوصول" } }
            - kind: row
              blocks:
                - { kind: select, text: { en: "Day", ar: "اليوم" } }
                - { kind: select, text: { en: "Month", ar: "الشهر" } }
                - { kind: select, text: { en: "Year", ar: "السنة" } }
            - { kind: small, text: { en: "Check-out", ar: "المغادرة" }, gap: s }
            - kind: row
              blocks:
                - { kind: select, text: { en: "Day", ar: "اليوم" } }
                - { kind: select, text: { en: "Month", ar: "الشهر" } }
                - { kind: select, text: { en: "Year", ar: "السنة" } }
            - { kind: button, text: { en: "See rooms", ar: "اعرض الغرف" }, gap: m }
      - id: typed
        text: { en: "Two fields to type the dates", ar: "حقلان لكتابة التاريخين" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Check-in", ar: "الوصول" }, hint: { en: "DD/MM/YYYY", ar: "يوم/شهر/سنة" }, hintFirst: true, text: "" }
            - { kind: field, label: { en: "Check-out", ar: "المغادرة" }, hint: { en: "DD/MM/YYYY", ar: "يوم/شهر/سنة" }, hintFirst: true, text: "" }
            - { kind: button, text: { en: "See rooms", ar: "اعرض الغرف" }, gap: m }
      - id: calendar
        text: { en: "A calendar showing two months, the stay as a range", ar: "تقويم يعرض شهرين، والإقامة كفترة" }
        mock:
          width: 320
          blocks:
            - kind: calendar
              months:
                - { title: { en: "December 2026", ar: "ديسمبر 2026" }, start: 2, days: 31 }
                - { title: { en: "January 2027", ar: "يناير 2027" }, start: 5, days: 31 }
              from: [0, 28]
              to: [1, 3]
              text: { en: "Mon 28 Dec – Sun 3 Jan · 6 nights", ar: "الإثنين 28 ديسمبر – الأحد 3 يناير · 6 ليالٍ" }
            - { kind: button, text: { en: "See rooms", ar: "اعرض الغرف" }, gap: m }
    answer: [calendar]
    misconceptions:
      - id: MC-P14-066
        when: [drop]
        feedback:
          en: "Six drop-downs: open, scroll and pick, six times. And nothing shows that the 28th is a Monday or that the stay is six nights."
          ar: "ستة Dropdowns: فتح ثم تمرير ثم اختيار، ست مرات. ولا شيء يوضّح أن يوم 28 هو الإثنين، أو أن الإقامة ست ليالٍ."
      - id: MC-P14-068
        when: [typed]
        feedback:
          en: "Typing is quick, but people plan holidays by weekdays: \"Monday to Sunday\". Here they must work out the dates elsewhere, then check the range in their head."
          ar: "الكتابة سريعة، لكن الناس يخططون للإجازات بأيام الأسبوع: «من الإثنين إلى الأحد». وهنا عليهم أن يعرفوا التواريخ من مكان آخر، ثم يراجعوا الفترة في أذهانهم."
    hints:
      - en: "The guest thinks \"Monday to Sunday, across New Year\". Which version shows that?"
        ar: "النزيل يفكّر «من الإثنين إلى الأحد، مرورًا برأس السنة». أيّ نسخة توضّح ذلك؟"
    correct:
      en: "A two-month calendar with the range."
      ar: "تقويم بشهرين مع الفترة."
    explain:
      en: "Two taps choose the stay, and the guest sees the weekdays, the whole range across both months, and the number of nights at once."
      ar: "ضغطتان تكفيان لاختيار الإقامة، ويرى النزيل أيام الأسبوع، والفترة كاملة عبر الشهرين، وعدد الليالي مرة واحدة."

  - id: S03
    type: card
    part: concept
    icons: [layers, eye, list, ok]
    title: { en: "Date inputs", ar: "طرق إدخال التاريخ" }
    body:
      en: "There's more than one way to enter a date. Pick the one that fits the date people need.\n\n- **Calendar pickers:** best for dates close to today, and for ranges. For a range, show two months side by side so a stay can cross from one month into the next.\n- **Scrolling pickers:** fine for a near date or a time of day, such as hours and minutes. Not for dates far in the past or future, or for several dates.\n- **Day, month and year drop-downs:** open, scroll and pick three times. A high interaction cost, so avoid them.\n- **Typing:** often the easiest, especially for dates people know by heart, such as a birthdate."
      ar: "توجد أكثر من طريقة لإدخال التاريخ. اختر الطريقة التي تناسب التاريخ الذي يحتاجه الناس.\n\n- **التقويم (Calendar picker):** الأفضل للتواريخ القريبة من اليوم، وللفترات. وللفترة، اعرض شهرين جنبًا إلى جنب لكي تمتد الإقامة من شهر إلى الشهر التالي.\n- **الـ Scrolling picker:** مناسب لتاريخ قريب أو لوقت في اليوم، مثل الساعات والدقائق. وليس للتواريخ البعيدة في الماضي أو المستقبل، ولا لعدة تواريخ.\n- **Dropdowns لليوم والشهر والسنة:** فتح ثم تمرير ثم اختيار، ثلاث مرات. وهذا Interaction cost عالٍ، فتجنّبها.\n- **الكتابة:** غالبًا الأسهل، خاصة للتواريخ التي يحفظها الناس، مثل تاريخ الميلاد."

  - id: S04
    type: compare
    part: guided
    skill: SK-P14-U06-04
    rules: [R06]
    value:
      en: "Date input (NN/g): calendar pickers should be used for events close to the present time, within less than a year. For a birthdate, it would be faster to simply type the year."
      ar: "إدخال التاريخ (NN/g): يجب استخدام التقويم للأحداث القريبة من الوقت الحالي، خلال أقل من سنة. أما تاريخ الميلاد، فكتابة السنة ببساطة أسرع."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Calendar pickers should be used for events close to the present time — within less than a year." }
    scenario:
      en: "To create an account, guests enter their date of birth. Most were born between 1960 and 2005."
      ar: "لإنشاء حساب، يُدخل النزلاء تاريخ ميلادهم. وأغلبهم وُلدوا بين 1960 و2005."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: a calendar that opens on this month", ar: "النسخة A: تقويم يفتح على الشهر الحالي" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Date of birth", ar: "تاريخ الميلاد" } }
          - kind: calendar
            months:
              - { title: { en: "‹  November 2026  ›", ar: "‹  نوفمبر 2026  ›" }, start: 0, days: 30 }
            today: [0, 2]
          - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    b:
      label: { en: "Version B: three labelled fields to type", ar: "النسخة B: ثلاثة حقول لها أسماء للكتابة" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Date of birth", ar: "تاريخ الميلاد" } }
          - kind: row
            blocks:
              - { kind: field, label: { en: "Day", ar: "اليوم" }, text: "" }
              - { kind: field, label: { en: "Month", ar: "الشهر" }, text: "" }
              - { kind: field, label: { en: "Year", ar: "السنة" }, text: "" }
          - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-065
        when: [a]
        feedback:
          en: "Someone born in March 1985 must tap back more than 490 months, or hunt for a hidden way to change the year. A calendar shines near today, not 40 years away."
          ar: "من وُلد في مارس 1985 عليه أن يرجع أكثر من 490 شهرًا، أو يبحث عن طريقة مخفية لتغيير السنة. والتقويم يتألق قرب اليوم، لا قبل 40 سنة."
    correct:
      en: "B: type a date people know by heart."
      ar: "B: اكتب تاريخًا يحفظه الناس."
    explain:
      en: "People know their birthdate without looking. Typing takes seconds, and separate labelled fields keep the day and the month from being mixed up."
      ar: "الناس يعرفون تاريخ ميلادهم دون أن ينظروا. والكتابة تأخذ ثواني، والحقول المنفصلة التي لها أسماء تمنع الخلط بين اليوم والشهر."

  - id: S05
    type: compare
    part: contrast
    skill: SK-P14-U06-04
    rules: [R11]
    confidence: true
    value:
      en: "Date input (NN/g): calendar pickers should be used for events close to the present time. For a date this week, people think \"Thursday\", and a calendar shows them exactly that."
      ar: "إدخال التاريخ (NN/g): يجب استخدام التقويم للأحداث القريبة من الوقت الحالي. ففي تاريخ خلال هذا الأسبوع، يفكّر الناس «الخميس»، والتقويم يعرض لهم ذلك بالضبط."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Calendar pickers should be used for events close to the present time — within less than a year." }
    scenario:
      en: "Guests already at the hotel can book a spa visit for one of the next few days. Today is Monday 2 November."
      ar: "يستطيع النزلاء الموجودون في الفندق حجز زيارة للسبا في أحد الأيام القليلة القادمة. واليوم هو الإثنين 2 نوفمبر."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: three labelled fields to type", ar: "النسخة A: ثلاثة حقول لها أسماء للكتابة" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Spa visit date", ar: "تاريخ زيارة السبا" } }
          - kind: row
            blocks:
              - { kind: field, label: { en: "Day", ar: "اليوم" }, text: "" }
              - { kind: field, label: { en: "Month", ar: "الشهر" }, text: "" }
              - { kind: field, label: { en: "Year", ar: "السنة" }, text: "" }
          - { kind: button, text: { en: "See times", ar: "اعرض المواعيد" }, gap: m }
    b:
      label: { en: "Version B: a calendar on this month", ar: "النسخة B: تقويم على الشهر الحالي" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Spa visit date", ar: "تاريخ زيارة السبا" } }
          - kind: calendar
            months:
              - { title: { en: "November 2026", ar: "نوفمبر 2026" }, start: 0, days: 30 }
            today: [0, 2]
            pick: [0, 5]
            text: { en: "Thursday 5 November", ar: "الخميس 5 نوفمبر" }
          - { kind: button, text: { en: "See times", ar: "اعرض المواعيد" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-065
        when: [a]
        feedback:
          en: "Guests think \"Thursday\", not \"the 5th\". With the fields, they must work out the date first, then type the month and a year everyone already knows, with no weekday in sight."
          ar: "النزلاء يفكّرون «الخميس»، لا «يوم 5». ومع الحقول، عليهم أن يحسبوا التاريخ أولًا، ثم يكتبوا الشهر وسنة يعرفها الجميع أصلًا."
    correct:
      en: "B: a near date belongs on a calendar."
      ar: "B: التاريخ القريب مكانه التقويم."
    explain:
      en: "The deciding factor is how far the date is. A birthdate is decades away and known by heart, so typing wins. A spa visit is days away and thought of by weekday, so one tap on the calendar wins."
      ar: "العامل الحاسم هو بُعد التاريخ. تاريخ الميلاد بعيد بعشرات السنين ومحفوظ، فالكتابة أفضل. أما زيارة السبا فبعد أيام ويُفكَّر فيها بأيام الأسبوع، فضغطة واحدة على التقويم أفضل."

  - id: S06
    type: tune
    part: guided
    skill: SK-P14-U06-04
    rules: [R06]
    value:
      en: "Date input (NN/g): split fields with drop-downs require a lot of unnecessary steps; this method increases interaction cost by adding additional clicks and scrolling. A scrolling picker suits a time of day close at hand."
      ar: "إدخال التاريخ (NN/g): الحقول المقسّمة بـ Dropdowns تحتاج إلى خطوات كثيرة غير ضرورية؛ فهذه الطريقة تزيد الـ Interaction cost بضغطات وتمرير إضافي. أما الـ Scrolling picker فيناسب وقتًا قريبًا في اليوم."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "This method increases interaction cost by adding additional clicks and scrolling." }
    scenario:
      en: "On the phone, guests can book a car to pick them up from the airport on their arrival day. They choose the pickup time."
      ar: "على الموبايل، يستطيع النزلاء حجز سيارة تستقبلهم من المطار يوم وصولهم. ويختارون موعد الاستقبال."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: drops
    options:
      - id: drops
        text: { en: "Drop-downs for hour, minutes and AM/PM", ar: "Dropdowns للساعة والدقائق وصباحًا/مساءً" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Pickup time, Mon 28 Dec", ar: "موعد الاستقبال، الإثنين 28 ديسمبر" } }
            - kind: row
              blocks:
                - { kind: select, text: { en: "Hour", ar: "الساعة" } }
                - { kind: select, text: { en: "Min", ar: "الدقيقة" } }
                - { kind: select, text: { en: "AM", ar: "ص" } }
            - { kind: button, text: { en: "Book car", ar: "احجز السيارة" }, gap: m }
      - id: wheel
        text: { en: "A scrolling picker for the time", ar: "Scrolling picker للوقت" }
        mock:
          width: 300
          blocks:
            - { kind: small, text: { en: "Pickup time, Mon 28 Dec", ar: "موعد الاستقبال، الإثنين 28 ديسمبر" } }
            - kind: wheel
              columns:
                - ["1", "2", "3", "4", "5"]
                - ["00", "15", "30", "45", "00"]
                - ["", "AM", "PM", "", ""]
            - { kind: button, text: { en: "Book car", ar: "احجز السيارة" }, gap: m }
    answer: [wheel]
    misconceptions:
      - id: MC-P14-066
        when: [drops]
        feedback:
          en: "Three drop-downs mean three rounds of open, scroll and pick, each covering the screen. A time on the same day needs only a short scroll."
          ar: "ثلاثة Dropdowns تعني ثلاث مرات من الفتح والتمرير والاختيار، وكل مرة تغطي الشاشة. والوقت في اليوم نفسه يحتاج فقط إلى تمرير قصير."
    hints:
      - en: "How far does the guest need to move from the starting value?"
        ar: "إلى أي مدى يحتاج النزيل إلى التحرك بعيدًا عن القيمة الأولى؟"
    correct:
      en: "A scrolling picker for a near time."
      ar: "Scrolling picker لوقت قريب."
    explain:
      en: "Hours and quarter hours are a short list, so a flick or two lands on 3:30 PM, with all three parts visible together."
      ar: "الساعات وأرباع الساعة قائمة قصيرة، فتكفي حركة أو اثنتان للوصول إلى 3:30 مساءً، مع ظهور الأجزاء الثلاثة معًا."

  - id: S07
    type: choose
    part: independent
    skill: SK-P14-U06-04
    rules: [R14]
    value:
      en: "Date input (NN/g): scrolling date pickers on mobile devices are common, yet they can be annoying if the picker contains many dates, especially when the date is further away in the past or future."
      ar: "إدخال التاريخ (NN/g): الـ Scrolling date pickers شائعة على الموبايل، لكنها قد تكون مزعجة إن كان فيها تواريخ كثيرة، خاصة حين يكون التاريخ بعيدًا في الماضي أو المستقبل."
    ref: { url: "https://www.nngroup.com/articles/date-input/", quote: "Scrolling date pickers on mobile devices are common, yet they can be annoying if the picker contains many dates." }
    scenario:
      en: "Nadia designs a car-insurance app. To get a quote, drivers enter the date their car was first licensed, which can be anywhere from last month to 25 years ago. They copy it from their car licence card."
      ar: "تصمّم نادية تطبيقًا لتأمين السيارات. وللحصول على عرض سعر، يُدخل السائقون تاريخ أول ترخيص لسيارتهم، وقد يكون من الشهر الماضي حتى قبل 25 سنة. وينقلونه من رخصة السيارة."
    prompt:
      en: "How should drivers enter the first-licence date?"
      ar: "كيف يُدخل السائقون تاريخ أول ترخيص؟"
    options:
      - { id: wheel, text: { en: "A scrolling picker for day, month and year, starting today", ar: "Scrolling picker لليوم والشهر والسنة، يبدأ من اليوم" } }
      - { id: drops, text: { en: "Three drop-downs: day, month and year", ar: "ثلاثة Dropdowns: اليوم والشهر والسنة" } }
      - { id: typed, text: { en: "Three labelled fields to type, with the month spelled out", ar: "ثلاثة حقول لها أسماء للكتابة، والشهر مكتوب باسمه" } }
    answer: [typed]
    misconceptions:
      - id: MC-P14-067
        when: [wheel]
        feedback:
          en: "For a car licensed in 2004, the year wheel has to spin past more than twenty years, often overshooting. Scrolling pickers fit near dates and times, not far ones."
          ar: "لسيارة مرخّصة في 2004، يجب أن تدور عجلة السنة أكثر من عشرين سنة، وغالبًا تتجاوز السنة المطلوبة. والـ Scrolling picker يناسب التواريخ والأوقات القريبة، لا البعيدة."
      - id: MC-P14-066
        when: [drops]
        feedback:
          en: "Three rounds of open, scroll and pick, and the year list is long. Drivers already have the date in front of them, so typing it is faster."
          ar: "ثلاث مرات من الفتح والتمرير والاختيار، وقائمة السنوات طويلة. والسائقون أمامهم التاريخ أصلًا، فكتابته أسرع."
    correct:
      en: "Type a date people copy from a document."
      ar: "اكتب تاريخًا ينقله الناس من مستند."
    explain:
      en: "The date is right there on the licence card, so typing it takes seconds whether it's last month or 2004. Labels and a spelled-out month keep day and month from being swapped."
      ar: "التاريخ موجود أمامهم على الرخصة، فكتابته تأخذ ثواني سواء كان الشهر الماضي أو 2004. والأسماء والشهر المكتوب باسمه تمنع الخلط بين اليوم والشهر."

  - id: S08
    type: card
    part: recap
    icons: [layers, eye, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Calendars** for dates close to today, and **two months** for a range.\n- **Typing** for far dates people know or copy, such as a birthdate.\n- **Scrolling pickers** only for near dates and times; avoid **day/month/year drop-downs**.\n\nNext: the skill check for this unit."
      ar: "- **التقويم** للتواريخ القريبة من اليوم، و**شهران** للفترة.\n- **الكتابة** للتواريخ البعيدة التي يعرفها الناس أو ينقلونها، مثل تاريخ الميلاد.\n- **الـ Scrolling picker** فقط للتواريخ والأوقات القريبة؛ وتجنّب **Dropdowns اليوم والشهر والسنة**.\n\nالتالي: اختبار المهارة لهذه الوحدة."
