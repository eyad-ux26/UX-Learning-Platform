id: P14-U06-L01
mode: lesson
minutes: 8
title:
  en: "Steppers for small counts"
  ar: "الـ Steppers للأعداد الصغيرة"
sources:
  - title: { en: "Design Guidelines for Input Steppers (NN/g)", ar: "إرشادات تصميم الـ Input steppers (NN/g)" }
    url: "https://www.nngroup.com/articles/input-steppers/"
review_labels:
  MC-P14-056: { en: "Start a stepper on the most common value", ar: "ابدأ الـ Stepper على القيمة الأكثر شيوعًا" }
  MC-P14-057: { en: "For small counts, a stepper beats a drop-down or typing", ar: "للأعداد الصغيرة، الـ Stepper أفضل من الـ Dropdown أو الكتابة" }
  MC-P14-058: { en: "Grey out + or − at the limit", ar: "عطّل + أو − عند الحد" }
  MC-P14-059: { en: "Steppers don't fit large or wide-ranging numbers", ar: "الـ Stepper لا يناسب الأرقام الكبيرة أو الواسعة المدى" }
  MC-P14-060: { en: "Show the unit next to the number", ar: "اعرض الوحدة بجانب الرقم" }
  MC-P14-061: { en: "Let people type a big jump into the stepper", ar: "اسمح للناس بكتابة القفزة الكبيرة داخل الـ Stepper" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Bahaa's flight search", ar: "البحث عن رحلات طيران لبهاء" }
    body:
      en: "Bahaa designs the search form of a flight-booking website. Before searching, people say how many adults and children are travelling.\n\nThe booking data is clear: most searches are for 2 adults. Almost all the rest are for 1, 3 or 4."
      ar: "يصمّم بهاء نموذج البحث في موقع لحجز تذاكر الطيران. وقبل البحث، يحدد الناس عدد البالغين والأطفال المسافرين.\n\nوبيانات الحجز واضحة: أغلب عمليات البحث لبالغَين اثنين. وكل الباقي تقريبًا لـ 1 أو 3 أو 4."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Cairo → Dubai", ar: "القاهرة ← دبي" } }
        - { kind: select, label: { en: "Dates", ar: "التواريخ" }, text: { en: "12 Dec – 19 Dec", ar: "12 ديسمبر – 19 ديسمبر" }, filled: true, gap: s }
        - { kind: select, label: { en: "Travellers", ar: "المسافرون" }, text: { en: "?", ar: "؟" } }
        - { kind: button, text: { en: "Search flights", ar: "ابحث عن رحلات" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U06-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Input steppers (NN/g): steppers make sense for numerical parameters with a clear default that most users are likely to select. Set the most frequently selected value as the default."
      ar: "جرّب أولًا. الـ Input steppers (NN/g): الـ Stepper مناسب للقيم الرقمية التي لها قيمة افتراضية واضحة يختارها أغلب الناس. واجعل القيمة الأكثر اختيارًا هي القيمة الافتراضية."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Steppers make sense for numerical parameters with a clear default that most users are likely to select." }
    prompt:
      en: "Try each version of the Adults field. Which one should ship?"
      ar: "جرّب كل نسخة من حقل البالغين. أيّها يجب أن تُطلق؟"
    start: dropdown
    options:
      - id: dropdown
        text: { en: "A drop-down from 1 to 9", ar: "Dropdown من 1 إلى 9" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Travellers", ar: "المسافرون" } }
            - { kind: select, label: { en: "Adults", ar: "البالغون" }, text: { en: "Choose", ar: "اختر" }, gap: s }
            - { kind: button, text: { en: "Done", ar: "تم" }, gap: m }
      - id: zero
        text: { en: "A stepper that starts at 0", ar: "Stepper يبدأ من 0" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Travellers", ar: "المسافرون" } }
            - { kind: stepper, label: { en: "Adults", ar: "البالغون" }, text: "0", min: 0, max: 9, gap: s }
            - { kind: button, text: { en: "Done", ar: "تم" }, gap: m }
      - id: two
        text: { en: "A stepper that starts at 2", ar: "Stepper يبدأ من 2" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Travellers", ar: "المسافرون" } }
            - { kind: stepper, label: { en: "Adults", ar: "البالغون" }, text: "2", min: 1, max: 9, gap: s }
            - { kind: button, text: { en: "Done", ar: "تم" }, gap: m }
    answer: [two]
    misconceptions:
      - id: MC-P14-057
        when: [dropdown]
        feedback:
          en: "The drop-down takes three steps for everyone: open, scroll, pick. With a stepper on the usual value, most people take zero steps."
          ar: "الـ Dropdown يأخذ ثلاث خطوات من الجميع: فتح، ثم تمرير، ثم اختيار. ومع Stepper على القيمة المعتادة، لا يحتاج أغلب الناس إلى أي خطوة."
      - id: MC-P14-056
        when: [zero]
        feedback:
          en: "Nobody flies with 0 adults. Everyone has to tap + at least once, and most twice, before they can search."
          ar: "لا أحد يسافر بـ 0 بالغين. فيضطر الجميع إلى الضغط على + مرة على الأقل، وأغلبهم مرتين، قبل أن يبحثوا."
    hints:
      - en: "What do most people choose? How many taps does each version cost them?"
        ar: "ماذا يختار أغلب الناس؟ وكم ضغطة تكلّفهم كل نسخة؟"
    correct:
      en: "A stepper on the most common value."
      ar: "Stepper على القيمة الأكثر شيوعًا."
    explain:
      en: "Most people go straight on with 2. The rest tap + or − once or twice. The minimum is 1, because a flight needs at least one adult."
      ar: "أغلب الناس يكملون مباشرة بـ 2. والباقون يضغطون + أو − مرة أو مرتين. والحد الأدنى 1، لأن الرحلة تحتاج إلى بالغ واحد على الأقل."

  - id: S03
    type: card
    part: concept
    icons: [list, ok, eye, layers]
    title: { en: "Steppers", ar: "الـ Steppers" }
    body:
      en: "A stepper is a number between − and + buttons. People change the number without a keyboard, and the signs are understood by almost everyone.\n\n- **Use it for small changes:** it works best when most people pick one common value. Make that value the default, so most people need no taps at all.\n- **Watch the drawbacks:** small, stacked arrows are hard to hit on desktop, and big changes, such as from 1,084 to 1,500, would take hundreds of taps.\n- **Fix them:** let people type into the number, make press-and-hold change it faster, and support the keyboard's up and down arrows.\n- **Be clear:** show the unit or currency, and grey out + at the maximum and − at the minimum."
      ar: "الـ Stepper رقم بين زرّين − و+. يغيّر الناس الرقم دون لوحة مفاتيح، والعلامتان مفهومتان للجميع تقريبًا.\n\n- **استخدمه للتغييرات الصغيرة:** يعمل أفضل حين يختار أغلب الناس قيمة شائعة واحدة. اجعلها القيمة الافتراضية، فلا يحتاج أغلب الناس إلى أي ضغطة.\n- **انتبه لعيوبه:** الأسهم الصغيرة المتراصة فوق بعضها يصعب الضغط عليها على الكمبيوتر، والتغييرات الكبيرة، مثل من 1,084 إلى 1,500، تحتاج إلى مئات الضغطات.\n- **عالج العيوب:** اسمح للناس بالكتابة داخل الرقم، واجعل الضغط المطوّل يغيّره أسرع، وادعم سهمَي أعلى وأسفل في لوحة المفاتيح.\n- **كن واضحًا:** اعرض الوحدة أو العملة، وعطّل + عند الحد الأقصى و− عند الحد الأدنى."

  - id: S04
    type: compare
    part: guided
    skill: SK-P14-U06-02
    rules: [R06]
    value:
      en: "Input steppers (NN/g): if the input value has a maximum or minimum limit, be sure to indicate it. A greyed-out button says \"you can't go further\" before anyone tries."
      ar: "الـ Input steppers (NN/g): إن كان للقيمة حد أقصى أو حد أدنى، فتأكد من توضيحه. والزر المعطّل يقول «لا يمكنك الزيادة أكثر» قبل أن يحاول أحد."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Also, if the input value has a maximum or minimum limit, be sure to indicate it." }
    scenario:
      en: "One booking can hold up to 9 adults. Children start at 0. Here is the picker for a big family that has reached 9 adults and has no children."
      ar: "الحجز الواحد يتسع لـ 9 بالغين بحد أقصى. والأطفال يبدؤون من 0. وهذه شاشة الاختيار لعائلة كبيرة وصلت إلى 9 بالغين وليس معها أطفال."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: every button looks active", ar: "النسخة A: كل الأزرار تبدو مفعّلة" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Travellers", ar: "المسافرون" } }
          - { kind: stepper, label: { en: "Adults", ar: "البالغون" }, text: "9", gap: s }
          - { kind: stepper, label: { en: "Children", ar: "الأطفال" }, text: "0" }
          - { kind: button, text: { en: "Done", ar: "تم" }, gap: m }
    b:
      label: { en: "Version B: buttons at a limit are greyed out", ar: "النسخة B: الأزرار عند الحد معطّلة" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Travellers", ar: "المسافرون" } }
          - { kind: stepper, label: { en: "Adults", ar: "البالغون" }, text: "9", min: 1, max: 9, hint: { en: "Up to 9 per booking", ar: "حتى 9 في الحجز الواحد" }, gap: s }
          - { kind: stepper, label: { en: "Children", ar: "الأطفال" }, text: "0", min: 0, max: 8 }
          - { kind: button, text: { en: "Done", ar: "تم" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-058
        when: [a]
        feedback:
          en: "In A, + still looks tappable at 9. The family taps it, nothing happens, and they wonder if the site is broken or if they did something wrong."
          ar: "في A، ما زال + يبدو قابلًا للضغط عند 9. فتضغط العائلة عليه، ولا يحدث شيء، فيتساءلون هل الموقع معطّل أم أنهم أخطؤوا."
    correct:
      en: "B: the limits are visible."
      ar: "B: الحدود ظاهرة."
    explain:
      en: "The grey + and the short note say the limit before anyone hits it. The grey − on Children says 0 is the lowest, without a single wasted tap."
      ar: "الـ + الرمادي والملاحظة القصيرة يوضّحان الحد قبل أن يصل إليه أحد. والـ − الرمادي عند الأطفال يقول إن 0 هو الأقل، دون أي ضغطة ضائعة."

  - id: S05
    type: compare
    part: contrast
    skill: SK-P14-U06-01
    rules: [R11]
    confidence: true
    value:
      en: "Input steppers (NN/g): steppers are not suitable for a large number adjustments. Too much clicking and tapping can be irritating."
      ar: "الـ Input steppers (NN/g): الـ Stepper لا يناسب التغييرات الكبيرة في الأرقام. فكثرة الضغط مزعجة."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Steppers are not suitable for a large number adjustments." }
    scenario:
      en: "At payment, members can pay part of the ticket with their miles. Balances range from a few hundred to 40,000 miles, and people usually use a round amount, such as 5,000 or 12,000."
      ar: "عند الدفع، يستطيع الأعضاء دفع جزء من التذكرة بأمياله. والأرصدة تتراوح بين بضع مئات و40,000 ميل، وعادة يستخدم الناس رقمًا مدوّرًا، مثل 5,000 أو 12,000."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: a stepper, 100 miles per tap", ar: "النسخة A: Stepper، و100 ميل في كل ضغطة" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Pay with miles", ar: "ادفع بالأميال" } }
          - { kind: small, text: { en: "Your balance: 23,400 miles", ar: "رصيدك: 23,400 ميل" }, gap: s }
          - { kind: stepper, label: { en: "Miles to use", ar: "الأميال المستخدمة" }, text: { en: "0 miles", ar: "0 ميل" }, min: 0, gap: s }
          - { kind: button, text: { en: "Apply", ar: "طبّق" }, gap: m }
    b:
      label: { en: "Version B: a field to type the amount", ar: "النسخة B: حقل لكتابة الرقم" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Pay with miles", ar: "ادفع بالأميال" } }
          - { kind: small, text: { en: "Your balance: 23,400 miles", ar: "رصيدك: 23,400 ميل" }, gap: s }
          - { kind: field, label: { en: "Miles to use", ar: "الأميال المستخدمة" }, hint: { en: "Any amount up to 23,400", ar: "أي رقم حتى 23,400" }, text: "", gap: s }
          - { kind: button, text: { en: "Apply", ar: "طبّق" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-059
        when: [a]
        feedback:
          en: "Reaching 12,000 miles takes 120 taps. Here there's no common value to start on and the range is huge, the opposite of what steppers are good at."
          ar: "الوصول إلى 12,000 ميل يحتاج إلى 120 ضغطة. ولا توجد هنا قيمة شائعة يبدأ منها، والمدى واسع جدًا، وهذا عكس ما يجيده الـ Stepper."
    correct:
      en: "B: typing fits a wide range."
      ar: "B: الكتابة تناسب المدى الواسع."
    explain:
      en: "The deciding factor is the size of the change. Adults change by 1 or 2 from a common value, so a stepper is fastest. Miles jump by thousands with no usual value, so typing is."
      ar: "العامل الحاسم هو حجم التغيير. عدد البالغين يتغيّر بـ 1 أو 2 من قيمة شائعة، فالـ Stepper أسرع. أما الأميال فتقفز بالآلاف دون قيمة معتادة، فالكتابة أسرع."

  - id: S06
    type: tune
    part: guided
    skill: SK-P14-U06-02
    rules: [R06]
    value:
      en: "Input steppers (NN/g): designers should make the step and the unit explicit. A bare number leaves people guessing what one tap adds."
      ar: "الـ Input steppers (NN/g): يجب أن يوضّح المصممون مقدار الخطوة والوحدة. فالرقم وحده يترك الناس يخمّنون ماذا تضيف الضغطة الواحدة."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Designers should make the step and the unit explicit" }
    scenario:
      en: "After choosing a flight, people can add checked baggage. Each tap on + adds one 23 kg bag, for EGP 1,200."
      ar: "بعد اختيار الرحلة، يستطيع الناس إضافة حقائب مشحونة. وكل ضغطة على + تضيف حقيبة واحدة وزنها 23 كجم، بسعر 1,200 جنيه."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: bare
    options:
      - id: bare
        text: { en: "Just the number", ar: "الرقم فقط" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Extra baggage", ar: "حقائب إضافية" } }
            - { kind: stepper, label: { en: "Checked baggage", ar: "الحقائب المشحونة" }, text: "0", min: 0, max: 3, gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: unit
        text: { en: "The number with its unit, weight and price", ar: "الرقم مع وحدته ووزنه وسعره" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Extra baggage", ar: "حقائب إضافية" } }
            - { kind: stepper, label: { en: "Checked baggage", ar: "الحقائب المشحونة" }, text: { en: "0 bags", ar: "0 حقيبة" }, min: 0, max: 3, hint: { en: "Each bag up to 23 kg · EGP 1,200", ar: "كل حقيبة حتى 23 كجم · 1,200 جنيه" }, gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: [unit]
    misconceptions:
      - id: MC-P14-060
        when: [bare]
        feedback:
          en: "Does 1 mean one bag, or one more kilogram? And what does it cost? People tap + and hope, then find the price at checkout."
          ar: "هل 1 تعني حقيبة واحدة، أم كيلوجرامًا إضافيًا؟ وكم تكلّف؟ يضغط الناس + ويتمنّون، ثم يكتشفون السعر عند الدفع."
    hints:
      - en: "Can people tell what one tap on + adds?"
        ar: "هل يعرف الناس ماذا تضيف ضغطة واحدة على +؟"
    correct:
      en: "Show the unit and what one step adds."
      ar: "اعرض الوحدة وما تضيفه الخطوة الواحدة."
    explain:
      en: "\"0 bags\" names the unit, and the line below says what each step adds in weight and price. People know exactly what they're buying before they tap."
      ar: "«0 حقيبة» تذكر الوحدة، والسطر الذي تحته يقول ماذا تضيف كل خطوة في الوزن والسعر. فيعرف الناس بالضبط ماذا يشترون قبل أن يضغطوا."

  - id: S07
    type: choose
    part: independent
    skill: SK-P14-U06-02
    rules: [R14]
    value:
      en: "Input steppers (NN/g): let people type the number. It's best to allow users to type such values instead of forcing them to use a fixed-increment stepper, and long press makes the buttons faster."
      ar: "الـ Input steppers (NN/g): اسمح للناس بكتابة الرقم. فالأفضل أن يكتب الناس هذه القيم بدل إجبارهم على Stepper بخطوة ثابتة، والضغط المطوّل يجعل الزرّين أسرع."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "It’s best to allow users to type such continuous values instead of forcing them to use a fixed-increment stepper." }
    scenario:
      en: "Yasmin designs the order page of an online print shop. Most people print 1 to 5 copies, but schools and offices sometimes order 300 or more."
      ar: "تصمّم ياسمين صفحة الطلب في مطبعة على الإنترنت. أغلب الناس يطبعون من 1 إلى 5 نسخ، لكن المدارس والشركات تطلب أحيانًا 300 نسخة أو أكثر."
    prompt:
      en: "What should Yasmin use for \"Copies\"?"
      ar: "ماذا تستخدم ياسمين لحقل «عدد النسخ»؟"
    options:
      - { id: stepper, text: { en: "A stepper starting at 1, + and − only", ar: "Stepper يبدأ من 1، بزرّي + و− فقط" } }
      - { id: field, text: { en: "An empty text field, so any number fits", ar: "حقل نصي فارغ، لكي يتسع لأي رقم" } }
      - { id: both, text: { en: "A stepper starting at 1 whose number can also be typed, with press-and-hold", ar: "Stepper يبدأ من 1 ويمكن كتابة رقمه أيضًا، مع الضغط المطوّل" } }
    answer: [both]
    misconceptions:
      - id: MC-P14-061
        when: [stepper]
        feedback:
          en: "Perfect for one copy, painful for 300: that's 299 taps. A stepper needs a way to jump."
          ar: "مثالي لنسخة واحدة، ومرهق لـ 300: فهذه 299 ضغطة. والـ Stepper يحتاج إلى طريقة للقفز."
      - id: MC-P14-057
        when: [field]
        feedback:
          en: "Most people want 1 to 5 copies. An empty field makes every one of them open the keyboard and type, when one or two taps would do."
          ar: "أغلب الناس يريدون من 1 إلى 5 نسخ. والحقل الفارغ يجعل كل واحد منهم يفتح لوحة المفاتيح ويكتب، بينما تكفي ضغطة أو ضغطتان."
    correct:
      en: "A stepper people can also type into."
      ar: "Stepper يمكن الكتابة داخله أيضًا."
    explain:
      en: "Small orders take a tap or two from the default. Schools tap the number and type 300. Both groups get the fastest path."
      ar: "الطلبات الصغيرة تحتاج إلى ضغطة أو اثنتين من القيمة الافتراضية. والمدارس تضغط على الرقم وتكتب 300. فيحصل الفريقان على أسرع طريق."

  - id: S08
    type: card
    part: recap
    icons: [list, ok, eye]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Steppers for small counts**, starting on the most common value.\n- **Typing for big or wide-ranging numbers**, or a stepper you can type into.\n- **Clear steppers:** the unit in view, and − or + greyed out at the limits.\n\nNext: sliders, and when close enough is good enough."
      ar: "- **الـ Stepper للأعداد الصغيرة**، ويبدأ من القيمة الأكثر شيوعًا.\n- **الكتابة للأرقام الكبيرة أو الواسعة المدى**، أو Stepper يمكن الكتابة داخله.\n- **Stepper واضح:** الوحدة ظاهرة، و− أو + معطّل عند الحدود.\n\nالتالي: الـ Sliders، ومتى تكفي القيمة التقريبية."
