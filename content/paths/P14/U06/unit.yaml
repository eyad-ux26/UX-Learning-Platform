id: P14-U06
free: false
title:
  en: "Numbers and dates, set fast"
  ar: "أرقام وتواريخ تُضبط بسرعة"
skill:
  en: "Choose and design steppers, sliders and date inputs so people set counts, amounts and dates with the fewest steps and no guessing."
  ar: "اختر الـ Steppers والـ Sliders وطرق إدخال التاريخ وصمّمها بحيث يضبط الناس الأعداد والكميات والتواريخ بأقل عدد من الخطوات ودون تخمين."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U06-01
    title: { en: "Use a stepper for small counts", ar: "استخدم الـ Stepper للأعداد الصغيرة" }
    can_do: { en: "Pick a stepper when most people choose one common value and change it by a little, and start it on that value.", ar: "اختر الـ Stepper حين يختار أغلب الناس قيمة شائعة واحدة ويغيّرونها قليلًا، وابدأه على هذه القيمة." }
  - id: SK-P14-U06-02
    title: { en: "Make steppers clear and quick", ar: "اجعل الـ Stepper واضحًا وسريعًا" }
    can_do: { en: "Show the unit, grey out − or + at the limits, and let people type a big jump instead of tapping many times.", ar: "اعرض الوحدة، وعطّل − أو + عند الحدود، واسمح للناس بكتابة القفزات الكبيرة بدل الضغط مرات كثيرة." }
  - id: SK-P14-U06-03
    title: { en: "Use sliders when close enough is fine", ar: "استخدم الـ Slider حين تكفي القيمة التقريبية" }
    can_do: { en: "Use a slider only for approximate values such as brightness or volume, keep its value visible while dragging, and use typing or a stepper for exact values.", ar: "استخدم الـ Slider فقط للقيم التقريبية مثل الإضاءة أو الصوت، واجعل قيمته ظاهرة أثناء السحب، واستخدم الكتابة أو الـ Stepper للقيم الدقيقة." }
  - id: SK-P14-U06-04
    title: { en: "Match the date input to the date", ar: "اختر طريقة إدخال التاريخ المناسبة للتاريخ" }
    can_do: { en: "Use a calendar for dates close to today and for ranges, typing for far, known dates such as a birthdate, and a scrolling picker only for near dates or times.", ar: "استخدم التقويم للتواريخ القريبة من اليوم وللفترات، والكتابة للتواريخ البعيدة المعروفة مثل تاريخ الميلاد، والـ Scrolling picker فقط للتواريخ القريبة أو الأوقات." }
