id: P14-U01-L03
mode: lesson
minutes: 8
title:
  en: "Snackbar, banner or dialog?"
  ar: "Snackbar أم Banner أم Dialog؟"
speaker: mona
sources:
  - title: { en: "Indicators, Validations, and Notifications (NN/g)", ar: "المؤشرات والتحقّق والإشعارات (NN/g)" }
    url: "https://www.nngroup.com/articles/indicators-validations-notifications/"
  - title: { en: "Confirmation Dialogs Can Prevent User Errors (NN/g)", ar: "نوافذ التأكيد تمنع أخطاء المستخدمين (NN/g)" }
    url: "https://www.nngroup.com/articles/confirmation-dialog/"
review_labels:
  MC-P14-012: { en: "An error people must fix isn't a passing message", ar: "الخطأ الذي يجب إصلاحه ليس رسالة عابرة" }
  MC-P14-013: { en: "Don't stop people for good news", ar: "لا توقف الناس من أجل خبر جيد" }
  MC-P14-014: { en: "Something that lasts needs a message that lasts", ar: "ما يستمر يحتاج رسالة تستمر" }
  MC-P14-015: { en: "Offer Undo instead of asking every time", ar: "قدّم «تراجع» بدل السؤال كل مرة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Reem's ride", ar: "مشوار ريم" }
    body:
      en: "My team designs a ride app. Reem books a ride home with it. Her card payment fails, and the app shows a dark strip at the bottom: \"Payment failed\". Four seconds later, it's gone.\n\nReem was looking at the map. Ten minutes later, she is still waiting, and no driver has been asked to come."
      ar: "يصمّم فريقي تطبيقًا للمشاوير. تحجز به ريم مشوارًا إلى البيت. فشل الدفع بالبطاقة، فأظهر التطبيق شريطًا داكنًا في الأسفل: «فشل الدفع». وبعد أربع ثوانٍ، اختفى.\n\nكانت ريم تنظر إلى الخريطة. وبعد عشر دقائق، ما زالت تنتظر، ولم يُطلب أي سائق."
    mock:
      app: mishwar
      appbar: { title: { en: "Your ride", ar: "مشوارك" }, back: true }
      blocks: &map
        - { kind: image, art: map-route, size: l }
        - { kind: heading, text: { en: "Finding your driver…", ar: "نبحث عن سائق…" }, gap: m }
        - { kind: listitem, icon: map-pin, text: { en: "To: Home", ar: "إلى: البيت" }, sub: { en: "12 Abbas El Akkad St · 18 min", ar: "12 شارع عباس العقاد · 18 دقيقة" }, value: { en: "EGP 85", ar: "85 جنيه" } }
        - { kind: listitem, icon: credit-card, text: { en: "Visa •••• 4821", ar: "Visa •••• 4821" } }
      overlay:
        type: toast
        blocks:
          - { kind: text, text: { en: "Payment failed.", ar: "فشل الدفع." }, note: { en: "Disappears after 4 s", ar: "يختفي بعد 4 ثوانٍ" } }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U01-05
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Notifications (NN/g): a toast (snackbar) is fine for passive notifications but would be a bad way to show an error, and passive messages are easily missed because they need no action. This ride can't go ahead until Reem acts."
      ar: "جرّب أولًا. الإشعارات (NN/g): الـ Toast (الـ Snackbar) مناسب للإشعارات التي لا تحتاج إجراءً، لكنه طريقة سيئة لعرض خطأ، والرسائل التي لا تحتاج إجراءً يسهل أن تفوت الناس. وهذا المشوار لا يتم حتى تتصرّف ريم."
    ref: { url: "https://www.nngroup.com/articles/indicators-validations-notifications/", quote: "Passive notifications can easily be missed, since they require no user action." }
    prompt:
      en: "Try each version of the payment message. Which one should ship?"
      ar: "جرّب كل نسخة من رسالة الدفع. أيّ نسخة تضمن أن تعرف ريم بالمشكلة وتدفع ليأتي السائق؟"
    start: longer
    options:
      - id: longer
        text: { en: "Keep the snackbar, but show it for 10 seconds", ar: "أبقِ الـ Snackbar، لكن اعرضه 10 ثوانٍ" }
        mock:
          caption: { en: "Disappears after 10 seconds", ar: "يختفي بعد 10 ثوانٍ" }
          app: mishwar
          appbar: { title: { en: "Your ride", ar: "مشوارك" }, back: true }
          blocks: *map
          overlay:
            type: toast
            blocks:
              - { kind: text, text: { en: "Payment failed. Try another way to pay.", ar: "فشل الدفع. جرّبي طريقة دفع أخرى." } }
      - id: dialog
        text: { en: "A dialog that asks how she wants to pay", ar: "Dialog يسألها كيف تريد أن تدفع" }
        mock:
          app: mishwar
          appbar: { title: { en: "Your ride", ar: "مشوارك" }, back: true }
          blocks: *map
          overlay:
            type: dialog
            blocks:
              - { kind: icon, icon: credit-card, size: l, color: brand }
              - { kind: heading, text: { en: "Your card was declined", ar: "رُفضت بطاقتك" }, gap: s }
              - { kind: small, text: { en: "We'll ask a driver as soon as you choose how to pay.", ar: "سنطلب سائقًا بمجرد أن تختاري طريقة الدفع." }, gap: s }
              - { kind: button, text: { en: "Pay with another card", ar: "ادفعي ببطاقة أخرى" }, gap: m }
              - { kind: button, text: { en: "Pay cash to the driver", ar: "ادفعي نقدًا للسائق" }, style: outline, gap: s }
      - id: color
        text: { en: "Keep the snackbar, but make it red", ar: "أبقِ الـ Snackbar، لكن اجعله أحمر" }
        mock:
          caption: { en: "Disappears after 4 seconds", ar: "يختفي بعد 4 ثوانٍ" }
          app: mishwar
          appbar: { title: { en: "Your ride", ar: "مشوارك" }, back: true }
          blocks: *map
          overlay:
            type: toast
            blocks:
              - { kind: text, color: red, weight: bold, text: { en: "Payment failed.", ar: "فشل الدفع." } }
    answer: [dialog]
    misconceptions:
      - id: MC-P14-012
        when: [longer, color]
        feedback:
          en: "It still disappears on its own, while Reem may be looking at the map. Nothing happens until she pays another way, so the message can't just pass by."
          ar: "ما زال يختفي وحده، بينما قد تكون ريم تنظر إلى الخريطة. ولن يحدث شيء حتى تدفع بطريقة أخرى، فلا يصح أن تمرّ الرسالة وتختفي."
    hints:
      - en: "Can the ride go ahead if Reem never notices this message?"
        ar: "هل يمكن أن يبدأ المشوار إن لم تنتبه ريم إلى هذه الرسالة أبدًا؟"
    correct:
      en: "She must act now: a dialog with the ways forward."
      ar: "يجب أن تتصرّف الآن: Dialog فيه طرق الدفع الأخرى."
    explain:
      en: "The ride is stuck until Reem picks another way to pay. A dialog stays until she answers, says what went wrong, and gives her two ways forward."
      ar: "المشوار متوقّف حتى تختار ريم طريقة دفع أخرى. والـ Dialog يبقى حتى تردّ، ويقول ما المشكلة، ويعطيها طريقتين لتكمل المشوار."

  - id: S09
    type: video
    part: concept
    title: { en: "Make the message as loud as it matters", ar: "اجعل صوت الرسالة على قدر أهميتها" }
    video: 1ff66ea0-29ed-4690-9ff3-3bdd7b335d45
    duration: 87
    transcript:
      - { t: 0.0, en: "Let's compare the components that show system messages,", ar: "تعالوا نعمل مقارنة بين الـ Components اللي بتعرض System messages،" }
      - { t: 5.0, en: "the messages users see through these components.", ar: "يعني الرسايل اللي بتظهر لليوزر من خلال الـ Components دي." }
      - { t: 8.6, en: "The snackbar, the banner and the dialog can all show messages.", ar: "الـ Snackbar والـ Banner والـ Dialog، التلاتة ممكن يعرضوا رسايل." }
      - { t: 13.1, en: "But each one has a different priority, a different level of importance.", ar: "بس كل Component فيهم ليه Priority مختلفة، يعني درجة أهمية مختلفة." }
      - { t: 17.9, en: "The dialog has the highest priority when it appears in front of the user, especially a modal dialog.", ar: "الـ Dialog أعلى Priority، لما بيظهر قدّام اليوزر، خصوصًا لو كان Modal dialog." }
      - { t: 23.7, en: "It matters a lot: the user has to focus on it and can't do anything else until they close it.", ar: "أهميته عالية جدًا: اليوزر لازم يركّز معاه، ومش هيقدر يعمل أي حاجة تانية غير لما يقفله." }
      - { t: 29.3, en: "So that's high priority.", ar: "فده High priority." }
      - { t: 32.0, en: "The banner is medium priority: it appears at the top and it's clear,", ar: "الـ Banner بقى Medium priority: بيظهر فوق، وواضح،" }
      - { t: 36.7, en: "but it doesn't block the content the user is working on, so they don't have to stop and focus on it.", ar: "بس مش بيقفل الـ Content اللي اليوزر شغّال عليه، فمش محتاج يوقف ويركّز معاه." }
      - { t: 42.3, en: "It matters, but not very much,", ar: "أهميته كويسة، بس مش عالية أوي،" }
      - { t: 45.8, en: "and not as little as the snackbar, which shows at the bottom, disappears again and needs no interaction.", ar: "ومش قليلة زي الـ Snackbar، اللي بيظهر تحت ويختفي تاني، ومش محتاج Interaction." }
      - { t: 52.0, en: "The snackbar disappears on its own, unlike the banner, where I have to tap X, Close or an action to close it, or it stays.", ar: "الـ Snackbar بيختفي لوحده، عكس الـ Banner اللي لازم أدوس على X أو Close أو Action علشان يتقفل، وإلا هيفضل موجود." }
      - { t: 61.8, en: "So the banner stays until I deal with it,", ar: "يعني الـ Banner بيفضل لحد ما أتعامل معاه،" }
      - { t: 64.3, en: "and the dialog also needs an action to close it.", ar: "وبرضه زي الـ Dialog، اللي محتاج Action علشان يتقفل." }
      - { t: 67.8, en: "So this is a comparison of the components that let me give users messages in my system or product,", ar: "فدي مقارنة بين الـ Components اللي بتخلّيني أدّي رسايل لليوزر في الـ System أو الـ Product بتاعي،" }
      - { t: 75.8, en: "so I know which component to use for each context, priority and message I want to get across,", ar: "علشان أعرف أستخدم أنهي Component، حسب الـ Context والـ Priority والرسالة اللي عايز أوصّلها،" }
      - { t: 81.8, en: "and use them without annoying the user or giving them a bad experience.", ar: "وأستخدمهم من غير ما أضايق اليوزر أو أدّيله تجربة وحشة." }

  - id: S03
    type: card
    part: concept
    icons: [ok, warn, target]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "Three ways to tell people something, from quietest to loudest:\n\n- **Snackbar:** a short strip that disappears by itself. For news that needs no action, like \"Saved\". It can carry one action, such as Undo. Never for an error people must fix.\n- **Banner:** stays at the top of the screen until people close it or the problem is solved. For something that matters and lasts.\n- **Dialog:** blocks the screen until people answer. Only when they must respond now."
      ar: "ثلاث طرق لإخبار الناس بشيء، من الأهدأ إلى الأعلى صوتًا:\n\n- **الـ Snackbar:** شريط قصير يختفي وحده. لخبر لا يحتاج إجراءً، مثل «تم الحفظ». ويمكن أن يحمل إجراءً واحدًا، مثل «تراجع». ولا يُستخدم أبدًا لخطأ يجب أن يصلحه الناس.\n- **الـ Banner:** يبقى أعلى الشاشة حتى يغلقه الناس أو تُحلّ المشكلة. لشيء مهم ومستمر.\n- **الـ Dialog:** يحجب الشاشة حتى يردّ الناس. فقط حين يجب أن يردّوا الآن."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U01-05
    rules: [R06, R15]
    value:
      en: "Notifications (NN/g): passive notifications are typically not urgent and should be less intrusive. \"Place saved\" needs nothing from Reem, so blocking the screen or leaving a lasting banner is louder than it deserves."
      ar: "الإشعارات (NN/g): الإشعارات التي لا تحتاج إجراءً ليست عاجلة عادةً ويجب أن تكون أقل إزعاجًا. و«حُفظ المكان» لا يحتاج شيئًا من ريم، فحجب الشاشة أو ترك Banner دائم أعلى صوتًا مما يستحق."
    ref: { url: "https://www.nngroup.com/articles/indicators-validations-notifications/", quote: "Passive notifications are typically not urgent and should be less intrusive." }
    scenario:
      en: "Reem saves her home address as a favorite place. The save always works, and she can rename or remove it later from Favorites."
      ar: "تحفظ ريم عنوان بيتها كمكان مفضّل. والحفظ ينجح دائمًا، ويمكنها أن تغيّر اسمه أو تحذفه لاحقًا من «المفضّلة»."
    prompt:
      en: "Try each way of confirming the save. Which one should ship?"
      ar: "جرّب كل طريقة لتأكيد الحفظ. أيّ طريقة تخبر ريم بنجاح الحفظ دون أن توقفها؟"
    start: dialog
    options:
      - id: dialog
        text: { en: "A dialog: \"Place saved!\" with an OK button", ar: "Dialog: «تم حفظ المكان!» مع زر «حسنًا»" }
        mock:
          app: mishwar
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" }, back: true }
          blocks: &where
            - { kind: searchbar, text: { en: "Search for a place", ar: "ابحثي عن مكان" } }
            - { kind: small, text: { en: "Favorites", ar: "المفضّلة" }, gap: m }
            - { kind: listitem, icon: house-fill, text: { en: "Home", ar: "البيت" }, sub: { en: "12 Abbas El Akkad St", ar: "12 شارع عباس العقاد" }, value: { en: "★", ar: "★" } }
            - { kind: listitem, icon: briefcase, text: { en: "Office", ar: "المكتب" }, sub: { en: "90th St, New Cairo", ar: "شارع التسعين، القاهرة الجديدة" } }
            - { kind: listitem, icon: clock-counter-clockwise, text: { en: "City Stars Mall", ar: "سيتي ستارز" }, sub: { en: "Recent", ar: "مؤخرًا" } }
          overlay:
            type: dialog
            blocks:
              - { kind: heading, text: { en: "Place saved!", ar: "تم حفظ المكان!" } }
              - { kind: button, text: { en: "OK", ar: "حسنًا" }, gap: m }
      - id: snack
        text: { en: "A snackbar: \"Home saved\"", ar: "Snackbar: «تم حفظ البيت»" }
        mock:
          app: mishwar
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" }, back: true }
          blocks: *where
          overlay:
            type: toast
            blocks:
              - { kind: text, text: { en: "Home saved to Favorites.", ar: "تم حفظ «البيت» في المفضّلة." } }
      - id: banner
        text: { en: "A banner at the top that stays until she closes it", ar: "Banner في الأعلى يبقى حتى تغلقه" }
        mock:
          app: mishwar
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" }, back: true }
          blocks: *where
          overlay:
            type: banner
            close: true
            blocks:
              - { kind: text, text: { en: "Home saved to Favorites.", ar: "تم حفظ «البيت» في المفضّلة." } }
    answer: [snack]
    misconceptions:
      - id: MC-P14-013
        when: [dialog]
        feedback:
          en: "Reem has to stop and tap OK for news she didn't need to act on. That's the loudest message used for the quietest news."
          ar: "على ريم أن تتوقّف وتضغط «حسنًا» لخبر لا تحتاج أن تفعل معه شيئًا. وهذه أقوى رسالة لأبسط خبر."
      - id: MC-P14-013
        when: [banner]
        feedback:
          en: "Nothing is left to solve, yet the banner stays and takes space until Reem closes it. Good news can pass."
          ar: "لم يبقَ شيء لحلّه، ومع ذلك يبقى الـ Banner ويأخذ مساحة حتى تغلقه ريم. والخبر الجيد يكفيه أن يظهر ويختفي."
    correct:
      en: "No action needed: a snackbar."
      ar: "لا يحتاج إجراءً: Snackbar."
    explain:
      en: "The save worked and needs nothing from Reem. A snackbar tells her, then gets out of the way, so she can keep booking."
      ar: "نجح الحفظ ولا يحتاج شيئًا من ريم. والـ Snackbar يخبرها ثم يختفي، فتكمل الحجز."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U01-05
    rules: [R06, R15]
    value:
      en: "Notifications (NN/g): passive notifications are easily missed. A problem that lasts (receipts can't be sent until the email is verified) needs a message that stays visible until it's solved, without blocking every visit."
      ar: "الإشعارات (NN/g): الإشعارات التي لا تحتاج إجراءً يسهل أن تفوت الناس. والمشكلة المستمرة (لا تُرسل الإيصالات حتى يُؤكَّد البريد) تحتاج رسالة تبقى ظاهرة حتى تُحلّ، دون أن تحجب كل زيارة."
    ref: { url: "https://www.nngroup.com/articles/indicators-validations-notifications/", quote: "Passive notifications can easily be missed, since they require no user action." }
    scenario:
      en: "Reem hasn't confirmed her email address. Until she does, the app can't email her ride receipts, which she needs for work. She can still book rides."
      ar: "لم تؤكّد ريم بريدها الإلكتروني. وحتى تفعل، لا يستطيع التطبيق إرسال إيصالات المشاوير إليها، وهي تحتاجها للعمل. وما زالت تستطيع حجز المشاوير."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تُذكّر ريم بتأكيد بريدها حتى تفعل، دون أن تمنعها من حجز مشوار؟"
    start: snack
    options:
      - id: snack
        text: { en: "A snackbar each time she opens the app", ar: "Snackbar في كل مرة تفتح فيها التطبيق" }
        mock:
          app: mishwar
          appbar: { title: { en: "Your trips", ar: "مشاويرك" } }
          tabbar: &mtabs
            active: 1
            items:
              - { icon: car, text: { en: "Ride", ar: "مشوار" } }
              - { icon: clock-counter-clockwise, text: { en: "Trips", ar: "مشاويرك" } }
              - { icon: user, text: { en: "Account", ar: "حسابي" } }
          blocks: &trips
            - { kind: listitem, icon: car, text: { en: "Home", ar: "البيت" }, sub: { en: "Today, 6:40 pm", ar: "اليوم، 6:40 م" }, value: { en: "EGP 85", ar: "85 جنيه" } }
            - { kind: listitem, icon: car, text: { en: "Office", ar: "المكتب" }, sub: { en: "Yesterday, 8:15 am", ar: "أمس، 8:15 ص" }, value: { en: "EGP 70", ar: "70 جنيه" } }
            - { kind: listitem, icon: car, text: { en: "City Stars Mall", ar: "سيتي ستارز" }, sub: { en: "Mon, 4:05 pm", ar: "الإثنين، 4:05 م" }, value: { en: "EGP 60", ar: "60 جنيه" } }
          overlay:
            type: toast
            blocks:
              - { kind: text, text: { en: "Confirm your email to get receipts.", ar: "أكّدي بريدك لتصلك الإيصالات." } }
      - id: banner
        text: { en: "A banner on Your trips that stays until she confirms", ar: "Banner في «مشاويرك» يبقى حتى تؤكّد" }
        mock:
          app: mishwar
          appbar: { title: { en: "Your trips", ar: "مشاويرك" } }
          tabbar: *mtabs
          blocks:
            - { kind: banner, icon: envelope-simple, tone: warn, text: { en: "Confirm your email to get ride receipts.", ar: "أكّدي بريدك لتصلك إيصالات المشاوير." } }
            - { kind: link, text: { en: "Send confirmation email", ar: "أرسلوا لي رسالة التأكيد" }, gap: s }
            - { kind: listitem, icon: car, text: { en: "Home", ar: "البيت" }, sub: { en: "Today, 6:40 pm", ar: "اليوم، 6:40 م" }, value: { en: "EGP 85", ar: "85 جنيه" }, gap: m }
            - { kind: listitem, icon: car, text: { en: "Office", ar: "المكتب" }, sub: { en: "Yesterday, 8:15 am", ar: "أمس، 8:15 ص" }, value: { en: "EGP 70", ar: "70 جنيه" } }
      - id: dialog
        text: { en: "A dialog each time she opens the app", ar: "Dialog في كل مرة تفتح فيها التطبيق" }
        mock:
          app: mishwar
          appbar: { title: { en: "Your trips", ar: "مشاويرك" } }
          tabbar: *mtabs
          blocks: *trips
          overlay:
            type: dialog
            blocks:
              - { kind: heading, text: { en: "Confirm your email", ar: "أكّدي بريدك" } }
              - { kind: small, text: { en: "We can't send receipts until you do.", ar: "لا نستطيع إرسال الإيصالات حتى تفعلي." }, gap: s }
              - { kind: button, text: { en: "Send confirmation email", ar: "أرسلوا لي رسالة التأكيد" }, gap: m }
              - { kind: button, text: { en: "Later", ar: "لاحقًا" }, style: text, gap: s }
    answer: [banner]
    misconceptions:
      - id: MC-P14-014
        when: [snack]
        feedback:
          en: "The problem lasts, but the message keeps disappearing. Reem can miss it every time and only find out when a receipt never arrives."
          ar: "المشكلة مستمرة، لكن الرسالة تختفي كل مرة. فقد لا تنتبه لها ريم أبدًا، ولا تعرف إلا حين لا يصل الإيصال."
      - id: MC-P14-013
        when: [dialog]
        feedback:
          en: "Reem can still book rides, so nothing has to stop her. A dialog on every visit blocks her for something she can do later."
          ar: "ما زالت ريم تستطيع حجز المشاوير، فلا شيء يستدعي إيقافها. والـ Dialog في كل زيارة يحجبها من أجل شيء يمكنها فعله لاحقًا."
    correct:
      en: "Matters and lasts: a banner until it's solved."
      ar: "أمر مهم ويستمر: Banner يبقى حتى تُحلّ المشكلة."
    explain:
      en: "The banner stays where Reem looks for her trips, with the action that fixes it, and disappears once her email is confirmed. It never stops her from booking."
      ar: "الـ Banner يبقى حيث تبحث ريم عن مشاويرها، ومعه الإجراء الذي يحلّ المشكلة، ويختفي بمجرد تأكيد بريدها. ولا يمنعها أبدًا من الحجز."

  - id: S06
    type: compare
    speaker: rami
    part: contrast
    skill: SK-P14-U01-05
    rules: [R11]
    value:
      en: "Notifications (NN/g): passive notifications are easily missed because they need no action. Being offline lasts and changes what people's actions do, so a message that disappears after a few seconds leaves them unaware."
      ar: "الإشعارات (NN/g): الإشعارات التي لا تحتاج إجراءً يسهل أن تفوت الناس. وانقطاع الإنترنت يستمر ويغيّر نتيجة ما يفعله الناس، فالرسالة التي تختفي بعد ثوانٍ تتركهم غير منتبهين."
    ref: { url: "https://www.nngroup.com/articles/indicators-validations-notifications/", quote: "Passive notifications can easily be missed, since they require no user action." }
    scenario:
      en: "I'm designing a notes app. Khaled writes notes in it on the metro. His connection drops for 15 minutes. He can keep writing, but nothing is saved to his other devices until he is back online."
      ar: "أصمّم تطبيقًا للملاحظات. يكتب فيه خالد ملاحظاته وهو في المترو. وانقطع الإنترنت 15 دقيقة. يستطيع أن يستمر في الكتابة، لكن لا شيء يُحفظ على أجهزته الأخرى حتى يعود الاتصال."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تُبقي خالد يعرف طوال الانقطاع أن ملاحظاته لا تُحفظ على أجهزته الأخرى؟"
    a:
      label: { en: "Version A: a snackbar for 4 seconds", ar: "النسخة A: Snackbar لمدة 4 ثوانٍ" }
      mock:
        app: satr
        appbar: { title: { en: "Shopping list", ar: "قائمة المشتريات" }, back: true, actions: [ { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
        blocks:
          - { kind: small, text: { en: "Edited just now", ar: "عُدّلت الآن" } }
          - { kind: list, style: check, items: [ { en: "Bread", ar: "عيش" }, { en: "Eggs", ar: "بيض" }, { en: "Tea", ar: "شاي" }, { en: "Tomatoes", ar: "طماطم" } ], gap: s }
        keyboard: text
        overlay:
          type: toast
          blocks:
            - { kind: text, text: { en: "You're offline.", ar: "لا يوجد اتصال بالإنترنت." }, note: { en: "Disappears after 4 s", ar: "يختفي بعد 4 ثوانٍ" } }
    b:
      label: { en: "Version B: a banner while offline", ar: "النسخة B: Banner طوال الانقطاع" }
      mock:
        app: satr
        appbar: { title: { en: "Shopping list", ar: "قائمة المشتريات" }, back: true, actions: [ { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
        blocks:
          - { kind: banner, icon: wifi-slash, tone: warn, text: { en: "You're offline. Notes will sync when you're back online.", ar: "لا يوجد اتصال بالإنترنت. ستُزامَن ملاحظاتك حين يعود الاتصال." } }
          - { kind: small, text: { en: "Saved on this phone", ar: "محفوظة على هذا الهاتف" }, gap: s }
          - { kind: list, style: check, items: [ { en: "Bread", ar: "عيش" }, { en: "Eggs", ar: "بيض" }, { en: "Tea", ar: "شاي" }, { en: "Tomatoes", ar: "طماطم" } ], gap: s }
        keyboard: text
    answer: b
    misconceptions:
      - id: MC-P14-014
        when: [a]
        feedback:
          en: "Khaled is offline for 15 minutes, but the message lasts 4 seconds. If he looked away, he may think his notes are already on his laptop."
          ar: "خالد غير متصل 15 دقيقة، لكن الرسالة تبقى 4 ثوانٍ فقط. وإن لم ينتبه لها، قد يظنّ أن ملاحظاته وصلت إلى الـ Laptop."
    correct:
      en: "B: the message lasts as long as the problem."
      ar: "B: الرسالة تستمر ما دامت المشكلة."
    explain:
      en: "The banner stays the whole time Khaled is offline and tells him what it means for his notes. It disappears by itself once he's back online."
      ar: "الـ Banner يبقى طوال انقطاع الاتصال، ويخبر خالد بما يعنيه ذلك لملاحظاته. ويختفي وحده حين يعود الاتصال."

  - id: S07
    type: tune
    speaker: karim
    part: independent
    skill: SK-P14-U01-05
    rules: [R14]
    value:
      en: "Confirmation dialogs (NN/g): don't use confirmation dialogs for routine actions; people stop reading warnings they see too often. For an action that can be reversed, offer Undo instead, which a snackbar can carry."
      ar: "نوافذ التأكيد (NN/g): لا تستخدم نوافذ التأكيد للإجراءات الروتينية؛ فالناس يتوقّفون عن قراءة التحذيرات التي يرونها كثيرًا. وللإجراء الذي يمكن عكسه، قدّم «تراجع» بدلًا من ذلك، ويمكن أن يحمله الـ Snackbar."
    ref: { url: "https://www.nngroup.com/articles/confirmation-dialog/", quote: "Do not use confirmation dialogs for routine actions." }
    scenario:
      en: "I'm building a study website. Dina uses it on her laptop. She archives 10 to 20 old notes a week. Archived notes are never deleted; she can bring them back at any time."
      ar: "أبني موقعًا للمذاكرة. تستخدمه دينا على الـ Laptop. وتؤرشف من 10 إلى 20 ملاحظة قديمة كل أسبوع. والملاحظات المؤرشفة لا تُحذف أبدًا؛ ويمكنها استعادتها في أي وقت."
    prompt:
      en: "Try each version of what happens when she archives a note. Which one should ship?"
      ar: "جرّب ما يحدث في كل نسخة حين تؤرشف دينا ملاحظة. أيّ نسخة تحميها من الخطأ دون أن توقفها كل مرة؟"
    start: confirm
    options:
      - id: confirm
        text: { en: "A dialog each time: \"Archive this note?\"", ar: "Dialog كل مرة: «هل تؤرشفين هذه الملاحظة؟»" }
        mock:
          app: mozakra
          frame: wide
          url: mozakra.example/notes
          navbar: &znav { links: [ { en: "My notes", ar: "ملاحظاتي" }, { en: "Courses", ar: "الكورسات" }, { en: "Archive", ar: "الأرشيف" } ], active: 0, search: { en: "Search notes", ar: "ابحث في الملاحظات" }, actions: [ { icon: user } ] }
          blocks: &notes
            - { kind: heading, text: { en: "My notes", ar: "ملاحظاتي" } }
            - { kind: listitem, icon: file-text, text: { en: "Biology · Chapter 3", ar: "الأحياء · الفصل 3" }, sub: { en: "Edited 2 Oct", ar: "عُدّلت 2 أكتوبر" }, value: { en: "Archive", ar: "أرشفة" } }
            - { kind: listitem, icon: file-text, text: { en: "Physics · Revision", ar: "الفيزياء · مراجعة" }, sub: { en: "Edited 28 Sep", ar: "عُدّلت 28 سبتمبر" }, value: { en: "Archive", ar: "أرشفة" } }
            - { kind: listitem, icon: file-text, text: { en: "Chemistry · Lab 2", ar: "الكيمياء · المعمل 2" }, sub: { en: "Edited 21 Sep", ar: "عُدّلت 21 سبتمبر" }, value: { en: "Archive", ar: "أرشفة" } }
          overlay:
            type: dialog
            blocks:
              - { kind: heading, text: { en: "Archive this note?", ar: "هل تؤرشفين هذه الملاحظة؟" } }
              - { kind: button, text: { en: "Archive", ar: "أرشفة" }, gap: m }
              - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, style: text, gap: s }
      - id: undo
        text: { en: "Archive at once, with a snackbar: \"Note archived · Undo\"", ar: "أرشِف فورًا، مع Snackbar: «أُرشفت الملاحظة · تراجع»" }
        mock:
          app: mozakra
          frame: wide
          url: mozakra.example/notes
          navbar: *znav
          blocks: &notes2
            - { kind: heading, text: { en: "My notes", ar: "ملاحظاتي" } }
            - { kind: listitem, icon: file-text, text: { en: "Physics · Revision", ar: "الفيزياء · مراجعة" }, sub: { en: "Edited 28 Sep", ar: "عُدّلت 28 سبتمبر" }, value: { en: "Archive", ar: "أرشفة" } }
            - { kind: listitem, icon: file-text, text: { en: "Chemistry · Lab 2", ar: "الكيمياء · المعمل 2" }, sub: { en: "Edited 21 Sep", ar: "عُدّلت 21 سبتمبر" }, value: { en: "Archive", ar: "أرشفة" } }
          overlay:
            type: toast
            blocks:
              - kind: row
                blocks:
                  - { kind: text, text: { en: "Note archived.", ar: "أُرشفت الملاحظة." } }
                  - { kind: link, text: { en: "Undo", ar: "تراجع" } }
      - id: silent
        text: { en: "Archive at once, with no message", ar: "أرشِف فورًا، دون أي رسالة" }
        mock:
          app: mozakra
          frame: wide
          url: mozakra.example/notes
          navbar: *znav
          blocks: *notes2
    answer: [undo]
    misconceptions:
      - id: MC-P14-015
        when: [confirm]
        feedback:
          en: "Dina archives up to 20 notes a week, so she'll learn to click Archive without reading. And the action can be reversed anyway, so there's nothing to protect her from."
          ar: "تؤرشف دينا حتى 20 ملاحظة في الأسبوع، فستعتاد الضغط على «أرشفة» دون قراءة. والأرشفة يمكن التراجع عنها أصلًا، فلا يوجد خطر يحتاج حمايتها منه."
      - id: MC-P14-015
        when: [silent]
        feedback:
          en: "If Dina clicks the wrong note, the note just vanishes. She doesn't know it was archived or how to get it back quickly."
          ar: "إن ضغطت دينا على الملاحظة الخطأ، تختفي الملاحظة دون أي توضيح. ولا تعرف أنها أُرشفت أو كيف تستعيدها بسرعة."
    correct:
      en: "Reversible and routine: act, then offer Undo."
      ar: "يتكرّر كثيرًا ويمكن التراجع عنه: نفّذه، ثم قدّم «تراجع»."
    explain:
      en: "The snackbar tells Dina what happened and gives her one click to reverse a slip, without stopping her 20 times a week. Save the dialog for actions that can't be undone."
      ar: "الـ Snackbar يخبر دينا بما حدث، ويعطيها ضغطة واحدة لعكس الخطأ، دون أن يوقفها 20 مرة في الأسبوع. واحتفظ بالـ Dialog للإجراءات التي لا يمكن التراجع عنها."

  - id: S08
    type: card
    part: recap
    icons: [ok, warn, target]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Snackbar** for news that needs no action, with Undo when an action can be reversed.\n- **Banner** for something that matters and lasts, until it's solved.\n- **Dialog** only when people must answer now, like a failed payment that stops the task.\n\nNext: the skill check, on new cases."
      ar: "- **الـ Snackbar** لخبر لا يحتاج إجراءً، ومعه «تراجع» حين يمكن التراجع عنه.\n- **الـ Banner** لشيء مهم ومستمر، حتى يُحلّ.\n- **الـ Dialog** فقط حين يجب أن يردّ الناس الآن، مثل فشل الدفع الذي يوقف المهمة.\n\nالتالي: اختبار المهارة، على حالات جديدة."
