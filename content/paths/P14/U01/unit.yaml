id: P14-U01
free: true
title:
  en: "Interrupt only when it's worth it"
  ar: "لا تقاطع إلا حين يستحق الأمر"
skill:
  en: "Choose between a dialog, a bottom sheet, a tooltip, a banner and a snackbar by how much the moment needs people's attention."
  ar: "اختر بين النافذة (Dialog) والـ Bottom sheet والـ Tooltip والـ Banner والـ Snackbar حسب ما تحتاجه اللحظة من انتباه الناس."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U01-01
    title: { en: "Block the screen only when the task needs it", ar: "لا تحجب الشاشة إلا حين تحتاجه المهمة" }
    can_do: { en: "Use a modal dialog for a critical warning or for information the current task can't continue without, and never for unrelated offers, least of all in checkout.", ar: "استخدم الـ Modal dialog لتحذير مهم أو لمعلومة لا تكتمل المهمة الحالية دونها، ولا تستخدمه أبدًا لعروض لا علاقة لها بالمهمة، وخاصة أثناء الدفع." }
  - id: SK-P14-U01-02
    title: { en: "Keep decisions that need more information out of a modal", ar: "أبعِد القرارات التي تحتاج معلومات أكثر عن الـ Modal" }
    can_do: { en: "Move a decision out of a modal dialog when people need to check information the modal hides.", ar: "انقل القرار خارج الـ Modal dialog حين يحتاج الناس إلى مراجعة معلومات يُخفيها." }
  - id: SK-P14-U01-03
    title: { en: "Keep bottom sheets short, single and easy to close", ar: "اجعل الـ Bottom sheet قصيرًا ومنفردًا وسهل الإغلاق" }
    can_do: { en: "Use a bottom sheet for a quick task, never stack sheets or put a long flow in one, and give it a Close button that Back also respects.", ar: "استخدم الـ Bottom sheet لمهمة سريعة، ولا تكدّس الـ Sheets ولا تضع فيها مسارًا طويلًا، وأعطه زر إغلاق، واجعل زر الرجوع يغلقه أيضًا." }
  - id: SK-P14-U01-04
    title: { en: "Put only extra help in a tooltip", ar: "لا تضع في الـ Tooltip إلا مساعدة إضافية" }
    can_do: { en: "Keep what people need to finish a task on the screen, and use a tooltip only for brief, useful extra help that works without a mouse.", ar: "أبقِ ما يحتاجه الناس لإنهاء المهمة ظاهرًا على الشاشة، واستخدم الـ Tooltip فقط لمساعدة إضافية قصيرة ومفيدة تعمل دون فأرة." }
  - id: SK-P14-U01-05
    title: { en: "Match the message to how much it matters", ar: "اجعل الرسالة على قدر أهميتها" }
    can_do: { en: "Use a snackbar for low-priority news that needs no action, a banner for something that stays until it's resolved, and a dialog only when people must respond now.", ar: "استخدم الـ Snackbar لخبر قليل الأهمية لا يحتاج إجراءً، والـ Banner لشيء يبقى حتى يُحلّ، والـ Dialog فقط حين يجب أن يردّ الناس الآن." }
