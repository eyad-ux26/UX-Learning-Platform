id: P14-U02-L02
mode: lesson
minutes: 8
title:
  en: "One loud button, the rest in reach"
  ar: "زر واحد واضح، والباقي في المتناول"
speaker: nour
sources:
  - title: { en: "Similarity Principle in Visual Design (NN/g)", ar: "مبدأ التشابه في التصميم المرئي (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-similarity/"
  - title: { en: "Designing Effective Contextual Menus: 10 Guidelines (NN/g)", ar: "تصميم قوائم السياق الفعّالة: 10 إرشادات (NN/g)" }
    url: "https://www.nngroup.com/articles/contextual-menus-guidelines/"
review_labels:
  MC-P14-019: { en: "Same style reads as same importance", ar: "الشكل نفسه يعني الأهمية نفسها" }
  MC-P14-020: { en: "The loudest button belongs to the step forward", ar: "أوضح زر من حق الخطوة إلى الأمام" }
  MC-P14-021: { en: "Don't hide what people use often", ar: "لا تُخفِ ما يستخدمه الناس كثيرًا" }
  MC-P14-022: { en: "Rare actions don't need a button each", ar: "الإجراءات النادرة لا تحتاج زرًا لكل منها" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Ashraf's appointment", ar: "موعد أشرف" }
    body:
      en: "I manage a clinic, and Ashraf is booking a check-up in our app. On the last screen, he sees four buttons, all the same size and the same blue: **Confirm booking**, **Change time**, **Add to calendar** and **Cancel**.\n\nHe stops and reads all four before he dares to tap one."
      ar: "أدير عيادة، ويحجز أشرف كشفًا في تطبيقنا. وفي الشاشة الأخيرة، يرى أربعة أزرار، كلها بالحجم نفسه واللون الأزرق نفسه: **أكّد الحجز**، و**غيّر الموعد**، و**أضف إلى التقويم**، و**إلغاء**.\n\nفيتوقّف ويقرأ الأربعة قبل أن يجرؤ على الضغط على أحدها."
    mock:
      app: raha
      appbar: &rbar { title: { en: "Your appointment", ar: "موعدك" }, back: true }
      blocks: &visit
        - { kind: listitem, avatar: { text: "Samia Hassan", art: doctor }, text: { en: "Dr. Samia", ar: "د. سامية" }, sub: { en: "Family doctor · 4.8 ★", ar: "طبيبة أسرة · 4.8 ★" } }
        - { kind: listitem, icon: calendar-blank, text: { en: "Sun 10:30 am", ar: "الأحد 10:30 ص" }, sub: { en: "Raha Clinic, Dokki", ar: "عيادة راحة، الدقي" }, value: { en: "EGP 450", ar: "450 جنيه" }, gap: s }
      footer:
        - { kind: button, text: { en: "Confirm booking", ar: "أكّد الحجز" } }
        - { kind: button, text: { en: "Change time", ar: "غيّر الموعد" }, gap: s }
        - { kind: button, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: s }
        - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, gap: s }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U02-03
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Similarity (NN/g): same-color buttons are seen as equally important, so a separate color is kept for the primary action. A rainbow of colors still makes every button compete, and bold text alone doesn't separate them."
      ar: "جرّب أولًا. مبدأ التشابه (NN/g): الأزرار ذات اللون نفسه تبدو متساوية في الأهمية، لذلك يُخصَّص لون منفصل للإجراء الرئيسي. وتلوين كل زر بلون مختلف يجعل الأزرار كلها تتنافس، والخط العريض وحده لا يميّزها."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Same-color buttons will be perceived as sharing the same level of importance." }
    prompt:
      en: "Try each version of the last screen. Which one should ship?"
      ar: "جرّب كل نسخة من الشاشة الأخيرة. أيّها يجب أن تُطلق؟"
    start: colors
    options:
      - id: colors
        text: { en: "Give each button its own color", ar: "أعطِ كل زر لونًا خاصًا به" }
        mock:
          app: raha
          appbar: *rbar
          blocks: *visit
          footer:
            - { kind: button, text: { en: "Confirm booking", ar: "أكّد الحجز" } }
            - { kind: button, tone: warn, text: { en: "Change time", ar: "غيّر الموعد" }, gap: s }
            - { kind: button, tone: off, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: s }
            - { kind: button, style: danger, text: { en: "Cancel", ar: "إلغاء" }, gap: s }
      - id: one
        text: { en: "Keep Confirm filled; make the other three outlined or text", ar: "أبقِ «أكّد الحجز» ممتلئًا؛ واجعل الثلاثة الأخرى بإطار فقط أو نصًا" }
        mock:
          app: raha
          appbar: *rbar
          blocks: *visit
          footer:
            - { kind: button, text: { en: "Confirm booking", ar: "أكّد الحجز" } }
            - { kind: button, style: outline, icon: clock, text: { en: "Change time", ar: "غيّر الموعد" }, gap: s }
            - { kind: button, style: outline, icon: calendar-plus, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: s }
            - { kind: button, style: text, text: { en: "Cancel", ar: "إلغاء" }, gap: s }
      - id: bold
        text: { en: "Keep all four blue; make the Confirm label bold and bigger", ar: "أبقِ الأربعة باللون الأزرق؛ واجعل نص «أكّد الحجز» عريضًا وأكبر" }
        mock:
          app: raha
          appbar: *rbar
          blocks: *visit
          footer:
            - { kind: button, px: 19, text: { en: "Confirm booking", ar: "أكّد الحجز" } }
            - { kind: button, text: { en: "Change time", ar: "غيّر الموعد" }, gap: s }
            - { kind: button, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: s }
            - { kind: button, text: { en: "Cancel", ar: "إلغاء" }, gap: s }
    answer: [one]
    misconceptions:
      - id: MC-P14-019
        when: [colors]
        feedback:
          en: "Now every button shouts in a different color, and red Cancel is the loudest. Ashraf still has to read all four to find the one that books."
          ar: "الآن كل زر يصرخ بلون مختلف، و«إلغاء» الأحمر هو الأعلى صوتًا. وما زال على أشرف أن يقرأ الأربعة ليجد الزر الذي يحجز."
      - id: MC-P14-019
        when: [bold]
        feedback:
          en: "Four identical blue blocks still look equally important. A slightly bigger label doesn't tell Ashraf which one moves him forward."
          ar: "أربع كتل زرقاء متطابقة ما زالت تبدو متساوية في الأهمية. والنص الأكبر قليلًا لا يقول لأشرف أيّها ينقله إلى الأمام."
    hints:
      - en: "Which version gives only one button the filled blue?"
        ar: "أيّ نسخة تعطي زرًا واحدًا فقط اللون الأزرق الممتلئ؟"
    correct:
      en: "One filled button: the step forward."
      ar: "زر واحد ممتلئ: الخطوة إلى الأمام."
    explain:
      en: "Ashraf's eye goes straight to the only filled button, Confirm booking. The other actions are still there, quieter, for when he needs them."
      ar: "تذهب عين أشرف مباشرة إلى الزر الممتلئ الوحيد، «أكّد الحجز». والإجراءات الأخرى ما زالت موجودة، بشكل أهدأ، حين يحتاجها."

  - id: S09
    type: video
    part: concept
    title: { en: "One loud action, the rest in reach", ar: "إجراء واحد واضح، والباقي في المتناول" }
    video: b643d63e-6c5a-4129-b2d6-a64304d62889
    duration: 50
    transcript:
      - { t: 2.5, en: "Looking at the Material Design guidelines, we learn that a button is a component that lets me take an action, so I don't need one for every single action,", ar: "لو شفنا الـ Guidelines بتاعة الـ Material Design، هنعرف إن الـ Button نوع من الـ Components اللي بتخلّيني آخد Action، وبالتالي مش محتاج أستخدمه بشكل كبير لكل Action،" }
      - { t: 13.12, en: "putting a button for anything I add to the page, especially when the buttons are all the same type we just covered, say, all filled.", ar: "وكل ما أحتاج أحطّ حاجة في الصفحة أحطّ لها Button، بالذات لو الـ Buttons كلها من نفس الـ Type، من الأنواع اللي قلناها من شوية، لو حطّيتهم كلهم Filled مثلًا." }
      - { t: 22.74, en: "Put several buttons on one screen and it gets annoying: too many actions. I may not need to show all those actions at all; I can group some of them in a menu, for example,", ar: "لو حطّيت أكتر من Button في نفس الـ Screen، الموضوع بيبقى مزعج، Actions كتير. ممكن أصلًا ماكنتش محتاج أعرض الـ Actions دي كلها، وأقدر أجمع مجموعة منها في Menu مثلًا،" }
      - { t: 32.58, en: "or in any other component that helps the user take an action. But using many buttons on one screen isn't the best, especially of the same type. That's our first guideline.", ar: "أو في أي Component تانية بتساعد اليوزر ياخد Action. لكن مش أفضل حاجة إني أستخدم Buttons كتير في نفس الـ Screen، بالذات لو من نفس النوع. ودي أول Guideline معانا." }

  - id: S03
    type: card
    part: concept
    icons: [warn, tap, layers, list]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "Buttons that look the same look equally important.\n\n- **Not a button for every action:** a screen full of filled buttons is noisy, and nothing stands out.\n- **One filled button** per area, in its own color, for the action that moves people forward.\n- **Quieter styles** for the rest: outlined, or text only. They stay easy to find, without competing.\n- **Frequent actions stay on the screen. Rare, low-priority ones can go into a ⋯ menu** or another component. People find and use hidden actions less, so never hide the ones they use often."
      ar: "الأزرار التي تبدو متشابهة تبدو متساوية في الأهمية.\n\n- **لا تضع زرًا لكل إجراء:** الشاشة المليئة بأزرار ممتلئة مزعجة، ولا يبرز فيها شيء.\n- **زر واحد ممتلئ** في كل منطقة، بلون خاص به، للإجراء الذي ينقل الناس إلى الأمام.\n- **أشكال أهدأ** للباقي: بإطار فقط، أو نص فقط. فتبقى سهلة الإيجاد، دون أن تتنافس.\n- **الإجراءات المتكرّرة تبقى على الشاشة. والنادرة قليلة الأهمية يمكن أن تذهب إلى قائمة ⋯** أو Component أخرى. فالناس يجدون الإجراءات المخفية ويستخدمونها أقل، لذلك لا تُخفِ أبدًا ما يستخدمونه كثيرًا."

  - id: S04
    type: tune
    speaker: youssef
    part: guided
    skill: SK-P14-U02-03
    rules: [R06, R15]
    value:
      en: "Similarity (NN/g): a separate color is reserved for the primary call to action so it stands out among secondary buttons. In a cart, the step forward is Checkout; giving that color to Continue shopping points people backwards."
      ar: "مبدأ التشابه (NN/g): يُخصَّص لون منفصل للإجراء الرئيسي حتى يبرز بين الأزرار الثانوية. وفي السلّة، الخطوة إلى الأمام هي «إتمام الشراء»؛ وإعطاء هذا اللون لـ«متابعة التسوّق» يوجّه الناس إلى الخلف."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Thus, a separate color should be reserved for primary calls-to-action to help them stand out among secondary buttons." }
    scenario:
      en: "My clothing shop has an app. Salma has three items in her cart. At the bottom of the cart are two buttons: **Checkout** and **Continue shopping**."
      ar: "لمتجر الملابس الذي أملكه تطبيق. في سلّة سلمى ثلاث قطع. وفي أسفل السلّة زرّان: **إتمام الشراء** و**متابعة التسوّق**."
    prompt:
      en: "Try each version of the cart. Which one should ship?"
      ar: "جرّب كل نسخة من السلّة. أيّها يجب أن تُطلق؟"
    start: both
    options:
      - id: both
        text: { en: "Both buttons filled", ar: "الزرّان ممتلئان" }
        mock:
          app: dar
          appbar: &dbar { title: { en: "Cart (3)", ar: "السلّة (3)" }, back: true }
          blocks: &cart
            - { kind: listitem, art: sneakers, text: { en: "Running shoes", ar: "حذاء جري" }, sub: { en: "Size 42 · Qty 1", ar: "مقاس 42 · الكمية 1" }, value: { en: "EGP 950", ar: "950 جنيه" } }
            - { kind: listitem, art: shirt, text: { en: "Cotton T-shirt", ar: "تيشيرت قطن" }, sub: { en: "M · Qty 2", ar: "M · الكمية 2" }, value: { en: "EGP 500", ar: "500 جنيه" } }
            - { kind: divider, gap: s }
            - kind: row
              gap: s
              blocks:
                - { kind: text, weight: bold, text: { en: "Total", ar: "الإجمالي" } }
                - { kind: price, text: { en: "EGP 1,450", ar: "1,450 جنيه" } }
          footer:
            - { kind: button, text: { en: "Continue shopping", ar: "متابعة التسوّق" } }
            - { kind: button, text: { en: "Checkout", ar: "إتمام الشراء" }, gap: s }
      - id: reversed
        text: { en: "Continue shopping filled; Checkout outlined", ar: "«متابعة التسوّق» ممتلئ؛ و«إتمام الشراء» بإطار فقط" }
        mock:
          app: dar
          appbar: *dbar
          blocks: *cart
          footer:
            - { kind: button, text: { en: "Continue shopping", ar: "متابعة التسوّق" } }
            - { kind: button, style: outline, text: { en: "Checkout", ar: "إتمام الشراء" }, gap: s }
      - id: checkout
        text: { en: "Checkout filled; Continue shopping as a text button", ar: "«إتمام الشراء» ممتلئ؛ و«متابعة التسوّق» زر نصي" }
        mock:
          app: dar
          appbar: *dbar
          blocks: *cart
          footer:
            - { kind: button, text: { en: "Checkout", ar: "إتمام الشراء" } }
            - { kind: button, style: text, text: { en: "Continue shopping", ar: "متابعة التسوّق" }, gap: s }
    answer: [checkout]
    misconceptions:
      - id: MC-P14-019
        when: [both]
        feedback:
          en: "Two filled buttons look equally important, so Salma has to read both. Nothing tells her which one finishes the order."
          ar: "الزرّان الممتلئان يبدوان متساويين في الأهمية، فعلى سلمى أن تقرأ الاثنين. ولا شيء يقول لها أيّهما يُنهي الطلب."
      - id: MC-P14-020
        when: [reversed]
        feedback:
          en: "The loudest button now sends Salma away from her cart. The step that finishes her order is the one that looks less important."
          ar: "أوضح زر الآن يُبعد سلمى عن سلّتها. والخطوة التي تُنهي طلبها هي التي تبدو أقل أهمية."
    correct:
      en: "Filled for the step forward: Checkout."
      ar: "الممتلئ للخطوة إلى الأمام: «إتمام الشراء»."
    explain:
      en: "Salma came to the cart to pay, so Checkout gets the filled style. Continue shopping is still one tap away, just quieter."
      ar: "جاءت سلمى إلى السلّة لتدفع، لذلك يأخذ «إتمام الشراء» الشكل الممتلئ. و«متابعة التسوّق» ما زال على بُعد ضغطة واحدة، لكن بشكل أهدأ."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U02-04
    rules: [R06, R15]
    confidence: true
    value:
      en: "Contextual menus (NN/g): they're best for secondary or low-priority options, not for actions people rely on often. Message is used often, so it stays visible; Share and Report are rare, so they can go in the ⋯ menu."
      ar: "قوائم السياق (NN/g): أفضل استخدام لها للخيارات الثانوية أو قليلة الأهمية، لا للإجراءات التي يعتمد عليها الناس كثيرًا. و«راسل» يُستخدم كثيرًا، فيبقى ظاهرًا؛ أما «شارك» و«أبلِغ» فنادران، فيمكن أن يذهبا إلى قائمة ⋯."
    ref: { url: "https://www.nngroup.com/articles/contextual-menus-guidelines/", quote: "Contextual menus are not appropriate for actions users rely on frequently." }
    scenario:
      en: "On a doctor's page in our clinic app, most patients tap **Book**. Many also tap **Message** to ask a question first. **Share** and **Report a problem** are rarely used."
      ar: "في صفحة الطبيب في تطبيق عيادتنا، أغلب المرضى يضغطون **احجز**. وكثيرون يضغطون أيضًا **راسل** ليسألوا سؤالًا أولًا. أما **شارك** و**أبلِغ عن مشكلة** فنادرًا ما يُستخدمان."
    prompt:
      en: "Try each version of the doctor's page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الطبيب. أيّها يجب أن تُطلق؟"
    start: all
    options:
      - id: all
        text: { en: "All four as buttons", ar: "الأربعة كأزرار" }
        mock:
          app: raha
          appbar: { title: { en: "Doctor", ar: "الطبيبة" }, back: true }
          blocks: &doc
            - { kind: avatar, text: "Samia Hassan", art: doctor, size: l }
            - { kind: title, text: { en: "Dr. Samia", ar: "د. سامية" }, gap: s }
            - { kind: meta, text: { en: "Family doctor · 4.8 ★ · 12 years", ar: "طبيبة أسرة · 4.8 ★ · 12 سنة خبرة" }, gap: xs }
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
            - { kind: button, style: outline, text: { en: "Message", ar: "راسل" }, gap: s }
            - { kind: button, style: outline, text: { en: "Share", ar: "شارك" }, gap: s }
            - { kind: button, style: outline, text: { en: "Report a problem", ar: "أبلِغ عن مشكلة" }, gap: s }
      - id: menu3
        text: { en: "Book as a button; Message, Share and Report in a ⋯ menu", ar: "«احجز» كزر؛ و«راسل» و«شارك» و«أبلِغ» في قائمة ⋯" }
        mock:
          app: raha
          appbar: &dmenu { title: { en: "Doctor", ar: "الطبيبة" }, back: true, actions: [ { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
          blocks: *doc
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
      - id: menu2
        text: { en: "Book and Message as buttons; Share and Report in a ⋯ menu", ar: "«احجز» و«راسل» كزرّين؛ و«شارك» و«أبلِغ» في قائمة ⋯" }
        mock:
          app: raha
          appbar: *dmenu
          blocks: *doc
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
            - { kind: button, style: outline, text: { en: "Message", ar: "راسل" }, gap: s }
    answer: [menu2]
    misconceptions:
      - id: MC-P14-022
        when: [all]
        feedback:
          en: "Share and Report are rarely used, yet they take as much room as Message. Four buttons in a stack make the page busier for everyone."
          ar: "«شارك» و«أبلِغ» نادرًا ما يُستخدمان، ومع ذلك يأخذان مساحة «راسل» نفسها. وأربعة أزرار متتالية تجعل الصفحة أكثر ازدحامًا للجميع."
      - id: MC-P14-021
        when: [menu3]
        feedback:
          en: "Many patients message before they book, and now Message is hidden behind ⋯. Some of them won't find it at all."
          ar: "كثير من المرضى يراسلون قبل الحجز، والآن «راسل» مخفي خلف ⋯. وبعضهم لن يجده أصلًا."
    hints:
      - en: "Which actions do many patients use, and which are rare?"
        ar: "أيّ الإجراءات يستخدمها كثير من المرضى، وأيّها نادر؟"
    correct:
      en: "Often used: on screen. Rare: in the menu."
      ar: "المتكرّر: على الشاشة. والنادر: في القائمة."
    explain:
      en: "Book and Message, the two actions most patients use, are one tap away. Share and Report wait in ⋯ for the few who need them."
      ar: "«احجز» و«راسل»، الإجراءان اللذان يستخدمهما أغلب المرضى، على بُعد ضغطة واحدة. و«شارك» و«أبلِغ» ينتظران في ⋯ للقلّة التي تحتاجهما."

  - id: S06
    type: compare
    speaker: sara
    part: contrast
    skill: SK-P14-U02-04
    rules: [R11]
    value:
      en: "Contextual menus (NN/g): people are less likely to find or use actions hidden in a menu. Tamer edits most of his photos, so Edit hidden behind ⋯ costs him an extra tap on almost every photo, and some people never find it."
      ar: "قوائم السياق (NN/g): الناس أقل قدرة على إيجاد أو استخدام الإجراءات المخفية في قائمة. وتامر يعدّل أغلب صوره، فإخفاء «عدّل» خلف ⋯ يكلّفه ضغطة إضافية في كل صورة تقريبًا، وبعض الناس لا يجدونه أبدًا."
    ref: { url: "https://www.nngroup.com/articles/contextual-menus-guidelines/", quote: "Users are less likely to find or use actions hidden in contextual menus" }
    scenario:
      en: "I'm designing a photo app. Tamer edits most photos in it before he posts them. He deletes a photo now and then, and almost never opens a photo's details."
      ar: "أصمّم تطبيقًا للصور. يعدّل فيه تامر أغلب الصور قبل أن ينشرها. ويحذف صورة من حين لآخر، ونادرًا جدًا ما يفتح تفاصيل صورة."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: Edit, Delete and Details all in ⋯", ar: "النسخة A: «عدّل» و«احذف» و«التفاصيل» كلها في ⋯" }
      mock:
        app: suwar
        theme: dark
        appbar: &vbar { title: { en: "Beach, June", ar: "البحر، يونيو" }, back: true, actions: [ { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
        blocks:
          - { kind: image, art: beach, size: l, alt: { en: "Beach photo", ar: "صورة البحر" } }
          - { kind: meta, text: { en: "12 June · 3.2 MB", ar: "12 يونيو · 3.2 ميجابايت" }, gap: s }
    b:
      label: { en: "Version B: Edit on screen; Delete and Details in ⋯", ar: "النسخة B: «عدّل» على الشاشة؛ و«احذف» و«التفاصيل» في ⋯" }
      mock:
        app: suwar
        theme: dark
        appbar: *vbar
        blocks:
          - { kind: image, art: beach, size: l, alt: { en: "Beach photo", ar: "صورة البحر" } }
          - { kind: meta, text: { en: "12 June · 3.2 MB", ar: "12 يونيو · 3.2 ميجابايت" }, gap: s }
          - { kind: button, style: outline, icon: pencil-simple, text: { en: "Edit", ar: "عدّل" }, gap: s }
    answer: b
    misconceptions:
      - id: MC-P14-021
        when: [a]
        feedback:
          en: "Tamer edits almost every photo, so he'd open ⋯ almost every time. The action he uses most is the hardest one to reach."
          ar: "تامر يعدّل كل صورة تقريبًا، فسيفتح ⋯ كل مرة تقريبًا. والإجراء الذي يستخدمه أكثر صار أصعب إجراء في الوصول."
    correct:
      en: "B: the action he uses most stays in sight."
      ar: "B: الإجراء الذي يستخدمه أكثر يبقى ظاهرًا."
    explain:
      en: "Edit is one tap on every photo. Delete and Details are rare, so the menu keeps them close without crowding the screen."
      ar: "«عدّل» على بُعد ضغطة واحدة في كل صورة. و«احذف» و«التفاصيل» نادران، فالقائمة تُبقيهما قريبين دون أن تزدحم الشاشة."

  - id: S07
    type: tune
    speaker: karim
    part: independent
    skill: SK-P14-U02-03
    rules: [R14]
    value:
      en: "Similarity (NN/g): when the submit button looks like the secondary actions, people spend time working out which one submits. Three outlined buttons at the end of an application leave Heba guessing; three filled ones do too."
      ar: "مبدأ التشابه (NN/g): حين يشبه زر الإرسال الإجراءات الثانوية، يضيّع الناس وقتًا ليعرفوا أيّها يرسل. وثلاثة أزرار بإطار فقط في نهاية طلب التوظيف تترك هبة تخمّن؛ وثلاثة ممتلئة كذلك."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Same-color buttons will be perceived as sharing the same level of importance." }
    scenario:
      en: "I'm building a company's careers website. Heba is applying for a job on it, on her laptop. At the end of the form are three buttons: **Preview**, **Save draft** and **Submit application**. Right now they're all outlined."
      ar: "أبني موقع التوظيف لشركة. تتقدّم فيه هبة لوظيفة، من اللابتوب. وفي نهاية النموذج ثلاثة أزرار: **معاينة**، و**احفظ مسودة**، و**أرسل الطلب**. وكلها الآن بإطار فقط."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: outlined
    options:
      - id: submit
        text: { en: "Submit filled; Preview and Save draft outlined", ar: "«أرسل الطلب» ممتلئ؛ و«معاينة» و«احفظ مسودة» بإطار فقط" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply/review
          navbar: &wnav { links: [ { en: "Jobs", ar: "الوظائف" }, { en: "My applications", ar: "طلباتي" }, { en: "Profile", ar: "الملف" } ], active: 1, actions: [ { icon: bell }, { icon: user } ] }
          blocks:
            - { kind: progress, value: 100, label: { en: "Step 4 of 4", ar: "الخطوة 4 من 4" } }
            - { kind: heading, text: { en: "Review and send", ar: "راجِعي وأرسلي" }, gap: s }
            - { kind: listitem, icon: briefcase, text: { en: "Product designer · Cairo", ar: "مصممة منتجات · القاهرة" }, sub: { en: "CV and portfolio attached", ar: "السيرة الذاتية والأعمال مرفقة" }, gap: s }
            - kind: row
              gap: l
              blocks:
                - { kind: button, style: outline, text: { en: "Preview", ar: "معاينة" } }
                - { kind: button, style: outline, text: { en: "Save draft", ar: "احفظي مسودة" } }
                - { kind: button, text: { en: "Submit application", ar: "أرسلي الطلب" } }
      - id: outlined
        text: { en: "Keep all three outlined", ar: "أبقِ الثلاثة بإطار فقط" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply/review
          navbar: *wnav
          blocks:
            - { kind: progress, value: 100, label: { en: "Step 4 of 4", ar: "الخطوة 4 من 4" } }
            - { kind: heading, text: { en: "Review and send", ar: "راجِعي وأرسلي" }, gap: s }
            - { kind: listitem, icon: briefcase, text: { en: "Product designer · Cairo", ar: "مصممة منتجات · القاهرة" }, sub: { en: "CV and portfolio attached", ar: "السيرة الذاتية والأعمال مرفقة" }, gap: s }
            - kind: row
              gap: l
              blocks:
                - { kind: button, style: outline, text: { en: "Preview", ar: "معاينة" } }
                - { kind: button, style: outline, text: { en: "Save draft", ar: "احفظي مسودة" } }
                - { kind: button, style: outline, text: { en: "Submit application", ar: "أرسلي الطلب" } }
      - id: filled
        text: { en: "Make all three filled", ar: "اجعل الثلاثة ممتلئة" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply/review
          navbar: *wnav
          blocks:
            - { kind: progress, value: 100, label: { en: "Step 4 of 4", ar: "الخطوة 4 من 4" } }
            - { kind: heading, text: { en: "Review and send", ar: "راجِعي وأرسلي" }, gap: s }
            - { kind: listitem, icon: briefcase, text: { en: "Product designer · Cairo", ar: "مصممة منتجات · القاهرة" }, sub: { en: "CV and portfolio attached", ar: "السيرة الذاتية والأعمال مرفقة" }, gap: s }
            - kind: row
              gap: l
              blocks:
                - { kind: button, text: { en: "Preview", ar: "معاينة" } }
                - { kind: button, text: { en: "Save draft", ar: "احفظي مسودة" } }
                - { kind: button, text: { en: "Submit application", ar: "أرسلي الطلب" } }
    answer: [submit]
    misconceptions:
      - id: MC-P14-019
        when: [outlined, filled]
        feedback:
          en: "All three look the same, so Heba has to read each label to find the one that sends her application. Same style, same importance."
          ar: "الثلاثة تبدو متشابهة، فعلى هبة أن تقرأ كل نص لتجد الزر الذي يرسل طلبها. الشكل نفسه، الأهمية نفسها."
    correct:
      en: "One filled button: Submit."
      ar: "زر واحد ممتلئ: «أرسل الطلب»."
    explain:
      en: "Submit is the step Heba came to take, so it alone is filled. Preview and Save draft are still right there, without competing with it."
      ar: "الإرسال هو الخطوة التي جاءت هبة لتنفّذها، لذلك هو وحده الممتلئ. و«معاينة» و«احفظ مسودة» ما زالا بجانبه، دون أن ينافساه."

  - id: S08
    type: card
    part: recap
    icons: [tap, layers, list]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **One filled button** per area, for the step forward: Confirm, Checkout, Submit.\n- **Quieter styles** for the other actions, so they don't compete.\n- **Frequent actions on screen**, rare ones in a ⋯ menu.\n\nNext: when an action earns a floating button."
      ar: "- **زر واحد ممتلئ** في كل منطقة، للخطوة إلى الأمام: التأكيد، أو إتمام الشراء، أو الإرسال.\n- **أشكال أهدأ** للإجراءات الأخرى، حتى لا تتنافس.\n- **الإجراءات المتكرّرة على الشاشة**، والنادرة في قائمة ⋯.\n\nالتالي: متى يستحق إجراءٌ زرًا عائمًا."
