id: P14-U02-L05
mode: check
minutes: 7
title:
  en: "Skill check: show what's needed, make the next step obvious"
  ar: "اختبار المهارة: أظهر المطلوب، ووضّح الخطوة التالية"
speaker: mona
sources:
  - title: { en: "Accordions on Desktop: When and How to Use (NN/g)", ar: "الـ Accordion على الكمبيوتر: متى وكيف نستخدمه (NN/g)" }
    url: "https://www.nngroup.com/articles/accordions-on-desktop/"
  - title: { en: "Similarity Principle in Visual Design (NN/g)", ar: "مبدأ التشابه في التصميم المرئي (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-similarity/"
  - title: { en: "Designing Effective Contextual Menus: 10 Guidelines (NN/g)", ar: "تصميم قوائم السياق الفعّالة: 10 إرشادات (NN/g)" }
    url: "https://www.nngroup.com/articles/contextual-menus-guidelines/"
  - title: { en: "User-Interface Elements: Glossary (NN/g)", ar: "عناصر واجهة المستخدم: مسرد المصطلحات (NN/g)" }
    url: "https://www.nngroup.com/articles/ui-elements-glossary/"
  - title: { en: "Icon Usability (NN/g)", ar: "سهولة استخدام الأيقونات (NN/g)" }
    url: "https://www.nngroup.com/articles/icon-usability/"
  - title: { en: "Proximity Principle in Visual Design (NN/g)", ar: "مبدأ التقارب في التصميم المرئي (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-proximity/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mona's travel app", ar: "تطبيق منى للسفر" }
    body:
      en: "My team is about to launch an app for booking hotels. Help me review six screens before launch.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "فريقي على وشك إطلاق تطبيق لحجز الفنادق. ساعدني في مراجعة ست شاشات فيه قبل الإطلاق.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."

  - id: S02
    type: tune
    part: check
    skill: SK-P14-U02-03
    value:
      en: "Check, similarity (NN/g): a separate color is reserved for the primary action. On the payment screen, that's Pay; giving the filled style to Apply promo code, or to all three, hides the step forward."
      ar: "اختبار، مبدأ التشابه (NN/g): يُخصَّص لون منفصل للإجراء الرئيسي. وفي شاشة الدفع، هذا الإجراء هو «ادفع»؛ وإعطاء الشكل الممتلئ لـ«استخدم كود الخصم»، أو للثلاثة، يُخفي الخطوة إلى الأمام."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Thus, a separate color should be reserved for primary calls-to-action to help them stand out among secondary buttons." }
    scenario:
      en: "The payment screen has three buttons: **Pay EGP 4,200**, **Apply promo code** and **Back**. Right now, all three are filled."
      ar: "في شاشة الدفع ثلاثة أزرار: **ادفع 4,200 جنيه**، و**استخدم كود الخصم**، و**رجوع**. وكلها الآن ممتلئة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل عين الناس تذهب مباشرة إلى خطوة الدفع، مع بقاء الخيارات الأخرى سهلة الإيجاد؟"
    start: all
    options:
      - id: all
        text: { en: "Keep all three filled", ar: "أبقِ الثلاثة ممتلئة" }
        mock:
          app: nuzul
          appbar: &pbar { title: { en: "Payment", ar: "الدفع" }, back: true }
          blocks: &pay
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "3 nights · 12 to 15 March", ar: "3 ليالٍ · من 12 إلى 15 مارس" }, value: { en: "EGP 4,200", ar: "4,200 جنيه" } }
            - { kind: listitem, icon: credit-card, text: { en: "Visa •••• 4821", ar: "Visa •••• 4821" }, chevron: true, gap: s }
          footer:
            - { kind: button, text: { en: "Apply promo code", ar: "استخدم كود الخصم" } }
            - { kind: button, text: { en: "Pay EGP 4,200", ar: "ادفع 4,200 جنيه" }, gap: s }
            - { kind: button, text: { en: "Back", ar: "رجوع" }, gap: s }
      - id: pay
        text: { en: "Pay filled; promo code outlined; Back as text", ar: "«ادفع» ممتلئ؛ وكود الخصم بإطار فقط؛ و«رجوع» زر نصي" }
        mock:
          app: nuzul
          appbar: *pbar
          blocks: *pay
          footer:
            - { kind: button, style: outline, icon: tag, text: { en: "Apply promo code", ar: "استخدم كود الخصم" } }
            - { kind: button, text: { en: "Pay EGP 4,200", ar: "ادفع 4,200 جنيه" }, gap: s }
            - { kind: button, style: text, text: { en: "Back", ar: "رجوع" }, gap: s }
      - id: promo
        text: { en: "Promo code filled; Pay and Back outlined", ar: "كود الخصم ممتلئ؛ و«ادفع» و«رجوع» بإطار فقط" }
        mock:
          app: nuzul
          appbar: *pbar
          blocks: *pay
          footer:
            - { kind: button, icon: tag, text: { en: "Apply promo code", ar: "استخدم كود الخصم" } }
            - { kind: button, style: outline, text: { en: "Pay EGP 4,200", ar: "ادفع 4,200 جنيه" }, gap: s }
            - { kind: button, style: outline, text: { en: "Back", ar: "رجوع" }, gap: s }
    answer: [pay]
    misconceptions:
      - id: MC-P14-019
        when: [all]
        feedback:
          en: "Three filled buttons look equally important, so people have to read all three to find the one that pays."
          ar: "ثلاثة أزرار ممتلئة تبدو متساوية في الأهمية، فعلى الناس أن يقرؤوا الثلاثة ليجدوا الزر الذي يدفع."
      - id: MC-P14-020
        when: [promo]
        feedback:
          en: "The loudest button now goes to a side step most people skip. Paying, the step forward, looks secondary."
          ar: "أوضح زر الآن يذهب إلى خطوة جانبية يتخطّاها أغلب الناس. والدفع، وهو الخطوة التالية، يبدو ثانويًا."
    correct:
      en: "One filled button: Pay."
      ar: "زر واحد ممتلئ: «ادفع»."
    explain:
      en: "The eye goes straight to Pay. The promo code and Back are still easy to find, without competing with it."
      ar: "تذهب العين مباشرة إلى «ادفع». ويبقى كود الخصم و«رجوع» سهلَي الإيجاد، دون أن ينافساه."

  - id: S03
    type: tune
    part: check
    skill: SK-P14-U02-01
    value:
      en: "Check, accordions (NN/g): use them on content-heavy pages where people need only a few sections. Guests read the price and photos and then one or two of the eight sections, so titles first saves them scrolling past the rest."
      ar: "اختبار، الـ Accordion (NN/g): استخدمه في الصفحات المليئة بالمحتوى حين يحتاج الناس أقسامًا قليلة. والنزلاء يقرؤون السعر والصور ثم قسمًا أو اثنين من الأقسام الثمانية، فالعناوين أولًا توفّر عليهم المرور على الباقي."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "On desktop, use accordions for content-heavy pages where users will not need to access content under several accordions." }
    scenario:
      en: "A hotel's page has eight sections: rooms, breakfast, parking, pool, gym, pets, accessibility and house rules. Most guests check one or two of them before booking, and which ones depends on the guest."
      ar: "صفحة الفندق فيها ثمانية أقسام: الغرف، والإفطار، وموقف السيارات، والمسبح، والجيم، والحيوانات الأليفة، وتسهيلات ذوي الإعاقة (Accessibility)، وقواعد الفندق. وأغلب النزلاء يراجعون قسمًا أو اثنين قبل الحجز، ويختلف القسم حسب النزيل."
    prompt:
      en: "Try each version of the hotel page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الفندق. أيّ نسخة تجعل كل نزيل يصل بسرعة إلى القسم الذي يهمّه؟"
    start: open
    options:
      - id: open
        text: { en: "All eight sections open, one under the other", ar: "الأقسام الثمانية مفتوحة، واحدًا تحت الآخر" }
        mock:
          app: nuzul
          appbar: &hbar { title: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, back: true, actions: [ { icon: heart, aria: { en: "Save", ar: "احفظ" } } ] }
          blocks:
            - { kind: image, art: hotel-room, size: m, alt: { en: "Hotel room", ar: "غرفة الفندق" } }
            - { kind: heading, text: { en: "Nile View Hotel · ★ 4.6", ar: "فندق نايل فيو · ★ 4.6" }, gap: s }
            - { kind: price, text: { en: "EGP 1,400", ar: "1,400 جنيه" }, per: { en: "/ night", ar: "/ ليلة" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Rooms", ar: "الغرف" }, gap: m }
            - { kind: small, text: { en: "All rooms have a balcony, air conditioning and a safe. Rooms on floors 5 to 9 face the river…", ar: "كل الغرف فيها شرفة وتكييف وخزنة. والغرف في الأدوار من الخامس إلى التاسع تطلّ على النيل…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Breakfast", ar: "الإفطار" }, gap: m }
            - { kind: small, text: { en: "Served from 7 to 11 am in the garden restaurant. Children under 6 eat free…", ar: "يُقدَّم من 7 إلى 11 صباحًا في مطعم الحديقة. والأطفال تحت 6 سنوات مجانًا…" }, gap: xs }
      - id: acc
        text: { en: "The eight sections as an accordion under the price", ar: "الأقسام الثمانية في Accordion تحت السعر" }
        mock:
          app: nuzul
          appbar: *hbar
          blocks:
            - { kind: image, art: hotel-room, size: m, alt: { en: "Hotel room", ar: "غرفة الفندق" } }
            - { kind: heading, text: { en: "Nile View Hotel · ★ 4.6", ar: "فندق نايل فيو · ★ 4.6" }, gap: s }
            - { kind: price, text: { en: "EGP 1,400", ar: "1,400 جنيه" }, per: { en: "/ night", ar: "/ ليلة" }, gap: xs }
            - { kind: accordion, text: { en: "Rooms", ar: "الغرف" }, gap: m }
            - { kind: accordion, text: { en: "Breakfast", ar: "الإفطار" } }
            - { kind: accordion, text: { en: "Parking", ar: "موقف السيارات" } }
            - { kind: accordion, text: { en: "Pool", ar: "المسبح" } }
            - { kind: meta, text: { en: "+ 4 more sections", ar: "+ 4 أقسام أخرى" }, gap: s }
      - id: two
        text: { en: "Show only Rooms and Breakfast; remove the other six", ar: "اعرض الغرف والإفطار فقط؛ واحذف الأقسام الستة الأخرى" }
        mock:
          app: nuzul
          appbar: *hbar
          blocks:
            - { kind: image, art: hotel-room, size: m, alt: { en: "Hotel room", ar: "غرفة الفندق" } }
            - { kind: heading, text: { en: "Nile View Hotel · ★ 4.6", ar: "فندق نايل فيو · ★ 4.6" }, gap: s }
            - { kind: price, text: { en: "EGP 1,400", ar: "1,400 جنيه" }, per: { en: "/ night", ar: "/ ليلة" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Rooms", ar: "الغرف" }, gap: m }
            - { kind: small, text: { en: "All rooms have a balcony, air conditioning and a safe…", ar: "كل الغرف فيها شرفة وتكييف وخزنة…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Breakfast", ar: "الإفطار" }, gap: m }
            - { kind: small, text: { en: "Served from 7 to 11 am in the garden restaurant…", ar: "يُقدَّم من 7 إلى 11 صباحًا في مطعم الحديقة…" }, gap: xs }
    answer: [acc]
    misconceptions:
      - id: MC-P14-017
        when: [open]
        feedback:
          en: "A guest who only cares about parking has to scroll past rooms, breakfast and more before finding it."
          ar: "النزيل الذي يهمّه موقف السيارات فقط عليه أن يمرّ على الغرف والإفطار وغيرهما قبل أن يجده."
      - id: MC-P14-018
        when: [two]
        feedback:
          en: "A guest with a dog or a wheelchair now finds nothing about it, and may not book at all."
          ar: "النزيل الذي معه كلب أو كرسي متحرّك لن يجد الآن شيئًا عن ذلك، وقد لا يحجز أصلًا."
    correct:
      en: "A few sections each: an accordion."
      ar: "كل نزيل يحتاج قسمًا أو اثنين: Accordion."
    explain:
      en: "Every guest sees all eight titles, opens the one or two they care about, and skips the rest. Nothing is removed."
      ar: "كل نزيل يرى العناوين الثمانية، ويفتح القسم أو القسمين اللذين يهمّانه، ويتخطّى الباقي. ولم يُحذف شيء."

  - id: S04
    type: tune
    part: check
    skill: SK-P14-U02-05
    value:
      en: "Check, floating buttons and icons (NN/g): one floating button for the screen's most common and important action, with a label that's visible at all times. A plane icon alone could mean flights or trips; support isn't why people open Trips."
      ar: "اختبار، الأزرار العائمة والأيقونات (NN/g): زر عائم واحد للإجراء الأكثر استخدامًا وأهمية في الشاشة، مع تسمية ظاهرة دائمًا. وأيقونة الطائرة وحدها قد تعني الرحلات الجوية أو السفريات؛ والدعم ليس سبب فتح الناس لصفحة «رحلاتي»."
    ref: { url: "https://www.nngroup.com/articles/icon-usability/", quote: "Icon labels should be visible at all times, without any interaction from the user." }
    scenario:
      en: "Most people open **My trips** to start planning a new trip. The app also has a support chat, which few people use."
      ar: "أغلب الناس يفتحون شاشة **رحلاتي** ليبدؤوا التخطيط لرحلة جديدة. وفي التطبيق أيضًا محادثة دعم، قليلون يستخدمونها."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم. أيّ زر عائم يناسب سبب فتح الناس لشاشة «رحلاتي»، ويقول بوضوح ما يفعله؟"
    start: icon
    options:
      - id: icon
        text: { en: "\"✈\" alone", ar: "«✈» وحدها" }
        mock:
          app: nuzul
          appbar: &tbar { title: { en: "My trips", ar: "رحلاتي" }, large: true }
          tabbar: &ntabs
            active: 1
            items:
              - { icon: magnifying-glass, text: { en: "Explore", ar: "استكشف" } }
              - { icon: suitcase, text: { en: "Trips", ar: "رحلاتي" } }
              - { icon: user, text: { en: "Account", ar: "حسابي" } }
          fab: { icon: airplane-tilt }
          blocks: &trips
            - kind: card
              art: hotel-room
              blocks:
                - { kind: text, weight: bold, text: { en: "Aswan · 12 to 15 March", ar: "أسوان · من 12 إلى 15 مارس" } }
                - { kind: meta, text: { en: "Nile View Hotel · 3 nights", ar: "فندق نايل فيو · 3 ليالٍ" }, gap: xs }
            - kind: card
              art: beach
              gap: s
              blocks:
                - { kind: text, weight: bold, text: { en: "Dahab · 2 to 6 May", ar: "دهب · من 2 إلى 6 مايو" } }
                - { kind: meta, text: { en: "Blue Lagoon Camp · 4 nights", ar: "معسكر بلو لاجون · 4 ليالٍ" }, gap: xs }
      - id: support
        text: { en: "\"💬 Support\"", ar: "«💬 الدعم»" }
        mock:
          app: nuzul
          appbar: *tbar
          tabbar: *ntabs
          fab: { icon: chat-circle-dots, text: { en: "Support", ar: "الدعم" } }
          blocks: *trips
      - id: plan
        text: { en: "\"✈ Plan a trip\"", ar: "«✈ خطّط لرحلة»" }
        mock:
          app: nuzul
          appbar: *tbar
          tabbar: *ntabs
          fab: { icon: airplane-tilt, text: { en: "Plan a trip", ar: "خطّط لرحلة" } }
          blocks: *trips
    answer: [plan]
    misconceptions:
      - id: MC-P14-024
        when: [icon]
        feedback:
          en: "The plane could mean flights, bookings or trips. Without a label, people have to guess what one tap will do."
          ar: "الطائرة قد تعني الرحلات الجوية أو الحجوزات أو السفريات. وبدون تسمية، على الناس أن يخمّنوا ما ستفعله الضغطة."
      - id: MC-P14-023
        when: [support]
        feedback:
          en: "Few people use support, yet it takes the button that's always in reach. Planning a trip, the main action, has to be found elsewhere."
          ar: "قليلون يستخدمون الدعم، ومع ذلك يأخذ الزر الذي يبقى دائمًا في المتناول. والتخطيط لرحلة، الإجراء الرئيسي، يجب البحث عنه في مكان آخر."
    correct:
      en: "The main action, with a label."
      ar: "الإجراء الرئيسي، مع تسمية."
    explain:
      en: "\"Plan a trip\" is why people open this screen, and the label says exactly what the button does."
      ar: "«خطّط لرحلة» هو سبب فتح الناس لهذه الشاشة، والتسمية تقول بالضبط ما يفعله الزر."

  - id: S05
    type: tune
    part: check
    skill: SK-P14-U02-02
    value:
      en: "Check, accordions (NN/g): avoid hiding crucial information within collapsed panels. A deposit that's charged now and never refunded changes whether people book, so it belongs next to Book, not under Payment details."
      ar: "اختبار، الـ Accordion (NN/g): تجنّب إخفاء أي معلومة مهمة داخل الأقسام المطويّة. ومبلغ التأمين الذي يُخصم الآن ولا يُسترد يغيّر قرار الناس بالحجز، فمكانه بجانب «احجز»، لا تحت «تفاصيل الدفع»."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Avoid hiding any crucial information within the collapsed panels." }
    scenario:
      en: "This hotel charges a deposit of EGP 500 when you book, and the deposit is never refunded. That rule is inside the collapsed **Payment details** section of the booking summary."
      ar: "هذا الفندق يخصم مبلغ تأمين 500 جنيه عند الحجز، ولا يُسترد هذا المبلغ أبدًا. وهذا الشرط داخل قسم **تفاصيل الدفع** المطويّ في ملخّص الحجز."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل كل نزيل يعرف أن مبلغ التأمين لا يُسترد قبل أن يدفع؟"
    start: inside
    options:
      - id: inside
        text: { en: "Keep the rule inside Payment details", ar: "أبقِ الشرط داخل قسم «تفاصيل الدفع»" }
        mock:
          app: nuzul
          appbar: &sbar { title: { en: "Booking summary", ar: "ملخّص الحجز" }, back: true }
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "3 nights", ar: "3 ليالٍ" }, value: { en: "EGP 4,200", ar: "4,200 جنيه" } }
            - { kind: accordion, text: { en: "Room", ar: "الغرفة" }, gap: m }
            - { kind: accordion, text: { en: "Payment details", ar: "تفاصيل الدفع" } }
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
      - id: line
        text: { en: "Show the rule in a line right above Book", ar: "اعرض الشرط في سطر فوق «احجز» مباشرة" }
        mock:
          app: nuzul
          appbar: *sbar
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "3 nights", ar: "3 ليالٍ" }, value: { en: "EGP 4,200", ar: "4,200 جنيه" } }
            - { kind: accordion, text: { en: "Room", ar: "الغرفة" }, gap: m }
            - { kind: accordion, text: { en: "Payment details", ar: "تفاصيل الدفع" } }
            - { kind: small, weight: bold, text: { en: "EGP 500 is charged now and won't be refunded.", ar: "يُخصم 500 جنيه الآن ولا يُسترد، فراجِع حجزك قبل التأكيد." }, gap: l }
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
      - id: star
        text: { en: "Keep it inside, and add ★ to the Payment details title", ar: "أبقِه داخل القسم، وأضف ★ إلى عنوان «تفاصيل الدفع»" }
        mock:
          app: nuzul
          appbar: *sbar
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "3 nights", ar: "3 ليالٍ" }, value: { en: "EGP 4,200", ar: "4,200 جنيه" } }
            - { kind: accordion, text: { en: "Room", ar: "الغرفة" }, gap: m }
            - { kind: accordion, text: { en: "Payment details ★", ar: "تفاصيل الدفع ★" } }
          footer:
            - { kind: button, text: { en: "Book", ar: "احجز" } }
    answer: [line]
    misconceptions:
      - id: MC-P14-018
        when: [inside, star]
        feedback:
          en: "Most people tap Book without opening Payment details, so they learn about the lost EGP 500 only after it's gone."
          ar: "أغلب الناس يضغطون «احجز» دون أن يفتحوا قسم «تفاصيل الدفع»، فلا يعرفون بالـ 500 جنيه إلا بعد أن تضيع."
    correct:
      en: "It changes the decision: keep it in sight."
      ar: "يغيّر القرار: أبقِه ظاهرًا."
    explain:
      en: "One line above Book makes sure everyone sees the deposit rule before they pay. The rest of the payment details can stay collapsed."
      ar: "سطر واحد فوق «احجز» يضمن أن يرى الجميع شرط التأمين قبل الدفع. ويمكن أن تبقى باقي تفاصيل الدفع مطويّة."

  - id: S06
    type: tune
    part: check
    skill: SK-P14-U02-04
    value:
      en: "Check, contextual menus (NN/g): show actions people use often directly; put secondary or low-priority ones in a menu. At the hotel, guests open the booking code and directions again and again; the invoice and reporting a problem are rare."
      ar: "اختبار، قوائم السياق (NN/g): اعرض الإجراءات التي يستخدمها الناس كثيرًا مباشرة؛ وضع الثانوية أو قليلة الأهمية في قائمة. وفي الفندق، يفتح النزلاء رمز الحجز والاتجاهات مرة بعد مرة؛ أما الفاتورة والإبلاغ عن مشكلة فنادران."
    ref: { url: "https://www.nngroup.com/articles/contextual-menus-guidelines/", quote: "Contextual menus are not appropriate for actions users rely on frequently." }
    scenario:
      en: "On a trip's page, guests open **Booking code** and **Directions** many times during their stay. **Download invoice** and **Report a problem** are each used by a few guests, once."
      ar: "في صفحة الرحلة، يفتح النزلاء **رمز الحجز** و**الاتجاهات** مرات كثيرة أثناء إقامتهم. أما **حمّل الفاتورة** و**أبلِغ عن مشكلة** فلا يستخدمهما إلا قليل من النزلاء، مرة واحدة."
    prompt:
      en: "Try each version of the trip's page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الرحلة. أيّ نسخة تُبقي ما يفتحه النزلاء كثيرًا قريبًا منهم؟"
    start: menu
    options:
      - id: menu
        text: { en: "All four in a ⋯ menu", ar: "الأربعة في قائمة ⋯" }
        mock:
          app: nuzul
          appbar: &abar { title: { en: "Aswan trip", ar: "رحلة أسوان" }, back: true, actions: [ { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
          blocks: &aswan
            - { kind: image, art: hotel-room, size: m, alt: { en: "Nile View Hotel", ar: "فندق نايل فيو" } }
            - { kind: listitem, icon: calendar-blank, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "12 to 15 March · 2 guests", ar: "من 12 إلى 15 مارس · ضيفان" }, gap: s }
      - id: two
        text: { en: "Booking code and Directions on screen; the other two in ⋯", ar: "رمز الحجز والاتجاهات على الشاشة؛ والاثنان الآخران في ⋯" }
        mock:
          app: nuzul
          appbar: *abar
          blocks: *aswan
          footer:
            - { kind: button, icon: qr-code, text: { en: "Show booking code", ar: "اعرض رمز الحجز" } }
            - { kind: button, style: outline, icon: navigation-arrow, text: { en: "Directions", ar: "الاتجاهات" }, gap: s }
      - id: all
        text: { en: "All four as buttons", ar: "الأربعة أزرارًا ظاهرة" }
        mock:
          app: nuzul
          appbar: { title: { en: "Aswan trip", ar: "رحلة أسوان" }, back: true }
          blocks: *aswan
          footer:
            - { kind: button, icon: qr-code, text: { en: "Show booking code", ar: "اعرض رمز الحجز" } }
            - { kind: button, style: outline, text: { en: "Directions", ar: "الاتجاهات" }, gap: s }
            - { kind: button, style: outline, text: { en: "Download invoice", ar: "حمّل الفاتورة" }, gap: s }
            - { kind: button, style: outline, text: { en: "Report a problem", ar: "أبلِغ عن مشكلة" }, gap: s }
    answer: [two]
    misconceptions:
      - id: MC-P14-021
        when: [menu]
        feedback:
          en: "Guests open the booking code at the front desk and directions in the street, many times. Hiding them behind ⋯ adds a tap every time, and some guests won't find them."
          ar: "يفتح النزلاء رمز الحجز عند الاستقبال والاتجاهات في الشارع، مرات كثيرة. وإخفاؤهما خلف ⋯ يضيف ضغطة في كل مرة، وبعض النزلاء لن يجدوهما."
      - id: MC-P14-022
        when: [all]
        feedback:
          en: "The invoice and reporting a problem are each used once by a few guests, but they take as much room as the actions everyone needs."
          ar: "الفاتورة والإبلاغ عن مشكلة لا يستخدمهما إلا قليل من النزلاء مرة واحدة، لكنهما يأخذان المساحة نفسها التي تأخذها الإجراءات التي يحتاجها الجميع."
    correct:
      en: "Often used: on screen. Rare: in ⋯."
      ar: "المتكرّر: على الشاشة. والنادر: في ⋯."
    explain:
      en: "The two actions guests use all stay long are one tap away. The invoice and reporting wait in ⋯ for the few who need them."
      ar: "الإجراءان اللذان يستخدمهما النزلاء طوال إقامتهم بضغطة واحدة. والفاتورة والإبلاغ ينتظران في ⋯ للقلّة التي تحتاجهما."

  - id: S07
    type: tune
    part: check
    skill: SK-P14-U02-06
    value:
      en: "Check, proximity and similarity (NN/g): related items close together read as one group, and the filled color is reserved for the primary action. Room types are one set of choices, so they're chips; Book now is the step forward, so it's the filled button."
      ar: "اختبار، مبدأ التقارب والتشابه (NN/g): العناصر المترابطة القريبة من بعضها تُقرأ مجموعة واحدة، واللون الممتلئ مخصّص للإجراء الرئيسي. وأنواع الغرف مجموعة واحدة من الاختيارات، فهي Chips؛ و«احجز الآن» هي الخطوة إلى الأمام، فهي الزر الممتلئ."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "Items close together are likely to be perceived as part of the same group — sharing similar functionality or traits." }
    scenario:
      en: "The room screen. Guests pick one room type, **Single**, **Double** or **Family**, then book."
      ar: "شاشة الغرفة. يختار النزلاء نوع غرفة واحدًا، **فردية** أو **مزدوجة** أو **عائلية**، ثم يحجزون."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل النزلاء يرون نوع الغرفة المختار، ويعرفون الخطوة التالية بوضوح؟"
    start: allchips
    options:
      - id: allchips
        text: { en: "Room types and Book now, all as chips", ar: "أنواع الغرف و«احجز الآن»، كلها Chips" }
        mock:
          app: nuzul
          appbar: &rbar { title: { en: "Room type", ar: "نوع الغرفة" }, back: true }
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "12 to 15 March · 2 guests", ar: "من 12 إلى 15 مارس · ضيفان" } }
            - kind: chips
              gap: m
              items:
                - { text: { en: "Single", ar: "فردية" } }
                - { text: { en: "Double", ar: "مزدوجة" }, on: true }
                - { text: { en: "Family", ar: "عائلية" } }
                - { text: { en: "Book now", ar: "احجز الآن" } }
      - id: allbuttons
        text: { en: "Room types and Book now, all as filled buttons", ar: "أنواع الغرف و«احجز الآن»، كلها أزرار ممتلئة" }
        mock:
          app: nuzul
          appbar: *rbar
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "12 to 15 March · 2 guests", ar: "من 12 إلى 15 مارس · ضيفان" } }
            - kind: row
              gap: m
              blocks:
                - { kind: button, text: { en: "Single", ar: "فردية" } }
                - { kind: button, text: { en: "Double", ar: "مزدوجة" } }
                - { kind: button, text: { en: "Family", ar: "عائلية" } }
          footer:
            - { kind: button, text: { en: "Book now", ar: "احجز الآن" } }
      - id: mixed
        text: { en: "Room types as chips; Book now as a filled button", ar: "أنواع الغرف Chips؛ و«احجز الآن» زر ممتلئ" }
        mock:
          app: nuzul
          appbar: *rbar
          blocks:
            - { kind: listitem, art: hotel-room, text: { en: "Nile View Hotel", ar: "فندق نايل فيو" }, sub: { en: "12 to 15 March · 2 guests", ar: "من 12 إلى 15 مارس · ضيفان" } }
            - kind: chips
              gap: m
              items:
                - { text: { en: "Single", ar: "فردية" } }
                - { text: { en: "Double", ar: "مزدوجة" }, on: true }
                - { text: { en: "Family", ar: "عائلية" } }
          footer:
            - { kind: button, text: { en: "Book now", ar: "احجز الآن" } }
    answer: [mixed]
    misconceptions:
      - id: MC-P14-069
        when: [allchips]
        feedback:
          en: "Book now looks like a fourth room type. The one step that finishes the booking is hidden among the choices."
          ar: "«احجز الآن» يبدو نوعًا رابعًا من الغرف. والخطوة الوحيدة التي تُنهي الحجز مختبئة بين الاختيارات."
      - id: MC-P14-070
        when: [allbuttons]
        feedback:
          en: "Four filled buttons look equally important, so Book now doesn't stand out, and nothing shows which room is picked."
          ar: "أربعة أزرار ممتلئة تبدو متساوية في الأهمية، فلا يبرز «احجز الآن»، ولا يظهر أيّ غرفة اختيرت."
    correct:
      en: "Room types as chips; Book now as the button."
      ar: "أنواع الغرف Chips؛ و«احجز الآن» الزر."
    explain:
      en: "Guests see the three rooms as one set and which one is picked. Book now alone is filled, so the next step is clear."
      ar: "يرى النزلاء الغرف الثلاث مجموعةً واحدة، ويرون أيّها اختير. و«احجز الآن» وحده ممتلئ، فتكون الخطوة التالية واضحة."
