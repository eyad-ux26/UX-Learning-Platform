id: P14-U02-L03
mode: lesson
minutes: 7
title:
  en: "When an action earns a floating button"
  ar: "متى يستحق إجراءٌ زرًا عائمًا (Floating action button)؟"
speaker: sara
sources:
  - title: { en: "User-Interface Elements: Glossary (NN/g)", ar: "عناصر واجهة المستخدم: مسرد المصطلحات (NN/g)" }
    url: "https://www.nngroup.com/articles/ui-elements-glossary/"
  - title: { en: "Icon Usability (NN/g)", ar: "سهولة استخدام الأيقونات (NN/g)" }
    url: "https://www.nngroup.com/articles/icon-usability/"
review_labels:
  MC-P14-023: { en: "The floating button is for the screen's main action only", ar: "الزر العائم للإجراء الرئيسي في الشاشة فقط" }
  MC-P14-024: { en: "An unclear icon needs a visible label", ar: "الأيقونة غير الواضحة تحتاج تسمية ظاهرة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Sara's recipe app", ar: "تطبيق سارة للوصفات" }
    body:
      en: "I'm designing a recipe app. People open it mostly to post their own recipes and to browse others'.\n\nMy team added a round floating button in the corner of the home screen. It asks people to **rate the app**, because we want more ratings."
      ar: "أصمّم تطبيقًا للوصفات. والناس يفتحونه غالبًا لينشروا وصفاتهم ويتصفّحوا وصفات غيرهم.\n\nوأضاف فريقي زرًا دائريًا عائمًا في زاوية الشاشة الرئيسية. وهو يطلب من الناس **تقييم التطبيق**، لأننا نريد تقييمات أكثر."
    mock:
      app: tabkha
      appbar: &tbar { title: { en: "Recipes", ar: "الوصفات" }, logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      tabbar: &ttabs
        active: 0
        items:
          - { icon: house, text: { en: "Home", ar: "الرئيسية" } }
          - { icon: bookmark-simple, text: { en: "Saved", ar: "المحفوظة" } }
          - { icon: user, text: { en: "Me", ar: "حسابي" } }
      fab: { icon: star }
      blocks: &feed
        - kind: card
          art: food-salad
          blocks:
            - { kind: text, weight: bold, text: { en: "Lentil soup in 20 minutes", ar: "شوربة عدس في 20 دقيقة" } }
            - { kind: meta, text: { en: "by Amal · 1.2k saves · ★ 4.8", ar: "من أمل · 1.2 ألف حفظ · ★ 4.8" }, gap: xs }
        - kind: card
          art: food-grill
          gap: s
          blocks:
            - { kind: text, weight: bold, text: { en: "Grilled kofta with tahini", ar: "كفتة مشوية بالطحينة" } }
            - { kind: meta, text: { en: "by Omar · 860 saves · ★ 4.6", ar: "من عمر · 860 حفظ · ★ 4.6" }, gap: xs }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U02-05
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Floating buttons (NN/g glossary): a floating button is typically used for the most commonly used and important action on the screen. In a recipe app, that's posting a recipe, not rating the app or opening settings."
      ar: "جرّب أولًا. الأزرار العائمة (مسرد NN/g): يُستخدم الزر العائم عادةً للإجراء الأكثر استخدامًا وأهمية في الشاشة. وفي تطبيق وصفات، هذا الإجراء هو نشر وصفة، لا تقييم التطبيق ولا فتح الإعدادات."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "A floating button is typically used for the most commonly used and important action on the screen." }
    prompt:
      en: "Try each action in the floating button. Which one should ship?"
      ar: "جرّب كل إجراء في الزر العائم. أيّ إجراء يخدم ما يفتح أغلب الناس التطبيق من أجله؟"
    start: rate
    options:
      - id: rate
        text: { en: "★ Rate the app", ar: "★ قيّم التطبيق" }
        mock:
          app: tabkha
          appbar: *tbar
          tabbar: *ttabs
          fab: { icon: star, text: { en: "Rate us", ar: "قيّمنا" } }
          blocks: *feed
      - id: post
        text: { en: "＋ Post a recipe", ar: "＋ انشر وصفة" }
        mock:
          app: tabkha
          appbar: *tbar
          tabbar: *ttabs
          fab: { icon: plus, text: { en: "Post a recipe", ar: "انشر وصفة" } }
          blocks: *feed
      - id: settings
        text: { en: "⚙ Settings", ar: "⚙ الإعدادات" }
        mock:
          app: tabkha
          appbar: *tbar
          tabbar: *ttabs
          fab: { icon: gear, text: { en: "Settings", ar: "الإعدادات" } }
          blocks: *feed
    answer: [post]
    misconceptions:
      - id: MC-P14-023
        when: [rate, settings]
        feedback:
          en: "Few people open the app to do this. The most visible button on the screen now goes to an action that matters to the team or to almost nobody, while posting a recipe has to be found elsewhere."
          ar: "قليلون يفتحون التطبيق ليفعلوا هذا. وأوضح زر في الشاشة يذهب الآن إلى إجراء يهمّ الفريق أو لا يهمّ أحدًا تقريبًا، بينما يجب البحث عن «انشر وصفة» في مكان آخر."
    hints:
      - en: "What do most people open this app to do?"
        ar: "لماذا يفتح أغلب الناس هذا التطبيق؟"
    correct:
      en: "The main, frequent action: post a recipe."
      ar: "الإجراء الرئيسي المتكرّر: انشر وصفة."
    explain:
      en: "Posting is why many people open the app, so it gets the button that's always in reach. Ratings and settings can live in the menu."
      ar: "النشر هو سبب فتح كثيرين للتطبيق، لذلك يأخذ الزر الذي يبقى دائمًا في المتناول. ويمكن أن يكون التقييم والإعدادات في القائمة."

  - id: S09
    type: video
    part: concept
    title: { en: "Float only the screen's main action", ar: "لا تعطِ الزر العائم إلا للإجراء الرئيسي" }
    video: 0966674b-c37e-4ee7-84be-d0b38fc83727
    duration: 178
    transcript:
      - { t: 2.5, en: "Another button type we mentioned when we talked about types is the FAB, the floating action button. It's the button usually at the bottom right of the screen,", ar: "من أنواع الـ Buttons اللي اتكلمنا عنها برضه، وإحنا بنتكلم عن الـ Types: الـ FAB، أو الـ Floating action button. ده الـ Button اللي بيكون على اليمين تحت في الشاشات عادةً،" }
      - { t: 12.5, en: "and it stands for the most important action on the screen I'm on. It's floating because it usually has a shadow, raised a little above the background, and in mobile apps it usually sits above the navbar.", ar: "وبيعبّر عن أهم Action في الـ Screen اللي أنا فيها حاليًا. Floating لأنه عادةً واخد Shadow، طافي شوية فوق الـ Background، وبيكون عادةً فوق الـ Navbar في الـ Mobile applications." }
      - { t: 24.42, en: "For example, in the chats tab of a messaging app, there's a floating action button for starting a new chat, which may be the most important action on that screen.", ar: "على سبيل المثال، في الـ Tab بتاع المحادثات في تطبيق الرسايل، هتلاقي Floating action button بيعبّر عن Action إني أبدأ Chat جديد، وده ممكن يكون أهم Action في الشاشة دي." }
      - { t: 36.44, en: "I start a new chat to talk to someone, or to look someone up. So the action is very clear to me, sitting in the floating action button like this.", ar: "أبدأ Chat جديد عشان أكلّم حد، أو أدوّر على حد. فالـ Action ده واضح جدًا عندي، موجود في الـ Floating action button بالشكل ده." }
      - { t: 44.86, en: "The material design guidelines for the floating action button are very simple. One is that its contrast against the background behind it is clear. Sometimes it takes the same color as a solid background,", ar: "الـ Guidelines بتاعة الـ Floating action button في الـ Material Design بسيطة جدًا، منها إن الـ Contrast بتاعه يكون واضح عن الخلفية اللي وراه. أحيانًا يكون واخد نفس لون الـ Background، والـ Background لونه Solid كده،" }
      - { t: 58.0, en: "so the floating action button barely shows, its contrast is weak, and it gets lost in the background. With a different color, it stands out from the background.", ar: "فيبقى الـ Floating action button مش باين أصلًا، والـ Contrast بتاعه ضعيف، فمايتشافش مع الخلفية. لكن لو واخد لون مختلف هيبان عن الخلفية اللي وراه." }
      - { t: 68.32, en: "Another key guideline, when it isn't an extended floating action button: its icon must express the action it takes, especially since there's no label next to it saying exactly what it does.", ar: "ومن أهم الـ Guidelines كمان، لو مش مستخدمه Extended floating action button: إن الـ Icon اللي فيه تعبّر عن الـ Action اللي هاخده، بالذات إنه مافيش Label جنبه يقول الـ Action ده إيه بالظبط." }
      - { t: 82.36, en: "In this example, the plus sign, depending on context, is expected to let me add a post, or show some actions above it to choose from. The chat icon is expected to start a new message, or open the messages page,", ar: "في المثال اللي قدّامنا، متوقّع إن علامة الـ Plus، حسب السياق، تخلّيني أضيف Post مثلًا، أو تظهر لي Actions فوقها أختار منها. وأيقونة الـ Chat متوقّع إنها تخلّيني أعمل Message جديدة، أو تدخّلني صفحة الـ Messages،" }
      - { t: 96.2, en: "depending on context. But the icons on the other side may not be clear at all, and I can't predict what they do until I try them first.", ar: "حسب السياق. لكن الأيقونات اللي على الناحية التانية ممكن أصلًا ماتكونش مفهومة، ومش هتوقّع هي بتعمل إيه لحد ما أجرّبها الأول." }
      - { t: 110.64, en: "That's another very important guideline. The extended floating action button is a regular floating action button with a label or text next to it, describing the icon or the action the user takes when tapping it,", ar: "ودي برضه من الـ Guidelines المهمة جدًا. أما الـ Extended floating action button فهو Floating action button عادي، لكن مضاف جنبه Label أو Text بيعبّر عن الأيقونة أو عن الـ Action اللي اليوزر هياخده لما يضغط عليه،" }
      - { t: 123.88, en: "like the example in an email app: I tap the compose floating action button to write or send a new email.", ar: "زي المثال اللي عندنا في تطبيق الإيميل: لما أضغط على الـ Floating action button بتاع الـ Compose عشان أكتب إيميل جديد أو أبعت إيميل جديد." }
      - { t: 131.36, en: "Often the two are combined: there's an extended floating action button, and when I scroll down it collapses into a regular floating action button, just an icon, and when I reach the end of the screen", ar: "وكتير بيتدمج الاتنين: يكون عندي Extended floating action button، ولما أعمل Scroll لتحت يعمل Collapse، ويتحوّل لـ Floating action button عادي، أيقونة بس، ولما أوصل لآخر الشاشة،" }
      - { t: 144.66, en: "it expands back into an extended floating action button, like this example: at the top it's extended, when I scroll it collapses, and at the end of the screen it's extended again.", ar: "يعمل Expand تاني ويرجع Extended floating action button، زي المثال اللي قدّامنا: في الحالة العادية فوق هو Extended، لما أعمل Scroll يعمل Collapse، ولما أوصل لآخر الشاشة يرجع Extended." }
      - { t: 157.32, en: "If I scroll back up it doesn't change, because I'm going back up, not down to new content I'm seeing for the first time. That's also the usual behaviour of the extended and regular floating action button in the material design guidelines.", ar: "ولو عملت Scroll لفوق مش بيرجع تاني، لأني برجع لفوق، مش بنزل لتحت أشوف محتوى جديد أول مرة أشوفه. وده برضه الـ Behaviour المعتاد للـ Extended floating action button والـ Floating action button في الـ Material Design Guidelines." }

  - id: S03
    type: card
    part: concept
    icons: [target, warn, contrast, text, fold]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "A floating action button hovers over the content with a shadow, usually in a bottom corner above the navigation bar (bottom left in an Arabic, right-to-left layout), so it's always in reach.\n\n- **One per screen**, for its most important action, like starting a new chat.\n- **Not for rare or secondary actions**, like settings or rating the app. Several floating buttons compete and cover the content.\n- **Strong contrast:** a button in the same color as the background behind it gets lost.\n- **An icon that says the action**, like + or a pen. When the icon could be unclear, use an **extended** floating button: the icon plus a short label.\n- **On scroll:** an extended button can shrink to its icon while people scroll down, and grow back at the end of the list. Scrolling up leaves it as it is."
      ar: "الـ Floating action button يطفو فوق المحتوى مع ظل، غالبًا في زاوية سفلية فوق شريط التنقّل (أسفل اليسار في الواجهة العربية من اليمين لليسار)، فيبقى دائمًا في المتناول.\n\n- **واحد لكل شاشة**، لإجرائها الأهم، مثل بدء محادثة جديدة.\n- **ليس للإجراءات النادرة أو الثانوية**، مثل الإعدادات أو تقييم التطبيق. فعدة أزرار عائمة تتنافس وتغطّي المحتوى.\n- **Contrast (تباين) واضح:** الزر الذي بلون الخلفية نفسه يضيع فيها.\n- **أيقونة تعبّر عن الإجراء**، مثل + أو قلم. وحين قد تكون الأيقونة غير واضحة، استخدم **Extended** floating button: الأيقونة ومعها نص قصير.\n- **عند الـ Scroll:** يمكن أن يصغر الزر الممتد إلى أيقونته حين يمرّر الناس لأسفل، ثم يعود في نهاية القائمة. والـ Scroll لأعلى لا يغيّره."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U02-05
    rules: [R06, R15]
    value:
      en: "Floating buttons (NN/g glossary): they support quick access to essential actions, so one goes to the most common one. Three stacked floating buttons cover the notes and make folders and scanning look as important as writing."
      ar: "الأزرار العائمة (مسرد NN/g): تتيح وصولًا سريعًا للإجراءات الأساسية، لذلك يذهب الزر الواحد للإجراء الأكثر استخدامًا. وثلاثة أزرار عائمة فوق بعضها تغطّي الملاحظات وتجعل المجلدات والمسح يبدوان بأهمية الكتابة."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "Floating buttons are often used on mobile devices, to support quick access to essential actions." }
    scenario:
      en: "In my next project, a notes app, my team stacked three floating buttons: **new note**, **new folder** and **scan a page**. People write new notes every day; they make folders and scan pages only now and then."
      ar: "في مشروعي التالي، تطبيق ملاحظات، وضع فريقي ثلاثة أزرار عائمة فوق بعضها: **ملاحظة جديدة**، و**مجلد جديد**، و**مسح صفحة ضوئيًا**. والناس يكتبون ملاحظات جديدة كل يوم؛ ولا ينشئون مجلدات أو يمسحون صفحات ضوئيًا إلا من حين لآخر."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تترك لبنى تُكمل بيانات المسافرين دون مقاطعة؟"
    start: three
    options:
      - id: one
        text: { en: "One floating button for a new note; folders and scanning in the menu", ar: "زر عائم واحد لملاحظة جديدة؛ والمجلدات والمسح الضوئي في القائمة" }
        mock:
          app: satr
          appbar: &sbar { title: { en: "Notes", ar: "الملاحظات" }, large: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          fab: { icon: pencil-simple }
          blocks: &notes
            - { kind: listitem, icon: note, text: { en: "Shopping list", ar: "قائمة المشتريات" }, sub: { en: "Bread, eggs, tea, rice…", ar: "عيش، بيض، شاي، أرز…" }, value: { en: "Today", ar: "اليوم" } }
            - { kind: listitem, icon: note, text: { en: "Meeting, Sunday", ar: "اجتماع الأحد" }, sub: { en: "Budget, launch date, hiring…", ar: "الميزانية، موعد الإطلاق، التوظيف…" }, value: { en: "Fri", ar: "الجمعة" } }
            - { kind: listitem, icon: note, text: { en: "Gift ideas", ar: "أفكار هدايا" }, sub: { en: "A book for Mom, a scarf…", ar: "كتاب لأمي، وشال…" }, value: { en: "2 May", ar: "2 مايو" } }
      - id: three
        text: { en: "Keep the three floating buttons", ar: "أبقِ الأزرار العائمة الثلاثة" }
        mock:
          app: satr
          appbar: *sbar
          fab: [ { icon: pencil-simple }, { icon: check-square }, { icon: camera } ]
          blocks: *notes
      - id: small
        text: { en: "Keep all three, but make them smaller", ar: "أبقِ الثلاثة، لكن صغّرها" }
        mock:
          app: satr
          caption: { en: "Three smaller floating buttons", ar: "ثلاثة أزرار عائمة أصغر" }
          appbar: *sbar
          fab: [ { icon: pencil-simple }, { icon: check-square }, { icon: camera } ]
          blocks: *notes
    answer: [one]
    misconceptions:
      - id: MC-P14-023
        when: [three, small]
        feedback:
          en: "Three floating buttons still cover the notes and look equally important. Writing a note, the thing people do every day, no longer stands out."
          ar: "ثلاثة أزرار عائمة ما زالت تغطّي الملاحظات وتبدو متساوية في الأهمية. وكتابة ملاحظة، وهو ما يفعله الناس كل يوم، لم تعد بارزة."
    correct:
      en: "One floating button, for the daily action."
      ar: "زر عائم واحد، للإجراء اليومي."
    explain:
      en: "A new note is one tap from anywhere, and the list stays clear. Folders and scanning are still there, in the menu, for the times people need them."
      ar: "الملاحظة الجديدة بضغطة واحدة من أي مكان، والقائمة تبقى واضحة. والمجلدات والمسح الضوئي ما زالا موجودين في القائمة، للمرات التي يحتاجهما فيها الناس."

  - id: S05
    type: tune
    speaker: tarek
    part: guided
    skill: SK-P14-U02-05
    rules: [R06, R15]
    confidence: true
    value:
      en: "Icons (NN/g): few icons are universally recognized, and icon labels should be visible at all times, without any interaction. A circular arrow could mean reorder, refresh or history; a long-press tooltip is an interaction most people never try."
      ar: "الأيقونات (NN/g): أيقونات قليلة يعرفها الجميع، وتسميات الأيقونات يجب أن تكون ظاهرة دائمًا، دون أي تفاعل. والسهم الدائري قد يعني «اطلب مجددًا» أو «تحديث» أو «السجل»؛ والـ Tooltip عند الضغط المطوّل تفاعل لا يجرّبه أغلب الناس."
    ref: { url: "https://www.nngroup.com/articles/icon-usability/", quote: "Icon labels should be visible at all times, without any interaction from the user." }
    scenario:
      en: "The food app I manage has a floating button that repeats your last order in one tap. Many people order the same meal every week. Right now, the button shows only a circular arrow: ⟲."
      ar: "في تطبيق الطعام الذي أديره زر عائم يكرّر آخر طلب بضغطة واحدة. وكثير من الناس يطلبون الوجبة نفسها كل أسبوع. والآن لا يعرض الزر إلا سهمًا دائريًا: ⟲."
    prompt:
      en: "Try each version of the floating button. Which one should ship?"
      ar: "جرّب كل نسخة من الزر العائم. أيّ نسخة تجعل الناس يفهمون أن الزر يكرّر آخر طلب؟"
    start: icon
    options:
      - id: icon
        text: { en: "Keep the icon only", ar: "أبقِ الأيقونة فقط" }
        mock:
          app: lamma
          appbar: &lbar { title: { en: "Restaurants near you", ar: "مطاعم قريبة منك" }, actions: [ { icon: shopping-bag, aria: { en: "Orders", ar: "الطلبات" } } ] }
          fab: { icon: arrow-counter-clockwise }
          blocks: &food
            - kind: card
              art: food-grill
              blocks:
                - { kind: text, weight: bold, text: { en: "Grill House · 25 min", ar: "Grill House · 25 دقيقة" } }
                - { kind: meta, text: { en: "Grills · EGP 150 for two · ★ 4.5", ar: "مشويات · 150 جنيه لشخصين · ★ 4.5" }, gap: xs }
            - kind: card
              art: food-pizza
              gap: s
              blocks:
                - { kind: text, weight: bold, text: { en: "Napoli Pizza · 35 min", ar: "Napoli Pizza · 35 دقيقة" } }
                - { kind: meta, text: { en: "Pizza · EGP 220 for two · ★ 4.3", ar: "بيتزا · 220 جنيه لشخصين · ★ 4.3" }, gap: xs }
      - id: tip
        text: { en: "Icon only; a tooltip \"Reorder\" appears on a long press", ar: "أيقونة فقط؛ ويظهر Tooltip «اطلب مجددًا» عند الضغط المطوّل" }
        mock:
          caption: { en: "Only after a long press", ar: "بعد ضغط مطوّل فقط" }
          app: lamma
          appbar: *lbar
          fab: { icon: arrow-counter-clockwise }
          blocks:
            - kind: card
              art: food-grill
              blocks:
                - { kind: text, weight: bold, text: { en: "Grill House · 25 min", ar: "Grill House · 25 دقيقة" } }
                - { kind: meta, text: { en: "Grills · EGP 150 for two · ★ 4.5", ar: "مشويات · 150 جنيه لشخصين · ★ 4.5" }, gap: xs }
            - { kind: tip, text: { en: "Reorder", ar: "اطلب مجددًا" }, gap: m }
      - id: label
        text: { en: "Extended floating button: \"⟲ Reorder\"", ar: "Extended floating button: «⟲ اطلب مجددًا»" }
        mock:
          app: lamma
          appbar: *lbar
          fab: { icon: arrow-counter-clockwise, text: { en: "Reorder", ar: "اطلب مجددًا" } }
          blocks: *food
    answer: [label]
    misconceptions:
      - id: MC-P14-024
        when: [icon, tip]
        feedback:
          en: "The circular arrow could mean refresh or history. Without a visible label, many people never tap it, and few think to long-press a button to ask what it does."
          ar: "السهم الدائري قد يعني «تحديث» أو «السجل». وبدون تسمية ظاهرة، لن يضغطه كثيرون، وقليلون يفكّرون في الضغط المطوّل على زر ليعرفوا وظيفته."
    hints:
      - en: "Could someone who's never used the app tell what ⟲ does?"
        ar: "هل يستطيع شخص لم يستخدم التطبيق من قبل أن يعرف وظيفة ⟲؟"
    correct:
      en: "The icon could be unclear: add the label."
      ar: "قد تكون الأيقونة غير واضحة: أضف التسمية."
    explain:
      en: "\"Reorder\" next to the arrow says exactly what one tap does. People who eat the same meal every week will spot it and use it."
      ar: "كلمة «اطلب مجددًا» بجانب السهم تقول بالضبط ما تفعله الضغطة. ومن يأكلون الوجبة نفسها كل أسبوع سيلاحظونه ويستخدمونه."

  - id: S06
    type: compare
    speaker: karim
    part: contrast
    skill: SK-P14-U02-05
    rules: [R11]
    value:
      en: "Floating buttons (NN/g glossary): one goes to the most commonly used and important action. Most people open the chat list to start or continue a chat; photos are sent from inside a chat, so a second floating camera button only competes."
      ar: "الأزرار العائمة (مسرد NN/g): الزر الواحد يذهب للإجراء الأكثر استخدامًا وأهمية. وأغلب الناس يفتحون قائمة المحادثات ليبدؤوا محادثة أو يكملوها؛ والصور تُرسل من داخل المحادثة، فزر الكاميرا العائم الثاني لا يفعل إلا المنافسة."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "A floating button is typically used for the most commonly used and important action on the screen." }
    scenario:
      en: "I'm building a messaging app. Most people come to its chat list to start a new chat or open an old one. Photos are usually sent from inside a chat."
      ar: "أبني تطبيقًا للمراسلة. وأغلب الناس يأتون إلى قائمة المحادثات فيه ليبدؤوا محادثة جديدة أو يفتحوا محادثة قديمة. والصور تُرسل عادةً من داخل المحادثة."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تساعد آية على اختيار الخطة المناسبة لسيارتها؟"
    a:
      label: { en: "Version A: new chat and camera, both floating", ar: "النسخة A: زرّان عائمان، لمحادثة جديدة وللكاميرا" }
      mock:
        app: hakawy
        appbar: &hbar { title: { en: "Chats", ar: "المحادثات" }, large: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
        fab: [ { icon: pencil-simple }, { icon: camera } ]
        blocks: &chats
          - { kind: listitem, avatar: { text: "Mom", art: woman-2 }, text: { en: "Mom", ar: "ماما" }, sub: { en: "Call me when you're home", ar: "كلّمني لما توصل" }, value: "9:41", badge: { text: "2" } }
          - { kind: listitem, avatar: { text: "Work team", art: people }, text: { en: "Work team", ar: "فريق العمل" }, sub: { en: "Slides are ready", ar: "العرض جاهز" }, value: "8:15" }
          - { kind: listitem, avatar: { text: "Hossam", art: man-2 }, text: { en: "Hossam", ar: "حسام" }, sub: { en: "See you at 7", ar: "نتقابل الساعة 7" }, value: { en: "Yesterday", ar: "أمس" } }
    b:
      label: { en: "Version B: one floating button for a new chat", ar: "النسخة B: زر عائم واحد لمحادثة جديدة" }
      mock:
        app: hakawy
        appbar: *hbar
        fab: { icon: pencil-simple }
        blocks: *chats
    answer: b
    misconceptions:
      - id: MC-P14-023
        when: [a]
        feedback:
          en: "The camera button competes with the main action and covers more of the list. People send photos from inside a chat anyway."
          ar: "زر الكاميرا ينافس الإجراء الرئيسي ويغطّي جزءًا أكبر من القائمة. والناس يرسلون الصور من داخل المحادثة على أي حال."
    correct:
      en: "B: one floating button, the screen's main action."
      ar: "B: زر عائم واحد، للإجراء الرئيسي في الشاشة."
    explain:
      en: "Starting a chat is what this screen is for, so it alone floats. The camera stays where photos are really sent: inside the chat."
      ar: "بدء محادثة هو الغرض من هذه الشاشة، لذلك هو وحده العائم. والكاميرا تبقى حيث تُرسل الصور فعلًا: داخل المحادثة."

  - id: S07
    type: tune
    speaker: rami
    part: independent
    skill: SK-P14-U02-05
    rules: [R14]
    value:
      en: "Floating buttons (NN/g glossary): for the most commonly used and important action. Hoda adds several events a week, while the calendar already opens on today and settings are rarely touched."
      ar: "الأزرار العائمة (مسرد NN/g): للإجراء الأكثر استخدامًا وأهمية. وهدى تضيف عدة مواعيد كل أسبوع، بينما يفتح التقويم أصلًا على اليوم، ونادرًا ما تُفتح الإعدادات."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "A floating button is typically used for the most commonly used and important action on the screen." }
    scenario:
      en: "I'm designing a calendar app. Hoda uses it on her phone and adds 5 to 10 events a week. The app always opens on today, and she has opened the settings twice this year."
      ar: "أصمّم تطبيقًا للتقويم. تستخدمه هدى على هاتفها، وتضيف من 5 إلى 10 مواعيد كل أسبوع. والتطبيق يفتح دائمًا على اليوم، وقد فتحت الإعدادات مرتين هذا العام."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم. أيّ زر يخدم ما تفعله هدى أكثر في التطبيق؟"
    start: today
    options:
      - id: today
        text: { en: "Jump to today", ar: "انتقل إلى اليوم" }
        mock:
          app: mawid
          appbar: &mbar { title: { en: "Tuesday, 14 May", ar: "الثلاثاء، 14 مايو" }, actions: [ { icon: calendar-blank, aria: { en: "Month view", ar: "عرض الشهر" } } ] }
          fab: { icon: crosshair, text: { en: "Today", ar: "اليوم" } }
          blocks: &cal
            - { kind: listitem, icon: tooth, text: { en: "Dentist", ar: "طبيب الأسنان" }, sub: "9:00 – 9:45" }
            - { kind: listitem, icon: fork-knife, text: { en: "Lunch with Samar", ar: "غداء مع سمر" }, sub: "13:00 – 14:00" }
            - { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, sub: "18:30 – 19:30" }
      - id: new
        text: { en: "New event", ar: "موعد جديد" }
        mock:
          app: mawid
          appbar: *mbar
          fab: { icon: plus, text: { en: "New event", ar: "موعد جديد" } }
          blocks: *cal
      - id: settings
        text: { en: "Settings", ar: "الإعدادات" }
        mock:
          app: mawid
          appbar: *mbar
          fab: { icon: gear, text: { en: "Settings", ar: "الإعدادات" } }
          blocks: *cal
    answer: [new]
    misconceptions:
      - id: MC-P14-023
        when: [today, settings]
        feedback:
          en: "Hoda rarely needs this: the app already opens on today, and she's opened settings twice this year. The always-in-reach button goes to something she seldom does."
          ar: "نادرًا ما تحتاج هدى هذا: فالتطبيق يفتح أصلًا على اليوم، وفتحت الإعدادات مرتين هذا العام. والزر الذي يبقى دائمًا في المتناول يذهب إلى شيء نادرًا ما تفعله."
    correct:
      en: "Her most common action: a new event."
      ar: "إجراؤها الأكثر تكرارًا: موعد جديد."
    explain:
      en: "Adding events is what Hoda does every week, so it gets the floating button. Today and Settings stay a tap away in the top bar."
      ar: "إضافة المواعيد هي ما تفعله هدى كل أسبوع، لذلك تأخذ الزر العائم. ويبقى «اليوم» و«الإعدادات» بضغطة واحدة في الشريط العلوي."

  - id: S08
    type: card
    part: recap
    icons: [tap, target, text]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **One floating button** per screen, for its most common and important action.\n- **No floating buttons** for rare actions, and no stacks of them.\n- **A visible label** when the icon could be unclear, like ⟲ Reorder.\n\nNext: the skill check, on new cases."
      ar: "- **زر عائم واحد** لكل شاشة، لإجرائها الأكثر استخدامًا وأهمية.\n- **لا أزرار عائمة** للإجراءات النادرة، ولا أزرار عائمة فوق بعضها.\n- **تسمية ظاهرة** حين قد تكون الأيقونة غير واضحة، مثل «⟲ اطلب مجددًا».\n\nالتالي: اختبار المهارة، على حالات جديدة."
