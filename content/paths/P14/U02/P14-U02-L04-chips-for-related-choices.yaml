    part: independent
    skill: SK-P14-U02-06
    rules: [R14]
    value:
      en: "Suggestions (NN/g): follow-up suggestions are related to an established context, such as an ongoing conversation, and when the suggestion is right, people can skip typing. Replies that fit Marwan's question save typing; generic ones don't."
      ar: "الاقتراحات (NN/g): الاقتراحات التالية مرتبطة بسياق قائم، مثل محادثة جارية، وحين يكون الاقتراح مناسبًا، يستطيع الناس الاستغناء عن الكتابة. والردود التي تناسب سؤال مروان توفّر الكتابة؛ أما الردود العامة فلا."
    ref: { url: "https://www.nngroup.com/articles/prompt-suggestions/", quote: "Followup questions are prompt suggestions related to a preestablished context (such as an ongoing conversation)." }
    scenario:
      en: "In a chat app, Marwan asks his friend: **\"Are we still on for football at 7?\"** The app shows three suggestion chips above the keyboard."
      ar: "في تطبيق محادثة، يسأل مروان صديقه: **«ما زلنا على موعد الكرة الساعة 7؟»** ويعرض التطبيق ثلاث Suggestion chips فوق لوحة المفاتيح."
    prompt:
      en: "Try each set of suggestion chips. Which one should ship?"
      ar: "جرّب كل مجموعة من الـ Suggestion chips. أيّها يجب أن تُطلق؟"
    start: generic
    options:
      - id: generic
        text: { en: "\"Hi\", \"Thanks\", \"OK\"", ar: "«أهلًا»، «شكرًا»، «تمام»" }
        mock:
          width: 300
          blocks:
            - { kind: meta, text: { en: "Marwan", ar: "مروان" } }
            - { kind: text, text: { en: "Are we still on for football at 7?", ar: "ما زلنا على موعد الكرة الساعة 7؟" }, gap: xs }
            - kind: chips
              gap: l
              items:
                - { text: { en: "Hi", ar: "أهلًا" } }
                - { text: { en: "Thanks", ar: "شكرًا" } }
                - { text: { en: "OK", ar: "تمام" } }
            - { kind: field, text: { en: "Message", ar: "رسالة" }, gap: s }
      - id: related
        text: { en: "\"Yes, see you at 7\", \"Can we make it 8?\", \"I can't today\"", ar: "«أيوه، أشوفك 7»، «ممكن نخليها 8؟»، «مش هقدر النهارده»" }
        mock:
          width: 300
          blocks:
            - { kind: meta, text: { en: "Marwan", ar: "مروان" } }
            - { kind: text, text: { en: "Are we still on for football at 7?", ar: "ما زلنا على موعد الكرة الساعة 7؟" }, gap: xs }
            - kind: chips
              gap: l
              items:
                - { text: { en: "Yes, see you at 7", ar: "أيوه، أشوفك 7" } }
                - { text: { en: "Can we make it 8?", ar: "ممكن نخليها 8؟" } }
                - { text: { en: "I can't today", ar: "مش هقدر النهارده" } }
            - { kind: field, text: { en: "Message", ar: "رسالة" }, gap: s }
      - id: one
        text: { en: "One chip: \"Reply\"", ar: "Chip واحدة: «ردّ»" }
        mock:
          width: 300
          blocks:
            - { kind: meta, text: { en: "Marwan", ar: "مروان" } }
            - { kind: text, text: { en: "Are we still on for football at 7?", ar: "ما زلنا على موعد الكرة الساعة 7؟" }, gap: xs }
            - kind: chips
              gap: l
              items:
                - { text: { en: "Reply", ar: "ردّ" } }
            - { kind: field, text: { en: "Message", ar: "رسالة" }, gap: s }
    answer: [related]
    misconceptions:
      - id: MC-P14-072
        when: [generic]
        feedback:
          en: "None of these answers Marwan's question, so his friend still has to type the real reply. The chips take space and save nothing."
          ar: "لا يجيب أيٌّ منها عن سؤال مروان، فما زال على صديقه أن يكتب الرد الحقيقي. والـ Chips تأخذ مساحة ولا توفّر شيئًا."
      - id: MC-P14-069
        when: [one]
        feedback:
          en: "A lone Reply chip is just a button for something the message field already does. It suggests nothing."
