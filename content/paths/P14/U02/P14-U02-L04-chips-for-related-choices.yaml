    explain:
      en: "Each chip is a real answer to Marwan, so one tap replies. The group covers yes, a change, and no."
      ar: "كل Chip ردّ حقيقي على مروان، فضغطة واحدة تكفي للرد. والمجموعة تغطّي الموافقة، والتعديل، والرفض."

