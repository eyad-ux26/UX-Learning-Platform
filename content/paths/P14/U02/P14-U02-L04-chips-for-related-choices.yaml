id: P14-U02-L04
mode: lesson
minutes: 8
title:
  en: "Chips for a group of related choices"
  ar: "الـ Chips لمجموعة من الاختيارات المترابطة"
sources:
  - title: { en: "Proximity Principle in Visual Design (NN/g)", ar: "مبدأ التقارب في التصميم المرئي (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-proximity/"
  - title: { en: "User-Interface Elements: Glossary (NN/g)", ar: "عناصر واجهة المستخدم: مسرد المصطلحات (NN/g)" }
    url: "https://www.nngroup.com/articles/ui-elements-glossary/"
  - title: { en: "Applying Filters: Batch vs. Interactive (NN/g)", ar: "تطبيق الفلاتر: دفعة واحدة أم تفاعليًا (NN/g)" }
    url: "https://www.nngroup.com/articles/applying-filters/"
  - title: { en: "Prompt Suggestions (NN/g)", ar: "اقتراحات الـ Prompt (NN/g)" }
    url: "https://www.nngroup.com/articles/prompt-suggestions/"
  - title: { en: "Similarity Principle in Visual Design (NN/g)", ar: "مبدأ التشابه في التصميم المرئي (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-similarity/"
  - title: { en: "10 Usability Heuristics for User Interface Design (NN/g)", ar: "10 مبادئ لسهولة استخدام الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/ten-usability-heuristics/"
review_labels:
  MC-P14-049: { en: "Match the control to the answer: radio buttons for 2 or 3 options", ar: "اختر العنصر المناسب للإجابة: Radio buttons لاختيارين أو ثلاثة" }
  MC-P14-069: { en: "A single main action is a button, not a chip", ar: "الإجراء الرئيسي الوحيد زر، لا Chip" }
  MC-P14-070: { en: "A set of related choices reads best as chips, not equal loud buttons", ar: "مجموعة الاختيارات المترابطة أوضح كـ Chips، لا كأزرار متساوية وواضحة" }
  MC-P14-071: { en: "What people entered as chips must be removable in one tap", ar: "ما أدخله الناس كـ Chips يجب أن يُحذف بضغطة واحدة" }
  MC-P14-072: { en: "Suggestion chips must fit what people are doing now", ar: "الـ Suggestion chips يجب أن تناسب ما يفعله الناس الآن" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Sameh's movie-ticket app", ar: "تطبيق تذاكر السينما لسامح" }
    body:
      en: "Sameh designs an app for buying movie tickets. After people pick a film, they choose one of four showtimes on Friday: 1:30, 4:00, 6:45 or 9:15.\n\nThe team drew each time as a big filled button, one under the other, above **Choose seats**."
      ar: "يصمّم سامح تطبيقًا لشراء تذاكر السينما. وبعد أن يختار الناس فيلمًا، يختارون موعدًا من أربعة مواعيد عرض يوم الجمعة: 1:30 أو 4:00 أو 6:45 أو 9:15.\n\nورسم الفريق كل موعد كزر كبير ممتلئ، واحدًا تحت الآخر، فوق **اختر المقاعد**."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Trip to the Moon", ar: "رحلة إلى القمر" } }
        - { kind: meta, text: { en: "Friday · 2 h 10 min", ar: "الجمعة · 2 س 10 د" }, gap: xs }
        - { kind: button, text: { en: "1:30 pm", ar: "1:30 م" }, gap: m }
        - { kind: button, text: { en: "4:00 pm", ar: "4:00 م" }, gap: s }
        - { kind: button, text: { en: "6:45 pm", ar: "6:45 م" }, gap: s }
        - { kind: button, text: { en: "9:15 pm", ar: "9:15 م" }, gap: s }
        - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" }, gap: m }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U02-06
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Proximity (NN/g): items close together are seen as one group with similar functions. A row of chips shows the four times as one set to pick from, and leaves the filled style to the step forward, Choose seats."
      ar: "جرّب أولًا. مبدأ التقارب (NN/g): العناصر القريبة من بعضها تُرى مجموعة واحدة لها وظيفة متشابهة. وصفّ من الـ Chips يعرض المواعيد الأربعة كمجموعة واحدة للاختيار منها، ويترك الشكل الممتلئ للخطوة إلى الأمام، «اختر المقاعد»."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "Items close together are likely to be perceived as part of the same group — sharing similar functionality or traits." }
    prompt:
      en: "Try each way to show the times. Which one should ship?"
      ar: "جرّب كل طريقة لعرض المواعيد. أيّها يجب أن تُطلق؟"
    start: buttons
    options:
      - id: buttons
        text: { en: "Four filled buttons, one under the other", ar: "أربعة أزرار ممتلئة، واحد تحت الآخر" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Trip to the Moon", ar: "رحلة إلى القمر" } }
            - { kind: meta, text: { en: "Friday · 2 h 10 min", ar: "الجمعة · 2 س 10 د" }, gap: xs }
            - { kind: button, text: { en: "1:30 pm", ar: "1:30 م" }, gap: m }
            - { kind: button, text: { en: "4:00 pm", ar: "4:00 م" }, gap: s }
            - { kind: button, text: { en: "6:45 pm", ar: "6:45 م" }, gap: s }
            - { kind: button, text: { en: "9:15 pm", ar: "9:15 م" }, gap: s }
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" }, gap: m }
      - id: chips
        text: { en: "A row of chips; the picked time shows ✓", ar: "صفّ من الـ Chips؛ والموعد المختار عليه ✓" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Trip to the Moon", ar: "رحلة إلى القمر" } }
            - { kind: meta, text: { en: "Friday · 2 h 10 min", ar: "الجمعة · 2 س 10 د" }, gap: xs }
            - kind: chips
              gap: m
              items:
                - { text: { en: "1:30 pm", ar: "1:30 م" } }
                - { text: { en: "4:00 pm", ar: "4:00 م" } }
                - { text: { en: "6:45 pm", ar: "6:45 م" }, on: true }
                - { text: { en: "9:15 pm", ar: "9:15 م" } }
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" }, gap: m }
      - id: menu
        text: { en: "A drop-down: \"Choose a time\"", ar: "قائمة منسدلة (Drop-down): «اختر موعدًا»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Trip to the Moon", ar: "رحلة إلى القمر" } }
            - { kind: meta, text: { en: "Friday · 2 h 10 min", ar: "الجمعة · 2 س 10 د" }, gap: xs }
            - { kind: select, label: { en: "Showtime", ar: "موعد العرض" }, text: { en: "Choose a time", ar: "اختر موعدًا" }, gap: m }
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" }, gap: m }
    answer: [chips]
    misconceptions:
      - id: MC-P14-070
        when: [buttons]
        feedback:
          en: "Five filled buttons look equally important, so Choose seats no longer stands out, and the times read as five separate actions instead of one set to pick from."
          ar: "خمسة أزرار ممتلئة تبدو متساوية في الأهمية، فلم يعد «اختر المقاعد» بارزًا، وتُقرأ المواعيد كخمسة إجراءات منفصلة بدل مجموعة واحدة يُختار منها."
      - id: MC-P14-049
        when: [menu]
        feedback:
          en: "Four short times fit on the screen. A drop-down hides them behind an extra tap, so people can't compare them at a glance."
          ar: "أربعة مواعيد قصيرة تتّسع لها الشاشة. والقائمة المنسدلة تُخفيها خلف ضغطة إضافية، فلا يقارن الناس بينها بنظرة واحدة."
    hints:
      - en: "Are the times four separate actions, or one set of choices?"
        ar: "هل المواعيد أربعة إجراءات منفصلة، أم مجموعة واحدة من الاختيارات؟"
    correct:
      en: "A row of chips: one set of related choices."
      ar: "صفّ من الـ Chips: مجموعة واحدة من الاختيارات المترابطة."
    explain:
      en: "The times sit together as one group, all visible, and the picked one is marked. Choose seats keeps the only filled button, so the next step is clear."
      ar: "المواعيد معًا كمجموعة واحدة، وكلها ظاهرة، والمختار منها عليه علامة. ويبقى «اختر المقاعد» الزر الممتلئ الوحيد، فتكون الخطوة التالية واضحة."

  - id: S03
    type: card
    part: concept
    icons: [tap, sort, ok, idea, target, order]
    video:
      src: clips/P14-C19.mp4
      captions: { ar: P14-C19.ar.vtt, en: P14-C19.en.vtt }
      who: { en: "Eyad Mahmoud, UX designer · UXGate", ar: "إياد محمود، مصمم UX · UXGate" }
      transcript:
        en: "The second component in actions is chips. Chips are small components, very similar to a button. They also give me the option to show the user some data, or to let the user take actions, as we'll see now in our examples, and we'll see how they differ from buttons. One of the most important differences and uses of chips is that I can put more than one chip in the same area, and the user can interact with them in one area. Unlike buttons: we said there should be one or two buttons, no more than three at most on the same screen, and we need them to be different types so we can prioritize, or give preference to one action: that the user needs to take this action on this page, and that it's the best one, and so on. But with chips I can use a group, more than one chip in the same place, so the user can take a certain action through them. Like when the user enters the people they want to email: they type their names or emails, and these appear as chips, and they can tap a chip to remove someone from the email, meaning they no longer want to send it to them. When they type someone else, that person is added as a chip, and so on. It can easily grow to a large group of chips in the same place. That's one of the most important differences from the button, and one of the main strengths of chips. The chips we'll usually use come in four types, the ones in front of us: assist, filter, input and suggestion chips. Each type, of course, has a different use, and these types are widely used in many products. The first type is assist chips: they let us move between different apps or products for certain actions. For example, if I'm looking at a restaurant's page and want to see where it is, its location on the map, I might have a chip that takes me out of the app to the maps app, where I see the location. Or if I want to book a certain time, so I want to check my calendar, or see certain meetings in it, I might have a chip that takes me to my calendar, shows me my appointments, and where exactly this one will fit, and so on. So the main job of assist chips is to connect apps, or let us move between apps, going from one to another in a certain scenario. Filter chips almost all of us know and use: they usually sit under the search, for example, or on any page with a set of products, or any page where I'm browsing. I may have a set of filters as chips; if I tap any of them, it starts applying to the content on the page, filtering it based on the chip I tapped. We also talked about filters, and chips are among the most common components used in filters, especially in mobile and tablet apps. There are also examples like an image site: on the left the filter is made of a set of chips, and any chip I tap applies that filter immediately. That takes us to the next type, the input chip. When I choose something in the filter and it's now applied, it may show up as an input chip. An input chip is something I entered as a user, shown to me as an input chip, and I can tap it to remove the input I entered. Like the filter example: I've chosen a filter like Vectors on the image site; if I tap the Vectors chip, that filter is no longer applied. And the example of the people I entered in an email to send it to them: as soon as I type a name and press Enter, or move on to the next person, it turns into an input chip automatically, an input I entered, and if I tap it later it cancels that input completely, it deletes it, and so on. So that's the third type of chips, input chips. The fourth and last type is suggestion chips: they appear to suggest certain actions to me, or anything in a scenario I'm in. Like when I translate a word and there are other similar words: I may see a set of chips with different words related to the word I'm translating, and I tap any of them to see its translation, and so on. So they're suggestions related to what I already did, or the scenario I'm in. Another example is the chips that appear in some chats: sometimes when someone sends us a message, a set of chips appears suggesting different replies to it. These are all examples of suggestion chips. One of the important guidelines for chips in general is having a group in the same place. All the examples, uses and types of chips we covered are used as a group of actions in the same place. Usually I don't put a single chip and make it do a single action; then it's like a button. That's the difference between chips and buttons: when there's a group in the same place doing actions related to the types we talked about, I use chips. But when I have one main action, usually not closely tied to the actions we just mentioned, I'll use one component to express it, and that will be the button. But if I want the user to have different actions related to the ones we just mentioned, chips are the best fit. That's the difference between buttons and chips. Also, buttons are usually used to take me a step forward or a step back in the flow I'm in, or to let me take a main action, like posting now, for example, or publishing something, and so on. That's where we use buttons. But chips, as we said, have specific uses, especially in the scenarios and types we just covered."
        ar: "تاني Component معانا في الـ Actions هو الـ Chips. الـ Chips هي Components صغيرة شبه الـ Button جدًا، بتديني برضه الـ Option إني أعرض لليوزر بعض الداتا، أو إني أخلّي اليوزر ياخد Actions معانا، زي ما هنشوف دلوقتي في الأمثلة اللي معانا، وهنشوف الفرق بينها وبين الـ Buttons. من أهم الفروقات والاستخدامات للـ Chips إني أقدر أحط منها أكتر من Chip في نفس الـ Area، واليوزر يقدر يتفاعل معاهم في Area واحدة. على عكس لما اتكلمنا عن الـ Buttons، وقلنا إن يكون فيه Button واحد أو اتنين، وما نتعدّاش تلاتة بالكتير في نفس الـ Screen، ومحتاجين نخلّيهم من Types مختلفة عشان نعمل Prioritize، أو ندي أفضلية لأحد الـ Actions: إن اليوزر محتاج ياخد الـ Action ده في الصفحة دي، وده اللي هيكون الأفضل، وهكذا. لكن الـ Chips ممكن أستخدم منها مجموعة، أكتر من Chip في نفس المكان، عشان اليوزر يعمل من خلالهم Action معيّن. زي لما اليوزر بيدخّل الناس اللي عايز يبعت لهم الإيميل: بيكتب أساميهم أو إيميلاتهم، فبيظهروا له على شكل Chips، وبيقدر يضغط على الـ Chip عشان يحذف حد من الإيميل، يعني مش عايز يبعت له الإيميل ده خلاص. ولما بيكتب حد تاني بيتضاف على شكل Chip، وهكذا. ممكن يوصل عادي لمجموعة كبيرة من الـ Chips في نفس المكان. وده من أهم الاختلافات بينها وبين الـ Button، ومن أهم مميزات الـ Chips. الـ Chips اللي هنستخدمها عادةً أربع Types، اللي قدامنا: Assist وFilter وInput وSuggestion chips. كل نوع فيهم طبعًا ليه استخدام مختلف عن التاني، والأنواع دي مستخدمة بشكل كبير في منتجات كتير. أول نوع معانا هو الـ Assist chips، وهو اللي بيخلّينا نروح بين Apps أو Products مختلفة في Actions معيّنة. على سبيل المثال، لو أنا بشوف صفحة مطعم، وعايز أشوف مكان المطعم ده أو الـ Location بتاعه على الخريطة، ممكن يكون عندي Chip بتطلّعني من الـ App وتوديني لتطبيق الخرائط، أشوف من عليه الـ Location. أو لو أنا عايز أحجز ميعاد معيّن، فعايز أشوف الـ Calendar عندي، أو أشوف Meetings معيّنة في الـ Calendar، فممكن يكون عندي Chip توديني للـ Calendar بتاعي، تخلّيني أشوف المواعيد اللي عندي، وأشوف الميعاد ده هيكون فين بالظبط، وهكذا. فالـ Assist chips مهمتها الأساسية إنها تربط بين الـ Apps، أو تخلّينا ننتقل بين الـ Apps، أروح من واحد للتاني في Scenario معيّن. أما الـ Filter chips فكلنا تقريبًا عارفينها وبنستخدمها: اللي بتكون موجودة عادةً تحت الـ Search مثلًا، أو في أي صفحة فيها مجموعة من المنتجات، أو أي صفحة ممكن أكون بعمل فيها Browse، بتصفّح فيها. ممكن يكون عندي مجموعة من الفلاتر على شكل Chips، لو ضغطت على أي Chip فيهم بتبدأ تتطبّق على المحتوى اللي موجود في الصفحة، وتفلتر لي المحتوى ده بناءً على الـ Chip اللي أنا ضغطت عليها. واحنا اتكلمنا برضه عن الفلاتر، فمن أشهر الـ Components المستخدمة في الفلاتر الـ Chips، بالذات في الـ Applications اللي على الموبايل والتابلت. وبرضه فيه أمثلة زي موقع صور: على الشمال عندي الفلتر مكوّن من مجموعة من الـ Chips، أي Chip أضغط عليها بيبدأ يطبّق الفلتر ده مباشرةً. وده يودّينا للنوع اللي بعد كده، وهو الـ Input chip. لما باختار حاجة معيّنة في الفلتر، وتبدأ تتطبّق كفلتر متطبّق دلوقتي، ممكن تظهر لي في شكل Input chip. الـ Input chip هي عبارة عن حاجة أنا دخّلتها كيوزر، فظهرت لي في شكل Input chip، وممكن أضغط عليها عشان أشيل الـ Input اللي أنا دخّلته ده. زي المثال اللي قلناه بتاع الفلتر: أنا مختار فلتر معيّن زي Vectors في موقع الصور، لو ضغطت على الـ Chip بتاعة Vectors، هخلّي الفلتر ده مش متطبّق خلاص. وبرضه مثال الناس اللي دخّلتهم في الإيميل عشان أبعت لهم: بمجرد ما كتبت الاسم وضغطت Enter، أو رحت للشخص اللي بعده، بيحوّله تلقائيًا لـ Input chip، عبارة عن Input أنا دخّلته، ولو ضغطت عليها بعد كده هيلغي الـ Input ده خالص، هيحذفه، وهكذا. فده النوع التالت من الـ Chips، وهو الـ Input chips. رابع نوع معانا والنوع الأخير هو الـ Suggestion chips، ودي اللي بتظهر لي عشان تقترح عليّا Actions معيّنة، أو أي حاجة في Scenario معيّن أنا موجود فيه. زي لو أنا بترجم كلمة معيّنة، وفيه كلمات تانية شبهها، ممكن ألاقي مجموعة من الـ Chips ظهرت لي فيها كلمات مختلفة ليها علاقة بالكلمة اللي أنا بترجمها، أضغط على أي كلمة فيهم فأشوف ترجمتها إيه، وهكذا. فهي اقتراحات ليها علاقة بالحاجة اللي أنا أصلًا عملتها، أو الـ Scenario اللي أنا موجود فيه. وبرضه الـ Chips اللي بتظهر في بعض الـ Chats: أحيانًا لما حد يبعت لنا رسالة، بيظهر لنا مجموعة من الـ Chips تقترح علينا ردود مختلفة على الرسالة دي. فدي كلها أمثلة على الـ Suggestion chips. ومن الـ Guidelines المهمة اللي قلناها في الـ Chips عمومًا فكرة إن بيكون عندي مجموعة في نفس المكان. كل الأمثلة والاستخدامات والـ Types اللي قلناها على الـ Chips بتُستخدم كمجموعة من الـ Actions في نفس المكان. عادةً مش بحط Chip واحدة وأخلّيها تعمل Action واحد، هنا بتبقى كأنها Button. ده الفرق بين الـ Chips والـ Buttons: لما بيكون فيه مجموعة في نفس المكان بتعمل Actions ليها علاقة بالـ Types اللي اتكلمنا عنها، هنا بستخدم الـ Chips. لكن لما بيكون عندي Action واحد رئيسي، وعادةً مش مرتبط أوي بالـ Actions اللي قلناها من شوية، هنا هستخدم Component واحد يعبّر عن الـ Action ده، وهيكون هو الـ Button. لكن لو عايز أخلّي اليوزر عنده Actions مختلفة ليها علاقة بالـ Actions اللي قلناها من شوية، هنا الـ Chips هي الأنسب. وده الفارق بين الـ Buttons والـ Chips. كمان عادةً الـ Buttons بتُستخدم عشان تخلّيني آخد خطوة لقدّام أو خطوة لورا في الـ Flow اللي أنا ماشي فيه، أو تخلّيني آخد Action رئيسي، زي إني هعمل Post دلوقتي مثلًا، أو Publish لحاجة معيّنة، وهكذا. فهنا بنستخدم الـ Buttons. لكن الـ Chips زي ما قلنا ليها استخدامات معيّنة، خاصةً في الـ Scenarios والـ Types اللي قلناها من شوية."
    title: { en: "Chips: a group of related choices", ar: "الـ Chips: مجموعة من الاختيارات المترابطة" }
    body:
      en: "A chip is a small interactive element that shows a piece of information or does a task. Unlike buttons, which stay at one to three per screen, chips come as a group in one area.\n\n- **Assist chips** take people to another app for a task, like Directions opening the maps app, or Add to calendar.\n- **Filter chips** sit under a search or above a list, and apply as soon as people tap them.\n- **Input chips** show what people entered, like an email's recipients or an applied filter. One tap on ✕ removes them.\n- **Suggestion chips** offer next steps that fit what people are doing, like related words in a translator or quick replies in a chat.\n- **One main action is a button:** a single chip that does one thing is really a button.\n- **Steps forward or back** in a flow, like Save, Cancel, Post or Publish, are buttons."
      ar: "الـ Chip عنصر صغير تفاعلي يعرض معلومة أو ينفّذ مهمة. وعلى عكس الأزرار، التي تبقى من واحد إلى ثلاثة في الشاشة، تأتي الـ Chips كمجموعة في مكان واحد.\n\n- **Assist chips** تنقل الناس إلى تطبيق آخر لمهمة، مثل «الاتجاهات» التي تفتح تطبيق الخرائط، أو «أضف إلى التقويم».\n- **Filter chips** تكون تحت البحث أو فوق قائمة، وتُطبَّق بمجرد أن يضغطها الناس.\n- **Input chips** تعرض ما أدخله الناس، مثل المرسَل إليهم في رسالة بريد، أو فلتر مطبَّق. وضغطة واحدة على ✕ تحذفها.\n- **Suggestion chips** تقترح خطوات تالية تناسب ما يفعله الناس، مثل كلمات قريبة في تطبيق ترجمة، أو ردود سريعة في محادثة.\n- **الإجراء الرئيسي الواحد زر:** الـ Chip الوحيدة التي تفعل شيئًا واحدًا هي في الحقيقة زر.\n- **الخطوات للأمام أو للخلف** في المسار، مثل «حفظ» و«إلغاء» و«انشر»، أزرار."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U02-06
    rules: [R06, R15]
    value:
      en: "User control and freedom (NN/g): people often act by mistake and need a clear way out without a long process. As input chips, each recipient has its own ✕, so one tap removes one person; in comma-separated text, people must place the cursor and delete letters, or clear everything."
      ar: "تحكّم المستخدم وحرّيته (NN/g): كثيرًا ما يخطئ الناس، ويحتاجون إلى مخرج واضح دون خطوات طويلة. وفي الـ Input chips، لكل مستلم ✕ خاصة به، فضغطة واحدة تحذف شخصًا واحدًا؛ أما في نص تفصله فواصل، فعلى الناس وضع المؤشر ومسح الحروف، أو مسح كل شيء."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Users often perform actions by mistake." }
    scenario:
      en: "Rania's email app. People often add the wrong colleague to **To** and need to remove just that one person before sending."
      ar: "تطبيق البريد لرانيا. كثيرًا ما يضيف الناس الزميل الخطأ إلى **إلى**، ويحتاجون إلى حذف هذا الشخص وحده قبل الإرسال."
    prompt:
      en: "Try each version of the To field. Which one should ship?"
      ar: "جرّب كل نسخة من حقل «إلى». أيّها يجب أن تُطلق؟"
    start: text
    options:
      - id: text
        text: { en: "Plain text, names separated by commas", ar: "نص عادي، والأسماء تفصلها فواصل" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Mona Adel, Karim Fathy, Salma Nour", ar: "منى عادل، كريم فتحي، سلمى نور" }, filled: true }
            - { kind: field, label: { en: "Subject", ar: "الموضوع" }, text: { en: "Plan for next week", ar: "خطة الأسبوع القادم" }, filled: true, gap: s }
            - { kind: button, text: { en: "Send", ar: "أرسل" }, gap: m }
      - id: chips
        text: { en: "Each person is a chip with ✕", ar: "كل شخص Chip عليها ✕" }
        mock:
          width: 300
          blocks:
            - kind: chips
              label: { en: "To", ar: "إلى" }
              boxed: true
              items:
                - { text: { en: "Mona Adel", ar: "منى عادل" }, x: true }
                - { text: { en: "Karim Fathy", ar: "كريم فتحي" }, x: true }
                - { text: { en: "Salma Nour", ar: "سلمى نور" }, x: true }
            - { kind: field, label: { en: "Subject", ar: "الموضوع" }, text: { en: "Plan for next week", ar: "خطة الأسبوع القادم" }, filled: true, gap: s }
            - { kind: button, text: { en: "Send", ar: "أرسل" }, gap: m }
      - id: locked
        text: { en: "Chips without ✕; to remove one, clear the field and start again", ar: "Chips بدون ✕؛ ولحذف شخص، امسح الحقل وابدأ من جديد" }
        mock:
          width: 300
          blocks:
            - kind: chips
              label: { en: "To", ar: "إلى" }
              boxed: true
              items:
                - { text: { en: "Mona Adel", ar: "منى عادل" } }
                - { text: { en: "Karim Fathy", ar: "كريم فتحي" } }
                - { text: { en: "Salma Nour", ar: "سلمى نور" } }
            - { kind: link, text: { en: "Clear all", ar: "امسح الكل" }, gap: xs }
            - { kind: field, label: { en: "Subject", ar: "الموضوع" }, text: { en: "Plan for next week", ar: "خطة الأسبوع القادم" }, filled: true, gap: s }
            - { kind: button, text: { en: "Send", ar: "أرسل" }, gap: m }
    answer: [chips]
    misconceptions:
      - id: MC-P14-071
        when: [text, locked]
        feedback:
          en: "Removing one wrong person takes careful editing or starting over. People in a hurry may send the email to the wrong colleague instead."
          ar: "حذف شخص واحد خطأ يحتاج إلى تعديل دقيق أو البدء من جديد. ومن يستعجل قد يرسل الرسالة إلى الزميل الخطأ بدلًا من ذلك."
    correct:
      en: "Input chips, each with its own ✕."
      ar: "Input chips، لكل منها ✕ خاصة بها."
    explain:
      en: "Each recipient is a clear unit people can check at a glance, and one tap on ✕ removes exactly the wrong one."
      ar: "كل مستلم وحدة واضحة يراجعها الناس بنظرة، وضغطة واحدة على ✕ تحذف الشخص الخطأ بالضبط."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U02-06
    rules: [R06, R15]
    confidence: true
    value:
      en: "Filters (NN/g): use interactive filters if people are exploring. People browsing photos try one type, look, and try another, so chips that apply as soon as they're tapped beat a separate Filters page with an Apply button."
      ar: "الفلاتر (NN/g): استخدم الفلاتر التفاعلية إذا كان الناس يستكشفون. ومن يتصفّح الصور يجرّب نوعًا، وينظر، ثم يجرّب غيره، لذلك فالـ Chips التي تُطبَّق بمجرد الضغط أفضل من صفحة «فلاتر» منفصلة بزر «طبّق»."
    ref: { url: "https://www.nngroup.com/articles/applying-filters/", quote: "Use interactive filters if your users are exploratory in their search." }
    scenario:
      en: "Hazem's site sells photos, vectors and icons. People search for a word, like **coffee**, then switch between types to see what fits their design."
      ar: "موقع حازم يبيع صورًا ورسومات Vectors وأيقونات. والناس يبحثون عن كلمة، مثل **قهوة**، ثم يتنقّلون بين الأنواع ليروا ما يناسب تصميمهم."
    prompt:
      en: "Try each way to pick a type. Which one should ship?"
      ar: "جرّب كل طريقة لاختيار النوع. أيّها يجب أن تُطلق؟"
    start: page
    options:
      - id: page
        text: { en: "A Filters button that opens a page, with Apply at the bottom", ar: "زر «فلاتر» يفتح صفحة، وفي أسفلها «طبّق»" }
        mock:
          width: 300
          blocks:
            - { kind: field, text: { en: "coffee", ar: "قهوة" }, filled: true }
            - { kind: button, emphasis: low, text: { en: "Filters", ar: "فلاتر" }, gap: s }
            - { kind: image, size: m, text: { en: "Results", ar: "النتائج" }, gap: s }
      - id: chips
        text: { en: "Filter chips under the search, applied on tap", ar: "Filter chips تحت البحث، تُطبَّق عند الضغط" }
        mock:
          width: 300
          blocks:
            - { kind: field, text: { en: "coffee", ar: "قهوة" }, filled: true }
            - kind: chips
              gap: s
              items:
                - { text: { en: "Photos", ar: "صور" } }
                - { text: { en: "Vectors", ar: "Vectors" }, on: true }
                - { text: { en: "Icons", ar: "أيقونات" } }
            - { kind: image, size: m, text: { en: "Vector results", ar: "نتائج Vectors" }, gap: s }
      - id: loud
        text: { en: "Three filled buttons under the search", ar: "ثلاثة أزرار ممتلئة تحت البحث" }
        mock:
          width: 300
          blocks:
            - { kind: field, text: { en: "coffee", ar: "قهوة" }, filled: true }
            - kind: row
              gap: s
              blocks:
                - { kind: button, text: { en: "Photos", ar: "صور" } }
                - { kind: button, text: { en: "Vectors", ar: "Vectors" } }
                - { kind: button, text: { en: "Icons", ar: "أيقونات" } }
            - { kind: image, size: m, text: { en: "Results", ar: "النتائج" }, gap: s }
    answer: [chips]
    misconceptions:
      - id: MC-P14-070
        when: [loud]
        feedback:
          en: "Three filled buttons look like three separate main actions, and none shows which type is on now."
          ar: "ثلاثة أزرار ممتلئة تبدو كثلاثة إجراءات رئيسية منفصلة، ولا يوضّح أيٌّ منها النوع المختار الآن."
    hints:
      - en: "How many times will people switch type while they explore?"
        ar: "كم مرة سيغيّر الناس النوع وهم يستكشفون؟"
    correct:
      en: "Filter chips, applied on tap."
      ar: "Filter chips، تُطبَّق عند الضغط."
    explain:
      en: "People see every type, switch with one tap and watch the results change at once. The ✓ shows which type is on."
      ar: "يرى الناس كل الأنواع، ويغيّرون بضغطة واحدة، ويشاهدون النتائج تتغيّر فورًا. وعلامة ✓ توضّح النوع المختار."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U02-06
    rules: [R11]
    value:
      en: "Similarity (NN/g): a separate color is reserved for the primary call to action. Publish is the one main step on this screen, so it's a filled button; chips are for the group of related extras, like adding photos or tagging dishes."
      ar: "مبدأ التشابه (NN/g): يُخصَّص لون منفصل للإجراء الرئيسي. و«انشر» هو الخطوة الرئيسية الوحيدة في هذه الشاشة، لذلك هو زر ممتلئ؛ والـ Chips لمجموعة الإضافات المترابطة، مثل إضافة صور أو تحديد الأطباق."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Thus, a separate color should be reserved for primary calls-to-action to help them stand out among secondary buttons." }
    scenario:
      en: "A food app where people review restaurants. When they finish writing, they publish the review."
      ar: "تطبيق طعام يكتب فيه الناس تقييمات للمطاعم. وحين ينتهون من الكتابة، ينشرون التقييم."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: Publish is a chip", ar: "النسخة A: «انشر» Chip" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Share your experience", ar: "شارك تجربتك" } }
          - { kind: field, text: { en: "Great koshary, fast service.", ar: "كشري ممتاز وخدمة سريعة." }, filled: true, gap: s }
          - kind: chips
            gap: m
            items:
              - { text: { en: "Publish", ar: "انشر" } }
    b:
      label: { en: "Version B: chips for extras, Publish as a button", ar: "النسخة B: Chips للإضافات، و«انشر» زر" }
      mock:
        width: 260
        blocks:
          - { kind: title, text: { en: "Share your experience", ar: "شارك تجربتك" } }
          - { kind: field, text: { en: "Great koshary, fast service.", ar: "كشري ممتاز وخدمة سريعة." }, filled: true, gap: s }
          - kind: chips
            gap: s
            items:
              - { text: { en: "Photos", ar: "صور" }, icon: "＋" }
              - { text: { en: "Dishes", ar: "أطباق" }, icon: "＋" }
          - { kind: button, text: { en: "Publish", ar: "انشر" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-069
        when: [a]
        feedback:
          en: "A lone chip is really a small, quiet button. The one step that finishes the task now looks like an optional extra, and some people won't spot it."
          ar: "الـ Chip الوحيدة هي في الحقيقة زر صغير وهادئ. والخطوة الوحيدة التي تُنهي المهمة تبدو الآن إضافة اختيارية، وبعض الناس لن يلاحظوها."
    correct:
      en: "B: the main step is a button; chips hold the related extras."
      ar: "B: الخطوة الرئيسية زر؛ والـ Chips للإضافات المترابطة."
    explain:
      en: "Publish stands out as the step forward. Photos and dishes sit together as a small group of related, optional actions."
      ar: "«انشر» بارز كخطوة إلى الأمام. والصور والأطباق معًا كمجموعة صغيرة من الإجراءات المترابطة الاختيارية."

  - id: S07
