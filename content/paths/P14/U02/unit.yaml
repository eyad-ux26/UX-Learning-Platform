id: P14-U02
free: false
title:
  en: "Show what's needed, make the next step obvious"
  ar: "أظهر المطلوب، ووضّح الخطوة التالية"
skill:
  en: "Decide what to collapse into an accordion, which action gets the loudest button, when a floating action button earns its place, and when a group of choices should be chips."
  ar: "قرّر ما تطويه في الـ Accordion، وأيّ إجراء يأخذ أوضح زر، ومتى يستحق الـ Floating action button مكانه، ومتى تكون مجموعة الاختيارات Chips."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U02-01
    title: { en: "Collapse only what most people skip", ar: "لا تطوِ إلا ما يتخطّاه أغلب الناس" }
    can_do: { en: "Use an accordion when people need only a few sections of a long page, and show everything when they need most of it.", ar: "استخدم الـ Accordion حين يحتاج الناس أقسامًا قليلة من صفحة طويلة، واعرض كل شيء حين يحتاجون أغلبه." }
  - id: SK-P14-U02-02
    title: { en: "Never collapse what people must see", ar: "لا تطوِ أبدًا ما يجب أن يراه الناس" }
    can_do: { en: "Keep a fee, a deadline or a warning outside closed panels, so nobody misses it.", ar: "أبقِ الرسوم أو الموعد النهائي أو التحذير خارج الأقسام المطويّة، حتى يراها الجميع." }
  - id: SK-P14-U02-03
    title: { en: "Make one action stand out", ar: "اجعل إجراءً واحدًا هو الأوضح" }
    can_do: { en: "Give the main action of an area its own filled style and keep the other actions quieter, so people see at once which button moves them forward.", ar: "أعطِ الإجراء الرئيسي في كل منطقة شكلًا ممتلئًا خاصًا به، واجعل باقي الإجراءات أهدأ، حتى يرى الناس فورًا أيّ زر ينقلهم إلى الخطوة التالية." }
  - id: SK-P14-U02-04
    title: { en: "Keep frequent actions in sight", ar: "أبقِ الإجراءات المتكرّرة ظاهرة" }
    can_do: { en: "Show the actions people use often directly on the screen, and move rare, low-priority ones into a menu.", ar: "اعرض الإجراءات التي يستخدمها الناس كثيرًا على الشاشة مباشرة، وانقل الإجراءات النادرة وقليلة الأهمية إلى قائمة." }
  - id: SK-P14-U02-05
    title: { en: "Float only the screen's main action", ar: "لا تعطِ الزر العائم إلا للإجراء الرئيسي في الشاشة" }
    can_do: { en: "Use one floating action button for the most common and important action on a screen, and give it a text label when its icon could be unclear.", ar: "استخدم Floating action button واحدًا للإجراء الأكثر استخدامًا وأهمية في الشاشة، وأعطِه تسمية نصية حين قد تكون أيقونته غير واضحة." }
  - id: SK-P14-U02-06
    title: { en: "Use chips for a group of related choices", ar: "استخدم الـ Chips لمجموعة من الاختيارات المترابطة" }
    can_do: { en: "Show related small choices in one area as a row of chips (filters, entered items, suggestions, quick actions), make entered chips removable, and keep a single main step like Save or Post as a button.", ar: "اعرض الاختيارات الصغيرة المترابطة في مكان واحد في صفّ من الـ Chips (فلاتر، أو عناصر مُدخلة، أو اقتراحات، أو إجراءات سريعة)، واجعل الـ Chips المُدخلة قابلة للحذف، وأبقِ الخطوة الرئيسية الواحدة مثل «حفظ» أو «انشر» زرًا." }
