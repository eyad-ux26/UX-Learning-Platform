id: P14-U02-L01
mode: lesson
minutes: 8
title:
  en: "Accordions: collapse what people skip"
  ar: "الـ Accordion: اطوِ ما يتخطّاه الناس"
sources:
  - title: { en: "Accordions on Desktop: When and How to Use (NN/g)", ar: "الـ Accordion على الكمبيوتر: متى وكيف نستخدمه (NN/g)" }
    url: "https://www.nngroup.com/articles/accordions-on-desktop/"
  - title: { en: "Accordions on Mobile (NN/g)", ar: "الـ Accordion على الموبايل (NN/g)" }
    url: "https://www.nngroup.com/articles/mobile-accordions/"
review_labels:
  MC-P14-016: { en: "Don't collapse what people read anyway", ar: "لا تطوِ ما سيقرؤه الناس على أي حال" }
  MC-P14-017: { en: "A long open page buries the part people came for", ar: "الصفحة الطويلة المفتوحة تدفن الجزء الذي جاء الناس من أجله" }
  MC-P14-018: { en: "What's collapsed can be missed altogether", ar: "ما يُطوى قد يفوت الناس تمامًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Laila's insurance app", ar: "تطبيق التأمين لليلى" }
    body:
      en: "Laila wants to know one thing: does her health plan cover a dental cleaning?\n\nShe opens **Your plan**. All nine sections are open, one under the other: doctors, hospitals, medicines, eyes, dental, maternity, abroad, claims and terms. Dental is the fifth section, five screens down."
      ar: "تريد ليلى أن تعرف شيئًا واحدًا: هل يغطّي تأمينها الصحي تنظيف الأسنان؟\n\nفتحت **خطّتك**. كل الأقسام التسعة مفتوحة، واحدًا تحت الآخر: الأطباء، والمستشفيات، والأدوية، والعيون، والأسنان، والولادة، والسفر، والمطالبات، والشروط. والأسنان هي القسم الخامس، بعد خمس شاشات."
    mock:
      width: 300
      blocks: &open
        - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
        - { kind: heading, text: { en: "Doctors", ar: "الأطباء" }, gap: m }
        - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%. Specialists need a referral from your family doctor, except for…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%. والمتخصّصون يحتاجون تحويلًا من طبيب الأسرة، ما عدا…" }, gap: xs }
        - { kind: heading, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
        - { kind: small, text: { en: "Stays in a shared room are fully covered. A private room is covered up to EGP 1,500 a night, and…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل. والغرفة الخاصة مغطّاة حتى 1,500 جنيه في الليلة، و…" }, gap: xs }
        - { kind: heading, text: { en: "Medicines", ar: "الأدوية" }, gap: m }
        - { kind: small, text: { en: "Medicines on the plan's list are covered at 70% with a prescription…", ar: "الأدوية الموجودة في قائمة الخطّة مغطّاة بنسبة 70% مع روشتة…" }, gap: xs }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U02-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Accordions (NN/g): use them on content-heavy pages where people need only a few sections; they scan the titles and skip the rest. Bigger headings still leave Laila scrolling past everything, and \"Show more\" hides sections she can't even see the names of."
      ar: "جرّب أولًا. الـ Accordion (NN/g): استخدمه في الصفحات المليئة بالمحتوى حين يحتاج الناس أقسامًا قليلة؛ فيتصفّحون العناوين ويتخطّون الباقي. والعناوين الأكبر تترك ليلى تمرّ على كل شيء، و«اعرض المزيد» يخفي أقسامًا لا ترى حتى أسماءها."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "When users need only a few pieces of information on the page, they will likely skip most of the content." }
    prompt:
      en: "Try each version of the plan page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الخطّة. أيّها يجب أن تُطلق؟"
    start: bigger
    options:
      - id: bigger
        text: { en: "Keep every section open, with bigger headings", ar: "أبقِ كل الأقسام مفتوحة، مع عناوين أكبر" }
        mock:
          caption: { en: "Dental is still five screens down", ar: "الأسنان ما زالت بعد خمس شاشات" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
            - { kind: title, text: { en: "Doctors", ar: "الأطباء" }, gap: m }
            - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%. Specialists need a referral from your family doctor, except for…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%. والمتخصّصون يحتاجون تحويلًا من طبيب الأسرة، ما عدا…" }, gap: xs }
            - { kind: title, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
            - { kind: small, text: { en: "Stays in a shared room are fully covered. A private room is covered up to EGP 1,500 a night, and…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل. والغرفة الخاصة مغطّاة حتى 1,500 جنيه في الليلة، و…" }, gap: xs }
      - id: more
        text: { en: "Show the first three sections, and the rest behind \"Show more\"", ar: "اعرض الأقسام الثلاثة الأولى، والباقي خلف «اعرض المزيد»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
            - { kind: heading, text: { en: "Doctors", ar: "الأطباء" }, gap: m }
            - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%…" }, gap: xs }
            - { kind: heading, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
            - { kind: small, text: { en: "Stays in a shared room are fully covered…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل…" }, gap: xs }
            - { kind: heading, text: { en: "Medicines", ar: "الأدوية" }, gap: m }
            - { kind: small, text: { en: "Medicines on the plan's list are covered at 70%…", ar: "الأدوية الموجودة في قائمة الخطّة مغطّاة بنسبة 70%…" }, gap: xs }
            - { kind: link, text: { en: "Show more", ar: "اعرض المزيد" }, gap: m }
      - id: accordion
        text: { en: "Collapse each section under its title; tap a title to open it", ar: "اطوِ كل قسم تحت عنوانه؛ واضغط العنوان لفتحه" }
        mock:
          width: 300
          blocks: &acc
            - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "Doctors", ar: "الأطباء" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Hospitals", ar: "المستشفيات" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Medicines", ar: "الأدوية" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Eyes", ar: "العيون" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Dental", ar: "الأسنان" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Maternity", ar: "الولادة" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Abroad", ar: "السفر" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Claims", ar: "المطالبات" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Terms", ar: "الشروط" } }, { kind: meta, text: "+" }] }
    answer: [accordion]
    misconceptions:
      - id: MC-P14-017
        when: [bigger]
        feedback:
          en: "The headings are easier to see, but Laila still scrolls past four full sections she doesn't need before she reaches Dental."
          ar: "صار رؤية العناوين أسهل، لكن ليلى ما زالت تمرّ على أربعة أقسام كاملة لا تحتاجها قبل أن تصل إلى الأسنان."
      - id: MC-P14-018
        when: [more]
        feedback:
          en: "Dental is one of the hidden sections, and nothing on the screen says it's there. Laila may decide the plan doesn't mention dental at all."
          ar: "الأسنان من الأقسام المخفية، ولا شيء على الشاشة يقول إنها موجودة. فقد تظنّ ليلى أن الخطّة لا تذكر الأسنان أصلًا."
    hints:
      - en: "Which version lets Laila see the name of every section without scrolling past the others?"
        ar: "أيّ نسخة تجعل ليلى ترى اسم كل قسم دون أن تمرّ على الأقسام الأخرى؟"
    correct:
      en: "She needs one section: titles first, details on tap."
      ar: "تحتاج قسمًا واحدًا: العناوين أولًا، والتفاصيل عند الضغط."
    explain:
      en: "All nine titles now fit on one screen. Laila spots Dental, opens it, and never has to read about hospitals or maternity."
      ar: "صارت العناوين التسعة كلها في شاشة واحدة. فترى ليلى «الأسنان» وتفتحه، ولا تحتاج أن تقرأ عن المستشفيات أو الولادة."

  - id: S03
    type: card
    part: concept
    icons: [layers, eye, warn]
    title: { en: "Collapse what most people skip", ar: "اطوِ ما يتخطّاه أغلب الناس" }
    body:
      en: "An accordion shows a list of titles; each one opens its content in place.\n\n- **Use it** when people need only a few sections of a long page, like a plan's details or an FAQ. They scan the titles and open what they came for.\n- **Show everything** when people need most of the content. Opening section after section costs taps and breaks their reading.\n- **Never collapse what people must see**, like a fee, a deadline or a warning. Content in a closed panel can be missed altogether."
      ar: "الـ Accordion يعرض قائمة عناوين؛ وكل عنوان يفتح محتواه في مكانه.\n\n- **استخدمه** حين يحتاج الناس أقسامًا قليلة من صفحة طويلة، مثل تفاصيل خطّة أو صفحة أسئلة شائعة. فيتصفّحون العناوين ويفتحون ما جاؤوا من أجله.\n- **اعرض كل شيء** حين يحتاج الناس أغلب المحتوى. ففتح قسم بعد قسم يكلّف ضغطات ويقطع قراءتهم.\n- **لا تطوِ أبدًا ما يجب أن يراه الناس**، مثل رسوم أو موعد نهائي أو تحذير. فالمحتوى في قسم مطويّ قد يفوت الناس تمامًا."

  - id: S04
    type: tune
    part: guided
    skill: SK-P14-U02-01
    rules: [R06, R15]
    value:
      en: "Accordions (NN/g): if people need information from several sections at once, display all the content. Setup steps are all needed, in order, so collapsing them only adds taps and hides the step Nader just did."
      ar: "الـ Accordion (NN/g): إن احتاج الناس معلومات من عدة أقسام معًا، فاعرض كل المحتوى. وخطوات التركيب كلها مطلوبة وبالترتيب، فطيّها يزيد الضغطات فقط ويُخفي الخطوة التي أنهاها نادر للتوّ."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "If you expect users to need information from several accordions at once, it is better to display all the content at once" }
    scenario:
      en: "Nader is setting up a new internet router at home. The help page has six short steps. He has to do every step, in order, looking from the page to the router and back."
      ar: "يركّب نادر راوتر إنترنت جديدًا في البيت. وصفحة المساعدة فيها ست خطوات قصيرة. وعليه أن ينفّذ كل خطوة بالترتيب، وهو ينظر إلى الصفحة ثم إلى الراوتر ثم يعود."
    prompt:
      en: "Try each version of the help page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة المساعدة. أيّها يجب أن تُطلق؟"
    start: collapsed
    options:
      - id: list
        text: { en: "All six steps open, as one numbered list", ar: "الخطوات الست مفتوحة، كقائمة واحدة مرقّمة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Set up your router", ar: "ركّب الراوتر" } }
            - { kind: text, weight: bold, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" }, gap: m }
            - { kind: small, text: { en: "Use the yellow port marked WAN.", ar: "استخدم المنفذ الأصفر المكتوب عليه WAN." }, gap: xs }
            - { kind: text, weight: bold, text: { en: "2. Turn it on", ar: "2. شغّله" }, gap: m }
            - { kind: small, text: { en: "Press the button on the back for 2 seconds.", ar: "اضغط الزر الخلفي لمدة ثانيتين." }, gap: xs }
            - { kind: text, weight: bold, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" }, gap: m }
            - { kind: small, text: { en: "It takes about a minute.", ar: "يستغرق ذلك دقيقة تقريبًا." }, gap: xs }
            - { kind: text, weight: bold, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" }, gap: m }
            - { kind: small, text: { en: "The name and password are on the sticker.", ar: "الاسم وكلمة المرور على الملصق." }, gap: xs }
      - id: collapsed
        text: { en: "Each step collapsed under its title", ar: "كل خطوة مطويّة تحت عنوانها" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Set up your router", ar: "ركّب الراوتر" } }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "2. Turn it on", ar: "2. شغّله" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" } }, { kind: meta, text: "+" }] }
      - id: one
        text: { en: "Only one step open at a time; opening the next closes the last", ar: "خطوة واحدة مفتوحة في كل مرة؛ وفتح التالية يغلق السابقة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Set up your router", ar: "ركّب الراوتر" } }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "2. Turn it on", ar: "2. شغّله" } }, { kind: meta, text: "−" }] }
            - { kind: small, text: { en: "Press the button on the back for 2 seconds.", ar: "اضغط الزر الخلفي لمدة ثانيتين." }, gap: xs }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" } }, { kind: meta, text: "+" }] }
    answer: [list]
    misconceptions:
      - id: MC-P14-016
        when: [collapsed, one]
        feedback:
          en: "Nader needs every step, so he'll open every one anyway. Each open is an extra tap while he's holding a cable, and he can't glance back at the step he just did."
          ar: "نادر يحتاج كل خطوة، فسيفتحها كلها على أي حال. وكل فتح ضغطة إضافية وهو يمسك السلك، ولا يستطيع أن يلقي نظرة على الخطوة التي أنهاها للتوّ."
    correct:
      en: "He needs it all: show it all."
      ar: "يحتاج كل شيء: اعرض كل شيء."
    explain:
      en: "The steps are short and all needed, in order. One open list lets Nader read, act and look back without a single extra tap."
      ar: "الخطوات قصيرة وكلها مطلوبة بالترتيب. والقائمة المفتوحة تجعل نادر يقرأ وينفّذ وينظر للخلف دون أي ضغطة إضافية."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U02-02
    rules: [R06, R15]
    confidence: true
    value:
      en: "Accordions (NN/g): avoid hiding crucial information within collapsed panels. A 30-day claim deadline decides whether Laila gets her money back, and she has no reason to open Claims before her visit."
      ar: "الـ Accordion (NN/g): تجنّب إخفاء أي معلومة مهمة داخل الأقسام المطويّة. ومهلة الثلاثين يومًا للمطالبة تحدّد هل تسترد ليلى مالها، وليس لديها سبب لفتح «المطالبات» قبل زيارتها."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Avoid hiding any crucial information within the collapsed panels." }
    scenario:
      en: "Laila's plan pays for a visit only if she sends the receipt within 30 days. Right now, that rule is inside the collapsed **Claims** section, and she only plans to open Dental."
      ar: "خطّة ليلى لا تدفع قيمة الزيارة إلا إن أرسلت الإيصال خلال 30 يومًا. والآن هذا الشرط داخل قسم **المطالبات** المطويّ، وهي لا تنوي أن تفتح إلا «الأسنان»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: inside
    options:
      - id: above
        text: { en: "Show the rule above the sections, always visible", ar: "اعرض الشرط فوق الأقسام، ظاهرًا دائمًا" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
            - { kind: banner, text: { en: "Send receipts within 30 days of a visit, or it won't be paid.", ar: "أرسلي الإيصال خلال 30 يومًا من الزيارة، وإلا فلن تُدفع قيمتها." }, gap: m }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "Dental", ar: "الأسنان" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Maternity", ar: "الولادة" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Claims", ar: "المطالبات" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Terms", ar: "الشروط" } }, { kind: meta, text: "+" }] }
      - id: inside
        text: { en: "Keep the rule inside Claims", ar: "أبقِ الشرط داخل «المطالبات»" }
        mock:
          width: 300
          blocks: *acc
      - id: label
        text: { en: "Keep it inside, but rename the title \"Claims (important)\"", ar: "أبقِه بالداخل، لكن غيّر العنوان إلى «المطالبات (مهم)»" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "Your plan", ar: "خطّتك" } }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "Dental", ar: "الأسنان" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Maternity", ar: "الولادة" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Claims (important)", ar: "المطالبات (مهم)" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Terms", ar: "الشروط" } }, { kind: meta, text: "+" }] }
    answer: [above]
    misconceptions:
      - id: MC-P14-018
        when: [inside, label]
        feedback:
          en: "Laila opens only Dental. \"Important\" doesn't tell her what the rule is, so she can still miss the deadline and lose the money."
          ar: "ليلى تفتح «الأسنان» فقط. وكلمة «مهم» لا تقول لها ما الشرط، فقد تفوتها المهلة وتخسر المال."
    hints:
      - en: "Will Laila see the 30-day rule if she opens only Dental?"
        ar: "هل سترى ليلى شرط الثلاثين يومًا إن فتحت «الأسنان» فقط؟"
    correct:
      en: "It can cost her money: keep it in sight."
      ar: "قد يكلّفها مالًا: أبقِه ظاهرًا."
    explain:
      en: "Above the sections, the deadline is seen by everyone who opens the plan, whichever section they came for. The details can stay in Claims."
      ar: "فوق الأقسام، يرى المهلة كل من يفتح الخطّة، أيًّا كان القسم الذي جاء من أجله. ويمكن أن تبقى التفاصيل في «المطالبات»."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U02-02
    rules: [R11]
    value:
      en: "Accordions (NN/g): valuable content hidden under an accordion may be missed altogether. A no-refund rule changes whether Mona buys at all, so it belongs next to the Buy button, not in a closed panel."
      ar: "الـ Accordion (NN/g): المحتوى المهم المخفي تحت Accordion قد يفوت الناس تمامًا. وشرط «لا استرداد» يغيّر قرار منى بالشراء أصلًا، فمكانه بجانب زر الشراء، لا في قسم مطويّ."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Valuable content that is hidden under an accordion may be missed altogether." }
    scenario:
      en: "Mona is buying a concert ticket for EGP 1,200. Once bought, the ticket can't be refunded. The page has collapsed sections for the venue, the seating and refunds."
      ar: "تشتري منى تذكرة حفلة بسعر 1,200 جنيه. وبعد الشراء، لا يمكن استرداد قيمة التذكرة. والصفحة فيها أقسام مطويّة للمكان والمقاعد والاسترداد."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: the rule in a line above Buy", ar: "النسخة A: الشرط في سطر فوق «اشترِ»" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Concert · Fri 8 pm · EGP 1,200", ar: "حفلة · الجمعة 8 م · 1,200 جنيه" } }
          - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "Venue", ar: "المكان" } }, { kind: meta, text: "+" }] }
          - { kind: divider }
          - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Seating", ar: "المقاعد" } }, { kind: meta, text: "+" }] }
          - { kind: divider }
          - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Refunds", ar: "الاسترداد" } }, { kind: meta, text: "+" }] }
          - { kind: small, weight: bold, text: { en: "This ticket can't be refunded.", ar: "لا يمكن استرداد قيمة هذه التذكرة." }, gap: l }
          - { kind: button, text: { en: "Buy ticket", ar: "اشترِ التذكرة" }, gap: s }
    b:
      label: { en: "Version B: the rule inside Refunds", ar: "النسخة B: الشرط داخل «الاسترداد»" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Concert · Fri 8 pm · EGP 1,200", ar: "حفلة · الجمعة 8 م · 1,200 جنيه" } }
          - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "Venue", ar: "المكان" } }, { kind: meta, text: "+" }] }
          - { kind: divider }
          - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Seating", ar: "المقاعد" } }, { kind: meta, text: "+" }] }
          - { kind: divider }
          - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Refunds", ar: "الاسترداد" } }, { kind: meta, text: "+" }] }
          - { kind: button, text: { en: "Buy ticket", ar: "اشترِ التذكرة" }, gap: l }
    answer: a
    misconceptions:
      - id: MC-P14-018
        when: [b]
        feedback:
          en: "Mona has no reason to open Refunds before she buys. She'd learn the rule only when she tries to get her money back."
          ar: "ليس لدى منى سبب لفتح «الاسترداد» قبل الشراء. ولن تعرف الشرط إلا حين تحاول استرداد مالها."
    correct:
      en: "A: the rule that changes the decision sits next to it."
      ar: "A: الشرط الذي يغيّر القرار بجانبه."
    explain:
      en: "One short line above Buy is enough for Mona to decide knowing the rule. The other details can stay collapsed."
      ar: "سطر قصير فوق «اشترِ» يكفي لتقرّر منى وهي تعرف الشرط. ويمكن أن تبقى التفاصيل الأخرى مطويّة."

  - id: S07
    type: tune
    part: independent
    skill: SK-P14-U02-01
    rules: [R14]
    value:
      en: "Accordions (NN/g): FAQ pages are good candidates for accordions. Each visitor comes with one or two questions; titles let them find theirs, and removing questions means some visitors never find an answer."
      ar: "الـ Accordion (NN/g): صفحات الأسئلة الشائعة مناسبة جدًا للـ Accordion. فكل زائر يأتي بسؤال أو اثنين؛ والعناوين تجعله يجد سؤاله، وحذف أسئلة يعني أن بعض الزوار لن يجدوا جوابًا أبدًا."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "FAQ pages and product-detail sections are good candidates for accordions." }
    scenario:
      en: "A courier company's website has 14 common questions, about tracking, prices, missed deliveries and more. The questions don't depend on each other, and most visitors come with just one."
      ar: "في موقع شركة شحن 14 سؤالًا شائعًا، عن التتبّع والأسعار والتوصيل الفائت وغيرها. والأسئلة لا تعتمد على بعضها، وأغلب الزوار يأتون بسؤال واحد فقط."
    prompt:
      en: "Try each version of the help page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة المساعدة. أيّها يجب أن تُطلق؟"
    start: open
    options:
      - id: open
        text: { en: "All 14 questions and answers open", ar: "الأسئلة الـ 14 وأجوبتها مفتوحة" }
        mock:
          frame: wide
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: text, weight: bold, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" }, gap: m }
            - { kind: small, text: { en: "Enter the 10-digit code from your text message on the Track page. Updates appear every few hours…", ar: "أدخل الرمز المكوّن من 10 أرقام من رسالتك في صفحة التتبّع. وتظهر التحديثات كل بضع ساعات…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" }, gap: m }
            - { kind: small, text: { en: "Prices depend on weight and distance. Within the same city, a parcel up to 2 kg costs…", ar: "الأسعار تعتمد على الوزن والمسافة. وداخل المدينة نفسها، الشحنة حتى 2 كجم تكلّف…" }, gap: xs }
      - id: acc
        text: { en: "The 14 questions as an accordion: tap one to see its answer", ar: "الأسئلة الـ 14 كـ Accordion: اضغط سؤالًا لترى جوابه" }
        mock:
          frame: wide
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: row, gap: m, blocks: [{ kind: text, weight: bold, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "What happens if I miss a delivery?", ar: "ماذا يحدث إن فاتني التوصيل؟" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: row, blocks: [{ kind: text, weight: bold, text: { en: "Can I change the delivery address?", ar: "هل يمكنني تغيير عنوان التوصيل؟" } }, { kind: meta, text: "+" }] }
            - { kind: divider }
            - { kind: meta, text: { en: "+ 10 more questions", ar: "+ 10 أسئلة أخرى" }, gap: s }
      - id: top
        text: { en: "Only the 5 most asked questions; remove the other 9", ar: "أكثر 5 أسئلة طرحًا فقط؛ واحذف الأسئلة التسعة الأخرى" }
        mock:
          frame: wide
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: text, weight: bold, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" }, gap: m }
            - { kind: small, text: { en: "Enter the 10-digit code from your text message…", ar: "أدخل الرمز المكوّن من 10 أرقام من رسالتك…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" }, gap: m }
            - { kind: small, text: { en: "Prices depend on weight and distance…", ar: "الأسعار تعتمد على الوزن والمسافة…" }, gap: xs }
    answer: [acc]
    misconceptions:
      - id: MC-P14-017
        when: [open]
        feedback:
          en: "A visitor with a question about a missed delivery has to read past every other answer to find it. On a wide screen, that's still a very long page."
          ar: "الزائر الذي يسأل عن توصيل فاته عليه أن يقرأ كل الأجوبة الأخرى ليجد سؤاله. وحتى على شاشة عريضة، تبقى الصفحة طويلة جدًا."
      - id: MC-P14-018
        when: [top]
        feedback:
          en: "The page is short, but a visitor whose question was one of the 9 removed finds nothing at all. Collapsing keeps every answer; removing loses it."
          ar: "صارت الصفحة قصيرة، لكن الزائر الذي كان سؤاله من الأسئلة التسعة المحذوفة لن يجد شيئًا. فالطيّ يُبقي كل جواب؛ أما الحذف فيُضيّعه."
    correct:
      en: "Independent questions, one needed: an accordion."
      ar: "أسئلة مستقلّة، والمطلوب واحد: Accordion."
    explain:
      en: "Every visitor scans 14 short titles, opens theirs and skips the rest. No answer is lost, and the page stays short."
      ar: "كل زائر يتصفّح 14 عنوانًا قصيرًا، ويفتح سؤاله ويتخطّى الباقي. ولا يضيع أي جواب، وتبقى الصفحة قصيرة."

  - id: S08
    type: card
    part: recap
    icons: [layers, eye, warn]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Accordion** when people need a few sections: a plan's details, an FAQ.\n- **Everything open** when people need it all, like setup steps they follow in order.\n- **Never collapsed:** a deadline or a rule that changes the decision, like \"no refunds\".\n\nNext: which action gets the loudest button."
      ar: "- **الـ Accordion** حين يحتاج الناس أقسامًا قليلة: تفاصيل خطّة، أو أسئلة شائعة.\n- **كل شيء مفتوح** حين يحتاج الناس المحتوى كله، مثل خطوات تركيب يتبعونها بالترتيب.\n- **لا يُطوى أبدًا:** موعد نهائي أو شرط يغيّر القرار، مثل «لا استرداد».\n\nالتالي: أيّ إجراء يأخذ أوضح زر."
