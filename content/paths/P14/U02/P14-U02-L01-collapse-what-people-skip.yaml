id: P14-U02-L01
mode: lesson
minutes: 8
title:
  en: "Accordions: collapse what people skip"
  ar: "الـ Accordion: اطوِ ما يتخطّاه الناس"
speaker: tarek
sources:
  - title: { en: "Accordions on Desktop: When and How to Use (NN/g)", ar: "الـ Accordion على الكمبيوتر: متى وكيف نستخدمه (NN/g)" }
    url: "https://www.nngroup.com/articles/accordions-on-desktop/"
  - title: { en: "Accordions on Mobile (NN/g)", ar: "الـ Accordion على الموبايل (NN/g)" }
    url: "https://www.nngroup.com/articles/mobile-accordions/"
review_labels:
  MC-P14-016: { en: "Don't collapse what people read anyway", ar: "لا تطوِ ما سيقرؤه الناس على أي حال" }
  MC-P14-017: { en: "A long open page buries the part people came for", ar: "الصفحة الطويلة المفتوحة تُخفي الجزء الذي جاء الناس من أجله" }
  MC-P14-018: { en: "What's collapsed can be missed altogether", ar: "ما يُطوى قد لا يراه الناس أبدًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Laila's insurance app", ar: "ليلى وتطبيق التأمين" }
    body:
      en: "In the insurance app I manage, Laila wants to know one thing: does her health plan cover a dental cleaning?\n\nShe opens **Your plan**. All nine sections are open, one under the other: doctors, hospitals, medicines, eyes, dental, maternity, abroad, claims and terms. Dental is the fifth section, five screens down."
      ar: "في تطبيق التأمين الذي أديره، تريد ليلى أن تعرف شيئًا واحدًا: هل يغطّي تأمينها الصحي تنظيف الأسنان؟\n\nفتحت شاشة **خطّتك**. كل الأقسام التسعة مفتوحة، واحدًا تحت الآخر: الأطباء، والمستشفيات، والأدوية، والعيون، والأسنان، والولادة، والسفر، والمطالبات، والشروط. والأسنان هي القسم الخامس، فعليها أن تمرّر خمس شاشات كاملة حتى تصل إليه."
    mock:
      app: aman
      appbar: &abar { title: { en: "Your plan", ar: "خطّتك" }, back: true, actions: [ { icon: phone, aria: { en: "Call us", ar: "اتصلي بنا" } } ] }
      blocks:
        - kind: card
          blocks:
            - { kind: badge, text: { en: "Gold · Family", ar: "ذهبية · عائلية" }, icon: shield-check }
            - { kind: small, text: { en: "Card no. 8812 4409 · valid to Dec 2027", ar: "بطاقة رقم 8812 4409 · سارية حتى ديسمبر 2027" }, gap: xs }
        - { kind: heading, text: { en: "Doctors", ar: "الأطباء" }, gap: m }
        - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%. Specialists need a referral from your family doctor, except for…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%. والمتخصّصون يحتاجون تحويلًا من طبيب الأسرة، ما عدا…" }, gap: xs }
        - { kind: heading, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
        - { kind: small, text: { en: "Stays in a shared room are fully covered. A private room is covered up to EGP 1,500 a night, and…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل. والغرفة الخاصة مغطّاة حتى 1,500 جنيه في الليلة، و…" }, gap: xs }
        - { kind: heading, text: { en: "Medicines", ar: "الأدوية" }, gap: m }
        - { kind: small, text: { en: "Medicines on the plan's list are covered at 70% with a prescription…", ar: "الأدوية الموجودة في قائمة الخطّة مغطّاة بنسبة 70% مع روشتة…" }, gap: xs }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U02-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Accordions (NN/g): use them on content-heavy pages where people need only a few sections; they scan the titles and skip the rest. Bigger headings still leave Laila scrolling past everything, and \"Show more\" hides sections she can't even see the names of."
      ar: "جرّب أولًا. الـ Accordion (NN/g): استخدمه في الصفحات المليئة بالمحتوى حين يحتاج الناس أقسامًا قليلة؛ فيتصفّحون العناوين ويتخطّون الباقي. والعناوين الأكبر تترك ليلى تمرّ على كل شيء، و«اعرض المزيد» يخفي أقسامًا لا ترى حتى أسماءها."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "When users need only a few pieces of information on the page, they will likely skip most of the content." }
    prompt:
      en: "Try each version of the plan page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الخطّة. أيّ نسخة توصل ليلى إلى قسم الأسنان بسرعة؟"
    start: bigger
    options:
      - id: bigger
        text: { en: "Keep every section open, with bigger headings", ar: "أبقِ كل الأقسام مفتوحة، مع عناوين أكبر" }
        mock:
          caption: { en: "Dental is still five screens down", ar: "ما زال الوصول إلى الأسنان يحتاج تمرير خمس شاشات" }
          app: aman
          appbar: *abar
          blocks:
            - { kind: title, text: { en: "Doctors", ar: "الأطباء" } }
            - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%. Specialists need a referral from your family doctor, except for…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%. والمتخصّصون يحتاجون تحويلًا من طبيب الأسرة، ما عدا…" }, gap: xs }
            - { kind: title, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
            - { kind: small, text: { en: "Stays in a shared room are fully covered. A private room is covered up to EGP 1,500 a night, and…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل. والغرفة الخاصة مغطّاة حتى 1,500 جنيه في الليلة، و…" }, gap: xs }
      - id: more
        text: { en: "Show the first three sections, and the rest behind \"Show more\"", ar: "اعرض الأقسام الثلاثة الأولى، والباقي خلف «اعرض المزيد»" }
        mock:
          app: aman
          appbar: *abar
          blocks:
            - { kind: heading, text: { en: "Doctors", ar: "الأطباء" } }
            - { kind: small, text: { en: "Visits to any doctor in the network are covered at 80%…", ar: "زيارات أي طبيب في الشبكة مغطّاة بنسبة 80%…" }, gap: xs }
            - { kind: heading, text: { en: "Hospitals", ar: "المستشفيات" }, gap: m }
            - { kind: small, text: { en: "Stays in a shared room are fully covered…", ar: "الإقامة في غرفة مشتركة مغطّاة بالكامل…" }, gap: xs }
            - { kind: heading, text: { en: "Medicines", ar: "الأدوية" }, gap: m }
            - { kind: small, text: { en: "Medicines on the plan's list are covered at 70%…", ar: "الأدوية الموجودة في قائمة الخطّة مغطّاة بنسبة 70%…" }, gap: xs }
            - { kind: button, style: text, icon: caret-down, text: { en: "Show more", ar: "اعرض المزيد" }, gap: m }
      - id: accordion
        text: { en: "Collapse each section under its title; tap a title to open it", ar: "اطوِ كل قسم تحت عنوانه؛ واضغط العنوان لفتحه" }
        mock:
          app: aman
          appbar: *abar
          blocks: &acc
            - kind: card
              blocks:
                - { kind: badge, text: { en: "Gold · Family", ar: "ذهبية · عائلية" }, icon: shield-check }
                - { kind: small, text: { en: "Card no. 8812 4409", ar: "بطاقة رقم 8812 4409" }, gap: xs }
            - { kind: accordion, text: { en: "Doctors", ar: "الأطباء" }, gap: m, blocks: [ { kind: small, text: { en: "Network doctors: EGP 50 a visit. Specialists: EGP 100.", ar: "أطباء الشبكة: 50 جنيهًا للزيارة. والأخصائيون: 100 جنيه." } } ] }
            - { kind: accordion, text: { en: "Hospitals", ar: "المستشفيات" }, blocks: [ { kind: small, text: { en: "Network hospitals: 80% covered, up to EGP 60,000 a year.", ar: "مستشفيات الشبكة: نغطّي 80% حتى 60,000 جنيه في السنة." } } ] }
            - { kind: accordion, text: { en: "Medicines", ar: "الأدوية" }, blocks: [ { kind: small, text: { en: "Prescribed medicines: 70% covered at partner pharmacies.", ar: "الأدوية بوصفة طبية: نغطّي 70% منها في الصيدليات المتعاقدة." } } ] }
            - { kind: accordion, text: { en: "Eyes", ar: "العيون" }, blocks: [ { kind: small, text: { en: "One eye test a year, and glasses up to EGP 1,500.", ar: "فحص نظر واحد في السنة، ونظارة حتى 1,500 جنيه." } } ] }
            - { kind: accordion, text: { en: "Dental", ar: "الأسنان" }, blocks: [ { kind: small, text: { en: "Check-ups and fillings: fully covered. Root canals: 50%, up to EGP 3,000 a year.", ar: "الكشف والحشو: مغطّيان بالكامل. وعلاج العصب: 50% حتى 3,000 جنيه في السنة." } } ] }
            - { kind: accordion, text: { en: "Maternity", ar: "الولادة" }, blocks: [ { kind: small, text: { en: "Birth costs up to EGP 15,000, after 10 months in the plan.", ar: "تكاليف الولادة حتى 15,000 جنيه، بعد 10 أشهر في الخطة." } } ] }
            - { kind: accordion, text: { en: "Abroad", ar: "السفر" }, blocks: [ { kind: small, text: { en: "Emergencies abroad: up to USD 5,000 a trip.", ar: "الطوارئ خارج مصر: حتى 5,000 دولار لكل رحلة." } } ] }
            - { kind: accordion, text: { en: "Claims", ar: "المطالبات" }, blocks: [ { kind: small, text: { en: "Send receipts in the app within 30 days of a visit so we can pay them. We pay within 10 days.", ar: "أرسل الإيصالات من التطبيق خلال 30 يومًا من الزيارة حتى ندفعها لك. وندفع خلال 10 أيام." } } ] }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" }, blocks: [ { kind: small, text: { en: "The plan renews every year. You can cancel any time in Settings.", ar: "تتجدّد الخطة كل سنة، ويمكنك إلغاؤها في أي وقت من الإعدادات." } } ] }
    answer: [accordion]
    misconceptions:
      - id: MC-P14-017
        when: [bigger]
        feedback:
          en: "The headings are easier to see, but Laila still scrolls past four full sections she doesn't need before she reaches Dental."
          ar: "صارت رؤية العناوين أسهل، لكن ليلى ما زالت تمرّ على أربعة أقسام كاملة لا تحتاجها قبل أن تصل إلى قسم الأسنان."
      - id: MC-P14-018
        when: [more]
        feedback:
          en: "Dental is one of the hidden sections, and nothing on the screen says it's there. Laila may decide the plan doesn't mention dental at all."
          ar: "قسم الأسنان من الأقسام المخفية، ولا شيء على الشاشة يدلّ على وجوده. فقد تظنّ ليلى أن الخطّة لا تذكر الأسنان أصلًا."
    hints:
      - en: "Which version lets Laila see the name of every section without scrolling past the others?"
        ar: "أيّ نسخة تجعل ليلى ترى اسم كل قسم دون أن تمرّ على الأقسام الأخرى؟"
    correct:
      en: "She needs one section: titles first, details on tap."
      ar: "تحتاج قسمًا واحدًا: العناوين أولًا، والتفاصيل عند الضغط."
    explain:
      en: "All nine titles now fit on one screen. Laila spots Dental, opens it, and never has to read about hospitals or maternity."
      ar: "صارت العناوين التسعة كلها في شاشة واحدة. فترى ليلى قسم «الأسنان» وتفتحه، ولا تحتاج أن تقرأ عن المستشفيات أو الولادة."

  - id: S09
    type: video
    part: concept
    title: { en: "Collapse what most people skip", ar: "اطوِ ما يتخطّاه أغلب الناس" }
    video: 774f7d03-00ea-4dd7-a164-d9edba654e19
    duration: 173
    transcript:
      - { t: 2.5, en: "But just as it has advantages, it surely has drawbacks. A main drawback of the accordion is that I see the data in separate pieces,", ar: "لكن زي ما فيه ميزات، أكيد فيه عيوب. ومن أهم عيوب الـ Accordion إنه بيخلّيني أشوف الداتا بشكل مقسّم،" }
      - { t: 8.5, en: "so I may not see all the data at once, and if I need to see all of it, I need many interactions, because I'll open each accordion on its own.", ar: "ممكن ماقدرش أشوف الداتا كلها في نفس الوقت، ولو محتاج أشوفها كلها، هحتاج أعمل Interactions كتير، لأني هفتح كل Accordion لوحده." }
      - { t: 19.18, en: "That's the second drawback: it raises the interaction cost. Even if I don't need them at the same time, but want data under several titles, I have to open each accordion to see what's inside.", ar: "وده العيب التاني: إنه بيزوّد الـ Interaction cost. حتى لو مش عايز أشوفهم في نفس الوقت، لكن عايز أشوف داتا تحت أكتر من عنوان، هحتاج أفتح كل Accordion عشان أشوف اللي جوّاه." }
      - { t: 33.9, en: "And the last one: it hurts discoverability. Sometimes the user never finds out certain data exists, because it's inside an accordion they didn't open and didn't expect under that title, so they may never know it's there.", ar: "وآخر حاجة إنه بيأثّر على الـ Discoverability: أحيانًا اليوزر مايكتشفش أصلًا إن فيه داتا معينة موجودة، لأنها جوّه Accordion مافتحهوش، وماتوقّعش إنها تحت العنوان ده، فممكن مايعرفش إنها موجودة." }
      - { t: 49.24, en: "So based on this, let's think about when accordions fit best. A drawback is that the user reaches the data in pieces, not all at once, and needs many interactions to see all of it.", ar: "فخلّينا بناءً على ده نفكّر إمتى يبقى أنسب وقت أستخدم فيه الـ Accordions. من السلبيات إن اليوزر هيوصل للداتا بشكل متقطّع، مش كلها في نفس الوقت، ولو عايز يشوفها كلها هيحتاج Interactions كتير." }
      - { t: 63.4, en: "The first good time to use accordions: when I know users won't need all the data on the page; they usually look at some of it, and there's a lot they usually don't need,", ar: "فأول وقت مناسب أستخدم فيه الـ Accordions: لو عندي معلومات بتقول إن اليوزرز مش هيحتاجوا كل الداتا اللي في الصفحة، لكن عادةً بيشوفوا جزء منها، وفيه داتا كتير مش بيحتاجوا يشوفوها،" }
      - { t: 75.18, en: "but it's important to have it there. Then I use accordions, and users see only the data they care about. I didn't load them with a high interaction cost, because I didn't use it where users want all the data in detail.", ar: "لكنها مهمة تكون موجودة. في الحالة دي هستخدم الـ Accordions، واليوزرز هيشوفوا الداتا اللي مهتمين بيها بس. ماحمّلتهمش Interaction cost عالي، لأني مااستخدمتوش في مكان اليوزرز عايزين يشوفوا فيه الداتا كلها بتفاصيلها." }
      - { t: 89.6, en: "The second good case for accordions: when the user goes through a step-by-step process. The first step sits in an accordion, and when they finish and tap Next, they move to the second step in another accordion,", ar: "تاني حالة يكون فيها استخدام الـ Accordions مناسب: لو اليوزر ماشي في Process خطوة بخطوة. أول Step تكون جوّه Accordion، ولما يخلّصها ويدوس Next يروح للـ Step التانية في Accordion تاني،" }
      - { t: 104.84, en: "and so on, each accordion leading to the next. The user understands these are steps in order, and can reopen the first one to go back.", ar: "وهكذا كل Accordion يودّيه للي بعده. فاليوزر هيفهم إن دي Steps ورا بعض، ولو عايز يرجع يفتح الأول تاني يقدر." }
      - { t: 112.48, en: "Like the checkout process in front of us: I enter the shipping address, then move to the next part, delivery and gift options, and so on. Each accordion leads to the next, so this use fits.", ar: "زي مثلًا الـ Checkout process اللي قدامنا: محتاج أدخّل الـ Shipping address، فأدخّل معلوماته، وبعدها أروح للمعلومات اللي بعدها، Delivery and gift options وهكذا. كل Accordion يودّيني للي بعده، فهنا الاستخدام مناسب." }
      - { t: 128.52, en: "The third case, a very good one: when the data is independent, with no piece depending on another, like FAQs. On an FAQ page the user faces a set of questions", ar: "تالت حالة يكون فيها استخدام الـ Accordions مناسب جدًا: لو عندي داتا Independent، مش معتمدة على بعض، زي الـ FAQs أو الأسئلة الشائعة. اليوزر لما يدخل صفحة الأسئلة الشائعة بيبقى قدّامه مجموعة أسئلة،" }
      - { t: 144.38, en: "that aren't related; they don't need to see them all at once, or many of them at all; they need the one or two they're looking for.", ar: "مالهاش علاقة ببعض، ومش محتاج يشوفها كلها في نفس الوقت، ولا محتاج يشوف أسئلة كتير أصلًا، محتاج سؤال أو اتنين بيدوّر عليهم." }
      - { t: 154.18, en: "So if all the question titles are in accordions, they see every title and open the ones they care about, and skip the rest. That way we avoid the drawbacks we mentioned.", ar: "فلو عناوين الأسئلة كلها موجودة في الـ Accordions، هيشوف كل العناوين، ويفتح الأسئلة اللي مهتم بيها، واللي مش مهتم بيها مش هيشوفها. وبكده تفادينا السلبيات اللي قلناها عن الـ Accordions." }

  - id: S03
    type: card
    part: concept
    icons: [warn, eye, list, layers, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "An accordion shows a list of titles; each one opens its content in place.\n\n- **The cost:** content comes in pieces, every section costs a tap, and people can miss what sits in a panel they never open.\n- **Use it when people need only some of a long page**, like a plan's details. They scan the titles and open what they came for.\n- **Use it for steps in order**, like checkout: shipping address, then delivery options. Finishing one section opens the next, and people can reopen an earlier one to go back.\n- **Use it for separate items**, like an FAQ, where people want one or two answers, not all of them.\n- **Show everything** when people need most of the content. And never collapse what people must see, like a fee, a deadline or a warning."
      ar: "الـ Accordion (قائمة أقسام تُفتح وتُطوى) يعرض عناوين؛ وكل عنوان يفتح محتواه في مكانه.\n\n- **التكلفة:** المحتوى يظهر مقسّمًا، وكل قسم يكلّف ضغطة، وقد لا يرى الناس ما في قسم لم يفتحوه.\n- **استخدمه حين يحتاج الناس جزءًا فقط من صفحة طويلة**، مثل تفاصيل خطّة. فيتصفّحون العناوين ويفتحون ما جاؤوا من أجله.\n- **استخدمه لخطوات بالترتيب**، مثل الـ Checkout (إتمام الشراء): عنوان الشحن، ثم خيارات التوصيل. إنهاء قسم يفتح التالي، ويستطيع الناس فتح قسم سابق للرجوع.\n- **استخدمه لعناصر منفصلة**، مثل الأسئلة الشائعة، حين يريد الناس إجابة أو اثنتين، لا كل الإجابات.\n- **اعرض كل شيء** حين يحتاج الناس أغلب المحتوى. ولا تطوِ أبدًا ما يجب أن يراه الناس، مثل رسوم أو موعد نهائي أو تحذير."

  - id: S04
    type: tune
    speaker: karim
    part: guided
    skill: SK-P14-U02-01
    rules: [R06, R15]
    value:
      en: "Accordions (NN/g): if people need information from several sections at once, display all the content. Setup steps are all needed, in order, so collapsing them only adds taps and hides the step Nader just did."
      ar: "الـ Accordion (NN/g): إن احتاج الناس معلومات من عدة أقسام معًا، فاعرض كل المحتوى. وخطوات التركيب كلها مطلوبة وبالترتيب، فطيّها يزيد الضغطات فقط ويُخفي الخطوة التي أنهاها نادر للتوّ."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "If you expect users to need information from several accordions at once, it is better to display all the content at once" }
    scenario:
      en: "I'm building the help pages for an internet company. Nader is setting up a new router at home. The help page has six short steps. He has to do every step, in order, looking from the page to the router and back."
      ar: "أبني صفحات المساعدة لشركة إنترنت. يركّب نادر راوترًا جديدًا في البيت. وصفحة المساعدة فيها ست خطوات قصيرة. وعليه أن ينفّذ كل خطوة بالترتيب، وهو ينظر إلى الصفحة ثم إلى الراوتر ثم يعود."
    prompt:
      en: "Try each version of the help page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة المساعدة. أيّ نسخة تتيح لنادر أن يتبع الخطوات الست بالترتيب دون ضغطات إضافية؟"
    start: collapsed
    options:
      - id: list
        text: { en: "All six steps open, as one numbered list", ar: "الخطوات الست مفتوحة، في قائمة واحدة مرقّمة" }
        mock:
          app: shabaka
          appbar: &shbar { title: { en: "Set up your router", ar: "ركّب الراوتر" }, back: true }
          blocks:
            - { kind: image, art: workshop, size: s, alt: { en: "Router on a desk", ar: "راوتر على مكتب" } }
            - { kind: listitem, icon: plug, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" }, sub: { en: "Use the yellow port marked WAN.", ar: "استخدم المنفذ الأصفر المكتوب عليه WAN." }, gap: s }
            - { kind: listitem, icon: power, text: { en: "2. Turn it on", ar: "2. شغّله" }, sub: { en: "Press the button on the back for 2 seconds.", ar: "اضغط الزر الخلفي لمدة ثانيتين." } }
            - { kind: listitem, icon: lightbulb, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" }, sub: { en: "It takes about a minute.", ar: "يستغرق ذلك دقيقة تقريبًا." } }
            - { kind: listitem, icon: wifi-high, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" }, sub: { en: "The name and password are on the sticker.", ar: "الاسم وكلمة المرور على الملصق." } }
            - { kind: more, text: { en: "+2 more steps", ar: "+ خطوتان أخريان" } }
      - id: collapsed
        text: { en: "Each step collapsed under its title", ar: "كل خطوة مطويّة تحت عنوانها" }
        mock:
          app: shabaka
          appbar: *shbar
          blocks:
            - { kind: image, art: workshop, size: s, alt: { en: "Router on a desk", ar: "راوتر على مكتب" } }
            - { kind: accordion, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" }, gap: s, blocks: [ { kind: small, text: { en: "Use the yellow port marked WAN.", ar: "استخدم المنفذ الأصفر المكتوب عليه WAN." } } ] }
            - { kind: accordion, text: { en: "2. Turn it on", ar: "2. شغّله" }, blocks: [ { kind: small, text: { en: "Press the button on the back for 2 seconds.", ar: "اضغط الزر الخلفي لمدة ثانيتين." } } ] }
            - { kind: accordion, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" }, blocks: [ { kind: small, text: { en: "It takes about a minute.", ar: "يستغرق ذلك دقيقة تقريبًا." } } ] }
            - { kind: accordion, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" }, blocks: [ { kind: small, text: { en: "The name and password are on the sticker.", ar: "الاسم وكلمة المرور على الملصق." } } ] }
      - id: one
        text: { en: "Only one step open at a time; opening the next closes the last", ar: "خطوة واحدة مفتوحة في كل مرة؛ وفتح التالية يغلق السابقة" }
        mock:
          app: shabaka
          appbar: *shbar
          blocks:
            - { kind: image, art: workshop, size: s, alt: { en: "Router on a desk", ar: "راوتر على مكتب" } }
            - { kind: accordion, text: { en: "1. Plug in the cable", ar: "1. وصّل السلك" }, gap: s, blocks: [ { kind: small, text: { en: "Use the yellow port marked WAN.", ar: "استخدم المنفذ الأصفر المكتوب عليه WAN." } } ] }
            - { kind: accordion, text: { en: "2. Turn it on", ar: "2. شغّله" }, open: true, blocks: [ { kind: small, text: { en: "Press the button on the back for 2 seconds.", ar: "اضغط الزر الخلفي لمدة ثانيتين." } } ] }
            - { kind: accordion, text: { en: "3. Wait for the green light", ar: "3. انتظر الضوء الأخضر" }, blocks: [ { kind: small, text: { en: "It takes about a minute.", ar: "يستغرق ذلك دقيقة تقريبًا." } } ] }
            - { kind: accordion, text: { en: "4. Join the network", ar: "4. اتصل بالشبكة" }, blocks: [ { kind: small, text: { en: "The name and password are on the sticker.", ar: "الاسم وكلمة المرور على الملصق." } } ] }
    answer: [list]
    misconceptions:
      - id: MC-P14-016
        when: [collapsed, one]
        feedback:
          en: "Nader needs every step, so he'll open every one anyway. Each open is an extra tap while he's holding a cable, and he can't glance back at the step he just did."
          ar: "نادر يحتاج كل خطوة، فسيفتحها كلها على أي حال. وكل فتح ضغطة إضافية وهو يمسك السلك، ولا يستطيع أن يلقي نظرة على الخطوة التي أنهاها للتوّ."
    correct:
      en: "He needs it all: show it all."
      ar: "يحتاج كل شيء: اعرض كل شيء."
    explain:
      en: "The steps are short and all needed, in order. One open list lets Nader read, act and look back without a single extra tap."
      ar: "الخطوات قصيرة وكلها مطلوبة بالترتيب. والقائمة المفتوحة تجعل نادر يقرأ وينفّذ ويرجع إلى الخطوة السابقة بنظرة، دون أي ضغطة إضافية."

  - id: S05
    type: tune
    part: guided
    skill: SK-P14-U02-02
    rules: [R06, R15]
    confidence: true
    value:
      en: "Accordions (NN/g): avoid hiding crucial information within collapsed panels. A 30-day claim deadline decides whether Laila gets her money back, and she has no reason to open Claims before her visit."
      ar: "الـ Accordion (NN/g): تجنّب إخفاء أي معلومة مهمة داخل الأقسام المطويّة. ومهلة الثلاثين يومًا للمطالبة تحدّد هل تسترد ليلى مالها، وليس لديها سبب لفتح «المطالبات» قبل زيارتها."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Avoid hiding any crucial information within the collapsed panels." }
    scenario:
      en: "Laila's plan pays for a visit only if she sends the receipt within 30 days. Right now, that rule is inside the collapsed **Claims** section, and she only plans to open Dental."
      ar: "خطّة ليلى لا تدفع قيمة الزيارة إلا إن أرسلت الإيصال خلال 30 يومًا. والآن هذا الشرط داخل قسم **المطالبات** المطويّ، وهي لا تنوي أن تفتح إلا قسم «الأسنان»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل ليلى ترى مهلة الإيصال حتى لو فتحت قسم «الأسنان» فقط؟"
    start: inside
    options:
      - id: above
        text: { en: "Show the rule above the sections, always visible", ar: "اعرض الشرط فوق الأقسام، ظاهرًا دائمًا" }
        mock:
          app: aman
          appbar: *abar
          blocks:
            - { kind: banner, icon: receipt, tone: warn, text: { en: "Send receipts within 30 days of a visit so we can pay it.", ar: "أرسلي إيصال الزيارة خلال 30 يومًا حتى نتمكّن من دفع قيمتها." } }
            - { kind: accordion, text: { en: "Dental", ar: "الأسنان" }, gap: m, blocks: [ { kind: small, text: { en: "Check-ups and fillings: fully covered. Root canals: 50%, up to EGP 3,000 a year.", ar: "الكشف والحشو: مغطّيان بالكامل. وعلاج العصب: 50% حتى 3,000 جنيه في السنة." } } ] }
            - { kind: accordion, text: { en: "Maternity", ar: "الولادة" }, blocks: [ { kind: small, text: { en: "Birth costs up to EGP 15,000, after 10 months in the plan.", ar: "تكاليف الولادة حتى 15,000 جنيه، بعد 10 أشهر في الخطة." } } ] }
            - { kind: accordion, text: { en: "Claims", ar: "المطالبات" }, blocks: [ { kind: small, text: { en: "Send receipts in the app within 30 days of a visit so we can pay them. We pay within 10 days.", ar: "أرسل الإيصالات من التطبيق خلال 30 يومًا من الزيارة حتى ندفعها لك. وندفع خلال 10 أيام." } } ] }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" }, blocks: [ { kind: small, text: { en: "The plan renews every year. You can cancel any time in Settings.", ar: "تتجدّد الخطة كل سنة، ويمكنك إلغاؤها في أي وقت من الإعدادات." } } ] }
      - id: inside
        text: { en: "Keep the rule inside Claims", ar: "أبقِ الشرط داخل قسم «المطالبات»" }
        mock:
          app: aman
          appbar: *abar
          blocks: *acc
      - id: label
        text: { en: "Keep it inside, but rename the title \"Claims (important)\"", ar: "أبقِه داخل القسم، لكن غيّر العنوان إلى «المطالبات (مهم)»" }
        mock:
          app: aman
          appbar: *abar
          blocks:
            - { kind: accordion, text: { en: "Dental", ar: "الأسنان" }, blocks: [ { kind: small, text: { en: "Check-ups and fillings: fully covered. Root canals: 50%, up to EGP 3,000 a year.", ar: "الكشف والحشو: مغطّيان بالكامل. وعلاج العصب: 50% حتى 3,000 جنيه في السنة." } } ] }
            - { kind: accordion, text: { en: "Maternity", ar: "الولادة" }, blocks: [ { kind: small, text: { en: "Birth costs up to EGP 15,000, after 10 months in the plan.", ar: "تكاليف الولادة حتى 15,000 جنيه، بعد 10 أشهر في الخطة." } } ] }
            - { kind: accordion, text: { en: "Claims (important)", ar: "المطالبات (مهم)" }, blocks: [ { kind: small, text: { en: "Send receipts in the app within 30 days of a visit so we can pay them. We pay within 10 days.", ar: "أرسل الإيصالات من التطبيق خلال 30 يومًا من الزيارة حتى ندفعها لك. وندفع خلال 10 أيام." } } ] }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" }, blocks: [ { kind: small, text: { en: "The plan renews every year. You can cancel any time in Settings.", ar: "تتجدّد الخطة كل سنة، ويمكنك إلغاؤها في أي وقت من الإعدادات." } } ] }
    answer: [above]
    misconceptions:
      - id: MC-P14-018
        when: [inside, label]
        feedback:
          en: "Laila opens only Dental. \"Important\" doesn't tell her what the rule is, so she can still miss the deadline and lose the money."
          ar: "ليلى تفتح قسم «الأسنان» فقط. وكلمة «مهم» لا تقول لها ما الشرط، فقد تفوتها المهلة وتخسر المال."
    hints:
      - en: "Will Laila see the 30-day rule if she opens only Dental?"
        ar: "هل سترى ليلى شرط الثلاثين يومًا إن فتحت قسم «الأسنان» فقط؟"
    correct:
      en: "It can cost her money: keep it in sight."
      ar: "قد يكلّفها مالًا: أبقِه ظاهرًا."
    explain:
      en: "Above the sections, the deadline is seen by everyone who opens the plan, whichever section they came for. The details can stay in Claims."
      ar: "فوق الأقسام، يرى المهلة كل من يفتح الخطّة، أيًّا كان القسم الذي جاء من أجله. ويمكن أن تبقى التفاصيل في قسم «المطالبات»."

  - id: S06
    type: compare
    speaker: rami
    part: contrast
    skill: SK-P14-U02-02
    rules: [R11]
    value:
      en: "Accordions (NN/g): valuable content hidden under an accordion may be missed altogether. A no-refund rule changes whether Ghada buys at all, so it belongs next to the Buy button, not in a closed panel."
      ar: "الـ Accordion (NN/g): المحتوى المهم المخفي تحت Accordion قد يفوت الناس تمامًا. وشرط «لا استرداد» يغيّر قرار غادة بالشراء أصلًا، فمكانه بجانب زر الشراء، لا في قسم مطويّ."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Valuable content that is hidden under an accordion may be missed altogether." }
    scenario:
      en: "I'm designing a theatre ticket page. Ghada is buying a ticket for EGP 1,200. Once bought, the ticket can't be refunded. The page has collapsed sections for the venue, the seating and refunds."
      ar: "أصمّم صفحة لتذاكر المسرح. تشتري غادة تذكرة بسعر 1,200 جنيه. وبعد الشراء، لا يمكن استرداد قيمة التذكرة. والصفحة فيها أقسام مطويّة للمكان والمقاعد والاسترداد."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تجعل غادة تعرف أن التذكرة لا تُسترد قبل أن تشتريها؟"
    a:
      label: { en: "Version A: the rule in a line above Buy", ar: "النسخة A: الشرط في سطر فوق «اشترِ»" }
      mock:
        app: tazkara
        appbar: &tbar { title: { en: "Play", ar: "مسرحية" }, back: true, actions: [ { icon: share-network, aria: { en: "Share", ar: "شارك" } } ] }
        blocks:
          - { kind: image, art: city-night, size: m, alt: { en: "Theatre stage", ar: "خشبة المسرح" } }
          - { kind: heading, text: { en: "Play · Fri 8 pm", ar: "مسرحية · الجمعة 8 م" }, gap: s }
          - { kind: price, text: { en: "EGP 1,200", ar: "1,200 جنيه" }, gap: xs }
          - { kind: accordion, text: { en: "Venue", ar: "المكان" }, gap: s, blocks: [ { kind: small, text: { en: "Al Fanoun Theatre, Downtown. Doors open 30 minutes before the show.", ar: "مسرح الفنون، وسط البلد. تُفتح الأبواب قبل العرض بـ30 دقيقة." } } ] }
          - { kind: accordion, text: { en: "Seating", ar: "المقاعد" }, blocks: [ { kind: small, text: { en: "Rows A to F: EGP 1,200. Rows G to M: EGP 800.", ar: "الصفوف من A إلى F: 1,200 جنيه. والصفوف من G إلى M: 800 جنيه." } } ] }
          - { kind: accordion, text: { en: "Refunds", ar: "الاسترداد" }, blocks: [ { kind: small, text: { en: "Tickets can't be refunded or changed.", ar: "لا يمكن استرداد التذاكر أو تغييرها." } } ] }
        footer:
          - { kind: small, weight: bold, text: { en: "This ticket can't be refunded, so check the date before you buy.", ar: "لا تُسترد قيمة هذه التذكرة، فتأكّد من موعدك قبل الشراء." } }
          - { kind: button, text: { en: "Buy ticket", ar: "اشترِ التذكرة" }, gap: s }
    b:
      label: { en: "Version B: the rule inside Refunds", ar: "النسخة B: الشرط داخل قسم «الاسترداد»" }
      mock:
        app: tazkara
        appbar: *tbar
        blocks:
          - { kind: image, art: city-night, size: m, alt: { en: "Theatre stage", ar: "خشبة المسرح" } }
          - { kind: heading, text: { en: "Play · Fri 8 pm", ar: "مسرحية · الجمعة 8 م" }, gap: s }
          - { kind: price, text: { en: "EGP 1,200", ar: "1,200 جنيه" }, gap: xs }
          - { kind: accordion, text: { en: "Venue", ar: "المكان" }, gap: s, blocks: [ { kind: small, text: { en: "Al Fanoun Theatre, Downtown. Doors open 30 minutes before the show.", ar: "مسرح الفنون، وسط البلد. تُفتح الأبواب قبل العرض بـ30 دقيقة." } } ] }
          - { kind: accordion, text: { en: "Seating", ar: "المقاعد" }, blocks: [ { kind: small, text: { en: "Rows A to F: EGP 1,200. Rows G to M: EGP 800.", ar: "الصفوف من A إلى F: 1,200 جنيه. والصفوف من G إلى M: 800 جنيه." } } ] }
          - { kind: accordion, text: { en: "Refunds", ar: "الاسترداد" }, blocks: [ { kind: small, text: { en: "Tickets can't be refunded or changed.", ar: "لا يمكن استرداد التذاكر أو تغييرها." } } ] }
        footer:
          - { kind: button, text: { en: "Buy ticket", ar: "اشترِ التذكرة" } }
    answer: a
    misconceptions:
      - id: MC-P14-018
        when: [b]
        feedback:
          en: "Ghada has no reason to open Refunds before she buys. She'd learn the rule only when she tries to get her money back."
          ar: "ليس لدى غادة سبب لفتح قسم «الاسترداد» قبل الشراء. ولن تعرف الشرط إلا حين تحاول استرداد مالها."
    correct:
      en: "A: the rule that changes the decision sits next to it."
      ar: "A: الشرط الذي يغيّر القرار بجانب زر الشراء."
    explain:
      en: "One short line above Buy is enough for Ghada to decide knowing the rule. The other details can stay collapsed."
      ar: "سطر قصير فوق «اشترِ» يكفي لتقرّر غادة وهي تعرف الشرط. ويمكن أن تبقى التفاصيل الأخرى مطويّة."

  - id: S07
    type: tune
    speaker: mona
    part: independent
    skill: SK-P14-U02-01
    rules: [R14]
    value:
      en: "Accordions (NN/g): FAQ pages are good candidates for accordions. Each visitor comes with one or two questions; titles let them find theirs, and removing questions means some visitors never find an answer."
      ar: "الـ Accordion (NN/g): صفحات الأسئلة الشائعة مناسبة جدًا للـ Accordion. فكل زائر يأتي بسؤال أو اثنين؛ والعناوين تجعله يجد سؤاله، وحذف أسئلة يعني أن بعض الزوار لن يجدوا جوابًا أبدًا."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "FAQ pages and product-detail sections are good candidates for accordions." }
    scenario:
      en: "My team designs a courier company's website. It has 14 common questions, about tracking, prices, missed deliveries and more. The questions don't depend on each other, and most visitors come with just one."
      ar: "يصمّم فريقي موقع شركة شحن. وفيه 14 سؤالًا شائعًا، عن التتبّع والأسعار وما يحدث إن فاتك التوصيل، وغيرها. والأسئلة لا تعتمد على بعضها، وأغلب الزوار يأتون بسؤال واحد فقط."
    prompt:
      en: "Try each version of the help page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة المساعدة. أيّ نسخة تجعل كل زائر يجد جواب سؤاله بسرعة، دون أن يضيع أي جواب؟"
    start: open
    options:
      - id: open
        text: { en: "All 14 questions and answers open", ar: "الأسئلة الـ 14 وأجوبتها مفتوحة" }
        mock:
          app: tard
          frame: wide
          url: tard.example/help
          navbar: &tnav { links: [ { en: "Send", ar: "أرسل" }, { en: "Track", ar: "تتبّع" }, { en: "Help", ar: "المساعدة" } ], active: 2, actions: [ { icon: user } ] }
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: text, weight: bold, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" }, gap: m }
            - { kind: small, text: { en: "Enter the 10-digit code from your text message on the Track page. Updates appear every few hours…", ar: "أدخل الرمز المكوّن من 10 أرقام من رسالتك في صفحة التتبّع. وتظهر التحديثات كل بضع ساعات…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" }, gap: m }
            - { kind: small, text: { en: "Prices depend on weight and distance. Within the same city, a parcel up to 2 kg costs…", ar: "الأسعار تعتمد على الوزن والمسافة. وداخل المدينة نفسها، الشحنة حتى 2 كجم تكلّف…" }, gap: xs }
            - { kind: more, text: { en: "+12 more questions, all open", ar: "+12 سؤالًا آخر، كلها مفتوحة" } }
      - id: acc
        text: { en: "The 14 questions as an accordion: tap one to see its answer", ar: "الأسئلة الـ 14 في Accordion: اضغط سؤالًا لترى جوابه" }
        mock:
          app: tard
          frame: wide
          url: tard.example/help
          navbar: *tnav
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: searchbar, text: { en: "Search help", ar: "ابحث في المساعدة" }, gap: s }
            - { kind: accordion, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" }, gap: m, blocks: [ { kind: small, text: { en: "Enter the 10-digit code from your text message on the Track page. Updates appear every few hours.", ar: "أدخل الرمز المكوّن من 10 أرقام من رسالتك في صفحة التتبّع. وتظهر التحديثات كل بضع ساعات." } } ] }
            - { kind: accordion, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" }, blocks: [ { kind: small, text: { en: "Prices depend on weight and distance. Within the same city, a parcel up to 2 kg costs EGP 45.", ar: "الأسعار تعتمد على الوزن والمسافة. وداخل المدينة نفسها، الشحنة حتى 2 كجم تكلّف 45 جنيهًا." } } ] }
            - { kind: accordion, text: { en: "What happens if I miss a delivery?", ar: "ماذا يحدث إن فاتني التوصيل؟" }, blocks: [ { kind: small, text: { en: "We try again the next day. After two tries, your parcel waits 5 days at the nearest branch.", ar: "نحاول مرة أخرى في اليوم التالي. وبعد محاولتين، تنتظرك الشحنة 5 أيام في أقرب فرع." } } ] }
            - { kind: accordion, text: { en: "Can I change the delivery address?", ar: "هل يمكنني تغيير عنوان التوصيل؟" }, blocks: [ { kind: small, text: { en: "Yes, until the parcel leaves our branch. Open it in Track and tap Change address.", ar: "نعم، حتى تخرج الشحنة من فرعنا. افتحها في «تتبّع» واضغط «غيّر العنوان»." } } ] }
            - { kind: meta, text: { en: "+ 10 more questions", ar: "+10 أسئلة أخرى" }, gap: s }
      - id: top
        text: { en: "Only the 5 most asked questions; remove the other 9", ar: "أكثر 5 أسئلة طرحًا فقط؛ واحذف الأسئلة التسعة الأخرى" }
        mock:
          app: tard
          frame: wide
          url: tard.example/help
          navbar: *tnav
          blocks:
            - { kind: title, text: { en: "Help", ar: "المساعدة" } }
            - { kind: text, weight: bold, text: { en: "How do I track my parcel?", ar: "كيف أتتبّع شحنتي؟" }, gap: m }
            - { kind: small, text: { en: "Enter the 10-digit code from your text message…", ar: "أدخل الرمز المكوّن من 10 أرقام من رسالتك…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "How much does sending a parcel cost?", ar: "كم تكلفة إرسال شحنة؟" }, gap: m }
            - { kind: small, text: { en: "Prices depend on weight and distance…", ar: "الأسعار تعتمد على الوزن والمسافة…" }, gap: xs }
    answer: [acc]
    misconceptions:
      - id: MC-P14-017
        when: [open]
        feedback:
          en: "A visitor with a question about a missed delivery has to read past every other answer to find it. On a wide screen, that's still a very long page."
          ar: "الزائر الذي يسأل عن توصيل فاته عليه أن يقرأ كل الأجوبة الأخرى ليجد سؤاله. وحتى على شاشة عريضة، تبقى الصفحة طويلة جدًا."
      - id: MC-P14-018
        when: [top]
        feedback:
          en: "The page is short, but a visitor whose question was one of the 9 removed finds nothing at all. Collapsing keeps every answer; removing loses it."
          ar: "صارت الصفحة قصيرة، لكن الزائر الذي كان سؤاله من الأسئلة التسعة المحذوفة لن يجد شيئًا. فالطيّ يُبقي كل جواب؛ أما الحذف فيُضيّعه."
    correct:
      en: "Independent questions, one needed: an accordion."
      ar: "أسئلة مستقلّة، والمطلوب واحد: Accordion."
    explain:
      en: "Every visitor scans 14 short titles, opens theirs and skips the rest. No answer is lost, and the page stays short."
      ar: "كل زائر يتصفّح 14 عنوانًا قصيرًا، ويفتح سؤاله ويتخطّى الباقي. ولا يضيع أي جواب، وتبقى الصفحة قصيرة."

  - id: S08
    type: card
    part: recap
    icons: [layers, eye, warn]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Accordion** when people need a few sections: a plan's details, an FAQ.\n- **Everything open** when people need it all, like setup steps they follow in order.\n- **Never collapsed:** a deadline or a rule that changes the decision, like \"no refunds\".\n\nNext: which action gets the loudest button."
      ar: "- **الـ Accordion** حين يحتاج الناس أقسامًا قليلة: تفاصيل خطّة، أو أسئلة شائعة.\n- **كل شيء مفتوح** حين يحتاج الناس المحتوى كله، مثل خطوات تركيب يتبعونها بالترتيب.\n- **لا يُطوى أبدًا:** موعد نهائي أو شرط يغيّر القرار، مثل «لا استرداد».\n\nالتالي: أيّ إجراء يأخذ أوضح زر."
