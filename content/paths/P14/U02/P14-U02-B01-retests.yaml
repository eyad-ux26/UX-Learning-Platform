      en: "Adding an episode is one tap on every row. Share and show notes stay in ⋯, close but out of the way."
      ar: "إضافة حلقة بضغطة واحدة في كل صف. والمشاركة وتفاصيل الحلقة في ⋯، قريبة دون أن تزحم الشاشة."

  # SK-P14-U02-05: float only the screen's main action
  - id: S09
    type: tune
    speaker: tarek
    skill: SK-P14-U02-05
    part: retest
    value:
      en: "Re-test, floating buttons and icons (NN/g): one floating button for the main action, and icon labels visible at all times. A ⇄ icon alone could mean transfer or exchange rates, and a second floating button for bills only competes."
      ar: "إعادة اختبار، الأزرار العائمة والأيقونات (NN/g): زر عائم واحد للإجراء الرئيسي، وتسميات الأيقونات ظاهرة دائمًا. وأيقونة ⇄ وحدها قد تعني التحويل أو أسعار الصرف، وزر عائم ثانٍ للفواتير لا يفعل إلا المنافسة."
    ref: { url: "https://www.nngroup.com/articles/icon-usability/", quote: "Icon labels should be visible at all times, without any interaction from the user." }
    scenario:
      en: "The home screen of the banking app I manage. Most people open the app to send money to someone. Paying bills is less common and has its own tab."
      ar: "الشاشة الرئيسية في تطبيق البنك الذي أديره. وأغلب الناس يفتحونه ليحوّلوا مالًا لشخص ما. ودفع الفواتير أقل شيوعًا وله تبويب خاص."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم (Floating action button). أيّ زر يقود أغلب الناس بوضوح إلى ما فتحوا التطبيق من أجله؟"
    start: icon
    options:
      - id: label
        text: { en: "\"⇄ Transfer\"", ar: "«⇄ حوّل»" }
        mock:
          app: rasid
          appbar: &rbar { title: { en: "Home", ar: "الرئيسية" }, large: true, actions: [ { icon: bell, aria: { en: "Notifications", ar: "الإشعارات" } } ] }
          tabbar: &rtabs
            active: 0
            items:
              - { icon: house, text: { en: "Home", ar: "الرئيسية" } }
              - { icon: credit-card, text: { en: "Cards", ar: "البطاقات" } }
              - { icon: list, text: { en: "More", ar: "المزيد" } }
          fab: { icon: arrows-left-right, text: { en: "Transfer", ar: "حوّل" } }
          blocks: &bank
            - kind: card
              blocks:
                - { kind: small, text: { en: "Current account", ar: "الحساب الجاري" } }
                - { kind: price, text: { en: "EGP 18,240", ar: "18,240 جنيه" }, size: l, gap: xs }
            - { kind: text, weight: bold, text: { en: "Recent", ar: "آخر العمليات" }, gap: m }
            - { kind: listitem, icon: shopping-cart, text: { en: "Supermarket", ar: "سوبر ماركت" }, value: { en: "−EGP 640", ar: "−640 جنيه" }, gap: s }
            - { kind: listitem, icon: arrow-down-left, text: { en: "Salary", ar: "الراتب" }, value: { en: "+EGP 15,000", ar: "+15,000 جنيه" } }
      - id: icon
        text: { en: "\"⇄\" alone", ar: "«⇄» وحدها" }
        mock:
          app: rasid
          appbar: *rbar
          tabbar: *rtabs
          fab: { icon: arrows-left-right }
          blocks: *bank
      - id: two
        text: { en: "Two floating buttons: \"⇄ Transfer\" and \"🧾 Pay bills\"", ar: "زرّان عائمان: «⇄ حوّل» و«🧾 ادفع الفواتير»" }
        mock:
          app: rasid
          appbar: *rbar
          tabbar: *rtabs
          fab: [ { icon: arrows-left-right, text: { en: "Transfer", ar: "حوّل" } }, { icon: receipt, text: { en: "Pay bills", ar: "ادفع الفواتير" } } ]
          blocks: *bank
    answer: [label]
    misconceptions:
      - id: MC-P14-024
        when: [icon]
        feedback:
          en: "⇄ could mean transfer, exchange rates or switching accounts. With money involved, people won't tap a button they have to guess about."
          ar: "⇄ قد تعني التحويل أو أسعار الصرف أو التبديل بين الحسابات. ومع المال، لن يضغط الناس زرًا عليهم أن يخمّنوا وظيفته."
      - id: MC-P14-023
        when: [two]
        feedback:
          en: "Two floating buttons compete and cover the recent payments. Bills already have their own tab."
          ar: "زرّان عائمان يتنافسان ويغطّيان آخر العمليات. والفواتير لها تبويب خاص أصلًا."
    correct:
      en: "One floating button, clearly labeled."
      ar: "زر عائم واحد، بتسمية واضحة."
    explain:
      en: "\"Transfer\" says exactly what the main action is, and nothing else floats over the account."
      ar: "«حوّل» تقول بالضبط ما الإجراء الرئيسي، ولا شيء آخر يطفو فوق الحساب."

  - id: S10
    type: tune
    speaker: rami
    skill: SK-P14-U02-05
    part: retest
    value:
      en: "Re-test, floating buttons (NN/g glossary): for the most commonly used and important action on the screen. In a shopping list, that's adding an item; sharing and deleting the list are rare."
      ar: "إعادة اختبار، الأزرار العائمة (مسرد NN/g): للإجراء الأكثر استخدامًا وأهمية في الشاشة. وفي قائمة المشتريات، هذا الإجراء هو إضافة منتج؛ أما مشاركة القائمة وحذفها فنادران."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "A floating button is typically used for the most commonly used and important action on the screen." }
    scenario:
      en: "I'm designing a shopping list app. Nermeen adds items to her list all week. She shares the list with her husband now and then, and deletes it once a month."
      ar: "أصمّم تطبيقًا لقوائم المشتريات. تضيف نرمين منتجات إلى قائمتها طوال الأسبوع. وتشارك القائمة مع زوجها من حين لآخر، وتحذفها مرة في الشهر."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم. أيّ زر عائم يناسب ما تفعله نرمين أكثر شيء طوال الأسبوع؟"
    start: share
    options:
      - id: share
        text: { en: "\"↗ Share list\"", ar: "«↗ شارك القائمة»" }
        mock:
          app: qaima
          appbar: &qbar { title: { en: "This week", ar: "هذا الأسبوع" }, back: true }
          fab: { icon: share-network, text: { en: "Share list", ar: "شارك القائمة" } }
          blocks: &list
            - { kind: check, text: { en: "Milk", ar: "لبن" } }
            - { kind: check, text: { en: "Tomatoes", ar: "طماطم" }, gap: s }
            - { kind: check, selected: true, text: { en: "Bread", ar: "عيش" }, gap: s }
            - { kind: small, text: { en: "Shared with Amal · edited 5 min ago", ar: "مشتركة مع أمل · عُدّلت قبل 5 دقائق" }, gap: m }
      - id: add
        text: { en: "\"＋ Add item\"", ar: "«＋ أضف منتجًا»" }
        mock:
          app: qaima
          appbar: *qbar
          fab: { icon: plus, text: { en: "Add item", ar: "أضف منتجًا" } }
          blocks: *list
      - id: delete
        text: { en: "\"🗑 Delete list\"", ar: "«🗑 احذف القائمة»" }
        mock:
          app: qaima
          appbar: *qbar
          fab: { icon: trash, text: { en: "Delete list", ar: "احذف القائمة" } }
          blocks: *list
    answer: [add]
    misconceptions:
      - id: MC-P14-023
        when: [share, delete]
        feedback:
          en: "Nermeen does this rarely, yet it takes the button that's always in reach. A floating Delete is also one slip away from losing the whole list."
          ar: "نرمين تفعل هذا نادرًا، ومع ذلك يأخذ الزر الذي يبقى دائمًا في المتناول. وزر «احذف» العائم قد يُضيّع القائمة كلها بضغطة خاطئة."
    correct:
      en: "Her most common action: add an item."
      ar: "إجراؤها الأكثر تكرارًا: أضف منتجًا."
    explain:
      en: "Adding is what Nermeen does all week, so it floats. Sharing and deleting can live in the menu."
      ar: "الإضافة هي ما تفعله نرمين طوال الأسبوع، لذلك هي العائمة. ويمكن أن تكون المشاركة والحذف في قائمة الخيارات ⋯."

  # SK-P14-U02-06: chips for a group of related choices
  - id: S11
    type: tune
    speaker: sara
    skill: SK-P14-U02-06
    part: retest
    value:
      en: "Re-test, filters (NN/g): use interactive filters if people are exploring. People browsing recipes try a diet, look, and try another, so filter chips that apply on tap and show ✓ beat a long Filters page."
      ar: "إعادة اختبار، الفلاتر (NN/g): استخدم الفلاتر التفاعلية إذا كان الناس يستكشفون. ومن يتصفّح الوصفات يجرّب نظامًا غذائيًا، وينظر، ثم يجرّب غيره، لذلك فالـ Filter chips التي تُطبَّق عند الضغط وتعرض ✓ أفضل من صفحة «فلاتر» طويلة."
    ref: { url: "https://www.nngroup.com/articles/applying-filters/", quote: "Use interactive filters if your users are exploratory in their search." }
    scenario:
      en: "In my recipe app, people browse dinner ideas and often switch between **Vegetarian**, **Quick** and **Low sugar** to see what they can cook tonight."
      ar: "في تطبيق الوصفات الذي أصمّمه، يتصفّح الناس أفكارًا للعشاء، وكثيرًا ما يتنقّلون بين **نباتي** و**سريع** و**قليل السكر** ليروا ما يمكنهم طبخه الليلة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل الناس يتنقّلون بين الأنظمة الثلاثة بأسرع شكل، ويعرفون أيّها مختار؟"
    start: page
    options:
      - id: page
        text: { en: "A Filters button that opens a page with Apply", ar: "زر «فلاتر» يفتح صفحة فيها «طبّق»" }
        mock:
          app: tabkha
          appbar: &dbar { title: { en: "Dinner ideas", ar: "أفكار للعشاء" }, back: true }
          blocks:
            - { kind: button, style: outline, icon: sliders-horizontal, text: { en: "Filters", ar: "فلاتر" } }
            - { kind: card, art: food-grill, gap: s, blocks: [ { kind: text, weight: bold, text: { en: "Grilled chicken with rice", ar: "فراخ مشوية بالأرز" } }, { kind: meta, text: { en: "40 min", ar: "40 دقيقة" }, gap: xs } ] }
      - id: chips
        text: { en: "Filter chips above the list, applied on tap", ar: "Filter chips (أزرار فلترة صغيرة) فوق القائمة، تعمل فور الضغط" }
        mock:
          app: tabkha
          appbar: *dbar
          blocks:
            - kind: chips
              items:
                - { text: { en: "Vegetarian", ar: "نباتي" }, on: true }
                - { text: { en: "Quick", ar: "سريع" } }
                - { text: { en: "Low sugar", ar: "قليل السكر" } }
            - { kind: card, art: food-salad, gap: s, blocks: [ { kind: text, weight: bold, text: { en: "Stuffed peppers", ar: "فلفل محشي" } }, { kind: meta, text: { en: "Vegetarian · 45 min", ar: "نباتي · 45 دقيقة" }, gap: xs } ] }
      - id: loud
        text: { en: "Three filled buttons above the list", ar: "ثلاثة أزرار ممتلئة فوق القائمة" }
        mock:
          app: tabkha
          appbar: *dbar
          blocks:
            - kind: row
              gap: s
              blocks:
                - { kind: button, text: { en: "Vegetarian", ar: "نباتي" } }
                - { kind: button, text: { en: "Quick", ar: "سريع" } }
                - { kind: button, text: { en: "Low sugar", ar: "قليل السكر" } }
            - { kind: card, art: food-grill, gap: s, blocks: [ { kind: text, weight: bold, text: { en: "Grilled chicken with rice", ar: "فراخ مشوية بالأرز" } }, { kind: meta, text: { en: "40 min", ar: "40 دقيقة" }, gap: xs } ] }
    answer: [chips]
    misconceptions:
      - id: MC-P14-070
        when: [loud]
        feedback:
          en: "Three filled buttons look like three main actions, and none shows which diet is on now."
          ar: "ثلاثة أزرار ممتلئة تبدو ثلاثة إجراءات رئيسية، ولا يوضّح أيٌّ منها النظام الغذائي المختار الآن."
    correct:
      en: "Filter chips, applied on tap."
      ar: "Filter chips، تُطبَّق عند الضغط."
    explain:
      en: "Every diet is in sight, one tap switches, and the ✓ shows what's on while the recipes change at once."
      ar: "كل الأنظمة ظاهرة، وضغطة واحدة تبدّل بينها، وعلامة ✓ توضّح المختار، والوصفات تتغيّر فورًا."

  - id: S12
    type: tune
    speaker: karim
    skill: SK-P14-U02-06
    part: retest
    value:
      en: "Re-test, user control and freedom (NN/g): people often act by mistake and need a clear way out. Each skill people add becomes an input chip with its own ✕, so a wrong one goes in one tap."
      ar: "إعادة اختبار، تحكّم المستخدم وحرّيته (NN/g): كثيرًا ما يخطئ الناس، ويحتاجون إلى مخرج واضح. وكل مهارة يضيفها الناس تصبح Input chip عليها ✕ خاصة بها، فتُحذف المهارة الخطأ بضغطة واحدة."
    ref: { url: "https://www.nngroup.com/articles/ten-usability-heuristics/", quote: "Users often perform actions by mistake." }
    scenario:
      en: "I'm building a job app. People type their skills one by one in their profile, like **Excel**, **Arabic** and **Sales**. Some pick a wrong suggestion while typing and want to take it out."
      ar: "أبني تطبيقًا للوظائف. يكتب الناس مهاراتهم واحدة تلو الأخرى في ملفهم، مثل **Excel** و**العربية** و**المبيعات**. وبعضهم يختار اقتراحًا خطأ أثناء الكتابة ويريد إزالته."
    prompt:
      en: "Try each version of the skills field. Which one should ship?"
      ar: "جرّب كل نسخة من حقل المهارات. أيّ نسخة تتيح للناس حذف المهارة الخطأ بسهولة في مكانها؟"
    start: locked
    options:
      - id: locked
        text: { en: "Chips without ✕; Edit profile to change them", ar: "Chips بدون ✕؛ ولتغييرها اضغط «عدّل الملف»" }
        mock:
          app: herfa
          appbar: &fbar { title: { en: "Your skills", ar: "مهاراتك" }, back: true }
          blocks:
            - kind: chips
              label: { en: "Skills", ar: "المهارات" }
              boxed: true
              items:
                - { text: { en: "Excel", ar: "Excel" } }
                - { text: { en: "Arabic", ar: "العربية" } }
                - { text: { en: "Sales", ar: "المبيعات" } }
                - { text: { en: "Sailing", ar: "الإبحار الشراعي" } }
            - { kind: link, text: { en: "Edit profile", ar: "عدّل الملف" }, gap: xs }
          footer:
            - { kind: button, text: { en: "Save", ar: "احفظ" } }
      - id: chips
        text: { en: "Each skill is a chip with ✕", ar: "كل مهارة Chip عليها ✕" }
        mock:
          app: herfa
          appbar: *fbar
          blocks:
            - kind: chips
              label: { en: "Skills", ar: "المهارات" }
              boxed: true
              after: { en: "Add a skill…", ar: "أضف مهارة…" }
              items:
                - { text: { en: "Excel", ar: "Excel" }, x: true }
                - { text: { en: "Arabic", ar: "العربية" }, x: true }
                - { text: { en: "Sales", ar: "المبيعات" }, x: true }
                - { text: { en: "Sailing", ar: "الإبحار الشراعي" }, x: true }
          footer:
            - { kind: button, text: { en: "Save", ar: "احفظ" } }
      - id: text
        text: { en: "One text box, skills separated by commas", ar: "مربع نص واحد، والمهارات تفصلها فواصل" }
        mock:
          app: herfa
          appbar: *fbar
          blocks:
            - { kind: field, label: { en: "Skills", ar: "المهارات" }, text: { en: "Excel, Arabic, Sales, Sailing", ar: "Excel، العربية، المبيعات، الإبحار الشراعي" }, filled: true }
          footer:
            - { kind: button, text: { en: "Save", ar: "احفظ" } }
    answer: [chips]
    misconceptions:
      - id: MC-P14-071
        when: [locked, text]
        feedback:
          en: "Taking out the wrong skill means leaving the screen or editing letters by hand. Some people will leave Sailing on their CV."
          ar: "إزالة المهارة الخطأ تعني مغادرة الشاشة أو تعديل الحروف يدويًا. وبعض الناس سيتركون «الإبحار الشراعي» في سيرتهم الذاتية."
    correct:
      en: "Input chips, each with ✕."
      ar: "Input chips، لكل منها ✕."
    explain:
      en: "Each skill is its own unit, and one tap on ✕ removes exactly the wrong one, right where people typed it."
      ar: "كل مهارة وحدة مستقلة، وضغطة واحدة على ✕ تحذف الخطأ بالضبط، في المكان الذي كتبها فيه الناس."
