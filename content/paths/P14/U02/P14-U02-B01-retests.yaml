steps:
  # SK-P14-U02-01: collapse only what most people skip
  - id: S01
    type: tune
    speaker: sara
    skill: SK-P14-U02-01
    part: retest
    value:
      en: "Re-test, accordions (NN/g): when people need most or all of the content, display it all at once. A cook needs every ingredient and every step, so collapsing them only adds taps with wet hands."
      ar: "إعادة اختبار، الـ Accordion (NN/g): حين يحتاج الناس أغلب المحتوى أو كله، فاعرضه كله مرة واحدة. والطبّاخ يحتاج كل المكوّنات وكل الخطوات، فطيّها يزيد الضغطات فقط ويداه مبلّلتان."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "If you expect users to need information from several accordions at once, it is better to display all the content at once" }
    scenario:
      en: "Adham is cooking from a recipe in my recipe app, on his phone. The recipe has 8 ingredients and 6 short steps, and he needs all of them, in order."
      ar: "يطبخ أدهم من وصفة في تطبيق الوصفات الذي أصمّمه، على هاتفه. والوصفة فيها 8 مكوّنات و6 خطوات قصيرة، وهو يحتاجها كلها، بالترتيب."
    prompt:
      en: "Try each version of the recipe. Which one should ship?"
      ar: "جرّب كل نسخة من الوصفة. أيّ نسخة تتيح لأدهم أن يرى المكوّنات والخطوات وهو يطبخ دون ضغطات؟"
    start: acc
    options:
      - id: acc
        text: { en: "Ingredients and each step collapsed under titles", ar: "المكوّنات وكل خطوة مطويّة تحت عناوين" }
        mock:
          app: tabkha
          appbar: &tbar { title: { en: "Lentil soup", ar: "شوربة عدس" }, back: true, actions: [ { icon: bookmark-simple, aria: { en: "Save", ar: "احفظ" } } ] }
          blocks:
            - { kind: image, art: food-salad, size: m, alt: { en: "Lentil soup", ar: "شوربة عدس" } }
            - { kind: meta, text: { en: "20 min · 4 servings · ★ 4.8", ar: "20 دقيقة · 4 أطباق · ★ 4.8" }, gap: s }
            - { kind: accordion, text: { en: "Ingredients", ar: "المكوّنات" }, gap: m }
            - { kind: accordion, text: { en: "Step 1", ar: "الخطوة 1" } }
            - { kind: accordion, text: { en: "Step 2", ar: "الخطوة 2" } }
            - { kind: accordion, text: { en: "Step 3", ar: "الخطوة 3" } }
      - id: open
        text: { en: "Ingredients and steps open, one after the other", ar: "المكوّنات والخطوات مفتوحة، واحدة بعد الأخرى" }
        mock:
          app: tabkha
          appbar: *tbar
          blocks:
            - { kind: image, art: food-salad, size: m, alt: { en: "Lentil soup", ar: "شوربة عدس" } }
            - { kind: meta, text: { en: "20 min · 4 servings · ★ 4.8", ar: "20 دقيقة · 4 أطباق · ★ 4.8" }, gap: s }
            - { kind: text, weight: bold, text: { en: "Ingredients", ar: "المكوّنات" }, gap: m }
            - { kind: small, text: { en: "1 cup lentils · 1 onion · 1 carrot · 2 cloves garlic · cumin · salt…", ar: "كوب عدس · بصلة · جزرة · فصّان ثوم · كمّون · ملح…" }, gap: xs }
            - { kind: list, style: number, gap: m, items: [ { en: "Wash the lentils.", ar: "اغسل العدس." }, { en: "Fry the onion for 3 minutes.", ar: "حمّر البصل 3 دقائق." }, { en: "Add everything with 5 cups of water.", ar: "أضف كل شيء مع 5 أكواب ماء." } ] }
      - id: one
        text: { en: "One step at a time; opening a step closes the one before", ar: "خطوة واحدة في كل مرة؛ وفتح خطوة يغلق السابقة" }
        mock:
          app: tabkha
          appbar: *tbar
          blocks:
            - { kind: image, art: food-salad, size: m, alt: { en: "Lentil soup", ar: "شوربة عدس" } }
            - { kind: meta, text: { en: "20 min · 4 servings · ★ 4.8", ar: "20 دقيقة · 4 أطباق · ★ 4.8" }, gap: s }
            - { kind: accordion, text: { en: "Ingredients", ar: "المكوّنات" }, gap: m }
            - { kind: accordion, text: { en: "Step 1", ar: "الخطوة 1" }, open: true, blocks: [ { kind: small, text: { en: "Wash the lentils.", ar: "اغسل العدس." } } ] }
            - { kind: accordion, text: { en: "Step 2", ar: "الخطوة 2" } }
    answer: [open]
    misconceptions:
      - id: MC-P14-016
        when: [acc, one]
        feedback:
          en: "Adham needs every part, so he'll open every one, with his hands busy. And he can't check the ingredients while he reads a step."
          ar: "أدهم يحتاج كل جزء، فسيفتحها كلها ويداه مشغولتان. ولا يستطيع أن يراجع المكوّنات وهو يقرأ خطوة."
    correct:
      en: "He needs it all: show it all."
      ar: "يحتاج كل شيء: اعرض كل شيء."
    explain:
      en: "Everything is short and needed. Open on one page, Adham can glance at the ingredients and the next step without a single tap."
      ar: "كل شيء قصير ومطلوب. وحين يكون كله مفتوحًا في صفحة واحدة، يلقي أدهم نظرة على المكوّنات والخطوة التالية دون أي ضغطة."

  - id: S02
    type: tune
    speaker: karim
    skill: SK-P14-U02-01
    part: retest
    value:
      en: "Re-test, accordions (NN/g): product-detail sections are good candidates for accordions. Each shopper checks one or two specs, and which ones differs from shopper to shopper, so removing sections loses answers."
      ar: "إعادة اختبار، الـ Accordion (NN/g): أقسام تفاصيل المنتج مناسبة جدًا للـ Accordion. فكل مشترٍ يراجع مواصفة أو اثنتين، وتختلف المواصفة من مشترٍ لآخر، فحذف الأقسام يُضيّع أجوبة."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "FAQ pages and product-detail sections are good candidates for accordions." }
    scenario:
      en: "I'm building an electronics website. Rana is choosing a phone on it, on her laptop. Each phone page has six spec sections: screen, battery, camera, storage, what's in the box, and warranty. Shoppers usually check one or two, and not the same ones."
      ar: "أبني موقعًا للإلكترونيات. تختار فيه رنا هاتفًا على الـ Laptop. وكل صفحة هاتف فيها ستة أقسام للمواصفات: الشاشة، والبطارية، والكاميرا، والذاكرة، وما في العلبة، والضمان. والمشترون يراجعون عادةً قسمًا أو اثنين، وليست الأقسام نفسها."
    prompt:
      en: "Try each version of the phone page. Which one should ship?"
      ar: "جرّب كل نسخة من صفحة الهاتف. أيّ نسخة تجعل كل مشترٍ يصل بسرعة إلى القسم الذي يريده؟"
    start: two
    options:
      - id: two
        text: { en: "Show only Battery and Camera; remove the other four", ar: "اعرض البطارية والكاميرا فقط؛ واحذف الأقسام الأربعة الأخرى" }
        mock:
          app: volta
          frame: wide
          url: volta.example/phones/x5
          navbar: &vnav { links: [ { en: "Phones", ar: "الهواتف" }, { en: "Laptops", ar: "اللابتوب" }, { en: "TVs", ar: "التلفزيونات" } ], active: 0, search: true, actions: [ { icon: shopping-cart }, { icon: user } ] }
          blocks:
            - kind: row
              gap: s
              blocks:
                - { kind: image, art: phone, size: m, alt: { en: "Phone X5", ar: "هاتف X5" } }
                - kind: group
                  blocks:
                    - { kind: heading, text: { en: "Phone X5", ar: "هاتف X5" } }
                    - { kind: price, text: { en: "EGP 14,999", ar: "14,999 جنيه" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Battery", ar: "البطارية" }, gap: m }
            - { kind: small, text: { en: "5,000 mAh, about two days of normal use…", ar: "5,000 مللي أمبير، تكفي يومين تقريبًا مع الاستخدام العادي…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Camera", ar: "الكاميرا" }, gap: m }
            - { kind: small, text: { en: "50 MP main camera, 12 MP wide…", ar: "كاميرا رئيسية 50 ميجابكسل، وعريضة 12 ميجابكسل…" }, gap: xs }
      - id: acc
        text: { en: "The six sections as an accordion", ar: "الأقسام الستة في Accordion (أقسام تُفتح وتُطوى)" }
        mock:
          app: volta
          frame: wide
          url: volta.example/phones/x5
          navbar: *vnav
          blocks:
            - kind: row
              gap: s
              blocks:
                - { kind: image, art: phone, size: m, alt: { en: "Phone X5", ar: "هاتف X5" } }
                - kind: group
                  blocks:
                    - { kind: heading, text: { en: "Phone X5", ar: "هاتف X5" } }
                    - { kind: price, text: { en: "EGP 14,999", ar: "14,999 جنيه" }, gap: xs }
            - { kind: accordion, text: { en: "Screen", ar: "الشاشة" }, gap: m }
            - { kind: accordion, text: { en: "Battery", ar: "البطارية" } }
            - { kind: accordion, text: { en: "Camera", ar: "الكاميرا" } }
            - { kind: accordion, text: { en: "Storage", ar: "الذاكرة" } }
            - { kind: accordion, text: { en: "In the box", ar: "ما في العلبة" } }
            - { kind: accordion, text: { en: "Warranty", ar: "الضمان" } }
      - id: open
        text: { en: "All six sections open", ar: "الأقسام الستة مفتوحة" }
        mock:
          app: volta
          frame: wide
          url: volta.example/phones/x5
          navbar: *vnav
          blocks:
            - kind: row
              gap: s
              blocks:
                - { kind: image, art: phone, size: m, alt: { en: "Phone X5", ar: "هاتف X5" } }
                - kind: group
                  blocks:
                    - { kind: heading, text: { en: "Phone X5", ar: "هاتف X5" } }
                    - { kind: price, text: { en: "EGP 14,999", ar: "14,999 جنيه" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Screen", ar: "الشاشة" }, gap: m }
            - { kind: small, text: { en: "6.7 inches, 120 Hz, readable in the sun. Glass on the front and the back…", ar: "6.7 بوصة، 120 هرتز، واضحة تحت الشمس. وزجاج في الأمام والخلف…" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Battery", ar: "البطارية" }, gap: m }
            - { kind: small, text: { en: "5,000 mAh, about two days of normal use. Charges to 50% in 25 minutes…", ar: "5,000 مللي أمبير، تكفي يومين تقريبًا مع الاستخدام العادي. ويشحن إلى 50% في 25 دقيقة…" }, gap: xs }
    answer: [acc]
    misconceptions:
      - id: MC-P14-018
        when: [two]
        feedback:
          en: "A shopper who wants to know the warranty or what's in the box finds nothing. Collapsing keeps every answer; removing loses it."
          ar: "المشتري الذي يريد معرفة الضمان أو ما في العلبة لن يجد شيئًا. فالطيّ يُبقي كل جواب؛ أما الحذف فيُضيّعه."
      - id: MC-P14-017
        when: [open]
        feedback:
          en: "Rana wants the warranty, the last section, so she scrolls past five long sections she doesn't need."
          ar: "تريد رنا الضمان، وهو القسم الأخير، فتمرّ على خمسة أقسام طويلة لا تحتاجها."
    correct:
      en: "Each shopper needs a few: an accordion."
      ar: "كل مشترٍ يحتاج قسمًا أو اثنين: Accordion."
    explain:
      en: "All six titles fit on one screen, so every shopper finds their spec at once and nothing is removed."
      ar: "العناوين الستة كلها في شاشة واحدة، فيجد كل مشترٍ المواصفة التي يريدها فورًا ولا يُحذف شيء."

  # SK-P14-U02-02: never collapse what people must see
  - id: S03
    type: tune
    speaker: hana
    skill: SK-P14-U02-02
    part: retest
    value:
      en: "Re-test, accordions (NN/g): avoid hiding crucial information within collapsed panels. A monthly charge that renews by itself changes whether Fady joins, so it belongs next to Join."
      ar: "إعادة اختبار، الـ Accordion (NN/g): تجنّب إخفاء أي معلومة مهمة داخل الأقسام المطويّة. والاشتراك الشهري الذي يتجدّد وحده يغيّر قرار فادي بالاشتراك، فمكانه بجانب «اشترك»."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Avoid hiding any crucial information within the collapsed panels." }
    scenario:
      en: "Fady is joining my gym through our app. The membership renews and charges his card every month until he cancels. That rule is inside the collapsed **Terms** section, above the **Join** button."
      ar: "يشترك فادي في النادي الرياضي الذي أديره من تطبيقنا. والاشتراك يتجدّد ويُخصم من بطاقته كل شهر حتى يلغيه. وهذا الشرط داخل قسم **الشروط** المطويّ، فوق زر **اشترك**."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل فادي يرى شرط التجديد الشهري قبل أن يضغط «اشترك»؟"
    start: terms
    options:
      - id: terms
        text: { en: "Keep the rule inside Terms", ar: "أبقِ الشرط داخل قسم «الشروط»" }
        mock:
          app: nashat
          appbar: &nbar { title: { en: "Monthly plan", ar: "اشتراك شهري" }, back: true }
          blocks:
            - { kind: image, art: gym, size: m, alt: { en: "Gym floor", ar: "صالة النادي" } }
            - { kind: price, text: { en: "EGP 600", ar: "600 جنيه" }, per: { en: "/ month", ar: "/ شهر" }, gap: s }
            - { kind: accordion, text: { en: "What's included", ar: "ما يشمله" }, gap: m }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" } }
          footer:
            - { kind: button, text: { en: "Join", ar: "اشترك" } }
      - id: open
        text: { en: "Open Terms by default, with all 12 rules", ar: "افتح قسم «الشروط» تلقائيًا، بقواعدها الـ 12 كلها" }
        mock:
          app: nashat
          appbar: *nbar
          blocks:
            - { kind: image, art: gym, size: m, alt: { en: "Gym floor", ar: "صالة النادي" } }
            - { kind: price, text: { en: "EGP 600", ar: "600 جنيه" }, per: { en: "/ month", ar: "/ شهر" }, gap: s }
            - { kind: accordion, text: { en: "What's included", ar: "ما يشمله" }, gap: m }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" }, open: true, blocks: [ { kind: small, text: { en: "1. Members must be 16 or older. 2. Bring a towel. 3. Lockers are emptied at closing. 4. Classes must be booked a day ahead. 5. Guests pay a day fee. 6. The plan renews every month…", ar: "1. يجب أن يكون العضو 16 عامًا أو أكثر. 2. أحضر منشفة. 3. تُفرَّغ الخزائن عند الإغلاق. 4. تُحجز الحصص قبلها بيوم. 5. يدفع الضيوف رسم يوم. 6. يتجدّد الاشتراك كل شهر…" } } ] }
          footer:
            - { kind: button, text: { en: "Join", ar: "اشترك" } }
      - id: line
        text: { en: "A line above Join: \"Renews every month until you cancel\"", ar: "سطر فوق «اشترك»: «يتجدّد كل شهر حتى تلغيه»" }
        mock:
          app: nashat
          appbar: *nbar
          blocks:
            - { kind: image, art: gym, size: m, alt: { en: "Gym floor", ar: "صالة النادي" } }
            - { kind: price, text: { en: "EGP 600", ar: "600 جنيه" }, per: { en: "/ month", ar: "/ شهر" }, gap: s }
            - { kind: accordion, text: { en: "What's included", ar: "ما يشمله" }, gap: m }
            - { kind: accordion, text: { en: "Terms", ar: "الشروط" } }
            - { kind: small, weight: bold, text: { en: "Renews and charges EGP 600 every month until you cancel.", ar: "يتجدّد ويُخصم 600 جنيه كل شهر حتى تلغيه." }, gap: l }
          footer:
            - { kind: button, text: { en: "Join", ar: "اشترك" } }
    answer: [line]
    misconceptions:
      - id: MC-P14-018
        when: [terms]
        feedback:
          en: "Fady taps Join without opening Terms, and finds out about the monthly charge on his card statement."
          ar: "يضغط فادي «اشترك» دون أن يفتح قسم «الشروط»، ويعرف بالخصم الشهري من كشف حساب بطاقته."
      - id: MC-P14-018
        when: [open]
        feedback:
          en: "The renewal rule is now on screen, but it's rule 6 of 12 in a block of small text. Fady can still skim past it."
          ar: "صار شرط التجديد على الشاشة، لكنه القاعدة السادسة من 12 في كتلة نص صغير. وقد يمرّ عليه فادي دون أن ينتبه."
    correct:
      en: "It changes the decision: a clear line by Join."
      ar: "يغيّر القرار: سطر واضح بجانب «اشترك»."
    explain:
      en: "Right above Join, the one rule that affects his money can't be missed. The other rules can stay in Terms."
      ar: "فوق «اشترك» مباشرة، لن يفوت فادي الشرط الوحيد الذي يمسّ ماله. ويمكن أن تبقى القواعد الأخرى في قسم «الشروط»."

  - id: S04
    type: compare
    speaker: tarek
    skill: SK-P14-U02-02
    part: retest
    value:
      en: "Re-test, accordions (NN/g): valuable content hidden under an accordion may be missed altogether. Learning at the airport that the fare has no checked bag is too late."
      ar: "إعادة اختبار، الـ Accordion (NN/g): المحتوى المهم المخفي تحت Accordion قد يفوت الناس تمامًا. ومعرفة أن التذكرة بلا حقيبة شحن في المطار متأخرة جدًا."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Valuable content that is hidden under an accordion may be missed altogether." }
    scenario:
      en: "In the airline app I manage, Shaimaa is booking the cheapest flight to Jeddah. That fare includes only a 7 kg cabin bag, with no checked bag. She's travelling for two weeks."
      ar: "في تطبيق شركة الطيران الذي أديره، تحجز شيماء أرخص رحلة إلى جدة. وهذه التذكرة تشمل حقيبة يد 7 كجم فقط، بلا حقيبة شحن. وهي مسافرة لمدة أسبوعين."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تجعل شيماء تعرف أن التذكرة الأرخص بلا حقيبة شحن وهي تختار التذكرة؟"
    a:
      label: { en: "Version A: the bag rule inside Fare rules", ar: "النسخة A: شرط الحقيبة داخل قسم «قواعد التذكرة»" }
      mock:
        app: zad
        appbar: &zbar { title: { en: "Your fare", ar: "سعر تذكرتك" }, back: true }
        blocks:
          - { kind: listitem, icon: airplane-tilt, text: { en: "Cairo → Jeddah", ar: "القاهرة ← جدة" }, sub: { en: "14 Nov · 09:40 · direct", ar: "14 نوفمبر · 09:40 · مباشرة" } }
          - { kind: price, text: { en: "EGP 6,300", ar: "6,300 جنيه" }, gap: s }
          - { kind: accordion, text: { en: "Fare rules", ar: "قواعد التذكرة" }, gap: m }
          - { kind: accordion, text: { en: "Seat", ar: "المقعد" } }
        footer:
          - { kind: button, text: { en: "Continue", ar: "تابع" } }
    b:
      label: { en: "Version B: \"Cabin bag only\" next to the price", ar: "النسخة B: «حقيبة يد فقط» بجانب السعر" }
      mock:
        app: zad
        appbar: *zbar
        blocks:
          - { kind: listitem, icon: airplane-tilt, text: { en: "Cairo → Jeddah", ar: "القاهرة ← جدة" }, sub: { en: "14 Nov · 09:40 · direct", ar: "14 نوفمبر · 09:40 · مباشرة" } }
          - { kind: price, text: { en: "EGP 6,300", ar: "6,300 جنيه" }, gap: s }
          - { kind: badge, tone: warn, icon: suitcase-rolling, text: { en: "Cabin bag only (7 kg) · no checked bag", ar: "حقيبة يد فقط (7 كجم) · بلا حقيبة شحن" }, gap: s }
          - { kind: accordion, text: { en: "Fare rules", ar: "قواعد التذكرة" }, gap: m }
          - { kind: accordion, text: { en: "Seat", ar: "المقعد" } }
        footer:
          - { kind: button, text: { en: "Continue", ar: "تابع" } }
    answer: b
    misconceptions:
      - id: MC-P14-018
        when: [a]
        feedback:
          en: "Shaimaa sees the low price and taps Continue. She learns about the missing bag only at check-in, when it costs much more."
          ar: "ترى شيماء السعر المنخفض فتضغط «متابعة». ولا تعرف أن الحقيبة غير مشمولة إلا عند إنهاء إجراءات السفر في المطار، حين تكلّف أكثر بكثير."
    correct:
      en: "B: the rule that changes the choice sits by the price."
      ar: "B: الشرط الذي يغيّر الاختيار بجانب السعر."
    explain:
      en: "Next to the price, Shaimaa sees what the cheap fare leaves out and can pick a fare with a bag for two weeks away."
      ar: "بجانب السعر، ترى شيماء ما لا تشمله التذكرة الرخيصة، فتستطيع أن تختار تذكرة فيها حقيبة لسفر أسبوعين."

  # SK-P14-U02-03: make one action stand out
  - id: S05
    type: tune
    speaker: rami
    skill: SK-P14-U02-03
    part: retest
    value:
      en: "Re-test, similarity (NN/g): reserve a separate color for the primary action. Wael came to create an account; giving the filled style to Sign in instead sends most people the wrong way."
      ar: "إعادة اختبار، مبدأ التشابه (NN/g): خصّص لونًا منفصلًا للإجراء الرئيسي. وجاء وائل لينشئ حسابًا؛ وإعطاء الشكل الممتلئ لـ«سجّل الدخول» بدلًا منه يوجّه أغلب الناس في الاتجاه الخطأ."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Thus, a separate color should be reserved for primary calls-to-action to help them stand out among secondary buttons." }
    scenario:
      en: "I'm designing a language app. Wael has just filled in its sign-up form. Under the form are **Create account**, outlined, and **I already have an account**, filled."
      ar: "أصمّم تطبيقًا لتعلّم اللغات. ملأ وائل للتوّ نموذج التسجيل فيه. وتحت النموذج زر **أنشئ حسابًا** بإطار فقط (Outlined)، وزر **لديّ حساب بالفعل** ممتلئ (Filled)."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل عين وائل تذهب أولًا إلى الخطوة التي تُنهي التسجيل؟"
    start: now
    options:
      - id: now
        text: { en: "Keep it as it is", ar: "أبقِه كما هو" }
        mock:
          app: kalima
          appbar: &kbar { title: { en: "Create your account", ar: "أنشئ حسابك" }, logo: true }
          blocks: &kform
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, icon: envelope-simple, text: "wael@mail.com", filled: true }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, icon: lock, trail: eye, text: "••••••••", filled: true, gap: s }
          footer:
            - { kind: button, style: outline, text: { en: "Create account", ar: "أنشئ حسابًا" } }
            - { kind: button, text: { en: "I already have an account", ar: "لديّ حساب بالفعل" }, gap: s }
      - id: both
        text: { en: "Make both filled", ar: "اجعل الاثنين ممتلئين" }
        mock:
          app: kalima
          appbar: *kbar
          blocks: *kform
          footer:
            - { kind: button, text: { en: "Create account", ar: "أنشئ حسابًا" } }
            - { kind: button, text: { en: "I already have an account", ar: "لديّ حساب بالفعل" }, gap: s }
      - id: create
        text: { en: "Create account filled; the other as a text button", ar: "«أنشئ حسابًا» ممتلئ؛ والآخر زر نصي" }
        mock:
          app: kalima
          appbar: *kbar
          blocks: *kform
          footer:
            - { kind: button, text: { en: "Create account", ar: "أنشئ حسابًا" } }
            - { kind: button, style: text, text: { en: "I already have an account", ar: "لديّ حساب بالفعل" }, gap: s }
    answer: [create]
    misconceptions:
      - id: MC-P14-020
        when: [now]
        feedback:
          en: "Wael just filled in the sign-up form, yet the loudest button leads away from it. The step that finishes what he started looks secondary."
          ar: "ملأ وائل نموذج التسجيل للتوّ، ومع ذلك يقوده أوضح زر بعيدًا عنه. والخطوة التي تُنهي ما بدأه تبدو ثانوية."
      - id: MC-P14-019
        when: [both]
        feedback:
          en: "Two filled buttons look equally important, so Wael has to read both to find the one that creates his account."
          ar: "الزرّان الممتلئان يبدوان متساويين في الأهمية، فعلى وائل أن يقرأ الاثنين ليجد الزر الذي ينشئ حسابه."
    correct:
      en: "Filled for the step forward: Create account."
      ar: "الزر الممتلئ للخطوة التالية: «أنشئ حسابًا»."
    explain:
      en: "Wael's eye lands on Create account, the step that finishes the form. People who already have an account still see the text button."
      ar: "تقع عين وائل على «أنشئ حسابًا»، الخطوة التي تُنهي النموذج. ومن لديهم حساب ما زالوا يرون الزر النصي."

  - id: S06
    type: compare
