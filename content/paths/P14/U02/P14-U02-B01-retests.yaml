          ar: "تضيف ياسمين أغاني مرات كثيرة في اليوم، فستفتح ⋯ في كل مرة. والإجراء الذي تستخدمه أكثر هو الذي عليها أن تبحث عنه."
    correct:
      en: "B: the frequent action stays in sight."
      ar: "B: الإجراء المتكرّر يبقى ظاهرًا."
    explain:
      en: "Adding a song is one tap on every row. Share and credits stay in ⋯, close but out of the way."
      ar: "إضافة أغنية على بُعد ضغطة في كل صف. والمشاركة والبيانات تبقى في ⋯، قريبة لكن بعيدة عن الطريق."

  # SK-P14-U02-05: float only the screen's main action
  - id: S09
    type: tune
    skill: SK-P14-U02-05
    part: retest
    value:
      en: "Re-test, floating buttons and icons (NN/g): one floating button for the main action, and icon labels visible at all times. A ⇄ icon alone could mean transfer or exchange rates, and a second floating button for bills only competes."
      ar: "إعادة اختبار، الأزرار العائمة والأيقونات (NN/g): زر عائم واحد للإجراء الرئيسي، وتسميات الأيقونات ظاهرة دائمًا. وأيقونة ⇄ وحدها قد تعني التحويل أو أسعار الصرف، وزر عائم ثانٍ للفواتير لا يفعل إلا المنافسة."
    ref: { url: "https://www.nngroup.com/articles/icon-usability/", quote: "Icon labels should be visible at all times, without any interaction from the user." }
    scenario:
      en: "Osama's banking app home screen. Most people open it to send money to someone. Paying bills is less common and has its own tab."
      ar: "الشاشة الرئيسية في تطبيق البنك لأسامة. وأغلب الناس يفتحونه ليحوّلوا مالًا لشخص ما. ودفع الفواتير أقل شيوعًا وله تبويب خاص."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم. أيّه يجب أن يُطلق؟"
    start: icon
    options:
      - id: label
        text: { en: "\"⇄ Transfer\"", ar: "«⇄ حوّل»" }
        mock:
          width: 300
          fab: { icon: "⇄", text: { en: "Transfer", ar: "حوّل" } }
          blocks: &bank
            - { kind: meta, text: { en: "Current account", ar: "الحساب الجاري" } }
            - { kind: title, text: { en: "EGP 18,240", ar: "18,240 جنيه" }, gap: xs }
            - { kind: text, weight: bold, text: { en: "Recent", ar: "آخر العمليات" }, gap: l }
            - { kind: meta, text: { en: "Supermarket · −EGP 640", ar: "سوبر ماركت · −640 جنيه" }, gap: s }
            - { kind: meta, text: { en: "Salary · +EGP 15,000", ar: "الراتب · +15,000 جنيه" }, gap: s }
      - id: icon
        text: { en: "\"⇄\" alone", ar: "«⇄» وحدها" }
        mock:
          width: 300
          fab: { icon: "⇄" }
          blocks: *bank
      - id: two
        text: { en: "Two floating buttons: \"⇄ Transfer\" and \"🧾 Pay bills\"", ar: "زرّان عائمان: «⇄ حوّل» و«🧾 ادفع الفواتير»" }
        mock:
          width: 300
          fab: [{ icon: "⇄", text: { en: "Transfer", ar: "حوّل" } }, { icon: "🧾", text: { en: "Pay bills", ar: "ادفع الفواتير" } }]
          blocks: *bank
    answer: [label]
    misconceptions:
      - id: MC-P14-024
        when: [icon]
        feedback:
          en: "⇄ could mean transfer, exchange rates or switching accounts. With money involved, people won't tap a button they have to guess about."
          ar: "⇄ قد تعني التحويل أو أسعار الصرف أو التبديل بين الحسابات. ومع المال، لن يضغط الناس زرًا عليهم أن يخمّنوا وظيفته."
      - id: MC-P14-023
        when: [two]
        feedback:
          en: "Two floating buttons compete and cover the recent payments. Bills already have their own tab."
          ar: "زرّان عائمان يتنافسان ويغطّيان آخر العمليات. والفواتير لها تبويب خاص أصلًا."
    correct:
      en: "One floating button, clearly labeled."
      ar: "زر عائم واحد، بتسمية واضحة."
    explain:
      en: "\"Transfer\" says exactly what the main action is, and nothing else floats over the account."
      ar: "«حوّل» تقول بالضبط ما الإجراء الرئيسي، ولا شيء آخر يطفو فوق الحساب."

  - id: S10
    type: tune
    skill: SK-P14-U02-05
    part: retest
    value:
      en: "Re-test, floating buttons (NN/g glossary): for the most commonly used and important action on the screen. In a shopping list, that's adding an item; sharing and deleting the list are rare."
      ar: "إعادة اختبار، الأزرار العائمة (مسرد NN/g): للإجراء الأكثر استخدامًا وأهمية في الشاشة. وفي قائمة المشتريات، هذا الإجراء هو إضافة منتج؛ أما مشاركة القائمة وحذفها فنادران."
    ref: { url: "https://www.nngroup.com/articles/ui-elements-glossary/", quote: "A floating button is typically used for the most commonly used and important action on the screen." }
    scenario:
      en: "Nermeen keeps a shopping list in an app. She adds items all week. She shares the list with her husband now and then, and deletes it once a month."
      ar: "تحتفظ نرمين بقائمة مشتريات في تطبيق. وتضيف منتجات طوال الأسبوع. وتشارك القائمة مع زوجها من حين لآخر، وتحذفها مرة في الشهر."
    prompt:
      en: "Try each floating button. Which one should ship?"
      ar: "جرّب كل زر عائم. أيّه يجب أن يُطلق؟"
    start: share
    options:
      - id: share
        text: { en: "\"↗ Share list\"", ar: "«↗ شارك القائمة»" }
        mock:
          width: 300
          fab: { icon: "↗", text: { en: "Share list", ar: "شارك القائمة" } }
          blocks: &list
            - { kind: title, text: { en: "This week", ar: "هذا الأسبوع" } }
            - { kind: check, text: { en: "Milk", ar: "لبن" }, gap: m }
            - { kind: check, text: { en: "Tomatoes", ar: "طماطم" }, gap: s }
            - { kind: check, selected: true, text: { en: "Bread", ar: "عيش" }, gap: s }
      - id: add
        text: { en: "\"＋ Add item\"", ar: "«＋ أضف منتجًا»" }
        mock:
          width: 300
          fab: { icon: "＋", text: { en: "Add item", ar: "أضف منتجًا" } }
          blocks: *list
      - id: delete
        text: { en: "\"🗑 Delete list\"", ar: "«🗑 احذف القائمة»" }
        mock:
          width: 300
          fab: { icon: "🗑", text: { en: "Delete list", ar: "احذف القائمة" } }
          blocks: *list
    answer: [add]
    misconceptions:
      - id: MC-P14-023
        when: [share, delete]
        feedback:
          en: "Nermeen does this rarely, yet it takes the button that's always in reach. A floating Delete is also one slip away from losing the whole list."
          ar: "نرمين تفعل هذا نادرًا، ومع ذلك يأخذ الزر الذي يبقى دائمًا في المتناول. وزر «احذف» العائم قد يُضيّع القائمة كلها بضغطة خاطئة."
    correct:
      en: "Her most common action: add an item."
      ar: "إجراؤها الأكثر تكرارًا: أضف منتجًا."
    explain:
      en: "Adding is what Nermeen does all week, so it floats. Sharing and deleting can live in the menu."
      ar: "الإضافة هي ما تفعله نرمين طوال الأسبوع، لذلك هي العائمة. ويمكن أن تكون المشاركة والحذف في القائمة."
