    part: retest
    value:
      en: "Re-test, contextual menus (NN/g): menus aren't for actions people rely on frequently. Yasmin adds songs to playlists many times a day, so that action stays visible on each song."
      ar: "إعادة اختبار، قوائم السياق (NN/g): القوائم ليست للإجراءات التي يعتمد عليها الناس كثيرًا. وياسمين تضيف أغاني إلى قوائمها مرات كثيرة في اليوم، فيبقى هذا الإجراء ظاهرًا في كل أغنية."
    ref: { url: "https://www.nngroup.com/articles/contextual-menus-guidelines/", quote: "Contextual menus are not appropriate for actions users rely on frequently." }
    scenario:
      en: "Yasmin uses a music app. She adds songs to her playlists many times a day. Sharing a song or viewing its credits is rare."
      ar: "تستخدم ياسمين تطبيق موسيقى. وتضيف أغاني إلى قوائم تشغيلها مرات كثيرة في اليوم. أما مشاركة أغنية أو عرض بياناتها فنادر."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: everything in ⋯", ar: "النسخة A: كل شيء في ⋯" }
      mock:
        width: 260
        blocks:
          - kind: row
            blocks:
              - { kind: text, weight: bold, text: { en: "Morning song", ar: "أغنية الصباح" } }
              - { kind: iconbtn, text: "⋯" }
          - { kind: meta, text: { en: "Band Nour · 3:42", ar: "فرقة نور · 3:42" }, gap: xs }
          - kind: row
            gap: m
            blocks:
              - { kind: text, weight: bold, text: { en: "Old street", ar: "الشارع القديم" } }
              - { kind: iconbtn, text: "⋯" }
          - { kind: meta, text: { en: "Salma Adel · 4:10", ar: "سلمى عادل · 4:10" }, gap: xs }
    b:
      label: { en: "Version B: \"＋ Add\" on each song; the rest in ⋯", ar: "النسخة B: «＋ أضف» في كل أغنية؛ والباقي في ⋯" }
      mock:
        width: 260
        blocks:
          - kind: row
            blocks:
              - { kind: text, weight: bold, text: { en: "Morning song", ar: "أغنية الصباح" } }
              - { kind: chip, text: { en: "＋ Add", ar: "＋ أضف" } }
              - { kind: iconbtn, text: "⋯" }
          - { kind: meta, text: { en: "Band Nour · 3:42", ar: "فرقة نور · 3:42" }, gap: xs }
          - kind: row
            gap: m
            blocks:
              - { kind: text, weight: bold, text: { en: "Old street", ar: "الشارع القديم" } }
              - { kind: chip, text: { en: "＋ Add", ar: "＋ أضف" } }
              - { kind: iconbtn, text: "⋯" }
          - { kind: meta, text: { en: "Salma Adel · 4:10", ar: "سلمى عادل · 4:10" }, gap: xs }
    answer: b
    misconceptions:
      - id: MC-P14-021
        when: [a]
