  # SK-P14-U02-04: keep frequent actions in sight
  - id: S07
    type: tune
    speaker: mona
    skill: SK-P14-U02-04
    part: retest
    value:
      en: "Re-test, contextual menus (NN/g): display single actions, or limited sets, directly when possible, and use menus for low-priority options. Magdy replies to most emails; printing and blocking are rare."
      ar: "إعادة اختبار، قوائم السياق (NN/g): اعرض الإجراء المفرد، أو المجموعة القليلة، مباشرة حين يمكن، واستخدم القوائم للخيارات قليلة الأهمية. ومجدي يردّ على أغلب الرسائل؛ أما الطباعة والحظر فنادران."
    ref: { url: "https://www.nngroup.com/articles/contextual-menus-guidelines/", quote: "Display single actions (or limited sets of actions) directly in the interface when possible." }
    scenario:
      en: "My team designs an email app. Magdy reads work email in it on his phone. He replies to most messages and forwards some. He prints an email or blocks a sender a few times a year."
      ar: "يصمّم فريقي تطبيقًا للبريد. يقرأ فيه مجدي بريد العمل على هاتفه. ويردّ على أغلب الرسائل ويعيد توجيه بعضها. ويطبع رسالة أو يحظر مُرسلًا مرات قليلة في السنة."
    prompt:
      en: "Try each version of the email screen. Which one should ship?"
      ar: "جرّب كل نسخة من شاشة الرسالة. أيّ نسخة تناسب ما يفعله مجدي أكثر في كل رسالة؟"
    start: all
    options:
      - id: all
        text: { en: "Reply, Forward, Print and Block as four buttons", ar: "«ردّ» و«إعادة توجيه» و«اطبع» و«احظر» في أربعة أزرار" }
        mock:
          app: bareed
          appbar: { title: "", back: true, actions: [ { icon: archive, aria: { en: "Archive", ar: "أرشفة" } }, { icon: trash, aria: { en: "Delete", ar: "حذف" } } ] }
          blocks:
            - { kind: heading, text: { en: "Budget for March", ar: "ميزانية مارس" } }
            - { kind: listitem, avatar: { text: "Hala Samir", art: woman-3 }, text: { en: "Hala", ar: "هالة" }, sub: { en: "to me · 9:12 am", ar: "إليّ · 9:12 ص" }, gap: s }
            - { kind: small, text: { en: "Please check the numbers before Thursday…", ar: "من فضلك راجع الأرقام قبل الخميس…" }, gap: s }
            - kind: row
              gap: l
              blocks:
                - { kind: button, style: outline, icon: arrow-bend-up-left, text: { en: "Reply", ar: "ردّ" } }
                - { kind: button, style: outline, icon: arrow-bend-up-right, text: { en: "Forward", ar: "إعادة توجيه" } }
            - kind: row
              gap: s
              blocks:
                - { kind: button, style: outline, icon: printer, text: { en: "Print", ar: "اطبع" } }
                - { kind: button, style: outline, icon: prohibit, text: { en: "Block", ar: "احظر" } }
      - id: two
        text: { en: "Reply and Forward on screen; Print and Block in ⋯", ar: "«ردّ» و«إعادة توجيه» على الشاشة؛ و«اطبع» و«احظر» في ⋯" }
        mock:
          app: bareed
          appbar: &mbar { title: "", back: true, actions: [ { icon: archive, aria: { en: "Archive", ar: "أرشفة" } }, { icon: dots-three-vertical, aria: { en: "More", ar: "المزيد" } } ] }
          blocks:
            - { kind: heading, text: { en: "Budget for March", ar: "ميزانية مارس" } }
            - { kind: listitem, avatar: { text: "Hala Samir", art: woman-3 }, text: { en: "Hala", ar: "هالة" }, sub: { en: "to me · 9:12 am", ar: "إليّ · 9:12 ص" }, gap: s }
            - { kind: small, text: { en: "Please check the numbers before Thursday…", ar: "من فضلك راجع الأرقام قبل الخميس…" }, gap: s }
            - kind: row
              gap: l
              blocks:
                - { kind: button, style: outline, icon: arrow-bend-up-left, text: { en: "Reply", ar: "ردّ" } }
                - { kind: button, style: outline, icon: arrow-bend-up-right, text: { en: "Forward", ar: "إعادة توجيه" } }
      - id: menu
        text: { en: "All four in ⋯", ar: "الأربعة في ⋯" }
        mock:
          app: bareed
          appbar: *mbar
          blocks:
            - { kind: heading, text: { en: "Budget for March", ar: "ميزانية مارس" } }
            - { kind: listitem, avatar: { text: "Hala Samir", art: woman-3 }, text: { en: "Hala", ar: "هالة" }, sub: { en: "to me · 9:12 am", ar: "إليّ · 9:12 ص" }, gap: s }
            - { kind: small, text: { en: "Please check the numbers before Thursday…", ar: "من فضلك راجع الأرقام قبل الخميس…" }, gap: s }
    answer: [two]
    misconceptions:
      - id: MC-P14-022
        when: [all]
        feedback:
          en: "Print and Block are used a few times a year, yet they take the same room as Reply. The screen is busier for every email."
          ar: "«اطبع» و«احظر» يُستخدمان مرات قليلة في السنة، ومع ذلك يأخذان مساحة «ردّ» نفسها. فتصبح الشاشة أكثر ازدحامًا في كل رسالة."
      - id: MC-P14-021
        when: [menu]
        feedback:
          en: "Magdy replies to most emails, so he'd open ⋯ for almost every one. Hidden actions get found and used less."
          ar: "مجدي يردّ على أغلب الرسائل، فسيفتح ⋯ في كل رسالة تقريبًا. والإجراءات المخفية يجدها الناس ويستخدمونها أقل."
    correct:
      en: "Often used: on screen. Rare: in ⋯."
      ar: "المتكرّر: على الشاشة. والنادر: في ⋯."
    explain:
      en: "Reply and Forward are one tap away on every email. Print and Block wait in ⋯ for the few times a year Magdy needs them."
      ar: "«ردّ» و«إعادة توجيه» بضغطة واحدة في كل رسالة. و«اطبع» و«احظر» ينتظران في ⋯ للمرات القليلة في السنة التي يحتاجهما فيها مجدي."

  - id: S08
    type: compare
    speaker: sara
    skill: SK-P14-U02-04
    part: retest
    value:
