              - { kind: button, icon: paper-plane-right, text: { en: "Send to 900 customers", ar: "أرسل إلى 900 عميل" } }
    b:
      label: { en: "Version B: all three filled", ar: "النسخة B: الثلاثة ممتلئة" }
      mock:
