id: P14-U05-L03
mode: lesson
minutes: 8
title:
  en: "Rules up front, errors people can fix"
  ar: "الشروط من البداية، وأخطاء يستطيع الناس إصلاحها"
sources:
  - title: { en: "Website Forms Usability: Top 10 Recommendations (NN/g)", ar: "سهولة استخدام النماذج في المواقع: أهم 10 توصيات (NN/g)" }
    url: "https://www.nngroup.com/articles/web-form-design/"
  - title: { en: "Error-Message Guidelines for Forms (NN/g)", ar: "إرشادات رسائل الخطأ في النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/errors-forms-design-guidelines/"
review_labels:
  MC-P14-050: { en: "State format rules before people type", ar: "اذكر شروط الإدخال قبل أن يكتب الناس" }
  MC-P14-051: { en: "Say exactly what went wrong, next to the field", ar: "قل بالضبط ما الخطأ، بجانب الحقل" }
  MC-P14-052: { en: "Signal errors with more than colour", ar: "وضّح الخطأ بأكثر من اللون" }
  MC-P14-053: { en: "Keep what people typed when there's an error", ar: "احتفظ بما كتبه الناس عند حدوث خطأ" }
  MC-P14-054: { en: "Reset and Clear buttons wipe work by accident", ar: "زر Reset أو Clear يمسح العمل بالخطأ" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Ghada's bus-ticket app", ar: "تطبيق تذاكر الحافلات لغادة" }
    body:
      en: "Ghada designs the sign-up form of an app for booking intercity bus tickets. In testing, many people fail the first try: the password is rejected, a red message appears at the top of the screen, and some of them press \"Clear\" by mistake while reaching for \"Create account\".\n\nHer job: make every rule visible before people type, and every error easy to fix."
      ar: "تصمّم غادة نموذج التسجيل في تطبيق لحجز تذاكر الحافلات بين المدن. وفي الاختبار، يفشل كثيرون في المحاولة الأولى: تُرفض كلمة المرور، وتظهر رسالة حمراء أعلى الشاشة، ويضغط بعضهم «امسح» بالخطأ وهم يحاولون الوصول إلى «أنشئ الحساب».\n\nمهمتها: أن تجعل كل شرط ظاهرًا قبل أن يكتب الناس، وكل خطأ سهل الإصلاح."
    mock:
      width: 300
      blocks:
        - { kind: banner, tone: bad, text: { en: "There are errors in the form.", ar: "توجد أخطاء في النموذج." } }
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "", gap: m }
        - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, text: "", tone: bad }
        - kind: row
          gap: m
          blocks:
            - { kind: button, text: { en: "Clear", ar: "امسح" } }
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" } }

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U05-04
    rules: [R12]
    value:
      en: "Try first. Web forms (NN/g): if a field requires a specific format or type of input, state the exact instructions. Don't make users guess your obscure password requirements."
      ar: "جرّب أولًا. النماذج في المواقع (NN/g): إن كان الحقل يحتاج إلى شكل معيّن أو نوع معيّن من الإدخال، فاذكر التعليمات بالضبط. ولا تجعل الناس يخمّنون شروط كلمة المرور الغامضة."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "If a field requires a specific format or type of input, state the exact instructions." }
    prompt:
      en: "The password needs at least 8 characters, including a number. Try each version. Which one should ship?"
      ar: "تحتاج كلمة المرور إلى 8 أحرف على الأقل، منها رقم. جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: after
    options:
      - id: after
        text: { en: "Show the rules only after a failed try", ar: "اعرض الشروط فقط بعد محاولة فاشلة" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Create your account", ar: "أنشئ حسابك" } }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "0122 334 5566", filled: true, gap: s }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, text: "" }
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" }, gap: m }
      - id: icon
        text: { en: "Put the rules behind an ⓘ icon next to the label", ar: "ضع الشروط خلف رمز ⓘ بجانب اسم الحقل" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Create your account", ar: "أنشئ حسابك" } }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "0122 334 5566", filled: true, gap: s }
            - { kind: field, label: { en: "Password ⓘ", ar: "كلمة المرور ⓘ" }, text: "" }
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" }, gap: m }
      - id: shown
        text: { en: "Show the rules under the label, before typing", ar: "اعرض الشروط تحت اسم الحقل، قبل الكتابة" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Create your account", ar: "أنشئ حسابك" } }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "0122 334 5566", filled: true, gap: s }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, hint: { en: "At least 8 characters, including a number", ar: "8 أحرف على الأقل، منها رقم" }, hintFirst: true, text: "" }
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" }, gap: m }
    answer: [shown]
    misconceptions:
      - id: MC-P14-050
        when: [after]
        feedback:
          en: "People only learn the rules by failing. They type a password, get rejected, then have to invent and remember a new one. One line of text up front prevents all of that."
          ar: "لا يعرف الناس الشروط إلا بعد أن يفشلوا. يكتبون كلمة مرور، فتُرفض، ثم عليهم أن يبتكروا كلمة جديدة ويتذكروها. وسطر واحد من البداية يمنع كل ذلك."
      - id: MC-P14-050
        when: [icon]
        feedback:
          en: "Most people won't tap a small icon before typing, so they still find the rules by failing. A rule everyone must follow belongs in plain view."
          ar: "أغلب الناس لن يضغطوا على رمز صغير قبل الكتابة، فما زالوا يعرفون الشروط بعد الفشل. والشرط الذي يجب أن يتبعه الجميع مكانه ظاهر أمام العين."
    hints:
      - en: "When do people need to know the rules: before they type, or after?"
        ar: "متى يحتاج الناس إلى معرفة الشروط: قبل الكتابة أم بعدها؟"
    correct:
      en: "The rules in view, before typing."
      ar: "الشروط ظاهرة، قبل الكتابة."
    explain:
      en: "The hint sits between the label and the box, so people read it on the way in and create a valid password on the first try."
      ar: "التلميح موجود بين اسم الحقل والخانة، فيقرؤه الناس قبل أن يكتبوا، ويختارون كلمة مرور صحيحة من أول محاولة."

  - id: S03
    type: card
    part: concept
    icons: [ok, eye, layers, list]
    title: { en: "Rules, errors and exits", ar: "الشروط والأخطاء وطرق الخروج" }
    body:
      en: "Errors will happen. A good form prevents the ones it can and makes the rest quick to fix.\n\n- **State the rules up front:** password rules, formats and limits go next to the field, before people type.\n- **No Reset or Clear:** one wrong tap wipes everything. If you need Cancel, make it much quieter than the main button.\n- **Clear errors:** put a specific message right next to the field, saying what went wrong and how to fix it. Signal it with more than colour: a red border plus an icon and words.\n- **Keep their input:** never empty the fields people already filled. This is the heuristic \"help users recognize, diagnose and recover from errors\" in practice."
      ar: "الأخطاء ستحدث. والنموذج الجيد يمنع ما يستطيع منعه منها، ويجعل إصلاح الباقي سريعًا.\n\n- **اذكر الشروط من البداية:** شروط كلمة المرور، وشكل الإدخال، والحدود، توضع بجانب الحقل قبل أن يكتب الناس.\n- **لا Reset ولا Clear:** ضغطة واحدة خطأ تمسح كل شيء. وإن احتجت إلى Cancel، فاجعله أهدأ بكثير من الزر الرئيسي.\n- **أخطاء واضحة:** ضع رسالة محددة بجانب الحقل مباشرة، تقول ما الخطأ وكيف يُصلح. ووضّحه بأكثر من اللون: إطار أحمر مع رمز وكلمات.\n- **احتفظ بما كتبوه:** لا تُفرغ أبدًا الحقول التي ملأها الناس. وهذا تطبيق عملي للـ Heuristic «ساعد المستخدمين على التعرف على الأخطاء وفهمها والتعافي منها»."

  - id: S04
    type: compare
    part: guided
    skill: SK-P14-U05-05
    rules: [R06]
    value:
      en: "Error messages in forms (NN/g): keeping error messages next to the fields in error minimizes working-memory load. People see the problem and the fix in the same place."
      ar: "رسائل الخطأ في النماذج (NN/g): وضع رسائل الخطأ بجانب الحقول التي بها الخطأ يقلّل الضغط على الذاكرة العاملة. فيرى الناس المشكلة وطريقة إصلاحها في المكان نفسه."
    ref: { url: "https://www.nngroup.com/articles/errors-forms-design-guidelines/", quote: "Keeping error messages next to the fields in error minimizes working-memory load" }
    scenario:
      en: "When booking a seat, a passenger typed a 10-digit mobile number and left the ID number empty. The form must say so."
      ar: "عند حجز مقعد، كتب أحد الركاب رقم موبايل من 10 أرقام وترك رقم البطاقة فارغًا. ويجب أن يوضّح النموذج ذلك."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: one message at the top", ar: "النسخة A: رسالة واحدة في الأعلى" }
      mock:
        width: 300
        blocks:
          - { kind: banner, tone: bad, text: { en: "2 fields need attention. Please check your details.", ar: "يوجد حقلان يحتاجان إلى انتباه. من فضلك راجع بياناتك." } }
          - { kind: field, label: { en: "Passenger name", ar: "اسم الراكب" }, text: { en: "Karim Lotfy", ar: "كريم لطفي" }, filled: true, gap: m }
          - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "0122 334 556", filled: true }
          - { kind: field, label: { en: "National ID number", ar: "الرقم القومي" }, text: "" }
          - { kind: button, text: { en: "Book seat", ar: "احجز المقعد" }, gap: m }
    b:
      label: { en: "Version B: each message on its field", ar: "النسخة B: كل رسالة على حقلها" }
      mock:
        width: 300
        blocks:
          - { kind: field, label: { en: "Passenger name", ar: "اسم الراكب" }, text: { en: "Karim Lotfy", ar: "كريم لطفي" }, filled: true }
          - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "0122 334 556", filled: true, tone: bad, error: { en: "⚠ Enter all 11 digits, starting with 01.", ar: "⚠ اكتب الأرقام الـ 11 كلها، بدءًا بـ 01." } }
          - { kind: field, label: { en: "National ID number", ar: "الرقم القومي" }, text: "", tone: bad, error: { en: "⚠ Enter the 14-digit number on your ID card.", ar: "⚠ اكتب الرقم المكوّن من 14 رقمًا الموجود على بطاقتك." } }
          - { kind: button, text: { en: "Book seat", ar: "احجز المقعد" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-051
        when: [a]
        feedback:
          en: "The banner says something is wrong, but not what or where. The passenger must hunt through the fields, guess the problem, and remember the message while they fix it."
          ar: "الرسالة في الأعلى تقول إن هناك خطأ، لكنها لا تقول ما هو ولا أين. فيضطر الراكب إلى البحث في الحقول، وتخمين المشكلة، وتذكّر الرسالة أثناء الإصلاح."
    correct:
      en: "B: the problem and the fix, on the field."
      ar: "B: المشكلة وطريقة إصلاحها، على الحقل."
    explain:
      en: "Each message names the problem and how to fix it, right where the passenger will type. Nothing has to be found or remembered."
      ar: "كل رسالة تذكر المشكلة وطريقة إصلاحها، في المكان نفسه الذي سيكتب فيه الراكب. ولا يحتاج إلى البحث عن شيء أو تذكّره."

  - id: S05
    type: compare
    part: contrast
    skill: SK-P14-U05-05
    rules: [R11]
    confidence: true
    value:
      en: "Web forms (NN/g): errors should be signaled through a variety of cues, not solely through color. People who can't see red, or who just glance quickly, miss a red border on its own."
      ar: "النماذج في المواقع (NN/g): يجب توضيح الأخطاء بأكثر من إشارة، لا باللون وحده. فمن لا يرى اللون الأحمر، أو من ينظر بسرعة، لا يلاحظ الإطار الأحمر وحده."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Errors should be signaled through a variety of cues, not solely through color" }
    scenario:
      en: "Both versions mark the same wrong email with a red border. Here is how they look to a passenger who can't see red, shown in grey."
      ar: "كلتا النسختين تميّز البريد الإلكتروني الخطأ نفسه بإطار أحمر. وهذا شكلهما لراكب لا يرى اللون الأحمر، معروضتين بالرمادي."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: red border only", ar: "النسخة A: إطار أحمر فقط" }
      mock:
        width: 280
        gray: true
        blocks:
          - { kind: field, label: { en: "Passenger name", ar: "اسم الراكب" }, text: { en: "Karim Lotfy", ar: "كريم لطفي" }, filled: true }
          - { kind: field, label: { en: "Email for the ticket", ar: "البريد الإلكتروني للتذكرة" }, text: "karim.lotfy@gmail", filled: true, tone: bad }
          - { kind: button, text: { en: "Pay and get ticket", ar: "ادفع واحصل على التذكرة" }, gap: m }
    b:
      label: { en: "Version B: red border, icon and message", ar: "النسخة B: إطار أحمر ورمز ورسالة" }
      mock:
        width: 280
        gray: true
        blocks:
          - { kind: field, label: { en: "Passenger name", ar: "اسم الراكب" }, text: { en: "Karim Lotfy", ar: "كريم لطفي" }, filled: true }
          - { kind: field, label: { en: "Email for the ticket", ar: "البريد الإلكتروني للتذكرة" }, text: "karim.lotfy@gmail", filled: true, tone: bad, error: { en: "⚠ Add the ending, such as .com", ar: "⚠ أكمل نهاية العنوان، مثل .com" } }
          - { kind: button, text: { en: "Pay and get ticket", ar: "ادفع واحصل على التذكرة" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-052
        when: [a]
        feedback:
          en: "In grey, the red border looks like any other field. This passenger presses Pay again and again with no idea why nothing happens."
          ar: "بالرمادي، يبدو الإطار الأحمر مثل أي حقل آخر. فيضغط هذا الراكب «ادفع» مرة بعد مرة دون أن يعرف لماذا لا يحدث شيء."
    correct:
      en: "B: colour plus an icon and words."
      ar: "B: اللون مع رمز وكلمات."
    explain:
      en: "The deciding factor is what's left without colour. The icon and the message still say \"this field, this problem\", so everyone can find and fix it."
      ar: "العامل الحاسم هو ما يبقى بدون اللون. فالرمز والرسالة ما زالا يقولان «هذا الحقل، وهذه المشكلة»، فيستطيع الجميع إيجاده وإصلاحه."

  - id: S06
    type: tune
    part: guided
    skill: SK-P14-U05-05
    rules: [R06]
    value:
      en: "Web forms (NN/g): erroneous input should be preserved so users can correct it, and accompanied by a specific explanation of the problem."
      ar: "النماذج في المواقع (NN/g): يجب الاحتفاظ بالإدخال الخطأ لكي يصلحه الناس، مع شرح محدد للمشكلة."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Erroneous input should be preserved so users can correct it, and accompanied by a specific explanation of the problem." }
    scenario:
      en: "A passenger filled in five fields for a group booking and typed one wrong date of birth. The form checks everything when they press Book."
      ar: "ملأ أحد الركاب خمسة حقول لحجز جماعي، وكتب تاريخ ميلاد واحدًا خطأ. والنموذج يراجع كل شيء حين يضغط «احجز»."
    prompt:
      en: "Try each version of what happens after pressing Book. Which one should ship?"
      ar: "جرّب كل نسخة لما يحدث بعد الضغط على «احجز». أيّها يجب أن تُطلق؟"
    start: empty
    options:
      - id: empty
        text: { en: "Empty the form and explain the error at the top", ar: "يُفرغ النموذج ويشرح الخطأ في الأعلى" }
        mock:
          width: 300
          blocks:
            - { kind: banner, tone: bad, text: { en: "Date of birth must be DD/MM/YYYY. Please fill in the form again.", ar: "يجب أن يكون تاريخ الميلاد بالشكل يوم/شهر/سنة. من فضلك املأ النموذج مرة أخرى." } }
            - { kind: field, label: { en: "Passenger 2 name", ar: "اسم الراكب 2" }, text: "", gap: m }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "" }
            - { kind: field, label: { en: "National ID number", ar: "الرقم القومي" }, text: "" }
            - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }
      - id: vague
        text: { en: "Keep the answers, mark the field \"Invalid input\"", ar: "يحتفظ بالإجابات، ويكتب على الحقل «إدخال غير صالح»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Passenger 2 name", ar: "اسم الراكب 2" }, text: { en: "Salma Lotfy", ar: "سلمى لطفي" }, filled: true }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "14/23/2009", filled: true, tone: bad, error: { en: "⚠ Invalid input", ar: "⚠ إدخال غير صالح" } }
            - { kind: field, label: { en: "National ID number", ar: "الرقم القومي" }, text: "30909140100456", filled: true }
            - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }
      - id: keep
        text: { en: "Keep the answers, say exactly what to fix on the field", ar: "يحتفظ بالإجابات، ويقول على الحقل بالضبط ما يجب إصلاحه" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Passenger 2 name", ar: "اسم الراكب 2" }, text: { en: "Salma Lotfy", ar: "سلمى لطفي" }, filled: true }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "14/23/2009", filled: true, tone: bad, error: { en: "⚠ There's no month 23. Use day/month/year, such as 23/09/2009.", ar: "⚠ لا يوجد شهر رقم 23. اكتب يوم/شهر/سنة، مثل 23/09/2009." } }
            - { kind: field, label: { en: "National ID number", ar: "الرقم القومي" }, text: "30909140100456", filled: true }
            - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }
    answer: [keep]
    misconceptions:
      - id: MC-P14-053
        when: [empty]
        feedback:
          en: "One wrong date costs the passenger all five fields. Many will give up rather than type everything again, and the ones who stay may make new mistakes."
          ar: "تاريخ واحد خطأ يكلّف الراكب الحقول الخمسة كلها. وكثيرون سيتركون الحجز بدل أن يكتبوا كل شيء من جديد، ومن يبقى قد يقع في أخطاء جديدة."
      - id: MC-P14-051
        when: [vague]
        feedback:
          en: "\"Invalid input\" points to the field but not the problem. The passenger may check the year, retype the same date, and fail again."
          ar: "«إدخال غير صالح» تشير إلى الحقل لكن لا تشرح المشكلة. فقد يراجع الراكب السنة، ثم يكتب التاريخ نفسه مرة أخرى، ويفشل من جديد."
    hints:
      - en: "What does the passenger need to fix one date quickly?"
        ar: "ماذا يحتاج الراكب لكي يصلح تاريخًا واحدًا بسرعة؟"
    correct:
      en: "Keep the answers and explain the fix."
      ar: "احتفظ بالإجابات واشرح طريقة الإصلاح."
    explain:
      en: "Everything typed stays, and the message names the exact problem with a correct example. The passenger changes two digits and books."
      ar: "كل ما كُتب يبقى، والرسالة تذكر المشكلة بالضبط مع مثال صحيح. فيغيّر الراكب رقمين ويكمل الحجز."

  - id: S07
    type: choose
    part: independent
    skill: SK-P14-U05-05
    rules: [R14]
    value:
      en: "Web forms (NN/g): the risk of accidental deletion outweighs the unlikely need to start over on a web form. If you need Cancel, make sure it has significantly less visual prominence than Submit."
      ar: "النماذج في المواقع (NN/g): خطر المسح بالخطأ أكبر من الحاجة النادرة إلى البدء من جديد في نموذج على الإنترنت. وإن احتجت إلى Cancel، فتأكد أنه أقل ظهورًا بكثير من زر الإرسال."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "The risk of accidental deletion outweighs the unlikely need to ‘start over’ on a web form." }
    scenario:
      en: "Mostafa designs a job application form for a hotel group: twelve fields and a CV upload. At the bottom are two buttons of the same size and style: \"Reset form\" and \"Submit application\". Applicants may also want to leave without sending."
      ar: "يصمّم مصطفى نموذج التقديم على وظيفة لمجموعة فنادق: اثنا عشر حقلًا ورفع السيرة الذاتية. وفي الأسفل زرّان بالحجم والشكل نفسيهما: «امسح النموذج» و«أرسل الطلب». وقد يريد المتقدّمون أيضًا الخروج دون إرسال."
    prompt:
      en: "What should Mostafa put at the bottom of the form?"
      ar: "ماذا يضع مصطفى أسفل النموذج؟"
    options:
      - { id: red, text: { en: "Keep both, but make \"Reset form\" red so people notice it", ar: "يبقي الزرّين، لكن يجعل «امسح النموذج» أحمر لكي يلاحظه الناس" } }
      - { id: same, text: { en: "Keep both buttons as they are; people can choose", ar: "يبقي الزرّين كما هما؛ والناس يختارون" } }
      - { id: cancel, text: { en: "Remove Reset; keep \"Submit\" as the main button and a quiet \"Cancel\" link", ar: "يحذف زر المسح؛ ويبقي «أرسل» زرًا رئيسيًا مع رابط «إلغاء» هادئ" } }
    answer: [cancel]
    misconceptions:
      - id: MC-P14-054
        when: [red, same]
        feedback:
          en: "Almost nobody wants to erase twelve answers and a CV. A same-size or louder Reset button just waits for the tap that wipes twenty minutes of work."
          ar: "لا أحد تقريبًا يريد أن يمسح اثنتي عشرة إجابة وسيرة ذاتية. وزر المسح بالحجم نفسه أو بلون أقوى ينتظر فقط الضغطة التي تمسح عشرين دقيقة من العمل."
    correct:
      en: "No Reset; one clear Submit, a quiet Cancel."
      ar: "لا زر مسح؛ زر إرسال واضح، وإلغاء هادئ."
    explain:
      en: "Submit is the one action that matters, so it gets the strong button. Cancel covers leaving without sending, and its quiet style makes a wrong tap unlikely."
      ar: "الإرسال هو الإجراء المهم الوحيد، فيأخذ الزر القوي. والإلغاء يغطي الخروج دون إرسال، وشكله الهادئ يجعل الضغط عليه بالخطأ أمرًا نادرًا."

  - id: S08
    type: card
    part: recap
    icons: [ok, eye, layers]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Rules up front**, next to the field, before people type.\n- **Specific errors on the field**, with an icon and words, not colour alone.\n- **Keep what people typed**, and leave out Reset; Cancel stays quiet.\n\nNext: the skill check for this unit."
      ar: "- **الشروط من البداية**، بجانب الحقل، قبل أن يكتب الناس.\n- **أخطاء محددة على الحقل**، مع رمز وكلمات، لا باللون وحده.\n- **احتفظ بما كتبه الناس**، ولا تضع زر Reset؛ والإلغاء يبقى هادئًا.\n\nالتالي: اختبار المهارة لهذه الوحدة."
