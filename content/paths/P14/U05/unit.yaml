id: P14-U05
free: false
title:
  en: "Forms people finish"
  ar: "نماذج يكملها الناس"
skill:
  en: "Design text fields and forms that ask only what's needed, read in one clear path, keep their labels and rules in view, and make errors easy to fix."
  ar: "صمّم الـ Text fields والنماذج (Forms) بحيث تطلب ما تحتاجه فقط، وتُقرأ في اتجاه واحد واضح، وتبقى أسماء الحقول وشروطها ظاهرة، ويسهل فيها إصلاح الأخطاء."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P14-U05-01
    title: { en: "Ask only for what you need", ar: "اطلب ما تحتاجه فقط" }
    can_do: { en: "Cut every field the task doesn't need now, or that the product can get another way or later.", ar: "احذف كل حقل لا تحتاجه المهمة الآن، أو يمكن للمنتج أن يحصل عليه بطريقة أخرى أو في وقت لاحق." }
  - id: SK-P14-U05-02
    title: { en: "Lay fields out in one clear path", ar: "رتّب الحقول في اتجاه واحد واضح" }
    can_do: { en: "Use one column, keep each label next to its own field, and order fields the way people find the information.", ar: "استخدم عمودًا واحدًا، وضع اسم كل حقل بجانب حقله، ورتّب الحقول بالترتيب الذي يجد به الناس المعلومات." }
  - id: SK-P14-U05-03
    title: { en: "Keep labels in view", ar: "اجعل أسماء الحقول ظاهرة دائمًا" }
    can_do: { en: "Put a visible label outside each field instead of placeholder text that disappears when people type.", ar: "ضع اسمًا ظاهرًا خارج كل حقل، بدل نص Placeholder يختفي حين يبدأ الناس الكتابة." }
  - id: SK-P14-U05-04
    title: { en: "Say what each field needs", ar: "وضّح ما يحتاجه كل حقل" }
    can_do: { en: "Mark required and optional fields, state format rules before people type, and match the control to the answer.", ar: "ميّز الحقول المطلوبة والاختيارية، واذكر شروط الإدخال قبل أن يكتب الناس، واختر العنصر المناسب للإجابة." }
  - id: SK-P14-U05-05
    title: { en: "Make errors and exits safe", ar: "اجعل الأخطاء والخروج آمنين" }
    can_do: { en: "Show specific errors next to the field with more than colour, keep what people typed, and leave out Reset buttons.", ar: "اعرض رسالة خطأ محددة بجانب الحقل، بأكثر من اللون، واحتفظ بما كتبه الناس، ولا تضع زر Reset." }
