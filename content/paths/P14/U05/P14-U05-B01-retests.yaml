id: P14-U05-B01
mode: bank
title:
  en: "Re-tests: forms people finish"
  ar: "إعادة اختبار: نماذج يكملها الناس"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Website Forms Usability: Top 10 Recommendations (NN/g)", ar: "سهولة استخدام النماذج في المواقع: أهم 10 توصيات (NN/g)" }
    url: "https://www.nngroup.com/articles/web-form-design/"
  - title: { en: "Placeholders in Form Fields Are Harmful (NN/g)", ar: "نص الـ Placeholder داخل الحقول ضار (NN/g)" }
    url: "https://www.nngroup.com/articles/form-design-placeholders/"
  - title: { en: "Marking Required Fields in Forms (NN/g)", ar: "تمييز الحقول المطلوبة في النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/required-fields/"
  - title: { en: "Error-Message Guidelines for Forms (NN/g)", ar: "إرشادات رسائل الخطأ في النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/errors-forms-design-guidelines/"
steps:
  # SK-P14-U05-01: ask only for what you need
  - id: S01
    type: tune
    skill: SK-P14-U05-01
    part: retest
    value:
      en: "Re-test, web forms (NN/g): every time you cut a field or question from a form, you increase its conversion rate. A newsletter only needs somewhere to send it."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): كلما حذفت حقلًا أو سؤالًا من النموذج، زاد عدد من يكملونه. والنشرة البريدية تحتاج فقط إلى مكان ترسل إليه."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Every time you cut a field or question from a form, you increase its conversion rate" }
    scenario:
      en: "Marwa adds a newsletter sign-up to the bottom of a recipe website. The newsletter is one weekly email with new recipes."
      ar: "تضيف مروة نموذج اشتراك في النشرة البريدية أسفل موقع وصفات طبخ. والنشرة رسالة أسبوعية واحدة بالوصفات الجديدة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: four
    options:
      - id: four
        text: { en: "Name, email, mobile and birthday", ar: "الاسم والبريد والموبايل وتاريخ الميلاد" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "New recipes every Friday", ar: "وصفات جديدة كل جمعة" } }
            - { kind: field, label: { en: "Name", ar: "الاسم" }, text: "", gap: s }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "" }
            - { kind: field, label: { en: "Mobile", ar: "الموبايل" }, text: "" }
            - { kind: field, label: { en: "Birthday", ar: "تاريخ الميلاد" }, text: "" }
            - { kind: button, text: { en: "Subscribe", ar: "اشترك" }, gap: m }
      - id: two
        text: { en: "Name and email", ar: "الاسم والبريد" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "New recipes every Friday", ar: "وصفات جديدة كل جمعة" } }
            - { kind: field, label: { en: "Name", ar: "الاسم" }, text: "", gap: s }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "" }
            - { kind: button, text: { en: "Subscribe", ar: "اشترك" }, gap: m }
      - id: one
        text: { en: "Email only", ar: "البريد فقط" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "New recipes every Friday", ar: "وصفات جديدة كل جمعة" } }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
            - { kind: button, text: { en: "Subscribe", ar: "اشترك" }, gap: m }
    answer: [one]
    also_ok:
      - answer: [two]
        feedback:
          en: "Two fields are still short, and a name lets the email greet people. But the newsletter works without it, so the single field gets the most sign-ups."
          ar: "حقلان ما زالا قصيرين، والاسم يسمح للرسالة بتحية الناس. لكن النشرة تعمل بدونه، فالحقل الواحد يجلب أكبر عدد من المشتركين."
    misconceptions:
      - id: MC-P14-042
        when: [four]
        feedback:
          en: "A weekly email never uses a mobile number or a birthday. Four fields turn a two-second sign-up into a form many visitors skip."
          ar: "الرسالة الأسبوعية لا تستخدم رقم الموبايل ولا تاريخ الميلاد. وأربعة حقول تحوّل اشتراكًا مدته ثانيتان إلى نموذج يتجاهله كثير من الزوار."
    correct:
      en: "Email only: that's all a newsletter needs."
      ar: "البريد فقط: هذا كل ما تحتاجه النشرة."
    explain:
      en: "One field and one button. Visitors subscribe without stopping to think."
      ar: "حقل واحد وزر واحد. فيشترك الزوار دون أن يتوقفوا للتفكير."

  - id: S02
    type: choose
    skill: SK-P14-U05-01
    part: retest
    value:
      en: "Re-test, web forms (NN/g): keep it short; cut any question the system can answer itself. The app already knows which account is signed in."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): اجعله قصيرًا؛ واحذف أي سؤال يستطيع النظام أن يجيب عنه بنفسه. فالتطبيق يعرف أصلًا الحساب المسجّل دخوله."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Every time you cut a field or question from a form, you increase its conversion rate" }
    scenario:
      en: "Ehab designs \"Report a problem\" inside a food delivery app. People are signed in, and the report opens from the order itself. The draft asks for: name, email, order number, and \"What went wrong?\"."
      ar: "يصمّم إيهاب شاشة «أبلغ عن مشكلة» داخل تطبيق لتوصيل الطعام. والناس مسجّلون دخولهم، والبلاغ يُفتح من الطلب نفسه. والمسودة تطلب: الاسم، والبريد الإلكتروني، ورقم الطلب، و«ما المشكلة؟»."
    prompt:
      en: "Which fields should the report keep?"
      ar: "ما الحقول التي يجب أن يُبقيها البلاغ؟"
    options:
      - { id: all, text: { en: "All four, so support has everything", ar: "الأربعة كلها، لكي يجد فريق الدعم كل شيء" } }
      - { id: order, text: { en: "Order number and \"What went wrong?\"", ar: "رقم الطلب و«ما المشكلة؟»" } }
      - { id: what, text: { en: "Only \"What went wrong?\"", ar: "«ما المشكلة؟» فقط" } }
    answer: [what]
    misconceptions:
      - id: MC-P14-042
        when: [all, order]
        feedback:
          en: "The app knows who is signed in and which order the report came from. Asking people to type them is extra work, and a typo could attach the report to the wrong order."
          ar: "التطبيق يعرف من المسجّل دخوله ومن أي طلب جاء البلاغ. وطلب كتابتها مجهود زائد، وقد يربط خطأ في الكتابة البلاغَ بطلب خطأ."
    correct:
      en: "Only what people alone can tell you."
      ar: "فقط ما لا يعرفه غير الناس أنفسهم."
    explain:
      en: "The app fills in name, email and order number behind the scenes. People describe the problem and send."
      ar: "التطبيق يضيف الاسم والبريد ورقم الطلب تلقائيًا. والناس يصفون المشكلة ويرسلون."

  # SK-P14-U05-02: lay fields out in one clear path
  - id: S03
    type: compare
    skill: SK-P14-U05-02
    part: retest
    value:
      en: "Re-test, web forms (NN/g): labels should be close to the fields they describe. Avoid ambiguous spacing, where labels are equidistant from multiple fields."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): يجب أن يكون اسم الحقل قريبًا من الحقل الذي يصفه. وتجنّب المسافات المبهمة، حين يكون الاسم على المسافة نفسها من أكثر من حقل."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Labels should be close to the fields they describe" }
    scenario:
      en: "Doaa designs the gift message step of a flower shop: the recipient's name and the card message."
      ar: "تصمّم دعاء خطوة رسالة الهدية في متجر زهور: اسم المستلم، ونص البطاقة."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: each label on its field", ar: "النسخة A: كل اسم فوق حقله" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Gift card", ar: "بطاقة الهدية" } }
          - { kind: field, label: { en: "To", ar: "إلى" }, text: "", gap: m }
          - { kind: field, label: { en: "Card message", ar: "نص البطاقة" }, text: "", gap: l }
          - { kind: button, text: { en: "Add to order", ar: "أضف إلى الطلب" }, gap: l }
    b:
      label: { en: "Version B: even spacing", ar: "النسخة B: مسافات متساوية" }
      mock:
        width: 260
        blocks:
          - { kind: heading, text: { en: "Gift card", ar: "بطاقة الهدية" } }
          - { kind: small, text: { en: "To", ar: "إلى" }, gap: m }
          - { kind: field, text: "", gap: m }
          - { kind: small, text: { en: "Card message", ar: "نص البطاقة" }, gap: m }
          - { kind: field, text: "", gap: m }
          - { kind: button, text: { en: "Add to order", ar: "أضف إلى الطلب" }, gap: l }
    answer: a
    misconceptions:
      - id: MC-P14-044
        when: [b]
        feedback:
          en: "In B, \"Card message\" floats halfway between the two boxes. Some people will type the message under \"To\", and the card arrives addressed to \"Happy birthday!\"."
          ar: "في B، يقع «نص البطاقة» في منتصف المسافة بين الخانتين. وسيكتب بعض الناس الرسالة تحت «إلى»، فتصل البطاقة موجّهة إلى «عيد ميلاد سعيد!»."
    correct:
      en: "A: each label sits on its own field."
      ar: "A: كل اسم فوق حقله."
    explain:
      en: "A tight gap inside each pair and a wider gap between pairs makes it obvious which label belongs to which box."
      ar: "مسافة صغيرة داخل كل زوج، ومسافة أكبر بين الأزواج، تجعل واضحًا أي اسم ينتمي إلى أي خانة."

  - id: S04
    type: order
    skill: SK-P14-U05-02
    part: retest
    onscreen: true
    caption: { en: "Delivery area", ar: "منطقة التوصيل" }
    value:
      en: "Re-test, web forms (NN/g): use logical sequencing. Each choice here narrows the next list, so the fields go from the widest area to the smallest."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): استخدم ترتيبًا منطقيًا. فكل اختيار هنا يحدّد القائمة التالية، لذلك تبدأ الحقول بالمنطقة الأوسع وتنتهي بالأصغر."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Help keyboard users by testing the Tab-key navigation to ensure it follows the correct field sequence." }
    scenario:
      en: "Gamal designs the address step of a furniture store that delivers across the region. The list of cities depends on the governorate, and the list of districts depends on the city."
      ar: "يصمّم جمال خطوة العنوان في متجر أثاث يوصّل في أنحاء المنطقة. وقائمة المدن تعتمد على المحافظة، وقائمة الأحياء تعتمد على المدينة."
    prompt:
      en: "Put the fields in the order people should fill them in."
      ar: "رتّب الحقول بالترتيب الذي يجب أن يملأها به الناس."
    items:
      - { id: district, kind: field, text: { en: "District", ar: "الحي" } }
      - { id: governorate, kind: field, text: { en: "Governorate", ar: "المحافظة" } }
      - { id: city, kind: field, text: { en: "City", ar: "المدينة" } }
    answer: [governorate, city, district]
    misconceptions:
      - id: MC-P14-045
        when: { before: [district, city] }
        feedback:
          en: "The district list can't be filled until the city is known. People would face an empty or huge list, or have to go back."
          ar: "لا يمكن ملء قائمة الأحياء قبل معرفة المدينة. فسيجد الناس قائمة فارغة أو طويلة جدًا، أو يضطرون إلى الرجوع."
      - id: MC-P14-045
        when: { before: [city, governorate] }
        feedback:
          en: "Cities depend on the governorate. Starting with City means scrolling through every city in the region."
          ar: "المدن تعتمد على المحافظة. والبدء بالمدينة يعني التمرير في كل مدن المنطقة."
    correct:
      en: "Governorate, city, then district."
      ar: "المحافظة، ثم المدينة، ثم الحي."
    explain:
      en: "Each answer makes the next list short and relevant, so people move straight down without going back."
      ar: "كل إجابة تجعل القائمة التالية قصيرة ومناسبة، فيتحرك الناس إلى أسفل مباشرة دون رجوع."

  # SK-P14-U05-03: keep labels in view
  - id: S05
    type: choose
    skill: SK-P14-U05-03
    part: retest
    value:
      en: "Re-test, placeholders in form fields (NN/g): the best solution is clear, visible labels placed outside empty form fields. A long, rarely used form needs them most."
      ar: "إعادة اختبار، نص الـ Placeholder داخل الحقول (NN/g): أفضل حل هو أسماء واضحة وظاهرة خارج الحقول الفارغة. والنموذج الطويل الذي نادرًا ما يُستخدم يحتاجها أكثر من غيره."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "the best solution is to have clear, visible labels that are placed outside empty form fields." }
    scenario:
      en: "Reham designs a car-insurance claim form: policy number, accident date, place, other driver's plate number, and a description. People fill it once or twice in their lives, often right after an accident."
      ar: "تصمّم ريهام نموذج مطالبة لتأمين السيارات: رقم الوثيقة، وتاريخ الحادث، ومكانه، ورقم لوحة السيارة الأخرى، ووصف. ويملؤه الناس مرة أو مرتين في حياتهم، غالبًا بعد الحادث مباشرة."
    prompt:
      en: "How should the field names be shown?"
      ar: "كيف يجب أن تظهر أسماء الحقول؟"
    options:
      - { id: inside, text: { en: "Inside each box, disappearing when people type, to keep the screen calm", ar: "داخل كل خانة، وتختفي عند الكتابة، لتبقى الشاشة هادئة" } }
      - { id: above, text: { en: "As labels above each box, always visible", ar: "كأسماء فوق كل خانة، ظاهرة دائمًا" } }
      - { id: first, text: { en: "Labels above the first two fields only; the rest are obvious", ar: "أسماء فوق أول حقلين فقط؛ والباقي واضح" } }
    answer: [above]
    misconceptions:
      - id: MC-P14-046
        when: [inside, first]
        feedback:
          en: "After an accident, people are stressed and switch between documents. Two similar numbers, the policy number and the plate number, look the same once the field name has gone."
          ar: "بعد الحادث، يكون الناس متوترين ويتنقّلون بين الأوراق. ورقمان متشابهان، رقم الوثيقة ورقم اللوحة، يبدوان متماثلين بعد أن يختفي اسم الحقل."
    correct:
      en: "Visible labels above every field."
      ar: "أسماء ظاهرة فوق كل حقل."
    explain:
      en: "Every field keeps its name while people type and check, so nothing depends on memory at a stressful moment."
      ar: "كل حقل يحتفظ باسمه أثناء الكتابة والمراجعة، فلا يعتمد شيء على الذاكرة في لحظة متوترة."

  - id: S06
    type: compare
    skill: SK-P14-U05-03
    part: retest
    value:
      en: "Re-test, placeholders in form fields (NN/g): some users assume the placeholder text is a default value and skip the field completely. Put hints outside the box."
      ar: "إعادة اختبار، نص الـ Placeholder داخل الحقول (NN/g): بعض الناس يظنون أن نص الـ Placeholder قيمة مكتوبة مسبقًا فيتجاوزون الحقل تمامًا. فضع التلميحات خارج الخانة."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "Some users assume the placeholder text is a default value and skip the field completely." }
    scenario:
      en: "Samir designs the profile of a freelancing platform. He wants to show people what a good headline looks like."
      ar: "يصمّم سمير الملف الشخصي في منصة للعمل الحر. ويريد أن يوضّح للناس شكل العنوان المهني الجيد."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: the example inside the field", ar: "النسخة A: المثال داخل الحقل" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Your profile", ar: "ملفك الشخصي" } }
          - { kind: field, label: { en: "Headline", ar: "العنوان المهني" }, text: { en: "Arabic–English translator, legal documents", ar: "مترجم عربي–إنجليزي، مستندات قانونية" }, gap: s }
          - { kind: button, text: { en: "Save", ar: "احفظ" }, gap: m }
    b:
      label: { en: "Version B: the example under the label", ar: "النسخة B: المثال تحت اسم الحقل" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Your profile", ar: "ملفك الشخصي" } }
          - { kind: field, label: { en: "Headline", ar: "العنوان المهني" }, hint: { en: "For example: Arabic–English translator, legal documents", ar: "مثال: مترجم عربي–إنجليزي، مستندات قانونية" }, hintFirst: true, text: "", gap: s }
          - { kind: button, text: { en: "Save", ar: "احفظ" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P14-047
        when: [a]
        feedback:
          en: "The example looks like a headline already written. Some people save it as is, and the platform fills with translators who aren't translators."
          ar: "المثال يبدو كأنه عنوان مكتوب بالفعل. فيحفظه بعض الناس كما هو، وتمتلئ المنصة بمترجمين ليسوا مترجمين."
    correct:
      en: "B: the example outside, the box empty."
      ar: "B: المثال خارج الخانة، والخانة فارغة."
    explain:
      en: "The empty box clearly needs typing, and the example stays visible while people write their own."
      ar: "الخانة الفارغة تقول بوضوح إنها تحتاج إلى كتابة، والمثال يبقى ظاهرًا أثناء كتابة الناس لعنوانهم."

  # SK-P14-U05-04: say what each field needs
  - id: S07
    type: tune
    skill: SK-P14-U05-04
    part: retest
    value:
      en: "Re-test, web forms (NN/g): if a field requires a specific format or type of input, state the exact instructions, before people type."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): إن كان الحقل يحتاج إلى شكل معيّن أو نوع معيّن من الإدخال، فاذكر التعليمات بالضبط، قبل أن يكتب الناس."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "If a field requires a specific format or type of input, state the exact instructions." }
    scenario:
      en: "Abeer designs a university portal. To log in for the first time, students type their student code, which is the letter S followed by 7 digits."
      ar: "تصمّم عبير بوابة جامعية. ولتسجيل الدخول أول مرة، يكتب الطلاب كود الطالب، وهو الحرف S يليه 7 أرقام."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: plain
    options:
      - id: plain
        text: { en: "Just the label \"Student code\"", ar: "اسم الحقل «كود الطالب» فقط" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "First log-in", ar: "أول تسجيل دخول" } }
            - { kind: field, label: { en: "Student code", ar: "كود الطالب" }, text: "", gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: format
        text: { en: "The label plus the exact format under it", ar: "اسم الحقل مع الشكل المطلوب بالضبط تحته" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "First log-in", ar: "أول تسجيل دخول" } }
            - { kind: field, label: { en: "Student code", ar: "كود الطالب" }, hint: { en: "S and 7 digits, as on your ID card, such as S2410357", ar: "حرف S و7 أرقام، كما في بطاقتك، مثل S2410357" }, hintFirst: true, text: "", gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: [format]
    misconceptions:
      - id: MC-P14-050
        when: [plain]
        feedback:
          en: "Students type 2410357 or s-2410357 and get rejected, without knowing why. The code's format is a rule, so say it up front."
          ar: "يكتب الطلاب 2410357 أو s-2410357 فيُرفض الكود، دون أن يعرفوا السبب. وشكل الكود شرط، فاذكره من البداية."
    correct:
      en: "State the exact format before typing."
      ar: "اذكر الشكل المطلوب بالضبط قبل الكتابة."
    explain:
      en: "With the rule and an example in view, students type the code right the first time."
      ar: "مع ظهور الشرط ومثال عليه، يكتب الطلاب الكود صحيحًا من أول مرة."

  - id: S08
    type: tune
    skill: SK-P14-U05-04
    part: retest
    value:
      en: "Re-test, marking required fields (NN/g): for every single field that must be completed, mark it as required. Web forms (NN/g): clearly label the optional ones."
      ar: "إعادة اختبار، تمييز الحقول المطلوبة (NN/g): ميّز كل حقل يجب ملؤه بأنه مطلوب. والنماذج في المواقع (NN/g): اكتب بوضوح أن الحقول الاختيارية اختيارية."
    ref: { url: "https://www.nngroup.com/articles/required-fields/", quote: "Be as explicit and transparent as possible: for every single field that must be completed, mark it as required." }
    scenario:
      en: "Medhat designs a city-marathon registration. Name, mobile and race distance are required; a running club is optional."
      ar: "يصمّم مدحت نموذج التسجيل في ماراثون المدينة. والاسم والموبايل ومسافة السباق مطلوبة؛ أما النادي الرياضي فاختياري."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: optional
    options:
      - id: optional
        text: { en: "Mark only the optional field", ar: "يميّز الحقل الاختياري فقط" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Register for the race", ar: "سجّل في السباق" } }
            - { kind: field, label: { en: "Full name", ar: "الاسم بالكامل" }, text: "", gap: s }
            - { kind: field, label: { en: "Mobile", ar: "الموبايل" }, text: "" }
            - { kind: select, label: { en: "Distance", ar: "المسافة" }, text: { en: "Choose", ar: "اختر" } }
            - { kind: field, label: { en: "Running club (optional)", ar: "النادي الرياضي (اختياري)" }, text: "" }
            - { kind: button, text: { en: "Register", ar: "سجّل" }, gap: m }
      - id: both
        text: { en: "Asterisks on required fields, \"optional\" on the club", ar: "نجوم على الحقول المطلوبة، و«اختياري» على النادي" }
        mock:
          width: 300
          blocks:
            - { kind: heading, text: { en: "Register for the race", ar: "سجّل في السباق" } }
            - { kind: field, label: { en: "Full name *", ar: "الاسم بالكامل *" }, text: "", gap: s }
            - { kind: field, label: { en: "Mobile *", ar: "الموبايل *" }, text: "" }
            - { kind: select, label: { en: "Distance *", ar: "المسافة *" }, text: { en: "Choose", ar: "اختر" } }
            - { kind: field, label: { en: "Running club (optional)", ar: "النادي الرياضي (اختياري)" }, text: "" }
            - { kind: button, text: { en: "Register", ar: "سجّل" }, gap: m }
    answer: [both]
    misconceptions:
      - id: MC-P14-048
        when: [optional]
        feedback:
          en: "People have to work out that unmarked means required. Marking each required field too removes the guesswork."
          ar: "على الناس أن يستنتجوا أن الحقل غير المميّز مطلوب. وتمييز كل حقل مطلوب أيضًا يزيل التخمين."
    correct:
      en: "Mark both kinds."
      ar: "ميّز النوعين."
    explain:
      en: "Every field says plainly whether it must be filled, so runners never stop to wonder."
      ar: "كل حقل يقول بوضوح هل يجب ملؤه، فلا يتوقف المتسابقون ليتساءلوا."

  # SK-P14-U05-05: make errors and exits safe
  - id: S09
    type: compare
    skill: SK-P14-U05-05
    part: retest
    value:
      en: "Re-test, web forms (NN/g): errors should be signaled through a variety of cues, not solely through color."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): يجب توضيح الأخطاء بأكثر من إشارة، لا باللون وحده."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Errors should be signaled through a variety of cues, not solely through color" }
    scenario:
      en: "Nesma designs the sign-up of a cinema app. A customer picked a username that's already taken. Both versions are shown in grey, as someone who can't see red would see them."
      ar: "تصمّم نسمة شاشة التسجيل في تطبيق سينما. واختار أحد العملاء اسم مستخدم مأخوذًا بالفعل. والنسختان معروضتان بالرمادي، كما يراهما من لا يرى اللون الأحمر."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: icon and message", ar: "النسخة A: رمز ورسالة" }
      mock:
        width: 280
        gray: true
        blocks:
          - { kind: field, label: { en: "Username", ar: "اسم المستخدم" }, text: "film_fan", filled: true, tone: bad, error: { en: "⚠ film_fan is taken. Try film_fan22.", ar: "⚠ film_fan مأخوذ. جرّب film_fan22." } }
          - { kind: button, text: { en: "Sign up", ar: "سجّل" }, gap: m }
    b:
      label: { en: "Version B: red border only", ar: "النسخة B: إطار أحمر فقط" }
      mock:
        width: 280
        gray: true
        blocks:
          - { kind: field, label: { en: "Username", ar: "اسم المستخدم" }, text: "film_fan", filled: true, tone: bad }
          - { kind: button, text: { en: "Sign up", ar: "سجّل" }, gap: m }
    answer: a
    misconceptions:
      - id: MC-P14-052
        when: [b]
        feedback:
          en: "Without colour, B looks like nothing happened. The customer presses Sign up again and again."
          ar: "بدون اللون، تبدو B كأن شيئًا لم يحدث. فيضغط العميل «سجّل» مرة بعد مرة."
    correct:
      en: "A: an icon and words, not just colour."
      ar: "A: رمز وكلمات، لا اللون وحده."
    explain:
      en: "The message works in any colour and even suggests a free name, so the fix takes one tap."
      ar: "الرسالة تعمل بأي لون، بل تقترح اسمًا متاحًا، فيصبح الإصلاح ضغطة واحدة."

  - id: S10
    type: choose
    skill: SK-P14-U05-05
    part: retest
    value:
      en: "Re-test, web forms (NN/g): erroneous input should be preserved so users can correct it, and accompanied by a specific explanation of the problem."
      ar: "إعادة اختبار، النماذج في المواقع (NN/g): يجب الاحتفاظ بالإدخال الخطأ لكي يصلحه الناس، مع شرح محدد للمشكلة."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Erroneous input should be preserved so users can correct it, and accompanied by a specific explanation of the problem." }
    scenario:
      en: "Tharwat designs a hotel booking page. A guest filled in eight fields, but the expiry date on their card has passed, so the payment fails."
      ar: "يصمّم ثروت صفحة حجز فندق. وملأ أحد النزلاء ثمانية حقول، لكن تاريخ انتهاء بطاقته قد مرّ، ففشل الدفع."
    prompt:
      en: "What should the page do after the failed payment?"
      ar: "ماذا يجب أن تفعل الصفحة بعد فشل الدفع؟"
    options:
      - { id: reload, text: { en: "Reload the page empty, with \"Payment failed\" at the top", ar: "تعيد تحميل الصفحة فارغة، مع «فشل الدفع» في الأعلى" } }
      - { id: card, text: { en: "Keep the guest details, empty only the card fields, and say \"Payment failed\"", ar: "تحتفظ ببيانات النزيل، وتُفرغ حقول البطاقة فقط، وتقول «فشل الدفع»" } }
      - { id: keep, text: { en: "Keep everything, and say on the expiry field that the card has expired", ar: "تحتفظ بكل شيء، وتقول على حقل تاريخ الانتهاء إن البطاقة منتهية" } }
    answer: [keep]
    misconceptions:
      - id: MC-P14-053
        when: [reload]
        feedback:
          en: "One expired date costs the guest all eight fields. Many will book somewhere else rather than start again."
          ar: "تاريخ واحد منتهٍ يكلّف النزيل الحقول الثمانية كلها. وكثيرون سيحجزون في مكان آخر بدل البدء من جديد."
      - id: MC-P14-051
        when: [card]
        feedback:
          en: "\"Payment failed\" doesn't say why, so the guest may retype the same expired card. Name the problem on the field that caused it."
          ar: "«فشل الدفع» لا تقول السبب، فقد يكتب النزيل بيانات البطاقة المنتهية نفسها مرة أخرى. اذكر المشكلة على الحقل الذي سبّبها."
    correct:
      en: "Keep everything and name the exact problem."
      ar: "احتفظ بكل شيء واذكر المشكلة بالضبط."
    explain:
      en: "The guest sees at once that the card has expired and uses another one. Nothing else has to be typed again."
      ar: "يرى النزيل فورًا أن البطاقة منتهية فيستخدم بطاقة أخرى. ولا يحتاج إلى كتابة أي شيء آخر من جديد."
