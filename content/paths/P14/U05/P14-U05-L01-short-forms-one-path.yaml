id: P14-U05-L01
mode: lesson
minutes: 8
title:
  en: "Short forms, one path"
  ar: "نماذج قصيرة، ومسار واحد"
speaker: youssef
sources:
  - title: { en: "Website Forms Usability: Top 10 Recommendations (NN/g)", ar: "سهولة استخدام النماذج في المواقع: أهم 10 توصيات (NN/g)" }
    url: "https://www.nngroup.com/articles/web-form-design/"
review_labels:
  MC-P14-042: { en: "Every extra field costs finished forms", ar: "كل حقل زائد يقلّل عدد من يكملون النموذج" }
  MC-P14-043: { en: "One column keeps people moving down the form", ar: "العمود الواحد يُبقي الناس يتحركون إلى أسفل النموذج" }
  MC-P14-044: { en: "Put each label right next to its own field", ar: "ضع اسم كل حقل بجانب حقله مباشرة" }
  MC-P14-045: { en: "Order fields the way people find the information", ar: "رتّب الحقول بالترتيب الذي يجد به الناس المعلومات" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Youssef's bookshop sign-up", ar: "التسجيل في مكتبة يوسف" }
    body:
      en: "I run an online bookshop, and I'm planning its sign-up form. To buy, an account only needs a name, an email and a password. The delivery address is asked later, at checkout.\n\nMy marketing team wants more: phone, birthday, city, job title, and \"How did you hear about us?\"."
      ar: "أدير مكتبة على الإنترنت، وأخطّط لنموذج التسجيل فيها. وللشراء، يحتاج الحساب فقط إلى اسم وبريد إلكتروني وكلمة مرور. أما عنوان التوصيل فيُطلب لاحقًا، عند الدفع.\n\nويريد فريق التسويق عندي حقولًا أكثر: الهاتف، وتاريخ الميلاد، والمدينة، والوظيفة، و«كيف عرفت عنّا؟»."
    mock:
      app: waraq
      appbar: {"title": {"en": "Create your account", "ar": "أنشئ حسابك"}, "back": true, "logo": true}
      blocks:
        - {"kind": "small", "text": {"en": "Join Waraq to track your orders", "ar": "انضم إلى ورق لتتابع طلباتك"}}
        - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": ""}
        - {"kind": "field", "label": {"en": "Email", "ar": "البريد الإلكتروني"}, "text": ""}
        - {"kind": "field", "label": {"en": "Password", "ar": "كلمة المرور"}, "text": ""}
      footer:
        - {"kind": "button", "text": {"en": "Create account", "ar": "أنشئ الحساب"}}

  - id: S02
    type: tune
    part: try
    skill: SK-P14-U05-01
    rules: [R12]
    confidence: true
    value:
      en: "Try first. Web forms (NN/g): every time you cut a field or question from a form, you increase its conversion rate. Fields the account doesn't need now only add work before the first purchase."
      ar: "جرّب أولًا. النماذج في المواقع (NN/g): كلما حذفت حقلًا أو سؤالًا من النموذج، زاد عدد من يكملونه. والحقول التي لا يحتاجها الحساب الآن تضيف عملًا فقط قبل أول عملية شراء."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Every time you cut a field or question from a form, you increase its conversion rate" }
    prompt:
      en: "Try each version of the sign-up form. Which one should ship?"
      ar: "جرّب كل نسخة من نموذج التسجيل. أيّها يجب أن تُطلق؟"
    start: all
    options:
      - id: all
        text: { en: "All 8 fields, all required", ar: "الحقول الـ 8 كلها، وكلها مطلوبة" }
        mock:
          app: waraq
          appbar: {"title": {"en": "Create your account", "ar": "أنشئ حسابك"}, "back": true, "logo": true}
          blocks:
            - {"kind": "small", "text": {"en": "Join Waraq to track your orders", "ar": "انضم إلى ورق لتتابع طلباتك"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": ""}
            - {"kind": "field", "label": {"en": "Email", "ar": "البريد الإلكتروني"}, "text": ""}
            - {"kind": "field", "label": {"en": "Password", "ar": "كلمة المرور"}, "text": ""}
            - {"kind": "field", "label": {"en": "Phone", "ar": "الهاتف"}, "text": ""}
            - {"kind": "field", "label": {"en": "Birthday", "ar": "تاريخ الميلاد"}, "text": ""}
            - {"kind": "select", "label": {"en": "City", "ar": "المدينة"}, "text": {"en": "Choose", "ar": "اختر"}}
            - {"kind": "field", "label": {"en": "Job title", "ar": "الوظيفة"}, "text": ""}
            - {"kind": "select", "label": {"en": "How did you hear about us?", "ar": "كيف عرفت عنّا؟"}, "text": {"en": "Choose", "ar": "اختر"}}
          footer:
            - {"kind": "button", "text": {"en": "Create account", "ar": "أنشئ الحساب"}}
      - id: optional
        text: { en: "All 8 fields, the extra 5 marked optional", ar: "الحقول الـ 8 كلها، والـ 5 الإضافية اختيارية" }
        mock:
          app: waraq
          appbar: {"title": {"en": "Create your account", "ar": "أنشئ حسابك"}, "back": true, "logo": true}
          blocks:
            - {"kind": "small", "text": {"en": "Join Waraq to track your orders", "ar": "انضم إلى ورق لتتابع طلباتك"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": ""}
            - {"kind": "field", "label": {"en": "Email", "ar": "البريد الإلكتروني"}, "text": ""}
            - {"kind": "field", "label": {"en": "Password", "ar": "كلمة المرور"}, "text": ""}
            - {"kind": "field", "label": {"en": "Phone (optional)", "ar": "الهاتف (اختياري)"}, "text": ""}
            - {"kind": "field", "label": {"en": "Birthday (optional)", "ar": "تاريخ الميلاد (اختياري)"}, "text": ""}
            - {"kind": "select", "label": {"en": "City (optional)", "ar": "المدينة (اختياري)"}, "text": {"en": "Choose", "ar": "اختر"}}
            - {"kind": "field", "label": {"en": "Job title (optional)", "ar": "الوظيفة (اختياري)"}, "text": ""}
            - {"kind": "select", "label": {"en": "How did you hear about us? (optional)", "ar": "كيف عرفت عنّا؟ (اختياري)"}, "text": {"en": "Choose", "ar": "اختر"}}
          footer:
            - {"kind": "button", "text": {"en": "Create account", "ar": "أنشئ الحساب"}}
      - id: short
        text: { en: "Only the 3 fields the account needs", ar: "الحقول الـ 3 التي يحتاجها الحساب فقط" }
        mock:
          app: waraq
          appbar: {"title": {"en": "Create your account", "ar": "أنشئ حسابك"}, "back": true, "logo": true}
          blocks:
            - {"kind": "small", "text": {"en": "Join Waraq to track your orders", "ar": "انضم إلى ورق لتتابع طلباتك"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": ""}
            - {"kind": "field", "label": {"en": "Email", "ar": "البريد الإلكتروني"}, "text": ""}
            - {"kind": "field", "label": {"en": "Password", "ar": "كلمة المرور"}, "text": ""}
          footer:
            - {"kind": "button", "text": {"en": "Create account", "ar": "أنشئ الحساب"}}
    answer: [short]
    misconceptions:
      - id: MC-P14-042
        when: [all]
        feedback:
          en: "Eight required fields stand between people and their first book. Each one is another reason to leave, and the bookshop loses buyers to get marketing data."
          ar: "ثمانية حقول مطلوبة تقف بين الناس وأول كتاب يشترونه. وكل حقل سبب جديد للمغادرة، فتخسر المكتبة مشترين لتحصل على بيانات للتسويق."
      - id: MC-P14-042
        when: [optional]
        feedback:
          en: "\"Optional\" still makes the form look long, and people stop to wonder whether to fill each one. A field the account doesn't need belongs somewhere else."
          ar: "كلمة «اختياري» لا تمنع أن يبدو النموذج طويلًا، ويتوقف الناس عند كل حقل ليقرروا هل يملؤونه. والحقل الذي لا يحتاجه الحساب مكانه في موضع آخر."
    hints:
      - en: "Which fields does the account actually need before someone can buy a book?"
        ar: "ما الحقول التي يحتاجها الحساب فعلًا قبل أن يشتري أحد كتابًا؟"
    correct:
      en: "Only what the account needs."
      ar: "ما يحتاجه الحساب فقط."
    explain:
      en: "Three fields take seconds, so more people finish and buy. Birthday or job title can be asked later, in the profile, when there's a reason to give them."
      ar: "ثلاثة حقول تأخذ ثواني، فيكمل التسجيلَ عددٌ أكبر ويشترون. ويمكن سؤال تاريخ الميلاد أو الوظيفة لاحقًا، في الملف الشخصي، حين يوجد سبب لذكرها."

  - id: S10
    type: video
    part: concept
    title: { en: "A form people get through", ar: "نموذج يكمله الناس" }
    video: 0aab15ea-86fa-4b6a-853c-ccae170dd079
    duration: 191
    transcript:
      - { t: 2.5, en: "Since we talked about text fields, it's very important to talk about forms, the place text fields are used most. We use them in many situations across all kinds of products: when we", ar: "وبما إننا اتكلمنا عن الـ Text fields، فمهم جدًا نتكلم عن الـ Forms، وهي أكتر حاجة بيُستخدم فيها الـ Text fields. بنستخدمها في حالات كتير جدًا في Products متنوعة:" }
      - { t: 12.0, en: "buy, when we log in, when we enter our details, and in many other cases. So let's look at some guidelines for forms in general, and for text fields inside forms in particular.", ar: "واحنا بنشتري، واحنا بنعمل Login، واحنا بندخل بياناتنا، وفي حالات مختلفة كتير. فخلّونا نشوف بعض الـ Guidelines اللي ليها علاقة بالـ Forms عامةً، وبالـ Text fields جوه الـ Forms بالتحديد." }
      - { t: 21.5, en: "The first guideline is that we always need to keep the form as short as possible. How do we keep it short? First we review what", ar: "لو شفنا أول Guideline معانا، هنلاقي إننا محتاجين نخلّي الـ Form دايمًا قصير قدر المستطاع. إزاي نخلّيه قصير؟ أول حاجة" }
      - { t: 30.5, en: "we put in the form: once we've written down all the data we need to collect from the user, we go back over it: is there data", ar: "نبدأ نراجع الحاجات اللي حطّيناها في الـ Form: لو كتبنا كل البيانات اللي محتاجين نجمعها من اليوزر، نبدأ نراجع بعد" }
      - { t: 39.5, en: "we can get later in some way? Is there data that isn't necessary to ask for? Then we start removing that data as much as we can.", ar: "كده: هل في بيانات ممكن ناخدها بعدين بشكل ما؟ هل في بيانات مش ضرورية نطلبها؟ ونبدأ نشيل البيانات دي قدر المستطاع." }
      - { t: 48.5, en: "Second: we try to keep the things in the form that belong together visually close, or clearly one group. In this example, look at the word Password: the Password label, which belongs to the", ar: "تاني حاجة: نحاول نخلّي الحاجات اللي ليها علاقة ببعض في الـ Form تكون قريبة من بعض Visually، أو باين إنها Group واحد. يعني في المثال اللي قدامنا، لو شفنا كلمة Password، الـ Label" }
      - { t: 60.17, en: "second field, sits at almost the same distance from the first field as from the second. So it isn't clear that Password is closer to the second field and belongs to it, even though it", ar: "بتاع Password اللي هو أصلًا بتاع الـ Field التاني، المسافة بينه وبين الـ Field الأول وبينه وبين الـ Field التاني تقريبًا هي نفسها. فمش باين إن الـ Password أقرب للتاني وإنه تبعه، مع إنه" }
      - { t: 71.83, en: "obviously does. But when the form is long, this gets worse, and it may look like supporting text for the first field. So I always try to bring the label close to its own field.", ar: "واضح إنه تبع الـ Field التاني. لكن لما يكون الـ Form طويل، هيكون الموضوع مش أظرف حاجة، وممكن يبان كأنه Supporting text للـ Field الأول. فدايمًا أحاول أقرّب الـ Label من الـ Field نفسه." }
      - { t: 83.5, en: "Also, if I'm collecting different kinds of data, I can split it into sections: if I ask for personal information, say, and then payment information, I split them into Personal and Payment, and so on. That makes it easier for the", ar: "وبرضه لو بجمع داتا مختلفة، ممكن أقسّمها Sections: لو بطلب Personal information مثلًا، وبعدين بطلب Payment information، فأقسّمهم Personal وPayment، وهكذا. عشان يكون أسهل على اليوزر إنه يفهم" }
      - { t: 94.5, en: "user to understand what each section is about and what exactly the data is for. It also makes it easier to finish one section and move on to the next, rather than one long form, which can be annoying at times.", ar: "كل Section بيتكلم عن إيه، والداتا دي بتاعة إيه بالضبط. وأسهل عليه إنه يخلّص Section ويدخل للي بعده، وما يكونش Form كامل طويل، لأن ده ممكن يكون مزعج أحيانًا." }
      - { t: 105.5, en: "Third: we always try to stack the fields or any inputs in a form under each other, rather than in two columns side by side, because that breaks the eye's path as I", ar: "تالت حاجة: دايمًا نحاول نخلّي الـ Fields أو أي Inputs في الـ Form تحت بعض، أفضل من إننا نخلّيها في عمودين جنب بعض، لأن ده بيقطع حركة النظر وأنا نازل" }
      - { t: 115.17, en: "go down vertically finishing things one under another. Unless, of course, there's a logic for putting things side by side that makes it better. Like the expiration date and the CVV: they belong together", ar: "Vertical بخلّص الحاجات تحت بعض. إلا طبعًا لو في حاجة ليها Logic معيّن إنها تكون جنب بعض، ممكن يخلّيني أحطها جنب بعض أو يكون ده أفضل. زي الـ Expiration date" }
      - { t: 124.83, en: "in the payment method, and the CVV is a short number anyway, so we can put them in two columns side by side. Otherwise it's always better to keep them in a single column.", ar: "والـ CVV: حاجات ليها علاقة ببعض في الـ Payment method، والـ CVV أصلًا رقم صغير، فممكن نحطهم في عمودين جنب بعض. لكن غير كده الأفضل دايمًا إننا نخلّيهم Single column." }
      - { t: 134.5, en: "The next point is using a logical sequence. How do I decide whether to use one? I can ask: while the user enters this data, will they be doing something specific, or", ar: "الحاجة اللي بعد كده إني أستخدم Logical sequence. إزاي أفكر إني أستخدم Logical sequence ولا لأ؟ ممكن أفكر: اليوزر وقت ما بيدخل الداتا دي، هل هيعمل حاجة معينة" }
      - { t: 144.64, en: "taking the data from somewhere? Like this example: if they're taking the data from a credit card, they're looking at the front of the card, reading the card number, then the expiration", ar: "أو هياخد الداتا من مكان معين؟ زي المثال اللي قدامنا: لو بياخد الداتا من الـ Credit card، فهو دلوقتي بيبص على الكارت من قدام، بيقرا رقم الكارت، بعدين" }
      - { t: 154.77, en: "date, then turning the card over to read the CVV on the back. That's the order they follow, and that's the logic I use to lay out the fields: card number first, then", ar: "يقرا الـ Expiration date، بعدين يلف الكارت ويقرا الـ CVV من ورا. فده الترتيب اللي بيمشي بيه، وده الـ Logic اللي أستخدمه عشان أحط له الـ Fields: رقم" }
      - { t: 164.91, en: "the expiration date, then the CVV, so they turn it over and read it from the back. Also, if things have a very clear logical link, like first name and last name,", ar: "الكارت الأول، بعدين الـ Expiration date، بعدين الـ CVV عشان يقلبه ويشوفه من ورا. وبرضه لو في حاجات ليها علاقة Logic واضحة جدًا ببعض، زي الـ First name" }
      - { t: 175.04, en: "of course first name comes first, then last name. So I start asking: is there anything that should make me put the fields in a certain order, or will the order not matter?", ar: "والـ Last name، أكيد الـ First name هيكون الأول بعدين الـ Last name. فأبدأ أفكر: هل في حاجة تخلّيني أحط ترتيب معين للـ Fields، ولا الترتيب مش هيفرق." }

  - id: S03
    type: card
    part: concept
    icons: [list, eye, layers, ok]
    title: { en: "Video summary", ar: "ملخص الفيديو" }
    body:
      en: "Forms are where people sign up, log in, pay and book. Every field is work, so the form should feel short and read in one direction.\n\n- **Keep it short:** list every field, then cut what the task doesn't need now, or what you can get later or another way.\n- **Group what belongs together:** put each label right next to its own field, and split long forms into named sections, such as \"Personal details\" and \"Payment\".\n- **One column:** stack the fields, one per row. Side by side only when two short fields clearly belong together, such as expiry date and security code.\n- **Logical order:** follow the order people find the information in, such as first name then last name, or the card number, then the expiry date, then the code on the back."
      ar: "النماذج هي المكان الذي يسجّل فيه الناس، ويدخلون، ويدفعون، ويحجزون. وكل حقل فيه مجهود، لذلك يجب أن يبدو النموذج قصيرًا ويُقرأ في اتجاه واحد.\n\n- **اجعله قصيرًا:** اكتب كل الحقول، ثم احذف ما لا تحتاجه المهمة الآن، أو ما يمكن الحصول عليه لاحقًا أو بطريقة أخرى.\n- **اجمع ما يرتبط ببعضه:** ضع اسم كل حقل بجانب حقله مباشرة، وقسّم النموذج الطويل إلى أقسام لها عناوين، مثل «البيانات الشخصية» و«الدفع».\n- **عمود واحد:** ضع الحقول تحت بعضها، حقلًا في كل صف. ولا تضعها جنبًا إلى جنب إلا لحقلين قصيرين مرتبطين بوضوح، مثل تاريخ الانتهاء ورمز الأمان.\n- **ترتيب منطقي:** اتبع الترتيب الذي يجد به الناس المعلومات، مثل الاسم الأول ثم اسم العائلة، أو رقم البطاقة ثم تاريخ الانتهاء ثم الرمز الموجود على ظهرها."

  - id: S04
    type: choose
    part: guided
    skill: SK-P14-U05-01
    rules: [R06]
    value:
      en: "Web forms (NN/g): keep it short. Reconsider every piece of data you ask for; a value the product will receive anyway later in the flow doesn't need its own field now."
      ar: "النماذج في المواقع (NN/g): اجعله قصيرًا. راجع كل معلومة تطلبها؛ فالقيمة التي سيحصل عليها المنتج على أي حال لاحقًا في الخطوات لا تحتاج إلى حقل خاص بها الآن."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Every time you cut a field or question from a form, you increase its conversion rate" }
    scenario:
      en: "Marketing agrees to drop most extras, but insists on keeping \"City\" at sign-up, to plan delivery areas. Every order already asks for a full delivery address at checkout, city included."
      ar: "يوافق فريق التسويق على حذف أغلب الحقول الإضافية، لكنه يصر على إبقاء «المدينة» في التسجيل، ليخطط لمناطق التوصيل. وكل طلب يسأل أصلًا عن عنوان التوصيل كاملًا عند الدفع، والمدينة منه."
    prompt:
      en: "What should I do with the City field?"
      ar: "ماذا أفعل بحقل المدينة؟"
    options:
      - { id: keep, text: { en: "Keep it as a required dropdown at sign-up", ar: "يبقيه Dropdown مطلوبًا في التسجيل" } }
      - { id: optional, text: { en: "Keep it, but mark it optional", ar: "يبقيه، لكن يجعله اختياريًا" } }
      - { id: cut, text: { en: "Remove it, and give marketing the city from checkout addresses", ar: "يحذفه، ويعطي فريق التسويق المدينة من عناوين الدفع" } }
    answer: [cut]
    misconceptions:
      - id: MC-P14-042
        when: [keep, optional]
        feedback:
          en: "The city will arrive anyway with the first order's address. Asking it at sign-up makes everyone answer twice, and the sign-up data is less accurate than a real delivery address."
          ar: "المدينة ستصل على أي حال مع عنوان أول طلب. وسؤالها في التسجيل يجعل الجميع يجيبون مرتين، وبيانات التسجيل أقل دقة من عنوان توصيل حقيقي."
    hints:
      - en: "Is there another moment where the bookshop gets this same answer?"
        ar: "هل توجد لحظة أخرى تحصل فيها المكتبة على الإجابة نفسها؟"
    correct:
      en: "Cut it: the data arrives later anyway."
      ar: "احذفه: المعلومة ستصل لاحقًا على أي حال."
    explain:
      en: "A field earns its place only if the task needs it now and there's no other way to get it. Checkout addresses give marketing real delivery cities, without slowing anyone down."
      ar: "الحقل يستحق مكانه فقط إن كانت المهمة تحتاجه الآن ولا توجد طريقة أخرى للحصول عليه. وعناوين الدفع تعطي فريق التسويق مدن توصيل حقيقية، دون أن تبطئ أحدًا."

  - id: S05
    type: compare
    part: guided
    skill: SK-P14-U05-02
    rules: [R06]
    value:
      en: "Web forms (NN/g): labels should be close to the fields they describe. Avoid ambiguous spacing, where labels are equidistant from multiple fields."
      ar: "النماذج في المواقع (NN/g): يجب أن يكون اسم الحقل قريبًا من الحقل الذي يصفه. وتجنّب المسافات المبهمة، حين يكون الاسم على المسافة نفسها من أكثر من حقل."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Avoid ambiguous spacing, where labels are equidistant from multiple fields" }
    scenario:
      en: "The log-in screen has two fields. In version A, the even spacing puts each label as far from its own field as from the field above it."
      ar: "في شاشة تسجيل الدخول حقلان. وفي النسخة A، تجعل المسافات المتساوية كل اسم بعيدًا عن حقله بقدر بُعده عن الحقل الذي فوقه."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: even spacing", ar: "النسخة A: مسافات متساوية" }
      mock:
        app: waraq
        appbar: {"title": {"en": "Log in", "ar": "تسجيل الدخول"}, "logo": true}
        blocks:
          - {"kind": "small", "text": {"en": "Email", "ar": "البريد الإلكتروني"}}
          - {"kind": "field", "text": "", "gap": "m"}
          - {"kind": "small", "text": {"en": "Password", "ar": "كلمة المرور"}, "gap": "m"}
          - {"kind": "field", "text": "", "gap": "m"}
        footer:
          - {"kind": "button", "text": {"en": "Log in", "ar": "دخول"}}
    b:
      label: { en: "Version B: each label on its field", ar: "النسخة B: كل اسم فوق حقله" }
      mock:
        app: waraq
        appbar: {"title": {"en": "Log in", "ar": "تسجيل الدخول"}, "logo": true}
        blocks:
          - {"kind": "field", "label": {"en": "Email", "ar": "البريد الإلكتروني"}, "text": ""}
          - {"kind": "field", "label": {"en": "Password", "ar": "كلمة المرور"}, "text": "", "gap": "l"}
        footer:
          - {"kind": "button", "text": {"en": "Log in", "ar": "دخول"}}
    answer: b
    misconceptions:
      - id: MC-P14-044
        when: [a]
        feedback:
          en: "Look at \"Password\" in A: it sits halfway between the two fields. In a longer form, people will read it as help text under the email field and type in the wrong box."
          ar: "انظر إلى «كلمة المرور» في A: إنها في منتصف المسافة بين الحقلين. وفي نموذج أطول، سيقرؤها الناس كأنها نص مساعد تحت حقل البريد، ويكتبون في الخانة الخطأ."
    correct:
      en: "B: each label belongs to one field."
      ar: "B: كل اسم ينتمي إلى حقل واحد."
    explain:
      en: "A small gap between a label and its field, and a bigger gap before the next pair, makes each label and field read as one unit."
      ar: "مسافة صغيرة بين الاسم وحقله، ومسافة أكبر قبل الزوج التالي، تجعل كل اسم مع حقله وحدة واحدة."

  - id: S06
    type: compare
    part: contrast
    skill: SK-P14-U05-02
    rules: [R11]
    confidence: true
    value:
      en: "Web forms (NN/g): multiple columns interrupt the vertical momentum of moving down the form. Keep people in the flow with a single column and a separate row for each field."
      ar: "النماذج في المواقع (NN/g): الأعمدة المتعددة تقطع حركة الناس إلى أسفل النموذج. فأبقهم في المسار بعمود واحد وصف مستقل لكل حقل."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Multiple columns interrupt the vertical momentum of moving down the form." }
    scenario:
      en: "At checkout, the delivery address has five fields. To make the page look shorter, version A puts them in two columns."
      ar: "عند الدفع، يتكوّن عنوان التوصيل من خمسة حقول. ولكي تبدو الصفحة أقصر، تضعها النسخة A في عمودين."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A: two columns", ar: "النسخة A: عمودان" }
      mock:
        app: waraq
        appbar: {"title": {"en": "Delivery address", "ar": "عنوان التوصيل"}, "back": true}
        blocks:
          - {"kind": "progress", "value": 50, "label": {"en": "Step 2 of 4", "ar": "الخطوة 2 من 4"}}
          - {"kind": "row", "blocks": [{"kind": "field", "label": {"en": "Street", "ar": "الشارع"}, "text": ""}, {"kind": "field", "label": {"en": "Building", "ar": "العمارة"}, "text": ""}]}
          - {"kind": "row", "blocks": [{"kind": "field", "label": {"en": "Floor", "ar": "الدور"}, "text": ""}, {"kind": "field", "label": {"en": "Area", "ar": "المنطقة"}, "text": ""}]}
          - {"kind": "field", "label": {"en": "City", "ar": "المدينة"}, "text": ""}
        footer:
          - {"kind": "button", "text": {"en": "Continue to payment", "ar": "تابع إلى الدفع"}}
    b:
      label: { en: "Version B: one column", ar: "النسخة B: عمود واحد" }
      mock:
        app: waraq
        appbar: {"title": {"en": "Delivery address", "ar": "عنوان التوصيل"}, "back": true}
        blocks:
          - {"kind": "progress", "value": 50, "label": {"en": "Step 2 of 4", "ar": "الخطوة 2 من 4"}}
          - {"kind": "field", "label": {"en": "Street", "ar": "الشارع"}, "text": ""}
          - {"kind": "field", "label": {"en": "Building", "ar": "العمارة"}, "text": ""}
          - {"kind": "field", "label": {"en": "Floor", "ar": "الدور"}, "text": ""}
          - {"kind": "field", "label": {"en": "Area", "ar": "المنطقة"}, "text": ""}
          - {"kind": "field", "label": {"en": "City", "ar": "المدينة"}, "text": ""}
        footer:
          - {"kind": "button", "text": {"en": "Continue to payment", "ar": "تابع إلى الدفع"}}
    answer: b
    misconceptions:
      - id: MC-P14-043
        when: [a]
        feedback:
          en: "In two columns, people zig-zag: across, then down, then back. Some read down the first column and skip Building and Area, and the parcel goes to the wrong door."
          ar: "في عمودين، تتحرك العين في خط متعرّج: إلى الجانب، ثم إلى أسفل، ثم إلى الجانب الآخر. ويقرأ بعض الناس العمود الأول إلى أسفل ويتجاوزون العمارة والمنطقة، فيصل الطرد إلى باب خطأ."
    correct:
      en: "B: one column, one path."
      ar: "B: عمود واحد، ومسار واحد."
    explain:
      en: "One field per row gives one obvious direction: straight down. The form is a little taller, but nobody misses a field."
      ar: "حقل واحد في كل صف يعطي اتجاهًا واحدًا واضحًا: إلى أسفل مباشرة. النموذج أطول قليلًا، لكن لا يفوت أحدًا أي حقل."

  - id: S07
    type: order
    part: guided
    skill: SK-P14-U05-02
    rules: [R06]
    onscreen: true
    caption: { en: "Card payment", ar: "الدفع بالبطاقة" }
    value:
      en: "Web forms (NN/g): use logical sequencing. People copy card details as they read the card: the number and expiry date on the front, then they turn it over for the code."
      ar: "النماذج في المواقع (NN/g): استخدم ترتيبًا منطقيًا. فالناس ينقلون بيانات البطاقة بالترتيب الذي يقرؤونها به: الرقم وتاريخ الانتهاء على الوجه، ثم يقلبون البطاقة ليقرؤوا الرمز."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Help keyboard users by testing the Tab-key navigation to ensure it follows the correct field sequence." }
    scenario:
      en: "The payment step asks for three card details. People copy them from the card in their hand."
      ar: "تطلب خطوة الدفع ثلاث بيانات من البطاقة. وينقلها الناس من البطاقة التي في أيديهم."
    prompt:
      en: "Put the fields in the order people should fill them in."
      ar: "رتّب الحقول بالترتيب الذي يجب أن يملأها به الناس."
    items:
      - { id: cvv, kind: field, text: { en: "Security code (3 digits on the back)", ar: "رمز الأمان (3 أرقام على الظهر)" } }
      - { id: expiry, kind: field, text: { en: "Expiry date (MM/YY)", ar: "تاريخ الانتهاء (شهر/سنة)" } }
      - { id: number, kind: field, text: { en: "Card number", ar: "رقم البطاقة" } }
    answer: [number, expiry, cvv]
    misconceptions:
      - id: MC-P14-045
        when: { before: [cvv, number] }
        feedback:
          en: "The code is on the back. Asking for it first makes people flip the card, then flip it back for the number, then flip it again."
          ar: "الرمز موجود على الظهر. وطلبه أولًا يجعل الناس يقلبون البطاقة، ثم يعيدونها للرقم، ثم يقلبونها مرة أخرى."
      - id: MC-P14-045
        when: { before: [expiry, number] }
        feedback:
          en: "People read the long card number first; it's the biggest thing on the front. Start where their eyes start."
          ar: "يقرأ الناس رقم البطاقة الطويل أولًا؛ فهو أكبر شيء على الوجه. ابدأ من حيث تبدأ أعينهم."
    hints:
      - en: "Hold a card in your hand. What do you read first, and what makes you turn it over?"
        ar: "تخيّل بطاقة في يدك. ماذا تقرأ أولًا، وما الذي يجعلك تقلبها؟"
    correct:
      en: "Number, expiry, then the code on the back."
      ar: "الرقم، ثم تاريخ الانتهاء، ثم الرمز الموجود على الظهر."
    explain:
      en: "The order follows the card itself: front first, top to bottom, then one flip for the code. People never have to search the card twice."
      ar: "الترتيب يتبع البطاقة نفسها: الوجه أولًا من أعلى إلى أسفل، ثم قلبة واحدة للرمز. ولا يحتاج الناس إلى البحث في البطاقة مرتين."

  - id: S08
    type: tune
    speaker: nour
    part: independent
    skill: SK-P14-U05-01
    rules: [R14]
    value:
      en: "Web forms (NN/g): keep it short. Signed-in patients have already given their name and phone; asking again adds fields the clinic can fill itself."
      ar: "النماذج في المواقع (NN/g): اجعله قصيرًا. فالمرضى المسجّلون أعطوا اسمهم وهاتفهم من قبل؛ وسؤالهم مرة أخرى يضيف حقولًا تستطيع العيادة ملأها بنفسها."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Every time you cut a field or question from a form, you increase its conversion rate" }
    scenario:
      en: "I manage a clinic, and we're designing our app. Patients are signed in, so the app already knows their name and phone. To book a visit, we need the doctor, the time and the reason for the visit."
      ar: "أدير عيادة، ونصمّم تطبيقها. والمرضى مسجّلون دخولهم، فالتطبيق يعرف أسماءهم وأرقام هواتفهم. ولحجز زيارة، نحتاج إلى الطبيب، والموعد، وسبب الزيارة."
    prompt:
      en: "Try each version of the booking form. Which one should ship?"
      ar: "جرّب كل نسخة من نموذج الحجز. أيّها يجب أن تُطلق؟"
    start: again
    options:
      - id: again
        text: { en: "Ask for name and phone again, to be sure", ar: "يطلب الاسم والهاتف مرة أخرى، للتأكد" }
        mock:
          app: raha
          appbar: {"title": {"en": "Book a visit", "ar": "احجز زيارة"}, "back": true}
          blocks:
            - {"kind": "listitem", "avatar": {"text": "Amal Fathy", "art": "doctor"}, "text": {"en": "Raha Clinic · Dokki", "ar": "عيادة راحة · الدقي"}, "sub": {"en": "Family medicine", "ar": "طب الأسرة"}}
            - {"kind": "field", "label": {"en": "Full name", "ar": "الاسم بالكامل"}, "text": ""}
            - {"kind": "field", "label": {"en": "Phone", "ar": "الهاتف"}, "text": ""}
            - {"kind": "select", "label": {"en": "Doctor", "ar": "الطبيب"}, "text": {"en": "Dr. Amal Fathy", "ar": "د. أمل فتحي"}, "filled": true}
            - {"kind": "select", "label": {"en": "Time", "ar": "الموعد"}, "text": {"en": "Sun, 10:30 am", "ar": "الأحد، 10:30 صباحًا"}, "filled": true}
            - {"kind": "field", "label": {"en": "Reason for visit", "ar": "سبب الزيارة"}, "text": ""}
          footer:
            - {"kind": "button", "text": {"en": "Book", "ar": "احجز"}}
      - id: known
        text: { en: "Show the known name and phone, ask only for the rest", ar: "يعرض الاسم والهاتف المعروفين، ويطلب الباقي فقط" }
        mock:
          app: raha
          appbar: {"title": {"en": "Book a visit", "ar": "احجز زيارة"}, "back": true}
          blocks:
            - {"kind": "listitem", "avatar": {"text": "Amal Fathy", "art": "doctor"}, "text": {"en": "Raha Clinic · Dokki", "ar": "عيادة راحة · الدقي"}, "sub": {"en": "Family medicine", "ar": "طب الأسرة"}}
            - {"kind": "meta", "text": {"en": "For Hazem Adel · 0100 123 4567", "ar": "لـ حازم عادل · 0100 123 4567"}}
            - {"kind": "select", "label": {"en": "Doctor", "ar": "الطبيب"}, "text": {"en": "Dr. Amal Fathy", "ar": "د. أمل فتحي"}, "filled": true, "gap": "s"}
            - {"kind": "select", "label": {"en": "Time", "ar": "الموعد"}, "text": {"en": "Sun, 10:30 am", "ar": "الأحد، 10:30 صباحًا"}, "filled": true}
            - {"kind": "field", "label": {"en": "Reason for visit", "ar": "سبب الزيارة"}, "text": ""}
          footer:
            - {"kind": "button", "text": {"en": "Book", "ar": "احجز"}}
    answer: [known]
    misconceptions:
      - id: MC-P14-042
        when: [again]
        feedback:
          en: "The app already has these answers. Typing them again is pure work, and a typo here could even put the booking under the wrong number."
          ar: "التطبيق يعرف هذه الإجابات أصلًا. وكتابتها مرة أخرى مجهود بلا فائدة، وقد يجعل خطأ في الكتابة الحجزَ مسجّلًا برقم خطأ."
    correct:
      en: "Ask only for what the app doesn't know."
      ar: "اطلب فقط ما لا يعرفه التطبيق."
    explain:
      en: "Showing the known name and phone lets patients check them at a glance, and the form shrinks to the three answers only they can give."
      ar: "عرض الاسم والهاتف المعروفين يسمح للمرضى بمراجعتهما بنظرة واحدة، ويصبح النموذج ثلاث إجابات فقط لا يعرفها غيرهم."

  - id: S09
    type: card
    part: recap
    icons: [list, layers, ok]
    title: { en: "What you practised", ar: "ما تدرّبت عليه" }
    body:
      en: "- **Cut fields** the task doesn't need now, or that arrive later anyway.\n- **One column**, with each label right next to its own field.\n- **Logical order**, the way people find the information.\n\nNext: labels that stay in view, and saying what each field needs."
      ar: "- **احذف الحقول** التي لا تحتاجها المهمة الآن، أو التي ستصل لاحقًا على أي حال.\n- **عمود واحد**، واسم كل حقل بجانب حقله مباشرة.\n- **ترتيب منطقي**، بالترتيب الذي يجد به الناس المعلومات.\n\nالتالي: أسماء حقول تبقى ظاهرة، وتوضيح ما يحتاجه كل حقل."
