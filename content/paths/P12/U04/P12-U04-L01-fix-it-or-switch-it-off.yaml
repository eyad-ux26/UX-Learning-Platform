id: P12-U04-L01
mode: lesson
minutes: 7
title:
  en: "Let people fix it or switch it off"
  ar: "اسمح للناس بتصحيحه أو إيقافه"
summary:
  en: "Give a photo gallery's automatic albums the edit, reset and off controls people need."
  ar: "أعطِ الألبومات التلقائية في معرض صور أدوات التعديل وإعادة الضبط والإيقاف التي يحتاجها الناس."
speaker: mona
sources:
  - title: { en: "Feedback + Control (People + AI Guidebook)", ar: "الملاحظات والتحكّم (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/feedback-controls/"
review_labels:
  MC-P12-030: { en: "Give people a way to fix it or turn it off", ar: "أعطِ الناس طريقة لتصحيحه أو إيقافه" }
  MC-P12-031: { en: "Let people erase what it learned", ar: "اسمح للناس بمسح ما تعلّمه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "An album she couldn't change", ar: "ألبوم لم تستطع تغييره" }
    body:
      en: "I lead design for a photo gallery app. It makes albums by itself, like \"Trip to Alexandria\" or \"Best friends\".\n\nPeople love it, until it's wrong. One user's \"Best friends\" album kept showing a friend she no longer speaks to. She couldn't remove her, rename the album, or turn albums off. She deleted the app."
      ar: "أقود التصميم في تطبيق معرض صور. يصنع ألبومات بنفسه، مثل «رحلة الإسكندرية» أو «أفضل الأصدقاء».\n\nالناس يحبّونه، حتى يخطئ. ألبوم «أفضل الأصدقاء» عند إحدى المستخدمات ظلّ يعرض صديقة لم تعد تكلّمها. ولم تستطع حذفها، ولا تغيير اسم الألبوم، ولا إيقاف الألبومات. فحذفت التطبيق."
    mock:
      app: suwar
      appbar: { title: { en: "Best friends", ar: "أفضل الأصدقاء" }, back: true, actions: [ { icon: dots-three, aria: { en: "More", ar: "المزيد" } } ] }
      blocks:
        - { kind: row, blocks: [ { kind: badge, icon: sparkle, text: { en: "Made for you", ar: "مختارة لك" } }, { kind: small, color: muted, text: { en: "48 photos", ar: "48 صورة" } } ] }
        - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
        - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
      overlay:
        type: menu
        blocks:
          - { kind: listitem, icon: share-network, text: { en: "Share", ar: "مشاركة" } }

  - id: S02
    type: choose
    skill: SK-P12-U04-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Feedback + Control (People + AI): your product won't be perfect for everyone every time, so let people adapt the result, edit it, or turn it off."
      ar: "جرّب أولًا. الملاحظات والتحكّم (People + AI): منتجك لن يكون مثاليًا لكل شخص في كل مرة، فاسمح للناس بتكييف النتيجة، أو تعديلها، أو إيقافها."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Your product won’t be perfect for every user, every time, so allow users to adapt the output to their needs, edit it, or turn it off." }
    prompt:
      en: "What did she need most?"
      ar: "ما الذي كانت تحتاجه أكثر حين أخطأ الألبوم؟"
    options:
      - { id: smarter, text: { en: "A smarter AI that never makes this mistake", ar: "ذكاء اصطناعي أذكى لا يرتكب هذا الخطأ أبدًا" } }
      - { id: support, text: { en: "A support email she could write to", ar: "بريد دعم تستطيع مراسلته" } }
      - { id: control, text: { en: "Ways to fix it herself: remove a person, edit the album, or turn albums off", ar: "طرق لتصلحه بنفسها: حذف شخص، أو تعديل الألبوم، أو إيقاف الألبومات" } }
    answer: [control]
    misconceptions:
      - id: MC-P12-030
        when: [smarter, support]
        feedback:
          en: "No AI is right for everyone, and an email takes days. She needed to fix it herself, in a tap."
          ar: "لا يوجد ذكاء اصطناعي يصيب مع الجميع، والبريد يأخذ أيامًا. كانت تحتاج أن تصلحه بنفسها، بضغطة."
    hints:
      - { en: "Can any AI be right for everyone, every time?", ar: "هل يمكن لأي ذكاء اصطناعي أن يصيب مع الجميع في كل مرة؟" }
      - { en: "What could she do on her own, right away?", ar: "ماذا تستطيع أن تفعل وحدها، فورًا؟" }
    correct:
      en: "Right. Mistakes will happen; controls make them small."
      ar: "صحيح. الأخطاء ستحدث؛ وأدوات التحكّم تجعلها صغيرة."
    explain:
      en: "When people can fix a mistake in a tap, it stays a small mistake."
      ar: "حين يستطيع الناس إصلاح الخطأ بضغطة، يبقى خطأً صغيرًا."

  - id: S03
    type: card
    part: concept
    icons: [cut, toggle, person, layers]
    title: { en: "Leave people in charge", ar: "اترك القرار للناس" }
    body:
      en: "AI will sometimes be wrong for someone. Make that easy to fix.\n\n- **Edit or undo:** change the result, or take it back.\n- **Turn it off,** from the very first time, and back on later.\n- **Keep a manual way** to do the task without the AI.\n- **Erase what it learned** when people's lives or needs change."
      ar: "سيخطئ الذكاء الاصطناعي أحيانًا مع شخص ما. فاجعل إصلاح ذلك سهلًا.\n\n- **التعديل أو التراجع:** غيّر النتيجة، أو ألغِها.\n- **الإيقاف،** من أول مرة، وإعادة التشغيل لاحقًا.\n- **احتفظ بطريقة يدوية** لأداء المهمة دون الذكاء الاصطناعي.\n- **امسح ما تعلّمه** حين تتغيّر حياة الناس أو احتياجاتهم."

  - id: S04
    type: tune
    skill: SK-P12-U04-02
    part: guided
    rules: [R06]
    value:
      en: "Feedback + Control (People + AI): let people erase or update their past choices, or reset the AI to its default, non-personal version."
      ar: "الملاحظات والتحكّم (People + AI): اسمح للناس بمسح اختياراتهم السابقة أو تحديثها، أو إعادة الذكاء الاصطناعي إلى نسخته الافتراضية غير الشخصية."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Your product should allow for people to erase or update their previous selections, or reset your ML model to the default, non-personalized version." }
    scenario:
      en: "A year ago, she tagged that friend in many photos. The app learned this friend matters to her, and keeps adding her to new albums."
      ar: "قبل سنة، وسمت تلك الصديقة في صور كثيرة. فتعلّم التطبيق أنها مهمّة لها، وما زال يضيفها إلى ألبومات جديدة."
    prompt:
      en: "Tap each option to see it. What should we give her?"
      ar: "اضغط على كل خيار لتراه. ماذا نعطيها لتوقف ظهور هذه الصديقة في ألبوماتها؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: suwar
      appbar: { title: { en: "Best friends", ar: "أفضل الأصدقاء" }, back: true, actions: [ { icon: dots-three, aria: { en: "More", ar: "المزيد" } } ] }
      blocks:
        - { kind: small, color: muted, text: { en: "People in this album", ar: "الأشخاص في هذا الألبوم" }, gap: s }
        - { kind: row, blocks: [ { kind: avatar, art: woman-3, text: "Mai" }, { kind: avatar, art: man-2, text: "Hesham" }, { kind: avatar, art: woman-1, text: "Rana" } ], gap: xs }
        - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
        - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
    options:
      - id: forget
        text: { en: "\"Don't make albums with this person\", on her face in People", ar: "«لا تصنع ألبومات مع هذا الشخص»، على صورة وجهها في قسم الأشخاص" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Best friends", ar: "أفضل الأصدقاء" }, back: true, actions: [ { icon: dots-three, aria: { en: "More", ar: "المزيد" } } ] }
          blocks:
            - { kind: small, color: muted, text: { en: "People in this album", ar: "الأشخاص في هذا الألبوم" }, gap: s }
            - { kind: row, blocks: [ { kind: avatar, art: woman-3, text: "Mai" }, { kind: avatar, art: man-2, text: "Hesham" }, { kind: avatar, art: woman-1, text: "Rana" } ], gap: xs }
            - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
            - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
          overlay:
            type: sheet
            title: { en: "Hala", ar: "هالة" }
            blocks:
              - { kind: listitem, icon: eye-slash, text: { en: "Don't make albums with this person", ar: "لا تصنع ألبومات مع هذا الشخص" } }
              - { kind: listitem, icon: tag, text: { en: "Rename", ar: "غيّر الاسم" } }
      - id: tagmore
        text: { en: "Advice to tag other friends more, so she slowly drops", ar: "نصيحة بأن تسِم أصدقاء آخرين أكثر، ليقلّ ظهورها تدريجيًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Best friends", ar: "أفضل الأصدقاء" }, back: true, actions: [ { icon: dots-three, aria: { en: "More", ar: "المزيد" } } ] }
          blocks:
            - { kind: small, color: muted, text: { en: "People in this album", ar: "الأشخاص في هذا الألبوم" }, gap: s }
            - { kind: row, blocks: [ { kind: avatar, art: woman-3, text: "Mai" }, { kind: avatar, art: man-2, text: "Hesham" }, { kind: avatar, art: woman-1, text: "Rana" } ], gap: xs }
            - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
            - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
            - { kind: banner, tone: info, icon: lightbulb, text: { en: "Tip: tag other friends more, and she will slowly appear less.", ar: "نصيحة: ضع وسمًا لأصدقاء آخرين أكثر، وسيقلّ ظهورها تدريجيًا." }, gap: s }
      - id: wait
        text: { en: "Nothing; the AI will learn over time", ar: "لا شيء؛ سيتعلّم الذكاء الاصطناعي مع الوقت" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Best friends", ar: "أفضل الأصدقاء" }, back: true, actions: [ { icon: dots-three, aria: { en: "More", ar: "المزيد" } } ] }
          blocks:
            - { kind: small, color: muted, text: { en: "People in this album", ar: "الأشخاص في هذا الألبوم" }, gap: s }
            - { kind: row, blocks: [ { kind: avatar, art: woman-3, text: "Mai" }, { kind: avatar, art: man-2, text: "Hesham" }, { kind: avatar, art: woman-1, text: "Rana" } ], gap: xs }
            - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
            - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
    answer: [forget]
    misconceptions:
      - id: MC-P12-031
        when: [tagmore, wait]
        feedback:
          en: "Both leave her waiting while the hurt goes on. Let her tell the app directly to stop using what it learned."
          ar: "كلا الخيارين يتركها تنتظر والأذى مستمر. اسمح لها أن تطلب من التطبيق مباشرة أن يتوقّف عن استخدام ما تعلّمه."
    hints:
      - { en: "How long would she have to wait for the AI to change?", ar: "كم ستنتظر حتى يتغيّر الذكاء الاصطناعي؟" }
      - { en: "Which option lets her undo the past directly?", ar: "أي خيار يسمح لها بإلغاء الماضي مباشرة؟" }
    correct:
      en: "Right. Let her erase what it learned."
      ar: "صحيح. اسمح لها بمسح ما تعلّمه."
    explain:
      en: "People change. What the app learned last year should be easy to update today."
      ar: "الناس يتغيّرون. وما تعلّمه التطبيق في السنة الماضية يجب أن يكون سهل التحديث اليوم."

  - id: S05
    type: tune
    skill: SK-P12-U04-01
    part: guided
    rules: [R06]
    value:
      en: "Feedback + Control (People + AI): give people a way to do the task the regular, non-automated way."
      ar: "الملاحظات والتحكّم (People + AI): أعطِ الناس طريقة لأداء المهمة بالطريقة العادية، دون أتمتة."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "One way to allow for this is to provide a way for users to complete their task the regular, non-automated way." }
    scenario:
      en: "The team wants to remove the \"New album\" button, since the AI makes albums now."
      ar: "الفريق يريد حذف زر «ألبوم جديد»، لأن الذكاء الاصطناعي يصنع الألبومات الآن."
    prompt:
      en: "Tap each option to see it. What should we do?"
      ar: "اضغط على كل خيار لتراه. ماذا نفعل بزر «ألبوم جديد»؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: suwar
      appbar: { title: { en: "Albums", ar: "الألبومات" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      tabbar: { active: 1, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
      blocks:
        - { kind: listitem, art: beach, text: { en: "Trip to Alexandria", ar: "رحلة الإسكندرية" }, sub: { en: "✨ Made for you · 120", ar: "✨ أعددناه لك · 120" } }
        - { kind: listitem, art: people, text: { en: "Best friends", ar: "أفضل الأصدقاء" }, sub: { en: "✨ Made for you · 48", ar: "✨ أعددناه لك · 48" } }
      fab: { icon: plus, text: { en: "New album", ar: "ألبوم جديد" } }
    options:
      - id: remove
        text: { en: "Remove it; fewer buttons is cleaner", ar: "نحذفه؛ فقلّة الأزرار تجعل الشاشة أبسط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Albums", ar: "الألبومات" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          tabbar: { active: 1, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
          blocks:
            - { kind: listitem, art: beach, text: { en: "Trip to Alexandria", ar: "رحلة الإسكندرية" }, sub: { en: "✨ Made for you · 120", ar: "✨ أعددناه لك · 120" } }
            - { kind: listitem, art: people, text: { en: "Best friends", ar: "أفضل الأصدقاء" }, sub: { en: "✨ Made for you · 48", ar: "✨ أعددناه لك · 48" } }
      - id: keep
        text: { en: "Keep \"New album\" next to the AI albums", ar: "نُبقي «ألبوم جديد» بجانب ألبومات الذكاء الاصطناعي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Albums", ar: "الألبومات" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          tabbar: { active: 1, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
          blocks:
            - { kind: listitem, art: beach, text: { en: "Trip to Alexandria", ar: "رحلة الإسكندرية" }, sub: { en: "✨ Made for you · 120", ar: "✨ أعددناه لك · 120" } }
            - { kind: listitem, art: people, text: { en: "Best friends", ar: "أفضل الأصدقاء" }, sub: { en: "✨ Made for you · 48", ar: "✨ أعددناه لك · 48" } }
          fab: { icon: plus, text: { en: "New album", ar: "ألبوم جديد" } }
      - id: bury
        text: { en: "Move it deep into Settings", ar: "ننقله إلى مكان بعيد في الإعدادات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: suwar
          appbar: { title: { en: "Albums", ar: "الألبومات" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          tabbar: { active: 1, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
          blocks:
            - { kind: listitem, art: beach, text: { en: "Trip to Alexandria", ar: "رحلة الإسكندرية" }, sub: { en: "✨ Made for you · 120", ar: "✨ أعددناه لك · 120" } }
            - { kind: listitem, art: people, text: { en: "Best friends", ar: "أفضل الأصدقاء" }, sub: { en: "✨ Made for you · 48", ar: "✨ أعددناه لك · 48" } }
            - { kind: small, color: muted, text: { en: "\"New album\" is now in Settings › More › Albums", ar: "«ألبوم جديد» أصبح في الإعدادات › المزيد › الألبومات" }, gap: m }
    answer: [keep]
    misconceptions:
      - id: MC-P12-030
        when: [remove, bury]
        feedback:
          en: "Some people want to choose their own photos, like for a wedding album. The manual way is their safety net."
          ar: "بعض الناس يريدون اختيار صورهم بأنفسهم، مثل ألبوم الزفاف. والطريقة اليدوية هي شبكة الأمان لهم."
    hints:
      - { en: "Will the AI pick the right photos for every album?", ar: "هل سيختار الذكاء الاصطناعي الصور الصحيحة لكل ألبوم؟" }
      - { en: "What can people do when it doesn't?", ar: "ماذا يستطيع الناس فعله حين لا يختارها؟" }
    correct:
      en: "Right. Keep the manual way in easy reach."
      ar: "صحيح. احتفظ بالطريقة اليدوية في متناول اليد."
    explain:
      en: "AI albums are a shortcut, not the only road."
      ar: "ألبومات الذكاء الاصطناعي طريق مختصر، لا الطريق الوحيد."

  - id: S06
    type: compare
    skill: SK-P12-U04-01
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: no exit vs an off switch. Feedback + Control (People + AI): when first introducing your AI, let people try it out or turn it off."
      ar: "مقارنة: بلا مخرج مقابل زر إيقاف. الملاحظات والتحكّم (People + AI): حين تقدّم الذكاء الاصطناعي أول مرة، اسمح للناس بتجربته أو إيقافه."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "When first introducing your AI, consider allowing users to test it out or turn it off." }
    scenario:
      en: "The first time the app makes albums, it shows a card. Two versions:"
      ar: "أول مرة يصنع فيها التطبيق ألبومات، يعرض بطاقة. وهاتان نسختان:"
    prompt:
      en: "Which card should we show?"
      ar: "أي بطاقة نعرض، ليقرّر كل شخص إن كان يريد الألبومات؟"
    a:
      label: { en: "A: \"We made 3 albums for you!\" with \"See albums\"", ar: "A: «صنعنا لك 3 ألبومات!» مع «اعرض الألبومات»" }
      mock:
        app: suwar
        appbar: { title: { en: "Photos", ar: "الصور" } }
        tabbar: { active: 0, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
        blocks:
          - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
          - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
        overlay:
          type: sheet
          blocks:
            - { kind: icon, icon: sparkle, size: l, color: brand }
            - { kind: heading, text: { en: "We made 3 albums for you!", ar: "صنعنا لك 3 ألبومات!" }, gap: s }
            - { kind: button, text: { en: "See albums", ar: "اعرض الألبومات" }, gap: s }
    b:
      label: { en: "B: The same, plus \"Turn off auto albums\"", ar: "B: البطاقة نفسها، مع «أوقف الألبومات التلقائية»" }
      mock:
        app: suwar
        appbar: { title: { en: "Photos", ar: "الصور" } }
        tabbar: { active: 0, items: [ { icon: images, text: { en: "Photos", ar: "الصور" } }, { icon: folder-simple, text: { en: "Albums", ar: "الألبومات" } }, { icon: user-circle, text: { en: "People", ar: "الأشخاص" } } ] }
        blocks:
          - { kind: row, blocks: [ { kind: image, art: people, size: s }, { kind: image, art: beach, size: s }, { kind: image, art: family, size: s } ], gap: s }
          - { kind: row, blocks: [ { kind: image, art: cafe, size: s }, { kind: image, art: people, size: s }, { kind: image, art: city-night, size: s } ], gap: xs }
        overlay:
          type: sheet
          blocks:
            - { kind: icon, icon: sparkle, size: l, color: brand }
            - { kind: heading, text: { en: "We made 3 albums for you!", ar: "صنعنا لك 3 ألبومات!" }, gap: s }
            - { kind: button, text: { en: "See albums", ar: "اعرض الألبومات" }, gap: s }
            - { kind: button, style: text, text: { en: "Turn off auto albums", ar: "أوقف الألبومات التلقائية" }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: choice, text: { en: "People who don't want it can say no from the start", ar: "من لا يريدها يستطيع أن يرفضها من البداية" } }
        - { id: links, text: { en: "Cards with links look more complete", ar: "البطاقات التي فيها روابط تبدو أكمل" } }
        - { id: fewer, text: { en: "Fewer people will use albums", ar: "عدد أقل من الناس سيستخدم الألبومات" } }
      answer: [choice]
      misconceptions:
        - id: MC-P12-030
          when: [links, fewer]
          feedback:
            en: "It's not about looks or numbers. People who can say no trust the feature more, and many come back to it later."
            ar: "ليست المسألة مسألة شكل أو أرقام. من يستطيع الرفض يثق بالميزة أكثر، وكثيرون يعودون إليها لاحقًا."
    misconceptions:
      - id: MC-P12-030
        when: [a]
        feedback:
          en: "A is cheerful, but people who don't want albums of their private photos have no way out."
          ar: "A مبهجة، لكن من لا يريد ألبومات من صوره الخاصة ليس له مخرج."
    hints:
      - { en: "What about someone who doesn't want albums at all?", ar: "ماذا عن شخص لا يريد ألبومات أبدًا؟" }
      - { en: "Which card gives them a choice?", ar: "أي بطاقة تعطيه اختيارًا؟" }
    correct:
      en: "Right. Offer the off switch from the start."
      ar: "صحيح. قدّم زر الإيقاف من البداية."
    explain:
      en: "A choice on day one tells people they're in charge."
      ar: "الاختيار من اليوم الأول يقول للناس إنهم أصحاب القرار."

  - id: S07
    type: tune
    skill: SK-P12-U04-02
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. Feedback + Control (People + AI): people's preferences change over time, so let them adjust what the AI learned."
      ar: "حالة جديدة. الملاحظات والتحكّم (People + AI): تفضيلات الناس تتغيّر مع الوقت، فاسمح لهم بتعديل ما تعلّمه الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "A user’s preferences may change over time, so consider how you’ll give them control over what preferences they communicate to your ML model, and give them the ability to adjust it." }
    scenario:
      en: "I own a shop. My supplier app suggests what to reorder. It learned from Ramadan, when I sold lots of lanterns. Ramadan is over, and it still suggests 50 lanterns every week."
      ar: "أملك متجرًا. وتطبيق المورّد يقترح ما أطلبه مرة أخرى. وقد تعلّم من رمضان، حين بعت كميات كبيرة من الفوانيس. انتهى رمضان، وما زال يقترح 50 فانوسًا كل أسبوع."
    prompt:
      en: "Tap each option to see it. What would help me most?"
      ar: "اضغط على كل خيار لتراه. ما الذي يوقف اقتراح الفوانيس دون أن أخسر باقي الاقتراحات؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: dukkani
      appbar: { title: { en: "Reorder", ar: "إعادة الطلب" }, back: true }
      blocks:
        - { kind: badge, icon: sparkle, text: { en: "Suggested this week", ar: "مقترح هذا الأسبوع" } }
        - { kind: listitem, icon: lamp, text: { en: "Ramadan lanterns · 50", ar: "فوانيس رمضان · 50" }, sub: { en: "Based on your sales", ar: "بناءً على مبيعاتك" }, value: { en: "Add", ar: "أضف" }, gap: s }
        - { kind: listitem, icon: package, text: { en: "Electric kettles · 10", ar: "غلايات كهربائية · 10" }, value: { en: "Add", ar: "أضف" } }
    options:
      - id: off
        text: { en: "Turn off suggestions forever", ar: "إيقاف الاقتراحات للأبد" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dukkani
          appbar: { title: { en: "Reorder", ar: "إعادة الطلب" }, back: true }
          blocks:
            - { kind: listitem, icon: sparkle, text: { en: "Reorder suggestions", ar: "اقتراحات إعادة الطلب" }, sub: { en: "Off for good", ar: "متوقّفة نهائيًا" }, toggle: false }
            - { kind: small, color: muted, text: { en: "You build every order by hand now.", ar: "أصبحت تُعدّ كل طلب بنفسك الآن." }, gap: s }
      - id: wait
        text: { en: "Keep ignoring it until it adjusts", ar: "أستمرّ في تجاهلها حتى تتعدّل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dukkani
          appbar: { title: { en: "Reorder", ar: "إعادة الطلب" }, back: true }
          blocks:
            - { kind: badge, icon: sparkle, text: { en: "Suggested this week", ar: "مقترح هذا الأسبوع" } }
            - { kind: listitem, icon: lamp, text: { en: "Ramadan lanterns · 50", ar: "فوانيس رمضان · 50" }, sub: { en: "Based on your sales", ar: "بناءً على مبيعاتك" }, value: { en: "Add", ar: "أضف" }, gap: s }
            - { kind: listitem, icon: package, text: { en: "Electric kettles · 10", ar: "غلايات كهربائية · 10" }, value: { en: "Add", ar: "أضف" } }
      - id: clear
        text: { en: "\"Ignore Ramadan sales in suggestions\", one tap", ar: "«تجاهل مبيعات رمضان في الاقتراحات»، بضغطة واحدة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dukkani
          appbar: { title: { en: "Reorder", ar: "إعادة الطلب" }, back: true }
          blocks:
            - { kind: badge, icon: sparkle, text: { en: "Suggested this week", ar: "مقترح هذا الأسبوع" } }
            - { kind: listitem, icon: lamp, text: { en: "Ramadan lanterns · 50", ar: "فوانيس رمضان · 50" }, sub: { en: "Based on your sales", ar: "بناءً على مبيعاتك" }, value: { en: "Add", ar: "أضف" }, gap: s }
            - { kind: listitem, icon: package, text: { en: "Electric kettles · 10", ar: "غلايات كهربائية · 10" }, value: { en: "Add", ar: "أضف" } }
            - { kind: button, style: outline, icon: moon-stars, text: { en: "Ignore Ramadan sales in suggestions", ar: "تجاهل مبيعات رمضان في الاقتراحات" }, gap: m }
    answer: [clear]
    misconceptions:
      - id: MC-P12-031
        when: [off, wait]
        feedback:
          en: "Turning it off loses useful suggestions, and waiting costs me weeks of wrong ones. I need to remove just the old pattern."
          ar: "الإيقاف يُضيّع اقتراحات مفيدة، والانتظار يكلّفني أسابيع من الاقتراحات الخطأ. أحتاج أن أحذف النمط القديم فقط."
    hints:
      - { en: "Are the suggestions useful the rest of the year?", ar: "هل الاقتراحات مفيدة في باقي السنة؟" }
      - { en: "Which option removes only what's out of date?", ar: "أي خيار يحذف فقط ما أصبح قديمًا؟" }
    correct:
      en: "Right. Let me erase just what's out of date."
      ar: "صحيح. اسمح لي بمسح ما أصبح قديمًا فقط."
    explain:
      en: "Good controls are precise: fix the one wrong pattern, keep the rest."
      ar: "أدوات التحكّم الجيدة دقيقة: تصلح النمط الخطأ وحده، وتحتفظ بالباقي."

  - id: S08
    type: card
    part: recap
    icons: [cut, layers, other, toggle, clock]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Controls, not perfection:** she needed to fix the album herself.\n- **Erased the past:** \"Don't make albums with this person\".\n- **Kept the manual way:** \"New album\" stays.\n- **Off from day one:** the first card offers to turn albums off.\n- **New case:** you let a shop owner ignore old Ramadan sales.\n\nNext lesson: ask for feedback people can give."
      ar: "- **أدوات تحكّم، لا كمال:** كانت تحتاج أن تصلح الألبوم بنفسها.\n- **مسحت الماضي:** «لا تصنع ألبومات مع هذا الشخص».\n- **احتفظت بالطريقة اليدوية:** «ألبوم جديد» يبقى.\n- **إيقاف من اليوم الأول:** البطاقة الأولى تعرض إيقاف الألبومات.\n- **حالة جديدة:** سمحت لصاحب متجر بتجاهل مبيعات رمضان القديمة.\n\nالدرس التالي: اطلب ملاحظات يستطيع الناس تقديمها."
