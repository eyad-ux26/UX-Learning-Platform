id: P12-U04-B01
mode: bank
title:
  en: "Re-tests: keep people in control"
  ar: "إعادة اختبار: اترك التحكّم للناس"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Feedback + Control (People + AI Guidebook)", ar: "الملاحظات والتحكّم (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/feedback-controls/"
steps:
  - id: S01
    type: tune
    skill: SK-P12-U04-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. Feedback + Control (People + AI): the manual method is a safe and useful fallback."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): الطريقة اليدوية بديل آمن ومفيد."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "As we mentioned in the Mental Models chapter, the manual method is a safe and useful fallback." }
    scenario:
      en: "Our gym app now books each member's weekly classes automatically. Some members still want to pick their own."
      ar: "تطبيق النادي أصبح يحجز حصص كل عضو الأسبوعية تلقائيًا. وما زال بعض الأعضاء يريدون اختيار حصصهم بأنفسهم."
    prompt:
      en: "What should we do with the \"Book a class\" button?"
      ar: "ماذا نفعل بزر «احجز حصة»؟"
    mock:
      app: nashat
      appbar:
        title: {en: My week, ar: أسبوعي}
      blocks:
      - kind: badge
        icon: sparkle
        text: {en: Booked for you, ar: حجزنا لك}
      - kind: listitem
        icon: calendar-check
        text:
          en: "Sun · Yoga 19:00"
          ar: "الأحد · يوجا 19:00"
        check: true
        gap: s
      - kind: listitem
        icon: calendar-check
        text:
          en: "Tue · Spinning 7:00"
          ar: "الثلاثاء · دراجات 7:00"
        check: true
      - kind: listitem
        icon: calendar-check
        text:
          en: "Thu · Boxing 20:00"
          ar: "الخميس · ملاكمة 20:00"
        check: true
      caption: {en: Now, ar: الآن}
    options:
      - id: remove
        text: {en: Remove it; auto-booking does the job, ar: نحذفه؛ فالحجز التلقائي يقوم بالمهمة}
        mock:
          app: nashat
          appbar:
            title: {en: My week, ar: أسبوعي}
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: Booked for you, ar: حجزنا لك}
          - kind: listitem
            icon: calendar-check
            text:
              en: "Sun · Yoga 19:00"
              ar: "الأحد · يوجا 19:00"
            check: true
            gap: s
          - kind: listitem
            icon: calendar-check
            text:
              en: "Tue · Spinning 7:00"
              ar: "الثلاثاء · دراجات 7:00"
            check: true
          - kind: listitem
            icon: calendar-check
            text:
              en: "Thu · Boxing 20:00"
              ar: "الخميس · ملاكمة 20:00"
            check: true
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: keep
        text:
          en: "Keep it on the home screen, next to the auto-booked classes"
          ar: نُبقيه في الشاشة الرئيسية، بجانب الحصص المحجوزة تلقائيًا
        mock:
          app: nashat
          appbar:
            title: {en: My week, ar: أسبوعي}
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: Booked for you, ar: حجزنا لك}
          - kind: listitem
            icon: calendar-check
            text:
              en: "Sun · Yoga 19:00"
              ar: "الأحد · يوجا 19:00"
            check: true
            gap: s
          - kind: listitem
            icon: calendar-check
            text:
              en: "Tue · Spinning 7:00"
              ar: "الثلاثاء · دراجات 7:00"
            check: true
          - kind: listitem
            icon: calendar-check
            text:
              en: "Thu · Boxing 20:00"
              ar: "الخميس · ملاكمة 20:00"
            check: true
          - kind: button
            text: {en: Book a class, ar: احجز حصة}
            icon: plus
            style: outline
            gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: hide
        text:
          en: "Hide it in a menu, so people use auto-booking"
          ar: نُخفيه في قائمة، ليستخدم الناس الحجز التلقائي
        mock:
          app: nashat
          appbar:
            title: {en: My week, ar: أسبوعي}
            actions:
            - icon: dots-three-vertical
              aria: {en: More, ar: المزيد}
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: Booked for you, ar: حجزنا لك}
          - kind: listitem
            icon: calendar-check
            text:
              en: "Sun · Yoga 19:00"
              ar: "الأحد · يوجا 19:00"
            check: true
            gap: s
          - kind: listitem
            icon: calendar-check
            text:
              en: "Tue · Spinning 7:00"
              ar: "الثلاثاء · دراجات 7:00"
            check: true
          - kind: listitem
            icon: calendar-check
            text:
              en: "Thu · Boxing 20:00"
              ar: "الخميس · ملاكمة 20:00"
            check: true
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [keep]
    misconceptions:
      - id: MC-P12-030
        when: [remove, hide]
        feedback:
          en: "Auto-booking will miss some weeks, like a trip or a new shift. Members need the manual way close at hand."
          ar: "الحجز التلقائي سيخطئ في بعض الأسابيع، مثل أسبوع سفر أو دوام جديد. والأعضاء يحتاجون الطريقة اليدوية قريبة منهم."
    correct:
      en: "Right. Keep the manual way in easy reach."
      ar: "صحيح. احتفظ بالطريقة اليدوية في متناول اليد."
    explain:
      en: "The AI saves time most weeks; the button saves the week it gets wrong."
      ar: "الذكاء الاصطناعي يوفّر الوقت في أغلب الأسابيع؛ والزر ينقذ الأسبوع الذي يخطئ فيه."

  - id: S02
    type: tune
    skill: SK-P12-U04-01
    part: retest
    speaker: sara
    value:
      en: "Re-test. Feedback + Control (People + AI): people need to control what the AI does, based on their situation."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): يحتاج الناس أن يتحكّموا فيما يفعله الذكاء الاصطناعي، حسب موقفهم."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "For your product to augment human tasks and processes, people need to be able to control what it does based on their situation." }
    scenario:
      en: "I'm designing a marketplace. AI writes a product description from the seller's photos, and publishes it right away."
      ar: "أصمّم سوقًا إلكترونيًا. والذكاء الاصطناعي يكتب وصف المنتج من صور البائع، وينشره فورًا."
    prompt:
      en: "What should change?"
      ar: "ماذا نغيّر حتى لا يُنشر وصف خطأ باسم البائع؟"
    mock:
      app:
        name: {en: Souq Sahl, ar: سوق سهل}
        color: "#9333EA"
        icon: storefront
        domain: souqsahl.example
      appbar:
        title: {en: Your listing, ar: إعلانك}
        back: true
      blocks:
      - {kind: image, art: laptop}
      - kind: badge
        tone: good
        icon: check-circle
        text: {en: Published, ar: منشور}
        gap: s
      - kind: text
        text:
          en: "✨ Like-new laptop, 16 GB RAM, perfect battery, no scratches…"
          ar: ✨ لابتوب شبه جديد، ذاكرة 16 جيجا، بطارية ممتازة، بلا خدوش…
        gap: xs
      - kind: small
        color: muted
        text: {en: Written by AI from your photos, ar: كتبه الذكاء الاصطناعي من صورك}
        gap: xs
      caption: {en: Now, ar: الآن}
    options:
      - id: draft
        text:
          en: "Show it as a draft the seller can edit, then publish"
          ar: نعرضه كمسوّدة يعدّلها البائع، ثم ينشرها
        mock:
          app:
            name: {en: Souq Sahl, ar: سوق سهل}
            color: "#9333EA"
            icon: storefront
            domain: souqsahl.example
          appbar:
            title: {en: Your listing, ar: إعلانك}
            back: true
          blocks:
          - {kind: image, art: laptop}
          - kind: badge
            tone: warn
            icon: pencil-simple
            text: {en: Draft, ar: مسوّدة}
            gap: s
          - kind: text
            text:
              en: "✨ Like-new laptop, 16 GB RAM, perfect battery, no scratches…"
              ar: ✨ لابتوب شبه جديد، ذاكرة 16 جيجا، بطارية ممتازة، بلا خدوش…
            gap: xs
          - kind: small
            color: muted
            text:
              en: "Written by AI from your photos. Check it, then publish."
              ar: كتبه الذكاء الاصطناعي من صورك. راجِعه، ثم انشره.
            gap: xs
          footer:
          - kind: row
            blocks:
            - kind: button
              text: {en: Edit, ar: عدّل}
              style: outline
            - kind: button
              text: {en: Publish, ar: انشر}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: report
        text:
          en: "Add a \"Report wrong description\" link after it's live"
          ar: نضيف رابط «أبلغ عن وصف خطأ» بعد نشره
        mock:
          app:
            name: {en: Souq Sahl, ar: سوق سهل}
            color: "#9333EA"
            icon: storefront
            domain: souqsahl.example
          appbar:
            title: {en: Your listing, ar: إعلانك}
            back: true
          blocks:
          - {kind: image, art: laptop}
          - kind: badge
            tone: good
            icon: check-circle
            text: {en: Published, ar: منشور}
            gap: s
          - kind: text
            text:
              en: "✨ Like-new laptop, 16 GB RAM, perfect battery, no scratches…"
              ar: ✨ لابتوب شبه جديد، ذاكرة 16 جيجا، بطارية ممتازة، بلا خدوش…
            gap: xs
          - kind: small
            color: muted
            text: {en: Written by AI from your photos, ar: كتبه الذكاء الاصطناعي من صورك}
            gap: xs
          - kind: link
            text: {en: Report wrong description, ar: أبلغ عن وصف خطأ}
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: better
        text: {en: Nothing; improve the AI instead, ar: لا شيء؛ نحسّن الذكاء الاصطناعي بدلًا من ذلك}
        mock:
          app:
            name: {en: Souq Sahl, ar: سوق سهل}
            color: "#9333EA"
            icon: storefront
            domain: souqsahl.example
          appbar:
            title: {en: Your listing, ar: إعلانك}
            back: true
          blocks:
          - {kind: image, art: laptop}
          - kind: badge
            tone: good
            icon: check-circle
            text: {en: Published, ar: منشور}
            gap: s
          - kind: text
            text:
              en: "✨ Like-new laptop, 16 GB RAM, perfect battery, no scratches…"
              ar: ✨ لابتوب شبه جديد، ذاكرة 16 جيجا، بطارية ممتازة، بلا خدوش…
            gap: xs
          - kind: small
            color: muted
            text: {en: Written by AI from your photos, ar: كتبه الذكاء الاصطناعي من صورك}
            gap: xs
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [draft]
    misconceptions:
      - id: MC-P12-030
        when: [report, better]
        feedback:
          en: "A wrong size or material goes live under the seller's name. Let them check and edit before anyone sees it."
          ar: "مقاس أو خامة خطأ تُنشر باسم البائع. اسمح له بالمراجعة والتعديل قبل أن يراها أحد."
    correct:
      en: "Right. AI drafts, people decide."
      ar: "صحيح. الذكاء الاصطناعي يكتب المسوّدة، والناس يقرّرون."
    explain:
      en: "The seller knows the product. A draft saves them time and keeps them in charge."
      ar: "البائع يعرف المنتج. والمسوّدة توفّر وقته وتبقيه صاحب القرار."

  - id: S03
    type: tune
    skill: SK-P12-U04-02
    part: retest
    speaker: nour
    value:
      en: "Re-test. Feedback + Control (People + AI): ask if people's needs may change so they'll need to reset the AI or take over from it."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): اسأل هل قد تتغيّر احتياجات الناس فيحتاجون إلى إعادة ضبط الذكاء الاصطناعي أو تولّي المهمة بدلًا منه."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Are there likely changes in the user’s needs that would require them to “reset” or otherwise “take over” for the model?" }
    scenario:
      en: "Our clinic has two branches. A patient moved to the other city. The app still fills in her old branch and her old doctor every time she books."
      ar: "عيادتنا لها فرعان. وانتقلت إحدى المريضات إلى المدينة الأخرى. وما زال التطبيق يملأ فرعها القديم وطبيبها القديم في كل حجز."
    prompt:
      en: "What should she be able to do?"
      ar: "ماذا يجب أن يتيح لها التطبيق؟"
    mock:
      app: raha
      appbar:
        title: {en: Book a visit, ar: احجز زيارة}
        back: true
      blocks:
      - kind: select
        label: {en: Branch, ar: الفرع}
        filled: true
        text: {en: Cairo · Nasr City, ar: القاهرة · مدينة نصر}
      - kind: select
        label: {en: Doctor, ar: الطبيب}
        filled: true
        text: {en: Dr. Ali Fathy, ar: د. علي فتحي}
        gap: s
      - kind: small
        color: muted
        text: {en: She now lives in Alexandria., ar: هي تعيش الآن في الإسكندرية.}
        gap: s
      footer:
      - kind: button
        text: {en: Continue, ar: تابع}
      caption: {en: Now, ar: الآن}
    options:
      - id: change
        text: {en: Change it each time she books, ar: تغيّر الفرع والطبيب في كل حجز}
        mock:
          app: raha
          appbar:
            title: {en: Book a visit, ar: احجز زيارة}
            back: true
          blocks:
          - kind: select
            label: {en: Branch, ar: الفرع}
            filled: true
            text: {en: Cairo · Nasr City, ar: القاهرة · مدينة نصر}
          - kind: select
            label: {en: Doctor, ar: الطبيب}
            filled: true
            text: {en: Dr. Ali Fathy, ar: د. علي فتحي}
            gap: s
          - kind: small
            color: muted
            text: {en: She now lives in Alexandria., ar: هي تعيش الآن في الإسكندرية.}
            gap: s
          footer:
          - kind: button
            text: {en: Continue, ar: تابع}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: call
        text: {en: Call the clinic to update it, ar: تتّصل بالعيادة لتحديث بياناتها}
        mock:
          app: raha
          appbar:
            title: {en: Book a visit, ar: احجز زيارة}
            back: true
          blocks:
          - kind: select
            label: {en: Branch, ar: الفرع}
            filled: true
            text: {en: Cairo · Nasr City, ar: القاهرة · مدينة نصر}
          - kind: select
            label: {en: Doctor, ar: الطبيب}
            filled: true
            text: {en: Dr. Ali Fathy, ar: د. علي فتحي}
            gap: s
          - kind: small
            color: muted
            text: {en: She now lives in Alexandria., ar: هي تعيش الآن في الإسكندرية.}
            gap: s
          footer:
          - kind: button
            text: {en: Continue, ar: تابع}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: update
        text:
          en: "\"I moved: forget my old branch and doctor\", in her profile"
          ar: "«انتقلت: انسَ فرعي وطبيبي القديمين»، في ملفّها"
        mock:
          app: raha
          appbar:
            title: {en: My profile, ar: ملفّي}
            back: true
          blocks:
          - kind: listitem
            text: {en: My branch, ar: فرعي}
            icon: map-pin
            sub: {en: Cairo · Nasr City, ar: القاهرة · مدينة نصر}
          - kind: listitem
            text: {en: My doctor, ar: طبيبي}
            icon: stethoscope
            sub: {en: Dr. Ali Fathy, ar: د. علي فتحي}
          - kind: button
            text:
              en: "I moved: forget my old branch and doctor"
              ar: "انتقلت: انسَ فرعي وطبيبي القديمين"
            style: outline
            icon: house-line
            gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [update]
    misconceptions:
      - id: MC-P12-031
        when: [change, call]
        feedback:
          en: "Her life changed once; fixing it every booking, or by phone, is a burden. Let her update what the app learned."
          ar: "حياتها تغيّرت مرة واحدة؛ وإصلاح ذلك في كل حجز، أو بالهاتف، عبء. اسمح لها بتحديث ما تعلّمه التطبيق."
    correct:
      en: "Right. One change, and it's updated."
      ar: "صحيح. تغيير واحد، ويتحدّث كل شيء."
    explain:
      en: "When life changes, people need to clear what the app learned, not fight it."
      ar: "حين تتغيّر الحياة، يحتاج الناس أن يمسحوا ما تعلّمه التطبيق، لا أن يقاوموه."

  - id: S04
    type: tune
    skill: SK-P12-U04-02
    part: retest
    speaker: rami
    value:
      en: "Re-test. Feedback + Control (People + AI): let people erase or update past choices, or reset to the default version."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): اسمح للناس بمسح الاختيارات السابقة أو تحديثها، أو العودة إلى النسخة الافتراضية."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Your product should allow for people to erase or update their previous selections, or reset your ML model to the default, non-personalized version." }
    scenario:
      en: "I'm designing a video app for families. A user's nephew used her phone for a week. Now her suggestions are all children's cartoons."
      ar: "أصمّم تطبيق فيديو للعائلات. واستخدم ابن أخ إحدى المستخدمات هاتفها لمدة أسبوع. والآن كل اقتراحاتها رسوم متحرّكة للأطفال."
    prompt:
      en: "What would help her most?"
      ar: "ما الذي يعيد اقتراحاتها كما كانت دون أن تخسر سجلّها؟"
    mock:
      app:
        name: {en: Mashahid, ar: مشاهد}
        color: "#AE3EC9"
        icon: music-notes
        domain: naghma.example
      appbar:
        title: {en: Home, ar: الرئيسية}
      blocks:
      - kind: heading
        text: {en: Made for you, ar: مختارة لك}
      - kind: listitem
        icon: music-note
        text: {en: Little Camel Adventures, ar: مغامرات الجمل الصغير}
        sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
      - kind: listitem
        icon: music-note
        text: {en: Counting with Bobo, ar: نعدّ مع بوبو}
        sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
      - kind: listitem
        icon: music-note
        text: {en: Learn the Letters, ar: تعلّم الحروف}
        sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
      caption: {en: Now, ar: الآن}
    options:
      - id: listen
        text: {en: Watch her own videos more until it changes, ar: تشاهد فيديوهاتها أكثر حتى يتغيّر}
        mock:
          app:
            name: {en: Mashahid, ar: مشاهد}
            color: "#AE3EC9"
            icon: music-notes
            domain: naghma.example
          appbar:
            title: {en: Home, ar: الرئيسية}
          blocks:
          - kind: heading
            text: {en: Made for you, ar: مختارة لك}
          - kind: listitem
            icon: music-note
            text: {en: Little Camel Adventures, ar: مغامرات الجمل الصغير}
            sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
          - kind: listitem
            icon: music-note
            text: {en: Counting with Bobo, ar: نعدّ مع بوبو}
            sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
          - kind: listitem
            icon: music-note
            text: {en: Learn the Letters, ar: تعلّم الحروف}
            sub: {en: Kids cartoons, ar: رسوم متحرّكة للأطفال}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: remove
        text:
          en: "In History, select that week → \"Don't use for suggestions\""
          ar: في السجلّ، تحدّد ذلك الأسبوع ← «لا تستخدمه في الاقتراحات»
        mock:
          app:
            name: {en: Mashahid, ar: مشاهد}
            color: "#AE3EC9"
            icon: music-notes
            domain: naghma.example
          appbar:
            title: {en: History, ar: السجلّ}
            back: true
          blocks:
          - kind: listitem
            text:
              en: "12 to 18 May"
              ar: "12 إلى 18 مايو"
            icon: calendar-blank
            sub:
              en: "46 kids videos"
