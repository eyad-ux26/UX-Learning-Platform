      en: "Re-test. Feedback + Control (People + AI): let people know what information is collected, what it's for, and how it benefits them."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): أخبر الناس ما المعلومات التي تُجمع، ولماذا، وكيف تفيدهم."
