        feedback:
          en: "Agreeing once isn't the end. People should be able to see what's recorded and change it, in the app."
          ar: "الموافقة مرة واحدة ليست النهاية. يجب أن يستطيع الناس رؤية ما يُسجَّل وتغييره، داخل التطبيق."
