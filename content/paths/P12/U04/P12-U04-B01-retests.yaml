              ar: لا تستخدمه في الاقتراحات
            style: outline
            gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: reset
        text:
          en: "Only \"Reset everything\", losing years of history"
          ar: فقط «أعِد ضبط كل شيء»، فتخسر سنوات من السجلّ
        mock:
          app:
            name: {en: Mashahid, ar: مشاهد}
            color: "#AE3EC9"
            icon: music-notes
            domain: naghma.example
          appbar:
            title: {en: Settings, ar: الإعدادات}
            back: true
          blocks:
          - kind: heading
            text: {en: Your history, ar: سجلّك}
          - kind: small
            text: {en: The only option deletes 4 years of history., ar: الخيار الوحيد يحذف 4 سنوات من السجلّ.}
            color: muted
            gap: xs
          - kind: button
            text: {en: Reset everything, ar: أعِد ضبط كل شيء}
            style: danger
            gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [remove]
    misconceptions:
      - id: MC-P12-031
        when: [listen, reset]
        feedback:
          en: "Waiting takes weeks, and a full reset throws away years of good history. Let her remove just that week."
          ar: "الانتظار يأخذ أسابيع، وإعادة الضبط الكاملة ترمي سنوات من السجلّ الجيد. اسمح لها بحذف ذلك الأسبوع فقط."
    correct:
      en: "Right. Erase just the wrong part."
      ar: "صحيح. امسح الجزء الخطأ فقط."
    explain:
      en: "Precise controls fix the mistake and keep everything else."
      ar: "أدوات التحكّم الدقيقة تصلح الخطأ وتحتفظ بكل شيء آخر."

  - id: S05
    type: tune
    skill: SK-P12-U04-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Feedback + Control (People + AI): thumbs up or down is clear, the two don't overlap, and \"meh\" isn't very useful."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): الإعجاب أو عدم الإعجاب واضح، والاثنان لا يتداخلان، و«عادي» ليست مفيدة كثيرًا."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "For example, thumbs up versus a thumbs down is unambiguous (“yay” or “nay”), mutually exclusive (not “yay and nay”), and covers the full range of useful opinions (“meh” isn’t very actionable)." }
    scenario:
      en: "After each delivery, my shop app asks: \"How was it? Amazing / Great / Good / Fine / OK\". I can't tell what to fix."
      ar: "بعد كل توصيل، يسأل تطبيق متجري: «كيف كان؟ رائع / ممتاز / جيد / مقبول / لا بأس». ولا أعرف ما الذي يجب إصلاحه."
    prompt:
      en: "What should it ask?"
      ar: "ماذا يسأل التطبيق لأعرف ما الذي يجب إصلاحه؟"
    mock:
      app: dar
      appbar:
        title: {en: Order delivered, ar: وصل طلبك}
        back: true
      blocks:
      - kind: listitem
        art: earbuds
        text: {en: Wireless earbuds, ar: سماعات لاسلكية}
        sub: {en: Delivered today, ar: وصلت اليوم}
      overlay:
        type: sheet
        title:
          en: "How was it?"
          ar: كيف كان؟
        blocks:
        - kind: chips
          items:
          - text: {en: Amazing, ar: رائع}
          - text: {en: Great, ar: ممتاز}
          - text: {en: Good, ar: جيد}
          - text: {en: Fine, ar: مقبول}
          - text: {en: OK, ar: لا بأس}
      caption: {en: Now, ar: الآن}
    options:
      - id: more
        text:
          en: "Add \"Excellent\" and \"Bad\" to the list"
          ar: نضيف «ممتاز جدًا» و«سيئ» إلى القائمة
        mock:
          app: dar
          appbar:
            title: {en: Order delivered, ar: وصل طلبك}
            back: true
          blocks:
          - kind: listitem
            art: earbuds
            text: {en: Wireless earbuds, ar: سماعات لاسلكية}
            sub: {en: Delivered today, ar: وصلت اليوم}
          overlay:
            type: sheet
            title:
              en: "How was it?"
              ar: كيف كان؟
            blocks:
            - kind: chips
              items:
              - text: {en: Excellent, ar: ممتاز جدًا}
              - text: {en: Amazing, ar: رائع}
              - text: {en: Great, ar: ممتاز}
              - text: {en: Good, ar: جيد}
              - text: {en: Fine, ar: مقبول}
              - text: {en: OK, ar: لا بأس}
              - text: {en: Bad, ar: سيئ}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: stars
        text: {en: Use 10 stars instead, ar: نستخدم 10 نجوم بدلًا منها}
        mock:
          app: dar
          appbar:
            title: {en: Order delivered, ar: وصل طلبك}
            back: true
          blocks:
          - kind: listitem
            art: earbuds
            text: {en: Wireless earbuds, ar: سماعات لاسلكية}
            sub: {en: Delivered today, ar: وصلت اليوم}
          overlay:
            type: sheet
            title:
              en: "How was it?"
              ar: كيف كان؟
            blocks:
            - kind: heading
              text: {en: ☆☆☆☆☆☆☆☆☆☆, ar: ☆☆☆☆☆☆☆☆☆☆}
            - kind: small
              text: {en: Tap 1 to 10 stars, ar: اضغط من 1 إلى 10 نجوم}
              color: muted
              gap: xs
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: clear
        text:
          en: "\"Did it arrive OK? \U0001F44D Yes / \U0001F44E There was a problem\""
          ar: «هل وصل الطلب بخير؟ 👍 نعم / 👎 كانت هناك مشكلة»
        mock:
          app: dar
          appbar:
            title: {en: Order delivered, ar: وصل طلبك}
            back: true
          blocks:
          - kind: listitem
            art: earbuds
            text: {en: Wireless earbuds, ar: سماعات لاسلكية}
            sub: {en: Delivered today, ar: وصلت اليوم}
          overlay:
            type: sheet
            title:
              en: "Did it arrive OK?"
              ar: هل وصل الطلب بخير؟
            blocks:
            - kind: button
              text: {en: 👍 Yes, ar: 👍 نعم}
              style: outline
            - kind: button
              text: {en: 👎 There was a problem, ar: 👎 كانت هناك مشكلة}
              style: outline
              gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [clear]
    misconceptions:
      - id: MC-P12-032
        when: [more, stars]
        feedback:
          en: "More levels only add overlap. Two clear answers tell me at once which orders need a look."
          ar: "المستويات الإضافية تزيد التداخل فقط. والإجابتان الواضحتان تقولان لي فورًا أي الطلبات تحتاج مراجعة."
    correct:
      en: "Right. Two clear, separate answers."
      ar: "صحيح. إجابتان واضحتان ومنفصلتان."
    explain:
      en: "\"There was a problem\" is something I can act on; \"Fine\" vs \"OK\" isn't."
      ar: "«كانت هناك مشكلة» شيء أستطيع أن أتصرّف بناءً عليه؛ أما الفرق بين «مقبول» و«لا بأس» فلا."

  - id: S06
    type: tune
    skill: SK-P12-U04-03
    part: retest
    speaker: mona
    value:
      en: "Re-test. Feedback + Control (People + AI): use the right voice and tone for the kind of feedback you're asking for."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): استخدم الصوت والأسلوب المناسبين لنوع الملاحظات التي تطلبها."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "It’s also important that your wording choices hit the appropriate voice and tone for the type of feedback you’re requesting, and avoid words or references that can be interpreted as offensive." }
    scenario:
      en: "Our bank app blocked a card payment as possible fraud. Now we ask the customer if we were right."
      ar: "تطبيق بنكنا أوقف دفعة بالبطاقة لاحتمال احتيال. والآن نسأل العميل إن كنّا على حق."
    prompt:
      en: "Which question should we use?"
      ar: "أي سؤال نطرحه على عميل ربما سُرق ماله؟"
    mock:
      screen: lock
      blocks:
      - kind: notification
        app: rasid
        title: {en: Payment blocked, ar: أوقفنا الدفعة}
        text:
          en: "3,200 EGP at an online store looked unusual."
          ar: "3,200 جنيه في متجر إلكتروني بدت غير معتادة."
        time: {en: now, ar: الآن}
      caption: {en: Now, ar: الآن}
    options:
      - id: plain
        text:
          en: "\"Was this payment yours? Yes, it was me / No, I didn't make it\""
          ar: «هل كانت هذه الدفعة منك؟ نعم، مني / لا، ليست مني»
        mock:
          screen: lock
          blocks:
          - kind: notification
            app: rasid
            title:
              en: "Was this payment yours?"
              ar: هل كانت هذه الدفعة منك؟
            text:
              en: "3,200 EGP at an online store. Yes, it was me / No, I didn't make it"
              ar: "3,200 جنيه في متجر إلكتروني. نعم، مني / لا، ليست مني"
            time: {en: now, ar: الآن}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: joke
        text:
          en: "\"Oops! \U0001F648 Did we goof? Yep \U0001F605 / Nope\""
          ar: "«أوبس! \U0001F648 هل أخطأنا؟ نعم \U0001F605 / لا»"
        mock:
          screen: lock
          blocks:
          - kind: notification
            app: rasid
            title:
              en: "Oops! \U0001F648 Did we goof?"
              ar: "أوبس! \U0001F648 هل أخطأنا؟"
            text:
              en: "3,200 EGP at an online store. Yep \U0001F605 / Nope"
              ar: "3,200 جنيه في متجر إلكتروني. نعم \U0001F605 / لا"
            time: {en: now, ar: الآن}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: blame
        text:
          en: "\"Did you make a suspicious payment?\""
          ar: «هل قمت بدفعة مشبوهة؟»
        mock:
          screen: lock
          blocks:
          - kind: notification
            app: rasid
            title:
              en: "Did you make a suspicious payment?"
              ar: هل قمت بدفعة مشبوهة؟
            text:
              en: "3,200 EGP at an online store."
              ar: "3,200 جنيه في متجر إلكتروني."
            time: {en: now, ar: الآن}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [plain]
    misconceptions:
      - id: MC-P12-037
        when: [joke, blame]
        feedback:
          en: "Someone may have stolen their money: a joke feels careless, and \"suspicious\" sounds like an accusation. Ask plainly."
          ar: "ربما سُرق مال العميل: النكتة تبدو استهتارًا، و«مشبوهة» تبدو اتهامًا. اسأل ببساطة."
    correct:
      en: "Right. Plain, calm and neutral."
      ar: "صحيح. بسيط وهادئ ومحايد."
    explain:
      en: "The right tone makes people feel safe giving an honest answer."
      ar: "الأسلوب المناسب يجعل الناس يشعرون بالأمان ليجيبوا بصدق."

  - id: S07
    type: choose
    skill: SK-P12-U04-04
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Feedback + Control (People + AI): there isn't always a clear link between what people do and what they want from the AI."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): لا توجد دائمًا علاقة واضحة بين ما يفعله الناس وما يريدونه من الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Feedback like this can be confusing because there isn’t always a clear link between what a user does and what a user wants from the AI model." }
    scenario:
      en: "In our grocery app, a man with no children bought diapers once, as a gift. Now his home screen is full of baby products."
      ar: "في تطبيق البقالة عندنا، اشترى رجل ليس لديه أطفال حفاضات مرة واحدة، كهدية. والآن شاشته الرئيسية مليئة بمنتجات الأطفال."
    prompt:
      en: "What should the app do?"
      ar: "ماذا يفعل التطبيق بعد عملية شراء واحدة كانت هدية؟"
    mock:
      app: sallah
      appbar: { logo: true, actions: [ { icon: basket, aria: { en: "Basket", ar: "السلة" } } ] }
      blocks:
        - { kind: heading, text: { en: "Picked for you", ar: "اخترناه لك" } }
        - { kind: listitem, icon: baby, text: { en: "Diapers, size 3", ar: "حفاضات، مقاس 3" }, value: { en: "320 EGP", ar: "320 جنيه" } }
        - { kind: listitem, icon: baby, text: { en: "Baby wipes", ar: "مناديل أطفال" }, value: { en: "60 EGP", ar: "60 جنيه" } }
        - { kind: listitem, icon: baby, text: { en: "Baby formula", ar: "حليب أطفال" }, value: { en: "410 EGP", ar: "410 جنيه" } }
    options:
      - { id: more, text: { en: "Keep showing baby products; he bought them", ar: "يستمرّ في عرض منتجات الأطفال؛ فقد اشتراها" } }
      - { id: ask, text: { en: "Wait for more than one purchase, and offer \"Bought this as a gift? Don't use it for suggestions\"", ar: "ينتظر أكثر من عملية شراء، ويعرض «اشتريتها كهدية؟ لا تستخدمها في الاقتراحات»" } }
      - { id: never, text: { en: "Never use purchases for suggestions", ar: "لا يستخدم المشتريات في الاقتراحات أبدًا" } }
    answer: [ask]
    misconceptions:
      - id: MC-P12-033
        when: [more, never]
        feedback:
          en: "One purchase isn't a pattern, but purchases are still useful. Don't jump on one, and let him say it was a gift."
          ar: "عملية شراء واحدة ليست نمطًا، لكن المشتريات تبقى مفيدة. لا تتسرّع بسبب عملية واحدة، واسمح له أن يقول إنها هدية."
    correct:
      en: "Right. Don't build a picture on one action."
      ar: "صحيح. لا تبنِ صورة كاملة على فعل واحد."
    explain:
      en: "A gift, a one-off or a mistake all look like interest. Wait, or ask."
      ar: "الهدية، والشراء لمرة واحدة، والخطأ، كلها تبدو اهتمامًا. انتظر، أو اسأل."

  - id: S08
    type: choose
    skill: SK-P12-U04-04
    part: retest
    speaker: karim
    value:
      en: "Re-test. Feedback + Control (People + AI): consider carefully how you'll use what people do to tune the AI."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): فكّر جيدًا في طريقة استخدام ما يفعله الناس لضبط الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "In these cases, it’s important to consider how you’ll use the implicit signal for model tuning." }
    scenario:
      en: "I'm building a health articles app. A user reads many articles about diabetes, because her father has it. The app starts treating her as diabetic, with diet warnings on every recipe."
      ar: "أبني تطبيقًا لمقالات الصحة. وتقرأ إحدى المستخدمات مقالات كثيرة عن السكّري، لأن والدها مصاب به. فيبدأ التطبيق بمعاملتها كمريضة سكّري، مع تحذيرات غذائية على كل وصفة."
    prompt:
      en: "What should the app do?"
      ar: "ماذا يجب أن يفعل التطبيق؟"
    mock:
      app: { name: { en: "Sehha", ar: "صحّة" }, color: "#0891B2", icon: heartbeat, domain: sehha.example }
      appbar: { title: { en: "Recipes", ar: "الوصفات" } }
      blocks:
        - { kind: listitem, art: food-salad, text: { en: "Fattoush salad", ar: "سلطة فتّوش" } }
        - { kind: banner, tone: warn, icon: warning, text: { en: "For your diabetes: watch the bread.", ar: "لأنك مصابة بالسكري: انتبهي للخبز." }, gap: xs }
        - { kind: small, color: muted, text: { en: "She reads about diabetes for her father. She is not diabetic.", ar: "هي تقرأ عن السكري من أجل والدها. وهي ليست مريضة سكري." }, gap: s }
    options:
      - { id: assume, text: { en: "Keep the warnings; reading means it's about her", ar: "يُبقي التحذيرات؛ فالقراءة تعني أن الأمر يخصّها" } }
      - { id: ask, text: { en: "Suggest more diabetes articles, but ask before changing anything about her: \"Reading for yourself or someone else?\"", ar: "يقترح مقالات أكثر عن السكّري، لكن يسأل قبل تغيير أي شيء يخصّها: «تقرئين لنفسك أم لشخص آخر؟»" } }
      - { id: stop, text: { en: "Stop suggesting diabetes articles", ar: "يتوقّف عن اقتراح مقالات السكّري" } }
    answer: [ask]
    misconceptions:
      - id: MC-P12-033
        when: [assume, stop]
        feedback:
          en: "Reading shows interest in the topic, not that she has it. Keep the articles, and ask before acting on her health."
          ar: "القراءة تدلّ على الاهتمام بالموضوع، لا على أنها مصابة. احتفظ بالمقالات، واسأل قبل أي تصرّف يخصّ صحّتها."
    correct:
      en: "Right. Interest isn't the same as identity."
      ar: "صحيح. الاهتمام بموضوع لا يعني أنه يخصّها."
    explain:
      en: "Use the signal for what it shows, and ask about the rest."
      ar: "استخدم الإشارة فيما تدلّ عليه، واسأل عن الباقي."

