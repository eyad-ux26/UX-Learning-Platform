          appbar: {logo: true}
          blocks:
          - kind: card
            blocks:
            - kind: small
              color: muted
              text: {en: Current account, ar: الحساب الجاري}
            - kind: price
              text:
                en: "12,400 EGP"
                ar: "12,400 جنيه"
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: vague
        text:
          en: "\"We use data to improve your experience.\""
          ar: «نستخدم البيانات لتحسين تجربتك.»
        mock:
          app: rasid
          appbar: {logo: true}
          blocks:
          - kind: card
            blocks:
            - kind: small
              color: muted
              text: {en: Current account, ar: الحساب الجاري}
            - kind: price
              text:
                en: "12,400 EGP"
                ar: "12,400 جنيه"
          - kind: banner
            text: {en: We use data to improve your experience., ar: نستخدم البيانات لتحسين تجربتك.}
            tone: neutral
            icon: info
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [tell]
    misconceptions:
      - id: MC-P12-034
        when: [nothing, vague]
        feedback:
          en: "Money apps need trust most. Say exactly what you record, why, and what customers get, and let them choose."
          ar: "تطبيقات المال تحتاج الثقة أكثر من غيرها. قل بالضبط ماذا تسجّل، ولماذا، وماذا يستفيد العملاء، واتركهم يختارون."
    correct:
      en: "Right. What, why, and what's in it for them."
      ar: "صحيح. ماذا، ولماذا، وما الفائدة لهم."
    explain:
      en: "\"Improve your experience\" says nothing. A specific benefit earns a real yes."
      ar: "«تحسين تجربتك» لا تقول شيئًا. والفائدة المحدّدة تكسب موافقة حقيقية."

  - id: S10
    type: tune
    skill: SK-P12-U04-05
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Feedback + Control (People + AI): always give a way to see, and ideally edit, the data collected."
      ar: "إعادة اختبار. الملاحظات والتحكّم (People + AI): أعطِ دائمًا طريقة لرؤية البيانات التي جُمعت، ويُفضّل تعديلها."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Always provide a way to see, and ideally edit, data collected." }
    scenario:
      en: "My shop app records the products each customer looks at, to suggest others. Customers agreed at sign-up."
      ar: "تطبيق متجري يسجّل المنتجات التي ينظر إليها كل عميل، ليقترح غيرها. وقد وافق العملاء عند التسجيل."
    prompt:
      en: "What else should the app offer?"
      ar: "ماذا يقدّم التطبيق أيضًا ليبقى العميل متحكّمًا في بياناته؟"
