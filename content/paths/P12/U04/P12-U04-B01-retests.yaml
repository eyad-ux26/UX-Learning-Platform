            check: true
          - kind: listitem
            text:
              en: "5 to 11 May"
              ar: "5 إلى 11 مايو"
            icon: calendar-blank
            sub:
              en: "Cooking, travel"
              ar: طبخ، سفر
          - kind: button
            text:
