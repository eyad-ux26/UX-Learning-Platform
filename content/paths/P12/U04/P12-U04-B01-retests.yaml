        mock:
          app: rasid
          appbar: {logo: true}
          blocks:
          - kind: card
            blocks:
            - kind: small
              color: muted
              text: {en: Current account, ar: الحساب الجاري}
            - kind: price
              text:
                en: "12,400 EGP"
                ar: "12,400 جنيه"
          overlay:
            type: sheet
            title:
              en: "Put your favourite actions first?"
