id: P12-U04-L04
mode: check
minutes: 6
title:
  en: "Skill check: keep people in control"
  ar: "اختبار المهارة: اترك التحكّم للناس"
summary:
  en: "Review the controls in an email app that sorts mail into Important and Other, on your own."
  ar: "راجِع أدوات التحكّم في تطبيق بريد يصنّف الرسائل إلى «مهمّ» و«أخرى»، بنفسك."
speaker: karim
sources:
  - title: { en: "Feedback + Control (People + AI Guidebook)", ar: "الملاحظات والتحكّم (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/feedback-controls/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Karim's review", ar: "مراجعة كريم" }
    body:
      en: "I build the front end of a work email app. A new feature sorts your mail into \"Important\" and \"Other\" by itself. I'm reviewing it before launch.\n\nYour job: check five parts.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أبني واجهة تطبيق بريد للعمل. وميزة جديدة تصنّف رسائلك إلى «مهمّ» و«أخرى» بنفسها. وأراجعها قبل الإطلاق.\n\nمهمّتك: افحص خمسة أجزاء.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: bareed
      appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 1 }
        - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
        - { kind: listitem, avatar: { text: "Deals" }, text: { en: "Deals Weekly", ar: "عروض الأسبوع" }, sub: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" }, value: "8:40" }

  - id: S02
    type: tune
    skill: SK-P12-U04-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Feedback + Control (People + AI): let people adapt the result, edit it, or turn it off."
      ar: "اختبار مهارة. الملاحظات والتحكّم (People + AI): اسمح للناس بتكييف النتيجة، أو تعديلها، أو إيقافها."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Your product won’t be perfect for every user, every time, so allow users to adapt the output to their needs, edit it, or turn it off." }
    scenario:
      en: "An urgent email from a client landed in \"Other\"."
      ar: "رسالة عاجلة من عميل وصلت إلى «أخرى»."
    prompt:
      en: "Tap each option to see it. What should people be able to do?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يستطيع الناس فعله؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: bareed
      appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 1 }
        - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
        - { kind: listitem, avatar: { text: "Deals" }, text: { en: "Deals Weekly", ar: "عروض الأسبوع" }, sub: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" }, value: "8:40" }
    options:
      - id: report
        text: { en: "Fill in a form to report the mistake", ar: "ملء نموذج للإبلاغ عن الخطأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 1 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: listitem, avatar: { text: "Deals" }, text: { en: "Deals Weekly", ar: "عروض الأسبوع" }, sub: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" }, value: "8:40" }
          overlay:
            type: full
            title: { en: "Report a sorting mistake", ar: "أبلغ عن خطأ في التصنيف" }
            blocks:
              - { kind: field, label: { en: "Email subject", ar: "موضوع الرسالة" }, text: "" }
              - { kind: field, label: { en: "What went wrong?", ar: "ما الخطأ؟" }, text: "", gap: s }
              - { kind: button, text: { en: "Send report", ar: "أرسل البلاغ" }, gap: s }
      - id: move
        text: { en: "\"Move to Important\" on the email, and a setting to turn sorting off", ar: "«انقل إلى مهمّ» على الرسالة، وإعداد لإيقاف التصنيف" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 1 }
            - { kind: small, color: muted, text: { en: "Settings › Sorting: On / Off", ar: "الإعدادات › التصنيف: تشغيل / إيقاف" }, gap: xs }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12", swipe: { text: { en: "Move to Important", ar: "انقل إلى مهمّ" }, tone: brand } }
            - { kind: listitem, avatar: { text: "Deals" }, text: { en: "Deals Weekly", ar: "عروض الأسبوع" }, sub: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" }, value: "8:40" }
      - id: nothing
        text: { en: "Nothing; it will learn in time", ar: "لا شيء؛ سيتعلّم مع الوقت" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 1 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: listitem, avatar: { text: "Deals" }, text: { en: "Deals Weekly", ar: "عروض الأسبوع" }, sub: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" }, value: "8:40" }
    answer: [move]
    misconceptions:
      - id: MC-P12-030
        when: [report, nothing]
        feedback:
          en: "A missed client email can't wait. People need to fix it in one tap, and switch sorting off if it keeps failing them."
          ar: "رسالة العميل الضائعة لا تحتمل الانتظار. الناس يحتاجون إصلاحها بضغطة واحدة، وإيقاف التصنيف إذا ظلّ يخذلهم."
    explain:
      en: "From Lesson 1: give people a way to fix it, and to turn it off."
      ar: "من الدرس 1: أعطِ الناس طريقة لإصلاحه، ولإيقافه."

  - id: S03
    type: tune
    skill: SK-P12-U04-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Feedback + Control (People + AI): let people adjust their past feedback and reset the system."
      ar: "اختبار مهارة. الملاحظات والتحكّم (People + AI): اسمح للناس بتعديل ملاحظاتهم السابقة وإعادة ضبط النظام."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Allow users to adjust their prior feedback and reset the system." }
    scenario:
      en: "A user changed teams. Mail from her old team still lands in \"Important\", and her new team's mail goes to \"Other\"."
      ar: "مستخدمة انتقلت إلى فريق آخر. وما زالت رسائل فريقها القديم تصل إلى «مهمّ»، ورسائل فريقها الجديد تذهب إلى «أخرى»."
    prompt:
      en: "Tap each option to see it. What should she be able to do?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن تستطيع أن تفعل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: bareed
      appbar: { title: { en: "Sorting", ar: "التصنيف" }, back: true }
      blocks:
        - { kind: listitem, icon: sparkle, text: { en: "Sort my mail", ar: "صنّف بريدي" }, toggle: true }
    options:
      - id: wait
        text: { en: "Move emails one by one for a few weeks until it learns", ar: "تنقل الرسائل واحدة واحدة لبضعة أسابيع حتى يتعلّم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Sorting", ar: "التصنيف" }, back: true }
          blocks:
            - { kind: listitem, icon: sparkle, text: { en: "Sort my mail", ar: "صنّف بريدي" }, toggle: true }
            - { kind: small, color: muted, text: { en: "Tip: keep moving emails. Sorting learns in a few weeks.", ar: "نصيحة: استمر في نقل الرسائل. التصنيف يتعلّم خلال بضعة أسابيع." }, gap: s }
      - id: new
        text: { en: "Make a new account", ar: "تنشئ حسابًا جديدًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Sorting", ar: "التصنيف" }, back: true }
          blocks:
            - { kind: listitem, icon: sparkle, text: { en: "Sort my mail", ar: "صنّف بريدي" }, toggle: true }
            - { kind: listitem, icon: user-plus, text: { en: "Add another account", ar: "أضف حسابًا آخر" }, chevron: true }
      - id: reset
        text: { en: "\"Reset what sorting learned\" in Settings, and start fresh", ar: "«أعِد ضبط ما تعلّمه التصنيف» في الإعدادات، وتبدأ من جديد" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Sorting", ar: "التصنيف" }, back: true }
          blocks:
            - { kind: listitem, icon: sparkle, text: { en: "Sort my mail", ar: "صنّف بريدي" }, toggle: true }
            - { kind: listitem, icon: arrow-counter-clockwise, text: { en: "Reset what sorting learned", ar: "أعِد ضبط ما تعلّمه التصنيف" }, sub: { en: "Start fresh", ar: "ابدأ من جديد" }, chevron: true }
    answer: [reset]
    misconceptions:
      - id: MC-P12-031
        when: [wait, new]
        feedback:
          en: "Her work changed overnight. Weeks of fixing, or a new account, is too much. Let her clear the old learning."
          ar: "عملها تغيّر بين ليلة وضحاها. وأسابيع من التصحيح، أو حساب جديد، أكثر من اللازم. اسمح لها بمسح التعلّم القديم."
    explain:
      en: "From Lesson 1: when needs change, let people erase what it learned."
      ar: "من الدرس 1: حين تتغيّر الاحتياجات، اسمح للناس بمسح ما تعلّمه."

  - id: S04
    type: tune
    skill: SK-P12-U04-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Feedback + Control (People + AI): feedback questions and answers should be easy to understand."
      ar: "اختبار مهارة. الملاحظات والتحكّم (People + AI): أسئلة الملاحظات وإجاباتها يجب أن تكون سهلة الفهم."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "The question and answer choices you provide in explicit feedback should be easy for users to understand." }
    scenario:
      en: "When someone moves an email to Important, we can ask one quick question."
      ar: "حين ينقل شخص رسالة إلى «مهمّ»، نستطيع أن نسأل سؤالًا سريعًا واحدًا."
    prompt:
      en: "Tap each option to see it. Which question is best?"
      ar: "اضغط على كل خيار لتراه. أي سؤال هو الأفضل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: bareed
      appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
        - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
        - { kind: listitem, avatar: { text: "Hany" }, text: { en: "Hany", ar: "هاني" }, sub: { en: "Budget review", ar: "مراجعة الميزانية" }, value: "8:02" }
      overlay:
        type: toast
        blocks:
          - { kind: small, text: { en: "Moved to Important", ar: "نُقلت إلى مهمّ" } }
    options:
      - id: clear
        text: { en: "\"Always mark mail from this sender as Important?\" Yes / Just this once", ar: "«هل نصنّف رسائل هذا المرسِل دائمًا كمهمّة؟» نعم / هذه المرة فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: listitem, avatar: { text: "Hany" }, text: { en: "Hany", ar: "هاني" }, sub: { en: "Budget review", ar: "مراجعة الميزانية" }, value: "8:02" }
          overlay:
            type: toast
            blocks:
              - { kind: small, text: { en: "Always mark mail from this sender as Important?", ar: "هل نصنّف رسائل هذا المرسِل دائمًا كمهمّة؟" } }
              - { kind: row, blocks: [ { kind: button, style: text, text: { en: "Yes", ar: "نعم" } }, { kind: button, style: text, text: { en: "Just this once", ar: "هذه المرة فقط" } } ] }
      - id: scale
        text: { en: "\"Rate our sorting from 1 to 10\"", ar: "«قيّم التصنيف من 1 إلى 10»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: listitem, avatar: { text: "Hany" }, text: { en: "Hany", ar: "هاني" }, sub: { en: "Budget review", ar: "مراجعة الميزانية" }, value: "8:02" }
          overlay:
            type: toast
            blocks:
              - { kind: small, text: { en: "Rate our sorting from 1 to 10", ar: "قيّم التصنيف من 1 إلى 10" } }
      - id: vague
        text: { en: "\"Was this helpful? Yes / Somewhat / Kind of / No\"", ar: "«هل كان هذا مفيدًا؟ نعم / إلى حدّ ما / نوعًا ما / لا»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: listitem, avatar: { text: "Hany" }, text: { en: "Hany", ar: "هاني" }, sub: { en: "Budget review", ar: "مراجعة الميزانية" }, value: "8:02" }
          overlay:
            type: toast
            blocks:
              - { kind: small, text: { en: "Was this helpful? Yes / Somewhat / Kind of / No", ar: "هل كان هذا مفيدًا؟ نعم / إلى حدّ ما / نوعًا ما / لا" } }
    answer: [clear]
    misconceptions:
      - id: MC-P12-032
        when: [scale, vague]
        feedback:
          en: "A score says nothing about what to change, and \"Somewhat\" and \"Kind of\" overlap. Ask one clear question with two clear answers."
          ar: "الدرجة لا تقول شيئًا عمّا يجب تغييره، و«إلى حدّ ما» و«نوعًا ما» متداخلتان. اسأل سؤالًا واحدًا واضحًا بإجابتين واضحتين."
    explain:
      en: "From Lesson 2: simple, separate choices in people's words."
      ar: "من الدرس 2: خيارات بسيطة ومنفصلة بكلمات الناس."

  - id: S05
    type: choose
    skill: SK-P12-U04-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Feedback + Control (People + AI): people may open something to dismiss it, or out of passing curiosity."
      ar: "اختبار مهارة. الملاحظات والتحكّم (People + AI): قد يفتح الناس شيئًا ليتخلّصوا منه، أو بدافع فضول عابر."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "They could be trying to dismiss it — or giving in to a temporary curiosity." }
    scenario:
      en: "Many people open every promo email, just to find the \"Unsubscribe\" link. The team wants to count each open as \"this is important\"."
      ar: "كثير من الناس يفتحون كل رسالة ترويجية، فقط ليجدوا رابط «إلغاء الاشتراك». والفريق يريد اعتبار كل فتح أنه «هذه مهمّة»."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    mock:
      app: bareed
      appbar: { title: { en: "Deals Weekly", ar: "عروض الأسبوع" }, back: true }
      blocks:
        - { kind: heading, text: { en: "50% off this weekend", ar: "خصم 50% هذا الأسبوع" } }
        - { kind: image, art: shelf, gap: s }
        - { kind: link, text: { en: "Unsubscribe", ar: "إلغاء الاشتراك" }, gap: m }
        - { kind: small, color: muted, text: { en: "Many people open this email only to find this link.", ar: "كثيرون يفتحون هذه الرسالة فقط ليجدوا هذا الرابط." }, gap: xs }
    options:
      - { id: count, text: { en: "Count every open as important", ar: "نعتبر كل فتح أنه مهمّ" } }
      - { id: clear, text: { en: "Don't treat opens as \"important\". Learn from clear signals, like replies and moves to Important.", ar: "لا نعتبر الفتح «مهمًّا». نتعلّم من الإشارات الواضحة، مثل الردود والنقل إلى «مهمّ»." } }
      - { id: double, text: { en: "Count opens twice as much as replies", ar: "نعطي الفتح وزنًا ضعف الردود" } }
    answer: [clear]
    misconceptions:
      - id: MC-P12-033
        when: [count, double]
        feedback:
          en: "Opening a promo to unsubscribe means the opposite of \"important\". Counting it would fill Important with ads."
          ar: "فتح رسالة ترويجية لإلغاء الاشتراك يعني عكس «مهمّ». واعتباره كذلك سيملأ «مهمّ» بالإعلانات."
    explain:
      en: "From Lesson 2: one action can mean many things. Learn from clear signals."
      ar: "من الدرس 2: الفعل الواحد قد يعني أشياء كثيرة. تعلّم من الإشارات الواضحة."

  - id: S06
    type: tune
    skill: SK-P12-U04-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. Feedback + Control (People + AI): tell people where they can see their data and change data settings, ideally in context."
      ar: "اختبار مهارة. الملاحظات والتحكّم (People + AI): أخبر الناس أين يرون بياناتهم ويغيّرون إعدادات جمعها، ويُفضّل في مكان استخدامها."
    ref: { url: "https://pair.withgoogle.com/chapter/feedback-controls/", quote: "Let the user know where they can see their data and where they can change data-collection settings." }
    scenario:
      en: "Sorting learns from who you reply to and how fast. Right now, nothing in the app says so."
      ar: "التصنيف يتعلّم ممّن تردّ عليهم وبأي سرعة. وحاليًا، لا شيء في التطبيق يقول ذلك."
    prompt:
      en: "Tap each option to see it. What should we add?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن نضيف؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: bareed
      appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
        - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
    options:
      - id: privacy
        text: { en: "A paragraph in the privacy policy", ar: "فقرة في سياسة الخصوصية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
            - { kind: small, color: muted, text: { en: "(Explained in paragraph 14 of the privacy policy)", ar: "(مشروح في الفقرة 14 من سياسة الخصوصية)" }, gap: m }
      - id: badge
        text: { en: "An \"AI-powered\" badge on the Important tab", ar: "شارة «يعمل بالذكاء الاصطناعي» على تبويب «مهمّ»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" } }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4) ✨ AI-powered", ar: "مهمّ (4) ✨ بالذكاء الاصطناعي" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
      - id: line
        text: { en: "A line at the top of Important: \"Sorted using who you reply to. See or change in Settings › Sorting\"", ar: "سطر أعلى «مهمّ»: «مصنّف حسب من تردّ عليهم. اعرضه أو غيّره في الإعدادات › التصنيف»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: bareed
          appbar: { title: { en: "Inbox", ar: "البريد الوارد" }, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: tabs, options: [ { en: "Important (4)", ar: "مهمّ (4)" }, { en: "Other (31)", ar: "أخرى (31)" } ], value: 0 }
            - { kind: banner, tone: info, icon: info, text: { en: "Sorted using who you reply to. See or change in Settings › Sorting", ar: "مصنّف حسب من تردّ عليهم. اعرضه أو غيّره في الإعدادات › التصنيف" }, gap: xs }
            - { kind: listitem, avatar: { text: "Nile Foods" }, text: { en: "Nile Foods", ar: "نايل فودز" }, sub: { en: "Contract ready to sign", ar: "العقد جاهز للتوقيع" }, value: "9:12" }
    answer: [line]
    misconceptions:
      - id: MC-P12-034
        when: [privacy, badge]
        feedback:
          en: "Nobody reads the policy, and a badge doesn't say what's collected. Say it where people see the sorting, with a link to change it."
          ar: "لا أحد يقرأ السياسة، والشارة لا تقول ما الذي يُجمع. قل ذلك حيث يرى الناس التصنيف، مع رابط لتغييره."
    explain:
      en: "From Lesson 3: say what you collect, where people see it, and where to change it."
      ar: "من الدرس 3: قل ماذا تجمع، في المكان الذي يراه الناس، وأين يغيّرونه."
