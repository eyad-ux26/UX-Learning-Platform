id: P12-U04
free: false
title:
  en: "Keep people in control"
  ar: "اترك التحكّم للناس"
skill:
  en: "Let people fix, undo and switch off AI features, ask for feedback they can easily give, and never collect data behind their backs."
  ar: "اسمح للناس بتصحيح ميزات الذكاء الاصطناعي والتراجع عنها وإيقافها، واطلب ملاحظات يسهل تقديمها، ولا تجمع البيانات أبدًا دون علمهم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P12-U04-01
    title: { en: "Let people fix it or switch it off", ar: "اسمح للناس بتصحيحه أو إيقافه" }
    can_do: { en: "Give every AI result a way to edit or undo it, offer an off switch from the start, and keep a manual way to do the task.", ar: "اجعل لكل نتيجة من الذكاء الاصطناعي طريقة لتعديلها أو التراجع عنها، وقدّم زر إيقاف من البداية، واحتفظ بطريقة يدوية لأداء المهمة." }
  - id: SK-P12-U04-02
    title: { en: "Let people erase what it learned", ar: "اسمح للناس بمسح ما تعلّمه" }
    can_do: { en: "Let people remove or update past choices the AI learned from, or reset it, when their life or needs change.", ar: "اسمح للناس بحذف أو تحديث الاختيارات السابقة التي تعلّم منها الذكاء الاصطناعي، أو إعادة ضبطه، حين تتغيّر حياتهم أو احتياجاتهم." }
  - id: SK-P12-U04-03
    title: { en: "Ask for feedback people can give", ar: "اطلب ملاحظات يستطيع الناس تقديمها" }
    can_do: { en: "Ask rarely and in the right tone, with simple options that don't overlap and match how people judge the result.", ar: "اسأل نادرًا وبالأسلوب المناسب، مع خيارات بسيطة لا تتداخل وتطابق طريقة حكم الناس على النتيجة." }
  - id: SK-P12-U04-04
    title: { en: "Don't read too much into one action", ar: "لا تفسّر فعلًا واحدًا أكثر من اللازم" }
    can_do: { en: "Avoid treating a single tap, view or purchase as a wish for more, and ask what people meant when it's unclear.", ar: "تجنّب اعتبار ضغطة أو مشاهدة أو شراء واحد رغبةً في المزيد، واسأل الناس ماذا قصدوا حين لا يكون ذلك واضحًا." }
  - id: SK-P12-U04-05
    title: { en: "Ask before you collect", ar: "اسأل قبل أن تجمع البيانات" }
    can_do: { en: "Tell people what behaviour data you collect and why, get permission up front, and show where they can see, edit or stop it.", ar: "أخبر الناس ما بيانات السلوك التي تجمعها ولماذا، وخذ إذنهم من البداية، ووضّح أين يستطيعون رؤيتها أو تعديلها أو إيقافها." }
