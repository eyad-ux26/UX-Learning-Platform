id: P12-U05-L04
mode: check
minutes: 6
title:
  en: "Skill check: fail gracefully"
  ar: "اختبار المهارة: تعامَل مع الفشل بلطف"
summary:
  en: "Review how a city transport app handles its AI mistakes, on your own."
  ar: "راجِع بنفسك كيف يتعامل تطبيق مواصلات في المدينة مع أخطاء ذكائه الاصطناعي."
speaker: mona
sources:
  - title: { en: "Errors + Graceful Failure (People + AI Guidebook)", ar: "الأخطاء والفشل اللطيف (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/errors-failing/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mona's review", ar: "مراجعة منى" }
    body:
      en: "I lead design for a city transport app. AI plans your trip by bus and metro, and tracks it live. I'm reviewing what happens when it gets things wrong.\n\nYour job: check five parts.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أقود التصميم في تطبيق مواصلات للمدينة. يخطّط الذكاء الاصطناعي رحلتك بالحافلة والمترو، ويتابعها مباشرة. وأراجع ما يحدث حين يخطئ.\n\nمهمّتك: افحص خمسة أجزاء.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: rehla
      appbar: { title: { en: "Home → Opera", ar: "المنزل ← الأوبرا" }, back: true }
      blocks:
        - { kind: image, art: map-route }
        - { kind: listitem, icon: bus, text: { en: "Bus 12 · Metro line 2", ar: "حافلة 12 · مترو الخط 2" }, sub: { en: "Leave 8:10 · arrive 8:45", ar: "الانطلاق 8:10 · الوصول 8:45" }, value: { en: "35 min", ar: "35 دقيقة" }, gap: s }
        - { kind: button, icon: navigation-arrow, text: { en: "Start trip", ar: "ابدأ الرحلة" }, gap: s }

  - id: S02
    type: tune
    skill: SK-P12-U05-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Errors + Graceful Failure (People + AI): don't miss a chance to explain your AI system."
      ar: "اختبار مهارة. الأخطاء والفشل اللطيف (People + AI): لا تُضيّع فرصة لشرح نظام الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Don’t miss an opportunity to explain your AI system." }
    scenario:
      en: "The app plans trips inside the city only. Someone searches for a trip to another city."
      ar: "التطبيق يخطّط الرحلات داخل المدينة فقط. ويبحث شخص عن رحلة إلى مدينة أخرى."
    prompt:
      en: "Tap each option to see it. What should it show?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يعرض؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
      tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
      blocks:
        - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
        - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: s }
        - { kind: small, color: muted, text: { en: "The message goes here", ar: "هنا تظهر الرسالة" }, gap: m }
    options:
      - id: none
        text: { en: "\"No route found.\"", ar: "«لم يُعثر على طريق.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: s }
            - { kind: icon, icon: map-trifold, gap: m }
            - { kind: text, text: { en: "No route found.", ar: "لم يُعثر على طريق." }, gap: s }
      - id: retry
        text: { en: "\"Something went wrong. Try again.\"", ar: "«حدث خطأ ما. حاول مرة أخرى.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: s }
            - { kind: banner, tone: bad, icon: warning, text: { en: "Something went wrong. Try again.", ar: "حدث خطأ ما. حاول مرة أخرى." }, gap: m }
            - { kind: button, style: outline, text: { en: "Try again", ar: "حاول مرة أخرى" }, gap: s }
      - id: limit
        text: { en: "\"We plan trips inside the city only. For other cities, see train times.\"", ar: "«نخطّط الرحلات داخل المدينة فقط. للمدن الأخرى، اطّلع على مواعيد القطارات.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: s }
            - { kind: banner, tone: info, icon: info, text: { en: "We plan trips inside the city only. For other cities, see train times.", ar: "نخطّط الرحلات داخل المدينة فقط. للمدن الأخرى، اطّلع على مواعيد القطارات." }, gap: m }
            - { kind: button, style: outline, icon: train, text: { en: "See train times", ar: "اطّلع على مواعيد القطارات" }, gap: s }
    answer: [limit]
    misconceptions:
      - id: MC-P12-038
        when: [none, retry]
        feedback:
          en: "Both suggest the trip might work if they try again. Say the limit, and where to go instead."
          ar: "كلا الخيارين يوحي بأن الرحلة قد تنجح إذا حاولوا مرة أخرى. قل الحدّ، وإلى أين يذهبون بدلًا من ذلك."
    explain:
      en: "From Lesson 1: name what it can't do, and offer another way."
      ar: "من الدرس 1: اذكر ما لا يستطيع التطبيق فعله، وقدّم طريقة أخرى."

  - id: S03
    type: tune
    skill: SK-P12-U05-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Errors + Graceful Failure (People + AI): don't act on assumptions."
      ar: "اختبار مهارة. الأخطاء والفشل اللطيف (People + AI): لا تتصرّف بناءً على افتراضات."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Don’t act on assumptions. Doing so can lead to context errors." }
    scenario:
      en: "The app noticed a user goes to the same office most mornings. On Friday, a day off, it sent: \"Leave now to be at work on time!\""
      ar: "لاحظ التطبيق أن أحد المستخدمين يذهب إلى المكتب نفسه أغلب الصباحات. ويوم الجمعة، وهو عطلة، أرسل: «تحرّك الآن لتصل إلى العمل في موعدك!»"
    prompt:
      en: "Tap each option to see it. What should the app do?"
      ar: "اضغط على كل خيار لتراه. ماذا يفعل التطبيق كي لا يذكّر الناس في أيام عطلتهم؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Notifications", ar: "الإشعارات" }, back: true }
      blocks:
        - { kind: small, color: muted, text: { en: "Friday · your day off", ar: "الجمعة · يوم عطلتك" } }
        - { kind: notification, app: rehla, title: { en: "Leave now to be at work on time!", ar: "تحرّك الآن لتصل إلى العمل في موعدك!" }, text: { en: "Bus 12 comes in 6 min.", ar: "الحافلة 12 تصل خلال 6 دقائق." }, time: { en: "7:40", ar: "7:40" }, gap: s }
    options:
      - id: ask
        text: { en: "Offer \"Get reminders for your work trip?\" and let people pick their days", ar: "يعرض «هل تريد تذكيرًا برحلة العمل؟» ويسمح للناس باختيار أيامهم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Trips", ar: "الرحلات" } }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: card, blocks: [ { kind: text, text: { en: "✨ Get reminders for your work trip?", ar: "✨ هل تريد تذكيرًا برحلة العمل؟" } }, { kind: small, color: muted, text: { en: "Pick your work days:", ar: "اختر أيام عملك:" } }, { kind: chips, items: [ { text: { en: "Sun", ar: "أحد" } }, { text: { en: "Mon", ar: "اثنين" } }, { text: { en: "Tue", ar: "ثلاثاء" } }, { text: { en: "Wed", ar: "أربعاء" } }, { text: { en: "Thu", ar: "خميس" } } ] }, { kind: row, blocks: [ { kind: button, text: { en: "Turn on", ar: "فعّل" } }, { kind: button, style: outline, text: { en: "No thanks", ar: "لا، شكرًا" } } ] } ] }
      - id: every
        text: { en: "Keep sending it every morning", ar: "يستمرّ في إرساله كل صباح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Notifications", ar: "الإشعارات" }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Friday · your day off", ar: "الجمعة · يوم عطلتك" } }
            - { kind: notification, app: rehla, title: { en: "Leave now to be at work on time!", ar: "تحرّك الآن لتصل إلى العمل في موعدك!" }, text: { en: "Bus 12 comes in 6 min.", ar: "الحافلة 12 تصل خلال 6 دقائق." }, time: { en: "7:40", ar: "7:40" }, gap: s }
      - id: guess
        text: { en: "Guess the days off from past trips, and stay silent then", ar: "يخمّن أيام العطلة من الرحلات السابقة، ويصمت فيها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Notifications", ar: "الإشعارات" }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Friday · your day off", ar: "الجمعة · يوم عطلتك" } }
            - { kind: text, text: { en: "No reminders today", ar: "لا تذكيرات اليوم" }, gap: s }
            - { kind: small, color: muted, text: { en: "The app guessed your day off from past trips.", ar: "خمّن التطبيق يوم عطلتك من الرحلات السابقة." }, gap: xs }
    answer: [ask]
    misconceptions:
      - id: MC-P12-040
        when: [every, guess]
        feedback:
          en: "Both still act on a guess about the user's week. Holidays, sick days and shifts change. Let them set it."
          ar: "كلا الخيارين يتصرّف بتخمين عن أسبوع المستخدم. والعطلات وأيام المرض والدوامات تتغيّر. اسمح له بتحديدها."
    explain:
      en: "From Lesson 2: suggest, and let people confirm, instead of acting on a guess."
      ar: "من الدرس 2: اقترح، واطلب من الناس التأكيد، بدلًا من التصرّف بتخمين."

  - id: S04
    type: tune
    skill: SK-P12-U05-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Errors + Graceful Failure (People + AI): check the input against expected answers, to see if people meant one of them."
      ar: "اختبار مهارة. الأخطاء والفشل اللطيف (People + AI): قارن المدخلات بالإجابات المتوقّعة، لترى هل قصد الناس إحداها."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Response: Check the user’s input versus a range of “expected” answers to see if they intended one of those inputs." }
    scenario:
      en: "Someone types \"Ramsis\" instead of \"Ramses Station\"."
      ar: "يكتب شخص «رمسيز» بدلًا من «محطة رمسيس»."
    prompt:
      en: "Tap each option to see it. What should the app show?"
      ar: "اضغط على كل خيار لتراه. ماذا يعرض التطبيق حين يخطئ الشخص في كتابة اسم المحطة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
      tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
      blocks:
        - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
        - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Ramsis", ar: "رمسيز" }, gap: s }
        - { kind: small, color: muted, text: { en: "The result goes here", ar: "هنا تظهر النتيجة" }, gap: m }
    options:
      - id: none
        text: { en: "\"No stop called Ramsis\"", ar: "«لا توجد محطة باسم رمسيز»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Ramsis", ar: "رمسيز" }, gap: s }
            - { kind: icon, icon: map-pin, gap: m }
            - { kind: text, text: { en: "No stop called \"Ramsis\"", ar: "لا توجد محطة باسم «رمسيز»" }, gap: s }
      - id: auto
        text: { en: "Start the trip to Ramses Station without asking", ar: "يبدأ الرحلة إلى محطة رمسيس دون سؤال" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "On your way", ar: "في الطريق" } }
          blocks:
            - { kind: banner, tone: info, icon: navigation-arrow, text: { en: "Trip started to Ramses Station", ar: "بدأت الرحلة إلى محطة رمسيس" } }
            - { kind: image, art: map-route, gap: s }
            - { kind: listitem, icon: bus, text: { en: "Bus 12 · then Metro line 1", ar: "حافلة 12 · ثم مترو الخط 1" }, value: { en: "28 min", ar: "28 دقيقة" }, gap: s }
      - id: mean
        text: { en: "\"Did you mean Ramses Station?\" with the route below", ar: "«هل تقصد محطة رمسيس؟» مع الطريق تحتها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Plan a trip", ar: "خطّط رحلة" }, back: true }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: field, label: { en: "From", ar: "من" }, text: { en: "Home", ar: "المنزل" } }
            - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "Ramsis", ar: "رمسيز" }, gap: s }
            - { kind: text, text: { en: "Did you mean Ramses Station?", ar: "هل تقصد محطة رمسيس؟" }, gap: m }
            - { kind: listitem, icon: bus, text: { en: "Bus 12 · then Metro line 1", ar: "حافلة 12 · ثم مترو الخط 1" }, sub: { en: "To Ramses Station", ar: "إلى محطة رمسيس" }, value: { en: "28 min", ar: "28 دقيقة" }, chevron: true, gap: s }
            - { kind: link, text: { en: "No, search for \"Ramsis\"", ar: "لا، ابحث عن «رمسيز»" }, gap: s }
    answer: [mean]
    misconceptions:
      - id: MC-P12-039
        when: [none, auto]
        feedback:
          en: "One is a dead end; the other acts without checking. Offer the likely match, and let them confirm."
          ar: "الأول طريق مسدود؛ والثاني يتصرّف دون تأكّد. اعرض الاقتراح المحتمل، واطلب منهم التأكيد."
    explain:
      en: "From Lesson 1: turn a dead end into a likely match."
      ar: "من الدرس 1: حوّل الطريق المسدود إلى اقتراح محتمل."

  - id: S05
    type: tune
    skill: SK-P12-U05-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Errors + Graceful Failure (People + AI): people taking over need the situation, what to do next, and how."
      ar: "اختبار مهارة. الأخطاء والفشل اللطيف (People + AI): من يتولّى المهمة يحتاج الموقف، وما الخطوة التالية، وكيف يفعلها."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "That means the user must have all the information they need in order to take the reins: awareness of the situation, what they need to do next, and how to do it." }
    scenario:
      en: "In the metro, live tracking loses signal halfway through a trip."
      ar: "في المترو، تفقد المتابعة المباشرة الإشارة في منتصف الرحلة."
    prompt:
      en: "Tap each option to see it. What should the screen show?"
      ar: "اضغط على كل خيار لتراه. ماذا تعرض الشاشة ليعرف الراكب أين ينزل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Live trip · Metro line 2", ar: "رحلة مباشرة · مترو الخط 2" } }
      blocks:
        - { kind: listitem, icon: train, text: { en: "Tahrir", ar: "التحرير" }, sub: { en: "Passed 8:31", ar: "مررت 8:31" }, check: true }
        - { kind: listitem, icon: train, text: { en: "Next: Nasser", ar: "التالية: ناصر" }, sub: { en: "in 2 min", ar: "بعد دقيقتين" } }
        - { kind: progress, value: 40, gap: s }
    options:
      - id: blank
        text: { en: "A spinning loader until the signal returns", ar: "علامة تحميل دوّارة (Spinner) حتى تعود الإشارة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Live trip · Metro line 2", ar: "رحلة مباشرة · مترو الخط 2" } }
          blocks:
            - { kind: listitem, icon: train, text: { en: "Tahrir", ar: "التحرير" }, sub: { en: "Passed 8:31", ar: "مررت 8:31" }, check: true }
            - { kind: icon, icon: circle-notch, gap: m }
            - { kind: small, color: muted, text: { en: "Loading…", ar: "جارٍ التحميل…" }, gap: s }
      - id: info
        text: { en: "\"Signal lost. Get off at Opera, 3 stops after Tahrir. We'll update when the signal is back.\"", ar: "«انقطعت الإشارة. انزل في محطة الأوبرا، بعد 3 محطات من التحرير. سنحدّث حين تعود الإشارة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Live trip · Metro line 2", ar: "رحلة مباشرة · مترو الخط 2" } }
          blocks:
            - { kind: listitem, icon: train, text: { en: "Tahrir", ar: "التحرير" }, sub: { en: "Passed 8:31", ar: "مررت 8:31" }, check: true }
            - { kind: banner, tone: warn, icon: wifi-slash, text: { en: "Signal lost. Get off at Opera, 3 stops after Tahrir. We'll update when the signal is back.", ar: "انقطعت الإشارة. انزل في محطة الأوبرا، بعد 3 محطات من التحرير. سنحدّث حين تعود الإشارة." }, gap: s }
      - id: lost
        text: { en: "\"Tracking unavailable.\"", ar: "«المتابعة غير متاحة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Live trip · Metro line 2", ar: "رحلة مباشرة · مترو الخط 2" } }
          blocks:
            - { kind: listitem, icon: train, text: { en: "Tahrir", ar: "التحرير" }, sub: { en: "Passed 8:31", ar: "مررت 8:31" }, check: true }
            - { kind: banner, tone: bad, icon: wifi-slash, text: { en: "Tracking unavailable.", ar: "المتابعة غير متاحة." }, gap: s }
    answer: [info]
    misconceptions:
      - id: MC-P12-042
        when: [blank, lost]
        feedback:
          en: "Both leave the rider guessing where to get off. Give them what they need to finish the trip on their own."
          ar: "كلا الخيارين يترك الراكب يخمّن أين ينزل. أعطِه ما يحتاجه ليُكمل الرحلة بنفسه."
    explain:
      en: "From Lesson 3: when AI stops, hand over with what's known, what's next and how."
      ar: "من الدرس 3: حين يتوقّف الذكاء الاصطناعي، سلّم المهمة مع المعروف، وماذا بعد، وكيف."

  - id: S06
    type: tune
    skill: SK-P12-U05-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. Errors + Graceful Failure (People + AI): changes can break habits, so people's usual actions lead to the wrong result."
      ar: "اختبار مهارة. الأخطاء والفشل اللطيف (People + AI): التغييرات قد تكسر العادات، فتؤدّي أفعال الناس المعتادة إلى نتيجة خطأ."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "When a user has built up habitual interactions with the system’s UI, but a change causes their actions to lead to a different, undesired, result." }
    scenario:
      en: "The team wants AI to reorder saved places (Home, Work, Gym) each day by what you'll likely need. People usually tap the first one without looking."
      ar: "الفريق يريد أن يعيد الذكاء الاصطناعي ترتيب الأماكن المحفوظة (المنزل، العمل، النادي) كل يوم حسب ما ستحتاجه على الأرجح. والناس عادةً يضغطون على الأول دون أن ينظروا."
    prompt:
      en: "Tap each option to see it. What should we do?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن نفعل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Where to?", ar: "إلى أين؟" } }
      tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
      blocks:
        - { kind: searchbar, text: { en: "Search a place", ar: "ابحث عن مكان" } }
        - { kind: small, color: muted, text: { en: "Saved places", ar: "الأماكن المحفوظة" }, gap: s }
        - { kind: listitem, icon: house, text: { en: "Home", ar: "المنزل" }, chevron: true }
        - { kind: listitem, icon: briefcase, text: { en: "Work", ar: "العمل" }, chevron: true }
        - { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, chevron: true }
    options:
      - id: daily
        text: { en: "Reorder them daily, as planned", ar: "نعيد ترتيبها يوميًا، كما خُطّط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" } }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search a place", ar: "ابحث عن مكان" } }
            - { kind: small, color: muted, text: { en: "Saved places", ar: "الأماكن المحفوظة" }, gap: s }
            - { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, chevron: true }
            - { kind: listitem, icon: house, text: { en: "Home", ar: "المنزل" }, chevron: true }
            - { kind: listitem, icon: briefcase, text: { en: "Work", ar: "العمل" }, chevron: true }
            - { kind: small, color: muted, text: { en: "✨ Reordered today by AI", ar: "✨ أعاد الذكاء الاصطناعي ترتيبها اليوم" }, gap: s }
      - id: fixed
        text: { en: "Keep saved places in a fixed order, and show the AI's guess as one \"Next trip?\" card above", ar: "نُبقي الأماكن المحفوظة بترتيب ثابت، ونعرض تخمين الذكاء الاصطناعي كبطاقة واحدة «رحلتك التالية؟» فوقها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" } }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search a place", ar: "ابحث عن مكان" } }
            - { kind: card, gap: s, blocks: [ { kind: small, color: muted, text: { en: "✨ Next trip?", ar: "✨ رحلتك التالية؟" } }, { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, sub: { en: "Bus 7 · 15 min", ar: "حافلة 7 · 15 دقيقة" }, chevron: true } ] }
            - { kind: small, color: muted, text: { en: "Saved places", ar: "الأماكن المحفوظة" }, gap: s }
            - { kind: listitem, icon: house, text: { en: "Home", ar: "المنزل" }, chevron: true }
            - { kind: listitem, icon: briefcase, text: { en: "Work", ar: "العمل" }, chevron: true }
            - { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, chevron: true }
      - id: hide
        text: { en: "Hide saved places, and show only the AI's guess", ar: "نُخفي الأماكن المحفوظة، ونعرض تخمين الذكاء الاصطناعي فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Where to?", ar: "إلى أين؟" } }
          tabbar: { active: 0, items: [ { icon: map-trifold, text: { en: "Trips", ar: "الرحلات" } }, { icon: ticket, text: { en: "Tickets", ar: "التذاكر" } }, { icon: user, text: { en: "Me", ar: "حسابي" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search a place", ar: "ابحث عن مكان" } }
            - { kind: small, color: muted, text: { en: "✨ Your next trip", ar: "✨ رحلتك التالية" }, gap: s }
            - { kind: listitem, icon: barbell, text: { en: "Gym", ar: "النادي" }, sub: { en: "Bus 7 · 15 min", ar: "حافلة 7 · 15 دقيقة" }, chevron: true }
    answer: [fixed]
    misconceptions:
      - id: MC-P12-041
        when: [daily, hide]
        feedback:
          en: "People tap by habit. Moving or hiding saved places sends them to the wrong destination. Keep them fixed, and give AI its own card."
          ar: "الناس يضغطون بحكم العادة. وتحريك الأماكن المحفوظة أو إخفاؤها يرسلهم إلى وجهة خطأ. أبقِها ثابتة، وأعطِ الذكاء الاصطناعي بطاقة خاصة به."
    explain:
      en: "From Lesson 2: keep habits safe, and put AI picks in their own area."
      ar: "من الدرس 2: احمِ العادات، وضع اختيارات الذكاء الاصطناعي في مساحتها الخاصة."
