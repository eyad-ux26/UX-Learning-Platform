          en: "One leaves the patient stuck; the other changes their doctor without asking. Explain, and offer the nearest choices."
          ar: "الأول يترك المريض عالقًا؛ والثاني يغيّر طبيبه دون سؤال. اشرح، وقدّم أقرب الخيارات."
