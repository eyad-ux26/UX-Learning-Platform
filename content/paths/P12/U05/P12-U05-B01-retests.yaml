      en: "What should it reply?"
      ar: "بماذا يردّ مساعد الحجز، ود. علي لا يعمل يوم الجمعة؟"
    mock:
      app: raha
      appbar:
        title: {en: Booking assistant, ar: مساعد الحجز}
        back: true
      blocks:
      - kind: chat
        from: me
        text: {en: Book Dr. Ali on Friday., ar: احجز مع د. علي يوم الجمعة.}
        time: "21:14"
      - kind: chat
        from: ai
        text: …
        time: "21:14"
      - kind: small
        color: muted
        text: {en: Dr. Ali works Saturday to Thursday., ar: د. علي يعمل من السبت إلى الخميس.}
        gap: s
