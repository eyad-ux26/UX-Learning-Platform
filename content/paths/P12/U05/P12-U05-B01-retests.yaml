            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [paused]
    misconceptions:
      - id: MC-P12-042
        when: [silent, error]
        feedback:
          en: "Silence means weeks of missed saving, and a code means nothing to customers. Say what stopped, why, and how to take over."
          ar: "الصمت يعني أسابيع من الادّخار الضائع، والرمز لا يعني شيئًا للعملاء. قل ما الذي توقّف، ولماذا، وكيف يتولّون الأمر."
    correct:
      en: "Right. What stopped, why, and what to do."
      ar: "صحيح. ما الذي توقّف، ولماذا، وماذا يفعلون."
    explain:
      en: "Two clear paths, fix the card or save by hand, keep the customer's goal on track."
      ar: "طريقان واضحان، إصلاح البطاقة أو الادّخار يدويًا، يحافظان على هدف العميل في الادّخار."

  - id: S09
    type: tune
    skill: SK-P12-U05-05
    part: retest
    speaker: hana
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): changes can break habits, so people's usual actions lead to the wrong result."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): التغييرات قد تكسر العادات، فتؤدّي أفعال الناس المعتادة إلى نتيجة خطأ."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "When a user has built up habitual interactions with the system’s UI, but a change causes their actions to lead to a different, undesired, result." }
    scenario:
      en: "In our gym app, members tap \"Check in\" at the door, at the bottom right. A new AI layout moved it, and many now tap \"Cancel class\" by mistake."
      ar: "في تطبيق النادي، يضغط الأعضاء زر «تسجيل الحضور» عند الباب، أسفل يمين الشاشة. ونقل تصميم جديد بالذكاء الاصطناعي هذا الزر، فأصبح كثيرون يضغطون زر «إلغاء الحصة» بالخطأ."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    mock:
      app: nashat
      appbar:
        title:
          en: "Spinning · 7:00"
          ar: "دراجات · 7:00"
        back: true
      blocks:
      - {kind: image, art: gym}
      - kind: listitem
        icon: user
        text: {en: Coach Omar, ar: المدرّب عمر}
        sub: {en: Studio 2, ar: الاستوديو 2}
        gap: s
      - kind: small
        color: muted
        text: {en: ✨ New AI layout, ar: ✨ تصميم جديد بالذكاء الاصطناعي}
        gap: s
      footer:
      - kind: row
        blocks:
        - kind: button
          style: outline
          text: {en: Check in, ar: تسجيل الحضور}
        - kind: button
          style: danger
          text: {en: Cancel class, ar: إلغاء الحصة}
      caption: {en: Now, ar: الآن}
    options:
      - id: back
        text:
          en: "Put \"Check in\" back in its old spot, and keep it fixed"
          ar: "نُعيد زر «تسجيل الحضور» إلى مكانه القديم، ونُبقيه ثابتًا"
        mock:
          app: nashat
          appbar:
            title:
              en: "Spinning · 7:00"
              ar: "دراجات · 7:00"
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: listitem
            icon: user
            text: {en: Coach Omar, ar: المدرّب عمر}
            sub: {en: Studio 2, ar: الاستوديو 2}
            gap: s
          footer:
          - kind: button
            text: {en: Check in, ar: تسجيل الحضور}
            icon: check
          - kind: button
            text: {en: Cancel class, ar: إلغاء الحصة}
            style: text
            gap: xs
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: confirm
        text:
          en: "Add \"Are you sure?\" to \"Cancel class\""
          ar: "نضيف سؤال «هل أنت متأكّد؟» إلى زر «إلغاء الحصة»"
        mock:
          app: nashat
          appbar:
            title:
              en: "Spinning · 7:00"
              ar: "دراجات · 7:00"
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: listitem
            icon: user
            text: {en: Coach Omar, ar: المدرّب عمر}
            sub: {en: Studio 2, ar: الاستوديو 2}
            gap: s
          - kind: small
            color: muted
            text: {en: ✨ New AI layout, ar: ✨ تصميم جديد بالذكاء الاصطناعي}
            gap: s
          footer:
          - kind: row
            blocks:
            - kind: button
              style: outline
              text: {en: Check in, ar: تسجيل الحضور}
            - kind: button
              style: danger
              text: {en: Cancel class, ar: إلغاء الحصة}
          overlay:
            type: dialog
            blocks:
            - kind: heading
              text:
                en: "Are you sure?"
                ar: هل أنت متأكّد؟
            - kind: text
              text:
                en: "Cancel Spinning at 7:00?"
                ar: "إلغاء حصة الدراجات 7:00؟"
              gap: xs
            - kind: row
              gap: m
              blocks:
              - kind: button
                text: {en: Back, ar: رجوع}
                style: text
              - kind: button
                text: {en: Cancel class, ar: إلغاء الحصة}
                style: danger
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: tip
        text:
          en: "Show a tip: \"Check in has moved!\""
          ar: "نعرض تلميحًا: «تسجيل الحضور انتقل!»"
        mock:
          app: nashat
          appbar:
            title:
              en: "Spinning · 7:00"
              ar: "دراجات · 7:00"
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: listitem
            icon: user
            text: {en: Coach Omar, ar: المدرّب عمر}
            sub: {en: Studio 2, ar: الاستوديو 2}
            gap: s
          - kind: banner
            text:
              en: "Check in has moved!"
              ar: "تسجيل الحضور انتقل!"
            tone: brand
            icon: info
            gap: s
          footer:
          - kind: row
            blocks:
            - kind: button
              style: outline
              text: {en: Check in, ar: تسجيل الحضور}
            - kind: button
              style: danger
              text: {en: Cancel class, ar: إلغاء الحصة}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [back]
    misconceptions:
      - id: MC-P12-041
        when: [confirm, tip]
        feedback:
          en: "Both patch the symptom. Hands still go to the old spot. Put the button people rely on back where they expect it."
          ar: "كلا الخيارين يعالج العَرَض فقط. فالأيدي تذهب إلى المكان القديم بحكم العادة. أعِد الزر الذي يعتمد عليه الناس إلى حيث يتوقّعونه."
    correct:
      en: "Right. Habits win; keep the button where hands expect it."
      ar: "صحيح. العادة تنتصر؛ أبقِ الزر حيث تتوقّعه الأيدي."
    explain:
      en: "A button used every day, at the door, must never move."
      ar: "الزر الذي يُستخدم كل يوم، عند الباب، يجب ألّا يتحرّك أبدًا."

  - id: S10
    type: tune
    skill: SK-P12-U05-05
    part: retest
    speaker: rami
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): when AI keeps moving things, muscle memory opens the wrong thing."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): حين يستمرّ الذكاء الاصطناعي في تحريك الأشياء، تفتح ذاكرة اليد الشيء الخطأ."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Clicking in that area due to muscle memory now opens the wrong folder." }
    scenario:
      en: "I'm designing a files app. The team wants \"All files\" sorted by AI, most likely first, instead of A to Z."
      ar: "أصمّم تطبيقًا للملفّات. والفريق يريد ترتيب «كل الملفّات» بالذكاء الاصطناعي، ليظهر الملف الذي يُرجَّح أن تحتاجه أولًا، بدلًا من الترتيب الأبجدي."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    mock:
      app:
        name: {en: Malaffat, ar: ملفّات}
        color: "#475569"
        icon: folder
        domain: malaffat.example
      appbar:
        title: {en: All files, ar: كل الملفّات}
      blocks:
      - kind: badge
        icon: sparkle
        text:
          en: "Planned: sorted by AI"
          ar: "المخطّط: ترتيب بالذكاء الاصطناعي"
      - {kind: listitem, icon: file-xls, text: Budget-2026.xlsx, gap: s}
      - {kind: listitem, icon: file-pdf, text: Invoice-May.pdf}
      - {kind: listitem, icon: file-doc, text: Contract.docx}
      - {kind: listitem, icon: file-pdf, text: Brochure.pdf}
      - kind: small
        color: muted
        text:
          en: "Today: A to Z"
          ar: "اليوم: أبجديًا"
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: ai
        text:
          en: "Sort \"All files\" by AI, as planned"
          ar: نرتّب «كل الملفّات» بالذكاء الاصطناعي، كما خُطّط
        mock:
          app:
            name: {en: Malaffat, ar: ملفّات}
            color: "#475569"
            icon: folder
            domain: malaffat.example
          appbar:
            title: {en: All files, ar: كل الملفّات}
          blocks:
          - kind: badge
            icon: sparkle
            text:
              en: "Planned: sorted by AI"
              ar: "المخطّط: ترتيب بالذكاء الاصطناعي"
          - {kind: listitem, icon: file-pdf, text: Invoice-May.pdf, gap: s}
          - {kind: listitem, icon: file-doc, text: Contract.docx}
          - {kind: listitem, icon: file-xls, text: Budget-2026.xlsx}
          - {kind: listitem, icon: file-pdf, text: Brochure.pdf}
          - kind: small
            text:
              en: "Sorted by AI: the order changes each day"
              ar: "ترتيب بالذكاء الاصطناعي: يتغيّر الترتيب كل يوم"
            color: muted
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: both
        text:
          en: "Keep \"All files\" A to Z, and add a separate \"Suggested\" row above it"
          ar: نُبقي «كل الملفّات» أبجديًا، ونضيف صفّ «مقترحة» منفصلًا فوقه
        mock:
          app:
            name: {en: Malaffat, ar: ملفّات}
            color: "#475569"
            icon: folder
            domain: malaffat.example
          appbar:
            title: {en: All files, ar: كل الملفّات}
          blocks:
          - kind: heading
            text: {en: Suggested, ar: مقترحة}
          - kind: listitem
            icon: file-pdf
            text: Invoice-May.pdf
            badge:
              text: {en: Suggested, ar: مقترح}
              icon: sparkle
          - kind: listitem
            icon: file-doc
            text: Contract.docx
            badge:
              text: {en: Suggested, ar: مقترح}
              icon: sparkle
          - kind: heading
            text: {en: All files · A to Z, ar: كل الملفّات · أبجديًا}
            gap: m
          - {kind: listitem, icon: file-pdf, text: Brochure.pdf}
          - {kind: listitem, icon: file-xls, text: Budget-2026.xlsx}
          - {kind: listitem, icon: file-doc, text: Contract.docx}
          - {kind: listitem, icon: file-pdf, text: Invoice-May.pdf}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: random
        text: {en: Mix the two lists into one, ar: ندمج القائمتين في قائمة واحدة}
        mock:
          app:
            name: {en: Malaffat, ar: ملفّات}
            color: "#475569"
            icon: folder
            domain: malaffat.example
          appbar:
            title: {en: All files, ar: كل الملفّات}
          blocks:
          - kind: listitem
            icon: file-doc
            text: Contract.docx
            badge:
              text: {en: Suggested, ar: مقترح}
              icon: sparkle
          - {kind: listitem, icon: file-pdf, text: Brochure.pdf}
          - kind: listitem
            icon: file-pdf
            text: Invoice-May.pdf
            badge:
              text: {en: Suggested, ar: مقترح}
              icon: sparkle
          - {kind: listitem, icon: file-xls, text: Budget-2026.xlsx}
          - kind: small
            text: {en: Suggested and all files in one list, ar: المقترحة وكل الملفّات في قائمة واحدة}
            color: muted
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [both]
    misconceptions:
      - id: MC-P12-041
        when: [ai, random]
        feedback:
          en: "People find files by position. If the order keeps changing, they open the wrong one. Keep the list stable, and give AI its own row."
          ar: "الناس يجدون الملفّات بمكانها. وإذا ظلّ الترتيب يتغيّر، يفتحون الملفّ الخطأ. أبقِ القائمة ثابتة، وأعطِ الذكاء الاصطناعي صفًّا خاصًّا به."
    correct:
      en: "Right. Stable list, separate AI row."
      ar: "صحيح. قائمة ثابتة، وصفّ منفصل للذكاء الاصطناعي."
    explain:
      en: "AI can help without moving what people already know."
      ar: "الذكاء الاصطناعي يستطيع أن يساعد دون أن يحرّك ما يعرفه الناس بالفعل."
