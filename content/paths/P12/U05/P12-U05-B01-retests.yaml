                en: "1,850 EGP"
                ar: "1,850 جنيهًا"
            - kind: small
              color: muted
              text:
                en: "Last move: 24 April"
                ar: "آخر تحويل: 24 أبريل"
          - kind: listitem
            icon: credit-card
            text: Visa •••• 4417
            sub: {en: Expired 1 May, ar: انتهت في 1 مايو}
            gap: s
          - kind: banner
            text:
              en: "Smart save paused: your card expired on 1 May. Add your new card, or save by hand this week."
              ar: "الادّخار الذكي متوقّف: انتهت صلاحية بطاقتك في 1 مايو. أضِف بطاقتك الجديدة، أو ادّخر يدويًا هذا الأسبوع."
            tone: warn
            icon: pause-circle
            gap: s
          - kind: button
            text: {en: Add new card, ar: أضِف بطاقة جديدة}
            icon: plus
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: error
        text:
          en: "\"Smart save error (code 402).\""
          ar: «خطأ في الادّخار الذكي (رمز 402).»
        mock:
          app: rasid
          appbar:
            title: {en: Smart save, ar: الادّخار الذكي}
            back: true
          blocks:
          - kind: card
            blocks:
            - kind: small
              color: muted
              text: {en: Saved so far, ar: ادّخرت حتى الآن}
            - kind: price
              text:
                en: "1,850 EGP"
                ar: "1,850 جنيهًا"
            - kind: small
              color: muted
              text:
                en: "Last move: 24 April"
                ar: "آخر تحويل: 24 أبريل"
          - kind: listitem
            icon: credit-card
            text: Visa •••• 4417
            sub: {en: Expired 1 May, ar: انتهت في 1 مايو}
            gap: s
          - kind: banner
            text: {en: Smart save error (code 402)., ar: خطأ في الادّخار الذكي (رمز 402).}
            tone: bad
