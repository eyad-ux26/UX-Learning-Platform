        text:
          en: "\"No appointments available.\""
          ar: «لا توجد مواعيد متاحة.»
        mock:
          app: raha
          appbar:
            title: {en: Booking assistant, ar: مساعد الحجز}
            back: true
          blocks:
          - kind: chat
            from: me
            text: {en: Book Dr. Ali on Friday., ar: احجز مع د. علي يوم الجمعة.}
            time: "21:14"
