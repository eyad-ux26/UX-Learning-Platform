            from: ai
            text: {en: No appointments available., ar: لا توجد مواعيد متاحة.}
            time: "21:14"
          - kind: small
            color: muted
            text: {en: Dr. Ali works Saturday to Thursday., ar: د. علي يعمل من السبت إلى الخميس.}
            gap: s
          - kind: composer
            text: {en: Type a message, ar: اكتب رسالة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: other
        text:
