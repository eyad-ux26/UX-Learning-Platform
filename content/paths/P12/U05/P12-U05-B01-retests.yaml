  - id: S06
    type: tune
    skill: SK-P12-U05-03
    part: retest
    speaker: nour
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): setting expectations helps, but how people move forward after a failure matters just as much."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): وضع التوقّعات يساعد، لكن طريقة مضيّ الناس بعد الفشل مهمة بالقدر نفسه."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Setting reasonable expectations about the limitations of your technology helps set up good experiences with errors, but how users move forward is equally important." }
    scenario:
      en: "A patient types to our booking assistant: \"Book Dr. Ali on Friday.\" Dr. Ali doesn't work on Fridays."
      ar: "يكتب مريض لمساعد الحجز عندنا: «احجز مع د. علي يوم الجمعة.» ود. علي لا يعمل أيام الجمعة."
