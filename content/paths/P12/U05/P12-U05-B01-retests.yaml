            text: {en: Book Dr. Ali on Friday., ar: احجز مع د. علي يوم الجمعة.}
            time: "21:14"
          - kind: chat
            from: ai
            text:
              en: "Dr. Ali isn't in on Fridays. Closest times: Thursday 6 p.m. or Saturday 10 a.m."
              ar: "د. علي لا يعمل أيام الجمعة. أقرب المواعيد: الخميس 6 مساءً أو السبت 10 صباحًا."
            time: "21:14"
