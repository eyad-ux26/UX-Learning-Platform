      en: "Right. Why it can't, and the closest options."
      ar: "صحيح. لماذا لا يستطيع، وأقرب الخيارات."
    explain:
      en: "The patient gets what they wanted, Dr. Ali, just on another day."
      ar: "يحصل المريض على ما أراده، د. علي، لكن في يوم آخر."

  - id: S07
    type: tune
    skill: SK-P12-U05-04
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): when control passes from AI to people, make it easy to pick up where the system stopped."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): حين ينتقل التحكّم من الذكاء الاصطناعي إلى الناس، اجعل إكمال ما توقّف عنده النظام سهلًا."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "When this AI-to-manual control transition happens, it’s your responsibility to make it easy and intuitive for users to quickly pick up where the system leaves off." }
    scenario:
      en: "My shop's chat bot answers customers. It can't handle refund disputes, so it passes them to me."
      ar: "روبوت المحادثة في متجري يردّ على العملاء. ولا يستطيع التعامل مع خلافات الاسترداد، فيحوّلها إليّ."
