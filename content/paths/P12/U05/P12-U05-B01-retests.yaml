id: P12-U05-B01
mode: bank
title:
  en: "Re-tests: fail gracefully"
  ar: "إعادة اختبار: تعامَل مع الفشل بلطف"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Errors + Graceful Failure (People + AI Guidebook)", ar: "الأخطاء والفشل اللطيف (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/errors-failing/"
steps:
  - id: S01
    type: tune
    skill: SK-P12-U05-01
    part: retest
    speaker: rami
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): explain what the system is supposed to do and how it works."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): اشرح ما يُفترض أن يفعله النظام وكيف يعمل."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Response: Communicate what the system is supposed to do and how it works." }
    scenario:
      en: "I'm designing an expenses app. It reads receipts from photos, but only printed ones. When someone scans a handwritten receipt, it says \"Scan failed.\""
      ar: "أصمّم تطبيقًا للمصروفات. يقرأ الإيصالات من الصور، لكن المطبوعة فقط. وحين يمسح شخص إيصالًا مكتوبًا بخط اليد، يقول «فشل المسح.»"
    prompt:
      en: "What should it say?"
      ar: "ماذا يجب أن يقول؟"
    mock:
      app: nafaqat
      appbar:
        title: {en: Add expense, ar: أضف مصروفًا}
        back: true
      blocks:
      - {kind: image, art: receipt}
      - kind: small
        color: muted
        text:
          en: "Your photo: a handwritten taxi receipt"
          ar: "صورتك: إيصال تاكسي مكتوب بخط اليد"
        gap: xs
      - kind: banner
        tone: bad
        icon: warning
        text: {en: Scan failed., ar: فشل المسح.}
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: failed
        text:
          en: "Keep \"Scan failed.\""
          ar: يبقى «فشل المسح.»
        mock:
          app: nafaqat
          appbar:
            title: {en: Add expense, ar: أضف مصروفًا}
            back: true
          blocks:
          - {kind: image, art: receipt}
          - kind: small
            color: muted
            text:
              en: "Your photo: a handwritten taxi receipt"
              ar: "صورتك: إيصال تاكسي مكتوب بخط اليد"
            gap: xs
          - kind: banner
            tone: bad
            icon: warning
            text: {en: Scan failed., ar: فشل المسح.}
            gap: s
          caption: {en: Unchanged, ar: بدون تغيير}
      - id: blurry
        text:
          en: "\"Photo too blurry. Try again.\""
          ar: «الصورة ضبابية جدًا. حاول مرة أخرى.»
        mock:
          app: nafaqat
          appbar:
            title: {en: Add expense, ar: أضف مصروفًا}
            back: true
          blocks:
          - {kind: image, art: receipt}
          - kind: small
            color: muted
            text:
              en: "Your photo: a handwritten taxi receipt"
              ar: "صورتك: إيصال تاكسي مكتوب بخط اليد"
            gap: xs
          - kind: banner
            tone: bad
            icon: warning
            text: {en: Photo too blurry. Try again., ar: الصورة ضبابية جدًا. حاول مرة أخرى.}
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: limit
        text:
          en: "\"We can read printed receipts only. For handwritten ones, type the amount.\""
          ar: "«نستطيع قراءة الإيصالات المطبوعة فقط. وإذا كان الإيصال مكتوبًا بخط اليد، فاكتب المبلغ بنفسك.»"
        mock:
          app: nafaqat
          appbar:
            title: {en: Add expense, ar: أضف مصروفًا}
            back: true
          blocks:
          - {kind: image, art: receipt}
          - kind: small
            color: muted
            text:
              en: "Your photo: a handwritten taxi receipt"
              ar: "صورتك: إيصال تاكسي مكتوب بخط اليد"
            gap: xs
          - kind: banner
            tone: bad
            icon: warning
            text:
              en: "We can read printed receipts only. For handwritten ones, type the amount."
              ar: "نستطيع قراءة الإيصالات المطبوعة فقط. وإذا كان الإيصال مكتوبًا بخط اليد، فاكتب المبلغ بنفسك."
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [limit]
    misconceptions:
      - id: MC-P12-038
        when: [failed, blurry]
        feedback:
          en: "The photo isn't the problem; handwriting is. A wrong reason sends people back to retry. Name the real limit."
          ar: "المشكلة ليست في الصورة؛ بل في خط اليد. والسبب الخطأ يعيد الناس إلى المحاولة. اذكر الحدّ الحقيقي."
    correct:
      en: "Right. The real limit, and the way around it."
      ar: "صحيح. الحدّ الحقيقي، والطريق البديل."
    explain:
      en: "People stop retrying when they know why it failed."
      ar: "يتوقّف الناس عن إعادة المحاولة حين يعرفون لماذا فشل."

  - id: S02
    type: tune
    skill: SK-P12-U05-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): don't miss a chance to explain your AI system."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): لا تُضيّع فرصة لشرح نظام الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Don’t miss an opportunity to explain your AI system." }
    scenario:
      en: "Our gym app checks a member's form through the phone camera. When it can't see their feet, it shows: \"Unable to analyse.\""
      ar: "تطبيق النادي يفحص أداء العضو للتمرين عبر كاميرا الهاتف. وحين لا يرى قدميه، يعرض: «تعذّر التحليل.»"
    prompt:
      en: "What should it show?"
      ar: "ماذا يجب أن يعرض؟"
    mock:
      app: nashat
      theme: dark
      appbar:
        title: {en: Form check · Squats, ar: فحص الأداء · القرفصاء}
        back: true
      blocks:
      - {kind: image, art: gym}
      - kind: banner
        tone: bad
        icon: warning
        text: {en: Unable to analyse., ar: تعذّر التحليل.}
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: frame
        text:
          en: "\"Step back so your whole body, head to feet, is in the frame.\""
          ar: «ارجع للخلف ليظهر جسمك كله، من الرأس إلى القدمين، في الصورة.»
        mock:
          app: nashat
          theme: dark
          appbar:
            title: {en: Form check · Squats, ar: فحص الأداء · القرفصاء}
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: banner
            tone: bad
            icon: warning
            text:
              en: "Step back so your whole body, head to feet, is in the frame."
              ar: ارجع للخلف ليظهر جسمك كله، من الرأس إلى القدمين، في الصورة.
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: keep
        text:
          en: "Keep \"Unable to analyse.\""
          ar: يبقى «تعذّر التحليل.»
        mock:
          app: nashat
          theme: dark
          appbar:
            title: {en: Form check · Squats, ar: فحص الأداء · القرفصاء}
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: banner
            tone: bad
            icon: warning
            text: {en: Unable to analyse., ar: تعذّر التحليل.}
            gap: s
          caption: {en: Unchanged, ar: بدون تغيير}
      - id: later
        text:
          en: "\"Try again later.\""
          ar: «حاول لاحقًا.»
        mock:
          app: nashat
          theme: dark
          appbar:
            title: {en: Form check · Squats, ar: فحص الأداء · القرفصاء}
            back: true
          blocks:
          - {kind: image, art: gym}
          - kind: banner
            tone: bad
            icon: warning
            text: {en: Try again later., ar: حاول لاحقًا.}
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [frame]
    misconceptions:
      - id: MC-P12-038
        when: [keep, later]
        feedback:
          en: "Waiting won't help. The app needs to see the full body. Tell members exactly that."
          ar: "الانتظار لن يساعد. التطبيق يحتاج أن يرى الجسم كله. قل للأعضاء ذلك بالضبط."
    correct:
      en: "Right. Tell them what the AI needs to see."
      ar: "صحيح. قل لهم ما يحتاج الذكاء الاصطناعي أن يراه."
    explain:
      en: "The error teaches how the feature works, so the next try succeeds."
      ar: "رسالة الخطأ تعلّم الناس كيف تعمل الميزة، فتنجح المحاولة التالية."

  - id: S03
    type: tune
    skill: SK-P12-U05-02
    part: retest
    speaker: karim
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): a system can work as intended, yet seem wrong because it acted on poor assumptions."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): قد يعمل النظام كما صُمّم، ومع ذلك يبدو خطأً لأنه تصرّف بناءً على افتراضات ضعيفة."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Context errors. These are often true positives: the system is “working as intended,” but the user perceives an error because the actions of the system aren’t well-explained, break the user’s mental model, or were based on poor assumptions." }
    scenario:
      en: "I'm building an email app. It adds calendar events from any email with a date. Now people's calendars fill with \"Sale ends Friday\" from shop newsletters."
      ar: "أبني تطبيق بريد. يضيف أحداثًا إلى التقويم من أي رسالة فيها تاريخ. والآن تمتلئ تقاويم الناس بـ«التخفيضات تنتهي الجمعة» من نشرات المتاجر."
    prompt:
      en: "What should the app do?"
      ar: "ماذا يجب أن يفعل التطبيق؟"
    mock:
      app: bareed
      appbar:
        title: {en: Calendar · this week, ar: التقويم · هذا الأسبوع}
      blocks:
      - kind: listitem
        icon: tag
        text: {en: Sale ends Friday, ar: التخفيضات تنتهي الجمعة}
        sub: {en: Fri · all day · Lamha, ar: الجمعة · طوال اليوم · لمحة}
        badge:
          text: {en: From email, ar: من البريد}
          icon: envelope-simple
      - kind: listitem
        icon: tag
        text:
          en: "50% off ends tonight"
          ar: "خصم 50% ينتهي الليلة"
        sub:
          en: "Wed · 23:59 · Volta"
          ar: "الأربعاء · 23:59 · فولتا"
        badge:
          text: {en: From email, ar: من البريد}
          icon: envelope-simple
      - kind: listitem
        icon: cake
        text:
          en: "Mum's birthday"
          ar: عيد ميلاد أمي
        sub:
          en: "Thu · 19:00"
          ar: "الخميس · 19:00"
      - kind: listitem
        icon: tag
        text:
          en: "Last chance: free delivery"
          ar: "الفرصة الأخيرة: توصيل مجاني"
        sub: {en: Sat · all day · Lokma, ar: السبت · طوال اليوم · لقمة}
        badge:
          text: {en: From email, ar: من البريد}
          icon: envelope-simple
      caption: {en: Now, ar: الآن}
    options:
      - id: keep
        text: {en: Keep adding them; the dates are correct, ar: يستمرّ في إضافتها؛ فالتواريخ صحيحة}
        mock:
          app: bareed
          appbar:
            title: {en: Calendar · this week, ar: التقويم · هذا الأسبوع}
          blocks:
          - kind: listitem
            icon: tag
            text: {en: Sale ends Friday, ar: التخفيضات تنتهي الجمعة}
            sub: {en: Fri · all day · Lamha, ar: الجمعة · طوال اليوم · لمحة}
            badge:
              text: {en: From email, ar: من البريد}
              icon: envelope-simple
          - kind: listitem
            icon: tag
            text:
              en: "50% off ends tonight"
              ar: "خصم 50% ينتهي الليلة"
            sub:
              en: "Wed · 23:59 · Volta"
              ar: "الأربعاء · 23:59 · فولتا"
            badge:
              text: {en: From email, ar: من البريد}
              icon: envelope-simple
          - kind: listitem
            icon: cake
            text:
              en: "Mum's birthday"
              ar: عيد ميلاد أمي
            sub:
              en: "Thu · 19:00"
              ar: "الخميس · 19:00"
          - kind: listitem
            icon: tag
            text:
              en: "Last chance: free delivery"
              ar: "الفرصة الأخيرة: توصيل مجاني"
            sub: {en: Sat · all day · Lokma, ar: السبت · طوال اليوم · لقمة}
            badge:
              text: {en: From email, ar: من البريد}
              icon: envelope-simple
          caption: {en: Unchanged, ar: بدون تغيير}
      - id: suggest
        text:
          en: "Show \"Add to calendar?\" on the email, and add only when people tap it"
          ar: "يعرض زر «إضافة إلى التقويم؟» على الرسالة، ويضيف فقط حين يضغط عليه الناس"
        mock:
          app: bareed
          appbar:
            title: {en: Calendar · this week, ar: التقويم · هذا الأسبوع}
          blocks:
          - kind: listitem
            icon: cake
            text:
              en: "Mum's birthday"
              ar: عيد ميلاد أمي
            sub:
              en: "Thu · 19:00"
              ar: "الخميس · 19:00"
          - kind: card
            gap: m
            blocks:
            - kind: small
              text: {en: In your email · Lamha, ar: في بريدك · لمحة}
              color: muted
            - kind: text
              text: {en: Sale ends Friday, ar: التخفيضات تنتهي الجمعة}
              gap: xs
            - kind: button
              text:
                en: "Add to calendar?"
                ar: إضافة إلى التقويم؟
              style: outline
              icon: calendar-plus
              gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: delete
        text: {en: Delete newsletter events every night, ar: يحذف أحداث النشرات كل ليلة}
        mock:
          app: bareed
          appbar:
            title: {en: Calendar · this week, ar: التقويم · هذا الأسبوع}
          blocks:
          - kind: listitem
            icon: cake
            text:
              en: "Mum's birthday"
              ar: عيد ميلاد أمي
            sub:
              en: "Thu · 19:00"
              ar: "الخميس · 19:00"
          - kind: small
            text: {en: Newsletter events were deleted last night., ar: حُذفت أحداث النشرات ليلة أمس.}
            color: muted
            gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [suggest]
    misconceptions:
      - id: MC-P12-040
        when: [keep, delete]
        feedback:
          en: "The dates are right, but the app guessed people wanted them. Suggest, and let them choose."
          ar: "التواريخ صحيحة، لكن التطبيق خمّن أن الناس يريدونها. اقترح، واتركهم يختارون."
    correct:
      en: "Right. Suggest instead of acting."
      ar: "صحيح. اقترح بدل أن تتصرّف."
    explain:
      en: "\"Working as intended\" isn't enough if it guesses what people want."
      ar: "«يعمل كما صُمّم» لا يكفي إذا كان يخمّن ما يريده الناس."

  - id: S04
    type: tune
    skill: SK-P12-U05-02
    part: retest
    speaker: sara
    value:
      en: "Re-test. Errors + Graceful Failure (People + AI): when a whole group rejects suggestions at a certain time of year, it may be a cultural reason your team missed."
      ar: "إعادة اختبار. الأخطاء والفشل اللطيف (People + AI): حين ترفض مجموعة كاملة الاقتراحات في وقت معيّن من السنة، فقد يكون السبب ثقافيًا لم ينتبه له فريقك."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Whereas if all of the users in a certain group consistently rejected meat-based suggestions during a certain time of year, that might be linked to a cultural value or preference that your team hasn’t accounted for." }
    scenario:
      en: "I design a recipe app. Every year, for one month, many users skip all lunch suggestions. The team thinks the lunch recipes got worse. It's Ramadan; they're fasting."
      ar: "أصمّم تطبيق وصفات. وكل سنة، لمدة شهر، يتجاوز كثير من المستخدمين كل اقتراحات الغداء. والفريق يظنّ أن وصفات الغداء ساءت. إنه رمضان؛ وهم صائمون."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    mock:
      app: tabkha
      appbar:
        title: {en: Lunch for you, ar: غداء لك}
      blocks:
      - kind: listitem
        art: food-koshary
        text: {en: Koshary, ar: كشري}
        sub:
          en: "40 min"
          ar: "40 دقيقة"
        badge:
          text: {en: Skipped, ar: تخطّاه الناس}
          tone: neutral
      - kind: listitem
        art: food-grill
        text: {en: Grilled chicken with rice, ar: دجاج مشوي بالأرز}
        sub:
          en: "45 min"
          ar: "45 دقيقة"
        badge:
          text: {en: Skipped, ar: تخطّاه الناس}
          tone: neutral
      - kind: small
        color: muted
        text:
          en: "Lunch taps this month: down 70%"
          ar: "الضغطات على وصفات الغداء هذا الشهر: أقل بنسبة 70%"
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: new
        text: {en: Replace the lunch recipes with new ones, ar: نستبدل وصفات الغداء بوصفات جديدة}
        mock:
          app: tabkha
          appbar:
            title: {en: Lunch for you, ar: غداء لك}
          blocks:
          - kind: listitem
            text: {en: Molokhia with rice, ar: ملوخية بالأرز}
            art: food-salad
            sub:
              en: "50 min"
              ar: "50 دقيقة"
          - kind: listitem
            text: {en: Pasta béchamel, ar: مكرونة بالبشاميل}
            art: food-pizza
            sub:
              en: "60 min"
              ar: "60 دقيقة"
          - kind: small
            color: muted
            text:
              en: "Lunch taps this month: down 70%"
              ar: "الضغطات على وصفات الغداء هذا الشهر: أقل بنسبة 70%"
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: all
        text: {en: Switch everyone to iftar recipes during Ramadan, ar: نحوّل الجميع إلى وصفات الإفطار في رمضان}
        mock:
          app: tabkha
          appbar:
            title: {en: Iftar for you, ar: إفطار لك}
          blocks:
          - kind: listitem
            text: {en: Lentil soup, ar: شوربة عدس}
            art: food-salad
            sub:
              en: "30 min"
              ar: "30 دقيقة"
          - kind: listitem
            text: {en: Stuffed vine leaves, ar: ورق عنب محشي}
            art: food-grill
            sub:
              en: "90 min"
              ar: "90 دقيقة"
          - kind: small
            text:
              en: "For everyone, fasting or not"
              ar: للجميع، صائمين أو لا
            color: muted
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: offer
        text:
          en: "Offer \"Fasting this month? Show iftar and suhoor recipes\""
          ar: نعرض «صائم هذا الشهر؟ اعرض وصفات الإفطار والسحور»
        mock:
          app: tabkha
          appbar:
            title: {en: Lunch for you, ar: غداء لك}
          blocks:
          - kind: card
            blocks:
            - kind: text
              text:
                en: "Fasting this month?"
                ar: صائم هذا الشهر؟
            - kind: button
              text: {en: Show iftar and suhoor recipes, ar: اعرض وصفات الإفطار والسحور}
              style: outline
              icon: moon
              gap: s
          - kind: listitem
            art: food-koshary
            text: {en: Koshary, ar: كشري}
            sub:
              en: "40 min"
              ar: "40 دقيقة"
            badge:
              text: {en: Skipped, ar: تخطّاه الناس}
              tone: neutral
            gap: m
          - kind: listitem
            art: food-grill
            text: {en: Grilled chicken with rice, ar: دجاج مشوي بالأرز}
            sub:
              en: "45 min"
              ar: "45 دقيقة"
            badge:
              text: {en: Skipped, ar: تخطّاه الناس}
              tone: neutral
          - kind: small
            color: muted
            text:
              en: "Lunch taps this month: down 70%"
              ar: "الضغطات على وصفات الغداء هذا الشهر: أقل بنسبة 70%"
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [offer]
    misconceptions:
      - id: MC-P12-040
        when: [new, all]
        feedback:
          en: "One misreads the reason; the other guesses everyone fasts. See the real reason, and let each person choose."
          ar: "الأول يُسيء فهم السبب؛ والثاني يخمّن أن الجميع صائمون. افهم السبب الحقيقي، واترك كل شخص يختار."
    correct:
