id: P12-U05-L03
mode: lesson
minutes: 7
title:
  en: "Hand back control safely"
  ar: "أعِد التحكّم بأمان"
summary:
  en: "Fix a clinic's phone assistant so patients reach a person, without repeating themselves."
  ar: "أصلح المساعد الهاتفي في عيادة، ليصل المرضى إلى شخص، دون أن يكرّروا كلامهم."
speaker: nour
sources:
  - title: { en: "Errors + Graceful Failure (People + AI Guidebook)", ar: "الأخطاء والفشل اللطيف (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/errors-failing/"
review_labels:
  MC-P12-042: { en: "Hand over with what people need", ar: "سلّم المهمة مع ما يحتاجه الناس" }
  MC-P12-038: { en: "Say what failed and what to try", ar: "قل ما الذي فشل وما الذي يمكن تجربته" }
  MC-P12-039: { en: "Offer a safe next step", ar: "قدّم خطوة تالية آمنة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Sorry, I didn't understand\"", ar: "«عذرًا، لم أفهم»" }
    body:
      en: "I manage a clinic. Our phone line now has an AI assistant that books appointments.\n\nWhen it doesn't understand, it says \"Sorry, I didn't understand\" again and again. Older patients hang up. Those who reach the receptionist have to explain everything from the start."
      ar: "أدير عيادة. وخطّ الهاتف عندنا أصبح فيه مساعد بالذكاء الاصطناعي يحجز المواعيد.\n\nوحين لا يفهم، يقول «عذرًا، لم أفهم» مرة بعد مرة. فيُغلق المرضى الكبار في السن الخط. ومن يصل إلى موظّفة الاستقبال يضطرّ أن يشرح كل شيء من البداية."
    mock:
      width: 300
      blocks:
        - { kind: meta, text: { en: "🤖 Sorry, I didn't understand.", ar: "🤖 عذرًا، لم أفهم." } }
        - { kind: meta, text: { en: "🤖 Sorry, I didn't understand.", ar: "🤖 عذرًا، لم أفهم." }, gap: s }
        - { kind: meta, text: { en: "🤖 Sorry, I didn't understand.", ar: "🤖 عذرًا، لم أفهم." }, gap: s }

  - id: S02
    type: choose
    skill: SK-P12-U05-04
    part: try
    rules: [R12]
    value:
      en: "Try first. Errors + Graceful Failure (People + AI): when an AI system fails, often the easiest way forward is to let people take over."
      ar: "جرّب أولًا. الأخطاء والفشل اللطيف (People + AI): حين يفشل نظام الذكاء الاصطناعي، غالبًا ما يكون أسهل طريق هو أن يتولّى الناس الأمر."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "When an AI system fails, often the easiest path forward is to let the user take over." }
    prompt:
      en: "What should happen after 2 failed tries?"
      ar: "ماذا يجب أن يحدث بعد محاولتين فاشلتين؟"
    options:
      - { id: keep, text: { en: "Keep trying; the patient will say it more clearly", ar: "يستمرّ في المحاولة؛ سيقولها المريض بوضوح أكثر" } }
      - { id: hand, text: { en: "Put the patient through to the receptionist, who sees what they already said", ar: "يحوّل المريض إلى موظّفة الاستقبال، التي ترى ما قاله بالفعل" } }
      - { id: later, text: { en: "Politely ask the patient to call back later", ar: "يطلب من المريض بلطف أن يتّصل لاحقًا" } }
    answer: [hand]
    misconceptions:
      - id: MC-P12-042
        when: [keep, later]
        feedback:
          en: "More tries just frustrate them, and \"call later\" drops them. After 2 fails, hand over to a person, with what's known."
          ar: "المحاولات الإضافية تُحبطهم فقط، و«اتّصل لاحقًا» تتخلّى عنهم. بعد فشلين، سلّم المكالمة لشخص، مع ما هو معروف."
    hints:
      - { en: "Will a third try likely work?", ar: "هل ستنجح المحاولة الثالثة على الأرجح؟" }
      - { en: "Who can finish the booking now?", ar: "من يستطيع إتمام الحجز الآن؟" }
    correct:
      en: "Right. Know when to stop, and hand over."
      ar: "صحيح. اعرف متى تتوقّف، وسلّم المهمة."
    explain:
      en: "The goal is the booking, not the AI's success. A person can finish it."
      ar: "الهدف هو الحجز، لا نجاح الذكاء الاصطناعي. وشخص يستطيع إتمامه."

  - id: S03
    type: card
    part: concept
    icons: [person, list, target, warn]
    title: { en: "Hand over, don't drop", ar: "سلّم المهمة، ولا تتخلَّ" }
    body:
      en: "- **Stop early:** after a couple of failed tries, stop repeating.\n- **Hand over** to a person, or to the manual way.\n- **Pass on what's known,** so nobody starts from zero.\n- **Say what happens next,** and why.\n- **Never just switch off** when that could leave people stuck or unsafe."
      ar: "- **توقّف مبكرًا:** بعد محاولتين فاشلتين، توقّف عن التكرار.\n- **سلّم المهمة** لشخص، أو للطريقة اليدوية.\n- **انقل ما هو معروف،** حتى لا يبدأ أحد من الصفر.\n- **قل ماذا سيحدث بعد ذلك،** ولماذا.\n- **لا تتوقّف فجأة أبدًا** حين قد يترك ذلك الناس عالقين أو في خطر."

  - id: S04
    type: choose
    skill: SK-P12-U05-04
    part: guided
    rules: [R06]
    value:
      en: "Errors + Graceful Failure (People + AI): people taking over need to know the situation, what to do next, and how."
      ar: "الأخطاء والفشل اللطيف (People + AI): من يتولّى المهمة يحتاج أن يعرف الموقف، وما الخطوة التالية، وكيف يفعلها."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "That means the user must have all the information they need in order to take the reins: awareness of the situation, what they need to do next, and how to do it." }
    scenario:
      en: "When a call is passed on, the receptionist's screen shows something."
      ar: "حين تُحوَّل مكالمة، تعرض شاشة موظّفة الاستقبال شيئًا."
    prompt:
      en: "What should it show?"
      ar: "ماذا يجب أن تعرض؟"
    options:
      - { id: ring, text: { en: "Just \"Incoming call\"", ar: "فقط «مكالمة واردة»" } }
      - { id: record, text: { en: "A recording of the whole call so far", ar: "تسجيل للمكالمة كلها حتى الآن" } }
      - { id: summary, text: { en: "\"Mrs. Samia · wants Dr. Ali next week · couldn't catch the day\"", ar: "«السيدة سامية · تريد د. علي الأسبوع القادم · لم يُفهم اليوم»" } }
    answer: [summary]
    misconceptions:
      - id: MC-P12-042
        when: [ring, record]
        feedback:
          en: "With nothing, the patient repeats it all; with a recording, the receptionist must listen while the patient waits. A short summary shows what's known and what's missing."
          ar: "دون شيء، يكرّر المريض كل شيء؛ ومع التسجيل، يجب أن تستمع الموظّفة والمريض ينتظر. والملخّص القصير يُظهر المعروف والناقص."
    hints:
      - { en: "What does the receptionist need in the first second?", ar: "ماذا تحتاج الموظّفة في الثانية الأولى؟" }
      - { en: "Which option shows what's missing?", ar: "أي خيار يُظهر ما ينقص؟" }
    correct:
      en: "Right. What's known, and what's left."
      ar: "صحيح. المعروف، والمتبقّي."
    explain:
      en: "The receptionist asks one question, the day, and the booking is done."
      ar: "تسأل الموظّفة سؤالًا واحدًا، عن اليوم، ويتمّ الحجز."

  - id: S05
    type: choose
    skill: SK-P12-U05-01
    part: guided
    rules: [R06]
    value:
      en: "Errors + Graceful Failure (People + AI): explain why a result couldn't be given, and offer other ways forward."
      ar: "الأخطاء والفشل اللطيف (People + AI): اشرح لماذا لم تُقدَّم النتيجة، وقدّم طرقًا أخرى للمضيّ."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Response: Explain why a certain result couldn’t be given and provide alternative paths forward." }
    scenario:
      en: "Before passing the call, the assistant says one sentence to the patient."
      ar: "قبل تحويل المكالمة، يقول المساعد جملة واحدة للمريض."
    prompt:
      en: "What should it say?"
      ar: "ماذا يجب أن يقول؟"
    options:
      - { id: explain, text: { en: "\"I couldn't catch the day. I'm putting you through to our receptionist; she can see what you told me.\"", ar: "«لم أفهم اليوم. سأحوّلك إلى موظّفة الاستقبال؛ وهي ترى ما قلته لي.»" } }
      - { id: hold, text: { en: "\"Please hold.\"", ar: "«انتظر من فضلك.»" } }
      - { id: error, text: { en: "\"An error has occurred.\"", ar: "«حدث خطأ.»" } }
    answer: [explain]
    misconceptions:
      - id: MC-P12-038
        when: [hold, error]
        feedback:
          en: "Neither says what happened or what's next. Patients may think they'll start over, or hang up."
          ar: "لا أحد منهما يقول ماذا حدث أو ماذا بعد. فقد يظنّ المرضى أنهم سيبدؤون من جديد، أو يُغلقون الخط."
    hints:
      - { en: "What is the patient worried about?", ar: "ما الذي يُقلق المريض؟" }
      - { en: "Which sentence answers that?", ar: "أي جملة تجيب عن ذلك؟" }
    correct:
      en: "Right. What failed, what's next, and that nothing is lost."
      ar: "صحيح. ما الذي فشل، وماذا بعد، وأن شيئًا لم يضِع."
    explain:
      en: "One clear sentence keeps the patient on the line."
      ar: "جملة واحدة واضحة تُبقي المريض على الخط."

  - id: S06
    type: compare
    skill: SK-P12-U05-04
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: switch off vs safe hand-over. Errors + Graceful Failure (People + AI): in some cases, suddenly going back to manual control could be risky or dangerous."
      ar: "مقارنة: إيقاف مفاجئ مقابل تسليم آمن. الأخطاء والفشل اللطيف (People + AI): في بعض الحالات، قد تكون العودة المفاجئة إلى التحكّم اليدوي خطرة."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "In some cases, reverting to manual control could be risky or dangerous." }
    scenario:
      en: "The clinic pharmacy uses an AI tool that warns when two medicines shouldn't be taken together. Sometimes it goes offline. Two designs:"
      ar: "صيدلية العيادة تستخدم أداة بالذكاء الاصطناعي تنبّه حين لا يجب تناول دواءين معًا. وأحيانًا تتوقّف عن العمل. وهذان تصميمان:"
    prompt:
      en: "Which design should we use?"
      ar: "أي تصميم يجب أن نستخدم؟"
    a:
      label: { en: "A: \"Checker offline. Check these 2 medicines in the printed guide (page 14), or ask the doctor before handing them over.\"", ar: "A: «أداة الفحص متوقّفة. افحص هذين الدواءين في الدليل المطبوع (صفحة 14)، أو اسأل الطبيب قبل تسليمهما.»" }
      mock:
        width: 300
        blocks:
          - { kind: banner, text: { en: "⚠ Checker offline", ar: "⚠ أداة الفحص متوقّفة" } }
          - { kind: meta, text: { en: "Check these 2 medicines in the printed guide (page 14), or ask the doctor before handing them over.", ar: "افحص هذين الدواءين في الدليل المطبوع (صفحة 14)، أو اسأل الطبيب قبل تسليمهما." }, gap: s }
    b:
      label: { en: "B: A small grey \"Offline\" label, and no warnings", ar: "B: علامة رمادية صغيرة «متوقّفة»، دون تنبيهات" }
      mock:
        width: 300
        blocks:
          - { kind: small, color: muted, text: { en: "Offline", ar: "متوقّفة" } }
          - { kind: meta, text: { en: "No warnings", ar: "لا توجد تنبيهات" }, gap: s }
    answer: a
    reason:
      prompt: { en: "Why is A better?", ar: "لماذا A أفضل؟" }
      options:
        - { id: safe, text: { en: "The pharmacist knows the check didn't happen, and how to do it by hand", ar: "يعرف الصيدلي أن الفحص لم يحدث، وكيف يقوم به يدويًا" } }
        - { id: big, text: { en: "Bigger messages are always better", ar: "الرسائل الأكبر أفضل دائمًا" } }
        - { id: blame, text: { en: "It moves the blame to the pharmacist", ar: "ينقل المسؤولية إلى الصيدلي" } }
      answer: [safe]
      misconceptions:
        - id: MC-P12-042
          when: [big, blame]
          feedback:
            en: "It's not about size or blame. \"No warnings\" could look like \"safe\". The pharmacist needs to know to check, and how."
            ar: "المسألة ليست الحجم أو المسؤولية. «لا توجد تنبيهات» قد تبدو كأنها «آمن». والصيدلي يحتاج أن يعرف أن عليه الفحص، وكيف."
    misconceptions:
      - id: MC-P12-042
        when: [b]
        feedback:
          en: "B is quiet, and dangerous: \"No warnings\" looks like the medicines are safe together, when nothing was checked."
          ar: "B هادئ، وخطِر: «لا توجد تنبيهات» تبدو كأن الدواءين آمنان معًا، بينما لم يُفحص شيء."
    hints:
      - { en: "What might a busy pharmacist think when they see \"No warnings\"?", ar: "ماذا قد يظنّ صيدلي مشغول حين يرى «لا توجد تنبيهات»؟" }
      - { en: "Which design tells them what to do instead?", ar: "أي تصميم يقول له ماذا يفعل بدلًا من ذلك؟" }
    correct:
      en: "Right. When AI stops, hand over clearly and safely."
      ar: "صحيح. حين يتوقّف الذكاء الاصطناعي، سلّم المهمة بوضوح وأمان."
    explain:
      en: "A silent failure in a safety tool can look like success. Make it loud, and give the manual way."
      ar: "الفشل الصامت في أداة سلامة قد يبدو نجاحًا. اجعله واضحًا، وقدّم الطريقة اليدوية."

  - id: S07
    type: choose
    skill: SK-P12-U05-03
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. Errors + Graceful Failure (People + AI): when stakes are higher, check that the alternative you offer is actually safe."
      ar: "حالة جديدة. الأخطاء والفشل اللطيف (People + AI): حين يكون الخطر أكبر، تأكّد أن البديل الذي تقدّمه آمن فعلًا."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "In the case of higher situational stakes, there should be an additional check to make sure the alternative is indeed a safe option." }
    scenario:
      en: "I own a restaurant. When a dish is sold out, our ordering app suggests the closest one. A customer with a nut allergy in her profile ordered chicken shawarma, now sold out. The closest dish has a peanut sauce."
      ar: "أملك مطعمًا. وحين ينفد طبق، يقترح تطبيق الطلبات أقرب طبق له. وعميلة لديها حساسية من المكسّرات في ملفّها طلبت شاورما دجاج، وقد نفدت. وأقرب طبق فيه صلصة فول سوداني."
    prompt:
      en: "What should the app suggest?"
      ar: "ماذا يجب أن يقترح التطبيق؟"
    options:
      - { id: closest, text: { en: "The closest dish anyway; she can read the ingredients", ar: "أقرب طبق على أي حال؛ فهي تستطيع قراءة المكوّنات" } }
      - { id: safe, text: { en: "The closest dish without nuts: \"Shawarma is sold out. Try chicken kebab (nut-free)?\"", ar: "أقرب طبق دون مكسّرات: «نفدت الشاورما. هل تجرّبين كباب الدجاج (خالٍ من المكسّرات)؟»" } }
      - { id: none, text: { en: "Just \"Sold out\", with no suggestion", ar: "فقط «نفد»، دون اقتراح" } }
    answer: [safe]
    misconceptions:
      - id: MC-P12-039
        when: [closest, none]
        feedback:
          en: "Suggesting peanuts to an allergic customer is dangerous, and \"Sold out\" alone leaves her stuck. Offer a close dish that's safe for her."
          ar: "اقتراح الفول السوداني لعميلة لديها حساسية أمر خطِر، و«نفد» وحدها تتركها عالقة. قدّم طبقًا قريبًا وآمنًا لها."
    hints:
      - { en: "What does the app know about her?", ar: "ماذا يعرف التطبيق عنها؟" }
      - { en: "Which option is both helpful and safe?", ar: "أي خيار مفيد وآمن معًا؟" }
    correct:
      en: "Right. Close, and safe."
      ar: "صحيح. قريب، وآمن."
    explain:
      en: "A good alternative fits what she asked for, and what she can't have."
      ar: "البديل الجيد يناسب ما طلبته، وما لا تستطيع تناوله."

  - id: S08
    type: card
    part: recap
    icons: [person, list, phone, warn, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Stopped early:** after 2 fails, the call goes to a person.\n- **Passed it on:** the receptionist sees what's known and missing.\n- **Said what's next:** \"She can see what you told me.\"\n- **No silent failure:** the offline checker says how to check by hand.\n- **New case:** you suggested a dish that's close, and safe for an allergy.\n\nNext: the skill check for this unit."
      ar: "- **توقّفت مبكرًا:** بعد فشلين، تُحوَّل المكالمة إلى شخص.\n- **نقلت المعلومات:** ترى الموظّفة المعروف والناقص.\n- **قلت ماذا بعد:** «وهي ترى ما قلته لي.»\n- **لا فشل صامت:** أداة الفحص المتوقّفة تقول كيف تفحص يدويًا.\n- **حالة جديدة:** اقترحت طبقًا قريبًا، وآمنًا لصاحبة الحساسية.\n\nالتالي: اختبار المهارة لهذه الوحدة."
