id: P12-U05
free: false
title:
  en: "Fail gracefully"
  ar: "تعامَل مع الفشل بلطف"
skill:
  en: "Plan for the moments AI gets it wrong: say what failed and what to try, don't act on guesses, hand back control safely, and keep AI out of people's habits."
  ar: "خطّط للّحظات التي يخطئ فيها الذكاء الاصطناعي: قل ما الذي فشل وما الذي يمكن تجربته، ولا تتصرّف بناءً على تخمين، وأعِد التحكّم للناس بأمان، وأبعِد الذكاء الاصطناعي عن عاداتهم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P12-U05-01
    title: { en: "Say what failed and what to try", ar: "قل ما الذي فشل وما الذي يمكن تجربته" }
    can_do: { en: "Write AI error messages that name the limit plainly and tell people what input works, or another way to finish.", ar: "اكتب رسائل خطأ للذكاء الاصطناعي تذكر الحدّ بوضوح، وتقول للناس ما المدخلات التي تنجح، أو طريقة أخرى لإكمال المهمة." }
  - id: SK-P12-U05-02
    title: { en: "Don't act on a guess", ar: "لا تتصرّف بناءً على تخمين" }
    can_do: { en: "Suggest instead of acting when the AI is unsure about someone's situation, and spot when a pattern has a reason the AI missed.", ar: "اقترح بدل أن تتصرّف حين لا يكون الذكاء الاصطناعي متأكّدًا من موقف الشخص، ولاحظ حين يكون للنمط سبب فاته الذكاء الاصطناعي." }
  - id: SK-P12-U05-03
    title: { en: "Offer a safe next step", ar: "قدّم خطوة تالية آمنة" }
    can_do: { en: "When the AI can't give what people asked for, offer the closest useful option, and check it's safe when the stakes are high.", ar: "حين لا يستطيع الذكاء الاصطناعي تقديم ما طلبه الناس، قدّم أقرب خيار مفيد، وتأكّد أنه آمن حين يكون الخطر كبيرًا." }
  - id: SK-P12-U05-04
    title: { en: "Hand back control with what people need", ar: "أعِد التحكّم مع ما يحتاجه الناس" }
    can_do: { en: "When the AI gives up, pass the task to the person or a human helper, with what's known, what's next, and how to do it.", ar: "حين يتوقّف الذكاء الاصطناعي، سلّم المهمة للشخص أو لموظّف، مع ما هو معروف، وما الخطوة التالية، وكيف تُنفَّذ." }
  - id: SK-P12-U05-05
    title: { en: "Keep AI out of people's habits", ar: "أبعِد الذكاء الاصطناعي عن عادات الناس" }
    can_do: { en: "Keep the buttons people tap by habit in fixed places, put changing AI picks in their own area, and let people go back to a layout they know.", ar: "أبقِ الأزرار التي يضغط عليها الناس بحكم العادة في أماكن ثابتة، وضع اختيارات الذكاء الاصطناعي المتغيّرة في مساحة خاصة بها، واسمح للناس بالعودة إلى تصميم يعرفونه." }
