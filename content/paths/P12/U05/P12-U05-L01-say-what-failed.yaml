id: P12-U05-L01
mode: lesson
minutes: 7
title:
  en: "Say what failed and what to try"
  ar: "قل ما الذي فشل وما الذي يمكن تجربته"
summary:
  en: "Rewrite a bill-scanning app's \"Error. Try again.\" so people know what to do next."
  ar: "أعد كتابة رسالة «خطأ. حاول مرة أخرى.» في تطبيق لمسح الفواتير، ليعرف الناس ماذا يفعلون بعدها."
speaker: sara
sources:
  - title: { en: "Errors + Graceful Failure (People + AI Guidebook)", ar: "الأخطاء والفشل اللطيف (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/errors-failing/"
review_labels:
  MC-P12-038: { en: "Say what failed and what to try", ar: "قل ما الذي فشل وما الذي يمكن تجربته" }
  MC-P12-039: { en: "Offer a safe next step", ar: "قدّم خطوة تالية آمنة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Error. Try again.\"", ar: "«خطأ. حاول مرة أخرى.»" }
    body:
      en: "I design a bill-paying app. You take a photo of your electricity bill, and AI reads the account number and amount.\n\nWhen it can't read the photo, it says: \"Error. Try again.\" People try again, and again, with the same blurry photo. Then they give up and pay at the counter."
      ar: "أصمّم تطبيقًا لدفع الفواتير. تلتقط صورة لفاتورة الكهرباء، فيقرأ الذكاء الاصطناعي رقم الحساب والمبلغ.\n\nوحين لا يستطيع قراءة الصورة، يقول: «خطأ. حاول مرة أخرى.» فيحاول الناس مرة بعد مرة، بالصورة الضبابية نفسها. ثم يستسلمون ويدفعون عند الشبّاك."
    mock:
      app: wasl
      appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
      blocks:
        - { kind: image, art: receipt }
        - { kind: banner, tone: bad, icon: warning, text: { en: "Error. Try again.", ar: "خطأ. حاول مرة أخرى." }, gap: s }
        - { kind: button, icon: camera, text: { en: "Try again", ar: "حاول مرة أخرى" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P12-U05-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Errors + Graceful Failure (People + AI): error messages should tell people as specifically as possible about the system's limits."
      ar: "جرّب أولًا. الأخطاء والفشل اللطيف (People + AI): رسائل الخطأ يجب أن تخبر الناس بأكبر قدر من التحديد عن حدود النظام."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Messages about user-perceived errors should inform the user as specifically as possible about the system’s limitations." }
    prompt:
      en: "What's wrong with \"Error. Try again.\"?"
      ar: "ما المشكلة في «خطأ. حاول مرة أخرى.»؟"
    options:
      - { id: polite, text: { en: "It isn't polite enough", ar: "ليست مهذّبة بما يكفي" } }
      - { id: what, text: { en: "It doesn't say what failed, or what to change", ar: "لا تقول ما الذي فشل، ولا ما الذي يجب تغييره" } }
      - { id: colour, text: { en: "It should be in red", ar: "يجب أن تكون باللون الأحمر" } }
    answer: [what]
    misconceptions:
      - id: MC-P12-038
        when: [polite, colour]
        feedback:
          en: "A kinder or redder message still leaves people guessing. They need to know what went wrong, and what to do differently."
          ar: "الرسالة الألطف أو الأكثر احمرارًا ما زالت تترك الناس يخمّنون. يحتاجون أن يعرفوا ما الخطأ، وماذا يفعلون بشكل مختلف."
    hints:
      - { en: "Why do people retry with the same photo?", ar: "لماذا يعيد الناس المحاولة بالصورة نفسها؟" }
      - { en: "What would they need to know to succeed?", ar: "ماذا يحتاجون أن يعرفوا لينجحوا؟" }
    correct:
      en: "Right. Say what failed and what to change."
      ar: "صحيح. قل ما الذي فشل وما الذي يجب تغييره."
    explain:
      en: "\"Try again\" alone just repeats the failure."
      ar: "«حاول مرة أخرى» وحدها تكرّر الفشل فقط."

  - id: S03
    type: card
    part: concept
    icons: [warn, target, other, person]
    title: { en: "When AI fails, show the way forward", ar: "حين يفشل الذكاء الاصطناعي، وضّح الطريق" }
    body:
      en: "AI will fail in ways you didn't plan for. What matters is what people can do next.\n\n- **Say what it couldn't do,** plainly: \"We couldn't read the account number.\"\n- **Say what it needs:** a clearer photo, the top half of the bill.\n- **Offer another way:** \"Or type the number.\"\n- **Keep the next step safe,** especially with money or health."
      ar: "سيفشل الذكاء الاصطناعي بطرق لم تخطّط لها. والمهم هو ما يستطيع الناس فعله بعدها.\n\n- **قل ما لم يستطع فعله،** بوضوح: «لم نستطع قراءة رقم الحساب.»\n- **قل ما يحتاجه:** صورة أوضح، النصف العلوي من الفاتورة.\n- **قدّم طريقة أخرى:** «أو اكتب الرقم.»\n- **اجعل الخطوة التالية آمنة،** خصوصًا مع المال أو الصحة."

  - id: S04
    type: tune
    skill: SK-P12-U05-01
    part: guided
    rules: [R06]
    value:
      en: "Errors + Graceful Failure (People + AI): explain what the system is supposed to do and how it works, then what it's missing or can't do."
      ar: "الأخطاء والفشل اللطيف (People + AI): اشرح ما يُفترض أن يفعله النظام وكيف يعمل، ثم ما ينقصه أو ما لا يستطيعه."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Response: Communicate what the system is supposed to do and how it works." }
    scenario:
      en: "The app reads bills from the two electricity companies only. A user scans a water bill."
      ar: "التطبيق يقرأ فواتير شركتَي الكهرباء فقط. ويمسح أحد المستخدمين فاتورة مياه."
    prompt:
      en: "Tap each option to see it. What should the message say?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن تقول الرسالة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: wasl
      appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
      blocks:
        - { kind: image, art: receipt }
        - { kind: small, color: muted, text: { en: "Your photo: water bill", ar: "صورتك: فاتورة مياه" }, gap: xs }
        - { kind: small, color: muted, text: { en: "The message goes here", ar: "هنا تظهر الرسالة" }, gap: s }
    options:
      - id: unknown
        text: { en: "\"Unknown document.\"", ar: "«مستند غير معروف.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
          blocks:
            - { kind: image, art: receipt }
            - { kind: small, color: muted, text: { en: "Your photo: water bill", ar: "صورتك: فاتورة مياه" }, gap: xs }
            - { kind: banner, tone: bad, icon: warning, text: { en: "Unknown document.", ar: "مستند غير معروف." }, gap: s }
            - { kind: button, icon: camera, text: { en: "Try again", ar: "حاول مرة أخرى" }, gap: s }
      - id: learning
        text: { en: "\"Oops! Our AI is still learning 🤖\"", ar: "«عذرًا! ذكاؤنا الاصطناعي ما زال يتعلّم 🤖»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
          blocks:
            - { kind: image, art: receipt }
            - { kind: small, color: muted, text: { en: "Your photo: water bill", ar: "صورتك: فاتورة مياه" }, gap: xs }
            - { kind: banner, tone: info, icon: robot, text: { en: "Oops! Our AI is still learning 🤖", ar: "عذرًا! ذكاؤنا الاصطناعي ما زال يتعلّم 🤖" }, gap: s }
            - { kind: button, icon: camera, text: { en: "Try again", ar: "حاول مرة أخرى" }, gap: s }
      - id: limit
        text: { en: "\"We can read electricity bills only. For water bills, type the account number.\"", ar: "«نستطيع قراءة فواتير الكهرباء فقط. لفواتير المياه، اكتب رقم الحساب.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
          blocks:
            - { kind: image, art: receipt }
            - { kind: small, color: muted, text: { en: "Your photo: water bill", ar: "صورتك: فاتورة مياه" }, gap: xs }
            - { kind: banner, tone: warn, icon: info, text: { en: "We can read electricity bills only. For water bills, type the account number.", ar: "نستطيع قراءة فواتير الكهرباء فقط. لفواتير المياه، اكتب رقم الحساب." }, gap: s }
            - { kind: button, icon: keyboard, text: { en: "Type the account number", ar: "اكتب رقم الحساب" }, gap: s }
    answer: [limit]
    misconceptions:
      - id: MC-P12-038
        when: [unknown, learning]
        feedback:
          en: "Neither says what the app can read, so people will keep trying. Name the limit, and give the other way."
          ar: "لا أحد منهما يقول ما يستطيع التطبيق قراءته، فسيستمرّ الناس في المحاولة. اذكر الحدّ، وقدّم الطريقة الأخرى."
    hints:
      - { en: "What does the app actually read?", ar: "ماذا يقرأ التطبيق فعلًا؟" }
      - { en: "What can someone with a water bill do?", ar: "ماذا يستطيع صاحب فاتورة المياه أن يفعل؟" }
    correct:
      en: "Right. Name the limit and the way around it."
      ar: "صحيح. اذكر الحدّ والطريق البديل."
    explain:
      en: "An error that teaches the limit stops people from trying the same thing again."
      ar: "الخطأ الذي يعلّم الحدّ يمنع الناس من تجربة الشيء نفسه مرة أخرى."

  - id: S05
    type: tune
    skill: SK-P12-U05-03
    part: guided
    rules: [R06]
    value:
      en: "Errors + Graceful Failure (People + AI): when it fails, the main goal is to prevent harm and help people move forward with their task."
      ar: "الأخطاء والفشل اللطيف (People + AI): حين يفشل، الهدف الأساسي هو منع الضرر ومساعدة الناس على المضيّ في مهمّتهم."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Your primary goal in these failstates should be to prevent undue harm to the user and help them move forward with their task." }
    scenario:
      en: "The app read the amount, 640, but not the account number."
      ar: "قرأ التطبيق المبلغ، 640، لكنه لم يقرأ رقم الحساب."
    prompt:
      en: "Tap each option to see it. What should happen next?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يحدث بعد ذلك؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: wasl
      appbar: { title: { en: "Check your bill", ar: "راجع فاتورتك" }, back: true }
      blocks:
        - { kind: listitem, icon: lightning, text: { en: "Cairo Electricity", ar: "كهرباء القاهرة" }, sub: { en: "From your photo", ar: "من صورتك" } }
        - { kind: listitem, text: { en: "Amount", ar: "المبلغ" }, value: { en: "640 EGP", ar: "640 جنيهًا" }, check: true }
        - { kind: listitem, text: { en: "Account number", ar: "رقم الحساب" }, badge: { text: { en: "Not read", ar: "لم يُقرأ" }, tone: bad } }
    options:
      - id: fill
        text: { en: "Keep 640, and ask them to type only the account number", ar: "نُبقي 640، ونطلب منهم كتابة رقم الحساب فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Check your bill", ar: "راجع فاتورتك" }, back: true }
          blocks:
            - { kind: listitem, icon: lightning, text: { en: "Cairo Electricity", ar: "كهرباء القاهرة" }, sub: { en: "From your photo", ar: "من صورتك" } }
            - { kind: field, label: { en: "Amount", ar: "المبلغ" }, text: { en: "640 EGP", ar: "640 جنيهًا" }, gap: s }
            - { kind: field, label: { en: "Account number", ar: "رقم الحساب" }, text: "", ring: true, gap: s }
            - { kind: small, color: muted, text: { en: "We couldn't read the account number. Type it from the top of the bill.", ar: "لم نستطع قراءة رقم الحساب. اكتبه من أعلى الفاتورة." }, gap: xs }
            - { kind: button, text: { en: "Pay 640 EGP", ar: "ادفع 640 جنيهًا" }, gap: s }
      - id: guess
        text: { en: "Fill in the account number from last month's bill, and pay", ar: "نملأ رقم الحساب من فاتورة الشهر الماضي، وندفع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Check your bill", ar: "راجع فاتورتك" }, back: true }
          blocks:
            - { kind: listitem, icon: lightning, text: { en: "Cairo Electricity", ar: "كهرباء القاهرة" }, sub: { en: "From your photo", ar: "من صورتك" } }
            - { kind: listitem, text: { en: "Amount", ar: "المبلغ" }, value: { en: "640 EGP", ar: "640 جنيهًا" } }
            - { kind: listitem, text: { en: "Account number", ar: "رقم الحساب" }, value: "40213377", sub: { en: "From last month's bill", ar: "من فاتورة الشهر الماضي" } }
            - { kind: button, text: { en: "Pay 640 EGP", ar: "ادفع 640 جنيهًا" }, gap: s }
      - id: restart
        text: { en: "Fail the whole scan and start over", ar: "نُلغي المسح كله ونبدأ من جديد" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: wasl
          appbar: { title: { en: "Scan your bill", ar: "امسح فاتورتك" }, back: true }
          blocks:
            - { kind: image, art: receipt }
            - { kind: banner, tone: bad, icon: warning, text: { en: "Scan failed. Start over.", ar: "فشل المسح. ابدأ من جديد." }, gap: s }
            - { kind: button, icon: camera, text: { en: "Scan again", ar: "امسح مرة أخرى" }, gap: s }
    answer: [fill]
    misconceptions:
      - id: MC-P12-039
        when: [guess, restart]
        feedback:
          en: "Guessing could pay someone else's bill, and starting over throws away what worked. Keep what's right, and ask for the missing part."
          ar: "التخمين قد يدفع فاتورة شخص آخر، والبدء من جديد يرمي ما نجح. احتفظ بالصحيح، واطلب الجزء الناقص."
    hints:
      - { en: "What could go wrong if the app guesses with money?", ar: "ماذا قد يحدث إذا خمّن التطبيق في أمر يخصّ المال؟" }
      - { en: "Which option keeps what already worked?", ar: "أي خيار يحتفظ بما نجح بالفعل؟" }
    correct:
      en: "Right. Keep what worked, ask for the rest."
      ar: "صحيح. احتفظ بما نجح، واطلب الباقي."
    explain:
      en: "A partial failure doesn't need a full restart, or a risky guess."
      ar: "الفشل الجزئي لا يحتاج إعادة كاملة، ولا تخمينًا خطِرًا."

  - id: S06
    type: compare
    skill: SK-P12-U05-03
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: dead end vs a likely match. Errors + Graceful Failure (People + AI): check the input against expected answers, to see if people meant one of them."
      ar: "مقارنة: طريق مسدود مقابل اقتراح محتمل. الأخطاء والفشل اللطيف (People + AI): قارن المدخلات بالإجابات المتوقّعة، لترى هل قصد الناس إحداها."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Response: Check the user’s input versus a range of “expected” answers to see if they intended one of those inputs." }
    scenario:
      en: "In the app's search, someone types \"electrcity\" with a typo. Two designs:"
      ar: "في بحث التطبيق، يكتب شخص «كهربا» بخطأ إملائي. وهذان تصميمان:"
    prompt:
      en: "Which design should we use?"
      ar: "أي تصميم يجب أن نستخدم؟"
    a:
      label: { en: "A: \"No results for electrcity\"", ar: "A: «لا توجد نتائج لـ كهربا»" }
      mock:
        app: wasl
        appbar: { title: { en: "Pay a bill", ar: "ادفع فاتورة" }, back: true }
        blocks:
          - { kind: searchbar, text: { en: "electrcity", ar: "كهربا" } }
          - { kind: icon, icon: magnifying-glass, gap: m }
          - { kind: text, text: { en: "No results for \"electrcity\"", ar: "لا توجد نتائج لـ «كهربا»" }, gap: s }
    b:
      label: { en: "B: \"Showing results for electricity\", with \"Search for electrcity instead\"", ar: "B: «نعرض نتائج كهرباء»، مع «ابحث عن كهربا بدلًا من ذلك»" }
      mock:
        app: wasl
        appbar: { title: { en: "Pay a bill", ar: "ادفع فاتورة" }, back: true }
        blocks:
          - { kind: searchbar, text: { en: "electrcity", ar: "كهربا" } }
          - { kind: small, text: { en: "Showing results for electricity", ar: "نعرض نتائج «كهرباء»" }, gap: s }
          - { kind: link, text: { en: "Search for \"electrcity\" instead", ar: "ابحث عن «كهربا» بدلًا من ذلك" } }
          - { kind: listitem, icon: lightning, text: { en: "Cairo Electricity", ar: "كهرباء القاهرة" }, chevron: true, gap: s }
          - { kind: listitem, icon: lightning, text: { en: "Delta Electricity", ar: "كهرباء الدلتا" }, chevron: true }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: move, text: { en: "It finds what they most likely meant, and still lets them choose", ar: "يجد ما قصدوه على الأرجح، ويتركهم يختارون أيضًا" } }
        - { id: smart, text: { en: "It makes the app look smarter", ar: "يجعل التطبيق يبدو أذكى" } }
        - { id: typo, text: { en: "It teaches people to spell", ar: "يعلّم الناس الإملاء" } }
      answer: [move]
      misconceptions:
        - id: MC-P12-039
          when: [smart, typo]
          feedback:
            en: "It's about getting them to their bill, not looks or spelling. The link back keeps them in charge."
            ar: "المسألة إيصالهم إلى فاتورتهم، لا الشكل أو الإملاء. ورابط العودة يُبقيهم أصحاب القرار."
    misconceptions:
      - id: MC-P12-039
        when: [a]
        feedback:
          en: "A is accurate, but it's a dead end. The app can tell what they meant, so it should offer it."
          ar: "A دقيق، لكنه طريق مسدود. والتطبيق يستطيع أن يعرف ما قصدوه، فيجب أن يعرضه."
    hints:
      - { en: "What were they most likely looking for?", ar: "عمّ كانوا يبحثون على الأرجح؟" }
      - { en: "Which design gets them there?", ar: "أي تصميم يوصلهم إلى هناك؟" }
    correct:
      en: "Right. Turn a dead end into a likely match."
      ar: "صحيح. حوّل الطريق المسدود إلى اقتراح محتمل."
    explain:
      en: "A good guess plus a way back is better than \"no results\"."
      ar: "التخمين الجيد مع طريق للعودة أفضل من «لا توجد نتائج»."

  - id: S07
    type: tune
    skill: SK-P12-U05-01
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. Errors + Graceful Failure (People + AI): use error states to tell people what input the AI needs, or how it works."
      ar: "حالة جديدة. الأخطاء والفشل اللطيف (People + AI): استخدم حالات الخطأ لتخبر الناس ما المدخلات التي يحتاجها الذكاء الاصطناعي، أو كيف يعمل."
    ref: { url: "https://pair.withgoogle.com/chapter/errors-failing/", quote: "Use error states to tell the user what inputs the AI needs or how the AI works." }
    scenario:
      en: "I'm building voice search for a grocery app. When people say a long sentence, like \"I want the big bottle of the oil I usually get\", it fails and says \"Sorry, I didn't get that.\""
      ar: "أبني البحث الصوتي لتطبيق بقالة. وحين يقول الناس جملة طويلة، مثل «أريد الزجاجة الكبيرة من الزيت الذي أشتريه عادةً»، يفشل ويقول «عذرًا، لم أفهم.»"
    prompt:
      en: "Tap each option to see it. What should it say instead?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يقول بدلًا من ذلك؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: sallah
