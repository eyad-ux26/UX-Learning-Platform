  - id: S08
    type: card
    part: recap
    icons: [warn, target, ok, search, phone]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Found the problem:** \"Error. Try again.\" says nothing useful.\n- **Named the limit:** electricity bills only; type water bills.\n- **Kept what worked:** the amount stays, only the account number is asked.\n- **Likely match:** \"Showing results for electricity\".\n- **New case:** you showed voice search users a short phrase that works.\n\nNext lesson: don't act on a guess."
      ar: "- **وجدت المشكلة:** «خطأ. حاول مرة أخرى.» لا تقول شيئًا مفيدًا.\n- **ذكرت الحدّ:** فواتير الكهرباء فقط؛ واكتب فواتير المياه.\n- **احتفظت بما نجح:** المبلغ يبقى، ونطلب رقم الحساب فقط.\n- **اقتراح محتمل:** «نعرض نتائج كهرباء».\n- **حالة جديدة:** عرضت على مستخدمي البحث الصوتي عبارة قصيرة تنجح.\n\nالدرس التالي: لا تتصرّف بناءً على تخمين."
