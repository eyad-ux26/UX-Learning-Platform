id: P12-U03-L03
mode: lesson
minutes: 7
title:
  en: "Show confidence people can use"
  ar: "اعرض الثقة بطريقة يمكن العمل بها"
summary:
  en: "Replace a clothes shop's \"83.7% match\" size score with something customers can act on."
  ar: "استبدل درجة «تطابق 83.7%» للمقاس في متجر ملابس بشيء يستطيع العملاء العمل به."
speaker: sara
sources:
  - title: { en: "Explainability + Trust (People + AI Guidebook)", ar: "قابلية الشرح والثقة (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/explainability-trust/"
review_labels:
  MC-P12-026: { en: "Show confidence only if it changes a decision", ar: "اعرض الثقة فقط إذا غيّرت القرار" }
  MC-P12-027: { en: "Don't let a high number hide doubt", ar: "لا تجعل رقمًا مرتفعًا يُخفي الشك" }
  MC-P12-028: { en: "Say what to do at each level", ar: "قل ماذا يفعلون في كل مستوى" }
  MC-P12-029: { en: "When unsure, show the options", ar: "حين لا يكون متأكّدًا، اعرض الخيارات" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Is 83.7% good?\"", ar: "«هل 83.7% جيدة؟»" }
    body:
      en: "I design a clothes shop app. It suggests your size from your height, weight and past orders. Next to it, we show a score: \"M · 83.7% match\".\n\nCustomers keep asking: is 83.7% good? Should I order it? And returns for wrong sizes are still high."
      ar: "أصمّم تطبيقًا لمتجر ملابس. يقترح مقاسك من طولك ووزنك وطلباتك السابقة. وبجانبه نعرض درجة: «M · تطابق 83.7%».\n\nوالعملاء يسألون دائمًا: هل 83.7% جيدة؟ هل أطلبه؟ وما زالت المرتجعات بسبب المقاس الخطأ كثيرة."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Classic jeans", ar: "جينز كلاسيكي" } }
        - { kind: meta, text: { en: "Your size: M · 83.7% match", ar: "مقاسك: M · تطابق 83.7%" }, gap: s }
        - { kind: button, text: { en: "Add to bag", ar: "أضف إلى السلّة" }, gap: m }

  - id: S02
    type: choose
    skill: SK-P12-U03-05
    part: try
    rules: [R12]
    value:
      en: "Try first. Explainability + Trust (People + AI): people may not know if a value like 80% is low or high, or what it means for them."
      ar: "جرّب أولًا. قابلية الشرح والثقة (People + AI): قد لا يعرف الناس إن كانت قيمة مثل 80% منخفضة أم مرتفعة، أو ماذا تعني لهم."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Novice users may not know whether a value like 80% is low or high for a certain context, or what that means for them." }
    prompt:
      en: "What's wrong with \"83.7% match\"?"
      ar: "ما المشكلة في «تطابق 83.7%»؟"
    options:
      - { id: decimals, text: { en: "It needs more decimals to be exact", ar: "يحتاج أرقامًا عشرية أكثر ليكون دقيقًا" } }
      - { id: action, text: { en: "It doesn't tell customers if that's good, or what to do", ar: "لا يقول للعملاء إن كان جيدًا، أو ماذا يفعلون" } }
      - { id: small, text: { en: "The number is too small to see", ar: "الرقم صغير جدًا ولا يُرى" } }
    answer: [action]
    misconceptions:
      - id: MC-P12-028
        when: [decimals, small]
        feedback:
          en: "The problem isn't how it looks. Customers can't turn 83.7% into a choice: order this size, or check first?"
          ar: "المشكلة ليست في شكله. العملاء لا يستطيعون تحويل 83.7% إلى قرار: هل يطلبون هذا المقاس، أم يراجعون أولًا؟"
    hints:
      - { en: "What question do customers keep asking?", ar: "ما السؤال الذي يكرّره العملاء؟" }
      - { en: "Does the number answer it?", ar: "هل يجيب الرقم عنه؟" }
    correct:
      en: "Right. A number alone isn't a decision."
      ar: "صحيح. الرقم وحده ليس قرارًا."
    explain:
      en: "Confidence helps only when people know what to do with it."
      ar: "درجة الثقة تفيد فقط حين يعرف الناس ماذا يفعلون بها."

  - id: S03
    type: card
    part: concept
    icons: [target, check, list, warn]
    title: { en: "Turn confidence into a next step", ar: "حوّل الثقة إلى خطوة تالية" }
    body:
      en: "- **Show it only if it changes a decision.** If people would act the same way, leave it out.\n- **Link each level to an action:** \"Good fit\" → add to bag. \"Not sure\" → check the size chart.\n- **When it's unsure, show the options:** \"M or L?\"\n- **Avoid bare numbers.** Few people know if 83.7% is good, and a high number can hide doubt."
      ar: "- **اعرضها فقط إذا غيّرت القرار.** إذا كان الناس سيفعلون الشيء نفسه، فاحذفها.\n- **اربط كل مستوى بفعل:** «مناسب» ← أضف إلى السلّة. «غير متأكّد» ← راجع جدول المقاسات.\n- **حين لا يكون متأكّدًا، اعرض الخيارات:** «M أم L؟»\n- **تجنّب الأرقام وحدها.** قليلون يعرفون إن كانت 83.7% جيدة، والرقم المرتفع قد يُخفي الشك."

  - id: S04
    type: choose
    skill: SK-P12-U03-04
    part: guided
    rules: [R06]
    value:
      en: "Explainability + Trust (People + AI): if confidence doesn't change people's decisions, consider not showing it."
      ar: "قابلية الشرح والثقة (People + AI): إذا كانت درجة الثقة لا تغيّر قرارات الناس، ففكّر في عدم عرضها."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "If it doesn’t make an impact on user decision making, consider not showing it." }
    scenario:
      en: "For T-shirts, nearly every customer keeps the suggested size. The score is always 97% to 99%."
      ar: "في التيشيرتات، يحتفظ كل العملاء تقريبًا بالمقاس المقترح. والدرجة دائمًا بين 97% و99%."
    prompt:
      en: "What should the T-shirt page show?"
      ar: "ماذا يجب أن تعرض صفحة التيشيرت؟"
    options:
      - { id: score, text: { en: "\"Your size: M · 98.2% match\"", ar: "«مقاسك: M · تطابق 98.2%»" } }
      - { id: chart, text: { en: "A small chart of how sure it is", ar: "رسم بياني صغير لمدى تأكّده" } }
      - { id: plain, text: { en: "Just \"Your size: M\"", ar: "فقط «مقاسك: M»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P12-026
        when: [score, chart]
        feedback:
          en: "The score never changes what anyone does. It's just one more thing to read."
          ar: "الدرجة لا تغيّر أبدًا ما يفعله أي شخص. إنها مجرد شيء إضافي للقراءة."
    hints:
      - { en: "Would any customer act differently at 97% or 99%?", ar: "هل سيتصرّف أي عميل بشكل مختلف عند 97% أو 99%؟" }
      - { en: "If not, does the score help?", ar: "إذا لم يتصرّف، فهل تفيد الدرجة؟" }
    correct:
      en: "Right. No decision, no score."
      ar: "صحيح. لا قرار، إذن لا درجة."
    explain:
      en: "When the answer is almost always right, the score adds noise, not help."
      ar: "حين تكون الإجابة صحيحة دائمًا تقريبًا، تضيف الدرجة تشويشًا، لا مساعدة."

  - id: S05
    type: choose
    skill: SK-P12-U03-05
    part: guided
    rules: [R06]
    value:
      en: "Explainability + Trust (People + AI): showing several options prompts people to rely on their own judgment."
      ar: "قابلية الشرح والثقة (People + AI): عرض عدّة خيارات يدفع الناس إلى الاعتماد على تقديرهم."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Showing multiple options prompts the user to rely on their own judgement." }
    scenario:
      en: "For jeans, the app is often torn between two sizes."
      ar: "في الجينز، كثيرًا ما يتردّد التطبيق بين مقاسين."
    prompt:
      en: "What should it show when it's unsure?"
      ar: "ماذا يجب أن يعرض حين لا يكون متأكّدًا؟"
    options:
      - { id: two, text: { en: "\"M or L. Between sizes? L fits looser.\"", ar: "«M أم L. بين مقاسين؟ L أوسع قليلًا.»" } }
      - { id: top, text: { en: "\"Your size: M\"; just pick the most likely one", ar: "«مقاسك: M»؛ نختار الأرجح فقط" } }
      - { id: low, text: { en: "\"Your size: M (51% match)\"", ar: "«مقاسك: M (تطابق 51%)»" } }
    answer: [two]
    misconceptions:
      - id: MC-P12-029
        when: [top, low]
        feedback:
          en: "One size hides the doubt, and 51% leaves them guessing. Two options let them choose with what they know."
          ar: "مقاس واحد يُخفي الشك، و51% تتركهم يخمّنون. وخياران يتركانهم يختارون بما يعرفونه."
    hints:
      - { en: "What do customers know that the app doesn't?", ar: "ماذا يعرف العملاء ولا يعرفه التطبيق؟" }
      - { en: "Which option lets them use it?", ar: "أي خيار يتركهم يستخدمونه؟" }
    correct:
      en: "Right. When unsure, show the choices."
      ar: "صحيح. حين لا يكون متأكّدًا، اعرض الخيارات."
    explain:
      en: "Customers know how they like jeans to fit. Two options let them use that."
      ar: "العملاء يعرفون كيف يحبّون مقاس الجينز. والخياران يتركانهم يستخدمون ذلك."

  - id: S06
    type: compare
    skill: SK-P12-U03-05
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: level vs next step. Explainability + Trust (People + AI): clearly show what action to take under each level of confidence."
      ar: "مقارنة: مستوى مقابل خطوة تالية. قابلية الشرح والثقة (People + AI): وضّح أي فعل يقوم به الناس في كل مستوى من الثقة."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Clearly indicate what action a user should take under each category of confidence." }
    scenario:
      en: "We're replacing the score with two labels. Here are two designs:"
      ar: "نستبدل الدرجة بعبارتين. وهذان تصميمان:"
    prompt:
      en: "Which design should we use?"
      ar: "أي تصميم يجب أن نستخدم؟"
    a:
      label: { en: "A: \"Confidence: High\" or \"Confidence: Low\"", ar: "A: «الثقة: عالية» أو «الثقة: منخفضة»" }
      mock:
        width: 300
        blocks:
          - { kind: meta, text: { en: "Shirt · M · Confidence: High", ar: "قميص · M · الثقة: عالية" } }
          - { kind: meta, text: { en: "Jeans · M · Confidence: Low", ar: "جينز · M · الثقة: منخفضة" }, gap: s }
    b:
      label: { en: "B: \"Good fit\" or \"Not sure: check the size chart\"", ar: "B: «مناسب» أو «غير متأكّد: راجع جدول المقاسات»" }
      mock:
        width: 300
        blocks:
          - { kind: meta, text: { en: "Shirt · M · Good fit", ar: "قميص · M · مناسب" } }
          - { kind: meta, text: { en: "Jeans · M · Not sure: check the size chart →", ar: "جينز · M · غير متأكّد: راجع جدول المقاسات ←" }, gap: s }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: friendly, text: { en: "\"Good fit\" sounds friendlier", ar: "«مناسب» تبدو أكثر ودًّا" } }
        - { id: short, text: { en: "B has fewer words", ar: "B فيه كلمات أقل" } }
        - { id: act, text: { en: "Each label tells customers what to do next", ar: "كل عبارة تقول للعملاء ماذا يفعلون بعدها" } }
      answer: [act]
      misconceptions:
        - id: MC-P12-028
          when: [friendly, short]
          feedback:
            en: "It's not about tone or length. \"Low\" leaves people stuck; \"check the size chart\" gives them a step."
            ar: "المسألة ليست الأسلوب أو الطول. «منخفضة» تترك الناس حائرين؛ و«راجع جدول المقاسات» تعطيهم خطوة."
    misconceptions:
      - id: MC-P12-028
        when: [a]
        feedback:
          en: "A is clearer than a number, but \"Low\" still leaves customers asking: so what do I do?"
          ar: "A أوضح من الرقم، لكن «منخفضة» ما زالت تترك العملاء يسألون: إذن ماذا أفعل؟"
    hints:
      - { en: "What does a customer do after reading \"Confidence: Low\"?", ar: "ماذا يفعل العميل بعد أن يقرأ «الثقة: منخفضة»؟" }
      - { en: "Which design answers that for them?", ar: "أي تصميم يجيب عن ذلك لهم؟" }
    correct:
      en: "Right. Each level comes with a next step."
      ar: "صحيح. كل مستوى تأتي معه خطوة تالية."
    explain:
      en: "Labels that say what to do turn confidence into a choice people can make."
      ar: "العبارات التي تقول ماذا تفعل تحوّل الثقة إلى قرار يستطيع الناس اتّخاذه."

  - id: S07
    type: choose
    skill: SK-P12-U03-04
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. Explainability + Trust (People + AI): a misleadingly high confidence can make people accept a result without thinking."
      ar: "حالة جديدة. قابلية الشرح والثقة (People + AI): الثقة المرتفعة المضلِّلة قد تجعل الناس يقبلون النتيجة دون تفكير."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "A misleadingly high confidence, for example, may cause users to blindly accept a result." }
    scenario:
      en: "I own a shop. My stock app now predicts sales. For a new product with only 3 days of sales, it says: \"99% sure: order 200 more.\""
      ar: "أملك متجرًا. وتطبيق المخزون عندي أصبح يتوقّع المبيعات. ولمنتج جديد عمره 3 أيام من المبيعات فقط، يقول: «متأكّد 99%: اطلب 200 قطعة أخرى.»"
    prompt:
      en: "What should it say instead?"
      ar: "ماذا يجب أن يقول بدلًا من ذلك؟"
    options:
      - { id: keep, text: { en: "Keep it; 99% is reassuring", ar: "يبقى كما هو؛ فـ 99% مطمئنة" } }
      - { id: early, text: { en: "\"Early guess, from only 3 days of sales. Order a few, and check again next week.\"", ar: "«تخمين مبكر، من 3 أيام مبيعات فقط. اطلب كمية صغيرة، وراجع مرة أخرى الأسبوع القادم.»" } }
      - { id: hide, text: { en: "Never show predictions for new products", ar: "لا نعرض توقّعات للمنتجات الجديدة أبدًا" } }
    answer: [early]
    misconceptions:
      - id: MC-P12-027
        when: [keep, hide]
        feedback:
          en: "\"99%\" invites a big order without a second thought, and hiding it loses a useful hint. Say it's an early guess."
          ar: "«99%» تدفع إلى طلب كبير دون تفكير، وإخفاؤها يُضيّع تلميحًا مفيدًا. قل إنه تخمين مبكر."
    hints:
      - { en: "How much can 3 days of sales tell you?", ar: "كم تستطيع 3 أيام مبيعات أن تخبرك؟" }
      - { en: "Which option keeps the hint, but stays honest?", ar: "أي خيار يحتفظ بالتلميح، ويبقى صادقًا؟" }
    correct:
      en: "Right. Don't let a big number hide thin data."
      ar: "صحيح. لا تجعل رقمًا كبيرًا يُخفي بيانات قليلة."
    explain:
      en: "An honest label and a small next step protect me from a costly mistake."
      ar: "العبارة الصادقة والخطوة الصغيرة تحميانني من خطأ مكلف."

  - id: S08
    type: card
    part: recap
    icons: [warn, none, list, check, money]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Found the problem:** \"83.7%\" doesn't tell customers what to do.\n- **Left it out:** T-shirts need no score, because it changes nothing.\n- **Showed the options:** \"M or L?\" when the app is unsure.\n- **Added next steps:** \"Not sure: check the size chart\".\n- **New case:** you turned a misleading \"99% sure\" into an honest early guess.\n\nNext: the skill check for this unit."
      ar: "- **وجدت المشكلة:** «83.7%» لا تقول للعملاء ماذا يفعلون.\n- **حذفتها:** التيشيرتات لا تحتاج درجة، لأنها لا تغيّر شيئًا.\n- **عرضت الخيارات:** «M أم L؟» حين لا يكون التطبيق متأكّدًا.\n- **أضفت خطوات تالية:** «غير متأكّد: راجع جدول المقاسات».\n- **حالة جديدة:** حوّلت «متأكّد 99%» المضلِّلة إلى تخمين مبكر صادق.\n\nالتالي: اختبار المهارة لهذه الوحدة."
