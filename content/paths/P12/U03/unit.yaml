id: P12-U03
free: false
title:
  en: "Explain and earn the right trust"
  ar: "اشرح واكسب الثقة المناسبة"
skill:
  en: "Help people know when to trust an AI result and when to check it: give the reason that matters, say what data it uses, and show confidence they can act on."
  ar: "ساعد الناس أن يعرفوا متى يثقون بنتيجة الذكاء الاصطناعي ومتى يراجعونها: اذكر السبب المهم، وقل ما البيانات التي يستخدمها، واعرض درجة الثقة بطريقة يستطيعون العمل بها."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P12-U03-01
    title: { en: "Give the reason that matters", ar: "اذكر السبب المهم" }
    can_do: { en: "Explain an AI result with the one reason people can check, right where and when they see it, without the full technical story.", ar: "اشرح نتيجة الذكاء الاصطناعي بالسبب الواحد الذي يستطيع الناس التأكّد منه، في مكانها ووقتها، دون القصة التقنية كاملة." }
  - id: SK-P12-U03-02
    title: { en: "Say what data it uses, and what it doesn't know", ar: "قل ما البيانات التي يستخدمها، وما لا يعرفه" }
    can_do: { en: "Name the data behind a result, offer a way to stop using it, and admit when missing data means people should use their own judgment.", ar: "اذكر البيانات التي بُنيت عليها النتيجة، وقدّم طريقة لإيقاف استخدامها، واعترف حين تعني البيانات الناقصة أن على الناس استخدام تقديرهم." }
  - id: SK-P12-U03-03
    title: { en: "Explain more when more is at stake", ar: "اشرح أكثر حين يكون الخطر أكبر" }
    can_do: { en: "Skip explanations for simple, low-risk results, and give the why and what to check when a wrong result could hurt health, money or safety.", ar: "تجاوز الشرح للنتائج البسيطة قليلة الخطر، واذكر السبب وما يجب مراجعته حين قد تضرّ نتيجة خطأ بالصحة أو المال أو السلامة." }
  - id: SK-P12-U03-04
    title: { en: "Show confidence only if it helps decide", ar: "اعرض درجة الثقة فقط إذا ساعدت على القرار" }
    can_do: { en: "Leave out confidence scores that change no decision, avoid false precision, and never let a high number hide weak data.", ar: "احذف درجات الثقة التي لا تغيّر أي قرار، وتجنّب الدقة الزائفة، ولا تسمح أبدًا لرقم مرتفع أن يُخفي بيانات ضعيفة." }
  - id: SK-P12-U03-05
    title: { en: "Show confidence people can act on", ar: "اعرض الثقة بطريقة يمكن العمل بها" }
    can_do: { en: "Turn confidence into labels that say what to do next, and show the main options when the system is unsure.", ar: "حوّل درجة الثقة إلى عبارات تقول ماذا تفعل بعدها، واعرض الخيارات الأساسية حين لا يكون النظام متأكّدًا." }
