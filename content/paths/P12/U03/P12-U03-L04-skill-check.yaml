id: P12-U03-L04
mode: check
minutes: 6
title:
  en: "Skill check: explain and earn the right trust"
  ar: "اختبار المهارة: اشرح واكسب الثقة المناسبة"
summary:
  en: "Review how a food app explains its calorie guesses from meal photos, on your own."
  ar: "راجِع كيف يشرح تطبيق طعام تقديراته للسعرات من صور الوجبات، بنفسك."
speaker: rami
sources:
  - title: { en: "Explainability + Trust (People + AI Guidebook)", ar: "قابلية الشرح والثقة (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/explainability-trust/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Rami's review", ar: "مراجعة رامي" }
    body:
      en: "I'm a junior designer on a food app. You take a photo of your meal, and it guesses the calories. I'm reviewing it before launch.\n\nYour job: check five parts.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أنا مصمّم مبتدئ في تطبيق طعام. تلتقط صورة لوجبتك، فيقدّر سعراتها الحرارية. وأراجعه قبل الإطلاق.\n\nمهمّتك: افحص خمسة أجزاء.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: sahn
      appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
      blocks:
        - { kind: image, art: food-grill }
        - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
        - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
        - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }

  - id: S02
    type: tune
    skill: SK-P12-U03-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Explainability + Trust (People + AI): don't try to explain everything, just the parts that affect trust and decisions."
      ar: "اختبار مهارة. قابلية الشرح والثقة (People + AI): لا تحاول شرح كل شيء، فقط الأجزاء التي تؤثّر في الثقة والقرار."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "In many cases the best approach is not to attempt to explain everything – just the aspects that impact user trust and decision-making." }
    scenario:
      en: "Under \"About 650 kcal\" there's a \"Why?\" link."
      ar: "تحت «حوالي 650 سعرة» يوجد رابط «لماذا؟»."
    prompt:
      en: "Tap each option to see it. What should it show?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يعرض؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: sahn
      appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
      blocks:
        - { kind: image, art: food-grill }
        - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
        - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
        - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
    options:
      - id: tech
        text: { en: "\"Estimated by a vision model trained on 2 million meal photos.\"", ar: "«مقدَّر بنموذج رؤية مدرّب على مليونَي صورة وجبة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
          overlay:
            type: sheet
            title: { en: "Why about 650 kcal?", ar: "لماذا حوالي 650 سعرة؟" }
            blocks:
              - { kind: text, text: { en: "Estimated by a vision model trained on 2 million meal photos.", ar: "مقدَّر بنموذج رؤية مدرّب على مليونَي صورة وجبة." } }
      - id: parts
        text: { en: "\"We see rice, grilled chicken and salad. Portions are guessed from the plate size.\"", ar: "«نرى أرزًا ودجاجًا مشويًا وسلطة. والكميات مقدَّرة من حجم الطبق.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
          overlay:
            type: sheet
            title: { en: "Why about 650 kcal?", ar: "لماذا حوالي 650 سعرة؟" }
            blocks:
              - { kind: text, text: { en: "We see rice, grilled chicken and salad. Portions are guessed from the plate size.", ar: "نرى أرزًا ودجاجًا مشويًا وسلطة. والكميات مقدَّرة من حجم الطبق." } }
      - id: none
        text: { en: "Remove the link; people just want the number", ar: "نحذف الرابط؛ فالناس يريدون الرقم فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
    answer: [parts]
    misconceptions:
      - id: MC-P12-021
        when: [tech, none]
        feedback:
          en: "People want to check the guess. Listing what it saw lets them spot a mistake, like rice that was really bulgur."
          ar: "الناس يريدون التأكّد من التقدير. وذِكر ما رآه يجعلهم يلاحظون الخطأ، مثل أرز هو في الحقيقة برغل."
    explain:
      en: "From Lesson 1: give the reason people can check, not the whole system."
      ar: "من الدرس 1: اذكر السبب الذي يستطيع الناس التأكّد منه، لا النظام كله."

  - id: S03
    type: tune
    skill: SK-P12-U03-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Explainability + Trust (People + AI): telling people what data the AI uses helps them know when they have important information it doesn't."
      ar: "اختبار مهارة. قابلية الشرح والثقة (People + AI): إخبار الناس بالبيانات التي يستخدمها الذكاء الاصطناعي يساعدهم أن يعرفوا متى يملكون معلومة مهمة لا يملكها."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Equally important, telling users what data the model is using can help them know when they have a critical piece of information that the system does not." }
    scenario:
      en: "A photo can't show oil or butter, but they add a lot of calories."
      ar: "الصورة لا تُظهر الزيت أو الزبدة، لكنهما يضيفان سعرات كثيرة."
    prompt:
      en: "Tap each option to see it. What should the result add?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن تضيف النتيجة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: sahn
      appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
      blocks:
        - { kind: image, art: food-grill }
        - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
        - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
        - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
    options:
      - id: note
        text: { en: "\"Photos don't show oil or butter. Used some? Add it.\"", ar: "«الصور لا تُظهر الزيت أو الزبدة. استخدمت بعضًا منهما؟ أضِفه.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
            - { kind: banner, tone: info, icon: drop, text: { en: "Photos don't show oil or butter. Used some? Add it.", ar: "الصور لا تُظهر الزيت أو الزبدة. استخدمت بعضًا منهما؟ أضِفه." }, gap: s }
      - id: nothing
        text: { en: "Nothing; most meals have little oil", ar: "لا شيء؛ فأغلب الوجبات فيها زيت قليل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
      - id: quiet
        text: { en: "Quietly add 100 kcal to every meal", ar: "نضيف 100 سعرة لكل وجبة دون أن نقول" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 750 kcal", ar: "حوالي 750 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
            - { kind: small, color: muted, text: { en: "(100 kcal added without telling the user)", ar: "(أُضيفت 100 سعرة دون إخبار المستخدم)" }, gap: xs }
    answer: [note]
    misconceptions:
      - id: MC-P12-023
        when: [nothing, quiet]
        feedback:
          en: "Only the person who cooked knows about the oil. Tell them the app can't see it, so they can add it."
          ar: "وحده من طبخ يعرف كمية الزيت. أخبره أن التطبيق لا يراها، ليضيفها."
    explain:
      en: "From Lesson 1: say what the AI doesn't know, so people fill the gap."
      ar: "من الدرس 1: قل ما لا يعرفه الذكاء الاصطناعي، ليكمل الناس النقص."

  - id: S04
    type: tune
    skill: SK-P12-U03-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Explainability + Trust (People + AI): when the stakes are high, give details about why a prediction was made."
      ar: "اختبار مهارة. قابلية الشرح والثقة (People + AI): حين يكون الخطر كبيرًا، اذكر تفاصيل عن سبب التوقّع."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Give the user details about why a prediction was made in a high stakes scenario." }
    scenario:
      en: "Some users count carbs to decide their insulin dose. The app shows them a carb estimate too."
      ar: "بعض المستخدمين يحسبون الكربوهيدرات ليحدّدوا جرعة الإنسولين. والتطبيق يعرض لهم تقديرًا للكربوهيدرات أيضًا."
    prompt:
      en: "Tap each option to see it. What should they see?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يروا؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: sahn
      appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
      blocks:
        - { kind: image, art: food-grill }
        - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
        - { kind: badge, icon: syringe, text: { en: "Carb counting is on", ar: "حساب الكربوهيدرات مفعّل" }, gap: s }
        - { kind: heading, text: { en: "Carbs: 70 g", ar: "الكربوهيدرات: 70 غ" }, gap: xs }
    options:
      - id: number
        text: { en: "\"Carbs: 70 g\", the same as everyone", ar: "«الكربوهيدرات: 70 غ»، مثل الجميع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: badge, icon: syringe, text: { en: "Carb counting is on", ar: "حساب الكربوهيدرات مفعّل" }, gap: s }
            - { kind: heading, text: { en: "Carbs: 70 g", ar: "الكربوهيدرات: 70 غ" }, gap: xs }
      - id: big
        text: { en: "\"Carbs: 70 g\" in a bigger font", ar: "«الكربوهيدرات: 70 غ» بخط أكبر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: badge, icon: syringe, text: { en: "Carb counting is on", ar: "حساب الكربوهيدرات مفعّل" }, gap: s }
            - { kind: heading, px: 28, text: { en: "Carbs: 70 g", ar: "الكربوهيدرات: 70 غ" }, gap: xs }
      - id: why
        text: { en: "\"Carbs: about 70 g, mostly from 1 cup of rice. Photo guesses can be off, so check before you dose.\"", ar: "«الكربوهيدرات: حوالي 70 غ، أغلبها من كوب أرز. تقدير الصور قد يخطئ، فراجِع قبل الجرعة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: badge, icon: syringe, text: { en: "Carb counting is on", ar: "حساب الكربوهيدرات مفعّل" }, gap: s }
            - { kind: heading, text: { en: "Carbs: about 70 g, mostly from 1 cup of rice. Photo guesses can be off, so check before you dose.", ar: "الكربوهيدرات: حوالي 70 غ، أغلبها من كوب أرز. تقدير الصور قد يخطئ، فراجِع قبل الجرعة." }, gap: xs }
    answer: [why]
    misconceptions:
      - id: MC-P12-024
        when: [number, big]
        feedback:
          en: "A wrong carb count can mean a wrong insulin dose. They need to see where the number comes from, and to check it."
          ar: "الحساب الخطأ للكربوهيدرات قد يعني جرعة إنسولين خطأ. يحتاجون أن يروا من أين جاء الرقم، وأن يراجعوه."
    explain:
      en: "From Lesson 2: when a mistake could hurt, show the why and what to check."
      ar: "من الدرس 2: حين قد يؤذي الخطأ، اعرض السبب وما يجب مراجعته."

  - id: S05
    type: tune
    skill: SK-P12-U03-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Explainability + Trust (People + AI): very precise confidence can confuse people when its impact isn't clear."
      ar: "اختبار مهارة. قابلية الشرح والثقة (People + AI): الثقة الدقيقة جدًا قد تُربك الناس حين لا يكون أثرها واضحًا."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Counterintuitively, showing more granular confidence can be confusing if the impact isn’t clear — what should I do when the system is 85.8% certain vs. 87% certain?" }
    scenario:
      en: "The team wants the total to read \"643.27 kcal (88.4% sure)\"."
      ar: "الفريق يريد أن يظهر المجموع هكذا: «643.27 سعرة (متأكّد 88.4%)»."
    prompt:
      en: "Tap each option to see it. What should it show?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يعرض؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: sahn
      appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
      blocks:
        - { kind: image, art: food-grill }
        - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
        - { kind: heading, text: { en: "643.27 kcal (88.4% sure)", ar: "643.27 سعرة (متأكّد 88.4%)" }, gap: s }
        - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
    options:
      - id: exact
        text: { en: "Keep \"643.27 kcal (88.4% sure)\"", ar: "يبقى «643.27 سعرة (متأكّد 88.4%)»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "643.27 kcal (88.4% sure)", ar: "643.27 سعرة (متأكّد 88.4%)" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
      - id: about
        text: { en: "\"About 650 kcal\"", ar: "«حوالي 650 سعرة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "About 650 kcal", ar: "حوالي 650 سعرة" }, gap: s }
            - { kind: link, text: { en: "Why?", ar: "لماذا؟" }, gap: xs }
      - id: nopct
        text: { en: "\"643.27 kcal\" without the percentage", ar: "«643.27 سعرة» دون النسبة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: sahn
          appbar: { title: { en: "Your meal", ar: "وجبتك" }, back: true }
          blocks:
            - { kind: image, art: food-grill }
            - { kind: chips, items: [ { text: { en: "Rice", ar: "أرز" } }, { text: { en: "Grilled chicken", ar: "دجاج مشوي" } }, { text: { en: "Salad", ar: "سلطة" } } ], gap: xs }
            - { kind: heading, text: { en: "643.27 kcal", ar: "643.27 سعرة" }, gap: s }
