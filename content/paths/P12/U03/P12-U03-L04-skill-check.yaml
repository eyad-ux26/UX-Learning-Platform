        when: [exact, nopct]
        feedback:
          en: "Nobody eats differently at 88.4% or 87%. And decimals make a rough photo guess look exact."
          ar: "لا أحد يأكل بشكل مختلف عند 88.4% أو 87%. والأرقام العشرية تجعل تقدير صورة تقريبيًا يبدو دقيقًا."
    explain:
      en: "From Lesson 3: show confidence only if it changes a decision, and don't fake precision."
      ar: "من الدرس 3: اعرض الثقة فقط إذا غيّرت القرار، ولا تصطنع الدقة."

