id: P12-U03-B01
mode: bank
title:
  en: "Re-tests: explain and earn the right trust"
  ar: "إعادة اختبار: اشرح واكسب الثقة المناسبة"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Explainability + Trust (People + AI Guidebook)", ar: "قابلية الشرح والثقة (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/explainability-trust/"
steps:
  - id: S01
    type: choose
    skill: SK-P12-U03-01
    part: retest
    speaker: mona
    value:
      en: "Re-test. Explainability + Trust (People + AI): explain the reason behind a specific result for a specific person."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): اشرح سبب نتيجة محدّدة لشخص محدّد."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Specific output explanations should explain the rationale behind a specific output for a specific user, for example, why it predicted a specific plant picture to be poison oak." }
    scenario:
      en: "Our bank app pauses a card payment it thinks is unusual, and asks the customer to confirm."
      ar: "تطبيق بنكنا يوقف مؤقتًا دفعة بالبطاقة يراها غير معتادة، ويطلب من العميل التأكيد."
    prompt:
      en: "What should the message say?"
      ar: "ماذا يجب أن تقول الرسالة؟"
    options:
      - { id: model, text: { en: "\"Our fraud system flagged this payment.\"", ar: "«نظام كشف الاحتيال لدينا أوقف هذه الدفعة.»" } }
      - { id: why, text: { en: "\"This looks unusual for you: your first payment abroad, at 3 a.m. Was it you?\"", ar: "«هذه الدفعة غير معتادة لك: أول دفعة خارج البلد، في الساعة 3 فجرًا. هل هي منك؟»" } }
      - { id: blocked, text: { en: "\"Payment paused. Call us.\"", ar: "«الدفعة متوقّفة. اتّصل بنا.»" } }
    answer: [why]
    misconceptions:
      - id: MC-P12-021
        when: [model, blocked]
        feedback:
          en: "Neither says why. With the reason, the customer can tell at once if it was them, or a thief."
          ar: "لا أحد منهما يقول لماذا. ومع السبب، يعرف العميل فورًا إن كانت الدفعة منه، أو من لص."
    correct:
      en: "Right. The reason lets them answer in a second."
      ar: "صحيح. السبب يجعلهم يجيبون في ثانية."
    explain:
      en: "\"Abroad, at 3 a.m.\" is something the customer can check against what they did."
      ar: "«خارج البلد، في الساعة 3 فجرًا» شيء يستطيع العميل مقارنته بما فعله."

  - id: S02
    type: choose
    skill: SK-P12-U03-01
    part: retest
    speaker: karim
    value:
      en: "Re-test. Explainability + Trust (People + AI): the best time to explain is right after the person does something."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): أفضل وقت للشرح هو مباشرة بعد أن يفعل الشخص شيئًا."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "This means the perfect time to show explanations is in response to a user’s action." }
    scenario:
      en: "I'm building a job site. A junior designer typed \"8 years\" of experience by mistake, so she gets senior jobs. She taps \"Not for me\" on one."
      ar: "أبني موقعًا للوظائف. مصمّمة مبتدئة كتبت «8 سنوات» خبرة بالخطأ، فتظهر لها وظائف لكبار المصمّمين. وتضغط «لا يناسبني» على إحداها."
    prompt:
      en: "What should happen right after her tap?"
      ar: "ماذا يجب أن يحدث بعد ضغطتها مباشرة؟"
    options:
      - { id: thanks, text: { en: "\"Thanks for your feedback.\"", ar: "«شكرًا على ملاحظتك.»" } }
      - { id: hide, text: { en: "Just remove that one job", ar: "نحذف تلك الوظيفة فقط" } }
      - { id: reason, text: { en: "\"We showed this because your profile says 8 years of experience. Edit profile\"", ar: "«عرضنا هذه لأن ملفّك يقول 8 سنوات خبرة. عدّل الملف»" } }
    answer: [reason]
    misconceptions:
      - id: MC-P12-021
        when: [thanks, hide]
        feedback:
          en: "She'll keep getting senior jobs and never know why. Her tap is the moment to show the reason."
          ar: "ستستمرّ وظائف الكبار في الظهور لها ولن تعرف لماذا. وضغطتها هي اللحظة المناسبة لعرض السبب."
    correct:
      en: "Right. Explain at the moment she acts."
      ar: "صحيح. اشرح في لحظة تصرّفها."
    explain:
      en: "She sees the cause, the typo, and fixes it in one step."
      ar: "ترى السبب، وهو الخطأ في الكتابة، وتصلحه بخطوة واحدة."

  - id: S03
    type: choose
    skill: SK-P12-U03-02
    part: retest
    speaker: hana
    value:
      en: "Re-test. Explainability + Trust (People + AI): people can be surprised when they see their own information in a new place."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): قد يتفاجأ الناس حين يرون معلوماتهم الخاصة في مكان جديد."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Sometimes users can be surprised by their own information when they see it in a new context." }
    scenario:
      en: "Our gym app connects to members' watches. Today it said: \"You slept 5 hours. Take an easy day.\" Some members asked how the app knew."
      ar: "تطبيق النادي يتّصل بساعات الأعضاء. واليوم قال: «نمت 5 ساعات. خذ يومًا خفيفًا.» وسأل بعض الأعضاء كيف عرف التطبيق."
    prompt:
      en: "How should we fix the message?"
      ar: "كيف نُصلح الرسالة؟"
    options:
      - { id: source, text: { en: "Add \"From your watch's sleep data · Stop using sleep data\"", ar: "نضيف «من بيانات النوم في ساعتك · أوقف استخدام بيانات النوم»" } }
      - { id: remove, text: { en: "Stop giving sleep tips", ar: "نتوقّف عن نصائح النوم" } }
      - { id: vague, text: { en: "Just \"Take an easy day\", without the hours", ar: "فقط «خذ يومًا خفيفًا»، دون الساعات" } }
    answer: [source]
    misconceptions:
      - id: MC-P12-022
        when: [remove, vague]
        feedback:
          en: "The tip is useful. Members only need to know where the data came from, and how to turn it off."
          ar: "النصيحة مفيدة. والأعضاء يحتاجون فقط أن يعرفوا من أين جاءت البيانات، وكيف يوقفونها."
    correct:
      en: "Right. Name the source, keep the tip."
      ar: "صحيح. اذكر المصدر، واحتفظ بالنصيحة."
    explain:
      en: "A short source line turns \"how do you know?\" into \"oh, my watch\"."
      ar: "سطر قصير عن المصدر يحوّل «كيف عرفت؟» إلى «آه، من ساعتي»."

  - id: S04
    type: choose
    skill: SK-P12-U03-02
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Explainability + Trust (People + AI): explain whether results are personal to one person, or based on data from all users."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): وضّح هل النتائج شخصية لفرد واحد، أم مبنية على بيانات كل المستخدمين."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Reach. Explain whether the system is personalized to one user or device, or if it is using aggregated data across all users." }
    scenario:
      en: "Our grocery app has a row called \"For you\". It actually shows what people in your area buy most. A single man saw baby food there and asked why."
      ar: "تطبيق البقالة عندنا فيه صفّ اسمه «لك». وهو في الحقيقة يعرض ما يشتريه الناس في منطقتك أكثر. ورأى رجل أعزب طعام أطفال فيه وسأل لماذا."
    prompt:
      en: "What should the row be called?"
      ar: "ماذا يجب أن يكون اسم الصفّ؟"
    options:
      - { id: foryou, text: { en: "Keep \"For you\"; it sounds personal", ar: "يبقى «لك»؛ فهو يبدو شخصيًا" } }
      - { id: area, text: { en: "\"Popular in your area\"", ar: "«الأكثر طلبًا في منطقتك»" } }
      - { id: smart, text: { en: "\"Smart picks\"", ar: "«اختيارات ذكية»" } }
    answer: [area]
    misconceptions:
      - id: MC-P12-022
        when: [foryou, smart]
        feedback:
          en: "Both hide where the picks come from. He thinks the app knows something about him, when it's just his area."
          ar: "الاثنان يُخفيان مصدر الاختيارات. فيظنّ أن التطبيق يعرف شيئًا عنه، وهو مجرد منطقته."
    correct:
      en: "Right. Say whose data it is."
      ar: "صحيح. قل بيانات من هذه."
    explain:
      en: "\"Popular in your area\" explains the baby food at once, and nothing feels personal."
      ar: "«الأكثر طلبًا في منطقتك» يشرح طعام الأطفال فورًا، ولا يبدو شيء شخصيًا."

  - id: S05
    type: choose
    skill: SK-P12-U03-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Explainability + Trust (People + AI): describing a simple automatic fix while people work can be distracting."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): وصف تعديل تلقائي بسيط أثناء عمل الناس قد يشتّت انتباههم."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "For example, if a cell phone camera automatically adjusts to lighting, it would be distracting to describe when and how that happens as you’re using it." }
    scenario:
      en: "In my shop app, sellers upload product photos. The app now brightens dark photos automatically."
      ar: "في تطبيق متجري، يرفع البائعون صور المنتجات. والتطبيق أصبح يزيد إضاءة الصور الداكنة تلقائيًا."
    prompt:
      en: "What should sellers see?"
      ar: "ماذا يجب أن يرى البائعون؟"
    options:
      - { id: popup, text: { en: "A pop-up each time: \"AI adjusted brightness, contrast and colour\"", ar: "نافذة كل مرة: «الذكاء الاصطناعي عدّل الإضاءة والتباين والألوان»" } }
      - { id: tour, text: { en: "A 3-step tour of how the AI edits photos", ar: "جولة من 3 خطوات عن طريقة تعديل الذكاء الاصطناعي للصور" } }
      - { id: plain, text: { en: "The brighter photo, with a small Undo", ar: "الصورة الأوضح، مع زر تراجع صغير" } }
    answer: [plain]
    misconceptions:
      - id: MC-P12-025
        when: [popup, tour]
        feedback:
          en: "Brightening is simple and easy to see. A pop-up or tour slows sellers down and explains nothing they need."
          ar: "زيادة الإضاءة أمر بسيط وواضح. والنافذة أو الجولة تبطئ البائعين ولا تشرح شيئًا يحتاجونه."
    correct:
      en: "Right. Nothing to explain; just let them undo."
      ar: "صحيح. لا شيء يحتاج إلى شرح؛ فقط دعهم يتراجعون."
    explain:
      en: "Low stakes and easy to see: the result explains itself."
      ar: "خطر قليل وواضح للعين: النتيجة تشرح نفسها."

  - id: S06
    type: choose
    skill: SK-P12-U03-03
    part: retest
    speaker: nour
    value:
      en: "Re-test. Explainability + Trust (People + AI): in high-stakes situations, give detailed explanations and prompt people to check the result."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): في المواقف عالية الخطر، قدّم شرحًا مفصّلًا وادعُ الناس إلى مراجعة النتيجة."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Providing detailed explanations, prompting the user to check the output in low-confidence/high-stakes situations, and revealing the rationale behind high-confidence predictions can bolster user trust." }
    scenario:
      en: "Our clinic app now sums up lab results in plain words. For one patient it says: \"Your results look fine.\" But her sugar is a little high."
      ar: "تطبيق عيادتنا أصبح يلخّص نتائج التحاليل بكلمات بسيطة. ولإحدى المريضات قال: «نتائجك تبدو جيدة.» لكن السكّر عندها مرتفع قليلًا."
    prompt:
      en: "What should the summary say?"
      ar: "ماذا يجب أن يقول الملخّص؟"
    options:
      - { id: fine, text: { en: "Keep \"Your results look fine.\"", ar: "يبقى «نتائجك تبدو جيدة.»" } }
      - { id: why, text: { en: "\"Most results are normal. Sugar is a little high (110). Dr. Ali will go over it with you.\"", ar: "«أغلب النتائج طبيعية. السكّر مرتفع قليلًا (110). سيراجعه د. علي معك.»" } }
      - { id: all, text: { en: "A table of all 24 values, with their medical names", ar: "جدول بكل القيم الـ 24، بأسمائها الطبية" } }
    answer: [why]
    misconceptions:
      - id: MC-P12-024
        when: [fine]
        feedback:
          en: "\"Fine\" hides the one value she should know about. With health, say what's off and who will check it."
          ar: "«جيدة» تُخفي القيمة الوحيدة التي يجب أن تعرفها. وفي الصحة، قل ما المختلف ومن سيراجعه."
      - id: MC-P12-021
        when: [all]
        feedback:
          en: "24 medical names bury the one thing that matters. Lead with it in plain words."
          ar: "24 اسمًا طبيًا تُخفي الشيء الوحيد المهم. ابدأ به بكلمات بسيطة."
    correct:
      en: "Right. Name what matters, and who checks it."
      ar: "صحيح. اذكر المهم، ومن يراجعه."
    explain:
      en: "High stakes need the detail that matters, plus a person to check."
      ar: "الخطر الكبير يحتاج التفصيل المهم، مع شخص يراجع."

  - id: S07
    type: choose
    skill: SK-P12-U03-04
    part: retest
    speaker: rami
    value:
      en: "Re-test. Explainability + Trust (People + AI): confidence displays risk being distracting, or worse, misunderstood."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): عرض درجة الثقة قد يشتّت الانتباه، أو الأسوأ، يُفهم خطأ."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "There’s always a risk that confidence displays will be distracting, or worse, misinterpreted." }
    scenario:
      en: "I'm designing a menu translation app. It shows a score next to every line: \"Grilled fish · 91.4%\". People skip the scores, and the menu is hard to read."
      ar: "أصمّم تطبيقًا لترجمة قوائم الطعام. يعرض درجة بجانب كل سطر: «سمك مشوي · 91.4%». والناس يتجاهلون الدرجات، والقائمة صعبة القراءة."
    prompt:
      en: "What should we change?"
      ar: "ماذا يجب أن نغيّر؟"
    options:
      - { id: keep, text: { en: "Keep the scores; more information is always better", ar: "نُبقي الدرجات؛ فالمعلومات الأكثر أفضل دائمًا" } }
      - { id: bigger, text: { en: "Make the scores bigger, so people notice them", ar: "نكبّر الدرجات، ليلاحظها الناس" } }
      - { id: flag, text: { en: "Remove the scores, and mark only the lines it's unsure about: \"Check with staff\"", ar: "نحذف الدرجات، ونعلّم فقط السطور غير المتأكّد منها: «اسأل الموظّف»" } }
    answer: [flag]
    misconceptions:
      - id: MC-P12-026
        when: [keep, bigger]
        feedback:
          en: "A score on every line changes nothing people do. Only the unsure lines need their attention."
          ar: "الدرجة على كل سطر لا تغيّر شيئًا مما يفعله الناس. والسطور غير المؤكّدة فقط تحتاج انتباههم."
    correct:
      en: "Right. Show doubt only where it changes something."
      ar: "صحيح. اعرض الشك فقط حيث يغيّر شيئًا."
    explain:
      en: "A clean menu, plus a clear flag where a wrong dish is likely."
      ar: "قائمة نظيفة، مع علامة واضحة حيث يُحتمل طبق خطأ."

  - id: S08
    type: choose
    skill: SK-P12-U03-04
    part: retest
    speaker: sara
    value:
      en: "Re-test. Explainability + Trust (People + AI): if confidence could mislead people, rethink how it's shown, or whether to show it."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): إذا كانت درجة الثقة قد تضلّل الناس، فأعد التفكير في طريقة عرضها، أو في عرضها أصلًا."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "If the confidence level could be misleading for less-savvy users, reconsider how it’s displayed, or whether to display it at all." }
    scenario:
      en: "I'm designing a hiring tool. It shows a bold \"Match: 96%\" for each applicant, even when their profile is almost empty. Managers have stopped reading CVs."
      ar: "أصمّم أداة توظيف. تعرض «تطابق: 96%» بخط عريض لكل متقدّم، حتى حين يكون ملفّه شبه فارغ. وتوقّف المديرون عن قراءة السِّيَر الذاتية."
    prompt:
      en: "What should we change?"
      ar: "ماذا يجب أن نغيّر؟"
    options:
      - { id: green, text: { en: "Colour scores above 90% green", ar: "نلوّن الدرجات فوق 90% بالأخضر" } }
      - { id: thin, text: { en: "For thin profiles, replace the score with \"Not enough info to match. Read the CV.\"", ar: "للملفّات الناقصة، نستبدل الدرجة بـ «لا توجد معلومات كافية للمطابقة. اقرأ السيرة الذاتية.»" } }
      - { id: keep, text: { en: "Keep it; managers are busy", ar: "تبقى كما هي؛ فالمديرون مشغولون" } }
    answer: [thin]
    misconceptions:
      - id: MC-P12-027
        when: [green, keep]
        feedback:
          en: "A high score on almost no data makes managers skip good and bad applicants alike. Say when it can't judge."
          ar: "الدرجة المرتفعة مع بيانات شبه معدومة تجعل المديرين يتجاوزون المتقدّمين الجيدين والسيئين معًا. قل متى لا يستطيع الحكم."
    correct:
      en: "Right. No data, no big number."
      ar: "صحيح. لا بيانات، إذن لا رقم كبير."
    explain:
      en: "An honest \"not enough info\" sends managers back to the CV when it matters."
      ar: "عبارة «لا توجد معلومات كافية» الصادقة تعيد المديرين إلى السيرة الذاتية حين يكون ذلك مهمًا."

  - id: S09
    type: choose
    skill: SK-P12-U03-05
    part: retest
    speaker: hana
    value:
      en: "Re-test. Explainability + Trust (People + AI): numbers like percentages are risky, because they assume people understand probability."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): الأرقام مثل النسب المئوية فيها خطر، لأنها تفترض أن الناس يفهمون الاحتمالات."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Numeric confidence indicators are risky because they presume your users have a good baseline understanding of probability." }
    scenario:
      en: "Our gym app predicts how crowded the gym will be. It says: \"6 p.m.: 72% chance of busy.\""
      ar: "تطبيق النادي يتوقّع مدى ازدحام النادي. ويقول: «6 مساءً: احتمال الازدحام 72%.»"
    prompt:
      en: "What should it say?"
      ar: "ماذا يجب أن يقول؟"
    options:
      - { id: act, text: { en: "\"6 p.m. is usually busy. Come before 5 for free machines.\"", ar: "«الساعة 6 مساءً مزدحمة عادةً. تعالَ قبل 5 لتجد أجهزة متاحة.»" } }
      - { id: num, text: { en: "Keep \"72% chance of busy\"", ar: "يبقى «احتمال الازدحام 72%»" } }
      - { id: more, text: { en: "\"72.4% chance of busy\", to be more exact", ar: "«احتمال الازدحام 72.4%»، ليكون أدقّ" } }
    answer: [act]
    misconceptions:
      - id: MC-P12-028
        when: [num, more]
        feedback:
          en: "Members don't plan with percentages. Tell them what it means and when to come instead."
          ar: "الأعضاء لا يخطّطون بالنسب المئوية. قل لهم ماذا تعني، ومتى يأتون بدلًا من ذلك."
    correct:
      en: "Right. Plain words and a next step."
      ar: "صحيح. كلمات بسيطة وخطوة تالية."
    explain:
      en: "\"Usually busy, come before 5\" is something members can act on today."
      ar: "«مزدحمة عادةً، تعالَ قبل 5» شيء يستطيع الأعضاء العمل به اليوم."

  - id: S10
    type: choose
    skill: SK-P12-U03-05
    part: retest
    speaker: mona
    value:
      en: "Re-test. Explainability + Trust (People + AI): to choose how to show confidence, think about what action it should inform."
      ar: "إعادة اختبار. قابلية الشرح والثقة (People + AI): لتختار طريقة عرض الثقة، فكّر في الفعل الذي يجب أن تساعد عليه."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "To come up with the best way to display model confidence, think about what user action this information should inform." }
    scenario:
      en: "Our bank app reads cheque photos. Sometimes it can't tell if the amount is 1,500 or 7,500."
      ar: "تطبيق بنكنا يقرأ صور الشيكات. وأحيانًا لا يستطيع أن يعرف هل المبلغ 1,500 أم 7,500."
    prompt:
      en: "What should it show?"
      ar: "ماذا يجب أن يعرض؟"
    options:
      - { id: guess, text: { en: "Fill in 1,500, its best guess", ar: "يكتب 1,500، تخمينه الأرجح" } }
      - { id: pct, text: { en: "\"1,500 (55% sure)\"", ar: "«1,500 (متأكّد 55%)»" } }
      - { id: ask, text: { en: "\"Is the amount 1,500 or 7,500? Tap the right one.\"", ar: "«هل المبلغ 1,500 أم 7,500؟ اضغط على الصحيح.»" } }
    answer: [ask]
    misconceptions:
      - id: MC-P12-029
        when: [guess, pct]
        feedback:
          en: "A wrong amount costs real money. The customer is holding the cheque; let them pick in one tap."
          ar: "المبلغ الخطأ يكلّف مالًا حقيقيًا. والعميل يحمل الشيك بيده؛ دعه يختار بضغطة واحدة."
    correct:
      en: "Right. When unsure, ask with the options."
      ar: "صحيح. حين لا يكون متأكّدًا، اسأل مع الخيارات."
    explain:
      en: "The action here is confirming the amount, so the display should ask for exactly that."
      ar: "الفعل هنا هو تأكيد المبلغ، لذلك يجب أن يطلب العرض ذلك تمامًا."
