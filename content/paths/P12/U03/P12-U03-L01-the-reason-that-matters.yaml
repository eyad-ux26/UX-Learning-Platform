id: P12-U03-L01
mode: lesson
minutes: 7
title:
  en: "Give the reason that matters"
  ar: "اذكر السبب المهم"
summary:
  en: "Fix a bookshop's \"Picked for you\" row so customers see why each book is there."
  ar: "أصلح صفّ «اخترناه لك» في متجر كتب، ليرى العملاء لماذا ظهر كل كتاب."
speaker: karim
sources:
  - title: { en: "Explainability + Trust (People + AI Guidebook)", ar: "قابلية الشرح والثقة (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/explainability-trust/"
review_labels:
  MC-P12-021: { en: "Give the one reason that matters", ar: "اذكر السبب الواحد المهم" }
  MC-P12-022: { en: "Say where the data comes from", ar: "قل من أين جاءت البيانات" }
  MC-P12-023: { en: "Say what it doesn't know", ar: "قل ما لا يعرفه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Why cookbooks? I don't cook.\"", ar: "«لماذا كتب الطبخ؟ أنا لا أطبخ.»" }
    body:
      en: "I build the front end of a bookshop app. Its \"Picked for you\" row shows books chosen by AI.\n\nOne customer wrote: \"Why only cookbooks? I don't cook.\" He had bought one cookbook, as a gift. Now he thinks the picks are random, and he ignores the row."
      ar: "أبني واجهة تطبيق لمتجر كتب. وفيه صفّ «اخترناه لك» يعرض كتبًا يختارها الذكاء الاصطناعي.\n\nكتب أحد العملاء: «لماذا كتب الطبخ فقط؟ أنا لا أطبخ.» كان قد اشترى كتاب طبخ واحدًا، هدية. والآن يظنّ أن الاختيارات عشوائية، ويتجاهل الصفّ."
    mock:
      app: waraq
      appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
      tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: magnifying-glass, text: { en: "Search", ar: "بحث" } }, { icon: books, text: { en: "My books", ar: "كتبي" } } ] }
      blocks:
        - { kind: row, blocks: [ { kind: heading, text: { en: "Picked for you", ar: "اخترناه لك" } }, { kind: badge, icon: sparkle, text: { en: "AI", ar: "ذكاء اصطناعي" } } ] }
        - { kind: listitem, art: book, text: { en: "Easy Home Cooking", ar: "الطبخ المنزلي السهل" }, value: { en: "220 EGP", ar: "220 جنيه" } }
        - { kind: listitem, art: book, text: { en: "Ramadan Kitchen", ar: "مطبخ رمضان" }, value: { en: "180 EGP", ar: "180 جنيه" } }
        - { kind: listitem, art: book, text: { en: "Baking for Beginners", ar: "الخَبز للمبتدئين" }, value: { en: "160 EGP", ar: "160 جنيه" } }
        - { kind: quote, text: { en: "Why only cookbooks? I don't cook.", ar: "لماذا كتب الطبخ فقط؟ أنا لا أطبخ." }, name: { en: "Customer review", ar: "تقييم عميل" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P12-U03-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Explainability + Trust (People + AI): explaining recommendations and other AI output is critical for building trust."
      ar: "جرّب أولًا. قابلية الشرح والثقة (People + AI): شرح الاقتراحات وغيرها من نتائج الذكاء الاصطناعي ضروري لبناء الثقة."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Explaining predictions, recommendations, and other AI output to users is critical for building trust." }
    prompt:
      en: "What would help this customer most?"
      ar: "ما الذي يساعد هذا العميل أكثر على فهم سبب ظهور كتب الطبخ؟"
    options:
      - { id: help, text: { en: "A help page on how recommendations work", ar: "صفحة مساعدة عن طريقة عمل الاقتراحات" } }
      - { id: reason, text: { en: "A short line on the row: \"Because you bought Easy Home Cooking\"", ar: "سطر قصير على الصفّ: «لأنك اشتريت الطبخ المنزلي السهل»" } }
      - { id: more, text: { en: "More books in the row, so there's something for everyone", ar: "كتب أكثر في الصفّ، ليجد كل شخص شيئًا" } }
    answer: [reason]
    misconceptions:
      - id: MC-P12-021
        when: [help, more]
        feedback:
          en: "He won't look for a help page, and more books won't explain these. He needs the one reason, right where he sees the row."
          ar: "لن يبحث عن صفحة مساعدة، والكتب الإضافية لن تشرح هذه الكتب. هو يحتاج السبب الواحد، في المكان الذي يرى فيه الصفّ."
    hints:
      - { en: "What does he not understand?", ar: "ما الذي لا يفهمه؟" }
      - { en: "Which option answers \"why these books?\"", ar: "أي خيار يجيب عن «لماذا هذه الكتب؟»" }
    correct:
      en: "Right. One clear reason, in the right place."
      ar: "صحيح. سبب واحد واضح، في المكان الصحيح."
    explain:
      en: "Now he sees the cause, a gift, and knows the picks aren't random."
      ar: "الآن يرى السبب، وهو الهدية، ويعرف أن الاختيارات ليست عشوائية."

  - id: S03
    type: card
    part: concept
    icons: [idea, eye, warn, tap]
    title: { en: "Explain the part that matters", ar: "اشرح الجزء المهم" }
    body:
      en: "An AI's full reasoning is often too complex to explain. You don't need all of it.\n\n- **Give the main reason** for this result: \"Because you bought…\"\n- **Say what data it uses,** so nothing feels like spying.\n- **Say what it doesn't know,** so people know when to use their own judgment.\n- **Explain when people act:** right after they tap, search or correct something."
      ar: "طريقة تفكير الذكاء الاصطناعي كاملةً غالبًا أعقد من أن تُشرح. ولا تحتاج أن تشرحها كلها.\n\n- **اذكر السبب الأساسي** لهذه النتيجة: «لأنك اشتريت…»\n- **قل ما البيانات التي يستخدمها،** حتى لا يبدو أي شيء تجسّسًا.\n- **قل ما لا يعرفه،** ليعرف الناس متى يعتمدون على رأيهم.\n- **اشرح حين يتصرّف الناس:** مباشرة بعد أن يضغطوا أو يبحثوا أو يصحّحوا شيئًا."

  - id: S04
    type: tune
    skill: SK-P12-U03-02
    part: guided
    rules: [R06]
    value:
      en: "Explainability + Trust (People + AI): don't be afraid to admit when a lack of data could affect the quality of the recommendations."
      ar: "قابلية الشرح والثقة (People + AI): لا تتردّد في الاعتراف حين يؤثّر نقص البيانات على جودة الاقتراحات."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Don’t be afraid to admit when a lack of data could affect the quality of the AI recommendations." }
    scenario:
      en: "A new customer hasn't bought anything yet, so the row shows this week's best-sellers. It's still titled \"Picked for you\"."
      ar: "عميل جديد لم يشترِ شيئًا بعد، فيعرض الصفّ الكتب الأكثر مبيعًا هذا الأسبوع. لكن عنوانه ما زال «اخترناه لك»."
    prompt:
      en: "Tap each option to see it. What should the row say?"
      ar: "اضغط على كل خيار لتراه. ماذا نكتب في الصفّ لعميل لا نعرف عنه شيئًا بعد؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: waraq
      appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
      tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: magnifying-glass, text: { en: "Search", ar: "بحث" } }, { icon: books, text: { en: "My books", ar: "كتبي" } } ] }
      blocks:
        - { kind: row, blocks: [ { kind: heading, text: { en: "Picked for you", ar: "اخترناه لك" } }, { kind: badge, icon: sparkle, text: { en: "AI", ar: "ذكاء اصطناعي" } } ] }
        - { kind: listitem, art: book, text: { en: "The Cairo Trilogy", ar: "الثلاثية" }, value: { en: "250 EGP", ar: "250 جنيه" } }
        - { kind: listitem, art: book, text: { en: "Atomic Habits", ar: "العادات الذرية" }, value: { en: "210 EGP", ar: "210 جنيه" } }
        - { kind: listitem, art: book, text: { en: "The Alchemist", ar: "الخيميائي" }, value: { en: "150 EGP", ar: "150 جنيه" } }
    options:
      - id: keep
        text: { en: "Keep \"Picked for you\"; it sounds personal", ar: "يبقى «اخترناه لك»؛ فهو يبدو شخصيًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: magnifying-glass, text: { en: "Search", ar: "بحث" } }, { icon: books, text: { en: "My books", ar: "كتبي" } } ] }
          blocks:
            - { kind: row, blocks: [ { kind: heading, text: { en: "Picked for you", ar: "اخترناه لك" } }, { kind: badge, icon: sparkle, text: { en: "AI", ar: "ذكاء اصطناعي" } } ] }
            - { kind: listitem, art: book, text: { en: "The Cairo Trilogy", ar: "الثلاثية" }, value: { en: "250 EGP", ar: "250 جنيه" } }
            - { kind: listitem, art: book, text: { en: "Atomic Habits", ar: "العادات الذرية" }, value: { en: "210 EGP", ar: "210 جنيه" } }
            - { kind: listitem, art: book, text: { en: "The Alchemist", ar: "الخيميائي" }, value: { en: "150 EGP", ar: "150 جنيه" } }
      - id: hide
        text: { en: "Hide the row until they buy something", ar: "نُخفي الصفّ حتى يشتري شيئًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: magnifying-glass, text: { en: "Search", ar: "بحث" } }, { icon: books, text: { en: "My books", ar: "كتبي" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search books", ar: "ابحث عن كتاب" } }
            - { kind: small, color: muted, text: { en: "(No picks row until the first purchase)", ar: "(لا يوجد صفّ اقتراحات حتى أول شراء)" }, gap: m }
      - id: honest
        text: { en: "\"Popular this week. Buy or save a few books, and we'll pick for you.\"", ar: "«الأكثر رواجًا هذا الأسبوع. اشترِ أو احفظ بعض الكتب، وسنختار لك.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          tabbar: { active: 0, items: [ { icon: house, text: { en: "Home", ar: "الرئيسية" } }, { icon: magnifying-glass, text: { en: "Search", ar: "بحث" } }, { icon: books, text: { en: "My books", ar: "كتبي" } } ] }
          blocks:
            - { kind: row, blocks: [ { kind: heading, text: { en: "Popular this week", ar: "الأكثر رواجًا هذا الأسبوع" } }, { kind: badge, icon: sparkle, text: { en: "AI", ar: "ذكاء اصطناعي" } } ] }
            - { kind: small, color: muted, text: { en: "Buy or save a few books, and we'll pick for you.", ar: "اشترِ أو احفظ بعض الكتب، وسنختار لك." }, gap: xs }
            - { kind: listitem, art: book, text: { en: "The Cairo Trilogy", ar: "الثلاثية" }, value: { en: "250 EGP", ar: "250 جنيه" } }
            - { kind: listitem, art: book, text: { en: "Atomic Habits", ar: "العادات الذرية" }, value: { en: "210 EGP", ar: "210 جنيه" } }
            - { kind: listitem, art: book, text: { en: "The Alchemist", ar: "الخيميائي" }, value: { en: "150 EGP", ar: "150 جنيه" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-023
        when: [keep, hide]
        feedback:
          en: "\"Picked for you\" pretends to know them, and hiding the row loses useful books. Say what they are, and how to get personal picks."
          ar: "«اخترناه لك» يتظاهر بأنه يعرفهم، وإخفاء الصفّ يُضيّع كتبًا مفيدة. قل ما هذه الكتب، وكيف يحصلون على اختيارات شخصية."
    hints:
      - { en: "Does the app know anything about this customer yet?", ar: "هل يعرف التطبيق أي شيء عن هذا العميل حتى الآن؟" }
      - { en: "Which option is honest and still useful?", ar: "أي خيار صادق ومفيد في الوقت نفسه؟" }
    correct:
      en: "Right. Be honest that it doesn't know them yet."
      ar: "صحيح. كن صادقًا: التطبيق لا يعرفهم بعد."
    explain:
      en: "Saying what data is missing sets the right trust, and tells people how to make the picks better."
      ar: "ذِكر البيانات الناقصة يضع الثقة في مكانها، ويقول للناس كيف يحسّنون الاختيارات."

  - id: S05
    type: tune
    skill: SK-P12-U03-01
    part: guided
    rules: [R06]
    value:
      en: "Explainability + Trust (People + AI): partial explanations leave out the parts that are unknown, too complex, or not useful."
      ar: "قابلية الشرح والثقة (People + AI): الشرح الجزئي يترك الأجزاء المجهولة، أو المعقّدة جدًا، أو غير المفيدة."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Partial explanations intentionally leave out parts of the system’s function that are unknown, highly complex, or simply not useful." }
    scenario:
      en: "Each book in the row gets a small \"Why this?\" link. A customer taps it on a novel."
      ar: "كل كتاب في الصفّ أصبح له رابط صغير «لماذا هذا؟». ويضغط عليه عميل في رواية."
    prompt:
      en: "Tap each option to see it. What should it show?"
      ar: "اضغط على كل خيار لتراه. ماذا يعرض الرابط ليفهم العميل سبب الاقتراح؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: waraq
      appbar: { title: { en: "Palace Walk", ar: "بين القصرين" }, back: true }
      blocks:
        - { kind: image, art: book }
        - { kind: price, text: { en: "190 EGP", ar: "190 جنيه" }, gap: s }
        - { kind: link, icon: info, text: { en: "Why this?", ar: "لماذا هذا؟" }, gap: xs }
    options:
      - id: reason
        text: { en: "\"You've read 3 novels by Naguib Mahfouz. Readers like you often buy this one.\"", ar: "«قرأت 3 روايات لنجيب محفوظ. والقرّاء مثلك يشترون هذه كثيرًا.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { title: { en: "Palace Walk", ar: "بين القصرين" }, back: true }
          blocks:
            - { kind: image, art: book }
            - { kind: price, text: { en: "190 EGP", ar: "190 جنيه" }, gap: s }
            - { kind: link, icon: info, text: { en: "Why this?", ar: "لماذا هذا؟" }, gap: xs }
          overlay:
            type: sheet
            title: { en: "Why this book?", ar: "لماذا هذا الكتاب؟" }
            blocks:
              - { kind: text, text: { en: "You've read 3 novels by Naguib Mahfouz. Readers like you often buy this one.", ar: "قرأت 3 روايات لنجيب محفوظ. والقرّاء مثلك يشترون هذه كثيرًا." } }
      - id: full
        text: { en: "\"Our model scores 200 signals, including clicks, time on page and purchase history.\"", ar: "«نموذجنا يقيّم 200 إشارة، منها النقرات ووقت البقاء في الصفحة وسجلّ الشراء.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { title: { en: "Palace Walk", ar: "بين القصرين" }, back: true }
          blocks:
            - { kind: image, art: book }
            - { kind: price, text: { en: "190 EGP", ar: "190 جنيه" }, gap: s }
            - { kind: link, icon: info, text: { en: "Why this?", ar: "لماذا هذا؟" }, gap: xs }
          overlay:
            type: sheet
            title: { en: "Why this book?", ar: "لماذا هذا الكتاب؟" }
            blocks:
              - { kind: text, text: { en: "Our model scores 200 signals, including clicks, time on page and purchase history.", ar: "نموذجنا يقيّم 200 إشارة، منها النقرات ووقت البقاء في الصفحة وسجلّ الشراء." } }
      - id: vague
        text: { en: "\"Recommended by AI.\"", ar: "«مقترح من الذكاء الاصطناعي.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: waraq
          appbar: { title: { en: "Palace Walk", ar: "بين القصرين" }, back: true }
          blocks:
            - { kind: image, art: book }
            - { kind: price, text: { en: "190 EGP", ar: "190 جنيه" }, gap: s }
            - { kind: link, icon: info, text: { en: "Why this?", ar: "لماذا هذا؟" }, gap: xs }
          overlay:
            type: sheet
            title: { en: "Why this book?", ar: "لماذا هذا الكتاب؟" }
            blocks:
              - { kind: text, text: { en: "Recommended by AI.", ar: "مقترح من الذكاء الاصطناعي." } }
    answer: [reason]
    misconceptions:
      - id: MC-P12-021
        when: [full, vague]
        feedback:
          en: "One says too much, the other says nothing. Give the one reason a reader can check: the author they read."
          ar: "واحد يقول أكثر من اللازم، والآخر لا يقول شيئًا. اذكر السبب الواحد الذي يستطيع القارئ التأكّد منه: الكاتب الذي قرأ له."
    hints:
      - { en: "Which answer could the customer check for themselves?", ar: "أي إجابة يستطيع العميل أن يتأكّد منها بنفسه؟" }
      - { en: "Does the customer need all 200 signals?", ar: "هل يحتاج العميل الإشارات الـ 200 كلها؟" }
    correct:
      en: "Right. A partial explanation is enough."
      ar: "صحيح. الشرح الجزئي يكفي."
    explain:
      en: "Leave out what's complex or not useful. Keep the part that helps people decide."
      ar: "احذف ما هو معقّد أو غير مفيد. واحتفظ بالجزء الذي يساعد الناس على القرار."

  - id: S06
    type: compare
    skill: SK-P12-U03-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: hidden vs named data source. Explainability + Trust (People + AI): explain where people's data comes from and how the AI uses it."
      ar: "مقارنة: مصدر بيانات مخفي مقابل مصدر مذكور. قابلية الشرح والثقة (People + AI): اشرح من أين تأتي بيانات الناس وكيف يستخدمها الذكاء الاصطناعي."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "To avoid this, explain to users where their data is coming from and how it is being used by the AI system." }
    scenario:
      en: "At sign-up, customers allowed the app to read their phone contacts. Many forgot. Now the app wants to send a gift idea."
      ar: "عند التسجيل، سمح العملاء للتطبيق بقراءة جهات الاتصال في هواتفهم. ونسي كثيرون ذلك. والآن يريد التطبيق إرسال فكرة هدية."
    prompt:
      en: "Which note should we send?"
      ar: "أي رسالة نرسل لعملاء نسوا أنهم سمحوا بقراءة جهات اتصالهم؟"
    a:
      label: { en: "A: \"Ahmed's birthday is on Friday. Gift ideas →\"", ar: "A: «عيد ميلاد أحمد يوم الجمعة. أفكار هدايا ←»" }
      mock:
        screen: lock
        blocks:
          - { kind: notification, app: waraq, title: { en: "Ahmed's birthday is on Friday", ar: "عيد ميلاد أحمد يوم الجمعة" }, text: { en: "Gift ideas →", ar: "أفكار هدايا ←" }, time: { en: "now", ar: "الآن" } }
    b:
      label: { en: "B: The same note, plus \"From your phone contacts · Stop using contacts\"", ar: "B: الرسالة نفسها، مع «من جهات الاتصال في هاتفك · أوقف استخدام جهات الاتصال»" }
      mock:
        screen: lock
        blocks:
          - { kind: notification, app: waraq, title: { en: "Ahmed's birthday is on Friday", ar: "عيد ميلاد أحمد يوم الجمعة" }, text: { en: "Gift ideas →", ar: "أفكار هدايا ←" }, time: { en: "now", ar: "الآن" } }
          - { kind: small, color: white, text: { en: "From your phone contacts · Stop using contacts", ar: "من جهات الاتصال في هاتفك · أوقف استخدام جهات الاتصال" }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: source, text: { en: "Customers see how the app knows, and can stop it", ar: "يرى العملاء كيف عرف التطبيق، ويستطيعون إيقافه" } }
        - { id: official, text: { en: "Longer notes look more official", ar: "الرسائل الأطول تبدو رسمية أكثر" } }
        - { id: polite, text: { en: "Mentioning contacts sounds more polite", ar: "ذِكر جهات الاتصال يبدو أكثر لطفًا" } }
      answer: [source]
      misconceptions:
        - id: MC-P12-022
          when: [official, polite]
          feedback:
            en: "It's not about length or tone. Naming the source turns a creepy surprise into something people understand and control."
            ar: "ليست المسألة مسألة طول أو أسلوب. ذِكر المصدر يحوّل المفاجأة المزعجة إلى شيء يفهمه الناس ويتحكّمون فيه."
    misconceptions:
      - id: MC-P12-022
        when: [a]
        feedback:
          en: "A is helpful, but people wonder how the app knew about Ahmed. Without the source, it feels like spying."
          ar: "A مفيد، لكن الناس سيتساءلون كيف عرف التطبيق عن أحمد. ودون ذِكر المصدر، يبدو الأمر تجسّسًا."
    hints:
      - { en: "What will a customer who forgot the permission think?", ar: "ماذا سيظنّ العميل الذي نسي الإذن؟" }
      - { en: "Which note answers \"how do you know that?\"", ar: "أي رسالة تجيب عن «كيف عرفت ذلك؟»" }
    correct:
      en: "Right. Name the data, and offer a way out."
      ar: "صحيح. اذكر البيانات، وقدّم طريقة للإيقاف."
    explain:
      en: "A short source line keeps a useful idea from feeling like spying."
      ar: "سطر قصير عن المصدر يمنع الفكرة المفيدة من أن تبدو تجسّسًا."

  - id: S07
    type: tune
    skill: SK-P12-U03-01
    part: independent
    speaker: nour
    rules: [R14]
    value:
      en: "New case. Explainability + Trust (People + AI): explaining a specific result connects the explanation to what people do, and clears up confusion."
      ar: "حالة جديدة. قابلية الشرح والثقة (People + AI): شرح نتيجة محدّدة يربط الشرح بما يفعله الناس، ويزيل الارتباك."
    ref: { url: "https://pair.withgoogle.com/chapter/explainability-trust/", quote: "Output explanations are useful because they connect explanations directly to actions and can help resolve confusion in the context of user tasks." }
    scenario:
      en: "I manage a clinic. Our app now suggests to some patients: \"Book a blood test.\" Many call us to ask why."
      ar: "أدير عيادة. وتطبيقنا أصبح يقترح على بعض المرضى: «احجز تحليل دم.» وكثيرون يتّصلون بنا ليسألوا لماذا."
    prompt:
      en: "Tap each option to see it. What should the suggestion add?"
      ar: "اضغط على كل خيار لتراه. ماذا نضيف للاقتراح حتى لا يحتاج المرضى للاتصال والسؤال؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: raha
      appbar: { logo: true }
      blocks:
        - { kind: card, blocks: [ { kind: badge, icon: sparkle, text: { en: "Suggested", ar: "مقترح" } }, { kind: heading, text: { en: "Book a blood test", ar: "احجز تحليل دم" } }, { kind: button, text: { en: "Book", ar: "احجز" } } ] }
        - { kind: listitem, icon: calendar-check, text: { en: "My visits", ar: "زياراتي" }, chevron: true, gap: s }
    options:
      - id: ai
        text: { en: "\"Suggested by our smart assistant.\"", ar: "«مقترح من مساعدنا الذكي.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { logo: true }
          blocks:
            - { kind: card, blocks: [ { kind: badge, icon: sparkle, text: { en: "Suggested", ar: "مقترح" } }, { kind: heading, text: { en: "Book a blood test", ar: "احجز تحليل دم" } }, { kind: small, color: muted, text: { en: "Suggested by our smart assistant.", ar: "مقترح من مساعدنا الذكي." } }, { kind: button, text: { en: "Book", ar: "احجز" } } ] }
            - { kind: listitem, icon: calendar-check, text: { en: "My visits", ar: "زياراتي" }, chevron: true, gap: s }
      - id: record
        text: { en: "\"Based on an analysis of your full medical record.\"", ar: "«بناءً على تحليل سجلّك الطبي الكامل.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { logo: true }
          blocks:
            - { kind: card, blocks: [ { kind: badge, icon: sparkle, text: { en: "Suggested", ar: "مقترح" } }, { kind: heading, text: { en: "Book a blood test", ar: "احجز تحليل دم" } }, { kind: small, color: muted, text: { en: "Based on an analysis of your full medical record.", ar: "بناءً على تحليل سجلّك الطبي الكامل." } }, { kind: button, text: { en: "Book", ar: "احجز" } } ] }
            - { kind: listitem, icon: calendar-check, text: { en: "My visits", ar: "زياراتي" }, chevron: true, gap: s }
      - id: reason
        text: { en: "\"Your last blood test was 12 months ago. Dr. Ali asks for one every year.\"", ar: "«آخر تحليل دم لك كان قبل 12 شهرًا. ود. علي يطلب تحليلًا كل سنة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { logo: true }
          blocks:
            - { kind: card, blocks: [ { kind: badge, icon: sparkle, text: { en: "Suggested", ar: "مقترح" } }, { kind: heading, text: { en: "Book a blood test", ar: "احجز تحليل دم" } }, { kind: small, color: muted, text: { en: "Your last blood test was 12 months ago. Dr. Ali asks for one every year.", ar: "آخر تحليل دم لك كان قبل 12 شهرًا. ود. علي يطلب تحليلًا كل سنة." } }, { kind: button, text: { en: "Book", ar: "احجز" } } ] }
            - { kind: listitem, icon: calendar-check, text: { en: "My visits", ar: "زياراتي" }, chevron: true, gap: s }
    answer: [reason]
    misconceptions:
      - id: MC-P12-021
        when: [ai, record]
        feedback:
          en: "Neither gives the actual reason. A reason patients can check saves them the phone call."
          ar: "لا يذكر أيّ من السطرين السبب الفعلي. والسبب الذي يستطيع المريض التأكّد منه يوفّر عليه المكالمة."
    hints:
      - { en: "What do patients ask when they call?", ar: "ماذا يسأل المرضى حين يتّصلون؟" }
      - { en: "Which line answers that question?", ar: "أي سطر يجيب عن هذا السؤال؟" }
    correct:
      en: "Right. The reason answers their question before they call."
      ar: "صحيح. السبب يجيب عن سؤالهم قبل أن يتّصلوا."
    explain:
      en: "\"Smart assistant\" and \"full record\" sound impressive, but tell patients nothing they can use."
      ar: "«المساعد الذكي» و«السجلّ الكامل» يبدوان مبهرين، لكنهما لا يقولان للمريض شيئًا يستفيد منه."

  - id: S08
    type: card
    part: recap
    icons: [idea, warn, list, eye, target]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **One reason:** \"Because you bought…\" made the picks make sense.\n- **Honest about gaps:** you called best-sellers \"Popular\", not \"Picked for you\".\n- **Partial is enough:** you showed the author, not 200 signals.\n- **Named the source:** you said the gift idea came from contacts, with a way to stop.\n- **New case:** you gave patients the real reason for a blood test.\n\nNext lesson: explain more when more is at stake."
      ar: "- **سبب واحد:** «لأنك اشتريت…» جعل الاختيارات مفهومة.\n- **صادق فيما لا يعرفه:** سمّيت الأكثر مبيعًا «الأكثر رواجًا»، لا «اخترناه لك».\n- **الشرح الجزئي يكفي:** عرضت الكاتب، لا 200 إشارة.\n- **ذكرت المصدر:** قلت إن فكرة الهدية جاءت من جهات الاتصال، مع طريقة للإيقاف.\n- **حالة جديدة:** أعطيت المرضى السبب الحقيقي لتحليل الدم.\n\nالدرس التالي: اشرح أكثر حين يكون الخطر أكبر."
