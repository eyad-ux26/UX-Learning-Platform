    explain:
      en: "Keep the technology for a \"How it works\" link, for those who want it."
      ar: "اترك التقنية لرابط «كيف يعمل»، لمن يريدها."

  - id: S08
    type: card
    part: recap
    icons: [warn, target, idea, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Found the cause:** the \"magic\" promise, not the AI, caused the bad reviews.\n- **Benefit first:** you named the button by what it does for customers.\n- **One example:** you showed a red bag and its matches, plus the limit.\n- **Honest ad:** you chose the ad that says what it can't do yet.\n- **No tech talk:** you described spending groups by what customers get.\n\nNext lesson: introduce AI at the right moment."
      ar: "- **وجدت السبب:** وعد «السحر»، لا الذكاء الاصطناعي، هو سبب التقييمات السيئة.\n- **الفائدة أولًا:** سمّيت الزر بما يفعله للعملاء.\n- **مثال واحد:** عرضت حقيبة حمراء وما يشبهها، مع الحدود.\n- **إعلان صادق:** اخترت الإعلان الذي يقول ما لا يستطيعه بعد.\n- **بلا كلام تقني:** وصفت تصنيف المصروفات بما يحصل عليه العملاء.\n\nالدرس التالي: قدّم الذكاء الاصطناعي في اللحظة المناسبة."
