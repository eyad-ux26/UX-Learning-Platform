id: P12-U02-L01
mode: lesson
minutes: 7
title:
  en: "Say what it can and can't do"
  ar: "قل ما يستطيعه وما لا يستطيعه"
summary:
  en: "Rewrite how a shop's photo search introduces itself, so customers expect what it can really do."
  ar: "أعد كتابة طريقة تقديم البحث بالصور في متجر، ليتوقّع العملاء ما يستطيعه فعلًا."
speaker: youssef
sources:
  - title: { en: "Mental Models (People + AI Guidebook)", ar: "النماذج الذهنية (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/mental-models/"
review_labels:
  MC-P12-011: { en: "Promise only what it can do", ar: "لا تَعِد إلا بما يستطيعه" }
  MC-P12-012: { en: "Explain the benefit, not the technology", ar: "اشرح الفائدة، لا التقنية" }
  MC-P12-013: { en: "Show an example of it working", ar: "اعرض مثالًا لعمله" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Find anything with a photo!\"", ar: "«ابحث عن أي شيء بصورة!»" }
    body:
      en: "I added a photo search to my shop app. You snap a photo, and it finds similar products. Our ad said: \"AI magic! Find anything with a photo.\"\n\nIt works well for bags and clothes. But customers snap rings and earrings, get strange results, and leave one-star reviews."
      ar: "أضفت بحثًا بالصور لتطبيق متجري. تلتقط صورة، فيجد منتجات مشابهة. وإعلاننا قال: «سحر الذكاء الاصطناعي! ابحث عن أي شيء بصورة.»\n\nيعمل جيدًا مع الحقائب والملابس. لكن العملاء يصوّرون خواتم وأقراطًا، فتظهر نتائج غريبة، ويكتبون تقييمات بنجمة واحدة."
    mock:
      app: dar
      appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
      blocks:
        - { kind: searchbar, text: { en: "Search Dar", ar: "ابحث في دار" } }
        - { kind: banner, tone: info, icon: sparkle, text: { en: "AI magic! Find anything with a photo.", ar: "سحر الذكاء الاصطناعي! ابحث عن أي شيء بصورة." }, gap: s }
        - { kind: heading, text: { en: "Latest reviews", ar: "أحدث التقييمات" }, gap: m }
        - { kind: listitem, avatar: { text: "Salma Nabil", art: woman-2 }, text: { en: "Salma · ★☆☆☆☆", ar: "سلمى · ★☆☆☆☆" }, sub: { en: "\"I searched a ring and got a door handle.\"", ar: "«بحثت عن خاتم فظهر لي مقبض باب.»" } }

  - id: S02
    type: choose
    skill: SK-P12-U02-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Mental Models (People + AI): promising \"AI magic\" sets people up for disappointment, because it makes them expect more than the product can do."
      ar: "جرّب أولًا. النماذج الذهنية (People + AI): الوعد بـ«سحر الذكاء الاصطناعي» يقود الناس إلى خيبة الأمل، لأنه يجعلهم يتوقّعون أكثر مما يستطيعه المنتج."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "This kind of messaging can establish mental models that overestimate what the product can actually do." }
    prompt:
      en: "What's the main cause of the bad reviews?"
      ar: "ما السبب الأساسي للتقييمات السيئة؟"
    options:
      - { id: weak, text: { en: "The AI is weak; we need a better one", ar: "الذكاء الاصطناعي ضعيف؛ نحتاج واحدًا أفضل" } }
      - { id: promise, text: { en: "We promised \"anything\", so people expected it to work for everything", ar: "وعدنا بـ«أي شيء»، فتوقّع الناس أن يعمل مع كل شيء" } }
      - { id: users, text: { en: "Customers are using it wrong", ar: "العملاء يستخدمونه بطريقة خطأ" } }
    answer: [promise]
    misconceptions:
      - id: MC-P12-011
        when: [weak, users]
        feedback:
          en: "It does well what it was built for. The ad promised more, so customers tried things it can't do and felt let down."
          ar: "هو ينجح فيما بُني من أجله. لكن الإعلان وعد بأكثر، فجرّب العملاء أشياء لا يستطيعها وشعروا بخيبة الأمل."
    hints:
      - { en: "What did the ad tell customers to expect?", ar: "ماذا قال الإعلان للعملاء أن يتوقّعوا؟" }
      - { en: "Does it work for what it was built for?", ar: "هل يعمل فيما بُني من أجله؟" }
    correct:
      en: "Right. The promise, not the AI, caused the letdown."
      ar: "صحيح. الوعد، لا الذكاء الاصطناعي، هو سبب خيبة الأمل."
    explain:
      en: "People judge a feature against what they were told. Overpromise, and even good results feel like failure."
      ar: "الناس يحكمون على الميزة بما قيل لهم. وإذا وعدت بأكثر، فحتى النتائج الجيدة تبدو فشلًا."

  - id: S03
    type: card
    part: concept
    icons: [target, ok, idea, warn]
    title: { en: "Set honest expectations", ar: "ضع توقّعات صادقة" }
    body:
      en: "People build a picture of what a feature can do from the first thing they hear.\n\n- **Say what it can do and can't do yet,** the first time people meet it.\n- **Show an example** of it working, so people see the value.\n- **Talk about the benefit, not the technology:** \"Find similar bags\" beats \"Powered by deep learning\".\n- **No magic:** big promises make people expect too much, then stop trusting it."
      ar: "يكوّن الناس صورة عمّا تستطيعه الميزة من أول شيء يسمعونه.\n\n- **قل ما تستطيعه وما لا تستطيعه بعد،** من أول مرة يقابلها الناس.\n- **اعرض مثالًا** لعملها، ليرى الناس قيمتها.\n- **تحدّث عن الفائدة، لا التقنية:** «ابحث عن حقائب مشابهة» أفضل من «يعمل بالتعلّم العميق».\n- **بلا سحر:** الوعود الكبيرة تجعل الناس يتوقّعون أكثر من اللازم، ثم يتوقّفون عن الثقة."

  - id: S04
    type: tune
    skill: SK-P12-U02-04
    part: guided
    rules: [R06]
    value:
      en: "Mental Models (People + AI): if you talk about the AI, focus on how it makes part of the experience better or delivers new value."
      ar: "النماذج الذهنية (People + AI): إذا تحدّثت عن الذكاء الاصطناعي، فركّز على كيف يحسّن جزءًا من التجربة أو يقدّم قيمة جديدة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "If you do talk about the AI, focus on how it specifically makes part of the experience better or delivers new value." }
    scenario:
      en: "We're writing a new title for the photo search button."
      ar: "نكتب عنوانًا جديدًا لزر البحث بالصور."
    prompt:
      en: "Tap each option to see it. Which title is best?"
      ar: "اضغط على كل خيار لتراه. أي عنوان هو الأفضل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: dar
      appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
      blocks:
        - { kind: searchbar, text: { en: "Search clothes and bags", ar: "ابحث في الملابس والحقائب" } }
        - { kind: button, style: outline, icon: camera, text: { en: "Photo search", ar: "البحث بالصور" }, gap: s }
        - { kind: listitem, art: shirt, text: { en: "Linen shirt", ar: "قميص كتان" }, value: { en: "650 EGP", ar: "650 جنيه" }, gap: m }
    options:
      - id: tech
        text: { en: "\"Powered by our new neural network\"", ar: "«يعمل بشبكتنا العصبية الجديدة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search clothes and bags", ar: "ابحث في الملابس والحقائب" } }
            - { kind: button, style: outline, icon: camera, text: { en: "Powered by our new neural network", ar: "يعمل بشبكتنا العصبية الجديدة" }, gap: s }
            - { kind: listitem, art: shirt, text: { en: "Linen shirt", ar: "قميص كتان" }, value: { en: "650 EGP", ar: "650 جنيه" }, gap: m }
      - id: engine
        text: { en: "\"AI visual search engine\"", ar: "«محرّك بحث بصري بالذكاء الاصطناعي»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search clothes and bags", ar: "ابحث في الملابس والحقائب" } }
            - { kind: button, style: outline, icon: camera, text: { en: "AI visual search engine", ar: "محرّك بحث بصري بالذكاء الاصطناعي" }, gap: s }
            - { kind: listitem, art: shirt, text: { en: "Linen shirt", ar: "قميص كتان" }, value: { en: "650 EGP", ar: "650 جنيه" }, gap: m }
      - id: benefit
        text: { en: "\"Snap a bag or an outfit, see similar ones we sell\"", ar: "«صوّر حقيبة أو ملابس، وشاهد مثلها عندنا»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: searchbar, text: { en: "Search clothes and bags", ar: "ابحث في الملابس والحقائب" } }
            - { kind: button, style: outline, icon: camera, text: { en: "Snap a bag or an outfit, see similar ones we sell", ar: "صوّر حقيبة أو ملابس، وشاهد مثلها عندنا" }, gap: s }
            - { kind: listitem, art: shirt, text: { en: "Linen shirt", ar: "قميص كتان" }, value: { en: "650 EGP", ar: "650 جنيه" }, gap: m }
    answer: [benefit]
    misconceptions:
      - id: MC-P12-012
        when: [tech, engine]
        feedback:
          en: "Customers don't shop for technology. They want to know what the button does for them."
          ar: "العملاء لا يشترون تقنية. يريدون أن يعرفوا ماذا يفعل لهم هذا الزر."
    hints:
      - { en: "Which title tells a customer what they'll get?", ar: "أي عنوان يقول للعميل ماذا سيحصل؟" }
      - { en: "Which one also hints at what it works for?", ar: "أي واحد يلمّح أيضًا إلى ما يعمل معه؟" }
    correct:
      en: "Right. Say what it does for people, and for what."
      ar: "صحيح. قل ماذا يفعل للناس، ومع أي شيء."
    explain:
      en: "A benefit-first title tells people why to tap it, and naming bags and outfits quietly sets the limits."
      ar: "العنوان الذي يبدأ بالفائدة يقول للناس لماذا يضغطونه، وذِكر الحقائب والملابس يضع الحدود بهدوء."

  - id: S05
    type: tune
    skill: SK-P12-U02-01
    part: guided
    rules: [R06]
    value:
      en: "Mental Models (People + AI): offer examples of how it works that make the product's value clear."
      ar: "النماذج الذهنية (People + AI): قدّم أمثلة على طريقة عمله توضّح قيمة المنتج."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Offer examples of how it works that clarify the value of the product." }
    scenario:
      en: "The first time a customer opens photo search, we have room for one small screen before the camera."
      ar: "أول مرة يفتح فيها العميل البحث بالصور، عندنا مساحة لشاشة صغيرة واحدة قبل الكاميرا."
    prompt:
      en: "Tap each option to see it. What should that screen show?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن تعرض هذه الشاشة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: dar
      appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
      blocks:
        - { kind: image, art: photo, text: { en: "Camera", ar: "الكاميرا" } }
        - { kind: small, color: muted, text: { en: "First time: one small screen before the camera opens", ar: "أول مرة: شاشة صغيرة واحدة قبل أن تُفتح الكاميرا" }, gap: s }
    options:
      - id: example
        text: { en: "One example: a photo of a red bag and the 4 similar bags it found, plus \"Not for jewellery yet\"", ar: "مثال واحد: صورة حقيبة حمراء و4 حقائب مشابهة وجدها، مع «لا يعمل مع المجوهرات بعد»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: image, art: photo }
          overlay:
            type: sheet
            title: { en: "Search with a photo", ar: "ابحث بصورة" }
            blocks:
              - { kind: listitem, art: photo, text: { en: "Your photo: a red bag", ar: "صورتك: حقيبة حمراء" }, sub: { en: "4 similar bags found", ar: "وجدنا 4 حقائب مشابهة" } }
              - { kind: banner, tone: warn, icon: info, text: { en: "Not for jewellery yet", ar: "لا يعمل مع المجوهرات بعد" }, gap: s }
              - { kind: button, icon: camera, text: { en: "Open camera", ar: "افتح الكاميرا" }, gap: s }
      - id: list
        text: { en: "A full list of the 60 product types it supports", ar: "قائمة كاملة بأنواع المنتجات الـ 60 التي يدعمها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: image, art: photo }
          overlay:
            type: sheet
            title: { en: "60 product types we support", ar: "60 نوع منتج ندعمها" }
            blocks:
              - { kind: list, style: bullet, items: [ { en: "Bags", ar: "حقائب" }, { en: "Shirts", ar: "قمصان" }, { en: "Dresses", ar: "فساتين" }, { en: "Shoes", ar: "أحذية" }, { en: "Scarves", ar: "أوشحة" }, { en: "Belts", ar: "أحزمة" } ] }
              - { kind: small, color: muted, text: { en: "+ 54 more…", ar: "+ 54 نوعًا آخر…" }, gap: xs }
              - { kind: button, icon: camera, text: { en: "Open camera", ar: "افتح الكاميرا" }, gap: s }
      - id: video
        text: { en: "A 2-minute video about how the AI was trained", ar: "فيديو مدته دقيقتان عن طريقة تدريب الذكاء الاصطناعي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dar
          appbar: { title: { en: "Dar · Clothes", ar: "دار · ملابس" }, back: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
          blocks:
            - { kind: image, art: photo }
          overlay:
            type: sheet
            title: { en: "How our AI was trained", ar: "كيف درّبنا ذكاءنا الاصطناعي" }
            blocks:
              - { kind: image, art: chart, text: { en: "▶ 2:00", ar: "▶ 2:00" } }
              - { kind: button, icon: camera, text: { en: "Open camera", ar: "افتح الكاميرا" }, gap: s }
    answer: [example]
    misconceptions:
      - id: MC-P12-013
        when: [list, video]
        feedback:
          en: "Too long for a moment before the camera. One clear example shows the value and the limits at a glance."
          ar: "طويل جدًا للحظة قبل الكاميرا. والمثال الواحد الواضح يُظهر القيمة والحدود بنظرة."
    hints:
      - { en: "What can a customer take in within a few seconds?", ar: "ماذا يستطيع العميل أن يستوعب في ثوانٍ؟" }
      - { en: "Which option shows the feature working?", ar: "أي خيار يُظهر الميزة وهي تعمل؟" }
    correct:
      en: "Right. One example teaches more than a list."
      ar: "صحيح. مثال واحد يعلّم أكثر من قائمة."
    explain:
      en: "Seeing a good result tells people what to try, and the short note tells them what not to."
      ar: "رؤية نتيجة جيدة تقول للناس ماذا يجرّبون، والملاحظة القصيرة تقول لهم ماذا يتجنّبون."

  - id: S06
    type: compare
    skill: SK-P12-U02-01
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: magic vs honest limits. Mental Models (People + AI): be up-front about what the product can and can't do from the first interaction, ideally in marketing."
      ar: "مقارنة: سحر مقابل حدود صادقة. النماذج الذهنية (People + AI): كن صريحًا فيما يستطيعه المنتج وما لا يستطيعه من أول تعامل، ويُفضّل في التسويق."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Be up-front about what your product can and can’t do the first time the user interacts with it, ideally in your marketing messages." }
    scenario:
      en: "We're rewriting the ad. Two versions:"
      ar: "نعيد كتابة الإعلان. وهاتان نسختان:"
    prompt:
      en: "Which ad should we run?"
      ar: "أي إعلان يجب أن ننشره؟"
    a:
      label: { en: "A: \"Smarter than ever. Our AI finds anything you can imagine.\"", ar: "A: «أذكى من أي وقت. ذكاؤنا الاصطناعي يجد أي شيء تتخيّله.»" }
      mock:
        app: dar
        appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
        blocks:
          - { kind: searchbar, text: { en: "Search Dar", ar: "ابحث في دار" } }
          - { kind: card, art: shirt, blocks: [ { kind: badge, icon: sparkle, text: { en: "Photo search", ar: "البحث بالصور" } }, { kind: heading, text: { en: "Smarter than ever. Our AI finds anything you can imagine.", ar: "أذكى من أي وقت. ذكاؤنا الاصطناعي يجد أي شيء تتخيّله." } }, { kind: button, text: { en: "Try it", ar: "جرّبه" } } ], gap: s }
    b:
      label: { en: "B: \"Snap a bag or an outfit, see similar ones. Jewellery coming soon.\"", ar: "B: «صوّر حقيبة أو ملابس، وشاهد مثلها. المجوهرات قريبًا.»" }
      mock:
        app: dar
        appbar: { logo: true, actions: [ { icon: shopping-cart, aria: { en: "Cart", ar: "السلة" } } ] }
        blocks:
          - { kind: searchbar, text: { en: "Search Dar", ar: "ابحث في دار" } }
          - { kind: card, art: shirt, blocks: [ { kind: badge, icon: camera, text: { en: "Photo search", ar: "البحث بالصور" } }, { kind: heading, text: { en: "Snap a bag or an outfit, see similar ones. Jewellery coming soon.", ar: "صوّر حقيبة أو ملابس، وشاهد مثلها. المجوهرات قريبًا." } }, { kind: button, text: { en: "Try it", ar: "جرّبه" } } ], gap: s }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: trust, text: { en: "Customers try what works, get good results, and trust it", ar: "العملاء يجرّبون ما يعمل، فيحصلون على نتائج جيدة، ويثقون به" } }
        - { id: modest, text: { en: "Modest ads always sell more", ar: "الإعلانات المتواضعة تبيع أكثر دائمًا" } }
        - { id: short, text: { en: "B is shorter", ar: "B أقصر" } }
      answer: [trust]
      misconceptions:
        - id: MC-P12-011
          when: [modest, short]
          feedback:
            en: "It's about matching the promise to the product. When they match, people's first tries succeed."
            ar: "المسألة أن يطابق الوعد المنتج. وحين يتطابقان، تنجح أول محاولات الناس."
    misconceptions:
      - id: MC-P12-011
        when: [a]
        feedback:
          en: "A sounds exciting, but it repeats the first mistake. Customers will snap rings again and feel cheated."
          ar: "A يبدو مثيرًا، لكنه يكرّر الخطأ الأول. سيصوّر العملاء الخواتم مرة أخرى ويشعرون بالخداع."
    hints:
      - { en: "What will customers try after each ad?", ar: "ماذا سيجرّب العملاء بعد كل إعلان؟" }
      - { en: "Which ad can the product live up to?", ar: "أي إعلان يستطيع المنتج أن يفي به؟" }
    correct:
      en: "Right. Promise what it does, and it will delight."
      ar: "صحيح. عِد بما يفعله، وسيُسعد الناس."
    explain:
      en: "Honest limits aren't weakness. They point people to where the feature shines."
      ar: "الحدود الصادقة ليست ضعفًا. بل توجّه الناس إلى حيث تتميّز الميزة."

  - id: S07
    type: tune
    skill: SK-P12-U02-04
