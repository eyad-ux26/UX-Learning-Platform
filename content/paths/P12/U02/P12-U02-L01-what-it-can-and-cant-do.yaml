        feedback:
          en: "Both talk about the technology. Customers want to know what they get: a clear view of their spending."
          ar: "الاثنان يتحدّثان عن التقنية. والعملاء يريدون معرفة ما سيحصلون عليه: صورة واضحة لمصروفاتهم."
