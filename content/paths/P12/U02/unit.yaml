id: P12-U02
free: false
title:
  en: "Set the right expectations"
  ar: "اجعل توقّعات الناس صحيحة"
skill:
  en: "Introduce AI features honestly: say what they can and can't do, show them at the right moment, and never pretend they're a person."
  ar: "قدّم ميزات الذكاء الاصطناعي بصدق: قل ما تستطيعه وما لا تستطيعه، وأظهرها في اللحظة المناسبة، ولا توهِم الناس أبدًا أنها إنسان."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P12-U02-01
    title: { en: "Say what it can and can't do", ar: "قل ما يستطيعه وما لا يستطيعه" }
    can_do: { en: "State an AI feature's limits plainly the first time people meet it, with an example, and never promise magic.", ar: "اذكر حدود ميزة الذكاء الاصطناعي بوضوح من أول لقاء بها، مع مثال، ولا تَعِد بالسحر أبدًا." }
  - id: SK-P12-U02-02
    title: { en: "Introduce it at the right moment", ar: "قدّمه في اللحظة المناسبة" }
    can_do: { en: "Show an AI feature when it's relevant, in a line or two, and offer a small safe way to try it.", ar: "أظهر ميزة الذكاء الاصطناعي حين تكون مفيدة، في سطر أو سطرين، وقدّم طريقة صغيرة آمنة لتجربتها." }
  - id: SK-P12-U02-03
    title: { en: "Don't pretend it's a person", ar: "لا توهِم الناس أنه إنسان" }
    can_do: { en: "Make clear an assistant is automated, avoid human names and promises, and tell people what they can ask.", ar: "وضّح أن المساعد آلي، وتجنّب الأسماء والوعود البشرية، وأخبر الناس بما يمكنهم أن يطلبوه." }
  - id: SK-P12-U02-04
    title: { en: "Explain the benefit, not the technology", ar: "اشرح الفائدة، لا التقنية" }
    can_do: { en: "Describe what an AI feature does for people, and keep technical details behind a \"How it works\" link.", ar: "صِف ما تفعله ميزة الذكاء الاصطناعي للناس، وضع التفاصيل التقنية في رابط «كيف يعمل»." }
  - id: SK-P12-U02-05
    title: { en: "Say how it learns and changes", ar: "قل كيف يتعلّم ويتغيّر" }
    can_do: { en: "Tell people how their feedback helps, what it changes and when, and re-introduce a feature that changed.", ar: "أخبر الناس كيف يساعد رأيهم (Feedback)، وما الذي يغيّره ومتى، وعرّفهم من جديد بالميزة التي تغيّرت." }
