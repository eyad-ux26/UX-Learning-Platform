id: P12-U02-B01
mode: bank
title:
  en: "Re-tests: set the right expectations"
  ar: "إعادة اختبار: ضع التوقّعات الصحيحة"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Mental Models (People + AI Guidebook)", ar: "النماذج الذهنية (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/mental-models/"
steps:
  - id: S01
    type: choose
    skill: SK-P12-U02-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Mental Models (People + AI): hiding how a product works, to shield people from complexity, can lead to confusion and broken trust."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): إخفاء طريقة عمل المنتج، لحماية الناس من التعقيد، قد يؤدّي إلى الارتباك وكسر الثقة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Though product developers may intend to shield users from a product’s complexity, hiding how it works can set users up for confusion and broken trust." }
    scenario:
      en: "Our pharmacy app now reads prescription photos with AI. It reads printed ones well, but often misreads handwriting. The team wants to just say \"Upload your prescription\"."
      ar: "تطبيق صيدليتنا أصبح يقرأ صور الوصفات الطبية بالذكاء الاصطناعي. يقرأ المطبوعة جيدًا، لكنه كثيرًا ما يخطئ في خط اليد. والفريق يريد أن يكتب فقط «ارفع الوصفة الطبية»."
    prompt:
      en: "What should the upload screen say?"
      ar: "ماذا يجب أن تقول شاشة الرفع؟"
    options:
      - { id: plain, text: { en: "Just \"Upload your prescription\"; details would confuse people", ar: "فقط «ارفع الوصفة الطبية»؛ فالتفاصيل ستُربك الناس" } }
      - { id: honest, text: { en: "\"Printed prescriptions are read automatically. Handwritten ones may take longer, because a pharmacist checks them.\"", ar: "«الوصفات المطبوعة تُقرأ تلقائيًا. والمكتوبة بخط اليد قد تأخذ وقتًا أطول، لأن صيدليًا يراجعها.»" } }
      - { id: magic, text: { en: "\"Our AI reads any prescription instantly!\"", ar: "«ذكاؤنا الاصطناعي يقرأ أي وصفة فورًا!»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-011
        when: [plain, magic]
        feedback:
          en: "Customers with handwritten prescriptions will wonder why theirs is slow or wrong. One honest line sets the right expectation."
          ar: "العملاء أصحاب الوصفات المكتوبة بخط اليد سيتساءلون لماذا وصفتهم بطيئة أو خطأ. وسطر صادق واحد يضع التوقّع الصحيح."
    correct:
      en: "Right. A short, honest line prevents surprise."
      ar: "صحيح. سطر قصير وصادق يمنع المفاجأة."
    explain:
      en: "You don't need technical detail, just what works well and what takes longer."
      ar: "لا تحتاج تفاصيل تقنية، فقط ما يعمل جيدًا وما يأخذ وقتًا أطول."

  - id: S02
    type: choose
    skill: SK-P12-U02-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. Mental Models (People + AI): describe AI features in terms of helping people, while setting the right expectations for what the AI can do."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): صِف ميزات الذكاء الاصطناعي بأنها تساعد الناس، مع وضع التوقّعات الصحيحة لما يستطيعه."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Describe AI features in terms of helping people improve while setting the right expectations for what the AI can do." }
    scenario:
      en: "Our gym app can now check a member's form from a short video. It works for squats and push-ups only, for now."
      ar: "تطبيق النادي أصبح يفحص طريقة أداء العضو للتمرين من فيديو قصير. ويعمل مع القرفصاء والضغط فقط، حاليًا."
    prompt:
      en: "Which description is best?"
      ar: "أي وصف هو الأفضل؟"
    options:
      - { id: honest, text: { en: "\"Film your squat or push-up and get tips to improve your form. More exercises soon.\"", ar: "«صوّر تمرين القرفصاء أو الضغط واحصل على نصائح لتحسين أدائك. تمارين أخرى قريبًا.»" } }
      - { id: coach, text: { en: "\"Your AI personal trainer, for any exercise.\"", ar: "«مدرّبك الشخصي بالذكاء الاصطناعي، لأي تمرين.»" } }
      - { id: vague, text: { en: "\"Smart form check.\"", ar: "«فحص ذكي للأداء.»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-011
        when: [coach]
        feedback:
          en: "\"Any exercise\" isn't true. Members will film deadlifts and get nothing useful."
          ar: "«أي تمرين» غير صحيح. سيصوّر الأعضاء تمارين أخرى ولا يحصلون على شيء مفيد."
      - id: MC-P12-011
        when: [vague]
        feedback:
          en: "It doesn't say what it helps with or which exercises work. Members have to guess."
          ar: "لا يقول بماذا يساعد ولا أي التمارين تعمل. فيضطر الأعضاء للتخمين."
    correct:
      en: "Right. The benefit and the limit, in one line."
      ar: "صحيح. الفائدة والحد، في سطر واحد."
    explain:
      en: "Name what it helps with and where it works today. People will start where it succeeds."
      ar: "اذكر بماذا يساعد وأين يعمل اليوم. فيبدأ الناس من حيث ينجح."

  - id: S03
    type: choose
    skill: SK-P12-U02-02
    part: retest
    speaker: sara
    value:
      en: "Re-test. Mental Models (People + AI): people learn better when short, explicit information appears right when they need it."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): يتعلّم الناس أفضل حين تظهر معلومة قصيرة وواضحة في اللحظة التي يحتاجونها."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "People learn better when short, explicit information appears right when they need it." }
    scenario:
      en: "I'm designing a messaging app. We're adding AI \"smart replies\" that suggest short answers to a message."
      ar: "أصمّم تطبيق رسائل. ونضيف «ردودًا ذكية» بالذكاء الاصطناعي تقترح إجابات قصيرة على الرسالة."
    prompt:
      en: "How should people first learn about smart replies?"
      ar: "كيف يجب أن يعرف الناس الردود الذكية أول مرة؟"
    options:
      - { id: news, text: { en: "In the \"What's new\" list with 9 other updates", ar: "في قائمة «الجديد» مع 9 تحديثات أخرى" } }
      - { id: popup, text: { en: "A pop-up the moment they open the app", ar: "نافذة منبثقة لحظة فتح التطبيق" } }
      - { id: reply, text: { en: "A one-line tip above the suggestions, the first time they reply to a message", ar: "تلميح من سطر واحد فوق الاقتراحات، أول مرة يردّون فيها على رسالة" } }
    answer: [reply]
    misconceptions:
      - id: MC-P12-014
        when: [news, popup]
        feedback:
          en: "Both explain it before people need it. At the moment of replying, the tip makes sense right away."
          ar: "الاثنان يشرحانها قبل أن يحتاجها الناس. أما لحظة الرد، فيكون التلميح مفهومًا فورًا."
    correct:
      en: "Right. Short, and right on time."
      ar: "صحيح. قصير، وفي وقته تمامًا."
    explain:
      en: "Teach a feature in the place it's used, at the moment it's useful."
      ar: "علّم الميزة في مكان استخدامها، في اللحظة التي تكون فيها مفيدة."

  - id: S04
    type: choose
    skill: SK-P12-U02-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Mental Models (People + AI): encourage people to experiment, and reassure them that experimenting won't shape their future experience."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): شجّع الناس على التجربة، وطمئنهم أن التجربة لن تشكّل تجربتهم القادمة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Encourage experimentation and reassure users that experimenting won’t dictate their future experiences." }
    scenario:
      en: "Photo search also learns what each customer likes. Some customers say they're afraid to \"mess up\" their suggestions by trying it."
      ar: "البحث بالصور يتعلّم أيضًا ما يحبّه كل عميل. وبعض العملاء يقولون إنهم يخافون أن «يُفسدوا» اقتراحاتهم إذا جرّبوه."
    prompt:
      en: "What should we add to the first photo search?"
      ar: "ماذا نضيف لأول بحث بالصور؟"
    options:
      - { id: none, text: { en: "Nothing; they'll get used to it", ar: "لا شيء؛ سيعتادون عليه" } }
      - { id: try, text: { en: "\"Try it with this sample photo. It won't change your suggestions.\"", ar: "«جرّبه بهذه الصورة النموذجية. لن تتغيّر اقتراحاتك.»" } }
      - { id: warn, text: { en: "\"Careful: every photo you search changes your suggestions.\"", ar: "«انتبه: كل صورة تبحث بها تغيّر اقتراحاتك.»" } }
    answer: [try]
    misconceptions:
      - id: MC-P12-015
        when: [none, warn]
        feedback:
          en: "Worried customers won't try at all. A safe first try, with no effect on suggestions, invites them in."
          ar: "العملاء القلقون لن يجرّبوا أبدًا. والتجربة الأولى الآمنة، بلا أثر على الاقتراحات، تدعوهم للدخول."
    correct:
      en: "Right. Safe to try means people try."
      ar: "صحيح. حين تكون التجربة آمنة، يجرّب الناس."
    explain:
      en: "Remove the fear of breaking something, and curiosity does the rest."
      ar: "أزِل الخوف من إفساد شيء، والفضول يقوم بالباقي."

  - id: S05
    type: choose
    skill: SK-P12-U02-03
    part: retest
    speaker: karim
    value:
      en: "Re-test. Mental Models (People + AI): people are more likely to have unachievable expectations for products they think have human-like abilities."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): الناس أكثر ميلًا لتوقّعات مستحيلة من المنتجات التي يظنّون أن لها قدرات بشرية."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "People are more likely to have unachievable expectations for products that they assume have human-like capabilities." }
    scenario:
      en: "The team wants our support chatbot to be called \"Omar\", to pause before replying, and to say \"Hmm, let me think\"."
      ar: "الفريق يريد أن يُسمّى روبوت الدعم «عمر»، وأن يتوقّف قبل الرد، وأن يقول «همم، دعني أفكّر»."
    prompt:
      en: "What should I recommend?"
      ar: "بماذا يجب أن أنصح؟"
    options:
      - { id: plain, text: { en: "Call it \"Support assistant (automatic)\" and reply straight away", ar: "نسمّيه «مساعد الدعم (آلي)» ويردّ فورًا" } }
      - { id: omar, text: { en: "Go with \"Omar\"; people like talking to someone", ar: "نختار «عمر»؛ فالناس يحبّون الحديث مع شخص" } }
      - { id: half, text: { en: "Keep \"Omar\" but drop the pauses", ar: "نُبقي «عمر» لكن نحذف التوقّفات" } }
    answer: [plain]
    misconceptions:
      - id: MC-P12-019
        when: [omar, half]
        feedback:
          en: "A human name makes people expect a person's understanding. When \"Omar\" misunderstands, it feels like being ignored."
          ar: "الاسم البشري يجعل الناس يتوقّعون فهم إنسان. وحين لا يفهم «عمر»، يبدو الأمر كأنه تجاهل."
    correct:
      en: "Right. Plain and honest sets the right bar."
      ar: "صحيح. البساطة والصدق يضعان المستوى الصحيح."
    explain:
      en: "Fake thinking and a human name promise more than a bot can give."
      ar: "التفكير المصطنع والاسم البشري يَعِدان بأكثر مما يستطيعه الروبوت."

  - id: S06
    type: choose
    skill: SK-P12-U02-03
    part: retest
    speaker: hana
    value:
      en: "Re-test. Mental Models (People + AI): choose how human the AI seems based on how well its abilities match what people expect a human to do."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): اختر مدى بشرية الذكاء الاصطناعي حسب مدى تطابق قدراته مع ما يتوقّعه الناس من إنسان."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Choose the level of humanization based on how well your AI’s capabilities match the user’s perceptions of what a human can do." }
    scenario:
      en: "Our gym has a voice assistant at the front desk called \"Coach Sam\". It only books classes, but members tell it about injuries, thinking a coach will hear."
      ar: "في استقبال النادي مساعد صوتي اسمه «الكابتن سام». هو يحجز الحصص فقط، لكن الأعضاء يخبرونه عن إصاباتهم، ظانّين أن مدرّبًا سيسمع."
    prompt:
      en: "What should we change?"
      ar: "ماذا يجب أن نغيّر؟"
    options:
      - { id: smarter, text: { en: "Teach it to give injury advice", ar: "نعلّمه أن يعطي نصائح للإصابات" } }
      - { id: voice, text: { en: "Give it a warmer voice", ar: "نعطيه صوتًا أدفأ" } }
      - { id: honest, text: { en: "Rename it \"Class booking (automatic)\" and say \"For injuries, talk to a coach\"", ar: "نسمّيه «حجز الحصص (آلي)» ويقول «للإصابات، تحدّث مع مدرّب»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-018
        when: [smarter, voice]
        feedback:
          en: "The problem is members think it's a coach. Make clear what it is, and send injuries to a real person."
          ar: "المشكلة أن الأعضاء يظنّونه مدرّبًا. وضّح ما هو، ووجّه الإصابات إلى إنسان حقيقي."
    correct:
      en: "Right. Match how it seems to what it does."
      ar: "صحيح. اجعل شكله يطابق ما يفعله."
    explain:
      en: "\"Coach\" promises a coach. A plain name matches a booking tool."
      ar: "«الكابتن» يَعِد بمدرّب. والاسم البسيط يناسب أداة حجز."

  - id: S07
    type: choose
    skill: SK-P12-U02-04
    part: retest
    speaker: rami
    value:
      en: "Re-test. Mental Models (People + AI): people interested in the technology can get more detail through tooltips and progressive disclosure."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): من يهتمّ بالتقنية يمكنه الحصول على تفاصيل أكثر عبر التلميحات والإظهار التدريجي."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "If they’re interested in understanding the underlying technology of your product, you can always provide more detail with tooltips and progressive disclosure." }
    scenario:
      en: "I'm designing an AI trip planner. The engineers want the first screen to explain the AI models in a full paragraph."
      ar: "أصمّم مخطّط رحلات بالذكاء الاصطناعي. والمهندسون يريدون أن تشرح الشاشة الأولى نماذج الذكاء الاصطناعي في فقرة كاملة."
    prompt:
      en: "What should the first screen show?"
      ar: "ماذا يجب أن تعرض الشاشة الأولى؟"
    options:
      - { id: para, text: { en: "The full paragraph; people should understand the AI", ar: "الفقرة كاملة؛ يجب أن يفهم الناس الذكاء الاصطناعي" } }
      - { id: benefit, text: { en: "\"Plan a 3-day trip in minutes\", with a small \"How it works\" link", ar: "«خطّط لرحلة 3 أيام في دقائق»، مع رابط صغير «كيف يعمل»" } }
      - { id: none, text: { en: "Nothing about it at all", ar: "لا شيء عنه أبدًا" } }
    answer: [benefit]
    misconceptions:
      - id: MC-P12-012
        when: [para]
        feedback:
          en: "Most people want to plan a trip, not read about models. Put the paragraph behind the link."
          ar: "أغلب الناس يريدون التخطيط لرحلة، لا القراءة عن النماذج. ضع الفقرة خلف الرابط."
      - id: MC-P12-012
        when: [none]
        feedback:
          en: "People still need to know what it does for them. Lead with the benefit."
          ar: "الناس ما زالوا يحتاجون معرفة ما يفعله لهم. ابدأ بالفائدة."
    correct:
      en: "Right. Benefit first, details for the curious."
      ar: "صحيح. الفائدة أولًا، والتفاصيل للفضوليين."
    explain:
      en: "Everyone sees what it does for them; those who want more can tap for it."
      ar: "الجميع يرى ماذا يفعل لهم؛ ومن يريد المزيد يضغط ليراه."

  - id: S08
    type: choose
    skill: SK-P12-U02-04
    part: retest
    speaker: nour
    value:
      en: "Re-test. Mental Models (People + AI): explain the benefit, not the technology."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): اشرح الفائدة، لا التقنية."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Explain the benefit, not the technology" }
    scenario:
      en: "Our clinic is adding AI that writes visit notes while the doctor talks with the patient. I'm writing the message to our doctors."
      ar: "عيادتنا تضيف ذكاءً اصطناعيًا يكتب ملاحظات الزيارة بينما يتحدّث الطبيب مع المريض. وأكتب الرسالة لأطبائنا."
    prompt:
      en: "Which message is best?"
      ar: "أي رسالة هي الأفضل؟"
    options:
      - { id: tech, text: { en: "\"We've added speech recognition with medical vocabulary.\"", ar: "«أضفنا تعرّفًا على الكلام بمفردات طبية.»" } }
      - { id: new, text: { en: "\"New AI feature now live in your system.\"", ar: "«ميزة ذكاء اصطناعي جديدة متاحة الآن في نظامك.»" } }
      - { id: benefit, text: { en: "\"Look at your patient, not the keyboard: notes are drafted as you talk. Check them before saving.\"", ar: "«انظر إلى مريضك، لا إلى لوحة المفاتيح: الملاحظات تُكتب كمسودة وأنت تتحدّث. راجِعها قبل الحفظ.»" } }
    answer: [benefit]
    misconceptions:
      - id: MC-P12-012
        when: [tech, new]
        feedback:
          en: "Doctors want to know what changes for them: less typing, more time with the patient."
          ar: "الأطباء يريدون معرفة ما يتغيّر لهم: كتابة أقل، ووقت أكثر مع المريض."
    correct:
      en: "Right. The benefit, plus what to check."
      ar: "صحيح. الفائدة، وما يجب مراجعته."
    explain:
      en: "Lead with the change in their day, and set the expectation that drafts need checking."
      ar: "ابدأ بالتغيير في يومهم، وضع التوقّع أن المسودات تحتاج مراجعة."

  - id: S09
    type: choose
    skill: SK-P12-U02-05
    part: retest
    speaker: mona
    value:
      en: "Re-test. Mental Models (People + AI): let people know up front that the product may need their feedback to improve over time."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): أخبر الناس من البداية أن المنتج قد يحتاج ملاحظاتهم ليتحسّن مع الوقت."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Let people know up-front that it may need their feedback to improve over time." }
    scenario:
      en: "My team's news app picks stories for each reader. In the first week, picks are often off, and readers think it's broken."
      ar: "تطبيق الأخبار الذي يصمّمه فريقي يختار القصص لكل قارئ. وفي الأسبوع الأول، الاختيارات كثيرًا ما تكون بعيدة، فيظنّ القرّاء أنه معطّل."
    prompt:
      en: "What should we tell new readers?"
      ar: "ماذا يجب أن نخبر القرّاء الجدد؟"
    options:
      - { id: upfront, text: { en: "\"Your picks get better as you read. Tap 'Less like this' on stories you don't want.\"", ar: "«اختياراتك تتحسّن كلما قرأت. اضغط 'أقل من هذا' على القصص التي لا تريدها.»" } }
      - { id: none, text: { en: "Nothing; it will improve on its own", ar: "لا شيء؛ سيتحسّن وحده" } }
      - { id: perfect, text: { en: "\"Stories picked perfectly for you.\"", ar: "«قصص مختارة لك بدقة تامة.»" } }
    answer: [upfront]
    misconceptions:
      - id: MC-P12-017
        when: [none, perfect]
        feedback:
          en: "Readers judge the first week. Telling them it learns, and how to help, turns bad picks into something they can fix."
          ar: "القرّاء يحكمون من الأسبوع الأول. وإخبارهم أنه يتعلّم، وكيف يساعدونه، يحوّل الاختيارات السيئة إلى شيء يستطيعون إصلاحه."
    correct:
      en: "Right. Say it learns, and how to help."
      ar: "صحيح. قل إنه يتعلّم، وكيف تساعده."
    explain:
      en: "When people expect learning, early mistakes feel normal, not broken."
      ar: "حين يتوقّع الناس التعلّم، تبدو الأخطاء الأولى طبيعية، لا عطلًا."

  - id: S10
    type: choose
    skill: SK-P12-U02-05
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Mental Models (People + AI): if a feature changes enough that people would notice, consider \"re-boarding\" them to the new experience."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): إذا تغيّرت الميزة بما يكفي ليلاحظ الناس، ففكّر في إعادة تقديمها لهم بالتجربة الجديدة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "If how a feature works changes or improves significantly — enough that a user would notice — consider whether your users need “re-boarding” to the new experience." }
    scenario:
      en: "We updated our grocery app's suggestions. They now use the weather and holidays too, so they look very different. Customers are asking what happened."
      ar: "حدّثنا اقتراحات تطبيق البقالة. أصبحت تستخدم الطقس والإجازات أيضًا، فتبدو مختلفة جدًا. والعملاء يسألون ماذا حدث."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    options:
      - { id: none, text: { en: "Nothing; they'll get used to it", ar: "لا شيء؛ سيعتادون عليها" } }
      - { id: reboard, text: { en: "Show a short note on the suggestions: \"New: picks now follow the weather and holidays\"", ar: "نعرض ملاحظة قصيرة على الاقتراحات: «جديد: الاختيارات تتبع الطقس والإجازات الآن»" } }
      - { id: email, text: { en: "Put it in the app store release notes", ar: "نكتبها في ملاحظات الإصدار في متجر التطبيقات" } }
    answer: [reboard]
    misconceptions:
      - id: MC-P12-017
        when: [none, email]
        feedback:
          en: "Customers already noticed the change. They need the reason where they see it, not in notes they won't read."
          ar: "العملاء لاحظوا التغيير بالفعل. ويحتاجون السبب حيث يرونه، لا في ملاحظات لن يقرؤوها."
    correct:
      en: "Right. Re-introduce what changed, where it changed."
      ar: "صحيح. أعِد تقديم ما تغيّر، حيث تغيّر."
    explain:
      en: "When a feature behaves differently, tell people why, right where they notice it."
      ar: "حين تتصرّف الميزة بشكل مختلف، أخبر الناس لماذا، حيث يلاحظون ذلك."
