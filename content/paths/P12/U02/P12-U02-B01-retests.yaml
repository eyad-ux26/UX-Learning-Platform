id: P12-U02-B01
mode: bank
title:
  en: "Re-tests: set the right expectations"
  ar: "إعادة اختبار: اجعل توقّعات الناس صحيحة"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Mental Models (People + AI Guidebook)", ar: "النماذج الذهنية (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/mental-models/"
steps:
  - id: S01
    type: tune
    skill: SK-P12-U02-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Mental Models (People + AI): hiding how a product works, to shield people from complexity, can lead to confusion and broken trust."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): إخفاء طريقة عمل المنتج، لحماية الناس من التعقيد، قد يؤدّي إلى الارتباك وكسر الثقة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Though product developers may intend to shield users from a product’s complexity, hiding how it works can set users up for confusion and broken trust." }
    scenario:
      en: "Our pharmacy app now reads prescription photos with AI. It reads printed ones well, but often misreads handwriting. The team wants to just say \"Upload your prescription\"."
      ar: "تطبيق صيدليتنا أصبح يقرأ صور الوصفات الطبية بالذكاء الاصطناعي. يقرأ المطبوعة جيدًا، لكنه كثيرًا ما يخطئ في خط اليد. والفريق يريد أن يكتب فقط «ارفع الوصفة الطبية»."
    prompt:
      en: "What should the upload screen say?"
      ar: "ماذا نكتب في شاشة رفع الوصفة؟"
    mock:
      app: dawaa
      appbar:
        title: {en: Upload prescription, ar: ارفع الوصفة}
        back: true
      blocks:
      - {kind: image, art: document}
      - kind: small
        color: muted
        text:
          en: "What should this screen say?"
          ar: ماذا نكتب في هذه الشاشة؟
        gap: s
      footer:
      - kind: button
        icon: camera
        text: {en: Take a photo, ar: التقط صورة}
      caption: {en: Now, ar: الآن}
    options:
      - id: plain
        text:
          en: "Just \"Upload your prescription\"; details would confuse people"
          ar: فقط «ارفع الوصفة الطبية»؛ فالتفاصيل ستُربك الناس
        mock:
          app: dawaa
          appbar:
            title: {en: Upload prescription, ar: ارفع الوصفة}
            back: true
          blocks:
          - {kind: image, art: document}
          - kind: heading
            text: {en: Upload your prescription, ar: ارفع الوصفة الطبية}
            gap: s
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: honest
        text:
          en: "\"Printed prescriptions are read automatically. Handwritten ones may take longer, because a pharmacist checks them.\""
          ar: «الوصفات المطبوعة تُقرأ تلقائيًا. والمكتوبة بخط اليد قد تأخذ وقتًا أطول، لأن صيدليًا يراجعها.»
        mock:
          app: dawaa
          appbar:
            title: {en: Upload prescription, ar: ارفع الوصفة}
            back: true
          blocks:
          - {kind: image, art: document}
          - kind: heading
            text: {en: Upload your prescription, ar: ارفع الوصفة الطبية}
            gap: s
          - kind: text
            text:
              en: "Printed prescriptions are read automatically. Handwritten ones may take longer, because a pharmacist checks them."
              ar: الوصفات المطبوعة تُقرأ تلقائيًا. والمكتوبة بخط اليد قد تأخذ وقتًا أطول، لأن صيدليًا يراجعها.
            gap: xs
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: magic
        text:
          en: "\"Our AI reads any prescription instantly!\""
          ar: "«ذكاؤنا الاصطناعي يقرأ أي وصفة فورًا!»"
        mock:
          app: dawaa
          appbar:
            title: {en: Upload prescription, ar: ارفع الوصفة}
            back: true
          blocks:
          - {kind: image, art: document}
          - kind: badge
            text: {en: AI, ar: ذكاء اصطناعي}
            icon: sparkle
            gap: s
          - kind: heading
            text:
              en: "Our AI reads any prescription instantly!"
              ar: "ذكاؤنا الاصطناعي يقرأ أي وصفة فورًا!"
            gap: xs
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [honest]
    misconceptions:
      - id: MC-P12-011
        when: [plain, magic]
        feedback:
          en: "Customers with handwritten prescriptions will wonder why theirs is slow or wrong. One honest line sets the right expectation."
          ar: "العملاء أصحاب الوصفات المكتوبة بخط اليد سيتساءلون لماذا تتأخّر وصفتهم أو تُقرأ خطأ. وسطر صادق واحد يجعل توقّعاتهم صحيحة."
    correct:
      en: "Right. A short, honest line prevents surprise."
      ar: "صحيح. سطر قصير وصادق يمنع المفاجأة."
    explain:
      en: "You don't need technical detail, just what works well and what takes longer."
      ar: "لا تحتاج تفاصيل تقنية، فقط ما يعمل جيدًا وما يأخذ وقتًا أطول."

  - id: S02
    type: tune
    skill: SK-P12-U02-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. Mental Models (People + AI): describe AI features in terms of helping people, while setting the right expectations for what the AI can do."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): صِف ميزات الذكاء الاصطناعي بأنها تساعد الناس، مع وضع التوقّعات الصحيحة لما يستطيعه."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Describe AI features in terms of helping people improve while setting the right expectations for what the AI can do." }
    scenario:
      en: "Our gym app can now check a member's form from a short video. It works for squats and push-ups only, for now."
      ar: "تطبيق النادي أصبح يفحص طريقة أداء العضو للتمرين من فيديو قصير. ويعمل مع القرفصاء والضغط فقط، حاليًا."
    prompt:
      en: "Which description is best?"
      ar: "أي وصف نكتب ليعرف الأعضاء ماذا يتوقّعون من الميزة؟"
    mock:
      app: nashat
      appbar:
        title: {en: Form check, ar: فحص الأداء}
        back: true
      blocks:
      - kind: badge
        icon: sparkle
        text: {en: New, ar: جديد}
      - {kind: image, art: gym, gap: xs}
      - kind: small
        color: muted
        text:
          en: "Works for: squats, push-ups"
          ar: "يعمل مع: القرفصاء، والضغط"
        gap: s
      footer:
      - kind: button
        icon: video-camera
        text: {en: Record 10 seconds, ar: سجّل 10 ثوانٍ}
      caption: {en: Now, ar: الآن}
    options:
      - id: honest
        text:
          en: "\"Film your squat or push-up and get tips to improve your form. More exercises soon.\""
          ar: «صوّر تمرين القرفصاء أو الضغط واحصل على نصائح لتحسين أدائك. تمارين أخرى قريبًا.»
        mock:
          app: nashat
          appbar:
            title: {en: Form check, ar: فحص الأداء}
            back: true
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: New, ar: جديد}
          - {kind: image, art: gym, gap: xs}
          - kind: text
            text: {en: Film your squat or push-up and get tips to improve your form. More exercises soon., ar: صوّر تمرين القرفصاء أو الضغط واحصل على نصائح لتحسين أدائك. تمارين أخرى قريبًا.}
            gap: s
          - kind: small
            color: muted
            text:
              en: "Works for: squats, push-ups"
              ar: "يعمل مع: القرفصاء، والضغط"
            gap: s
          footer:
          - kind: button
            icon: video-camera
            text: {en: Record 10 seconds, ar: سجّل 10 ثوانٍ}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: coach
        text:
          en: "\"Your AI personal trainer, for any exercise.\""
          ar: «مدرّبك الشخصي بالذكاء الاصطناعي، لأي تمرين.»
        mock:
          app: nashat
          appbar:
            title: {en: Form check, ar: فحص الأداء}
            back: true
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: New, ar: جديد}
          - {kind: image, art: gym, gap: xs}
          - kind: text
            text:
              en: "Your AI personal trainer, for any exercise."
              ar: مدرّبك الشخصي بالذكاء الاصطناعي، لأي تمرين.
            gap: s
          - kind: small
            color: muted
            text:
              en: "Works for: squats, push-ups"
              ar: "يعمل مع: القرفصاء، والضغط"
            gap: s
          footer:
          - kind: button
            icon: video-camera
            text: {en: Record 10 seconds, ar: سجّل 10 ثوانٍ}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: vague
        text:
          en: "\"Smart form check.\""
          ar: «فحص ذكي للأداء.»
        mock:
          app: nashat
          appbar:
            title: {en: Form check, ar: فحص الأداء}
            back: true
          blocks:
          - kind: badge
            icon: sparkle
            text: {en: New, ar: جديد}
          - {kind: image, art: gym, gap: xs}
          - kind: text
            text: {en: Smart form check., ar: فحص ذكي للأداء.}
            gap: s
          - kind: small
            color: muted
            text:
              en: "Works for: squats, push-ups"
              ar: "يعمل مع: القرفصاء، والضغط"
            gap: s
          footer:
          - kind: button
            icon: video-camera
            text: {en: Record 10 seconds, ar: سجّل 10 ثوانٍ}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [honest]
    misconceptions:
      - id: MC-P12-011
        when: [coach]
        feedback:
          en: "\"Any exercise\" isn't true. Members will film deadlifts and get nothing useful."
          ar: "«أي تمرين» غير صحيح. سيصوّر الأعضاء تمارين أخرى ولا يحصلون على شيء مفيد."
      - id: MC-P12-011
        when: [vague]
        feedback:
          en: "It doesn't say what it helps with or which exercises work. Members have to guess."
          ar: "لا يقول بماذا يساعد ولا مع أي تمارين يعمل. فيضطر الأعضاء للتخمين."
    correct:
      en: "Right. The benefit and the limit, in one line."
      ar: "صحيح. الفائدة والحدود، في سطر واحد."
    explain:
      en: "Name what it helps with and where it works today. People will start where it succeeds."
      ar: "اذكر بماذا يساعد وأين يعمل اليوم. فيبدأ الناس من حيث ينجح."

  - id: S03
    type: tune
    skill: SK-P12-U02-02
    part: retest
    speaker: sara
    value:
      en: "Re-test. Mental Models (People + AI): people learn better when short, explicit information appears right when they need it."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): يتعلّم الناس أفضل حين تظهر معلومة قصيرة وواضحة في اللحظة التي يحتاجونها."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "People learn better when short, explicit information appears right when they need it." }
    scenario:
      en: "I'm designing a messaging app. We're adding AI \"smart replies\" that suggest short answers to a message."
      ar: "أصمّم تطبيق رسائل. ونضيف «ردودًا ذكية» بالذكاء الاصطناعي تقترح إجابات قصيرة على الرسالة."
    prompt:
      en: "How should people first learn about smart replies?"
      ar: "متى وأين نعرّف الناس بميزة الردود الذكية أول مرة؟"
    mock:
      app: hakawy
      appbar:
        title: {en: Mona Adel, ar: منى عادل}
        back: true
      blocks:
      - kind: chat
        from: them
        name: {en: Mona, ar: منى}
        avatar: {art: woman-1}
        text:
          en: "Are you coming tonight?"
          ar: هل ستأتي الليلة؟
        time: "18:40"
      - kind: chips
        items:
        - text:
            en: "✨ Yes, see you!"
            ar: "✨ نعم، أراك!"
        - text: {en: ✨ Running late, ar: ✨ سأتأخر قليلًا}
        - text:
            en: "✨ Can't make it"
            ar: ✨ لن أستطيع
        gap: m
      footer:
      - kind: composer
        text: {en: Message, ar: اكتب رسالة}
      caption: {en: Now, ar: الآن}
    options:
      - id: news
        text:
          en: "In the \"What's new\" list with 9 other updates"
          ar: في قائمة «الجديد» مع 9 تحديثات أخرى
        mock:
          app: hakawy
          appbar:
            title: {en: Mona Adel, ar: منى عادل}
            back: true
          blocks:
          - kind: chat
            from: them
            name: {en: Mona, ar: منى}
            avatar: {art: woman-1}
            text:
              en: "Are you coming tonight?"
              ar: هل ستأتي الليلة؟
            time: "18:40"
          - kind: chips
            items:
            - text:
                en: "✨ Yes, see you!"
                ar: "✨ نعم، أراك!"
            - text: {en: ✨ Running late, ar: ✨ سأتأخر قليلًا}
            - text:
                en: "✨ Can't make it"
                ar: ✨ لن أستطيع
            gap: m
          footer:
          - kind: composer
            text: {en: Message, ar: اكتب رسالة}
          overlay:
            type: sheet
            title:
              en: "What's new · 10 updates"
              ar: الجديد · 10 تحديثات
            blocks:
            - kind: list
              style: bullet
              items:
              - {en: Dark mode for chats, ar: الوضع الداكن للمحادثات}
              - {en: Faster photo sending, ar: إرسال أسرع للصور}
              - {en: New stickers, ar: ملصقات جديدة}
              - {en: Smart replies, ar: الردود الذكية}
              - {en: …and 6 more fixes, ar: …و6 إصلاحات أخرى}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: popup
        text: {en: A pop-up the moment they open the app, ar: نافذة منبثقة (Pop-up) لحظة فتح التطبيق}
        mock:
          app: hakawy
          appbar:
            title: {en: Mona Adel, ar: منى عادل}
            back: true
          blocks:
          - kind: chat
            from: them
            name: {en: Mona, ar: منى}
            avatar: {art: woman-1}
            text:
              en: "Are you coming tonight?"
              ar: هل ستأتي الليلة؟
            time: "18:40"
          - kind: chips
            items:
            - text:
                en: "✨ Yes, see you!"
                ar: "✨ نعم، أراك!"
            - text: {en: ✨ Running late, ar: ✨ سأتأخر قليلًا}
            - text:
                en: "✨ Can't make it"
                ar: ✨ لن أستطيع
            gap: m
          footer:
          - kind: composer
            text: {en: Message, ar: اكتب رسالة}
          overlay:
            type: dialog
            blocks:
            - {kind: icon, icon: sparkle, size: l, color: brand}
            - kind: heading
              text:
                en: "New: smart replies"
                ar: "جديد: الردود الذكية"
              gap: s
            - kind: text
              text: {en: Tap a suggestion to reply in one tap., ar: اضغط على اقتراح لتردّ بضغطة واحدة.}
              gap: xs
            - kind: button
              text: {en: Got it, ar: حسنًا}
              gap: m
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: reply
        text:
          en: "A one-line tip above the suggestions, the first time they reply to a message"
          ar: تلميح من سطر واحد فوق الاقتراحات، أول مرة يردّون فيها على رسالة
        mock:
          app: hakawy
          appbar:
            title: {en: Mona Adel, ar: منى عادل}
            back: true
          blocks:
          - kind: chat
            from: them
            name: {en: Mona, ar: منى}
            avatar: {art: woman-1}
            text:
              en: "Are you coming tonight?"
              ar: هل ستأتي الليلة؟
            time: "18:40"
          - kind: small
            text:
              en: "✨ Tip: tap a suggestion to send it, or type your own."
              ar: "✨ تلميح: اضغط على اقتراح لإرساله، أو اكتب ردّك."
            color: muted
            gap: m
          - kind: chips
            items:
            - text:
                en: "✨ Yes, see you!"
                ar: "✨ نعم، أراك!"
            - text: {en: ✨ Running late, ar: ✨ سأتأخر قليلًا}
            - text:
                en: "✨ Can't make it"
                ar: ✨ لن أستطيع
            gap: xs
          footer:
          - kind: composer
            text: {en: Message, ar: اكتب رسالة}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [reply]
    misconceptions:
      - id: MC-P12-014
        when: [news, popup]
        feedback:
          en: "Both explain it before people need it. At the moment of replying, the tip makes sense right away."
          ar: "كلا الخيارين يشرح الميزة قبل أن يحتاجها الناس. أما لحظة الرد، فيكون التلميح مفهومًا فورًا."
    correct:
      en: "Right. Short, and right on time."
      ar: "صحيح. قصير، وفي وقته تمامًا."
    explain:
      en: "Teach a feature in the place it's used, at the moment it's useful."
      ar: "عرّف الناس بالميزة في مكان استخدامها، في اللحظة التي يحتاجونها."

  - id: S04
    type: tune
    skill: SK-P12-U02-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Mental Models (People + AI): encourage people to experiment, and reassure them that experimenting won't shape their future experience."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): شجّع الناس على التجربة، وطمئنهم أن التجربة لن تشكّل تجربتهم القادمة."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Encourage experimentation and reassure users that experimenting won’t dictate their future experiences." }
    scenario:
      en: "Photo search also learns what each customer likes. Some customers say they're afraid to \"mess up\" their suggestions by trying it."
      ar: "البحث بالصور يتعلّم أيضًا ما يحبّه كل عميل. وبعض العملاء يقولون إنهم يخافون أن «يُفسدوا» اقتراحاتهم إذا جرّبوه."
    prompt:
      en: "What should we add to the first photo search?"
      ar: "ماذا نضيف لأول بحث بالصور؟"
    mock:
      app: dar
      appbar:
        title: {en: Photo search, ar: البحث بالصور}
        back: true
      blocks:
      - {kind: image, art: photo}
      - kind: small
        color: muted
        text:
          en: "First photo search: what should we add here?"
          ar: "أول بحث بالصورة: ماذا نضيف هنا؟"
        gap: s
      footer:
      - kind: button
        icon: camera
        text: {en: Take a photo, ar: التقط صورة}
      caption: {en: Now, ar: الآن}
    options:
      - id: none
        text:
          en: "Nothing; they'll get used to it"
          ar: لا شيء؛ سيعتادون عليه
        mock:
          app: dar
          appbar:
            title: {en: Photo search, ar: البحث بالصور}
            back: true
          blocks:
          - {kind: image, art: photo}
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: try
        text:
          en: "\"Try it with this sample photo. It won't change your suggestions.\""
          ar: «جرّبه بهذه الصورة النموذجية. لن تتغيّر اقتراحاتك.»
        mock:
          app: dar
          appbar:
            title: {en: Photo search, ar: البحث بالصور}
            back: true
          blocks:
          - {kind: image, art: photo}
          - kind: card
            gap: s
            blocks:
            - kind: text
              text:
                en: "Try it with this sample photo. It won't change your suggestions."
                ar: جرّبه بهذه الصورة النموذجية. لن تتغيّر اقتراحاتك.
            - kind: button
              text: {en: Use the sample photo, ar: استخدم الصورة النموذجية}
              style: outline
              gap: s
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: warn
        text:
          en: "\"Careful: every photo you search changes your suggestions.\""
          ar: "«انتبه: كل صورة تبحث بها تغيّر اقتراحاتك.»"
        mock:
          app: dar
          appbar:
            title: {en: Photo search, ar: البحث بالصور}
            back: true
          blocks:
          - {kind: image, art: photo}
          - kind: banner
            text:
              en: "Careful: every photo you search changes your suggestions."
              ar: "انتبه: كل صورة تبحث بها تغيّر اقتراحاتك."
            tone: warn
            icon: warning
            gap: s
          footer:
          - kind: button
            icon: camera
            text: {en: Take a photo, ar: التقط صورة}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [try]
    misconceptions:
      - id: MC-P12-015
        when: [none, warn]
        feedback:
          en: "Worried customers won't try at all. A safe first try, with no effect on suggestions, invites them in."
          ar: "العملاء القلقون لن يجرّبوا أبدًا. والتجربة الأولى الآمنة، بلا أثر على الاقتراحات، تشجّعهم على البدء."
    correct:
      en: "Right. Safe to try means people try."
      ar: "صحيح. حين تكون التجربة آمنة، يجرّب الناس."
    explain:
      en: "Remove the fear of breaking something, and curiosity does the rest."
      ar: "أزِل الخوف من إفساد شيء، والفضول يقوم بالباقي."

  - id: S05
    type: choose
    skill: SK-P12-U02-03
    part: retest
    speaker: karim
    value:
      en: "Re-test. Mental Models (People + AI): people are more likely to have unachievable expectations for products they think have human-like abilities."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): الناس أكثر ميلًا لتوقّعات مستحيلة من المنتجات التي يظنّون أن لها قدرات بشرية."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "People are more likely to have unachievable expectations for products that they assume have human-like capabilities." }
    scenario:
      en: "The team wants our support chatbot to be called \"Omar\", to pause before replying, and to say \"Hmm, let me think\"."
      ar: "الفريق يريد أن يُسمّى روبوت محادثة الدعم (Chatbot) «عمر»، وأن يتوقّف قبل الرد، وأن يقول «همم، دعني أفكّر»."
    prompt:
      en: "What should I recommend?"
      ar: "بماذا أنصح الفريق بشأن اسم الروبوت وطريقة ردّه؟"
    mock:
      app: dar
      appbar: { title: { en: "Omar", ar: "عمر" }, back: true }
      blocks:
        - { kind: chat, from: me, text: { en: "My order is late.", ar: "طلبي متأخر." }, time: "11:02" }
        - { kind: chat, from: them, name: { en: "Omar", ar: "عمر" }, avatar: { text: "Omar" }, text: { en: "Hmm, let me think…", ar: "همم، دعني أفكّر…" }, time: "11:02" }
      footer:
        - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    options:
      - { id: plain, text: { en: "Call it \"Support assistant (automatic)\" and reply straight away", ar: "نسمّيه «مساعد الدعم (آلي)» ويردّ فورًا" } }
      - { id: omar, text: { en: "Go with \"Omar\"; people like talking to someone", ar: "نختار «عمر»؛ فالناس يحبّون الحديث مع شخص" } }
      - { id: half, text: { en: "Keep \"Omar\" but drop the pauses", ar: "نُبقي «عمر» لكن نحذف التوقّفات" } }
    answer: [plain]
    misconceptions:
      - id: MC-P12-019
        when: [omar, half]
        feedback:
          en: "A human name makes people expect a person's understanding. When \"Omar\" misunderstands, it feels like being ignored."
          ar: "الاسم البشري يجعل الناس يتوقّعون فهم إنسان. وحين لا يفهم «عمر»، يبدو الأمر كأنه تجاهل."
    correct:
      en: "Right. Plain and honest sets the right bar."
      ar: "صحيح. الاسم البسيط والصادق يجعل توقّعات الناس في مكانها."
    explain:
      en: "Fake thinking and a human name promise more than a bot can give."
      ar: "التفكير المصطنع والاسم البشري يَعِدان بأكثر مما يستطيعه الروبوت."

  - id: S06
    type: choose
    skill: SK-P12-U02-03
    part: retest
    speaker: hana
    value:
      en: "Re-test. Mental Models (People + AI): choose how human the AI seems based on how well its abilities match what people expect a human to do."
      ar: "إعادة اختبار. النماذج الذهنية (People + AI): اختر مدى بشرية الذكاء الاصطناعي حسب مدى تطابق قدراته مع ما يتوقّعه الناس من إنسان."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Choose the level of humanization based on how well your AI’s capabilities match the user’s perceptions of what a human can do." }
    scenario:
      en: "Our gym has a voice assistant at the front desk called \"Coach Sam\". It only books classes, but members tell it about injuries, thinking a coach will hear."
      ar: "في استقبال النادي مساعد صوتي اسمه «الكابتن سام». هو يحجز الحصص فقط، لكن الأعضاء يخبرونه عن إصاباتهم، ظانّين أن مدرّبًا سيسمع."
    prompt:
      en: "What should we change?"
      ar: "ماذا نغيّر حتى يفهم الأعضاء دور المساعد الصوتي؟"
    mock:
      app: nashat
      frame: tablet
      blocks:
        - { kind: icon, icon: microphone, size: l, color: brand }
        - { kind: title, text: { en: "Coach Sam", ar: "الكابتن سام" }, gap: s }
        - { kind: text, text: { en: "Hi! How can I help you today?", ar: "أهلًا! كيف أساعدك اليوم؟" }, gap: xs }
        - { kind: chat, from: me, text: { en: "My knee hurts after squats.", ar: "ركبتي تؤلمني بعد القرفصاء." }, gap: m }
    options:
      - { id: smarter, text: { en: "Teach it to give injury advice", ar: "نعلّمه أن يعطي نصائح للإصابات" } }
      - { id: voice, text: { en: "Give it a warmer voice", ar: "نعطيه صوتًا أدفأ" } }
      - { id: honest, text: { en: "Rename it \"Class booking (automatic)\" and say \"For injuries, talk to a coach\"", ar: "نسمّيه «حجز الحصص (آلي)» ويقول «للإصابات، تحدّث مع مدرّب»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-018
        when: [smarter, voice]
        feedback:
          en: "The problem is members think it's a coach. Make clear what it is, and send injuries to a real person."
          ar: "المشكلة أن الأعضاء يظنّونه مدرّبًا. وضّح ما هو، ووجّه الإصابات إلى إنسان حقيقي."
    correct:
      en: "Right. Match how it seems to what it does."
      ar: "صحيح. اجعل ما يوحي به يطابق ما يفعله فعلًا."
    explain:
      en: "\"Coach\" promises a coach. A plain name matches a booking tool."
      ar: "«الكابتن» يَعِد بمدرّب. والاسم البسيط يناسب أداة حجز."

