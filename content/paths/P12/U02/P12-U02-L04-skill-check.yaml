id: P12-U02-L04
mode: check
minutes: 6
title:
  en: "Skill check: set the right expectations"
  ar: "اختبار المهارة: ضع التوقّعات الصحيحة"
summary:
  en: "Review how a banking app introduces its new AI money helper, on your own."
  ar: "راجِع كيف يقدّم تطبيق بنكي مساعده المالي الجديد بالذكاء الاصطناعي، بنفسك."
speaker: mona
sources:
  - title: { en: "Mental Models (People + AI Guidebook)", ar: "النماذج الذهنية (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/mental-models/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mona's review", ar: "مراجعة منى" }
    body:
      en: "I lead design at a bank. Next month we launch a \"Money helper\" that sorts spending and suggests ways to save. I'm reviewing how we introduce it.\n\nYour job: check five parts.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أقود فريق التصميم في بنك. والشهر القادم نطلق «المساعد المالي» الذي يصنّف المصروفات ويقترح طرقًا للتوفير. وأراجع كيف نقدّمه.\n\nمهمّتك: افحص خمسة أجزاء.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Money helper", ar: "المساعد المالي" } }
        - { kind: meta, text: { en: "Food 2,300 · Transport 900 · Bills 1,400", ar: "طعام 2,300 · مواصلات 900 · فواتير 1,400" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P12-U02-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Mental Models (People + AI): promising \"AI magic\" sets people up for disappointment."
      ar: "اختبار مهارة. النماذج الذهنية (People + AI): الوعد بـ«سحر الذكاء الاصطناعي» يقود الناس إلى خيبة الأمل."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Many products set users up for disappointment by promising that “AI magic” will help them accomplish their tasks." }
    scenario:
      en: "Marketing wrote the launch line: \"Our AI knows your money better than you do.\""
      ar: "كتب التسويق جملة الإطلاق: «ذكاؤنا الاصطناعي يعرف أموالك أكثر منك.»"
    prompt:
      en: "What should the line say?"
      ar: "ماذا يجب أن تقول الجملة؟"
    options:
      - { id: keep, text: { en: "Keep it; it's catchy", ar: "تبقى كما هي؛ فهي جذّابة" } }
      - { id: soft, text: { en: "\"Our AI knows your money really well.\"", ar: "«ذكاؤنا الاصطناعي يعرف أموالك جيدًا جدًا.»" } }
      - { id: honest, text: { en: "\"Sorts your spending into groups for you. It may get some wrong, and you can fix them.\"", ar: "«يصنّف مصروفاتك في مجموعات لك. قد يخطئ في بعضها، ويمكنك تصحيحها.»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P12-011
        when: [keep, soft]
        feedback:
          en: "Both promise more than it can do. The first wrong group will feel like a broken promise."
          ar: "الاثنان يَعِدان بأكثر مما يستطيعه. وأول تصنيف خطأ سيبدو كوعد مكسور."
    explain:
      en: "From Lesson 1: say what it does and what it can get wrong. No magic."
      ar: "من الدرس 1: قل ما يفعله وما قد يخطئ فيه. بلا سحر."

  - id: S03
    type: choose
    skill: SK-P12-U02-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Mental Models (People + AI): don't introduce AI features as part of a long introductory list of features."
      ar: "اختبار مهارة. النماذج الذهنية (People + AI): لا تقدّم ميزات الذكاء الاصطناعي ضمن قائمة تعريفية طويلة بالميزات."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Don’t introduce AI-driven features as part of a long introductory list of product features." }
    scenario:
      en: "We need to decide where customers first hear about the Money helper."
      ar: "نحتاج أن نقرّر أين يسمع العملاء عن المساعد المالي أول مرة."
    prompt:
      en: "Where should it appear first?"
      ar: "أين يجب أن يظهر أولًا؟"
    options:
      - { id: moment, text: { en: "A short note the first time a customer opens their spending page", ar: "ملاحظة قصيرة أول مرة يفتح فيها العميل صفحة مصروفاته" } }
      - { id: signup, text: { en: "Screen 5 of 8 in the sign-up tour", ar: "الشاشة 5 من 8 في جولة التسجيل" } }
      - { id: push, text: { en: "A notification to all customers on launch day", ar: "إشعار لكل العملاء يوم الإطلاق" } }
    answer: [moment]
    misconceptions:
      - id: MC-P12-014
        when: [signup, push]
        feedback:
          en: "Both reach people when they're not thinking about spending. The spending page is where it makes sense."
          ar: "الاثنان يصلان للناس وهم لا يفكّرون في المصروفات. وصفحة المصروفات هي حيث يكون له معنى."
    explain:
      en: "From Lesson 2: introduce an AI feature where and when it's useful."
      ar: "من الدرس 2: قدّم ميزة الذكاء الاصطناعي حيث ومتى تكون مفيدة."

  - id: S04
    type: choose
    skill: SK-P12-U02-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Mental Models (People + AI): make it extremely clear the product is not a human, in a way everyone can understand."
      ar: "اختبار مهارة. النماذج الذهنية (People + AI): وضّح تمامًا أن المنتج ليس إنسانًا، بطريقة يفهمها الجميع."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Specifically, your messages should make it extremely clear that the product is not a human, in a way that’s accessible to all users regardless of age, technical literacy, education level, or physical ability." }
    scenario:
      en: "The helper also has a chat. Its first line is: \"Hi, I'm Layla, your personal banker.\" Many of our customers are over 60."
      ar: "المساعد فيه محادثة أيضًا. وأول سطر فيها: «أهلًا، أنا ليلى، موظفة البنك الخاصة بك.» وكثير من عملائنا فوق 60 سنة."
    prompt:
      en: "What should the first line be?"
      ar: "ماذا يجب أن يكون السطر الأول؟"
    options:
      - { id: keep, text: { en: "Keep \"Layla\"; it feels friendly", ar: "تبقى «ليلى»؛ فهي ودودة" } }
      - { id: auto, text: { en: "\"Money helper (automatic, not a bank employee). You can ask about your spending.\"", ar: "«المساعد المالي (آلي، وليس موظفًا في البنك). يمكنك السؤال عن مصروفاتك.»" } }
      - { id: photo, text: { en: "\"Hi, I'm Layla\" with a friendly photo", ar: "«أهلًا، أنا ليلى» مع صورة ودودة" } }
    answer: [auto]
    misconceptions:
      - id: MC-P12-018
        when: [keep, photo]
        feedback:
          en: "Customers may think a real employee is reading, and share passwords or rely on its advice too much."
          ar: "قد يظنّ العملاء أن موظفًا حقيقيًا يقرأ، فيشاركون كلمات السر أو يعتمدون على نصيحته أكثر من اللازم."
    explain:
      en: "From Lesson 3: say plainly it's not a person, and what people can ask."
      ar: "من الدرس 3: قل بوضوح إنه ليس إنسانًا، وما الذي يمكن للناس أن يطلبوه."

  - id: S05
    type: choose
    skill: SK-P12-U02-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Mental Models (People + AI): emphasise how the app benefits people; don't emphasise the underlying technology."
      ar: "اختبار مهارة. النماذج الذهنية (People + AI): ركّز على فائدة التطبيق للناس؛ ولا تركّز على التقنية التي خلفه."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Don’t emphasize the underlying technology." }
    scenario:
      en: "We need one sentence under the title \"Money helper\"."
      ar: "نحتاج جملة واحدة تحت عنوان «المساعد المالي»."
    prompt:
      en: "Which sentence is best?"
      ar: "أي جملة هي الأفضل؟"
    options:
      - { id: save, text: { en: "\"See where your money goes, and where you could save.\"", ar: "«اعرف أين تذهب أموالك، وأين يمكنك أن توفّر.»" } }
      - { id: model, text: { en: "\"Built on a large language model trained on millions of transactions.\"", ar: "«مبني على نموذج لغوي كبير مدرّب على ملايين المعاملات.»" } }
      - { id: ai, text: { en: "\"The most advanced AI in Egyptian banking.\"", ar: "«أكثر ذكاء اصطناعي تطوّرًا في البنوك المصرية.»" } }
    answer: [save]
    misconceptions:
      - id: MC-P12-012
        when: [model, ai]
        feedback:
          en: "Customers don't need the technology to decide. They need to know what it does for them."
          ar: "العملاء لا يحتاجون التقنية ليقرّروا. يحتاجون معرفة ما يفعله لهم."
    explain:
      en: "From Lesson 1: describe the benefit, and keep technical details for those who ask."
      ar: "من الدرس 1: صِف الفائدة، واترك التفاصيل التقنية لمن يسأل."

  - id: S06
    type: choose
    skill: SK-P12-U02-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. Mental Models (People + AI): tie feedback to the user's benefit, like \"you can improve your experience by giving feedback\", and say where and how."
      ar: "اختبار مهارة. النماذج الذهنية (People + AI): اربط الملاحظات بفائدة المستخدم، مثل «يمكنك تحسين تجربتك بإعطاء ملاحظاتك»، وقل أين وكيف."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "You can tie this to the user benefit with phrasing like “you can improve your experience by giving feedback on the suggestions you receive”, and letting them know where and how to do so." }
    scenario:
      en: "Customers can move a payment to a different group. The helper learns from this."
      ar: "يستطيع العملاء نقل دفعة إلى مجموعة أخرى. والمساعد يتعلّم من ذلك."
    prompt:
      en: "What should we tell them?"
      ar: "ماذا يجب أن نخبرهم؟"
    options:
      - { id: none, text: { en: "Nothing; it's a detail", ar: "لا شيء؛ هذه تفصيلة" } }
      - { id: train, text: { en: "\"Moving payments trains our model.\"", ar: "«نقل المدفوعات يدرّب نموذجنا.»" } }
      - { id: benefit, text: { en: "\"Wrong group? Tap it to move it. Next time, payments from that shop go to the right group.\"", ar: "«مجموعة خطأ؟ اضغط لنقلها. وفي المرة القادمة، تذهب مدفوعات هذا المحل إلى المجموعة الصحيحة.»" } }
    answer: [benefit]
    misconceptions:
      - id: MC-P12-017
        when: [none, train]
        feedback:
          en: "Customers need to know how to fix it and what they get: the right group next time."
          ar: "العملاء يحتاجون معرفة كيف يصلحونها وماذا يستفيدون: المجموعة الصحيحة في المرة القادمة."
    explain:
      en: "From Lesson 2: say how feedback works, what it changes, and when."
      ar: "من الدرس 2: قل كيف تعمل الملاحظات، وما الذي تغيّره، ومتى."
