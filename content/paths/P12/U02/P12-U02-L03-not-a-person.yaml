id: P12-U02-L03
mode: lesson
minutes: 7
title:
  en: "Don't pretend it's a person"
  ar: "لا تتظاهر أنه إنسان"
summary:
  en: "Fix a clinic's booking chat so patients know it's automated and what they can ask it."
  ar: "أصلح محادثة الحجز في عيادة ليعرف المرضى أنها آلية وما الذي يمكنهم طلبه منها."
speaker: nour
sources:
  - title: { en: "Mental Models (People + AI Guidebook)", ar: "النماذج الذهنية (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/mental-models/"
review_labels:
  MC-P12-018: { en: "Make clear it's not a person", ar: "وضّح أنه ليس إنسانًا" }
  MC-P12-019: { en: "Human style raises expectations", ar: "الأسلوب البشري يرفع التوقّعات" }
  MC-P12-020: { en: "Tell people what they can ask", ar: "أخبر الناس بما يمكنهم أن يطلبوه" }
  MC-P12-011: { en: "Promise only what it can do", ar: "لا تَعِد إلا بما يستطيعه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Dr. Amal\" isn't a doctor", ar: "«د. أمل» ليست طبيبة" }
    body:
      en: "We added a chat assistant to book visits. The team called it \"Dr. Amal\", gave it a photo of a smiling woman, and made it say \"I understand how you feel.\"\n\nNow some patients describe their symptoms in detail and ask for medical advice. They think a real doctor is reading."
      ar: "أضفنا مساعد محادثة لحجز المواعيد. وسمّاه الفريق «د. أمل»، ووضع له صورة امرأة مبتسمة، وجعله يقول «أفهم ما تشعر به.»\n\nالآن بعض المرضى يصفون أعراضهم بالتفصيل ويطلبون نصيحة طبية. يظنّون أن طبيبة حقيقية تقرأ."
    mock:
      app: raha
      appbar: { title: { en: "Dr. Amal · online", ar: "د. أمل · متصلة" }, back: true }
      blocks:
        - { kind: chat, from: them, name: { en: "Dr. Amal", ar: "د. أمل" }, avatar: { art: doctor }, text: { en: "Hi! I'm Amal. I understand how you feel. Tell me everything.", ar: "أهلًا! أنا أمل. أفهم ما تشعر به. احكِ لي كل شيء." }, time: "9:02" }
      footer:
        - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }

  - id: S02
    type: choose
    skill: SK-P12-U02-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Mental Models (People + AI): when people confuse an AI with a human, they may share more than they would, or rely on it more than they should."
      ar: "جرّب أولًا. النماذج الذهنية (People + AI): حين يخلط الناس بين الذكاء الاصطناعي والإنسان، قد يشاركون أكثر مما ينبغي، أو يعتمدون عليه أكثر مما يجب."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "When users confuse an AI with a human being, they can sometimes disclose more information than they would otherwise, or rely on the system more than they should, among other issues." }
    prompt:
      en: "What should we change first?"
      ar: "ماذا يجب أن نغيّر أولًا؟"
    options:
      - { id: clear, text: { en: "Make clear it's an automatic booking assistant, not a doctor or a person", ar: "نوضّح أنه مساعد حجز آلي، لا طبيبة ولا إنسان" } }
      - { id: warmer, text: { en: "Make it sound even warmer, so patients feel cared for", ar: "نجعله يبدو أكثر دفئًا، ليشعر المرضى بالاهتمام" } }
      - { id: typing, text: { en: "Add \"typing…\" dots so replies feel natural", ar: "نضيف نقاط «يكتب…» لتبدو الردود طبيعية" } }
    answer: [clear]
    misconceptions:
      - id: MC-P12-018
        when: [warmer, typing]
        feedback:
          en: "Both make it seem more like a person. Patients would share even more and trust its answers even more."
          ar: "الاثنان يجعلانه يبدو أكثر كإنسان. فيشارك المرضى أكثر ويثقون في ردوده أكثر."
    hints:
      - { en: "What do patients think they're talking to?", ar: "مع من يظنّ المرضى أنهم يتحدّثون؟" }
      - { en: "Which option corrects that?", ar: "أي خيار يصحّح ذلك؟" }
    correct:
      en: "Right. First, be honest about what it is."
      ar: "صحيح. أولًا، كن صادقًا فيما هو."
    explain:
      en: "Patients who think a doctor is reading may skip a real visit. Saying it's automated protects them."
      ar: "المريض الذي يظنّ أن طبيبًا يقرأ قد يتخطّى زيارة حقيقية. وقول إنه آلي يحميه."

  - id: S03
    type: card
    part: concept
    icons: [person, warn, list, ok]
    title: { en: "Don't pretend to be a person", ar: "لا تتظاهر بأنك إنسان" }
    body:
      en: "- **Say it's not a person:** clearly, in words everyone understands, whatever their age or skills.\n- **Human style raises expectations:** a human name, a face and \"I understand you\" make people expect a person's understanding.\n- **Tell people what to ask:** \"You can book, move or cancel a visit.\"\n- **Say what it can't do:** AI doesn't work like people do, so name its limits."
      ar: "- **قل إنه ليس إنسانًا:** بوضوح، وبكلمات يفهمها الجميع، مهما كان عمرهم أو مهاراتهم.\n- **الأسلوب البشري يرفع التوقّعات:** الاسم البشري، والوجه، و«أفهمك» تجعل الناس يتوقّعون فهم إنسان.\n- **أخبر الناس بما يطلبونه:** «يمكنك حجز موعد أو تغييره أو إلغاؤه.»\n- **قل ما لا يستطيعه:** الذكاء الاصطناعي لا يعمل كما يعمل الناس، فاذكر حدوده."

  - id: S04
    type: tune
    skill: SK-P12-U02-03
    part: guided
    rules: [R06]
    value:
      en: "Mental Models (People + AI): set expectations for the kind of commands the AI can understand, to build the right picture of it."
      ar: "النماذج الذهنية (People + AI): وضّح نوع الطلبات التي يفهمها الذكاء الاصطناعي، لتتكوّن الصورة الصحيحة عنه."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Set expectations for the kind of commands the AI can understand to reinforce the right mental models." }
    scenario:
      en: "We're rewriting the first message patients see when they open the chat."
      ar: "نعيد كتابة أول رسالة يراها المرضى حين يفتحون المحادثة."
    prompt:
      en: "Tap each option to see it. Which first message is best?"
      ar: "اضغط على كل خيار لتراه. أي رسالة أولى هي الأفضل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: raha
      appbar: { title: { en: "Dr. Amal · online", ar: "د. أمل · متصلة" }, back: true }
      blocks:
        - { kind: small, color: muted, text: { en: "The chat is empty. What should the first message say?", ar: "المحادثة فارغة. ماذا يجب أن تقول الرسالة الأولى؟" } }
      footer:
        - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    options:
      - id: anything
        text: { en: "\"Hi, I'm Amal! Ask me anything 😊\"", ar: "«أهلًا، أنا أمل! اسألني عن أي شيء 😊»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Dr. Amal · online", ar: "د. أمل · متصلة" }, back: true }
          blocks:
            - { kind: chat, from: them, name: { en: "Dr. Amal", ar: "د. أمل" }, avatar: { art: doctor }, text: { en: "Hi, I'm Amal! Ask me anything 😊", ar: "أهلًا، أنا أمل! اسألني عن أي شيء 😊" } }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
      - id: feeling
        text: { en: "\"Hello! How are you feeling today?\"", ar: "«أهلًا! كيف تشعر اليوم؟»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Dr. Amal · online", ar: "د. أمل · متصلة" }, back: true }
          blocks:
            - { kind: chat, from: them, name: { en: "Dr. Amal", ar: "د. أمل" }, avatar: { art: doctor }, text: { en: "Hello! How are you feeling today?", ar: "أهلًا! كيف تشعر اليوم؟" } }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
      - id: clear
        text: { en: "\"Booking assistant (automatic). You can book, move or cancel a visit. For medical questions, call the clinic.\"", ar: "«مساعد الحجز (آلي). يمكنك حجز موعد أو تغييره أو إلغاؤه. للأسئلة الطبية، اتصل بالعيادة.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Booking assistant", ar: "مساعد الحجز" }, back: true }
          blocks:
            - { kind: chat, from: ai, text: { en: "Booking assistant (automatic). You can book, move or cancel a visit. For medical questions, call the clinic.", ar: "مساعد الحجز (آلي). يمكنك حجز موعد أو تغييره أو إلغاؤه. للأسئلة الطبية، اتصل بالعيادة." } }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    answer: [clear]
    misconceptions:
      - id: MC-P12-020
        when: [anything]
        feedback:
          en: "\"Anything\" invites medical questions it can't answer. Patients need to know what it actually does."
          ar: "«أي شيء» يدعو لأسئلة طبية لا يستطيع الإجابة عنها. والمرضى يحتاجون معرفة ما يفعله فعلًا."
      - id: MC-P12-019
        when: [feeling]
        feedback:
          en: "That's what a doctor asks. Patients will answer with symptoms and expect advice."
          ar: "هذا ما يسأله الطبيب. وسيجيب المرضى بأعراضهم ويتوقّعون نصيحة."
    hints:
      - { en: "What can this assistant really do?", ar: "ماذا يستطيع هذا المساعد فعلًا؟" }
      - { en: "Which message says that, and where to go for the rest?", ar: "أي رسالة تقول ذلك، وإلى أين يذهبون لغيره؟" }
    correct:
      en: "Right. What it is, what it does, and where to go otherwise."
      ar: "صحيح. ما هو، وماذا يفعل، وإلى أين يذهبون لغير ذلك."
    explain:
      en: "A clear first message steers people to requests it can handle, so they succeed."
      ar: "الرسالة الأولى الواضحة توجّه الناس إلى طلبات يستطيع تنفيذها، فينجحون."

  - id: S05
    type: tune
    skill: SK-P12-U02-01
    part: guided
    rules: [R06]
    value:
      en: "Mental Models (People + AI): communicate the system's limits and capabilities in a way that doesn't suggest super-human abilities."
      ar: "النماذج الذهنية (People + AI): وضّح حدود النظام وقدراته بطريقة لا توحي بقدرات تفوق البشر."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "The key is to communicate the system’s limits and capabilities in a way that doesn’t create or support expectations of super-human abilities." }
    scenario:
      en: "A patient writes: \"I've had chest pain since this morning. Should I worry?\" The assistant answered: \"I understand. Don't worry, it's probably stress.\""
      ar: "كتب مريض: «عندي ألم في الصدر منذ الصباح. هل أقلق؟» وردّ المساعد: «أفهمك. لا تقلق، غالبًا هو توتر.»"
    prompt:
      en: "Tap each option to see it. What should it say instead?"
      ar: "اضغط على كل خيار لتراه. ماذا يجب أن يقول بدلًا من ذلك؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: raha
      appbar: { title: { en: "Booking assistant", ar: "مساعد الحجز" }, back: true }
      blocks:
        - { kind: chat, from: me, text: { en: "I've had chest pain since this morning. Should I worry?", ar: "عندي ألم في الصدر منذ الصباح. هل أقلق؟" }, time: "9:14" }
        - { kind: chat, from: ai, text: { en: "I understand. Don't worry, it's probably stress.", ar: "أفهمك. لا تقلق، غالبًا هو توتر." } }
      footer:
        - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    options:
      - id: keep
        text: { en: "The same; it calms the patient down", ar: "نفس الرد؛ فهو يطمئن المريض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Booking assistant", ar: "مساعد الحجز" }, back: true }
          blocks:
            - { kind: chat, from: me, text: { en: "I've had chest pain since this morning. Should I worry?", ar: "عندي ألم في الصدر منذ الصباح. هل أقلق؟" }, time: "9:14" }
            - { kind: chat, from: ai, text: { en: "I understand. Don't worry, it's probably stress.", ar: "أفهمك. لا تقلق، غالبًا هو توتر." } }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
      - id: limit
        text: { en: "\"This assistant can't give medical advice. For chest pain, call emergency services now.\" with a Call button", ar: "«هذا المساعد لا يستطيع تقديم نصيحة طبية. لألم الصدر، اتصل بالطوارئ الآن.» مع زر اتصال" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Booking assistant", ar: "مساعد الحجز" }, back: true }
          blocks:
            - { kind: chat, from: me, text: { en: "I've had chest pain since this morning. Should I worry?", ar: "عندي ألم في الصدر منذ الصباح. هل أقلق؟" }, time: "9:14" }
            - { kind: chat, from: ai, text: { en: "This assistant can't give medical advice. For chest pain, call emergency services now.", ar: "هذا المساعد لا يستطيع تقديم نصيحة طبية. لألم الصدر، اتصل بالطوارئ الآن." } }
            - { kind: button, style: danger, icon: phone, text: { en: "Call 123", ar: "اتصل بـ 123" }, gap: xs }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
      - id: more
        text: { en: "A longer list of possible causes of chest pain", ar: "قائمة أطول بالأسباب المحتملة لألم الصدر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Booking assistant", ar: "مساعد الحجز" }, back: true }
          blocks:
            - { kind: chat, from: me, text: { en: "I've had chest pain since this morning. Should I worry?", ar: "عندي ألم في الصدر منذ الصباح. هل أقلق؟" }, time: "9:14" }
            - { kind: chat, from: ai, text: { en: "Chest pain can come from: stress, muscle strain, acid reflux, a cold, heart problems, lung problems…", ar: "ألم الصدر قد يأتي من: التوتر، أو شدّ عضلي، أو حموضة، أو برد، أو مشكلات في القلب، أو في الرئة…" } }
          footer:
            - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    answer: [limit]
    misconceptions:
      - id: MC-P12-011
        when: [keep, more]
        feedback:
          en: "The assistant can't judge symptoms. Acting like it can could keep someone from getting help in time."
          ar: "المساعد لا يستطيع تقييم الأعراض. والتصرّف كأنه يستطيع قد يمنع شخصًا من طلب المساعدة في الوقت المناسب."
    hints:
      - { en: "Can a booking assistant judge chest pain?", ar: "هل يستطيع مساعد حجز تقييم ألم الصدر؟" }
      - { en: "Which reply is honest and still helps?", ar: "أي رد صادق ويساعد في نفس الوقت؟" }
    correct:
      en: "Right. Say the limit, and point to real help."
      ar: "صحيح. قل الحد، ووجّه إلى المساعدة الحقيقية."
    explain:
      en: "When a request is beyond what the AI can do, say so plainly and offer the right next step."
      ar: "حين يكون الطلب أكبر مما يستطيعه الذكاء الاصطناعي، قل ذلك بوضوح وقدّم الخطوة الصحيحة التالية."

  - id: S06
    type: compare
    skill: SK-P12-U02-03
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: human-like vs clearly automated. Mental Models (People + AI): don't present the AI as human-like when it can do far less than a person."
      ar: "مقارنة: شبيه بالإنسان مقابل آلي بوضوح. النماذج الذهنية (People + AI): لا تقدّم الذكاء الاصطناعي كأنه إنسان وهو يستطيع أقل بكثير من الإنسان."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Don’t create unrealistic expectations by presenting the AI as human-like when it can actually do far less than a person." }
    scenario:
      en: "Two designs for the top of the chat:"
      ar: "تصميمان لأعلى المحادثة:"
    prompt:
      en: "Which design should we ship?"
      ar: "أي تصميم يجب أن نطلقه؟"
    a:
      label: { en: "A: An icon, \"Booking assistant · automatic\", and what it can do.", ar: "A: أيقونة، و«مساعد الحجز · آلي»، وما يستطيع فعله." }
      mock:
        app: raha
        appbar: { title: { en: "Booking assistant · automatic", ar: "مساعد الحجز · آلي" }, back: true }
        blocks:
          - { kind: chips, items: [ { text: { en: "Book", ar: "حجز" } }, { text: { en: "Move", ar: "تغيير" } }, { text: { en: "Cancel a visit", ar: "إلغاء موعد" } } ] }
          - { kind: chat, from: ai, text: { en: "Which would you like to do?", ar: "ماذا تريد أن تفعل؟" }, gap: s }
        footer:
          - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    b:
      label: { en: "B: A smiling photo, \"Dr. Amal\", and \"I'm here for you\".", ar: "B: صورة مبتسمة، و«د. أمل»، و«أنا هنا من أجلك»." }
      mock:
        app: raha
        appbar: { title: { en: "Dr. Amal · online", ar: "د. أمل · متصلة" }, back: true }
        blocks:
          - { kind: chat, from: them, name: { en: "Dr. Amal", ar: "د. أمل" }, avatar: { art: doctor }, text: { en: "I'm here for you 💙", ar: "أنا هنا من أجلك 💙" } }
        footer:
          - { kind: composer, text: { en: "Write a message", ar: "اكتب رسالة" } }
    answer: a
    reason:
      prompt: { en: "Why is A better?", ar: "لماذا A أفضل؟" }
      options:
        - { id: honest, text: { en: "Patients know it's a tool for bookings, so they don't expect a doctor's care", ar: "المرضى يعرفون أنه أداة للحجز، فلا يتوقّعون رعاية طبيبة" } }
        - { id: plain, text: { en: "Icons look more modern than photos", ar: "الأيقونات تبدو أحدث من الصور" } }
        - { id: cold, text: { en: "Patients prefer cold, formal apps", ar: "المرضى يفضّلون التطبيقات الرسمية الباردة" } }
      answer: [honest]
      misconceptions:
        - id: MC-P12-019
          when: [plain, cold]
          feedback:
            en: "It's not about style or warmth. A says what it is and what it does, so expectations match."
            ar: "المسألة ليست أسلوبًا أو دفئًا. A يقول ما هو وماذا يفعل، فتتطابق التوقّعات."
    misconceptions:
      - id: MC-P12-019
        when: [b]
        feedback:
          en: "B looks like a real doctor who cares. Patients will expect understanding and advice it can't give."
          ar: "B يبدو كطبيبة حقيقية تهتمّ. وسيتوقّع المرضى فهمًا ونصيحة لا يستطيع تقديمهما."
    hints:
      - { en: "What will a patient expect from each one?", ar: "ماذا سيتوقّع المريض من كل واحد؟" }
      - { en: "Which one can the assistant live up to?", ar: "أيهما يستطيع المساعد أن يفي به؟" }
    correct:
      en: "Right. Honest about what it is."
      ar: "صحيح. صادق فيما هو."
    explain:
      en: "A human face sets a human-sized promise. Keep the look as simple as what it can do."
      ar: "الوجه البشري يضع وعدًا بحجم إنسان. فاجعل الشكل بسيطًا بقدر ما يستطيعه."

  - id: S07
    type: tune
    skill: SK-P12-U02-03
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. Mental Models (People + AI): if a conversational AI calls itself \"I\", people expect near-perfect language understanding, which it may not have."
      ar: "حالة جديدة. النماذج الذهنية (People + AI): إذا تحدّث الذكاء الاصطناعي عن نفسه بـ«أنا»، يتوقّع الناس فهمًا شبه كامل للغة، وقد لا يكون عنده."
    ref: { url: "https://pair.withgoogle.com/chapter/mental-models/", quote: "Specifically, if your conversational AI refers to itself as “I”, the corresponding user mental model includes near-perfect natural language processing, which your AI may not be able to pull off yet." }
    scenario:
      en: "Our bus app is adding voice search. It understands simple requests like \"Tickets to Alexandria tomorrow\", but not long stories."
      ar: "تطبيق الحافلات عندنا يضيف بحثًا بالصوت. وهو يفهم الطلبات البسيطة مثل «تذاكر إلى الإسكندرية غدًا»، لكن لا يفهم الحكايات الطويلة."
    prompt:
      en: "Tap each option to see it. How should the voice screen invite people to speak?"
      ar: "اضغط على كل خيار لتراه. كيف يجب أن تدعو شاشة الصوت الناس للكلام؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: rehla
      appbar: { title: { en: "Voice search", ar: "البحث بالصوت" }, back: true }
      blocks:
        - { kind: icon, icon: microphone, size: l, color: brand }
        - { kind: icon, icon: waveform, size: l, color: brand, gap: s }
        - { kind: text, text: { en: "Listening…", ar: "أستمع…" }, gap: s }
    options:
      - id: friend
        text: { en: "\"Hi, I'm Sami! Talk to me like a friend.\"", ar: "«أهلًا، أنا سامي! كلّمني كأني صديقك.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Voice search", ar: "البحث بالصوت" }, back: true }
          blocks:
            - { kind: icon, icon: microphone, size: l, color: brand }
            - { kind: icon, icon: waveform, size: l, color: brand, gap: s }
            - { kind: text, text: { en: "Hi, I'm Sami! Talk to me like a friend.", ar: "أهلًا، أنا سامي! كلّمني كأني صديقك." }, gap: s }
      - id: examples
        text: { en: "\"Say where and when. For example: 'Tickets to Alexandria tomorrow'.\"", ar: "«قل إلى أين ومتى. مثلًا: 'تذاكر إلى الإسكندرية غدًا'.»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Voice search", ar: "البحث بالصوت" }, back: true }
          blocks:
            - { kind: icon, icon: microphone, size: l, color: brand }
            - { kind: icon, icon: waveform, size: l, color: brand, gap: s }
            - { kind: text, text: { en: "Say where and when. For example: 'Tickets to Alexandria tomorrow'.", ar: "قل إلى أين ومتى. مثلًا: «تذاكر إلى الإسكندرية غدًا»." }, gap: s }
      - id: anything
        text: { en: "\"I understand everything. Go ahead!\"", ar: "«أفهم كل شيء. تفضّل!»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: rehla
          appbar: { title: { en: "Voice search", ar: "البحث بالصوت" }, back: true }
          blocks:
            - { kind: icon, icon: microphone, size: l, color: brand }
            - { kind: icon, icon: waveform, size: l, color: brand, gap: s }
            - { kind: text, text: { en: "I understand everything. Go ahead!", ar: "أفهم كل شيء. تفضّل!" }, gap: s }
    answer: [examples]
    misconceptions:
      - id: MC-P12-020
        when: [friend, anything]
        feedback:
          en: "Both invite long, free talk it can't follow. People will fail and blame themselves or the app."
          ar: "الاثنان يدعوان لكلام طويل وحر لا يستطيع متابعته. فيفشل الناس ويلومون أنفسهم أو التطبيق."
    hints:
      - { en: "What kind of sentences does it understand?", ar: "ما نوع الجمل التي يفهمها؟" }
      - { en: "Which option shows people that kind of sentence?", ar: "أي خيار يُري الناس هذا النوع من الجمل؟" }
    correct:
      en: "Right. An example shows how to talk to it."
      ar: "صحيح. المثال يُظهر كيف تتحدّث معه."
    explain:
      en: "Show the kind of request that works. People copy it and succeed."
      ar: "أظهر نوع الطلب الذي ينجح. فيقلّده الناس وينجحون."

  - id: S08
    type: card
    part: recap
    icons: [person, list, warn, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Not a person:** you made clear the assistant is automatic.\n- **What to ask:** you listed book, move and cancel, and where to go for medical questions.\n- **Say the limit:** you replaced false comfort with \"call emergency services\".\n- **Honest look:** you chose an icon and a plain name over a doctor's face.\n- **Show by example:** you showed the kind of sentence voice search understands.\n\nNext: the skill check."
      ar: "- **ليس إنسانًا:** وضّحت أن المساعد آلي.\n- **ماذا تطلب:** ذكرت الحجز والتغيير والإلغاء، وإلى أين تذهب للأسئلة الطبية.\n- **قل الحد:** استبدلت الطمأنة الكاذبة بـ«اتصل بالطوارئ».\n- **شكل صادق:** اخترت أيقونة واسمًا بسيطًا بدل وجه طبيبة.\n- **بالمثال:** عرضت نوع الجملة التي يفهمها البحث بالصوت.\n\nالتالي: اختبار المهارة."
