id: P12
title:
  en: "Design Better AI Experiences"
  ar: "صمّم تجارب أفضل بالذكاء الاصطناعي"
subtitle:
  en: "Decide where AI truly helps people, set honest expectations, and keep people in control when it gets things wrong."
  ar: "قرّر أين يساعد الذكاء الاصطناعي الناس فعلًا، وضع توقّعات صادقة، وأبقِ الناس متحكّمين حين يخطئ."
