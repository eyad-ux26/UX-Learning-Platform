id: P12-U01-L04
mode: check
minutes: 6
title:
  en: "Skill check: does it need AI?"
  ar: "اختبار المهارة: هل يحتاج ذكاءً اصطناعيًا؟"
summary:
  en: "Plan AI features for a gym app, from the first question to the mistakes that matter, on your own."
  ar: "خطّط ميزات ذكاء اصطناعي لتطبيق نادٍ رياضي، من السؤال الأول إلى الأخطاء المهمة، بنفسك."
speaker: hana
sources:
  - title: { en: "User Needs + Defining Success (People + AI Guidebook)", ar: "احتياجات المستخدم وتعريف النجاح (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/user-needs/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana's gym app", ar: "تطبيق النادي الذي تملكه هناء" }
    body:
      en: "I own a gym, and a company offered to add AI to our members' app. Before I pay, I want to know where it really helps.\n\nYour job: answer five questions.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أملك ناديًا رياضيًا، وعرضت عليّ شركة أن تضيف ذكاءً اصطناعيًا لتطبيق الأعضاء. وقبل أن أدفع، أريد أن أعرف أين يساعد فعلًا.\n\nمهمّتك: أجب عن خمسة أسئلة.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Fit Hub", ar: "فت هب" } }
        - { kind: meta, text: { en: "Classes · My plan · Membership", ar: "الحصص · خطتي · الاشتراك" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P12-U01-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. User Needs (People + AI): find where people's needs and AI's strengths meet. Solve a real problem in a way where AI adds unique value."
      ar: "اختبار مهارة. احتياجات المستخدم (People + AI): ابحث عن نقطة التقاء احتياجات الناس ونقاط قوة الذكاء الاصطناعي. وحلّ مشكلة حقيقية بطريقة يضيف فيها الذكاء الاصطناعي قيمة فريدة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Solve a real problem in ways in which AI adds unique value." }
    scenario:
      en: "The company's sales person showed me 12 AI features and asked which ones I want."
      ar: "عرض عليّ مندوب الشركة 12 ميزة ذكاء اصطناعي وسألني أيها أريد."
    prompt:
      en: "What should I do before choosing?"
      ar: "ماذا يجب أن أفعل قبل الاختيار؟"
    options:
      - { id: ask, text: { en: "List what members struggle with today, then see which feature solves one of those", ar: "أكتب ما يعانيه الأعضاء اليوم، ثم أرى أي ميزة تحلّ واحدة منها" } }
      - { id: popular, text: { en: "Pick the features other gyms bought most", ar: "أختار الميزات التي اشترتها النوادي الأخرى أكثر" } }
      - { id: all, text: { en: "Take all 12, then remove what members don't use", ar: "آخذ الـ 12 كلها، ثم أحذف ما لا يستخدمه الأعضاء" } }
    answer: [ask]
    misconceptions:
      - id: MC-P12-001
        when: [popular, all]
        feedback:
          en: "Both start from the features, not from members. Without knowing the problem, I can't tell which feature is worth paying for."
          ar: "الاثنان يبدآن من الميزات، لا من الأعضاء. وبدون معرفة المشكلة، لا أستطيع أن أعرف أي ميزة تستحق الدفع."
    explain:
      en: "From Lesson 1: start from people's real problem, then check if AI solves it."
      ar: "من الدرس 1: ابدأ من مشكلة الناس الحقيقية، ثم تأكّد إن كان الذكاء الاصطناعي يحلّها."

  - id: S03
    type: choose
    skill: SK-P12-U01-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. User Needs (People + AI): a simpler solution is easier to build, explain, debug and maintain."
      ar: "اختبار مهارة. احتياجات المستخدم (People + AI): الحل الأبسط أسهل في البناء والشرح والإصلاح والصيانة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "A simpler solution has the added benefit of being easier to build, explain, debug, and maintain." }
    scenario:
      en: "Members often forget to renew and lose their discount. The company offers \"AI that predicts when each member will forget\"."
      ar: "الأعضاء ينسون التجديد كثيرًا فيفقدون الخصم. والشركة تعرض «ذكاءً اصطناعيًا يتوقّع متى سينسى كل عضو»."
    prompt:
      en: "What's the best fix?"
      ar: "ما أفضل حل؟"
    options:
      - { id: predict, text: { en: "The AI that predicts who will forget", ar: "الذكاء الاصطناعي الذي يتوقّع من سينسى" } }
      - { id: chat, text: { en: "An AI chat that answers renewal questions", ar: "محادثة ذكاء اصطناعي تجيب عن أسئلة التجديد" } }
      - { id: rule, text: { en: "A reminder to every member 7 days before the end date", ar: "تذكير لكل عضو قبل تاريخ الانتهاء بـ 7 أيام" } }
    answer: [rule]
    misconceptions:
      - id: MC-P12-002
        when: [predict, chat]
        feedback:
          en: "We already know each end date. A simple reminder reaches everyone, costs little and never guesses wrong."
          ar: "نحن نعرف تاريخ انتهاء كل اشتراك بالفعل. والتذكير البسيط يصل للجميع، ويكلّف قليلًا، ولا يخمّن خطأً أبدًا."
    explain:
      en: "From Lesson 1: when the answer is fixed and known, a simple rule beats AI."
      ar: "من الدرس 1: حين تكون الإجابة ثابتة ومعروفة، تتفوّق القاعدة البسيطة على الذكاء الاصطناعي."

  - id: S04
    type: choose
    skill: SK-P12-U01-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. User Needs (People + AI): augment tasks people enjoy, that carry social capital, or where people disagree on the right way."
      ar: "اختبار مهارة. احتياجات المستخدم (People + AI): ساعد في المهام التي يستمتع بها الناس، أو تمنحهم مكانة اجتماعية، أو يختلفون على طريقتها الصحيحة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Augment tasks that people enjoy doing, that carry social capital, or where people don’t agree on the “correct” way to do it." }
    scenario:
      en: "My coaches build a training plan for each new member. They love it, members choose a coach for it, and every coach does it a bit differently."
      ar: "المدرّبون عندي يصمّمون خطة تدريب لكل عضو جديد. وهم يحبّون ذلك، والأعضاء يختارون المدرّب من أجله، وكل مدرّب يفعله بطريقة مختلفة قليلًا."
    prompt:
      en: "How should AI fit in?"
      ar: "كيف يجب أن يدخل الذكاء الاصطناعي؟"
    options:
      - { id: auto, text: { en: "AI writes every plan, so coaches have more free time", ar: "الذكاء الاصطناعي يكتب كل الخطط، ليصبح للمدرّبين وقت فراغ أكثر" } }
      - { id: help, text: { en: "AI suggests exercises and fills in the details; the coach shapes the plan", ar: "الذكاء الاصطناعي يقترح تمارين ويملأ التفاصيل؛ والمدرّب يشكّل الخطة" } }
      - { id: none, text: { en: "AI checks the plans after they're sent", ar: "الذكاء الاصطناعي يراجع الخطط بعد إرسالها" } }
    answer: [help]
    misconceptions:
      - id: MC-P12-006
        when: [auto, none]
        feedback:
          en: "Coaches enjoy this, members value it, and there's no single right plan. AI should help coaches, not replace them or come too late."
          ar: "المدرّبون يستمتعون بهذا، والأعضاء يقدّرونه، ولا توجد خطة صحيحة واحدة. فيجب أن يساعد الذكاء الاصطناعي المدرّبين، لا أن يحلّ محلّهم أو يأتي متأخرًا."
    explain:
      en: "From Lesson 2: help people with tasks they enjoy or own; don't take those tasks away."
      ar: "من الدرس 2: ساعد الناس في المهام التي يستمتعون بها أو يتحمّلون مسؤوليتها؛ لا تأخذها منهم."

  - id: S05
    type: choose
    skill: SK-P12-U01-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. User Needs (People + AI): both kinds of mistakes are wrong, but one can be much more dangerous."
      ar: "اختبار مهارة. احتياجات المستخدم (People + AI): نوعا الخطأ كلاهما خطأ، لكن أحدهما قد يكون أخطر بكثير."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Both are incorrect, but one is much more dangerous." }
    scenario:
      en: "During class, AI reads members' heart rate from their watches and alerts the coach if it looks dangerously high."
      ar: "أثناء الحصة، يقرأ الذكاء الاصطناعي نبض الأعضاء من ساعاتهم وينبّه المدرّب إذا بدا مرتفعًا بشكل خطير."
    prompt:
      en: "Which mistake must we avoid most?"
      ar: "أي خطأ يجب أن نتجنّبه أكثر؟"
    options:
      - { id: miss, text: { en: "No alert when a member's heart rate really is dangerous", ar: "لا تنبيه حين يكون نبض العضو خطيرًا فعلًا" } }
      - { id: alarm, text: { en: "An alert when the member is fine", ar: "تنبيه والعضو بخير" } }
      - { id: same, text: { en: "Both equally; tune for overall accuracy", ar: "الاثنان بنفس القدر؛ نضبط للدقة العامة" } }
    answer: [miss]
    misconceptions:
      - id: MC-P12-008
        when: [alarm, same]
        feedback:
          en: "A false alarm means the coach checks on a member who's fine. A missed one could mean a member collapses."
          ar: "الإنذار الكاذب يعني أن المدرّب يطمئن على عضو بخير. أما الفائت فقد يعني أن يسقط عضو."
    explain:
      en: "From Lesson 3: weigh each mistake by what it costs people, and tune against the worse one."
      ar: "من الدرس 3: قيّم كل خطأ بما يكلّفه للناس، واضبط ضد الأسوأ."

  - id: S06
    type: choose
    skill: SK-P12-U01-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. User Needs (People + AI): where a product falls between precision and recall should depend on what people expect and need to feel the task is complete."
      ar: "اختبار مهارة. احتياجات المستخدم (People + AI): موقع المنتج بين الدقة والشمول يجب أن يعتمد على ما يتوقّعه الناس وما يجعلهم يشعرون أن المهمة اكتملت."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Where along that spectrum your product falls should be based on what your users expect and what gives them the sense of task completeness." }
    scenario:
      en: "The home screen will show \"Classes you might like\". Members can always see the full timetable."
      ar: "ستعرض الشاشة الرئيسية «حصص قد تعجبك». والأعضاء يستطيعون دائمًا رؤية الجدول الكامل."
    prompt:
      en: "What should the AI show there?"
      ar: "ماذا يجب أن يعرض الذكاء الاصطناعي هناك؟"
    options:
      - { id: all, text: { en: "Every class that might fit, even weak matches", ar: "كل حصة قد تناسب، حتى الأقل تطابقًا" } }
      - { id: none, text: { en: "Nothing until it's 100% sure", ar: "لا شيء حتى يتأكّد 100%" } }
      - { id: few, text: { en: "2 or 3 classes it's sure fit the member", ar: "2 أو 3 حصص متأكّد أنها تناسب العضو" } }
    answer: [few]
    misconceptions:
      - id: MC-P12-009
        when: [all]
        feedback:
          en: "Missing a class here costs nothing; the timetable is one tap away. Weak matches only add noise."
          ar: "تفويت حصة هنا لا يكلّف شيئًا؛ فالجدول على بُعد ضغطة. والتطابقات الضعيفة تضيف ضوضاء فقط."
      - id: MC-P12-009
        when: [none]
        feedback:
          en: "AI is rarely 100% sure, so the section would stay empty. A few strong picks are enough."
          ar: "الذكاء الاصطناعي نادرًا ما يكون متأكّدًا 100%، فسيبقى القسم فارغًا. وبعض الاختيارات القوية تكفي."
    explain:
      en: "From Lesson 3: when a miss costs little, show a few sure results."
      ar: "من الدرس 3: حين لا يكلّف الفائت شيئًا، اعرض نتائج قليلة وأكيدة."
