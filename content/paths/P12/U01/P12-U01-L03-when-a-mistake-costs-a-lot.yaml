id: P12-U01-L03
mode: lesson
minutes: 7
title:
  en: "When a mistake costs a lot"
  ar: "حين يكون الخطأ مكلفًا"
summary:
  en: "Decide which AI mistakes hurt patients more, and whether to show fewer sure results or every possible one."
  ar: "قرّر أي أخطاء الذكاء الاصطناعي تضرّ المرضى أكثر، وهل تعرض نتائج أقل وأكيدة أم كل النتائج الممكنة."
speaker: nour
sources:
  - title: { en: "User Needs + Defining Success (People + AI Guidebook)", ar: "احتياجات المستخدم وتعريف النجاح (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/user-needs/"
review_labels:
  MC-P12-008: { en: "Weigh mistakes by their real cost", ar: "قيّم الأخطاء بتكلفتها الحقيقية" }
  MC-P12-009: { en: "Few, sure results when misses cost little", ar: "نتائج قليلة وأكيدة حين لا يكلّف الفائت شيئًا" }
  MC-P12-010: { en: "Show every possible result when a miss is costly", ar: "اعرض كل النتائج الممكنة حين يكون الفائت مكلفًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two ways to be wrong", ar: "طريقتان للخطأ" }
    body:
      en: "Our clinic gets 400 patient messages a day. We're adding AI that marks the urgent ones, like chest pain, so a nurse calls back first.\n\nThe AI will make mistakes. The question is which mistakes we can live with."
      ar: "تصل عيادتنا 400 رسالة من المرضى يوميًا. وسنضيف ذكاءً اصطناعيًا يحدّد الرسائل العاجلة، مثل ألم الصدر، لتتصل الممرّضة بأصحابها أولًا.\n\nسيخطئ الذكاء الاصطناعي. والسؤال: أي أخطاء يمكننا تحمّلها؟"
    mock:
      width: 300
      blocks:
        - kind: row
          blocks:
            - { kind: meta, text: { en: "\"Chest pain since this morning\"", ar: "«ألم في الصدر منذ الصباح»" } }
            - { kind: chip, tone: bad, text: { en: "Urgent", ar: "عاجل" } }
        - kind: row
          gap: s
          blocks:
            - { kind: meta, text: { en: "\"Can I move my visit to Sunday?\"", ar: "«هل يمكن نقل موعدي إلى الأحد؟»" } }
            - { kind: chip, text: { en: "Normal", ar: "عادي" } }

  - id: S02
    type: choose
    skill: SK-P12-U01-04
    part: try
    rules: [R12]
    value:
      en: "Try first. User Needs (People + AI): it's tempting to weigh false alarms and misses equally, but that rarely matches their real cost to people."
      ar: "جرّب أولًا. احتياجات المستخدم (People + AI): من المغري أن نعامل الإنذار الكاذب والحالة الفائتة بنفس الوزن، لكن هذا نادرًا ما يطابق تكلفتهما الحقيقية على الناس."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "It is tempting to weigh both equally by default. However, that’s not likely to match the consequences in real life for users." }
    prompt:
      en: "Which mistake is worse here?"
      ar: "أي خطأ أسوأ هنا؟"
    options:
      - { id: miss, text: { en: "An urgent message marked \"Normal\": the patient waits hours", ar: "رسالة عاجلة تُعلَّم «عادي»: فينتظر المريض ساعات" } }
      - { id: alarm, text: { en: "A normal message marked \"Urgent\": a nurse calls back early", ar: "رسالة عادية تُعلَّم «عاجل»: فتتصل الممرّضة مبكرًا" } }
      - { id: same, text: { en: "Both are equally bad; treat them the same", ar: "الاثنان سيّئان بنفس القدر؛ عاملهما بنفس الطريقة" } }
    answer: [miss]
    misconceptions:
      - id: MC-P12-008
        when: [alarm]
        feedback:
          en: "An early call wastes a few minutes of a nurse's time. A missed chest pain could cost a life."
          ar: "الاتصال المبكر يضيّع دقائق من وقت الممرّضة. أما ألم الصدر الفائت فقد يكلّف حياة."
      - id: MC-P12-008
        when: [same]
        feedback:
          en: "They're both errors, but their costs are very different. Treating them the same ignores what happens to the patient."
          ar: "الاثنان خطأ، لكن تكلفتهما مختلفة جدًا. ومعاملتهما بنفس الطريقة تتجاهل ما يحدث للمريض."
    hints:
      - { en: "What happens to the patient in each case?", ar: "ماذا يحدث للمريض في كل حالة؟" }
      - { en: "Which one can be fixed in a minute, and which can't?", ar: "أيهما يُصلح في دقيقة، وأيهما لا؟" }
    correct:
      en: "Right. Here a miss is far worse than a false alarm."
      ar: "صحيح. هنا الحالة الفائتة أسوأ بكثير من الإنذار الكاذب."
    explain:
      en: "So the AI should lean towards marking \"Urgent\" when unsure. A few extra calls are a fair price for not missing a real emergency."
      ar: "لذلك يجب أن يميل الذكاء الاصطناعي إلى «عاجل» حين لا يكون متأكّدًا. وبعض المكالمات الزائدة ثمن مقبول لعدم تفويت حالة طارئة حقيقية."

  - id: S03
    type: card
    part: concept
    icons: [warn, eye, list, target]
    title: { en: "Two kinds of mistakes", ar: "نوعان من الأخطاء" }
    body:
      en: "- **False alarm (false positive):** the AI says \"yes\", but the answer is \"no\".\n- **Miss (false negative):** the AI says \"no\", but the answer is \"yes\".\n- **Which is worse depends on the cost:** a fire alarm that stays silent is worse than one that goes off for toast. A song you don't like costs nothing; you skip it.\n- **Few and sure, or everything:** showing only sure results means fewer false alarms but more misses. Showing every possible result means fewer misses but more noise. Pick based on what a miss costs people."
      ar: "- **إنذار كاذب (False positive):** يقول الذكاء الاصطناعي «نعم»، والإجابة «لا».\n- **حالة فائتة (False negative):** يقول الذكاء الاصطناعي «لا»، والإجابة «نعم».\n- **أيهما أسوأ يعتمد على التكلفة:** جهاز إنذار الحريق الذي يصمت أسوأ من الذي يرنّ بسبب خبز محروق. والأغنية التي لا تعجبك لا تكلّف شيئًا؛ تتخطّاها.\n- **قليلة وأكيدة، أم كل شيء:** عرض النتائج الأكيدة فقط يعني إنذارات كاذبة أقل لكن حالات فائتة أكثر. وعرض كل نتيجة ممكنة يعني حالات فائتة أقل لكن ضوضاء أكثر. اختر حسب تكلفة الفائت على الناس."

  - id: S04
    type: choose
    skill: SK-P12-U01-04
    part: guided
    rules: [R06]
    value:
      en: "User Needs (People + AI): is a false alarm worse than an alarm that doesn't go off? Both are wrong, but one is much more dangerous. Which one depends on the task."
      ar: "احتياجات المستخدم (People + AI): هل الإنذار الكاذب أسوأ من إنذار لا يرنّ؟ الاثنان خطأ، لكن أحدهما أخطر بكثير. وأيهما يعتمد على المهمة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "For example, is a false alarm worse than one that doesn’t go off when there’s a fire?" }
    scenario:
      en: "Our clinic's email has an AI spam filter. It moves emails it thinks are junk into the Spam folder, which nobody checks."
      ar: "بريد عيادتنا فيه فلتر رسائل مزعجة بالذكاء الاصطناعي. ينقل الرسائل التي يظنّها مزعجة إلى مجلد Spam، الذي لا يراجعه أحد."
    prompt:
      en: "Which mistake should we worry about most?"
      ar: "أي خطأ يجب أن يقلقنا أكثر؟"
    options:
      - { id: through, text: { en: "Some junk mail gets into the inbox", ar: "بعض الرسائل المزعجة تصل إلى البريد الوارد" } }
      - { id: slow, text: { en: "The filter takes a second to sort each email", ar: "الفلتر يأخذ ثانية ليصنّف كل رسالة" } }
      - { id: lost, text: { en: "A real patient's email lands in Spam", ar: "رسالة مريض حقيقي تقع في مجلد Spam" } }
    answer: [lost]
    misconceptions:
      - id: MC-P12-008
        when: [through, slow]
        feedback:
          en: "Junk in the inbox costs a click to delete. A patient's email in a folder nobody checks may never be answered."
          ar: "الرسالة المزعجة في البريد الوارد تكلّف ضغطة لحذفها. أما رسالة المريض في مجلد لا يراجعه أحد فقد لا يُرَدّ عليها أبدًا."
    hints:
      - { en: "What does each mistake cost the clinic or the patient?", ar: "ماذا يكلّف كل خطأ العيادة أو المريض؟" }
      - { en: "Here, \"yes\" means \"this is junk\". Which wrong \"yes\" hurts?", ar: "هنا «نعم» تعني «هذه رسالة مزعجة». أي «نعم» خطأ تضرّ؟" }
    correct:
      en: "Right. Here the false alarm is the dangerous one."
      ar: "صحيح. هنا الإنذار الكاذب هو الخطير."
    explain:
      en: "In the urgent-message case, misses were worse. Here, false alarms are. Always ask what each mistake costs in this task."
      ar: "في حالة الرسائل العاجلة، كانت الحالات الفائتة أسوأ. وهنا، الإنذارات الكاذبة أسوأ. اسأل دائمًا ماذا يكلّف كل خطأ في هذه المهمة."

  - id: S05
    type: choose
    skill: SK-P12-U01-05
    part: guided
    rules: [R06]
    value:
      en: "User Needs (People + AI): the higher the recall, the more sure you can be that all relevant results are included somewhere in the output, at the cost of some irrelevant ones."
      ar: "احتياجات المستخدم (People + AI): كلما زاد الشمول (Recall)، زاد تأكّدك أن كل النتائج المهمة موجودة في مكان ما من المخرجات، مقابل بعض النتائج غير المهمة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "The higher the recall, the more confident you can be that all the relevant results are included somewhere in the output." }
    scenario:
      en: "When a doctor writes a prescription, AI lists medicines that may not mix well with what the patient already takes. Doctors say: \"Never hide a possible risk; we'll judge it.\""
      ar: "حين يكتب الطبيب وصفة، يعرض الذكاء الاصطناعي الأدوية التي قد لا تتناسب مع ما يأخذه المريض بالفعل. ويقول الأطباء: «لا تُخفِ أي خطر محتمل أبدًا؛ نحن سنحكم.»"
    prompt:
      en: "What should the list show?"
      ar: "ماذا يجب أن تعرض القائمة؟"
    options:
      - { id: sure, text: { en: "Only the risks the AI is very sure of", ar: "المخاطر التي الذكاء الاصطناعي متأكّد منها جدًا فقط" } }
      - { id: all, text: { en: "Every possible risk, with the sure ones first and the less sure ones marked", ar: "كل خطر محتمل، الأكيدة أولًا والأقل تأكيدًا معلّمة" } }
      - { id: top, text: { en: "Only the single most likely risk", ar: "الخطر الأكثر احتمالًا فقط" } }
    answer: [all]
    misconceptions:
      - id: MC-P12-010
        when: [sure, top]
        feedback:
          en: "Showing fewer means some real risks are left out. Doctors said a missed risk is the one thing they can't accept."
          ar: "عرض أقل يعني ترك بعض المخاطر الحقيقية. والأطباء قالوا إن الخطر الفائت هو الشيء الوحيد الذي لا يقبلونه."
    hints:
      - { en: "What did the doctors say they can't accept?", ar: "ماذا قال الأطباء إنهم لا يقبلونه؟" }
      - { en: "Which option leaves nothing out?", ar: "أي خيار لا يترك شيئًا؟" }
    correct:
      en: "Right. When a miss is dangerous, show everything, sorted and marked."
      ar: "صحيح. حين يكون الفائت خطيرًا، اعرض كل شيء، مرتّبًا ومعلّمًا."
    explain:
      en: "A few extra items cost the doctor a few seconds. A missing one could harm the patient."
      ar: "بعض العناصر الزائدة تكلّف الطبيب ثواني. أما العنصر الفائت فقد يضرّ المريض."

  - id: S06
    type: compare
    skill: SK-P12-U01-05
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: the same choice where a miss costs little. User Needs (People + AI): the higher the precision, the more confident you can be that any result shown is correct."
      ar: "مقارنة: نفس الاختيار حيث لا يكلّف الفائت شيئًا. احتياجات المستخدم (People + AI): كلما زادت الدقة (Precision)، زاد تأكّدك أن أي نتيجة معروضة صحيحة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "The higher the precision, the more confident you can be that any model output is correct." }
    scenario:
      en: "On our app's home screen, AI suggests health tips for each patient. Patients can still browse all tips themselves."
      ar: "في الشاشة الرئيسية لتطبيقنا، يقترح الذكاء الاصطناعي نصائح صحية لكل مريض. والمرضى يستطيعون تصفّح كل النصائح بأنفسهم."
    prompt:
      en: "Which home screen is better?"
      ar: "أي شاشة رئيسية أفضل؟"
    a:
      label: { en: "A: 15 tips, including ones that may not fit.", ar: "A: 15 نصيحة، منها ما قد لا يناسب." }
      mock:
        width: 300
        blocks:
          - { kind: meta, weight: bold, text: { en: "Tips for you (15)", ar: "نصائح لك (15)" } }
          - { kind: small, text: { en: "Walking after meals · Baby sleep · Knee care · Teen acne · …", ar: "المشي بعد الأكل · نوم الرضيع · العناية بالركبة · حبوب المراهقين · …" }, gap: xs }
    b:
      label: { en: "B: 3 tips the AI is sure fit, and \"See all tips\".", ar: "B: 3 نصائح الذكاء الاصطناعي متأكّد أنها تناسب، و«كل النصائح»." }
      mock:
        width: 300
        blocks:
          - { kind: meta, weight: bold, text: { en: "Tips for you", ar: "نصائح لك" } }
          - { kind: small, text: { en: "Walking after meals · Less salt · Checking sugar at home", ar: "المشي بعد الأكل · ملح أقل · قياس السكر في البيت" }, gap: xs }
          - { kind: link, text: { en: "See all tips", ar: "كل النصائح" }, gap: s }
    answer: b
    reason:
      prompt: { en: "Why is B better here?", ar: "لماذا B أفضل هنا؟" }
      options:
        - { id: cost, text: { en: "A missed tip costs little, and wrong tips make people trust the list less", ar: "النصيحة الفائتة لا تكلّف كثيرًا، والنصائح الخطأ تجعل الناس يثقون بالقائمة أقل" } }
        - { id: short, text: { en: "Short lists are always better", ar: "القوائم القصيرة أفضل دائمًا" } }
        - { id: space, text: { en: "The screen has no space for 15", ar: "الشاشة لا تتّسع لـ 15" } }
      answer: [cost]
      misconceptions:
        - id: MC-P12-009
          when: [short, space]
          feedback:
            en: "It's about cost, not length. For the medicine risks, the long list was right."
            ar: "المسألة عن التكلفة، لا الطول. ففي مخاطر الأدوية، كانت القائمة الطويلة هي الصحيحة."
    misconceptions:
      - id: MC-P12-009
        when: [a]
        feedback:
          en: "Baby sleep and teen acne for an adult with diabetes? Wrong tips add noise, and missing one costs nothing; all tips are a tap away."
          ar: "نوم الرضيع وحبوب المراهقين لبالغ عنده سكر؟ النصائح الخطأ تضيف ضوضاء، وتفويت نصيحة لا يكلّف شيئًا؛ فكل النصائح على بُعد ضغطة."
    hints:
      - { en: "What's lost if one useful tip isn't on the home screen?", ar: "ماذا يضيع إذا لم تظهر نصيحة مفيدة في الشاشة الرئيسية؟" }
      - { en: "Compare this with the medicine risks.", ar: "قارن هذا بمخاطر الأدوية." }
    correct:
      en: "Right. When misses are cheap, show a few sure results."
      ar: "صحيح. حين يكون الفائت رخيصًا، اعرض نتائج قليلة وأكيدة."
    explain:
      en: "Same AI, different choice. Ask what a miss costs: high, show everything; low, show the sure few."
      ar: "نفس الذكاء الاصطناعي، واختيار مختلف. اسأل ماذا يكلّف الفائت: إذا كان كبيرًا، اعرض كل شيء؛ وإذا كان صغيرًا، اعرض القليل الأكيد."

  - id: S07
    type: choose
    skill: SK-P12-U01-04
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. User Needs (People + AI): weighing the cost of false positives and false negatives is a critical decision that shapes people's experience."
      ar: "حالة جديدة. احتياجات المستخدم (People + AI): الموازنة بين تكلفة الإنذار الكاذب والحالة الفائتة قرار مهم يشكّل تجربة الناس."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Weighing the cost of false positives and false negatives is a critical decision that will shape your users’ experiences." }
    scenario:
      en: "A camera in my shop uses AI to spot empty shelves and alerts me. A false alarm costs me one minute to check. A missed empty shelf costs a day of sales."
      ar: "كاميرا في متجري تستخدم الذكاء الاصطناعي لتكتشف الرفوف الفارغة وتنبّهني. والإنذار الكاذب يكلّفني دقيقة للتأكّد. أما الرف الفارغ الفائت فيكلّف مبيعات يوم كامل."
    prompt:
      en: "How should the alerts be tuned?"
      ar: "كيف يجب أن تُضبط التنبيهات؟"
    options:
      - { id: sure, text: { en: "Alert only when the AI is very sure, so I'm not disturbed", ar: "تنبّه فقط حين يكون الذكاء الاصطناعي متأكّدًا جدًا، حتى لا أنزعج" } }
      - { id: lean, text: { en: "Alert even when it's not sure, because a miss costs more", ar: "تنبّه حتى حين لا يكون متأكّدًا، لأن الفائت يكلّف أكثر" } }
      - { id: equal, text: { en: "Treat both mistakes the same", ar: "تعامل الخطأين بنفس الطريقة" } }
    answer: [lean]
    misconceptions:
      - id: MC-P12-008
        when: [sure, equal]
        feedback:
          en: "A miss costs a day of sales; a false alarm costs a minute. The tuning should follow those costs."
          ar: "الفائت يكلّف مبيعات يوم؛ والإنذار الكاذب يكلّف دقيقة. والضبط يجب أن يتبع هذه التكاليف."
    hints:
      - { en: "Compare a minute with a day of sales.", ar: "قارن دقيقة بمبيعات يوم." }
      - { en: "Which mistake should the AI avoid most?", ar: "أي خطأ يجب أن يتجنّبه الذكاء الاصطناعي أكثر؟" }
    correct:
      en: "Right. Lean away from the costlier mistake."
      ar: "صحيح. ابتعد عن الخطأ الأكثر تكلفة."
    explain:
      en: "Put a cost on each mistake, then tune the AI so the expensive one happens least."
      ar: "ضع تكلفة لكل خطأ، ثم اضبط الذكاء الاصطناعي ليقلّ الخطأ المكلف أكثر."

  - id: S08
    type: card
    part: recap
    icons: [warn, target, list, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Misses worse:** urgent messages should lean to \"Urgent\" when unsure.\n- **False alarms worse:** a patient email in Spam is the costly mistake.\n- **Show everything:** you listed every possible medicine risk, marked by how sure.\n- **Show a sure few:** you kept home-screen tips short, with \"See all\".\n- **Follow the cost:** you tuned shelf alerts against the expensive miss.\n\nNext: the skill check."
      ar: "- **الفائت أسوأ:** الرسائل العاجلة تميل إلى «عاجل» عند عدم التأكّد.\n- **الإنذار الكاذب أسوأ:** رسالة المريض في Spam هي الخطأ المكلف.\n- **اعرض كل شيء:** عرضت كل خطر دوائي محتمل، معلّمًا بدرجة التأكّد.\n- **اعرض القليل الأكيد:** جعلت نصائح الشاشة الرئيسية قليلة، مع «كل النصائح».\n- **اتبع التكلفة:** ضبطت تنبيهات الرفوف ضد الفائت المكلف.\n\nالتالي: اختبار المهارة."
