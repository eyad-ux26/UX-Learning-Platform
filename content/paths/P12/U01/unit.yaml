id: P12-U01
free: true
title:
  en: "Does it need AI?"
  ar: "هل يحتاج ذكاءً اصطناعيًا؟"
skill:
  en: "Start from people's problem, use AI only where it adds real value, and choose what it should do and which mistakes matter most."
  ar: "ابدأ من مشكلة الناس، واستخدم الذكاء الاصطناعي فقط حيث يضيف قيمة حقيقية، واختر ما يجب أن يفعله وأي أخطائه أهم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P12-U01-01
    title: { en: "Start from the user's problem", ar: "ابدأ من مشكلة المستخدم" }
    can_do: { en: "Ask \"How might we solve this problem?\" before \"Can we use AI?\", and fix the real problem first.", ar: "اسأل «كيف نحلّ هذه المشكلة؟» قبل «هل نستخدم الذكاء الاصطناعي؟»، وأصلح المشكلة الحقيقية أولًا." }
  - id: SK-P12-U01-02
    title: { en: "Tell when AI beats a simple rule", ar: "اعرف متى يتفوّق الذكاء الاصطناعي على قاعدة بسيطة" }
    can_do: { en: "Use AI for personal suggestions, predictions, language and recognition, and a simple rule for fixed, predictable things.", ar: "استخدم الذكاء الاصطناعي للاقتراحات الشخصية والتوقّعات وفهم اللغة والتعرّف على الأشياء، وقاعدة بسيطة للأشياء الثابتة والمتوقّعة." }
  - id: SK-P12-U01-03
    title: { en: "Choose to automate or to help", ar: "اختر أن تؤتمت أو أن تساعد" }
    can_do: { en: "Automate boring, repetitive tasks with a way to check them, and help people do tasks they enjoy, own or care about.", ar: "أتمت المهام المملّة والمتكرّرة مع طريقة لمراجعتها، وساعد الناس في المهام التي يستمتعون بها أو يتحمّلون مسؤوليتها." }
  - id: SK-P12-U01-04
    title: { en: "Weigh the two kinds of mistakes", ar: "وازن بين نوعي الأخطاء" }
    can_do: { en: "Decide whether a false alarm or a miss costs people more, and tune the AI against the worse one.", ar: "قرّر أيهما يكلّف الناس أكثر: الإنذار الكاذب أم الحالة الفائتة، واضبط الذكاء الاصطناعي ضد الأسوأ." }
  - id: SK-P12-U01-05
    title: { en: "Choose fewer sure results or more complete ones", ar: "اختر نتائج أقل وأكيدة أو نتائج أكثر وكاملة" }
    can_do: { en: "Show a few sure results when misses cost little, and show every possible result when people can't afford to miss one.", ar: "اعرض نتائج قليلة أكيدة حين لا يكلّف الفائت شيئًا، واعرض كل النتائج الممكنة حين لا يحتمل الناس أن يفوتهم شيء." }
