id: P12-U01-L01
mode: lesson
minutes: 7
title:
  en: "Start from the problem, not from AI"
  ar: "ابدأ من المشكلة، لا من الذكاء الاصطناعي"
summary:
  en: "Decide where AI really helps a grocery app, and where a simple rule works better."
  ar: "قرّر أين يساعد الذكاء الاصطناعي تطبيق بقالة فعلًا، وأين تعمل قاعدة بسيطة أفضل."
speaker: tarek
sources:
  - title: { en: "User Needs + Defining Success (People + AI Guidebook)", ar: "احتياجات المستخدم وتعريف النجاح (دليل الناس والذكاء الاصطناعي)" }
    url: "https://pair.withgoogle.com/chapter/user-needs/"
review_labels:
  MC-P12-001: { en: "Start from the user's problem, not the technology", ar: "ابدأ من مشكلة المستخدم، لا من التقنية" }
  MC-P12-002: { en: "A simple rule often works better", ar: "القاعدة البسيطة غالبًا تعمل أفضل" }
  MC-P12-003: { en: "Keep predictable things predictable", ar: "أبقِ الأشياء المتوقّعة ثابتة" }
  MC-P12-004: { en: "AI fits personal, predictive and language tasks", ar: "الذكاء الاصطناعي يناسب المهام الشخصية والتوقّع واللغة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Add AI to the app\"", ar: "«أضيفوا ذكاءً اصطناعيًا للتطبيق»" }
    body:
      en: "I manage an online grocery app. Our CEO came back from a conference and said: \"Every app has AI now. Add AI to ours.\"\n\nI have one month of the team's time. Where should it go?"
      ar: "أدير تطبيق بقالة أونلاين. ورجع مديرنا التنفيذي من مؤتمر وقال: «كل التطبيقات فيها ذكاء اصطناعي الآن. أضيفوه لتطبيقنا.»\n\nعندي شهر واحد من وقت الفريق. أين أضعه؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Fresh Basket", ar: "سلة طازجة" } }
        - { kind: field, label: { en: "Search", ar: "بحث" }, text: { en: "Tomatoes, rice…", ar: "طماطم، أرز…" }, gap: s }
        - { kind: button, text: { en: "Order again", ar: "اطلب مرة أخرى" }, gap: m }

  - id: S02
    type: choose
    skill: SK-P12-U01-01
    part: try
    rules: [R12]
    value:
      en: "Try first. User Needs (People + AI): even the best AI fails if it doesn't give people unique value. Find a real problem first, then ask if AI solves it in a unique way."
      ar: "جرّب أولًا. احتياجات المستخدم (People + AI): حتى أفضل ذكاء اصطناعي يفشل إذا لم يقدّم للناس قيمة فريدة. ابحث عن مشكلة حقيقية أولًا، ثم اسأل إن كان الذكاء الاصطناعي يحلّها بطريقة فريدة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Even the best AI will fail if it doesn’t provide unique value to users." }
    prompt:
      en: "What should the team ask first?"
      ar: "ماذا يجب أن يسأل الفريق أولًا؟"
    options:
      - { id: rivals, text: { en: "\"What AI features do other grocery apps have?\"", ar: "«ما ميزات الذكاء الاصطناعي في تطبيقات البقالة الأخرى؟»" } }
      - { id: smart, text: { en: "\"How can we use AI to make our app smarter?\"", ar: "«كيف نستخدم الذكاء الاصطناعي ليصبح تطبيقنا أذكى؟»" } }
      - { id: problem, text: { en: "\"What problem do our customers have that we don't solve well today?\"", ar: "«ما المشكلة التي عند عملائنا ولا نحلّها جيدًا اليوم؟»" } }
    answer: [problem]
    misconceptions:
      - id: MC-P12-001
        when: [rivals, smart]
        feedback:
          en: "Both start from the technology. A feature that solves no real problem won't be used, however smart it is."
          ar: "الاثنان يبدآن من التقنية. والميزة التي لا تحلّ مشكلة حقيقية لن يستخدمها أحد، مهما كانت ذكية."
    hints:
      - { en: "Which question is about customers, not about AI?", ar: "أي سؤال عن العملاء، لا عن الذكاء الاصطناعي؟" }
      - { en: "You can only judge a solution once you know the problem.", ar: "لا يمكنك الحكم على حل إلا بعد أن تعرف المشكلة." }
    correct:
      en: "Right. Problem first, then the tool."
      ar: "صحيح. المشكلة أولًا، ثم الأداة."
    explain:
      en: "AI is a tool, not a goal. Find what customers struggle with, then check if AI is the best way to fix it."
      ar: "الذكاء الاصطناعي أداة، لا هدف. اعرف ما يعانيه العملاء، ثم تأكّد إن كان الذكاء الاصطناعي أفضل طريقة لإصلاحه."

  - id: S03
    type: card
    part: concept
    icons: [target, idea, list, ok]
    title: { en: "Problem first, then ask: does AI help?", ar: "المشكلة أولًا، ثم اسأل: هل يساعد الذكاء الاصطناعي؟" }
    body:
      en: "Ask \"How might we solve this problem?\", not \"Can we use AI to…?\"\n\n- **AI is often better for:** suggestions that differ for each person, predicting what comes next, understanding speech and language, and recognising things like faces.\n- **A simple rule is often better for:** things that must stay in the same place (Home, Cancel), simple fixed information (a card form), and cases where people need to know exactly why something happened.\n- **Simpler wins ties:** a rule is easier to build, explain and fix."
      ar: "اسأل «كيف نحلّ هذه المشكلة؟»، لا «هل نستخدم الذكاء الاصطناعي لـ…؟»\n\n- **الذكاء الاصطناعي غالبًا أفضل في:** اقتراحات تختلف لكل شخص، وتوقّع ما سيحدث، وفهم الكلام واللغة، والتعرّف على أشياء مثل الوجوه.\n- **القاعدة البسيطة غالبًا أفضل في:** الأشياء التي يجب أن تبقى في مكانها (الرئيسية، الإلغاء)، والمعلومات البسيطة الثابتة (نموذج بيانات البطاقة)، والحالات التي يحتاج فيها الناس معرفة سبب ما حدث بالضبط.\n- **الأبسط يفوز عند التساوي:** القاعدة أسهل في البناء والشرح والإصلاح."

  - id: S04
    type: choose
    skill: SK-P12-U01-02
    part: guided
    rules: [R06]
    value:
      en: "User Needs (People + AI): a rule-based solution often works just as well as AI, or better, and is easier to build, explain, debug and maintain."
      ar: "احتياجات المستخدم (People + AI): الحل المبني على قاعدة يعمل غالبًا بنفس جودة الذكاء الاصطناعي أو أفضل، وهو أسهل في البناء والشرح والإصلاح والصيانة."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Often a rule or heuristic-based solution will work just as well, if not better, than an AI version." }
    scenario:
      en: "Customers told us their top problem: \"I buy the same things every week, and adding them one by one takes forever.\""
      ar: "أخبرنا العملاء بأكبر مشكلة عندهم: «أشتري نفس الأشياء كل أسبوع، وإضافتها واحدة واحدة تأخذ وقتًا طويلًا جدًا.»"
    prompt:
      en: "What's the best fix?"
      ar: "ما أفضل حل؟"
    options:
      - { id: repeat, text: { en: "A \"Repeat last order\" button that fills the basket, ready to edit", ar: "زر «كرّر الطلب السابق» يملأ السلة، وجاهزة للتعديل" } }
      - { id: guess, text: { en: "AI that guesses next week's basket and orders it by itself", ar: "ذكاء اصطناعي يتوقّع سلة الأسبوع القادم ويطلبها وحده" } }
      - { id: chat, text: { en: "An AI chat where customers type what they want", ar: "محادثة ذكاء اصطناعي يكتب فيها العملاء ما يريدون" } }
    answer: [repeat]
    misconceptions:
      - id: MC-P12-002
        when: [guess]
        feedback:
          en: "Customers already know what they want: the same as last week. A wrong guess means wrong groceries at the door."
          ar: "العملاء يعرفون ما يريدون بالفعل: نفس الأسبوع الماضي. والتوقّع الخطأ يعني بقالة خطأ عند الباب."
      - id: MC-P12-002
        when: [chat]
        feedback:
          en: "Typing every item is still slow. The problem is repetition, and a simple button removes it."
          ar: "كتابة كل منتج ما زالت بطيئة. والمشكلة هي التكرار، والزر البسيط يُزيله."
    hints:
      - { en: "Do customers need anything guessed here?", ar: "هل يحتاج العملاء أن يُخمَّن لهم شيء هنا؟" }
      - { en: "Which option is simplest and still solves the problem?", ar: "أي خيار هو الأبسط ويحلّ المشكلة؟" }
    correct:
      en: "Right. A simple rule solves it, no AI needed."
      ar: "صحيح. قاعدة بسيطة تحلّها، بلا حاجة للذكاء الاصطناعي."
    explain:
      en: "When the answer is known and fixed, a rule is faster to build and never guesses wrong."
      ar: "حين تكون الإجابة معروفة وثابتة، فالقاعدة أسرع في البناء ولا تخمّن خطأً أبدًا."

  - id: S05
    type: choose
    skill: SK-P12-U01-02
    part: guided
    rules: [R06]
    value:
      en: "User Needs (People + AI): AI is probably better than a rule for recommending different content to different users."
      ar: "احتياجات المستخدم (People + AI): الذكاء الاصطناعي غالبًا أفضل من القاعدة في اقتراح محتوى مختلف لكل مستخدم."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Recommending different content to different users." }
    scenario:
      en: "We listed three more ideas for the month."
      ar: "كتبنا ثلاث أفكار أخرى لهذا الشهر."
    prompt:
      en: "Which idea really needs AI?"
      ar: "أي فكرة تحتاج الذكاء الاصطناعي فعلًا؟"
    options:
      - { id: card, text: { en: "The form where customers type their card details", ar: "النموذج الذي يكتب فيه العملاء بيانات البطاقة" } }
      - { id: recipes, text: { en: "Recipe ideas that match what each customer usually buys", ar: "أفكار وصفات تناسب ما يشتريه كل عميل عادة" } }
      - { id: hours, text: { en: "A page with our delivery hours", ar: "صفحة بمواعيد التوصيل" } }
    answer: [recipes]
    misconceptions:
      - id: MC-P12-004
        when: [card, hours]
        feedback:
          en: "This is the same for every customer and never changes. A plain form or page does the job."
          ar: "هذا واحد لكل العملاء ولا يتغيّر. والنموذج أو الصفحة العادية تؤدّي المهمة."
    hints:
      - { en: "Which idea is different for every customer?", ar: "أي فكرة تختلف لكل عميل؟" }
      - { en: "AI shines when there's no single right answer for everyone.", ar: "الذكاء الاصطناعي يتميّز حين لا توجد إجابة واحدة صحيحة للجميع." }
    correct:
      en: "Right. Personal suggestions are a good fit for AI."
      ar: "صحيح. الاقتراحات الشخصية تناسب الذكاء الاصطناعي."
    explain:
      en: "A rule can't write different recipe ideas for thousands of baskets. AI can learn each customer's habits."
      ar: "القاعدة لا تستطيع كتابة أفكار وصفات مختلفة لآلاف السلال. أما الذكاء الاصطناعي فيتعلّم عادات كل عميل."

  - id: S06
    type: compare
    skill: SK-P12-U01-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: AI everywhere vs AI in one place. User Needs (People + AI): sometimes the most valuable part of an experience is that it's predictable, like a Home or Cancel button that stays put."
      ar: "مقارنة: ذكاء اصطناعي في كل مكان مقابل مكان واحد. احتياجات المستخدم (People + AI): أحيانًا أهم ما في التجربة أنها متوقّعة، مثل زر الرئيسية أو الإلغاء الذي يبقى في مكانه."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "Sometimes the most valuable part of the core experience is its predictability, regardless of context or additional user input." }
    scenario:
      en: "The team built two versions of the home screen with recipe ideas."
      ar: "بنى الفريق نسختين من الشاشة الرئيسية فيهما أفكار الوصفات."
    prompt:
      en: "Which home screen should we ship?"
      ar: "أي شاشة رئيسية يجب أن نطلقها؟"
    a:
      label: { en: "A: AI changes the order of the whole menu on every visit.", ar: "A: الذكاء الاصطناعي يغيّر ترتيب القائمة كلها في كل زيارة." }
      mock:
        width: 300
        blocks:
          - { kind: small, color: muted, text: { en: "Today's order:", ar: "ترتيب اليوم:" } }
          - { kind: meta, text: { en: "Recipes · Offers · My orders · Fruit · Search", ar: "وصفات · عروض · طلباتي · فاكهة · بحث" }, gap: xs }
          - { kind: small, color: muted, text: { en: "Yesterday: Search · Fruit · Recipes · My orders · Offers", ar: "أمس: بحث · فاكهة · وصفات · طلباتي · عروض" }, gap: s }
    b:
      label: { en: "B: The menu stays the same, and AI fills one \"For you\" section.", ar: "B: القائمة تبقى كما هي، والذكاء الاصطناعي يملأ قسم «لك» واحدًا." }
      mock:
        width: 300
        blocks:
          - { kind: meta, text: { en: "Search · My orders · Offers · Fruit", ar: "بحث · طلباتي · عروض · فاكهة" } }
          - kind: group
            tone: tint
            gap: s
            blocks:
              - { kind: meta, weight: bold, text: { en: "For you", ar: "لك" } }
              - { kind: small, text: { en: "Koshari tonight? You have rice and lentils in your basket", ar: "كشري الليلة؟ في سلتك أرز وعدس" }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: place, text: { en: "Customers find the menu in the same place every time, and AI helps only where variety is useful", ar: "العملاء يجدون القائمة في نفس المكان كل مرة، والذكاء الاصطناعي يساعد فقط حيث التنوّع مفيد" } }
        - { id: less, text: { en: "Less AI is always better", ar: "ذكاء اصطناعي أقل أفضل دائمًا" } }
        - { id: pretty, text: { en: "B has a nicer colour", ar: "B لونه أجمل" } }
      answer: [place]
      misconceptions:
        - id: MC-P12-003
          when: [less, pretty]
          feedback:
            en: "The point is predictability. Menus must stay put; suggestions can change."
            ar: "المهم هو أن تكون متوقّعة. القوائم يجب أن تبقى في مكانها؛ أما الاقتراحات فيمكن أن تتغيّر."
    misconceptions:
      - id: MC-P12-003
        when: [a]
        feedback:
          en: "In A, \"My orders\" is in a new place every day. Customers have to search for it each time."
          ar: "في A، «طلباتي» في مكان جديد كل يوم. فيضطر العملاء للبحث عنها كل مرة."
    hints:
      - { en: "Where is \"My orders\" in each version, today and yesterday?", ar: "أين «طلباتي» في كل نسخة، اليوم وأمس؟" }
      - { en: "Which parts should change, and which should stay?", ar: "أي الأجزاء يجب أن تتغيّر، وأيها يجب أن يبقى؟" }
    correct:
      en: "Right. Fixed menu, smart suggestions."
      ar: "صحيح. قائمة ثابتة، واقتراحات ذكية."
    explain:
      en: "Use AI where variety helps, and keep the things people rely on in the same place."
      ar: "استخدم الذكاء الاصطناعي حيث يفيد التنوّع، وأبقِ ما يعتمد عليه الناس في نفس المكان."

  - id: S07
    type: choose
    skill: SK-P12-U01-01
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. User Needs (People + AI): question whether adding AI will improve the product at all. Fix the real need first."
      ar: "حالة جديدة. احتياجات المستخدم (People + AI): اسأل إن كانت إضافة الذكاء الاصطناعي ستحسّن المنتج أصلًا. أصلح الاحتياج الحقيقي أولًا."
    ref: { url: "https://pair.withgoogle.com/chapter/user-needs/", quote: "It’s important to question whether adding AI to your product will improve it." }
    scenario:
      en: "I build a bus ticket app. The team wants an AI chat assistant. Our top complaint: people can't find how to get a refund. The refund button is hidden in Settings."
      ar: "أبني تطبيقًا لتذاكر الحافلات. والفريق يريد مساعد محادثة بالذكاء الاصطناعي. وأكبر شكوى عندنا: الناس لا يجدون كيف يستردّون المال. وزر الاسترداد مخفي في الإعدادات."
    prompt:
      en: "What should we do first?"
      ar: "ماذا يجب أن نفعل أولًا؟"
    options:
      - { id: bot, text: { en: "Build the AI chat, so it can explain where the refund button is", ar: "نبني محادثة الذكاء الاصطناعي، لتشرح مكان زر الاسترداد" } }
      - { id: move, text: { en: "Put a \"Refund\" button on each ticket", ar: "نضع زر «استرداد» على كل تذكرة" } }
      - { id: predict, text: { en: "Build AI that predicts who will ask for a refund", ar: "نبني ذكاءً اصطناعيًا يتوقّع من سيطلب الاسترداد" } }
    answer: [move]
    misconceptions:
      - id: MC-P12-001
        when: [bot, predict]
        feedback:
          en: "The problem is a hidden button. AI would work around it; moving the button fixes it."
          ar: "المشكلة زر مخفي. والذكاء الاصطناعي سيلتفّ حولها؛ أما نقل الزر فيحلّها."
    hints:
      - { en: "What exactly are people struggling with?", ar: "ما الذي يعانيه الناس بالضبط؟" }
      - { en: "Which option removes the problem itself?", ar: "أي خيار يُزيل المشكلة نفسها؟" }
    correct:
      en: "Right. Fix the real problem; it may not need AI at all."
      ar: "صحيح. أصلح المشكلة الحقيقية؛ وقد لا تحتاج ذكاءً اصطناعيًا أبدًا."
    explain:
      en: "AI that explains a confusing design is a patch. First make the design clear."
      ar: "الذكاء الاصطناعي الذي يشرح تصميمًا مُربكًا مجرد ترقيع. اجعل التصميم واضحًا أولًا."

  - id: S08
    type: card
    part: recap
    icons: [target, ok, idea, list]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Problem first:** you asked what customers struggle with before talking about AI.\n- **Simple rule:** you chose \"Repeat last order\" over an AI guess.\n- **Good fit for AI:** you picked personal recipe ideas.\n- **Keep it predictable:** you kept the menu fixed and put AI in one section.\n- **Fix the cause:** you moved the refund button instead of adding a chat.\n\nNext lesson: should AI do the task, or help people do it?"
      ar: "- **المشكلة أولًا:** سألت عمّا يعانيه العملاء قبل الحديث عن الذكاء الاصطناعي.\n- **قاعدة بسيطة:** اخترت «كرّر الطلب السابق» بدل تخمين الذكاء الاصطناعي.\n- **مناسب للذكاء الاصطناعي:** اخترت أفكار الوصفات الشخصية.\n- **أبقِه متوقّعًا:** أبقيت القائمة ثابتة ووضعت الذكاء الاصطناعي في قسم واحد.\n- **أصلح السبب:** نقلت زر الاسترداد بدل إضافة محادثة.\n\nالدرس التالي: هل يقوم الذكاء الاصطناعي بالمهمة، أم يساعد الناس على القيام بها؟"
