steps:
  # SK-P10-U01-01: put the deciding facts first
  - id: S01
    type: tune
    skill: SK-P10-U01-01
    part: retest
    value:
      en: "Re-test, page order (NN/g): reserve the top of the page for high-priority content. Yara decides by the showtimes, so they come before Buy and before the club banner."
      ar: "إعادة اختبار، ترتيب الصفحة (NN/g): خصّص أعلى الصفحة للمحتوى الأهم. تقرّر يارا حسب مواعيد العرض، فتأتي قبل زر الشراء وقبل إعلان النادي."
    ref: { url: "https://www.nngroup.com/articles/scrolling-and-attention/", quote: "Reserve the top of the page for high-priority content" }
    scenario:
      en: "Yara wants to see the film The Last Lighthouse tonight, but only in a showing that starts after 20:00. She opens the cinema's film page on her phone."
      ar: "تريد يارا مشاهدة فيلم «المنارة الأخيرة» الليلة، لكن فقط في عرض يبدأ بعد الساعة 20:00. تفتح صفحة الفيلم في موقع السينما من هاتفها."
    prompt:
      en: "Try each order. Which one should ship?"
      ar: "جرّب كل ترتيب. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 400
      blocks:
        - &y_club { kind: banner, text: { en: "Join the Film Club: 2 tickets for 1 on Mondays", ar: "انضم إلى نادي الأفلام: تذكرتان بسعر واحدة أيام الاثنين" } }
        - &y_trailer { kind: image, size: l, text: { en: "Trailer: The Last Lighthouse", ar: "الإعلان التشويقي: المنارة الأخيرة" }, gap: m }
        - &y_title { kind: title, text: { en: "The Last Lighthouse", ar: "المنارة الأخيرة" }, gap: m }
        - &y_buy { kind: button, text: { en: "Buy tickets", ar: "اشترِ التذاكر" }, gap: m }
        - &y_times { kind: meta, text: { en: "Tonight: 17:30 · 20:15 · 22:45", ar: "الليلة: 17:30 · 20:15 · 22:45" }, gap: s }
        - &y_len { kind: small, text: { en: "1 h 52 min · Hall 3", ar: "ساعة و52 دقيقة · القاعة 3" }, gap: s }
    options:
      - id: buy
        text: { en: "Buy tickets at the very top, then everything else", ar: "زر «اشترِ التذاكر» في الأعلى تمامًا، ثم كل شيء آخر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - { kind: button, text: { en: "Buy tickets", ar: "اشترِ التذاكر" } }
            - { kind: banner, text: { en: "Join the Film Club: 2 tickets for 1 on Mondays", ar: "انضم إلى نادي الأفلام: تذكرتان بسعر واحدة أيام الاثنين" }, gap: m }
            - *y_trailer
            - *y_title
            - *y_times
            - *y_len
      - id: facts
        text: { en: "Film, tonight's times and length first, then Buy; the trailer and club banner after", ar: "الفيلم ومواعيد الليلة ومدته أولًا، ثم زر الشراء؛ والإعلان التشويقي وإعلان النادي بعدها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - { kind: title, text: { en: "The Last Lighthouse", ar: "المنارة الأخيرة" } }
            - *y_times
            - *y_len
            - *y_buy
            - { kind: image, size: m, text: { en: "Trailer: The Last Lighthouse", ar: "الإعلان التشويقي: المنارة الأخيرة" }, gap: l }
            - { kind: link, text: { en: "Join the Film Club: 2 tickets for 1 on Mondays", ar: "انضم إلى نادي الأفلام: تذكرتان بسعر واحدة أيام الاثنين" }, gap: m }
      - id: smaller
        text: { en: "Keep the order, but make the club banner smaller", ar: "أبقِ الترتيب، لكن صغّر إعلان النادي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - { kind: small, text: { en: "Join the Film Club: 2 tickets for 1 on Mondays", ar: "انضم إلى نادي الأفلام: تذكرتان بسعر واحدة أيام الاثنين" } }
            - *y_trailer
            - *y_title
            - *y_buy
            - *y_times
            - *y_len
    answer: [facts]
    misconceptions:
      - id: MC-P10-006
        when: [buy]
        feedback:
          en: "Now Yara is asked to buy before she sees whether any showing starts after 20:00. Put the times first, then the button."
          ar: "الآن يُطلب من يارا أن تشتري قبل أن ترى هل يبدأ أي عرض بعد الساعة 20:00. ضع المواعيد أولًا، ثم الزر."
      - id: MC-P10-015
        when: [smaller]
        feedback:
          en: "The trailer and the banner still come before the times, and Buy still sits above them. A smaller promotion still blocks the decision."
          ar: "ما زال الإعلان التشويقي والإعلان الترويجي قبل المواعيد، وما زال زر الشراء فوقها. الترويج الأصغر ما زال يعرقل القرار."
    correct:
      en: "Right. Yara sees 20:15 first, then buys."
      ar: "صحيح. ترى يارا موعد 20:15 أولًا، ثم تشتري."
    explain:
      en: "The top of the screen goes to what Yara decides with: the film, tonight's times and the length. Buy follows those facts, and the trailer and club offer can wait below."
      ar: "أعلى الشاشة لما تقرّر به يارا: الفيلم ومواعيد الليلة ومدته. يأتي زر الشراء بعد هذه المعلومات، ويمكن أن ينتظر الإعلان التشويقي وعرض النادي في الأسفل."

  - id: S02
    type: tune
    skill: SK-P10-U01-01
    part: retest
    value:
      en: "Re-test, page order (NN/g): reserve the top of the page for high-priority content. Hesham needs stock and pickup time before he taps Refill; tips and app promotion come later."
      ar: "إعادة اختبار، ترتيب الصفحة (NN/g): خصّص أعلى الصفحة للمحتوى الأهم. يحتاج هشام إلى معرفة التوفّر وموعد الاستلام قبل أن يضغط «أعد الصرف»؛ والنصائح وترويج التطبيق لاحقًا."
    ref: { url: "https://www.nngroup.com/articles/scrolling-and-attention/", quote: "Reserve the top of the page for high-priority content" }
    scenario:
      en: "Hesham refills his blood-pressure medicine every month. Before he orders, he needs to know that it's in stock at his branch and when he can pick it up."
      ar: "يعيد هشام صرف دواء الضغط كل شهر. وقبل أن يطلب، يحتاج أن يعرف أن الدواء متوفّر في فرعه، ومتى يستطيع استلامه."
    prompt:
      en: "Try each order. Which one should ship?"
      ar: "جرّب كل ترتيب. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 400
      blocks:
        - &h_app { kind: banner, text: { en: "Get our app and save 5% on every order", ar: "حمّل تطبيقنا ووفّر 5% على كل طلب" } }
        - &h_tips { kind: image, size: m, text: { en: "Health tips: 5 ways to sleep better", ar: "نصائح صحية: 5 طرق لنوم أفضل" }, gap: m }
        - &h_refill { kind: button, text: { en: "Refill", ar: "أعد الصرف" }, gap: m }
        - &h_med { kind: title, text: { en: "Amlodipine 5 mg, 30 tablets", ar: "أملوديبين 5 ملغ، 30 قرصًا" }, gap: m }
        - &h_stock { kind: meta, text: { en: "In stock at the Nasr City branch", ar: "متوفّر في فرع مدينة نصر" }, gap: s }
        - &h_ready { kind: meta, text: { en: "Ready for pickup in 2 hours · 85 EGP", ar: "جاهز للاستلام خلال ساعتين · 85 جنيهًا" }, gap: s }
    options:
      - id: smaller
        text: { en: "Keep the order, but make the health tips smaller", ar: "أبقِ الترتيب، لكن صغّر النصائح الصحية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - *h_app
            - { kind: small, text: { en: "Health tips: 5 ways to sleep better", ar: "نصائح صحية: 5 طرق لنوم أفضل" }, gap: m }
            - *h_refill
            - *h_med
            - *h_stock
            - *h_ready
      - id: button
        text: { en: "Refill at the very top, then everything else", ar: "زر «أعد الصرف» في الأعلى تمامًا، ثم كل شيء آخر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - { kind: button, text: { en: "Refill", ar: "أعد الصرف" } }
            - { kind: banner, text: { en: "Get our app and save 5% on every order", ar: "حمّل تطبيقنا ووفّر 5% على كل طلب" }, gap: m }
            - *h_tips
            - *h_med
            - *h_stock
            - *h_ready
      - id: facts
        text: { en: "Medicine, stock and pickup time first, then Refill; the tips and app offer after", ar: "الدواء والتوفّر وموعد الاستلام أولًا، ثم «أعد الصرف»؛ والنصائح وعرض التطبيق بعدها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 400
          blocks:
            - { kind: title, text: { en: "Amlodipine 5 mg, 30 tablets", ar: "أملوديبين 5 ملغ، 30 قرصًا" } }
            - *h_stock
            - *h_ready
            - *h_refill
            - { kind: image, size: s, text: { en: "Health tips: 5 ways to sleep better", ar: "نصائح صحية: 5 طرق لنوم أفضل" }, gap: l }
            - { kind: link, text: { en: "Get our app and save 5% on every order", ar: "حمّل تطبيقنا ووفّر 5% على كل طلب" }, gap: m }
    answer: [facts]
    misconceptions:
      - id: MC-P10-015
        when: [smaller]
        feedback:
          en: "The app banner and the tips still come first, and Refill still sits above the stock and pickup time. Smaller promotion is still in the way."
          ar: "ما زال إعلان التطبيق والنصائح في البداية، وما زال «أعد الصرف» فوق التوفّر وموعد الاستلام. الترويج الأصغر ما زال يعترض الطريق."
      - id: MC-P10-006
        when: [button]
        feedback:
          en: "Now Hesham is asked to refill before he knows the medicine is at his branch. The button belongs after the facts it depends on."
          ar: "الآن يُطلب من هشام أن يعيد الصرف قبل أن يعرف أن الدواء موجود في فرعه. مكان الزر بعد المعلومات التي يعتمد عليها."
    correct:
      en: "Right. Hesham sees it's in stock and ready in 2 hours, then refills."
      ar: "صحيح. يرى هشام أن الدواء متوفّر وجاهز خلال ساعتين، ثم يعيد الصرف."
    explain:
      en: "Hesham decides with three facts: which medicine, whether his branch has it, and when it's ready. Those go first, then Refill. The tips and the app offer move below."
      ar: "يقرّر هشام بثلاث معلومات: أي دواء، وهل هو في فرعه، ومتى يكون جاهزًا. تأتي هذه أولًا، ثم «أعد الصرف». وتنتقل النصائح وعرض التطبيق إلى الأسفل."

  # SK-P10-U01-02: no more than two things big
  - id: S03
    type: tune
    skill: SK-P10-U01-02
    part: retest
    value:
      en: "Re-test, visual hierarchy (NN/g): limit how many elements are big to a maximum of 2. Mariam picks a class by its date, so the class name and date lead."
      ar: "إعادة اختبار، التسلسل البصري (NN/g): لا تكبّر أكثر من عنصرين. تختار مريم الورشة حسب تاريخها، فيقود اسم الورشة وتاريخها."
    ref: { url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/", quote: "Limit how many elements are big to a maximum of 2" }
    scenario:
      en: "Mariam is choosing a cooking class. She can only come on a Friday, so she checks the date of each class first. The class page shows five facts, and all of them are big and bold."
      ar: "تختار مريم ورشة طبخ. تستطيع الحضور يوم الجمعة فقط، لذلك تتحقّق من تاريخ كل ورشة أولًا. تعرض صفحة الورشة خمس معلومات، وكلها كبيرة وبخط عريض."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &m_name { en: "Homemade Pasta", ar: "المعكرونة المنزلية" } }
        - { kind: title, text: &m_date { en: "Friday 4 December, 16:00", ar: "الجمعة 4 ديسمبر، الساعة 16:00" }, gap: s }
        - { kind: title, text: &m_place { en: "Zamalek Kitchen Studio", ar: "استوديو المطبخ بالزمالك" }, gap: s }
        - { kind: title, text: &m_price { en: "450 EGP, ingredients included", ar: "450 جنيهًا، شاملة المكوّنات" }, gap: s }
        - { kind: title, text: &m_seats { en: "6 seats left", ar: "باقي 6 مقاعد" }, gap: s }
        - { kind: button, text: &m_book { en: "Book a seat", ar: "احجز مقعدًا" }, gap: m }
    options:
      - id: two
        text: { en: "Class name biggest, date second, the rest in regular text", ar: "اسم الورشة الأكبر، والتاريخ ثانيًا، والباقي بخط عادي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *m_name }
            - { kind: heading, text: *m_date, gap: s }
            - { kind: meta, text: *m_place, gap: s }
            - { kind: meta, text: *m_price, gap: s }
            - { kind: chip, text: *m_seats, gap: s }
            - { kind: button, text: *m_book, gap: m }
      - id: photo
        text: { en: "Add a big photo of the chef at the top, and make all the facts small", ar: "أضف صورة كبيرة للطاهي في الأعلى، واجعل كل المعلومات صغيرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: l, text: { en: "Photo: the chef smiling", ar: "صورة: الطاهي يبتسم" } }
            - { kind: small, text: *m_name, gap: m }
            - { kind: small, text: *m_date, gap: s }
            - { kind: small, text: *m_place, gap: s }
            - { kind: small, text: *m_price, gap: s }
            - { kind: small, text: *m_seats, gap: s }
            - { kind: button, text: *m_book, gap: m }
      - id: colors
        text: { en: "Keep all five big, and give each one its own color", ar: "أبقِ الخمس كبيرة، وأعطِ كل واحدة لونًا مختلفًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *m_name }
            - { kind: title, color: brand, text: *m_date, gap: s }
            - { kind: title, color: green, text: *m_place, gap: s }
            - { kind: title, color: orange, text: *m_price, gap: s }
            - { kind: title, color: red, text: *m_seats, gap: s }
            - { kind: button, text: *m_book, gap: m }
    answer: [two]
    misconceptions:
      - id: MC-P10-001
        when: [photo]
        feedback:
          en: "Now the biggest thing is a photo that tells Mariam nothing about the date. Size should follow what she decides with."
          ar: "الآن أكبر شيء صورة لا تخبر مريم بشيء عن التاريخ. يجب أن يتبع الحجم ما تقرّر به."
      - id: MC-P10-003
        when: [colors]
        feedback:
          en: "Five big lines in five colors still compete, so none of them leads. Pick two to make big."
          ar: "خمسة أسطر كبيرة بخمسة ألوان ما زالت تتنافس، فلا يقود أيّ منها. اختر اثنين فقط لتكبيرهما."
    correct:
      en: "Right. The name and the Friday date lead; the rest is easy to scan."
      ar: "صحيح. يقود الاسمُ وتاريخُ الجمعة، ويسهل تصفّح الباقي."
    explain:
      en: "Two big things at most: the class name, and the date Mariam chooses by. Place, price and seats stay readable in regular text, so they don't fight for attention."
      ar: "شيئان كبيران كحدّ أقصى: اسم الورشة، والتاريخ الذي تختار به مريم. ويبقى المكان والسعر والمقاعد مقروءة بخط عادي، فلا تتنافس على الانتباه."

  - id: S04
    type: tune
    skill: SK-P10-U01-02
    part: retest
    value:
      en: "Re-test, visual hierarchy (NN/g): limit how many elements are big to a maximum of 2. Adel compares cars by price per day, so the car and its price lead."
      ar: "إعادة اختبار، التسلسل البصري (NN/g): لا تكبّر أكثر من عنصرين. يقارن عادل السيارات حسب السعر اليومي، فتقود السيارة وسعرها."
    ref: { url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/", quote: "Limit how many elements are big to a maximum of 2" }
    scenario:
      en: "Adel is renting a car for a weekend trip. He scrolls through the cars and compares them by their price per day. Each car card has five big lines."
      ar: "يستأجر عادل سيارة لرحلة في عطلة نهاية الأسبوع. يتصفّح السيارات ويقارن بينها حسب السعر اليومي. وفي بطاقة كل سيارة خمسة أسطر كبيرة."
    prompt:
      en: "Try each version of the car card. Which one should ship?"
      ar: "جرّب كل نسخة من بطاقة السيارة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &a_car { en: "Hatchback, 2023", ar: "Hatchback، موديل 2023" } }
        - { kind: title, text: &a_price { en: "1,100 EGP a day", ar: "1,100 جنيه في اليوم" }, gap: s }
        - { kind: title, text: &a_seats { en: "5 seats · automatic", ar: "5 مقاعد · ناقل حركة أوتوماتيكي" }, gap: s }
        - { kind: title, text: &a_fuel { en: "Full to full fuel", ar: "الوقود: استلام وتسليم بخزان ممتلئ" }, gap: s }
        - { kind: title, text: &a_free { en: "Free cancellation", ar: "إلغاء مجاني" }, gap: s }
        - { kind: button, text: &a_pick { en: "Choose this car", ar: "اختر هذه السيارة" }, gap: m }
    options:
      - id: badge
        text: { en: "Make Free cancellation the biggest thing, as a badge", ar: "اجعل «إلغاء مجاني» أكبر شيء، على شكل شارة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, color: green, text: *a_free }
            - { kind: meta, text: *a_car, gap: s }
            - { kind: meta, text: *a_price, gap: s }
            - { kind: meta, text: *a_seats, gap: s }
            - { kind: meta, text: *a_fuel, gap: s }
            - { kind: button, text: *a_pick, gap: m }
      - id: bigger
        text: { en: "Make all five lines even bigger, so they stand out", ar: "كبّر الأسطر الخمسة أكثر، حتى تبرز" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, px: 26, text: *a_car }
            - { kind: title, px: 26, text: *a_price, gap: s }
            - { kind: title, px: 26, text: *a_seats, gap: s }
            - { kind: title, px: 26, text: *a_fuel, gap: s }
            - { kind: title, px: 26, text: *a_free, gap: s }
            - { kind: button, text: *a_pick, gap: m }
      - id: two
        text: { en: "Car and price per day big; seats, fuel and cancellation in regular text", ar: "السيارة والسعر اليومي كبيران؛ والمقاعد والوقود والإلغاء بخط عادي" }
