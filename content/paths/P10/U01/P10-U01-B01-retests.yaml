            - { kind: link, text: *r_tripl, gap: s }
            - { kind: button, text: *r_pay, gap: m }
      - id: showall
        text: { en: "Show the time, class and full luggage rules, all at the same size", ar: "اعرض الموعد والدرجة وقواعد الأمتعة كاملة، كلها بالحجم نفسه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *r_route }
            - { kind: small, text: &r_time { en: "Departs 08:10 from Ramses, arrives 17:40", ar: "المغادرة 08:10 من رمسيس، والوصول 17:40" }, gap: s }
            - { kind: small, text: &r_class { en: "First class, seat 14B", ar: "الدرجة الأولى، مقعد 14B" }, gap: s }
            - { kind: small, text: *r_lug, gap: s }
            - { kind: button, text: *r_pay, gap: m }
      - id: split
        text: { en: "Show the time and class; put the luggage rules behind a \"Luggage rules\" link", ar: "اعرض الموعد والدرجة؛ وضع قواعد الأمتعة خلف رابط «قواعد الأمتعة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *r_route }
            - { kind: meta, text: *r_time, gap: s }
            - { kind: meta, text: *r_class, gap: s }
            - { kind: button, text: *r_pay, gap: m }
            - { kind: link, text: *r_lugh, gap: m }
    answer: [split]
    misconceptions:
      - id: MC-P10-008
        when: [hideall]
        feedback:
          en: "Almost every traveler needs the time and class, and now all of them must open a link to see them. Keep what most people need in view."
          ar: "تقريبًا كل مسافر يحتاج إلى الموعد والدرجة، والآن عليهم جميعًا فتح رابط لرؤيتها. أبقِ ما يحتاجه معظم الناس ظاهرًا."
      - id: MC-P10-016
        when: [showall]
        feedback:
          en: "The time and class are back, but the long luggage rules sit at the same weight and bury them. Show the few things most people need first."
          ar: "عاد الموعد والدرجة، لكن قواعد الأمتعة الطويلة بالوزن نفسه وتطغى عليهما. اعرض أولًا الأشياء القليلة التي يحتاجها معظم الناس."
    correct:
