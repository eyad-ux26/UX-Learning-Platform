    explain:
      en: "What almost everyone checks stays on the screen. What few people need goes behind a link named for exactly what's there."
      ar: "ما يتحقّق منه الجميع تقريبًا يبقى على الشاشة. وما يحتاجه قليلون يذهب خلف رابط يحمل اسم ما خلفه تمامًا."

