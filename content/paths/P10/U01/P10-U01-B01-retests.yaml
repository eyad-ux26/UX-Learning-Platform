            - { kind: small, text: { en: "Ready on Thursday after 14:00", ar: "جاهز يوم الخميس بعد الساعة 14:00" }, gap: s }
            - { kind: small, text: { en: "Warranty: 90 days on parts and labor. Not covered: liquid damage, drops, software problems, batteries older than 2 years, repairs by others…", ar: "الضمان: 90 يومًا على القطع والعمل. لا يشمل: تلف السوائل، والسقوط، ومشاكل البرامج، والبطاريات الأقدم من سنتين، والإصلاح لدى غيرنا…" }, gap: s }
            - { kind: small, text: { en: "Parts: keyboard (1), screen hinge (2), screws (8), thermal paste, cleaning…", ar: "القطع: لوحة مفاتيح (1)، مفصل الشاشة (2)، مسامير (8)، معجون حراري، تنظيف…" }, gap: s }
            - { kind: button, text: *z_ok, gap: m }
    answer: [split]
    misconceptions:
      - id: MC-P10-008
        when: [closed]
        feedback:
          en: "Every customer still has to open two sections to learn the cost and date. Don't close what everyone needs."
          ar: "ما زال على كل عميل فتح قسمين ليعرف التكلفة والموعد. لا تُغلق ما يحتاجه الجميع."
      - id: MC-P10-016
        when: [open]
        feedback:
          en: "Now the cost and date are buried in the long warranty and parts text. Show the few things everyone needs first."
          ar: "الآن التكلفة والموعد مدفونان في نص الضمان والقطع الطويل. اعرض أولًا الأشياء القليلة التي يحتاجها الجميع."
    correct:
      en: "Right. Ziad sees the cost and date at once, and the rest is there if he wants it."
      ar: "صحيح. يرى زياد التكلفة والموعد فورًا، والباقي متاح إن أراده."
    explain:
      en: "Show the few things every customer needs, here the cost and the ready date, and keep the specialised details one clearly named tap away."
      ar: "اعرض الأشياء القليلة التي يحتاجها كل عميل، وهي هنا التكلفة وموعد الجاهزية، واجعل التفاصيل المتخصّصة على بعد ضغطة واحدة باسم واضح."

  # SK-P10-U01-05: hide details in few, clearly named levels
  - id: S09
    type: tune
    skill: SK-P10-U01-05
    part: retest
    value:
      en: "Re-test, progressive disclosure (NN/g): designs that go beyond 2 disclosure levels typically have low usability, and the link should set clear expectations."
      ar: "إعادة اختبار، الإفصاح التدريجي (NN/g): التصميمات التي تتجاوز مستويين من الإخفاء تكون عادةً صعبة الاستخدام، ويجب أن يوضّح الرابط ما خلفه."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "beyond 2 disclosure levels typically have low usability" }
    scenario:
      en: "Salwa signed up for an English course and wants to know if she can get a refund after the first lesson. On the course page, the refund rule is behind More, then Policies, then Refunds."
      ar: "سجّلت سلوى في دورة لغة إنجليزية، وتريد أن تعرف هل يمكنها استرداد المبلغ بعد الدرس الأول. في صفحة الدورة، قاعدة الاسترداد خلف «المزيد»، ثم «السياسات»، ثم «الاسترداد»."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &s_t { en: "English B1, evenings", ar: "الإنجليزية B1، دورة مسائية" } }
        - { kind: meta, text: &s_m { en: "Starts 6 December · 12 lessons · 2,400 EGP", ar: "تبدأ 6 ديسمبر · 12 درسًا · 2,400 جنيه" }, gap: s }
        - { kind: link, text: { en: "More › Policies › Refunds", ar: "المزيد › السياسات › الاسترداد" }, gap: s }
    options:
      - id: direct
        text: { en: "One link named \"Refund rules\" that opens the rule directly", ar: "رابط واحد باسم «قواعد الاسترداد» يفتح القاعدة مباشرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *s_t }
            - { kind: meta, text: *s_m, gap: s }
            - { kind: link, text: { en: "Refund rules", ar: "قواعد الاسترداد" }, gap: s }
            - { kind: small, text: { en: "Opens: Full refund until the second lesson starts.", ar: "يفتح: استرداد كامل حتى بداية الدرس الثاني." }, gap: xs }
      - id: rename
        text: { en: "Keep the three levels, but rename More to \"Click here\"", ar: "أبقِ المستويات الثلاثة، لكن غيّر اسم «المزيد» إلى «اضغط هنا»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *s_t }
            - { kind: meta, text: *s_m, gap: s }
            - { kind: link, text: { en: "Click here › Policies › Refunds", ar: "اضغط هنا › السياسات › الاسترداد" }, gap: s }
      - id: search
        text: { en: "Keep the three levels, and add a search box on the Policies page", ar: "أبقِ المستويات الثلاثة، وأضف مربع بحث في صفحة «السياسات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *s_t }
            - { kind: meta, text: *s_m, gap: s }
            - { kind: link, text: { en: "More › Policies (with search) › Refunds", ar: "المزيد › السياسات (مع بحث) › الاسترداد" }, gap: s }
    answer: [direct]
    misconceptions:
      - id: MC-P10-007
        when: [rename]
        feedback:
          en: "\"Click here\" tells Salwa even less than More about what's behind it, and the rule is still three levels deep."
          ar: "«اضغط هنا» يخبر سلوى بأقل مما يخبرها به «المزيد» عمّا خلفه، والقاعدة ما زالت على عمق ثلاثة مستويات."
      - id: MC-P10-010
        when: [search]
        feedback:
          en: "Search inside the second level still leaves three levels to get through. Link straight to the rule."
          ar: "البحث داخل المستوى الثاني ما زال يترك ثلاثة مستويات للوصول. اربط مباشرة بالقاعدة."
    correct:
      en: "Right. One clearly named link, one level deep."
      ar: "صحيح. رابط واحد باسم واضح، على عمق مستوى واحد."
    explain:
      en: "Keep hidden details within two levels, and name the link by what's behind it, so Salwa knows before she taps that her answer is there."
      ar: "أبقِ التفاصيل المخفية ضمن مستويين، وسمِّ الرابط بما خلفه، حتى تعرف سلوى قبل أن تضغط أن إجابتها هناك."

  - id: S10
    type: tune
    skill: SK-P10-U01-05
    part: retest
    value:
      en: "Re-test, staged disclosure (NN/g): splitting steps is problematic when the steps are interdependent and users must alternate between them. Bassem picks by size and rent together."
      ar: "إعادة اختبار، الإفصاح على مراحل (NN/g): تقسيم الخطوات مشكلة عندما تعتمد الخطوات على بعضها ويضطر المستخدمون للتنقّل بينها. يختار باسم حسب المساحة والإيجار معًا."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "It is problematic when the steps are interdependent and users must alternate between them." }
    scenario:
      en: "Bassem is renting a flat. He wants the biggest one he can afford, so he weighs size against rent. The app asks him to pick a flat by size on step 1, and shows the rent only on step 2."
      ar: "يستأجر باسم شقة. يريد أكبر شقة يستطيع دفع إيجارها، لذلك يوازن بين المساحة والإيجار. يطلب التطبيق منه اختيار الشقة حسب المساحة في الخطوة 1، ولا يعرض الإيجار إلا في الخطوة 2."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: step 1 of 2", ar: "الآن: الخطوة 1 من 2" }
      blocks:
        - { kind: heading, text: { en: "Pick a flat", ar: "اختر شقة" } }
        - { kind: radio, text: { en: "Flat A · 90 m²", ar: "شقة A · 90 م²" }, gap: s }
        - { kind: radio, text: { en: "Flat B · 110 m²", ar: "شقة B · 110 م²" }, gap: xs }
        - { kind: radio, text: { en: "Flat C · 140 m²", ar: "شقة C · 140 م²" }, gap: xs }
        - { kind: button, text: { en: "Next: see the rent", ar: "التالي: اعرض الإيجار" }, gap: m }
    options:
      - id: back
        text: { en: "Keep the two steps, and add a Back button on step 2", ar: "أبقِ الخطوتين، وأضف زر «رجوع» في الخطوة 2" }
        mock:
          caption: { en: "After this change: step 2 of 2", ar: "بعد هذا التغيير: الخطوة 2 من 2" }
          blocks:
            - { kind: heading, text: { en: "Rent for Flat B", ar: "إيجار شقة B" } }
            - { kind: meta, text: { en: "9,500 EGP a month", ar: "9,500 جنيه في الشهر" }, gap: s }
            - kind: row
              gap: m
              blocks:
                - { kind: button, style: plain, text: { en: "Back", ar: "رجوع" } }
                - { kind: button, text: { en: "Continue", ar: "متابعة" } }
      - id: link
        text: { en: "One step, with each flat's rent behind a \"Price details\" link", ar: "خطوة واحدة، وإيجار كل شقة خلف رابط «تفاصيل السعر»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: { en: "Pick a flat", ar: "اختر شقة" } }
            - { kind: radio, text: { en: "Flat A · 90 m²", ar: "شقة A · 90 م²" }, gap: s }
            - { kind: link, text: { en: "Price details", ar: "تفاصيل السعر" }, gap: xs }
            - { kind: radio, text: { en: "Flat B · 110 m²", ar: "شقة B · 110 م²" }, gap: s }
            - { kind: link, text: { en: "Price details", ar: "تفاصيل السعر" }, gap: xs }
            - { kind: radio, text: { en: "Flat C · 140 m²", ar: "شقة C · 140 م²" }, gap: s }
            - { kind: link, text: { en: "Price details", ar: "تفاصيل السعر" }, gap: xs }
      - id: together
        text: { en: "One step that shows each flat's size and rent together", ar: "خطوة واحدة تعرض مساحة كل شقة وإيجارها معًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: { en: "Pick a flat", ar: "اختر شقة" } }
            - { kind: radio, text: { en: "Flat A · 90 m² · 7,800 EGP a month", ar: "شقة A · 90 م² · 7,800 جنيه شهريًا" }, gap: s }
            - { kind: radio, text: { en: "Flat B · 110 m² · 9,500 EGP a month", ar: "شقة B · 110 م² · 9,500 جنيه شهريًا" }, gap: xs }
            - { kind: radio, text: { en: "Flat C · 140 m² · 13,000 EGP a month", ar: "شقة C · 140 م² · 13,000 جنيه شهريًا" }, gap: xs }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: [together]
    misconceptions:
      - id: MC-P10-011
        when: [back, link]
        feedback:
          en: "Bassem still has to go back and forth to see size and rent side by side. What's decided together belongs on one screen."
          ar: "ما زال على باسم التنقّل ذهابًا وإيابًا ليرى المساحة والإيجار جنبًا إلى جنب. ما يُقرَّر معًا مكانه شاشة واحدة."
    correct:
      en: "Right. Bassem weighs size against rent in one look."
      ar: "صحيح. يوازن باسم بين المساحة والإيجار بنظرة واحدة."
    explain:
      en: "Splitting a choice into steps only helps when the steps don't depend on each other. Size and rent are weighed together, so they stay on one screen."
      ar: "تقسيم الاختيار إلى خطوات يفيد فقط عندما لا تعتمد الخطوات على بعضها. المساحة والإيجار يُوزنان معًا، لذلك يبقيان في شاشة واحدة."

  # SK-P10-U01-06: don't make content look like an ad
  - id: S11
    type: tune
    skill: SK-P10-U01-06
    part: retest
    value:
      en: "Re-test, banner blindness (NN/g): do not make content look like ads. The order deadline is real content, so a flashing ad-style banner is likely to be skipped."
      ar: "إعادة اختبار، عمى الإعلانات (NN/g): لا تجعل المحتوى يشبه الإعلانات. آخر موعد للطلب محتوى حقيقي، لذلك قد يتخطّاه الناس إن ظهر كشريط إعلاني لامع."
    ref: { url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/", quote: "Do not make content look like ads." }
    scenario:
      en: "Amira pre-orders bread and cakes from a bakery for the next morning. Orders close at 18:00 the day before. Customers keep missing that deadline."
      ar: "تطلب أميرة الخبز والكعك مسبقًا من مخبز لصباح اليوم التالي. يُغلق باب الطلب الساعة 18:00 في اليوم السابق. والعملاء يفوّتون هذا الموعد مرارًا."
    prompt:
      en: "Try each way to show the deadline. Which one should ship?"
      ar: "جرّب كل طريقة لعرض آخر موعد. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: banner, text: &am_ban { en: "LIMITED! Order before 18:00!!", ar: "عرض محدود! اطلب قبل 18:00!!" } }
        - { kind: title, text: &am_t { en: "Tomorrow's order", ar: "طلب الغد" }, gap: m }
        - { kind: meta, text: &am_i { en: "2 baguettes · 6 croissants · 95 EGP", ar: "2 باجيت · 6 كرواسون · 95 جنيهًا" }, gap: s }
        - { kind: button, text: &am_b { en: "Place order", ar: "أرسل الطلب" }, gap: m }
    options:
      - id: louder
        text: { en: "Make the banner brighter and add a bell icon", ar: "اجعل الشريط أكثر لمعانًا وأضف أيقونة جرس" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: banner, text: { en: "🔔 LIMITED! Order before 18:00!!", ar: "🔔 عرض محدود! اطلب قبل 18:00!!" } }
            - { kind: title, text: *am_t, gap: m }
            - { kind: meta, text: *am_i, gap: s }
            - { kind: button, text: *am_b, gap: m }
      - id: plain
        text: { en: "Show \"Order by 18:00 today for tomorrow morning\" as plain text above the button", ar: "اعرض «اطلب قبل 18:00 اليوم لصباح الغد» كنص عادي فوق الزر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *am_t }
            - { kind: meta, text: *am_i, gap: s }
            - { kind: text, text: { en: "Order by 18:00 today for tomorrow morning.", ar: "اطلب قبل 18:00 اليوم لصباح الغد." }, gap: m }
            - { kind: button, text: *am_b, gap: s }
      - id: side
        text: { en: "Move the banner to the bottom, next to the coupon offers", ar: "انقل الشريط إلى الأسفل، بجانب عروض الكوبونات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *am_t }
            - { kind: meta, text: *am_i, gap: s }
            - { kind: button, text: *am_b, gap: m }
            - kind: row
              gap: l
              blocks:
                - { kind: banner, text: { en: "Order before 18:00!!", ar: "اطلب قبل 18:00!!" } }
                - { kind: banner, text: { en: "20% off cakes", ar: "خصم 20% على الكعك" } }
    answer: [plain]
    misconceptions:
      - id: MC-P10-013
        when: [louder]
        feedback:
          en: "A brighter, flashier box looks even more like an ad, so people are even more likely to skip it."
          ar: "الصندوق الأكثر لمعانًا يشبه الإعلان أكثر، فيزيد احتمال أن يتخطّاه الناس."
      - id: MC-P10-014
        when: [side]
        feedback:
          en: "Next to the coupon offers, the deadline sits in an ad's place and looks like one. People skip that whole area."
          ar: "بجانب عروض الكوبونات، يجلس آخر موعد في مكان الإعلانات ويبدو مثلها. والناس يتخطّون هذه المنطقة كلها."
    correct:
      en: "Right. The deadline reads as part of the order, right where Amira decides."
      ar: "صحيح. يُقرأ آخر موعد كجزء من الطلب، في المكان الذي تقرّر فيه أميرة."
    explain:
      en: "Content styled like an ad gets ignored. Plain text next to the order and its button reads as part of the task, so people notice it."
      ar: "المحتوى المصمّم كإعلان يُتجاهل. أما النص العادي بجانب الطلب وزره فيُقرأ كجزء من المهمة، فيلاحظه الناس."

  - id: S12
    type: tune
    skill: SK-P10-U01-06
    part: retest
    value:
      en: "Re-test, banner blindness (NN/g): do not mix content and ads in the same visual section. The pitch rules sit between two sponsor boxes, so they read as one more ad."
      ar: "إعادة اختبار، عمى الإعلانات (NN/g): لا تخلط المحتوى والإعلانات في القسم البصري نفسه. قواعد الملعب بين صندوقين للرعاة، فتُقرأ كإعلان آخر."
    ref: { url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/", quote: "Do not mix content and ads in the same visual section." }
    scenario:
      en: "Fady books a five-a-side football pitch for Friday night. The pitch only allows flat shoes, and players who come in studs are turned away. The rule sits in a box between two sponsor ads."
      ar: "يحجز فادي ملعب كرة خماسي ليلة الجمعة. الملعب يسمح بالأحذية المسطّحة فقط، ومن يأتي بحذاء ذي مسامير يُمنع من اللعب. والقاعدة في صندوق بين إعلانين للرعاة."
    prompt:
      en: "Try each place for the rule. Which one should ship?"
      ar: "جرّب كل مكان للقاعدة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &f_t { en: "Pitch 2 · Friday 21:00", ar: "ملعب 2 · الجمعة 21:00" } }
        - { kind: meta, text: &f_m { en: "1 hour · 600 EGP", ar: "ساعة واحدة · 600 جنيه" }, gap: s }
        - { kind: button, text: &f_b { en: "Book the pitch", ar: "احجز الملعب" }, gap: m }
        - kind: row
          gap: l
          blocks:
            - { kind: banner, text: &f_ad1 { en: "Sports drinks, buy 2 get 1", ar: "مشروبات رياضية، اشترِ 2 واحصل على 1" } }
            - { kind: banner, text: &f_rule { en: "Flat shoes only, no studs", ar: "أحذية مسطّحة فقط، بدون مسامير" } }
            - { kind: banner, text: &f_ad2 { en: "New boots, 30% off", ar: "أحذية جديدة، خصم 30%" } }
    options:
      - id: details
        text: { en: "Put the rule as plain text in the booking details, away from the sponsor boxes", ar: "ضع القاعدة كنص عادي ضمن تفاصيل الحجز، بعيدًا عن صناديق الرعاة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *f_t }
            - { kind: meta, text: *f_m, gap: s }
            - { kind: meta, text: { en: "Flat shoes only. Players in studs can't play.", ar: "أحذية مسطّحة فقط. لا يُسمح باللعب بحذاء ذي مسامير." }, gap: s }
            - { kind: button, text: *f_b, gap: m }
            - kind: row
              gap: xl
              blocks:
                - { kind: banner, text: *f_ad1 }
                - { kind: banner, text: *f_ad2 }
      - id: bigger
        text: { en: "Keep it between the ads, but make its box twice as big", ar: "أبقِها بين الإعلانات، لكن اجعل صندوقها ضعف الحجم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *f_t }
            - { kind: meta, text: *f_m, gap: s }
            - { kind: button, text: *f_b, gap: m }
            - kind: row
              gap: l
              blocks:
                - { kind: banner, text: *f_ad1 }
                - { kind: banner, size: l, px: 20, text: *f_rule }
                - { kind: banner, text: *f_ad2 }
      - id: top
        text: { en: "Turn the rule into a colorful banner at the top of the page", ar: "حوّل القاعدة إلى شريط ملوّن في أعلى الصفحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: banner, text: { en: "⚽ Flat shoes only, no studs! ⚽", ar: "⚽ أحذية مسطّحة فقط، بدون مسامير! ⚽" } }
            - { kind: title, text: *f_t, gap: m }
            - { kind: meta, text: *f_m, gap: s }
            - { kind: button, text: *f_b, gap: m }
            - kind: row
              gap: l
              blocks:
                - { kind: banner, text: *f_ad1 }
                - { kind: banner, text: *f_ad2 }
    answer: [details]
    misconceptions:
      - id: MC-P10-014
        when: [bigger]
        feedback:
          en: "A bigger box between two ads still sits in the ad area and looks like a third ad. Size doesn't fix the place."
          ar: "الصندوق الأكبر بين إعلانين ما زال في منطقة الإعلانات ويبدو كإعلان ثالث. الحجم لا يُصلح المكان."
      - id: MC-P10-013
        when: [top]
        feedback:
          en: "A colorful banner is the classic look of an ad, so people skip it on sight. Make the rule look like the booking details."
          ar: "الشريط الملوّن هو الشكل المعتاد للإعلان، فيتخطّاه الناس فور رؤيته. اجعل القاعدة تشبه تفاصيل الحجز."
    correct:
      en: "Right. The rule reads as part of the booking, not as an offer."
      ar: "صحيح. تُقرأ القاعدة كجزء من الحجز، لا كعرض ترويجي."
    explain:
      en: "Keep content and ads in separate sections. A rule placed with the booking details, styled like them, gets read; the same rule among sponsor boxes gets skipped."
      ar: "افصل المحتوى عن الإعلانات في أقسام مختلفة. القاعدة الموضوعة مع تفاصيل الحجز وبشكلها تُقرأ؛ أما القاعدة نفسها بين صناديق الرعاة فتُتخطّى."

  # SK-P10-U01-07: use photos that carry information
  - id: S13
    type: tune
    skill: SK-P10-U01-07
    part: retest
    value:
      en: "Re-test, photos (NN/g): users ignore stock photos of generic people but pay attention to information-carrying images. A photo of the actual exhibition helps Dina decide."
      ar: "إعادة اختبار، الصور (NN/g): يتجاهل المستخدمون صور الـ Stock العامة لأشخاص عاديين، وينتبهون للصور التي تحمل معلومة. صورة المعرض نفسه تساعد دينا على القرار."
    ref: { url: "https://www.nngroup.com/articles/photos-as-web-content/", quote: "users ignore stock photos of generic people" }
    scenario:
      en: "Dina is deciding whether the museum's new exhibition, Old Cairo Maps, is worth the trip. The exhibition page shows one large photo."
      ar: "تفكّر دينا هل يستحق المعرض الجديد في المتحف، «خرائط القاهرة القديمة»، المشوار إليه. تعرض صفحة المعرض صورة واحدة كبيرة."
    prompt:
      en: "Try each photo. Which one should ship?"
      ar: "جرّب كل صورة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: image, size: l, text: { en: "Photo: a smiling family taking a selfie", ar: "صورة: عائلة تبتسم وتلتقط صورة سيلفي" } }
        - { kind: title, text: &d_t { en: "Old Cairo Maps", ar: "خرائط القاهرة القديمة" }, gap: m }
        - { kind: meta, text: &d_m { en: "Until 31 January · 150 EGP", ar: "حتى 31 يناير · 150 جنيهًا" }, gap: s }
        - { kind: button, text: &d_b { en: "Buy a ticket", ar: "اشترِ تذكرة" }, gap: m }
    options:
      - id: larger
        text: { en: "Keep the family photo, but make it full-screen", ar: "أبقِ صورة العائلة، لكن اجعلها بملء الشاشة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: xl, text: { en: "Photo: a smiling family taking a selfie", ar: "صورة: عائلة تبتسم وتلتقط صورة سيلفي" } }
            - { kind: title, text: *d_t, gap: m }
            - { kind: meta, text: *d_m, gap: s }
            - { kind: button, text: *d_b, gap: m }
      - id: couple
        text: { en: "Swap it for a photo of a happy couple holding tickets", ar: "استبدلها بصورة لزوجين سعيدين يحملان التذاكر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: l, text: { en: "Photo: a happy couple holding tickets", ar: "صورة: زوجان سعيدان يحملان التذاكر" } }
            - { kind: title, text: *d_t, gap: m }
            - { kind: meta, text: *d_m, gap: s }
            - { kind: button, text: *d_b, gap: m }
      - id: hall
        text: { en: "Swap it for a photo of the hall, showing the maps on display", ar: "استبدلها بصورة للقاعة تُظهر الخرائط المعروضة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: l, text: { en: "Photo: the hall, with large 1800s maps of Cairo on the walls", ar: "صورة: القاعة، وعلى جدرانها خرائط كبيرة للقاهرة من القرن التاسع عشر" } }
            - { kind: title, text: *d_t, gap: m }
            - { kind: meta, text: *d_m, gap: s }
            - { kind: button, text: *d_b, gap: m }
    answer: [hall]
    misconceptions:
      - id: MC-P10-012
        when: [larger, couple]
        feedback:
          en: "A photo of generic, smiling people tells Dina nothing about the maps, so people skip it, however big it is."
          ar: "صورة أشخاص عاديين يبتسمون لا تخبر دينا بشيء عن الخرائط، لذلك يتخطّاها الناس مهما كان حجمها."
    correct:
      en: "Right. Dina can see what she'd go to see."
      ar: "صحيح. تستطيع دينا أن ترى ما ستذهب لتراه."
    explain:
      en: "Photos earn their space when they carry information for the task. Here that's the maps themselves; generic happy people are decoration that gets ignored."
      ar: "تستحق الصورة مساحتها عندما تحمل معلومة تخدم المهمة. وهنا المعلومة هي الخرائط نفسها؛ أما الأشخاص السعداء العاديون فزينة يتجاهلها الناس."

  - id: S14
    type: tune
    skill: SK-P10-U01-07
    part: retest
    value:
      en: "Re-test, photos (NN/g): users pay attention to information-carrying images. For a used phone, photos of that exact phone, scratch included, are the content buyers decide with."
      ar: "إعادة اختبار، الصور (NN/g): ينتبه المستخدمون للصور التي تحمل معلومة. في حالة هاتف مستعمل، صور الهاتف نفسه بما فيها الخدش هي المحتوى الذي يقرّر به المشترون."
    ref: { url: "https://www.nngroup.com/articles/photos-as-web-content/", quote: "users pay attention to information-carrying images" }
    scenario:
      en: "Khaled is selling his used phone on a marketplace app. It works well but has one scratch on the back. Buyers want to see its real condition before they message him."
      ar: "يبيع خالد هاتفه المستعمل على تطبيق للبيع والشراء. الهاتف يعمل جيدًا، لكن فيه خدش واحد في الخلف. ويريد المشترون رؤية حالته الحقيقية قبل أن يراسلوه."
    prompt:
      en: "Try each version of the listing. Which one should ship?"
      ar: "جرّب كل نسخة من الإعلان. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: image, size: l, text: { en: "Photo: a brand-new phone from the maker's ad", ar: "صورة: هاتف جديد تمامًا من إعلان الشركة المصنّعة" } }
        - { kind: title, text: &k_t { en: "Used phone, 128 GB", ar: "هاتف مستعمل، 128 جيجابايت" }, gap: m }
        - { kind: meta, text: &k_m { en: "7,500 EGP · one scratch on the back", ar: "7,500 جنيه · خدش واحد في الخلف" }, gap: s }
        - { kind: button, text: &k_b { en: "Message Khaled", ar: "راسل خالد" }, gap: m }
    options:
      - id: stock
        text: { en: "Use a photo of a person smiling at a phone", ar: "استخدم صورة لشخص يبتسم أمام هاتف" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: l, text: { en: "Photo: a person smiling at a phone", ar: "صورة: شخص يبتسم أمام هاتف" } }
            - { kind: title, text: *k_t, gap: m }
            - { kind: meta, text: *k_m, gap: s }
            - { kind: button, text: *k_b, gap: m }
      - id: real
        text: { en: "Use photos of this phone, front and back, with the scratch visible", ar: "استخدم صورًا لهذا الهاتف، من الأمام والخلف، والخدش ظاهر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - kind: row
              blocks:
                - { kind: image, size: m, text: { en: "Photo: the front, screen on", ar: "صورة: الواجهة والشاشة تعمل" } }
                - { kind: image, size: m, text: { en: "Photo: the back, with the scratch", ar: "صورة: الخلف، مع الخدش" } }
            - { kind: title, text: *k_t, gap: m }
            - { kind: meta, text: *k_m, gap: s }
            - { kind: button, text: *k_b, gap: m }
      - id: none
        text: { en: "Remove the photo to keep the listing short", ar: "احذف الصورة ليبقى الإعلان قصيرًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *k_t }
            - { kind: meta, text: *k_m, gap: s }
            - { kind: button, text: *k_b, gap: m }
    answer: [real]
    misconceptions:
      - id: MC-P10-012
        when: [stock]
        feedback:
          en: "A generic photo of someone smiling tells buyers nothing about this phone, so they skip it."
          ar: "الصورة العامة لشخص يبتسم لا تخبر المشترين بشيء عن هذا الهاتف، فيتخطّونها."
      - id: MC-P10-018
        when: [none]
        feedback:
          en: "Here the photo is the content: buyers want to see the real phone and its scratch. Removing it removes what they decide with."
          ar: "الصورة هنا هي المحتوى: يريد المشترون رؤية الهاتف الحقيقي وخدشه. وحذفها يحذف ما يقرّرون به."
    correct:
      en: "Right. Buyers see the real condition before they message."
      ar: "صحيح. يرى المشترون الحالة الحقيقية قبل أن يراسلوا."
    explain:
      en: "A photo that shows the real thing people are deciding about is information, not decoration. Stock images get ignored; the real phone and its scratch get studied."
      ar: "الصورة التي تُظهر الشيء الحقيقي الذي يقرّر الناس بشأنه معلومة، لا زينة. صور الـ Stock يتجاهلها الناس، أما الهاتف الحقيقي وخدشه فيتأمّلونهما."
