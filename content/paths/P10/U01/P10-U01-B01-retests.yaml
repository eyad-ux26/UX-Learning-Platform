        text: { en: "Shorten it to the first sentence only", ar: "اختصره إلى الجملة الأولى فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *n_name }
            - { kind: text, text: { en: "Welcome! Since 2009, our caring team has loved animals of every kind.", ar: "أهلًا بكم! منذ 2009 وفريقنا يحب الحيوانات بكل أنواعها." }, gap: s }
