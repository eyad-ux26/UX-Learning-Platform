  # SK-P10-U01-04: keep what most people need in view
  - id: S07
    type: tune
    skill: SK-P10-U01-04
    part: retest
    value:
      en: "Re-test, progressive disclosure (NN/g): disclose everything users frequently need up front. Almost everyone checks the time and seat class; few read the luggage rules."
      ar: "إعادة اختبار، الإفصاح التدريجي (NN/g): اعرض في الواجهة كل ما يحتاجه المستخدمون كثيرًا. تقريبًا الجميع يتحقّق من الموعد ودرجة المقعد؛ وقليلون يقرؤون قواعد الأمتعة."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "You have to disclose everything that users frequently need up front" }
    scenario:
      en: "On the train booking page, almost every traveler checks the departure time and the seat class before paying. Few read the full luggage rules. Right now the page shows the luggage rules in full, and the time and class are behind a link."
      ar: "في صفحة حجز القطار، يتحقّق كل المسافرين تقريبًا من موعد المغادرة ودرجة المقعد قبل الدفع. وقليلون يقرؤون قواعد الأمتعة كاملة. الآن تعرض الصفحة قواعد الأمتعة كاملة، أما الموعد والدرجة فخلف رابط."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &r_route { en: "Cairo to Luxor", ar: "القاهرة إلى الأقصر" } }
        - { kind: link, text: &r_tripl { en: "Trip details", ar: "تفاصيل الرحلة" }, gap: s }
        - { kind: heading, text: &r_lugh { en: "Luggage rules", ar: "قواعد الأمتعة" }, gap: m }
        - { kind: small, text: &r_lug { en: "2 bags up to 23 kg each. Bicycles must be folded. Musical instruments over 1 m need a separate ticket. Pets travel in a closed carrier.", ar: "حقيبتان حتى 23 كغ لكل منهما. يجب طيّ الدراجات. الآلات الموسيقية الأطول من متر تحتاج تذكرة منفصلة. تسافر الحيوانات الأليفة في صندوق مغلق." }, gap: s }
        - { kind: button, text: &r_pay { en: "Pay 640 EGP", ar: "ادفع 640 جنيهًا" }, gap: m }
    options:
      - id: hideall
        text: { en: "Put everything behind \"Trip details\" to keep the page clean", ar: "ضع كل شيء خلف «تفاصيل الرحلة» لتبقى الصفحة نظيفة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
