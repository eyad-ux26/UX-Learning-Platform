id: P10-U01-L02
mode: lesson
minutes: 8
title:
  en: "Needed isn't the same as big"
  ar: "الضروري ليس هو الأكبر"
review_labels:
  MC-P10-002: { en: "Supporting doesn't mean hidden", ar: "المساند لا يعني المخفي" }
  MC-P10-009: { en: "Small is fine, unreadable isn't", ar: "الصغير مقبول، غير المقروء لا" }
  MC-P10-010: { en: "Make room by moving things, not deleting facts", ar: "أفسح المجال بالنقل، لا بحذف المعلومات" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "A cleaner page?", ar: "صفحة أنظف؟" }
    body:
      en: "Your team wants Sara's workshop page to look cleaner. Someone suggests a quick fix: put the date and the conditions under \"More details\", so only the photo, title and button stay visible.\n\nIt does look calmer. Is it better for Sara?"
      ar: "يريد فريقك أن تبدو صفحة ورشة سارة أنظف. اقترح أحدهم حلًا سريعًا: وضع التاريخ والشروط تحت «تفاصيل أكثر»، بحيث يبقى ظاهرًا فقط الصورة والعنوان والزر.\n\nتبدو الصفحة أهدأ فعلًا. لكن هل هي أفضل لسارة؟"
    mock: &tidy
      blocks:
        - { kind: image, size: l, text: "@W1i", region: photo }
        - { kind: title, text: "@W1a", gap: m, region: title }
        - { kind: link, text: "@W1more", gap: s, region: more }
        - { kind: button, text: "@W1f", gap: m, region: button }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    prompt:
      en: "The date and the conditions are now behind \"More details\". What can't Sara do without an extra tap?"
      ar: "أصبح الموعد والشروط خلف «تفاصيل أكثر». ما الذي لا تستطيع سارة فعله دون ضغطة إضافية؟"
    options:
      - { id: btn, text: { en: "Find the Reserve button", ar: "أن تجد زر «احجز مكانك»" } }
      - { id: photo, text: { en: "See the photo", ar: "أن ترى الصورة" } }
      - { id: decide, text: { en: "Check whether the time works and what she's agreeing to", ar: "أن تتأكد من مناسبة الموعد ومما توافق عليه" } }
    answer: [decide]
    misconceptions:
      - id: MC-P10-002
        when: [photo, btn]
        feedback:
          en: "Those are still on screen. What went behind the tap is exactly what she decides with."
          ar: "هذان ما زالا على الشاشة. أما ما اختفى خلف الضغطة فهو بالضبط ما تبني عليه قرارها."
    correct:
      en: "The page looks calmer, but the decision moved behind a tap."
      ar: "الصفحة تبدو أهدأ، لكن القرار انتقل خلف ضغطة."
    explain:
      en: "Most visitors never open \"More details\". Hiding what they decide with makes the page cleaner and the decision harder. Below the fold is fine; behind a tap usually means unseen."
      ar: "أغلب الزوار لا يفتحون «تفاصيل أكثر» أبدًا. وإخفاء ما يبنون عليه قرارهم يجعل الصفحة أنظف والقرار أصعب. أن يكون العنصر أسفل الـ Fold مقبول، أما خلف ضغطة فغالبًا يعني أنه لن يُرى."
  - id: S03
    type: card
    part: concept
    icons: [target, layers, cut]
    title: { en: "Priority and presence", ar: "الأولوية والحضور" }
    body:
      en: "Two separate questions: how prominent should this be, and must it be there before the action?\n\n- **Decide now:** what the visitor decides with. Prominent.\n- **Supporting:** smaller, but still on the way to the button.\n- **Optional:** can shrink, move down, or go.\n\nBelow the fold isn't missing. Hidden behind a tap often is."
      ar: "سؤالان منفصلان: ما مدى بروز هذا العنصر؟ وهل يجب أن يكون موجودًا قبل الإجراء؟\n\n- **أساسي للقرار:** ما يبني عليه الزائر قراره. بارز.\n- **مساند:** أصغر، لكنه يبقى في الطريق إلى الزر.\n- **اختياري:** يمكن تصغيره أو نقله للأسفل أو حذفه.\n\nأن يكون العنصر أسفل الـ Fold لا يعني أنه مفقود. أما إخفاؤه خلف ضغطة فغالبًا يعني ذلك."
  - id: S04
    type: sort
    part: guided
    rules: [R06, R15]
    prompt:
      en: "Label everything on Sara's page."
      ar: "صنّف كل ما في صفحة سارة."
    items:
      - { id: W1a, text: "@W1a" }
      - { id: W1b, text: "@W1b" }
      - { id: W1c, text: "@W1c" }
      - { id: W1d, text: "@W1d" }
      - { id: W1e, text: "@W1e" }
      - { id: W1f, text: "@W1f" }
      - { id: W1g, text: "@W1g" }
      - { id: W1h, text: "@W1h" }
      - { id: W1i, text: "@W1i" }
      - { id: W1j, text: "@W1j" }
    buckets:
      - { id: now, label: { en: "Decide now", ar: "أساسي للقرار" } }
      - { id: sup, label: { en: "Supporting", ar: "مساند" } }
      - { id: opt, label: { en: "Optional", ar: "اختياري" } }
    answer:
      now: [W1a, W1b, W1c, W1d, W1e, W1f]
      sup: [W1g, W1h]
      opt: [W1i, W1j]
    also_ok:
      - answer:
          now: [W1a, W1b, W1c, W1d, W1e, W1f, W1g]
          sup: [W1h]
          opt: [W1i, W1j]
        feedback:
          en: "That works too. Treating cancellation as part of the decision is reasonable, as long as access details stay on the page."
          ar: "هذا صحيح أيضًا. اعتبار الإلغاء جزءًا من القرار منطقي، ما دامت تفاصيل الدخول باقية في الصفحة."
    misconceptions:
      - id: MC-P10-002
        when: { item: W1g, bucket: opt }
        feedback:
          en: "If cancellation is optional it could disappear, and Sara would commit without knowing the rule. It can be small, but it stays."
          ar: "إذا كان الإلغاء اختياريًا فقد يختفي، وستلتزم سارة دون أن تعرف الشرط. يمكن أن يكون صغيرًا، لكنه يبقى."
      - id: MC-P10-011
        when: { item: W1h, bucket: opt }
        feedback:
          en: "For someone who needs step-free access, this link decides whether they can come at all. Keep it on the page."
          ar: "لمن يحتاج الدخول دون سلالم، هذا الرابط يحدّد إن كان يستطيع الحضور أصلًا. أبقِه في الصفحة."
      - id: MC-P10-001
        when: { item: W1i, bucket: now }
        feedback:
          en: "The photo is the biggest thing on the page, but Sara doesn't decide anything with it."
          ar: "الصورة أكبر شيء في الصفحة، لكن سارة لا تبني عليها أي قرار."
      - id: MC-P10-003
        when: { item: W1b, bucket: opt }
        feedback:
          en: "The time is exactly what Sara checks first. It can't be optional."
          ar: "الوقت هو بالضبط ما تتحقّق منه سارة أولًا. لا يمكن أن يكون اختياريًا."
    hints:
      - { en: "Optional means the page still works if it disappears. Test each item against that.", ar: "اختياري يعني أن الصفحة تعمل حتى لو اختفى العنصر. اختبر كل عنصر بهذا." }
      - { en: "Two items are small but must stay before Reserve: one about changing plans, one about getting in.", ar: "عنصران صغيران لكن يجب أن يبقيا قبل «احجز»: أحدهما عن تغيير الخطط، والآخر عن الدخول." }
    correct:
      en: "Six decide, two support, two are optional."
      ar: "ستة للقرار، اثنان مساندان، واثنان اختياريان."
    explain:
      en: "Decide now: title, time, place, price, places left, and the button. Supporting: cancellation and access, which are smaller but must be reachable before Reserve. Optional: the photo and the newsletter, which the page works without."
      ar: "أساسي للقرار: العنوان والوقت والمكان والسعر والأماكن المتبقية والزر. مساند: الإلغاء والدخول، فهما أصغر لكن يجب الوصول إليهما قبل «احجز». اختياري: الصورة والنشرة، فالصفحة تعمل بدونهما."

  - id: S05
    type: spot
    part: guided
    rules: [R06, R15]
    prompt:
      en: "On the cleaner page, which part stops Sara from deciding?"
      ar: "في الصفحة الأنظف، أي جزء يمنع سارة من اتخاذ قرارها؟"
    mock: *tidy
    regions:
      - { id: photo, label: { en: "The photo", ar: "الصورة" } }
      - { id: title, label: { en: "The title", ar: "العنوان" } }
      - { id: more, label: { en: "The \"More details\" link", ar: "رابط «تفاصيل أكثر»" } }
      - { id: button, label: { en: "The Reserve button", ar: "زر «احجز»" } }
    answer: [more]
    misconceptions:
      - id: MC-P10-001
        when: [photo]
        feedback:
          en: "The photo takes space, but it isn't what blocks the decision. Something Sara needs is now behind a tap."
          ar: "الصورة تأخذ مساحة، لكنها ليست ما يعطّل القرار. هناك شيء تحتاجه سارة أصبح خلف ضغطة."
      - id: MC-P10-012
        when: [button]
        feedback:
          en: "The button is fine on its own. The problem is what Sara can't see before she reaches it."
          ar: "الزر سليم في حدّ ذاته. المشكلة فيما لا تراه سارة قبل أن تصل إليه."
    hints:
      - { en: "Where did the date go?", ar: "أين ذهب التاريخ؟" }
    correct:
      en: "The date, price and conditions are now behind a tap, so Sara can reserve without seeing them."
      ar: "التاريخ والسعر والشروط أصبحت خلف ضغطة، لذلك قد تحجز سارة دون أن تراها."
    explain:
      en: "The page got calmer by removing the decision, not by organizing it. \"More details\" hides the facts Sara decides with. A calmer page that keeps them visible is possible; we'll build one."
      ar: "أصبحت الصفحة أهدأ بحذف القرار، لا بتنظيمه. «تفاصيل أكثر» تخفي المعلومات التي تبني عليها سارة قرارها. يمكن صنع صفحة هادئة تبقيها ظاهرة، وسنفعل ذلك."

  - id: S06
    type: choose
    part: guided
    confidence: true
    rules: [R06, R15]
    prompt:
      en: "On a small phone, the date gets pushed below the fold. What's the best fix?"
      ar: "على هاتف صغير، ينزل التاريخ إلى أسفل الجزء الظاهر من الشاشة. ما أفضل حل؟"
    options:
      - { id: tooltip, text: { en: "Move the date into a tooltip", ar: "انقل التاريخ إلى تلميح منبثق (tooltip)" } }
      - { id: remove, text: { en: "Remove the date line", ar: "احذف سطر التاريخ" } }
      - { id: photo, text: { en: "Shrink or drop the photo so the details move up", ar: "صغّر الصورة أو احذفها حتى تصعد التفاصيل" } }
      - { id: tiny, text: { en: "Make the date text very small so it fits", ar: "صغّر نص التاريخ جدًا حتى يتّسع" } }
    answer: [photo]
    misconceptions:
      - id: MC-P10-010
        when: [remove, tooltip]
        feedback:
          en: "That makes room by removing a fact Sara decides with. Make room by moving or shrinking what's optional instead."
          ar: "هذا يفسح المجال بحذف معلومة تبني عليها سارة قرارها. أفسح المجال بنقل الاختياري أو تصغيره بدلًا من ذلك."
      - id: MC-P10-009
        when: [tiny]
        feedback:
          en: "Tiny text is technically there, but hard to read. The date is a \"decide now\" item; it should be easy to read."
          ar: "النص الصغير جدًا موجود نظريًا، لكن قراءته صعبة. التاريخ من عناصر «أساسي للقرار»، ويجب أن تكون قراءته سهلة."
    hints:
      - { en: "Which item on the page is optional?", ar: "أي عنصر في الصفحة اختياري؟" }
    correct:
      en: "Shrink what's optional to make room for what decides."
      ar: "صغّر الاختياري لتفسح المجال لما يحسم القرار."
    explain:
      en: "When space is tight, change the arrangement, not the facts. The photo is optional, so it gives way. The date stays, readable."
      ar: "عندما تضيق المساحة، غيّر الترتيب لا المعلومات. الصورة اختيارية، لذلك تفسح المجال. ويبقى التاريخ مقروءًا."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, R15]
    prompt:
      en: "Both versions keep the cancellation rule. In which one can Sara actually read it?"
      ar: "في النسختين شرط الإلغاء موجود. في أيّهما تستطيع سارة قراءته فعلًا؟"
    a:
      mock:
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: meta, text: "@W1b", gap: s }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: small, tone: faint, text: "@W1g", gap: s }
    b:
      mock:
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: meta, text: "@W1b", gap: s }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: small, text: "@W1g", gap: s }
    answer: b
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: compete, text: { en: "Faint text competes less with the button", ar: "النص الباهت ينافس الزر بدرجة أقل" } }
        - { id: read, text: { en: "Small is fine; it still has to be readable", ar: "الصغير مقبول، لكن يجب أن يبقى مقروءًا" } }
      answer: [read]
      misconceptions:
        - id: MC-P10-009
          when: [compete]
          feedback:
            en: "It does compete less, because almost nobody can read it. Lower emphasis should come from size and position, not from making text hard to read."
            ar: "هو ينافس أقل فعلًا، لأن لا أحد تقريبًا يستطيع قراءته. التقليل من البروز يجب أن يأتي من الحجم والموضع، لا من جعل النص صعب القراءة."
    misconceptions:
      - id: MC-P10-009
        when: [a]
        feedback:
          en: "In A the rule is so faint it's barely there. Supporting can be smaller, but not unreadable."
          ar: "في A الشرط باهت لدرجة أنه يكاد لا يُرى. المعلومة المساندة يمكن أن تكون أصغر، لكن لا يصح أن تكون غير مقروءة."
    correct:
      en: "B is quieter than the button and still easy to read."
      ar: "في B الشرط أهدأ من الزر، وقراءته ما زالت سهلة."
    explain:
      en: "Both have the rule in the same place and size. A fades it to near-invisible, which is hiding it in plain sight. You'll learn exact contrast checks in Unit 3; for now, the test is simple: could Sara read it on a sunny street?"
      ar: "الشرط في المكان والحجم نفسيهما في النسختين. لكن A تجعله باهتًا حتى يكاد يختفي، وهذا إخفاء أمام العين. ستتعلّم قياس الـ Contrast بدقة في الوحدة 3؛ أما الآن فالاختبار بسيط: هل تستطيع سارة قراءته في الشارع تحت الشمس؟"

  - id: S08
    type: choose
    part: independent
    rules: [R14, R19]
    scenario:
      en: "Mariam is collecting a prescription from a pharmacy after work. The pickup page shows four things."
      ar: "تستلم مريم وصفة طبية من صيدلية بعد العمل. تعرض صفحة الاستلام أربعة أشياء."
    prompt:
      en: "Which one can be optional?"
      ar: "أيّها يمكن أن يكون اختياريًا؟"
    options:
      - { id: id, text: { en: "Bring your ID to collect", ar: "أحضر بطاقة الهوية للاستلام" } }
      - { id: window, text: { en: "Ready for pickup today, 16:00–21:00", ar: "جاهزة للاستلام اليوم من 16:00 إلى 21:00" } }
      - { id: address, text: { en: "Pharmacy address and map", ar: "عنوان الصيدلية والخريطة" } }
      - { id: promo, text: { en: "Try our new vitamins, 15% off", ar: "جرّبي فيتاميناتنا الجديدة بخصم 15%" } }
    answer: [promo]
    misconceptions:
      - id: MC-P10-002
        when: [id]
        feedback:
          en: "If Mariam arrives without ID, the trip is wasted. Like Sara's cancellation rule, it's a small condition that must come before she acts."
          ar: "إذا وصلت مريم بدون هوية، تضيع الرحلة. مثل شرط الإلغاء عند سارة، هذا شرط صغير يجب أن يأتي قبل أن تتصرّف."
      - id: MC-P10-003
        when: [window, address]
        feedback:
          en: "Mariam needs to know when and where to go. Those decide whether she can collect today."
          ar: "تحتاج مريم أن تعرف متى وأين تذهب. هذه تحدّد إن كانت تستطيع الاستلام اليوم."
    correct:
      en: "Same skill, different page."
      ar: "المهارة نفسها، في صفحة مختلفة."
    explain:
      en: "When, where, and the ID condition decide whether Mariam's trip works. The vitamins offer doesn't change that, so it's the one that can shrink or go."
      ar: "متى وأين وشرط الهوية تحدّد إن كانت رحلة مريم ستنجح. عرض الفيتامينات لا يغيّر ذلك، لذلك هو ما يمكن تصغيره أو حذفه."

  - id: S09
    type: choose
    part: independent
    confidence: true
    rules: [R14, R10]
    prompt:
      en: "Back on Sara's page: when should the step-free access link move up into \"Decide now\"?"
      ar: "عودة إلى صفحة سارة: متى يجب أن ينتقل رابط الدخول دون سلالم إلى «أساسي للقرار»؟"
    options:
      - { id: long, text: { en: "When the page gets too long", ar: "عندما تصبح الصفحة طويلة جدًا" } }
      - { id: brand, text: { en: "When the brand team asks for it", ar: "عندما يطلب فريق العلامة التجارية ذلك" } }
      - { id: never, text: { en: "Never; it's always supporting", ar: "أبدًا؛ هو مساند دائمًا" } }
      - { id: need, text: { en: "When the page is for visitors who often need step-free access", ar: "عندما تكون الصفحة لزوّار يحتاجون كثيرًا إلى الدخول دون سلالم" } }
    answer: [need]
    reason:
      prompt: { en: "Why does that change it?", ar: "لماذا يغيّر ذلك ترتيبه؟" }
      options:
        - { id: rule, text: { en: "Accessibility links always go at the top", ar: "روابط إتاحة الوصول تأتي في الأعلى دائمًا" } }
        - { id: decides, text: { en: "For those visitors, it decides whether they can attend at all", ar: "لهؤلاء الزوّار، هو ما يحدّد إن كانوا يستطيعون الحضور أصلًا" } }
      answer: [decides]
      misconceptions:
        - id: MC-P10-013
          when: [rule]
          feedback:
            en: "There's no fixed position rule. It moves up because, for these visitors, it becomes part of the decision."
            ar: "لا توجد قاعدة ثابتة للموضع. ينتقل للأعلى لأنه يصبح جزءًا من القرار عند هؤلاء الزوّار."
    misconceptions:
      - id: MC-P10-008
        when: [never]
        feedback:
          en: "The labels aren't fixed. They follow who the visitor is and what they're deciding."
          ar: "التصنيفات ليست ثابتة. هي تتبع من هو الزائر وما الذي يقرّره."
      - id: MC-P10-014
        when: [long, brand]
        feedback:
          en: "Length and stakeholder requests don't change what the visitor decides with. Who the visitor is does."
          ar: "طول الصفحة وطلبات أصحاب المصلحة لا تغيّر ما يبني عليه الزائر قراره. أما هوية الزائر فتغيّره."
    correct:
      en: "Priority follows the visitor's decision."
      ar: "الأولوية تتبع قرار الزائر."
    explain:
      en: "\"Decide now\", \"Supporting\" and \"Optional\" are working labels, not permanent ones. For a visitor who uses a wheelchair, access is the first fact they check."
      ar: "«أساسي للقرار» و«مساند» و«اختياري» تصنيفات عملية لا دائمة. للزائر الذي يستخدم كرسيًا متحركًا، الدخول هو أول ما يتحقّق منه."

  - id: S10
    type: card
    part: recap
    icons: [layers, eye, cut]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- How prominent something is and whether it's there are separate decisions.\n- Small is fine; unreadable isn't.\n- Make room by shrinking or moving what's optional, not by hiding facts.\n\nNext lesson: when promotion competes with the decision."
      ar: "- مدى بروز العنصر وضرورة وجوده قراران منفصلان.\n- الصغير مقبول، أما غير المقروء فلا.\n- أفسح المجال بتصغير الاختياري أو نقله، لا بإخفاء المعلومات.\n\nالدرس التالي: عندما ينافس الترويج القرار."
