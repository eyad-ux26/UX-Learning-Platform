id: P10-U01-L02
mode: lesson
minutes: 9
title:
  en: "What you can hide, and what you can't"
  ar: "ما يمكنك إخفاؤه، وما لا يمكنك"
sources:
  - title: { en: "Progressive Disclosure (NN/g)", ar: "الإفصاح التدريجي (NN/g)" }
    url: "https://www.nngroup.com/articles/progressive-disclosure/"
  - title: { en: "Accordions on Desktop: When and How to Use (NN/g)", ar: "الـ Accordions على الشاشات الكبيرة: متى وكيف تُستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/accordions-on-desktop/"
review_labels:
  MC-P10-002: { en: "What people often need stays up front", ar: "ما يحتاجه الناس غالبًا يبقى ظاهرًا" }
  MC-P10-007: { en: "A link's label says what's behind it", ar: "اسم الرابط يقول ما خلفه" }
  MC-P10-008: { en: "Don't collapse what everyone needs", ar: "لا تطوِ ما يحتاجه الجميع" }
  MC-P10-010: { en: "Two levels of hiding at most", ar: "مستويان من الإخفاء كحدّ أقصى" }
  MC-P10-011: { en: "Keep what's decided together on one screen", ar: "ما يُقرَّر معًا يبقى في شاشة واحدة" }
  MC-P10-016: { en: "Show the few things most people need first", ar: "اعرض أولًا الأشياء القليلة التي يحتاجها معظم الناس" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "A cleaner page?", ar: "صفحة أنظف؟" }
    body:
      en: "A teammate tidied Sara's page. The time, place, price and cancellation rule now sit behind one \"More details\" link. It looks calm.\n\nCan Sara still decide without digging?"
      ar: "رتّب أحد الزملاء صفحة سارة. أصبح الموعد والمكان والسعر وشرط الإلغاء خلف رابط واحد «تفاصيل أكثر». تبدو الصفحة هادئة.\n\nهل ما زالت سارة تستطيع أن تقرّر دون بحث؟"
    mock:
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: link, text: "@W1more", gap: s }
        - { kind: button, text: "@W1f", gap: l }

  - id: S02
    type: tune
    skill: SK-P10-U01-04
    part: try
    rules: [R12]
    value:
      en: "Progressive disclosure (NN/g): everything people frequently need must be up front; only specialised details go behind a link."
      ar: "الإفصاح التدريجي (NN/g): كل ما يحتاجه الناس كثيرًا يجب أن يكون ظاهرًا؛ والتفاصيل المتخصّصة فقط تذهب خلف رابط."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "You have to disclose everything that users frequently need up front" }
    prompt:
      en: "Almost every visitor checks the time, place and price before reserving. Few read the full cancellation terms. Try each version. Which one should ship?"
      ar: "تقريبًا كل زائر يتحقّق من الموعد والمكان والسعر قبل الحجز. وقليلون يقرؤون شروط الإلغاء كاملة. جرّب كل نسخة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: link, text: "@W1more", gap: s }
        - { kind: button, text: "@W1f", gap: l }
    options:
      - id: price
        text: { en: "Show the price; keep the time and place behind More details", ar: "اعرض السعر، وأبقِ الموعد والمكان خلف «تفاصيل أكثر»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: link, text: "@W1more", gap: s }
            - { kind: button, text: "@W1f", gap: l }
      - id: often
        text: { en: "Show the time, place and price; keep the full cancellation terms behind a link", ar: "اعرض الموعد والمكان والسعر، وأبقِ شروط الإلغاء الكاملة خلف رابط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: link, text: { en: "Cancellation terms", ar: "شروط الإلغاء" }, gap: s }
      - id: clean
        text: { en: "Keep it as it is: one clean link", ar: "أبقِها كما هي: رابط واحد نظيف" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: link, text: "@W1more", gap: s }
            - { kind: button, text: "@W1f", gap: l }
    answer: [often]
    misconceptions:
      - id: MC-P10-002
        when: [price, clean]
        feedback:
          en: "Almost everyone needs the time and place to decide. Hiding them makes nearly every visitor tap and come back. Hide only what few people need."
          ar: "تقريبًا الجميع يحتاج إلى الموعد والمكان ليقرّر. وإخفاؤهما يجعل كل زائر تقريبًا يضغط ثم يعود. أخفِ فقط ما يحتاجه القليلون."
    correct:
      en: "Show what most people need; tuck away what few do."
      ar: "اعرض ما يحتاجه معظم الناس، وأخفِ ما يحتاجه القليلون."
    explain:
      en: "A tidy page that hides the facts everyone needs isn't simpler; it just moves the work to every visitor. Decide what goes up front by how often people need it."
      ar: "الصفحة المرتّبة التي تُخفي ما يحتاجه الجميع ليست أبسط؛ بل تنقل العمل إلى كل زائر. قرّر ما يظهر أولًا حسب عدد مرات حاجة الناس إليه."

  - id: S03
    type: card
    part: concept
    icons: [eye, list, text, layers, warn]
    title: { en: "Show first, the rest on request", ar: "اعرض الأهم أولًا، والباقي عند الطلب" }
    body:
      en: "Showing the essentials first and the rest on request is called **progressive disclosure**.\n\n- **Up front:** everything people frequently need, and only that.\n- **On request:** specialised details, behind a link or a section.\n- **Clear labels:** the link says exactly what's behind it.\n- **Two levels at most:** deeper nesting gets people lost.\n- **Collapsed sections:** fine when people need a few of them; bad when they need most of them."
      ar: "عرض الأساسيات أولًا والباقي عند الطلب يُسمّى **الإفصاح التدريجي (Progressive disclosure)**.\n\n- **الظاهر أولًا:** كل ما يحتاجه الناس كثيرًا، وهذا فقط.\n- **عند الطلب:** التفاصيل المتخصّصة، خلف رابط أو قسم.\n- **أسماء واضحة:** الرابط يقول بالضبط ما خلفه.\n- **مستويان كحدّ أقصى:** التداخل الأعمق يُضيّع الناس.\n- **الأقسام المطويّة (Accordions):** مناسبة حين يحتاج الناس بعضها فقط؛ وسيّئة حين يحتاجون معظمها."

  - id: S04
    type: tune
    skill: SK-P10-U01-05
    part: guided
    rules: [R06, R13]
    value:
      en: "NN/g: label the link to the secondary level so it sets clear expectations. \"More\" tells Sara nothing about whether her question is answered there."
      ar: "NN/g: سمِّ الرابط إلى المستوى الثاني بما يوضّح ما سيأتي. «المزيد» لا يخبر سارة إن كان سؤالها يُجاب هناك."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "label the button or link in a way that sets clear expectations" }
    scenario:
      en: "Sara wants to know if she can cancel and whether the room has step-free access. Both answers are behind the link under Reserve."
      ar: "تريد سارة أن تعرف إن كانت تستطيع الإلغاء، وإن كان الدخول إلى القاعة دون سلالم. والإجابتان خلف الرابط تحت زر الحجز."
    prompt:
      en: "Try each label for that link. Which one should ship?"
      ar: "جرّب كل اسم لهذا الرابط. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: link, text: { en: "More", ar: "المزيد" }, gap: s }
    options:
      - id: more
        text: { en: "\"More\"", ar: "«المزيد»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: link, text: { en: "More", ar: "المزيد" }, gap: s }
      - id: info
        text: { en: "\"Good to know\"", ar: "«معلومات مفيدة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: link, text: { en: "Good to know", ar: "معلومات مفيدة" }, gap: s }
      - id: named
        text: { en: "\"Cancellation and step-free access\"", ar: "«الإلغاء والدخول دون سلالم»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: link, text: { en: "Cancellation and step-free access", ar: "الإلغاء والدخول دون سلالم" }, gap: s }
    answer: [named]
    misconceptions:
      - id: MC-P10-007
        when: [more, info]
        feedback:
          en: "Sara can't tell if her questions are answered there until she taps. Name what's behind the link."
          ar: "لا تعرف سارة إن كانت أسئلتها مُجابة هناك حتى تضغط. سمِّ ما خلف الرابط."
    correct:
      en: "The label tells her what she'll find."
      ar: "الاسم يخبرها بما ستجده."
    explain:
      en: "Hidden content is only as findable as its label. A specific label lets people decide whether to tap, and lets those who need it find it straight away."
      ar: "المحتوى المخفي يُوجد بقدر وضوح اسمه فقط. والاسم المحدّد يجعل الناس يقرّرون هل يضغطون، ويجعل من يحتاجه يجده فورًا."

  - id: S05
    type: tune
    skill: SK-P10-U01-04
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g on accordions: when people need most of the sections, collapsing them adds clicks and hidden content may be missed altogether. Show them open, with headings."
      ar: "NN/g عن الـ Accordions: حين يحتاج الناس معظم الأقسام، يضيف طيّها ضغطات، وقد يفوتهم المحتوى المخفي تمامًا. اعرضها مفتوحة بعناوين."
    ref: { url: "https://www.nngroup.com/articles/accordions-on-desktop/", quote: "Valuable content that is hidden under an accordion may be missed altogether." }
    scenario:
      en: "The day before the workshop, every attendee gets a \"Before you come\" page. Everyone needs all four parts of it."
      ar: "قبل الورشة بيوم، يصل لكل مشارك صفحة «قبل أن تأتي». والجميع يحتاج إلى أجزائها الأربعة كلها."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: { en: "Before you come", ar: "قبل أن تأتي" } }
        - { kind: line, text: { en: "What to bring ▾", ar: "ماذا تُحضر ▾" }, gap: m }
        - { kind: line, text: { en: "How to find the room ▾", ar: "كيف تصل إلى القاعة ▾" }, gap: xs }
        - { kind: line, text: { en: "When to arrive ▾", ar: "متى تصل ▾" }, gap: xs }
        - { kind: line, text: { en: "If you can't make it ▾", ar: "إن لم تستطع الحضور ▾" }, gap: xs }
    options:
      - id: open
        text: { en: "All four parts open, each under its own heading", ar: "الأجزاء الأربعة مفتوحة، كلٌّ تحت عنوانه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "Before you come", ar: "قبل أن تأتي" } }
            - { kind: heading, text: { en: "What to bring", ar: "ماذا تُحضر" }, gap: m }
            - { kind: text, text: { en: "Pencil and paper. No laptop needed.", ar: "قلم وورق. لا تحتاج إلى Laptop." }, gap: xs }
            - { kind: heading, text: { en: "How to find the room", ar: "كيف تصل إلى القاعة" }, gap: m }
            - { kind: text, text: { en: "Main entrance, lift to floor 1, Room 2.", ar: "المدخل الرئيسي، ثم المصعد إلى الطابق 1، القاعة 2." }, gap: xs }
            - { kind: heading, text: { en: "When to arrive", ar: "متى تصل" }, gap: m }
            - { kind: text, text: { en: "10 minutes early; doors close at 18:05.", ar: "قبل 10 دقائق؛ تُغلق الأبواب الساعة 18:05." }, gap: xs }
            - { kind: heading, text: { en: "If you can't make it", ar: "إن لم تستطع الحضور" }, gap: m }
            - { kind: text, text: "@W1g", gap: xs }
      - id: closed
        text: { en: "Keep the four collapsed sections", ar: "أبقِ الأقسام الأربعة مطويّة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "Before you come", ar: "قبل أن تأتي" } }
            - { kind: line, text: { en: "What to bring ▾", ar: "ماذا تُحضر ▾" }, gap: m }
            - { kind: line, text: { en: "How to find the room ▾", ar: "كيف تصل إلى القاعة ▾" }, gap: xs }
            - { kind: line, text: { en: "When to arrive ▾", ar: "متى تصل ▾" }, gap: xs }
            - { kind: line, text: { en: "If you can't make it ▾", ar: "إن لم تستطع الحضور ▾" }, gap: xs }
      - id: one
        text: { en: "One \"Read before you come\" link that opens everything", ar: "رابط واحد «اقرأ قبل أن تأتي» يفتح كل شيء" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "Before you come", ar: "قبل أن تأتي" } }
            - { kind: link, text: { en: "Read before you come", ar: "اقرأ قبل أن تأتي" }, gap: m }
    answer: [open]
    misconceptions:
      - id: MC-P10-008
        when: [closed, one]
        feedback:
          en: "Everyone needs every part, so everyone has to open everything, and some will skip a part they needed. Collapse only what most people don't need."
          ar: "الجميع يحتاج إلى كل جزء، فعلى الجميع أن يفتحوا كل شيء، وسيفوت بعضهم جزءًا يحتاجه. اطوِ فقط ما لا يحتاجه معظم الناس."
    correct:
      en: "What everyone needs stays open."
      ar: "ما يحتاجه الجميع يبقى مفتوحًا."
    explain:
      en: "Collapsed sections save space when people pick a few, as in a help page. When everyone needs all of them, collapsing only adds taps, and a hidden part can be missed completely. Headings keep the open page easy to scan."
      ar: "الأقسام المطويّة توفّر المساحة حين يختار الناس بعضها، كما في صفحة المساعدة. وحين يحتاجها الجميع كلها، فالطيّ يضيف ضغطات فقط، وقد يفوت جزء مخفي تمامًا. والعناوين تُبقي الصفحة المفتوحة سهلة التصفّح."

  - id: S06
    type: tune
    skill: SK-P10-U01-05
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g: designs that go beyond 2 disclosure levels typically have low usability because users get lost. Link straight to the rule."
      ar: "NN/g: التصميمات التي تتجاوز مستويين من الإفصاح تكون سهولة استخدامها منخفضة عادةً، لأن المستخدمين يضيعون. اربط مباشرة بالشرط."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "beyond 2 disclosure levels typically have low usability" }
    prompt:
      en: "To find the cancellation rule now, Sara opens More details, then Policies, then Cancellation. Try each fix. Which one should ship?"
      ar: "لتجد سارة شرط الإلغاء الآن، تفتح «تفاصيل أكثر»، ثم «السياسات»، ثم «الإلغاء». جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: three levels deep", ar: "الآن: ثلاثة مستويات" }
      blocks:
        - { kind: link, text: { en: "More details ›", ar: "تفاصيل أكثر ›" } }
        - kind: group
          gap: s
          blocks:
            - { kind: link, text: { en: "Policies ›", ar: "السياسات ›" } }
            - kind: group
              gap: s
              blocks:
                - { kind: link, text: { en: "Cancellation ›", ar: "الإلغاء ›" } }
                - { kind: small, text: "@W1g", gap: s }
    options:
      - id: search
        text: { en: "Keep the levels, and add a search box to Policies", ar: "أبقِ المستويات، وأضف مربّع بحث إلى «السياسات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: link, text: { en: "More details ›", ar: "تفاصيل أكثر ›" } }
            - kind: group
              gap: s
              blocks:
                - { kind: link, text: { en: "Policies ›", ar: "السياسات ›" } }
                - { kind: field, text: { en: "Search policies", ar: "ابحث في السياسات" }, gap: s }
                - kind: group
                  gap: s
                  blocks:
                    - { kind: link, text: { en: "Cancellation ›", ar: "الإلغاء ›" } }
                    - { kind: small, text: "@W1g", gap: s }
      - id: direct
        text: { en: "One link under Reserve, \"Cancellation terms\", that opens the rule", ar: "رابط واحد تحت زر الحجز، «شروط الإلغاء»، يفتح الشرط مباشرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: button, text: "@W1f" }
            - { kind: link, text: { en: "Cancellation terms ›", ar: "شروط الإلغاء ›" }, gap: s }
            - kind: group
              gap: s
              blocks:
                - { kind: small, text: "@W1g" }
      - id: rename
        text: { en: "Keep the levels, but rename Policies to Rules", ar: "أبقِ المستويات، لكن غيّر «السياسات» إلى «القواعد»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: link, text: { en: "More details ›", ar: "تفاصيل أكثر ›" } }
            - kind: group
              gap: s
              blocks:
                - { kind: link, text: { en: "Rules ›", ar: "القواعد ›" } }
                - kind: group
                  gap: s
                  blocks:
                    - { kind: link, text: { en: "Cancellation ›", ar: "الإلغاء ›" } }
                    - { kind: small, text: "@W1g", gap: s }
    answer: [direct]
    misconceptions:
      - id: MC-P10-010
        when: [search, rename]
        feedback:
          en: "The rule is still three taps deep. Each extra level is another place to get lost. Keep it to two: the page, then the rule."
          ar: "ما زال الشرط على بُعد ثلاث ضغطات. كل مستوى إضافي مكان آخر للضياع. اكتفِ بمستويين: الصفحة، ثم الشرط."
    correct:
      en: "Two levels: the page, then the detail."
      ar: "مستويان: الصفحة، ثم التفاصيل."
    explain:
      en: "Hiding inside hiding gets people lost. Beyond two levels, people forget where they are and give up. Link straight from the page to the detail, with a label that names it."
      ar: "الإخفاء داخل الإخفاء يُضيّع الناس. فبعد مستويين ينسون أين هم ويستسلمون. اربط مباشرة من الصفحة إلى التفاصيل، باسم يحدّدها."

  - id: S07
    type: compare
    skill: SK-P10-U01-05
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "NN/g on staged disclosure: splitting steps is problematic when they're interdependent and users must alternate between them. A room choice depends on its price, so they share a screen."
      ar: "NN/g عن الإفصاح على مراحل: تقسيم الخطوات مشكلة حين تعتمد على بعضها ويضطر المستخدمون إلى التنقّل بينها. اختيار الغرفة يعتمد على سعرها، فمكانهما شاشة واحدة."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "It is problematic when the steps are interdependent and users must alternate between them." }
    scenario:
      en: "Dalia is booking a hotel room. She'll choose the room type partly by its price."
      ar: "تحجز داليا غرفة في فندق. وستختار نوع الغرفة بحسب سعرها جزئيًا."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Step 1 of 2", ar: "الخطوة 1 من 2" }
      mock:
        blocks:
          - { kind: heading, text: { en: "Choose a room", ar: "اختر غرفة" } }
          - { kind: radio, text: { en: "Standard room", ar: "غرفة عادية" }, gap: s }
          - { kind: radio, text: { en: "Sea-view room", ar: "غرفة بإطلالة على البحر" }, gap: xs }
          - { kind: radio, text: { en: "Family suite", ar: "جناح عائلي" }, gap: xs }
          - { kind: button, text: { en: "Next: see the price", ar: "التالي: اعرف السعر" }, gap: m }
    b:
      label: { en: "One screen", ar: "شاشة واحدة" }
      mock:
        blocks:
          - { kind: heading, text: { en: "Choose a room", ar: "اختر غرفة" } }
          - { kind: radio, text: { en: "Standard room · EGP 1,800 a night", ar: "غرفة عادية · 1,800 جنيه لليلة" }, gap: s }
          - { kind: radio, text: { en: "Sea-view room · EGP 2,600 a night", ar: "غرفة بإطلالة على البحر · 2,600 جنيه لليلة" }, gap: xs }
          - { kind: radio, text: { en: "Family suite · EGP 3,900 a night", ar: "جناح عائلي · 3,900 جنيه لليلة" }, gap: xs }
          - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    answer: b
    reason:
      prompt: { en: "Why is B better here?", ar: "لماذا B أفضل هنا؟" }
      options:
        - { id: fewer, text: { en: "Fewer steps are always better", ar: "الخطوات الأقل أفضل دائمًا" } }
        - { id: depends, text: { en: "The choice depends on the price, so they belong on the same screen", ar: "الاختيار يعتمد على السعر، فمكانهما الشاشة نفسها" } }
        - { id: price, text: { en: "Prices should always come first on any page", ar: "الأسعار يجب أن تأتي أولًا في أي صفحة" } }
      answer: [depends]
      misconceptions:
        - id: MC-P10-011
          when: [fewer, price]
          feedback:
            en: "Splitting steps is fine when they don't depend on each other, like payment after choosing. Here, choosing needs the price."
            ar: "تقسيم الخطوات مقبول حين لا تعتمد على بعضها، مثل الدفع بعد الاختيار. لكن هنا يحتاج الاختيار إلى السعر."
    misconceptions:
      - id: MC-P10-011
        when: [a]
        feedback:
          en: "In A, Dalia has to pick a room, see its price, go back, pick another, and remember each price. What's decided together should be shown together."
          ar: "في A، على داليا أن تختار غرفة، ثم ترى سعرها، ثم تعود، ثم تختار أخرى، وتتذكّر كل سعر. ما يُقرَّر معًا يجب أن يُعرض معًا."
    correct:
      en: "Show together what's decided together."
      ar: "اعرض معًا ما يُقرَّر معًا."
    explain:
      en: "Splitting a task into steps helps when the steps don't depend on each other: choose a room, then pay. It hurts when people must go back and forth to compare. Room and price are one decision."
      ar: "تقسيم المهمة إلى خطوات يفيد حين لا تعتمد الخطوات على بعضها: اختر الغرفة، ثم ادفع. ويضرّ حين يضطر الناس إلى الذهاب والعودة للمقارنة. الغرفة والسعر قرار واحد."

  - id: S08
    type: tune
    skill: SK-P10-U01-04
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. NN/g: initially, show only a few of the most important options, and offer the specialised ones on request. Twelve equal settings bury the two everyone uses."
      ar: "حالة جديدة. NN/g: اعرض في البداية بضعة خيارات هي الأهم فقط، وقدّم المتخصّصة عند الطلب. اثنا عشر إعدادًا متساويًا تدفن الإعدادين اللذين يستخدمهما الجميع."
    ref: { url: "https://www.nngroup.com/articles/progressive-disclosure/", quote: "Initially, show users only a few of the most important options." }
    scenario:
      en: "Most people open their home internet app to change the Wi-Fi password or see who's connected. The settings screen lists all 12 settings in one long list."
      ar: "معظم الناس يفتحون تطبيق الإنترنت المنزلي لتغيير كلمة مرور الـ Wi-Fi أو لمعرفة من المتصل. وشاشة الإعدادات تعرض الإعدادات الـ 12 كلها في قائمة طويلة واحدة."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 330
      blocks:
        - { kind: title, text: { en: "Settings", ar: "الإعدادات" } }
        - { kind: line, text: { en: "DNS servers", ar: "خوادم الـ DNS" }, gap: s }
        - { kind: line, text: { en: "Port forwarding", ar: "توجيه المنافذ" }, gap: xs }
        - { kind: line, text: { en: "Wi-Fi channel", ar: "قناة الـ Wi-Fi" }, gap: xs }
        - { kind: line, text: { en: "Firmware update", ar: "تحديث النظام" }, gap: xs }
        - { kind: line, text: { en: "Guest network", ar: "شبكة الضيوف" }, gap: xs }
        - { kind: line, text: { en: "Wi-Fi password", ar: "كلمة مرور الـ Wi-Fi" }, gap: xs }
        - { kind: line, text: { en: "IP settings", ar: "إعدادات الـ IP" }, gap: xs }
        - { kind: line, text: { en: "Connected devices", ar: "الأجهزة المتصلة" }, gap: xs }
    options:
      - id: one
        text: { en: "Put all 12 behind a single \"Settings\" button", ar: "ضع الـ 12 كلها خلف زر واحد «الإعدادات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "Home internet", ar: "الإنترنت المنزلي" } }
            - { kind: button, emphasis: low, text: { en: "Settings", ar: "الإعدادات" }, gap: m }
      - id: few
        text: { en: "Wi-Fi password and connected devices first; the other 10 under \"Advanced settings\"", ar: "كلمة مرور الـ Wi-Fi والأجهزة المتصلة أولًا؛ والعشرة الباقية تحت «إعدادات متقدّمة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "Settings", ar: "الإعدادات" } }
            - { kind: line, text: { en: "Wi-Fi password", ar: "كلمة مرور الـ Wi-Fi" }, gap: s }
            - { kind: line, text: { en: "Connected devices", ar: "الأجهزة المتصلة" }, gap: xs }
            - { kind: link, text: { en: "Advanced settings (10) ›", ar: "إعدادات متقدّمة (10) ›" }, gap: m }
      - id: sort
        text: { en: "Keep all 12 in one list, sorted A to Z", ar: "أبقِ الـ 12 في قائمة واحدة، مرتّبة أبجديًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 330
          blocks:
            - { kind: title, text: { en: "Settings", ar: "الإعدادات" } }
            - { kind: line, text: { en: "Connected devices", ar: "الأجهزة المتصلة" }, gap: s }
            - { kind: line, text: { en: "DNS servers", ar: "خوادم الـ DNS" }, gap: xs }
            - { kind: line, text: { en: "Firmware update", ar: "تحديث النظام" }, gap: xs }
            - { kind: line, text: { en: "Guest network", ar: "شبكة الضيوف" }, gap: xs }
            - { kind: line, text: { en: "IP settings", ar: "إعدادات الـ IP" }, gap: xs }
            - { kind: line, text: { en: "Port forwarding", ar: "توجيه المنافذ" }, gap: xs }
            - { kind: line, text: { en: "Wi-Fi channel", ar: "قناة الـ Wi-Fi" }, gap: xs }
            - { kind: line, text: { en: "Wi-Fi password", ar: "كلمة مرور الـ Wi-Fi" }, gap: xs }
    answer: [few]
    misconceptions:
      - id: MC-P10-016
        when: [sort]
        feedback:
          en: "Sorting doesn't change the problem: the two settings almost everyone needs are still buried among ten that few people touch."
          ar: "الترتيب لا يغيّر المشكلة: الإعدادان اللذان يحتاجهما الجميع تقريبًا ما زالا مدفونين بين عشرة لا يلمسها إلا القليلون."
      - id: MC-P10-002
        when: [one]
        feedback:
          en: "Now everyone, including people who only want the Wi-Fi password, has to open a button first. Keep the frequent settings visible."
          ar: "الآن على الجميع، حتى من يريد كلمة مرور الـ Wi-Fi فقط، أن يفتح زرًّا أولًا. أبقِ الإعدادات الشائعة ظاهرة."
    correct:
      en: "The few everyone uses, then the rest on request."
      ar: "القليل الذي يستخدمه الجميع، ثم الباقي عند الطلب."
    explain:
      en: "Same rule as Sara's page, on a settings screen: show the few things most people need, and put the specialised ones one clearly named tap away."
      ar: "القاعدة نفسها في صفحة سارة، لكن على شاشة إعدادات: اعرض الأشياء القليلة التي يحتاجها معظم الناس، وضع المتخصّصة على بُعد ضغطة واحدة باسم واضح."

  - id: S09
    type: card
    part: recap
    icons: [eye, text, layers, list]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Up front:** what almost everyone needs; only rare details go behind a link.\n- **Labels:** the link names what's behind it.\n- **Open, not collapsed:** when everyone needs every part.\n- **Two levels, one screen:** no hiding inside hiding, and what's decided together stays together.\n\nNext lesson: what people skip without reading."
      ar: "- **الظاهر أولًا:** ما يحتاجه الجميع تقريبًا، والتفاصيل النادرة فقط خلف رابط.\n- **الأسماء:** الرابط يسمّي ما خلفه.\n- **مفتوح لا مطويّ:** حين يحتاج الجميع كل جزء.\n- **مستويان وشاشة واحدة:** لا إخفاء داخل إخفاء، وما يُقرَّر معًا يبقى معًا.\n\nالدرس التالي: ما يتخطّاه الناس دون قراءة."
