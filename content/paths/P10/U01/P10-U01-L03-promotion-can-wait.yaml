id: P10-U01-L03
mode: lesson
minutes: 8
title:
  en: "What people skip without reading"
  ar: "ما يتخطّاه الناس دون قراءة"
sources:
  - title: { en: "Photos as Web Content (NN/g)", ar: "الصور كمحتوى على الويب (NN/g)" }
    url: "https://www.nngroup.com/articles/photos-as-web-content/"
  - title: { en: "Banner Blindness Revisited: Old and New Findings (NN/g)", ar: "عمى الإعلانات (Banner blindness): نتائج قديمة وجديدة (NN/g)" }
    url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/"
review_labels:
  MC-P10-012: { en: "Generic stock photos get skipped", ar: "صور الـ Stock العامة يتخطّاها الناس" }
  MC-P10-013: { en: "Don't style real content like an ad", ar: "لا تجعل المحتوى الحقيقي يشبه الإعلان" }
  MC-P10-014: { en: "Content next to ads is taken for an ad", ar: "المحتوى بجانب الإعلانات يُعامل كإعلان" }
  MC-P10-017: { en: "Keep content and offers in separate sections", ar: "افصل المحتوى عن العروض في أقسام مختلفة" }
  MC-P10-018: { en: "A photo that shows the real thing is content", ar: "الصورة التي تُظهر الشيء الحقيقي محتوى" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Make it pop\"", ar: "«اجعلها لافتة»" }
    body:
      en: "The marketing team wants Sara's page to feel more exciting. They added a big photo of smiling people and want the important notes in bright colourful strips.\n\nBright things get attention. But do people actually read them?"
      ar: "يريد فريق التسويق أن تبدو صفحة سارة أكثر حماسًا. أضافوا صورة كبيرة لأشخاص يبتسمون، ويريدون وضع الملاحظات المهمّة في أشرطة ملوّنة لامعة.\n\nالأشياء اللامعة تلفت الانتباه. لكن هل يقرؤها الناس فعلًا؟"
    mock:
      blocks:
        - { kind: image, size: l, text: { en: "Photo: smiling people at a laptop", ar: "صورة: أشخاص يبتسمون أمام Laptop" } }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: button, text: "@W1f", gap: m }

  - id: S02
    type: tune
    skill: SK-P10-U01-07
    part: try
    rules: [R12]
    value:
      en: "Photos as web content (NN/g): users ignore stock photos of generic people and other purely decorative images, but study images that carry information relevant to their task."
      ar: "الصور كمحتوى (NN/g): يتجاهل المستخدمون صور الـ Stock لأشخاص عامّين وكل صورة للزينة فقط، لكنهم يتأمّلون الصور التي تحمل معلومة تخصّ مهمّتهم."
    ref: { url: "https://www.nngroup.com/articles/photos-as-web-content/", quote: "users ignore stock photos of generic people" }
    prompt:
      en: "The workshop teaches people to sketch app screens on paper. Try each photo change. Which one should ship?"
      ar: "تعلّم الورشة الناس رسم شاشات التطبيقات على الورق. جرّب كل تغيير في الصورة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 380
      blocks:
        - { kind: image, size: l, text: { en: "Photo: smiling people at a laptop", ar: "صورة: أشخاص يبتسمون أمام Laptop" } }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: button, text: "@W1f", gap: m }
    options:
      - id: bigger
        text: { en: "Make the smiling-people photo bigger so the page feels warmer", ar: "كبّر صورة الأشخاص المبتسمين حتى تبدو الصفحة أدفأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 380
          blocks:
            - { kind: image, size: l, height: 250, text: { en: "Photo: smiling people at a laptop", ar: "صورة: أشخاص يبتسمون أمام Laptop" } }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: caption
        text: { en: "Keep the photo and add a caption on it: \"Join us!\"", ar: "أبقِ الصورة وأضف عليها عبارة: «انضم إلينا!»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 380
          blocks:
            - { kind: image, size: l, text: { en: "Photo: smiling people at a laptop · \"Join us!\"", ar: "صورة: أشخاص يبتسمون أمام Laptop · «انضم إلينا!»" } }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: real
        text: { en: "Replace it with a smaller photo of paper sketches made in last month's class, under the facts", ar: "استبدلها بصورة أصغر لرسومات ورقية صنعها المشاركون في ورشة الشهر الماضي، تحت المعلومات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 380
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: image, size: m, text: { en: "Photo: app sketches from last month's class", ar: "صورة: رسومات تطبيقات من ورشة الشهر الماضي" }, gap: m }
    answer: [real]
    misconceptions:
      - id: MC-P10-012
        when: [bigger, caption]
        feedback:
          en: "A photo of generic smiling people tells Sara nothing about the workshop, so people scroll past it. A bigger photo or a slogan only pushes the facts further down."
          ar: "صورة أشخاص عامّين يبتسمون لا تخبر سارة بشيء عن الورشة، لذلك يتخطّاها الناس. وتكبيرها أو إضافة شعار عليها يدفع المعلومات إلى الأسفل أكثر."
    correct:
      en: "A photo that shows what she'll actually do."
      ar: "صورة تُظهر ما ستفعله فعلًا."
    explain:
      en: "People skip decorative photos of generic people. A photo of real sketches from the class shows what Sara will make, so it carries information, and it doesn't push the facts down."
      ar: "يتخطّى الناس الصور التزيينية لأشخاص عامّين. أما صورة رسومات حقيقية من الورشة فتُظهر ما ستصنعه سارة، فهي تحمل معلومة، ولا تدفع المعلومات إلى الأسفل."

  - id: S03
    type: card
    part: concept
    icons: [eye, warn, layers, ok]
    title: { en: "What eyes skip", ar: "ما تتخطّاه العيون" }
    body:
      en: "People have learned to skip anything that looks like an ad, without reading it. This is called **banner blindness**.\n\n- **Decorative photos:** generic smiling people get skipped; photos that show the real thing get studied.\n- **Ad-like style:** a bright box that looks different from the rest of the page reads as an ad, even if it's important.\n- **Ad places:** content placed next to ads, or in the side column where ads usually sit, gets ignored too.\n- **What works:** keep important content in the main column, in the page's own style, and separate from offers."
      ar: "تعلّم الناس أن يتخطّوا كل ما يشبه الإعلان دون قراءته. وهذا يُسمّى **عمى الإعلانات (Banner blindness)**.\n\n- **الصور التزيينية:** صور الأشخاص العامّين المبتسمين يتخطّاها الناس؛ والصور التي تُظهر الشيء الحقيقي يتأمّلونها.\n- **شكل الإعلان:** الصندوق اللامع المختلف عن باقي الصفحة يُقرأ كإعلان، حتى لو كان مهمًّا.\n- **أماكن الإعلانات:** المحتوى الموضوع بجانب الإعلانات، أو في العمود الجانبي حيث تكون الإعلانات عادةً، يُتجاهل أيضًا.\n- **ما ينجح:** أبقِ المحتوى المهم في العمود الرئيسي، بشكل الصفحة نفسه، ومنفصلًا عن العروض."

  - id: S04
    type: tune
    skill: SK-P10-U01-06
    part: guided
    rules: [R06, R13]
    value:
      en: "Banner blindness (NN/g): do not make content look like ads. Making it look different from the rest of the site to raise its salience often has the opposite effect."
      ar: "عمى الإعلانات (NN/g): لا تجعل المحتوى يشبه الإعلانات. جعله مختلفًا عن باقي الموقع لزيادة بروزه يأتي غالبًا بعكس النتيجة."
    ref: { url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/", quote: "Do not make content look like ads." }
    scenario:
      en: "Every attendee must bring pencil and paper; there are none at the venue. Marketing put this note in a bright strip at the top of the page."
      ar: "يجب أن يُحضر كل مشارك قلمًا وورقًا، فلا يوجد منها شيء في المكان. وضع فريق التسويق هذه الملاحظة في شريط لامع أعلى الصفحة."
    prompt:
      en: "Try each version of the note. Which one should ship?"
      ar: "جرّب كل نسخة من الملاحظة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: banner, text: { en: "★ Bring pencil and paper! ★", ar: "★ أحضر قلمًا وورقًا! ★" } }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: button, text: "@W1f", gap: m }
    options:
      - id: louder
        text: { en: "Make the strip brighter, with an animated star", ar: "اجعل الشريط أكثر لمعانًا، مع نجمة متحرّكة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: banner, tone: bad, text: { en: "✨ Bring pencil and paper! ✨", ar: "✨ أحضر قلمًا وورقًا! ✨" } }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: plain
        text: { en: "A plain line with the other facts: \"Bring pencil and paper; none at the venue\"", ar: "سطر عادي مع باقي المعلومات: «أحضر قلمًا وورقًا؛ لا توجد في المكان»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: { en: "Bring pencil and paper; none at the venue", ar: "أحضر قلمًا وورقًا؛ لا توجد في المكان" }, gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: image
        text: { en: "Turn it into a picture of a pencil with the words on it", ar: "حوّلها إلى صورة قلم مكتوب عليها الملاحظة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: m, text: { en: "✏️ Bring pencil and paper!", ar: "✏️ أحضر قلمًا وورقًا!" } }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
    answer: [plain]
    misconceptions:
      - id: MC-P10-013
        when: [louder, image]
        feedback:
          en: "A bright strip or a picture at the top looks like an ad, so people skip it. Put the note with the facts, in the same style."
          ar: "الشريط اللامع أو الصورة في الأعلى يشبهان الإعلان، فيتخطّاهما الناس. ضع الملاحظة مع المعلومات، بالشكل نفسه."
    correct:
      en: "In the page's own style, with the facts."
      ar: "بشكل الصفحة نفسه، مع المعلومات."
    explain:
      en: "Making something look different to get attention often backfires: people take it for an ad and skip it. A plain line among the facts is read along with them."
      ar: "جعل الشيء مختلفًا ليلفت الانتباه يأتي غالبًا بعكس النتيجة: يظنّه الناس إعلانًا ويتخطّونه. أما السطر العادي بين المعلومات فيُقرأ معها."

  - id: S05
    type: tune
    skill: SK-P10-U01-06
    part: guided
    rules: [R06, R15]
    value:
      en: "Banner blindness (NN/g): do not mix content and ads in the same visual section; content placed with ads is often taken for an ad and ignored."
      ar: "عمى الإعلانات (NN/g): لا تخلط المحتوى بالإعلانات في القسم البصري نفسه؛ فالمحتوى الموضوع مع الإعلانات يُعامل غالبًا كإعلان ويُتجاهل."
    ref: { url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/", quote: "Do not mix content and ads in the same visual section." }
    scenario:
      en: "Tuesday's workshop is now full. The next session is a week later. The page also shows two partner offers. Right now, the next session sits in one row with the offers."
      ar: "اكتملت ورشة الثلاثاء. والجلسة التالية بعد أسبوع. وتعرض الصفحة أيضًا عرضين من شركاء. الآن، الجلسة التالية في صف واحد مع العروض."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1full", gap: s }
        - { kind: heading, text: { en: "You may also like", ar: "قد يعجبك أيضًا" }, gap: m }
        - kind: row
          gap: s
          blocks:
            - { kind: banner, text: { en: "Partner: drawing tablets 20% off", ar: "شريك: خصم 20% على ألواح الرسم" } }
            - { kind: banner, text: "@W1next" }
            - { kind: banner, text: { en: "Partner: online design course", ar: "شريك: كورس تصميم أونلاين" } }
    options:
      - id: big
        text: { en: "Keep the row, but make the next-session card bigger than the offers", ar: "أبقِ الصف، لكن اجعل بطاقة الجلسة التالية أكبر من العروض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1full", gap: s }
            - { kind: heading, text: { en: "You may also like", ar: "قد يعجبك أيضًا" }, gap: m }
            - { kind: banner, px: 18, text: "@W1next", gap: s }
            - kind: row
              gap: s
              blocks:
                - { kind: banner, text: { en: "Partner: drawing tablets 20% off", ar: "شريك: خصم 20% على ألواح الرسم" } }
                - { kind: banner, text: { en: "Partner: online design course", ar: "شريك: كورس تصميم أونلاين" } }
      - id: apart
        text: { en: "Next session and the waiting list right under \"Fully booked\"; the offers in their own section further down", ar: "الجلسة التالية وقائمة الانتظار تحت «اكتمل الحجز» مباشرة؛ والعروض في قسم خاص بها في الأسفل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1full", gap: s }
            - { kind: meta, text: "@W1next", gap: s }
            - { kind: button, text: "@W1wait", gap: m }
            - { kind: heading, text: { en: "Partner offers", ar: "عروض الشركاء" }, gap: l }
            - kind: row
              gap: s
              blocks:
                - { kind: banner, text: { en: "Partner: drawing tablets 20% off", ar: "شريك: خصم 20% على ألواح الرسم" } }
                - { kind: banner, text: { en: "Partner: online design course", ar: "شريك: كورس تصميم أونلاين" } }
      - id: first
        text: { en: "Keep the row, but move the next-session card to the start of it", ar: "أبقِ الصف، لكن انقل بطاقة الجلسة التالية إلى أوّله" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1full", gap: s }
            - { kind: heading, text: { en: "You may also like", ar: "قد يعجبك أيضًا" }, gap: m }
            - kind: row
              gap: s
              blocks:
                - { kind: banner, text: "@W1next" }
                - { kind: banner, text: { en: "Partner: drawing tablets 20% off", ar: "شريك: خصم 20% على ألواح الرسم" } }
                - { kind: banner, text: { en: "Partner: online design course", ar: "شريك: كورس تصميم أونلاين" } }
    answer: [apart]
    misconceptions:
      - id: MC-P10-017
        when: [big, first]
        feedback:
          en: "As long as the next session sits in the same row as the offers, people treat the whole row as ads and skip it. Give it its own place, with the facts."
          ar: "ما دامت الجلسة التالية في صف واحد مع العروض، سيعامل الناس الصف كله كإعلانات ويتخطّونه. ضعها في مكانها الخاص، مع المعلومات."
    correct:
      en: "Content with content, offers with offers."
      ar: "المحتوى مع المحتوى، والعروض مع العروض."
    explain:
      en: "When content shares a section with ads, people judge the whole section as ads. The next session is what a visitor needs after \"Fully booked\", so it goes right there, apart from the offers."
      ar: "حين يشارك المحتوى الإعلانات في قسم واحد، يحكم الناس على القسم كله بأنه إعلانات. والجلسة التالية هي ما يحتاجه الزائر بعد «اكتمل الحجز»، فمكانها هناك مباشرة، بعيدًا عن العروض."

  - id: S06
    type: compare
    skill: SK-P10-U01-07
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02 and Lesson 1: photos aren't always decoration. NN/g: users pay attention to information-carrying images relevant to the task. When the photos are what the person judges, they lead."
      ar: "مقارنة مع الخطوة 2 والدرس الأول: الصور ليست دائمًا للزينة. NN/g: ينتبه المستخدمون للصور التي تحمل معلومة تخصّ مهمّتهم. وحين تكون الصور هي ما يحكم به الشخص، تأتي أولًا."
    ref: { url: "https://www.nngroup.com/articles/photos-as-web-content/", quote: "users pay attention to information-carrying images" }
    scenario:
      en: "Nour is looking for a flat to rent. She already filtered by area and price; now she's judging whether the rooms are bright and big enough."
      ar: "تبحث نور عن شقة للإيجار. سبق أن صفّت النتائج حسب المنطقة والسعر؛ والآن تحكم إن كانت الغرف مضيئة وواسعة بما يكفي."
    prompt:
      en: "Which version of the listing should ship?"
      ar: "أي نسخة من الإعلان العقاري يجب أن تُطلق؟"
    a:
      label: { en: "Facts first", ar: "المعلومات أولًا" }
      mock:
        blocks:
          - { kind: title, text: { en: "Two-bedroom flat, 3rd floor", ar: "شقة بغرفتي نوم، الطابق الثالث" } }
          - { kind: meta, text: { en: "EGP 9,000 a month · 95 m²", ar: "9,000 جنيه في الشهر · 95 م²" }, gap: s }
          - { kind: button, text: { en: "Contact the owner", ar: "تواصل مع المالك" }, gap: m }
          - { kind: image, size: m, text: { en: "Photo: a happy family on a sofa", ar: "صورة: عائلة سعيدة على أريكة" }, gap: m }
    b:
      label: { en: "Room photos first", ar: "صور الغرف أولًا" }
      mock:
        blocks:
          - kind: row
            blocks:
              - { kind: image, size: m, text: { en: "Photo: this flat's living room", ar: "صورة: صالة هذه الشقة" } }
              - { kind: image, size: m, text: { en: "Photo: this flat's bedroom", ar: "صورة: غرفة النوم في هذه الشقة" } }
          - { kind: title, text: { en: "Two-bedroom flat, 3rd floor", ar: "شقة بغرفتي نوم، الطابق الثالث" }, gap: m }
          - { kind: meta, text: { en: "EGP 9,000 a month · 95 m²", ar: "9,000 جنيه في الشهر · 95 م²" }, gap: s }
          - { kind: button, text: { en: "Contact the owner", ar: "تواصل مع المالك" }, gap: m }
    answer: b
    reason:
      prompt: { en: "Why do the photos lead here?", ar: "لماذا تأتي الصور أولًا هنا؟" }
      options:
        - { id: pretty, text: { en: "Photos make any page more attractive", ar: "الصور تجعل أي صفحة أكثر جاذبية" } }
        - { id: people, text: { en: "Photos without people always work better", ar: "الصور التي ليس فيها أشخاص تنجح دائمًا أكثر" } }
        - { id: info, text: { en: "These photos are the information Nour is deciding with", ar: "هذه الصور هي المعلومة التي تقرّر بها نور" } }
      answer: [info]
      misconceptions:
        - id: MC-P10-018
          when: [pretty, people]
          feedback:
            en: "It's not about looks or about people in the picture. These photos show the actual rooms, which is exactly what Nour is judging."
            ar: "الأمر لا يتعلّق بالجمال ولا بوجود أشخاص في الصورة. هذه الصور تُظهر الغرف الفعلية، وهذا بالضبط ما تحكم عليه نور."
    misconceptions:
      - id: MC-P10-018
        when: [a]
        feedback:
          en: "In A, the only photo is a generic family that tells Nour nothing about the flat. Photos of the real rooms are her main facts, so they come first."
          ar: "في A، الصورة الوحيدة لعائلة عامّة لا تخبر نور بشيء عن الشقة. أما صور الغرف الحقيقية فهي أهم معلوماتها، لذلك تأتي أولًا."
    correct:
      en: "When the photo is the fact, it leads."
      ar: "حين تكون الصورة هي المعلومة، تأتي أولًا."
    explain:
      en: "On Sara's page, the photo was decoration, so the facts went first. Here, the photos of the rooms are what Nour decides with. Ask whether a photo carries information for this decision, not whether photos are good or bad."
      ar: "في صفحة سارة كانت الصورة للزينة، فجاءت المعلومات أولًا. أما هنا فصور الغرف هي ما تقرّر به نور. اسأل: هل تحمل الصورة معلومة لهذا القرار؟ لا: هل الصور جيدة أم سيئة؟"

  - id: S07
    type: tune
    skill: SK-P10-U01-06
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Banner blindness (NN/g): content placed in the same part of the screen as an ad is often considered an ad and ignored; the side column is a typical ad location."
      ar: "حالة جديدة. عمى الإعلانات (NN/g): المحتوى الموضوع في جزء الشاشة نفسه مع الإعلان يُعامل غالبًا كإعلان ويُتجاهل؛ والعمود الجانبي مكان معتاد للإعلانات."
    ref: { url: "https://www.nngroup.com/articles/banner-blindness-old-and-new-findings/", quote: "Content placed in the same part of the screen as an advertisement is often considered to be an ad and is also ignored." }
    scenario:
      en: "Omar is booking a hotel on his laptop. He'll only book if he can cancel for free. The free-cancellation note sits in the side column, under two ads."
      ar: "يحجز عمر فندقًا من الـ Laptop. ولن يحجز إلا إذا استطاع الإلغاء مجانًا. وملاحظة الإلغاء المجاني في العمود الجانبي، تحت إعلانين."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      frame: wide
      blocks:
        - kind: row
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: title, text: { en: "Garden Hotel · 2 nights", ar: "فندق الحديقة · ليلتان" } }
                - { kind: meta, text: { en: "EGP 4,200 total", ar: "4,200 جنيه إجمالًا" }, gap: s }
                - { kind: button, text: { en: "Book now", ar: "احجز الآن" }, gap: m }
            - kind: group
              tone: tint
              blocks:
                - { kind: image, size: s, text: { en: "Ad: rent a car", ar: "إعلان: استأجر سيارة" } }
                - { kind: image, size: s, text: { en: "Ad: city tours", ar: "إعلان: جولات في المدينة" }, gap: s }
                - { kind: small, text: { en: "Free cancellation until 1 March", ar: "إلغاء مجاني حتى 1 مارس" }, gap: s }
    options:
      - id: red
        text: { en: "Keep it in the side column, in a red box", ar: "أبقِها في العمود الجانبي، داخل صندوق أحمر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
