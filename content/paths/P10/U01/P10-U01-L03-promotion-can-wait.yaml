                    - { kind: image, size: s, text: { en: "Ad: rent a car", ar: "إعلان: استأجر سيارة" }, gap: s }
                    - { kind: image, size: s, text: { en: "Ad: city tours", ar: "إعلان: جولات في المدينة" }, gap: s }
      - id: move
        text: { en: "Move it into the main column, right under the price", ar: "انقلها إلى العمود الرئيسي، تحت السعر مباشرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          frame: wide
          blocks:
            - kind: row
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: title, text: { en: "Garden Hotel · 2 nights", ar: "فندق الحديقة · ليلتان" } }
                    - { kind: meta, text: { en: "EGP 4,200 total", ar: "4,200 جنيه إجمالًا" }, gap: s }
                    - { kind: meta, text: { en: "Free cancellation until 1 March", ar: "إلغاء مجاني حتى 1 مارس" }, gap: s }
                    - { kind: button, text: { en: "Book now", ar: "احجز الآن" }, gap: m }
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: image, size: s, text: { en: "Ad: rent a car", ar: "إعلان: استأجر سيارة" } }
                    - { kind: image, size: s, text: { en: "Ad: city tours", ar: "إعلان: جولات في المدينة" }, gap: s }
    answer: [move]
    misconceptions:
      - id: MC-P10-014
        when: [top]
        feedback:
          en: "It's still in the side column with the ads, where people expect ads and don't look. Move it next to the price Omar is checking."
          ar: "ما زالت في العمود الجانبي مع الإعلانات، حيث يتوقّع الناس إعلانات فلا ينظرون. انقلها بجانب السعر الذي يتحقّق منه عمر."
      - id: MC-P10-013
        when: [red]
        feedback:
          en: "A red box next to ads looks even more like an ad. Making it louder doesn't help; moving it out of the ad area does."
          ar: "الصندوق الأحمر بجانب الإعلانات يشبه الإعلان أكثر. جعلها أعلى صوتًا لا يفيد؛ ما يفيد هو إخراجها من منطقة الإعلانات."
    correct:
      en: "Next to the price, away from the ads."
      ar: "بجانب السعر، بعيدًا عن الإعلانات."
    explain:
      en: "Same idea as the next-session card, on a laptop screen: content in the ad area is taken for an ad. The cancellation rule is part of Omar's decision, so it belongs with the price, in the main column."
      ar: "الفكرة نفسها في بطاقة الجلسة التالية، لكن على شاشة Laptop: المحتوى في منطقة الإعلانات يُعامل كإعلان. وشرط الإلغاء جزء من قرار عمر، فمكانه مع السعر في العمود الرئيسي."

  - id: S08
    type: card
    part: recap
    icons: [eye, warn, layers, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Decorative photos:** swapped a generic photo for one that shows the real thing.\n- **Ad-like style:** put an important note in the page's own style, not in a bright strip.\n- **Separate sections:** kept the next session away from the partner offers.\n- **Ad places:** moved a key rule out of the side column, next to the price.\n\nNext: a skill check on a new page."
      ar: "- **الصور التزيينية:** استبدلت صورة عامّة بصورة تُظهر الشيء الحقيقي.\n- **شكل الإعلان:** وضعت ملاحظة مهمّة بشكل الصفحة نفسه، لا في شريط لامع.\n- **أقسام منفصلة:** أبعدت الجلسة التالية عن عروض الشركاء.\n- **أماكن الإعلانات:** نقلت شرطًا مهمًّا من العمود الجانبي إلى جانب السعر.\n\nالتالي: اختبار مهارة على صفحة جديدة."
