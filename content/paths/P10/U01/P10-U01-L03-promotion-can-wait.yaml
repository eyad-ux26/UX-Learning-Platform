                    - { kind: image, size: s, text: { en: "Ad: city tours", ar: "إعلان: جولات في المدينة" }, gap: s }
                    - { kind: banner, tone: bad, text: { en: "Free cancellation until 1 March", ar: "إلغاء مجاني حتى 1 مارس" }, gap: s }
      - id: top
        text: { en: "Move it to the top of the side column, above the ads", ar: "انقلها إلى أعلى العمود الجانبي، فوق الإعلانات" }
