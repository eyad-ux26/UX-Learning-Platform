id: P10-U01-L03
mode: lesson
minutes: 8
title:
  en: "Promotion can wait"
  ar: "الترويج يمكنه الانتظار"
review_labels:
  MC-P10-001: { en: "Attention isn't the same as importance", ar: "لفت الانتباه ليس هو الأهمية" }
  MC-P10-015: { en: "Don't block the decision with promotion", ar: "لا تعرقل القرار بالترويج" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Make it pop\"", ar: "«اجعلها لافتة»" }
    body:
      en: "The marketing team loves the new workshop photo. They want it big at the top, with the newsletter banner right under it. \"It's what gets attention,\" they say.\n\nThey're right that it gets attention. The question is whether attention is what Sara needs."
      ar: "فريق التسويق يحب صورة الورشة الجديدة. يريدونها كبيرة في الأعلى، وتحتها مباشرة شريط النشرة البريدية. يقولون: «هذا ما يلفت الانتباه».\n\nهم محقّون في أنها تلفت الانتباه. السؤال هو: هل الانتباه هو ما تحتاجه سارة؟"

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Which page do you think gets more first-time visitors to book a session that actually fits them?"
      ar: "أي صفحة تتوقّع أنها تجعل عددًا أكبر من الزوّار الجدد يحجزون جلسة تناسبهم فعلًا؟"
    options:
      - { id: promo, text: { en: "Big photo and newsletter first", ar: "الصورة الكبيرة والنشرة أولًا" } }
      - { id: decision, text: { en: "Session details first, photo smaller", ar: "تفاصيل الجلسة أولًا، والصورة أصغر" } }
      - { id: same, text: { en: "About the same", ar: "تقريبًا متساويتان" } }
    reveal:
      en: "Nobody has tested this exact page, so it's a prediction either way. By the end of the lesson you'll know how to check it instead of arguing about it."
      ar: "لم يختبر أحد هذه الصفحة تحديدًا، لذلك كلا الرأيين توقّع. في نهاية الدرس ستعرف كيف تتحقّق من ذلك بدلًا من الجدال حوله."

  - id: S03
    type: card
    part: concept
    title: { en: "Attention isn't understanding", ar: "الانتباه ليس فهمًا" }
    body:
      en: "Big, bright things pull the eye. That's useful, and that's the risk: whatever is loudest gets looked at first, whether or not it helps.\n\nHierarchy suggests a route through the page; it can't force one. So spend the loudest spot on what answers the visitor's question. Promotion still has a place: after the decision, where it doesn't get in the way."
      ar: "الأشياء الكبيرة والزاهية تجذب العين. هذا مفيد، وهنا الخطر أيضًا: أعلى العناصر صوتًا يُنظر إليه أولًا، سواء ساعد أم لا.\n\nالتسلسل البصري يقترح مسارًا داخل الصفحة، لكنه لا يفرضه. لذلك خصّص الموضع الأبرز لما يجيب عن سؤال الزائر. ويبقى للترويج مكان: بعد القرار، حيث لا يعترض الطريق."

  - id: S04
    type: tune
    part: guided
    rules: [R13, R06]
    prompt:
      en: "Try each option. Where should the photo go so Sara still finds what she needs?"
      ar: "جرّب كل خيار. أين يجب أن توضع الصورة حتى تجد سارة ما تحتاجه؟"
    start: big
    options:
      - id: big
        text: { en: "Large, at the top", ar: "كبيرة، في الأعلى" }
        mock:
          blocks:
            - { kind: image, size: l, text: "@W1i" }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: strip
        text: { en: "Small strip, at the top", ar: "شريط صغير، في الأعلى" }
        mock:
          blocks:
            - { kind: image, size: s, text: "@W1i" }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: below
        text: { en: "Medium, after the details and button", ar: "متوسطة، بعد التفاصيل والزر" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: image, size: m, text: "@W1i", gap: l }
    answer: [below]
    also_ok:
      - answer: [strip]
        feedback:
          en: "That can work too. A thin strip keeps the title and time near the top. Check it on a small phone: the details should still show without scrolling."
          ar: "هذا قد يصلح أيضًا. الشريط الرفيع يبقي العنوان والوقت قريبين من الأعلى. تحقّق منه على هاتف صغير: يجب أن تظهر التفاصيل دون تمرير."
    misconceptions:
      - id: MC-P10-001
        when: [big]
        feedback:
          en: "Look at the preview: the photo takes the first screen, and the time slides out of view on a phone."
          ar: "انظر إلى المعاينة: الصورة تأخذ الشاشة الأولى، ويخرج الوقت من مجال الرؤية على الهاتف."
    correct:
      en: "The photo stays, after the decision."
      ar: "الصورة تبقى، لكن بعد القرار."
    explain:
      en: "The photo isn't bad; it's just not what Sara decides with. After the button, it adds warmth without pushing the time off the screen."
      ar: "الصورة ليست سيئة؛ هي فقط ليست ما تقرّر به سارة. بعد الزر، تضيف دفئًا دون أن تدفع الوقت خارج الشاشة."

  - id: S05
    type: words
    part: guided
    confidence: true
    rules: [R06, R22]
    prompt:
      en: "Where should the newsletter invitation go?"
      ar: "أين يجب أن توضع دعوة الاشتراك في النشرة؟"
    options:
      - { id: top, text: { en: "A banner above the title", ar: "شريط فوق العنوان" } }
      - { id: popup, text: { en: "A popup when the page opens", ar: "نافذة منبثقة عند فتح الصفحة" } }
      - { id: after, text: { en: "A link after the booking details", ar: "رابط بعد تفاصيل الحجز" } }
      - { id: required, text: { en: "A checkbox Sara must tick to reserve", ar: "مربع اختيار يجب أن تختاره سارة لتحجز" } }
    answer: [after]
    misconceptions:
      - id: MC-P10-015
        when: [popup, required]
        feedback:
          en: "That puts promotion between Sara and her decision. The newsletter should never be needed to reserve, and shouldn't cover the page she came for."
          ar: "هذا يضع الترويج بين سارة وقرارها. يجب ألّا تكون النشرة شرطًا للحجز أبدًا، ولا أن تغطي الصفحة التي جاءت من أجلها."
      - id: MC-P10-001
        when: [top]
        feedback:
          en: "Above the title, it's the first thing Sara reads, but it doesn't answer her question."
          ar: "فوق العنوان، يكون أول ما تقرؤه سارة، لكنه لا يجيب عن سؤالها."
    hints:
      - { en: "When is Sara most likely to want more workshops: before or after she's found this one?", ar: "متى يُرجَّح أن ترغب سارة في ورش أخرى: قبل أن تجد هذه الورشة أم بعدها؟" }
    correct:
      en: "Offer it once the decision is done."
      ar: "اعرضها بعد أن يكتمل القرار."
    explain:
      en: "Promotion works best when it doesn't compete with the reason the visitor came. After the booking details, it's an easy extra instead of an obstacle."
      ar: "يعمل الترويج أفضل عندما لا ينافس السبب الذي جاء من أجله الزائر. بعد تفاصيل الحجز، يصبح إضافة سهلة لا عائقًا."

  - id: S06
    type: sort
    part: guided
    rules: [R09, R14]
    scenario:
      en: "Different page, same skill. Lina ordered dinner and is waiting at home. She opens the order screen."
      ar: "صفحة مختلفة، والمهارة نفسها. طلبت لينا العشاء وتنتظر في البيت. فتحت شاشة الطلب."
    prompt:
      en: "What does Lina need right now?"
      ar: "ما الذي تحتاجه لينا الآن؟"
    items:
      - { id: D1a, text: "@D1a" }
      - { id: D1b, text: "@D1b" }
      - { id: D1c, text: "@D1c" }
      - { id: D1d, text: "@D1d" }
      - { id: D1e, text: "@D1e" }
    buckets:
      - { id: now, label: { en: "Needed now", ar: "ضروري الآن" } }
      - { id: later, label: { en: "Can wait", ar: "يمكن أن ينتظر" } }
    answer:
      now: [D1a, D1b]
      later: [D1c, D1d, D1e]
    also_ok:
      - answer:
          now: [D1a, D1b, D1c]
          later: [D1d, D1e]
        feedback:
          en: "That works too. Keeping the order details close lets Lina check nothing is missing."
          ar: "هذا يصلح أيضًا. إبقاء تفاصيل الطلب قريبة يتيح للينا التأكد من أن لا شيء ناقص."
    misconceptions:
      - id: MC-P10-001
        when: { item: D1d, bucket: now }
        feedback:
          en: "A discount for the next order doesn't help Lina with this one. It can wait until the food arrives."
          ar: "خصم الطلب القادم لا يساعد لينا في طلبها الحالي. يمكنه الانتظار حتى يصل الطعام."
      - id: MC-P10-003
        when: { item: D1a, bucket: later }
        feedback:
          en: "When the food arrives is the main thing Lina is checking."
          ar: "موعد وصول الطعام هو أهم ما تتحقّق منه لينا."
    correct:
      en: "When it arrives and who to call come first."
      ar: "متى يصل ومن تتصل به يأتيان أولًا."
    explain:
      en: "Lina's question is \"when is my food coming, and can I reach the driver?\" Arrival time and the driver answer it. The rating and the discount are promotion; they can wait."
      ar: "سؤال لينا هو: «متى يصل طعامي، وهل أستطيع التواصل مع السائق؟». موعد الوصول والسائق يجيبان عنه. أما التقييم والخصم فترويج، ويمكنهما الانتظار."

  - id: S07
    type: spot
    part: guided
    rules: [R06, R15]
    scenario:
      en: "Youssef is at the bus station. His bus leaves soon and he needs to find the platform."
      ar: "يوسف في محطة الحافلات. حافلته ستغادر قريبًا ويحتاج أن يجد الرصيف."
    prompt:
      en: "Which part of his ticket gets more attention than it deserves?"
      ar: "أي جزء في تذكرته يأخذ انتباهًا أكثر مما يستحق؟"
    mock: &ticketPromo
      blocks:
        - { kind: banner, text: "@B1a", region: banner }
        - { kind: heading, text: "@B1b", gap: m, region: route }
        - { kind: small, text: "@B1c", gap: s, region: departure }
        - { kind: small, text: "@B1d", gap: s, region: seat }
        - { kind: button, text: "@B1e", gap: m, region: show }
    regions:
      - { id: banner, label: "@B1a" }
      - { id: route, label: "@B1b" }
      - { id: departure, label: "@B1c" }
      - { id: show, label: "@B1e" }
    answer: [banner]
    misconceptions:
      - id: MC-P10-012
        when: [show]
        feedback:
          en: "The button is a fair thing to emphasize; Youssef will need to show his ticket. Look for something loud that doesn't help him right now."
          ar: "إبراز الزر منطقي؛ سيحتاج يوسف إلى إظهار تذكرته. ابحث عن شيء لافت لا يساعده الآن."
      - id: MC-P10-018
        when: [route]
        feedback:
          en: "The route is useful: it tells Youssef he has the right ticket. Look for something loud that doesn't help him catch the bus."
          ar: "المسار مفيد: يؤكّد ليوسف أن التذكرة صحيحة. ابحث عن شيء لافت لا يساعده على اللحاق بالحافلة."
      - id: MC-P10-016
        when: [departure]
        feedback:
          en: "You've spotted a real problem: the departure line is too quiet. But the question is what's too loud. What's taking the attention it should have?"
          ar: "لاحظت مشكلة حقيقية: سطر المغادرة هادئ أكثر من اللازم. لكن السؤال عن الأعلى صوتًا. ما الذي يأخذ الانتباه الذي يستحقه؟"
    hints:
      - { en: "What is the first thing your eye lands on, and does it help Youssef catch his bus?", ar: "ما أول شيء تقع عليه عينك، وهل يساعد يوسف على اللحاق بحافلته؟" }
    correct:
      en: "The app banner is the loudest thing, and the least useful at the station."
      ar: "شريط التطبيق هو الأعلى صوتًا، والأقل فائدة في المحطة."
    explain:
      en: "The banner is colored, boxed and at the top, while the departure time and platform are small grey text. The emphasis is spent on promotion instead of on what Youssef needs."
      ar: "الشريط ملوّن ومحاط بإطار وفي الأعلى، بينما وقت المغادرة والرصيف نص رمادي صغير. البروز صُرف على الترويج بدلًا مما يحتاجه يوسف."

  - id: S08
    type: order
    part: contrast
    rules: [R14, R06]
    prompt:
      en: "Reorder Youssef's ticket, top to bottom."
      ar: "أعد ترتيب تذكرة يوسف، من الأعلى إلى الأسفل."
    items:
      - { id: B1a, text: "@B1a" }
      - { id: B1b, text: "@B1b" }
      - { id: B1c, text: "@B1c" }
      - { id: B1d, text: "@B1d" }
      - { id: B1e, text: "@B1e" }
    answer: [B1b, B1c, B1d, B1e, B1a]
    also_ok:
      - answer: [B1c, B1b, B1d, B1e, B1a]
        feedback:
          en: "That works too. At the station, departure and platform first makes a lot of sense."
          ar: "هذا يصلح أيضًا. في المحطة، البدء بالمغادرة والرصيف منطقي جدًا."
      - answer: [B1b, B1c, B1e, B1d, B1a]
        feedback:
          en: "That works too. Seat and Show ticket can swap; the app offer still comes last."
          ar: "هذا يصلح أيضًا. يمكن تبديل المقعد وزر التذكرة؛ ويبقى عرض التطبيق في الأخير."
    misconceptions:
      - id: MC-P10-015
        when: { before: [B1a, B1c] }
        feedback:
          en: "The app offer still comes before the departure time. Youssef shouldn't have to read past an ad to find his platform."
          ar: "عرض التطبيق ما زال قبل وقت المغادرة. لا يجب أن يقرأ يوسف إعلانًا قبل أن يجد رصيفه."
    hints:
      - { en: "Start with what Youssef checks while walking to the platform.", ar: "ابدأ بما يتحقّق منه يوسف وهو يمشي إلى الرصيف." }
    correct:
      en: "Trip, time and platform, seat, ticket, then the offer."
      ar: "الرحلة، ثم الوقت والرصيف، ثم المقعد والتذكرة، ثم العرض."
    explain:
      en: "Same move as Sara's page: the facts for the decision lead, the action follows, and promotion goes last, where it can't get in the way."
      ar: "الخطوة نفسها في صفحة سارة: حقائق القرار في المقدّمة، يليها الإجراء، ثم الترويج في الأخير حيث لا يعترض الطريق."

  - id: S09
    type: choose
    part: independent
    confidence: true
    rules: [R14, R39]
    prompt:
      en: "The marketing lead says: \"Make the photo bigger, it increases engagement.\" What's your best response?"
      ar: "تقول مسؤولة التسويق: «كبّروا الصورة، فهي تزيد التفاعل». ما أفضل ردّ؟"
    options:
      - { id: agree, text: { en: "Agree and make it bigger", ar: "أوافق وأكبّرها" } }
      - { id: refuse, text: { en: "Refuse: hierarchy rules say details come first", ar: "أرفض: قواعد التسلسل تقول إن التفاصيل أولًا" } }
      - { id: test, text: { en: "Keep the details first, and offer a quick test: can a first-time visitor find the time, price and cancellation rule?", ar: "أبقي التفاصيل أولًا، وأقترح اختبارًا سريعًا: هل يجد الزائر الجديد الوقت والسعر وقاعدة الإلغاء؟" } }
      - { id: both, text: { en: "Make the photo and title equally big", ar: "أجعل الصورة والعنوان بالحجم نفسه" } }
    answer: [test]
    reason:
      prompt: { en: "Why is that the strongest reply?", ar: "لماذا هذا أقوى ردّ؟" }
      options:
        - { id: check, text: { en: "It checks the claim against what visitors need to do", ar: "لأنه يختبر الادّعاء مقابل ما يحتاج الزوّار إلى فعله" } }
        - { id: win, text: { en: "Tests always win arguments", ar: "لأن الاختبارات تحسم كل جدال" } }
      answer: [check]
      misconceptions:
        - id: MC-P10-017
          when: [win]
          feedback:
            en: "A test isn't a weapon. It's useful here because it measures the thing that matters: whether visitors can decide, not just whether they look."
            ar: "الاختبار ليس سلاحًا. هو مفيد هنا لأنه يقيس ما يهم: هل يستطيع الزوّار القرار، لا هل ينظرون فقط."
    misconceptions:
      - id: MC-P10-001
        when: [agree, both]
        feedback:
          en: "More engagement with the photo isn't the goal. More visitors booking a session that fits them is."
          ar: "زيادة التفاعل مع الصورة ليست الهدف. الهدف أن يحجز عدد أكبر من الزوّار جلسة تناسبهم."
      - id: MC-P10-017
        when: [refuse]
        feedback:
          en: "There's no rulebook to point to. A clear reason plus a way to check it is far more persuasive than \"the rules say\"."
          ar: "لا يوجد كتاب قواعد نستند إليه. سبب واضح مع طريقة للتحقق أكثر إقناعًا بكثير من «القواعد تقول»."
    correct:
      en: "Name the goal, keep the decision first, and offer a way to check."
      ar: "حدّد الهدف، وأبقِ القرار أولًا، واقترح طريقة للتحقق."
    explain:
      en: "A good reply names what the page is for, keeps what supports it, and turns a matter of taste into something you can check with a real task."
      ar: "الردّ الجيد يحدّد الغرض من الصفحة، ويبقي ما يخدمه، ويحوّل مسألة الذوق إلى شيء يمكن التحقق منه بمهمة حقيقية."

  - id: S10
    type: card
    part: recap
    title: { en: "What you did", ar: "ما أنجزته" }
    body:
      en: "You moved promotion after the decision on three different pages: a workshop, a food order and a bus ticket. You also answered a \"make it pop\" request with a goal and a way to check it.\n\nNext: the skill check. A new page, no hints."
      ar: "نقلت الترويج إلى ما بعد القرار في ثلاث صفحات مختلفة: ورشة، وطلب طعام، وتذكرة حافلة. وأجبت عن طلب «اجعلها لافتة» بهدف وطريقة للتحقق.\n\nالتالي: اختبار المهارة. صفحة جديدة، بدون تلميحات."
