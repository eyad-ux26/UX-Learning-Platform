id: P10-U01-L01
mode: lesson
minutes: 7
title:
  en: "Find the next useful thing"
  ar: "ما الذي يحتاجه الزائر الآن؟"
review_labels:
  MC-P10-001: { en: "The biggest thing isn't always the most important", ar: "الأكبر ليس دائمًا الأهم" }
  MC-P10-002: { en: "Supporting doesn't mean hidden", ar: "المعلومة الثانوية لا تعني المخفية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Meet Sara", ar: "تعرّف على سارة" }
    body:
      en: "Sara wants a free beginner workshop next week. She works until 17:00, so she can only come in the evening.\n\nShe opens this page on her phone. Can she tell, quickly, whether this session works for her?"
      ar: "تبحث سارة عن ورشة مجانية للمبتدئين في الأسبوع القادم. دوامها ينتهي الساعة 17:00، فلا تستطيع الحضور إلا مساءً.\n\nفتحت هذه الصفحة على هاتفها. هل تعرف بسرعة إن كان الموعد يناسبها؟"
    mock: &promoFirst
      blocks:
        - { kind: image, size: l, text: "@W1i" }
        - { kind: banner, text: "@W1j", gap: m }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: chip, text: "@W1e", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: small, text: "@W1g", gap: s }
        - { kind: link, text: "@W1h", gap: s }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Before we start: what is Sara looking for first on this page?"
      ar: "قبل أن نبدأ: عن أي شيء تبحث سارة أولًا في هذه الصفحة؟"
    mock: *promoFirst
    options:
      - { id: photo, text: { en: "The photo", ar: "الصورة" } }
      - { id: title, text: { en: "The workshop title", ar: "عنوان الورشة" } }
      - { id: time, text: { en: "The date and time", ar: "التاريخ والوقت" } }
      - { id: news, text: { en: "The newsletter", ar: "النشرة البريدية" } }
    reveal:
      en: "Keep your answer in mind. We'll come back to it at the end of the lesson."
      ar: "احتفظ بإجابتك في ذهنك، فسنعود إليها في آخر الدرس."

  - id: S03
    type: card
    part: concept
    title: { en: "Hierarchy follows the decision", ar: "القرار هو الذي يحدّد الترتيب" }
    body:
      en: "**Visual hierarchy** is how a screen shows what matters more, using size, position, spacing and contrast.\n\nStart with the question the visitor is trying to answer. Sara's question is: can I attend, and should I reserve? Whatever answers that question comes first. Promotion and decoration come after, even when they are big and colorful."
      ar: "**التسلسل البصري (Visual hierarchy)** هو أن تُظهر الشاشة ما هو أهم أولًا، عن طريق الحجم والمكان والمسافات والتباين.\n\nابدأ بالسؤال الذي جاء الزائر ليجد إجابته. سؤال سارة: هل أستطيع الحضور؟ وهل أحجز؟ كل ما يجيب عن ذلك يأتي أولًا. أما الإعلانات والزخارف فتأتي بعده، مهما كانت كبيرة وملوّنة."

  - id: S04
    type: sort
    part: guided
    rules: [R06, R15]
    prompt:
      en: "Before reserving, Sara checks four things: what the session is, when, where, and how much. Which items answer one of those?"
      ar: "قبل الحجز، تتحقّق سارة من أربعة أشياء: ما هذه الجلسة، ومتى، وأين، وبكم. أي العناصر تجيب عن واحد منها؟"
    items:
      - { id: W1a, text: "@W1a" }
      - { id: W1b, text: "@W1b" }
      - { id: W1c, text: "@W1c" }
      - { id: W1d, text: "@W1d" }
      - { id: W1i, text: "@W1i" }
      - { id: W1j, text: "@W1j" }
    buckets:
      - { id: need, label: { en: "Answers one of the four", ar: "يجيب عن أحدها" } }
      - { id: nice, label: { en: "Answers none", ar: "لا يجيب عن أيٍّ منها" } }
    answer:
      need: [W1a, W1b, W1c, W1d]
      nice: [W1i, W1j]
    misconceptions:
      - id: MC-P10-001
        when: { item: W1i, bucket: need }
        feedback:
          en: "The photo is the biggest thing on the page, but it doesn't tell Sara when, where or how much. Size isn't the same as importance."
          ar: "الصورة أكبر شيء في الصفحة، لكنها لا تقول لسارة متى ولا أين ولا بكم. الكِبَر لا يعني الأهمية."
      - id: MC-P10-003
        when: { item: W1b, bucket: nice }
        feedback:
          en: "Sara can only come after 17:00. Without the time she can't tell if this session works for her."
          ar: "سارة لا تستطيع الحضور قبل الساعة 17:00. ومن دون الوقت لن تعرف إن كان الموعد يناسبها."
      - id: MC-P10-004
        when: { item: W1j, bucket: need }
        feedback:
          en: "The newsletter is for later visits. Sara can reserve without it."
          ar: "النشرة البريدية تفيد لاحقًا، وسارة تستطيع الحجز من دونها."
    hints:
      - { en: "Match each item to one of the four questions. If it fits none, it's extra.", ar: "طابق كل عنصر مع أحد الأسئلة الأربعة. وإن لم يناسب أيًّا منها، فهو إضافي." }
    correct:
      en: "Title answers what, the date answers when, the place answers where, and Free answers how much. The photo and newsletter answer none."
      ar: "العنوان يجيب عن «ماذا»، والتاريخ عن «متى»، والمكان عن «أين»، و«مجاني» عن «بكم». أما الصورة والنشرة فلا تجيبان عن أيٍّ منها."
    explain:
      en: "An item is needed when the decision would change without it. If the session were at 15:00, or cost money, Sara might not reserve. The photo and the newsletter can stay on the page, but they don't decide anything."
      ar: "العنصر ضروري إذا كان غيابه يغيّر القرار. لو كانت الورشة الساعة 15:00 أو برسوم، فقد لا تحجز سارة. أما الصورة والنشرة فيمكن أن تبقيا في الصفحة، لكنهما لا تحسمان شيئًا."

  - id: S05
    type: choose
    part: guided
    rules: [R10, R15]
    prompt:
      en: "The cancellation rule is long and small. Should Sara see it before she taps Reserve?"
      ar: "شرط الإلغاء نص طويل وصغير. هل يجب أن تراه سارة قبل أن تضغط «احجز»؟"
    scenario: "@W1g"
    options:
      - { id: yes, text: { en: "Yes, before Reserve", ar: "نعم، قبل «احجز»" } }
      - { id: after, text: { en: "No, after she reserves", ar: "لا، بعد أن تحجز" } }
      - { id: hide, text: { en: "No, put it behind a link", ar: "لا، ضعه خلف رابط" } }
    answer: [yes]
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: commit, text: { en: "It changes what Sara is committing to", ar: "لأنه يغيّر ما تلتزم به سارة" } }
        - { id: legal, text: { en: "Legal text always goes first", ar: "لأن النصوص القانونية تأتي أولًا دائمًا" } }
        - { id: clean, text: { en: "A cleaner page converts better", ar: "لأن الصفحة الأبسط تجلب حجوزات أكثر" } }
      answer: [commit]
      misconceptions:
        - id: MC-P10-005
          when: [legal]
          feedback:
            en: "It's not about legal text in general. This rule matters because it changes what Sara agrees to when she reserves."
            ar: "المسألة ليست النصوص القانونية عمومًا. هذا الشرط مهم لأنه يغيّر ما توافق عليه سارة حين تحجز."
    misconceptions:
      - id: MC-P10-002
        when: [after, hide]
        feedback:
          en: "If Sara only finds the rule after reserving, she committed without knowing it. Supporting information can be smaller, but it still has to be there before the action."
          ar: "إذا لم تعرف سارة الشرط إلا بعد الحجز، فقد التزمت بشيء لم تقرأه. المعلومة الثانوية يمكن أن تكون أصغر، لكن مكانها قبل الزر."
    hints:
      - { en: "What happens if Sara's plans change after she reserves?", ar: "ماذا يحدث لو تغيّرت خطط سارة بعد أن تحجز؟" }
    correct:
      en: "It doesn't need to be big, but it must come before the commitment."
      ar: "لا يلزم أن يكون كبيرًا، لكن يجب أن يأتي قبل الالتزام."
    explain:
      en: "Priority and presence are different questions. The cancellation rule can be small, below the button's label even, but it must be on the path to Reserve, not after it."
      ar: "الأهمية شيء، والظهور شيء آخر. شرط الإلغاء يمكن أن يكون صغيرًا، لكن مكانه في الطريق إلى زر «احجز»، لا بعده."

  - id: S06
    type: order
    part: guided
    confidence: true
    rules: [R06, R15]
    prompt:
      en: "Put these in the order Sara should meet them, top to bottom."
      ar: "رتّب هذه العناصر كما يجب أن تراها سارة، من أعلى الشاشة إلى أسفلها."
    items:
      - { id: W1f, text: "@W1f", kind: button }
      - { id: W1d, text: "@W1d" }
      - { id: W1a, text: "@W1a", kind: title }
      - { id: W1b, text: "@W1b" }
      - { id: W1c, text: "@W1c" }
    answer: [W1a, W1b, W1c, W1d, W1f]
    also_ok:
      - answer: [W1b, W1a, W1c, W1d, W1f]
        feedback:
          en: "That works too. Date first is fine when the title stays right next to it, because both answer \"what and when\"."
          ar: "هذا صحيح أيضًا. لا بأس بالبدء بالتاريخ ما دام العنوان بجواره، فكلاهما يجيب عن «ماذا ومتى»."
      - answer: [W1a, W1b, W1d, W1c, W1f]
        feedback:
          en: "That works too. Price and place can swap; both come before the button."
          ar: "هذا صحيح أيضًا. لا مشكلة في تبديل السعر والمكان، المهم أن يكونا قبل الزر."
    misconceptions:
      - id: MC-P10-006
        when: { before: [W1f, W1b] }
        feedback:
          en: "The button comes before the time, so Sara could reserve without checking that 18:00 works. Put the facts she decides with before the action."
          ar: "الزر قبل الوقت، فقد تحجز سارة قبل أن تتأكد أن الساعة 18:00 تناسبها. ضع المعلومات التي تبني عليها قرارها قبل الزر."
    hints:
      - { en: "The button is the last step of the decision, not the first.", ar: "الزر آخر خطوة في القرار، لا أولها." }
    correct:
      en: "What and when, then where and how much, then the action."
      ar: "ماذا ومتى، ثم أين وبكم، ثم الإجراء."
    explain:
      en: "There's more than one good order. The rule is that the facts Sara decides with come before the button. Title and date can swap; place and price can swap."
      ar: "هناك أكثر من ترتيب صحيح. القاعدة أن المعلومات التي تبني عليها سارة قرارها تأتي قبل الزر. ويمكن تبديل العنوان والتاريخ، أو المكان والسعر."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, R15]
    prompt:
      en: "In which version can Sara find what, when, where and how much without passing the photo or the newsletter?"
      ar: "في أي نسخة تجد سارة ماذا ومتى وأين وبكم دون أن تمرّ بالصورة أو النشرة؟"
    a:
      mock:
        blocks:
          - { kind: image, size: xl, text: "@W1i" }
          - { kind: banner, text: "@W1j", gap: m }
          - { kind: link, text: "@W1h", gap: s }
          - { kind: title, text: "@W1a", gap: m }
          - { kind: button, text: "@W1f", gap: s }
          - { kind: small, color: pale, text: "@W1b", gap: m }
          - { kind: small, color: pale, text: "@W1c", gap: xs }
          - { kind: small, color: pale, text: "@W1d", gap: xs }
          - { kind: small, color: pale, text: "@W1e", gap: xs }
          - { kind: small, color: pale, text: "@W1g", gap: xs }
    b:
      mock: &decisionFirst
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: meta, text: "@W1b", gap: s }
          - { kind: meta, text: "@W1c", gap: s }
          - kind: row
            gap: s
            blocks:
              - { kind: meta, text: "@W1d" }
              - { kind: chip, text: "@W1e" }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: small, text: "@W1g", gap: s }
          - { kind: link, text: "@W1h", gap: s }
          - { kind: image, size: s, text: "@W1i", gap: l }
          - { kind: link, text: "@W1j", gap: s }
    answer: b
    reason:
      prompt: { en: "What makes the difference?", ar: "ما سبب الفرق؟" }
      options:
        - { id: time, text: { en: "What, when, where and how much come first and are easy to read; the extras come after Reserve", ar: "ماذا ومتى وأين وبكم تأتي أولًا وتُقرأ بسهولة؛ والإضافات بعد زر الحجز" } }
        - { id: short, text: { en: "It has fewer things on it", ar: "فيها عناصر أقل" } }
        - { id: photo, text: { en: "It has no photo", ar: "لا توجد فيها صورة" } }
      answer: [time]
      misconceptions:
        - id: MC-P10-007
          when: [short, photo]
          feedback:
            en: "Both versions have exactly the same items, photo included. What changed is the order and the emphasis: the facts that decide come first, at a readable size."
            ar: "في النسختين العناصر نفسها تمامًا، والصورة أيضًا. الذي تغيّر هو الترتيب والبروز: المعلومات التي تحسم القرار جاءت أولًا، بحجم مقروء."
    misconceptions:
      - id: MC-P10-001
        when: [a]
        feedback:
          en: "Version A opens with a huge photo and the newsletter, puts Reserve before the facts, and shows the date, place and price in small pale text. Sara could reserve without ever checking the time."
          ar: "النسخة A تبدأ بصورة ضخمة والنشرة، وتضع زر الحجز قبل المعلومات، وتعرض التاريخ والمكان والسعر بخط صغير باهت. قد تحجز سارة دون أن تتحقّق من الوقت أصلًا."
    correct:
      en: "Nothing was removed. The facts moved up and got readable, and the extras moved down."
      ar: "لم يُحذف شيء. المعلومات المهمة صعدت وصارت مقروءة، والإضافات نزلت."
    explain:
      en: "Both screens hold the same ten items. B leads with what answers Sara's question, at a size she can read, then the action, then the extras. That's the whole skill: same content, arranged by the decision."
      ar: "في الشاشتين العناصر العشرة نفسها. النسخة B تبدأ بما يجيب عن سؤال سارة بحجم تقرؤه بسهولة، ثم الزر، ثم الإضافات. هذه هي المهارة كلها: المحتوى نفسه، مرتّبًا حسب القرار."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, R19]
    prompt:
      en: "A week later the session is full. What should lead the page now?"
      ar: "بعد أسبوع امتلأت الورشة. ماذا يجب أن يظهر أولًا في الصفحة الآن؟"
    mock:
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: chip, tone: bad, text: "@W1full", gap: s }
        - { kind: button, tone: off, text: "@W1f", gap: m }
    options:
      - { id: same, text: { en: "Keep the same order; the Reserve button just turns grey", ar: "أبقِ الترتيب نفسه؛ يصبح زر «احجز» رماديًا فقط" } }
      - { id: next, text: { en: "Say it's full, and lead with the next session or the waiting list", ar: "قل إنها اكتملت، وابدأ بالموعد التالي أو قائمة الانتظار" } }
      - { id: photo, text: { en: "Lead with the photo so the page still looks inviting", ar: "ابدأ بالصورة حتى تبقى الصفحة جذّابة" } }
    answer: [next]
    misconceptions:
      - id: MC-P10-008
        when: [same]
        feedback:
          en: "A grey button tells Sara what she can't do, but not what she can do instead. When the situation changes, the next useful thing changes too."
          ar: "الزر الرمادي يقول لسارة ما لا تستطيع فعله، ولا يقول لها ماذا تفعل بدلًا منه. وحين يتغيّر الموقف، يتغيّر ما تحتاجه أولًا."
      - id: MC-P10-001
        when: [photo]
        feedback:
          en: "An inviting photo doesn't help Sara now. She needs to know it's full and what her options are."
          ar: "الصورة الجميلة لا تساعد سارة الآن. هي تحتاج أن تعرف أن الورشة اكتملت، وما البدائل المتاحة لها."
    correct:
      en: "The decision changed, so the order changes."
      ar: "تغيّر القرار، فتغيّر الترتيب."
    explain:
      en: "Priority isn't fixed by the brand or the template. It follows what the visitor can decide right now. When the session is full, \"Fully booked\" plus the next date or the waiting list becomes the next useful thing."
      ar: "الأولوية لا تحدّدها الهوية البصرية ولا القالب، بل ما يستطيع الزائر أن يقرّره الآن. حين تكتمل الورشة، يصبح أهم ما في الصفحة: «اكتمل الحجز»، ومعه الموعد التالي أو قائمة الانتظار."

  - id: S09
    type: predict
    part: independent
    any_ok: true
    recall: S02
    rules: [R21]
    prompt:
      en: "Back to your first guess. Now, what should Sara find first on this page?"
      ar: "لنعد إلى توقّعك الأول. الآن، ما أول شيء يجب أن تجده سارة في الصفحة؟"
    options:
      - { id: photo, text: { en: "The photo", ar: "الصورة" } }
      - { id: title, text: { en: "The workshop title", ar: "عنوان الورشة" } }
      - { id: time, text: { en: "The date and time", ar: "التاريخ والوقت" } }
      - { id: news, text: { en: "The newsletter", ar: "النشرة البريدية" } }
    reveal:
      en: "Title or time, both are good answers: they answer \"what and when\". If your first guess was the photo, notice what changed: you now order by Sara's question, not by what's biggest."
      ar: "العنوان أو الوقت، وكلاهما إجابة صحيحة لأنهما يجيبان عن «ماذا ومتى». إذا كان توقّعك الأول الصورة، فلاحظ الفرق: صرت ترتّب حسب سؤال سارة، لا حسب الأكبر حجمًا."

  - id: S10
    type: card
    part: recap
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "You ordered a page by the visitor's decision: what and when, where and how much, then the action. You kept everything, including small conditions, on the way to the button.\n\nNext: needed isn't the same as big."
      ar: "رتّبت صفحة حسب قرار الزائر: ماذا ومتى، ثم أين وبكم، ثم الزر. وأبقيت كل ما يلزم، حتى الشروط الصغيرة، قبل الزر.\n\nالدرس التالي: الضروري ليس بالضرورة الأكبر."
