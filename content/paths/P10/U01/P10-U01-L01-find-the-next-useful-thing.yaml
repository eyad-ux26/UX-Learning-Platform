id: P10-U01-L01
mode: lesson
minutes: 8
title:
  en: "Put what decides it first"
  ar: "ضع ما يحسم القرار أولًا"
sources:
  - title: { en: "Scrolling and Attention (NN/g)", ar: "التمرير والانتباه (NN/g)" }
    url: "https://www.nngroup.com/articles/scrolling-and-attention/"
  - title: { en: "Visual Hierarchy in UX: Definition (NN/g)", ar: "التسلسل البصري في تجربة المستخدم: تعريف (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/"
  - title: { en: "Inverted Pyramid: Writing for Comprehension (NN/g)", ar: "الهرم المقلوب: الكتابة من أجل الفهم (NN/g)" }
    url: "https://www.nngroup.com/articles/inverted-pyramid/"
review_labels:
  MC-P10-001: { en: "The biggest thing isn't always the most important", ar: "الأكبر ليس دائمًا الأهم" }
  MC-P10-003: { en: "Make no more than two things big", ar: "لا تكبّر أكثر من عنصرين" }
  MC-P10-004: { en: "The first words carry the decision", ar: "الكلمات الأولى تحمل القرار" }
  MC-P10-005: { en: "The main button goes right after the facts", ar: "الزر الرئيسي يأتي بعد المعلومات مباشرة" }
  MC-P10-006: { en: "The order follows the decision", ar: "الترتيب يتبع القرار" }
  MC-P10-015: { en: "Don't block the decision with promotion", ar: "لا تعرقل القرار بالترويج" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Meet Sara", ar: "تعرّف على سارة" }
    body:
      en: "Sara wants a free beginner workshop next week. She works until 17:00, so she can only come in the evening.\n\nShe opens this page on her phone. Can she tell, quickly, whether the time works for her?"
      ar: "تبحث سارة عن ورشة مجانية للمبتدئين في الأسبوع القادم. دوامها ينتهي الساعة 17:00، فلا تستطيع الحضور إلا مساءً.\n\nفتحت هذه الصفحة على هاتفها. هل تعرف بسرعة إن كان الموعد يناسبها؟"
    mock:
      blocks:
        - { kind: image, size: l, text: "@W1i" }
        - { kind: banner, text: "@W1j", gap: m }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: button, text: "@W1f", gap: m }

  - id: S02
    type: tune
    skill: SK-P10-U01-01
    part: try
    rules: [R12]
    value:
      en: "NN/g eyetracking: people spend about 57% of their viewing time above the fold, so the top of the page belongs to what the visitor needs to decide, not to promotion."
      ar: "تتبّع العين في NN/g: يقضي الناس نحو 57% من وقت المشاهدة فوق خط الطيّ (Fold)، فأعلى الصفحة لما يحتاجه الزائر ليقرّر، لا للترويج."
    ref: { url: "https://www.nngroup.com/articles/scrolling-and-attention/", quote: "Reserve the top of the page for high-priority content" }
    prompt:
      en: "What should come first on Sara's phone? Try each order."
      ar: "ماذا يجب أن يأتي أولًا على هاتف سارة؟ جرّب كل ترتيب."
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 380
      blocks:
        - { kind: image, size: l, text: "@W1i" }
        - { kind: banner, text: "@W1j", gap: m }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: button, text: "@W1f", gap: m }
    options:
      - id: button
        text: { en: "The Reserve button first, then the rest", ar: "زر الحجز أولًا، ثم الباقي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: button, text: "@W1f" }
            - { kind: image, size: l, text: "@W1i", gap: m }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
      - id: facts
        text: { en: "Title, time, place and price first, then Reserve; the photo and newsletter after", ar: "العنوان والموعد والمكان والسعر أولًا، ثم زر الحجز؛ والصورة والنشرة بعدها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: image, size: m, text: "@W1i", gap: l }
            - { kind: banner, text: "@W1j", gap: m }
      - id: bigger
        text: { en: "Keep the photo first, but make it smaller", ar: "أبقِ الصورة أولًا، لكن صغّرها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: s, text: "@W1i" }
            - { kind: banner, text: "@W1j", gap: m }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
    answer: [facts]
    misconceptions:
      - id: MC-P10-006
        when: [button]
        feedback:
          en: "Now Sara is asked to reserve before she knows the time. Put the facts she decides with first, then the button."
          ar: "الآن يُطلب من سارة أن تحجز قبل أن تعرف الموعد. ضع المعلومات التي تقرّر بها أولًا، ثم الزر."
      - id: MC-P10-015
        when: [bigger]
        feedback:
          en: "The photo and the newsletter banner still come before the time. Smaller promotion is still promotion in the way."
          ar: "الصورة وشريط النشرة ما زالا قبل الموعد. الترويج الأصغر ما زال ترويجًا يعترض الطريق."
    correct:
      en: "The facts that decide it, then the action."
      ar: "المعلومات التي تحسم القرار، ثم الإجراء."
    explain:
      en: "People spend more than half of their viewing time above the fold. Spend that space on what Sara decides with: what, when, where, how much. Then the Reserve button."
      ar: "يقضي الناس أكثر من نصف وقت المشاهدة فوق خط الطيّ. اصرف هذه المساحة على ما تقرّر به سارة: ماذا ومتى وأين وبكم. ثم زر الحجز."

  - id: S03
    type: card
    part: concept
    icons: [fold, size, text, target]
    title: { en: "The top of the page decides", ar: "أعلى الصفحة يحسم القرار" }
    body:
      en: "- **The first screen:** people spend more than half of their viewing time above the fold. Put what the visitor decides with there.\n- **Two big things at most:** make the most important element biggest, and no more than two elements big. If everything stands out, nothing does.\n- **Key fact first:** in every piece of text, the first words should carry the decision. This is the inverted pyramid.\n- **Action after the facts:** the main button comes right after what people need to decide, high on the page."
      ar: "- **الشاشة الأولى:** يقضي الناس أكثر من نصف وقت المشاهدة فوق خط الطيّ (Fold). ضع هناك ما يقرّر به الزائر.\n- **عنصران كبيران فقط:** اجعل الأهم هو الأكبر، ولا تكبّر أكثر من عنصرين. إن برز كل شيء، فلن يبرز شيء.\n- **المعلومة الأهم أولًا:** في كل نص، يجب أن تحمل الكلمات الأولى ما يحسم القرار. هذا هو الهرم المقلوب (Inverted pyramid).\n- **الإجراء بعد المعلومات:** الزر الرئيسي يأتي بعد ما يحتاجه الناس للقرار مباشرة، في أعلى الصفحة."

  - id: S04
    type: tune
    skill: SK-P10-U01-02
    part: guided
    rules: [R06, R13]
    value:
      en: "NN/g: limit big elements to a maximum of 2 so they stand out. When the title, time, place, price and seats are all bold and big, nothing leads."
      ar: "NN/g: لا تكبّر أكثر من عنصرين حتى يبرزا فعلًا. حين يكون العنوان والموعد والمكان والسعر والأماكن كلها عريضة وكبيرة، لا شيء يقود."
    ref: { url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/", quote: "Limit how many elements are big to a maximum of 2" }
    prompt:
      en: "A teammate made every fact big and bold so \"nothing gets missed\". Try each version. Which one should ship?"
      ar: "جعل زميلك كل المعلومات كبيرة وعريضة حتى «لا يفوت شيء». جرّب كل نسخة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: title, text: "@W1b", gap: s }
        - { kind: title, text: "@W1c", gap: s }
        - { kind: title, text: "@W1d", gap: s }
        - { kind: title, text: "@W1e", gap: s }
        - { kind: button, text: "@W1f", gap: m }
    options:
      - id: photo
        text: { en: "Make a photo the biggest thing, with all the facts small", ar: "اجعل صورة هي الأكبر، وكل المعلومات صغيرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: l, text: "@W1i" }
            - { kind: small, text: "@W1a", gap: s }
            - { kind: small, text: "@W1b", gap: xs }
            - { kind: small, text: "@W1c", gap: xs }
            - { kind: small, text: "@W1d", gap: xs }
            - { kind: button, text: "@W1f", gap: m }
      - id: all
        text: { en: "Keep everything big and bold", ar: "أبقِ كل شيء كبيرًا وعريضًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: title, text: "@W1b", gap: s }
            - { kind: title, text: "@W1c", gap: s }
            - { kind: title, text: "@W1d", gap: s }
            - { kind: title, text: "@W1e", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: two
        text: { en: "Title biggest, the time second, the rest in regular text", ar: "العنوان الأكبر، ثم الموعد، والباقي بنص عادي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: heading, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: xs }
            - { kind: chip, text: "@W1e", gap: s }
            - { kind: button, text: "@W1f", gap: m }
    answer: [two]
    misconceptions:
      - id: MC-P10-003
        when: [all]
        feedback:
          en: "Five big lines compete, so none of them leads and Sara reads them all at the same weight. Choose two to make big."
          ar: "خمسة أسطر كبيرة تتنافس، فلا يقود أيّ منها، وتقرؤها سارة كلها بالوزن نفسه. اختر عنصرين فقط لتكبيرهما."
      - id: MC-P10-001
        when: [photo]
        feedback:
          en: "Now the biggest thing is the one that tells Sara nothing about the time. Size should follow what she decides with."
          ar: "الآن الأكبر هو الشيء الذي لا يخبر سارة بشيء عن الموعد. الحجم يجب أن يتبع ما تقرّر به."
    correct:
      en: "Two levels of big, and the rest calm."
      ar: "مستويان من الحجم الكبير، والباقي هادئ."
    explain:
      en: "Make the most important element biggest, and no more than two elements big. The title says what it is; the time says if Sara can come. Everything else can be regular text."
      ar: "اجعل الأهم هو الأكبر، ولا تكبّر أكثر من عنصرين. العنوان يقول ما هي الورشة، والموعد يقول إن كانت سارة تستطيع الحضور. والباقي يمكن أن يكون نصًّا عاديًا."

  - id: S05
    type: tune
    skill: SK-P10-U01-01
    part: guided
    confidence: true
    rules: [R06, R15]
    value:
      en: "NN/g: keep major calls to action above the fold. A Reserve button after a long description is far from the facts that justify it."
      ar: "NN/g: أبقِ أزرار الإجراء الرئيسية فوق خط الطيّ. زر الحجز بعد وصف طويل بعيد عن المعلومات التي تبرّره."
    ref: { url: "https://www.nngroup.com/articles/scrolling-and-attention/", quote: "Keep major CTAs above the fold." }
    prompt:
      en: "The page now has a long description, and Reserve sits under it. Where should Reserve go?"
      ar: "أصبح في الصفحة وصف طويل، وزر الحجز تحته. أين يجب أن يكون الزر؟"
    mock:
      caption: { en: "Now: first screen", ar: "الآن: الشاشة الأولى" }
      height: 420
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: text, text: { en: "In two hours you'll learn how designers turn an idea into screens. We start with what makes an app easy to use, look at a few real examples, and talk about why some screens confuse people.", ar: "خلال ساعتين ستتعلّم كيف يحوّل المصمّمون الفكرة إلى شاشات. نبدأ بما يجعل التطبيق سهل الاستخدام، ونرى أمثلة حقيقية، ونتحدّث عن سبب ارتباك الناس أمام بعض الشاشات." }, gap: m }
        - { kind: text, text: { en: "Then you'll sketch your own app on paper, get feedback from the group, and leave with a plan for your next steps.", ar: "ثم ترسم تطبيقك على الورق، وتحصل على ملاحظات المجموعة، وتخرج بخطة لخطواتك التالية." }, gap: s }
        - { kind: button, text: "@W1f", gap: l }
    options:
      - id: top
        text: { en: "At the very top, above the title", ar: "في أعلى الصفحة، فوق العنوان" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: button, text: "@W1f" }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: text, text: { en: "In two hours you'll learn how designers turn an idea into screens…", ar: "خلال ساعتين ستتعلّم كيف يحوّل المصمّمون الفكرة إلى شاشات…" }, gap: m }
      - id: after
        text: { en: "Right after the time and price, with the description below it", ar: "بعد الموعد والسعر مباشرة، والوصف تحته" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: text, text: { en: "In two hours you'll learn how designers turn an idea into screens…", ar: "خلال ساعتين ستتعلّم كيف يحوّل المصمّمون الفكرة إلى شاشات…" }, gap: l }
      - id: end
        text: { en: "Keep it under the description, so people read everything first", ar: "أبقِه تحت الوصف، حتى يقرأ الناس كل شيء أولًا" }
        mock:
          caption: { en: "After this change: first screen", ar: "بعد هذا التغيير: الشاشة الأولى" }
          height: 420
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: text, text: { en: "In two hours you'll learn how designers turn an idea into screens. We start with what makes an app easy to use, look at a few real examples, and talk about why some screens confuse people.", ar: "خلال ساعتين ستتعلّم كيف يحوّل المصمّمون الفكرة إلى شاشات. نبدأ بما يجعل التطبيق سهل الاستخدام، ونرى أمثلة حقيقية، ونتحدّث عن سبب ارتباك الناس أمام بعض الشاشات." }, gap: m }
            - { kind: text, text: { en: "Then you'll sketch your own app on paper, get feedback from the group, and leave with a plan for your next steps.", ar: "ثم ترسم تطبيقك على الورق، وتحصل على ملاحظات المجموعة، وتخرج بخطة لخطواتك التالية." }, gap: s }
            - { kind: button, text: "@W1f", gap: l }
    answer: [after]
    misconceptions:
      - id: MC-P10-005
        when: [end]
        feedback:
          en: "On a phone the button drops below the first screen, away from the time and price that made Sara want it. Most people won't read the whole description first."
          ar: "على الهاتف ينزل الزر تحت الشاشة الأولى، بعيدًا عن الموعد والسعر اللذين جعلا سارة تريده. ومعظم الناس لن يقرؤوا الوصف كله أولًا."
      - id: MC-P10-006
        when: [top]
        feedback:
          en: "Now the button asks Sara to commit before she has seen the time. Facts first, then the action."
          ar: "الآن يطلب الزر من سارة أن تلتزم قبل أن ترى الموعد. المعلومات أولًا، ثم الإجراء."
    correct:
      en: "Decide, then act, on the first screen."
      ar: "قرّر ثم تصرّف، في الشاشة الأولى."
    explain:
      en: "Keep the main action above the fold. Put Reserve right after the facts that justify it; people who want more can keep reading below."
      ar: "أبقِ الإجراء الرئيسي فوق خط الطيّ. ضع زر الحجز بعد المعلومات التي تبرّره مباشرة، ومن يريد المزيد يكمل القراءة تحته."

  - id: S06
    type: compare
    skill: SK-P10-U01-03
    part: contrast
    rules: [R11, R15]
    value:
      en: "NN/g's inverted pyramid: the first sentence of every paragraph should be the most important, because people scan. A friendly opening that delays the time costs the decision."
      ar: "الهرم المقلوب من NN/g: الجملة الأولى في كل فقرة يجب أن تكون الأهم، لأن الناس يتصفّحون بسرعة. والمقدّمة اللطيفة التي تؤخّر الموعد تضيّع القرار."
    ref: { url: "https://www.nngroup.com/articles/inverted-pyramid/", quote: "The first sentence of every paragraph should be the most important." }
    prompt:
      en: "Sara reads only the first line of each description. In which version does that line tell her if she can come?"
      ar: "تقرأ سارة السطر الأول فقط من كل وصف. في أي نسخة يخبرها هذا السطر إن كانت تستطيع الحضور؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@W1a" }
          - { kind: text, text: { en: "Join a relaxed, friendly evening where you'll discover how designers think and meet people who love apps as much as you do. It runs from 18:00 to 20:00 and it's free.", ar: "انضم إلى أمسية هادئة وودودة تكتشف فيها كيف يفكّر المصمّمون، وتلتقي بأشخاص يحبّون التطبيقات مثلك. تبدأ الساعة 18:00 وتنتهي الساعة 20:00، وهي مجانية." }, gap: s }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@W1a" }
          - { kind: text, text: { en: "Free, from 18:00 to 20:00 on Tuesday. You'll sketch your first app screens on paper, with no design tool needed, and meet people who love apps as much as you do.", ar: "مجانية، من 18:00 إلى 20:00 يوم الثلاثاء. سترسم أول شاشات تطبيقك على الورق، دون أي أداة تصميم، وتلتقي بأشخاص يحبّون التطبيقات مثلك." }, gap: s }
    answer: b
    reason:
      prompt: { en: "What makes B work?", ar: "ما الذي يجعل B تنجح؟" }
      options:
        - { id: short, text: { en: "It's shorter", ar: "لأنها أقصر" } }
        - { id: tone, text: { en: "Its tone is friendlier", ar: "لأن أسلوبها أكثر ودًّا" } }
        - { id: first, text: { en: "The time and price come in its first words", ar: "لأن الموعد والسعر في كلماتها الأولى" } }
      answer: [first]
      misconceptions:
        - id: MC-P10-004
          when: [short, tone]
          feedback:
            en: "Both are about the same length and both are friendly. The difference is where the time and price sit."
            ar: "النصّان بالطول نفسه تقريبًا، وكلاهما ودود. الفرق هو مكان الموعد والسعر."
    misconceptions:
      - id: MC-P10-004
        when: [a]
        feedback:
          en: "A's first line is all welcome and no facts. The time only arrives at the end, after Sara has stopped reading."
          ar: "السطر الأول في A ترحيب فقط بلا معلومات. والموعد لا يأتي إلا في النهاية، بعد أن تتوقّف سارة عن القراءة."
    correct:
      en: "Lead with the facts; the warmth can follow."
      ar: "ابدأ بالمعلومات، والودّ يأتي بعدها."
    explain:
      en: "People rarely read carefully on screens, so writing should follow the inverted pyramid: the conclusion first. Same words, better order."
      ar: "الناس نادرًا ما يقرؤون بتمعّن على الشاشات، لذلك يجب أن تتبع الكتابة الهرم المقلوب: الخلاصة أولًا. الكلمات نفسها، بترتيب أفضل."

  - id: S07
    type: tune
    skill: SK-P10-U01-01
    part: independent
    confidence: true
    rules: [R14, R19]
    value:
      en: "New case: on a delivery tracking screen the decision is \"when will it arrive?\". The arrival time leads; a big map and a promo don't."
      ar: "حالة جديدة: في شاشة تتبّع التوصيل، السؤال هو «متى يصل الطلب؟». وقت الوصول يتصدّر، لا الخريطة الكبيرة ولا العرض الترويجي."
    ref: { url: "https://www.nngroup.com/articles/inverted-pyramid/", quote: "the most important information" }
    scenario:
      en: "Lina ordered dinner. She opens the tracking screen to see when it will arrive, so she can be at the door."
      ar: "طلبت لينا العشاء. وفتحت شاشة التتبّع لتعرف متى يصل، حتى تكون عند الباب."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: banner, text: "@D1d" }
        - { kind: image, size: l, text: { en: "Map", ar: "خريطة" }, gap: m }
        - { kind: meta, text: "@D1c", gap: m }
        - { kind: meta, text: "@D1a", gap: s }
        - { kind: meta, text: "@D1b", gap: s }
    options:
      - id: map
        text: { en: "Make the map full-screen so she can follow the driver", ar: "اجعل الخريطة بملء الشاشة حتى تتابع السائق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: image, size: xl, text: { en: "Map", ar: "خريطة" } }
            - { kind: meta, text: "@D1a", gap: s }
      - id: promo
        text: { en: "Keep the order, but make the offer smaller", ar: "أبقِ الترتيب، لكن صغّر العرض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, text: "@D1d" }
            - { kind: image, size: l, text: { en: "Map", ar: "خريطة" }, gap: m }
            - { kind: meta, text: "@D1c", gap: m }
            - { kind: meta, text: "@D1a", gap: s }
      - id: time
        text: { en: "The arrival time first and biggest, then the driver, the order and a smaller map; the offer last", ar: "وقت الوصول أولًا وبأكبر حجم، ثم السائق والطلب وخريطة أصغر؛ والعرض في الأخير" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@D1a" }
            - { kind: meta, text: "@D1b", gap: s }
            - { kind: meta, text: "@D1c", gap: s }
            - { kind: image, size: m, text: { en: "Map", ar: "خريطة" }, gap: m }
            - { kind: small, text: "@D1d", gap: l }
    answer: [time]
    misconceptions:
      - id: MC-P10-001
        when: [map]
        feedback:
          en: "The map is the biggest thing on screen, but Lina still has to hunt for the one line she came for: when it arrives."
          ar: "الخريطة هي الأكبر على الشاشة، لكن لينا ما زالت تبحث عن السطر الوحيد الذي جاءت من أجله: متى يصل الطلب."
      - id: MC-P10-015
        when: [promo]
        feedback:
          en: "The offer and the map still come before the arrival time. Shrinking the promo doesn't move the answer up."
          ar: "العرض والخريطة ما زالا قبل وقت الوصول. تصغير العرض لا يرفع الإجابة إلى الأعلى."
    correct:
      en: "Answer the question she opened the screen for."
      ar: "أجب عن السؤال الذي فتحت الشاشة من أجله."
    explain:
      en: "Same rule, new screen: the most important information first, and biggest. For tracking, that's the arrival time. The map supports it; the offer can wait."
      ar: "القاعدة نفسها في شاشة جديدة: المعلومة الأهم أولًا وبأكبر حجم. وفي التتبّع هي وقت الوصول. الخريطة تدعمها، والعرض يمكنه الانتظار."

  - id: S08
    type: card
    part: recap
    icons: [fold, size, text, target]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **First screen:** the facts that decide it, then the action.\n- **Two big things:** the title and the one fact that decides it.\n- **First words:** time and price before the welcome.\n- **New screen, same rule:** a tracking screen leads with the arrival time.\n\nNext lesson: what you can hide, and what you can't."
      ar: "- **الشاشة الأولى:** المعلومات التي تحسم القرار، ثم الإجراء.\n- **عنصران كبيران:** العنوان والمعلومة التي تحسم القرار.\n- **الكلمات الأولى:** الموعد والسعر قبل الترحيب.\n- **شاشة جديدة والقاعدة نفسها:** شاشة التتبّع تبدأ بوقت الوصول.\n\nالدرس التالي: ما يمكنك إخفاؤه، وما لا يمكنك."
