id: P10-U01-L01
mode: lesson
minutes: 7
title:
  en: "Find the next useful thing"
  ar: "اعثر على الشيء المفيد التالي"
review_labels:
  MC-P10-001: { en: "The biggest thing isn't always the most important", ar: "الأكبر ليس دائمًا الأهم" }
  MC-P10-002: { en: "Supporting doesn't mean hidden", ar: "الداعم لا يعني المخفي" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Meet Sara", ar: "تعرّف على سارة" }
    body:
      en: "Sara wants a free beginner workshop next week. She works until 17:00, so she can only come in the evening.\n\nShe opens this page on her phone. Can she tell, quickly, whether this session works for her?"
      ar: "تريد سارة ورشة مجانية للمبتدئين الأسبوع القادم. تعمل حتى الساعة 17:00، لذلك لا تستطيع الحضور إلا مساءً.\n\nفتحت هذه الصفحة على هاتفها. هل تستطيع أن تعرف بسرعة إن كانت هذه الجلسة تناسبها؟"
    mock: &promoFirst
      blocks:
        - { kind: image, size: l, text: "@W1i" }
        - { kind: banner, text: "@W1j", gap: m }
        - { kind: title, text: "@W1a", gap: m }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: chip, text: "@W1e", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: small, text: "@W1g", gap: s }
        - { kind: link, text: "@W1h", gap: s }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Before we start: what is Sara looking for first on this page?"
      ar: "قبل أن نبدأ: ما أول شيء تبحث عنه سارة في هذه الصفحة؟"
    mock: *promoFirst
    options:
      - { id: photo, text: { en: "The photo", ar: "الصورة" } }
      - { id: title, text: { en: "The workshop title", ar: "عنوان الورشة" } }
      - { id: time, text: { en: "The date and time", ar: "التاريخ والوقت" } }
      - { id: news, text: { en: "The newsletter", ar: "النشرة البريدية" } }
    reveal:
      en: "Keep your answer in mind. We'll come back to it at the end of the lesson."
      ar: "تذكّر إجابتك. سنعود إليها في نهاية الدرس."

  - id: S03
    type: card
    part: concept
    title: { en: "Hierarchy follows the decision", ar: "التسلسل يتبع القرار" }
    body:
      en: "**Visual hierarchy** is how a screen shows what matters more, using size, position, spacing and contrast.\n\nStart with the question the visitor is trying to answer. Sara's question is: can I attend, and should I reserve? Whatever answers that question comes first. Promotion and decoration come after, even when they are big and colorful."
      ar: "**التسلسل البصري (Visual hierarchy)** هو الطريقة التي توضّح بها الشاشة ما هو أهم، باستخدام الحجم والموضع والمسافات والتباين.\n\nابدأ بالسؤال الذي يحاول الزائر الإجابة عنه. سؤال سارة هو: هل أستطيع الحضور، وهل أحجز؟ كل ما يجيب عن هذا السؤال يأتي أولًا. أما الترويج والزخرفة فيأتيان بعده، حتى لو كانا كبيرين وملوّنين."

  - id: S04
    type: sort
    part: guided
    rules: [R06, R15]
    prompt:
      en: "Which of these does Sara need to decide whether to reserve?"
      ar: "أيٌّ من هذه تحتاجه سارة لتقرّر هل تحجز أم لا؟"
    items:
      - { id: W1a, text: "@W1a" }
      - { id: W1b, text: "@W1b" }
      - { id: W1c, text: "@W1c" }
      - { id: W1d, text: "@W1d" }
      - { id: W1i, text: "@W1i" }
      - { id: W1j, text: "@W1j" }
    buckets:
      - { id: need, label: { en: "Needed to decide", ar: "ضروري للقرار" } }
      - { id: nice, label: { en: "Nice to have", ar: "إضافي" } }
    answer:
      need: [W1a, W1b, W1c, W1d]
      nice: [W1i, W1j]
    misconceptions:
      - id: MC-P10-001
        when: { item: W1i, bucket: need }
        feedback:
          en: "The photo is the biggest thing on the page, but it doesn't tell Sara when, where or how much. Size isn't the same as importance."
          ar: "الصورة هي أكبر شيء في الصفحة، لكنها لا تخبر سارة متى ولا أين ولا بكم. الحجم لا يعني الأهمية."
      - id: MC-P10-003
        when: { item: W1b, bucket: nice }
        feedback:
          en: "Sara can only come after 17:00. Without the time she can't tell if this session works for her."
          ar: "سارة لا تستطيع الحضور إلا بعد الساعة 17:00. بدون الوقت لن تعرف إن كانت الجلسة تناسبها."
      - id: MC-P10-004
        when: { item: W1j, bucket: need }
        feedback:
          en: "The newsletter is for later visits. Sara can reserve without it."
          ar: "النشرة البريدية للزيارات اللاحقة. تستطيع سارة الحجز بدونها."
    hints:
      - { en: "Ask of each item: would Sara decide differently if it were missing?", ar: "اسأل عن كل عنصر: هل سيتغيّر قرار سارة لو كان غير موجود؟" }
    correct:
      en: "Title, time, place and price all change Sara's decision. The photo and newsletter don't."
      ar: "العنوان والوقت والمكان والسعر كلها تغيّر قرار سارة. الصورة والنشرة لا تغيّرانه."
    explain:
      en: "An item is needed when the decision would change without it. If the session were at 15:00, or cost money, Sara might not reserve. The photo and the newsletter can stay on the page, but they don't decide anything."
      ar: "يكون العنصر ضروريًا عندما يتغيّر القرار بدونه. لو كانت الجلسة الساعة 15:00 أو كانت مدفوعة، فقد لا تحجز سارة. يمكن أن تبقى الصورة والنشرة في الصفحة، لكنهما لا تحسمان أي شيء."

  - id: S05
    type: choose
    part: guided
    rules: [R10, R15]
    prompt:
      en: "The cancellation rule is long and small. Should Sara see it before she taps Reserve?"
      ar: "قاعدة الإلغاء طويلة وصغيرة. هل يجب أن تراها سارة قبل أن تضغط «احجز»؟"
    scenario: "@W1g"
    options:
      - { id: yes, text: { en: "Yes, before Reserve", ar: "نعم، قبل «احجز»" } }
      - { id: after, text: { en: "No, after she reserves", ar: "لا، بعد أن تحجز" } }
      - { id: hide, text: { en: "No, put it behind a link", ar: "لا، ضعها خلف رابط" } }
    answer: [yes]
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: commit, text: { en: "It changes what Sara is committing to", ar: "لأنها تغيّر ما تلتزم به سارة" } }
        - { id: legal, text: { en: "Legal text always goes first", ar: "لأن النصوص القانونية تأتي أولًا دائمًا" } }
        - { id: clean, text: { en: "A cleaner page converts better", ar: "لأن الصفحة الأنظف تحقّق حجوزات أكثر" } }
      answer: [commit]
      misconceptions:
        - id: MC-P10-005
          when: [legal]
          feedback:
            en: "It's not about legal text in general. This rule matters because it changes what Sara agrees to when she reserves."
            ar: "الأمر لا يتعلّق بالنصوص القانونية عمومًا. هذه القاعدة مهمة لأنها تغيّر ما توافق عليه سارة عند الحجز."
    misconceptions:
      - id: MC-P10-002
        when: [after, hide]
        feedback:
          en: "If Sara only finds the rule after reserving, she committed without knowing it. Supporting information can be smaller, but it still has to be there before the action."
          ar: "إذا لم تجد سارة القاعدة إلا بعد الحجز، فقد التزمت دون أن تعرفها. المعلومات الداعمة يمكن أن تكون أصغر، لكن يجب أن تكون موجودة قبل الإجراء."
    hints:
      - { en: "What happens if Sara's plans change after she reserves?", ar: "ماذا يحدث لو تغيّرت خطط سارة بعد أن تحجز؟" }
    correct:
      en: "It doesn't need to be big, but it must come before the commitment."
      ar: "لا تحتاج أن تكون كبيرة، لكن يجب أن تأتي قبل الالتزام."
    explain:
      en: "Priority and presence are different questions. The cancellation rule can be small, below the button's label even, but it must be on the path to Reserve, not after it."
      ar: "الأولوية والظهور سؤالان مختلفان. قاعدة الإلغاء يمكن أن تكون صغيرة، لكن يجب أن تكون في الطريق إلى زر «احجز»، لا بعده."

  - id: S06
    type: order
    part: guided
    confidence: true
    rules: [R06, R15]
    prompt:
      en: "Put these in the order Sara should meet them, top to bottom."
      ar: "رتّب هذه بالترتيب الذي يجب أن تراها به سارة، من الأعلى إلى الأسفل."
    items:
      - { id: W1f, text: "@W1f" }
      - { id: W1d, text: "@W1d" }
      - { id: W1a, text: "@W1a" }
      - { id: W1b, text: "@W1b" }
      - { id: W1c, text: "@W1c" }
    answer: [W1a, W1b, W1c, W1d, W1f]
    also_ok:
      - answer: [W1b, W1a, W1c, W1d, W1f]
        feedback:
          en: "That works too. Date first is fine when the title stays right next to it, because both answer \"what and when\"."
          ar: "هذا يصلح أيضًا. البدء بالتاريخ مقبول ما دام العنوان بجانبه مباشرة، لأن الاثنين يجيبان عن «ماذا ومتى»."
      - answer: [W1a, W1b, W1d, W1c, W1f]
        feedback:
          en: "That works too. Price and place can swap; both come before the button."
          ar: "هذا يصلح أيضًا. يمكن تبديل السعر والمكان؛ المهم أن يأتيا قبل الزر."
    misconceptions:
      - id: MC-P10-006
        when: { before: [W1f, W1b] }
        feedback:
          en: "The button comes before the time, so Sara could reserve without checking that 18:00 works. Put the facts she decides with before the action."
          ar: "الزر يأتي قبل الوقت، لذلك قد تحجز سارة دون أن تتأكد أن 18:00 يناسبها. ضع الحقائق التي تقرّر بها قبل الإجراء."
    hints:
      - { en: "The button is the last step of the decision, not the first.", ar: "الزر هو آخر خطوة في القرار، لا أولها." }
    correct:
      en: "What and when, then where and how much, then the action."
      ar: "ماذا ومتى، ثم أين وبكم، ثم الإجراء."
    explain:
      en: "There's more than one good order. The rule is that the facts Sara decides with come before the button. Title and date can swap; place and price can swap."
      ar: "يوجد أكثر من ترتيب جيد. القاعدة أن الحقائق التي تقرّر بها سارة تأتي قبل الزر. يمكن تبديل العنوان والتاريخ، ويمكن تبديل المكان والسعر."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, R15]
    prompt:
      en: "Which version helps Sara decide faster?"
      ar: "أي نسخة تساعد سارة على القرار أسرع؟"
    a:
      mock: *promoFirst
    b:
      mock: &decisionFirst
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: meta, text: "@W1b", gap: s }
          - { kind: meta, text: "@W1c", gap: s }
          - kind: row
            gap: s
            blocks:
              - { kind: meta, text: "@W1d" }
              - { kind: chip, text: "@W1e" }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: small, text: "@W1g", gap: s }
          - { kind: link, text: "@W1h", gap: s }
          - { kind: image, size: s, text: "@W1i", gap: l }
          - { kind: link, text: "@W1j", gap: s }
    answer: b
    reason:
      prompt: { en: "What makes the difference?", ar: "ما الذي يصنع الفرق؟" }
      options:
        - { id: time, text: { en: "Sara sees the time before anything else", ar: "ترى سارة الوقت قبل أي شيء آخر" } }
        - { id: short, text: { en: "It has fewer things on it", ar: "فيها عناصر أقل" } }
        - { id: photo, text: { en: "The photo is smaller, so it looks cleaner", ar: "الصورة أصغر، فتبدو أنظف" } }
      answer: [time]
      misconceptions:
        - id: MC-P10-007
          when: [short, photo]
          feedback:
            en: "Both versions have exactly the same items. What changed is the order: the facts that decide come first."
            ar: "النسختان فيهما العناصر نفسها تمامًا. ما تغيّر هو الترتيب: الحقائق التي تحسم القرار تأتي أولًا."
    misconceptions:
      - id: MC-P10-001
        when: [a]
        feedback:
          en: "Version A opens with the photo and newsletter. Sara has to scroll past them to find out whether she can even come."
          ar: "النسخة A تبدأ بالصورة والنشرة. على سارة أن تتجاوزهما لتعرف إن كانت تستطيع الحضور أصلًا."
    correct:
      en: "Nothing was removed, only reordered."
      ar: "لم يُحذف شيء، فقط تغيّر الترتيب."
    explain:
      en: "Both screens hold the same ten items. B leads with what answers Sara's question, then the action, then the extras. That's the whole skill: same content, ordered by the decision."
      ar: "الشاشتان تحتويان العناصر العشرة نفسها. النسخة B تبدأ بما يجيب عن سؤال سارة، ثم الإجراء، ثم الإضافات. هذه هي المهارة كلها: المحتوى نفسه، مرتّبًا حسب القرار."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, R19]
    prompt:
      en: "A week later the session is full. What should lead the page now?"
      ar: "بعد أسبوع اكتمل حجز الجلسة. ما الذي يجب أن يتصدّر الصفحة الآن؟"
    mock:
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: chip, tone: bad, text: "@W1full", gap: s }
        - { kind: button, tone: off, text: "@W1f", gap: m }
    options:
      - { id: same, text: { en: "Keep the same order; the Reserve button just turns grey", ar: "أبقِ الترتيب نفسه؛ يصبح زر «احجز» رماديًا فقط" } }
      - { id: next, text: { en: "Say it's full, and lead with the next session or the waiting list", ar: "وضّح أنها مكتملة، وابدأ بالجلسة التالية أو قائمة الانتظار" } }
      - { id: photo, text: { en: "Lead with the photo so the page still looks inviting", ar: "ابدأ بالصورة حتى تبقى الصفحة جذّابة" } }
    answer: [next]
    misconceptions:
      - id: MC-P10-008
        when: [same]
        feedback:
          en: "A grey button tells Sara what she can't do, but not what she can do instead. When the situation changes, the next useful thing changes too."
          ar: "الزر الرمادي يخبر سارة بما لا تستطيع فعله، لكن لا يخبرها بما تستطيع فعله بدلًا منه. عندما يتغيّر الموقف، يتغيّر الشيء المفيد التالي أيضًا."
      - id: MC-P10-001
        when: [photo]
        feedback:
          en: "An inviting photo doesn't help Sara now. She needs to know it's full and what her options are."
          ar: "الصورة الجذّابة لا تساعد سارة الآن. هي تحتاج أن تعرف أن الجلسة مكتملة وما خياراتها."
    correct:
      en: "The decision changed, so the order changes."
      ar: "القرار تغيّر، فتغيّر الترتيب."
    explain:
      en: "Priority isn't fixed by the brand or the template. It follows what the visitor can decide right now. When the session is full, \"Fully booked\" plus the next date or the waiting list becomes the next useful thing."
      ar: "الأولوية لا تحدّدها العلامة التجارية ولا القالب. بل تتبع ما يستطيع الزائر أن يقرّره الآن. عندما تكتمل الجلسة، تصبح عبارة «اكتمل الحجز» مع الموعد التالي أو قائمة الانتظار هي الشيء المفيد التالي."

  - id: S09
    type: predict
    part: independent
    any_ok: true
    recall: S02
    rules: [R21]
    prompt:
      en: "Back to your first guess. Now, what should Sara find first on this page?"
      ar: "عودة إلى توقّعك الأول. الآن، ما أول شيء يجب أن تجده سارة في هذه الصفحة؟"
    options:
      - { id: photo, text: { en: "The photo", ar: "الصورة" } }
      - { id: title, text: { en: "The workshop title", ar: "عنوان الورشة" } }
      - { id: time, text: { en: "The date and time", ar: "التاريخ والوقت" } }
      - { id: news, text: { en: "The newsletter", ar: "النشرة البريدية" } }
    reveal:
      en: "Title or time, both are good answers: they answer \"what and when\". If your first guess was the photo, notice what changed: you now order by Sara's question, not by what's biggest."
      ar: "العنوان أو الوقت، كلاهما إجابة جيدة: يجيبان عن «ماذا ومتى». إذا كان توقّعك الأول هو الصورة، فلاحظ ما تغيّر: أصبحت ترتّب حسب سؤال سارة، لا حسب الأكبر حجمًا."

  - id: S10
    type: card
    part: recap
    title: { en: "What you did", ar: "ما أنجزته" }
    body:
      en: "You ordered a page by the visitor's decision: what and when, where and how much, then the action. You kept everything, including small conditions, on the way to the button.\n\nNext: needed isn't the same as big."
      ar: "رتّبت صفحة حسب قرار الزائر: ماذا ومتى، ثم أين وبكم، ثم الإجراء. وأبقيت كل شيء، حتى الشروط الصغيرة، في الطريق إلى الزر.\n\nالتالي: الضروري ليس هو الأكبر."
