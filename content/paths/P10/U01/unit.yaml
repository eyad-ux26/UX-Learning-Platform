id: P10-U01
free: true
title:
  en: "Put the decision first"
  ar: "ضع القرار أولًا"
skill:
  en: "Order a page so a visitor can decide before they act, without hiding anything they need."
  ar: "رتّب الصفحة بحيث يستطيع الزائر أن يقرّر قبل أن يتصرّف، دون إخفاء أي شيء يحتاجه."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U01-01
    title: { en: "Put the deciding facts first", ar: "ضع معلومات القرار أولًا" }
    can_do: { en: "Order a screen so the facts people decide with come before the main action and before any promotion.", ar: "رتّب الشاشة بحيث تأتي المعلومات التي يقرّر بها الناس قبل الإجراء الرئيسي وقبل أي ترويج." }
  - id: SK-P10-U01-02
    title: { en: "Make no more than two things big", ar: "لا تكبّر أكثر من عنصرين" }
    can_do: { en: "Pick at most two elements to make big, and choose the ones people decide with.", ar: "اختر عنصرين على الأكثر لتكبيرهما، واختر ما يقرّر به الناس." }
  - id: SK-P10-U01-03
    title: { en: "Lead text with what decides it", ar: "ابدأ النص بما يحسم القرار" }
    can_do: { en: "Pick or write text whose first words answer the question people came with.", ar: "اختر نصًا أو اكتبه بحيث تجيب كلماته الأولى عن السؤال الذي جاء به الناس." }
  - id: SK-P10-U01-04
    title: { en: "Keep what most people need in view", ar: "أبقِ ما يحتاجه معظم الناس ظاهرًا" }
    can_do: { en: "Decide what stays on the screen and what goes behind a link, by how many people need it.", ar: "قرّر ما يبقى على الشاشة وما يذهب خلف رابط، حسب عدد من يحتاجونه." }
  - id: SK-P10-U01-05
    title: { en: "Hide details in few, clearly named levels", ar: "أخفِ التفاصيل في مستويات قليلة بأسماء واضحة" }
    can_do: { en: "Name a link by what's behind it, keep to two levels, and keep things decided together on one screen.", ar: "سمِّ الرابط بما خلفه، ولا تتجاوز مستويين، وأبقِ ما يُقرَّر معًا في شاشة واحدة." }
  - id: SK-P10-U01-06
    title: { en: "Don't make content look like an ad", ar: "لا تجعل المحتوى يشبه الإعلان" }
    can_do: { en: "Style and place real content so people don't take it for an ad and skip it.", ar: "صمّم المحتوى الحقيقي وضعه بحيث لا يظنّه الناس إعلانًا فيتخطّونه." }
  - id: SK-P10-U01-07
    title: { en: "Use photos that carry information", ar: "استخدم صورًا تحمل معلومة" }
    can_do: { en: "Keep a photo when it shows what people need to decide or act, and drop it when it's decoration.", ar: "أبقِ الصورة عندما تُظهر ما يحتاجه الناس ليقرّروا أو يتصرّفوا، واحذفها إذا كانت للزينة فقط." }
