id: P10-U02-L04
mode: check
minutes: 7
title:
  en: "Skill check: group what belongs together"
  ar: "اختبار المهارة: اجمع ما ينتمي معًا"
sources:
  - title: { en: "Proximity Principle in Visual Design (NN/g)", ar: "مبدأ التقارب في التصميم البصري (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-proximity/"
  - title: { en: "The Illusion of Completeness (NN/g)", ar: "وهم اكتمال الصفحة (NN/g)" }
    url: "https://www.nngroup.com/articles/illusion-of-completeness/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "صعوبات مستخدمي الـ Screen reader على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Comparison Tables for Products, Services, and Features (NN/g)", ar: "جداول مقارنة المنتجات والخدمات والميزات (NN/g)" }
    url: "https://www.nngroup.com/articles/comparison-tables/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Rana's gym app", ar: "تطبيق النادي الذي تستخدمه رنا" }
    body:
      en: "Rana wants to book a Sunday class in her gym's app, and maybe change her membership. You're reviewing the app's screens before launch.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "تريد رنا حجز حصة يوم الأحد في تطبيق ناديها، وربما تغيير اشتراكها. وأنت تراجع شاشات التطبيق قبل إطلاقه.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      blocks:
        - { kind: title, text: { en: "Sunday classes", ar: "حصص الأحد" } }
        - { kind: heading, text: "@G1a", gap: l }
        - { kind: small, text: "@G1b", gap: xs }
        - { kind: chip, text: "@G1c", gap: xs }
        - { kind: button, emphasis: low, text: "@G1d", gap: s }
        - { kind: heading, text: "@G1e", gap: xl }
        - { kind: small, text: "@G1f", gap: xs }
        - { kind: chip, tone: warn, text: "@G1g", gap: xs }
        - { kind: button, emphasis: low, text: "@G1h", gap: s }

  - id: S02
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, label spacing (NN/g): each label closer to its own field than to any other."
      ar: "اختبار مهارة، مسافات التسميات (NN/g): كل تسمية أقرب إلى حقلها من أي حقل آخر."
    prompt:
      en: "The booking form asks for three details. Try each spacing. Which one should ship?"
      ar: "نموذج الحجز يطلب ثلاث معلومات. جرّب كل توزيع للمسافات. أيّها يجب أن يُطلق؟"
    start: low
    options:
      - id: low
        text: { en: "Labels close under the field before them", ar: "التسميات قريبة تحت الحقل الذي قبلها" }
        mock:
          blocks:
            - { kind: small, text: { en: "Full name", ar: "الاسم الكامل" } }
            - { kind: field, text: { en: "Rana Adel", ar: "رنا عادل" }, gap: l }
            - { kind: small, text: { en: "Mobile number", ar: "رقم الجوال" }, gap: xs }
            - { kind: field, text: "010 1234 5678", gap: l }
            - { kind: small, text: { en: "Member number", ar: "رقم العضوية" }, gap: xs }
            - { kind: field, text: "G-4471", gap: l }
      - id: own
        text: { en: "Labels close above their own field", ar: "التسميات قريبة فوق حقلها" }
        mock:
          blocks:
            - { kind: small, text: { en: "Full name", ar: "الاسم الكامل" } }
            - { kind: field, text: { en: "Rana Adel", ar: "رنا عادل" }, gap: xs }
            - { kind: small, text: { en: "Mobile number", ar: "رقم الجوال" }, gap: l }
            - { kind: field, text: "010 1234 5678", gap: xs }
            - { kind: small, text: { en: "Member number", ar: "رقم العضوية" }, gap: l }
            - { kind: field, text: "G-4471", gap: xs }
      - id: even
        text: { en: "The same gap above and below every label", ar: "المسافة نفسها فوق كل تسمية وتحتها" }
        mock:
          blocks:
            - { kind: small, text: { en: "Full name", ar: "الاسم الكامل" } }
            - { kind: field, text: { en: "Rana Adel", ar: "رنا عادل" }, gap: m }
            - { kind: small, text: { en: "Mobile number", ar: "رقم الجوال" }, gap: m }
            - { kind: field, text: "010 1234 5678", gap: m }
            - { kind: small, text: { en: "Member number", ar: "رقم العضوية" }, gap: m }
            - { kind: field, text: "G-4471", gap: m }
    answer: [own]
    misconceptions:
      - id: MC-P10-023
        when: [low, even]
        feedback:
          en: "A label must be closer to its own field than to any other, or people can't tell which field it names."
          ar: "يجب أن تكون التسمية أقرب إلى حقلها من أي حقل آخر، وإلا لا يعرف الناس أي حقل تسمّي."
    correct:
      en: "Each label hugs its own field."
      ar: "كل تسمية ملتصقة بحقلها."
    explain:
      en: "From Lesson 1: a label and its field are a group of two. Small gap inside the pair, bigger gap before the next label."
      ar: "من الدرس 1: التسمية وحقلها مجموعة من عنصرين. مسافة صغيرة داخل الزوج، ومسافة أكبر قبل التسمية التالية."

  - id: S03
    type: fix
    part: check
    rules: [R19]
    value:
      en: "Skill check, distance hides things (NN/g, Kayak): an optional path far from the main buttons makes the step look required."
      ar: "اختبار مهارة، البعيد لا يُرى (NN/g، Kayak): الطريق الاختياري البعيد عن الأزرار الرئيسية يجعل الخطوة تبدو إلزامية."
    scenario:
      en: "Visitors can book a trial class without joining. In testing, most visitors thought they had to become members first."
      ar: "يستطيع الزوّار حجز حصة تجريبية دون اشتراك. لكن في الاختبار ظنّ معظمهم أن عليهم الاشتراك أولًا."
    prompt:
      en: "What should you change?"
      ar: "ماذا تغيّر؟"
    mock:
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: small, text: "" }
            - { kind: link, text: { en: "Guest", ar: "زائر" } }
        - { kind: title, text: { en: "Book your first class", ar: "احجز حصتك الأولى" }, gap: xl }
        - { kind: button, text: { en: "Become a member", ar: "اشترك في النادي" }, gap: l }
        - { kind: button, emphasis: low, text: { en: "I'm already a member", ar: "أنا مشترك بالفعل" }, gap: s }
    options:
      - { id: under, text: { en: "Add \"Book a trial class as a guest\" right under the two buttons", ar: "أضف «احجز حصة تجريبية كزائر» تحت الزرّين مباشرة" } }
      - { id: bold, text: { en: "Keep Guest in the corner but make it bold", ar: "أبقِ «زائر» في الزاوية لكن اجعله عريضًا" } }
      - { id: popup, text: { en: "Show a pop-up explaining that guests can book", ar: "اعرض نافذة منبثقة تشرح أن الزوّار يستطيعون الحجز" } }
    answer: [under]
    misconceptions:
      - id: MC-P10-033
        when: [bold, popup]
        feedback:
          en: "People look at the buttons, where the choice is. The guest path must be one of those choices, not a separate message or a corner link."
          ar: "ينظر الناس إلى الأزرار، حيث يكون الاختيار. والطريق للزوّار يجب أن يكون أحد هذه الخيارات، لا رسالة منفصلة ولا رابطًا في الزاوية."
    explain:
      en: "From Lesson 1: NN/g saw Kayak's far-away Skip link make sign-in look required. An optional path sits inside the group of choices it belongs to."
      ar: "من الدرس 1: رأت NN/g رابط «تخطَّ» البعيد في Kayak يجعل تسجيل الدخول يبدو إلزاميًا. الطريق الاختياري مكانه داخل مجموعة الخيارات التي ينتمي إليها."

  - id: S04
    type: fix
    part: check
    rules: [R19]
    value:
      en: "Skill check, false floors (NN/g): a full-width band plus empty space looks like the end of the page; let the next item peek."
      ar: "اختبار مهارة، النهاية الوهمية (NN/g): الشريط بعرض الصفحة مع مساحة فارغة يبدو كنهايتها؛ اجعل العنصر التالي يظهر جزئيًا."
    scenario:
      en: "This is the first screen of Sunday's classes. Spinning is below the invite banner. Few people book it."
      ar: "هذه الشاشة الأولى من حصص الأحد. حصة السبينينغ تحت شريط الدعوة. وقليلون يحجزونها."
    prompt:
      en: "What should you change?"
      ar: "ماذا تغيّر؟"
    mock:
      caption: { en: "First screen, before scrolling", ar: "الشاشة الأولى، قبل التمرير" }
      blocks:
        - kind: group
          tone: plain
          height: 360
          blocks:
            - { kind: title, text: { en: "Sunday classes", ar: "حصص الأحد" } }
            - { kind: heading, text: "@G1a", gap: l }
            - { kind: small, text: "@G1b", gap: xs }
            - { kind: chip, text: "@G1c", gap: xs }
            - { kind: button, emphasis: low, text: "@G1d", gap: s }
            - { kind: divider, gap: l }
            - kind: group
              tone: tint
              gap: l
              blocks:
                - { kind: heading, text: "@G1n" }
            - { kind: small, text: "", height: 80 }
            - { kind: heading, text: "@G1e" }
    options:
      - { id: line, text: { en: "Add a second full-width line under the banner", ar: "أضف خطًا ثانيًا بعرض الصفحة تحت الشريط" } }
      - { id: bigger, text: { en: "Make the banner bigger so people stop at it", ar: "كبّر الشريط حتى يتوقّف الناس عنده" } }
      - { id: peek, text: { en: "Move the banner after Spinning and close the gap, so Spinning starts on the first screen", ar: "انقل الشريط بعد السبينينغ وقلّل المسافة، حتى تبدأ حصة السبينينغ في الشاشة الأولى" } }
    answer: [peek]
    misconceptions:
      - id: MC-P10-035
        when: [line, bigger]
        feedback:
          en: "Lines, wide bands and empty space are exactly what make a page look finished. Let the next class show on the first screen."
          ar: "الخطوط والأشرطة العريضة والمساحات الفارغة هي بالضبط ما يجعل الصفحة تبدو منتهية. اجعل الحصة التالية تظهر في الشاشة الأولى."
    explain:
      en: "From Lesson 2: NN/g's illusion of completeness. The line, the banner and the gap below it form a false floor. Content that starts on the first screen tells people to keep going."
      ar: "من الدرس 2: وهم الاكتمال من NN/g. الخط والشريط والمسافة تحته تصنع نهاية وهمية. والمحتوى الذي يبدأ في الشاشة الأولى يخبر الناس أن يكملوا."

  - id: S05
    type: choose
    part: check
    rules: [R19, U29]
    value:
      en: "Skill check, real headings (NN/g): screen-reader users jump between coded headings; text that only looks like a heading can't be reached that way."
      ar: "اختبار مهارة، العناوين الحقيقية (NN/g): مستخدمو الـ Screen reader ينتقلون بين العناوين المعرّفة في الكود؛ والنص الذي يشبه العنوان فقط لا يمكن الوصول إليه بهذه الطريقة."
    scenario:
      en: "Rana's friend Hala uses a screen reader. She jumps by headings, and the app reads only \"Sunday classes\". The class names are big, bold text."
      ar: "هالة صديقة رنا تستخدم الـ Screen reader. تنتقل بين العناوين، فيقرأ التطبيق «حصص الأحد» فقط. وأسماء الحصص نص كبير عريض."
    prompt:
      en: "What should you change so Hala can jump straight to Spinning?"
      ar: "ماذا تغيّر حتى تنتقل هالة مباشرة إلى حصة السبينينغ؟"
    options:
      - { id: divider, text: { en: "Put a divider line between the two classes", ar: "ضع خطًا فاصلًا بين الحصتين" } }
      - { id: code, text: { en: "Code each class name as a heading", ar: "عرّف اسم كل حصة كعنوان في الكود" } }
      - { id: larger, text: { en: "Make the class names larger than the page title", ar: "اجعل أسماء الحصص أكبر من عنوان الصفحة" } }
      - { id: icon, text: { en: "Add a class icon before each name", ar: "أضف أيقونة قبل اسم كل حصة" } }
    answer: [code]
    misconceptions:
      - id: MC-P10-037
        when: [larger, icon]
        feedback:
          en: "Size and icons are visual. The screen reader finds only text coded as a heading."
          ar: "الحجم والأيقونات أشياء بصرية. والـ Screen reader يجد فقط النص المعرّف كعنوان في الكود."
      - id: MC-P10-026
        when: [divider]
        feedback:
          en: "A divider groups for the eye. It gives Hala nothing to jump to."
          ar: "الخط الفاصل يجمّع للعين. ولا يعطي هالة شيئًا تنتقل إليه."
    explain:
      en: "From Lesson 2: NN/g found that large, bold text is not enough. Each group's name must be a coded heading so screen-reader users can jump to it."
      ar: "من الدرس 2: وجدت NN/g أن النص الكبير العريض لا يكفي. يجب أن يكون اسم كل مجموعة عنوانًا معرّفًا في الكود حتى ينتقل إليه مستخدمو الـ Screen reader."

  - id: S06
    type: order
    part: check
    onscreen: true
    rules: [R19]
    value:
      en: "Skill check, stacking: rebuild a row-built page into whole groups on the phone itself."
      ar: "اختبار مهارة، الترتيب العمودي: أعد بناء صفحة مبنية على صفوف إلى مجموعات كاملة على الهاتف نفسه."
    caption: { en: "Rana's phone, 360 px", ar: "هاتف رنا، 360 بكسل" }
    prompt:
      en: "The class page was built in rows for the tablet, so on Rana's phone it shows both names, then both times, then both buttons. Drag the blocks so each class stays whole."
      ar: "بُنيت صفحة الحصص في صفوف للـ Tablet، فتعرض على هاتف رنا الاسمين، ثم الموعدين، ثم الزرّين. اسحب العناصر حتى تبقى كل حصة كاملة."
    items:
      - { id: G1a, text: "@G1a", kind: heading }
      - { id: G1e, text: "@G1e", kind: heading }
      - { id: G1b, text: "@G1b" }
      - { id: G1f, text: "@G1f" }
      - { id: G1d, text: "@G1d", kind: button, emphasis: low }
      - { id: G1h, text: "@G1h", kind: button, emphasis: low }
    answer: [G1a, G1b, G1d, G1e, G1f, G1h]
    also_ok:
      - answer: [G1e, G1f, G1h, G1a, G1b, G1d]
        feedback:
          en: "That works too: Spinning first. Either class can lead, as long as each stays whole."
          ar: "صحيح أيضًا: السبينينغ أولًا. يمكن لأي حصة أن تتصدّر، ما دامت كل واحدة كاملة."
    misconceptions:
      - id: MC-P10-028
        when: { before: [G1e, G1d] }
        feedback:
          en: "Spinning starts before Yoga is finished, so their lines mix. Keep each name, time and button together."
          ar: "تبدأ حصة السبينينغ قبل أن تكتمل اليوغا، فتختلط أسطرهما. أبقِ كل اسم وموعد وزر معًا."
    explain:
      en: "From Lesson 3: a narrow screen stacks things in the order they're built. Build each class as one block and it stays whole on every width."
      ar: "من الدرس 3: الشاشة الضيّقة ترتّب العناصر بالترتيب الذي بُنيت به. ابنِ كل حصة ككتلة واحدة فتبقى كاملة على كل عرض."

  - id: S07
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, comparing on a phone (NN/g): keep the comparison table with feature names pinned; tabs make people remember each plan."
      ar: "اختبار مهارة، المقارنة على الهاتف (NN/g): أبقِ جدول المقارنة مع تثبيت أسماء الميزات؛ والتبويبات تجبر الناس على تذكّر كل باقة."
    prompt:
      en: "Rana compares three memberships on price, classes and guest passes before she switches. Try each option. Which should ship?"
      ar: "تقارن رنا ثلاثة اشتراكات في السعر والحصص وتذاكر الضيوف قبل أن تغيّر اشتراكها. جرّب كل خيار. أيّها يجب أن يُطلق؟"
    start: tabs
    options:
      - id: tabs
        text: { en: "One tab per membership", ar: "تبويب لكل اشتراك" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px · Basic tab open", ar: "هاتف، 320 بكسل · تبويب Basic مفتوح" }
          blocks:
            - { kind: segmented, options: [ "Basic", "Plus", "Pro" ], value: 0 }
            - { kind: meta, text: { en: "Per month: EGP 300", ar: "شهريًا: 300 جنيه" }, gap: s }
            - { kind: meta, text: { en: "Classes: 2 a week", ar: "الحصص: 2 أسبوعيًا" }, gap: xs }
            - { kind: meta, text: { en: "Guest passes: 0", ar: "تذاكر الضيوف: 0" }, gap: xs }
      - id: pinned
        text: { en: "A table that scrolls sideways, with the feature names pinned", ar: "جدول يتحرّك أفقيًا، مع تثبيت أسماء الميزات" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px · swipe the table", ar: "هاتف، 320 بكسل · اسحب الجدول" }
          blocks:
            - kind: group
              scroll: true
              sticky: true
              colw: 86
              blocks:
                - kind: row
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: heading, text: "Basic" }
                    - { kind: heading, text: "Plus" }
                    - { kind: heading, text: "Pro" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Per month", ar: "شهريًا" } }
                    - { kind: meta, text: { en: "EGP 300", ar: "300 جنيه" } }
                    - { kind: meta, text: { en: "EGP 450", ar: "450 جنيهًا" } }
                    - { kind: meta, text: { en: "EGP 600", ar: "600 جنيه" } }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Classes", ar: "الحصص" } }
                    - { kind: meta, text: { en: "2 a week", ar: "2 أسبوعيًا" } }
                    - { kind: meta, text: { en: "4 a week", ar: "4 أسبوعيًا" } }
                    - { kind: meta, text: { en: "Unlimited", ar: "بلا حدود" } }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Guest passes", ar: "تذاكر الضيوف" } }
                    - { kind: meta, text: "0" }
                    - { kind: meta, text: "1" }
                    - { kind: meta, text: "2" }
      - id: shrink
        text: { en: "Shrink the whole table until it fits", ar: "صغّر الجدول كله حتى يتّسع" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
          blocks:
            - kind: row
              blocks:
                - { kind: small, text: "", px: 7 }
                - { kind: heading, text: "Basic", px: 7 }
                - { kind: heading, text: "Plus", px: 7 }
                - { kind: heading, text: "Pro", px: 7 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Per month", ar: "شهريًا" }, px: 7 }
                - { kind: meta, text: { en: "EGP 300", ar: "300 جنيه" }, px: 7 }
                - { kind: meta, text: { en: "EGP 450", ar: "450 جنيهًا" }, px: 7 }
                - { kind: meta, text: { en: "EGP 600", ar: "600 جنيه" }, px: 7 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Classes", ar: "الحصص" }, px: 7 }
                - { kind: meta, text: { en: "2 a week", ar: "2 أسبوعيًا" }, px: 7 }
                - { kind: meta, text: { en: "4 a week", ar: "4 أسبوعيًا" }, px: 7 }
                - { kind: meta, text: { en: "Unlimited", ar: "بلا حدود" }, px: 7 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Guest passes", ar: "تذاكر الضيوف" }, px: 7 }
                - { kind: meta, text: "0", px: 7 }
                - { kind: meta, text: "1", px: 7 }
                - { kind: meta, text: "2", px: 7 }
    answer: [pinned]
    misconceptions:
      - id: MC-P10-030
        when: [tabs]
        feedback:
          en: "With tabs, Rana sees one membership at a time and must remember the others' numbers. NN/g notes tabs support comparison poorly for exactly this reason."
          ar: "مع التبويبات ترى رنا اشتراكًا واحدًا في كل مرة، وعليها تذكّر أرقام الباقي. وتنبّه NN/g إلى أن التبويبات تضعف المقارنة لهذا السبب بالذات."
      - id: MC-P10-060
        when: [shrink]
        feedback:
          en: "It all fits, at 7px. Nobody can read that on a phone."
          ar: "كل شيء يتّسع، لكن بحجم 7 بكسل. لا أحد يستطيع قراءة ذلك على هاتف."
    explain:
      en: "From Lesson 3: when people weigh options feature by feature, keep the table. A phone shows about two plans, so pin the feature names and show a cut-off column so people know to swipe."
      ar: "من الدرس 3: حين يوازن الناس الخيارات ميزة بميزة، أبقِ الجدول. والهاتف يعرض نحو باقتين، فثبّت أسماء الميزات وأظهِر عمودًا مقطوعًا حتى يعرف الناس أن عليهم السحب."
