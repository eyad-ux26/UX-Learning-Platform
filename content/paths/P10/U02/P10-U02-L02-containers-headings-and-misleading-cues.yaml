  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, U29]
    value:
      en: "NN/g on mobile screen readers: users jump from heading to heading, and \"it is not enough to use large, bolded fonts that look like headings\". Group names must be coded as headings."
      ar: "NN/g عن الـ Screen reader على الهاتف: ينتقل المستخدمون من عنوان إلى عنوان، و«لا يكفي استخدام خط كبير عريض يشبه العناوين». يجب تعريف أسماء المجموعات كعناوين في الكود."
    scenario:
      en: "Mona is blind and uses a screen reader on her phone. To find the eye clinic, she jumps from heading to heading. The only heading she can reach is \"Our clinics\"."
      ar: "منى كفيفة وتستخدم الـ Screen reader على هاتفها. لتجد عيادة العيون، تنتقل من عنوان إلى عنوان. والعنوان الوحيد الذي تصل إليه هو «عياداتنا»."
    prompt:
      en: "The clinic names look like headings on screen. What should you change?"
      ar: "أسماء العيادات تبدو كعناوين على الشاشة. ماذا تغيّر؟"
    mock:
      blocks:
        - { kind: title, text: { en: "Our clinics", ar: "عياداتنا" } }
        - { kind: heading, text: { en: "Dental clinic", ar: "عيادة الأسنان" }, gap: l }
        - { kind: small, text: { en: "Floor 2 · Sat to Thu, 9:00 to 17:00", ar: "الطابق 2 · من السبت إلى الخميس، من 9:00 إلى 17:00" }, gap: xs }
        - { kind: heading, text: { en: "Eye clinic", ar: "عيادة العيون" }, gap: l }
        - { kind: small, text: { en: "Floor 3 · Sun to Thu, 10:00 to 16:00", ar: "الطابق 3 · من الأحد إلى الخميس، من 10:00 إلى 16:00" }, gap: xs }
        - kind: group
          tone: tint
          gap: xl
          blocks:
            - { kind: small, text: { en: "Headings the screen reader finds:", ar: "العناوين التي يجدها الـ Screen reader" } }
            - { kind: meta, text: { en: "1. Our clinics", ar: "1. عياداتنا" }, gap: xs }
    options:
      - { id: bigger, text: { en: "Make the clinic names bigger and bolder", ar: "كبّر أسماء العيادات واجعلها أعرض" } }
      - { id: space, text: { en: "Add more space between the clinics", ar: "أضف مسافة أكبر بين العيادات" } }
      - { id: cards, text: { en: "Put each clinic in its own card", ar: "ضع كل عيادة في Card خاصة بها" } }
      - { id: code, text: { en: "Mark each clinic name as a heading in the code (for example an h2)", ar: "عرّف اسم كل عيادة كعنوان في الكود (مثلًا h2)" } }
    answer: [code]
    misconceptions:
      - id: MC-P10-037
