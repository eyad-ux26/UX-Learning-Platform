        feedback:
          en: "They already look like headings. The screen reader doesn't see size or weight; it only finds headings that are marked as headings in the code."
          ar: "هي تبدو كعناوين أصلًا. الـ Screen reader لا يرى الحجم ولا السُّمك؛ يجد فقط العناوين المعرّفة كعناوين في الكود."
