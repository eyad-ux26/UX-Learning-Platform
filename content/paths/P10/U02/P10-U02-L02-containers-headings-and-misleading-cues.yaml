id: P10-U02-L02
mode: lesson
minutes: 8
title:
  en: "Containers, headings, and cues that mislead"
  ar: "الحاويات والعناوين والإشارات المضلّلة"
review_labels:
  MC-P10-024: { en: "More borders don't mean clearer groups", ar: "الحدود الأكثر لا تعني مجموعات أوضح" }
  MC-P10-025: { en: "Matching colors don't prove a relationship", ar: "تطابق الألوان لا يثبت العلاقة" }
  MC-P10-026: { en: "Spacing alone is invisible to screen readers", ar: "المسافات وحدها لا يراها الـ Screen reader" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Add more structure\"", ar: "«أضيفوا تنظيمًا أكثر»" }
    body:
      en: "A teammate thinks the sessions page needs more structure. Their plan: a border around every item, and matching green pills for the two prices so they \"look consistent\".\n\nMore structure sounds good. Does it make the groups clearer?"
      ar: "يرى أحد الزملاء أن صفحة الجلسات تحتاج إلى تنظيم أكثر. خطته: إطار حول كل عنصر، وشارات خضراء متطابقة للسعرين حتى «يبدوا متناسقين».\n\nالتنظيم الأكثر يبدو فكرة جيدة. لكن هل يجعل المجموعات أوضح؟"
    mock: &pills
      blocks:
        - kind: row
          blocks:
            - { kind: heading, text: "@W2a" }
            - { kind: heading, text: "@W2e" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: "@W2b" }
            - { kind: small, text: "@W2f" }
        - kind: row
          gap: m
          blocks:
            - { kind: pill, text: "@W2c" }
            - { kind: pill, text: "@W2g" }
        - { kind: button, text: { en: "Reserve", ar: "احجز" }, gap: m }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    mock: *pills
    prompt:
      en: "The teammate gave both prices matching green pills so they \"look consistent\". Sara needs to see which price goes with which session. What should you change?"
      ar: "أعطى زميلك السعرين شارتين خضراوين متطابقتين حتى «يبدوا متناسقين». وسارة تحتاج أن ترى أي سعر يخص أي جلسة. ماذا تغيّر؟"
    options:
      - { id: big, text: { en: "Make the pills bigger", ar: "كبّر الشارتين" } }
      - { id: color, text: { en: "Give the two pills different colours", ar: "اجعل الشارتين بلونين مختلفين" } }
      - { id: group, text: { en: "Put each price in its own session's group, close to its title and date", ar: "ضع كل سعر داخل مجموعة جلسته، قريبًا من عنوانها وموعدها" } }
    answer: [group]
    misconceptions:
      - id: MC-P10-025
        when: [color]
        feedback:
          en: "Colour is one of the weakest grouping cues: distance usually wins, and some people can't tell the colours apart. Move each price into its session first."
          ar: "اللون من أضعف إشارات التجميع: المسافة تتغلّب غالبًا، وبعض الناس لا يميّزون الألوان. انقل كل سعر إلى جلسته أولًا."
      - id: MC-P10-025
        when: [big]
        feedback:
          en: "Bigger pills are easier to see, but they still sit in their own row, away from the session they belong to."
          ar: "الشارات الأكبر أسهل في الرؤية، لكنها ما زالت في صف وحدها، بعيدًا عن الجلسة التي تخصها."
    correct:
      en: "Grouping by position, not by colour."
      ar: "التجميع بالمكان، لا باللون."
    explain:
      en: "Matching pills make the two prices look like a pair, apart from their sessions. Put each price with its session; use colour only to support that."
      ar: "الشارتان المتطابقتان تجعلان السعرين يبدوان زوجًا، بعيدًا عن جلستيهما. ضع كل سعر مع جلسته، واستخدم اللون لدعم ذلك فقط."
  - id: S03
    type: card
    part: concept
    icons: [space, group, text, color]
    title: { en: "Four cues, different strengths", ar: "أربع إشارات بقوى مختلفة" }
    body:
      en: "Four cues show what belongs together, and they aren't equally strong.\n\n- **Spacing:** close items read as a group.\n- **A shared container:** a card or a tinted area. Everything inside belongs together, even if it looks different.\n- **A heading:** names the group. It also helps people using a screen reader, which can't see spacing.\n- **Matching colour:** a weak hint. Never rely on it alone.\n\nEvery container adds a boundary. A border around everything makes many small groups that compete."
      ar: "أربع إشارات تُظهر ما ينتمي معًا، وقوّتها ليست متساوية.\n\n- **الـ Spacing:** العناصر المتقاربة تُقرأ كمجموعة.\n- **Container مشترك:** Card أو مساحة ملوّنة. كل ما بداخله ينتمي معًا، حتى لو بدا مختلفًا.\n- **العنوان (Heading):** يسمّي المجموعة. ويساعد أيضًا من يستخدمون الـ Screen reader، الذي لا يرى المسافات.\n- **تطابق اللون:** تلميح ضعيف. لا تعتمد عليه وحده أبدًا.\n\nكل Container يضيف حدًّا جديدًا. وإطار حول كل شيء يصنع مجموعات صغيرة كثيرة تتنافس."
  - id: S04
    type: spot
    part: guided
    rules: [R06, R15]
    prompt:
      en: "On the teammate's layout, which part makes it hardest to tell which price belongs to which session?"
      ar: "في التخطيط الذي صمّمه زميلك، أي جزء يجعل معرفة سعر كل جلسة أصعب؟"
    mock:
      blocks:
        - kind: row
          blocks:
            - { kind: heading, text: "@W2a", region: titles }
            - { kind: heading, text: "@W2e" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: "@W2b", region: dates }
            - { kind: small, text: "@W2f" }
        - kind: row
          gap: m
          blocks:
            - { kind: pill, text: "@W2c", region: prices }
            - { kind: pill, text: "@W2g" }
        - { kind: button, text: { en: "Reserve", ar: "احجز" }, gap: m, region: button }
    regions:
      - { id: titles, label: { en: "The row of titles", ar: "صف العناوين" } }
      - { id: dates, label: { en: "The row of dates", ar: "صف التواريخ" } }
      - { id: prices, label: { en: "The two matching price pills", ar: "شارتا السعر المتطابقتان" } }
      - { id: button, label: { en: "The single Reserve button", ar: "زر «احجز» الوحيد" } }
    answer: [button]
    also_ok:
      - answer: [prices]
        feedback:
          en: "Yes, that's a real problem too: identical pills side by side look like options of one thing. But the single button is worse: Sara can't even choose which session to reserve."
          ar: "نعم، هذه مشكلة حقيقية أيضًا: شارتان متطابقتان متجاورتان تبدوان كخيارين لشيء واحد. لكن الزر الوحيد أسوأ: لا تستطيع سارة أصلًا اختيار الجلسة التي تحجزها."
    misconceptions:
      - id: MC-P10-021
        when: [titles, dates]
        feedback:
          en: "The columns do line up titles and dates. The bigger problem is what Sara does next."
          ar: "الأعمدة ترتّب العناوين والتواريخ فعلًا. المشكلة الأكبر فيما ستفعله سارة بعد ذلك."
    hints:
      - { en: "Try to reserve the Service session. Which part gets in your way?", ar: "حاول حجز جلسة «صمّم». أي جزء يعترض طريقك؟" }
    correct:
      en: "One Reserve for two sessions means the action has no group at all."
      ar: "زر «احجز» واحد لجلستين يعني أن الإجراء لا ينتمي لأي مجموعة."
    explain:
      en: "The layout groups by type (all titles, all dates, all prices) instead of by booking. That's tidy to look at but breaks every relationship Sara needs, and the shared button can't belong to either session."
      ar: "التخطيط يجمّع حسب النوع (كل العناوين، كل التواريخ، كل الأسعار) بدلًا من الحجز. يبدو مرتّبًا لكنه يكسر كل علاقة تحتاجها سارة، والزر المشترك لا يمكن أن ينتمي لأي جلسة."

  - id: S05
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    prompt:
      en: "In which version do you see exactly two groups, one per session, before anything else?"
      ar: "في أي نسخة ترى مجموعتين فقط، واحدة لكل جلسة، قبل أي شيء آخر؟"
    a:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: line, text: "@W2a" }
              - { kind: line, text: "@W2b", gap: s }
              - { kind: line, text: "@W2c", gap: s }
              - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - kind: group
            gap: s
            blocks:
              - { kind: line, text: "@W2e" }
              - { kind: line, text: "@W2f", gap: s }
              - { kind: line, text: "@W2g", gap: s }
              - { kind: button, emphasis: low, text: "@W2h", gap: s }
          - { kind: line, text: "@W2n", gap: s }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: text, text: "@W2b", gap: xs }
          - { kind: meta, text: "@W2c", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - { kind: divider, gap: l }
          - { kind: heading, text: "@W2e", gap: l }
          - { kind: text, text: "@W2f", gap: xs }
          - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
          - { kind: link, text: "@W2n", gap: xl }
    answer: b
    reason:
      prompt: { en: "What makes it clearer?", ar: "ما الذي يجعلها أوضح؟" }
      options:
        - { id: few, text: { en: "Fewer boundaries, so the two real groups stand out", ar: "حدود أقل، فتبرز المجموعتان الحقيقيتان" } }
        - { id: modern, text: { en: "Borders look old-fashioned", ar: "الحدود تبدو قديمة الطراز" } }
      answer: [few]
      misconceptions:
        - id: MC-P10-024
          when: [modern]
          feedback:
            en: "It's not about style. In A, boxes inside boxes make many small groups compete with the two that matter."
            ar: "الأمر لا يتعلّق بالأسلوب. في A، الإطارات داخل الإطارات تصنع مجموعات صغيرة كثيرة تنافس المجموعتين المهمّتين."
    misconceptions:
      - id: MC-P10-024
        when: [a]
        feedback:
          en: "A boxes every line inside each card, so you see ten boxes before you see two bookings. More borders made the structure harder to read."
          ar: "A تضع إطارًا لكل سطر داخل كل بطاقة، فترى عشرة إطارات قبل أن ترى حجزين. الحدود الأكثر جعلت قراءة التنظيم أصعب."
    correct:
      en: "Headings, spacing and one divider: two groups, nothing competing."
      ar: "عناوين ومسافات وفاصل واحد: مجموعتان، دون منافسة."
    explain:
      en: "Both are valid structures, but A spends a border on every line. B uses headings to name each session, tight spacing inside, and one divider between. A card layout can be just as clear if each card wraps a whole booking and nothing else."
      ar: "كلاهما تنظيم مقبول، لكن A تصرف إطارًا على كل سطر. أما B فتستخدم عناوين لتسمية كل جلسة، ومسافات ضيّقة في الداخل، وفاصلًا واحدًا بينهما. تخطيط البطاقات يمكن أن يكون بالوضوح نفسه إذا احتضنت كل بطاقة حجزًا كاملًا ولا شيء غيره."

  - id: S06
    type: fix
    part: guided
    rules: [R06, R15]
    prompt:
      en: "Which change best fixes the teammate's layout?"
      ar: "أي تغيير يصلح التخطيط الذي صمّمه زميلك بأفضل شكل؟"
    mock: *pills
    options:
      - { id: arrows, text: { en: "Add arrows from each price to its title", ar: "أضف أسهمًا من كل سعر إلى عنوانه" } }
      - { id: regroup, text: { en: "Stack the sessions: each title with its own date, price and Reserve button", ar: "رتّب الجلسات فوق بعضها: كل عنوان مع تاريخه وسعره وزر «احجز» الخاص به" } }
      - { id: recolor, text: { en: "Make the two price pills different colors", ar: "اجعل شارتي السعر بلونين مختلفين" } }
      - { id: boxes, text: { en: "Put a border around each column", ar: "ضع إطارًا حول كل عمود" } }
    answer: [regroup]
    also_ok:
      - answer: [boxes]
        feedback:
          en: "That can work if each column also gets its own Reserve button. Then each column is a complete booking. On a phone, the columns will still need to stack."
          ar: "قد يصلح ذلك إذا حصل كل عمود على زر «احجز» خاص به. عندها يصبح كل عمود حجزًا كاملًا. وعلى الهاتف، سيظل على الأعمدة أن تُرتَّب فوق بعضها."
    misconceptions:
      - id: MC-P10-025
        when: [recolor]
        feedback:
          en: "Different colors still don't say which title owns which price, and there's still one button for two sessions."
          ar: "الألوان المختلفة لا تقول أي عنوان يملك أي سعر، ويبقى هناك زر واحد لجلستين."
      - id: MC-P10-027
        when: [arrows]
        feedback:
          en: "Arrows patch the symptom with more marks on the page. Grouping by booking removes the confusion instead."
          ar: "الأسهم تعالج العَرَض بإضافة علامات أكثر على الصفحة. التجميع حسب الحجز يزيل الالتباس من أصله."
    correct:
      en: "Group by booking, not by type, and give each session its own action."
      ar: "اجمع حسب الحجز لا حسب النوع، وأعطِ كل جلسة إجراءها الخاص."
    explain:
      en: "Once each session is one complete group, every fact and action has an owner. The colors and borders become optional."
      ar: "عندما تصبح كل جلسة مجموعة كاملة واحدة، يصبح لكل معلومة وإجراء مالك. وتصبح الألوان والحدود اختيارية."

  - id: S07
    type: spot
    part: independent
    rules: [R14, R19]
    scenario:
      en: "Nour is filling in a delivery address on her phone. The labels have uneven spacing."
      ar: "تملأ نور عنوان التوصيل على هاتفها. المسافات حول التسميات غير متساوية."
    prompt:
      en: "Which label looks attached to the wrong field?"
      ar: "أي تسمية تبدو مرتبطة بالحقل الخطأ؟"
    mock:
      blocks:
        - { kind: small, text: "@A1a", region: street }
        - { kind: field, text: "@A1b", gap: xs }
        - { kind: small, text: "@A1c", gap: l, region: building }
        - { kind: field, text: "@A1d", gap: xs }
        - { kind: small, text: "@A1e", gap: xs, region: flat }
        - { kind: field, text: "@A1f", gap: l }
    regions:
      - { id: street, label: "@A1a" }
      - { id: building, label: "@A1c" }
      - { id: flat, label: "@A1e" }
    answer: [flat]
    misconceptions:
      - id: MC-P10-032
        when: [street]
        feedback:
          en: "\"Street\" sits tight above its own field. Look further down for a label that's closer to someone else's field."
          ar: "«الشارع» ملاصقة لحقلها من الأعلى. ابحث في الأسفل عن تسمية أقرب إلى حقل آخر."
      - id: MC-P10-021
        when: [building]
        feedback:
          en: "\"Building\" sits right above its field, with a bigger gap before it. That's correct. Look for a label that's closer to the wrong field."
          ar: "«رقم المبنى» فوق حقله مباشرة، وقبله مسافة أكبر. هذا صحيح. ابحث عن تسمية أقرب إلى الحقل الخطأ."
    correct:
      en: "\"Flat\" is glued under the building field and far from its own."
      ar: "«رقم الشقة» ملتصقة أسفل حقل المبنى وبعيدة عن حقلها."
    explain:
      en: "Labels group with whatever they're closest to. Here \"Flat\" is closest to the building field above it, so Nour may type her flat number there. Keep each label tight above its own field."
      ar: "التسميات تنضم إلى أقرب شيء لها. هنا «رقم الشقة» أقرب إلى حقل المبنى الذي فوقها، فقد تكتب نور رقم الشقة فيه. أبقِ كل تسمية ملاصقة لحقلها من الأعلى."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, U29]
    prompt:
      en: "A blind visitor uses a screen reader, which reads the page aloud in order and can't see spacing. What keeps the two sessions clear for them?"
      ar: "زائر كفيف يستخدم الـ Screen reader، الذي يقرأ الصفحة بصوت عالٍ بالترتيب ولا يرى المسافات. ما الذي يبقي الجلستين واضحتين له؟"
    options:
      - { id: gaps, text: { en: "Bigger gaps between the sessions", ar: "مسافات أكبر بين الجلستين" } }
      - { id: colors, text: { en: "A different background color for each session", ar: "لون خلفية مختلف لكل جلسة" } }
      - { id: borders, text: { en: "A border around each session", ar: "إطار حول كل جلسة" } }
      - { id: heading, text: { en: "Each session starts with a real heading, and its details follow in order", ar: "كل جلسة تبدأ بعنوان حقيقي، وتليه تفاصيلها بالترتيب" } }
    answer: [heading]
    misconceptions:
      - id: MC-P10-026
        when: [gaps, colors, borders]
        feedback:
          en: "Those are visual cues, and the screen reader doesn't announce them. Headings and order are what it reads."
          ar: "هذه إشارات بصرية، والـ Screen reader لا ينطقها. العناوين والترتيب هي ما يقرؤه."
    correct:
      en: "Headings and order carry the grouping when spacing can't."
      ar: "العناوين والترتيب يحملان التجميع حين لا تستطيع المسافات ذلك."
    explain:
      en: "Spacing and borders show groups to the eye. A heading per session, with its facts and button following it in order, shows the same groups to a screen reader. Good grouping uses both."
      ar: "المسافات والحدود تُظهر المجموعات للعين. أما عنوان لكل جلسة، تليه معلوماتها وزرها بالترتيب، فيُظهر المجموعات نفسها للـ Screen reader. التجميع الجيد يستخدم الاثنين."

  - id: S09
    type: card
    part: recap
    icons: [warn, group, ear]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- More borders and matching colours don't make groups clearer.\n- Group by what people book, not by type of information.\n- Headings keep groups clear for people who can't see the spacing.\n\nNext lesson: keeping groups together when the screen gets narrow."
      ar: "- الحدود الأكثر والألوان المتطابقة لا توضّح المجموعات.\n- اجمع حسب ما يحجزه الناس، لا حسب نوع المعلومة.\n- العناوين تُبقي المجموعات واضحة لمن لا يرون المسافات.\n\nالدرس التالي: إبقاء المجموعات متماسكة حين تضيق الشاشة."
