    explain:
      en: "NN/g watched screen-reader users scan long pages by jumping between headings. Sighted people see the visual hierarchy; a screen reader only knows the headings in the code (h1, h2…). Each group's name should be one."
      ar: "رأت NN/g مستخدمي الـ Screen reader يتصفّحون الصفحات الطويلة بالانتقال بين العناوين. المبصرون يرون التسلسل البصري؛ أما الـ Screen reader فلا يعرف إلا العناوين المعرّفة في الكود (h1، h2…). واسم كل مجموعة يجب أن يكون واحدًا منها."

  - id: S09
    type: card
    part: recap
    icons: [group, warn, fold, promo, ear]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Containers:** the box is the group, so everything a session needs goes inside it.\n- **Fewer boxes:** spacing first; a box only where spacing isn't enough.\n- **False floors:** let the next item peek over the screen edge.\n- **Look-alikes:** useful content must not look like an ad.\n- **Real headings:** code each group's name as a heading.\n\nNext lesson: keeping groups together when the screen gets narrow."
      ar: "- **الـ Containers:** الإطار هو المجموعة، فكل ما تحتاجه الجلسة يكون داخله.\n- **إطارات أقل:** المسافات أولًا، والإطار فقط حين لا تكفي المسافات.\n- **النهاية الوهمية:** اجعل العنصر التالي يظهر جزئيًا عند حافة الشاشة.\n- **المتشابهات:** المحتوى المفيد يجب ألّا يشبه الإعلانات.\n- **العناوين الحقيقية:** عرّف اسم كل مجموعة كعنوان في الكود.\n\nالدرس التالي: إبقاء المجموعات متماسكة حين تضيق الشاشة."
