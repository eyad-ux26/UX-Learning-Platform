id: P10-U02-L02
mode: lesson
minutes: 9
title:
  en: "Containers, look-alikes and headings"
  ar: "الحاويات والعناصر المتشابهة والعناوين"
sources:
  - title: { en: "The Principle of Common Region: Containers Create Groupings (NN/g)", ar: "مبدأ المنطقة المشتركة: الحاويات تصنع المجموعات (NN/g)" }
    url: "https://www.nngroup.com/articles/common-region/"
  - title: { en: "Similarity Principle in Visual Design (NN/g)", ar: "مبدأ التشابه في التصميم البصري (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-similarity/"
  - title: { en: "The Illusion of Completeness (NN/g)", ar: "وهم اكتمال الصفحة (NN/g)" }
    url: "https://www.nngroup.com/articles/illusion-of-completeness/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "صعوبات مستخدمي الـ Screen reader على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Law of Similarity (Interaction Design Foundation)", ar: "قانون التشابه (Interaction Design Foundation)" }
    url: "https://www.interaction-design.org/literature/topics/law-of-similarity"
review_labels:
  MC-P10-024: { en: "More borders don't mean clearer groups", ar: "الحدود الأكثر لا تعني مجموعات أوضح" }
  MC-P10-025: { en: "Matching looks suggest a relationship", ar: "التشابه في الشكل يوحي بعلاقة" }
  MC-P10-026: { en: "Spacing alone is invisible to screen readers", ar: "المسافات وحدها لا يراها الـ Screen reader" }
  MC-P10-034: { en: "A container's edge beats a small gap", ar: "حافة الحاوية أقوى من مسافة صغيرة" }
  MC-P10-035: { en: "Full-width lines and bands look like the end of the page", ar: "الخطوط والأشرطة بعرض الصفحة تبدو كنهايتها" }
  MC-P10-036: { en: "Content styled like ads gets ignored", ar: "المحتوى الذي يشبه الإعلانات يتجاهله الناس" }
  MC-P10-037: { en: "Text that looks like a heading isn't one until it's coded", ar: "النص الذي يشبه العنوان ليس عنوانًا حتى يُكتب في الكود" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Add more structure\"", ar: "«أضيفوا تنظيمًا أكثر»" }
    body:
      en: "A teammate thinks the sessions page needs more structure. Their plan: a border around every item, and matching green pills for the two prices so they \"look consistent\".\n\nMore structure sounds good. Does it make the groups clearer?"
      ar: "يرى أحد الزملاء أن صفحة الجلسات تحتاج إلى تنظيم أكثر. خطته: إطار حول كل عنصر، وشارات خضراء متطابقة للسعرين حتى «يبدوا متناسقين».\n\nالتنظيم الأكثر يبدو فكرة جيدة. لكن هل يجعل المجموعات أوضح؟"
    mock: &pills
      blocks:
        - kind: row
          blocks:
            - { kind: heading, text: "@W2a" }
            - { kind: heading, text: "@W2e" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: "@W2b" }
            - { kind: small, text: "@W2f" }
        - kind: row
          gap: m
          blocks:
            - { kind: pill, text: "@W2c" }
            - { kind: pill, text: "@W2g" }
        - { kind: button, text: { en: "Reserve", ar: "احجز" }, gap: m }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    value:
      en: "NN/g: things that look alike are read as related. Matching pills pair the two prices with each other, not with their sessions. Position fixes it; colour can't."
      ar: "NN/g: العناصر المتشابهة تُقرأ كأنها مترابطة. الشارتان المتطابقتان تربطان السعرين ببعضهما، لا بجلستيهما. المكان يصلح ذلك؛ واللون لا يستطيع."
    mock: *pills
    prompt:
      en: "The teammate gave both prices matching green pills so they \"look consistent\". Sara needs to see which price goes with which session. What should you change?"
      ar: "أعطى زميلك السعرين شارتين خضراوين متطابقتين حتى «يبدوا متناسقين». وسارة تحتاج أن ترى أي سعر يخص أي جلسة. ماذا تغيّر؟"
    options:
      - { id: big, text: { en: "Make the pills bigger", ar: "كبّر الشارتين" } }
      - { id: group, text: { en: "Put each price in its own session's group, close to its title and date", ar: "ضع كل سعر داخل مجموعة جلسته، قريبًا من عنوانها وموعدها" } }
      - { id: color, text: { en: "Give the two pills different colours", ar: "اجعل الشارتين بلونين مختلفين" } }
    answer: [group]
    misconceptions:
      - id: MC-P10-025
        when: [color]
        feedback:
          en: "Different colours only say the prices differ. They still don't say which session each belongs to. Move each price into its session first."
          ar: "الألوان المختلفة تقول فقط إن السعرين مختلفان. لكنها لا تقول لأي جلسة ينتمي كل سعر. انقل كل سعر إلى جلسته أولًا."
      - id: MC-P10-025
        when: [big]
        feedback:
          en: "Bigger pills are easier to see, but they still sit in their own row, away from the session they belong to."
          ar: "الشارات الأكبر أسهل في الرؤية، لكنها ما زالت في صف وحدها، بعيدًا عن الجلسة التي تخصها."
    correct:
      en: "Grouping by position, not by colour."
      ar: "التجميع بالمكان، لا باللون."
    explain:
      en: "Matching pills make the two prices look like a pair, apart from their sessions. Put each price with its session; use colour only to support that."
      ar: "الشارتان المتطابقتان تجعلان السعرين يبدوان زوجًا، بعيدًا عن جلستيهما. ضع كل سعر مع جلسته، واستخدم اللون لدعم ذلك فقط."

  - id: S03
    type: card
    part: concept
    icons: [group, warn, fold, promo, ear]
    title: { en: "Boxes, look-alikes and real headings", ar: "الإطارات والمتشابهات والعناوين الحقيقية" }
    body:
      en: "- **Containers:** a shared box or tinted area is a strong grouping cue. It can beat spacing.\n- **Use them with care:** if spacing already shows the groups, extra boxes only add clutter. Boxes help most when a group mixes different kinds of items.\n- **False floors:** a full-width line or band can look like the end of the page, so people stop scrolling.\n- **Look-alikes:** things that look the same seem to work the same. Content styled like an ad gets ignored like one.\n- **Real headings:** for screen-reader users, big bold text is not a heading unless the code says it is."
      ar: "- **الـ Containers (الحاويات):** الإطار المشترك أو المساحة الملوّنة إشارة تجميع قوية. وقد تتغلّب على المسافات.\n- **استخدمها بحذر:** إن كانت المسافات تُظهر المجموعات أصلًا، فالإطارات الإضافية تزيد الازدحام فقط. وتفيد أكثر حين تضم المجموعة عناصر من أنواع مختلفة.\n- **النهاية الوهمية (False floor):** الخط أو الشريط بعرض الصفحة قد يبدو كنهايتها، فيتوقّف الناس عن التمرير.\n- **المتشابهات:** العناصر المتشابهة في الشكل تبدو كأنها تعمل بالطريقة نفسها. والمحتوى الذي يشبه الإعلان يُتجاهل مثله.\n- **العناوين الحقيقية:** عند من يستخدمون الـ Screen reader، النص الكبير العريض ليس عنوانًا إلا إذا عُرّف كعنوان في الكود."

  - id: S04
    type: compare
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g: a container's boundary is a strong cue that can overpower proximity. A button just outside the card, even very close, reads as part of the page, not the session."
      ar: "NN/g: حدود الحاوية إشارة قوية قد تتغلّب على التقارب. الزر الموجود خارج الـ Card مباشرة، حتى لو كان قريبًا جدًا، يُقرأ كجزء من الصفحة لا من الجلسة."
    prompt:
      en: "Each session is now a card. In which version does each Reserve button clearly belong to its session?"
      ar: "أصبحت كل جلسة Card. في أي نسخة ينتمي كل زر «احجز» بوضوح إلى جلسته؟"
    a:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: heading, text: "@W2a" }
              - { kind: small, text: "@W2b", gap: xs }
              - { kind: meta, text: "@W2c", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: xs }
          - kind: group
            gap: l
            blocks:
              - { kind: heading, text: "@W2e" }
              - { kind: small, text: "@W2f", gap: xs }
              - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2h", gap: xs }
    b:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: heading, text: "@W2a" }
              - { kind: small, text: "@W2b", gap: xs }
              - { kind: meta, text: "@W2c", gap: xs }
              - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - kind: group
            gap: l
            blocks:
              - { kind: heading, text: "@W2e" }
              - { kind: small, text: "@W2f", gap: xs }
              - { kind: meta, text: "@W2g", gap: xs }
              - { kind: button, emphasis: low, text: "@W2h", gap: s }
    answer: b
    misconceptions:
      - id: MC-P10-034
        when: [a]
        feedback:
          en: "In A the button is very close to its card, but outside the border. The edge wins over the small gap, so the button looks like it belongs to the page, between two sessions."
          ar: "في A الزر قريب جدًا من الـ Card، لكنه خارج الإطار. والحافة أقوى من المسافة الصغيرة، فيبدو الزر تابعًا للصفحة، بين جلستين."
    correct:
      en: "Everything a session needs sits inside its card."
      ar: "كل ما تحتاجه الجلسة موجود داخل الـ Card الخاصة بها."
    explain:
      en: "Once you draw a box, the box is the group. NN/g saw this fix a recipe app: wrapping each recipe's image, title, byline and rating in one card ended confusion about which rating went with which recipe."
      ar: "حين ترسم إطارًا، يصبح الإطار هو المجموعة. ورأت NN/g هذا يصلح تطبيق وصفات: وضع صورة كل وصفة وعنوانها وكاتبها وتقييمها في Card واحدة أنهى الالتباس حول أي تقييم يخص أي وصفة."

  - id: S05
    type: fix
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g's illusion of completeness: on Maple's site, 6 of 8 users didn't realise the page scrolled. Full-width bands and big gaps look like the end; let the next content peek above the screen edge."
      ar: "وهم الاكتمال من NN/g: في موقع Maple، لم يدرك 6 من 8 مستخدمين أن الصفحة تتحرّك للأسفل. الأشرطة بعرض الصفحة والمسافات الكبيرة تبدو كنهاية؛ اجعل المحتوى التالي يظهر جزء منه فوق حافة الشاشة."
    scenario:
      en: "This is the first screen of the sessions page on Sara's phone. In testing, most people booked the first session and never saw the second one below."
      ar: "هذه أول شاشة من صفحة الجلسات على هاتف سارة. في الاختبار، حجز معظم الناس الجلسة الأولى ولم يروا الجلسة الثانية في الأسفل."
    prompt:
      en: "What should you change?"
      ar: "ماذا تغيّر؟"
    mock:
      caption: { en: "First screen, before scrolling", ar: "الشاشة الأولى، قبل التمرير" }
      blocks:
        - kind: group
          tone: plain
          height: 400
          blocks:
            - { kind: title, text: { en: "Workshops this month", ar: "ورش هذا الشهر" } }
            - { kind: heading, text: "@W2a", gap: l }
            - { kind: small, text: "@W2b", gap: xs }
            - { kind: meta, text: "@W2c", gap: xs }
            - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              tone: tint
              gap: xl
              blocks:
                - { kind: heading, text: "@W2n" }
                - { kind: button, text: { en: "Subscribe", ar: "اشترك" }, gap: s }
            - { kind: small, text: "", height: 150 }
            - { kind: heading, text: "@W2e" }
    options:
      - { id: taller, text: { en: "Make the updates band taller and brighter so it gets noticed", ar: "اجعل شريط التحديثات أطول وألمع حتى يلفت النظر" } }
      - { id: line, text: { en: "Add a full-width line under the band to separate it clearly", ar: "أضف خطًا بعرض الصفحة تحت الشريط ليفصله بوضوح" } }
      - { id: peek, text: { en: "Move the band further down and close the gap, so the second session's title shows at the bottom of the first screen", ar: "انقل الشريط إلى الأسفل وقلّل المسافة، حتى يظهر عنوان الجلسة الثانية في أسفل الشاشة الأولى" } }
      - { id: tight, text: { en: "Make the gaps inside the first session smaller", ar: "صغّر المسافات داخل الجلسة الأولى" } }
    answer: [peek]
    misconceptions:
      - id: MC-P10-035
        when: [taller, line]
        feedback:
          en: "A bigger band or an extra full-width line makes the screen look even more finished. NN/g lists both as causes of false floors."
          ar: "الشريط الأكبر أو الخط الإضافي بعرض الصفحة يجعل الشاشة تبدو منتهية أكثر. وتذكر NN/g الاثنين كأسباب للنهاية الوهمية."
      - id: MC-P10-035
        when: [tight]
        feedback:
          en: "The first session is already grouped well. The problem is below it: the band and the empty space look like the bottom of the page."
          ar: "الجلسة الأولى مجمّعة جيدًا أصلًا. المشكلة تحتها: الشريط والمساحة الفارغة يبدوان كأسفل الصفحة."
    correct:
      en: "Content that peeks over the edge says \"there's more\"."
      ar: "المحتوى الظاهر جزئيًا عند الحافة يقول «هناك المزيد»."
    explain:
      en: "NN/g calls this the illusion of completeness. Full-width bands, strong lines and big empty gaps look like a page's floor. Letting the next item show at the screen edge is the clearest cue to keep scrolling."
      ar: "تسمّي NN/g هذا وهم الاكتمال. الأشرطة بعرض الصفحة والخطوط القوية والمسافات الفارغة الكبيرة تبدو كأرضية الصفحة. وظهور العنصر التالي عند حافة الشاشة هو أوضح إشارة لمواصلة التمرير."

  - id: S06
    type: choose
    part: guided
    rules: [R06, R14]
    value:
      en: "From an NN/g study (Martha Stewart site): a video the same size and style as the ads around it was taken for an ad and skipped. Useful content must not look like ads."
      ar: "من دراسة NN/g (موقع Martha Stewart): فيديو بحجم وشكل الإعلانات حوله ظنّه الناس إعلانًا وتجاهلوه. المحتوى المفيد يجب ألّا يشبه الإعلانات."
    scenario:
      en: "The workshop page on a laptop has a short video of what you'll make. It sits in the side column between two ads, at the same size and style. Very few visitors play it."
      ar: "في صفحة الورشة على الـ Laptop فيديو قصير لما ستصنعه. وهو في العمود الجانبي بين إعلانين، بالحجم والشكل نفسيهما. قليلون جدًا يشغّلونه."
    prompt:
      en: "What should you change?"
      ar: "ماذا تغيّر؟"
    mock:
      frame: wide
      caption: { en: "Laptop", ar: "Laptop" }
      blocks:
        - kind: row
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: title, text: "@W2a" }
                - { kind: small, text: "@W2b", gap: s }
                - { kind: text, text: { en: "Learn to sketch screens on paper before you open any design tool.", ar: "تعلّم رسم الشاشات على الورق قبل أن تفتح أي أداة تصميم." }, gap: s }
                - { kind: button, text: "@W2d", gap: m }
            - kind: group
              tone: tint
              blocks:
                - { kind: small, text: { en: "Ad", ar: "إعلان" } }
                - { kind: image, size: s, text: { en: "Phone deals", ar: "عروض الهواتف" }, gap: xs }
                - { kind: small, text: { en: "Video", ar: "فيديو" }, gap: m }
                - { kind: image, size: s, text: { en: "▶ What you'll make", ar: "▶ ما ستصنعه" }, gap: xs }
                - { kind: small, text: { en: "Ad", ar: "إعلان" }, gap: m }
                - { kind: image, size: s, text: { en: "Learn English fast", ar: "تعلّم الإنجليزية بسرعة" }, gap: xs }
    options:
      - { id: auto, text: { en: "Make the video play by itself", ar: "اجعل الفيديو يعمل تلقائيًا" } }
      - { id: bigger, text: { en: "Make all three boxes in the side column bigger", ar: "كبّر المربعات الثلاثة في العمود الجانبي" } }
      - { id: move, text: { en: "Move the video into the workshop details, styled differently from the ads", ar: "انقل الفيديو إلى تفاصيل الورشة، بشكل مختلف عن الإعلانات" } }
    answer: [move]
    misconceptions:
      - id: MC-P10-036
        when: [auto, bigger]
        feedback:
          en: "It would still look like the boxes around it, and people skip that column because they expect ads there. Make it look like part of the workshop."
          ar: "سيبقى شبيهًا بالمربعات حوله، والناس يتجاوزون ذلك العمود لأنهم يتوقّعون فيه إعلانات. اجعله يبدو جزءًا من الورشة."
    correct:
      en: "Out of the ad slot, into the content it belongs to."
      ar: "خارج مكان الإعلانات، وداخل المحتوى الذي ينتمي إليه."
    explain:
      en: "Similarity makes the video one of the ads. NN/g saw this on Martha Stewart's site: a how-to video in the side column, styled like the ads, was taken for an ad, and several people never noticed it. This is banner blindness."
      ar: "التشابه يجعل الفيديو واحدًا من الإعلانات. رأت NN/g هذا في موقع Martha Stewart: فيديو تعليمي في العمود الجانبي بشكل الإعلانات ظنّه الناس إعلانًا، ولم يلاحظه بعضهم أصلًا. وهذا ما يُسمّى عمى الإعلانات (Banner blindness)."

  - id: S07
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "NN/g: borders added \"in an abundance of caution\" create clutter. Prefer whitespace; add a container only where spacing can't do the job."
      ar: "NN/g: الإطارات المضافة «من باب الاحتياط» تصنع ازدحامًا. فضّل المسافات البيضاء، وأضف Container فقط حين لا تكفي المسافات."
    prompt:
      en: "Both versions are grouped correctly. Which one makes the two sessions easier to take in?"
      ar: "النسختان مجمّعتان بشكل صحيح. أيّهما تجعل الجلستين أسهل في الفهم بنظرة؟"
    a:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: line, text: "@W2a" }
              - { kind: line, text: "@W2b", gap: s }
              - { kind: line, text: "@W2c", gap: s }
              - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - kind: group
            gap: s
            blocks:
              - { kind: line, text: "@W2e" }
              - { kind: line, text: "@W2f", gap: s }
              - { kind: line, text: "@W2g", gap: s }
              - { kind: button, emphasis: low, text: "@W2h", gap: s }
          - { kind: line, text: "@W2n", gap: s }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: text, text: "@W2b", gap: xs }
          - { kind: meta, text: "@W2c", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - { kind: heading, text: "@W2e", gap: xl }
          - { kind: text, text: "@W2f", gap: xs }
          - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
          - { kind: link, text: "@W2n", gap: xl }
    answer: b
    reason:
      prompt: { en: "When would boxes be worth adding?", ar: "متى تستحق الإطارات الإضافة؟" }
      options:
        - { id: always, text: { en: "Always: a box makes every group clearer", ar: "دائمًا: الإطار يوضّح أي مجموعة" } }
        - { id: needed, text: { en: "When spacing can't show the groups, for example when a group mixes images, text and buttons", ar: "حين لا تكفي المسافات لإظهار المجموعات، مثلًا حين تضم المجموعة صورًا ونصوصًا وأزرارًا" } }
        - { id: never, text: { en: "Never: boxes look old-fashioned", ar: "أبدًا: الإطارات تبدو قديمة" } }
      answer: [needed]
      misconceptions:
        - id: MC-P10-024
          when: [always, never]
          feedback:
            en: "It's not about style, and boxes aren't free. Each one adds lines to process. Use one when spacing alone can't make the group clear."
            ar: "الأمر لا يتعلّق بالأسلوب، والإطارات ليست بلا ثمن. كل واحد يضيف خطوطًا على العين أن تعالجها. استخدمه حين لا تكفي المسافات وحدها لتوضيح المجموعة."
    misconceptions:
      - id: MC-P10-024
        when: [a]
        feedback:
          en: "A boxes every line inside each card: you see eleven boxes before you see two sessions. The spacing in B already does the grouping."
          ar: "A تضع إطارًا لكل سطر داخل كل Card: ترى أحد عشر إطارًا قبل أن ترى جلستين. والمسافات في B تقوم بالتجميع أصلًا."
    correct:
