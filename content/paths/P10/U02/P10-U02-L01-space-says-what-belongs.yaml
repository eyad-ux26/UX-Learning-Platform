id: P10-U02-L01
mode: lesson
minutes: 9
title:
  en: "Space says what belongs together"
  ar: "المسافة تقول ما ينتمي معًا"
sources:
  - title: { en: "Proximity Principle in Visual Design (NN/g)", ar: "مبدأ التقارب في التصميم البصري (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-proximity/"
  - title: { en: "Form Design Quick Fix: Group Form Elements Effectively Using White Space (NN/g)", ar: "إصلاح سريع للنماذج: جمّع عناصر النموذج بالمسافات البيضاء (NN/g)" }
    url: "https://www.nngroup.com/articles/form-design-white-space/"
  - title: { en: "Visual Hierarchy in UX: Definition (NN/g)", ar: "التسلسل البصري في تجربة المستخدم: تعريف (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/"
review_labels:
  MC-P10-020: { en: "Less space inside a group, more between groups", ar: "مسافة أقل داخل المجموعة، وأكثر بين المجموعات" }
  MC-P10-023: { en: "A label sits closer to its own field than to any other", ar: "التسمية أقرب إلى حقلها من أي حقل آخر" }
  MC-P10-031: { en: "Split a long form into a few meaningful groups", ar: "قسّم النموذج الطويل إلى مجموعات قليلة لها معنى" }
  MC-P10-033: { en: "Controls far from the task get overlooked", ar: "العناصر البعيدة عن المهمة لا يراها الناس" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two workshops, one page", ar: "ورشتان في صفحة واحدة" }
    body:
      en: "The workshop page now lists two sessions. Every line has the same gap above it.\n\nSara wants the cheaper one. Can she tell, at a glance, which price and which button belong to which workshop?"
      ar: "أصبحت صفحة الورش تعرض جلستين. وكل سطر فوقه المسافة نفسها.\n\nتريد سارة الأرخص. هل تستطيع أن تعرف بنظرة سريعة أي سعر وأي زر يخص كل ورشة؟"
    mock:
      blocks:
        - { kind: heading, text: "@W2a" }
        - { kind: text, text: "@W2b", gap: m }
        - { kind: meta, text: "@W2c", gap: m }
        - { kind: button, emphasis: low, text: "@W2d", gap: m }
        - { kind: heading, text: "@W2e", gap: m }
        - { kind: text, text: "@W2f", gap: m }
        - { kind: meta, text: "@W2g", gap: m }
        - { kind: button, emphasis: low, text: "@W2h", gap: m }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    value:
      en: "Spacing is the first grouping cue (NN/g: proximity can overpower colour and shape). Fix which session a button belongs to by changing the gaps, not the words or the size."
      ar: "المسافات أول إشارة للتجميع (NN/g: التقارب قد يتغلّب على اللون والشكل). أصلح انتماء الزر لجلسته بتغيير المسافات، لا الكلمات ولا الحجم."
    mock:
      blocks:
        - { kind: heading, text: "@W2a" }
        - { kind: text, text: "@W2b", gap: l }
        - { kind: meta, text: "@W2c", gap: xs }
        - { kind: button, emphasis: low, text: { en: "Reserve", ar: "احجز" }, gap: l }
        - { kind: heading, text: "@W2e", gap: xs }
        - { kind: text, text: "@W2f", gap: l }
        - { kind: meta, text: "@W2g", gap: xs }
        - { kind: button, emphasis: low, text: { en: "Reserve", ar: "احجز" }, gap: l }
    prompt:
      en: "Someone changed the spacing. The first Reserve button now sits right above the second title, far from its own price. What should you change so it clearly belongs to the first session?"
      ar: "غيّر أحدهم المسافات. أصبح زر «احجز» الأول فوق العنوان الثاني مباشرة، وبعيدًا عن سعر جلسته. ماذا تغيّر حتى يبدو بوضوح أنه يخص الجلسة الأولى؟"
    options:
      - { id: bigger, text: { en: "Make the button bigger", ar: "كبّر الزر" } }
      - { id: label, text: { en: "Rename it \"Reserve this session\"", ar: "غيّر نصّه إلى «احجز هذه الجلسة»" } }
      - { id: space, text: { en: "Less space above the button, more space below it", ar: "مسافة أقل فوق الزر، ومسافة أكبر تحته" } }
    answer: [space]
    misconceptions:
      - id: MC-P10-020
        when: [label, bigger]
        feedback:
          en: "The button would still sit tight against the second title. People pair what's close before they read a word, so fix the gaps: small to its own price, big before the next session."
          ar: "سيبقى الزر ملتصقًا بالعنوان الثاني. والناس يربطون المتقارب قبل أن يقرؤوا أي كلمة، فأصلح المسافات: صغيرة مع سعر جلسته، وكبيرة قبل الجلسة التالية."
    correct:
      en: "Small gap inside the group, big gap between groups."
      ar: "مسافة صغيرة داخل المجموعة، ومسافة كبيرة بين المجموعات."
    explain:
      en: "Spacing carries meaning before anyone reads a word. Right now it pairs the button with the wrong session, so Sara could reserve the paid workshop by mistake."
      ar: "المسافات تحمل معنى قبل أن يقرأ أحد أي كلمة. والآن تربط الزر بالجلسة الخطأ، فقد تحجز سارة الورشة المدفوعة بالخطأ."

  - id: S03
    type: card
    part: concept
    icons: [space, form, eye, list]
    title: { en: "Close means together", ar: "القريب يعني معًا" }
    body:
      en: "People see items that sit close together as one group, before they read a word. This is **proximity**, and Nielsen Norman Group found it can beat colour and shape.\n\n- **Gaps:** small inside a group, bigger between groups.\n- **Form labels:** each label sits closer to its own field than to any other field.\n- **Distance hides things:** people focused on a task miss a control placed far from what it acts on.\n- **Long forms:** a few short groups of related fields feel like a few short forms."
      ar: "يرى الناس العناصر المتقاربة كمجموعة واحدة، قبل أن يقرؤوا أي كلمة. يُسمّى هذا **الـ Proximity (التقارب)**، ووجدت Nielsen Norman Group أنه قد يتغلّب على اللون والشكل.\n\n- **المسافات:** صغيرة داخل المجموعة، وأكبر بين المجموعات.\n- **تسميات النموذج (Labels):** كل تسمية أقرب إلى حقلها من أي حقل آخر.\n- **البعيد لا يُرى:** من يركّز على مهمته لا يرى زرًّا بعيدًا عن الشيء الذي يعمل عليه.\n- **النماذج الطويلة:** بضع مجموعات قصيرة من الحقول المترابطة تبدو كبضعة نماذج قصيرة."

  - id: S04
    type: tune
    part: guided
    rules: [R06, R13]
    value:
      en: "NN/g found that when a label has the same gap above and below it, people can't tell which field it names. Each label must hug its own field."
      ar: "وجدت NN/g أن التسمية التي فوقها وتحتها المسافة نفسها لا يعرف الناس أي حقل تسمّي. يجب أن تلتصق كل تسمية بحقلها."
    scenario:
      en: "Nour types her delivery address on her phone. The form has three fields, and the designer is choosing the spacing."
      ar: "تكتب نور عنوان التوصيل على هاتفها. في النموذج ثلاثة حقول، والمصمّم يختار المسافات."
    prompt:
      en: "Try each spacing and type in the fields. Which one makes it clear which label goes with which field?"
      ar: "جرّب كل توزيع للمسافات واكتب في الحقول. أيّها يوضّح أي تسمية تخص أي حقل؟"
    start: equal
    options:
      - id: equal
        text: { en: "Each label halfway between the field above and the field below", ar: "كل تسمية في منتصف المسافة بين الحقل الذي فوقها والذي تحتها" }
        mock:
          blocks:
            - { kind: small, text: "@A1a" }
            - { kind: field, text: "@A1b", gap: m }
            - { kind: small, text: "@A1c", gap: m }
            - { kind: field, text: "@A1d", gap: m }
            - { kind: small, text: "@A1e", gap: m }
            - { kind: field, text: "@A1f", gap: m }
      - id: below
        text: { en: "Each label right under the field before it", ar: "كل تسمية تحت الحقل الذي قبلها مباشرة" }
        mock:
          blocks:
            - { kind: small, text: "@A1a" }
            - { kind: field, text: "@A1b", gap: l }
            - { kind: small, text: "@A1c", gap: xs }
            - { kind: field, text: "@A1d", gap: l }
            - { kind: small, text: "@A1e", gap: xs }
            - { kind: field, text: "@A1f", gap: l }
      - id: tight
        text: { en: "Each label right above its own field, with a bigger gap before the next label", ar: "كل تسمية فوق حقلها مباشرة، ومسافة أكبر قبل التسمية التالية" }
        mock:
          blocks:
            - { kind: small, text: "@A1a" }
            - { kind: field, text: "@A1b", gap: xs }
            - { kind: small, text: "@A1c", gap: l }
            - { kind: field, text: "@A1d", gap: xs }
            - { kind: small, text: "@A1e", gap: l }
            - { kind: field, text: "@A1f", gap: xs }
    answer: [tight]
    misconceptions:
      - id: MC-P10-023
        when: [equal]
        feedback:
          en: "Look at \"Building\": it's as close to the street field as to its own. NN/g saw exactly this make a short form confusing. Pull each label tight to its own field."
          ar: "انظر إلى «رقم المبنى»: قربها من حقل الشارع مثل قربها من حقلها. رأت NN/g هذا بالضبط يربك نموذجًا قصيرًا. ألصِق كل تسمية بحقلها."
      - id: MC-P10-023
        when: [below]
        feedback:
          en: "Now every label hugs the wrong field, so Nour may type her flat number in the building field. A label belongs right above the field it names."
          ar: "الآن كل تسمية ملتصقة بالحقل الخطأ، فقد تكتب نور رقم الشقة في حقل المبنى. مكان التسمية فوق الحقل الذي تسمّيه مباشرة."
    correct:
      en: "Each label hugs its own field; bigger gaps separate the pairs."
      ar: "كل تسمية ملتصقة بحقلها، والمسافات الأكبر تفصل بين الأزواج."
    explain:
      en: "A label and its field are a group of two. NN/g recommends putting labels above fields and closer to their own field than to any other, so each pair reads as one unit."
      ar: "التسمية وحقلها مجموعة من عنصرين. وتنصح NN/g بوضع التسميات فوق الحقول، وأقرب إلى حقلها من أي حقل آخر، حتى يُقرأ كل زوج كوحدة واحدة."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R14]
    value:
      en: "From an NN/g study of the Kayak app: a Skip link far from the sign-in buttons made people think signing in was required. An optional path must sit inside the group of choices."
      ar: "من دراسة NN/g لتطبيق Kayak: رابط «تخطَّ» البعيد عن أزرار الدخول جعل الناس يظنّون أن تسجيل الدخول إلزامي. الطريق الاختياري يجب أن يكون داخل مجموعة الخيارات."
    scenario:
      en: "A travel app shows this screen before booking. Signing in is optional, but in testing many people thought they had to create an account, and some gave up."
      ar: "يعرض تطبيق سفر هذه الشاشة قبل الحجز. تسجيل الدخول اختياري، لكن في الاختبار ظنّ كثيرون أن عليهم إنشاء حساب، وتوقّف بعضهم."
    prompt:
      en: "Try each place for the way to skip signing in. Where should it go?"
      ar: "جرّب كل مكان لطريقة تخطّي تسجيل الدخول. أين يجب أن تكون؟"
    start: corner
    options:
      - id: corner
        text: { en: "A small Skip link in the top corner (as now)", ar: "رابط صغير «تخطَّ» في الزاوية العلوية (كما الآن)" }
        mock: &signin
          blocks:
            - kind: row
              blocks:
                - { kind: link, text: { en: "Skip", ar: "تخطَّ" } }
                - { kind: small, text: "" }
                - { kind: small, text: "" }
            - { kind: title, text: { en: "Sign in to save your trips", ar: "سجّل الدخول لحفظ رحلاتك" }, gap: xl }
            - { kind: button, text: { en: "Continue with Google", ar: "المتابعة باستخدام Google" }, gap: l }
            - { kind: button, emphasis: low, text: { en: "Continue with Apple", ar: "المتابعة باستخدام Apple" }, gap: s }
            - { kind: button, emphasis: low, text: { en: "Continue with email", ar: "المتابعة بالبريد الإلكتروني" }, gap: s }
      - id: under
        text: { en: "\"Continue without an account\" right under the sign-in buttons", ar: "«المتابعة بدون حساب» تحت أزرار الدخول مباشرة" }
        mock:
          blocks:
            - { kind: title, text: { en: "Sign in to save your trips", ar: "سجّل الدخول لحفظ رحلاتك" }, gap: xl }
            - { kind: button, text: { en: "Continue with Google", ar: "المتابعة باستخدام Google" }, gap: l }
            - { kind: button, emphasis: low, text: { en: "Continue with Apple", ar: "المتابعة باستخدام Apple" }, gap: s }
            - { kind: button, emphasis: low, text: { en: "Continue with email", ar: "المتابعة بالبريد الإلكتروني" }, gap: s }
            - { kind: link, text: { en: "Continue without an account", ar: "المتابعة بدون حساب" }, gap: s }
      - id: bottom
        text: { en: "A Skip link at the very bottom of the screen", ar: "رابط «تخطَّ» في أسفل الشاشة تمامًا" }
        mock:
          blocks:
            - { kind: title, text: { en: "Sign in to save your trips", ar: "سجّل الدخول لحفظ رحلاتك" }, gap: xl }
            - { kind: button, text: { en: "Continue with Google", ar: "المتابعة باستخدام Google" }, gap: l }
            - { kind: button, emphasis: low, text: { en: "Continue with Apple", ar: "المتابعة باستخدام Apple" }, gap: s }
            - { kind: button, emphasis: low, text: { en: "Continue with email", ar: "المتابعة بالبريد الإلكتروني" }, gap: s }
            - { kind: small, text: "", height: 150 }
            - { kind: link, text: { en: "Skip", ar: "تخطَّ" }, gap: xl }
    answer: [under]
    misconceptions:
      - id: MC-P10-033
        when: [corner, bottom]
        feedback:
          en: "People look at the buttons, because that's where the choice is. A link far from them is outside the group of choices, so it gets missed and signing in looks required."
          ar: "ينظر الناس إلى الأزرار، لأن الاختيار هناك. والرابط البعيد عنها خارج مجموعة الخيارات، فلا يراه أحد ويبدو تسجيل الدخول إلزاميًا."
    correct:
      en: "Skipping is one of the choices, so it sits with them."
      ar: "التخطّي أحد الخيارات، فمكانه معها."
    explain:
      en: "NN/g tested the Kayak app: its Skip link sat alone in the top corner, far from the main buttons, and it \"tricks users into thinking they must sign in\". Under the buttons, it's read as the fourth way to continue."
      ar: "اختبرت NN/g تطبيق Kayak: كان رابط «تخطَّ» وحده في الزاوية العلوية، بعيدًا عن الأزرار الرئيسية، فجعل الناس يظنّون أن عليهم تسجيل الدخول. وتحت الأزرار يُقرأ كطريقة رابعة للمتابعة."

  - id: S06
    type: tune
    part: guided
    rules: [R06, R13]
    value:
      en: "NN/g regrouped Walgreens' 15-field sign-up form into three titled groups; it then felt like three short forms. Chunking helps only when the groups are meaningful; lines between every field don't group anything."
      ar: "أعادت NN/g ترتيب نموذج تسجيل Walgreens ذي 15 حقلًا في ثلاث مجموعات بعناوين؛ فأصبح يبدو كثلاثة نماذج قصيرة. التقسيم يفيد فقط حين يكون للمجموعات معنى؛ والخطوط بين كل حقل وآخر لا تجمع شيئًا."
    scenario:
      en: "A pharmacy's sign-up form has nine fields in one even list. Many people give up before the end. You can't remove any field."
      ar: "نموذج التسجيل في صيدلية فيه تسعة حقول في قائمة واحدة متساوية. كثيرون يتوقّفون قبل النهاية. ولا يمكنك حذف أي حقل."
    prompt:
      en: "Try each layout. Which one makes the form feel shorter?"
      ar: "جرّب كل تخطيط. أيّها يجعل النموذج يبدو أقصر؟"
    start: list
    options:
      - id: list
        text: { en: "One even list (as now)", ar: "قائمة واحدة متساوية (كما الآن)" }
        mock:
          blocks:
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, text: "" }
            - { kind: field, label: { en: "Last name", ar: "اسم العائلة" }, text: "", gap: m }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "", gap: m }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: m }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, text: "", gap: m }
            - { kind: field, label: { en: "Repeat password", ar: "أعد كتابة كلمة المرور" }, text: "", gap: m }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الجوال" }, text: "", gap: m }
            - { kind: field, label: { en: "Street", ar: "الشارع" }, text: "", gap: m }
            - { kind: field, label: { en: "City", ar: "المدينة" }, text: "", gap: m }
      - id: lines
        text: { en: "A divider line between every field", ar: "خط فاصل بين كل حقل وآخر" }
        mock:
          blocks:
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, text: "" }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Last name", ar: "اسم العائلة" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Repeat password", ar: "أعد كتابة كلمة المرور" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الجوال" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "Street", ar: "الشارع" }, text: "", gap: s }
            - { kind: divider, gap: s }
            - { kind: field, label: { en: "City", ar: "المدينة" }, text: "", gap: s }
      - id: groups
        text: { en: "Three titled groups: About you, Your account, How to reach you", ar: "ثلاث مجموعات بعناوين: عنك، حسابك، كيف نتواصل معك" }
        mock:
          blocks:
            - { kind: heading, text: { en: "About you", ar: "عنك" } }
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, text: "", gap: s }
            - { kind: field, label: { en: "Last name", ar: "اسم العائلة" }, text: "", gap: s }
            - { kind: field, label: { en: "Date of birth", ar: "تاريخ الميلاد" }, text: "", gap: s }
            - { kind: heading, text: { en: "Your account", ar: "حسابك" }, gap: xl }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
            - { kind: field, label: { en: "Password", ar: "كلمة المرور" }, text: "", gap: s }
            - { kind: field, label: { en: "Repeat password", ar: "أعد كتابة كلمة المرور" }, text: "", gap: s }
            - { kind: heading, text: { en: "How to reach you", ar: "كيف نتواصل معك" }, gap: xl }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الجوال" }, text: "", gap: s }
            - { kind: field, label: { en: "Street", ar: "الشارع" }, text: "", gap: s }
            - { kind: field, label: { en: "City", ar: "المدينة" }, text: "", gap: s }
    answer: [groups]
    misconceptions:
      - id: MC-P10-031
        when: [list]
        feedback:
          en: "Nine equal steps feel like one long climb. Group the fields by what they're about, with a bigger gap between groups."
          ar: "تسع خطوات متساوية تبدو كصعود طويل واحد. جمّع الحقول حسب موضوعها، مع مسافة أكبر بين المجموعات."
      - id: MC-P10-024
        when: [lines]
        feedback:
          en: "Lines between every field cut the form into nine equal pieces. It looks busier and no shorter, because nothing shows which fields belong together."
          ar: "الخطوط بين كل حقل وآخر تقطع النموذج إلى تسع قطع متساوية. فيبدو أكثر ازدحامًا وليس أقصر، لأن لا شيء يُظهر أي الحقول تنتمي معًا."
    correct:
      en: "Three short groups read like three short forms."
      ar: "ثلاث مجموعات قصيرة تُقرأ كثلاثة نماذج قصيرة."
    explain:
      en: "NN/g regrouped Walgreens' 15-field sign-up form into Personal, Account and Contact information, 4 to 6 fields each, and it seemed like three short forms. The groups must make sense: random chunks of three wouldn't help."
      ar: "أعادت NN/g ترتيب نموذج تسجيل Walgreens ذي الـ 15 حقلًا إلى: المعلومات الشخصية، والحساب، والتواصل، من 4 إلى 6 حقول لكل منها، فبدا كثلاثة نماذج قصيرة. ويجب أن يكون للمجموعات معنى: تقسيم عشوائي كل ثلاثة حقول لن يفيد."

  - id: S07
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Teaches the squint test from NN/g: blur a screen until you can't read it; the groups and hierarchy that remain are what people see first. Lines under every item don't survive the blur as groups."
      ar: "يعلّم اختبار التحديق (Squint test) من NN/g: موّه الشاشة حتى لا تستطيع القراءة؛ والمجموعات والتسلسل الباقيان هما ما يراه الناس أولًا. الخطوط تحت كل عنصر لا تظهر كمجموعات بعد التمويه."
    prompt:
      en: "Designers check grouping with the squint test: blur the screen until the words can't be read, and see what groups are left. Both versions of the sessions page are blurred. Which one still shows two sessions?"
      ar: "يختبر المصمّمون التجميع باختبار التحديق (Squint test): موّه الشاشة حتى لا تُقرأ الكلمات، وانظر ما المجموعات الباقية. النسختان من صفحة الجلسات مموّهتان. أيّهما ما زالت تُظهر جلستين؟"
    a:
      mock:
        blur: 4
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: divider, gap: s }
          - { kind: text, text: "@W2b", gap: s }
          - { kind: divider, gap: s }
          - { kind: meta, text: "@W2c", gap: s }
          - { kind: divider, gap: s }
          - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - { kind: divider, gap: s }
          - { kind: heading, text: "@W2e", gap: s }
          - { kind: divider, gap: s }
          - { kind: text, text: "@W2f", gap: s }
          - { kind: divider, gap: s }
          - { kind: meta, text: "@W2g", gap: s }
          - { kind: divider, gap: s }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
    b:
      mock:
        blur: 4
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: text, text: "@W2b", gap: xs }
          - { kind: meta, text: "@W2c", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - { kind: heading, text: "@W2e", gap: xl }
          - { kind: text, text: "@W2f", gap: xs }
          - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
    answer: b
    reason:
      prompt: { en: "What does the blur test check?", ar: "ماذا يختبر التمويه؟" }
      options:
        - { id: size, text: { en: "Whether the text is big enough to read", ar: "هل النص كبير بما يكفي للقراءة" } }
        - { id: groups, text: { en: "Whether the groups and what stands out work without reading", ar: "هل المجموعات وما يبرز يعملان دون قراءة" } }
        - { id: color, text: { en: "Whether the colours have enough contrast", ar: "هل الألوان فيها Contrast كافٍ" } }
      answer: [groups]
      misconceptions:
        - id: MC-P10-020
          when: [size, color]
          feedback:
            en: "Blurring removes the words on purpose. What's left is the shape of the page: its groups and what stands out."
            ar: "التمويه يُخفي الكلمات عن قصد. وما يبقى هو شكل الصفحة: مجموعاتها وما يبرز فيها."
    misconceptions:
      - id: MC-P10-024
        when: [a]
        feedback:
          en: "Blurred, A is eight even stripes. The lines separate every item from every other, so no two items look like they belong together."
          ar: "بعد التمويه، A ثمانية خطوط متساوية. الخطوط تفصل كل عنصر عن الآخر، فلا يبدو أي عنصرين منتميين معًا."
    correct:
      en: "B passes: two clear blocks, even with no words."
      ar: "B تنجح: كتلتان واضحتان حتى دون كلمات."
    explain:
      en: "NN/g's squint test: squint or blur the screen slightly. If the groups you meant still show, the layout works before anyone reads. Dividers under every line make many equal pieces; spacing makes two sessions."
      ar: "اختبار التحديق من NN/g: ضيّق عينيك أو موّه الشاشة قليلًا. إن بقيت المجموعات التي قصدتها ظاهرة، فالتخطيط يعمل قبل أن يقرأ أحد. الفواصل تحت كل سطر تصنع قطعًا متساوية كثيرة؛ والمسافات تصنع جلستين."

  - id: S08
    type: fix
    part: independent
    confidence: true
    rules: [R14, R19]
    value:
      en: "New case from NN/g (California's benefits form): an Add button placed among unrelated buttons, far from the fields it adds, is camouflaged. Move it next to what it acts on, not just make it louder."
      ar: "حالة جديدة من NN/g (نموذج إعانات في كاليفورنيا): زر إضافة وُضع بين أزرار لا علاقة لها به، بعيدًا عن الحقول التي يضيفها، فاختفى بينها. انقله بجانب ما يعمل عليه، ولا تكتفِ بإبرازه."
    scenario:
      en: "On a job-benefits claim, people must list every employer from the last 18 months. Many send the claim with only one employer, and it gets delayed."
      ar: "في طلب إعانة البطالة، يجب أن يذكر الناس كل جهة عمل خلال آخر 18 شهرًا. كثيرون يرسلون الطلب بجهة عمل واحدة فقط، فيتأخّر."
    prompt:
      en: "What should you change?"
      ar: "ماذا تغيّر؟"
    mock:
      blocks:
        - { kind: heading, text: { en: "Employer 1", ar: "جهة العمل 1" } }
        - { kind: field, label: { en: "Employer name", ar: "اسم جهة العمل" }, text: { en: "Delta Foods", ar: "دلتا للأغذية" }, filled: true, gap: s }
        - { kind: field, label: { en: "From", ar: "من" }, text: { en: "March 2025", ar: "مارس 2025" }, filled: true, gap: s }
        - { kind: field, label: { en: "To", ar: "إلى" }, text: { en: "June 2026", ar: "يونيو 2026" }, filled: true, gap: s }
        - kind: row
          gap: xl
          blocks:
            - { kind: button, emphasis: low, text: { en: "Add employer", ar: "إضافة جهة عمل" } }
            - { kind: button, emphasis: low, text: { en: "Save draft", ar: "حفظ كمسودة" } }
            - { kind: button, emphasis: low, text: { en: "Cancel", ar: "إلغاء" } }
        - { kind: button, text: { en: "Next", ar: "التالي" }, gap: s }
    options:
      - { id: primary, text: { en: "Make Add employer a filled, bright button in the same row", ar: "اجعل «إضافة جهة عمل» زرًّا ممتلئًا بلون لافت في الصف نفسه" } }
      - { id: move, text: { en: "Move \"+ Add another employer\" right under the employer fields, away from Save, Cancel and Next", ar: "انقل «+ إضافة جهة عمل أخرى» تحت حقول جهة العمل مباشرة، بعيدًا عن الحفظ والإلغاء والتالي" } }
      - { id: rename, text: { en: "Rename it \"Add employer (if you had more than one)\"", ar: "غيّر اسمه إلى «إضافة جهة عمل (إن كان لديك أكثر من واحدة)»" } }
      - { id: first, text: { en: "Keep the row, but move Add employer to the end of it", ar: "أبقِ الصف، لكن انقل «إضافة جهة عمل» إلى آخره" } }
    answer: [move]
    misconceptions:
      - id: MC-P10-033
        when: [primary]
        feedback:
          en: "A bright button now competes with Next, and it still sits among buttons that leave the page. People still won't link it to the employer fields."
          ar: "الزر اللافت الآن ينافس «التالي»، وما زال بين أزرار تُخرج من الصفحة. ولن يربطه الناس بحقول جهة العمل."
      - id: MC-P10-033
        when: [rename, first]
        feedback:
          en: "It's still camouflaged among Save draft and Cancel, far from the fields it adds to. People scanning for \"another employer\" look at the employer fields."
          ar: "ما زال مختفيًا بين «حفظ كمسودة» و«إلغاء»، بعيدًا عن الحقول التي يضيف إليها. ومن يبحث عن «جهة عمل أخرى» ينظر إلى حقول جهة العمل."
    correct:
      en: "An action belongs next to the thing it acts on."
      ar: "الإجراء مكانه بجانب الشيء الذي يعمل عليه."
    explain:
      en: "NN/g found this on California's EDD claim form: the Add button was \"placed in close proximity to unrelated buttons\", so people didn't find it. Put it with the employer fields, and keep Back and Next together as their own group."
      ar: "وجدت NN/g هذا في نموذج EDD في كاليفورنيا: زر الإضافة وُضع قريبًا من أزرار لا علاقة لها به، فلم يجده الناس. ضعه مع حقول جهة العمل، واجعل «السابق» و«التالي» مجموعة مستقلة."

  - id: S09
    type: card
    part: recap
    icons: [space, form, eye, list]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Gaps:** you fixed a button pulled to the wrong session.\n- **Labels:** each one hugs its own field.\n- **Far means missed:** an optional path or an Add button belongs inside the group it serves.\n- **Long forms and the squint test:** meaningful groups make a form feel shorter, and a blur shows if the groups work.\n\nNext lesson: containers, look-alikes and headings."
      ar: "- **المسافات:** أصلحت زرًّا انجذب إلى الجلسة الخطأ.\n- **التسميات:** كل تسمية ملتصقة بحقلها.\n- **البعيد لا يُرى:** الطريق الاختياري أو زر الإضافة مكانه داخل المجموعة التي يخدمها.\n- **النماذج الطويلة واختبار التحديق:** المجموعات ذات المعنى تجعل النموذج يبدو أقصر، والتمويه يكشف إن كانت المجموعات تعمل.\n\nالدرس التالي: الـ Containers والعناصر المتشابهة والعناوين."
