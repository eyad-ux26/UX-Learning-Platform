id: P10-U02-L03
mode: lesson
minutes: 8
title:
  en: "Keep groups together when they stack"
  ar: "أبقِ المجموعات متماسكة عند ترتيبها عموديًا"
review_labels:
  MC-P10-028: { en: "Stack whole groups, never alternate their lines", ar: "رتّب المجموعات كاملة، ولا تبادل بين أسطرها" }
  MC-P10-029: { en: "Touching borders merge groups", ar: "الحدود المتلاصقة تدمج المجموعات" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "From wide to narrow", ar: "من العريض إلى الضيّق" }
    body:
      en: "On a laptop, the two sessions sit side by side as cards. On Sara's phone there's only room for one column, so something has to stack.\n\nHow it stacks decides whether the groups survive."
      ar: "على الحاسوب المحمول، تظهر الجلستان جنبًا إلى جنب كبطاقتين. أما على هاتف سارة فلا يتّسع إلا عمود واحد، لذلك يجب ترتيب شيء ما فوق شيء.\n\nطريقة هذا الترتيب تحدّد إن كانت المجموعات ستبقى متماسكة."
    mock:
      blocks:
        - kind: row
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: small, text: "@W2b", gap: xs }
                - { kind: meta, text: "@W2c", gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: small, text: "@W2f", gap: xs }
                - { kind: meta, text: "@W2g", gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    prompt:
      en: When the cards stack on Sara's phone, what should come right after the first session's date?
      ar: حين تترتّب البطاقات فوق بعضها على هاتف سارة، ما الذي يجب أن يأتي مباشرة بعد موعد الجلسة الأولى؟
    options:
      - { id: price, text: "@W2c" }
      - { id: date2, text: "@W2f" }
      - { id: title2, text: "@W2e" }
    answer: [price]
    misconceptions:
      - id: MC-P10-028
        when: [date2, title2]
        feedback:
          en: "That jumps to the second session before the first is finished. Stack whole groups: the first session's price comes next."
          ar: 'هذا ينتقل إلى الجلسة الثانية قبل أن تكتمل الأولى. رتّب المجموعات كاملة: سعر الجلسة الأولى يأتي بعد ذلك.'
    correct:
      en: 'Its own price: Free.'
      ar: 'سعرها هي: مجاني.'
    explain:
      en: 'Each session stays whole: title, date, price, button. If the second date came next, the page would alternate lines from two sessions, and Sara would have to piece them together.'
      ar: 'كل جلسة تبقى كاملة: العنوان والموعد والسعر والزر. ولو جاء الموعد الثاني بعد ذلك، لتبادلت الصفحة أسطرًا من جلستين، ولاضطرت سارة إلى تركيبها بنفسها.'
  - id: S03
    type: card
    part: concept
    icons: [layers, warn, ear]
    title: { en: "Stack whole groups", ar: "رتّب المجموعات كاملة" }
    body:
      en: "When a layout gets narrower, move whole groups, not their lines.\n\n- **Stack whole groups:** session A complete, then session B complete.\n- **Beware row-built layouts:** all titles in one row and all dates in the next turn into a zigzag on a phone.\n- **Match the code order:** screen readers and keyboards follow the code, not what the screen shows."
      ar: "عندما يضيق التخطيط، انقل المجموعات كاملة، لا أسطرها.\n\n- **رتّب المجموعات كاملة:** الجلسة A كاملة، ثم الجلسة B كاملة.\n- **احذر التخطيط المبني على صفوف:** كل العناوين في صف وكل التواريخ في الصف التالي تتحوّل إلى تنقّل متعرّج على الهاتف.\n- **طابق ترتيب الكود:** الـ Screen reader ولوحة المفاتيح يتبعان الكود، لا ما تعرضه الشاشة."
  - id: S04
    type: order
    part: guided
    confidence: true
    rules: [R06, R15]
    prompt:
      en: "Order the phone layout, top to bottom."
      ar: "رتّب تخطيط الهاتف من الأعلى إلى الأسفل."
    items:
      - { id: W2a, text: "@W2a", kind: heading }
      - { id: W2e, text: "@W2e", kind: heading }
      - { id: W2b, text: "@W2b" }
      - { id: W2f, text: "@W2f" }
      - { id: W2c, text: "@W2c" }
      - { id: W2g, text: "@W2g" }
      - { id: W2d, text: "@W2d", kind: button }
      - { id: W2h, text: "@W2h", kind: button }
    answer: [W2a, W2b, W2c, W2d, W2e, W2f, W2g, W2h]
    also_ok:
      - answer: [W2e, W2f, W2g, W2h, W2a, W2b, W2c, W2d]
        feedback:
          en: "That works too: the Service session first, then Sketch. Either session can lead, as long as each stays whole."
          ar: "هذا صحيح أيضًا: جلسة «صمّم» أولًا ثم «ارسم». يمكن لأي جلسة أن تتصدّر، ما دامت كل واحدة كاملة."
    misconceptions:
      - id: MC-P10-028
        when: { before: [W2e, W2d] }
        feedback:
          en: "The second title comes before the first session is finished, so lines from the two sessions are mixed. Keep each session's four lines together."
          ar: "العنوان الثاني يأتي قبل أن تكتمل الجلسة الأولى، فاختلطت أسطر الجلستين. أبقِ أسطر كل جلسة الأربعة معًا."
    hints:
      - { en: "Finish one session completely before starting the next.", ar: "أكمل جلسة واحدة بالكامل قبل أن تبدأ التالية." }
    correct:
      en: "One complete session, then the other."
      ar: "جلسة كاملة، ثم الأخرى."
    explain:
      en: "The items start in table order (titles, then dates, then prices). Stacked on a phone, that order zigzags. Reordering by session keeps every fact next to its owner."
      ar: "تبدأ العناصر بترتيب الجدول (العناوين، ثم التواريخ، ثم الأسعار). وعند ترتيبها عموديًا على الهاتف يتعرّج هذا الترتيب. إعادة الترتيب حسب الجلسة تبقي كل معلومة بجانب صاحبها."

  - id: S05
    type: compare
    part: contrast
    rules: [R11, R15]
    prompt:
      en: "Two phone versions of the same page. Which one keeps the bookings intact?"
      ar: "نسختان للهاتف من الصفحة نفسها. أيّهما تحافظ على الحجزين سليمين؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: heading, text: "@W2e", gap: xs }
          - { kind: small, text: "@W2b", gap: m }
          - { kind: small, text: "@W2f", gap: xs }
          - { kind: meta, text: "@W2c", gap: m }
          - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: m }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
    b:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: heading, text: "@W2a" }
              - { kind: small, text: "@W2b", gap: xs }
              - { kind: meta, text: "@W2c", gap: xs }
              - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - kind: group
            gap: m
            blocks:
              - { kind: heading, text: "@W2e" }
              - { kind: small, text: "@W2f", gap: xs }
              - { kind: meta, text: "@W2g", gap: xs }
              - { kind: button, emphasis: low, text: "@W2h", gap: s }
    answer: b
    misconceptions:
      - id: MC-P10-028
        when: [a]
        feedback:
          en: "A stacked the rows, not the cards: two titles, then two dates, then two prices. Sara has to match them up herself."
          ar: "A رتّبت الصفوف لا البطاقات: عنوانان، ثم تاريخان، ثم سعران. على سارة أن تطابقها بنفسها."
    correct:
      en: "Whole cards stacked, so every fact stays with its session."
      ar: "رُتّبت البطاقات كاملة، فبقيت كل معلومة مع جلستها."
    explain:
      en: "Same content, same space. A keeps the desktop rows and alternates between sessions; B moves each complete card. That's the difference between reflowing groups and reflowing lines."
      ar: "المحتوى نفسه والمساحة نفسها. A تحتفظ بصفوف الحاسوب وتتنقّل بين الجلستين؛ وB تنقل كل بطاقة كاملة. هذا هو الفرق بين إعادة ترتيب المجموعات وإعادة ترتيب الأسطر."

  - id: S06
    type: choose
    part: guided
    rules: [R06, R14]
    scenario:
      en: "On desktop, the sessions are shown as a comparison table: one column per session, one row each for date, price and Reserve."
      ar: "على الحاسوب، تُعرض الجلسات كجدول مقارنة: عمود لكل جلسة، وصف لكل من التاريخ والسعر وزر الحجز."
    prompt:
      en: "What's the best way to show this on a phone?"
      ar: "ما أفضل طريقة لعرض ذلك على الهاتف؟"
    options:
      - { id: scroll, text: { en: "Keep the table and let it scroll sideways", ar: "أبقِ الجدول واجعله يتحرّك أفقيًا" } }
      - { id: cards, text: { en: "Turn each column into a card, with each value labeled", ar: "حوّل كل عمود إلى بطاقة، مع تسمية كل قيمة" } }
      - { id: shrink, text: { en: "Shrink the table text until it fits", ar: "صغّر نص الجدول حتى يتّسع" } }
    answer: [cards]
    reason:
      prompt: { en: "Why do the values need labels in the cards?", ar: "لماذا تحتاج القيم إلى تسميات داخل البطاقات؟" }
      options:
        - { id: lost, text: { en: "The row headers that explained them are gone", ar: "لأن عناوين الصفوف التي كانت تشرحها اختفت" } }
        - { id: pretty, text: { en: "Labels make cards look more complete", ar: "لأن التسميات تجعل البطاقات تبدو أكمل" } }
      answer: [lost]
    misconceptions:
      - id: MC-P10-030
        when: [scroll, shrink]
        feedback:
          en: "Sideways scrolling hides one session while you read the other, and shrunk text is hard to read. Both make comparing harder on a phone."
          ar: "التمرير الأفقي يخفي جلسة وأنت تقرأ الأخرى، والنص المصغّر صعب القراءة. كلاهما يجعل المقارنة أصعب على الهاتف."
    correct:
      en: "Each session becomes a complete card that reads top to bottom."
      ar: "تصبح كل جلسة بطاقة كاملة تُقرأ من الأعلى إلى الأسفل."
    explain:
      en: "A table's meaning comes from its row and column headers. When you turn columns into cards, bring the row headers along as labels (\"Price: EGP 120\") so each value still says what it is."
      ar: "معنى الجدول يأتي من عناوين صفوفه وأعمدته. عندما تحوّل الأعمدة إلى بطاقات، انقل عناوين الصفوف معها كتسميات («السعر: 120 جنيهًا») حتى تبقى كل قيمة واضحة."

  - id: S07
    type: spot
    part: guided
    rules: [R06, R15]
    prompt:
      en: "This phone layout has one item in the wrong place. Find it."
      ar: "في تخطيط الهاتف هذا عنصر واحد في المكان الخطأ. جِده."
    mock:
      blocks:
        - kind: group
          blocks:
            - { kind: heading, text: "@W2a", region: atitle }
            - { kind: small, text: "@W2b", gap: xs, region: adate }
            - { kind: meta, text: "@W2g", gap: xs, region: wrongprice }
            - { kind: button, emphasis: low, text: "@W2d", gap: s, region: abutton }
        - kind: group
          gap: m
          blocks:
            - { kind: heading, text: "@W2e", region: btitle }
            - { kind: small, text: "@W2f", gap: xs, region: bdate }
            - { kind: meta, text: "@W2c", gap: xs, region: bprice }
            - { kind: button, emphasis: low, text: "@W2h", gap: s, region: bbutton }
    regions:
      - { id: adate, label: { en: "First card: 17 November, 18:00", ar: "البطاقة الأولى: 17 نوفمبر، الساعة 18:00" } }
      - { id: wrongprice, label: { en: "First card: EGP 120", ar: "البطاقة الأولى: 120 جنيهًا" } }
      - { id: abutton, label: "@W2d" }
      - { id: bdate, label: { en: "Second card: 18 November, 10:00", ar: "البطاقة الثانية: 18 نوفمبر، الساعة 10:00" } }
    answer: [wrongprice]
    also_ok:
      - answer: [bprice]
        feedback:
          en: "Yes, the prices were swapped, so the second card's \"Free\" is wrong too. Fixing either one means fixing both."
          ar: "نعم، السعران تبادلا مكانيهما، لذلك «مجاني» في البطاقة الثانية خطأ أيضًا. إصلاح أحدهما يعني إصلاح الاثنين."
    hints:
      - { en: "Check each fact against the session data, not against how tidy the card looks.", ar: "قارن كل معلومة ببيانات الجلسة، لا بمدى ترتيب البطاقة." }
    correct:
      en: "The prices were swapped when the layout was rebuilt. Sketch is free; Service is EGP 120."
      ar: "تبادل السعران مكانيهما عند إعادة بناء التخطيط. «ارسم» مجانية؛ و«صمّم» بـ120 جنيهًا."
    explain:
      en: "Both cards look perfectly grouped, which is exactly why the error is easy to miss. Good grouping makes a wrong fact more convincing, so check content against the source whenever the layout changes."
      ar: "البطاقتان تبدوان مجمّعتين بإتقان، ولهذا بالضبط يسهل تفويت الخطأ. التجميع الجيد يجعل المعلومة الخاطئة أكثر إقناعًا، لذلك قارن المحتوى بالمصدر كلما تغيّر التخطيط."

  - id: S08
    type: sort
    part: independent
    rules: [R14, R19]
    scenario:
      en: "Ahmed's order arrives in two shipments. On his phone, the order page stacks everything in one column."
      ar: "يصل طلب أحمد في شحنتين. على هاتفه، تُرتّب صفحة الطلب كل شيء في عمود واحد."
    prompt:
      en: "Which shipment does each item belong to?"
      ar: "إلى أي شحنة ينتمي كل عنصر؟"
    items:
      - { id: S1a, text: "@S1a" }
      - { id: S1e, text: "@S1e" }
      - { id: S1c, text: "@S1c" }
      - { id: S1d, text: "@S1d" }
      - { id: S1b, text: "@S1b" }
      - { id: S1f, text: "@S1f" }
    buckets:
      - { id: one, label: { en: "Shipment 1", ar: "الشحنة 1" } }
      - { id: two, label: { en: "Shipment 2", ar: "الشحنة 2" } }
    answer:
      one: [S1a, S1b, S1c]
      two: [S1d, S1e, S1f]
    misconceptions:
      - id: MC-P10-021
        when: { item: S1e, bucket: one }
        feedback:
          en: "The office chair arrives Thursday with shipment 2. If it's grouped with Monday's delivery, Ahmed will wait for it on the wrong day."
          ar: "كرسي المكتب يصل يوم الخميس مع الشحنة 2. إذا جُمّع مع شحنة الاثنين، سينتظره أحمد في اليوم الخطأ."
    correct:
      en: "Each shipment has its date, its item and its tracking link."
      ar: "لكل شحنة تاريخها وعنصرها ورابط تتبّعها."
    explain:
      en: "Same pattern as the sessions: a heading (the shipment and date), its content, and its own action. Stack each shipment as one block on a phone."
      ar: "النمط نفسه في الجلسات: عنوان (الشحنة والتاريخ)، ومحتواها، وإجراؤها الخاص. رتّب كل شحنة ككتلة واحدة على الهاتف."

  - id: S09
    type: choose
    part: independent
    confidence: true
    rules: [R14, R10]
    prompt:
      en: "Each stacked session has its own border. Do you still need space between the cards?"
      ar: "لكل جلسة مرتّبة عموديًا إطارها الخاص. هل ما زلت تحتاج إلى مسافة بين البطاقتين؟"
    options:
      - { id: no, text: { en: "No, the borders already separate them", ar: "لا، الحدود تفصل بينهما أصلًا" } }
      - { id: yes, text: { en: "Yes, some space between them still helps", ar: "نعم، بعض المسافة بينهما ما زالت تساعد" } }
      - { id: desktop, text: { en: "Only on desktop", ar: "على الحاسوب فقط" } }
    answer: [yes]
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: merge, text: { en: "Touching borders start to look like one box", ar: "الحدود المتلاصقة تبدأ في الظهور كإطار واحد" } }
        - { id: rule, text: { en: "Cards must always have 16px between them", ar: "يجب أن يكون بين البطاقات 16 بكسل دائمًا" } }
      answer: [merge]
      misconceptions:
        - id: MC-P10-031
          when: [rule]
          feedback:
            en: "There's no fixed number. What matters is that the space between cards is clearly bigger than the space inside them."
            ar: "لا يوجد رقم ثابت. المهم أن تكون المسافة بين البطاقات أكبر بوضوح من المسافة داخلها."
    misconceptions:
      - id: MC-P10-029
        when: [no, desktop]
        feedback:
          en: "When two bordered cards touch, their edges merge into what looks like one box with a line through it. Space between them keeps them separate."
          ar: "عندما تتلاصق بطاقتان لهما حدود، تندمج حوافّهما فتبدوان كإطار واحد يقطعه خط. المسافة بينهما تبقيهما منفصلتين."
    correct:
      en: "Containers and spacing work together."
      ar: "الحاويات والمسافات تعمل معًا."
    explain:
      en: "A border marks a group's edge; the space around it makes that edge easy to see. Without space, two neighboring containers blur into one."
      ar: "الإطار يحدّد حافة المجموعة؛ والمسافة حوله تجعل هذه الحافة سهلة الرؤية. بدون مسافة، تتداخل حاويتان متجاورتان كأنهما واحدة."

  - id: S10
    type: card
    part: recap
    icons: [layers, group, space]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- Stack whole groups; never alternate their lines.\n- On a phone, turn a table into labelled cards.\n- Keep space between containers, even when they have borders.\n\nNext lesson: the skill check."
      ar: "- رتّب المجموعات كاملة، ولا تبادل بين أسطرها أبدًا.\n- على الهاتف، حوّل الجدول إلى Cards لكل منها اسم.\n- أبقِ مسافة بين الـ Containers، حتى لو كانت لها حدود.\n\nالدرس التالي: اختبار المهارة."
