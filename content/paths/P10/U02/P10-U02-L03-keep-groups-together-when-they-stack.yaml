    reason:
      prompt: { en: "What tells him?", ar: "ما الذي يخبره؟" }
      options:
        - { id: cut, text: { en: "A plan column cut off at the screen edge", ar: "عمود باقة مقطوع عند حافة الشاشة" } }
        - { id: pinned, text: { en: "The pinned feature names", ar: "أسماء الميزات المثبّتة" } }
        - { id: dots, text: { en: "The dots under the table", ar: "النقاط تحت الجدول" } }
      answer: [cut]
      misconceptions:
        - id: MC-P10-039
          when: [pinned, dots]
          feedback:
            en: "Both tables pin the feature names, and A has the dots. What B adds is a half-visible column: content that continues past the edge."
            ar: "الجدولان يثبّتان أسماء الميزات، وA فيه النقاط. ما يضيفه B هو عمود ظاهر نصفه: محتوى يستمر بعد الحافة."
    misconceptions:
      - id: MC-P10-039
        when: [a]
        feedback:
          en: "A ends neatly at the screen edge, so it looks complete. The small dots are the only hint, and NN/g found dots easy to miss."
          ar: "A ينتهي بدقة عند حافة الشاشة، فيبدو مكتملًا. والنقاط الصغيرة هي التلميح الوحيد، ووجدت NN/g أن النقاط سهلة التجاهل."
    correct:
      en: "A cut-off column says \"swipe for more\"."
      ar: "العمود المقطوع يقول «اسحب لترى المزيد»."
    explain:
      en: "This is the illusion of completeness again, sideways. NN/g says scrolling tables are acceptable on phones only with a clear cue, and a cut-off column or arrows work best. Choose the column width so the next plan is visibly cut."
      ar: "هذا وهم الاكتمال مرة أخرى، لكن أفقيًا. تقول NN/g إن الجداول المتحرّكة أفقيًا مقبولة على الهاتف فقط مع إشارة واضحة، وأفضلها العمود المقطوع أو الأسهم. اختر عرض الأعمدة بحيث تظهر الباقة التالية مقطوعة بوضوح."

