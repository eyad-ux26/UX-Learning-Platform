id: P10-U02-L03
mode: lesson
minutes: 8
title:
  en: "Keep groups together when they stack"
  ar: "أبقِ المجموعات متماسكة عند ترتيبها عموديًا"
sources:
  - title: { en: "Proximity Principle in Visual Design (NN/g)", ar: "مبدأ التقارب في التصميم البصري (NN/g)" }
    url: "https://www.nngroup.com/articles/gestalt-proximity/"
  - title: { en: "Mobile Tables: Comparisons and Other Data Tables (NN/g)", ar: "الجداول على الهاتف: جداول المقارنة وغيرها (NN/g)" }
    url: "https://www.nngroup.com/articles/mobile-tables/"
  - title: { en: "Comparison Tables for Products, Services, and Features (NN/g)", ar: "جداول مقارنة المنتجات والخدمات والميزات (NN/g)" }
    url: "https://www.nngroup.com/articles/comparison-tables/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "صعوبات مستخدمي الـ Screen reader على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
review_labels:
  MC-P10-028: { en: "Stack whole groups, never alternate their lines", ar: "رتّب المجموعات كاملة، ولا تبادل بين أسطرها" }
  MC-P10-030: { en: "Cards or a table depends on how people read it", ar: "البطاقات أو الجدول حسب طريقة القراءة" }
  MC-P10-032: { en: "Build each group as one block so it stacks whole", ar: "ابنِ كل مجموعة ككتلة واحدة حتى تُرتَّب كاملة" }
  MC-P10-038: { en: "Stacking can split things people compare", ar: "الترتيب العمودي قد يفصل ما يقارنه الناس" }
  MC-P10-039: { en: "Show that a table continues past the edge", ar: "أظهِر أن الجدول يستمر بعد الحافة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "From wide to narrow", ar: "من العريض إلى الضيّق" }
    body:
      en: "On a laptop, the two sessions sit side by side as cards. On Sara's phone there's only room for one column, so something has to stack.\n\nHow it stacks decides whether the groups survive."
      ar: "على الـ Laptop، تظهر الجلستان جنبًا إلى جنب كبطاقتين. أما على هاتف سارة فلا يتّسع إلا عمود واحد، لذلك يجب ترتيب شيء ما فوق شيء.\n\nطريقة هذا الترتيب تحدّد إن كانت المجموعات ستبقى متماسكة."
    mock:
      blocks:
        - kind: row
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: small, text: "@W2b", gap: xs }
                - { kind: meta, text: "@W2c", gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: small, text: "@W2f", gap: xs }
                - { kind: meta, text: "@W2g", gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }

  - id: S02
    type: tune
    part: try
    rules: [R12]
    value:
      en: "How a layout is built decides how it stacks: build each session as one block on the laptop, and it stays whole on the phone for free."
      ar: "طريقة بناء التخطيط تحدّد طريقة ترتيبه عموديًا: ابنِ كل جلسة ككتلة واحدة على الـ Laptop، فتبقى كاملة على الهاتف تلقائيًا."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "in the sequence dictated by the code" }
    mock:
      caption: { en: "Now: laptop", ar: "الآن: الـ Laptop" }
      blocks:
        - kind: row
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: small, text: "@W2b", gap: xs }
                - { kind: meta, text: "@W2c", gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: small, text: "@W2f", gap: xs }
                - { kind: meta, text: "@W2g", gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }

      frame: wide
    prompt:
      en: "The page must work on the laptop and on Sara's phone. How should you build the two sessions so they stack correctly on the phone?"
      ar: "يجب أن تعمل الصفحة على الـ Laptop وعلى هاتف سارة. كيف تبني الجلستين حتى تُرتَّبا عموديًا بشكل صحيح على الهاتف؟"
    options:
      - id: rows
        text: { en: "In rows: both titles, then both dates, then both prices, then both buttons", ar: "في صفوف: العنوانان، ثم الموعدان، ثم السعران، ثم الزرّان" }
        mock:
          width: 300
          caption: { en: "After: phone, 360 px", ar: "بعد التغيير: هاتف، 360 بكسل" }
          blocks: [{ kind: heading, text: "@W2a" }, { kind: heading, text: "@W2e", gap: xs }, { kind: small, text: "@W2b", gap: s }, { kind: small, text: "@W2f", gap: xs }, { kind: meta, text: "@W2c", gap: s }, { kind: meta, text: "@W2g", gap: xs }, { kind: button, emphasis: low, text: "@W2d", gap: s }, { kind: button, emphasis: low, text: "@W2h", gap: xs }]
      - id: cards
        text: { en: "As two blocks, each holding its own title, date, price and button", ar: "ككتلتين، كل واحدة فيها عنوانها وموعدها وسعرها وزرّها" }
        mock:
          width: 300
          caption: { en: "After: phone, 360 px", ar: "بعد التغيير: هاتف، 360 بكسل" }
          blocks: [{ kind: group, blocks: [{ kind: heading, text: "@W2a" }, { kind: small, text: "@W2b", gap: xs }, { kind: meta, text: "@W2c", gap: xs }, { kind: button, emphasis: low, text: "@W2d", gap: s }] }, { kind: group, gap: m, blocks: [{ kind: heading, text: "@W2e" }, { kind: small, text: "@W2f", gap: xs }, { kind: meta, text: "@W2g", gap: xs }, { kind: button, emphasis: low, text: "@W2h", gap: s }] }]
      - id: auto
        text: { en: "Either way; the phone rearranges it", ar: "بأي طريقة؛ الهاتف يعيد ترتيبها" }
        mock:
          width: 300
          caption: { en: "After: phone, 360 px", ar: "بعد التغيير: هاتف، 360 بكسل" }
          blocks: [{ kind: heading, text: "@W2a" }, { kind: heading, text: "@W2e", gap: xs }, { kind: small, text: "@W2b", gap: s }, { kind: small, text: "@W2f", gap: xs }, { kind: meta, text: "@W2c", gap: s }, { kind: meta, text: "@W2g", gap: xs }, { kind: button, emphasis: low, text: "@W2d", gap: s }, { kind: button, emphasis: low, text: "@W2h", gap: xs }]
    answer: [cards]
    misconceptions:
      - id: MC-P10-032
        when: [rows, auto]
        feedback:
          en: "A narrow screen stacks things in the order they were built. Rows stack into title, title, date, date, price, price: Sara has to match them up herself."
          ar: "الشاشة الضيّقة ترتّب العناصر بالترتيب الذي بُنيت به. والصفوف تتحوّل إلى: عنوان، عنوان، موعد، موعد، سعر، سعر، وعلى سارة أن تطابقها بنفسها."
    correct:
      en: "One block per session."
      ar: "كتلة واحدة لكل جلسة."
    explain:
      en: "Side by side, both builds look the same. On a phone, only the block-per-session build keeps each fact with its session."
      ar: "جنبًا إلى جنب، يبدو البناءان متشابهين. لكن على الهاتف، البناء بكتلة لكل جلسة هو وحده الذي يبقي كل معلومة مع جلستها."

  - id: S03
    type: card
    part: concept
    icons: [layers, ear, width, list]
    title: { en: "Plan what ends up next to what", ar: "خطّط لما سيصبح بجانب ماذا" }
    body:
      en: "When a layout gets narrower, columns stack. Plan what ends up next to what.\n\n- **Build each group as one block:** session A complete, then session B. Row-built layouts stack into title, title, date, date.\n- **Code order is reading order:** screen readers read in the order of the code, not what the screen shows.\n- **Watch what stacking splits:** NN/g found links that sat side by side on desktop ended up far apart on phones, and people never found the second one.\n- **Tables:** comparison tables are for weighing a few options feature by feature. A phone shows about 2 columns, so pin the feature names and show that the table continues."
      ar: "حين يضيق التخطيط، تُرتَّب الأعمدة فوق بعضها. خطّط لما سيصبح بجانب ماذا.\n\n- **ابنِ كل مجموعة ككتلة واحدة:** الجلسة A كاملة، ثم الجلسة B. والتخطيط المبني على صفوف يتحوّل إلى: عنوان، عنوان، موعد، موعد.\n- **ترتيب الكود هو ترتيب القراءة:** الـ Screen reader يقرأ بترتيب الكود، لا بما تعرضه الشاشة.\n- **انتبه لما يفصله الترتيب العمودي:** وجدت NN/g روابط كانت متجاورة على الـ Laptop أصبحت متباعدة على الهاتف، فلم يجد الناس الرابط الثاني.\n- **الجداول:** جداول المقارنة لموازنة خيارات قليلة ميزة بميزة. والهاتف يعرض نحو عمودين فقط، فثبّت أسماء الميزات وأظهِر أن الجدول يستمر."

  - id: S04
    type: order
    part: guided
    confidence: true
    onscreen: true
    rules: [R06, R15]
    value:
      en: "Practise rebuilding a row-built page into whole groups, on a new case, by moving the real blocks on the phone."
      ar: "تدريب على إعادة بناء صفحة مبنية على صفوف إلى مجموعات كاملة، في حالة جديدة، بتحريك العناصر الحقيقية على الهاتف."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "Proximity is one of the most important grouping principles" }
    caption: { en: "Ahmed's phone, 360 px", ar: "هاتف أحمد، 360 بكسل" }
    mock: { frame: wide, caption: { en: "Laptop: each shipment is a column", ar: "الـ Laptop: كل شحنة في عمود" }, blocks: [{ kind: row, blocks: [{ kind: group, blocks: [{ kind: heading, text: "@S1a" }, { kind: meta, text: "@S1b", gap: xs }, { kind: link, text: "@S1c", gap: s }] }, { kind: group, blocks: [{ kind: heading, text: "@S1d" }, { kind: meta, text: "@S1e", gap: xs }, { kind: link, text: "@S1f", gap: s }] }] }] }
    prompt:
      en: "Ahmed's order arrives in two shipments. On the laptop, each shipment is a column. The page was built in rows, so on his phone it shows both dates, then both items, then both tracking links. Drag the blocks so each shipment stays whole, as on the laptop."
      ar: "يصل طلب أحمد في شحنتين. على الـ Laptop كل شحنة في عمود. لكن الصفحة بُنيت في صفوف، فتعرض على هاتفه الموعدين، ثم المنتجين، ثم رابطي التتبّع. اسحب العناصر حتى تبقى كل شحنة كاملة، كما على الـ Laptop."
    items:
      - { id: S1a, text: "@S1a", kind: heading }
      - { id: S1d, text: "@S1d", kind: heading }
      - { id: S1b, text: "@S1b" }
      - { id: S1e, text: "@S1e" }
      - { id: S1c, text: "@S1c", kind: link }
      - { id: S1f, text: "@S1f", kind: link }
    answer: [S1a, S1b, S1c, S1d, S1e, S1f]
    also_ok:
      - answer: [S1d, S1e, S1f, S1a, S1b, S1c]
        feedback:
          en: "That works too: shipment 2 first. Either can lead, as long as each stays whole."
          ar: "هذا صحيح أيضًا: الشحنة 2 أولًا. يمكن لأي شحنة أن تتصدّر، ما دامت كل واحدة كاملة."
    misconceptions:
      - id: MC-P10-028
        when: { before: [S1d, S1c] }
        feedback:
          en: "Shipment 2 starts before shipment 1 is finished, so its lines are mixed in. Keep each date, item and tracking link together."
          ar: "تبدأ الشحنة 2 قبل أن تكتمل الشحنة 1، فتختلط أسطرهما. أبقِ كل موعد ومنتج ورابط تتبّع معًا."
    hints:
      - { en: "Finish one shipment completely before starting the next.", ar: "أكمل شحنة واحدة بالكامل قبل أن تبدأ التالية." }
    correct:
      en: "One complete shipment, then the other."
      ar: "شحنة كاملة، ثم الأخرى."
    explain:
      en: "If the office chair sat under Monday's date, Ahmed would wait for it on the wrong day. Whole groups keep every fact with its owner."
      ar: "لو جاء كرسي المكتب تحت موعد الاثنين، لانتظره أحمد في اليوم الخطأ. المجموعات الكاملة تبقي كل معلومة مع صاحبها."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g: comparison tables are for weighing options feature by feature. Sara looks up one session and books it, so the table becomes labelled blocks; a sideways-scrolling table would hide the second session."
      ar: "NN/g: جداول المقارنة لموازنة الخيارات ميزة بميزة. وسارة تبحث عن جلسة واحدة وتحجزها، فيتحوّل الجدول إلى كتل بتسميات؛ والجدول المتحرّك أفقيًا سيخفي الجلسة الثانية."
    ref: { url: "https://www.nngroup.com/articles/comparison-tables/", quote: "compensatory decision making is best served by comparison tables" }
    mock:
      frame: wide
      caption: { en: "Laptop, 1280 px", ar: "Laptop، 1280 بكسل" }
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: heading, text: "@W2a" }
            - { kind: heading, text: "@W2e" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Date", ar: "الموعد" } }
            - { kind: meta, text: "@W2b" }
            - { kind: meta, text: "@W2f" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Price", ar: "السعر" } }
            - { kind: meta, text: "@W2c" }
            - { kind: meta, text: "@W2g" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: "" }
            - { kind: button, emphasis: low, text: "@W2d" }
            - { kind: button, emphasis: low, text: "@W2h" }
    prompt:
      en: "On the laptop, the two sessions are a comparison table. Sara reads one session at a time and books one. Try each option: which works best on her phone?"
      ar: "على الـ Laptop، الجلستان في جدول مقارنة. سارة تقرأ جلسة واحدة في كل مرة وتحجز واحدة. جرّب كل خيار: أيّها الأفضل على هاتفها؟"
    start: scroll
    options:
      - id: scroll
        text: { en: "Keep the table; it scrolls sideways", ar: "أبقِ الجدول؛ ويتحرّك أفقيًا" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px · swipe the table", ar: "هاتف، 320 بكسل · اسحب الجدول" }
          blocks:
            - kind: group
              scroll: true
              colw: 130
              blocks:
                - kind: row
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: heading, text: "@W2a" }
                    - { kind: heading, text: "@W2e" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Date", ar: "الموعد" } }
                    - { kind: meta, text: "@W2b" }
                    - { kind: meta, text: "@W2f" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Price", ar: "السعر" } }
                    - { kind: meta, text: "@W2c" }
                    - { kind: meta, text: "@W2g" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: button, text: "@W2d", emphasis: low }
                    - { kind: button, text: "@W2h", emphasis: low }
      - id: cards
        text: { en: "Stack each session as its own block, with each value labelled", ar: "رتّب كل جلسة ككتلة مستقلة، مع تسمية كل قيمة" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: meta, text: { en: "Date: 17 November, 18:00", ar: "الموعد: 17 نوفمبر، الساعة 18:00" }, gap: xs }
                - { kind: meta, text: { en: "Price: Free", ar: "السعر: مجاني" }, gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              gap: m
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: meta, text: { en: "Date: 18 November, 10:00", ar: "الموعد: 18 نوفمبر، الساعة 10:00" }, gap: xs }
                - { kind: meta, text: { en: "Price: EGP 120", ar: "السعر: 120 جنيهًا" }, gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }
      - id: shrink
        text: { en: "Shrink the table until it fits", ar: "صغّر الجدول حتى يتّسع" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
          blocks:
            - kind: row
              blocks:
                - { kind: small, text: "", px: 8 }
                - { kind: heading, text: "@W2a", px: 8 }
                - { kind: heading, text: "@W2e", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Date", ar: "الموعد" }, px: 8 }
                - { kind: meta, text: "@W2b", px: 8 }
                - { kind: meta, text: "@W2f", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Price", ar: "السعر" }, px: 8 }
                - { kind: meta, text: "@W2c", px: 8 }
                - { kind: meta, text: "@W2g", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: "", px: 8 }
                - { kind: button, text: "@W2d", emphasis: low, px: 8 }
                - { kind: button, text: "@W2h", emphasis: low, px: 8 }
    answer: [cards]
    misconceptions:
      - id: MC-P10-030
        when: [scroll]
        feedback:
          en: "Swipe the table: the second session is hidden until you scroll, and Sara reads one session at a time anyway. Scrolling tables pay off when people compare many items feature by feature, not here."
          ar: "اسحب الجدول: الجلسة الثانية مخفية حتى تمرّر، وسارة تقرأ جلسة واحدة في كل مرة أصلًا. الجدول المتحرّك أفقيًا مفيد حين يقارن الناس عناصر كثيرة ميزة بميزة، لا هنا."
      - id: MC-P10-060
        when: [shrink]
        feedback:
          en: "Everything fits, at 8px. Nobody can read that on a phone."
          ar: "كل شيء يتّسع، لكن بحجم 8 بكسل. لا أحد يستطيع قراءة ذلك على هاتف."
    correct: { en: "Labelled blocks: each session reads top to bottom.", ar: "كتل بتسميات: كل جلسة تُقرأ من الأعلى إلى الأسفل." }
    explain:
      en: "NN/g reserves comparison tables for decisions where people weigh several features across a few options. Sara isn't weighing; she picks one session. Stack each session as a block and bring the row headers along as labels (\"Price: EGP 120\"). The next question shows the opposite case."
      ar: "تخصّص NN/g جداول المقارنة للقرارات التي يوازن فيها الناس عدة ميزات بين خيارات قليلة. وسارة لا توازن؛ هي تختار جلسة واحدة. رتّب كل جلسة ككتلة، وانقل عناوين الصفوف معها كتسميات («السعر: 120 جنيهًا»). والسؤال التالي يعرض الحالة المعاكسة."
  - id: S06
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "NN/g: when people weigh plans feature by feature, keep the comparison table; a phone shows about 2 plans, so pin the feature names and let the table scroll. Separate cards force people to remember every value."
      ar: "NN/g: حين يوازن الناس الباقات ميزة بميزة، أبقِ جدول المقارنة؛ والهاتف يعرض نحو باقتين، فثبّت أسماء الميزات ودع الجدول يتحرّك أفقيًا. أما البطاقات المنفصلة فتجبر الناس على تذكّر كل قيمة."
    ref: { url: "https://www.nngroup.com/articles/comparison-tables/", quote: "show more than 2 items at a time in a comparison table" }
    mock:
      frame: wide
      caption: { en: "Laptop, 1280 px", ar: "Laptop، 1280 بكسل" }
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: heading, text: "Basic" }
            - { kind: heading, text: "Plus" }
            - { kind: heading, text: "Pro" }
            - { kind: heading, text: "Family" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Per month", ar: "شهريًا" } }
            - { kind: meta, text: { en: "EGP 300", ar: "300 جنيه" } }
            - { kind: meta, text: { en: "EGP 450", ar: "450 جنيهًا" } }
            - { kind: meta, text: { en: "EGP 600", ar: "600 جنيه" } }
            - { kind: meta, text: { en: "EGP 900", ar: "900 جنيه" } }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Pool", ar: "حمام السباحة" } }
            - { kind: meta, text: { en: "No", ar: "لا" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
