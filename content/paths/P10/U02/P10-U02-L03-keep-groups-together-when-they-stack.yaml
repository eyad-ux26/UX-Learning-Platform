  - id: S07
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "NN/g on mobile tables: sideways scrolling is acceptable only with a clear cue that more exists. A column cut off at the edge works; small dots are easy to miss. A table that ends cleanly at the edge looks complete."
      ar: "NN/g عن الجداول على الهاتف: التمرير الأفقي مقبول فقط مع إشارة واضحة إلى وجود المزيد. العمود المقطوع عند الحافة يعمل؛ والنقاط الصغيرة سهلة التجاهل. والجدول الذي ينتهي بدقة عند الحافة يبدو مكتملًا."
    ref: { url: "https://www.nngroup.com/articles/mobile-tables/", quote: "Dots are sometimes used, but are typically harder for users to notice" }
    prompt:
      en: "Both tables scroll sideways to show all four plans. In which one can Mazen tell, without touching it, that there are more plans?"
      ar: "الجدولان يتحرّكان أفقيًا لعرض الباقات الأربع. في أيّهما يعرف مازن، دون أن يلمسه، أن هناك باقات أخرى؟"
    a:
      mock:
        width: 260
        caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
        blocks:
          - kind: group
            scroll: true
            sticky: true
            colw: 112
            blocks: &cuetable
              - kind: row
                blocks:
