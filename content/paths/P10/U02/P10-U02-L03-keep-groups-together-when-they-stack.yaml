  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, R10]
    value:
      en: "Containers need spacing too: a border alone doesn't keep two stacked cards apart."
      ar: "الـ Containers تحتاج إلى مسافات أيضًا: الإطار وحده لا يفصل بطاقتين مرتّبتين عموديًا."
    prompt:
      en: "Each stacked session has its own border. Do you still need space between the cards?"
      ar: "لكل جلسة مرتّبة عموديًا إطارها الخاص. هل ما زلت تحتاج إلى مسافة بين البطاقتين؟"
    options:
      - { id: no, text: { en: "No, the borders already separate them", ar: "لا، الحدود تفصل بينهما أصلًا" } }
      - { id: desktop, text: { en: "Only on desktop", ar: "على الـ Laptop فقط" } }
      - { id: yes, text: { en: "Yes, some space between them still helps", ar: "نعم، بعض المسافة بينهما ما زالت تساعد" } }
    answer: [yes]
    misconceptions:
      - id: MC-P10-029
        when: [no, desktop]
        feedback:
          en: "When two bordered cards touch, their edges merge into what looks like one box with a line through it. Space between them keeps them separate."
          ar: "عندما تتلاصق بطاقتان لهما حدود، تندمج حوافّهما فتبدوان كإطار واحد يقطعه خط. المسافة بينهما تبقيهما منفصلتين."
    correct:
      en: "Containers and spacing work together."
      ar: "الحاويات والمسافات تعمل معًا."
    explain:
      en: "A border marks a group's edge; the space around it makes that edge easy to see. Without space, two neighboring containers blur into one."
      ar: "الإطار يحدّد حافة المجموعة؛ والمسافة حوله تجعل هذه الحافة سهلة الرؤية. بدون مسافة، تتداخل حاويتان متجاورتان كأنهما واحدة."

  - id: S09
    type: card
    part: recap
    icons: [layers, width, space]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- Build each group as one block, so it stacks whole.\n- A few items read one at a time: labelled cards. Many items compared feature by feature: a scrolling table with the first column pinned.\n- Keep space between containers, even when they have borders.\n\nNext lesson: the skill check."
      ar: "- ابنِ كل مجموعة ككتلة واحدة، حتى تُرتَّب كاملة.\n- عناصر قليلة تُقرأ واحدًا تلو الآخر: بطاقات بتسميات. وعناصر كثيرة تُقارن ميزة بميزة: جدول يتحرّك أفقيًا مع تثبيت العمود الأول.\n- أبقِ مسافة بين الـ Containers، حتى لو كانت لها حدود.\n\nالدرس التالي: اختبار المهارة."
