id: P10-U02-L03
mode: lesson
minutes: 8
title:
  en: "Keep groups together when they stack"
  ar: "أبقِ المجموعات متماسكة عند ترتيبها عموديًا"
review_labels:
  MC-P10-028: { en: "Stack whole groups, never alternate their lines", ar: "رتّب المجموعات كاملة، ولا تبادل بين أسطرها" }
  MC-P10-029: { en: "Touching borders merge groups", ar: "الحدود المتلاصقة تدمج المجموعات" }
  MC-P10-030: { en: "Cards or a table depends on how people read it", ar: "البطاقات أو الجدول حسب طريقة القراءة" }
  MC-P10-032: { en: "Build each group as one block so it stacks whole", ar: "ابنِ كل مجموعة ككتلة واحدة حتى تُرتَّب كاملة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "From wide to narrow", ar: "من العريض إلى الضيّق" }
    body:
      en: "On a laptop, the two sessions sit side by side as cards. On Sara's phone there's only room for one column, so something has to stack.\n\nHow it stacks decides whether the groups survive."
      ar: "على الـ Laptop، تظهر الجلستان جنبًا إلى جنب كبطاقتين. أما على هاتف سارة فلا يتّسع إلا عمود واحد، لذلك يجب ترتيب شيء ما فوق شيء.\n\nطريقة هذا الترتيب تحدّد إن كانت المجموعات ستبقى متماسكة."
    mock:
      blocks:
        - kind: row
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: small, text: "@W2b", gap: xs }
                - { kind: meta, text: "@W2c", gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: small, text: "@W2f", gap: xs }
                - { kind: meta, text: "@W2g", gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    value:
      en: "How a layout is built decides how it stacks: build each session as one block on the laptop, and it stays whole on the phone for free."
      ar: "طريقة بناء التخطيط تحدّد طريقة ترتيبه عموديًا: ابنِ كل جلسة ككتلة واحدة على الـ Laptop، فتبقى كاملة على الهاتف تلقائيًا."
    prompt:
      en: "The page must work on the laptop and on Sara's phone. How should you build the two sessions so they stack correctly on the phone?"
      ar: "يجب أن تعمل الصفحة على الـ Laptop وعلى هاتف سارة. كيف تبني الجلستين حتى تُرتَّبا عموديًا بشكل صحيح على الهاتف؟"
    options:
      - { id: rows, text: { en: "In rows: both titles, then both dates, then both prices, then both buttons", ar: "في صفوف: العنوانان، ثم الموعدان، ثم السعران، ثم الزرّان" } }
      - { id: cards, text: { en: "As two blocks, each holding its own title, date, price and button", ar: "ككتلتين، كل واحدة فيها عنوانها وموعدها وسعرها وزرّها" } }
      - { id: auto, text: { en: "Either way; the phone rearranges it", ar: "بأي طريقة؛ الهاتف يعيد ترتيبها" } }
    answer: [cards]
    misconceptions:
      - id: MC-P10-032
        when: [rows, auto]
        feedback:
          en: "A narrow screen stacks things in the order they were built. Rows stack into title, title, date, date, price, price: Sara has to match them up herself."
          ar: "الشاشة الضيّقة ترتّب العناصر بالترتيب الذي بُنيت به. والصفوف تتحوّل إلى: عنوان، عنوان، موعد، موعد، سعر، سعر، وعلى سارة أن تطابقها بنفسها."
    correct:
      en: "One block per session."
      ar: "كتلة واحدة لكل جلسة."
    explain:
      en: "Side by side, both builds look the same. On a phone, only the block-per-session build keeps each fact with its session."
      ar: "جنبًا إلى جنب، يبدو البناءان متشابهين. لكن على الهاتف، البناء بكتلة لكل جلسة هو وحده الذي يبقي كل معلومة مع جلستها."

  - id: S03
    type: card
    part: concept
    icons: [layers, warn, ear, width]
    title: { en: "Stack whole groups", ar: "رتّب المجموعات كاملة" }
    body:
      en: "When a layout gets narrower, move whole groups, not their lines.\n\n- **Build each group as one block:** session A complete, then session B complete.\n- **Beware row-built layouts:** all titles in one row and all dates in the next turn into a zigzag on a phone.\n- **Match the code order:** screen readers and keyboards follow the code, not what the screen shows.\n- **Tables: cards or scroll?** A few items read one at a time become labelled cards. Many items compared feature by feature stay a table that scrolls sideways, with the first column pinned."
      ar: "عندما يضيق التخطيط، انقل المجموعات كاملة، لا أسطرها.\n\n- **ابنِ كل مجموعة ككتلة واحدة:** الجلسة A كاملة، ثم الجلسة B كاملة.\n- **احذر التخطيط المبني على صفوف:** كل العناوين في صف وكل التواريخ في الصف التالي تتحوّل إلى تنقّل متعرّج على الهاتف.\n- **طابق ترتيب الكود:** الـ Screen reader ولوحة المفاتيح يتبعان الكود، لا ما تعرضه الشاشة.\n- **الجدول: بطاقات أم تمرير؟** العناصر القليلة التي تُقرأ واحدًا تلو الآخر تصبح بطاقات بتسميات. والعناصر الكثيرة التي تُقارن ميزة بميزة تبقى جدولًا يتحرّك أفقيًا، مع تثبيت العمود الأول."

  - id: S04
    type: order
    part: guided
    confidence: true
    onscreen: true
    rules: [R06, R15]
    value:
      en: "Practise rebuilding a row-built page into whole groups, on a new case, by moving the real blocks on the phone."
      ar: "تدريب على إعادة بناء صفحة مبنية على صفوف إلى مجموعات كاملة، في حالة جديدة، بتحريك العناصر الحقيقية على الهاتف."
    caption: { en: "Ahmed's phone, 360 px", ar: "هاتف أحمد، 360 بكسل" }
    prompt:
      en: "Ahmed's order arrives in two shipments. The page was built in rows, so on his phone it shows both dates, then both items, then both tracking links. Drag the blocks so each shipment stays whole."
      ar: "يصل طلب أحمد في شحنتين. بُنيت الصفحة في صفوف، فتعرض على هاتفه الموعدين، ثم المنتجين، ثم رابطي التتبّع. اسحب العناصر حتى تبقى كل شحنة كاملة."
    items:
      - { id: S1a, text: "@S1a", kind: heading }
      - { id: S1d, text: "@S1d", kind: heading }
      - { id: S1b, text: "@S1b" }
      - { id: S1e, text: "@S1e" }
      - { id: S1c, text: "@S1c", kind: link }
      - { id: S1f, text: "@S1f", kind: link }
    answer: [S1a, S1b, S1c, S1d, S1e, S1f]
    also_ok:
      - answer: [S1d, S1e, S1f, S1a, S1b, S1c]
        feedback:
          en: "That works too: shipment 2 first. Either can lead, as long as each stays whole."
          ar: "هذا صحيح أيضًا: الشحنة 2 أولًا. يمكن لأي شحنة أن تتصدّر، ما دامت كل واحدة كاملة."
    misconceptions:
      - id: MC-P10-028
        when: { before: [S1d, S1c] }
        feedback:
          en: "Shipment 2 starts before shipment 1 is finished, so its lines are mixed in. Keep each date, item and tracking link together."
          ar: "تبدأ الشحنة 2 قبل أن تكتمل الشحنة 1، فتختلط أسطرهما. أبقِ كل موعد ومنتج ورابط تتبّع معًا."
    hints:
      - { en: "Finish one shipment completely before starting the next.", ar: "أكمل شحنة واحدة بالكامل قبل أن تبدأ التالية." }
    correct:
      en: "One complete shipment, then the other."
      ar: "شحنة كاملة، ثم الأخرى."
    explain:
      en: "If the office chair sat under Monday's date, Ahmed would wait for it on the wrong day. Whole groups keep every fact with its owner."
      ar: "لو جاء كرسي المكتب تحت موعد الاثنين، لانتظره أحمد في اليوم الخطأ. المجموعات الكاملة تبقي كل معلومة مع صاحبها."

  - id: S05
    type: compare
    part: contrast
    rules: [R11, R15]
    value:
      en: "Shows the result of row-built versus card-built layouts side by side, so the difference is visible, not just described."
      ar: "يعرض نتيجة التخطيط المبني على صفوف مقابل المبني على بطاقات جنبًا إلى جنب، فيصبح الفرق مرئيًا لا موصوفًا فقط."
    prompt:
      en: "Two phone versions of the same page. Which one keeps the bookings intact?"
      ar: "نسختان للهاتف من الصفحة نفسها. أيّهما تحافظ على الحجزين سليمين؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: heading, text: "@W2e", gap: xs }
          - { kind: small, text: "@W2b", gap: m }
          - { kind: small, text: "@W2f", gap: xs }
          - { kind: meta, text: "@W2c", gap: m }
          - { kind: meta, text: "@W2g", gap: xs }
          - { kind: button, emphasis: low, text: "@W2d", gap: m }
          - { kind: button, emphasis: low, text: "@W2h", gap: s }
    b:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: heading, text: "@W2a" }
              - { kind: small, text: "@W2b", gap: xs }
              - { kind: meta, text: "@W2c", gap: xs }
              - { kind: button, emphasis: low, text: "@W2d", gap: s }
          - kind: group
            gap: m
            blocks:
              - { kind: heading, text: "@W2e" }
              - { kind: small, text: "@W2f", gap: xs }
              - { kind: meta, text: "@W2g", gap: xs }
              - { kind: button, emphasis: low, text: "@W2h", gap: s }
    answer: b
    misconceptions:
      - id: MC-P10-028
        when: [a]
        feedback:
          en: "A stacked the rows, not the cards: two titles, then two dates, then two prices. Sara has to match them up herself."
          ar: "A رتّبت الصفوف لا البطاقات: عنوانان، ثم تاريخان، ثم سعران. على سارة أن تطابقها بنفسها."
    correct:
      en: "Whole cards stacked, so every fact stays with its session."
      ar: "رُتّبت البطاقات كاملة، فبقيت كل معلومة مع جلستها."
    explain:
      en: "Same content, same space. A keeps the desktop rows and alternates between sessions; B moves each complete card. That's the difference between reflowing groups and reflowing lines."
      ar: "المحتوى نفسه والمساحة نفسها. A تحتفظ بصفوف الـ Laptop وتتنقّل بين الجلستين؛ وB تنقل كل بطاقة كاملة. هذا هو الفرق بين إعادة ترتيب المجموعات وإعادة ترتيب الأسطر."

  - id: S06
    type: tune
    part: guided
    rules: [R06, R14]
    value:
      en: "A table can become cards or stay a scrolling table. This case shows when cards win: few items, read one at a time."
      ar: "يمكن أن يتحوّل الجدول إلى بطاقات أو يبقى جدولًا يتحرّك أفقيًا. هذه الحالة توضّح متى تفوز البطاقات: عناصر قليلة تُقرأ واحدًا تلو الآخر."
    mock:
      frame: wide
      caption: { en: "Laptop, 1280 px", ar: "Laptop، 1280 بكسل" }
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: heading, text: "@W2a" }
            - { kind: heading, text: "@W2e" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Date", ar: "الموعد" } }
            - { kind: meta, text: "@W2b" }
            - { kind: meta, text: "@W2f" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Price", ar: "السعر" } }
            - { kind: meta, text: "@W2c" }
            - { kind: meta, text: "@W2g" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: "" }
            - { kind: button, emphasis: low, text: "@W2d" }
            - { kind: button, emphasis: low, text: "@W2h" }
    prompt:
      en: "On the laptop, the two sessions are a comparison table. Sara reads one session at a time and books one. Try each option: which works best on her phone?"
      ar: "على الـ Laptop، الجلستان في جدول مقارنة. سارة تقرأ جلسة واحدة في كل مرة وتحجز واحدة. جرّب كل خيار: أيّها الأفضل على هاتفها؟"
    start: scroll
    options:
      - id: scroll
        text: { en: "Keep the table; it scrolls sideways", ar: "أبقِ الجدول؛ ويتحرّك أفقيًا" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px · swipe the table", ar: "هاتف، 320 بكسل · اسحب الجدول" }
          blocks:
            - kind: group
              scroll: true
              colw: 130
              blocks:
                - kind: row
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: heading, text: "@W2a" }
                    - { kind: heading, text: "@W2e" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Date", ar: "الموعد" } }
                    - { kind: meta, text: "@W2b" }
                    - { kind: meta, text: "@W2f" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: { en: "Price", ar: "السعر" } }
                    - { kind: meta, text: "@W2c" }
                    - { kind: meta, text: "@W2g" }
                - kind: row
                  gap: s
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: button, text: "@W2d", emphasis: low }
                    - { kind: button, text: "@W2h", emphasis: low }
      - id: cards
        text: { en: "Turn each session into a card, with each value labelled", ar: "حوّل كل جلسة إلى بطاقة، مع تسمية كل قيمة" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: meta, text: { en: "Date: 17 November, 18:00", ar: "الموعد: 17 نوفمبر، الساعة 18:00" }, gap: xs }
                - { kind: meta, text: { en: "Price: Free", ar: "السعر: مجاني" }, gap: xs }
                - { kind: button, emphasis: low, text: "@W2d", gap: s }
            - kind: group
              gap: m
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: meta, text: { en: "Date: 18 November, 10:00", ar: "الموعد: 18 نوفمبر، الساعة 10:00" }, gap: xs }
                - { kind: meta, text: { en: "Price: EGP 120", ar: "السعر: 120 جنيهًا" }, gap: xs }
                - { kind: button, emphasis: low, text: "@W2h", gap: s }
      - id: shrink
        text: { en: "Shrink the table until it fits", ar: "صغّر الجدول حتى يتّسع" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
          blocks:
            - kind: row
              blocks:
                - { kind: small, text: "", px: 8 }
                - { kind: heading, text: "@W2a", px: 8 }
                - { kind: heading, text: "@W2e", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Date", ar: "الموعد" }, px: 8 }
                - { kind: meta, text: "@W2b", px: 8 }
                - { kind: meta, text: "@W2f", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Price", ar: "السعر" }, px: 8 }
                - { kind: meta, text: "@W2c", px: 8 }
                - { kind: meta, text: "@W2g", px: 8 }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: "", px: 8 }
                - { kind: button, text: "@W2d", emphasis: low, px: 8 }
                - { kind: button, text: "@W2h", emphasis: low, px: 8 }
    answer: [cards]
    misconceptions:
      - id: MC-P10-030
        when: [scroll]
        feedback:
          en: "Swipe the table: the second session is hidden until you scroll, and Sara reads one session at a time anyway. Scrolling tables pay off when people compare many items feature by feature, not here."
          ar: "اسحب الجدول: الجلسة الثانية مخفية حتى تمرّر، وسارة تقرأ جلسة واحدة في كل مرة أصلًا. الجدول المتحرّك أفقيًا مفيد حين يقارن الناس عناصر كثيرة ميزة بميزة، لا هنا."
      - id: MC-P10-060
        when: [shrink]
        feedback:
          en: "Everything fits, at 8px. Nobody can read that on a phone."
          ar: "كل شيء يتّسع، لكن بحجم 8 بكسل. لا أحد يستطيع قراءة ذلك على هاتف."
    correct:
      en: "Labelled cards: each session reads top to bottom."
      ar: "بطاقات بتسميات: كل جلسة تُقرأ من الأعلى إلى الأسفل."
    explain:
      en: "A table's meaning comes from its row headers. When columns become cards, bring the headers along as labels (\"Price: EGP 120\"). Cards suit a few items read one at a time; the next question shows when a table is better."
      ar: "معنى الجدول يأتي من عناوين صفوفه. وحين تتحوّل الأعمدة إلى بطاقات، انقل العناوين معها كتسميات («السعر: 120 جنيهًا»). البطاقات تناسب عناصر قليلة تُقرأ واحدًا تلو الآخر؛ والسؤال التالي يوضّح متى يكون الجدول أفضل."

  - id: S07
    type: tune
    part: independent
    rules: [R14, R19]
    value:
      en: "The other side of the rule: when people compare many items feature by feature, keep the table and let it scroll, with the feature names pinned."
      ar: "الوجه الآخر للقاعدة: حين يقارن الناس عناصر كثيرة ميزة بميزة، أبقِ الجدول ودعه يتحرّك أفقيًا، مع تثبيت أسماء الميزات."
    mock:
      frame: wide
      caption: { en: "Laptop, 1280 px", ar: "Laptop، 1280 بكسل" }
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: heading, text: "Basic" }
            - { kind: heading, text: "Plus" }
            - { kind: heading, text: "Pro" }
            - { kind: heading, text: "Family" }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Per month", ar: "شهريًا" } }
            - { kind: meta, text: { en: "EGP 300", ar: "300 جنيه" } }
            - { kind: meta, text: { en: "EGP 450", ar: "450 جنيهًا" } }
            - { kind: meta, text: { en: "EGP 600", ar: "600 جنيه" } }
            - { kind: meta, text: { en: "EGP 900", ar: "900 جنيه" } }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Pool", ar: "حمام السباحة" } }
            - { kind: meta, text: { en: "No", ar: "لا" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
            - { kind: meta, text: { en: "Yes", ar: "نعم" } }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Classes", ar: "الحصص" } }
            - { kind: meta, text: { en: "2 a week", ar: "2 أسبوعيًا" } }
            - { kind: meta, text: { en: "4 a week", ar: "4 أسبوعيًا" } }
            - { kind: meta, text: { en: "Unlimited", ar: "بلا حدود" } }
            - { kind: meta, text: { en: "Unlimited", ar: "بلا حدود" } }
        - kind: row
          gap: s
          blocks:
            - { kind: small, text: { en: "Guests", ar: "الضيوف" } }
            - { kind: meta, text: "0" }
            - { kind: meta, text: "1" }
            - { kind: meta, text: "2" }
            - { kind: meta, text: "4" }
    prompt:
      en: "Mazen compares four gym plans feature by feature: he checks which have a pool, then compares the prices of those. Try each option: which works best on his phone?"
      ar: "يقارن مازن أربع باقات في النادي ميزة بميزة: يبحث عن الباقات التي فيها حمام سباحة، ثم يقارن أسعارها. جرّب كل خيار: أيّها الأفضل على هاتفه؟"
    start: cards
    options:
      - id: cards
        text: { en: "A card for each plan, stacked", ar: "بطاقة لكل باقة، مرتّبة عموديًا" }
        mock:
          width: 260
          caption: { en: "Phone, 320 px · 2 of 4 cards", ar: "هاتف، 320 بكسل · بطاقتان من 4" }
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "Basic" }
                - { kind: meta, text: { en: "Per month: EGP 300", ar: "شهريًا: 300 جنيه" }, gap: xs }
                - { kind: meta, text: { en: "Pool: No", ar: "حمام السباحة: لا" }, gap: xs }
                - { kind: meta, text: { en: "Classes: 2 a week", ar: "الحصص: 2 أسبوعيًا" }, gap: xs }
                - { kind: meta, text: { en: "Guests: 0", ar: "الضيوف: 0" }, gap: xs }
            - kind: group
              gap: m
              blocks:
