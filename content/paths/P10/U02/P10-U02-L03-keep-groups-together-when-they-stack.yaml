            - { kind: link, text: { en: "Pay the ULEZ charge", ar: "ادفع رسوم ULEZ" }, gap: s }
            - { kind: link, text: { en: "Set up Auto Pay", ar: "فعّل الدفع التلقائي" }, gap: s }
            - { kind: link, text: { en: "Discounts and exemptions", ar: "الخصومات والإعفاءات" }, gap: s }
            - { kind: link, text: { en: "Penalty charges", ar: "غرامات المخالفات" }, gap: s }
            - { kind: link, text: { en: "Map of the zone", ar: "خريطة المنطقة" }, gap: s }
    answer: [together]
    misconceptions:
      - id: MC-P10-038
        when: [bigger, seealso]
        feedback:
          en: "The LEZ checker would still sit six links down, or further. People who find the ULEZ checker do their task and leave. Keep the two checkers side by side in the order too."
          ar: "ستبقى أداة LEZ بعد ستة روابط أو أكثر. ومن يجد أداة ULEZ ينجز مهمته ويغادر. أبقِ الأداتين متجاورتين في الترتيب أيضًا."
      - id: MC-P10-038
        when: [hide]
        feedback:
          en: "Drivers on phones still need to know if they must pay the LEZ charge. Hiding it turns a hard-to-find link into a missing one."
          ar: "السائقون على الهاتف ما زالوا يحتاجون إلى معرفة إن كان عليهم دفع رسوم LEZ. والإخفاء يحوّل الرابط الصعب الوصول إلى رابط مفقود."
    correct:
      en: "Things people compare stay together when the layout stacks."
      ar: "ما يقارنه الناس يبقى معًا حين يُرتَّب التخطيط عموديًا."
    explain:
      en: "NN/g found this on Transport for London's site: side by side on desktop, the ULEZ and LEZ links were easy to compare; stacked on mobile, they were so far apart that people might never discover the second zone. Stacking whole columns is right only when each column is one group."
      ar: "وجدت NN/g هذا في موقع هيئة النقل في لندن: على الـ Laptop كان رابطا ULEZ وLEZ متجاورين وسهلَي المقارنة؛ وعلى الهاتف تباعدا كثيرًا حتى قد لا يكتشف الناس المنطقة الثانية أبدًا. ترتيب الأعمدة الكاملة صحيح فقط حين يكون كل عمود مجموعة واحدة."
  - id: S09
    type: card
    part: recap
    icons: [layers, width, list, target]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Whole blocks:** each group is built as one block, so it stacks whole.\n- **Stacking splits:** things people compare stay together on the phone.\n- **Look-up, not compare:** one session at a time reads best as labelled blocks.\n- **Compare on a phone:** pinned feature names, and a column cut at the edge to show there's more.\n\nNext: the skill check."
      ar: "- **كتل كاملة:** كل مجموعة تُبنى ككتلة واحدة، فتُرتَّب كاملة.\n- **الترتيب العمودي قد يفصل:** ما يقارنه الناس يبقى معًا على الهاتف.\n- **بحث لا مقارنة:** جلسة واحدة في كل مرة تُقرأ أفضل ككتل بتسميات.\n- **المقارنة على الهاتف:** أسماء الميزات مثبّتة، وعمود مقطوع عند الحافة يُظهر أن هناك المزيد.\n\nالتالي: اختبار المهارة."
