id: P10-U02
free: false
title:
  en: "Group what belongs together"
  ar: "اجمع ما ينتمي معًا"
skill:
  en: "Use spacing, containers and headings so people can tell which facts and actions belong together, on any screen width."
  ar: "استخدم المسافات والحاويات والعناوين حتى يعرف الناس أي المعلومات والإجراءات تنتمي معًا، على أي عرض للشاشة."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U02-01
    title: { en: "Use spacing to show what belongs together", ar: "استخدم المسافات لتُظهر ما ينتمي معًا" }
    can_do: { en: "Set gaps so each label, price or button sits closer to its own item than to any other.", ar: "اضبط المسافات بحيث يكون كل عنوان أو سعر أو زر أقرب إلى عنصره من أي عنصر آخر." }
  - id: SK-P10-U02-02
    title: { en: "Keep actions next to what they act on", ar: "ضع الإجراء بجانب ما يعمل عليه" }
    can_do: { en: "Place optional paths and buttons inside the group they belong to, not far away from it.", ar: "ضع المسارات الاختيارية والأزرار داخل المجموعة التي تنتمي إليها، لا بعيدًا عنها." }
  - id: SK-P10-U02-03
    title: { en: "Chunk into a few meaningful groups", ar: "قسّم المحتوى إلى مجموعات قليلة ذات معنى" }
    can_do: { en: "Split long content into a few titled groups, use space before borders, and check the groups with the squint test.", ar: "قسّم المحتوى الطويل إلى مجموعات قليلة بعناوين، واستخدم المسافات قبل الحدود، وتحقّق من المجموعات باختبار التحديق (Squint test)." }
  - id: SK-P10-U02-04
    title: { en: "Make look-alikes and containers tell the truth", ar: "اجعل التشابه والحاويات يقولان الحقيقة" }
    can_do: { en: "Use containers and matching styles only for things that really belong together.", ar: "استخدم الحاويات والأنماط المتشابهة فقط لما ينتمي معًا فعلًا." }
  - id: SK-P10-U02-05
    title: { en: "Avoid false floors", ar: "تجنّب النهايات الزائفة (False floors)" }
    can_do: { en: "Make sure a page doesn't look finished before it ends, so people scroll to the rest.", ar: "تأكّد أن الصفحة لا تبدو منتهية قبل نهايتها، حتى يمرّر الناس إلى بقيّتها." }
  - id: SK-P10-U02-06
    title: { en: "Code group names as real headings", ar: "اجعل أسماء المجموعات عناوين حقيقية" }
    can_do: { en: "Mark group names as headings in the code, not just big bold text, so screen-reader users can jump to them.", ar: "اجعل أسماء المجموعات عناوين (Headings) في الكود، لا مجرد نص كبير وعريض، حتى يقفز إليها مستخدمو قارئ الشاشة." }
  - id: SK-P10-U02-07
    title: { en: "Build groups that stay whole when they stack", ar: "ابنِ مجموعات تبقى كاملة عند التكدّس" }
    can_do: { en: "Build each group as one block so it stays together when columns stack on a phone.", ar: "ابنِ كل مجموعة ككتلة واحدة حتى تبقى معًا عندما تتكدّس الأعمدة على الهاتف." }
  - id: SK-P10-U02-08
    title: { en: "Pick a table or cards by the task", ar: "اختر الجدول أو البطاقات حسب المهمة" }
    can_do: { en: "Keep a comparison table on phones when people compare options, and use cards when they look at one at a time.", ar: "أبقِ جدول المقارنة على الهاتف عندما يقارن الناس بين الخيارات، واستخدم البطاقات عندما ينظرون إلى خيار واحد في كل مرة." }
