steps:
  # SK-P10-U02-01: use spacing to show what belongs together
  - id: S01
    type: tune
    skill: SK-P10-U02-01
    part: retest
    value:
      en: "Re-test, proximity (NN/g): proximity is one of the most important grouping principles. Each Choose button must sit closer to its own ticket than to the next one; the fix is the gaps."
      ar: "إعادة اختبار، التقارب (NN/g): التقارب من أهم مبادئ التجميع. يجب أن يكون كل زر «اختر» أقرب إلى تذكرته من التذكرة التالية؛ والحل في المسافات."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "Proximity is one of the most important grouping principles" }
    scenario:
      en: "Hany is buying tickets for a comedy night. There are three ticket types, each with a Choose button. In testing, people who wanted Standard tapped the button under it, but that button sits right on top of the VIP ticket, and some thought it was VIP's."
      ar: "يشتري هاني تذاكر لأمسية كوميدية. هناك ثلاثة أنواع من التذاكر، ولكل منها زر «اختر». في الاختبار، ضغط من أراد التذكرة العادية على الزر تحتها، لكن هذا الزر ملاصق لتذكرة VIP، فظنّ بعضهم أنه زر VIP."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &hn_s { en: "Standard · 200 EGP", ar: "عادية · 200 جنيه" } }
        - { kind: button, emphasis: low, text: &hn_c { en: "Choose", ar: "اختر" }, gap: l }
        - { kind: heading, text: &hn_v { en: "VIP · 500 EGP", ar: "VIP · 500 جنيه" }, gap: xs }
        - { kind: button, emphasis: low, text: *hn_c, gap: l }
        - { kind: heading, text: &hn_f { en: "Front row · 900 EGP", ar: "الصف الأول · 900 جنيه" }, gap: xs }
        - { kind: button, emphasis: low, text: *hn_c, gap: l }
    options:
      - id: words
        text: { en: "Keep the spacing, and change each button to say which ticket it's for", ar: "أبقِ المسافات، وغيّر نص كل زر ليقول لأي تذكرة هو" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hn_s }
            - { kind: button, emphasis: low, text: { en: "Choose Standard", ar: "اختر العادية" }, gap: l }
            - { kind: heading, text: *hn_v, gap: xs }
            - { kind: button, emphasis: low, text: { en: "Choose VIP", ar: "اختر VIP" }, gap: l }
            - { kind: heading, text: *hn_f, gap: xs }
            - { kind: button, emphasis: low, text: { en: "Choose Front row", ar: "اختر الصف الأول" }, gap: l }
      - id: gaps
        text: { en: "Keep each button close under its own ticket, with a big gap before the next ticket", ar: "أبقِ كل زر قريبًا تحت تذكرته، مع مسافة كبيرة قبل التذكرة التالية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hn_s }
            - { kind: button, emphasis: low, text: *hn_c, gap: xs }
            - { kind: heading, text: *hn_v, gap: xl }
            - { kind: button, emphasis: low, text: *hn_c, gap: xs }
            - { kind: heading, text: *hn_f, gap: xl }
            - { kind: button, emphasis: low, text: *hn_c, gap: xs }
      - id: lines
        text: { en: "Keep the spacing, and put a thin line under every row", ar: "أبقِ المسافات، وضع خطًا رفيعًا تحت كل سطر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hn_s }
            - { kind: divider, gap: xs }
            - { kind: button, emphasis: low, text: *hn_c, gap: l }
            - { kind: divider, gap: xs }
            - { kind: heading, text: *hn_v, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: button, emphasis: low, text: *hn_c, gap: l }
            - { kind: divider, gap: xs }
            - { kind: heading, text: *hn_f, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: button, emphasis: low, text: *hn_c, gap: l }
    answer: [gaps]
    misconceptions:
      - id: MC-P10-020
        when: [words]
        feedback:
          en: "The labels help once people read them, but at a glance each button still sits with the ticket below it. Fix the gaps: small inside a ticket, big between tickets."
          ar: "تفيد النصوص عندما يقرؤها الناس، لكن بنظرة سريعة ما زال كل زر يجلس مع التذكرة التي تحته. أصلح المسافات: صغيرة داخل التذكرة، وكبيرة بين التذاكر."
      - id: MC-P10-024
        when: [lines]
        feedback:
          en: "Lines under every row cut the screen into equal strips, and each button is still nearest the wrong ticket. Spacing makes the groups, not more lines."
          ar: "الخطوط تحت كل سطر تقسّم الشاشة إلى شرائح متساوية، وما زال كل زر أقرب إلى التذكرة الخطأ. المسافات هي التي تصنع المجموعات، لا مزيد من الخطوط."
    correct:
      en: "Right. Each ticket and its button now read as one group."
      ar: "صحيح. تُقرأ كل تذكرة وزرها الآن كمجموعة واحدة."
    explain:
      en: "People group what sits close together. Less space inside a group and more between groups puts each button with its own ticket before anyone reads a word."
      ar: "يجمع الناس ما يتقارب. مسافة أقل داخل المجموعة وأكبر بين المجموعات تضع كل زر مع تذكرته قبل أن يقرأ أحد أي كلمة."

  - id: S02
    type: tune
    skill: SK-P10-U02-01
    part: retest
    value:
      en: "Re-test, form spacing (NN/g): place the label closer to its own field than to other fields. When the gaps above and below a label are equal, people can't tell which field it names."
      ar: "إعادة اختبار، المسافات في النماذج (NN/g): ضع العنوان أقرب إلى حقله منه إلى الحقول الأخرى. عندما تتساوى المسافة فوق العنوان وتحته، لا يعرف الناس أي حقل يقصده."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "Place the label closer to the associated text field than to other text fields" }
    scenario:
      en: "Rasha is applying for a job on her phone. On the application form, every label sits halfway between two fields. She typed her phone number into the email field."
      ar: "تقدّم رشا على وظيفة من هاتفها. في نموذج التقديم، كل عنوان في منتصف المسافة بين حقلين. فكتبت رقم هاتفها في حقل البريد الإلكتروني."
    prompt:
      en: "Try each change, and type in the fields. Which one should ship?"
      ar: "جرّب كل تغيير، واكتب في الحقول. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: small, text: &ra_n { en: "Full name", ar: "الاسم الكامل" } }
        - { kind: field, text: "", gap: m }
        - { kind: small, text: &ra_e { en: "Email", ar: "البريد الإلكتروني" }, gap: m }
        - { kind: field, text: "", gap: m }
        - { kind: small, text: &ra_p { en: "Phone", ar: "رقم الهاتف" }, gap: m }
        - { kind: field, text: "", gap: m }
    options:
      - id: bold
        text: { en: "Keep the gaps, and make the labels bold", ar: "أبقِ المسافات، واجعل العناوين بخط عريض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, weight: bold, text: *ra_n }
            - { kind: field, text: "", gap: m }
            - { kind: small, weight: bold, text: *ra_e, gap: m }
            - { kind: field, text: "", gap: m }
            - { kind: small, weight: bold, text: *ra_p, gap: m }
            - { kind: field, text: "", gap: m }
      - id: boxes
        text: { en: "Keep the gaps, and give every field a thicker border", ar: "أبقِ المسافات، وأعطِ كل حقل إطارًا أسمك" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, text: *ra_n }
            - { kind: field, focus: true, text: "", gap: m }
            - { kind: small, text: *ra_e, gap: m }
            - { kind: field, focus: true, text: "", gap: m }
            - { kind: small, text: *ra_p, gap: m }
            - { kind: field, focus: true, text: "", gap: m }
      - id: hug
        text: { en: "Put each label right above its own field, with a bigger gap before the next label", ar: "ضع كل عنوان فوق حقله مباشرة، مع مسافة أكبر قبل العنوان التالي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, text: *ra_n }
            - { kind: field, text: "", gap: xs }
            - { kind: small, text: *ra_e, gap: xl }
            - { kind: field, text: "", gap: xs }
            - { kind: small, text: *ra_p, gap: xl }
            - { kind: field, text: "", gap: xs }
    answer: [hug]
    misconceptions:
      - id: MC-P10-023
        when: [bold, boxes]
        feedback:
          en: "Each label still sits exactly between two fields, so Rasha still has to guess. A label must be closer to its own field than to any other."
          ar: "ما زال كل عنوان في المنتصف تمامًا بين حقلين، فما زالت رشا مضطرة للتخمين. يجب أن يكون العنوان أقرب إلى حقله من أي حقل آخر."
    correct:
      en: "Right. Each label now hugs the field it names."
      ar: "صحيح. كل عنوان الآن ملاصق للحقل الذي يسمّيه."
    explain:
      en: "Labels are grouped with their fields by distance alone. Small gap between a label and its field, bigger gap before the next label."
      ar: "تُجمع العناوين مع حقولها بالمسافة وحدها. مسافة صغيرة بين العنوان وحقله، ومسافة أكبر قبل العنوان التالي."

  # SK-P10-U02-02: keep actions next to what they act on
  - id: S03
    type: tune
    skill: SK-P10-U02-02
    part: retest
    value:
      en: "Re-test, proximity (NN/g): an optional path placed far from the main choices tricks users into thinking they must sign in. The guest option belongs with the sign-in buttons."
      ar: "إعادة اختبار، التقارب (NN/g): المسار الاختياري البعيد عن الخيارات الرئيسية يوهم المستخدمين بأن تسجيل الدخول إلزامي. خيار الضيف مكانه مع أزرار تسجيل الدخول."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "tricks users into thinking they must sign in" }
    scenario:
      en: "Mahmoud is sending flowers to his mother and doesn't want an account. Checkout lets him continue as a guest, but in testing most people thought they had to sign in, and some left."
      ar: "يرسل محمود ورودًا لوالدته ولا يريد إنشاء حساب. تسمح صفحة الدفع بالمتابعة كضيف، لكن في الاختبار ظنّ معظم الناس أن تسجيل الدخول إلزامي، وغادر بعضهم."
    prompt:
      en: "Try each place for the guest option. Which one should ship?"
      ar: "جرّب كل مكان لخيار الضيف. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      height: 420
      blocks:
        - { kind: title, text: &mh_t { en: "How do you want to check out?", ar: "كيف تريد إتمام الطلب؟" } }
        - { kind: button, text: &mh_g { en: "Sign in with Google", ar: "سجّل الدخول عبر Google" }, gap: m }
        - { kind: button, style: plain, text: &mh_e { en: "Sign in with email", ar: "سجّل الدخول بالبريد الإلكتروني" }, gap: s }
        - { kind: small, text: "", height: 150 }
        - { kind: small, text: &mh_f { en: "Help · Terms · Privacy", ar: "المساعدة · الشروط · الخصوصية" } }
        - { kind: link, text: &mh_c { en: "Continue as guest", ar: "تابع كضيف" }, gap: s }
    options:
      - id: near
        text: { en: "Put Continue as guest right under the two sign-in buttons", ar: "ضع «تابع كضيف» مباشرة تحت زرّي تسجيل الدخول" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 420
          blocks:
            - { kind: title, text: *mh_t }
            - { kind: button, text: *mh_g, gap: m }
            - { kind: button, style: plain, text: *mh_e, gap: s }
            - { kind: button, style: plain, text: *mh_c, gap: s }
            - { kind: small, text: "", height: 150 }
            - { kind: small, text: *mh_f }
      - id: red
        text: { en: "Keep it at the bottom, but make it bold and red", ar: "أبقِه في الأسفل، لكن اجعله عريضًا وأحمر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 420
          blocks:
            - { kind: title, text: *mh_t }
            - { kind: button, text: *mh_g, gap: m }
            - { kind: button, style: plain, text: *mh_e, gap: s }
            - { kind: small, text: "", height: 150 }
            - { kind: small, text: *mh_f }
            - { kind: link, color: red, weight: bold, text: *mh_c, gap: s }
      - id: footer
        text: { en: "Move it into the footer links, next to Help and Terms", ar: "انقله إلى روابط التذييل، بجانب «المساعدة» و«الشروط»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          height: 420
          blocks:
            - { kind: title, text: *mh_t }
            - { kind: button, text: *mh_g, gap: m }
            - { kind: button, style: plain, text: *mh_e, gap: s }
            - { kind: small, text: "", height: 150 }
            - { kind: small, text: { en: "Help · Terms · Privacy · Continue as guest", ar: "المساعدة · الشروط · الخصوصية · تابع كضيف" } }
    answer: [near]
    misconceptions:
      - id: MC-P10-033
        when: [red, footer]
        feedback:
          en: "It's still far from the two sign-in buttons, so it doesn't read as a third way to check out. People see two choices and assume signing in is required."
          ar: "ما زال بعيدًا عن زرّي تسجيل الدخول، فلا يُقرأ كطريقة ثالثة للدفع. يرى الناس خيارين فيظنّون أن تسجيل الدخول إلزامي."
    correct:
      en: "Right. Guest checkout now reads as one of the three ways to continue."
      ar: "صحيح. تُقرأ المتابعة كضيف الآن كإحدى ثلاث طرق للمتابعة."
    explain:
      en: "An option is understood as part of a choice only when it sits with the other options. Placed far away, the guest path is missed, and the step looks mandatory."
      ar: "يُفهم الخيار كجزء من الاختيار فقط عندما يكون مع الخيارات الأخرى. وعندما يكون بعيدًا، يُفوَّت مسار الضيف، وتبدو الخطوة إلزامية."

  - id: S04
    type: tune
    skill: SK-P10-U02-02
    part: retest
    value:
      en: "Re-test, proximity (NN/g): grouping together unrelated elements may camouflage them. An Add passenger button among the page actions is far from the passenger fields it adds to."
      ar: "إعادة اختبار، التقارب (NN/g): جمع عناصر غير مترابطة معًا قد يخفيها عن المستخدمين. زر «أضف مسافرًا» بين إجراءات الصفحة بعيد عن حقول المسافرين التي يضيف إليها."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "grouping together unrelated elements may camouflage them from users" }
    scenario:
      en: "Ola is booking a ferry for herself and her son. After filling in her own details, she looked for a way to add him and couldn't find one. The button is in the bar at the bottom."
      ar: "تحجز علا رحلة عبّارة لها ولابنها. بعد أن ملأت بياناتها، بحثت عن طريقة لإضافته ولم تجدها. الزر موجود في الشريط أسفل الصفحة."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &ol_h { en: "Passenger 1", ar: "المسافر 1" } }
        - { kind: field, label: &ol_n { en: "Full name", ar: "الاسم الكامل" }, text: { en: "Ola Samir", ar: "علا سمير" }, filled: true, gap: s }
        - { kind: field, label: &ol_i { en: "ID number", ar: "رقم الهوية" }, text: "29001011234567", filled: true, gap: s }
        - kind: row
          gap: xl
          blocks:
            - { kind: button, style: plain, text: &ol_c { en: "Cancel", ar: "إلغاء" } }
            - { kind: button, style: plain, text: &ol_a { en: "Add passenger", ar: "أضف مسافرًا" } }
            - { kind: button, text: &ol_p { en: "Pay", ar: "ادفع" } }
    options:
      - id: big
        text: { en: "Keep it in the bottom bar, but make it the biggest button there", ar: "أبقِه في الشريط السفلي، لكن اجعله أكبر زر فيه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *ol_h }
            - { kind: field, label: *ol_n, text: { en: "Ola Samir", ar: "علا سمير" }, filled: true, gap: s }
            - { kind: field, label: *ol_i, text: "29001011234567", filled: true, gap: s }
            - kind: row
              gap: xl
              blocks:
                - { kind: button, style: plain, text: *ol_c }
                - { kind: button, px: 19, text: *ol_a }
                - { kind: button, text: *ol_p }
      - id: rename
        text: { en: "Keep it in the bar, and rename it \"+ Add another passenger\"", ar: "أبقِه في الشريط، وغيّر اسمه إلى «+ أضف مسافرًا آخر»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *ol_h }
            - { kind: field, label: *ol_n, text: { en: "Ola Samir", ar: "علا سمير" }, filled: true, gap: s }
            - { kind: field, label: *ol_i, text: "29001011234567", filled: true, gap: s }
            - kind: row
              gap: xl
              blocks:
                - { kind: button, style: plain, text: *ol_c }
                - { kind: button, style: plain, text: { en: "+ Add another passenger", ar: "+ أضف مسافرًا آخر" } }
                - { kind: button, text: *ol_p }
      - id: under
        text: { en: "Move it right under the last passenger's fields", ar: "انقله مباشرة تحت حقول آخر مسافر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *ol_h }
            - { kind: field, label: *ol_n, text: { en: "Ola Samir", ar: "علا سمير" }, filled: true, gap: s }
            - { kind: field, label: *ol_i, text: "29001011234567", filled: true, gap: s }
            - { kind: button, style: plain, text: { en: "+ Add another passenger", ar: "+ أضف مسافرًا آخر" }, gap: s }
            - kind: row
              gap: xl
              blocks:
                - { kind: button, style: plain, text: *ol_c }
                - { kind: button, text: *ol_p }
    answer: [under]
    misconceptions:
      - id: MC-P10-033
        when: [big, rename]
        feedback:
          en: "It still sits among the page actions, far from the passenger it adds to, so it blends in with Cancel and Pay. Put it where Ola is working."
          ar: "ما زال بين إجراءات الصفحة، بعيدًا عن المسافر الذي يضيف إليه، فيذوب بين «إلغاء» و«ادفع». ضعه حيث تعمل علا."
    correct:
      en: "Right. Ola finds it just where she finished the first passenger."
      ar: "صحيح. تجده علا في المكان الذي أنهت فيه بيانات المسافر الأول."
    explain:
      en: "A control belongs next to what it acts on. Mixed in with unrelated buttons, it's camouflaged, however big or clearly named it is."
      ar: "مكان العنصر بجانب ما يعمل عليه. وعندما يختلط بأزرار لا علاقة لها به، يختفي، مهما كان حجمه أو وضوح اسمه."

  # SK-P10-U02-03: chunk into a few meaningful groups
  - id: S05
    type: tune
    skill: SK-P10-U02-03
    part: retest
    value:
      en: "Re-test, chunking forms (NN/g): grouping fields into a few titled sections makes users see a 3-part form instead of one long list. Lines under every field don't make groups."
      ar: "إعادة اختبار، تقسيم النماذج (NN/g): جمع الحقول في أقسام قليلة بعناوين يجعل المستخدمين يرون نموذجًا من 3 أجزاء بدل قائمة طويلة. والخطوط تحت كل حقل لا تصنع مجموعات."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "Users now see a 3-part form" }
    scenario:
      en: "Samar is opening a savings account in her bank's app. The form has nine fields in one long list, and many people give up halfway."
      ar: "تفتح سمر حساب توفير في تطبيق البنك. يضم النموذج تسعة حقول في قائمة طويلة واحدة، ويستسلم كثيرون في منتصفها."
    prompt:
      en: "Try each layout. Which one makes the form feel shorter?"
      ar: "جرّب كل تخطيط. أيّها يجعل النموذج يبدو أقصر؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &sm_flat
        - { kind: small, text: { en: "First name · Last name · Date of birth", ar: "الاسم الأول · اسم العائلة · تاريخ الميلاد" } }
        - { kind: field, text: "", gap: xs }
        - { kind: field, text: "", gap: s }
        - { kind: field, text: "", gap: s }
        - { kind: small, text: { en: "Mobile · Email · Address", ar: "الهاتف · البريد الإلكتروني · العنوان" }, gap: s }
        - { kind: field, text: "", gap: xs }
        - { kind: field, text: "", gap: s }
        - { kind: field, text: "", gap: s }
        - { kind: small, text: { en: "Account type · Branch · Monthly deposit", ar: "نوع الحساب · الفرع · الإيداع الشهري" }, gap: s }
        - { kind: field, text: "", gap: xs }
        - { kind: field, text: "", gap: s }
        - { kind: field, text: "", gap: s }
    options:
      - id: lines
        text: { en: "Keep one list, and put a line under every field", ar: "أبقِ قائمة واحدة، وضع خطًا تحت كل حقل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, text: { en: "First name", ar: "الاسم الأول" } }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Last name", ar: "اسم العائلة" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Date of birth", ar: "تاريخ الميلاد" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Mobile", ar: "الهاتف" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Email", ar: "البريد الإلكتروني" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Address", ar: "العنوان" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Account type", ar: "نوع الحساب" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Branch", ar: "الفرع" }, gap: xs }
            - { kind: divider, gap: xs }
            - { kind: field, text: { en: "Monthly deposit", ar: "الإيداع الشهري" }, gap: xs }
      - id: groups
        text: { en: "Three titled groups: About you, How to reach you, Your account", ar: "ثلاث مجموعات بعناوين: عنك، كيف نتواصل معك، حسابك" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: { en: "About you", ar: "عنك" } }
            - { kind: field, text: { en: "First name", ar: "الاسم الأول" }, gap: s }
            - { kind: field, text: { en: "Last name", ar: "اسم العائلة" }, gap: xs }
            - { kind: field, text: { en: "Date of birth", ar: "تاريخ الميلاد" }, gap: xs }
            - { kind: heading, text: { en: "How to reach you", ar: "كيف نتواصل معك" }, gap: xl }
            - { kind: field, text: { en: "Mobile", ar: "الهاتف" }, gap: s }
            - { kind: field, text: { en: "Email", ar: "البريد الإلكتروني" }, gap: xs }
            - { kind: field, text: { en: "Address", ar: "العنوان" }, gap: xs }
            - { kind: heading, text: { en: "Your account", ar: "حسابك" }, gap: xl }
            - { kind: field, text: { en: "Account type", ar: "نوع الحساب" }, gap: s }
            - { kind: field, text: { en: "Branch", ar: "الفرع" }, gap: xs }
            - { kind: field, text: { en: "Monthly deposit", ar: "الإيداع الشهري" }, gap: xs }
      - id: nine
        text: { en: "Nine screens, one field on each", ar: "تسع شاشات، حقل واحد في كل شاشة" }
        mock:
          caption: { en: "After this change: screen 1 of 9", ar: "بعد هذا التغيير: الشاشة 1 من 9" }
          blocks:
            - { kind: small, text: { en: "Step 1 of 9", ar: "الخطوة 1 من 9" } }
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, text: "", gap: s }
            - { kind: button, text: { en: "Next", ar: "التالي" }, gap: m }
    answer: [groups]
    misconceptions:
      - id: MC-P10-024
        when: [lines]
        feedback:
          en: "A line under every field makes nine equal pieces. Nothing tells Samar the form has three parts."
          ar: "الخط تحت كل حقل يصنع تسع قطع متساوية. ولا شيء يخبر سمر أن النموذج من ثلاثة أجزاء."
      - id: MC-P10-031
        when: [nine]
        feedback:
          en: "Nine screens split fields that belong together, like first and last name, and the counter says 9 steps. Group them into a few meaningful sets instead."
          ar: "تسع شاشات تفصل حقولًا تنتمي معًا، مثل الاسم الأول واسم العائلة، والعدّاد يقول 9 خطوات. اجمعها بدلًا من ذلك في مجموعات قليلة ذات معنى."
    correct:
      en: "Right. Samar sees three short parts instead of one long list."
      ar: "صحيح. ترى سمر ثلاثة أجزاء قصيرة بدل قائمة واحدة طويلة."
    explain:
      en: "Chunking helps when the groups mean something: about you, contact, account. Titled groups with space between them turn one long form into three short ones."
      ar: "التقسيم يفيد عندما يكون للمجموعات معنى: عنك، والتواصل، والحساب. المجموعات بعناوين ومسافات بينها تحوّل نموذجًا طويلًا إلى ثلاثة نماذج قصيرة."

  - id: S06
    type: tune
    skill: SK-P10-U02-03
    part: retest
    value:
      en: "Re-test, squint test (NN/g): squint or apply a slight blur to the design; the groups that remain are what people see first. Spacing survives the blur, borders on every row don't."
      ar: "إعادة اختبار، اختبار التحديق (NN/g): حدّق أو موّه التصميم قليلًا؛ المجموعات التي تبقى هي ما يراه الناس أولًا. المسافات تبقى بعد التمويه، أما الحدود حول كل سطر فلا."
    ref: { url: "https://www.nngroup.com/articles/visual-hierarchy-ux-definition/", quote: "squint or apply a slight blur to the design" }
    scenario:
      en: "Your team is redesigning a settings screen with three groups: Account, Notifications and Privacy. Each version below is shown blurred, as in a squint test."
      ar: "يعيد فريقك تصميم شاشة إعدادات فيها ثلاث مجموعات: الحساب، والإشعارات، والخصوصية. كل نسخة أدناه معروضة مموّهة، كما في اختبار التحديق."
    prompt:
      en: "Try each version. In which one do the three groups still show through the blur?"
      ar: "جرّب كل نسخة. في أيّها تبقى المجموعات الثلاث ظاهرة رغم التمويه؟"
    mock:
      caption: { en: "Now (blurred)", ar: "الآن (مموّهة)" }
      blur: 4
      blocks:
        - { kind: meta, text: &st_1 { en: "Account", ar: "الحساب" } }
        - { kind: meta, text: &st_2 { en: "Change password", ar: "تغيير كلمة المرور" }, gap: s }
        - { kind: meta, text: &st_3 { en: "Notifications", ar: "الإشعارات" }, gap: s }
        - { kind: meta, text: &st_4 { en: "Order updates", ar: "تحديثات الطلبات" }, gap: s }
        - { kind: meta, text: &st_5 { en: "Offers", ar: "العروض" }, gap: s }
        - { kind: meta, text: &st_6 { en: "Privacy", ar: "الخصوصية" }, gap: s }
        - { kind: meta, text: &st_7 { en: "Share my location", ar: "مشاركة موقعي" }, gap: s }
    options:
      - id: space
        text: { en: "Group names as headings, items close under them, big gaps between groups", ar: "أسماء المجموعات كعناوين، والعناصر قريبة تحتها، ومسافات كبيرة بين المجموعات" }
        mock:
          caption: { en: "After this change (blurred)", ar: "بعد هذا التغيير (مموّهة)" }
          blur: 4
          blocks:
            - { kind: heading, text: *st_1 }
            - { kind: meta, text: *st_2, gap: xs }
            - { kind: heading, text: *st_3, gap: xl }
            - { kind: meta, text: *st_4, gap: xs }
            - { kind: meta, text: *st_5, gap: xs }
            - { kind: heading, text: *st_6, gap: xl }
            - { kind: meta, text: *st_7, gap: xs }
      - id: boxes
        text: { en: "Keep the even gaps, and put a border around every row", ar: "أبقِ المسافات المتساوية، وضع إطارًا حول كل سطر" }
        mock:
          caption: { en: "After this change (blurred)", ar: "بعد هذا التغيير (مموّهة)" }
          blur: 4
          blocks:
            - { kind: group, blocks: [{ kind: meta, text: *st_1 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_2 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_3 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_4 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_5 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_6 }] }
            - { kind: group, gap: s, blocks: [{ kind: meta, text: *st_7 }] }
      - id: bold
        text: { en: "Keep the even gaps, and make the group names bold", ar: "أبقِ المسافات المتساوية، واجعل أسماء المجموعات بخط عريض" }
        mock:
          caption: { en: "After this change (blurred)", ar: "بعد هذا التغيير (مموّهة)" }
          blur: 4
          blocks:
            - { kind: meta, weight: bold, text: *st_1 }
            - { kind: meta, text: *st_2, gap: s }
            - { kind: meta, weight: bold, text: *st_3, gap: s }
            - { kind: meta, text: *st_4, gap: s }
            - { kind: meta, text: *st_5, gap: s }
            - { kind: meta, weight: bold, text: *st_6, gap: s }
            - { kind: meta, text: *st_7, gap: s }
    answer: [space]
    misconceptions:
      - id: MC-P10-024
        when: [boxes]
        feedback:
          en: "Through the blur you see seven equal boxes, not three groups. Borders on every row make more pieces, not clearer groups."
          ar: "عبر التمويه ترى سبعة صناديق متساوية، لا ثلاث مجموعات. الحدود حول كل سطر تصنع قطعًا أكثر، لا مجموعات أوضح."
      - id: MC-P10-020
        when: [bold]
        feedback:
          en: "Bold names barely survive the blur, and the gaps are still all the same. Groups show when the space inside them is smaller than the space between them."
          ar: "الأسماء العريضة بالكاد تظهر بعد التمويه، والمسافات ما زالت متساوية. تظهر المجموعات عندما تكون المسافة داخلها أصغر من المسافة بينها."
    correct:
      en: "Right. Even blurred, three blocks stand out."
      ar: "صحيح. حتى مع التمويه، تبرز ثلاث كتل."
    explain:
      en: "The squint test shows what people see before they read. Spacing and headings make three clear blocks that survive the blur; equal gaps and boxed rows don't."
      ar: "يُظهر اختبار التحديق ما يراه الناس قبل أن يقرؤوا. المسافات والعناوين تصنع ثلاث كتل واضحة تبقى بعد التمويه؛ أما المسافات المتساوية والأسطر داخل صناديق فلا."

  # SK-P10-U02-04: make look-alikes and containers tell the truth
  - id: S07
    type: tune
    skill: SK-P10-U02-04
    part: retest
    value:
      en: "Re-test, common region (NN/g): creating a clear boundary is a strong visual cue. A button just outside a card reads as part of the page, not that card; put it inside."
      ar: "إعادة اختبار، المنطقة المشتركة (NN/g): الحدّ الواضح إشارة بصرية قوية. الزر الموجود خارج الـ Card مباشرة يُقرأ كجزء من الصفحة لا من تلك الـ Card؛ ضعه داخلها."
    ref: { url: "https://www.nngroup.com/articles/common-region/", quote: "Creating a clear boundary is a strong visual cue" }
    scenario:
      en: "Wafaa is choosing how to get her new glasses: home delivery or pickup from the shop. Each option is a card, and each has a Choose button placed just below its card."
      ar: "تختار وفاء طريقة استلام نظارتها الجديدة: توصيل للمنزل أو استلام من المحل. كل خيار في Card، ولكلٍّ منهما زر «اختر» تحت الـ Card مباشرة."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: group, blocks: [{ kind: heading, text: &wf_d { en: "Home delivery", ar: "توصيل للمنزل" } }, { kind: small, text: &wf_dd { en: "Tomorrow · 40 EGP", ar: "غدًا · 40 جنيهًا" }, gap: xs }] }
        - { kind: button, emphasis: low, text: &wf_c { en: "Choose", ar: "اختر" }, gap: s }
        - { kind: group, gap: s, blocks: [{ kind: heading, text: &wf_p { en: "Pickup from the shop", ar: "استلام من المحل" } }, { kind: small, text: &wf_pd { en: "Today after 17:00 · Free", ar: "اليوم بعد 17:00 · مجانًا" }, gap: xs }] }
        - { kind: button, emphasis: low, text: *wf_c, gap: s }
    options:
      - id: closer
        text: { en: "Move each button even closer under its card, still outside it", ar: "قرّب كل زر أكثر تحت الـ Card، مع بقائه خارجها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: group, blocks: [{ kind: heading, text: *wf_d }, { kind: small, text: *wf_dd, gap: xs }] }
            - { kind: button, emphasis: low, text: *wf_c, gap: xs }
            - { kind: group, gap: m, blocks: [{ kind: heading, text: *wf_p }, { kind: small, text: *wf_pd, gap: xs }] }
            - { kind: button, emphasis: low, text: *wf_c, gap: xs }
      - id: color
        text: { en: "Keep them outside, and color each button like its card's heading", ar: "أبقِهما خارجًا، ولوّن كل زر بلون عنوان الـ Card الخاصة به" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: group, blocks: [{ kind: heading, color: green, text: *wf_d }, { kind: small, text: *wf_dd, gap: xs }] }
            - { kind: button, emphasis: low, color: green, text: *wf_c, gap: s }
            - { kind: group, gap: s, blocks: [{ kind: heading, color: orange, text: *wf_p }, { kind: small, text: *wf_pd, gap: xs }] }
            - { kind: button, emphasis: low, color: orange, text: *wf_c, gap: s }
      - id: inside
        text: { en: "Move each button inside its own card", ar: "انقل كل زر إلى داخل الـ Card الخاصة به" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: group, blocks: [{ kind: heading, text: *wf_d }, { kind: small, text: *wf_dd, gap: xs }, { kind: button, emphasis: low, text: *wf_c, gap: s }] }
            - { kind: group, gap: m, blocks: [{ kind: heading, text: *wf_p }, { kind: small, text: *wf_pd, gap: xs }, { kind: button, emphasis: low, text: *wf_c, gap: s }] }
    answer: [inside]
    misconceptions:
      - id: MC-P10-034
        when: [closer]
        feedback:
          en: "However close it gets, a button outside the card's edge reads as part of the page. The border is a stronger cue than a small gap."
          ar: "مهما اقترب الزر، فما دام خارج حدّ الـ Card يُقرأ كجزء من الصفحة. الحدّ إشارة أقوى من مسافة صغيرة."
      - id: MC-P10-025
        when: [color]
        feedback:
          en: "Matching colors hint at a link, but the buttons still sit outside the cards, between the two options. Put each one inside its card."
          ar: "الألوان المتطابقة تلمّح إلى علاقة، لكن الزرين ما زالا خارج الـ Cards، بين الخيارين. ضع كل زر داخل الـ Card الخاصة به."
    correct:
      en: "Right. Each card now holds its option and its button."
      ar: "صحيح. كل Card تحمل الآن خيارها وزرها."
    explain:
      en: "A container groups whatever sits inside its edge. Once options are cards, their buttons belong inside them; just outside, they look like they belong to the page."
      ar: "الحاوية تجمع كل ما داخل حدّها. فإذا كانت الخيارات Cards، فمكان أزرارها داخلها؛ وخارجها مباشرة تبدو كأنها تنتمي إلى الصفحة."

  - id: S08
    type: tune
    skill: SK-P10-U02-04
    part: retest
    value:
      en: "Re-test, similarity (NN/g): users mistook a video in the right rail for an ad because it looked like the ads around it. A how-to video styled and placed like the ads gets skipped."
      ar: "إعادة اختبار، التشابه (NN/g): ظنّ المستخدمون أن فيديو في العمود الجانبي إعلان لأنه يشبه الإعلانات حوله. فيديو الشرح المصمّم والموضوع مثل الإعلانات يُتخطّى."
    ref: { url: "https://www.nngroup.com/articles/gestalt-similarity/", quote: "Users mistook the video in the right rail" }
    scenario:
      en: "Fatma is following a recipe for stuffed vine leaves on her tablet. There's a short video showing how to roll them, but it sits in the side column with two ads, at the same size and style. Almost nobody plays it."
