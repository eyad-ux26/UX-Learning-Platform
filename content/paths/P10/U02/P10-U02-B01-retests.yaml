                    - { kind: banner, text: *ft_v, gap: xs }
                    - { kind: banner, text: *ft_a2, gap: s }
      - id: step
        text: { en: "Move the video into step 3, styled like the recipe content", ar: "انقل الفيديو إلى الخطوة 3، بشكل محتوى الوصفة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          frame: wide
          blocks:
            - kind: row
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: heading, text: *ft_t }
                    - { kind: small, text: *ft_s3, gap: s }
                    - { kind: image, size: s, text: { en: "Video: how to roll the leaves (1 min)", ar: "فيديو: طريقة لف الورق (دقيقة واحدة)" }, gap: xs }
                    - { kind: small, text: *ft_s4, gap: s }
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: banner, text: *ft_a1 }
                    - { kind: banner, text: *ft_a2, gap: s }
      - id: tint
        text: { en: "Keep it in the side column, and give the whole column a colored background", ar: "أبقِه في العمود الجانبي، وأعطِ العمود كله خلفية ملوّنة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          frame: wide
          blocks:
            - kind: row
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: heading, text: *ft_t }
                    - { kind: small, text: *ft_s3, gap: s }
                    - { kind: small, text: *ft_s4, gap: s }
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: banner, text: *ft_a1 }
                    - { kind: banner, text: *ft_v, gap: s }
                    - { kind: banner, text: *ft_a2, gap: s }
    answer: [step]
    misconceptions:
      - id: MC-P10-036
        when: [label, tint]
        feedback:
          en: "The video still looks and sits like the two ads next to it, so people skip it with them. Content that looks like an ad is treated as one."
          ar: "ما زال الفيديو يشبه الإعلانين بجانبه ويجلس معهما، فيتخطّاه الناس معهما. المحتوى الذي يشبه الإعلان يُعامل كإعلان."
    correct:
      en: "Right. The video now reads as part of step 3, where Fatma needs it."
      ar: "صحيح. يُقرأ الفيديو الآن كجزء من الخطوة 3، حيث تحتاجه فاطمة."
    explain:
      en: "Things that look alike are read as the same kind of thing. A video shaped and placed like the ads gets taken for one; inside the step it helps with, styled like the recipe, it reads as content."
      ar: "الأشياء المتشابهة تُقرأ كنوع واحد. الفيديو الذي يشبه الإعلانات في شكله ومكانه يُظنّ إعلانًا؛ وداخل الخطوة التي يشرحها، وبشكل الوصفة، يُقرأ كمحتوى."

  # SK-P10-U02-05: avoid false floors
  - id: S09
    type: tune
    skill: SK-P10-U02-05
    part: retest
    value:
      en: "Re-test, illusion of completeness (NN/g): in one study, six out of eight users did not realize they could scroll. A full-width band followed by empty space looks like the end."
      ar: "إعادة اختبار، وهم الاكتمال (NN/g): في إحدى الدراسات، لم يدرك ستة من ثمانية مستخدمين أنهم يستطيعون التمرير. الشريط بعرض الشاشة ثم مساحة فارغة يبدو كنهاية الصفحة."
    ref: { url: "https://www.nngroup.com/articles/illusion-of-completeness/", quote: "Six out of eight users did not realize they could scroll down this page" }
    scenario:
      en: "This is the first screen of Sherif's bank app. His recent payments are further down, but in testing most people thought the screen ended under the balance."
      ar: "هذه أول شاشة في تطبيق البنك الخاص بشريف. مدفوعاته الأخيرة في الأسفل، لكن في الاختبار ظنّ معظم الناس أن الشاشة تنتهي تحت الرصيد."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: first screen, before scrolling", ar: "الآن: الشاشة الأولى، قبل التمرير" }
      blocks:
        - kind: group
          tone: plain
          height: 380
          blocks:
            - kind: group
              tone: tint
              blocks:
                - { kind: small, text: &sh_l { en: "Balance", ar: "الرصيد" } }
                - { kind: title, text: &sh_b { en: "12,480 EGP", ar: "12,480 جنيهًا" }, gap: xs }
            - { kind: small, text: "", height: 230 }
            - { kind: heading, text: &sh_r { en: "Recent payments", ar: "المدفوعات الأخيرة" } }
    options:
      - id: peek
        text: { en: "Shrink the gap so the first payments show at the bottom of the screen", ar: "قلّل المسافة حتى تظهر أولى المدفوعات أسفل الشاشة" }
        mock:
          caption: { en: "After this change: first screen", ar: "بعد هذا التغيير: الشاشة الأولى" }
          blocks:
            - kind: group
              tone: plain
              height: 380
              blocks:
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: *sh_l }
                    - { kind: title, text: *sh_b, gap: xs }
                - { kind: heading, text: *sh_r, gap: l }
                - { kind: meta, text: { en: "Electricity bill · −640 EGP", ar: "فاتورة الكهرباء · ⁦−640⁩ جنيهًا" }, gap: s }
                - { kind: meta, text: { en: "Supermarket · −1,215 EGP", ar: "سوبر ماركت · ⁦−1,215⁩ جنيهًا" }, gap: s }
                - { kind: meta, text: { en: "Mobile top-up · −100 EGP", ar: "شحن رصيد الهاتف · ⁦−100⁩ جنيه" }, gap: s }
      - id: taller
        text: { en: "Make the balance band taller, so it fills the screen", ar: "اجعل شريط الرصيد أطول، حتى يملأ الشاشة" }
        mock:
          caption: { en: "After this change: first screen", ar: "بعد هذا التغيير: الشاشة الأولى" }
          blocks:
            - kind: group
              tone: plain
              height: 380
              blocks:
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: *sh_l }
                    - { kind: title, text: *sh_b, gap: xs }
                    - { kind: small, text: "", height: 260 }
      - id: line
        text: { en: "Keep the gap, and add a full-width line under the band", ar: "أبقِ المسافة، وأضف خطًا بعرض الشاشة تحت الشريط" }
        mock:
          caption: { en: "After this change: first screen", ar: "بعد هذا التغيير: الشاشة الأولى" }
          blocks:
            - kind: group
              tone: plain
              height: 380
              blocks:
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: *sh_l }
                    - { kind: title, text: *sh_b, gap: xs }
                - { kind: divider, gap: m }
                - { kind: small, text: "", height: 230 }
                - { kind: heading, text: *sh_r }
    answer: [peek]
    misconceptions:
      - id: MC-P10-035
        when: [taller, line]
        feedback:
          en: "A band that fills the screen, or a full-width line followed by empty space, looks like the bottom of the page. Let the next content peek into view."
          ar: "الشريط الذي يملأ الشاشة، أو الخط بعرضها ثم مساحة فارغة، يبدو كأسفل الصفحة. اجعل جزءًا من المحتوى التالي يظهر."
    correct:
      en: "Right. The payments peeking in tell Sherif there's more below."
      ar: "صحيح. ظهور جزء من المدفوعات يخبر شريف أن هناك المزيد في الأسفل."
    explain:
      en: "People scroll when they can see that something continues. Cut-off content at the screen edge says \"more below\"; big empty space and full-width lines say \"the end\"."
      ar: "يمرّر الناس عندما يرون أن شيئًا ما يستمر. المحتوى المقطوع عند حافة الشاشة يقول «هناك المزيد»؛ أما المساحة الفارغة الكبيرة والخطوط بعرض الشاشة فتقول «النهاية»."

