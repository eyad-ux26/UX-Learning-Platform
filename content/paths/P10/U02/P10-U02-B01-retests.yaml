            - { kind: small, text: *ib_2d, gap: xs }
            - { kind: heading, text: *ib_3, gap: xl }
            - { kind: small, text: *ib_3d, gap: xs }
            - kind: group
              tone: tint
              gap: xl
              blocks:
                - { kind: small, text: *hs_found }
                - { kind: meta, text: { en: "1. Help", ar: "1. المساعدة" }, gap: xs }
      - id: cards
        text: { en: "Put each section in its own card", ar: "ضع كل قسم في Card خاصة به" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *ib_t }
