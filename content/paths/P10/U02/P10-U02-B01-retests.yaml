          ar: "المسافات والـ Cards تُظهر ثلاث مجموعات لمن يرى، لكن الـ Screen reader ما زال لا يجد إلا «المساعدة». عرّف أسماء المجموعات كعناوين في الكود."
    correct:
      en: "Right. Ibrahim can jump straight to Returns."
      ar: "صحيح. يستطيع إبراهيم القفز مباشرة إلى «الإرجاع»."
    explain:
      en: "Visual grouping is invisible to a screen reader. Coding each group name as a heading gives Ibrahim the same map of the page that sighted people get from the layout."
      ar: "التجميع البصري غير مرئي للـ Screen reader. تعريف اسم كل مجموعة كعنوان في الكود يعطي إبراهيم خريطة الصفحة نفسها التي يأخذها المبصرون من التخطيط."

  # SK-P10-U02-07: build groups that stay whole when they stack
  - id: S13
    type: tune
    skill: SK-P10-U02-07
    part: retest
    value:
      en: "Re-test, stacking: proximity is one of the most important grouping principles, and a narrow screen stacks content in the order it was built. Build each doctor as one block."
      ar: "إعادة اختبار، التكدّس: التقارب من أهم مبادئ التجميع، والشاشة الضيّقة تكدّس المحتوى بالترتيب الذي بُني به. ابنِ كل طبيب ككتلة واحدة."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "Proximity is one of the most important grouping principles" }
    scenario:
      en: "A clinic's page shows two doctors side by side on the laptop. It must also work on phones, where the two columns stack."
      ar: "تعرض صفحة عيادة طبيبين جنبًا إلى جنب على الـ Laptop. ويجب أن تعمل أيضًا على الهواتف، حيث يتكدّس العمودان فوق بعضهما."
    prompt:
      en: "How should you build the two doctors? Try each way and see the phone."
      ar: "كيف تبني الطبيبين؟ جرّب كل طريقة وانظر إلى الهاتف."
    mock:
      caption: { en: "Now: laptop", ar: "الآن: الـ Laptop" }
      frame: wide
      blocks:
        - kind: row
          blocks:
            - { kind: heading, text: &dr_a { en: "Dr. Salma Fouad", ar: "د. سلمى فؤاد" } }
            - { kind: heading, text: &dr_b { en: "Dr. Omar Nabil", ar: "د. عمر نبيل" } }
        - kind: row
          gap: xs
          blocks:
            - { kind: small, text: &dr_as { en: "Children's doctor · Sat, Mon", ar: "طبيبة أطفال · السبت والاثنين" } }
            - { kind: small, text: &dr_bs { en: "Family doctor · Sun, Wed", ar: "طبيب أسرة · الأحد والأربعاء" } }
        - kind: row
          gap: s
          blocks:
            - { kind: button, emphasis: low, text: &dr_ab { en: "Book Dr. Salma", ar: "احجز مع د. سلمى" } }
            - { kind: button, emphasis: low, text: &dr_bb { en: "Book Dr. Omar", ar: "احجز مع د. عمر" } }
    options:
      - id: rowsgap
        text: { en: "Build it in rows (names, then details, then buttons), with more space between rows", ar: "ابنِها في صفوف (الأسماء، ثم التفاصيل، ثم الأزرار)، مع مسافة أكبر بين الصفوف" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, text: *dr_a }
            - { kind: heading, text: *dr_b, gap: xs }
            - { kind: small, text: *dr_as, gap: l }
            - { kind: small, text: *dr_bs, gap: xs }
            - { kind: button, emphasis: low, text: *dr_ab, gap: l }
            - { kind: button, emphasis: low, text: *dr_bb, gap: xs }
      - id: rowsbold
        text: { en: "Build it in rows, and make the doctors' names bold", ar: "ابنِها في صفوف، واجعل أسماء الأطباء بخط عريض" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, weight: bold, text: *dr_a }
            - { kind: heading, weight: bold, text: *dr_b, gap: xs }
            - { kind: small, text: *dr_as, gap: s }
            - { kind: small, text: *dr_bs, gap: xs }
            - { kind: button, emphasis: low, text: *dr_ab, gap: s }
            - { kind: button, emphasis: low, text: *dr_bb, gap: xs }
      - id: blocks
        text: { en: "Build each doctor as one block: name, details and button together", ar: "ابنِ كل طبيب ككتلة واحدة: الاسم والتفاصيل والزر معًا" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, text: *dr_a }
            - { kind: small, text: *dr_as, gap: xs }
            - { kind: button, emphasis: low, text: *dr_ab, gap: s }
            - { kind: heading, text: *dr_b, gap: xl }
            - { kind: small, text: *dr_bs, gap: xs }
            - { kind: button, emphasis: low, text: *dr_bb, gap: s }
    answer: [blocks]
    misconceptions:
      - id: MC-P10-028
        when: [rowsgap, rowsbold]
        feedback:
          en: "Rows stack line by line: both names, then both details, then both buttons. People have to match them up themselves. Build each doctor as one block."
          ar: "الصفوف تتكدّس سطرًا بسطر: الاسمان، ثم التفاصيل، ثم الزران. وعلى الناس مطابقتها بأنفسهم. ابنِ كل طبيب ككتلة واحدة."
    correct:
      en: "Right. Each doctor stays whole on the phone."
      ar: "صحيح. يبقى كل طبيب كاملًا على الهاتف."
    explain:
      en: "A narrow screen stacks content in the order it was built. Build each group as one block, and it stacks as one block, with its details and button together."
      ar: "تكدّس الشاشة الضيّقة المحتوى بالترتيب الذي بُني به. ابنِ كل مجموعة ككتلة واحدة، فتتكدّس ككتلة واحدة، وتفاصيلها وزرها معًا."

  - id: S14
    type: tune
    skill: SK-P10-U02-07
    part: retest
    value:
      en: "Re-test, stacking (NN/g): two related links side by side on desktop can end up far apart on phones, which can cause mobile users to never discover the second one."
      ar: "إعادة اختبار، التكدّس (NN/g): رابطان مترابطان جنبًا إلى جنب على الشاشة العريضة قد يتباعدان على الهاتف، فلا يكتشف مستخدمو الهاتف الرابط الثاني أبدًا."
    ref: { url: "https://www.nngroup.com/articles/gestalt-proximity/", quote: "can cause mobile users to never discover the second type of emission zone" }
    scenario:
      en: "On a university's laptop page, two links sit side by side: Apply as a new student, and Transfer from another university. On phones, the columns stack, and the transfer link ends up after eight other links. Transfer students say they can't find it."
      ar: "في صفحة جامعة على الـ Laptop، يوجد رابطان جنبًا إلى جنب: «قدّم كطالب جديد» و«انتقل من جامعة أخرى». على الهواتف تتكدّس الأعمدة، فيأتي رابط الانتقال بعد ثمانية روابط أخرى. ويقول الطلاب المنتقلون إنهم لا يجدونه."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: phone", ar: "الآن: الهاتف" }
      blocks:
        - { kind: link, text: &un_a { en: "Apply as a new student", ar: "قدّم كطالب جديد" } }
        - { kind: link, text: &un_x { en: "Fees · Scholarships · Housing · Calendar · Library · Clubs · Sports · News", ar: "الرسوم · المنح · السكن · التقويم · المكتبة · الأندية · الرياضة · الأخبار" }, gap: s }
        - { kind: link, text: &un_t { en: "Transfer from another university", ar: "انتقل من جامعة أخرى" }, gap: s }
    options:
      - id: together
        text: { en: "Keep the two apply links together in the code, so they stack together", ar: "أبقِ رابطي التقديم معًا في الكود، حتى يتكدّسا معًا" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          blocks:
            - { kind: link, text: *un_a }
            - { kind: link, text: *un_t, gap: xs }
            - { kind: link, text: *un_x, gap: l }
      - id: bigger
        text: { en: "Keep the order, and make the transfer link bigger", ar: "أبقِ الترتيب، وكبّر رابط الانتقال" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          blocks:
            - { kind: link, text: *un_a }
            - { kind: link, text: *un_x, gap: s }
            - { kind: link, px: 20, text: *un_t, gap: s }
      - id: seealso
        text: { en: "Keep the order, and add a \"See also: transfers\" link at the very bottom", ar: "أبقِ الترتيب، وأضف رابط «انظر أيضًا: الانتقال» في أسفل الصفحة" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          blocks:
            - { kind: link, text: *un_a }
            - { kind: link, text: *un_x, gap: s }
            - { kind: link, text: *un_t, gap: s }
            - { kind: small, text: { en: "See also: transfers", ar: "انظر أيضًا: الانتقال" }, gap: l }
    answer: [together]
    misconceptions:
      - id: MC-P10-038
        when: [bigger, seealso]
        feedback:
          en: "The transfer link is still eight links away from the other way to apply. People who find the first one apply there and leave. Keep them together."
          ar: "ما زال رابط الانتقال على بُعد ثمانية روابط من طريقة التقديم الأخرى. من يجد الأول يقدّم منه ويغادر. أبقِهما معًا."
    correct:
      en: "Right. Both ways to apply now sit together on every screen."
      ar: "صحيح. طريقتا التقديم الآن معًا على كل شاشة."
    explain:
      en: "Check what stacking pulls apart. Two choices people pick between must stay next to each other in the code, or the second one disappears on phones."
      ar: "تحقّق مما يفصله التكدّس. الخياران اللذان يختار الناس بينهما يجب أن يبقيا متجاورين في الكود، وإلا اختفى الثاني على الهواتف."

  # SK-P10-U02-08: pick a table or cards by the task
  - id: S15
    type: tune
    skill: SK-P10-U02-08
    part: retest
    value:
      en: "Re-test, comparison tables (NN/g): compensatory decision making is best served by comparison tables. Ramy weighs speed, data and price across plans, so keep the table and make it work on a phone."
      ar: "إعادة اختبار، جداول المقارنة (NN/g): اتخاذ القرار بالموازنة بين الخصائص يخدمه جدول المقارنة أفضل. يوازن رامي بين السرعة والبيانات والسعر عبر الباقات، فأبقِ الجدول واجعله يعمل على الهاتف."
    ref: { url: "https://www.nngroup.com/articles/comparison-tables/", quote: "compensatory decision making is best served by comparison tables" }
    scenario:
      en: "Ramy is choosing a home internet plan out of four. He weighs speed against monthly data and price, feature by feature. On the laptop it's a comparison table. You're deciding what phones should show."
      ar: "يختار رامي باقة إنترنت منزلي من بين أربع. يوازن بين السرعة وكمية البيانات الشهرية والسعر، ميزة بميزة. على الـ Laptop تظهر في جدول مقارنة. وأنت تقرّر ما يجب أن تعرضه الهواتف."
    prompt:
      en: "Try each option. Which one should ship?"
      ar: "جرّب كل خيار. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: laptop", ar: "الآن: الـ Laptop" }
      frame: wide
      blocks:
        - kind: row
          blocks:
            - { kind: small, text: "" }
            - { kind: heading, text: "Lite" }
            - { kind: heading, text: "Home" }
            - { kind: heading, text: "Max" }
            - { kind: heading, text: "Ultra" }
        - kind: row
          gap: s
          blocks: &net_speed
            - { kind: small, text: { en: "Speed", ar: "السرعة" } }
            - { kind: meta, text: "30 Mb" }
            - { kind: meta, text: "70 Mb" }
            - { kind: meta, text: "100 Mb" }
            - { kind: meta, text: "200 Mb" }
        - kind: row
          gap: s
          blocks: &net_data
            - { kind: small, text: { en: "Data", ar: "البيانات" } }
            - { kind: meta, text: "140 GB" }
            - { kind: meta, text: "250 GB" }
            - { kind: meta, text: "400 GB" }
            - { kind: meta, text: { en: "Unlimited", ar: "غير محدودة" } }
        - kind: row
          gap: s
          blocks: &net_price
            - { kind: small, text: { en: "Per month", ar: "شهريًا" } }
            - { kind: meta, text: { en: "210 EGP", ar: "210 جنيهات" } }
            - { kind: meta, text: { en: "350 EGP", ar: "350 جنيهًا" } }
            - { kind: meta, text: { en: "520 EGP", ar: "520 جنيهًا" } }
            - { kind: meta, text: { en: "900 EGP", ar: "900 جنيه" } }
    options:
      - id: tabs
        text: { en: "Tabs, one plan per tab", ar: "تبويبات (Tabs)، باقة واحدة في كل تبويب" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          blocks:
            - { kind: segmented, options: ["Lite", "Home", "Max", "Ultra"], value: 1 }
            - { kind: meta, text: { en: "Speed: 70 Mb", ar: "السرعة: 70 Mb" }, gap: m }
            - { kind: meta, text: { en: "Data: 250 GB", ar: "البيانات: 250 GB" }, gap: xs }
            - { kind: meta, text: { en: "350 EGP a month", ar: "350 جنيهًا شهريًا" }, gap: xs }
      - id: table
        text: { en: "Keep the table: pin the feature names, and let it scroll sideways with the next plan cut at the edge", ar: "أبقِ الجدول: ثبّت أسماء الميزات، واجعله يتحرّك أفقيًا مع ظهور جزء من الباقة التالية عند الحافة" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          blocks:
            - kind: group
              scroll: true
              sticky: true
              colw: 86
              blocks:
                - kind: row
                  blocks:
                    - { kind: small, text: "" }
                    - { kind: heading, text: "Lite" }
                    - { kind: heading, text: "Home" }
                    - { kind: heading, text: "Max" }
                    - { kind: heading, text: "Ultra" }
                - { kind: row, gap: s, blocks: *net_speed }
                - { kind: row, gap: s, blocks: *net_data }
                - { kind: row, gap: s, blocks: *net_price }
      - id: cards
        text: { en: "One card per plan, stacked down the screen", ar: "Card لكل باقة، فوق بعضها على الشاشة" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          height: 360
          blocks:
            - { kind: group, blocks: [{ kind: heading, text: "Lite" }, { kind: small, text: { en: "30 Mb · 140 GB · 210 EGP", ar: "30 Mb · 140 GB · 210 جنيهات" }, gap: xs }] }
            - { kind: group, gap: s, blocks: [{ kind: heading, text: "Home" }, { kind: small, text: { en: "70 Mb · 250 GB · 350 EGP", ar: "70 Mb · 250 GB · 350 جنيهًا" }, gap: xs }] }
            - { kind: group, gap: s, blocks: [{ kind: heading, text: "Max" }, { kind: small, text: { en: "100 Mb · 400 GB · 520 EGP", ar: "100 Mb · 400 GB · 520 جنيهًا" }, gap: xs }] }
            - { kind: group, gap: s, blocks: [{ kind: heading, text: "Ultra" }, { kind: small, text: { en: "200 Mb · Unlimited · 900 EGP", ar: "200 Mb · غير محدودة · 900 جنيه" }, gap: xs }] }
    answer: [table]
    misconceptions:
      - id: MC-P10-030
        when: [tabs, cards]
        feedback:
          en: "Ramy compares plans feature by feature. With one plan per tab, or cards scrolling away, he has to remember each plan's numbers. Keep the table for comparing."
          ar: "يقارن رامي الباقات ميزة بميزة. مع باقة واحدة في كل تبويب، أو Cards تختفي بالتمرير، عليه أن يتذكّر أرقام كل باقة. أبقِ الجدول للمقارنة."
    correct:
      en: "Right. Ramy can compare the plans side by side, even on a phone."
      ar: "صحيح. يستطيع رامي مقارنة الباقات جنبًا إلى جنب، حتى على الهاتف."
    explain:
      en: "When people weigh options feature by feature, a comparison table serves them best. On a phone, pin the feature names and show the table continues past the edge."
      ar: "عندما يوازن الناس بين الخيارات ميزة بميزة، يخدمهم جدول المقارنة أفضل. وعلى الهاتف، ثبّت أسماء الميزات وأظهر أن الجدول يستمر بعد الحافة."

  - id: S16
    type: tune
    skill: SK-P10-U02-08
    part: retest
    value:
      en: "Re-test, comparison tables (NN/g): these formats are for weighing options. A student looking up one exam doesn't compare; labelled cards suit looking up one item."
      ar: "إعادة اختبار، جداول المقارنة (NN/g): هذه الأشكال للموازنة بين الخيارات. أما الطالب الذي يبحث عن امتحان واحد فلا يقارن؛ والـ Cards بعناوين تناسب البحث عن عنصر واحد."
    ref: { url: "https://www.nngroup.com/articles/comparison-tables/", quote: "compensatory decision making is best served by comparison tables" }
    scenario:
      en: "Every student checks the exam timetable to find their own exams: the date, time and hall. Nobody compares exams with each other. On the laptop it's a wide table with five columns."
      ar: "يتحقّق كل طالب من جدول الامتحانات ليجد امتحاناته هو: التاريخ والموعد والقاعة. ولا أحد يقارن الامتحانات ببعضها. على الـ Laptop يظهر الجدول عريضًا بخمسة أعمدة."
    prompt:
      en: "Try each option for phones. Which one should ship?"
      ar: "جرّب كل خيار للهواتف. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: laptop", ar: "الآن: الـ Laptop" }
      frame: wide
      blocks:
        - kind: row
          blocks: &ex_head
            - { kind: small, text: { en: "Course", ar: "المادة" } }
            - { kind: small, text: { en: "Date", ar: "التاريخ" } }
            - { kind: small, text: { en: "Time", ar: "الموعد" } }
            - { kind: small, text: { en: "Hall", ar: "القاعة" } }
            - { kind: small, text: { en: "Length", ar: "المدة" } }
        - kind: row
          gap: s
          blocks: &ex_1
            - { kind: meta, text: { en: "Statistics", ar: "الإحصاء" } }
            - { kind: meta, text: { en: "Sun 10 Jan", ar: "الأحد 10 يناير" } }
            - { kind: meta, text: "09:00" }
            - { kind: meta, text: "B12" }
            - { kind: meta, text: { en: "2 h", ar: "ساعتان" } }
        - kind: row
          gap: s
          blocks: &ex_2
            - { kind: meta, text: { en: "Marketing", ar: "التسويق" } }
            - { kind: meta, text: { en: "Tue 12 Jan", ar: "الثلاثاء 12 يناير" } }
            - { kind: meta, text: "13:00" }
            - { kind: meta, text: "A04" }
            - { kind: meta, text: { en: "3 h", ar: "3 ساعات" } }
    options:
      - id: scroll
        text: { en: "Keep the wide table, and let it scroll sideways", ar: "أبقِ الجدول العريض، واجعله يتحرّك أفقيًا" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          blocks:
            - kind: group
              scroll: true
              colw: 96
              blocks:
                - { kind: row, blocks: *ex_head }
                - { kind: row, gap: s, blocks: *ex_1 }
                - { kind: row, gap: s, blocks: *ex_2 }
      - id: shrink
        text: { en: "Keep the table, and shrink the text until all five columns fit", ar: "أبقِ الجدول، وصغّر النص حتى تتّسع الأعمدة الخمسة" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          blocks:
            - kind: row
              blocks:
                - { kind: small, px: 8, text: { en: "Course", ar: "المادة" } }
                - { kind: small, px: 8, text: { en: "Date", ar: "التاريخ" } }
                - { kind: small, px: 8, text: { en: "Time", ar: "الموعد" } }
                - { kind: small, px: 8, text: { en: "Hall", ar: "القاعة" } }
                - { kind: small, px: 8, text: { en: "Length", ar: "المدة" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: small, px: 8, text: { en: "Statistics", ar: "الإحصاء" } }
                - { kind: small, px: 8, text: { en: "Sun 10 Jan", ar: "الأحد 10 يناير" } }
                - { kind: small, px: 8, text: "09:00" }
                - { kind: small, px: 8, text: "B12" }
                - { kind: small, px: 8, text: { en: "2 h", ar: "ساعتان" } }
      - id: cards
        text: { en: "One labelled card per exam: course, then date, time and hall", ar: "Card بعناوين لكل امتحان: المادة، ثم التاريخ والموعد والقاعة" }
        mock:
          caption: { en: "After this change: phone, 320 px", ar: "بعد هذا التغيير: هاتف، 320 بكسل" }
          width: 260
          blocks:
            - { kind: group, blocks: [{ kind: heading, text: { en: "Statistics", ar: "الإحصاء" } }, { kind: small, text: { en: "Sun 10 Jan · 09:00 · Hall B12 · 2 h", ar: "الأحد 10 يناير · 09:00 · القاعة B12 · ساعتان" }, gap: xs }] }
            - { kind: group, gap: s, blocks: [{ kind: heading, text: { en: "Marketing", ar: "التسويق" } }, { kind: small, text: { en: "Tue 12 Jan · 13:00 · Hall A04 · 3 h", ar: "الثلاثاء 12 يناير · 13:00 · القاعة A04 · 3 ساعات" }, gap: xs }] }
    answer: [cards]
    misconceptions:
      - id: MC-P10-030
        when: [scroll, shrink]
        feedback:
          en: "Students look up one exam; they don't compare. A sideways table hides the hall off-screen, and tiny text is hard to read. Give each exam its own labelled card."
          ar: "يبحث الطلاب عن امتحان واحد؛ ولا يقارنون. الجدول الأفقي يخفي القاعة خارج الشاشة، والنص الصغير صعب القراءة. أعطِ كل امتحان Card خاصة به بعناوين."
    correct:
      en: "Right. Each student finds their exam and reads it in one card."
      ar: "صحيح. يجد كل طالب امتحانه ويقرؤه في Card واحدة."
    explain:
      en: "Tables are for weighing options side by side. When people look up one item at a time, labelled cards show everything about that item without scrolling sideways."
      ar: "الجداول للموازنة بين الخيارات جنبًا إلى جنب. أما عندما يبحث الناس عن عنصر واحد في كل مرة، فالـ Cards بعناوين تعرض كل شيء عن ذلك العنصر دون تمرير أفقي."
