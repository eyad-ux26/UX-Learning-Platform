    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      frame: wide
      blocks:
        - kind: row
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: heading, text: &ft_t { en: "Stuffed vine leaves", ar: "ورق العنب المحشي" } }
                - { kind: small, text: &ft_s3 { en: "Step 3: Put a spoon of filling on each leaf and roll it tightly.", ar: "الخطوة 3: ضع ملعقة من الحشو على كل ورقة ولفّها بإحكام." }, gap: s }
                - { kind: small, text: &ft_s4 { en: "Step 4: Line the pot with tomato slices.", ar: "الخطوة 4: افرش قاع القدر بشرائح الطماطم." }, gap: s }
            - kind: group
              tone: plain
              blocks:
                - { kind: banner, text: &ft_a1 { en: "Ad: Non-stick pots, 25% off", ar: "إعلان: قدور غير لاصقة، خصم 25%" } }
                - { kind: banner, text: &ft_v { en: "▶ How to roll vine leaves (1 min)", ar: "▶ طريقة لف ورق العنب (دقيقة واحدة)" }, gap: s }
                - { kind: banner, text: &ft_a2 { en: "Ad: Rice, 5 kg bag", ar: "إعلان: أرز، كيس 5 كغ" }, gap: s }
    options:
      - id: label
        text: { en: "Keep it in the side column, and add a \"Video\" label above it", ar: "أبقِه في العمود الجانبي، وأضف فوقه كلمة «فيديو»" }
        mock:
