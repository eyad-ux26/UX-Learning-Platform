  # SK-P10-U02-06: code group names as real headings
  - id: S11
    type: tune
    skill: SK-P10-U02-06
    part: retest
    value:
      en: "Re-test, screen readers (NN/g): it is not enough to use large, bolded fonts that look like headings. Menu sections must be coded as headings so Hassan can jump to them."
      ar: "إعادة اختبار، قارئ الشاشة (NN/g): لا يكفي استخدام خط كبير عريض يشبه العناوين. يجب تعريف أقسام القائمة كعناوين في الكود حتى يقفز إليها حسن."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "It is not enough to use large, bolded fonts that look like headings" }
    scenario:
      en: "Hassan is blind and orders food with a screen reader. He wants desserts, so he jumps from heading to heading. The section names look like headings, but the only heading he can reach is \"Menu\"."
      ar: "حسن كفيف ويطلب الطعام باستخدام الـ Screen reader. يريد الحلويات، فينتقل من عنوان إلى عنوان. أسماء الأقسام تبدو كعناوين، لكن العنوان الوحيد الذي يصل إليه هو «القائمة»."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &hs_m { en: "Menu", ar: "القائمة" } }
        - { kind: heading, text: &hs_1 { en: "Starters", ar: "المقبّلات" }, gap: l }
        - { kind: small, text: &hs_1d { en: "Lentil soup · Fattoush", ar: "شوربة عدس · فتوش" }, gap: xs }
        - { kind: heading, text: &hs_2 { en: "Mains", ar: "الأطباق الرئيسية" }, gap: l }
        - { kind: small, text: &hs_2d { en: "Grilled chicken · Kofta", ar: "دجاج مشوي · كفتة" }, gap: xs }
        - { kind: heading, text: &hs_3 { en: "Desserts", ar: "الحلويات" }, gap: l }
        - { kind: small, text: &hs_3d { en: "Rice pudding · Basbousa", ar: "أرز باللبن · بسبوسة" }, gap: xs }
        - kind: group
          tone: tint
          gap: xl
          blocks:
            - { kind: small, text: &hs_found { en: "Headings the screen reader finds:", ar: "العناوين التي يجدها الـ Screen reader:" } }
            - { kind: meta, text: { en: "1. Menu", ar: "1. القائمة" }, gap: xs }
    options:
      - id: bigger
        text: { en: "Make the section names bigger and bolder", ar: "كبّر أسماء الأقسام واجعلها أعرض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *hs_m }
            - { kind: heading, px: 24, text: *hs_1, gap: l }
            - { kind: small, text: *hs_1d, gap: xs }
            - { kind: heading, px: 24, text: *hs_2, gap: l }
            - { kind: small, text: *hs_2d, gap: xs }
            - { kind: heading, px: 24, text: *hs_3, gap: l }
            - { kind: small, text: *hs_3d, gap: xs }
            - kind: group
              tone: tint
              gap: xl
              blocks:
                - { kind: small, text: *hs_found }
                - { kind: meta, text: { en: "1. Menu", ar: "1. القائمة" }, gap: xs }
      - id: code
        text: { en: "Mark each section name as a heading in the code (for example an h2)", ar: "عرّف اسم كل قسم كعنوان في الكود (مثلًا h2)" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *hs_m }
            - { kind: heading, text: *hs_1, gap: l }
            - { kind: small, text: *hs_1d, gap: xs }
            - { kind: heading, text: *hs_2, gap: l }
            - { kind: small, text: *hs_2d, gap: xs }
            - { kind: heading, text: *hs_3, gap: l }
            - { kind: small, text: *hs_3d, gap: xs }
            - kind: group
              tone: tint
              gap: xl
              blocks:
                - { kind: small, text: *hs_found }
                - { kind: meta, text: { en: "1. Menu  2. Starters  3. Mains  4. Desserts", ar: "1. القائمة  2. المقبّلات  3. الأطباق الرئيسية  4. الحلويات" }, gap: xs }
      - id: icons
        text: { en: "Add an icon next to each section name", ar: "أضف أيقونة بجانب اسم كل قسم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *hs_m }
            - { kind: heading, text: { en: "🥗 Starters", ar: "🥗 المقبّلات" }, gap: l }
            - { kind: small, text: *hs_1d, gap: xs }
            - { kind: heading, text: { en: "🍗 Mains", ar: "🍗 الأطباق الرئيسية" }, gap: l }
            - { kind: small, text: *hs_2d, gap: xs }
            - { kind: heading, text: { en: "🍮 Desserts", ar: "🍮 الحلويات" }, gap: l }
            - { kind: small, text: *hs_3d, gap: xs }
            - kind: group
              tone: tint
              gap: xl
              blocks:
                - { kind: small, text: *hs_found }
                - { kind: meta, text: { en: "1. Menu", ar: "1. القائمة" }, gap: xs }
    answer: [code]
    misconceptions:
      - id: MC-P10-037
        when: [bigger, icons]
        feedback:
          en: "It looks more like a heading, but the screen reader still finds only \"Menu\". A heading has to be coded as one."
          ar: "يبدو أكثر كعنوان، لكن الـ Screen reader ما زال لا يجد إلا «القائمة». يجب تعريف العنوان في الكود ليكون عنوانًا."
    correct:
      en: "Right. Hassan can now jump straight to Desserts."
      ar: "صحيح. يستطيع حسن الآن القفز مباشرة إلى الحلويات."
    explain:
      en: "Screen-reader users move by headings. Size, weight and icons only change how text looks; marking it as a heading in the code is what lets them jump to it."
      ar: "يتنقّل مستخدمو الـ Screen reader بالعناوين. الحجم والسُمك والأيقونات تغيّر شكل النص فقط؛ أما تعريفه كعنوان في الكود فهو ما يتيح لهم القفز إليه."

  - id: S12
    type: tune
    skill: SK-P10-U02-06
    part: retest
    value:
      en: "Re-test, screen readers (NN/g): it is not enough to use large, bolded fonts that look like headings. Spacing and cards show groups to the eye, not to a screen reader."
      ar: "إعادة اختبار، قارئ الشاشة (NN/g): لا يكفي استخدام خط كبير عريض يشبه العناوين. المسافات والـ Cards تُظهر المجموعات للعين، لا للـ Screen reader."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "It is not enough to use large, bolded fonts that look like headings" }
    scenario:
      en: "Ibrahim uses a screen reader to read an online shop's help page. He has a question about returns. The page has three sections, Payments, Delivery and Returns, but none of them is coded as a heading."
      ar: "يستخدم إبراهيم الـ Screen reader لقراءة صفحة المساعدة في متجر إلكتروني. لديه سؤال عن الإرجاع. في الصفحة ثلاثة أقسام: الدفع، والتوصيل، والإرجاع، لكن لا أحد منها معرّف كعنوان في الكود."
