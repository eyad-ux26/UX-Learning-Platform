id: P10-U05-L02
mode: lesson
minutes: 9
title:
  en: "Arabic and mixed-direction text"
  ar: "النص العربي والنص مختلط الاتجاه"
review_labels:
  MC-P10-070: { en: "Right-to-left doesn't mean reversing every character", ar: "من اليمين لليسار لا يعني عكس كل حرف" }
  MC-P10-071: { en: "Not every icon should be mirrored", ar: "ليست كل أيقونة تُعكس" }
  MC-P10-072: { en: "Translating the text isn't enough; the layout flows too", ar: "ترجمة النص لا تكفي؛ التخطيط يتغيّر اتجاهه أيضًا" }
  MC-P10-073: { en: "A layout check can't judge the language", ar: "فحص التخطيط لا يحكم على اللغة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "The Arabic card", ar: "البطاقة العربية" }
    body:
      en: "The team built the Arabic version of Sara's workshop card. They flipped everything to be safe, including the booking code.\n\nSara's booking code is WS-204. Look at the last line."
      ar: "بنى الفريق النسخة العربية من بطاقة ورشة سارة. وعكسوا كل شيء احتياطًا، حتى رمز الحجز.\n\nرمز حجز سارة هو WS-204. انظر إلى السطر الأخير."
    mock:
      dir: rtl
      width: 300
      caption: { en: "Arabic version", ar: "النسخة العربية" }
      blocks:
        - { kind: title, text: "صمّم تطبيقك الأول للمبادرات المجتمعية والفرق التطوعية" }
        - { kind: meta, text: "17 نوفمبر، من 18:00 إلى 20:00", gap: s }
        - { kind: meta, text: "120 جنيهًا", gap: xs }
        - { kind: button, text: "احجز مكانك في هذه الورشة", gap: m }
        - { kind: small, text: "رمز الحجز", code: "402-SW", gap: s }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "In the Arabic version, what should change direction?"
      ar: "في النسخة العربية، ما الذي يجب أن يتغيّر اتجاهه؟"
    options:
      - { id: all, text: { en: "Everything, including codes and numbers", ar: "كل شيء، بما فيه الرموز والأرقام" } }
      - { id: layout, text: { en: "The layout and the text flow, but not codes or numbers", ar: "التخطيط واتجاه النص، لكن ليس الرموز أو الأرقام" } }
      - { id: none, text: { en: "Only the words; the layout stays the same", ar: "الكلمات فقط؛ ويبقى التخطيط كما هو" } }
    reveal:
      en: "The layout and the text flow change. Codes, numbers, emails and phone numbers keep their own order. WS-204 is still WS-204 in an Arabic sentence."
      ar: "التخطيط واتجاه النص يتغيّران. أما الرموز والأرقام والبريد الإلكتروني وأرقام الهواتف فتحتفظ بترتيبها. WS-204 يبقى WS-204 داخل جملة عربية."

  - id: S03
    type: card
    part: concept
    title: { en: "Flip the flow, not the facts", ar: "اعكس الاتجاه، لا المعلومات" }
    body:
      en: "In Arabic, the page reads from right to left. So describe the layout by **start** and **end**, not left and right: the title aligns to the start, the back arrow sits at the start, progress fills from the start.\n\nSome things keep their own direction inside Arabic text: codes like WS-204, prices like EGP 120, phone numbers and emails. Mark them as separate left-to-right pieces so they stay whole and their punctuation stays put. Never reverse their characters.\n\nDon't mirror every icon. Mirror icons that point along the reading direction, like back and forward arrows. Keep icons that mean the same both ways, like a clock, a play button, a check mark or a logo.\n\nAnd a width check can't tell you if the Arabic reads naturally. Ask a native reader."
      ar: "في العربية تُقرأ الصفحة من اليمين إلى اليسار. لذلك صِف التخطيط بـ**البداية** و**النهاية**، لا باليسار واليمين: العنوان يُحاذى إلى البداية، وسهم الرجوع في البداية، والتقدّم يمتلئ من البداية.\n\nبعض الأشياء تحتفظ باتجاهها داخل النص العربي: رموز مثل WS-204، وأسعار مثل EGP 120، وأرقام الهواتف والبريد الإلكتروني. علّمها كقطع منفصلة من اليسار لليمين حتى تبقى كاملة وتبقى علامات الترقيم في مكانها. ولا تعكس حروفها أبدًا.\n\nلا تعكس كل أيقونة. اعكس الأيقونات التي تشير في اتجاه القراءة، مثل سهمي الرجوع والتقدّم. وأبقِ الأيقونات التي معناها واحد في الاتجاهين، مثل الساعة وزر التشغيل وعلامة الصح والشعار.\n\nوفحص العرض لا يخبرك إن كانت العربية تُقرأ بشكل طبيعي. اسأل قارئًا لغته الأم العربية."

  - id: S04
    type: spot
    part: guided
    rules: [R06, U49]
    prompt:
      en: "Which line of the Arabic card has the wrong meaning?"
      ar: "أي سطر في البطاقة العربية معناه خاطئ؟"
    mock:
      dir: rtl
      width: 300
      blocks:
        - { kind: title, text: "صمّم تطبيقك الأول للمبادرات المجتمعية والفرق التطوعية", region: title }
        - { kind: meta, text: "17 نوفمبر، من 18:00 إلى 20:00", gap: s, region: date }
        - { kind: meta, text: "120 جنيهًا", gap: xs, region: price }
        - { kind: button, text: "احجز مكانك في هذه الورشة", gap: m }
        - { kind: small, text: "رمز الحجز", code: "402-SW", gap: s, region: code }
    regions:
      - { id: title, label: { en: "Title", ar: "العنوان" } }
      - { id: date, label: { en: "Date and time", ar: "التاريخ والوقت" } }
      - { id: price, label: { en: "Price", ar: "السعر" } }
      - { id: code, label: { en: "Booking code", ar: "رمز الحجز" } }
    answer: [code]
    misconceptions:
      - id: MC-P10-070
        when: [title, date, price]
        feedback:
          en: "That line reads correctly. Compare the booking code with WS-204."
          ar: "هذا السطر صحيح. قارن رمز الحجز بـ WS-204."
    hints:
      - { en: "Sara will read this code to the front desk.", ar: "ستقرأ سارة هذا الرمز لموظف الاستقبال." }
    correct:
      en: "402-SW isn't Sara's code. Reversing it created a different identifier."
      ar: "402-SW ليس رمز سارة. عكسه صنع معرّفًا مختلفًا."
    explain:
      en: "A code is an identifier, not a word. It keeps its order in every language. The time range 18:00 to 20:00 also keeps its meaning."
      ar: "الرمز معرّف، لا كلمة. يحتفظ بترتيبه في كل لغة. وكذلك النطاق الزمني من 18:00 إلى 20:00 يحتفظ بمعناه."

  - id: S05
    type: sort
    part: guided
    confidence: true
    rules: [R06, R15, U49]
    prompt:
      en: "In the Arabic version, what gets mirrored and what stays the same?"
      ar: "في النسخة العربية، ما الذي يُعكس وما الذي يبقى كما هو؟"
    items:
      - { id: back, text: { en: "Back arrow", ar: "سهم الرجوع" } }
      - { id: clock, text: { en: "Clock icon", ar: "أيقونة الساعة" } }
      - { id: progress, text: { en: "Progress bar filling up", ar: "شريط التقدّم وهو يمتلئ" } }
      - { id: code, text: { en: "Booking code WS-204", ar: "رمز الحجز WS-204" } }
      - { id: align, text: { en: "Alignment of the paragraphs", ar: "محاذاة الفقرات" } }
      - { id: phone, text: { en: "Phone number 0100 123 4567", ar: "رقم الهاتف 0100 123 4567" } }
    buckets:
      - { id: mirror, label: { en: "Mirror it", ar: "يُعكس" } }
      - { id: keep, label: { en: "Keep it", ar: "يبقى كما هو" } }
    answer:
      mirror: [back, progress, align]
      keep: [clock, code, phone]
    misconceptions:
      - id: MC-P10-071
        when: { item: clock, bucket: mirror }
        feedback:
          en: "A mirrored clock runs backwards. The clock means the same in both languages, so keep it."
          ar: "الساعة المعكوسة تدور للخلف. والساعة معناها واحد في اللغتين، فأبقِها."
      - id: MC-P10-070
        when: { item: code, bucket: mirror }
        feedback:
          en: "Mirroring the code gives 402-SW, a different code. Keep it whole."
          ar: "عكس الرمز يعطي 402-SW، وهو رمز مختلف. أبقِه كاملًا."
      - id: MC-P10-070
        when: { item: phone, bucket: mirror }
        feedback:
          en: "Phone numbers are dialled in the same order everywhere. Keep them as they are."
          ar: "أرقام الهواتف تُطلب بالترتيب نفسه في كل مكان. أبقِها كما هي."
    hints:
      - { en: "Does it point along the reading direction, or does it mean the same either way?", ar: "هل يشير في اتجاه القراءة، أم أن معناه واحد في الاتجاهين؟" }
    correct:
      en: "Things that follow the reading direction mirror. Identifiers and symbols with a fixed meaning stay."
      ar: "ما يتبع اتجاه القراءة يُعكس. والمعرّفات والرموز ذات المعنى الثابت تبقى."
    explain:
      en: "In Arabic, \"back\" points right, and progress fills from the right. A clock, a code and a phone number don't have a reading direction to follow."
      ar: "في العربية يشير «الرجوع» إلى اليمين، ويمتلئ التقدّم من اليمين. أما الساعة والرمز ورقم الهاتف فليس لها اتجاه قراءة تتبعه."

  - id: S06
    type: choose
    part: guided
    rules: [R11, U49]
    prompt:
      en: "You're writing the spec for the card. How should you describe the title's alignment?"
      ar: "تكتب مواصفات البطاقة. كيف تصف محاذاة العنوان؟"
    options:
      - { id: start, text: { en: "Aligned to the start of the line", ar: "محاذاة إلى بداية السطر" } }
      - { id: left, text: { en: "Aligned left", ar: "محاذاة إلى اليسار" } }
      - { id: center, text: { en: "Centered, so it works in both languages", ar: "في المنتصف، حتى يعمل في اللغتين" } }
    answer: [start]
    misconceptions:
      - id: MC-P10-072
        when: [left]
        feedback:
          en: "Left is right for English, and wrong for Arabic. \"Start\" means left in English and right in Arabic, with one rule."
          ar: "اليسار صحيح للإنجليزية وخاطئ للعربية. «البداية» تعني اليسار في الإنجليزية واليمين في العربية، بقاعدة واحدة."
    hints:
      - { en: "Which word is true in both languages?", ar: "أي كلمة صحيحة في اللغتين؟" }
    correct:
      en: "\"Start\" works in both directions without a second spec."
      ar: "«البداية» تعمل في الاتجاهين دون مواصفات ثانية."
    explain:
      en: "Centering long text makes it harder to read in any language. Start and end keep one spec for both."
      ar: "توسيط النص الطويل يجعله أصعب في القراءة بأي لغة. أما البداية والنهاية فتُبقيان مواصفات واحدة للغتين."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, U49]
    prompt:
      en: "Both cards have the same Arabic text. Which one is laid out correctly?"
      ar: "البطاقتان فيهما النص العربي نفسه. أيّهما تخطيطها صحيح؟"
    a:
      mock:
        dir: ltr
        width: 300
        blocks:
          - { kind: title, text: "صمّم تطبيقك الأول للمبادرات المجتمعية والفرق التطوعية" }
          - { kind: meta, text: "17 نوفمبر، من 18:00 إلى 20:00", gap: s }
          - { kind: meta, text: "120 جنيهًا", gap: xs }
          - { kind: button, text: "احجز مكانك في هذه الورشة", gap: m }
          - { kind: small, text: "رمز الحجز", code: "WS-204", gap: s }
    b:
      mock:
        dir: rtl
        width: 300
        blocks:
          - { kind: title, text: "صمّم تطبيقك الأول للمبادرات المجتمعية والفرق التطوعية" }
          - { kind: meta, text: "17 نوفمبر، من 18:00 إلى 20:00", gap: s }
          - { kind: meta, text: "120 جنيهًا", gap: xs }
          - { kind: button, text: "احجز مكانك في هذه الورشة", gap: m }
          - { kind: small, text: "رمز الحجز", code: "WS-204", gap: s }
    answer: b
    misconceptions:
      - id: MC-P10-072
        when: [a]
        feedback:
          en: "In A, only the words were translated. The lines still start on the left, and look at the date and price: the numbers jumped to the wrong end of the line."
          ar: "في A تُرجمت الكلمات فقط. ما زالت الأسطر تبدأ من اليسار، وانظر إلى التاريخ والسعر: قفزت الأرقام إلى الطرف الخاطئ من السطر."
    correct:
      en: "B flows from the right, and the code is still WS-204."
      ar: "B تبدأ من اليمين، والرمز ما زال WS-204."
    explain:
      en: "Direction is set for the whole card, then the code is kept as its own left-to-right piece inside it."
      ar: "يُضبط الاتجاه للبطاقة كلها، ثم يُحفظ الرمز كقطعة مستقلة من اليسار لليمين داخلها."

  - id: S08
    type: choose
    part: independent
    rules: [R07, U49]
    prompt:
      en: "Youssef's Arabic ticket says: \"Your seat is A14 on platform 4, booking ref EG-7781.\" What should the spec say about A14 and EG-7781?"
      ar: "تذكرة يوسف بالعربية تقول: «مقعدك A14 على الرصيف 4، رقم الحجز EG-7781». ماذا يجب أن تقول المواصفات عن A14 و EG-7781؟"
    options:
      - { id: isolate, text: { en: "Keep each as a separate left-to-right piece inside the Arabic sentence", ar: "أبقِ كلًّا منهما قطعة منفصلة من اليسار لليمين داخل الجملة العربية" } }
      - { id: reverse, text: { en: "Reverse them so they read right to left like the sentence", ar: "اعكسهما ليُقرآ من اليمين لليسار مثل الجملة" } }
      - { id: nothing, text: { en: "Nothing, they'll always display fine", ar: "لا شيء، سيظهران بشكل سليم دائمًا" } }
    answer: [isolate]
    misconceptions:
      - id: MC-P10-070
        when: [reverse]
        feedback:
          en: "Reversed, EG-7781 becomes 1877-GE, and Youssef can't find his booking."
          ar: "إذا عُكس، يصبح EG-7781 هو 1877-GE، ولن يجد يوسف حجزه."
      - id: MC-P10-072
        when: [nothing]
        feedback:
          en: "Often they do, but punctuation and neighbouring numbers can jump to the wrong side. Saying so in the spec prevents it."
          ar: "غالبًا نعم، لكن علامات الترقيم والأرقام المجاورة قد تقفز إلى الجهة الخاطئة. ذكر ذلك في المواصفات يمنعه."
    hints:
      - { en: "What does Youssef do with EG-7781?", ar: "ماذا يفعل يوسف بـ EG-7781؟" }
    correct:
      en: "Isolated, each code stays whole and the sentence around it flows right to left."
      ar: "بالعزل، يبقى كل رمز كاملًا وتسير الجملة حوله من اليمين لليسار."
    explain:
      en: "A separate line for the code is also fine, as long as it's clear what the code belongs to."
      ar: "وضع الرمز في سطر منفصل مقبول أيضًا، ما دام واضحًا لمن يعود الرمز."

  - id: S09
    type: choose
    part: independent
    multi: true
    rules: [R07, U49, U59]
    prompt:
      en: "The Arabic card passes the 320px check. What can that check NOT tell you? Pick all that apply."
      ar: "البطاقة العربية تجتاز فحص 320 بكسل. ما الذي لا يستطيع هذا الفحص إخبارك به؟ اختر كل ما ينطبق."
    options:
      - { id: natural, text: { en: "Whether the Arabic reads naturally", ar: "إن كانت العربية تُقرأ بشكل طبيعي" } }
      - { id: date, text: { en: "Whether the date is written the way people expect", ar: "إن كان التاريخ مكتوبًا بالطريقة التي يتوقعها الناس" } }
      - { id: cut, text: { en: "Whether any text is cut off", ar: "إن كان أي نص مقطوعًا" } }
      - { id: font, text: { en: "Whether the letters join correctly in the chosen font", ar: "إن كانت الحروف تتّصل بشكل صحيح في الخط المختار" } }
    answer: [natural, date, font]
    misconceptions:
      - id: MC-P10-073
        when: [cut]
        feedback:
          en: "That one the width check does show. The others need a person who reads Arabic, looking at the real rendering."
          ar: "هذا بالذات يُظهره فحص العرض. أما الباقي فيحتاج شخصًا يقرأ العربية وينظر إلى العرض الفعلي."
    hints:
      - { en: "Which of these needs someone who reads Arabic?", ar: "أيّ هذه يحتاج شخصًا يقرأ العربية؟" }
    correct:
      en: "Meaning, date wording and letter shaping need a native reader. Width only tells you about fit."
      ar: "المعنى وصياغة التاريخ وتشكيل الحروف تحتاج قارئًا لغته الأم العربية. أما العرض فيخبرك عن الاتّساع فقط."
    explain:
      en: "Write those down as open questions for review instead of marking the Arabic version done."
      ar: "سجّلها أسئلةً مفتوحة للمراجعة بدل أن تعتبر النسخة العربية منتهية."

  - id: S10
    type: card
    part: recap
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- Flip the flow: describe alignment and position by start and end.\n- Keep the facts: codes, prices, phone numbers and emails keep their order as separate left-to-right pieces.\n- Mirror arrows and progress; keep clocks, check marks and logos.\n- A width check tells you about fit. A native reader tells you about meaning.\n\nNext: answering critique with a check."
      ar: "- اعكس الاتجاه: صِف المحاذاة والمواضع بالبداية والنهاية.\n- احفظ المعلومات: الرموز والأسعار وأرقام الهواتف والبريد الإلكتروني تحتفظ بترتيبها كقطع منفصلة من اليسار لليمين.\n- اعكس الأسهم والتقدّم؛ وأبقِ الساعات وعلامات الصح والشعارات.\n- فحص العرض يخبرك عن الاتّساع. والقارئ العربي يخبرك عن المعنى.\n\nالدرس التالي: الإجابة عن النقد باختبار."
