id: P10-U05-L03
mode: lesson
minutes: 8
title:
  en: "Answer critique with a check"
  ar: "أجب عن النقد باختبار"
sources:
  - title: { en: "Design Critiques: Encourage a Positive Culture to Improve Products (NN/g)", ar: "نقد التصميم: شجّع ثقافة إيجابية لتحسين المنتجات (NN/g)" }
    url: "https://www.nngroup.com/articles/design-critiques/"
  - title: { en: "Turn User Goals into Task Scenarios for Usability Testing (NN/g)", ar: "حوّل أهداف المستخدمين إلى سيناريوهات مهامّ لاختبار سهولة الاستخدام (NN/g)" }
    url: "https://www.nngroup.com/articles/task-scenarios-usability-testing/"
review_labels:
  MC-P10-075: { en: "Judge feedback against the goal", ar: "احكم على الملاحظة بمقارنتها بالهدف" }
  MC-P10-076: { en: "A senior opinion isn't evidence", ar: "رأي الأقدم ليس دليلًا" }
  MC-P10-077: { en: "A test task shouldn't give away the answer", ar: "مهمة الاختبار يجب ألا تكشف الإجابة" }
  MC-P10-083: { en: "No clues doesn't mean vague", ar: "بلا تلميحات لا يعني غامضًا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two reviewers, two opposite requests", ar: "مراجعان وطلبان متعاكسان" }
    body:
      en: "Sara's workshop page is in review. No one has tested it with users yet.\n\n**Rami:** \"Make Reserve the first thing on the page, and move the conditions below the newsletter. Less clutter.\"\n\n**Salma:** \"Show everything at the same size so nothing is missed.\"\n\nThe product owner says the goal is for people to choose a session that works for them, not to sign up for the newsletter."
      ar: "صفحة ورشة سارة قيد المراجعة. ولم يختبرها أحد مع المستخدمين بعد.\n\n**رامي:** «اجعل زر الحجز أول شيء في الصفحة، وانقل الشروط تحت النشرة. فوضى أقل».\n\n**سلمى:** «اعرض كل شيء بالحجم نفسه حتى لا يفوت أحدًا شيء».\n\nويقول مالك المنتج إن الهدف أن يختار الناس جلسة تناسبهم، لا أن يشتركوا في النشرة."
    mock:
      blocks: &page
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: xs }
        - { kind: meta, text: "@W1d", gap: xs }
        - { kind: small, text: "@W1g", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: link, text: "@W1j", gap: m }

  - id: S02
    type: tune
    skill: SK-P10-U05-06
    part: try
    rules: [R12]
    value:
      en: "Design critique (NN/g): a critique analyzes a design and gives feedback on whether it meets its objectives. Keep the part of Rami's request that serves the goal (less clutter) and drop the part that hurts it (hiding conditions)."
      ar: "نقد التصميم (NN/g): النقد يحلّل التصميم ويقدّم ملاحظات عن مدى تحقيقه أهدافه. أبقِ الجزء من طلب رامي الذي يخدم الهدف (فوضى أقل) واترك الجزء الذي يضرّه (إخفاء الشروط)."
    ref: { url: "https://www.nngroup.com/articles/design-critiques/", quote: "giving feedback on whether it meets its objectives" }
    prompt:
      en: "Try each response to Rami and see what it does to the page. Which one should ship?"
      ar: "جرّب كل ردّ على رامي، وانظر ماذا يفعل بالصفحة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: *page
    options:
      - id: accept
        text: { en: "Accept: Reserve first, the conditions under the newsletter", ar: "اقبل: زر الحجز أولًا، والشروط تحت النشرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: button, text: "@W1f" }
            - { kind: title, text: "@W1a", gap: m }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: xs }
            - { kind: link, text: "@W1j", gap: m }
            - { kind: small, text: "@W1g", gap: m }
      - id: reject
        text: { en: "Reject: \"The page follows best practice, so it stays.\"", ar: "ارفض: «الصفحة تتبع أفضل الممارسات، لذلك تبقى كما هي»." }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks: *page
      - id: adapt
        text: { en: "Adapt: move the newsletter to the very end and tighten the spacing; the conditions stay before Reserve", ar: "عدّل: انقل النشرة إلى النهاية وقلّل المسافات؛ وتبقى الشروط قبل زر الحجز" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: xs }
            - { kind: meta, text: "@W1c", gap: xs }
            - { kind: meta, text: "@W1d", gap: xs }
            - { kind: small, text: "@W1g", gap: xs }
            - { kind: button, text: "@W1f", gap: s }
            - { kind: small, color: muted, text: { en: "Want news of new workshops? Get the monthly newsletter", ar: "تريد أخبار الورش الجديدة؟ اشترك في النشرة الشهرية" }, gap: l }
    answer: [adapt]
    misconceptions:
      - id: MC-P10-075
        when: [accept]
        feedback:
          en: "Less clutter, but now Sara can book before seeing the price, and the conditions sit under an ad. That works against the goal: choosing a session that works for her."
          ar: "فوضى أقل، لكن الآن تستطيع سارة الحجز قبل أن ترى السعر، والشروط تحت إعلان. وهذا يعمل ضد الهدف: أن تختار جلسة تناسبها."
      - id: MC-P10-076
        when: [reject]
        feedback:
          en: "\"Best practice\" isn't a reason Rami can check, and his worry about clutter is fair. Keep his goal; change the way you meet it."
          ar: "«أفضل الممارسات» ليس سببًا يستطيع رامي التحقّق منه، وقلقه من الفوضى في محلّه. أبقِ هدفه؛ وغيّر طريقة تحقيقه."
    hints:
      - { en: "What does Rami really want, and what does the user need before reserving?", ar: "ماذا يريد رامي فعلًا، وماذا يحتاج المستخدم قبل الحجز؟" }
      - { en: "Is there a way to give him less clutter without moving the conditions?", ar: "هل هناك طريقة لتقليل الازدحام كما يريد دون نقل الشروط؟" }
    correct:
      en: "Keep his goal; protect the user's."
      ar: "أبقِ هدفه؛ واحمِ هدف المستخدم."
    explain:
      en: "Separate what a reviewer wants from how they suggest getting it. Rami wants a calmer page; you can give him that without moving a rule people need before they book."
      ar: "افصل بين ما يريده المراجع والطريقة التي يقترحها للوصول إليه. رامي يريد صفحة أهدأ؛ وتستطيع أن تعطيه ذلك دون نقل شرط يحتاجه الناس قبل الحجز."

  - id: S03
    type: card
    part: concept
    icons: [target, list, eye, person]
    title: { en: "From opinion to check", ar: "من الرأي إلى الاختبار" }
    body:
      en: "A design critique asks one thing: does the design meet its goals? Feedback often arrives as taste (\"too red\", \"I'd do it differently\"). Turn it into a question about the goal.\n\n- **Respond:** accept, adapt or reject, with a reason tied to the user's goal.\n- **Seniority isn't evidence:** a fair worry deserves a check, not a debate.\n- **Check with a task:** give people a short, realistic scenario and ask them to do it.\n- **No clues:** don't name the steps or the screen's labels in the task.\n- **Not vague:** the task still needs a clear goal you can check."
      ar: "نقد التصميم يسأل شيئًا واحدًا: هل يحقّق التصميم أهدافه؟ وكثيرًا ما تصل الملاحظات كذوق («أحمر جدًا»، «كنت سأفعلها بشكل آخر»). حوّلها إلى سؤال عن الهدف.\n\n- **الردّ:** اقبل أو عدّل أو ارفض، مع سبب مرتبط بهدف المستخدم.\n- **الأقدمية ليست دليلًا:** القلق المعقول يستحق اختبارًا، لا جدالًا.\n- **اختبر بمهمّة:** أعطِ الناس سيناريو قصيرًا وواقعيًا واطلب منهم تنفيذه.\n- **بلا تلميحات:** لا تذكر الخطوات ولا أسماء عناصر الشاشة في المهمّة.\n- **لا غموض:** المهمّة تحتاج مع ذلك هدفًا واضحًا تستطيع التحقّق منه."

  - id: S04
    type: tune
    skill: SK-P10-U05-06
    part: guided
    rules: [R06, R13]
    value:
      en: "Design critique (NN/g): opinionated or directive comments can be reformulated to relate them to the goals of the design. Salma's worry (people miss things) is a goal you can meet and test; equal sizes is only one way."
      ar: "نقد التصميم (NN/g): يمكن إعادة صياغة الملاحظات القائمة على الرأي أو التوجيه لربطها بأهداف التصميم. وقلق سلمى (أن يفوت الناس شيئًا) هدف تستطيع تحقيقه واختباره؛ والأحجام المتساوية طريقة واحدة فقط."
    ref: { url: "https://www.nngroup.com/articles/design-critiques/", quote: "to relate them to the goals of the design." }
    scenario:
      en: "Salma is the most senior designer on the team. She asks for every line at the same size \"so nothing is missed\"."
      ar: "سلمى أقدم مصمّمة في الفريق. وتطلب أن يكون كل سطر بالحجم نفسه «حتى لا يفوت أحدًا شيء»."
    prompt:
      en: "Try each response and see what it does to the page. Which one should ship?"
      ar: "جرّب كل ردّ، وانظر ماذا يفعل بالصفحة. أيّها يجب أن يُطلق؟"
    start: accept
    options:
      - id: accept
        text: { en: "Accept, because she's the most senior", ar: "اقبل، لأنها الأقدم" }
        mock:
          blocks:
            - { kind: text, px: 16, weight: bold, text: "@W1a" }
            - { kind: text, px: 16, weight: bold, text: "@W1b", gap: s }
            - { kind: text, px: 16, weight: bold, text: "@W1d", gap: s }
            - { kind: text, px: 16, weight: bold, text: "@W1g", gap: s }
            - { kind: text, px: 16, weight: bold, text: "@W1j", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: test
        text: { en: "Keep the sizes, make the rule readable, and offer a quick test: can five people find the cancellation rule?", ar: "أبقِ الأحجام، واجعل الشرط مقروءًا، واقترح اختبارًا سريعًا: هل يجد خمسة أشخاص شرط الإلغاء؟" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: xs }
            - { kind: text, px: 14, color: muted, text: "@W1g", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - kind: group
              tone: tint
              gap: m
              blocks:
                - { kind: small, text: { en: "Test: 5 people · \"Can you cancel if your plans change?\"", ar: "اختبار: 5 أشخاص · «هل تستطيع الإلغاء إذا تغيّرت خططك؟»" } }
      - id: argue
        text: { en: "Reject: \"Hierarchy is basic design; equal sizes are wrong.\"", ar: "ارفض: «التسلسل البصري من أساسيات التصميم؛ والأحجام المتساوية خطأ»." }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1d", gap: xs }
            - { kind: text, px: 14, color: faint, text: "@W1g", gap: s }
            - { kind: button, text: "@W1f", gap: m }
    answer: [test]
    misconceptions:
      - id: MC-P10-076
        when: [accept, argue]
        feedback:
          en: "Seniority, or a rule of thumb, decides nothing on its own. Her worry, that people miss things, is fair: fix the faint rule and check it with a quick test."
          ar: "الأقدمية، أو القاعدة العامة، لا تحسم شيئًا وحدها. وقلقها من أن يفوت الناس شيئًا في محلّه: أصلِح الشرط الباهت وتحقّق منه باختبار سريع."
    hints:
      - { en: "What is Salma worried about?", ar: "ما الذي يقلق سلمى؟" }
      - { en: "Seniority and \"it's basic\" are opinions. What would show whether people find the rule?", ar: "الأقدمية وعبارة «هذا من الأساسيات» آراء. ما الذي يُظهر إن كان الناس يجدون القاعدة؟" }
    correct:
      en: "Take the worry seriously; check it."
      ar: "خذ القلق بجدية؛ وتحقّق منه."
    explain:
      en: "Her goal is fair, and the faint rule proves it. Equal sizes is one fix; a readable rule plus a short test shows whether people really miss it, without a debate about taste."
      ar: "هدفها معقول، والشرط الباهت يثبت ذلك. والأحجام المتساوية إصلاح واحد؛ أما الشرط المقروء مع اختبار قصير فيُظهر هل يفوته الناس فعلًا، دون جدال حول الذوق."

  - id: S05
    type: tune
    skill: SK-P10-U05-07
    part: guided
    rules: [R06, R15]
    value:
      en: "Task scenarios (NN/g): step descriptions often contain hidden clues about how to use the interface; avoid repeating the screen's own labels in the task."
      ar: "سيناريوهات المهامّ (NN/g): وصف الخطوات كثيرًا ما يحمل تلميحات خفية عن طريقة استخدام الواجهة؛ فتجنّب تكرار أسماء عناصر الشاشة في المهمّة."
    ref: { url: "https://www.nngroup.com/articles/task-scenarios-usability-testing/", quote: "Step descriptions often contain hidden clues as to how to use the interface." }
    scenario:
      en: "You'll test whether people can find a session that fits them and know what happens if their plans change."
      ar: "ستختبر هل يستطيع الناس إيجاد جلسة تناسبهم ومعرفة ما يحدث إذا تغيّرت خططهم."
    prompt:
      en: "Try each task card. Which one should you give participants?"
      ar: "جرّب كل بطاقة مهمّة. أيّها يجب أن تعطيها للمشاركين؟"
    start: steps
    options:
      - id: steps
        text: { en: "Steps that use the page's labels", ar: "خطوات تستخدم أسماء عناصر الصفحة" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: { en: "Task", ar: "المهمّة" } }
                - { kind: text, text: { en: "\"Check the date, read the cancellation rule, then tap Reserve a place.\"", ar: "«تحقّق من التاريخ، واقرأ شرط الإلغاء، ثم اضغط احجز مكانك»." }, gap: xs }
      - id: scenario
        text: { en: "A short situation with a goal", ar: "موقف قصير له هدف" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: { en: "Task", ar: "المهمّة" } }
                - { kind: text, text: { en: "\"You finish work at 17:00 and want a free beginner session next week. Book one you could attend. Could you get out of it if something came up?\"", ar: "«ينتهي دوامك الساعة 17:00 وتريد جلسة مجانية للمبتدئين الأسبوع القادم. احجز جلسة تستطيع حضورها. هل يمكنك التراجع إذا طرأ شيء؟»" }, gap: xs }
      - id: explain
        text: { en: "Ask them to explain how they would book", ar: "اطلب منهم أن يشرحوا كيف سيحجزون" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: { en: "Task", ar: "المهمّة" } }
                - { kind: text, text: { en: "\"Look at this page and tell me how you would book a session.\"", ar: "«انظر إلى هذه الصفحة وأخبرني كيف ستحجز جلسة»." }, gap: xs }
    answer: [scenario]
    misconceptions:
      - id: MC-P10-077
        when: [steps]
        feedback:
          en: "It names the date, the cancellation rule and the button. You'd learn people can follow instructions, not whether the page helps them on their own."
          ar: "إنها تذكر التاريخ وشرط الإلغاء والزر. ستعرف أن الناس يتبعون التعليمات، لا هل تساعدهم الصفحة وحدها."
      - id: MC-P10-083
        when: [explain]
        feedback:
          en: "Describing what you'd do isn't doing it, and it hides where people actually get stuck. Ask them to do the task."
          ar: "وصف ما ستفعله ليس فعله، ويُخفي المكان الذي يتعثّر فيه الناس فعلًا. اطلب منهم تنفيذ المهمّة."
    hints:
      - { en: "If the task uses the page's labels, what are people really doing?", ar: "إذا استخدمت المهمة تسميات الصفحة، فماذا يفعل الناس فعلًا؟" }
      - { en: "Should people act on the page, or talk about it?", ar: "هل يجب أن يستخدم الناس الصفحة، أم يتحدّثوا عنها؟" }
    correct:
      en: "A situation and a goal, in their own words."
      ar: "موقف وهدف، بكلماتهم هم."
    explain:
      en: "A scenario gives people a reason to act, without telling them where to look. Then you watch what they do, and check their answer against the page."
      ar: "السيناريو يعطي الناس سببًا للتصرّف، دون أن يخبرهم أين ينظرون. ثم تراقب ما يفعلونه، وتقارن إجابتهم بالصفحة."

  - id: S06
    type: compare
    skill: SK-P10-U05-07
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S05: removing clues can overshoot. NN/g: avoiding clues does not mean being vague. A task needs a clear goal you can check."
      ar: "مقارنة مع الخطوة 5: حذف التلميحات قد يتجاوز الحدّ. NN/g: تجنّب التلميحات لا يعني الغموض. المهمّة تحتاج هدفًا واضحًا تستطيع التحقّق منه."
    ref: { url: "https://www.nngroup.com/articles/task-scenarios-usability-testing/", quote: "Avoiding clues does not mean being vague." }
    prompt:
      en: "Neither task names a button or label. Which one should you use?"
      ar: "لا تذكر أي من المهمّتين زرًا أو اسم عنصر. أيّهما يجب أن تستخدم؟"
    a:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: { en: "Task", ar: "المهمّة" } }
              - { kind: text, text: { en: "\"Have a look around and see what you think.\"", ar: "«تجوّل في الصفحة وقل لي رأيك»." }, gap: xs }
    b:
      mock:
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: { en: "Task", ar: "المهمّة" } }
              - { kind: text, text: { en: "\"You can only go after 17:00. Find a session that works for you and tell me its date and cost.\"", ar: "«لا يمكنك الحضور إلا بعد الساعة 17:00. اعثر على جلسة تناسبك وأخبرني بتاريخها وتكلفتها»." }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: open, text: { en: "Open tasks always give worse results", ar: "المهامّ المفتوحة تعطي دائمًا نتائج أسوأ" } }
        - { id: check, text: { en: "B has a goal and an answer you can check against the page", ar: "B فيها هدف وإجابة تستطيع مقارنتها بالصفحة" } }
        - { id: long, text: { en: "Longer tasks are clearer", ar: "المهامّ الأطول أوضح" } }
      answer: [check]
      misconceptions:
        - id: MC-P10-083
          when: [open, long]
          feedback:
            en: "Length isn't the point, and open questions have their place. B works because it gives a goal and an answer you can check: the date and the cost."
            ar: "الطول ليس المقصود، وللأسئلة المفتوحة مكانها. B تنجح لأنها تعطي هدفًا وإجابة تستطيع التحقّق منها: التاريخ والتكلفة."
    misconceptions:
      - id: MC-P10-083
        when: [a]
        feedback:
          en: "A has no clues, but no goal either. You'll hear opinions, not whether people can pick a session that fits them."
          ar: "A بلا تلميحات، لكنها بلا هدف أيضًا. ستسمع آراء، لا هل يستطيع الناس اختيار جلسة تناسبهم."
    hints:
      - { en: "Neither gives clues. Does each give a clear goal?", ar: "لا تعطي أيّ منهما تلميحات. هل تعطي كل منهما هدفًا واضحًا؟" }
      - { en: "Could a participant tell when they've finished each task?", ar: "هل يستطيع المشارك أن يعرف متى أنهى كل مهمة؟" }
    correct:
      en: "No clues, but a clear goal."
      ar: "بلا تلميحات، لكن بهدف واضح."
    explain:
      en: "S05 removed the clues; this keeps the goal. A good task gives a realistic situation and a result you can compare with the facts on the page."
      ar: "الخطوة 5 أزالت التلميحات؛ وهذه تُبقي الهدف. المهمّة الجيدة تعطي موقفًا واقعيًا ونتيجة تستطيع مقارنتها بالمعلومات في الصفحة."

  - id: S07
    type: tune
    skill: SK-P10-U05-06
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Design critique (NN/g): judge feedback on whether the design meets its objectives. The delivery screen's goal is tracking the order; the promo can stay, just not on top."
      ar: "حالة جديدة. نقد التصميم (NN/g): احكم على الملاحظة بمدى تحقيق التصميم أهدافه. وهدف شاشة التوصيل متابعة الطلب؛ ويمكن أن يبقى العرض، لكن ليس في الأعلى."
    ref: { url: "https://www.nngroup.com/articles/design-critiques/", quote: "giving feedback on whether it meets its objectives" }
    scenario:
      en: "On Lina's delivery screen, a marketing lead says: \"Put the 20% off banner at the very top. More people will order again.\" The screen's goal is to let people track their order."
      ar: "في شاشة توصيل لينا، يقول أحد مسؤولي التسويق: «ضع شريط خصم 20% في الأعلى تمامًا. سيطلب المزيد من الناس مرة أخرى». وهدف الشاشة أن يتابع الناس طلبهم."
    prompt:
      en: "Try each response and see the screen. Which one should ship?"
      ar: "جرّب كل ردّ، وانظر إلى الشاشة. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &deliv
        - { kind: title, text: "@D1a" }
        - { kind: meta, text: "@D1b", gap: s }
        - { kind: small, text: "@D1c", gap: s }
    options:
      - id: accept
        text: { en: "Accept: the banner goes at the top", ar: "اقبل: الشريط في الأعلى" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: banner, text: "@D1d" }
            - { kind: title, text: "@D1a", gap: m }
            - { kind: meta, text: "@D1b", gap: s }
            - { kind: small, text: "@D1c", gap: s }
      - id: adapt
        text: { en: "Adapt: the offer goes after the tracking details, and you'll compare reorders before and after", ar: "عدّل: العرض بعد تفاصيل التتبّع، وستقارن عدد الطلبات المتكرّرة قبل التغيير وبعده" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@D1a" }
            - { kind: meta, text: "@D1b", gap: s }
            - { kind: small, text: "@D1c", gap: s }
            - { kind: banner, text: "@D1d", gap: l }
      - id: reject
        text: { en: "Reject: \"Ads don't belong on this screen.\"", ar: "ارفض: «لا مكان للإعلانات في هذه الشاشة»." }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks: *deliv
    answer: [adapt]
    misconceptions:
      - id: MC-P10-075
        when: [accept]
        feedback:
          en: "Lina opened the screen to see when her food arrives; the banner pushes that down. Judge the request against the screen's goal."
          ar: "فتحت لينا الشاشة لتعرف متى يصل طعامها؛ والشريط يدفع ذلك إلى الأسفل. احكم على الطلب بمقارنته بهدف الشاشة."
      - id: MC-P10-076
        when: [reject]
        feedback:
          en: "More reorders is a fair business goal. You can serve it without blocking tracking, and measure whether it works."
          ar: "زيادة الطلبات المتكرّرة هدف تجاري معقول. وتستطيع خدمته دون أن تعرقل التتبّع، وقياس هل ينجح."
    hints:
      - { en: "Why does Lina open this screen?", ar: "لماذا تفتح لينا هذه الشاشة؟" }
      - { en: "Can the offer stay without pushing the tracking down, and can you check if it works?", ar: "هل يمكن أن يبقى العرض دون أن يدفع تفاصيل التتبع للأسفل، وهل يمكنك التحقّق من نجاحه؟" }
    correct:
      en: "Both goals, in the right order, with a way to check."
      ar: "الهدفان، بالترتيب الصحيح، مع طريقة للتحقّق."
    explain:
      en: "Same move as with Rami: keep the reviewer's goal, protect the user's task, and say how you'll find out whether it worked."
      ar: "الخطوة نفسها مع رامي: أبقِ هدف المراجع، واحمِ مهمّة المستخدم، وقل كيف ستعرف هل نجح ذلك."

  - id: S08
    type: card
    part: recap
    icons: [target, list, eye, person]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Judge against the goal:** adapted Rami's request instead of accepting or rejecting it whole.\n- **Seniority isn't evidence:** answered Salma's fair worry with a fix and a test.\n- **No clues:** wrote a task without the page's labels or steps.\n- **Not vague:** kept a clear goal you can check.\n\nNext: the unit skill check."
      ar: "- **احكم بمقارنة الهدف:** عدّلت طلب رامي بدل قبوله أو رفضه كله.\n- **الأقدمية ليست دليلًا:** أجبت عن قلق سلمى المعقول بإصلاح واختبار.\n- **بلا تلميحات:** كتبت مهمّة دون أسماء عناصر الصفحة أو خطواتها.\n- **لا غموض:** أبقيت هدفًا واضحًا تستطيع التحقّق منه.\n\nالتالي: اختبار مهارة الوحدة."
