id: P10-U05-L03
mode: lesson
minutes: 10
title:
  en: "Answer critique with a check"
  ar: "أجب عن النقد باختبار"
review_labels:
  MC-P10-074: { en: "A plan or a prediction isn't a result", ar: "الخطة أو التوقّع ليسا نتيجة" }
  MC-P10-075: { en: "Give the consequence, not just a principle's name", ar: "اذكر الأثر، لا اسم المبدأ فقط" }
  MC-P10-076: { en: "A senior opinion isn't evidence", ar: "رأي الأقدم ليس دليلًا" }
  MC-P10-077: { en: "A test task shouldn't give away the answer", ar: "مهمة الاختبار يجب ألا تكشف الإجابة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two reviewers, two opposite requests", ar: "مراجعان وطلبان متعاكسان" }
    body:
      en: "Sara's workshop page is in review. The facts sit beside Reserve on a laptop and before it on a phone. No one has tested it with users yet.\n\n**Rami:** \"Make Reserve the first thing on the page, and move the conditions below the newsletter. Less clutter.\"\n\n**Salma:** \"Show everything at the same size so nothing is missed.\"\n\nThe product owner says the goal is for people to choose the right session, not to sign up for the newsletter."
      ar: "صفحة ورشة سارة قيد المراجعة. المعلومات بجانب «احجز» على الحاسوب، وقبله على الهاتف. ولم يختبرها أحد مع المستخدمين بعد.\n\n**رامي:** «اجعل زر الحجز أول شيء في الصفحة، وانقل الشروط تحت النشرة البريدية. فوضى أقل».\n\n**سلمى:** «اعرض كل شيء بالحجم نفسه حتى لا يفوت أحدًا شيء».\n\nويقول مالك المنتج إن الهدف أن يختار الناس الجلسة الصحيحة، لا أن يشتركوا في النشرة."

  - id: S02
    type: predict
    part: try
    rules: [R12]
    prompt:
      en: "Before deciding how to answer Rami, work out the consequence. If the conditions move below the newsletter, what happens to Sara's decision?"
      ar: "قبل أن تقرّر كيف تردّ على رامي، احسب الأثر. إذا انتقلت الشروط تحت النشرة، ماذا يحدث لقرار سارة؟"
    options:
      - { id: same, text: { en: "Nothing: the conditions are still on the page", ar: "لا شيء: الشروط ما زالت في الصفحة" } }
      - { id: careful, text: { en: "She reads the conditions more carefully at the end", ar: "تقرأ الشروط بعناية أكبر في النهاية" } }
      - { id: late, text: { en: "She can reach Reserve before she sees the cancellation rule", ar: "قد تصل إلى «احجز» قبل أن ترى قاعدة الإلغاء" } }
    answer: [late]
    misconceptions:
      - id: MC-P10-061
        when: [same, careful]
        feedback:
          en: "Being on the page isn't enough. Below the newsletter, the rule comes after Reserve, so some people book before they know it."
          ar: "وجودها في الصفحة لا يكفي. تحت النشرة، تأتي القاعدة بعد «احجز»، فيحجز بعض الناس قبل أن يعرفوها."
    correct:
      en: "Some people would book before they know the rule."
      ar: "سيحجز بعض الناس قبل أن يعرفوا القاعدة."
    explain:
      en: "That consequence is the reason you'll give Rami, whether you accept, adapt or reject. Critique is easier to answer once you know what it does to the user's task."
      ar: "هذا الأثر هو السبب الذي ستقدّمه لرامي، سواء قبلت أو عدّلت أو رفضت. ويسهل الرد على النقد حين تعرف ما يفعله بمهمة المستخدم."
  - id: S03
    type: card
    part: concept
    icons: [ok, idea, target, search]
    title: { en: "Turn a preference into a question", ar: "حوّل التفضيل إلى سؤال" }
    body:
      en: "Feedback often arrives as taste: \"make it pop\", \"move the button up\". Translate it into the user's task: what should be easier, and what could go wrong?\n\n- **Decision:** accept, adapt or reject.\n- **Reason:** what it does for the user's goal.\n- **Expected consequence:** what you predict will happen.\n- **Check:** how you'd find out.\n\nKeep three kinds of claims apart: what you can **see in the design now**, what you **predict**, and what you've **observed** in a test. If no test has run, there are no observations yet."
      ar: "يصل النقد غالبًا على شكل ذوق: «اجعلها لافتة»، «ارفع الزر». ترجمه إلى مهمة المستخدم: ما الذي يجب أن يصبح أسهل، وما الذي قد يسوء؟\n\n- **القرار:** قبول أو تعديل أو رفض.\n- **السبب:** ما يفعله لهدف المستخدم.\n- **الأثر المتوقّع:** ما تتوقّع أن يحدث.\n- **الاختبار:** كيف ستعرف.\n\nافصل بين ثلاثة أنواع من الادعاءات: ما **تراه في التصميم الآن**، وما **تتوقّعه**، وما **لاحظته** في اختبار. وإذا لم يُجرَ أي اختبار، فلا توجد ملاحظات بعد."
  - id: S04
    type: sort
    part: guided
    confidence: true
    rules: [R06, R15, U59]
    prompt:
      en: "Sort each claim about Sara's page."
      ar: "صنّف كل ادعاء عن صفحة سارة."
    items:
      - { id: order, text: { en: "On the phone, the date comes before Reserve", ar: "على الهاتف، يأتي التاريخ قبل «احجز»" } }
      - { id: miss, text: { en: "Moving Reserve to the top will make people miss the date", ar: "نقل «احجز» إلى الأعلى سيجعل الناس يفوتهم التاريخ" } }
      - { id: loved, text: { en: "Users loved the new layout", ar: "أحبّ المستخدمون التخطيط الجديد" } }
      - { id: contrast, text: { en: "The cancellation text has 5.3:1 contrast", ar: "نص الإلغاء تباينه 5.3:1" } }
      - { id: equal, text: { en: "Equal sizes will make the date harder to find", ar: "الأحجام المتساوية ستجعل التاريخ أصعب في الإيجاد" } }
      - { id: five, text: { en: "Five people found it easy", ar: "خمسة أشخاص وجدوها سهلة" } }
    buckets:
      - { id: see, label: { en: "Can be checked in the design now", ar: "يمكن التحقّق منه في التصميم الآن" } }
      - { id: predict, label: { en: "A prediction to test", ar: "توقّع يحتاج اختبارًا" } }
      - { id: cant, label: { en: "Can't claim it: no test has run", ar: "لا يمكن ادعاؤه: لم يُجرَ اختبار" } }
    answer:
      see: [order, contrast]
      predict: [miss, equal]
      cant: [loved, five]
    misconceptions:
      - id: MC-P10-074
        when: { item: loved, bucket: see }
        feedback:
          en: "No one has used the page yet. \"Users loved it\" is an observation, and there's nothing observed."
          ar: "لم يستخدم أحد الصفحة بعد. «أحبّها المستخدمون» ملاحظة، ولا يوجد ما لوحِظ."
      - id: MC-P10-074
        when: { item: five, bucket: predict }
        feedback:
          en: "That's written as a result, not a prediction. Without a test, it's a claim you can't make."
          ar: "هذا مكتوب كنتيجة، لا كتوقّع. وبدون اختبار، فهو ادعاء لا يمكنك قوله."
      - id: MC-P10-074
        when: { item: miss, bucket: see }
        feedback:
          en: "You can see where the date is. Whether people will miss it is a prediction."
          ar: "يمكنك رؤية مكان التاريخ. أما إن كان سيفوت الناس فهذا توقّع."
    hints:
      - { en: "Could you check it by looking at the design file? If not, has anyone been tested?", ar: "هل يمكنك التحقّق منه بالنظر إلى ملف التصميم؟ وإن لم يكن، هل اختُبر أحد؟" }
    correct:
      en: "Two facts, two predictions, and two results that don't exist yet."
      ar: "معلومتان، وتوقّعان، ونتيجتان غير موجودتين بعد."
    explain:
      en: "Predictions are fine to make. Say they're predictions, and say how you'd test them."
      ar: "لا بأس بالتوقّعات. قل إنها توقّعات، وقل كيف ستختبرها."

  - id: S05
    type: choose
    part: guided
    rules: [R11, U21, U59]
    prompt:
      en: "What's the best response to Rami?"
      ar: "ما أفضل رد على رامي؟"
    options:
      - { id: reject, text: { en: "Reject: that goes against visual hierarchy principles.", ar: "رفض: هذا يخالف مبادئ الـ Visual hierarchy." } }
      - { id: accept, text: { en: "Accept: Reserve first, conditions after the newsletter.", ar: "قبول: «احجز» أولًا، والشروط بعد النشرة." } }
      - { id: adapt, text: { en: "Adapt: keep the facts before Reserve, but put Reserve right beside them on a laptop. We expect people to act sooner without missing the date. We'll check with a task.", ar: "تعديل: أبقِ المعلومات قبل «احجز»، لكن ضع «احجز» بجانبها مباشرة على الحاسوب. نتوقّع أن يتصرّف الناس أسرع دون أن يفوتهم التاريخ. وسنتحقّق بمهمة." } }
    answer: [adapt]
    misconceptions:
      - id: MC-P10-061
        when: [accept]
        feedback:
          en: "The cancellation rule would come after the newsletter, so people would book before seeing it. That works against the goal."
          ar: "ستأتي قاعدة الإلغاء بعد النشرة، فيحجز الناس قبل رؤيتها. وهذا يعاكس الهدف."
      - id: MC-P10-075
        when: [reject]
        feedback:
          en: "Naming a principle doesn't tell Rami what would go wrong. Say the consequence: people might book without seeing the date."
          ar: "ذكر اسم المبدأ لا يخبر رامي بما سيحدث من خطأ. اذكر الأثر: قد يحجز الناس دون رؤية التاريخ."
    hints:
      - { en: "Rami wants people to act faster. Can you give him that without losing the facts?", ar: "رامي يريد أن يتصرّف الناس أسرع. هل يمكنك تحقيق ذلك دون فقدان المعلومات؟" }
    correct:
      en: "You keep Rami's goal, protect the decision, and offer a way to check."
      ar: "تحتفظ بهدف رامي، وتحمي القرار، وتقترح طريقة للتحقّق."
    explain:
      en: "Adapting often works best: find what the reviewer is worried about and solve that, without breaking the user's task."
      ar: "التعديل غالبًا هو الأنجح: اعرف ما يقلق المراجع وحلّه، دون أن تكسر مهمة المستخدم."

  - id: S06
    type: choose
    part: guided
    rules: [R11, U02]
    prompt:
      en: "Salma is the most senior designer on the team. What's the best response to her request?"
      ar: "سلمى أقدم مصمّمة في الفريق. ما أفضل رد على طلبها؟"
    options:
      - { id: accept, text: { en: "Accept, she has the most experience", ar: "قبول، فلديها أكبر خبرة" } }
      - { id: reject, text: { en: "Reject, with a reason: if everything is the same size, nothing stands out, so the date is harder to find. Offer to compare both in a test if she's still concerned.", ar: "رفض مع سبب: إذا تساوت الأحجام لا يبرز شيء، فيصبح التاريخ أصعب في الإيجاد. واقترح مقارنة النسختين في اختبار إن بقي لديها قلق." } }
      - { id: ignore, text: { en: "Don't reply; the page is already fine", ar: "لا ترد؛ الصفحة جيدة أصلًا" } }
    answer: [reject]
    misconceptions:
      - id: MC-P10-076
        when: [accept]
        feedback:
          en: "Experience is worth listening to, but it isn't evidence about this page. Ask what problem she expects, then check it."
          ar: "الخبرة تستحق الإصغاء، لكنها ليست دليلًا على هذه الصفحة. اسألها عن المشكلة التي تتوقّعها، ثم تحقّق منها."
    hints:
      - { en: "What did Unit 3 say happens when everything is loud?", ar: "ماذا قالت الوحدة 3 عمّا يحدث حين يكون كل شيء بارزًا؟" }
    correct:
      en: "A clear reason, and an offer to test her concern instead of arguing about it."
      ar: "سبب واضح، وعرض لاختبار قلقها بدل الجدال حوله."
    explain:
      en: "Her worry, that people miss things, is fair. Equal sizes is one fix; a test shows whether the problem exists at all."
      ar: "قلقها من أن يفوت الناس شيئًا مشروع. الأحجام المتساوية حلّ واحد؛ والاختبار يُظهر إن كانت المشكلة موجودة أصلًا."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, U59]
    prompt:
      en: "Which task would you give a participant to test Sara's page?"
      ar: "أي مهمة ستعطيها لمشارك لاختبار صفحة سارة؟"
    a:
      mock:
        blocks:
          - kind: text
            text:
              en: "\"Check the date, then click Reserve a place.\""
              ar: "«تحقّق من التاريخ، ثم اضغط احجز مكانك»."
    b:
      mock:
        blocks:
          - kind: text
            text:
              en: "\"You can only go after 17:00. Find a workshop that works for you, and tell me its date, its cost, and what you can do if your plans change.\""
              ar: "«لا يمكنك الحضور إلا بعد الساعة 17:00. اعثر على ورشة تناسبك، وأخبرني بتاريخها وتكلفتها وما يمكنك فعله إذا تغيّرت خططك»."
    answer: b
    misconceptions:
      - id: MC-P10-077
        when: [a]
        feedback:
          en: "A tells them where to look and what to press. You'd learn they can follow instructions, not whether the page works."
          ar: "A تخبرهم أين ينظرون وماذا يضغطون. ستعرف أنهم يتبعون التعليمات، لا إن كانت الصفحة تعمل."
    correct:
      en: "B gives a real goal and lets the page do the work."
      ar: "B تعطي هدفًا حقيقيًا وتترك الصفحة تقوم بعملها."
    explain:
      en: "A good task describes the person's situation, not the screen. Then you watch what they look at, where they hesitate, and what they say back."
      ar: "المهمة الجيدة تصف موقف الشخص، لا الشاشة. ثم تراقب ما ينظر إليه، وأين يتردّد، وما يقوله في النهاية."

  - id: S08
    type: choose
    part: independent
    multi: true
    rules: [R07, U59]
    prompt:
      en: "Before running task B with five people, what should you write down? Pick all that apply."
      ar: "قبل تنفيذ المهمة B مع خمسة أشخاص، ماذا يجب أن تكتب؟ اختر كل ما ينطبق."
    options:
      - { id: facts, text: { en: "The correct answer: Tuesday 17 November, free, cancel up to 24 hours before", ar: "الإجابة الصحيحة: الثلاثاء 17 نوفمبر، مجاني، الإلغاء حتى 24 ساعة قبلها" } }
      - { id: watch, text: { en: "What to observe: the session chosen, hesitations, any help needed", ar: "ما ستراقبه: الجلسة المختارة، ولحظات التردّد، وأي مساعدة احتاجوها" } }
      - { id: rate, text: { en: "The success rate you plan to report", ar: "نسبة النجاح التي تخطّط لإعلانها" } }
      - { id: limits, text: { en: "What five people can and can't show", ar: "ما يستطيع خمسة أشخاص إظهاره وما لا يستطيعون" } }
    answer: [facts, watch, limits]
    misconceptions:
      - id: MC-P10-074
        when: [rate]
        feedback:
          en: "Deciding the result before the test turns it into a demonstration. Write what you'll observe, then report what you saw."
          ar: "تحديد النتيجة قبل الاختبار يحوّله إلى عرض توضيحي. اكتب ما ستراقبه، ثم أبلغ عمّا رأيته."
    hints:
      - { en: "How will you know if someone's answer is right?", ar: "كيف ستعرف إن كانت إجابة الشخص صحيحة؟" }
    correct:
      en: "The correct answer, what to watch, and the limits. Nothing about results yet."
      ar: "الإجابة الصحيحة، وما ستراقبه، والحدود. ولا شيء عن النتائج بعد."
    explain:
      en: "Also: a confident answer isn't a correct answer. Compare what they say with the facts you wrote down."
      ar: "وأيضًا: الإجابة الواثقة ليست بالضرورة صحيحة. قارن ما يقولونه بالمعلومات التي كتبتها."

  - id: S09
    type: choose
    part: independent
    confidence: true
    rules: [R07, U59]
    prompt:
      en: "After the five sessions, four people chose the right workshop and one hesitated over the cancellation rule. What can you honestly say?"
      ar: "بعد الجلسات الخمس، اختار أربعة أشخاص الورشة الصحيحة وتردّد واحد عند قاعدة الإلغاء. ماذا يمكنك أن تقول بصدق؟"
    options:
      - { id: rate, text: { en: "80% of users will choose correctly", ar: "80% من المستخدمين سيختارون بشكل صحيح" } }
      - { id: honest, text: { en: "In our five sessions, four chose correctly; one hesitated at the cancellation rule, so we'll look at its wording", ar: "في جلساتنا الخمس، اختار أربعة بشكل صحيح؛ وتردّد واحد عند قاعدة الإلغاء، لذا سنراجع صياغتها" } }
      - { id: proven, text: { en: "The design is proven to work", ar: "ثبت أن التصميم يعمل" } }
    answer: [honest]
    misconceptions:
      - id: MC-P10-074
        when: [rate, proven]
        feedback:
          en: "Five sessions can show you problems. They can't tell you a percentage for all users, or prove the design works."
          ar: "خمس جلسات يمكن أن تكشف لك المشكلات. لكنها لا تعطيك نسبة لكل المستخدمين، ولا تثبت أن التصميم يعمل."
    hints:
      - { en: "What did you actually see?", ar: "ماذا رأيت فعلًا؟" }
    correct:
      en: "Report what you saw, with the numbers, and what you'll do next."
      ar: "أبلغ عمّا رأيته، بالأرقام، وبما ستفعله بعد ذلك."
    explain:
      en: "Small tests are for finding problems to fix. Keep a short decision log: what changed, why, and what would make you change it again."
      ar: "الاختبارات الصغيرة لاكتشاف المشكلات لإصلاحها. احتفظ بسجل قرارات قصير: ما الذي تغيّر، ولماذا، وما الذي سيجعلك تغيّره مرة أخرى."

  - id: S10
    type: card
    part: recap
    icons: [idea, ok, layers, search]
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- Turn a preference into a question about the user's task.\n- Respond with a decision, a reason, an expected consequence and a check. Accept, adapt or reject can all be right.\n- Keep what you can see, what you predict, and what you observed apart.\n- Test tasks describe a situation, not a screen. Report what you saw, not what you hoped.\n\nNext: the unit skill check."
      ar: "- حوّل التفضيل إلى سؤال عن مهمة المستخدم.\n- ردّ بقرار وسبب وأثر متوقّع واختبار. القبول والتعديل والرفض قد تكون كلها صحيحة.\n- افصل بين ما تراه، وما تتوقّعه، وما لاحظته.\n- مهام الاختبار تصف موقفًا، لا شاشة. وأبلغ عمّا رأيته، لا عمّا تمنّيته.\n\nالتالي: اختبار مهارة الوحدة."
