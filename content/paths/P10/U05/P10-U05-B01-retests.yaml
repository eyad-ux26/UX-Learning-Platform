id: P10-U05-B01
mode: bank
title:
  en: "Re-tests: real text, real languages, real feedback"
  ar: "إعادة اختبار: نص حقيقي، ولغات حقيقية، وملاحظات حقيقية"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Which Comes First? Layout or Content? (NN/g)", ar: "أيهما أولًا: التخطيط أم المحتوى؟ (NN/g)" }
    url: "https://www.nngroup.com/articles/layout-vs-content/"
  - title: { en: "International Usability: Big Stuff the Same, Details Differ (NN/g)", ar: "سهولة الاستخدام الدولية: الأساسيات واحدة والتفاصيل تختلف (NN/g)" }
    url: "https://www.nngroup.com/articles/international-usability-details-differ/"
  - title: { en: "Design Critiques: Encourage a Positive Culture to Improve Products (NN/g)", ar: "نقد التصميم: شجّع ثقافة إيجابية لتحسين المنتجات (NN/g)" }
    url: "https://www.nngroup.com/articles/design-critiques/"
  - title: { en: "Turn User Goals into Task Scenarios for Usability Testing (NN/g)", ar: "حوّل أهداف المستخدمين إلى سيناريوهات مهام لاختبار سهولة الاستخدام (NN/g)" }
    url: "https://www.nngroup.com/articles/task-scenarios-usability-testing/"
steps:
  # SK-P10-U05-01: let boxes grow with real text
  - id: S01
    type: tune
    skill: SK-P10-U05-01
    part: retest
    value:
      en: "Re-test, layout vs. content (NN/g): scaling issues appear when the content doesn't match the space it goes into. Fix the box, not the words."
      ar: "إعادة اختبار، التخطيط مقابل المحتوى (NN/g): تظهر مشكلات التحجيم عندما لا يناسب المحتوى المساحة التي يوضع فيها. أصلح الصندوق، لا الكلمات."
    ref: { url: "https://www.nngroup.com/articles/layout-vs-content/", quote: "Scaling issues appear when the content size does not match the space that it needs to go into." }
    scenario:
      en: "Lobna lists upcoming conferences in an app. Each card has a fixed height and a one-line title, so long titles are cut off."
      ar: "تعرض لبنى المؤتمرات القادمة في تطبيق. لكل بطاقة ارتفاع ثابت وعنوان من سطر واحد، فتُقطع العناوين الطويلة."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - kind: group
          height: 96
          blocks:
            - { kind: heading, nowrap: true, text: &lb_t { en: "Renewable Energy and Water Conference for North Africa", ar: "مؤتمر الطاقة المتجدّدة والمياه في شمال أفريقيا" } }
            - { kind: meta, nowrap: true, text: &lb_m { en: "12–14 May · International Convention Centre, Nasr City", ar: "12–14 مايو · مركز المؤتمرات الدولي، مدينة نصر" }, gap: s }
            - { kind: button, emphasis: low, text: &lb_b { en: "Register", ar: "سجّل" }, gap: s }
    options:
      - id: shorten
        text: { en: "Shorten the title so it fits: \"Energy Conference\"", ar: "اختصر العنوان حتى يتّسع: «مؤتمر الطاقة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: group
              height: 96
              blocks:
                - { kind: heading, nowrap: true, text: { en: "Energy Conference", ar: "مؤتمر الطاقة" } }
                - { kind: meta, nowrap: true, text: *lb_m, gap: s }
                - { kind: button, emphasis: low, text: *lb_b, gap: s }
      - id: grow
        text: { en: "Let the title and place wrap, and the card grow to fit", ar: "دع العنوان والمكان يلتفّان، والبطاقة تكبر لتتّسع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: *lb_t }
                - { kind: meta, text: *lb_m, gap: s }
                - { kind: button, emphasis: low, text: *lb_b, gap: s }
      - id: tap
        text: { en: "Keep one line with \"…\"; the full title shows when people tap the card", ar: "أبقِ سطرًا واحدًا مع «…»؛ ويظهر العنوان كاملًا عند الضغط على البطاقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: group
              height: 96
              blocks:
                - { kind: heading, nowrap: true, text: *lb_t }
                - { kind: meta, nowrap: true, text: *lb_m, gap: s }
                - { kind: small, color: muted, text: { en: "Tap for details", ar: "اضغط للتفاصيل" }, gap: xs }
    answer: [grow]
    misconceptions:
      - id: MC-P10-069
        when: [shorten]
        feedback:
          en: "\"Energy Conference\" drops what makes this one different: water, and North Africa. Don't cut the facts to fit the box; change the box."
          ar: "«مؤتمر الطاقة» يُسقط ما يميّز هذا المؤتمر: المياه، وشمال أفريقيا. لا تقطع المعلومات لتناسب الصندوق؛ غيّر الصندوق."
      - id: MC-P10-068
        when: [tap]
        feedback:
          en: "People choose from the list, so they need the full title there. Hiding it behind a tap makes them open every card to compare."
          ar: "يختار الناس من القائمة، فيحتاجون العنوان كاملًا فيها. إخفاؤه خلف ضغطة يجعلهم يفتحون كل بطاقة ليقارنوا."
    correct:
      en: "Right. The text stays whole; the card makes room."
      ar: "صحيح. يبقى النص كاملًا؛ والبطاقة تفسح له المكان."
    explain:
      en: "Real titles vary in length. A card that grows with its content works for the shortest and the longest, without cutting a fact."
      ar: "تختلف العناوين الحقيقية في طولها. البطاقة التي تكبر مع محتواها تعمل مع الأقصر والأطول، دون قطع أي معلومة."

  - id: S02
    type: tune
    skill: SK-P10-U05-01
    part: retest
    value:
      en: "Re-test, layout vs. content (NN/g): debugging layouts during design saves copyfitting time and redesign money later. An address box must fit real, long addresses."
      ar: "إعادة اختبار، التخطيط مقابل المحتوى (NN/g): إصلاح التخطيط أثناء التصميم يوفّر وقت ضبط النصوص وتكلفة إعادة التصميم لاحقًا. صندوق العنوان يجب أن يتّسع للعناوين الحقيقية الطويلة."
    ref: { url: "https://www.nngroup.com/articles/layout-vs-content/", quote: "Debugging layouts during design will save a lot of copyfitting time and redesign money later." }
    scenario:
      en: "Ehab checks his order before paying. The delivery address sits in a fixed-height box, and his long address ends in \"…\", so he can't confirm the flat number."
      ar: "يراجع إيهاب طلبه قبل الدفع. عنوان التوصيل في صندوق بارتفاع ثابت، وعنوانه الطويل ينتهي بـ «…»، فلا يستطيع التأكّد من رقم الشقة."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: heading, text: &eh_h { en: "Deliver to", ar: "التوصيل إلى" } }
        - kind: group
          height: 44
          gap: xs
          blocks:
            - { kind: meta, nowrap: true, text: &eh_a { en: "22 Mostafa El Nahas St., 8th District, Nasr City, building 4, floor 7, flat 73", ar: "22 شارع مصطفى النحاس، الحي الثامن، مدينة نصر، عمارة 4، الدور 7، شقة 73" } }
        - { kind: button, text: &eh_b { en: "Pay 340 EGP", ar: "ادفع 340 جنيهًا" }, gap: m }
    options:
      - id: wrap
        text: { en: "Let the address wrap, and the box grow with it", ar: "دع العنوان يلتفّ، والصندوق يكبر معه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *eh_h }
            - kind: group
              gap: xs
              blocks:
                - { kind: meta, text: *eh_a }
            - { kind: button, text: *eh_b, gap: m }
      - id: abbrev
        text: { en: "Abbreviate the address so it fits: \"22 M. Nahas, 8th D., NC, B4/F7/73\"", ar: "اختصر العنوان حتى يتّسع: «22 م. النحاس، ح8، م.ن، ع4/د7/73»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *eh_h }
            - kind: group
              height: 44
              gap: xs
              blocks:
                - { kind: meta, nowrap: true, text: { en: "22 M. Nahas, 8th D., NC, B4/F7/73", ar: "22 م. النحاس، ح8، م.ن، ع4/د7/73" } }
            - { kind: button, text: *eh_b, gap: m }
      - id: scroll
        text: { en: "Keep the box's height, and let the address scroll inside it", ar: "أبقِ ارتفاع الصندوق، ودع العنوان يتحرّك بالتمرير داخله" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *eh_h }
            - kind: group
              height: 44
              gap: xs
              blocks:
                - { kind: meta, text: *eh_a }
            - { kind: small, color: muted, text: { en: "Scroll inside the box to see more", ar: "مرّر داخل الصندوق لترى المزيد" }, gap: xs }
            - { kind: button, text: *eh_b, gap: s }
    answer: [wrap]
    misconceptions:
      - id: MC-P10-069
        when: [abbrev]
        feedback:
          en: "It fits, but Ehab has to decode it, and so does the driver. Changing the words to fit the box makes the most important line the hardest to check."
          ar: "إنه يتّسع، لكن على إيهاب أن يفكّ رموزه، وكذلك السائق. تغيير الكلمات لتناسب الصندوق يجعل أهم سطر هو الأصعب في المراجعة."
      - id: MC-P10-068
        when: [scroll]
        feedback:
          en: "A tiny scrolling box still hides most of the address, and few people notice they can scroll it. Let the box fit the text."
          ar: "صندوق صغير بتمرير داخلي ما زال يُخفي معظم العنوان، وقليلون ينتبهون أنه يمكن تمريره. اجعل الصندوق يناسب النص."
    correct:
      en: "Right. The whole address, readable before he pays."
      ar: "صحيح. العنوان كاملًا، مقروءًا قبل أن يدفع."
    explain:
      en: "Testing with a long real address during design shows the box is too small, long before an order goes to the wrong flat."
      ar: "الاختبار بعنوان حقيقي طويل أثناء التصميم يكشف أن الصندوق صغير، قبل وقت طويل من وصول طلب إلى الشقة الخطأ."

  # SK-P10-U05-02: leave room for translated labels
  - id: S03
    type: tune
    skill: SK-P10-U05-02
    part: retest
    value:
      en: "Re-test, international usability (NN/g): leave room for labels and hints to grow by at least 50%. A label column sized for \"Email\" can't hold its Arabic translation."
      ar: "إعادة اختبار، سهولة الاستخدام الدولية (NN/g): اترك مساحة لتكبر العناوين والتلميحات بنسبة 50% على الأقل. عمود عناوين بحجم «Email» لا يتّسع لترجمتها العربية."
    ref: { url: "https://www.nngroup.com/articles/international-usability-details-differ/", quote: "leave room for labels and hints to grow by at least 50%" }
    scenario:
      en: "Soha designed a sign-up form with a narrow label column, sized for \"Email\" and \"Phone\". In the Arabic version, the first label is cut."
      ar: "صمّمت سهى نموذج تسجيل فيه عمود عناوين ضيق، بحجم «Email» و«Phone». في النسخة العربية، العنوان الأول مقطوع."
    prompt:
      en: "Try each fix for the Arabic form. Which one should ship?"
      ar: "جرّب كل حل للنموذج العربي. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      dir: rtl
      width: 280
      blocks:
        - kind: row
          blocks:
            - { kind: meta, text: "البريد الإلكت…" }
            - { kind: field, text: "name@mail.com" }
        - kind: row
          gap: s
          blocks:
            - { kind: meta, text: "الهاتف" }
            - { kind: field, text: "01X XXXX XXXX" }
    options:
      - id: short
        text: { en: "Change the Arabic label to just \"البريد\" (\"Mail\")", ar: "غيّر العنوان العربي إلى «البريد» فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - kind: row
              blocks:
                - { kind: meta, text: "البريد" }
                - { kind: field, text: "name@mail.com" }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: "الهاتف" }
                - { kind: field, text: "01X XXXX XXXX" }
      - id: tiny
        text: { en: "Use a smaller font for the Arabic labels", ar: "استخدم خطًا أصغر للعناوين العربية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - kind: row
              blocks:
                - { kind: text, px: 9, text: "البريد الإلكتروني" }
                - { kind: field, text: "name@mail.com" }
            - kind: row
              gap: s
              blocks:
                - { kind: text, px: 9, text: "الهاتف" }
                - { kind: field, text: "01X XXXX XXXX" }
      - id: above
        text: { en: "Put each label above its field, with room to grow", ar: "ضع كل عنوان فوق حقله، مع مساحة ليكبر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - { kind: field, label: "البريد الإلكتروني", text: "name@mail.com" }
            - { kind: field, label: "الهاتف", text: "01X XXXX XXXX", gap: s }
    answer: [above]
    misconceptions:
      - id: MC-P10-069
        when: [short]
        feedback:
          en: "\"البريد\" alone can mean a postal address, so people may type the wrong thing. Give the full label room instead of changing the words."
          ar: "«البريد» وحدها قد تعني العنوان البريدي، فقد يكتب الناس شيئًا خطأ. أعطِ العنوان الكامل مساحة بدل تغيير الكلمات."
      - id: MC-P10-078
        when: [tiny]
        feedback:
          en: "It fits, but the labels are now too small to read comfortably. Arabic needs the same readable size as English."
          ar: "إنه يتّسع، لكن العناوين صارت أصغر من أن تُقرأ براحة. العربية تحتاج الحجم المقروء نفسه الذي تحتاجه الإنجليزية."
    correct:
      en: "Right. Every label fits, in full, at a readable size."
      ar: "صحيح. كل عنوان يتّسع، كاملًا، بحجم مقروء."
    explain:
      en: "Translations often run longer than English. Labels above fields can grow freely, so the same form works in every language."
      ar: "الترجمات غالبًا أطول من الإنجليزية. العناوين فوق الحقول يمكن أن تكبر بحرية، فيعمل النموذج نفسه بكل اللغات."

  - id: S04
    type: tune
    skill: SK-P10-U05-02
    part: retest
    value:
      en: "Re-test, international usability (NN/g): leave room for labels and hints to grow by at least 50%. A one-line toast sized for English cuts the longer Arabic message."
      ar: "إعادة اختبار، سهولة الاستخدام الدولية (NN/g): اترك مساحة لتكبر العناوين والتلميحات بنسبة 50% على الأقل. رسالة تأكيد من سطر واحد بحجم الإنجليزية تقطع الرسالة العربية الأطول."
    ref: { url: "https://www.nngroup.com/articles/international-usability-details-differ/", quote: "leave room for labels and hints to grow by at least 50%" }
    scenario:
      en: "Medhat saves a hotel to his favorites. A short message slides up to confirm it. It was sized for \"Saved to favorites\", and the Arabic message is cut."
      ar: "يحفظ مدحت فندقًا في المفضّلة. تظهر رسالة قصيرة للتأكيد. صُمّمت بحجم «Saved to favorites»، فانقطعت الرسالة العربية."
    prompt:
      en: "Try each fix for the Arabic message. Which one should ship?"
      ar: "جرّب كل حل للرسالة العربية. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      dir: rtl
      width: 280
      blocks:
        - { kind: title, text: "فندق شاطئ الفيروز" }
        - { kind: meta, text: "الغردقة · 2,900 جنيه لليلة", gap: s }
        - { kind: banner, nowrap: true, text: "تمّت إضافة الفندق إلى قائمة المفضّلة", gap: l }
    options:
      - id: done
        text: { en: "Change the Arabic message to just \"تمّ\" (\"Done\")", ar: "غيّر الرسالة العربية إلى «تمّ» فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - { kind: title, text: "فندق شاطئ الفيروز" }
            - { kind: meta, text: "الغردقة · 2,900 جنيه لليلة", gap: s }
            - { kind: banner, text: "تمّ", gap: l }
      - id: grow
        text: { en: "Let the message wrap onto two lines when it needs to", ar: "دع الرسالة تلتفّ إلى سطرين عند الحاجة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - { kind: title, text: "فندق شاطئ الفيروز" }
            - { kind: meta, text: "الغردقة · 2,900 جنيه لليلة", gap: s }
            - { kind: banner, text: "تمّت إضافة الفندق إلى قائمة المفضّلة", gap: l }
      - id: tiny
        text: { en: "Use a smaller font for the Arabic message", ar: "استخدم خطًا أصغر للرسالة العربية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          dir: rtl
          width: 280
          blocks:
            - { kind: title, text: "فندق شاطئ الفيروز" }
            - { kind: meta, text: "الغردقة · 2,900 جنيه لليلة", gap: s }
            - { kind: banner, px: 9, text: "تمّت إضافة الفندق إلى قائمة المفضّلة", gap: l }
    answer: [grow]
    misconceptions:
      - id: MC-P10-069
        when: [done]
        feedback:
          en: "\"Done\" doesn't say what happened, and it now says less than the English. Give the message room instead of cutting its words."
          ar: "«تمّ» لا تقول ماذا حدث، وصارت تقول أقل من الإنجليزية. أعطِ الرسالة مساحة بدل قطع كلماتها."
      - id: MC-P10-078
        when: [tiny]
        feedback:
          en: "It fits, but a message that disappears in a few seconds is now the hardest text on screen to read."
          ar: "إنها تتّسع، لكن رسالة تختفي خلال ثوانٍ صارت أصعب نص في الشاشة قراءةً."
    correct:
      en: "Right. The full message, at a readable size."
      ar: "صحيح. الرسالة كاملة، بحجم مقروء."
    explain:
      en: "Messages, buttons and hints all grow in translation. Planning for at least 50% more room means every language says the same thing."
      ar: "الرسائل والأزرار والتلميحات كلها تكبر عند الترجمة. التخطيط لمساحة أكبر بنسبة 50% على الأقل يعني أن كل لغة تقول الشيء نفسه."

  # SK-P10-U05-03: design with real content
  - id: S05
    type: tune
    skill: SK-P10-U05-03
    part: retest
    value:
      en: "Re-test, layout vs. content (NN/g): use placeholders only if you have to. Test the profile header with the longest real names, in both languages."
      ar: "إعادة اختبار، التخطيط مقابل المحتوى (NN/g): استخدم النصوص المؤقّتة فقط عند الضرورة. اختبر رأس الملف الشخصي بأطول الأسماء الحقيقية، باللغتين."
    ref: { url: "https://www.nngroup.com/articles/layout-vs-content/", quote: "Use placeholders only if you have to" }
    scenario:
      en: "Abeer designs the profile header for a clinic app. Patients' real names can be long, in English and in Arabic. She wants to test the header before handoff."
      ar: "تصمّم عبير رأس الملف الشخصي لتطبيق عيادة. أسماء المرضى الحقيقية قد تكون طويلة، بالإنجليزية والعربية. وتريد اختبار الرأس قبل التسليم."
    prompt:
      en: "Try each test name. Which one should she test with?"
      ar: "جرّب كل اسم للاختبار. أيّها يجب أن تختبر به؟"
    start: placeholder
    options:
      - id: longest
