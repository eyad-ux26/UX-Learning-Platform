id: P10-U05
free: false
title:
  en: "Let real words stretch it"
  ar: "دع الكلمات الحقيقية تختبره"
skill:
  en: "Keep a layout working with long text, Arabic and mixed-direction content, and answer critique with a check instead of an opinion."
  ar: "حافظ على عمل التخطيط مع النصوص الطويلة والعربية والمحتوى مختلط الاتجاه، وأجب عن النقد باختبار لا برأي."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U05-01
    title: { en: "Let boxes grow with real text", ar: "دع الصناديق تكبر مع النص الحقيقي" }
    can_do: { en: "When long text doesn't fit, fix the container, not the words: let the text wrap and the box grow.", ar: "عندما لا يتّسع النص الطويل، أصلح الحاوية لا الكلمات: دع النص يلتفّ والصندوق يكبر." }
  - id: SK-P10-U05-02
    title: { en: "Leave room for translated labels", ar: "اترك مساحة للعناوين المترجمة" }
    can_do: { en: "Size buttons and labels so a translation up to 50% longer still fits.", ar: "اضبط حجم الأزرار والعناوين بحيث تتّسع لترجمة أطول بنسبة تصل إلى 50%." }
  - id: SK-P10-U05-03
    title: { en: "Design with real content", ar: "صمّم بمحتوى حقيقي" }
    can_do: { en: "Test layouts with real, longest-case text, and tighten wording only when every fact stays.", ar: "اختبر التخطيط بنصوص حقيقية وبأطول الحالات، واختصر الصياغة فقط عندما تبقى كل المعلومات." }
  - id: SK-P10-U05-04
    title: { en: "Mirror the layout for Arabic", ar: "اعكس التخطيط للعربية" }
    can_do: { en: "Mirror direction-based patterns for right-to-left languages, and keep the whole screen consistent.", ar: "اعكس الأنماط المرتبطة بالاتجاه في اللغات التي تُكتب من اليمين إلى اليسار، وحافظ على اتساق الشاشة كلها." }
  - id: SK-P10-U05-05
    title: { en: "Keep codes and numbers in their order", ar: "أبقِ الرموز والأرقام بترتيبها" }
    can_do: { en: "Don't mirror content such as codes and phone numbers: they keep their left-to-right order.", ar: "لا تعكس المحتوى مثل الرموز وأرقام الهواتف: فهي تحتفظ بترتيبها من اليسار إلى اليمين." }
  - id: SK-P10-U05-06
    title: { en: "Answer critique with the design's goal", ar: "أجب عن النقد بهدف التصميم" }
    can_do: { en: "Reply to feedback by tying it to the screen's goal and a quick check, not to taste.", ar: "ردّ على الملاحظات بربطها بهدف الشاشة وباختبار سريع، لا بالذوق." }
  - id: SK-P10-U05-07
    title: { en: "Write test tasks without clues", ar: "اكتب مهام اختبار بلا تلميحات" }
    can_do: { en: "Write a usability task as a situation with a checkable goal, without the screen's own labels.", ar: "اكتب مهمة اختبار الاستخدام كموقف بهدف يمكن التحقّق منه، دون كلمات الشاشة نفسها." }
