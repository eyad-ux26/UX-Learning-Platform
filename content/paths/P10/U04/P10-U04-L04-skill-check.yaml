id: P10-U04-L04
mode: check
minutes: 7
title:
  en: "Skill check: keep the meaning on a small screen"
  ar: "اختبار المهارة: احفظ المعنى على الشاشة الصغيرة"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Dalia's hotel", ar: "فندق داليا" }
    body:
      en: "Dalia is booking two nights at a hotel in Aswan. On a laptop, the page has a gallery and a rewards offer on one side, and the booking panel on the other.\n\nYour job: help the team make it work on her phone.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "تحجز داليا ليلتين في فندق بأسوان. على الحاسوب المحمول، في الصفحة معرض صور وعرض مكافآت في جانب، ولوحة الحجز في الجانب الآخر.\n\nمهمتك: ساعد الفريق على جعلها تعمل على هاتفها.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      frame: wide
      caption: { en: "Laptop, 1280 px", ar: "حاسوب محمول، 1280 بكسل" }
      blocks:
        - { kind: title, text: "@H1a" }
        - kind: row
          gap: m
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: image, size: m, text: "@H1f" }
                - { kind: link, text: "@H1g", gap: s }
            - kind: group
              blocks:
                - { kind: meta, text: "@H1b" }
                - { kind: meta, weight: bold, text: "@H1c", gap: xs }
                - { kind: small, text: "@H1d", gap: s }
                - { kind: button, text: "@H1e", gap: m }

  - id: S02
    type: sort
    part: check
    rules: [R19, U35]
    prompt:
      en: "On the phone, what must stay visible, and what can be collapsed or moved to the end?"
      ar: "على الهاتف، ما الذي يجب أن يبقى ظاهرًا، وما الذي يمكن طيّه أو نقله إلى النهاية؟"
    items:
      - { id: H1f, text: "@H1f" }
      - { id: H1b, text: "@H1b" }
      - { id: H1e, text: "@H1e" }
      - { id: H1g, text: "@H1g" }
      - { id: H1c, text: "@H1c" }
      - { id: H1d, text: "@H1d" }
    buckets:
      - { id: keep, label: { en: "Stays visible", ar: "يبقى ظاهرًا" } }
      - { id: later, label: { en: "Can wait", ar: "يمكنه الانتظار" } }
    answer:
      keep: [H1b, H1c, H1d, H1e]
      later: [H1f, H1g]
    misconceptions:
      - id: MC-P10-061
        when: { item: H1d, bucket: later }
        feedback:
          en: "Free cancellation is part of the decision. Many people only book because they can cancel."
          ar: "الإلغاء المجاني جزء من القرار. كثيرون لا يحجزون إلا لأنهم يستطيعون الإلغاء."
      - id: MC-P10-061
        when: { item: H1c, bucket: later }
        feedback:
          en: "The total price is the main fact Dalia decides with. It never goes behind a tap."
          ar: "السعر الإجمالي هو الحقيقة الأساسية التي تقرّر بها داليا. لا يُخفى أبدًا خلف ضغطة."
    explain:
      en: "Dates, total, cancellation and Book now decide the booking. The gallery and the rewards club are nice to have."
      ar: "التواريخ والإجمالي والإلغاء و«احجز الآن» تحسم الحجز. أما معرض الصور ونادي المكافآت فإضافات لطيفة."

  - id: S03
    type: order
    part: check
    rules: [R19, U29]
    prompt:
      en: "Put the page in a reading order that works stacked on a phone and read aloud."
      ar: "رتّب الصفحة بترتيب قراءة يعمل حين تتراصّ على الهاتف وحين تُقرأ بصوت عالٍ."
    items:
      - { id: H1e, text: "@H1e" }
      - { id: H1g, text: "@H1g" }
      - { id: H1c, text: "@H1c" }
      - { id: H1a, text: "@H1a" }
      - { id: H1f, text: "@H1f" }
      - { id: H1b, text: "@H1b" }
      - { id: H1d, text: "@H1d" }
    answer: [H1a, H1b, H1c, H1d, H1e, H1f, H1g]
    also_ok:
      - { answer: [H1a, H1b, H1c, H1e, H1d, H1f, H1g], feedback: { en: "Also fine: the cancellation rule right after Book now.", ar: "مقبول أيضًا: قاعدة الإلغاء بعد «احجز الآن» مباشرة." } }
      - { answer: [H1a, H1b, H1c, H1d, H1e, H1g, H1f], feedback: { en: "Also fine: the two optional items can go in either order.", ar: "مقبول أيضًا: العنصران الاختياريان بأي ترتيب." } }
      - { answer: [H1a, H1b, H1c, H1e, H1d, H1g, H1f], feedback: { en: "Also fine: the facts lead and the extras come last.", ar: "مقبول أيضًا: الحقائق أولًا والإضافات في النهاية." } }
      - { answer: [H1a, H1c, H1b, H1d, H1e, H1f, H1g], feedback: { en: "Also fine: total before dates.", ar: "مقبول أيضًا: الإجمالي قبل التواريخ." } }
    misconceptions:
      - id: MC-P10-066
        when: { before: [H1e, H1c] }
        feedback:
          en: "Book now comes before the price, so Dalia is asked to commit before she knows the total."
          ar: "«احجز الآن» يأتي قبل السعر، فيُطلب من داليا الالتزام قبل أن تعرف الإجمالي."
    explain:
      en: "What it is, the facts, the action, then the extras. That order survives the phone, the keyboard and the screen reader."
      ar: "ما هو، ثم الحقائق، ثم الإجراء، ثم الإضافات. هذا الترتيب يصمد على الهاتف ومع لوحة المفاتيح وقارئ الشاشة."

  - id: S04
    type: match
    part: check
    rules: [R19, U47]
    prompt:
      en: "With a 16px gutter on each side, how wide is the content on each screen?"
      ar: "مع هامش 16 بكسل في كل جانب، ما عرض المحتوى على كل شاشة؟"
    left:
      - { id: w1024, text: { en: "1024 px screen", ar: "شاشة 1024 بكسل" } }
      - { id: w412, text: { en: "412 px screen", ar: "شاشة 412 بكسل" } }
      - { id: w320, text: { en: "320 px screen", ar: "شاشة 320 بكسل" } }
    right:
      - { id: c992, text: { en: "992 px", ar: "992 بكسل" } }
      - { id: c396, text: { en: "396 px", ar: "396 بكسل" } }
      - { id: c380, text: { en: "380 px", ar: "380 بكسل" } }
      - { id: c288, text: { en: "288 px", ar: "288 بكسل" } }
    answer: { w1024: c992, w412: c380, w320: c288 }
    misconceptions:
      - id: MC-P10-064
        when: { left: w412, right: c396 }
        feedback:
          en: "396 subtracts only one gutter. 412 − 32 = 380."
          ar: "396 تطرح هامشًا واحدًا فقط. 412 − 32 = 380."
    explain:
      en: "Screen width minus 32. On the smallest screen, Dalia's whole booking has to fit in 288px."
      ar: "عرض الشاشة ناقص 32. على أصغر شاشة، يجب أن يتّسع حجز داليا كله في 288 بكسل."

  - id: S05
    type: choose
    part: check
    multi: true
    rules: [R19, U47]
    prompt:
      en: "Two columns need at least 664px of content: 360 for the main column, 280 for the booking panel, and a 24px gap. Which screens can have two columns? Pick all that apply."
      ar: "يحتاج العمودان إلى 664 بكسل من المحتوى على الأقل: 360 للعمود الرئيسي، و280 للوحة الحجز، وفاصل 24 بكسل. أي الشاشات يمكن أن يكون فيها عمودان؟ اختر كل ما ينطبق."
    options:
      - { id: w1024, text: { en: "1024 px (992 content)", ar: "1024 بكسل (محتوى 992)" } }
      - { id: w768, text: { en: "768 px (736 content)", ar: "768 بكسل (محتوى 736)" } }
      - { id: w412, text: { en: "412 px (380 content)", ar: "412 بكسل (محتوى 380)" } }
    answer: [w1024, w768]
    explain:
      en: "992 and 736 are both at least 664. At 380, the booking panel alone would barely fit, so stack."
      ar: "992 و736 كلاهما 664 على الأقل. أما عند 380 فبالكاد تتّسع لوحة الحجز وحدها، لذا رتّبها عموديًا."

  - id: S06
    type: spot
    part: check
    rules: [R19, U47]
    prompt:
      en: "At 320px, which part of the booking breaks?"
      ar: "عند 320 بكسل، أي جزء من الحجز ينكسر؟"
    mock:
      width: 230
      caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
      blocks:
        - { kind: title, text: "@H1a", region: title }
        - { kind: meta, nowrap: true, text: "@H1i", gap: s, region: dates }
        - { kind: meta, weight: bold, text: "@H1c", gap: xs, region: total }
        - { kind: button, text: "@H1e", gap: m, region: book }
    regions:
      - { id: title, label: "@H1a" }
      - { id: dates, label: "@H1i" }
      - { id: total, label: "@H1c" }
      - { id: book, label: "@H1e" }
    answer: [dates]
    misconceptions:
      - id: MC-P10-063
        when: [title, total, book]
        feedback:
          en: "That one fits. Look for text that's been cut off."
          ar: "هذا العنصر يتّسع. ابحث عن نص مقطوع."
    explain:
      en: "The dates were set to stay on one line and got cut off. Dalia can't see which nights she's booking. Let it wrap."
      ar: "التواريخ مضبوطة لتبقى في سطر واحد فانقطعت. لا ترى داليا الليالي التي تحجزها. اتركها تلتف."

  - id: S07
    type: compare
    part: check
    rules: [R19, U35]
    prompt:
      en: "Which phone version keeps Dalia's decision intact?"
      ar: "أي نسخة للهاتف تحفظ قرار داليا كاملًا؟"
    a:
      mock:
        caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
        blocks:
          - { kind: title, text: "@H1a" }
          - { kind: meta, text: "@H1b", gap: s }
          - { kind: meta, weight: bold, text: "@H1c", gap: xs }
          - { kind: small, text: "@H1d", gap: s }
          - { kind: button, text: "@H1e", gap: m }
          - { kind: link, text: "@H1f", gap: m }
          - { kind: link, text: "@H1g", gap: s }
    b:
      mock:
        caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
        blocks:
          - { kind: title, text: "@H1a" }
          - { kind: image, size: l, text: "@H1f", gap: s }
          - { kind: meta, text: "@H1b", gap: s }
          - { kind: link, text: "@H1h", gap: s }
          - { kind: button, text: "@H1e", gap: m }
    answer: a
    misconceptions:
      - id: MC-P10-061
        when: [b]
        feedback:
          en: "B keeps the big gallery and hides the total and the cancellation rule behind a link. Those are what Dalia decides with."
          ar: "B تحتفظ بمعرض الصور الكبير وتخفي الإجمالي وقاعدة الإلغاء خلف رابط. وهذه ما تقرّر به داليا."
    explain:
      en: "A keeps every fact on screen, puts Book now right after them, and moves the gallery and rewards to the end."
      ar: "A تُبقي كل الحقائق على الشاشة، وتضع «احجز الآن» بعدها مباشرة، وتنقل المعرض والمكافآت إلى النهاية."

  - id: S08
    type: choose
    part: check
    rules: [R19, U29]
    prompt:
      en: "The team kept the old code, with the gallery and rewards first, and used CSS to move them to the end on phones. Does that fix the order for a screen reader?"
      ar: "أبقى الفريق الكود القديم، حيث المعرض والمكافآت أولًا، واستخدم CSS لنقلهما إلى النهاية على الهواتف. هل يصلح ذلك الترتيب لقارئ الشاشة؟"
    options:
      - { id: no, text: { en: "No, the screen reader still follows the code", ar: "لا، قارئ الشاشة ما زال يتبع الكود" } }
      - { id: yes, text: { en: "Yes, it follows what's on screen", ar: "نعم، يتبع ما على الشاشة" } }
    answer: [no]
    misconceptions:
      - id: MC-P10-067
        when: [yes]
        feedback:
          en: "CSS moves things for the eyes only. The reading order stays the code order."
          ar: "CSS ينقل العناصر للعين فقط. ويبقى ترتيب القراءة هو ترتيب الكود."
    explain:
      en: "Fix the order in the code, then the phone, the keyboard and the screen reader agree."
      ar: "أصلح الترتيب في الكود، فيتّفق الهاتف ولوحة المفاتيح وقارئ الشاشة."

  - id: S09
    type: choose
    part: check
    rules: [R19, U47, U48]
    prompt:
      en: "A teammate checked the page on their 412px phone and says, \"Mobile is done.\" What else should be checked first?"
      ar: "تحقّق أحد الزملاء من الصفحة على هاتفه بعرض 412 بكسل وقال: «انتهينا من الهاتف». ما الذي يجب التحقق منه أولًا أيضًا؟"
    options:
      - { id: range, text: { en: "320px, the width where the columns switch, and enlarged text", ar: "عرض 320 بكسل، والعرض الذي يتغيّر عنده عدد الأعمدة، والنص المكبّر" } }
      - { id: nothing, text: { en: "Nothing, 412px is a common phone size", ar: "لا شيء، 412 بكسل مقاس هاتف شائع" } }
      - { id: brand, text: { en: "The same width on a different phone brand", ar: "العرض نفسه على هاتف من شركة أخرى" } }
    answer: [range]
    misconceptions:
      - id: MC-P10-063
        when: [nothing, brand]
        feedback:
          en: "One width is one screenshot. Check the narrow end, the switch point, and enlarged text."
          ar: "عرض واحد يعني لقطة شاشة واحدة. تحقّق من الطرف الضيّق، ونقطة التحوّل، والنص المكبّر."
    explain:
      en: "A layout lives across a range. 320px and the switch point are where it most often breaks."
      ar: "التخطيط يعيش عبر مدى من العروض. وعرض 320 بكسل ونقطة التحوّل هما أكثر ما ينكسر عنده."
