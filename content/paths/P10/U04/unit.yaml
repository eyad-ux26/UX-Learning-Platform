id: P10-U04
free: false
title:
  en: "Keep the meaning on a small screen"
  ar: "حافظ على المعنى في الشاشة الصغيرة"
skill:
  en: "Change a layout from wide to narrow so every needed fact stays readable, in an order that still makes sense."
  ar: "غيّر التخطيط من العريض إلى الضيّق بحيث تبقى كل معلومة ضرورية مقروءة، وبترتيب منطقي."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U04-01
    title: { en: "Rearrange the layout at every width", ar: "أعد ترتيب التخطيط عند كل عرض" }
    can_do: { en: "Turn columns into one column, let rows wrap on narrow phones, and hand off how each breakpoint changes.", ar: "حوّل الأعمدة إلى عمود واحد، ودع الصفوف تلتفّ على الهواتف الضيّقة، ووضّح للمطوّرين كيف يتغيّر التخطيط عند كل Breakpoint." }
  - id: SK-P10-U04-02
    title: { en: "Put what people need first on a phone", ar: "ضع ما يحتاجه الناس أولًا على الهاتف" }
    can_do: { en: "Order the single column by what people need, not by how the wide columns sat.", ar: "رتّب العمود الواحد حسب ما يحتاجه الناس، لا حسب ترتيب الأعمدة العريضة." }
  - id: SK-P10-U04-03
    title: { en: "Give the same information on every device", ar: "قدّم المعلومات نفسها على كل جهاز" }
    can_do: { en: "Hide or shrink only secondary items on small screens, never facts people need.", ar: "أخفِ أو صغّر العناصر الثانوية فقط على الشاشات الصغيرة، لا المعلومات التي يحتاجها الناس." }
  - id: SK-P10-U04-04
    title: { en: "Keep related content together on wide screens", ar: "أبقِ المحتوى المترابط معًا على الشاشات العريضة" }
    can_do: { en: "When a layout grows, keep critical, related content in the same view instead of spreading it out.", ar: "عندما يتّسع التخطيط، أبقِ المحتوى المهم والمترابط في المساحة نفسها بدل أن تبعثره." }
  - id: SK-P10-U04-05
    title: { en: "Check it's usable, not just that it fits", ar: "تحقّق أنه قابل للاستخدام، لا أنه يتّسع فقط" }
    can_do: { en: "Judge a narrow layout by whether people can still read and use it, not only by whether anything overflows.", ar: "احكم على التخطيط الضيّق بقدرة الناس على قراءته واستخدامه، لا بمجرد أن شيئًا لا يخرج عن الشاشة." }
  - id: SK-P10-U04-06
    title: { en: "Fix the reading order in the code", ar: "صحّح ترتيب القراءة في الكود" }
    can_do: { en: "Put content in a code order that makes sense read aloud, with each label next to its value.", ar: "ضع المحتوى بترتيب في الكود يكون منطقيًا عند قراءته بصوت عالٍ، وكل عنوان بجانب قيمته." }
