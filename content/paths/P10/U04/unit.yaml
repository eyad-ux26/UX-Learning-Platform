id: P10-U04
free: false
title:
  en: "Keep the meaning on a small screen"
  ar: "حافظ على المعنى في الشاشة الصغيرة"
skill:
  en: "Change a layout from wide to narrow so every needed fact stays readable, in an order that still makes sense."
  ar: "غيّر التخطيط من العريض إلى الضيّق بحيث تبقى كل معلومة ضرورية مقروءة، وبترتيب منطقي."
