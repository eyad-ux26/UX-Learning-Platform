            - { kind: button, text: *yz_b, gap: m }
      - id: firstonly
        text: { en: "Show only the first class date, to keep it short", ar: "اعرض موعد الحصة الأولى فقط، حتى تبقى قصيرة" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: *yz_t }
