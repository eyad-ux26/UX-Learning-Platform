          ar: "تحتاج ياسمين كل المواعيد لتعرف هل تستطيع حضورها كلها. إرسالها إلى الكمبيوتر، أو عرض موعد واحد، يُخفي المعلومة التي تقرّر بها. غيّر الشكل، وأبقِ المعلومات."
    correct:
      en: "Right. A different shape, the same facts."
      ar: "صحيح. شكل مختلف، والمعلومات نفسها."
    explain:
      en: "The table was just one way to show the dates. On a phone, a list carries the same six dates in a shape that fits, so Yasmin can decide right there."
      ar: "الجدول كان مجرد طريقة لعرض المواعيد. على الهاتف، تحمل القائمة المواعيد الستة نفسها بشكل يتّسع، فتستطيع ياسمين أن تقرّر في مكانها."

  # SK-P10-U04-04: keep related content together on wide screens
  - id: S07
    type: tune
    skill: SK-P10-U04-04
    part: retest
    value:
      en: "Re-test, content dispersion (NN/g): keep critical, related content grouped together in the same viewport. A stretched or centred phone column spreads it out on a laptop."
      ar: "إعادة اختبار، تشتّت المحتوى (NN/g): أبقِ المحتوى المهم والمترابط مجمّعًا في الشاشة نفسها. عمود الهاتف الممطوط أو الموضوع في المنتصف يشتّته على الـ Laptop."
    ref: { url: "https://www.nngroup.com/articles/content-dispersion/", quote: "Keep critical, related content grouped together in the same viewport." }
    scenario:
      en: "A used-car site was designed phone first. Sayed browses it on his laptop, and the team must decide how a car's page should look there."
      ar: "صُمّم موقع سيارات مستعملة للهاتف أولًا. يتصفّحه سيد على الـ Laptop، وعلى الفريق أن يقرّر كيف تبدو صفحة السيارة هناك."
    prompt:
      en: "Try each laptop layout. Which one should ship?"
      ar: "جرّب كل تخطيط للـ Laptop. أيّها يجب أن يُطلق؟"
    start: stretch
    options:
      - id: stretch
        text: { en: "The phone column, stretched to full width", ar: "عمود الهاتف، ممطوطًا بكامل العرض" }
        mock:
          frame: wide
          blocks:
            - { kind: image, size: l, height: 200, text: &sy_i { en: "Car photos", ar: "صور السيارة" } }
            - { kind: title, text: &sy_t { en: "2019 hatchback · 1.6 L", ar: "هاتشباك 2019 · 1.6 لتر" }, gap: m }
            - { kind: meta, weight: bold, text: &sy_p { en: "640,000 EGP", ar: "640,000 جنيه" }, gap: s }
      - id: centre
        text: { en: "The phone column, centred at phone width", ar: "عمود الهاتف في المنتصف بعرض الهاتف" }
        mock:
          frame: wide
          blocks:
            - kind: row
              blocks:
                - { kind: divider }
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: image, size: m, text: *sy_i }
                    - { kind: title, text: *sy_t, gap: s }
                    - { kind: meta, weight: bold, text: *sy_p, gap: s }
                    - { kind: meta, text: &sy_k { en: "68,000 km · Automatic", ar: "68,000 كم · أوتوماتيك" }, gap: xs }
                    - { kind: button, text: &sy_b { en: "Contact the seller", ar: "تواصل مع البائع" }, gap: m }
                - { kind: divider }
      - id: cols
        text: { en: "Two columns: the photos beside the price, details and Contact", ar: "عمودان: الصور بجانب السعر والتفاصيل والتواصل" }
        mock:
          frame: wide
          blocks:
            - kind: row
              blocks:
                - { kind: image, size: l, text: *sy_i }
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: title, text: *sy_t }
                    - { kind: meta, weight: bold, text: *sy_p, gap: s }
                    - { kind: meta, text: *sy_k, gap: xs }
                    - { kind: button, text: *sy_b, gap: m }
    answer: [cols]
    misconceptions:
      - id: MC-P10-065
        when: [stretch, centre]
        feedback:
          en: "Both reuse the phone layout. Stretched, the photos fill the screen and the details fall out of view; centred, the page stays long and most of the laptop is empty. Rearrange for the wide screen."
          ar: "كلاهما يعيد استخدام تخطيط الهاتف. عند المطّ، تملأ الصور الشاشة وتسقط التفاصيل خارجها؛ وفي المنتصف، تبقى الصفحة طويلة ومعظم الـ Laptop فارغ. أعِد الترتيب للشاشة العريضة."
    correct:
      en: "Right. Photos and the facts Sayed needs, in one view."
      ar: "صحيح. الصور والمعلومات التي يحتاجها سيد، في شاشة واحدة."
    explain:
      en: "Responsive works both ways. On a wide screen, related things go side by side, so Sayed can look at the car, its price and its mileage without scrolling."
      ar: "التصميم المتجاوب يعمل في الاتجاهين. على الشاشة العريضة، توضع الأشياء المترابطة جنبًا إلى جنب، فيستطيع سيد أن يرى السيارة وسعرها وعدد كيلومتراتها دون تمرير."

  - id: S08
    type: tune
    skill: SK-P10-U04-04
    part: retest
    value:
      en: "Re-test, content dispersion (NN/g): keep critical, related content grouped together in the same viewport. The doctor and her free times belong in one view; the map can wait."
