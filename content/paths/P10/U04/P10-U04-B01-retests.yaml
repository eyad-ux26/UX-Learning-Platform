                    - { kind: meta, text: &nm_1 { en: "Departs 08:15", ar: "الإقلاع 08:15" }, gap: xs }
                    - { kind: meta, text: &nm_2 { en: "Lands 11:40", ar: "الهبوط 11:40" }, gap: xs }
