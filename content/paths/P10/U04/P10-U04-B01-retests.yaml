                    - { kind: meta, text: { en: "Departs, 08:15", ar: "الإقلاع، 08:15" }, gap: xs }
                    - { kind: meta, text: { en: "Lands, 11:40", ar: "الهبوط، 11:40" }, gap: xs }
                    - { kind: meta, text: { en: "Gate, B7", ar: "البوابة، B7" }, gap: xs }
      - id: bold
        text: { en: "Keep the code, and make the labels bold so they stand out", ar: "أبقِ الكود، واجعل العناوين بخط Bold حتى تبرز" }
        mock:
