id: P10-U04-B01
mode: bank
title:
  en: "Re-tests: one design, every screen"
  ar: "إعادة اختبار: تصميم واحد لكل الشاشات"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Responsive Web Design (RWD) and User Experience (NN/g)", ar: "التصميم المتجاوب وتجربة المستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/responsive-web-design-definition/"
  - title: { en: "The Negative Impact of Mobile-First Web Design on Desktop (NN/g)", ar: "الأثر السلبي لتصميم الهاتف أولًا على شاشات الكمبيوتر (NN/g)" }
    url: "https://www.nngroup.com/articles/content-dispersion/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "صعوبات مستخدمي الـ Screen reader على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
steps:
  # SK-P10-U04-01: rearrange the layout at every width
  - id: S01
    type: tune
    skill: SK-P10-U04-01
    part: retest
    value:
      en: "Re-test, responsive (NN/g): in responsive design, page elements reshuffle as the viewport shrinks. Two columns on a laptop become one column on a phone, at normal text sizes."
      ar: "إعادة اختبار، التصميم المتجاوب (NN/g): في التصميم المتجاوب تُعاد ترتيب عناصر الصفحة كلما صغرت الشاشة. العمودان على الـ Laptop يصبحان عمودًا واحدًا على الهاتف، بأحجام نص عادية."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "In responsive design, page elements reshuffle as the viewport grows or shrinks." }
    scenario:
      en: "Mostafa runs a recipe site. On the laptop, the ingredients sit in a column on the left and the steps on the right. Now the page needs to work on phones."
      ar: "يدير مصطفى موقع وصفات. على الـ Laptop، المكوّنات في عمود على اليسار والخطوات على اليمين. والآن يجب أن تعمل الصفحة على الهواتف."
    prompt:
      en: "Try each way of fitting the page on a phone. Which one should ship?"
      ar: "جرّب كل طريقة لعرض الصفحة على الهاتف. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now: laptop", ar: "الآن: الـ Laptop" }
      frame: wide
      blocks:
        - { kind: title, text: &ms_t { en: "Lentil soup", ar: "شوربة العدس" } }
        - kind: row
          gap: s
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: heading, text: &ms_ih { en: "Ingredients", ar: "المكوّنات" } }
                - { kind: meta, text: &ms_i1 { en: "1 cup red lentils", ar: "كوب عدس أحمر" }, gap: xs }
                - { kind: meta, text: &ms_i2 { en: "1 onion, 1 carrot", ar: "بصلة وجزرة" }, gap: xs }
                - { kind: meta, text: &ms_i3 { en: "1 tsp cumin", ar: "ملعقة صغيرة كمّون" }, gap: xs }
            - kind: group
              blocks:
                - { kind: heading, text: &ms_sh { en: "Steps", ar: "الخطوات" } }
                - { kind: meta, text: &ms_s1 { en: "1. Fry the onion until soft.", ar: "1. قلّب البصل حتى يذبل." }, gap: xs }
                - { kind: meta, text: &ms_s2 { en: "2. Add lentils, carrot and 5 cups of water.", ar: "2. أضف العدس والجزر و5 أكواب ماء." }, gap: xs }
                - { kind: meta, text: &ms_s3 { en: "3. Cook 25 min, then blend.", ar: "3. اطهُ 25 دقيقة، ثم اخلط." }, gap: xs }
    options:
      - id: scale
        text: { en: "Scale the whole laptop page down to fit", ar: "صغّر صفحة الـ Laptop كلها حتى تتّسع" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: text, px: 9, weight: bold, text: *ms_t }
            - kind: row
              gap: xs
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: text, px: 6, weight: bold, text: *ms_ih }
                    - { kind: text, px: 5, text: *ms_i1, gap: xs }
                    - { kind: text, px: 5, text: *ms_i2, gap: xs }
                    - { kind: text, px: 5, text: *ms_i3, gap: xs }
                - kind: group
                  blocks:
                    - { kind: text, px: 6, weight: bold, text: *ms_sh }
                    - { kind: text, px: 5, text: *ms_s1, gap: xs }
                    - { kind: text, px: 5, text: *ms_s2, gap: xs }
                    - { kind: text, px: 5, text: *ms_s3, gap: xs }
      - id: squeeze
        text: { en: "Keep both columns, each half the phone's width", ar: "أبقِ العمودين، كلٌّ بنصف عرض الهاتف" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: *ms_t }
            - kind: row
              gap: s
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: heading, text: *ms_ih }
                    - { kind: meta, text: *ms_i1, gap: xs }
                    - { kind: meta, text: *ms_i2, gap: xs }
                    - { kind: meta, text: *ms_i3, gap: xs }
                - kind: group
                  blocks:
                    - { kind: heading, text: *ms_sh }
                    - { kind: meta, text: *ms_s1, gap: xs }
                    - { kind: meta, text: *ms_s2, gap: xs }
                    - { kind: meta, text: *ms_s3, gap: xs }
      - id: stack
        text: { en: "One column at full width: ingredients, then steps, at normal sizes", ar: "عمود واحد بكامل العرض: المكوّنات، ثم الخطوات، بأحجام عادية" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: *ms_t }
            - { kind: heading, text: *ms_ih, gap: s }
            - { kind: meta, text: *ms_i1, gap: xs }
            - { kind: meta, text: *ms_i2, gap: xs }
            - { kind: meta, text: *ms_i3, gap: xs }
            - { kind: heading, text: *ms_sh, gap: m }
            - { kind: meta, text: *ms_s1, gap: xs }
            - { kind: meta, text: *ms_s2, gap: xs }
            - { kind: meta, text: *ms_s3, gap: xs }
    answer: [stack]
    misconceptions:
      - id: MC-P10-060
        when: [scale, squeeze]
        feedback:
          en: "Scaled down, the text is too small to read while cooking. Squeezed, every step breaks into a few words per line. A phone needs a new arrangement, not a smaller copy."
          ar: "عند التصغير، يصبح النص أصغر من أن يُقرأ أثناء الطبخ. وعند الضغط، تنقسم كل خطوة إلى كلمات قليلة في كل سطر. الهاتف يحتاج ترتيبًا جديدًا، لا نسخة أصغر."
    correct:
      en: "Right. One column, at a size people can read."
      ar: "صحيح. عمود واحد، بحجم يستطيع الناس قراءته."
    explain:
      en: "The columns stack: first what to buy, then what to do. Each line keeps a normal size and enough width to read in one go."
      ar: "يتراصّ العمودان: أولًا ما تشتريه، ثم ما تفعله. ويحتفظ كل سطر بحجم عادي وبعرض كافٍ ليُقرأ دفعة واحدة."

  - id: S02
    type: tune
    skill: SK-P10-U04-01
    part: retest
    value:
      en: "Re-test, responsive (NN/g): page elements reshuffle as the viewport shrinks. On a narrower phone, a row of buttons should wrap, not shrink or run off the edge."
      ar: "إعادة اختبار، التصميم المتجاوب (NN/g): تُعاد ترتيب عناصر الصفحة كلما صغرت الشاشة. على هاتف أضيق، يجب أن يلتفّ صف الأزرار، لا أن يصغر أو يخرج عن الحافة."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "page elements reshuffle as the viewport grows or shrinks" }
    scenario:
      en: "Shaimaa looks for a restaurant on a small 320px phone. The row of filters fits on the designer's bigger phone, but here the last one runs off the screen."
      ar: "تبحث شيماء عن مطعم على هاتف صغير بعرض 320px. صف الفلاتر يتّسع على هاتف المصمّم الأكبر، لكن هنا يخرج آخرها عن الشاشة."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: 320 px", ar: "الآن: 320 بكسل" }
      width: 240
      blocks:
        - { kind: title, text: &sh_t { en: "Restaurants near you", ar: "مطاعم قريبة منك" } }
        - kind: row
          gap: s
          blocks:
            - { kind: button, nowrap: true, text: &sh_a { en: "All", ar: "الكل" } }
            - { kind: button, nowrap: true, emphasis: low, text: &sh_o { en: "Open now", ar: "مفتوح الآن" } }
            - { kind: button, nowrap: true, emphasis: low, text: &sh_d { en: "Free delivery", ar: "توصيل مجاني" } }
        - { kind: meta, text: &sh_r { en: "Koshary El Tahrir · 0.4 km", ar: "كشري التحرير · 0.4 كم" }, gap: m }
    options:
      - id: tiny
        text: { en: "Shrink the button text to 10px so all three fit", ar: "صغّر نص الأزرار إلى 10px حتى تتّسع الثلاثة" }
        mock:
          caption: { en: "After this change: 320 px", ar: "بعد هذا التغيير: 320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: *sh_t }
            - kind: row
              gap: s
              blocks:
                - { kind: button, px: 10, text: *sh_a }
                - { kind: button, px: 10, emphasis: low, text: *sh_o }
                - { kind: button, px: 10, emphasis: low, text: *sh_d }
            - { kind: meta, text: *sh_r, gap: m }
      - id: wrap
        text: { en: "Let the buttons wrap onto a second line when they don't fit", ar: "دع الأزرار تلتفّ إلى سطر ثانٍ حين لا تتّسع" }
        mock:
          caption: { en: "After this change: 320 px", ar: "بعد هذا التغيير: 320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: *sh_t }
            - kind: row
              gap: s
              blocks:
                - { kind: button, text: *sh_a }
                - { kind: button, emphasis: low, text: *sh_o }
            - { kind: button, emphasis: low, text: *sh_d, gap: xs }
            - { kind: meta, text: *sh_r, gap: m }
      - id: keep
        text: { en: "Keep it; it looks right on the phone we designed for", ar: "أبقِها؛ فهي تبدو صحيحة على الهاتف الذي صمّمنا له" }
        mock:
          caption: { en: "After this change: 320 px", ar: "بعد هذا التغيير: 320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: *sh_t }
            - kind: row
              gap: s
              blocks:
                - { kind: button, nowrap: true, text: *sh_a }
                - { kind: button, nowrap: true, emphasis: low, text: *sh_o }
                - { kind: button, nowrap: true, emphasis: low, text: *sh_d }
            - { kind: meta, text: *sh_r, gap: m }
    answer: [wrap]
    misconceptions:
      - id: MC-P10-060
        when: [tiny]
        feedback:
          en: "10px text fits, but it's hard to read and the buttons get harder to tap. Rearrange the row instead of shrinking it."
          ar: "النص بحجم 10px يتّسع، لكن يصعب قراءته ويصبح الضغط على الأزرار أصعب. أعِد ترتيب الصف بدل تصغيره."
      - id: MC-P10-063
        when: [keep]
        feedback:
          en: "One phone isn't every phone. On Shaimaa's 320px screen the filter she needs is cut off. Plan what happens when the row doesn't fit."
          ar: "هاتف واحد ليس كل الهواتف. على شاشة شيماء بعرض 320px، الفلتر الذي تحتاجه مقطوع. خطّط لما يحدث حين لا يتّسع الصف."
    correct:
      en: "Right. The row wraps, and every filter stays whole."
      ar: "صحيح. يلتفّ الصف، ويبقى كل فلتر كاملًا."
    explain:
      en: "Narrow screens need the layout to change, not the text to shrink. Wrapping keeps every button readable and easy to tap, on any width."
      ar: "الشاشات الضيقة تحتاج أن يتغيّر التخطيط، لا أن يصغر النص. الالتفاف يُبقي كل زر مقروءًا وسهل الضغط، على أي عرض."

  # SK-P10-U04-02: put what people need first on a phone
  - id: S03
    type: tune
    skill: SK-P10-U04-02
    part: retest
    value:
      en: "Re-test, prioritization (NN/g): smart content prioritization helps users find what they need more efficiently. The laptop's column order isn't the phone's priority order."
      ar: "إعادة اختبار، ترتيب الأولويات (NN/g): الترتيب الذكي للمحتوى يساعد المستخدمين على إيجاد ما يحتاجونه بكفاءة أكبر. ترتيب أعمدة الـ Laptop ليس ترتيب الأولويات على الهاتف."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "Smart content prioritization helps users find what they need more efficiently." }
    scenario:
      en: "Gamal looks at a job ad on his phone. On the laptop, a long \"About the company\" column sits on the left, and the salary, place and Apply button sit on the right."
      ar: "يتصفّح جمال إعلان وظيفة على هاتفه. على الـ Laptop، عمود طويل «عن الشركة» على اليسار، والراتب والمكان وزر التقديم على اليمين."
    prompt:
      en: "Try each phone order. Which one should ship?"
      ar: "جرّب كل ترتيب للهاتف. أيّها يجب أن يُطلق؟"
    start: inherit
    options:
      - id: needs
        text: { en: "Job title, salary and place, then Apply, then About the company", ar: "المسمّى الوظيفي والراتب والمكان، ثم التقديم، ثم «عن الشركة»" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: &gm_t { en: "Junior accountant", ar: "محاسب مبتدئ" } }
            - { kind: meta, weight: bold, text: &gm_s { en: "9,000 to 11,000 EGP a month", ar: "من 9,000 إلى 11,000 جنيه شهريًا" }, gap: s }
            - { kind: meta, text: &gm_p { en: "Nasr City · Full time", ar: "مدينة نصر · دوام كامل" }, gap: xs }
            - { kind: button, text: &gm_a { en: "Apply", ar: "قدّم الآن" }, gap: m }
            - { kind: heading, text: &gm_ch { en: "About the company", ar: "عن الشركة" }, gap: l }
            - { kind: small, text: &gm_c { en: "Founded in 1998, we supply medical equipment to 300 hospitals across the country…", ar: "تأسّسنا عام 1998، ونورّد الأجهزة الطبية إلى 300 مستشفى في أنحاء البلاد…" }, gap: xs }
      - id: inherit
        text: { en: "Same order as the laptop columns: About the company, then the job and Apply", ar: "ترتيب أعمدة الـ Laptop نفسه: «عن الشركة»، ثم الوظيفة والتقديم" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: *gm_t }
            - { kind: heading, text: *gm_ch, gap: m }
            - { kind: small, text: *gm_c, gap: xs }
            - { kind: small, text: { en: "Our team of 120 people works across five offices, and we believe in…", ar: "يعمل فريقنا المكوّن من 120 شخصًا في خمسة مكاتب، ونؤمن بأن…" }, gap: xs }
            - { kind: image, size: m, text: { en: "Office photo", ar: "صورة المكتب" }, gap: s }
            - { kind: meta, weight: bold, text: *gm_s, gap: m }
      - id: first
        text: { en: "Apply at the very top, before the job title and salary", ar: "زر التقديم في أعلى الصفحة، قبل المسمّى الوظيفي والراتب" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: button, text: *gm_a }
            - { kind: title, text: *gm_t, gap: m }
            - { kind: meta, weight: bold, text: *gm_s, gap: s }
            - { kind: meta, text: *gm_p, gap: xs }
            - { kind: heading, text: *gm_ch, gap: l }
            - { kind: small, text: *gm_c, gap: xs }
    answer: [needs]
    misconceptions:
      - id: MC-P10-062
        when: [inherit]
        feedback:
          en: "On the laptop, the side columns are seen at once. Stacked in that order, Gamal scrolls through the company's history before he learns the salary. Plan the phone order."
          ar: "على الـ Laptop، يُرى العمودان معًا. وعند تراصّهما بالترتيب نفسه، يمرّ جمال بتاريخ الشركة كله قبل أن يعرف الراتب. خطّط لترتيب الهاتف."
      - id: MC-P10-066
        when: [first]
        feedback:
          en: "Apply comes before Gamal knows what the job is or what it pays. Give him the facts he decides on, then the action."
          ar: "يأتي زر التقديم قبل أن يعرف جمال ما الوظيفة أو كم تدفع. أعطِه المعلومات التي يقرّر بها، ثم الإجراء."
    correct:
      en: "Right. The facts he decides on, then Apply."
      ar: "صحيح. المعلومات التي يقرّر بها، ثم التقديم."
    explain:
      en: "On a phone, everything is in one line, so the order is the priority. Gamal sees the job, the pay and the place, can apply right away, and can still read about the company below."
      ar: "على الهاتف، كل شيء في خط واحد، فالترتيب هو الأولوية. يرى جمال الوظيفة والراتب والمكان، ويستطيع التقديم فورًا، ويمكنه قراءة ما يخصّ الشركة في الأسفل."

  - id: S04
    type: tune
    skill: SK-P10-U04-02
    part: retest
    value:
      en: "Re-test, prioritization (NN/g): on a smartphone, users may have to scroll endlessly to reach the content they want. Put the deciding facts first, then the action, then the long extras."
      ar: "إعادة اختبار، ترتيب الأولويات (NN/g): على الهاتف قد يضطر المستخدمون إلى التمرير طويلًا للوصول إلى ما يريدون. ضع المعلومات الحاسمة أولًا، ثم الإجراء، ثم الإضافات الطويلة."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "On a smartphone, users may have to scroll endlessly to discover the content of interest." }
    scenario:
      en: "Eman orders a vitamin from a pharmacy site. On the laptop, a big photo gallery and the reviews fill the left column; the price, the dose and Add to cart sit on the right."
      ar: "تطلب إيمان فيتامين من موقع صيدلية. على الـ Laptop، معرض صور كبير والتقييمات يملآن العمود الأيسر؛ والسعر والجرعة وزر الإضافة إلى السلّة على اليمين."
    prompt:
      en: "Try each phone order. Which one should ship?"
      ar: "جرّب كل ترتيب للهاتف. أيّها يجب أن يُطلق؟"
    start: inherit
    options:
      - id: inherit
        text: { en: "Same order as the laptop: gallery, reviews, then price and Add to cart", ar: "ترتيب الـ Laptop نفسه: المعرض، والتقييمات، ثم السعر والإضافة إلى السلّة" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: &em_t { en: "Vitamin D3, 60 tablets", ar: "فيتامين D3، 60 قرصًا" } }
            - { kind: image, size: l, text: { en: "Photo 1 of 5", ar: "صورة 1 من 5" }, gap: s }
            - { kind: heading, text: &em_rh { en: "Reviews (48)", ar: "التقييمات (48)" }, gap: m }
            - { kind: small, text: &em_r1 { en: "\"Easy to swallow, arrived in two days.\"", ar: "«سهل البلع، ووصل في يومين.»" }, gap: xs }
            - { kind: small, text: &em_r2 { en: "\"Good value for the price.\"", ar: "«قيمة جيدة مقابل السعر.»" }, gap: xs }
      - id: first
        text: { en: "Add to cart first, then the name, price and dose", ar: "زر الإضافة إلى السلّة أولًا، ثم الاسم والسعر والجرعة" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: button, text: &em_a { en: "Add to cart", ar: "أضِف إلى السلّة" } }
            - { kind: title, text: *em_t, gap: m }
            - { kind: meta, weight: bold, text: &em_p { en: "185 EGP", ar: "185 جنيهًا" }, gap: s }
            - { kind: meta, text: &em_d { en: "1 tablet a day with food", ar: "قرص واحد يوميًا مع الطعام" }, gap: xs }
            - { kind: image, size: m, text: { en: "Photo 1 of 5", ar: "صورة 1 من 5" }, gap: s }
      - id: needs
        text: { en: "Name, one photo, price and dose, Add to cart, then reviews", ar: "الاسم، وصورة واحدة، والسعر والجرعة، والإضافة إلى السلّة، ثم التقييمات" }
        mock:
          caption: { en: "Phone", ar: "الهاتف" }
          width: 300
          blocks:
            - { kind: title, text: *em_t }
            - { kind: image, size: s, text: { en: "Photo 1 of 5", ar: "صورة 1 من 5" }, gap: s }
            - { kind: meta, weight: bold, text: *em_p, gap: s }
            - { kind: meta, text: *em_d, gap: xs }
            - { kind: button, text: *em_a, gap: m }
            - { kind: heading, text: *em_rh, gap: l }
            - { kind: small, text: *em_r1, gap: xs }
    answer: [needs]
    misconceptions:
      - id: MC-P10-062
        when: [inherit]
        feedback:
          en: "Stacked in the laptop's order, the price and dose sit below five photos and every review. Eman scrolls a long way for the two facts she needs."
          ar: "عند التراصّ بترتيب الـ Laptop، يقع السعر والجرعة تحت خمس صور وكل التقييمات. تمرّر إيمان طويلًا لتصل إلى معلومتين تحتاجهما."
      - id: MC-P10-066
        when: [first]
        feedback:
          en: "The button comes before Eman knows the price or the dose. People decide first, then act."
          ar: "يأتي الزر قبل أن تعرف إيمان السعر أو الجرعة. الناس يقرّرون أولًا، ثم يتصرّفون."
    correct:
      en: "Right. What she decides on, then the button, then the extras."
      ar: "صحيح. ما تقرّر به، ثم الزر، ثم الإضافات."
    explain:
      en: "The phone order follows Eman's questions: what is it, how much, how do I take it. The button comes right after the answers, and the reviews are there for anyone who wants more."
      ar: "يتبع ترتيب الهاتف أسئلة إيمان: ما هذا، وكم سعره، وكيف أتناوله. ويأتي الزر بعد الإجابات مباشرة، والتقييمات موجودة لمن يريد المزيد."

  # SK-P10-U04-03: give the same information on every device
  - id: S05
    type: tune
    skill: SK-P10-U04-03
    part: retest
    value:
      en: "Re-test, equivalent access (NN/g): the goal is to give equivalent access to information regardless of device. Hide the promotion, never the baggage allowance people decide on."
      ar: "إعادة اختبار، الوصول المتكافئ (NN/g): الهدف هو إتاحة المعلومات نفسها بغضّ النظر عن الجهاز. أخفِ العرض الترويجي، لا الأمتعة المسموحة التي يقرّر بها الناس."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "The goal of many responsive designs is to give equivalent access to information regardless of device." }
    scenario:
      en: "Tamer compares two flights on his phone. Each flight card is too long for the small screen, so one thing has to go on phones."
      ar: "يقارن تامر بين رحلتين على هاتفه. كل بطاقة رحلة أطول من الشاشة الصغيرة، فيجب الاستغناء عن شيء واحد على الهواتف."
    prompt:
      en: "Try each cut. Which one should ship?"
      ar: "جرّب كل حذف. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now: one flight card", ar: "الآن: بطاقة رحلة واحدة" }
      width: 300
      blocks:
        - { kind: heading, text: &tm_r { en: "Cairo → Jeddah · 09:10 – 11:25", ar: "القاهرة ← جدة · 09:10 – 11:25" } }
        - { kind: meta, text: &tm_b { en: "Bags: 1 cabin bag only", ar: "الأمتعة: حقيبة مقصورة واحدة فقط" }, gap: s }
        - { kind: meta, weight: bold, text: &tm_p { en: "6,450 EGP", ar: "6,450 جنيهًا" }, gap: xs }
        - { kind: banner, text: &tm_x { en: "Get double miles with our credit card!", ar: "اكسب أميالًا مضاعفة مع بطاقتنا الائتمانية!" }, gap: s }
        - { kind: button, emphasis: low, text: &tm_c { en: "Choose", ar: "اختر" }, gap: s }
    options:
      - id: bags
        text: { en: "Hide the baggage line on phones", ar: "أخفِ سطر الأمتعة على الهواتف" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, text: *tm_r }
            - { kind: meta, weight: bold, text: *tm_p, gap: s }
            - { kind: banner, text: *tm_x, gap: s }
            - { kind: button, emphasis: low, text: *tm_c, gap: s }
      - id: promo
        text: { en: "Hide the credit card offer on phones", ar: "أخفِ عرض البطاقة الائتمانية على الهواتف" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, text: *tm_r }
            - { kind: meta, text: *tm_b, gap: s }
            - { kind: meta, weight: bold, text: *tm_p, gap: xs }
            - { kind: button, emphasis: low, text: *tm_c, gap: s }
      - id: times
        text: { en: "Hide the times; they can see them after choosing", ar: "أخفِ المواعيد؛ يمكنهم رؤيتها بعد الاختيار" }
        mock:
          caption: { en: "After this change: phone", ar: "بعد هذا التغيير: الهاتف" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Cairo → Jeddah", ar: "القاهرة ← جدة" } }
            - { kind: meta, text: *tm_b, gap: s }
            - { kind: meta, weight: bold, text: *tm_p, gap: xs }
            - { kind: banner, text: *tm_x, gap: s }
            - { kind: button, emphasis: low, text: *tm_c, gap: s }
    answer: [promo]
    misconceptions:
      - id: MC-P10-061
        when: [bags, times]
        feedback:
          en: "The times and the bags are what Tamer compares the two flights on. Hiding them on phones makes the cheaper flight look better than it is. Cut the extra, not a deciding fact."
          ar: "المواعيد والأمتعة هما ما يقارن به تامر بين الرحلتين. إخفاؤهما على الهواتف يجعل الرحلة الأرخص تبدو أفضل مما هي. احذف الإضافة، لا معلومة حاسمة."
    correct:
      en: "Right. The offer goes; every fact Tamer decides on stays."
      ar: "صحيح. يُحذف العرض؛ وتبقى كل معلومة يقرّر بها تامر."
    explain:
      en: "People on phones decide the same things as people on laptops, so they need the same facts. When space is short, cut what's optional, like a promotion."
      ar: "من يستخدم الهاتف يقرّر الأشياء نفسها التي يقرّرها مستخدم الـ Laptop، فيحتاج المعلومات نفسها. وحين تضيق المساحة، احذف ما هو اختياري، مثل العرض الترويجي."

  - id: S06
    type: tune
    skill: SK-P10-U04-03
    part: retest
    value:
      en: "Re-test, equivalent access (NN/g): give equivalent access to information regardless of device. Change the form of the schedule on a phone, but don't remove it or send people to a laptop."
      ar: "إعادة اختبار، الوصول المتكافئ (NN/g): أتِح المعلومات نفسها بغضّ النظر عن الجهاز. غيّر شكل الجدول على الهاتف، لكن لا تحذفه ولا ترسل الناس إلى الـ Laptop."
