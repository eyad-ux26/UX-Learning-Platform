                    - { kind: meta, text: { en: "Departs, Lands, Gate", ar: "الإقلاع، الهبوط، البوابة" }, gap: xs }
                    - { kind: meta, text: { en: "08:15, 11:40, B7", ar: "08:15، 11:40، B7" }, gap: xs }
