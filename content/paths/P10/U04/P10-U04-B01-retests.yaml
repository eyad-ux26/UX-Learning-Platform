          ar: "الخط الـ Bold يغيّر ما يراه الناس، لكن نرمين ما زالت تسمع ثلاثة عناوين، ثم ثلاث قيم، وعليها أن تطابقها من الذاكرة. أبقِ كل عنوان مع قيمته في الكود."
