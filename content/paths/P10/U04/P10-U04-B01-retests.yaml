            - { kind: meta, text: { en: "Wed 8 Oct · 19:00", ar: "الأربعاء 8 أكتوبر · 19:00" }, gap: xs }
            - { kind: meta, text: { en: "Sun 12 Oct · 19:00", ar: "الأحد 12 أكتوبر · 19:00" }, gap: xs }
            - { kind: meta, text: { en: "Wed 15 Oct · 19:00", ar: "الأربعاء 15 أكتوبر · 19:00" }, gap: xs }
            - { kind: meta, text: { en: "Sun 19 Oct · 19:00", ar: "الأحد 19 أكتوبر · 19:00" }, gap: xs }
            - { kind: meta, text: { en: "Wed 22 Oct · 19:00", ar: "الأربعاء 22 أكتوبر · 19:00" }, gap: xs }
            - { kind: button, text: &yz_b { en: "Join the course", ar: "انضمّ إلى الدورة" }, gap: m }
      - id: desktop
        text: { en: "Hide the table, and add \"See the full schedule on a computer\"", ar: "أخفِ الجدول، وأضف «اطّلع على الجدول الكامل من الكمبيوتر»" }
        mock:
