      en: "Nermeen can't glance back at the screen. When each label is followed by its value in the code, she hears \"Gate, B7\" as one fact, with nothing to remember or match."
      ar: "لا تستطيع نرمين أن تلقي نظرة على الشاشة. حين تأتي كل قيمة بعد عنوانها في الكود، تسمع «البوابة، B7» كمعلومة واحدة، دون شيء تتذكّره أو تطابقه."
