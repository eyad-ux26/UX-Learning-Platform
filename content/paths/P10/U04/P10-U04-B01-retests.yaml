  # SK-P10-U04-05: check it's usable, not just that it fits
  - id: S09
    type: tune
    skill: SK-P10-U04-05
    part: retest
    value:
      en: "Re-test, fit vs. use (NN/g): ensuring that elements fit within a page is not enough. Labels beside fields fit at 320px, but squeeze the box until the typed text is cut off."
      ar: "إعادة اختبار، الاتّساع مقابل الاستخدام (NN/g): التأكّد من أن العناصر تتّسع في الصفحة لا يكفي. العناوين بجانب الحقول تتّسع على 320px، لكنها تضغط الحقل حتى ينقطع النص المكتوب."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "However, ensuring that elements fit within a page is not enough." }
    scenario:
      en: "Hazem fills in his delivery address on a small 320px phone. Every label sits beside its field. Nothing runs off the screen, but the fields are very narrow."
      ar: "يكتب حازم عنوان التوصيل على هاتف صغير بعرض 320px. كل عنوان حقل بجانب حقله. لا شيء يخرج عن الشاشة، لكن الحقول ضيقة جدًا."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: beside
    options:
      - id: beside
        text: { en: "Keep labels beside the fields; everything fits", ar: "أبقِ العناوين بجانب الحقول؛ فكل شيء يتّسع" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - kind: row
              blocks:
                - { kind: meta, text: &hz_sl { en: "Street", ar: "الشارع" } }
                - { kind: field, filled: true, nowrap: true, text: &hz_sv { en: "14 Abbas El Akkad St.", ar: "14 شارع عباس العقاد" } }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: &hz_bl { en: "Building", ar: "المبنى" } }
                - { kind: field, filled: true, nowrap: true, text: &hz_bv { en: "Tower B, floor 6, flat 62", ar: "البرج B، الدور 6، شقة 62" } }
      - id: above
        text: { en: "Put each label above its field, at full width", ar: "ضع كل عنوان فوق حقله، بكامل العرض" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - { kind: field, label: *hz_sl, filled: true, text: *hz_sv }
            - { kind: field, label: *hz_bl, filled: true, text: *hz_bv, gap: s }
      - id: short
        text: { en: "Keep them beside the fields, and shorten the labels to \"St.\" and \"Bldg.\"", ar: "أبقِها بجانب الحقول، واختصر العناوين إلى «ش.» و«م.»" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - kind: row
              blocks:
                - { kind: small, text: { en: "St.", ar: "ش." } }
                - { kind: field, filled: true, nowrap: true, text: *hz_sv }
            - kind: row
              gap: s
              blocks:
                - { kind: small, text: { en: "Bldg.", ar: "م." } }
                - { kind: field, filled: true, nowrap: true, text: *hz_bv }
    answer: [above]
    misconceptions:
      - id: MC-P10-078
        when: [beside, short]
        feedback:
          en: "It fits, but Hazem can't see the end of what he typed, so he can't check his flat number. Short labels like \"Bldg.\" also make people guess. Fitting isn't the goal; being usable is."
          ar: "إنها تتّسع، لكن حازم لا يرى نهاية ما كتبه، فلا يستطيع التأكّد من رقم شقته. والعناوين المختصرة مثل «م.» تجعل الناس يخمّنون. الاتّساع ليس الهدف؛ الاستخدام هو الهدف."
    correct:
      en: "Right. Each field gets the full width, so Hazem can check what he typed."
      ar: "صحيح. كل حقل يأخذ العرض كاملًا، فيستطيع حازم مراجعة ما كتبه."
    explain:
      en: "On a narrow phone, labels above fields leave the whole width for the answer. Checking a layout means asking whether people can read and fix their input, not only whether anything overflows."
      ar: "على الهاتف الضيق، تترك العناوين فوق الحقول العرض كله للإجابة. فحص التخطيط يعني أن تسأل: هل يستطيع الناس قراءة ما كتبوه وتصحيحه؟ لا فقط: هل يخرج شيء عن الشاشة؟"

  - id: S10
    type: tune
    skill: SK-P10-U04-05
    part: retest
    value:
      en: "Re-test, fit vs. use (NN/g): ensuring that elements fit within a page is not enough. A cut-off label or tiny text fits; stacked full-width buttons are usable."
      ar: "إعادة اختبار، الاتّساع مقابل الاستخدام (NN/g): التأكّد من أن العناصر تتّسع في الصفحة لا يكفي. النص المقطوع أو الصغير جدًا يتّسع؛ أما الأزرار المتراصّة بكامل العرض فقابلة للاستخدام."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "However, ensuring that elements fit within a page is not enough." }
    scenario:
      en: "Doaa is confirming a hair appointment on a small 320px phone. Keep appointment and Cancel appointment sit side by side, and both labels are long."
      ar: "تؤكّد دعاء موعدًا في صالون تجميل على هاتف صغير بعرض 320px. زرّا «أبقِ الموعد» و«ألغِ الموعد» متجاوران، ونص كليهما طويل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: cut
    options:
      - id: cut
        text: { en: "Keep them side by side, and cut the labels with \"…\"", ar: "أبقِهما متجاورين، واقطع النص بـ «…»" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: &da_t { en: "Sat 11:00 · Haircut", ar: "السبت 11:00 · قصّ شعر" } }
            - kind: row
              gap: m
              blocks:
                - { kind: button, nowrap: true, text: &da_k { en: "Keep appointment", ar: "أبقِ الموعد" } }
                - { kind: button, nowrap: true, emphasis: low, text: &da_c { en: "Cancel appointment", ar: "ألغِ الموعد" } }
      - id: tiny
        text: { en: "Keep them side by side, with 10px text so the labels fit", ar: "أبقِهما متجاورين، بنص 10px حتى يتّسع" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: *da_t }
            - kind: row
              gap: m
              blocks:
                - { kind: button, px: 10, text: *da_k }
                - { kind: button, px: 10, emphasis: low, text: *da_c }
      - id: stack
        text: { en: "Stack them, each at full width", ar: "ضعهما فوق بعض، كلٌّ بكامل العرض" }
        mock:
          caption: { en: "320 px", ar: "320 بكسل" }
          width: 240
          blocks:
            - { kind: title, text: *da_t }
            - { kind: button, text: *da_k, gap: m }
            - { kind: button, emphasis: low, text: *da_c, gap: s }
    answer: [stack]
    misconceptions:
      - id: MC-P10-078
        when: [cut, tiny]
        feedback:
          en: "Both fit, but Doaa either can't read which button cancels, or gets tiny targets that are easy to miss. Fitting isn't the same as usable."
          ar: "كلاهما يتّسع، لكن دعاء إمّا لا تستطيع قراءة أي زر يُلغي، أو تحصل على أزرار صغيرة يسهل أن تخطئها. الاتّساع لا يعني قابلية الاستخدام."
    correct:
      en: "Right. Full labels, full-width targets."
      ar: "صحيح. نص كامل، وأزرار بكامل العرض."
    explain:
      en: "When two buttons don't fit side by side, stack them. Doaa reads each label in full and taps a big target, and choosing the wrong one becomes much harder."
      ar: "حين لا يتّسع زرّان متجاوران، ضعهما فوق بعض. تقرأ دعاء كل زر كاملًا وتضغط هدفًا كبيرًا، ويصبح اختيار الزر الخطأ أصعب بكثير."

  # SK-P10-U04-06: fix the reading order in the code
  - id: S11
    type: tune
    skill: SK-P10-U04-06
    part: retest
    value:
      en: "Re-test, reading order (NN/g): screen-reader users can't jump around; they move through the sequence. Layout code moves pixels, not that sequence."
      ar: "إعادة اختبار، ترتيب القراءة (NN/g): مستخدمو الـ Screen reader لا يستطيعون القفز؛ بل يتحرّكون عبر التسلسل. كود التخطيط يحرّك ما يظهر على الشاشة، لا هذا التسلسل."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "The user cannot jump around; they must move forward and backward through the sequence to access what they want." }
    scenario:
      en: "Akram uses a screen reader. On a shop's product card, the code puts Add to cart first, then the price, then the product name, so that's the order he hears."
      ar: "يستخدم أكرم الـ Screen reader. في بطاقة منتج بمتجر، يضع الكود زر الإضافة إلى السلّة أولًا، ثم السعر، ثم اسم المنتج، وهذا هو الترتيب الذي يسمعه."
    prompt:
      en: "Each version shows what people see and what Akram hears. Try each fix. Which one should ship?"
      ar: "كل نسخة تعرض ما يراه الناس وما يسمعه أكرم. جرّب كل حل. أيّها يجب أن يُطلق؟"
    start: visual
    options:
      - id: visual
        text: { en: "Move the button below the name on screen, with layout code only", ar: "انقل الزر تحت الاسم على الشاشة، بكود التخطيط فقط" }
        mock:
          blocks:
            - kind: row
              gap: s
              blocks:
                - kind: group
                  blocks:
                    - { kind: small, text: &ak_sees { en: "People see", ar: "يرى الناس" } }
                    - { kind: meta, text: &ak_n { en: "Hand cream", ar: "كريم اليدين" }, gap: xs }
                    - { kind: meta, text: &ak_p { en: "75 EGP", ar: "75 جنيهًا" }, gap: xs }
                    - { kind: meta, text: &ak_b { en: "Add to cart", ar: "أضِف إلى السلّة" }, gap: xs }
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: &ak_hears { en: "Akram hears", ar: "يسمع أكرم" } }
                    - { kind: meta, text: { en: "Add to cart, button", ar: "أضِف إلى السلّة، زر" }, gap: xs }
                    - { kind: meta, text: *ak_p, gap: xs }
                    - { kind: meta, text: *ak_n, gap: xs }
      - id: code
        text: { en: "Change the order in the code: name, price, then the button", ar: "غيّر الترتيب في الكود: الاسم، ثم السعر، ثم الزر" }
        mock:
          blocks:
            - kind: row
              gap: s
              blocks:
                - kind: group
                  blocks:
                    - { kind: small, text: *ak_sees }
                    - { kind: meta, text: *ak_n, gap: xs }
                    - { kind: meta, text: *ak_p, gap: xs }
                    - { kind: meta, text: *ak_b, gap: xs }
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: *ak_hears }
                    - { kind: meta, text: *ak_n, gap: xs }
                    - { kind: meta, text: *ak_p, gap: xs }
                    - { kind: meta, text: { en: "Add to cart, button", ar: "أضِف إلى السلّة، زر" }, gap: xs }
      - id: keep
        text: { en: "Keep it; the button first saves time for people who already know what they want", ar: "أبقِه؛ فالزر أولًا يوفّر الوقت لمن يعرف ما يريد" }
        mock:
          blocks:
            - kind: row
              gap: s
              blocks:
                - kind: group
                  blocks:
                    - { kind: small, text: *ak_sees }
                    - { kind: meta, text: *ak_b }
                    - { kind: meta, text: *ak_p, gap: xs }
                    - { kind: meta, text: *ak_n, gap: xs }
                - kind: group
                  tone: tint
                  blocks:
                    - { kind: small, text: *ak_hears }
                    - { kind: meta, text: { en: "Add to cart, button", ar: "أضِف إلى السلّة، زر" }, gap: xs }
                    - { kind: meta, text: *ak_p, gap: xs }
                    - { kind: meta, text: *ak_n, gap: xs }
    answer: [code]
    misconceptions:
      - id: MC-P10-067
        when: [visual]
        feedback:
          en: "The screen looks right, but Akram still hears the button before he knows what it adds. Layout code moves what people see, not what he hears."
          ar: "تبدو الشاشة صحيحة، لكن أكرم ما زال يسمع الزر قبل أن يعرف ماذا يضيف. كود التخطيط يحرّك ما يراه الناس، لا ما يسمعه هو."
      - id: MC-P10-066
        when: [keep]
        feedback:
          en: "Akram hears \"Add to cart\" before he knows which product, so he has to keep going and come back. The facts come first, then the action."
          ar: "يسمع أكرم «أضِف إلى السلّة» قبل أن يعرف أي منتج، فيضطر للتقدّم ثم الرجوع. المعلومات أولًا، ثم الإجراء."
    correct:
      en: "Right. One fix in the code, and what people see and hear agree."
      ar: "صحيح. إصلاح واحد في الكود، فيتّفق ما يراه الناس وما يسمعونه."
    explain:
      en: "When the code is in the right order, the screen reader, the Tab key and a narrow screen all follow it. Akram hears what the product is and what it costs, then the button."
      ar: "عندما يكون الكود بالترتيب الصحيح، يتبعه الـ Screen reader ومفتاح Tab والشاشة الضيقة كلها. يسمع أكرم ما المنتج وكم سعره، ثم الزر."

  - id: S12
    type: tune
    skill: SK-P10-U04-06
    part: retest
    value:
      en: "Re-test, label-value pairs (NN/g): a screen-reader user is unaware of what's ahead and must remember what they've already heard. All labels, then all values, forces them to match by memory."
      ar: "إعادة اختبار، أزواج العنوان والقيمة (NN/g): مستخدم الـ Screen reader لا يعرف ما ينتظره، ويجب أن يتذكّر كل ما سمعه. كل العناوين ثم كل القيم يجبره على المطابقة من الذاكرة."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "Someone using a screen reader is unaware of everything ahead and must remember everything they have already encountered." }
    scenario:
      en: "Nermeen uses a screen reader to check her flight. On screen, each label sits above its value, but in the code all the labels come first and all the values after."
      ar: "تستخدم نرمين الـ Screen reader لتتحقّق من رحلتها. على الشاشة، كل عنوان فوق قيمته، لكن في الكود تأتي كل العناوين أولًا ثم كل القيم."
    prompt:
      en: "Each version shows what people see and what Nermeen hears. Try each fix. Which one should ship?"
      ar: "كل نسخة تعرض ما يراه الناس وما تسمعه نرمين. جرّب كل حل. أيّها يجب أن يُطلق؟"
    start: bold
    options:
      - id: pairs
