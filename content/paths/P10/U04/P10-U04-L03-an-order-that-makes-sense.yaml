id: P10-U04-L03
mode: lesson
minutes: 9
title:
  en: "An order that makes sense without the columns"
  ar: "ترتيب منطقي حتى بدون الأعمدة"
review_labels:
  MC-P10-066: { en: "Facts come before the action in the reading order", ar: "المعلومات قبل الإجراء في ترتيب القراءة" }
  MC-P10-067: { en: "Moving things visually doesn't change the reading order", ar: "نقل العناصر بصريًا لا يغيّر ترتيب القراءة" }
  MC-P10-061: { en: "Hide what's optional, never what decides", ar: "أخفِ الاختياري، لا ما يحسم القرار" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mona listens to the page", ar: "منى تستمع إلى الصفحة" }
    body:
      en: "Mona wants to book Sara's workshop too. She's blind and uses a screen reader, which reads the page aloud from top to bottom.\n\nOn a laptop, the page looks fine. This is what Mona hears:"
      ar: "منى تريد حجز ورشة سارة أيضًا. منى كفيفة وتستخدم Screen reader، يقرأ الصفحة بصوت عالٍ من الأعلى إلى الأسفل.\n\nعلى الحاسوب المحمول تبدو الصفحة سليمة. وهذا ما تسمعه منى:"
    mock:
      caption: { en: "Read aloud, in order", ar: "تُقرأ بصوت عالٍ، بالترتيب" }
      blocks:
        - { kind: meta, text: "@W1a" }
        - { kind: meta, text: "@W1i", gap: xs }
        - { kind: meta, text: "@W1f", gap: xs }
        - { kind: meta, text: "@W1j", gap: xs }
        - { kind: meta, text: "@W1b", gap: xs }
        - { kind: meta, text: "@W1c", gap: xs }
        - { kind: meta, text: "@W1d", gap: xs }
        - { kind: meta, text: "@W1g", gap: xs }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    prompt: { en: "Why would the screen reader read it in this odd order?", ar: "لماذا يقرأ الـ Screen reader الصفحة بهذا الترتيب الغريب؟" }
    options:
      - { id: bug, text: { en: "The screen reader has a bug", ar: "في الـ Screen reader خلل" } }
      - { id: code, text: { en: 'It follows the order in the code, not the layout', ar: "يتبع الترتيب في الكود، لا التخطيط" } }
      - { id: size, text: { en: "It reads the biggest things first", ar: "يقرأ العناصر الأكبر أولًا" } }
    answer: [code]
    misconceptions:
      - id: MC-P10-067
        when: [size, bug]
        feedback:
          en: "Screen readers don't look at size or position at all. They read the code from top to bottom, and the team wrote the booking panel and newsletter first."
          ar: "الـ Screen reader لا ينظر إلى الحجم أو المكان أصلًا. يقرأ الكود من الأعلى إلى الأسفل، والفريق كتب لوحة الحجز والنشرة أولًا."
    correct:
      en: "It follows the code."
      ar: "يتبع الكود."
    explain:
      en: "The team wrote the booking panel and newsletter first, then used the layout to move them to the right column. Eyes see the columns; Mona hears the code."
      ar: "كتب الفريق لوحة الحجز والنشرة أولًا، ثم استخدموا التخطيط لنقلهما إلى العمود الأيمن. العين ترى الأعمدة، ومنى تسمع الكود."
  - id: S03
    type: card
    part: concept
    icons: [eye, ear, order, ok]
    title: { en: "Two orders: what you see and what's in the code", ar: "ترتيبان: ما تراه وما في الكود" }
    body:
      en: "Every page has two orders, and they can disagree.\n\n- **Visual order:** where things sit on the screen.\n- **Reading order:** the order in the code. Screen readers read it, the Tab key follows it, and narrow screens stack it.\n- **Design the reading order first:** keep labels with their values and put actions after the facts that give them meaning. Then arrange it visually.\n- **More than one order can work:** what matters is that the meaning survives."
      ar: "لكل صفحة ترتيبان، وقد يختلفان.\n\n- **الترتيب البصري:** أين تقع العناصر على الشاشة.\n- **ترتيب القراءة:** الترتيب في الكود. يقرؤه الـ Screen reader، ويتبعه مفتاح Tab، وتُرصّ به الشاشات الضيّقة.\n- **صمّم ترتيب القراءة أولًا:** أبقِ كل تسمية مع قيمتها، وضع الإجراءات بعد المعلومات التي تعطيها معناها. ثم رتّبها بصريًا.\n- **قد ينجح أكثر من ترتيب:** المهم أن يبقى المعنى."
  - id: S04
    type: order
    part: guided
    confidence: true
    rules: [R06, R15, U29]
    prompt:
      en: "Put Sara's page in a reading order that makes sense aloud."
      ar: "رتّب صفحة سارة بترتيب قراءة منطقي عند سماعه."
    items:
      - { id: W1f, text: "@W1f", kind: button }
      - { id: W1j, text: "@W1j", kind: link }
      - { id: W1b, text: "@W1b" }
      - { id: W1a, text: "@W1a", kind: title }
      - { id: W1g, text: "@W1g", kind: small }
      - { id: W1d, text: "@W1d" }
    answer: [W1a, W1b, W1d, W1g, W1f, W1j]
    also_ok:
      - answer: [W1a, W1b, W1d, W1f, W1g, W1j]
        feedback:
          en: "That works too: the cancellation rule right after Reserve is fine, as long as it's there before she confirms."
          ar: "هذا صحيح أيضًا: قاعدة الإلغاء بعد «احجز مكانك» مباشرة مقبولة، ما دامت تظهر قبل أن تؤكّد."
      - answer: [W1a, W1d, W1b, W1g, W1f, W1j]
        feedback:
          en: "That works too: price before date is a fair choice for a free event."
          ar: "هذا صحيح أيضًا: السعر قبل الموعد اختيار معقول لفعالية مجانية."
      - answer: [W1a, W1d, W1b, W1f, W1g, W1j]
        feedback:
          en: "That works too: the facts lead, Reserve follows, the cancellation rule is right beside it."
          ar: "هذا صحيح أيضًا: المعلومات أولًا، ثم «احجز مكانك»، وقاعدة الإلغاء بجانبه."
    misconceptions:
      - id: MC-P10-066
        when: { before: [W1f, W1b] }
        feedback:
          en: "Mona would hear \"Reserve a place\" before she knows when the workshop is. Facts first, then the action."
          ar: "ستسمع منى «احجز مكانك» قبل أن تعرف موعد الورشة. المعلومات أولًا، ثم الإجراء."
      - id: MC-P10-066
        when: { before: [W1j, W1f] }
        feedback:
          en: "The newsletter is optional. Put it after the booking so it doesn't interrupt the decision."
          ar: "النشرة اختيارية. ضعها بعد الحجز حتى لا تقطع القرار."
    hints:
      - { en: "Start with what it is, then when and how much.", ar: "ابدأ بما هي، ثم متى وبكم." }
      - { en: "The button comes after the facts it depends on.", ar: "الزر يأتي بعد المعلومات التي يعتمد عليها." }
    correct:
      en: "What it is, the facts, the rule, then the action. Optional extras last."
      ar: "ما هي، ثم المعلومات، ثم القاعدة، ثم الإجراء. والإضافات الاختيارية في النهاية."
    explain:
      en: "This order works read aloud, tabbed through, and stacked on a phone. On a laptop, the layout can still put the booking panel in a side column."
      ar: "هذا الترتيب يعمل عند القراءة بصوت عالٍ، وعند التنقل بمفتاح Tab، وعند التراصّ على الهاتف. وعلى الحاسوب يمكن للتخطيط أن يضع لوحة الحجز في عمود جانبي."

  - id: S05
    type: spot
    part: guided
    rules: [R06, U29, U47]
    prompt:
      en: "The team left the code as it was and let the columns stack on the phone. What does Sara meet too early?"
      ar: "ترك الفريق الكود كما هو وترك الأعمدة تتراصّ على الهاتف. ما الذي تراه سارة مبكرًا جدًا؟"
    mock:
      caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
      blocks:
        - { kind: title, text: "@W1a", region: title }
        - { kind: image, size: m, text: "@W1i", gap: s }
        - { kind: button, text: "@W1f", gap: m, region: reserve }
        - { kind: link, text: "@W1j", gap: s }
        - { kind: meta, text: "@W1b", gap: m, region: date }
        - { kind: meta, text: "@W1c", gap: xs, region: place }
    regions:
      - { id: title, label: "@W1a" }
      - { id: reserve, label: "@W1f" }
      - { id: date, label: "@W1b" }
      - { id: place, label: "@W1c" }
    answer: [reserve]
    misconceptions:
      - id: MC-P10-066
        when: [title, date, place]
        feedback:
          en: "That one's fine where it is. Look for the thing she's asked to act on before she has the facts."
          ar: "هذا العنصر في مكانه الصحيح. ابحث عن الشيء الذي يُطلب منها التصرّف فيه قبل أن تعرف المعلومات."
    correct:
      en: "Reserve comes before the date and place, exactly as Mona heard it."
      ar: "«احجز مكانك» يأتي قبل الموعد والمكان، تمامًا كما سمعته منى."
    explain:
      en: "The phone stacks in reading order. Fix the order once, in the code, and the phone, the keyboard and the screen reader all improve together."
      ar: "الهاتف يرصّ العناصر بترتيب القراءة. أصلح الترتيب مرة واحدة في الكود، فيتحسّن الهاتف ولوحة المفاتيح والـ Screen reader معًا."

  - id: S06
    type: choose
    part: guided
    rules: [R11, U29, U28]
    prompt:
      en: "A teammate suggests: \"Keep the code. On phones, just use CSS to move the booking panel below the details.\" What's the catch?"
      ar: "يقترح أحد الزملاء: «لنترك الكود. وعلى الهواتف نستخدم CSS لنقل لوحة الحجز تحت التفاصيل». ما المشكلة؟"
    options:
      - { id: none, text: { en: "Nothing, if it looks right it is right", ar: "لا شيء، إذا بدت صحيحة فهي صحيحة" } }
      - { id: mismatch, text: { en: "It only moves things visually; screen readers and the Tab key still follow the code", ar: "ينقل العناصر بصريًا فقط؛ والـ Screen reader ومفتاح Tab ما زالا يتبعان الكود" } }
      - { id: slow, text: { en: "CSS makes the page load slower", ar: "CSS يجعل الصفحة أبطأ في التحميل" } }
    answer: [mismatch]
    misconceptions:
      - id: MC-P10-067
        when: [none]
        feedback:
          en: "It would look right, but Mona would still hear Reserve first, and a keyboard user would jump from the top to the bottom of the screen and back."
          ar: "ستبدو صحيحة، لكن منى ستسمع «احجز» أولًا، ومستخدم لوحة المفاتيح سيقفز من أعلى الشاشة إلى أسفلها ثم يعود."
    hints:
      - { en: "Who doesn't see the layout at all?", ar: "من لا يرى التخطيط أصلًا؟" }
    correct:
      en: "Visual reordering leaves the reading order unchanged."
      ar: "إعادة الترتيب بصريًا تترك ترتيب القراءة كما هو."
    explain:
      en: "Use visual reordering for small adjustments that don't change meaning. When the order matters, fix it in the code."
      ar: "استخدم إعادة الترتيب البصري للتعديلات الصغيرة التي لا تغيّر المعنى. وحين يكون الترتيب مهمًا، أصلحه في الكود."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, U35]
    prompt:
      en: "Both phone versions are shorter than the laptop page. Which one keeps the decision intact?"
      ar: "نسختا الهاتف كلتاهما أقصر من صفحة الحاسوب. أيّهما تحفظ القرار كاملًا؟"
    a:
      mock:
        caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: image, size: m, text: "@W1i", gap: s }
          - { kind: link, text: "@W1more", gap: s }
          - { kind: button, text: "@W1f", gap: m }
    b:
      mock:
        caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
        blocks:
          - { kind: title, text: "@W1a" }
          - { kind: meta, text: "@W1b", gap: s }
          - { kind: meta, text: "@W1c", gap: xs }
          - { kind: meta, text: "@W1d", gap: xs }
          - { kind: chip, text: "@W1e", gap: s }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: small, text: "@W1g", gap: s }
    answer: b
    misconceptions:
      - id: MC-P10-061
        when: [a]
        feedback:
          en: "A keeps the photo and hides the date, place and price behind \"More details\". Those are the facts Sara decides with."
          ar: "A تحتفظ بالصورة وتخفي الموعد والمكان والسعر خلف «تفاصيل أكثر». وهذه هي المعلومات التي تبني عليها سارة قرارها."
    correct:
      en: "B drops the photo and keeps every fact Sara needs to decide."
      ar: "B تحذف الصورة وتحتفظ بكل معلومة تحتاجها سارة لتقرّر."
    explain:
      en: "Shorter is good when you cut what's optional. Hiding the decision behind a tap only moves the work to the user."
      ar: "الصفحة الأقصر جيدة حين تحذف الاختياري. أما إخفاء القرار خلف ضغطة فينقل العمل إلى المستخدم فقط."

  - id: S08
    type: fix
    part: independent
    rules: [R07, U29]
    prompt:
      en: "On Youssef's bus ticket, the \"Download our app\" banner is first in the code. On his phone it pushes the route and departure time below the fold. What's the best fix?"
      ar: "في تذكرة حافلة يوسف، شريط «حمّل تطبيقنا» هو الأول في الكود. وعلى هاتفه يدفع المسار وموعد المغادرة إلى أسفل الشاشة. ما أفضل إصلاح؟"
    mock:
      caption: { en: "Phone, 360 px", ar: "هاتف، 360 بكسل" }
      blocks:
        - { kind: image, size: m, text: "@B1a" }
        - { kind: title, text: "@B1b", gap: m }
        - { kind: meta, text: "@B1c", gap: s }
    options:
      - { id: small, text: { en: "Make the banner smaller", ar: "صغّر الـ Slider" } }
      - { id: move, text: { en: "Move the banner after the ticket details, in the code", ar: "انقل الـ Slider بعد تفاصيل التذكرة، في الكود" } }
      - { id: css, text: { en: "Keep the code and move the banner down with CSS on phones", ar: "اترك الكود وانقل الـ Slider للأسفل باستخدام CSS على الهواتف" } }
    answer: [move]
    misconceptions:
      - id: MC-P10-067
        when: [css]
        feedback:
          en: "That fixes how it looks, but a screen reader would still start with the ad. Change the order in the code."
          ar: "هذا يصلح الشكل، لكن الـ Screen reader سيبدأ بالإعلان. غيّر الترتيب في الكود."
    hints:
      - { en: "Which fix helps the screen reader too?", ar: "أي إصلاح يساعد الـ Screen reader أيضًا؟" }
    correct:
      en: "The ticket comes first everywhere, and the banner waits until after it."
      ar: "التذكرة أولًا في كل مكان، والـ Slider ينتظر بعدها."
    explain:
      en: "A smaller banner is still in the way. Put the ticket first in the reading order and the ad can follow."
      ar: "الـ Slider الأصغر ما زال يعترض الطريق. ضع التذكرة أولًا في ترتيب القراءة، ويأتي الإعلان بعدها."

  - id: S09
    type: card
    part: recap
    icons: [order, ear, warn, cut]
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- The reading order (the code) is what phones stack, keyboards follow, and screen readers read.\n- Design it first: what it is, the facts, then the action. Optional things last.\n- Moving things only visually leaves the reading order wrong.\n- Shorter is fine when you cut what's optional; never hide what decides.\n\nNext: a skill check with Dalia's hotel booking."
      ar: "- ترتيب القراءة (الكود) هو ما يرصّه الهاتف، وتتبعه لوحة المفاتيح، ويقرؤه الـ Screen reader.\n- صمّمه أولًا: ما هو، ثم المعلومات، ثم الإجراء. والاختياري في النهاية.\n- نقل العناصر بصريًا فقط يترك ترتيب القراءة خاطئًا.\n- التقصير جيد حين تحذف الاختياري؛ لكن لا تخفِ ما يحسم القرار.\n\nالتالي: اختبار مهارة مع حجز فندق داليا."
