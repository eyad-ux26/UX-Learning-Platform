id: P10-U04-L02
mode: lesson
minutes: 9
title:
  en: "Check every width, not one screenshot"
  ar: "تحقّق من كل عرض، لا من لقطة شاشة واحدة"
review_labels:
  MC-P10-063: { en: "One screenshot doesn't prove a layout works", ar: "لقطة شاشة واحدة لا تثبت أن التخطيط يعمل" }
  MC-P10-064: { en: "Remember the gutters", ar: "تذكّر الهوامش الجانبية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"It works on my phone\"", ar: "«يعمل على هاتفي»" }
    body:
      en: "A teammate checked Sara's page on their own phone, 390px wide, and shared a screenshot: \"Mobile done.\"\n\nThe screenshot looks great. Many people use smaller phones, enlarge their text, or turn their tablet sideways."
      ar: "تحقّق أحد الزملاء من صفحة سارة على هاتفه، بعرض 390 بكسل، وشارك لقطة شاشة: «انتهينا من الهاتف».\n\nاللقطة تبدو رائعة. لكن كثيرين يستخدمون هواتف أصغر، أو يكبّرون النص، أو يديرون أجهزتهم اللوحية أفقيًا."

  - id: S02
    type: predict
    part: try
    rules: [R12]
    prompt:
      en: "The page works at 390px. At 320px, with 16px side margins, only 288px is left for content. The Reserve and Add to calendar buttons sit in one row that needs 300px. What happens at 320px?"
      ar: "الصفحة تعمل بعرض 390 بكسل. وعند 320 بكسل، مع هامش 16 بكسل في كل جانب، يبقى 288 بكسل فقط للمحتوى. زرّا «احجز» و«أضِف إلى التقويم» في صف واحد يحتاج 300 بكسل. ماذا يحدث عند 320 بكسل؟"
    options:
      - { id: auto, text: { en: "The browser shrinks the buttons to fit", ar: "المتصفح يصغّر الزرّين حتى يتّسعا" } }
      - { id: break, text: { en: 'The row no longer fits: 288 is less than 300', ar: 'الصف لم يعد يتّسع: 288 أقل من 300' } }
      - { id: fine, text: { en: "It's fine: 320px is only a bit narrower than 390px", ar: 'لا مشكلة: 320 بكسل أضيق قليلًا فقط من 390 بكسل' } }
    answer: [break]
    misconceptions:
      - id: MC-P10-063
        when: [fine, auto]
        feedback:
          en: "A row that's wider than the content area doesn't shrink by itself. It gets cut off or makes the page scroll sideways. 70px is plenty to break a layout."
          ar: "الصف الأعرض من مساحة المحتوى لا يصغر من تلقاء نفسه. بل يُقطع أو يجعل الصفحة تتحرّك أفقيًا. و70 بكسل كافية لكسر التخطيط."
    correct:
      en: "It breaks, 12px short."
      ar: "ينكسر، بفارق 12 بكسل."
    explain:
      en: "A screenshot at 390px can't show this. The only way to know is to check the narrow end, and to do the maths with the margins included."
      ar: "لقطة الشاشة بعرض 390 بكسل لا تُظهر هذا. الطريقة الوحيدة للمعرفة هي التحقق من الطرف الضيّق، والحساب مع احتساب الهوامش."
  - id: S03
    type: card
    part: concept
    icons: [width, phone, space]
    title: { en: "A range, not a size", ar: "مدى، لا مقاس واحد" }
    body:
      en: "Layouts live across a range of widths, not at one size.\n\n- **Check the range:** the narrow end, the wide end, and every point where the layout changes.\n- **320px is the floor:** WCAG \"Reflow\" expects ordinary pages to work at 320 CSS pixels with no sideways scrolling. That also covers zoom: 1280px at 400% behaves like 320px.\n- **Subtract the gutters:** content width is the screen minus the side margins. With 16px each side, a 360px phone gives you 328px."
      ar: "التخطيطات تعيش عبر مدى من العروض، لا عند حجم واحد.\n\n- **تحقّق من المدى كله:** الطرف الضيّق، والطرف العريض، وكل نقطة يتغيّر عندها التخطيط.\n- **320 بكسل هو الحد الأدنى:** معيار «Reflow» في WCAG يتوقّع أن تعمل الصفحات العادية بعرض 320 بكسل CSS دون تمرير أفقي. وهذا يشمل التكبير: عرض 1280 بكسل مع تكبير 400% يتصرّف كعرض 320 بكسل.\n- **اطرح الـ Gutters:** عرض المحتوى هو عرض الشاشة ناقص الهوامش الجانبية. مع 16 بكسل في كل جانب، يعطيك هاتف بعرض 360 بكسل مساحة 328 بكسل."
  - id: S04
    type: match
    part: guided
    rules: [R07, R13]
    prompt:
      en: "With a 16px gutter on each side, how wide is the content at each screen width?"
      ar: "مع هامش 16 بكسل في كل جانب، ما عرض المحتوى عند كل عرض شاشة؟"
    left:
      - { id: w1280, text: { en: "1280 px screen", ar: "شاشة 1280 بكسل" } }
      - { id: w768, text: { en: "768 px screen", ar: "شاشة 768 بكسل" } }
      - { id: w360, text: { en: "360 px screen", ar: "شاشة 360 بكسل" } }
      - { id: w320, text: { en: "320 px screen", ar: "شاشة 320 بكسل" } }
    right:
      - { id: c1248, text: { en: "1248 px", ar: "1248 بكسل" } }
      - { id: c736, text: { en: "736 px", ar: "736 بكسل" } }
      - { id: c344, text: { en: "344 px", ar: "344 بكسل" } }
      - { id: c328, text: { en: "328 px", ar: "328 بكسل" } }
      - { id: c288, text: { en: "288 px", ar: "288 بكسل" } }
    answer: { w1280: c1248, w768: c736, w360: c328, w320: c288 }
    misconceptions:
      - id: MC-P10-064
        when: { left: w360, right: c344 }
        feedback:
          en: "344 subtracts only one gutter. There's 16px on each side: 360 − 32 = 328."
          ar: "344 تطرح هامشًا واحدًا فقط. يوجد 16 بكسل في كل جانب: 360 − 32 = 328."
    hints:
      - { en: "Subtract 32 from each: 16 on the left, 16 on the right.", ar: "اطرح 32 من كل عرض: 16 يسارًا و16 يمينًا." }
    correct:
      en: "Screen width minus 32."
      ar: "عرض الشاشة ناقص 32."
    explain:
      en: "At 320px, there are only 288px for content. Everything inside, including the longest word and the widest row, has to fit in that."
      ar: "عند 320 بكسل، لا يتبقّى للمحتوى إلا 288 بكسل. وكل ما في الداخل، بما فيه أطول كلمة وأعرض صف، يجب أن يتّسع فيها."

  - id: S05
    type: choose
    part: guided
    confidence: true
    rules: [R13, R06]
    prompt:
      en: "What's the narrowest screen where the two columns still fit?"
      ar: "ما أضيق شاشة يتّسع فيها العمودان؟"
    options:
      - { id: s664, text: { en: "664 px", ar: "664 بكسل" } }
      - { id: s696, text: { en: "696 px", ar: "696 بكسل" } }
      - { id: s768, text: { en: "768 px", ar: "768 بكسل" } }
    answer: [s696]
    misconceptions:
      - id: MC-P10-064
        when: [s664]
        feedback:
          en: "664px is the content the layout needs. Add the two 16px gutters: 664 + 32 = 696."
          ar: "664 بكسل هو المحتوى الذي يحتاجه التخطيط. أضف الهامشين بعرض 16 بكسل: 664 + 32 = 696."
      - id: MC-P10-065
        when: [s768]
        feedback:
          en: "768 is a common tablet width, but the layout fits from 696. Breakpoints should come from your content, not from device names."
          ar: "768 عرض شائع للأجهزة اللوحية، لكن التخطيط يتّسع من 696. نقاط التحوّل (breakpoints) يجب أن تأتي من المحتوى، لا من أسماء الأجهزة."
    correct:
      en: "664 of content plus 32 of gutters."
      ar: "664 للمحتوى زائد 32 للهوامش."
    explain:
      en: "That's where the layout should switch from one column to two, and it's exactly the width to test carefully, a little above and a little below."
      ar: "هنا يجب أن يتحوّل التخطيط من عمود إلى عمودين، وهذا بالضبط العرض الذي يجب اختباره بعناية، أعلى منه بقليل وأقل منه بقليل."

  - id: S06
    type: spot
    part: guided
    rules: [R06, U47]
    prompt:
      en: "At 320px, which part of the page breaks?"
      ar: "عند 320 بكسل، أي جزء من الصفحة ينكسر؟"
    mock:
      width: 260
      caption: { en: "Phone, 320 px", ar: "هاتف، 320 بكسل" }
      blocks:
        - { kind: title, nowrap: true, text: "@W2e", region: title }
        - { kind: meta, text: "@W2f", gap: s, region: date }
        - { kind: meta, text: "@W2g", gap: xs, region: price }
        - { kind: button, text: "@W2h", gap: m, region: button }
    regions:
      - { id: title, label: "@W2e" }
      - { id: date, label: "@W2f" }
      - { id: price, label: "@W2g" }
      - { id: button, label: "@W2h" }
    answer: [title]
    misconceptions:
      - id: MC-P10-063
        when: [date, price, button]
        feedback:
          en: "That one wraps or fits fine. Look for text that's been cut off."
          ar: "هذا العنصر يلتف أو يتّسع جيدًا. ابحث عن نص مقطوع."
    correct:
      en: "The title is cut off with \"…\". At 390px it fit on one line."
      ar: "العنوان مقطوع بعلامة «…». عند 390 بكسل كان يتّسع في سطر واحد."
    explain:
      en: "The title was set to stay on one line. That held at 390px and broke at 320px. Let it wrap instead; Unit 5 goes deeper into long text."
      ar: "ضُبط العنوان ليبقى في سطر واحد. نجح ذلك عند 390 بكسل وانكسر عند 320. اسمح له بالالتفاف بدلًا من ذلك؛ والوحدة 5 تتعمّق في النصوص الطويلة."

  - id: S07
    type: choose
    part: contrast
    rules: [R11, R39]
    prompt:
      en: "The teammate's 390px screenshot is the only check so far. What's missing before calling the page responsive?"
      ar: "لقطة الزميل بعرض 390 بكسل هي التحقق الوحيد حتى الآن. ما الناقص قبل وصف الصفحة بأنها متجاوبة؟"
    options:
      - { id: desktop, text: { en: "A desktop screenshot too", ar: "لقطة شاشة للحاسوب أيضًا" } }
      - { id: range, text: { en: "Checks at 320px, around the 696px switch, and with enlarged text", ar: "التحقق عند 320 بكسل، وحول الـ Breakpoint 696 بكسل، ومع تكبير النص" } }
      - { id: nothing, text: { en: "Nothing, 390px is the most common phone width", ar: "لا شيء، 390 بكسل هو أشيع عرض للهواتف" } }
    answer: [range]
    misconceptions:
      - id: MC-P10-063
        when: [desktop, nothing]
        feedback:
          en: "One or two screenshots show one or two widths. The failures usually happen at the narrow end, near breakpoints, or with bigger text."
          ar: "لقطة أو لقطتان تُظهران عرضًا أو عرضين. أما الأعطال فتحدث عادةً عند الطرف الضيّق، أو قرب نقاط التحوّل، أو مع النص الأكبر."
    correct:
      en: "Check the edges and the switch, and with bigger text."
      ar: "تحقّق من الأطراف والـ Breakpoint، ومع نص أكبر."
    explain:
      en: "A screenshot is evidence for one width on one device. A good check covers the narrowest width (320px), the points where the layout changes, and text enlargement. Some of this needs a real browser, not a design file."
      ar: "لقطة الشاشة دليل على عرض واحد في جهاز واحد. أما التحقق الجيد فيغطي أضيق عرض (320 بكسل)، والنقاط التي يتغيّر عندها التخطيط، وتكبير النص. وبعض ذلك يحتاج متصفحًا حقيقيًا، لا ملف تصميم."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, R19]
    scenario:
      en: "On a 320px phone, Lina's delivery screen shows \"Driver: Karim\" and a Call button side by side. The row is wider than the screen, so the page scrolls sideways."
      ar: "على هاتف بعرض 320 بكسل، تعرض شاشة توصيل لينا «السائق: كريم» وزر «اتصال» متجاورين. الصف أعرض من الشاشة، فتتحرّك الصفحة أفقيًا."
    prompt:
      en: "What's the best fix?"
      ar: "ما أفضل إصلاح؟"
    options:
      - { id: tiny, text: { en: "Shrink the text to 10px so the row fits", ar: "صغّر النص إلى 10 بكسل حتى يتّسع الصف" } }
      - { id: wrap, text: { en: "Let the Call button wrap under the driver's name when there isn't room", ar: "اسمح لزر «اتصال» بالنزول تحت اسم السائق عندما لا تكفي المساحة" } }
      - { id: hide, text: { en: "Hide the Call button on small phones", ar: "أخفِ زر «اتصال» على الهواتف الصغيرة" } }
    answer: [wrap]
    misconceptions:
      - id: MC-P10-060
        when: [tiny]
        feedback:
          en: "Tiny text fits but can't be read. Rearrange instead of shrinking."
          ar: "النص الصغير جدًا يتّسع لكنه لا يُقرأ. أعد الترتيب بدلًا من التصغير."
      - id: MC-P10-061
        when: [hide]
        feedback:
          en: "Calling the driver is one of the two things Lina needs right now. It can move, but it can't go."
          ar: "الاتصال بالسائق أحد الشيئين اللذين تحتاجهما لينا الآن. يمكن أن ينتقل، لكن لا يمكن أن يختفي."
    correct:
      en: "Let it wrap: same content, new arrangement."
      ar: "اسمح له بالالتفاف: المحتوى نفسه، بترتيب جديد."
    explain:
      en: "Rows that fit on wider screens should be allowed to wrap on narrow ones. That keeps everything readable without sideways scrolling."
      ar: "الصفوف التي تتّسع في الشاشات الأعرض يجب أن يُسمح لها بالالتفاف في الضيّقة. هذا يبقي كل شيء مقروءًا دون تمرير أفقي."

  - id: S09
    type: card
    part: recap
    icons: [space, width, eye, wrap]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- Content width is the screen width minus both gutters.\n- Breakpoints come from your content, not from device names.\n- One screenshot proves one width. Check 320px, the switch points, and enlarged text.\n- Let rows wrap instead of shrinking the text.\n\nNext lesson: an order that makes sense without the columns."
      ar: "- عرض المحتوى هو عرض الشاشة ناقص الـ Gutters من الجانبين.\n- الـ Breakpoints تأتي من المحتوى، لا من أسماء الأجهزة.\n- لقطة الشاشة الواحدة تثبت عرضًا واحدًا. تحقّق عند 320 بكسل، وعند نقاط التحوّل، ومع تكبير النص.\n- اسمح للصفوف بالنزول لسطر جديد بدلًا من تصغير النص.\n\nالدرس التالي: ترتيب منطقي حتى بدون الأعمدة."
