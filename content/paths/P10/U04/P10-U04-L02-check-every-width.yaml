id: P10-U04-L02
mode: lesson
minutes: 8
title:
  en: "Check every width, not one screenshot"
  ar: "افحص كل عرض، لا لقطة شاشة واحدة"
sources:
  - title: { en: "Breakpoints in Responsive Design (NN/g)", ar: "نقاط التحوّل (Breakpoints) في التصميم المتجاوب (NN/g)" }
    url: "https://www.nngroup.com/articles/breakpoints-in-responsive-design/"
  - title: { en: "Responsive Web Design (RWD) and User Experience (NN/g)", ar: "التصميم المتجاوب (Responsive design) وتجربة المستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/responsive-web-design-definition/"
review_labels:
  MC-P10-060: { en: "Responsive isn't scaling everything down", ar: "الـ Responsive design ليس تصغير كل شيء" }
  MC-P10-061: { en: "Hide what's optional, never what decides", ar: "أخفِ الاختياري، لا ما يحسم القرار" }
  MC-P10-063: { en: "One screenshot doesn't prove a layout works", ar: "لقطة شاشة واحدة لا تثبت أن التخطيط يعمل" }
  MC-P10-078: { en: "Fitting isn't the same as usable", ar: "الاتّساع ليس هو سهولة الاستخدام" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Mobile done\"", ar: "«انتهينا من الهاتف»" }
    body:
      en: "A teammate checked Sara's page on their own phone and shared a screenshot: \"Mobile done.\"\n\nThe screenshot looks great. But phones come in many widths, and so do tablets and laptop windows."
      ar: "فحص أحد الزملاء صفحة سارة على هاتفه وشارك لقطة شاشة: «انتهينا من الهاتف».\n\nاللقطة تبدو رائعة. لكن الهواتف بعروض كثيرة، وكذلك الأجهزة اللوحية ونوافذ الـ Laptop."
    mock:
      caption: { en: "The teammate's phone", ar: "هاتف الزميل" }
      width: 340
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - kind: row
          gap: m
          blocks:
            - { kind: button, text: "@W1f" }
            - { kind: button, emphasis: low, text: { en: "Add to calendar", ar: "أضف إلى التقويم" } }

  - id: S02
    type: tune
    part: try
    rules: [R12]
    value:
      en: "Responsive design (NN/g): page elements reshuffle as the viewport shrinks. On a narrower phone, rows that fit before must be allowed to rearrange, not shrink or overflow."
      ar: "التصميم المتجاوب (NN/g): تُعاد ترتيب عناصر الصفحة كلما صغرت الشاشة. وعلى هاتف أضيق، يجب أن يُسمح للصفوف التي كانت تتّسع بأن يُعاد ترتيبها، لا أن تصغر أو تخرج عن الشاشة."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "In responsive design, page elements reshuffle as the viewport grows or shrinks." }
    prompt:
      en: "Here's the same page on a narrower phone. The title is cut off and the second button runs off the screen. Try each fix. Which one should ship?"
      ar: "هذه الصفحة نفسها على هاتف أضيق. العنوان مقطوع، والزر الثاني يخرج عن الشاشة. جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now, narrow phone", ar: "الآن، هاتف ضيّق" }
      width: 250
      blocks: &narrow
        - { kind: title, nowrap: true, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - kind: group
          tone: plain
          scroll: true
          colw: 150
          gap: m
          blocks:
            - kind: row
              blocks:
                - { kind: button, text: "@W1f" }
                - { kind: button, emphasis: low, text: { en: "Add to calendar", ar: "أضف إلى التقويم" } }
    options:
      - id: small
        text: { en: "Make all the text smaller on narrow phones so it fits", ar: "صغّر كل النصوص على الهواتف الضيّقة حتى تتّسع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: text, px: 13, weight: bold, text: "@W1a" }
            - { kind: text, px: 9, text: "@W1b", gap: s }
            - kind: row
              gap: s
              blocks:
                - { kind: button, px: 8, text: "@W1f" }
                - { kind: button, px: 8, emphasis: low, text: { en: "Add to calendar", ar: "أضف إلى التقويم" } }
      - id: wrap
        text: { en: "Let the title wrap, and stack the buttons when the row doesn't fit", ar: "اسمح للعنوان بالالتفاف، وضع الزرّين فوق بعض حين لا يتّسع الصف" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: button, emphasis: low, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: s }
      - id: drop
        text: { en: "Remove Add to calendar on narrow phones", ar: "احذف «أضف إلى التقويم» على الهواتف الضيّقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: title, nowrap: true, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
    answer: [wrap]
    misconceptions:
      - id: MC-P10-060
        when: [small]
        feedback:
          en: "Everything fits, but now nothing is comfortable to read. Rearrange instead: let lines wrap and rows stack."
          ar: "كل شيء يتّسع، لكن لا شيء صار مريحًا في القراءة. أعِد الترتيب بدلًا من ذلك: دع الأسطر تلتفّ والصفوف تتراصّ."
      - id: MC-P10-061
        when: [drop]
        feedback:
          en: "People with narrow phones want to add the session to their calendar too, and the title is still cut off. Keep the action; change the arrangement."
          ar: "أصحاب الهواتف الضيّقة يريدون إضافة الجلسة إلى التقويم أيضًا، والعنوان ما زال مقطوعًا. أبقِ الإجراء؛ وغيّر الترتيب."
    correct:
      en: "Same content, rearranged for the narrow screen."
      ar: "المحتوى نفسه، بترتيب جديد للشاشة الضيّقة."
    explain:
      en: "The teammate's screenshot couldn't show this: it broke only on a narrower screen. Lines that wrap and rows that stack keep working as the screen shrinks."
      ar: "لم تستطع لقطة الزميل إظهار هذا: فالمشكلة ظهرت فقط على شاشة أضيق. والأسطر التي تلتفّ والصفوف التي تتراصّ تبقى تعمل كلما ضاقت الشاشة."

  - id: S03
    type: card
    part: concept
    icons: [phone, layers, eye, form]
    title: { en: "A layout lives across a range", ar: "التخطيط يعيش على مدى من العروض" }
    body:
      en: "A layout isn't one size; it has to work from the narrowest phone to a wide laptop window.\n\n- **Breakpoint:** a width where the design switches to a different layout, such as from one column to two. Most designs need only 2 or 3.\n- **Check the range:** the narrowest width, the widest, and just above and below each breakpoint, where things break most.\n- **Fitting isn't enough:** a layout can fit on screen and still be hard to use.\n- **Tell the developers:** for each breakpoint, say what changes. One screenshot can't."
      ar: "التخطيط ليس حجمًا واحدًا؛ بل يجب أن يعمل من أضيق هاتف إلى أعرض نافذة Laptop.\n\n- **نقطة التحوّل (Breakpoint):** عرض يتحوّل عنده التصميم إلى تخطيط مختلف، مثل الانتقال من عمود إلى عمودين. ومعظم التصاميم تحتاج 2 أو 3 فقط.\n- **افحص المدى كله:** أضيق عرض، وأعرض عرض، وما فوق كل نقطة تحوّل وما تحتها مباشرة، حيث تنكسر الأشياء غالبًا.\n- **الاتّساع لا يكفي:** قد يتّسع التخطيط في الشاشة ويبقى صعب الاستخدام.\n- **أخبر المطوّرين:** لكل نقطة تحوّل، قل ما الذي يتغيّر. لقطة واحدة لا تستطيع ذلك."

  - id: S04
    type: tune
    part: guided
    rules: [R06, R13]
    value:
      en: "Breakpoints (NN/g): a breakpoint is a screen size where the design adjusts to a different layout; once designed and tested, communicate to developers how the design will change."
      ar: "نقاط التحوّل (NN/g): نقطة التحوّل حجم شاشة يتغيّر عنده التصميم إلى تخطيط مختلف؛ وبعد التصميم والاختبار، أخبر المطوّرين كيف سيتغيّر التصميم."
    ref: { url: "https://www.nngroup.com/articles/breakpoints-in-responsive-design/", quote: "communicate to developers how the design will change" }
    scenario:
      en: "Sara's page has one breakpoint: below it, one column; above it, two. You're handing the design to the developers."
      ar: "لصفحة سارة نقطة تحوّل واحدة: تحتها عمود واحد، وفوقها عمودان. وأنت تسلّم التصميم للمطوّرين."
    prompt:
      en: "Try each handoff. Which one should ship?"
      ar: "جرّب كل طريقة تسليم. أيّها يجب أن تُطلق؟"
    start: one
    options:
      - id: one
        text: { en: "The phone screenshot: \"Mobile done\"", ar: "لقطة الهاتف: «انتهينا من الهاتف»" }
        mock:
          caption: { en: "Handoff", ar: "التسليم" }
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: { en: "Phone screenshot", ar: "لقطة الهاتف" } }
                - { kind: image, size: m, text: { en: "Phone layout", ar: "تخطيط الهاتف" }, gap: xs }
      - id: notes
        text: { en: "Both layouts, plus what changes at the breakpoint and what must wrap", ar: "التخطيطان، مع ما يتغيّر عند نقطة التحوّل وما يجب أن يلتفّ" }
        mock:
          caption: { en: "Handoff", ar: "التسليم" }
          blocks:
            - kind: row
              blocks:
                - { kind: image, size: s, text: { en: "Phone layout", ar: "تخطيط الهاتف" } }
                - { kind: image, size: s, text: { en: "Laptop layout", ar: "تخطيط الـ Laptop" } }
            - kind: group
              gap: s
              blocks:
                - { kind: small, text: { en: "Below the breakpoint: one column; booking panel after the facts; photo becomes a thumbnail.", ar: "تحت نقطة التحوّل: عمود واحد؛ لوحة الحجز بعد المعلومات؛ والصورة تصبح مصغّرة." } }
                - { kind: small, text: { en: "Titles wrap, never cut off. Button rows stack when they don't fit.", ar: "العناوين تلتفّ ولا تُقطع أبدًا. وصفوف الأزرار تتراصّ حين لا تتّسع." }, gap: xs }
      - id: two
        text: { en: "The phone and laptop screenshots, side by side", ar: "لقطتا الهاتف والـ Laptop، جنبًا إلى جنب" }
        mock:
          caption: { en: "Handoff", ar: "التسليم" }
          blocks:
            - kind: row
              blocks:
                - { kind: image, size: m, text: { en: "Phone layout", ar: "تخطيط الهاتف" } }
                - { kind: image, size: m, text: { en: "Laptop layout", ar: "تخطيط الـ Laptop" } }
    answer: [notes]
    misconceptions:
      - id: MC-P10-063
        when: [one, two]
        feedback:
          en: "Screenshots show two widths. They don't say what happens in between, or what should wrap on a narrower phone. Write down what changes."
          ar: "اللقطات تُظهر عرضين. ولا تقول ماذا يحدث بينهما، أو ما الذي يجب أن يلتفّ على هاتف أضيق. اكتب ما الذي يتغيّر."
    correct:
      en: "Say what changes, not just how two sizes look."
      ar: "قل ما الذي يتغيّر، لا كيف يبدو حجمان فقط."
    explain:
      en: "Developers build the whole range, not two pictures. Short notes on what changes at each breakpoint, and what must wrap or stack, stop the gaps from being guessed."
      ar: "المطوّرون يبنون المدى كله، لا صورتين. والملاحظات القصيرة عمّا يتغيّر عند كل نقطة تحوّل، وما يجب أن يلتفّ أو يتراصّ، تمنع تخمين الفراغات."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "Breakpoints (NN/g): at a smaller breakpoint, a right column may collapse into the main content area or become available elsewhere."
      ar: "نقاط التحوّل (NN/g): عند نقطة تحوّل أصغر، قد يندمج العمود الأيمن في منطقة المحتوى الرئيسي أو يصبح متاحًا في مكان آخر."
    ref: { url: "https://www.nngroup.com/articles/breakpoints-in-responsive-design/", quote: "A right column, if present, may collapse into the main content area or become available elsewhere." }
    scenario:
      en: "On a wide laptop, the page has a third column, \"Other sessions\", that people use when this one is full. On a tablet, three columns no longer fit."
      ar: "على الـ Laptop العريض، في الصفحة عمود ثالث «جلسات أخرى» يستخدمه الناس حين تكون هذه الجلسة مكتملة. وعلى الجهاز اللوحي، لم تعد الأعمدة الثلاثة تتّسع."
    prompt:
      en: "Try each tablet layout. Which one should ship?"
      ar: "جرّب كل تخطيط للجهاز اللوحي. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now, tablet", ar: "الآن، جهاز لوحي" }
      width: 460
      blocks: &three
        - kind: row
          gap: s
          blocks:
            - kind: group
              tone: plain
              blocks:
                - { kind: heading, text: "@W1a" }
                - { kind: small, text: "@W1b", gap: xs }
            - kind: group
              blocks:
                - { kind: small, text: "@W1d" }
                - { kind: button, text: "@W1f", gap: s }
            - kind: group
              tone: tint
              blocks:
                - { kind: small, text: { en: "Other sessions", ar: "جلسات أخرى" } }
                - { kind: small, text: "@W1next", gap: xs }
    options:
      - id: squeeze
        text: { en: "Keep all three columns, narrower", ar: "أبقِ الأعمدة الثلاثة، لكن أضيق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 460
          blocks: *three
      - id: collapse
        text: { en: "Two columns; \"Other sessions\" moves under the details in the main column", ar: "عمودان؛ و«جلسات أخرى» تنتقل تحت التفاصيل في العمود الرئيسي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 460
          blocks:
            - kind: row
              gap: m
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: title, text: "@W1a" }
                    - { kind: meta, text: "@W1b", gap: xs }
                    - { kind: heading, text: { en: "Other sessions", ar: "جلسات أخرى" }, gap: m }
                    - { kind: small, text: "@W1next", gap: xs }
                - kind: group
                  blocks:
                    - { kind: meta, text: "@W1d" }
                    - { kind: button, text: "@W1f", gap: s }
      - id: drop
        text: { en: "Two columns; drop \"Other sessions\" on tablets", ar: "عمودان؛ واحذف «جلسات أخرى» على الأجهزة اللوحية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 460
          blocks:
            - kind: row
              gap: m
              blocks:
                - kind: group
                  tone: plain
                  blocks:
                    - { kind: title, text: "@W1a" }
                    - { kind: meta, text: "@W1b", gap: xs }
                - kind: group
                  blocks:
                    - { kind: meta, text: "@W1d" }
                    - { kind: button, text: "@W1f", gap: s }
    answer: [collapse]
    misconceptions:
      - id: MC-P10-060
        when: [squeeze]
        feedback:
          en: "Three narrow columns break every line into a word or two. When columns stop fitting, change the layout."
          ar: "ثلاثة أعمدة ضيّقة تكسر كل سطر إلى كلمة أو اثنتين. حين تتوقّف الأعمدة عن الاتّساع، غيّر التخطيط."
      - id: MC-P10-061
        when: [drop]
        feedback:
          en: "People rely on \"Other sessions\" when this one is full, and they'd lose it on tablets. Move it; don't remove it."
          ar: "يعتمد الناس على «جلسات أخرى» حين تكون هذه الجلسة مكتملة، وسيفقدونها على الأجهزة اللوحية. انقلها؛ لا تحذفها."
    correct:
      en: "The side column moves into the main one."
      ar: "العمود الجانبي ينتقل إلى العمود الرئيسي."
    explain:
      en: "At each breakpoint, decide where every column goes. A side column usually folds into the main content, so nothing is lost and nothing is squeezed."
      ar: "عند كل نقطة تحوّل، قرّر أين يذهب كل عمود. والعمود الجانبي عادةً يندمج في المحتوى الرئيسي، فلا يضيع شيء ولا يُعصر شيء."

  - id: S06
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02: here nothing overflows, yet one version is still hard to use. NN/g: ensuring that elements fit within a page is not enough."
      ar: "مقارنة مع الخطوة 2: هنا لا شيء يخرج عن الشاشة، ومع ذلك تبقى نسخة صعبة الاستخدام. NN/g: التأكّد من أن العناصر تتّسع في الصفحة لا يكفي."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "However, ensuring that elements fit within a page is not enough." }
    scenario:
      en: "On the narrowest phone, after reserving, Sara can add the session to her calendar, share it, or get directions. Both versions fit the screen."
      ar: "على أضيق هاتف، وبعد الحجز، تستطيع سارة إضافة الجلسة إلى التقويم، أو مشاركتها، أو معرفة الطريق. والنسختان تتّسعان في الشاشة."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      mock:
        width: 250
        blocks:
          - { kind: title, text: { en: "You're booked!", ar: "تمّ حجزك!" } }
          - kind: row
            gap: m
            blocks:
              - { kind: button, px: 9, text: { en: "Calendar", ar: "التقويم" } }
              - { kind: button, px: 9, emphasis: low, text: { en: "Share", ar: "مشاركة" } }
              - { kind: button, px: 9, emphasis: low, text: { en: "Directions", ar: "الطريق" } }
    b:
      mock:
        width: 250
        blocks:
          - { kind: title, text: { en: "You're booked!", ar: "تمّ حجزك!" } }
          - { kind: button, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: m }
          - { kind: button, emphasis: low, text: { en: "Share", ar: "مشاركة" }, gap: s }
          - { kind: button, emphasis: low, text: { en: "Get directions", ar: "اعرف الطريق" }, gap: s }
    answer: b
    reason:
      prompt: { en: "What makes A worse, if both fit?", ar: "ما الذي يجعل A أسوأ، إن كانت النسختان تتّسعان؟" }
      options:
        - { id: fit, text: { en: "Nothing; if it fits, it works", ar: "لا شيء؛ ما دام يتّسع فهو يعمل" } }
        - { id: tiny, text: { en: "The buttons fit only by becoming tiny, with shortened labels that are hard to read and tap", ar: "الأزرار تتّسع فقط لأنها صارت صغيرة جدًا، بأسماء مختصرة يصعب قراءتها والضغط عليها" } }
        - { id: three, text: { en: "Three buttons on one screen is always too many", ar: "ثلاثة أزرار في شاشة واحدة كثيرة دائمًا" } }
      answer: [tiny]
      misconceptions:
        - id: MC-P10-078
          when: [fit, three]
          feedback:
            en: "Three buttons are fine. A fits only because the text and buttons shrank. Check that it's comfortable, not just that it fits."
            ar: "ثلاثة أزرار مقبولة. لكن A تتّسع فقط لأن النص والأزرار صغرت. افحص أنها مريحة، لا أنها تتّسع فقط."
    misconceptions:
      - id: MC-P10-078
        when: [a]
        feedback:
          en: "A fits, but the labels are tiny and cut short, and the buttons are hard to hit. Fitting on screen isn't the goal; being usable is."
          ar: "A تتّسع، لكن الأسماء صغيرة جدًا ومختصرة، والأزرار يصعب إصابتها. الاتّساع في الشاشة ليس الهدف؛ سهولة الاستخدام هي الهدف."
    correct:
      en: "Usable, not just fitting."
      ar: "سهل الاستخدام، لا متّسع فقط."
    explain:
      en: "In S02 something overflowed, so the problem was easy to see. Here everything fits, which is why it slips through review. When you check a width, ask whether people can read and tap everything comfortably."
      ar: "في الخطوة 2 خرج شيء عن الشاشة، فكانت المشكلة سهلة الرؤية. أما هنا فكل شيء يتّسع، ولهذا تمرّ في المراجعة. حين تفحص عرضًا، اسأل: هل يستطيع الناس قراءة كل شيء والضغط عليه بارتياح؟"

  - id: S07
    type: tune
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Responsive design (NN/g): elements reshuffle as the viewport shrinks. A row that fits on most phones has to wrap on the narrowest ones."
      ar: "حالة جديدة. التصميم المتجاوب (NN/g): تُعاد ترتيب العناصر كلما صغرت الشاشة. والصف الذي يتّسع في معظم الهواتف يجب أن يلتفّ في أضيقها."
    ref: { url: "https://www.nngroup.com/articles/responsive-web-design-definition/", quote: "page elements reshuffle as the viewport grows or shrinks" }
    scenario:
      en: "On Lina's narrow phone, the driver's name and the Call button sit in one row that's wider than the screen, so the page scrolls sideways."
      ar: "على هاتف لينا الضيّق، اسم السائق وزر الاتصال في صف واحد أعرض من الشاشة، فتتحرّك الصفحة جانبيًا."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now, narrow phone", ar: "الآن، هاتف ضيّق" }
      width: 250
      blocks:
        - { kind: title, text: "@D1a" }
        - kind: group
          tone: plain
          scroll: true
          colw: 150
          gap: m
          blocks:
            - kind: row
              blocks:
                - { kind: meta, text: { en: "Driver: Karim Hassan", ar: "السائق: كريم حسن" } }
                - { kind: button, emphasis: low, text: { en: "Call driver", ar: "اتصل بالسائق" } }
        - { kind: small, text: "@D1c", gap: s }
    options:
      - id: hide
        text: { en: "Hide the Call button on narrow phones", ar: "أخفِ زر الاتصال على الهواتف الضيّقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: title, text: "@D1a" }
            - { kind: meta, text: { en: "Driver: Karim Hassan", ar: "السائق: كريم حسن" }, gap: m }
            - { kind: small, text: "@D1c", gap: s }
      - id: wrap
        text: { en: "Let the row wrap: the name, then the Call button below it", ar: "اسمح للصف بالالتفاف: الاسم، ثم زر الاتصال تحته" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: title, text: "@D1a" }
            - { kind: meta, text: { en: "Driver: Karim Hassan", ar: "السائق: كريم حسن" }, gap: m }
            - { kind: button, emphasis: low, text: { en: "Call driver", ar: "اتصل بالسائق" }, gap: s }
            - { kind: small, text: "@D1c", gap: s }
      - id: shrink
        text: { en: "Keep one row, with smaller text and a smaller button", ar: "أبقِ صفًّا واحدًا، بنص أصغر وزر أصغر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 250
          blocks:
            - { kind: title, text: "@D1a" }
            - kind: row
              gap: m
              blocks:
                - { kind: text, px: 9, text: { en: "Driver: Karim Hassan", ar: "السائق: كريم حسن" } }
                - { kind: button, px: 8, emphasis: low, text: { en: "Call driver", ar: "اتصل بالسائق" } }
            - { kind: small, text: "@D1c", gap: s }
    answer: [wrap]
    misconceptions:
      - id: MC-P10-061
        when: [hide]
        feedback:
          en: "Lina may need to call the driver, and her phone is no less important. Keep the button; change where it sits."
          ar: "قد تحتاج لينا إلى الاتصال بالسائق، وهاتفها ليس أقل أهمية. أبقِ الزر؛ وغيّر مكانه."
      - id: MC-P10-078
        when: [shrink]
        feedback:
          en: "It fits now, but the name is hard to read and the button hard to tap. Let it wrap instead."
          ar: "صار يتّسع، لكن الاسم يصعب قراءته والزر يصعب الضغط عليه. اسمح له بالالتفاف بدلًا من ذلك."
    correct:
      en: "Let it wrap."
      ar: "اسمح له بالالتفاف."
    explain:
      en: "Same fix as Sara's buttons: a row that fits on wider screens should wrap on narrow ones. Everything stays readable, tappable, and on screen."
      ar: "الإصلاح نفسه في أزرار سارة: الصف الذي يتّسع على الشاشات الأعرض يجب أن يلتفّ على الضيّقة. فيبقى كل شيء مقروءًا، وسهل الضغط، وداخل الشاشة."

  - id: S08
    type: card
    part: recap
    icons: [phone, layers, eye, form]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Narrow end:** let titles wrap and rows stack instead of shrinking or overflowing.\n- **Breakpoints:** folded a side column into the main one instead of squeezing or dropping it.\n- **Handoff:** wrote down what changes at each breakpoint.\n- **Usable, not just fitting:** checked that everything is comfortable to read and tap.\n\nNext lesson: an order that makes sense without the columns."
      ar: "- **العرض الأضيق:** دع العناوين تلتفّ والصفوف تتراصّ، بدل التصغير أو الخروج عن الشاشة.\n- **نقاط التحوّل:** أدمجت العمود الجانبي في الرئيسي بدل عصره أو حذفه.\n- **التسليم:** كتبت ما يتغيّر عند كل نقطة تحوّل.\n- **سهل الاستخدام، لا متّسع فقط:** تأكّدت أن كل شيء مريح في القراءة والضغط.\n\nالدرس التالي: ترتيب منطقي دون الأعمدة."
