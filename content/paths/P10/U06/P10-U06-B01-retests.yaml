    url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/"
  - title: { en: "Why 5 Participants Are Okay in a Qualitative Study, but Not in a Quantitative One (NN/g)", ar: "لماذا يكفي 5 مشاركين في الدراسة النوعية، لا في الكمية (NN/g)" }
    url: "https://www.nngroup.com/articles/5-test-users-qual-quant/"
  - title: { en: "Thinking Aloud: The #1 Usability Tool (NN/g)", ar: "التفكير بصوت عالٍ: أداة سهولة الاستخدام الأولى (NN/g)" }
    url: "https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/"
  - title: { en: "Checklist for Planning Usability Studies (NN/g)", ar: "قائمة تحقّق لتخطيط دراسات سهولة الاستخدام (NN/g)" }
    url: "https://www.nngroup.com/articles/usability-checklist/"
  - title: { en: "Usability Testing 101 (NN/g)", ar: "اختبار سهولة الاستخدام 101 (NN/g)" }
    url: "https://www.nngroup.com/articles/usability-testing-101/"
steps:
  # SK-P10-U06-01: watch what people do
  - id: S01
    type: tune
    skill: SK-P10-U06-01
    part: retest
    speaker: hana
    value:
      en: "Re-test, first rule of usability (NN/g): what people predict about their own future behavior is unreliable. Watch them try it."
      ar: "إعادة اختبار، القاعدة الأولى في سهولة الاستخدام (NN/g): ما يتوقّعه الناس عن سلوكهم المستقبلي لا يُعتمد عليه. راقبهم وهم يجرّبونه."
    ref: { url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/", quote: "Self-reported claims are unreliable, as are user speculations about future behavior." }
    scenario:
      en: "I added a \"Freeze membership\" option to my gym's app, inside Settings. I want to know if members who travel will find it."
      ar: "أضفت خيار «تجميد الاشتراك» إلى تطبيق صالتي الرياضية، داخل الإعدادات. وأريد أن أعرف هل سيجده الأعضاء المسافرون."
    prompt:
      en: "Try each check. Which one should I use?"
      ar: "جرّب كل طريقة تحقّق. أيّها يجب أن أستخدم؟"
    start: ask
    options:
      - id: ask
        text: { en: "Ask members at the desk: \"Would you find a freeze option in the app?\"", ar: "اسأل الأعضاء عند المكتب: «هل كنت ستجد خيار التجميد في التطبيق؟»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h1 { en: "Check plan", ar: "خطة التحقّق" } }
                - { kind: text, text: { en: "Ask 20 members at the front desk: \"Would you find a freeze option in the app?\"", ar: "اسأل 20 عضوًا عند مكتب الاستقبال: «هل كنت ستجد خيار التجميد في التطبيق؟»" }, gap: xs }
      - id: try
        text: { en: "Give 5 members a task and watch them on their phones", ar: "أعطِ 5 أعضاء مهمة وراقبهم على هواتفهم" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h1 }
                - { kind: text, text: { en: "5 members, one at a time: \"You're travelling for three weeks next month. Sort out your membership in the app.\" I watch where they tap.", ar: "5 أعضاء، كلٌّ على حدة: «ستسافر ثلاثة أسابيع الشهر القادم. رتّب اشتراكك في التطبيق.» وأراقب أين يضغطون." }, gap: xs }
      - id: poster
        text: { en: "Put up a poster and count how many members say they saw it", ar: "علّق ملصقًا واحسب كم عضوًا يقول إنه رآه" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h1 }
                - { kind: text, text: { en: "Poster at the entrance: \"New! Freeze in the app.\" Ask at checkout: \"Did you see our poster?\"", ar: "ملصق عند المدخل: «جديد! التجميد في التطبيق.» واسأل عند الخروج: «هل رأيت ملصقنا؟»" }, gap: xs }
    answer: [try]
    misconceptions:
      - id: MC-P10-084
        when: [ask, poster]
        feedback:
          en: "Both collect what members say, not what they do. Only watching someone try it shows if Freeze is findable inside Settings."
          ar: "كلاهما يجمع ما يقوله الأعضاء، لا ما يفعلونه. ووحدها مراقبة أحدهم وهو يجرّب تُظهر هل يمكن إيجاد «التجميد» داخل الإعدادات."
    explain:
      en: "Give a real situation without naming the feature, then watch. Predictions about \"would you\" don't count as evidence."
      ar: "قدّم موقفًا حقيقيًا دون ذكر اسم الميزة، ثم راقب. والتوقّعات من نوع «هل كنت ستفعل» لا تُعدّ دليلًا."

  - id: S02
    type: tune
    skill: SK-P10-U06-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test, first rule of usability (NN/g): if people haven't tried the design, their comments are about surface features."
      ar: "إعادة اختبار، القاعدة الأولى في سهولة الاستخدام (NN/g): إن لم يجرّب الناس التصميم، تكون تعليقاتهم عن المظهر السطحي."
    ref: { url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/", quote: "If the users have not actually tried to use the designs, they'll base their comments on surface features." }
    scenario:
      en: "We have two versions of the expense-claim screen. I need to choose one by Thursday."
      ar: "عندنا نسختان من شاشة طلب استرداد المصروفات. وعليّ أن أختار واحدة قبل الخميس."
    prompt:
      en: "Try each way to decide. Which one should I use?"
      ar: "جرّب كل طريقة للقرار. أيّها يجب أن أستخدم؟"
    start: vote
    options:
      - id: vote
        text: { en: "Show both to 30 employees and let them vote", ar: "اعرض النسختين على 30 موظفًا ودعهم يصوّتون" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h2 { en: "Decision plan", ar: "خطة القرار" } }
                - { kind: text, text: { en: "Slide with A and B side by side. \"Which do you prefer?\" Most votes wins.", ar: "شريحة فيها A وB جنبًا إلى جنب. «أيّهما تفضّل؟» والأكثر أصواتًا يفوز." }, gap: xs }
      - id: lead
        text: { en: "Ask the finance lead which one looks more professional", ar: "اسأل مسؤول المالية أيّهما يبدو أكثر احترافية" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h2 }
                - { kind: text, text: { en: "Email the finance lead both screenshots: \"Which looks more professional?\"", ar: "أرسل لمسؤول المالية الصورتين: «أيّهما تبدو أكثر احترافية؟»" }, gap: xs }
      - id: task
        text: { en: "Have a few employees each submit a real receipt on both, and watch", ar: "اجعل بعض الموظفين يقدّمون إيصالًا حقيقيًا على النسختين، وراقب" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h2 }
                - { kind: text, text: { en: "5 employees submit last week's taxi receipt on A and on B. I note where each one gets stuck.", ar: "5 موظفين يقدّمون إيصال سيارة الأجرة من الأسبوع الماضي على A وعلى B. وأسجّل أين يتعثّر كلٌّ منهم." }, gap: xs }
    answer: [task]
    misconceptions:
      - id: MC-P10-084
        when: [vote, lead]
        feedback:
          en: "Without trying the screens, people judge looks. A pretty screen can still hide the field everyone misses."
          ar: "دون تجربة الشاشات، يحكم الناس على الشكل. والشاشة الجميلة قد تُخفي الحقل الذي يفوت الجميع."
    explain:
      en: "Let people do the real task on each version. What they struggle with decides, not what they prefer at a glance."
      ar: "دع الناس يؤدّون المهمة الحقيقية على كل نسخة. وما يتعثّرون فيه هو ما يحسم الأمر، لا ما يفضّلونه من نظرة."

  # SK-P10-U06-02: define success before the test
  - id: S03
    type: tune
    skill: SK-P10-U06-02
    part: retest
    speaker: nour
    value:
      en: "Re-test, success rate (NN/g): a task not done as specified can be scored as a failure. Write the specification before testing."
      ar: "إعادة اختبار، معدّل النجاح (NN/g): المهمة التي لم تُنجز كما حُدّدت يمكن اعتبارها فشلًا. اكتب التحديد قبل الاختبار."
    ref: { url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/", quote: "If a user does not perform a task as specified, you could be strict and score it as a failure." }
    scenario:
      en: "We're testing how patients upload lab results to our clinic portal. Tomorrow, 5 patients try it. I'm writing the success rule tonight."
      ar: "نختبر كيف يرفع المرضى نتائج التحاليل إلى بوابة عيادتنا. وغدًا يجرّبها 5 مرضى. وأكتب قاعدة النجاح الليلة."
    prompt:
      en: "Try each rule. Which one should I use?"
      ar: "جرّب كل قاعدة. أيّها يجب أن أستخدم؟"
    start: decide
    options:
      - id: decide
        text: { en: "Decide after each session whether it went well", ar: "قرّر بعد كل جلسة هل سارت جيدًا" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h3 { en: "Success rule", ar: "قاعدة النجاح" } }
                - { kind: text, text: { en: "We'll judge each session when it ends.", ar: "سنحكم على كل جلسة عند انتهائها." }, gap: xs }
      - id: file
        text: { en: "The PDF is attached to their own record, under the right test, with no help", ar: "ملف PDF مرفق بسجلّهم، تحت التحليل الصحيح، دون مساعدة" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h3 }
                - { kind: text, text: { en: "Success: the lab PDF ends up in the patient's own record, under \"Blood test\", within 3 minutes, with no help. Wrong section or a call to reception = fail.", ar: "النجاح: يصل ملف التحليل إلى سجلّ المريض نفسه، تحت «تحليل دم»، خلال 3 دقائق، دون مساعدة. القسم الخطأ أو الاتصال بالاستقبال = فشل." }, gap: xs }
      - id: tap
        text: { en: "They tap the Upload button", ar: "يضغطون زر «رفع»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h3 }
                - { kind: text, text: { en: "Success: the patient taps Upload.", ar: "النجاح: يضغط المريض «رفع»." }, gap: xs }
    answer: [file]
    misconceptions:
      - id: MC-P10-085
        when: [decide, tap]
        feedback:
          en: "Deciding later lets hope bend the result, and tapping Upload isn't finishing: the file can still land in the wrong place."
          ar: "القرار لاحقًا يسمح للأمل بأن يُليّن النتيجة، والضغط على «رفع» ليس إنجازًا: فقد يصل الملف إلى المكان الخطأ."
    explain:
      en: "Write a checkable end result, a time limit and what counts as a fail before the first session."
      ar: "اكتب نتيجة نهائية يمكن التحقّق منها، وحدًّا زمنيًا، وما يُعدّ فشلًا قبل الجلسة الأولى."

  - id: S04
    type: tune
    skill: SK-P10-U06-02
    part: retest
    speaker: karim
    value:
      en: "Re-test, success rate (NN/g): success rate is the share of users who complete the task. You can only count completions if \"complete\" is defined first."
      ar: "إعادة اختبار، معدّل النجاح (NN/g): معدّل النجاح هو نسبة المستخدمين الذين أكملوا المهمة. ولا يمكنك عدّ الإكمال إلا إذا عرّفت «الإكمال» أولًا."
    ref: { url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/", quote: "the percentage of users who were able to complete a task in a study." }
    scenario:
      en: "I built the new password reset flow. The designer is testing it with 5 people, and asked me what a finished reset means."
      ar: "بنيت مسار إعادة تعيين كلمة المرور الجديد. وتختبره المصمّمة مع 5 أشخاص، وسألتني ما معنى إعادة تعيين مكتملة."
    prompt:
      en: "Try each definition. Which one should she use?"
      ar: "جرّب كل تعريف. أيّها يجب أن تستخدم؟"
    start: email
    options:
      - id: signin
        text: { en: "They sign in with the new password, without help, within 5 minutes", ar: "يسجّلون الدخول بكلمة المرور الجديدة، دون مساعدة، خلال 5 دقائق" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h4 { en: "Done means", ar: "الإكمال يعني" } }
                - { kind: text, text: { en: "Done: the person is signed in with their new password within 5 minutes, with no help. Stuck on the email link or asking us = not done.", ar: "الإكمال: يكون الشخص قد سجّل الدخول بكلمة مروره الجديدة خلال 5 دقائق، دون مساعدة. التعثّر عند رابط البريد أو سؤالنا = غير مكتمل." }, gap: xs }
      - id: email
        text: { en: "They request the reset email", ar: "يطلبون رسالة إعادة التعيين" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h4 }
                - { kind: text, text: { en: "Done: the person taps \"Send reset link\".", ar: "الإكمال: يضغط الشخص «أرسل رابط إعادة التعيين»." }, gap: xs }
      - id: feel
        text: { en: "They say the flow felt smooth", ar: "يقولون إن المسار كان سلسًا" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h4 }
                - { kind: text, text: { en: "Done: the person says the reset felt smooth.", ar: "الإكمال: يقول الشخص إن إعادة التعيين كانت سلسة." }, gap: xs }
    answer: [signin]
    misconceptions:
      - id: MC-P10-085
        when: [email]
        feedback:
          en: "Requesting the email is only the first step. Most resets fail later, at the link or the new password rules."
          ar: "طلب الرسالة هو الخطوة الأولى فقط. وأغلب حالات إعادة التعيين تفشل لاحقًا، عند الرابط أو شروط كلمة المرور الجديدة."
      - id: MC-P10-084
        when: [feel]
        feedback:
          en: "\"Smooth\" is an opinion. The person might say it and still be locked out."
          ar: "«سلس» رأي. وقد يقولها الشخص ويبقى ممنوعًا من الدخول."
    explain:
      en: "Define done as the real goal reached: signed in with the new password, with a time limit and no help."
      ar: "عرّف الإكمال بأنه الوصول إلى الهدف الحقيقي: تسجيل الدخول بكلمة المرور الجديدة، بحدّ زمني ودون مساعدة."

  # SK-P10-U06-03: test small, fix, test again
  - id: S05
    type: tune
    skill: SK-P10-U06-03
    part: retest
    speaker: mona
    value:
      en: "Re-test, testing with 5 users (NN/g): run as many small tests as you can afford, with no more than about 5 people each."
      ar: "إعادة اختبار، الاختبار مع 5 مستخدمين (NN/g): أجرِ أكبر عدد ممكن من الاختبارات الصغيرة، بنحو 5 أشخاص على الأكثر في كل منها."
    ref: { url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/", quote: "The best results come from testing no more than 5 users and running as many small tests as you can afford." }
    scenario:
      en: "My team has budget for 20 sessions over the 8 weeks of the new onboarding project."
      ar: "لدى فريقي ميزانية لـ 20 جلسة خلال 8 أسابيع من مشروع التعريف بالتطبيق الجديد."
    prompt:
      en: "Try each plan. Which one should we use?"
      ar: "جرّب كل خطة. أيّها يجب أن نستخدم؟"
    start: big
    options:
      - id: big
        text: { en: "Two rounds of 10, in weeks 4 and 8", ar: "جولتان من 10، في الأسبوعين 4 و8" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h5 { en: "Test plan", ar: "خطة الاختبار" } }
                - { kind: text, text: { en: "Week 4: 10 people. Week 8: 10 people, then launch.", ar: "الأسبوع 4: 10 أشخاص. الأسبوع 8: 10 أشخاص، ثم الإطلاق." }, gap: xs }
      - id: final
        text: { en: "One round of 20 at the end, for a solid result", ar: "جولة واحدة من 20 في النهاية، لنتيجة متينة" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h5 }
                - { kind: text, text: { en: "Week 8: 20 people try the finished onboarding, then launch.", ar: "الأسبوع 8: 20 شخصًا يجرّبون التعريف النهائي، ثم الإطلاق." }, gap: xs }
      - id: four
        text: { en: "Four rounds of 5, every two weeks, fixing in between", ar: "أربع جولات من 5، كل أسبوعين، مع الإصلاح بينها" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h5 }
                - { kind: text, text: { en: "Weeks 2, 4, 6 and 8: 5 people each → fix after every round.", ar: "الأسابيع 2 و4 و6 و8: 5 أشخاص في كل منها ← إصلاح بعد كل جولة." }, gap: xs }
    answer: [four]
    misconceptions:
      - id: MC-P10-086
        when: [big, final]
        feedback:
          en: "People 6 to 10 or 6 to 20 mostly repeat what the first 5 showed. Four small rounds check three sets of fixes."
          ar: "الأشخاص من 6 إلى 10 أو من 6 إلى 20 يكرّرون غالبًا ما أظهره الخمسة الأوائل. وأربع جولات صغيرة تتحقّق من ثلاث مجموعات من الإصلاحات."
    explain:
      en: "Split the budget into rounds of about 5, with a fix after each. More rounds means more problems found and more fixes checked."
      ar: "قسّم الميزانية إلى جولات من نحو 5، مع إصلاح بعد كل منها. والجولات الأكثر تعني مشكلات أكثر تُكتشف وإصلاحات أكثر يُتحقّق منها."

  - id: S06
    type: tune
    skill: SK-P10-U06-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test, testing with 5 users (NN/g): after creating the new design, test again. The fix is a new design."
      ar: "إعادة اختبار، الاختبار مع 5 مستخدمين (NN/g): بعد إنشاء التصميم الجديد، اختبر مرة أخرى. فالإصلاح تصميم جديد."
    ref: { url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/", quote: "After creating the new design, you need to test again." }
    scenario:
      en: "In my first test, 4 of 5 customers missed the delivery fee until the last step. I moved it to the cart page."
      ar: "في اختباري الأول، لم يرَ 4 من 5 عملاء رسوم التوصيل حتى الخطوة الأخيرة. فنقلتها إلى صفحة السلّة."
    prompt:
      en: "Try each next step. Which one should I take?"
      ar: "جرّب كل خطوة تالية. أيّها يجب أن أتّخذ؟"
    start: done
    options:
      - id: done
        text: { en: "Done; the fee is visible now", ar: "انتهينا؛ الرسوم ظاهرة الآن" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h6 { en: "Next step", ar: "الخطوة التالية" } }
                - { kind: text, text: { en: "Close the project. The fee is on the cart page now.", ar: "أغلق المشروع. الرسوم في صفحة السلّة الآن." }, gap: xs }
      - id: retest
        text: { en: "5 new customers buy something on the new cart page", ar: "5 عملاء جدد يشترون شيئًا من صفحة السلّة الجديدة" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h6 }
                - { kind: text, text: { en: "Next week: 5 new customers, same task: buy a phone case with delivery. Check if they see the fee, and if anything new goes wrong.", ar: "الأسبوع القادم: 5 عملاء جدد، المهمة نفسها: اشترِ جراب هاتف مع التوصيل. تحقّق هل يرون الرسوم، وهل يسوء شيء جديد." }, gap: xs }
      - id: same
        text: { en: "Message the same 5 customers to ask if it's clearer", ar: "راسل العملاء الخمسة أنفسهم لتسألهم هل أصبح أوضح" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h6 }
                - { kind: text, text: { en: "Send the first 5 customers a screenshot: \"We moved the fee. Clearer now?\"", ar: "أرسل للعملاء الخمسة الأوائل صورة: «نقلنا الرسوم. هل أصبحت أوضح؟»" }, gap: xs }
    answer: [retest]
    misconceptions:
      - id: MC-P10-086
        when: [done]
        feedback:
          en: "The fix is untested. A fee on the cart page might now scare people off before checkout. Only a new round shows that."
          ar: "الإصلاح لم يُختبر. فالرسوم في صفحة السلّة قد تُبعد الناس الآن قبل الدفع. ولا تُظهر ذلك إلا جولة جديدة."
      - id: MC-P10-084
        when: [same]
        feedback:
          en: "That's an opinion from people who already know the answer. New customers doing the task show whether the fix works."
          ar: "هذا رأي من أشخاص يعرفون الإجابة مسبقًا. والعملاء الجدد الذين يؤدّون المهمة يُظهرون هل نجح الإصلاح."
    explain:
      en: "Every fix gets its own small round, with new people and the same task."
      ar: "كل إصلاح يحتاج جولته الصغيرة، مع أشخاص جدد والمهمة نفسها."

  # SK-P10-U06-04: report small tests without percentages
  - id: S07
    type: tune
    skill: SK-P10-U06-04
    part: retest
    speaker: tarek
    value:
      en: "Re-test, 5 users qual vs quant (NN/g): the 5-user guideline applies only to qualitative studies. Don't turn 5 people into a rate."
      ar: "إعادة اختبار، 5 مستخدمين نوعي مقابل كمّي (NN/g): قاعدة الخمسة تنطبق على الدراسات النوعية فقط. لا تحوّل 5 أشخاص إلى معدّل."
    ref: { url: "https://www.nngroup.com/articles/5-test-users-qual-quant/", quote: "the 5-user guideline only applies to qualitative, not to quantitative studies." }
    scenario:
      en: "In our test of the job search page, 1 of 5 people found the salary filter. The others didn't see it inside \"More\". I'm updating the roadmap."
      ar: "في اختبارنا لصفحة البحث عن الوظائف، وجد شخص واحد من 5 فلتر الراتب. ولم يره الآخرون داخل «المزيد». وأحدّث خطة المنتج."
    prompt:
      en: "Try each line. Which one should go on the roadmap?"
      ar: "جرّب كل سطر. أيّها يجب أن يوضع في خطة المنتج؟"
    start: pct
    options:
      - id: pct
        text: { en: "\"Salary filter: 20% discoverability\"", ar: "«فلتر الراتب: نسبة اكتشاف 20%»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h7 { en: "Roadmap note", ar: "ملاحظة في خطة المنتج" } }
                - { kind: text, text: { en: "Salary filter: 20% discoverability. Target: 80%.", ar: "فلتر الراتب: نسبة اكتشاف 20%. الهدف: 80%." }, gap: xs }
      - id: counts
        text: { en: "\"1 of 5 found it; 4 missed it inside More\"", ar: "«وجده 1 من 5؛ وفات 4 داخل «المزيد»»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h7 }
                - { kind: text, text: { en: "Salary filter: 1 of 5 found it. 4 didn't look inside \"More\". Fix: show salary next to Location.", ar: "فلتر الراتب: وجده 1 من 5. ولم يبحث 4 داخل «المزيد». الإصلاح: اعرض الراتب بجانب الموقع." }, gap: xs }
      - id: vague
        text: { en: "\"Salary filter: low usage\"", ar: "«فلتر الراتب: استخدام منخفض»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h7 }
                - { kind: text, text: { en: "Salary filter: low usage. Review later.", ar: "فلتر الراتب: استخدام منخفض. يُراجع لاحقًا." }, gap: xs }
    answer: [counts]
    misconceptions:
      - id: MC-P10-087
        when: [pct]
        feedback:
          en: "\"20%\" is one person dressed up as a metric, and the 80% target can't be measured with 5 people either."
          ar: "«20%» شخص واحد في ثوب مقياس، وهدف 80% لا يمكن قياسه بـ 5 أشخاص أيضًا."
      - id: MC-P10-087
        when: [vague]
        feedback:
          en: "\"Low usage\" sounds like analytics data and drops the reason. The team won't know what to change."
          ar: "«استخدام منخفض» تبدو كبيانات تحليلية وتُسقط السبب. ولن يعرف الفريق ما يغيّره."
    explain:
      en: "Report small tests as \"x of 5\" plus the reason and the fix."
      ar: "انقل الاختبارات الصغيرة كـ «x من 5» مع السبب والإصلاح."

  - id: S08
    type: tune
    skill: SK-P10-U06-04
    part: retest
    speaker: sara
    value:
      en: "Re-test, 5 users qual vs quant (NN/g): numbers from a small sample are imprecise, and so useless."
      ar: "إعادة اختبار، 5 مستخدمين نوعي مقابل كمّي (NN/g): الأرقام من عيّنة صغيرة غير دقيقة، وبالتالي بلا فائدة."
    ref: { url: "https://www.nngroup.com/articles/5-test-users-qual-quant/", quote: "such numbers will be imprecise — and thus useless — if they are based on a small sample size." }
    scenario:
      en: "All 5 people in my test renewed a library card without help. The client wants a line for their annual report."
      ar: "جدّد الأشخاص الخمسة كلهم في اختباري بطاقة المكتبة دون مساعدة. ويريد العميل سطرًا لتقريره السنوي."
    prompt:
      en: "Try each line. Which one should I give them?"
      ar: "جرّب كل سطر. أيّها يجب أن أعطيهم؟"
    start: hundred
    options:
      - id: hundred
        text: { en: "\"100% of members can renew online\"", ar: "«100% من الأعضاء يستطيعون التجديد عبر الإنترنت»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h8 { en: "Annual report", ar: "التقرير السنوي" } }
                - { kind: text, text: { en: "100% of members can renew their card online.", ar: "100% من الأعضاء يستطيعون تجديد بطاقتهم عبر الإنترنت." }, gap: xs }
      - id: counts
        text: { en: "\"In testing, all 5 people renewed without help\"", ar: "«في الاختبار، جدّد الأشخاص الخمسة كلهم دون مساعدة»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h8 }
                - { kind: text, text: { en: "In a usability test, all 5 people renewed their card online without help. We'll track real renewals to see the wider picture.", ar: "في اختبار سهولة الاستخدام، جدّد الأشخاص الخمسة كلهم بطاقتهم عبر الإنترنت دون مساعدة. وسنتابع التجديدات الحقيقية لنرى الصورة الأوسع." }, gap: xs }
      - id: everyone
        text: { en: "\"Everyone finds renewing easy\"", ar: "«الجميع يجد التجديد سهلًا»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h8 }
                - { kind: text, text: { en: "Everyone finds renewing online easy.", ar: "الجميع يجد التجديد عبر الإنترنت سهلًا." }, gap: xs }
    answer: [counts]
    misconceptions:
      - id: MC-P10-087
        when: [hundred, everyone]
        feedback:
          en: "Good news from 5 people still isn't a rate for all members. Older members or first-time users might struggle; the test can't say."
          ar: "الأخبار الجيدة من 5 أشخاص ليست معدّلًا لكل الأعضاء. فقد يتعثّر كبار السن أو المستخدمون الجدد؛ ولا يستطيع الاختبار قول ذلك."
    explain:
      en: "Even a perfect result is \"5 of 5\", not 100%. Say what you saw, and where a real number would come from."
      ar: "حتى النتيجة الكاملة هي «5 من 5»، لا 100%. قل ما رأيته، ومن أين يأتي الرقم الحقيقي."

  # SK-P10-U06-05: let people think aloud, without leading
  - id: S09
    type: tune
    skill: SK-P10-U06-05
    part: retest
    speaker: mona
    value:
      en: "Re-test, usability checklist (NN/g): don't ask questions that could prime participants into certain behaviors."
      ar: "إعادة اختبار، قائمة تحقّق الدراسات (NN/g): لا تطرح أسئلة قد تدفع المشاركين نحو سلوك معيّن."
    ref: { url: "https://www.nngroup.com/articles/usability-checklist/", quote: "Don’t ask questions which could prime participants into certain behaviors that could alter results of your test" }
    scenario:
      en: "I'm coaching a new moderator. A participant, Wael, is looking for a recipe and hasn't touched the search bar."
      ar: "أدرّب مُديرة جلسات جديدة. ومشارك اسمه وائل يبحث عن وصفة ولم يلمس شريط البحث."
    prompt:
      en: "Try each thing she could say. Which one should she use?"
      ar: "جرّب كل جملة يمكن أن تقولها. أيّها يجب أن تستخدم؟"
    start: search
    options:
      - id: search
        text: { en: "\"Did you notice the search bar?\"", ar: "«هل لاحظت شريط البحث؟»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h9 { en: "Moderator says", ar: "تقول المُديرة" } }
                - { kind: text, text: { en: "\"Did you notice the search bar?\"", ar: "«هل لاحظت شريط البحث؟»" }, gap: xs }
                - { kind: small, color: muted, text: { en: "Wael types \"lentil soup\" and finds it.", ar: "يكتب وائل «شوربة عدس» ويجدها." }, gap: s }
      - id: easier
        text: { en: "\"Is there an easier way to do this?\"", ar: "«هل توجد طريقة أسهل لفعل هذا؟»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h9 }
                - { kind: text, text: { en: "\"Is there an easier way to do this?\"", ar: "«هل توجد طريقة أسهل لفعل هذا؟»" }, gap: xs }
                - { kind: small, color: muted, text: { en: "Wael stops browsing and starts hunting around the screen for a shortcut.", ar: "يتوقّف وائل عن التصفّح ويبدأ بالبحث في الشاشة عن طريق مختصر." }, gap: s }
      - id: think
        text: { en: "\"Tell me what you're looking for as you go.\"", ar: "«أخبرني بما تبحث عنه أثناء ذلك.»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h9 }
                - { kind: text, text: { en: "\"Tell me what you're looking for as you go.\"", ar: "«أخبرني بما تبحث عنه أثناء ذلك.»" }, gap: xs }
                - { kind: small, color: muted, text: { en: "Wael: \"I expected soups under Starters… the magnifier looks like a zoom button.\"", ar: "وائل: «توقّعت الشوربات تحت المقبّلات… والعدسة تبدو كزرّ تكبير.»" }, gap: s }
    answer: [think]
    misconceptions:
      - id: MC-P10-088
        when: [search, easier]
        feedback:
          en: "Both push him toward something: one names the search bar, the other hints he's doing it wrong. You lose why he skipped search."
          ar: "كلاهما يدفعه نحو شيء: الأول يذكر شريط البحث، والثاني يلمّح أنه يخطئ. فتخسر سبب تجاهله للبحث."
    explain:
      en: "A neutral think-aloud prompt reveals the real issue: the search icon looked like zoom."
      ar: "طلب محايد للتفكير بصوت عالٍ يكشف المشكلة الحقيقية: أيقونة البحث بدت كزرّ تكبير."

  - id: S10
    type: tune
    skill: SK-P10-U06-05
    part: retest
    speaker: rami
    value:
      en: "Re-test, thinking aloud (NN/g): interruptions can very easily change user behavior. Save your questions for after the task."
      ar: "إعادة اختبار، التفكير بصوت عالٍ (NN/g): المقاطعات قد تغيّر سلوك المستخدم بسهولة شديدة. احتفظ بأسئلتك لما بعد المهمة."
    ref: { url: "https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/", quote: "such interruptions can very easily change user behavior" }
    scenario:
      en: "I'm running my first session. Mai is paying a phone bill and stops twice at the amount field. I want to know why."
      ar: "أُدير جلستي الأولى. تدفع مي فاتورة الهاتف وتتوقّف مرّتين عند حقل المبلغ. وأريد أن أعرف لماذا."
    prompt:
      en: "Try each approach. Which one should I use?"
      ar: "جرّب كل طريقة. أيّها يجب أن أستخدم؟"
    start: stop
    options:
      - id: stop
        text: { en: "Stop her: \"Is the amount field confusing?\"", ar: "أوقفها: «هل حقل المبلغ مُربك؟»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &h10 { en: "Session notes", ar: "ملاحظات الجلسة" } }
                - { kind: text, text: { en: "0:55 Mai stops at the amount.", ar: "0:55 تتوقّف مي عند المبلغ." }, gap: xs }
                - { kind: text, text: { en: "0:57 Me: \"Is the amount field confusing?\"", ar: "0:57 أنا: «هل حقل المبلغ مُربك؟»" }, gap: xs }
                - { kind: text, text: { en: "1:00 Mai: \"A bit, I guess.\" She types the full bill and pays.", ar: "1:00 مي: «قليلًا، ربما.» تكتب الفاتورة كاملة وتدفع." }, gap: xs }
      - id: later
        text: { en: "Note it, and after she pays ask: \"What happened at the amount?\"", ar: "سجّلها، وبعد أن تدفع اسأل: «ماذا حدث عند المبلغ؟»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h10 }
                - { kind: text, text: { en: "0:55 Mai stops at the amount. (note)", ar: "0:55 تتوقّف مي عند المبلغ. (ملاحظة)" }, gap: xs }
                - { kind: text, text: { en: "1:40 Mai pays.", ar: "1:40 تدفع مي." }, gap: xs }
                - { kind: text, text: { en: "After: \"What happened at the amount?\"", ar: "بعدها: «ماذا حدث عند المبلغ؟»" }, gap: xs }
                - { kind: text, text: { en: "Mai: \"I didn't know if I could pay only part of it, so I typed the full bill.\"", ar: "مي: «لم أعرف هل يمكنني دفع جزء منها فقط، فكتبت الفاتورة كاملة.»" }, gap: xs }
      - id: help
        text: { en: "Help her: \"You can type the full amount there.\"", ar: "ساعدها: «يمكنك كتابة المبلغ كاملًا هناك.»" }
        mock:
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *h10 }
                - { kind: text, text: { en: "0:55 Mai stops at the amount.", ar: "0:55 تتوقّف مي عند المبلغ." }, gap: xs }
                - { kind: text, text: { en: "0:57 Me: \"You can type the full amount there.\"", ar: "0:57 أنا: «يمكنك كتابة المبلغ كاملًا هناك.»" }, gap: xs }
                - { kind: text, text: { en: "1:05 Mai pays. Notes: no problems.", ar: "1:05 تدفع مي. الملاحظات: لا مشكلات." }, gap: xs }
    answer: [later]
    misconceptions:
      - id: MC-P10-088
        when: [stop]
        feedback:
          en: "The mid-task question hands her the word \"confusing\", so her answer is yours. And you still don't know what confused her."
          ar: "السؤال أثناء المهمة يعطيها كلمة «مُربك»، فتصبح إجابتها إجابتك. ولا تزال لا تعرف ما الذي أربكها."
      - id: MC-P10-088
        when: [help]
        feedback:
          en: "Helping solved it for her, so the notes say \"no problems\". At home, nobody will be there to tell her."
          ar: "المساعدة حلّت المشكلة لها، فكتبت الملاحظات «لا مشكلات». وفي البيت لن يكون أحد هناك ليخبرها."
    explain:
      en: "Note the moment, let her finish, then ask one open question. You keep what she did and learn why: she didn't know partial payment was allowed."
      ar: "سجّل اللحظة، ودعها تنهي، ثم اطرح سؤالًا مفتوحًا واحدًا. فتحتفظ بما فعلته وتعرف السبب: لم تعرف أن الدفع الجزئي مسموح."
