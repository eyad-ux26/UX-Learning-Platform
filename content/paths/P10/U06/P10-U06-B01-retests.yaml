id: P10-U06-B01
mode: bank
title:
  en: "Re-tests: check what you claimed"
  ar: "إعادة اختبار: تحقّق مما ادّعيته"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "First Rule of Usability? Don't Listen to Users (NN/g)", ar: "القاعدة الأولى في سهولة الاستخدام؟ لا تستمع إلى المستخدمين (NN/g)" }
    url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/"
  - title: { en: "Success Rate: The Simplest Usability Metric (NN/g)", ar: "معدّل النجاح: أبسط مقياس لسهولة الاستخدام (NN/g)" }
    url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/"
