id: P10-U06
free: false
title:
  en: "Check what you claimed"
  ar: "تحقّق مما ادّعيته"
skill:
  en: "Check a hierarchy claim by watching people use the design: define success first, test small and often, report honestly, and let people think aloud without leading them."
  ar: "تحقّق من ادّعاء حول التسلسل البصري بمراقبة الناس وهم يستخدمون التصميم: حدّد النجاح أولًا، واختبر بأعداد صغيرة ومرّات كثيرة، وانقل النتائج بأمانة، ودع الناس يفكّرون بصوت عالٍ دون توجيههم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U06-01
    title: { en: "Watch what people do", ar: "راقب ما يفعله الناس" }
    can_do: { en: "Check a design by watching people use it, not by asking what they like or would do.", ar: "تحقّق من التصميم بمراقبة الناس وهم يستخدمونه، لا بسؤالهم عمّا يحبّونه أو ما سيفعلونه." }
  - id: SK-P10-U06-02
    title: { en: "Define success before the test", ar: "حدّد النجاح قبل الاختبار" }
    can_do: { en: "Write down what counts as finishing each task, in checkable terms, before anyone tries it.", ar: "اكتب ما يُعدّ إنجازًا لكل مهمة، بشروط يمكن التحقّق منها، قبل أن يجرّبها أحد." }
  - id: SK-P10-U06-03
    title: { en: "Test small, fix, test again", ar: "اختبر بعدد صغير، وأصلح، واختبر مجددًا" }
    can_do: { en: "Spend testing on several small rounds of about 5 people, with a fix between each round.", ar: "وزّع الاختبار على عدّة جولات صغيرة من نحو 5 أشخاص، مع إصلاح بين كل جولة والتي تليها." }
  - id: SK-P10-U06-04
    title: { en: "Report small tests without percentages", ar: "انقل نتائج الاختبارات الصغيرة بلا نِسَب مئوية" }
    can_do: { en: "Report a 5-person test as counts and reasons, not percentages that suggest false precision.", ar: "انقل نتائج اختبار من 5 أشخاص كأعداد وأسباب، لا كنِسَب مئوية توحي بدقّة غير حقيقية." }
  - id: SK-P10-U06-05
    title: { en: "Let people think aloud, without leading", ar: "دع الناس يفكّرون بصوت عالٍ، دون توجيه" }
    can_do: { en: "Ask people to think aloud while they work, and keep your words neutral so you don't steer them.", ar: "اطلب من الناس التفكير بصوت عالٍ أثناء العمل، وأبقِ كلماتك محايدة حتى لا توجّههم." }
