id: P10-U06-L02
mode: lesson
minutes: 8
title:
  en: "Small tests, honest numbers"
  ar: "اختبارات صغيرة، وأرقام صادقة"
summary:
  en: "Plan small test rounds and rewrite \"80% of users\" as honest counts."
  ar: "خطّط لجولات اختبار صغيرة، وأعد كتابة «80% من المستخدمين» كأعداد صادقة."
speaker: sara
sources:
  - title: { en: "Why You Only Need to Test with 5 Users (NN/g)", ar: "لماذا تحتاج إلى اختبار 5 مستخدمين فقط (NN/g)" }
    url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/"
  - title: { en: "Why 5 Participants Are Okay in a Qualitative Study, but Not in a Quantitative One (NN/g)", ar: "لماذا يكفي 5 مشاركين في الدراسة النوعية، لا في الكمية (NN/g)" }
    url: "https://www.nngroup.com/articles/5-test-users-qual-quant/"
review_labels:
  MC-P10-086: { en: "Test small, fix, and test again", ar: "اختبر بعدد صغير، وأصلح، واختبر مجددًا" }
  MC-P10-087: { en: "5 people can't give a percentage", ar: "5 أشخاص لا يعطون نسبة مئوية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "80% from five people", ar: "80% من خمسة أشخاص" }
    body:
      en: "I tested the new booking page with 5 people. Four booked the Tuesday session; one scrolled past Reserve because the photo pushed it down.\n\nIn my report to the learning hub, I wrote: \"80% of users can book.\" Their manager put that number on a slide for the board. I wasn't comfortable, and I didn't know why."
      ar: "اختبرت صفحة الحجز الجديدة مع 5 أشخاص. حجز أربعة جلسة الثلاثاء؛ وتجاوز واحد «احجز» لأن الصورة دفعته لأسفل.\n\nوكتبت في تقريري لمركز التعلّم: «80% من المستخدمين يستطيعون الحجز.» فوضع مديرهم هذا الرقم في عرض لمجلس الإدارة. لم أكن مرتاحة، ولم أعرف لماذا."
    mock:
      app: basira
      frame: wide
      url: basira.example/reports/booking-page
      blocks:
        - kind: group
          blocks:
            - { kind: small, text: { en: "Report", ar: "التقرير" } }
            - { kind: title, text: { en: "80% of users can book", ar: "80% من المستخدمين يستطيعون الحجز" }, gap: xs }

  - id: S02
    type: tune
    skill: SK-P10-U06-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Testing with 5 users (NN/g): the best results come from testing no more than 5 users and running as many small tests as you can afford. Three rounds of 5 find more than one round of 15."
      ar: "جرّب أولًا. الاختبار مع 5 مستخدمين (NN/g): أفضل النتائج تأتي من اختبار 5 مستخدمين على الأكثر وإجراء أكبر عدد ممكن من الاختبارات الصغيرة. وثلاث جولات من 5 تكشف أكثر من جولة واحدة من 15."
    ref: { url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/", quote: "The best results come from testing no more than 5 users and running as many small tests as you can afford." }
    scenario:
      en: "For the next redesign, the hub gives me time and money for 15 test sessions."
      ar: "لإعادة التصميم القادمة، يعطيني المركز وقتًا ومالًا لـ 15 جلسة اختبار."
    prompt:
      en: "Try each plan. Which one should I use?"
      ar: "جرّب كل خطة. أيّ خطة تكشف أكثر المشكلات وتتحقّق من الإصلاحات؟"
    start: one
    options:
      - id: one
        text: { en: "One big test with 15 people, just before launch", ar: "اختبار واحد كبير مع 15 شخصًا، قبل الإطلاق مباشرة" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &tp_h { en: "Test plan", ar: "خطة الاختبار" } }
                - { kind: text, text: { en: "Week 6: 15 people try the finished page. Launch in week 7.", ar: "الأسبوع 6: 15 شخصًا يجرّبون الصفحة النهائية. الإطلاق في الأسبوع 7." }, gap: xs }
      - id: rounds
        text: { en: "Three rounds of 5, fixing the page between rounds", ar: "ثلاث جولات من 5، مع إصلاح الصفحة بين الجولات" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Week 2: 5 people → fix. Week 4: 5 people → fix. Week 6: 5 people → final fixes.", ar: "الأسبوع 2: 5 أشخاص ← إصلاح. الأسبوع 4: 5 أشخاص ← إصلاح. الأسبوع 6: 5 أشخاص ← إصلاحات أخيرة." }, gap: xs }
      - id: early
        text: { en: "15 people in week 2, then no more tests", ar: "15 شخصًا في الأسبوع 2، ثم لا اختبارات أخرى" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Week 2: 15 people try the first draft. Then design and launch.", ar: "الأسبوع 2: 15 شخصًا يجرّبون المسودة الأولى. ثم التصميم والإطلاق." }, gap: xs }
    answer: [rounds]
    misconceptions:
      - id: MC-P10-086
        when: [one]
        feedback:
          en: "After about 5 people, you mostly see the same problems again. And in week 6 there's no time left to fix what you find."
          ar: "بعد نحو 5 أشخاص، ترى غالبًا المشكلات نفسها مرة أخرى. وفي الأسبوع 6 لا يبقى وقت لإصلاح ما تجده."
      - id: MC-P10-086
        when: [early]
        feedback:
          en: "Early is good, but people 6 to 15 mostly repeat what the first 5 showed, and nobody checks whether your fixes work."
          ar: "البدء المبكّر جيد، لكن الأشخاص من 6 إلى 15 يكرّرون غالبًا ما أظهره الخمسة الأوائل، ولا أحد يتحقّق هل نجحت إصلاحاتك."
    hints:
      - { en: "What happens after you fix the problems the first 5 people found?", ar: "ماذا يحدث بعد أن تُصلح المشكلات التي وجدها أول 5 أشخاص؟" }
      - { en: "Which plan lets you check each fix?", ar: "أي خطة تتيح لك التحقّق من كل إصلاح؟" }
    correct:
      en: "Each round checks the last fix and finds the next problem."
      ar: "كل جولة تتحقّق من الإصلاح السابق وتكشف المشكلة التالية."
    explain:
      en: "A few people reveal most of the big problems. Spending the rest on more rounds, after fixes, finds problems the first version was hiding and checks your fixes."
      ar: "عدد قليل من الناس يكشف أغلب المشكلات الكبيرة. وإنفاق الباقي على جولات أخرى، بعد الإصلاح، يكشف مشكلات كانت النسخة الأولى تُخفيها ويتحقّق من إصلاحاتك."

  - id: S03
    type: card
    part: concept
    icons: [person, order, warn, text]
    title: { en: "Five people show why, not how many", ar: "خمسة أشخاص يُظهرون لماذا، لا كم" }
    body:
      en: "A test with about 5 people is qualitative: it shows what goes wrong and why.\n\n- **Small rounds:** test with about 5, fix what you see, then test the new version.\n- **No percentages from 5:** one person changes the result by 20 points. \"80%\" sounds precise, but it isn't.\n- **Report counts and reasons:** \"4 of 5 booked; 1 missed Reserve because the photo pushed it below the screen.\"\n- **Need a number?** That takes a bigger, quantitative study. Say so instead of stretching a small one."
      ar: "الاختبار مع نحو 5 أشخاص اختبار نوعي: يُظهر ما الذي لا يعمل ولماذا.\n\n- **جولات صغيرة:** اختبر مع نحو 5، وأصلح ما تراه، ثم اختبر النسخة الجديدة.\n- **لا نِسَب من 5:** شخص واحد يغيّر النتيجة 20 نقطة. و«80%» تبدو دقيقة، لكنها ليست كذلك.\n- **اذكر الأعداد والأسباب:** «حجز 4 من 5؛ ولم يرَ واحدٌ زر «احجز» لأن الصورة دفعته أسفل الشاشة.»\n- **تحتاج رقمًا؟** هذا يتطلّب دراسة كمية أكبر. قل ذلك بدل تحميل دراسة صغيرة أكثر ممّا تحتمل."

  - id: S04
    type: tune
    skill: SK-P10-U06-04
    part: guided
    rules: [R06, R15]
    value:
      en: "5 users, qual vs quant (NN/g): the 5-user guideline applies only to qualitative studies, not quantitative ones. A percentage is a quantitative claim."
      ar: "5 مستخدمين، نوعي مقابل كمّي (NN/g): قاعدة الخمسة مستخدمين تنطبق على الدراسات النوعية فقط، لا الكمية. والنسبة المئوية ادّعاء كمّي."
    ref: { url: "https://www.nngroup.com/articles/5-test-users-qual-quant/", quote: "the 5-user guideline only applies to qualitative, not to quantitative studies." }
    scenario:
      en: "Back to my report. I'm rewriting the headline about the 5-person test."
      ar: "نعود إلى تقريري. أعيد كتابة العنوان الرئيسي عن اختبار الأشخاص الخمسة."
    prompt:
      en: "Try each headline. Which one should go in the report?"
      ar: "جرّب كل عنوان. أيّ عنوان يقول بصدق ما حدث ويخبر المركز بما يجب إصلاحه؟"
    start: pct
    options:
      - id: pct
        text: { en: "Keep \"80% of users can book\"", ar: "أبقِ «80% من المستخدمين يستطيعون الحجز»" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &rp_h { en: "Report", ar: "التقرير" } }
                - { kind: text, text: { en: "80% of users can book.", ar: "80% من المستخدمين يستطيعون الحجز." }, gap: xs }
      - id: most
        text: { en: "\"Most users can book easily\"", ar: "«أغلب المستخدمين يستطيعون الحجز بسهولة»" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *rp_h }
                - { kind: text, text: { en: "Most users can book easily.", ar: "أغلب المستخدمين يستطيعون الحجز بسهولة." }, gap: xs }
      - id: counts
        text: { en: "Counts and the reason: \"4 of 5 booked; 1 missed Reserve below the photo\"", ar: "الأعداد والسبب: «حجز 4 من 5؛ ولم يرَ واحدٌ «احجز» تحت الصورة»" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *rp_h }
                - { kind: text, text: { en: "4 of 5 people booked the Tuesday session. 1 scrolled past Reserve because the photo pushed it below the screen. Fix: move the photo under the details.", ar: "حجز 4 من 5 أشخاص جلسة الثلاثاء. وتجاوز واحد «احجز» لأن الصورة دفعته أسفل الشاشة. الإصلاح: انقل الصورة تحت التفاصيل." }, gap: xs }
    answer: [counts]
    misconceptions:
      - id: MC-P10-087
        when: [pct]
        feedback:
          en: "With 5 people, one person is 20 points. The real number for all visitors could be far lower or higher. The board will read 80% as a fact."
          ar: "مع 5 أشخاص، الشخص الواحد يساوي 20 نقطة. والرقم الحقيقي لكل الزوّار قد يكون أقل أو أعلى بكثير. وسيقرأ مجلس الإدارة 80% كحقيقة."
      - id: MC-P10-087
        when: [most]
        feedback:
          en: "\"Most\" and \"easily\" hide the one problem the test found, which is the useful part. Report what happened and why."
          ar: "«أغلب» و«بسهولة» تُخفيان المشكلة الوحيدة التي وجدها الاختبار، وهي الجزء المفيد. اذكر ما حدث ولماذا."
    hints:
      - { en: "How much does the number change if one more person had failed?", ar: "كم يتغيّر الرقم لو فشل شخص واحد إضافي؟" }
      - { en: "Which headline tells the hub what to fix?", ar: "أي عنوان يخبر المركز بما يجب إصلاحه؟" }
    correct:
      en: "Honest counts, and the reason behind the one failure."
      ar: "أعداد صادقة، والسبب وراء الحالة الوحيدة التي فشلت."
    explain:
      en: "Small tests are for finding problems and their causes. Report them as \"x of 5\" with what happened, never as a percentage of all users."
      ar: "الاختبارات الصغيرة لاكتشاف المشكلات وأسبابها. اعرض نتائجها كـ «x من 5» مع ما حدث، لا كنسبة من كل المستخدمين أبدًا."

  - id: S05
    type: tune
    skill: SK-P10-U06-03
    part: guided
    rules: [R06, R15]
    value:
      en: "Testing with 5 users (NN/g): after creating the new design, you need to test again. A fix can solve one problem and create another."
      ar: "الاختبار مع 5 مستخدمين (NN/g): بعد إنشاء التصميم الجديد، تحتاج إلى الاختبار مرة أخرى. فالإصلاح قد يحلّ مشكلة ويخلق أخرى."
    ref: { url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/", quote: "After creating the new design, you need to test again." }
    scenario:
      en: "I moved the photo under the details, so Reserve is now near the top. The fix looks obvious to me."
      ar: "نقلت الصورة تحت التفاصيل، فأصبح «احجز» قريبًا من الأعلى. والإصلاح يبدو واضحًا لي."
    prompt:
      en: "Try each next step. Which one should I take?"
      ar: "جرّب كل خطوة تالية. أيّها يجب أن أتّخذ؟"
    start: ship
    options:
      - id: ship
        text: { en: "Ship it; the fix is obvious", ar: "أطلقه؛ فالإصلاح واضح" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "No more testing. Launch the fixed page on Sunday.", ar: "لا مزيد من الاختبار. أطلق الصفحة المُصلحة يوم الأحد." }, gap: xs }
      - id: ask
        text: { en: "Show the same 5 people the fix and ask if it's better", ar: "اعرض الإصلاح على الأشخاص الخمسة أنفسهم واسأل هل هو أفضل" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Email the 5 people a screenshot of the fix: \"Is this better?\"", ar: "أرسل للأشخاص الخمسة صورة للإصلاح: «هل هذا أفضل؟»" }, gap: xs }
      - id: retest
        text: { en: "Test the fixed page with 5 new people, same task", ar: "اختبر الصفحة المُصلحة مع 5 أشخاص جدد، بالمهمة نفسها" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Next week: 5 new people, same booking task, same success rule. Watch for the old problem, and any new one.", ar: "الأسبوع القادم: 5 أشخاص جدد، مهمة الحجز نفسها، وقاعدة النجاح نفسها. راقب المشكلة القديمة، وأي مشكلة جديدة." }, gap: xs }
    answer: [retest]
    misconceptions:
      - id: MC-P10-086
        when: [ship]
        feedback:
          en: "Obvious fixes still fail. With the photo lower, people may now miss the room or the price. Only a new round shows that."
          ar: "الإصلاحات الواضحة قد تفشل أيضًا. ومع نزول الصورة، قد يفوت الناس الآن القاعة أو السعر. ولا تُظهر ذلك إلا جولة جديدة."
      - id: MC-P10-084
        when: [ask]
        feedback:
          en: "That's asking for opinions again, from people who already know the page. New people trying the task shows whether the fix works."
          ar: "هذا طلب آراء مرة أخرى، من أشخاص يعرفون الصفحة بالفعل. وأشخاص جدد يجرّبون المهمة يُظهرون هل نجح الإصلاح."
    hints:
      - { en: "How do you know the fix didn't break something else?", ar: "كيف تعرف أن الإصلاح لم يُفسد شيئًا آخر؟" }
      - { en: "Which step shows behavior on the new version?", ar: "أي خطوة تُظهر السلوك على النسخة الجديدة؟" }
    correct:
      en: "Same task, new people, new version: now you know."
      ar: "المهمة نفسها، وأشخاص جدد، ونسخة جديدة: الآن تعرف."
    explain:
      en: "Every fix is a new design, and it can have its own problems. A small round after each fix keeps you honest."
      ar: "كل إصلاح تصميم جديد، وقد تكون له مشكلاته. وجولة صغيرة بعد كل إصلاح تمنعك من الحكم بالأمل."

  - id: S06
    type: words
    skill: SK-P10-U06-04
    part: guided
    confidence: true
    rules: [R06, R15]
    value:
      en: "5 users, qual vs quant (NN/g): numbers from a small sample are imprecise, and so useless. When someone asks for a percentage, the honest answer explains what a small test can and can't say."
      ar: "5 مستخدمين، نوعي مقابل كمّي (NN/g): الأرقام من عيّنة صغيرة غير دقيقة، وبالتالي بلا فائدة. وحين يطلب أحد نسبة مئوية، فالإجابة الصادقة تشرح ما يستطيع الاختبار الصغير قوله وما لا يستطيع."
    ref: { url: "https://www.nngroup.com/articles/5-test-users-qual-quant/", quote: "such numbers will be imprecise — and thus useless — if they are based on a small sample size." }
    scenario:
      en: "The hub's manager writes: \"Great. So what percentage of visitors will book now?\""
      ar: "يكتب مدير المركز: «رائع. إذن ما نسبة الزوّار الذين سيحجزون الآن؟»"
    prompt:
      en: "Which reply should I send?"
      ar: "أيّ ردّ يكون صادقًا بشأن حدود الاختبار ويقول للمدير من أين يأتي الرقم؟"
    options:
      - { id: guess, text: { en: "\"About 80%, based on our test.\"", ar: "«نحو 80%، بناءً على اختبارنا.»" } }
      - { id: honest, text: { en: "\"5 people can't give a reliable percentage. They showed us what blocked booking, and we fixed it. For a number, we can watch real bookings for a month.\"", ar: "«5 أشخاص لا يعطون نسبة يُعتمد عليها. لقد أظهروا لنا ما منع الحجز، وأصلحناه. وإن أردت رقمًا، يمكننا متابعة الحجوزات الحقيقية لمدة شهر.»" } }
      - { id: high, text: { en: "\"Almost everyone; the test went very well.\"", ar: "«الجميع تقريبًا؛ الاختبار نجح جدًا.»" } }
    answer: [honest]
    misconceptions:
      - id: MC-P10-087
        when: [guess, high]
        feedback:
          en: "Both turn 5 people into a promise about every visitor. If real bookings come in lower, the hub stops trusting the research."
          ar: "كلاهما يحوّل 5 أشخاص إلى وعد عن كل زائر. وإن جاءت الحجوزات الحقيقية أقل، يتوقّف المركز عن الثقة في البحث."
    hints:
      - { en: "What did the 5-person test actually tell you?", ar: "ماذا أخبرك اختبار الأشخاص الخمسة فعلًا؟" }
      - { en: "Where could a real number come from?", ar: "من أين يمكن أن يأتي رقم حقيقي؟" }
    correct:
      en: "Honest about the limit, and offers a way to get the number."
      ar: "صادق بشأن الحدود، ويعرض طريقة للحصول على الرقم."
    explain:
      en: "Say what the small test did (found and fixed problems) and what it can't do (predict a rate). Then point to where a real number would come from."
      ar: "قل ما فعله الاختبار الصغير (وجد مشكلات وأصلحها) وما لا يستطيعه (توقّع معدّل). ثم أشر إلى مصدر الرقم الحقيقي."

  - id: S07
    type: compare
    skill: SK-P10-U06-04
    part: contrast
    rules: [R11, R15]
    value:
      en: "Contrast with S04: both lines here state the same finding. 5 users, qual vs quant (NN/g): the 5-user guideline is for qualitative work. Writing \"60%\" dresses 3 people up as a statistic."
      ar: "مقارنة مع الخطوة 4: السطران هنا ينقلان النتيجة نفسها. 5 مستخدمين، نوعي مقابل كمّي (NN/g): قاعدة الخمسة للعمل النوعي. وكتابة «60%» تُلبس 3 أشخاص ثوب الإحصاء."
    ref: { url: "https://www.nngroup.com/articles/5-test-users-qual-quant/", quote: "the 5-user guideline only applies to qualitative, not to quantitative studies." }
    scenario:
      en: "In the second round, 3 of 5 people couldn't say the cancellation rule: they read \"24 hours\" as the session length. I have two ways to write it."
      ar: "في الجولة الثانية، لم يستطع 3 من 5 أشخاص ذكر شرط الإلغاء: فهموا «24 ساعة» على أنها مدة الجلسة. وعندي طريقتان لكتابة ذلك."
    prompt:
      en: "Which line should go in the report?"
      ar: "أيّ سطر يقول بدقّة ما رأيته ويخبر الفريق بما يغيّره؟"
    a:
      label: { en: "Percentage", ar: "نسبة مئوية" }
      mock:
        app: basira
        frame: wide
        url: basira.example/reports/booking-page
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: *rp_h }
              - { kind: text, text: { en: "60% of users misread the cancellation rule.", ar: "60% من المستخدمين أساؤوا فهم شرط الإلغاء." }, gap: xs }
    b:
      label: { en: "Count and reason", ar: "عدد وسبب" }
      mock:
        app: basira
        frame: wide
        url: basira.example/reports/booking-page
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: *rp_h }
              - { kind: text, text: { en: "3 of 5 misread the cancellation rule: they took \"24 hours\" as the session length.", ar: "3 من 5 أساؤوا فهم شرط الإلغاء: ظنّوا أن «24 ساعة» مدة الجلسة." }, gap: xs }
    answer: b
    reason:
      prompt: { en: "What makes B the right line?", ar: "ما الذي يجعل B السطر الصحيح؟" }
      options:
        - { id: honest, text: { en: "It shows the real sample size and why it happened", ar: "يُظهر حجم العيّنة الحقيقي وسبب ما حدث" } }
        - { id: smaller, text: { en: "3 sounds less alarming than 60%", ar: "3 تبدو أقل إثارة للقلق من 60%" } }
        - { id: same, text: { en: "They mean the same; it's style", ar: "معناهما واحد؛ إنها مسألة أسلوب" } }
      answer: [honest]
      misconceptions:
        - id: MC-P10-087
          when: [smaller, same]
          feedback:
            en: "It's not about sounding calm, and they don't mean the same. \"60%\" claims a rate for all users; \"3 of 5\" says exactly what you saw, plus the reason to fix."
            ar: "الأمر ليس أن يبدو هادئًا، ومعناهما ليس واحدًا. «60%» تدّعي معدّلًا لكل المستخدمين؛ و«3 من 5» تقول بالضبط ما رأيته، مع سبب الإصلاح."
    misconceptions:
      - id: MC-P10-087
        when: [a]
        feedback:
          en: "A hides that only 5 people took part, and drops the reason. It reads like a survey of thousands."
          ar: "A تُخفي أن 5 أشخاص فقط شاركوا، وتُسقط السبب. وتُقرأ كأنها استبيان لآلاف."
    hints:
      - { en: "Which line would a reader mistake for a big survey?", ar: "أي سطر قد يظنّه القارئ استبيانًا كبيرًا؟" }
    correct:
      en: "Real counts, real reason."
      ar: "أعداد حقيقية، وسبب حقيقي."
    explain:
      en: "\"x of 5\" keeps the sample visible and the reason tells the team what to change. That's what a small test is for."
      ar: "«x من 5» تُبقي العيّنة ظاهرة، والسبب يخبر الفريق بما يغيّره. وهذا هو هدف الاختبار الصغير."

  - id: S08
    type: tune
    skill: SK-P10-U06-03
    part: independent
    speaker: youssef
    rules: [R14, R19]
    value:
      en: "New case. Testing with 5 users (NN/g): run as many small tests as you can afford, with no more than about 5 people each."
      ar: "حالة جديدة. الاختبار مع 5 مستخدمين (NN/g): أجرِ أكبر عدد ممكن من الاختبارات الصغيرة، بنحو 5 أشخاص على الأكثر في كل منها."
    ref: { url: "https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/", quote: "The best results come from testing no more than 5 users and running as many small tests as you can afford." }
    scenario:
      en: "I'm changing my online shop's product page so the price and \"Add to cart\" come before the long description. I can pay 10 customers to try it, and I want it live in a month."
      ar: "أغيّر صفحة المنتج في متجري الإلكتروني ليأتي السعر و«أضف إلى السلّة» قبل الوصف الطويل. وأستطيع أن أدفع لـ 10 عملاء ليجرّبوها، وأريدها جاهزة خلال شهر."
    prompt:
      en: "Try each plan. Which one should I use?"
      ar: "جرّب كل خطة. أيّها يجب أن أستخدم؟"
    start: ten
    options:
      - id: ten
        text: { en: "All 10 customers in one day, at the end of the month", ar: "العملاء العشرة كلهم في يوم واحد، في نهاية الشهر" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Day 28: 10 customers try the new page. Launch on day 30.", ar: "اليوم 28: 10 عملاء يجرّبون الصفحة الجديدة. الإطلاق في اليوم 30." }, gap: xs }
      - id: two
        text: { en: "5 customers in week 1, fix, then 5 more in week 3", ar: "5 عملاء في الأسبوع 1، ثم إصلاح، ثم 5 آخرون في الأسبوع 3" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Week 1: 5 customers → fix. Week 3: 5 new customers try the fixed page → final fixes. Launch in week 4.", ar: "الأسبوع 1: 5 عملاء ← إصلاح. الأسبوع 3: 5 عملاء جدد يجرّبون الصفحة المُصلحة ← إصلاحات أخيرة. الإطلاق في الأسبوع 4." }, gap: xs }
      - id: survey
        text: { en: "Skip testing; email all customers a survey after launch", ar: "تخطَّ الاختبار؛ وأرسل استبيانًا لكل العملاء بعد الإطلاق" }
        mock:
          app: basira
          frame: wide
          url: basira.example/reports/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *tp_h }
                - { kind: text, text: { en: "Launch on day 30. Email: \"How do you like our new product page?\"", ar: "الإطلاق في اليوم 30. رسالة: «ما رأيك في صفحة المنتج الجديدة؟»" }, gap: xs }
    answer: [two]
    misconceptions:
      - id: MC-P10-086
        when: [ten]
        feedback:
          en: "Customers 6 to 10 mostly repeat what 1 to 5 showed, and on day 28 there's no time to fix it. Split them into two rounds."
          ar: "العملاء من 6 إلى 10 يكرّرون غالبًا ما أظهره الخمسة الأوائل، وفي اليوم 28 لا وقت للإصلاح. قسّمهم على جولتين."
      - id: MC-P10-084
        when: [survey]
        feedback:
          en: "A survey after launch collects opinions, too late to change anything. Watch people use it before it goes live."
          ar: "الاستبيان بعد الإطلاق يجمع آراء، ومتأخر جدًا لتغيير أي شيء. راقب الناس يستخدمونها قبل إطلاقها."
    correct:
      en: "Two small rounds: find, fix, check."
      ar: "جولتان صغيرتان: اكتشف، وأصلح، وتحقّق."
    explain:
      en: "With a fixed budget, small rounds with fixes in between find more problems and confirm your fixes."
      ar: "مع ميزانية محدّدة، الجولات الصغيرة مع إصلاحات بينها تكشف مشكلات أكثر وتؤكّد إصلاحاتك."

  - id: S09
    type: card
    part: recap
    icons: [person, order, warn, text]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Small rounds:** split 15 sessions into three rounds of 5, and 10 into two rounds of 5.\n- **Test the fix:** tested the moved photo with new people instead of shipping or asking.\n- **No percentages from 5:** replaced \"80%\" and \"60%\" with counts and the reason behind them.\n- **Honest about limits:** told the manager what a small test can and can't say, and where a real number would come from.\n\nNext: what to say, and not say, while people test."
      ar: "- **جولات صغيرة:** قسّمت 15 جلسة إلى ثلاث جولات من 5، و10 إلى جولتين من 5.\n- **اختبر الإصلاح:** اختبرت نقل الصورة مع أشخاص جدد بدل الإطلاق أو السؤال.\n- **لا نِسَب من 5:** استبدلت «80%» و«60%» بالأعداد والسبب وراءها.\n- **صادق بشأن الحدود:** أخبرت المدير بما يستطيع الاختبار الصغير قوله وما لا يستطيع، ومن أين يأتي الرقم الحقيقي.\n\nالتالي: ماذا تقول، وماذا لا تقول، أثناء الاختبار."
