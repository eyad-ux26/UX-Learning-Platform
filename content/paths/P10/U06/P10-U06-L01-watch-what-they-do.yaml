id: P10-U06-L01
mode: lesson
minutes: 8
title:
  en: "Watch what they do, not what they say"
  ar: "راقب ما يفعلونه، لا ما يقولونه"
summary:
  en: "Swap friends' opinions for a real task and write the success rule first."
  ar: "استبدل آراء الأصدقاء بمهمة حقيقية، واكتب قاعدة النجاح أولًا."
speaker: sara
sources:
  - title: { en: "First Rule of Usability? Don't Listen to Users (NN/g)", ar: "أول قاعدة في سهولة الاستخدام؟ لا تستمع للمستخدمين (NN/g)" }
    url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/"
  - title: { en: "Success Rate: The Simplest Usability Metric (NN/g)", ar: "معدّل النجاح: أبسط مقياس لسهولة الاستخدام (NN/g)" }
    url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/"
review_labels:
  MC-P10-084: { en: "Watch what people do, not what they say", ar: "راقب ما يفعله الناس، لا ما يقولونه" }
  MC-P10-085: { en: "Decide what success means before the test", ar: "حدّد معنى النجاح قبل الاختبار" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Six friends said yes", ar: "ستة أصدقاء قالوا نعم" }
    body:
      en: "I redesigned my workshop booking page: the date and \"Reserve a place\" now come first, and the cancellation rule is easy to read. I showed it to six friends and asked, \"Is it easier now?\" All six said yes.\n\nA month after launch, bookings hadn't changed, and people still emailed to ask whether they could cancel. My friends had told me what I wanted to hear."
      ar: "أعدت تصميم صفحة حجز الورشة: التاريخ و«احجز مكانك» يأتيان أولًا الآن، وشرط الإلغاء سهل القراءة. عرضتها على ستة أصدقاء وسألتهم: «هل صارت أسهل؟» فقال الستة نعم.\n\nوبعد شهر من الإطلاق، لم تتغيّر الحجوزات، وظلّ الناس يراسلونني ليسألوا هل يمكنهم الإلغاء. أصدقائي قالوا لي ما أردت سماعه."
    mock:
      app: manara
      appbar: { title: { en: Workshop, ar: الورشة }, back: true }
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: small, text: "@W1g", gap: s }

  - id: S02
    type: tune
    skill: SK-P10-U06-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Don't listen to users (NN/g): to design the best experience, pay attention to what people do, not what they say. Asking \"Is it easier?\" collects opinions; a task shows whether they book."
      ar: "جرّب أولًا. لا تستمع للمستخدمين (NN/g): لتصمّم أفضل تجربة، انتبه لما يفعله الناس، لا لما يقولونه. وسؤال «هل هي أسهل؟» يجمع آراء؛ أما المهمة فتُظهر هل يحجزون."
    ref: { url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/", quote: "Watch what people actually do." }
    prompt:
      en: "My claim: the new order makes booking easier. Try each way to check it. Which one should I use?"
      ar: "ادّعائي: الترتيب الجديد يجعل الحجز أسهل. جرّب كل طريقة للتحقّق. أيّ طريقة تُظهر هل يستطيع الناس الحجز فعلًا؟"
    start: prefer
    options:
      - id: prefer
        text: { en: "Show the old and new pages and ask which they prefer", ar: "اعرض الصفحتين القديمة والجديدة واسأل أيّهما يفضّلون" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &pl_h { en: "Test plan", ar: "خطة الاختبار" } }
                - { kind: text, text: { en: "Show both pages side by side. Ask: \"Which one do you prefer?\" Count the votes.", ar: "اعرض الصفحتين جنبًا إلى جنب. اسأل: «أيّهما تفضّل؟» واحسب الأصوات." }, gap: xs }
      - id: would
        text: { en: "Show the new page and ask whether they would book from it", ar: "اعرض الصفحة الجديدة واسأل هل سيحجزون منها" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *pl_h }
                - { kind: text, text: { en: "Show the new page. Ask: \"Would you book a workshop from this page?\"", ar: "اعرض الصفحة الجديدة. اسأل: «هل ستحجز ورشة من هذه الصفحة؟»" }, gap: xs }
      - id: task
        text: { en: "Give a task and watch whether they book the right session", ar: "أعطِ مهمة وراقب هل يحجزون الجلسة الصحيحة" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *pl_h }
                - { kind: text, text: { en: "Task: \"You're free on Tuesday evenings. Book a workshop you can attend.\" Watch: do they book it? Where do they hesitate?", ar: "المهمة: «أنت متفرّغ مساء الثلاثاء. احجز ورشة تستطيع حضورها.» راقب: هل يحجزون؟ وأين يتردّدون؟" }, gap: xs }
    answer: [task]
    misconceptions:
      - id: MC-P10-084
        when: [prefer, would]
        feedback:
          en: "That's what I did with my friends: I got opinions and guesses about the future. Neither tells me whether someone can actually book."
          ar: "هذا ما فعلته مع أصدقائي: حصلت على آراء وتوقّعات عن المستقبل. ولا يخبرني أيّ منهما هل يستطيع أحد الحجز فعلًا."
    hints:
      - { en: "Which plan shows you someone actually booking?", ar: "أي خطة تُريك شخصًا يحجز فعلًا؟" }
      - { en: "Can a vote or a \"yes, I would\" show where people get stuck?", ar: "هل يمكن لتصويت أو «نعم، سأحجز» أن يُظهر أين يتعثّر الناس؟" }
    correct:
      en: "A task shows what people do; you learn where they get stuck."
      ar: "المهمة تُظهر ما يفعله الناس؛ وتعرف أين يتعثّرون."
    explain:
      en: "People are polite, guess badly about their own future, and judge by looks. Watching them try a real task shows whether your hierarchy works."
      ar: "الناس مهذّبون، ويخطئون في توقّع ما سيفعلونه، ويحكمون بالشكل. ومراقبتهم وهم يجرّبون مهمة حقيقية تُظهر هل ينجح التسلسل البصري (Visual hierarchy) عندك."

  - id: S03
    type: card
    part: concept
    icons: [eye, ok, person, idea]
    title: { en: "A claim needs a check", ar: "الادّعاء يحتاج تحقّقًا" }
    body:
      en: "\"This hierarchy is clearer\" is a claim. A small usability test checks it.\n\n- **Watch, don't ask:** give people a realistic task and see what they do. What they say they like, or would do, is unreliable.\n- **Success first:** before the test, write what counts as done, like \"books a Tuesday session and can say the cancellation rule\".\n- **Small and often:** about 5 people show the main problems. Fix them, then test again.\n- **Honest numbers:** 5 people give you reasons, not percentages.\n- **Think aloud, don't lead:** ask people to say what they're thinking, and keep your own words neutral."
      ar: "«هذا التسلسل أوضح» ادّعاء. واختبار استخدام (Usability test) صغير يتحقّق منه.\n\n- **راقب، لا تسأل:** أعطِ الناس مهمة واقعية وانظر ماذا يفعلون. وما يقولون إنهم يحبّونه، أو سيفعلونه، لا يُعتمد عليه.\n- **النجاح أولًا:** قبل الاختبار، اكتب ما يُعدّ إنجازًا، مثل «يحجز جلسة الثلاثاء ويستطيع ذكر شرط الإلغاء».\n- **صغير ومتكرّر:** نحو 5 أشخاص يكشفون المشكلات الرئيسية. أصلحها، ثم اختبر مرة أخرى.\n- **أرقام صادقة:** 5 أشخاص يعطونك أسبابًا، لا نِسَبًا مئوية.\n- **التفكير بصوت عالٍ (Think aloud)، دون توجيه:** اطلب من الناس أن يقولوا ما يفكّرون فيه، وأبقِ كلماتك أنت محايدة."

  - id: S04
    type: tune
    skill: SK-P10-U06-02
    part: guided
    rules: [R06, R15]
    value:
      en: "Success rate (NN/g): if a person doesn't do the task as specified, you can strictly score it as a failure. That only works if \"as specified\" was written down before the test."
      ar: "معدّل النجاح (NN/g): إن لم يؤدِّ الشخص المهمة كما هي محدّدة، يمكنك بصرامة أن تعدّها فشلًا. وهذا لا ينجح إلا إن كُتب «كما هي محدّدة» قبل الاختبار."
    ref: { url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/", quote: "If a user does not perform a task as specified, you could be strict and score it as a failure." }
    scenario:
      en: "My task: \"You're free on Tuesday evenings. Book a workshop you can attend, and find out what happens if your plans change.\" Before the first participant arrives, I write what counts as success."
      ar: "مهمّتي: «أنت متفرّغ مساء الثلاثاء. احجز ورشة تستطيع حضورها، واعرف ماذا يحدث إن تغيّرت خططك.» وقبل وصول أول مشارك، أكتب ما يُعدّ نجاحًا."
    prompt:
      en: "Try each success rule. Which one should I write down?"
      ar: "جرّب كل قاعدة نجاح. أيّ قاعدة تحدّد النجاح بنتيجة يمكن التحقّق منها؟"
    start: feel
    options:
      - id: feel
        text: { en: "They say the page felt easy", ar: "يقولون إن الصفحة بدت سهلة" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: &sc_h { en: "Success means…", ar: "النجاح يعني…" } }
                - { kind: text, text: { en: "The participant says the page was easy to use.", ar: "يقول المشارك إن الصفحة كانت سهلة الاستخدام." }, gap: xs }
      - id: exact
        text: { en: "They book a Tuesday session and can state the 24-hour rule, without help", ar: "يحجزون جلسة الثلاثاء ويذكرون شرط الـ 24 ساعة، دون مساعدة" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *sc_h }
                - { kind: text, text: { en: "Without help, the participant (1) reserves the Tuesday 17 November session and (2) says they can cancel up to 24 hours before.", ar: "دون مساعدة، المشارك (1) يحجز جلسة الثلاثاء 17 نوفمبر و(2) يقول إنه يستطيع الإلغاء قبل الموعد بـ 24 ساعة." }, gap: xs }
      - id: later
        text: { en: "Decide after watching, once I see what people did", ar: "قرّر بعد المراقبة، حين أرى ما فعله الناس" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *sc_h }
                - { kind: text, text: { en: "(to be decided after the sessions)", ar: "(يُحدَّد بعد الجلسات)" }, gap: xs }
    answer: [exact]
    misconceptions:
      - id: MC-P10-085
        when: [later]
        feedback:
          en: "If I decide afterwards, I'll be tempted to call \"almost booked\" a success because I like my design. Write the rule first."
          ar: "إن قرّرت بعد ذلك، سأميل إلى عدّ «كاد أن يحجز» نجاحًا لأنني أحب تصميمي. اكتب القاعدة أولًا."
      - id: MC-P10-084
        when: [feel]
        feedback:
          en: "That's an opinion again. Someone can say \"easy\" and still book the wrong date. Success has to be something you can see them do."
          ar: "هذا رأي مرة أخرى. قد يقول أحد «سهلة» ويحجز التاريخ الخطأ. والنجاح يجب أن يكون شيئًا تراهم يفعلونه."
    hints:
      - { en: "Could two observers agree, just from watching, whether each rule was met?", ar: "هل يستطيع مراقبان أن يتّفقا، من المشاهدة فقط، على تحقّق كل قاعدة؟" }
      - { en: "Which rule was set before seeing any result?", ar: "أي قاعدة وُضعت قبل رؤية أي نتيجة؟" }
    correct:
      en: "Written first, and anyone watching can check it."
      ar: "مكتوبة أولًا، ويستطيع أي مراقب التحقّق منها."
    explain:
      en: "A success rule written before the test is fair to the design: specific actions you can see, decided before you know how it turned out."
      ar: "قاعدة النجاح المكتوبة قبل الاختبار عادلة مع التصميم: أفعال محدّدة تراها، تقرّرها قبل أن تعرف النتيجة."

  - id: S05
    type: tune
    skill: SK-P10-U06-01
    part: guided
    rules: [R06, R15]
    value:
      en: "Don't listen to users (NN/g): self-reported claims are unreliable, and so are guesses about future behavior. \"I'd join a waiting list\" is a guess."
      ar: "لا تستمع للمستخدمين (NN/g): ما يقوله الناس عن أنفسهم لا يُعتمد عليه، ولا توقّعاتهم عن سلوكهم المستقبلي. و«سأنضم لقائمة الانتظار» توقّع."
    ref: { url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/", quote: "Self-reported claims are unreliable, as are user speculations about future behavior." }
    scenario:
      en: "Mona, our design lead, ran a quick survey: 8 of 10 people said they'd join a waiting list when a workshop is full. She wants \"Join the waiting list\" to be the biggest thing on a full session."
      ar: "أجرت منى، قائدة التصميم عندنا، استبيانًا سريعًا: قال 8 من 10 إنهم سينضمّون لقائمة الانتظار حين تمتلئ الورشة. وتريد أن يكون «انضم إلى قائمة الانتظار» أكبر شيء في الجلسة الممتلئة."
    prompt:
      en: "Try each next step. Which one should I take?"
      ar: "جرّب كل خطوة تالية. أيّ خطوة تُظهر هل نجح الإصلاح فعلًا؟"
    start: build
    options:
      - id: build
        text: { en: "Make the waiting list the biggest button; 8 of 10 said so", ar: "اجعل قائمة الانتظار أكبر زر؛ فقد قال ذلك 8 من 10" }
        mock:
          app: manara
          appbar: { title: { en: Workshop, ar: الورشة }, back: true }
          blocks:
            - { kind: title, text: "@W1full" }
            - { kind: button, text: "@W1wait", gap: m }
            - { kind: small, text: "@W1next", gap: s }
      - id: more
        text: { en: "Survey 50 more people to be sure", ar: "استطلع رأي 50 شخصًا آخر للتأكّد" }
        mock:
          app: manara
          appbar: { title: { en: Workshop, ar: الورشة }, back: true }
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *pl_h }
                - { kind: text, text: { en: "Send the same question to 50 more people: \"Would you join a waiting list?\"", ar: "أرسل السؤال نفسه إلى 50 شخصًا آخر: «هل ستنضم لقائمة انتظار؟»" }, gap: xs }
      - id: watch
        text: { en: "Show people a full session in a task and watch what they choose", ar: "اعرض جلسة ممتلئة على الناس في مهمة وراقب ما يختارونه" }
        mock:
          app: manara
          appbar: { title: { en: Workshop, ar: الورشة }, back: true }
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *pl_h }
                - { kind: text, text: { en: "Task: \"You wanted the 17 November workshop.\" The page shows it's full. Watch: do they join the list, pick the next session, or leave?", ar: "المهمة: «كنت تريد ورشة 17 نوفمبر.» والصفحة تُظهر أنها ممتلئة. راقب: هل ينضمّون للقائمة، أم يختارون الجلسة التالية، أم يغادرون؟" }, gap: xs }
    answer: [watch]
    misconceptions:
      - id: MC-P10-084
        when: [build, more]
        feedback:
          en: "Both trust a guess about the future. More people guessing is still guessing. Put a full session in front of them and see what they actually do."
          ar: "كلاهما يثق في توقّع عن المستقبل. وتوقّع عدد أكبر من الناس يظل توقّعًا. ضع أمامهم جلسة ممتلئة وانظر ماذا يفعلون فعلًا."
    hints:
      - { en: "Did those 8 people join a list, or say they would?", ar: "هل انضمّ هؤلاء الثمانية لقائمة، أم قالوا إنهم سينضمّون؟" }
      - { en: "Which step shows behavior instead of intention?", ar: "أي خطوة تُظهر السلوك بدل النيّة؟" }
    correct:
      en: "You'll see whether they join the list or just take the next date."
      ar: "سترى هل ينضمّون للقائمة أم يأخذون الموعد التالي فقط."
    explain:
      en: "What people predict about themselves often differs from what they do. Before making something the biggest thing on the page, watch whether people actually choose it."
      ar: "ما يتوقّعه الناس عن أنفسهم يختلف كثيرًا عمّا يفعلونه. وقبل أن تجعل شيئًا أكبر عنصر في الصفحة، راقب هل يختاره الناس فعلًا."

  - id: S06
    type: words
    skill: SK-P10-U06-02
    part: guided
    confidence: true
    rules: [R06, R15]
    value:
      en: "Success rate (NN/g): success is whether people complete the task as specified. A good rule names the exact thing the person must find or do."
      ar: "معدّل النجاح (NN/g): النجاح هو هل يُكمل الناس المهمة كما هي محدّدة. والقاعدة الجيدة تذكر الشيء المحدّد الذي يجب أن يجده الشخص أو يفعله."
    ref: { url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/", quote: "If a user does not perform a task as specified, you could be strict and score it as a failure." }
    scenario:
      en: "A second task: \"You use a wheelchair. Find out whether you can get into the room.\" The answer is in \"View step-free access details\": a lift at the side entrance."
      ar: "مهمة ثانية: «أنت تستخدم كرسيًا متحرّكًا. اعرف هل يمكنك الدخول إلى القاعة.» والإجابة في «تفاصيل الدخول دون سلالم»: مصعد عند المدخل الجانبي."
    prompt:
      en: "Which success rule should I write for this task?"
      ar: "أيّ قاعدة نجاح تُثبت أن المشارك وجد الإجابة الصحيحة؟"
    options:
      - { id: click, text: { en: "\"They click something about access.\"", ar: "«يضغطون على شيء له علاقة بالدخول.»" } }
      - { id: says, text: { en: "\"They say they'd feel confident going.\"", ar: "«يقولون إنهم سيذهبون بثقة.»" } }
      - { id: lift, text: { en: "\"Without help, they say there's a lift at the side entrance.\"", ar: "«دون مساعدة، يقولون إن هناك مصعدًا عند المدخل الجانبي.»" } }
    answer: [lift]
    misconceptions:
      - id: MC-P10-085
        when: [click]
        feedback:
          en: "Clicking the link isn't finding the answer. Someone can open it, misread it, and think there's no access. Name the fact they must come back with."
          ar: "الضغط على الرابط ليس إيجادًا للإجابة. قد يفتحه أحد ويُسيء فهمه ويظن أنه لا يوجد دخول. اذكر المعلومة التي يجب أن يعود بها."
      - id: MC-P10-084
        when: [says]
        feedback:
          en: "Confidence is a feeling, not a result. They could feel confident and be wrong about the lift."
          ar: "الثقة شعور، لا نتيجة. قد يشعرون بالثقة ويكونون مخطئين بشأن المصعد."
    hints:
      - { en: "What exact fact proves they found the answer?", ar: "ما المعلومة المحدّدة التي تثبت أنهم وجدوا الإجابة؟" }
      - { en: "Which rule could you check by just listening to their answer?", ar: "أي قاعدة تستطيع التحقّق منها بمجرّد سماع إجابتهم؟" }
    correct:
      en: "A specific, correct answer: anyone can score it."
      ar: "إجابة محدّدة وصحيحة: أي شخص يستطيع تقييمها."
    explain:
      en: "For \"find out\" tasks, success is the right answer, in the participant's words. Write that answer down before the test."
      ar: "في مهام «اعرف»، النجاح هو الإجابة الصحيحة، بكلمات المشارك. اكتب تلك الإجابة قبل الاختبار."

  - id: S07
    type: compare
    skill: SK-P10-U06-01
    part: contrast
    rules: [R11, R15]
    value:
      en: "Contrast with S02: both plans here use people and pages. Don't listen to users (NN/g): if people haven't actually tried the designs, they comment on surface features."
      ar: "مقارنة مع الخطوة 2: الخطّتان هنا تستخدمان أشخاصًا وصفحات. لا تستمع للمستخدمين (NN/g): إن لم يجرّب الناس التصميمات فعلًا، يعلّقون على مظهرها السطحي."
    ref: { url: "https://www.nngroup.com/articles/first-rule-of-usability-dont-listen-to-users/", quote: "If the users have not actually tried to use the designs, they'll base their comments on surface features." }
    scenario:
      en: "I have two versions of the page: one with the photo on top, one with the date and Reserve on top. I want to know which one helps people book."
      ar: "عندي نسختان من الصفحة: واحدة فيها الصورة في الأعلى، وأخرى فيها التاريخ و«احجز» في الأعلى. وأريد أن أعرف أيّهما تساعد الناس على الحجز."
    prompt:
      en: "Which plan answers that question?"
      ar: "أي خطة تجيب عن هذا السؤال؟"
    a:
      label: { en: "Look and pick", ar: "انظر واختر" }
      mock:
        app: basira
        frame: wide
        url: basira.example/plans/booking-page
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: *pl_h }
              - { kind: text, text: { en: "5 people look at screenshots of both versions for 30 seconds and say which one looks easier to book from.", ar: "5 أشخاص ينظرون إلى صورتي النسختين 30 ثانية ويقولون أيّهما تبدو أسهل للحجز." }, gap: xs }
    b:
      label: { en: "Try and book", ar: "جرّب واحجز" }
      mock:
        app: basira
        frame: wide
        url: basira.example/plans/booking-page
        blocks:
          - kind: group
            blocks:
              - { kind: small, text: *pl_h }
              - { kind: text, text: { en: "5 people each try to book a Tuesday session on one version, then on the other. Note who books correctly and where they pause.", ar: "5 أشخاص يحاول كل منهم حجز جلسة الثلاثاء على نسخة، ثم على الأخرى. سجّل من يحجز بشكل صحيح وأين يتوقّف." }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: tried, text: { en: "People actually use each version, so you see what helps them book", ar: "يستخدم الناس كل نسخة فعلًا، فترى ما يساعدهم على الحجز" } }
        - { id: longer, text: { en: "It takes longer, so it's more serious", ar: "يستغرق وقتًا أطول، فهو أكثر جدية" } }
        - { id: more, text: { en: "It uses more people", ar: "يستخدم أشخاصًا أكثر" } }
      answer: [tried]
      misconceptions:
        - id: MC-P10-084
          when: [longer, more]
          feedback:
            en: "Both plans use 5 people. The difference is that in B they try to book, so you see behavior instead of first impressions."
            ar: "الخطّتان تستخدمان 5 أشخاص. والفرق أنهم في B يحاولون الحجز، فترى السلوك بدل الانطباع الأول."
    misconceptions:
      - id: MC-P10-084
        when: [a]
        feedback:
          en: "Looking at a screenshot, people judge the photo and the colors. They never find out where Reserve is when they need it."
          ar: "عند النظر إلى صورة، يحكم الناس على الصورة والألوان. ولا يكتشفون أبدًا أين «احجز» حين يحتاجونه."
    hints:
      - { en: "In which plan does anyone try to book?", ar: "في أي خطة يحاول أحد أن يحجز؟" }
    correct:
      en: "Use beats looks: they have to try it."
      ar: "الاستخدام يتفوّق على الشكل: يجب أن يجرّبوه."
    explain:
      en: "A hierarchy is there to help people act. Only watching them act on it tells you whether it does."
      ar: "التسلسل البصري موجود ليساعد الناس على التصرّف. ولا شيء يخبرك هل يفعل ذلك إلا مراقبتهم وهم يتصرّفون."

  - id: S08
    type: tune
    skill: SK-P10-U06-02
    part: independent
    speaker: hana
    rules: [R14, R19]
    value:
      en: "New case. Success rate (NN/g): success rate is the share of people who completed the task. You can only count completions if \"complete\" was defined first."
      ar: "حالة جديدة. معدّل النجاح (NN/g): معدّل النجاح هو نسبة من أكملوا المهمة. ولا يمكنك عدّ مرات الإكمال إلا إن عُرّف «الإكمال» أولًا."
    ref: { url: "https://www.nngroup.com/articles/success-rate-the-simplest-usability-metric/", quote: "the percentage of users who were able to complete a task in a study." }
    scenario:
      en: "I put \"Book your free trial\" at the top of my gym's home page. Before testing it, I need a success rule for the task: \"Try the gym for free this Friday morning.\""
      ar: "وضعت «احجز تجربتك المجانية» في أعلى الصفحة الرئيسية لنادينا. وقبل اختبارها، أحتاج قاعدة نجاح للمهمة: «جرّب النادي مجانًا صباح الجمعة.»"
    prompt:
      en: "Try each success rule. Which one should I use?"
      ar: "جرّب كل قاعدة نجاح. أيّ قاعدة تحدّد مهمة مكتملة يمكن التحقّق منها؟"
    start: notice
    options:
      - id: notice
        text: { en: "They notice the free trial button", ar: "يلاحظون زر التجربة المجانية" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *sc_h }
                - { kind: text, text: { en: "The participant notices \"Book your free trial\".", ar: "يلاحظ المشارك «احجز تجربتك المجانية»." }, gap: xs }
      - id: booked
        text: { en: "They book a free trial for this Friday morning, without help", ar: "يحجزون تجربة مجانية صباح الجمعة هذه، دون مساعدة" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *sc_h }
                - { kind: text, text: { en: "Without help, the participant books a free trial for Friday 6 November, before 12:00.", ar: "دون مساعدة، يحجز المشارك تجربة مجانية يوم الجمعة 6 نوفمبر، قبل الساعة 12:00." }, gap: xs }
      - id: rate
        text: { en: "They rate the page 4 or 5 out of 5", ar: "يقيّمون الصفحة 4 أو 5 من 5" }
        mock:
          app: basira
          frame: wide
          url: basira.example/plans/booking-page
          blocks:
            - kind: group
              blocks:
                - { kind: small, text: *sc_h }
                - { kind: text, text: { en: "The participant rates the home page 4 or 5 out of 5.", ar: "يقيّم المشارك الصفحة الرئيسية 4 أو 5 من 5." }, gap: xs }
    answer: [booked]
    misconceptions:
      - id: MC-P10-085
        when: [notice]
        feedback:
          en: "Noticing isn't booking. Someone can see the button and still book Saturday, or a paid class. Define the finished task."
          ar: "الملاحظة ليست حجزًا. قد يرى أحد الزر ويحجز السبت، أو حصة مدفوعة. عرّف المهمة المكتملة."
      - id: MC-P10-084
        when: [rate]
        feedback:
          en: "A rating is an opinion about the page, not proof they could book. Score what they did."
          ar: "التقييم رأي في الصفحة، لا دليل على أنهم استطاعوا الحجز. قيّم ما فعلوه."
    correct:
      en: "A finished, correct booking: easy to score."
      ar: "حجز مكتمل وصحيح: سهل التقييم."
    explain:
      en: "Success is the end of the task, done right: the correct day, time and type, without help. Write it before the first session."
      ar: "النجاح هو نهاية المهمة، منجزة بشكل صحيح: اليوم والوقت والنوع الصحيحة، دون مساعدة. اكتبه قبل الجلسة الأولى."

  - id: S09
    type: card
    part: recap
    icons: [eye, ok, person, idea]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Watch, don't ask:** chose a booking task over preference votes and \"would you book?\".\n- **Behavior beats predictions:** tested the waiting list instead of trusting \"8 of 10 said they would\".\n- **Try, don't look:** chose people booking on both versions over judging screenshots.\n- **Success first:** wrote exact, checkable success rules before the test, for booking, for step-free access, and for a gym trial.\n\nNext: how many people to test, and how to report what you saw."
      ar: "- **راقب، لا تسأل:** اخترت مهمة حجز بدل التصويت على التفضيل و«هل ستحجز؟».\n- **السلوك يتفوّق على التوقّعات:** اختبرت قائمة الانتظار بدل الثقة في «قال 8 من 10 إنهم سيفعلون».\n- **جرّب، لا تنظر:** اخترت أن يحجز الناس على النسختين بدل الحكم على صور.\n- **النجاح أولًا:** كتبت قواعد نجاح دقيقة يمكن التحقّق منها قبل الاختبار، للحجز، وللدخول دون سلالم، ولتجربة النادي.\n\nالتالي: كم شخصًا تختبر، وكيف تعرض ما رأيته."
