  - id: S08
    type: card
    part: recap
    icons: [target, layers, eye, warn]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **One primary:** gave the filled style to the action most people came for.\n- **Three levels:** filled, outlined and text link, by how often people need each action.\n- **Accent color:** kept the brand color for the one thing that should stand out.\n- **Risky actions:** kept them apart and different, not loud.\n\nNext lesson: making things quieter without making them unreadable."
      ar: "- **Primary واحد:** أعطيت الشكل الممتلئ للإجراء الذي جاء من أجله معظم الناس.\n- **ثلاثة مستويات:** ممتلئ، وبإطار، ورابط نصّي، حسب عدد مرات الحاجة إلى كل إجراء.\n- **لون التمييز:** احتفظت بلون العلامة للشيء الذي يجب أن يبرز.\n- **الإجراءات الخطرة:** أبقيتها بعيدة ومختلفة، لا صاخبة.\n\nالدرس التالي: كيف تجعل الأشياء أهدأ دون أن تصبح غير مقروءة."
