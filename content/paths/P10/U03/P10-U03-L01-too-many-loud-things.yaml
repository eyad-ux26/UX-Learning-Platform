          en: "Now the riskiest action is the loudest thing, right where Mariam taps most. Serious doesn't mean main. Keep it apart and quieter."
          ar: "الآن أصبح الإجراء الأخطر أعلى صوت، في المكان الذي تضغط فيه مريم أكثر. الخطير لا يعني الرئيسي. أبقِه بعيدًا وأهدأ."
