id: P10-U03-L01
mode: lesson
minutes: 8
title:
  en: "Too many loud things"
  ar: "أشياء لافتة أكثر من اللازم"
sources:
  - title: { en: "Button States: Communicate Interaction (NN/g)", ar: "حالات الأزرار: كيف توضّح التفاعل (NN/g)" }
    url: "https://www.nngroup.com/articles/button-states-communicate-interaction/"
  - title: { en: "Using Color to Enhance Your Design (NN/g)", ar: "استخدام اللون لتحسين التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/color-enhance-design/"
  - title: { en: "Proximity of Consequential Options (NN/g)", ar: "قرب الخيارات ذات العواقب (NN/g)" }
    url: "https://www.nngroup.com/articles/proximity-consequential-options/"
review_labels:
  MC-P10-040: { en: "When everything stands out, nothing does", ar: "عندما يبرز كل شيء، لا يبرز شيء" }
  MC-P10-041: { en: "One main action per decision", ar: "إجراء رئيسي واحد لكل قرار" }
  MC-P10-042: { en: "Save the accent color for the one thing", ar: "احتفظ بلون التمييز للشيء الأهم" }
  MC-P10-043: { en: "Risky actions sit apart and look different", ar: "الإجراءات الخطرة بعيدة وبشكل مختلف" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two filled buttons", ar: "زرّان ممتلئان" }
    body:
      en: "The marketing team wants more newsletter sign-ups, so they made the newsletter button on Sara's page filled, just like Reserve.\n\nBoth buttons now look equally important. Is that a problem?"
      ar: "يريد فريق التسويق اشتراكات أكثر في النشرة، فجعلوا زر النشرة في صفحة سارة ممتلئًا باللون، تمامًا مثل زر الحجز.\n\nالآن يبدو الزرّان بالأهمية نفسها. هل هذه مشكلة؟"
    mock:
      blocks: &two
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, text: "@W1d", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: button, text: "@W1j", gap: s }

  - id: S02
    type: tune
    part: try
    rules: [R12]
    value:
      en: "Button hierarchy (NN/g): primary buttons have the most visual emphasis, for the important or common action; secondary buttons have medium emphasis, for less important actions."
      ar: "تسلسل الأزرار (NN/g): الـ Primary button له أكبر بروز بصري، للإجراء المهم أو الشائع؛ والـ Secondary button بروزه متوسط، للإجراءات الأقل أهمية."
    ref: { url: "https://www.nngroup.com/articles/button-states-communicate-interaction/", quote: "Primary buttons have the most visual emphasis" }
    prompt:
      en: "Almost everyone on this page came to reserve. Try each change. Which one should ship?"
      ar: "تقريبًا كل من يزور هذه الصفحة جاء ليحجز. جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: *two
    options:
      - id: bigger
        text: { en: "Keep both filled, and make Reserve taller", ar: "أبقِ الزرّين ممتلئين، واجعل زر الحجز أطول" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, px: 20, text: "@W1f", gap: m }
            - { kind: button, text: "@W1j", gap: s }
      - id: outline
        text: { en: "Keep Reserve filled; make the newsletter an outlined button", ar: "أبقِ زر الحجز ممتلئًا؛ واجعل زر النشرة بإطار فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: button, emphasis: low, text: "@W1j", gap: s }
      - id: color
        text: { en: "Keep both filled, but make the newsletter button orange so they look different", ar: "أبقِ الزرّين ممتلئين، لكن اجعل زر النشرة برتقاليًا ليختلفا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: button, tone: warn, text: "@W1j", gap: s }
    answer: [outline]
    misconceptions:
      - id: MC-P10-041
        when: [bigger, color]
        feedback:
          en: "Two filled buttons still compete, whatever their size or color. An orange button can even look more urgent than Reserve. Lower the extra one to a quieter style."
          ar: "الزرّان الممتلئان يبقيان متنافسين، مهما كان الحجم أو اللون. بل قد يبدو الزر البرتقالي أكثر إلحاحًا من زر الحجز. اجعل الزر الإضافي بشكل أهدأ."
    correct:
      en: "One filled button; the extra one is quieter."
      ar: "زر ممتلئ واحد؛ والإضافي أهدأ."
    explain:
      en: "A filled button is the loudest thing on a page. Give it to the action most people came for. The newsletter stays easy to find, but as an outlined button it no longer asks Sara to choose between the two."
      ar: "الزر الممتلئ أعلى صوت في الصفحة. أعطِه للإجراء الذي جاء من أجله معظم الناس. يبقى زر النشرة سهل الإيجاد، لكنه بإطار فقط لم يعد يطلب من سارة أن تختار بين الاثنين."

  - id: S03
    type: card
    part: concept
    icons: [target, layers, eye, warn]
    title: { en: "Emphasis is a budget", ar: "البروز ميزانية محدودة" }
    body:
      en: "Size, weight and color only stand out compared with what's around them. Spend them on purpose.\n\n- **Three button levels:** primary (filled) for the main action, secondary (outlined) for less common ones, tertiary (a text link) for optional extras.\n- **One primary per decision:** two filled buttons make people stop and compare.\n- **Accent color:** keep the brand's bright color for the one thing that should stand out most.\n- **Risky actions:** keep them away from common ones, and make them look different, so nobody taps them by mistake."
      ar: "الحجم والـ Font weight واللون لا تبرز إلا بالمقارنة مع ما حولها. استخدمها عن قصد.\n\n- **ثلاثة مستويات للأزرار:** الـ Primary (ممتلئ) للإجراء الرئيسي، والـ Secondary (بإطار) للإجراءات الأقل شيوعًا، والـ Tertiary (رابط نصّي) للإضافات الاختيارية.\n- **Primary واحد لكل قرار:** الزرّان الممتلئان يجعلان الناس يتوقّفون ويقارنون.\n- **لون التمييز (Accent color):** احتفظ بلون العلامة اللامع للشيء الذي يجب أن يبرز أكثر من غيره.\n- **الإجراءات الخطرة:** أبعدها عن الإجراءات الشائعة، واجعل شكلها مختلفًا، حتى لا يضغطها أحد بالخطأ."

  - id: S04
    type: tune
    part: guided
    rules: [R06, R13]
    value:
      en: "Button hierarchy (NN/g): tertiary buttons have the least visual emphasis and are for optional or supplementary actions. Three levels for three kinds of action."
      ar: "تسلسل الأزرار (NN/g): الـ Tertiary button أقلّ بروزًا، وهو للإجراءات الاختيارية أو الإضافية. ثلاثة مستويات لثلاثة أنواع من الإجراءات."
    ref: { url: "https://www.nngroup.com/articles/button-states-communicate-interaction/", quote: "Tertiary buttons have the least amount of visual emphasis" }
    scenario:
      en: "Sara has reserved. The confirmation screen offers three actions. Most people add the session to their calendar. Some share it with a friend. A few browse other workshops."
      ar: "حجزت سارة. وشاشة التأكيد تعرض ثلاثة إجراءات. معظم الناس يضيفون الجلسة إلى التقويم. وبعضهم يشاركها مع صديق. وقليلون يتصفّحون ورشًا أخرى."
    prompt:
      en: "Try each style. Which one should ship?"
      ar: "جرّب كل شكل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &conf
        - { kind: title, text: { en: "You're booked!", ar: "تمّ حجزك!" } }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: button, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: m }
        - { kind: button, text: { en: "Share with a friend", ar: "شارك مع صديق" }, gap: s }
        - { kind: button, text: { en: "See other workshops", ar: "اعرض ورشًا أخرى" }, gap: s }
    options:
      - id: links
        text: { en: "All three as plain text links, so none is pushy", ar: "الثلاثة روابط نصّية عادية، حتى لا يُلحّ أيّها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "You're booked!", ar: "تمّ حجزك!" } }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: link, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: m }
            - { kind: link, text: { en: "Share with a friend", ar: "شارك مع صديق" }, gap: s }
            - { kind: link, text: { en: "See other workshops", ar: "اعرض ورشًا أخرى" }, gap: s }
      - id: same
        text: { en: "Keep all three filled; they're all useful", ar: "أبقِ الثلاثة ممتلئة؛ فكلّها مفيدة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks: *conf
      - id: levels
        text: { en: "Calendar filled, Share outlined, Other workshops as a text link", ar: "التقويم ممتلئ، والمشاركة بإطار، والورش الأخرى رابط نصّي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: { en: "You're booked!", ar: "تمّ حجزك!" } }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: { en: "Add to calendar", ar: "أضف إلى التقويم" }, gap: m }
            - { kind: button, emphasis: low, text: { en: "Share with a friend", ar: "شارك مع صديق" }, gap: s }
            - { kind: link, text: { en: "See other workshops", ar: "اعرض ورشًا أخرى" }, gap: s }
    answer: [levels]
    misconceptions:
      - id: MC-P10-040
        when: [same, links]
        feedback:
          en: "When all three look the same, loud or quiet, Sara has to read each one to find the usual next step. Match each button's weight to how often people need it."
          ar: "حين تبدو الثلاثة متشابهة، صاخبة أو هادئة، على سارة أن تقرأ كلًّا منها لتجد الخطوة المعتادة. اجعل بروز كل زر بقدر حاجة الناس إليه."
    correct:
      en: "Three levels for three kinds of action."
      ar: "ثلاثة مستويات لثلاثة أنواع من الإجراءات."
    explain:
      en: "Filled for what most people do, outlined for what some do, a text link for the optional extra. Each action is available, and the usual one is obvious at a glance."
      ar: "ممتلئ لما يفعله معظم الناس، وبإطار لما يفعله بعضهم، ورابط نصّي للإضافة الاختيارية. كل إجراء متاح، والإجراء المعتاد واضح من النظرة الأولى."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "Color (NN/g): reserve the accent color for what you want to stand out the most; when many colored things compete, nothing leads."
      ar: "اللون (NN/g): احتفظ بلون التمييز لما تريده أن يبرز أكثر من غيره؛ فحين تتنافس أشياء ملوّنة كثيرة، لا يقود شيء."
    ref: { url: "https://www.nngroup.com/articles/color-enhance-design/", quote: "Reserve the accent color for what you want to stand out the most on your page" }
    scenario:
      en: "The brand color is purple. On Sara's page, the title, the date, the price and the Reserve button are all purple."
      ar: "لون العلامة التجارية بنفسجي. وفي صفحة سارة، العنوان والموعد والسعر وزر الحجز كلّها بنفسجية."
    prompt:
      en: "Try each change. Which one should ship?"
      ar: "جرّب كل تغيير. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &purple
        - { kind: title, color: brand, text: "@W1a" }
        - { kind: meta, color: brand, text: "@W1b", gap: s }
        - { kind: meta, text: "@W1c", gap: s }
        - { kind: meta, color: brand, text: "@W1d", gap: s }
        - { kind: button, text: "@W1f", gap: m }
    options:
      - id: only
        text: { en: "Purple only on Reserve; the text in near-black", ar: "البنفسجي على زر الحجز فقط؛ والنصوص بلون قريب من الأسود" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
      - id: orange
        text: { en: "Keep the purple text, and make Reserve orange so it stands apart", ar: "أبقِ النصوص البنفسجية، واجعل زر الحجز برتقاليًا ليتميّز" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, color: brand, text: "@W1a" }
            - { kind: meta, color: brand, text: "@W1b", gap: s }
            - { kind: meta, text: "@W1c", gap: s }
            - { kind: meta, color: brand, text: "@W1d", gap: s }
            - { kind: button, tone: warn, text: "@W1f", gap: m }
      - id: more
        text: { en: "Make the place purple too, so the page looks consistent", ar: "اجعل المكان بنفسجيًا أيضًا، حتى تبدو الصفحة متّسقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, color: brand, text: "@W1a" }
            - { kind: meta, color: brand, text: "@W1b", gap: s }
            - { kind: meta, color: brand, text: "@W1c", gap: s }
            - { kind: meta, color: brand, text: "@W1d", gap: s }
            - { kind: button, text: "@W1f", gap: m }
    answer: [only]
    misconceptions:
      - id: MC-P10-042
        when: [orange, more]
        feedback:
          en: "Adding another color, or more purple, only adds more things competing. Take the accent color off everything except the one thing that should stand out."
          ar: "إضافة لون آخر، أو مزيد من البنفسجي، تزيد فقط الأشياء المتنافسة. أزِل لون التمييز من كل شيء إلا الشيء الذي يجب أن يبرز."
    correct:
      en: "The accent color marks one thing."
      ar: "لون التمييز يحدّد شيئًا واحدًا."
    explain:
      en: "An accent color works because it's rare. Spread over four things, it stops pointing anywhere. Used only on Reserve, it tells Sara where to act."
      ar: "ينجح لون التمييز لأنه نادر. وحين ينتشر على أربعة أشياء، يتوقّف عن الإشارة إلى أي شيء. وحين يكون على زر الحجز فقط، يخبر سارة أين تتصرّف."

  - id: S06
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02: serious isn't the same as main. NN/g: confirmatory and destructive actions should be far apart, with extra space and redundant visual signals."
      ar: "مقارنة مع الخطوة 2: الخطير ليس هو الرئيسي. NN/g: يجب أن تكون إجراءات التأكيد والإجراءات المدمّرة بعيدة عن بعضها، مع مسافة إضافية وإشارات بصرية متعدّدة."
    ref: { url: "https://www.nngroup.com/articles/proximity-consequential-options/", quote: "Confirmatory and destructive actions should be far apart from each other" }
    scenario:
      en: "Omar is editing his profile in a shopping app. He almost always taps Save. Delete account removes everything and can't be undone."
      ar: "يعدّل عمر ملفّه الشخصي في تطبيق تسوّق. وهو يضغط «حفظ» في كل مرة تقريبًا. أما «حذف الحساب» فيمسح كل شيء ولا يمكن التراجع عنه."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      mock:
        blocks:
          - { kind: field, label: { en: "Name", ar: "الاسم" }, filled: true, text: { en: "Omar Saleh", ar: "عمر صالح" } }
          - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, filled: true, text: "omar@mail.com", gap: s }
          - { kind: button, text: { en: "Save changes", ar: "حفظ التغييرات" }, gap: m }
          - { kind: link, color: red, text: { en: "Delete account", ar: "حذف الحساب" }, gap: xl }
    b:
      mock:
        blocks:
          - { kind: field, label: { en: "Name", ar: "الاسم" }, filled: true, text: { en: "Omar Saleh", ar: "عمر صالح" } }
          - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, filled: true, text: "omar@mail.com", gap: s }
          - kind: row
            gap: m
            blocks:
              - { kind: button, text: { en: "Save changes", ar: "حفظ التغييرات" } }
              - { kind: button, text: { en: "Delete account", ar: "حذف الحساب" } }
    answer: a
    reason:
      prompt: { en: "Why is A better?", ar: "لماذا A أفضل؟" }
      options:
        - { id: hide, text: { en: "Deleting should be hard to find", ar: "يجب أن يصعب إيجاد الحذف" } }
        - { id: apart, text: { en: "Delete is far from Save and looks different, so it's not tapped by mistake", ar: "الحذف بعيد عن الحفظ وبشكل مختلف، فلا يُضغط بالخطأ" } }
        - { id: red, text: { en: "Red buttons always look bad", ar: "الأزرار الحمراء تبدو سيئة دائمًا" } }
      answer: [apart]
      misconceptions:
        - id: MC-P10-043
          when: [hide, red]
          feedback:
            en: "Delete is still easy to find in A. What changed is its distance from Save and its look, so a quick tap on Save can't hit it."
            ar: "ما زال الحذف سهل الإيجاد في A. ما تغيّر هو بُعده عن الحفظ وشكله، فالضغطة السريعة على الحفظ لا تصيبه."
    misconceptions:
      - id: MC-P10-043
        when: [b]
        feedback:
          en: "In B, two equal filled buttons sit side by side. A quick tap aimed at Save could delete the account. Keep risky actions apart and different."
          ar: "في B، زرّان ممتلئان متساويان جنبًا إلى جنب. والضغطة السريعة نحو الحفظ قد تحذف الحساب. أبقِ الإجراءات الخطرة بعيدة ومختلفة."
    correct:
      en: "Apart and different, not hidden."
      ar: "بعيد ومختلف، لا مخفي."
    explain:
      en: "In S02 the extra action got less weight because fewer people need it. Here there's a second reason: a mistake can't be undone. People often tap without full attention, so space and a different look protect them."
      ar: "في الخطوة 2، أخذ الإجراء الإضافي بروزًا أقل لأن عددًا أقل يحتاجه. وهنا سبب ثانٍ: الخطأ لا يمكن التراجع عنه. والناس كثيرًا ما يضغطون دون انتباه كامل، فالمسافة والشكل المختلف يحميانهم."

  - id: S07
    type: tune
    part: independent
    rules: [R14, R19]
    value:
      en: "New case, combining both rules. NN/g: add additional space and redundant visual signals to set consequential options apart; one primary action for the common task."
      ar: "حالة جديدة تجمع القاعدتين. NN/g: أضف مسافة وإشارات بصرية متعدّدة لتمييز الخيارات ذات العواقب؛ وإجراء رئيسي واحد للمهمّة الشائعة."
    ref: { url: "https://www.nngroup.com/articles/proximity-consequential-options/", quote: "Add additional space and redundant visual signals" }
    scenario:
      en: "Mariam pays for street parking in an app. Most visits she extends by 30 minutes. Ending parking stops the timer at once. A monthly pass is an offer few people buy."
      ar: "تدفع مريم ثمن الموقف في الشارع عبر تطبيق. في معظم المرات تمدّد الوقت 30 دقيقة. وإنهاء الموقف يوقف العدّاد فورًا. والاشتراك الشهري عرض يشتريه قليلون."
    prompt:
