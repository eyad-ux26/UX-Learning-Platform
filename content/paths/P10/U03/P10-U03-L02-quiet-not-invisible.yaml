id: P10-U03-L02
mode: lesson
minutes: 9
title:
  en: "Quiet, not invisible"
  ar: "هادئ، لا غير مرئي"
review_labels:
  MC-P10-009: { en: "Supporting text still needs 4.5:1", ar: "النص الداعم يحتاج 4.5:1 أيضًا" }
  MC-P10-048: { en: "Bold doesn't make small text \"large\"", ar: "الخط الـ Bold لا يجعل النص الصغير «كبيرًا»" }
  MC-P10-049: { en: "Passing contrast isn't the same as clear hierarchy", ar: "اجتياز الـ Contrast لا يعني وضوح الـ Visual hierarchy" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Toning it down", ar: "تخفيف الصوت" }
    body:
      en: "To stop the cancellation rule competing with Reserve, a designer made it pale grey.\n\nIt certainly stopped competing. Sara is reading on her phone, outside, in the afternoon sun."
      ar: "حتى لا تنافس قاعدة الإلغاء زر «احجز»، جعلها أحد المصمّمين رمادية باهتة.\n\nبالتأكيد توقّفت عن المنافسة. سارة تقرأ على هاتفها، في الخارج، تحت شمس الظهيرة."
    mock:
      blocks:
        - { kind: title, text: "@W1a" }
        - { kind: meta, text: "@W1b", gap: s }
        - { kind: button, text: "@W1f", gap: m }
        - { kind: text, px: 14, color: faint, text: "@W1g", gap: s }

  - id: S02
    type: predict
    part: try
    rules: [R12, R20]
    prompt:
      en: "This pale grey measures 2.3:1 against white. Small text needs at least 4.5:1. Is it readable enough for a condition Sara must see, outside in the sun?"
      ar: "هذا الرمادي الباهت نسبته 2.3:1 مقابل الأبيض. والنص الصغير يحتاج 4.5:1 على الأقل. هل هو مقروء بما يكفي لشرط يجب أن تراه سارة، في الخارج تحت الشمس؟"
    options:
      - { id: yes, text: { en: 'Yes, I can read it on my screen', ar: "نعم، أستطيع قراءته على شاشتي" } }
      - { id: no, text: { en: "No: it's about half the minimum, and sunlight makes it worse", ar: 'لا: نحو نصف الحد الأدنى، والشمس تجعله أسوأ' } }
      - { id: depends, text: { en: "It depends on her screen", ar: "يعتمد على شاشتها" } }
    answer: [no]
    misconceptions:
      - id: MC-P10-009
        when: [yes, depends]
        feedback:
          en: "That's the trap: we judge with our own eyes on a good screen indoors. The number doesn't depend on who's looking, and 2.3:1 fails."
          ar: 'هذا هو الفخ: نحكم بأعيننا على شاشة جيدة في الداخل. أما الرقم فلا يعتمد على من ينظر، و2.3:1 لا ينجح.'
    correct:
      en: "It fails, so it isn't safe for something she must read."
      ar: "لا ينجح، فهو غير آمن لشيء يجب أن تقرأه."
    explain:
      en: "Contrast can be measured. Supporting text can be quieter than the main facts, but it still needs 4.5:1 to be readable for most people, in most light."
      ar: "الـ Contrast يمكن قياسه. والنص المساند يمكن أن يكون أهدأ من المعلومات الأساسية، لكنه يحتاج 4.5:1 ليكون مقروءًا لأغلب الناس، في أغلب الإضاءات."
  - id: S03
    type: card
    part: concept
    icons: [text, size, contrast]
    title: { en: "Measure contrast", ar: "قِس الـ Contrast" }
    body:
      en: "**Contrast ratio** compares the lightness of text and its background, from 1:1 (invisible) to 21:1 (black on white).\n\n- **Normal text:** at least 4.5:1 (WCAG, level AA).\n- **Large text:** at least 3:1. Large means 24px regular, or about 18.7px bold. A 14px bold label is not large.\n- **Quieter roles:** can use a lighter grey, as long as it stays above the line.\n\nA design tool or contrast checker gives you the number."
      ar: "**الـ Contrast ratio** يقارن بين درجة فتاحة النص وخلفيته، من 1:1 (غير مرئي) إلى 21:1 (أسود على أبيض).\n\n- **النص العادي:** 4.5:1 على الأقل (WCAG، المستوى AA).\n- **النص الكبير:** 3:1 على الأقل. والكبير يعني 24px عاديًا، أو نحو 18.7px عريضًا. والتسمية بحجم 14px العريضة ليست كبيرة.\n- **الأدوار الأهدأ:** يمكن أن تستخدم رماديًا أفتح، ما دام فوق الحد.\n\nأداة التصميم أو أداة فحص الـ Contrast تعطيك الرقم."
  - id: S04
    type: sort
    part: guided
    rules: [R07, U14]
    prompt:
      en: "These colors are for 14px text on white. Which pass?"
      ar: "هذه الألوان لنص بحجم 14 بكسل على خلفية بيضاء. أيّها يجتاز المعيار؟"
    mock:
      blocks:
        - { kind: text, px: 14, color: ink, text: { en: "Near-black: Cancel up to 24 hours before", ar: "شبه أسود: يمكنك الإلغاء حتى 24 ساعة قبل البدء" } }
        - { kind: text, px: 14, color: muted, text: { en: "Grey: Cancel up to 24 hours before", ar: "رمادي: يمكنك الإلغاء حتى 24 ساعة قبل البدء" }, gap: s }
        - { kind: text, px: 14, color: pale, text: { en: "Light grey: Cancel up to 24 hours before", ar: "رمادي فاتح: يمكنك الإلغاء حتى 24 ساعة قبل البدء" }, gap: s }
        - { kind: text, px: 14, color: faint, text: { en: "Pale grey: Cancel up to 24 hours before", ar: "رمادي باهت: يمكنك الإلغاء حتى 24 ساعة قبل البدء" }, gap: s }
    items:
      - { id: ink, text: { en: "Near-black, 16.8:1", ar: "شبه أسود، 16.8:1" } }
      - { id: muted, text: { en: "Grey, 5.3:1", ar: "رمادي، 5.3:1" } }
      - { id: pale, text: { en: "Light grey, 3.0:1", ar: "رمادي فاتح، 3.0:1" } }
      - { id: faint, text: { en: "Pale grey, 2.3:1", ar: "رمادي باهت، 2.3:1" } }
    buckets:
      - { id: pass, label: { en: "Passes", ar: "يجتاز" } }
      - { id: fail, label: { en: "Fails", ar: "لا يجتاز" } }
    answer:
      pass: [ink, muted]
      fail: [pale, faint]
    misconceptions:
      - id: MC-P10-009
        when: { item: pale, bucket: pass }
        feedback:
          en: "3.0:1 is enough only for large text. At 14px, text needs 4.5:1."
          ar: "نسبة 3.0:1 تكفي للنص الكبير فقط. أما عند 14 بكسل فيحتاج النص 4.5:1."
      - id: MC-P10-050
        when: { item: muted, bucket: fail }
        feedback:
          en: "5.3:1 is above 4.5:1, so this grey passes. Quiet and readable can go together."
          ar: "5.3:1 أعلى من 4.5:1، لذلك يجتاز هذا الرمادي. الهدوء والوضوح يمكن أن يجتمعا."
    hints:
      - { en: "For 14px text, the line is 4.5:1.", ar: "لنص بحجم 14 بكسل، الحد هو 4.5:1." }
    correct:
      en: "Near-black and grey pass; the two lighter greys don't."
      ar: "شبه الأسود والرمادي يجتازان؛ والرماديان الأفتح لا يجتازان."
    explain:
      en: "Grey at 5.3:1 is a good supporting color: clearly quieter than near-black, and still above 4.5:1. The pale grey designers reach for to \"tone it down\" is often below the line."
      ar: "الرمادي بنسبة 5.3:1 لون داعم جيد: أهدأ بوضوح من شبه الأسود، ويبقى فوق 4.5:1. أما الرمادي الباهت الذي يلجأ إليه المصمّمون «لتخفيف الصوت» فغالبًا ما يكون تحت الحد."

  - id: S05
    type: choose
    part: guided
    rules: [R07, U14]
    prompt:
      en: "A section heading is 24px regular in light grey (3.0:1). Does it pass?"
      ar: "عنوان قسم بحجم 24 بكسل عادي باللون الرمادي الفاتح (3.0:1). هل يجتاز المعيار؟"
    mock:
      blocks:
        - { kind: text, px: 24, color: pale, text: { en: "Upcoming sessions", ar: "الجلسات القادمة" } }
    options:
      - { id: no, text: { en: "No", ar: "لا" } }
      - { id: yes, text: { en: "Yes", ar: "نعم" } }
    answer: [yes]
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: heading, text: { en: "Headings don't need to meet contrast rules", ar: "العناوين لا تحتاج إلى معايير الـ Contrast" } }
        - { id: large, text: { en: "24px counts as large text, which needs 3:1", ar: "24 بكسل يُعدّ نصًا كبيرًا، ويحتاج 3:1" } }
      answer: [large]
      misconceptions:
        - id: MC-P10-051
          when: [heading]
          feedback:
            en: "Headings do need to meet contrast. This one passes because 24px is large text, which needs 3:1."
            ar: "العناوين تحتاج إلى معايير الـ Contrast. هذا العنوان يجتاز لأن 24 بكسل نص كبير، يحتاج 3:1."
    misconceptions:
      - id: MC-P10-009
        when: [no]
        feedback:
          en: "Check the size: 24px regular counts as large text, so the line is 3:1, and 3.0:1 just meets it."
          ar: "تحقّق من الحجم: 24 بكسل عادي يُعدّ نصًا كبيرًا، فيكون الحد 3:1، و3.0:1 يبلغه بالكاد."
    correct:
      en: "It passes, just barely."
      ar: "يجتاز، بالكاد."
    explain:
      en: "Large text is easier to read, so its line is lower. \"Just passes\" is fine for a decorative section heading; for something people must read, more contrast is kinder."
      ar: "النص الكبير أسهل في القراءة، لذلك حدّه أقل. «يجتاز بالكاد» مقبول لعنوان قسم؛ أما لشيء يجب أن يقرأه الناس، فالـ Contrast الأعلى ألطف بهم."

  - id: S06
    type: choose
    part: guided
    confidence: true
    rules: [R07, U14]
    prompt:
      en: "Now a 14px bold label in the same light grey (3.0:1). Does it pass?"
      ar: "الآن تسمية بحجم 14 بكسل عريضة بالرمادي الفاتح نفسه (3.0:1). هل تجتاز المعيار؟"
    mock:
      blocks:
        - { kind: text, px: 14, weight: bold, color: pale, text: { en: "Places are limited", ar: "الأماكن محدودة" } }
    options:
      - { id: no, text: { en: "No, 14px bold isn't large, so it needs 4.5:1", ar: "لا، 14 بكسل عريض ليس كبيرًا، لذلك يحتاج 4.5:1" } }
      - { id: yes, text: { en: "Yes, bold text only needs 3:1", ar: "نعم، الخط الـ Bold يحتاج 3:1 فقط" } }
    answer: [no]
    misconceptions:
      - id: MC-P10-048
        when: [yes]
        feedback:
          en: "Bold only counts as large from about 18.7px. At 14px, bold text still needs 4.5:1."
          ar: "الخط الـ Bold يُعدّ كبيرًا فقط من نحو 18.7 بكسل. وعند 14 بكسل، يحتاج الخط الـ Bold 4.5:1 أيضًا."
    correct:
      en: "Bold helps a little, but 14px bold isn't large text."
      ar: "الخط الـ Bold يساعد قليلًا، لكن 14 بكسل عريضًا ليس نصًا كبيرًا."
    explain:
      en: "Large text is 24px regular or about 18.7px bold. Anything smaller needs 4.5:1, bold or not."
      ar: "النص الكبير هو 24 بكسل عاديًا أو نحو 18.7 بكسل عريضًا. وأي شيء أصغر يحتاج 4.5:1، عريضًا كان أم لا."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, R15]
    prompt:
      en: "Every color in both versions passes contrast. In which one does the title stand out from the rest?"
      ar: "كل الألوان في النسختين تجتاز معيار الـ Contrast. في أيّهما يبرز العنوان عن باقي النص؟"
    a:
      mock:
        blocks:
          - { kind: text, px: 18, weight: bold, color: ink, text: "@W1a" }
          - { kind: text, px: 18, weight: bold, color: ink, text: "@W1b", gap: s }
          - { kind: text, px: 18, weight: bold, color: ink, text: "@W1g", gap: s }
          - { kind: text, px: 18, weight: bold, color: ink, text: "@W1j", gap: s }
          - { kind: button, text: "@W1f", gap: m }
    b:
      mock:
        blocks:
          - { kind: text, px: 24, weight: bold, color: ink, text: "@W1a" }
          - { kind: text, px: 16, color: ink, text: "@W1b", gap: s }
          - { kind: button, text: "@W1f", gap: m }
          - { kind: text, px: 14, color: muted, text: "@W1g", gap: s }
          - { kind: button, style: plain, text: "@W1j", gap: m }
    answer: b
    reason:
      prompt: { en: "What does this show?", ar: "ماذا يوضّح هذا؟" }
      options:
        - { id: enough, text: { en: "If all colors pass, the hierarchy is fine", ar: "إذا اجتازت كل الألوان، فالـ Visual hierarchy سليم" } }
        - { id: both, text: { en: "Contrast makes text readable; roles make it clear what matters", ar: "الـ Contrast يجعل النص مقروءًا؛ والأدوار توضّح ما يهم" } }
      answer: [both]
      misconceptions:
        - id: MC-P10-049
          when: [enough]
          feedback:
            en: "A passes everywhere and still has no hierarchy: every line is equally loud. Passing is necessary, not sufficient."
            ar: "A تجتاز في كل مكان ومع ذلك بلا تسلسل: كل سطر بالصوت نفسه. الاجتياز ضروري، لكنه غير كافٍ."
    misconceptions:
      - id: MC-P10-049
        when: [a]
        feedback:
          en: "A passes contrast everywhere, but every line is 18px bold near-black. Readable isn't the same as clear."
          ar: "A تجتاز الـ Contrast في كل مكان، لكن كل سطر بحجم 18 بكسل عريض وشبه أسود. المقروء لا يعني الواضح."
    correct:
      en: "Both are readable; only B tells Sara what matters."
      ar: "النسختان مقروءتان؛ لكن B وحدها تخبر سارة بما يهم."
    explain:
      en: "A contrast check answers one question: can people read it? Hierarchy answers another: what should they read first? You need both."
      ar: "فحص الـ Contrast يجيب عن سؤال واحد: هل يستطيع الناس قراءته؟ والـ Visual hierarchy يجيب عن سؤال آخر: ماذا يقرؤون أولًا؟ تحتاج إلى الاثنين."

  - id: S08
    type: tune
    part: guided
    rules: [R13, U14]
    prompt:
      en: "Pick a color for the cancellation rule: quiet, but readable."
      ar: "اختر لونًا لقاعدة الإلغاء: هادئ لكن مقروء."
    start: faint
    options:
      - id: faint
        text: { en: "Pale grey, 2.3:1", ar: "رمادي باهت، 2.3:1" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: text, px: 14, color: faint, text: "@W1g", gap: s }
      - id: pale
        text: { en: "Light grey, 3.0:1", ar: "رمادي فاتح، 3.0:1" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: text, px: 14, color: pale, text: "@W1g", gap: s }
      - id: muted
        text: { en: "Grey, 5.3:1", ar: "رمادي، 5.3:1" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: text, px: 14, color: muted, text: "@W1g", gap: s }
      - id: ink
        text: { en: "Near-black, 16.8:1", ar: "شبه أسود، 16.8:1" }
        mock:
          blocks:
            - { kind: title, text: "@W1a" }
            - { kind: meta, text: "@W1b", gap: s }
            - { kind: button, text: "@W1f", gap: m }
            - { kind: text, px: 14, color: ink, text: "@W1g", gap: s }
    answer: [muted]
    also_ok:
      - answer: [ink]
        feedback:
          en: "That works too: it's readable, and the smaller size already keeps it quieter than the facts. Grey just adds a little more separation."
          ar: "هذا صحيح أيضًا: مقروء، والحجم الأصغر يبقيه أهدأ من المعلومات. الرمادي يضيف فقط قليلًا من التمييز."
    misconceptions:
      - id: MC-P10-009
        when: [faint, pale]
        feedback:
          en: "At 14px this needs 4.5:1. Get quietness from size and position, not from fading the text."
          ar: "عند 14 بكسل يحتاج هذا 4.5:1. احصل على الهدوء من الحجم والموضع، لا من بهتان النص."
    correct:
      en: "Quieter than the facts, and above 4.5:1."
      ar: "أهدأ من المعلومات، وفوق 4.5:1."
    explain:
      en: "Supporting text gets its lower emphasis from a smaller size and a grey that still passes. Readability isn't something you trade for hierarchy."
      ar: "النص الداعم يأخذ بروزه الأقل من حجم أصغر ولون رمادي يجتاز المعيار. الوضوح ليس شيئًا تتنازل عنه مقابل الـ Visual hierarchy."

  - id: S09
    type: choose
    part: independent
    confidence: true
    rules: [R14, R19]
    scenario:
      en: "On Lina's delivery screen, \"Arriving 19:40\" is set in 14px light grey (3.0:1) so the screen looks \"subtle\"."
      ar: "في شاشة توصيل لينا، عبارة «يصل الساعة 19:40» بحجم 14 بكسل ورمادي فاتح (3.0:1) حتى تبدو الشاشة «هادئة»."
    prompt:
      en: "What should change?"
      ar: "ما الذي يجب أن يتغيّر؟"
    options:
      - { id: bold, text: { en: "Make it bold, same size and color", ar: "اجعله عريضًا، بالحجم واللون نفسيهما" } }
      - { id: keep, text: { en: "Nothing, subtle is the brand style", ar: "لا شيء، الهدوء هو أسلوب العلامة التجارية" } }
      - { id: fix, text: { en: "Make it larger and darker: it's the main fact on the screen", ar: "اجعله أكبر وأغمق: إنه المعلومة الأساسية في الشاشة" } }
    answer: [fix]
    misconceptions:
      - id: MC-P10-048
        when: [bold]
        feedback:
          en: "14px bold still needs 4.5:1, and this is 3.0:1. It also deserves more than a bold tweak: it's what Lina opened the screen for."
          ar: "14 بكسل عريضًا ما زال يحتاج 4.5:1، وهذا 3.0:1. ويستحق أكثر من مجرد خط عريض: إنه سبب فتح لينا للشاشة."
      - id: MC-P10-009
        when: [keep]
        feedback:
          en: "It fails contrast, and it's the one thing Lina is checking. Style can't come at the cost of the main fact."
          ar: "لا يجتاز الـ Contrast، وهو الشيء الوحيد الذي تتحقّق منه لينا. الأسلوب لا يأتي على حساب المعلومة الأساسية."
    correct:
      en: "Its role is the main fact, so it gets the main fact's emphasis."
      ar: "دوره المعلومة الأساسية، لذلك يأخذ بروز المعلومة الأساسية."
    explain:
      en: "Two problems at once: it fails contrast, and it has the wrong role. Fixing the role (larger, darker, near the top) fixes the contrast too."
      ar: "مشكلتان معًا: لا يجتاز الـ Contrast، ودوره خاطئ. إصلاح الدور (أكبر، أغمق، قرب الأعلى) يصلح الـ Contrast أيضًا."

  - id: S10
    type: card
    part: recap
    icons: [contrast, size, text, layers]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- Normal text needs 4.5:1; large text needs 3:1.\n- Bold doesn't make small text large.\n- Supporting text can be quiet and still pass.\n- Passing contrast doesn't create a hierarchy by itself.\n\nNext lesson: colour that carries meaning."
      ar: "- النص العادي يحتاج 4.5:1، والنص الكبير يحتاج 3:1.\n- الخط الـ Bold لا يجعل النص الصغير كبيرًا.\n- النص المساند يمكن أن يكون هادئًا وينجح.\n- النجاح في الـ Contrast لا يصنع Visual hierarchy وحده.\n\nالدرس التالي: لون يحمل معنى."
