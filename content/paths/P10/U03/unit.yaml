id: P10-U03
free: false
title:
  en: "Give emphasis a job"
  ar: "اجعل للبروز وظيفة"
skill:
  en: "Use size, weight, color and contrast so the most important thing stands out, and everything people need stays readable."
  ar: "استخدم الحجم وسُمك الخط واللون والتباين حتى يبرز الأهم، ويبقى كل ما يحتاجه الناس مقروءًا."
