id: P10-U03
free: false
title:
  en: "Give emphasis a job"
  ar: "اجعل للبروز وظيفة"
skill:
  en: "Use size, weight, color and contrast so the most important thing stands out, and everything people need stays readable."
  ar: "استخدم الحجم وسُمك الخط واللون والـ Contrast حتى يبرز الأهم، ويبقى كل ما يحتاجه الناس مقروءًا."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P10-U03-01
    title: { en: "Give each button the emphasis its action needs", ar: "امنح كل زر البروز الذي يحتاجه إجراؤه" }
    can_do: { en: "Make the main action primary, less important ones secondary, and optional extras tertiary.", ar: "اجعل الإجراء الرئيسي Primary، والأقل أهمية Secondary، والإضافات الاختيارية Tertiary." }
  - id: SK-P10-U03-02
    title: { en: "Let one thing lead", ar: "اجعل عنصرًا واحدًا يقود" }
    can_do: { en: "Save the accent color for the most important thing, and check with the squint test that it still leads.", ar: "احفظ لون التمييز (Accent) لأهم عنصر، وتحقّق باختبار التحديق أنه ما زال يقود." }
  - id: SK-P10-U03-03
    title: { en: "Set risky actions apart", ar: "افصل الإجراءات الخطرة" }
    can_do: { en: "Separate destructive actions from confirming ones with space and more than one visual signal.", ar: "افصل الإجراءات المدمّرة عن إجراءات التأكيد بالمسافة وبأكثر من إشارة بصرية." }
  - id: SK-P10-U03-04
    title: { en: "Keep quiet text readable", ar: "أبقِ النص الهادئ مقروءًا" }
    can_do: { en: "Make secondary text quieter without going below 4.5:1 contrast, and cut clutter instead of fading it.", ar: "اجعل النص الثانوي أهدأ دون أن ينزل الـ Contrast عن 4.5:1، واحذف الزحام بدل أن تُبهته." }
  - id: SK-P10-U03-05
    title: { en: "Know when large text may use 3:1", ar: "اعرف متى يكفي 3:1 للنص الكبير" }
    can_do: { en: "Apply 3:1 only to text that is 24px, or about 19px bold, and larger.", ar: "طبّق 3:1 فقط على النص بحجم 24px، أو نحو 19px بخط عريض، فما فوق." }
  - id: SK-P10-U03-06
    title: { en: "Never rely on color alone", ar: "لا تعتمد على اللون وحده" }
    can_do: { en: "Add words, icons or shapes so the meaning survives without color, and check in grayscale.", ar: "أضف كلمات أو أيقونات أو أشكالًا حتى يبقى المعنى دون لون، وتحقّق بالأبيض والأسود." }
  - id: SK-P10-U03-07
    title: { en: "Keep color meanings consistent", ar: "حافظ على ثبات معاني الألوان" }
    can_do: { en: "Use the link color only for links, and keep warning colors for warnings.", ar: "استخدم لون الروابط للروابط فقط، واحفظ ألوان التحذير للتحذيرات." }
