id: P10-U03-L03
mode: lesson
minutes: 8
title:
  en: "Color that carries meaning"
  ar: "ألوان تحمل معنى"
review_labels:
  MC-P10-052: { en: "Never rely on color alone", ar: "لا تعتمد على اللون وحده" }
  MC-P10-053: { en: "Keep each color's job consistent", ar: "حافظ على ثبات وظيفة كل لون" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Green and red dots", ar: "نقاط خضراء وحمراء" }
    body:
      en: "To save space, the sessions list now shows availability as a small dot: green for open, red for full.\n\nIt's neat. About 1 in 12 men and 1 in 200 women have some form of color blindness, and red versus green is the most common pair to confuse."
      ar: "لتوفير المساحة، أصبحت قائمة الجلسات تعرض التوفّر كنقطة صغيرة: خضراء للمتاح وحمراء للمكتمل.\n\nالشكل مرتّب. لكن نحو رجل من كل 12 وامرأة من كل 200 لديهم نوع من عمى الألوان، والأحمر مقابل الأخضر هما أكثر لونين يُخلط بينهما."
    mock: &dots
      blocks:
        - kind: row
          blocks:
            - { kind: heading, text: "@W2a", region: atitle }
            - { kind: text, color: green, text: "●", region: adot }
        - { kind: small, text: "@W2b", gap: xs }
        - kind: row
          gap: l
          blocks:
            - { kind: heading, text: "@W2e", region: btitle }
            - { kind: text, color: red, text: "●", region: bdot }
        - { kind: small, text: "@W2f", gap: xs }

  - id: S02
    type: predict
    part: try
    rules: [R12]
    mock: *dots
    prompt:
      en: Green means open and red means full, with nothing else. Could everyone tell which session is full?
      ar: الأخضر يعني متاح والأحمر يعني ممتلئ، ولا شيء غير ذلك. هل يستطيع الجميع معرفة الجلسة الممتلئة؟
    options:
      - { id: no, text: { en: 'No: red and green can look the same to some people', ar: 'لا: الأحمر والأخضر قد يبدوان متشابهين لبعض الناس' } }
      - { id: yes, text: { en: 'Yes, red always means full', ar: نعم، الأحمر يعني ممتلئ دائمًا } }
    answer: [no]
    misconceptions:
      - id: MC-P10-052
        when: [yes]
        feedback:
          en: For someone with red-green colour blindness, the two dots can look almost the same. And nothing on the page says what the colours mean.
          ar: لمن لديه عمى الألوان الأحمر والأخضر، قد تبدو النقطتان متشابهتين تقريبًا. ولا شيء في الصفحة يقول ما تعنيه الألوان.
    correct:
      en: Colour alone leaves some people out.
      ar: اللون وحده يستبعد بعض الناس.
    explain:
      en: About 1 in 12 men can't reliably tell red from green. Add a word like "Full", or an icon, so the status doesn't depend on colour.
      ar: نحو رجل من كل 12 لا يميّز الأحمر من الأخضر بثقة. أضِف كلمة مثل «ممتلئ»، أو أيقونة، حتى لا تعتمد الحالة على اللون.
  - id: S03
    type: card
    part: concept
    icons: [color, target, warn]
    title: { en: "Color reinforces, it doesn't carry", ar: "اللون يعزّز، ولا يحمل المعنى وحده" }
    body:
      en: "Colour is great at drawing attention and reinforcing meaning.\n\n- **Never colour alone:** pair it with words, an icon or a shape.\n- **One job per colour:** if purple means \"you can tap this\", don't use it for plain headings.\n- **Status colours stay status:** if red means error or full, don't decorate a price with it.\n\nWhen a colour has one job, people learn it quickly and trust it."
      ar: "اللون ممتاز في جذب الانتباه وتعزيز المعنى.\n\n- **لا تعتمد على اللون وحده:** أضِف إليه كلمات أو أيقونة أو شكلًا.\n- **وظيفة واحدة لكل لون:** إذا كان البنفسجي يعني «يمكنك الضغط هنا»، فلا تستخدمه لعناوين عادية.\n- **ألوان الحالة تبقى للحالة:** إذا كان الأحمر يعني خطأ أو ممتلئ، فلا تزيّن به سعرًا.\n\nحين يكون للّون وظيفة واحدة، يتعلّمها الناس بسرعة ويثقون بها."
  - id: S04
    type: fix
    part: guided
    confidence: true
    rules: [R06, U16]
    prompt:
      en: "What's the best fix for the dots?"
      ar: "ما أفضل إصلاح للنقاط؟"
    mock: *dots
    options:
      - { id: words, text: { en: "Add words: \"4 places left\" and \"Fully booked\"", ar: "أضف كلمات: «باقي 4 أماكن» و«اكتمل الحجز»" } }
      - { id: brighter, text: { en: "Use a brighter red and green", ar: "استخدم أحمر وأخضر أكثر سطوعًا" } }
      - { id: bigger, text: { en: "Make the dots bigger", ar: "كبّر النقاط" } }
      - { id: legend, text: { en: "Add a color legend at the bottom of the page", ar: "أضف دليل ألوان في أسفل الصفحة" } }
    answer: [words]
    misconceptions:
      - id: MC-P10-052
        when: [brighter, bigger]
        feedback:
          en: "Brighter or bigger dots are still just color. Someone who can't tell red from green still can't tell which session is full."
          ar: "النقاط الأسطع أو الأكبر تبقى مجرد لون. من لا يميّز الأحمر من الأخضر لن يعرف أي جلسة مكتملة."
      - id: MC-P10-054
        when: [legend]
        feedback:
          en: "A legend explains the colors, but people still have to match colors they may not be able to tell apart, and scroll to do it."
          ar: "الدليل يشرح الألوان، لكن على الناس أن يطابقوا ألوانًا قد لا يميّزونها، وأن يمرّروا للأسفل لذلك."
    hints:
      - { en: "What would make the status clear in a black-and-white printout?", ar: "ما الذي يجعل الحالة واضحة في نسخة مطبوعة بالأبيض والأسود؟" }
    correct:
      en: "Words carry the meaning; the color can stay to reinforce it."
      ar: "الكلمات تحمل المعنى؛ ويمكن أن يبقى اللون لتعزيزه."
    explain:
      en: "Keep the color if you like, inside a chip with the words. Now the status works for everyone, and the color still helps people scan."
      ar: "أبقِ اللون إن شئت، داخل شارة فيها الكلمات. الآن تعمل الحالة للجميع، ويبقى اللون مساعدًا للتصفّح السريع."

  - id: S05
    type: spot
    part: guided
    rules: [R06, U17]
    prompt:
      en: "On this page, purple means \"you can tap this\". Which item breaks that rule?"
      ar: "في هذه الصفحة، البنفسجي يعني «يمكنك الضغط هنا». أي عنصر يكسر هذه القاعدة؟"
    mock:
      blocks:
        - { kind: heading, color: brand, text: { en: "Upcoming sessions", ar: "الجلسات القادمة" }, region: heading }
        - { kind: text, weight: bold, text: "@W1a", gap: m, region: title }
        - { kind: small, text: "@W1b", gap: xs }
        - { kind: link, text: "@W1h", gap: s, region: link }
        - { kind: button, text: "@W1f", gap: m, region: button }
    regions:
      - { id: heading, label: { en: "Upcoming sessions", ar: "الجلسات القادمة" } }
      - { id: title, label: "@W1a" }
      - { id: link, label: "@W1h" }
      - { id: button, label: "@W1f" }
    answer: [heading]
    misconceptions:
      - id: MC-P10-053
        when: [link, button]
        feedback:
          en: "That one is tappable, so purple fits. Look for something purple that does nothing when tapped."
          ar: "هذا العنصر قابل للضغط، لذلك يناسبه البنفسجي. ابحث عن شيء بنفسجي لا يفعل شيئًا عند الضغط."
    correct:
      en: "The purple heading looks tappable, but it isn't."
      ar: "العنوان البنفسجي يبدو قابلًا للضغط، لكنه ليس كذلك."
    explain:
      en: "When the link color is also used for decoration, people tap headings that do nothing, and start doubting real links. Keep the interactive color for interactive things."
      ar: "عندما يُستخدم لون الروابط للزينة أيضًا، يضغط الناس على عناوين لا تفعل شيئًا، ويبدؤون في الشك في الروابط الحقيقية. أبقِ لون التفاعل للأشياء التفاعلية."

  - id: S06
    type: compare
    part: contrast
    rules: [R11, U17]
    prompt:
      en: "Which version avoids sending a false signal?"
      ar: "أي نسخة تتجنّب إرسال إشارة خاطئة؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@W2e" }
          - { kind: small, text: "@W2f", gap: xs }
          - { kind: text, weight: bold, color: red, text: "@W2g", gap: s }
          - { kind: button, text: "@W2h", gap: m }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@W2e" }
          - { kind: small, text: "@W2f", gap: xs }
          - { kind: text, weight: bold, text: "@W2g", gap: s }
          - { kind: button, text: "@W2h", gap: m }
    answer: b
    misconceptions:
      - id: MC-P10-053
        when: [a]
        feedback:
          en: "Red usually means error or warning. A red price makes people wonder what went wrong, or think it's a discount."
          ar: "الأحمر يعني عادةً خطأ أو تحذيرًا. السعر الأحمر يجعل الناس يتساءلون ما الخطأ، أو يظنونه خصمًا."
    correct:
      en: "The price is a plain fact; it gets plain text."
      ar: "السعر معلومة عادية؛ فيأخذ نصًا عاديًا."
    explain:
      en: "Status colors (green, amber, red) are worth protecting for status. Used for decoration, they lose their meaning or add a wrong one."
      ar: "ألوان الحالة (الأخضر والكهرماني والأحمر) تستحق أن تُحفظ للحالة. وعند استخدامها للزينة تفقد معناها أو تضيف معنى خاطئًا."

  - id: S07
    type: match
    part: guided
    rules: [R07, U17]
    prompt:
      en: "Give each color on this product one job."
      ar: "أعطِ كل لون في هذا المنتج وظيفة واحدة."
    left:
      - { id: purple, text: { en: "Purple", ar: "البنفسجي" } }
      - { id: green, text: { en: "Green", ar: "الأخضر" } }
      - { id: red, text: { en: "Red", ar: "الأحمر" } }
      - { id: ink, text: { en: "Near-black", ar: "شبه الأسود" } }
    right:
      - { id: tap, text: { en: "Something you can tap", ar: "شيء يمكنك الضغط عليه" } }
      - { id: ok, text: { en: "Available or done", ar: "متاح أو تم" } }
      - { id: bad, text: { en: "Full, error, or destructive", ar: "مكتمل أو خطأ أو إجراء مدمّر" } }
      - { id: text, text: { en: "Ordinary text", ar: "نص عادي" } }
    answer: { purple: tap, green: ok, red: bad, ink: text }
    misconceptions:
      - id: MC-P10-053
        when: { left: purple, right: text }
        feedback:
          en: "If purple is also ordinary text, nobody can tell which purple things are tappable."
          ar: "إذا كان البنفسجي نصًا عاديًا أيضًا، فلن يعرف أحد أي العناصر البنفسجية قابلة للضغط."
    correct:
      en: "Four colors, four jobs, no overlap."
      ar: "أربعة ألوان، أربع وظائف، دون تداخل."
    explain:
      en: "This is the start of a color system. In Path 11 you'll turn choices like these into design tokens a whole team can share."
      ar: "هذه بداية نظام الألوان. في المسار 11 ستحوّل اختيارات كهذه إلى رموز تصميم (design tokens) يتشاركها فريق كامل."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R14, U16]
    scenario:
      en: "Youssef's ticket. His platform changed from 4 to 6, and the app shows it only by turning the platform number orange."
      ar: "تذكرة يوسف. تغيّر رصيفه من 4 إلى 6، والتطبيق يُظهر ذلك فقط بتحويل رقم الرصيف إلى اللون البرتقالي."
    prompt:
      en: "What's the best fix?"
      ar: "ما أفضل إصلاح؟"
    mock:
      blocks:
        - { kind: heading, text: "@B1b" }
        - kind: row
          gap: s
          blocks:
            - { kind: text, text: { en: "Departs 07:30", ar: "المغادرة 07:30" } }
            - { kind: text, weight: bold, color: orange, text: { en: "Platform 6", ar: "رصيف 6" } }
        - { kind: button, text: "@B1e", gap: m }
    options:
      - { id: message, text: { en: "Add a clear message: \"Platform changed: now 6 (was 4)\"", ar: "أضف رسالة واضحة: «تغيّر الرصيف: الآن 6 (كان 4)»" } }
      - { id: blink, text: { en: "Make the orange number blink", ar: "اجعل الرقم البرتقالي يومض" } }
      - { id: red, text: { en: "Use red instead of orange", ar: "استخدم الأحمر بدلًا من البرتقالي" } }
    answer: [message]
    misconceptions:
      - id: MC-P10-052
        when: [red, blink]
        feedback:
          en: "A different color or blinking still doesn't say what happened. Youssef might not notice, or not know why it's highlighted."
          ar: "لون مختلف أو وميض لا يقول ما الذي حدث. قد لا يلاحظ يوسف، أو لا يعرف لماذا هو مميّز."
    correct:
      en: "Say what changed in words; color can still help it stand out."
      ar: "قل ما الذي تغيّر بالكلمات؛ ويمكن أن يبقى اللون ليساعده على البروز."
    explain:
      en: "A change is important news. Words explain it to everyone, including people who can't see the color difference and people using screen readers."
      ar: "التغيير خبر مهم. الكلمات تشرحه للجميع، بمن فيهم من لا يرى فرق الألوان ومن يستخدم الـ Screen reader."

  - id: S09
    type: choose
    part: independent
    rules: [R09, R14]
    prompt:
      en: "Sara's session card has a green \"4 places left\" chip. Is green OK here?"
      ar: "بطاقة جلسة سارة فيها شارة خضراء «باقي 4 أماكن». هل الأخضر مناسب هنا؟"
    mock:
      blocks:
        - { kind: heading, text: "@W1a" }
        - { kind: small, text: "@W1b", gap: xs }
        - { kind: chip, text: "@W1e", gap: s }
    options:
      - { id: ok, text: { en: "Yes: it reinforces words that already say the status", ar: "نعم: يعزّز كلمات تقول الحالة أصلًا" } }
      - { id: never, text: { en: "No: never use color for status", ar: "لا: لا تستخدم اللون للحالة أبدًا" } }
      - { id: amber, text: { en: "No: only 4 left should be red", ar: "لا: بقاء 4 فقط يجب أن يكون أحمر" } }
    answer: [ok]
    also_ok:
      - answer: [amber]
        feedback:
          en: "Reasonable too, if your system uses amber or red for \"almost full\". The key is that the words carry the meaning and the color follows a consistent rule."
          ar: "معقول أيضًا، إذا كان نظامك يستخدم الكهرماني أو الأحمر لـ«قارب على الاكتمال». المهم أن تحمل الكلمات المعنى، وأن يتبع اللون قاعدة ثابتة."
    misconceptions:
      - id: MC-P10-055
        when: [never]
        feedback:
          en: "Color for status is fine, even helpful. The problem is color alone. Here the words are already there."
          ar: "استخدام اللون للحالة مقبول، بل مفيد. المشكلة في اللون وحده. وهنا الكلمات موجودة أصلًا."
    correct:
      en: "Words carry it; green reinforces it."
      ar: "الكلمات تحمله؛ والأخضر يعزّزه."
    explain:
      en: "This is the fixed version of the dots: the status is written, and the color helps people scan a long list."
      ar: "هذه هي النسخة المصلحة من النقاط: الحالة مكتوبة، واللون يساعد الناس على تصفّح قائمة طويلة."

  - id: S10
    type: card
    part: recap
    icons: [color, tap, money]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- Status must work without colour: add words, icons or shapes.\n- Keep the tappable colour for tappable things.\n- Don't decorate with a status colour.\n\nNext lesson: the skill check."
      ar: "- الحالة يجب أن تُفهم دون لون: أضِف كلمات أو أيقونات أو أشكالًا.\n- خصّص لون «يمكنك الضغط» للعناصر القابلة للضغط.\n- لا تزيّن بلون مخصّص للحالة.\n\nالدرس التالي: اختبار المهارة."
