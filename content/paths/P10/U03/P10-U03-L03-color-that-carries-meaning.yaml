id: P10-U03-L03
mode: lesson
minutes: 8
title:
  en: "Color that carries meaning"
  ar: "اللون الذي يحمل معنى"
sources:
  - title: { en: "5 Visual Treatments that Improve Accessibility (NN/g)", ar: "5 معالجات بصرية تحسّن سهولة الوصول (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-treatments-accessibility/"
  - title: { en: "Using Color to Enhance Your Design (NN/g)", ar: "استخدام اللون لتحسين التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/color-enhance-design/"
  - title: { en: "Guidelines for Visualizing Links (NN/g)", ar: "إرشادات لإظهار الروابط (NN/g)" }
    url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/"
review_labels:
  MC-P10-050: { en: "Color is fine as an extra signal", ar: "اللون مناسب كإشارة إضافية" }
  MC-P10-052: { en: "Never rely on color alone", ar: "لا تعتمد على اللون وحده" }
  MC-P10-054: { en: "Link color only on links", ar: "لون الروابط للروابط فقط" }
  MC-P10-055: { en: "Status colors aren't decoration", ar: "ألوان الحالة ليست للزينة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Green and red dots", ar: "نقاط خضراء وحمراء" }
    body:
      en: "To save space, the sessions list now shows availability as a small dot: green for open, red for full.\n\nIt looks neat. But some people can't tell red from green apart."
      ar: "لتوفير المساحة، أصبحت قائمة الجلسات تعرض التوفّر كنقطة صغيرة: خضراء للمتاح وحمراء للمكتمل.\n\nالشكل مرتّب. لكن بعض الناس لا يستطيعون التمييز بين الأحمر والأخضر."
    mock:
      blocks: &dots
        - kind: row
          blocks:
            - { kind: heading, text: "@W2a" }
            - { kind: text, color: green, text: "●" }
        - { kind: small, text: "@W2b", gap: xs }
        - kind: row
          gap: l
          blocks:
            - { kind: heading, text: "@W2e" }
            - { kind: text, color: red, text: "●" }
        - { kind: small, text: "@W2f", gap: xs }

  - id: S02
    type: tune
    skill: SK-P10-U03-06
    part: try
    rules: [R12]
    value:
      en: "Accessibility (NN/g): some people can't distinguish certain colors, so use additional cues to communicate important information, not color alone."
      ar: "سهولة الوصول (NN/g): بعض الناس لا يميّزون ألوانًا معيّنة، لذلك استخدم إشارات إضافية لتوصيل المعلومات المهمّة، لا اللون وحده."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "use additional cues (such as strokes, patterns) to communicate important information" }
    prompt:
      en: "Every visitor must be able to tell which session is full, including people who can't tell red from green. Try each fix. Which one should ship?"
      ar: "يجب أن يعرف كل زائر أي جلسة مكتملة، بمن فيهم من لا يميّز الأحمر من الأخضر. جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: *dots
    options:
      - id: brighter
        text: { en: "Make the dots bigger and brighter", ar: "اجعل النقاط أكبر وأكثر لمعانًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - kind: row
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: text, px: 28, color: green, text: "●" }
            - { kind: small, text: "@W2b", gap: xs }
            - kind: row
              gap: l
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: text, px: 28, color: red, text: "●" }
            - { kind: small, text: "@W2f", gap: xs }
      - id: words
        text: { en: "Replace each dot with a chip that says \"Open\" or \"Full\", keeping the color", ar: "استبدل كل نقطة بعلامة مكتوب فيها «متاح» أو «مكتمل»، مع الإبقاء على اللون" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: "@W2a" }
            - { kind: small, text: "@W2b", gap: xs }
            - { kind: chip, text: { en: "Open", ar: "متاح" }, gap: xs }
            - { kind: heading, text: "@W2e", gap: l }
            - { kind: small, text: "@W2f", gap: xs }
            - { kind: chip, tone: bad, text: { en: "Full", ar: "مكتمل" }, gap: xs }
      - id: legend
        text: { en: "Keep the dots and add a key at the bottom: \"● open ● full\"", ar: "أبقِ النقاط وأضف مفتاح ألوان (Legend) في الأسفل: «● متاح ● مكتمل»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - kind: row
              blocks:
                - { kind: heading, text: "@W2a" }
                - { kind: text, color: green, text: "●" }
            - { kind: small, text: "@W2b", gap: xs }
            - kind: row
              gap: l
              blocks:
                - { kind: heading, text: "@W2e" }
                - { kind: text, color: red, text: "●" }
            - { kind: small, text: "@W2f", gap: xs }
            - kind: row
              gap: l
              blocks:
                - { kind: small, color: green, text: { en: "● open", ar: "● متاح" } }
                - { kind: small, color: red, text: { en: "● full", ar: "● مكتمل" } }
    answer: [words]
    misconceptions:
      - id: MC-P10-052
        when: [brighter, legend]
        feedback:
          en: "Bigger dots and a key are still only color. Someone who can't tell red from green still can't tell which dot is which. Add words."
          ar: "النقاط الأكبر والـ Legend ما زالت لونًا فقط. ومن لا يميّز الأحمر من الأخضر ما زال لا يعرف أي نقطة هي أيّها. أضف كلمات."
    hints:
      - { en: "Picture the page without colour. What tells open from full?", ar: "تخيّل الصفحة بلا ألوان. ما الذي يميّز المتاح من الممتلئ؟" }
      - { en: "A key at the bottom still needs colour to match. What says it directly?", ar: "الدليل في الأسفل ما زال يحتاج اللون للمطابقة. ما الذي يقولها مباشرة؟" }
    correct:
      en: "Words carry the meaning; color helps."
      ar: "الكلمات تحمل المعنى؛ واللون يساعد."
    explain:
      en: "With a word in each chip, the status works for everyone. The color can stay as a second signal that helps people scan."
      ar: "مع كلمة في كل علامة، تصل الحالة إلى الجميع. ويمكن أن يبقى اللون إشارة ثانية تساعد الناس على المسح السريع."

  - id: S03
    type: card
    part: concept
    icons: [eye, ok, target, warn]
    title: { en: "One color, one job", ar: "لون واحد، وظيفة واحدة" }
    body:
      en: "Color is great for drawing attention and reinforcing meaning, but some people can't tell certain colors apart.\n\n- **Never color alone:** pair it with words, an icon or a shape. Test by viewing the screen in grayscale: if the meaning disappears, it depended on color.\n- **Link color for links:** if purple means \"you can tap this\", don't use it for plain text.\n- **Status colors stay status:** if red means error or full, don't use it to decorate a price.\n\nWhen each color has one job, people learn it quickly and trust it."
      ar: "اللون ممتاز للفت الانتباه وتقوية المعنى، لكن بعض الناس لا يميّزون ألوانًا معيّنة.\n\n- **لا تعتمد على اللون وحده:** أضف إليه كلمات أو أيقونة أو شكلًا. واختبر ذلك بعرض الشاشة بالأبيض والأسود (Grayscale): إذا اختفى المعنى، فقد كان يعتمد على اللون.\n- **لون الروابط للروابط:** إذا كان البنفسجي يعني «يمكنك الضغط هنا»، فلا تستخدمه لنص عادي.\n- **ألوان الحالة للحالة:** إذا كان الأحمر يعني خطأ أو مكتمل، فلا تزيّن به السعر.\n\nحين يكون لكل لون وظيفة واحدة، يتعلّمه الناس بسرعة ويثقون به."

  - id: S04
    type: tune
    skill: SK-P10-U03-07
    part: guided
    rules: [R06, R13]
    value:
      en: "Links (NN/g): never show text in your chosen link color unless it's a link; people tap it and lose trust in real links."
      ar: "الروابط (NN/g): لا تعرض أي نص بلون الروابط إلا إذا كان رابطًا؛ فالناس يضغطونه ويفقدون الثقة في الروابط الحقيقية."
    ref: { url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/", quote: "Never show text in your chosen link colors" }
    scenario:
      en: "In this app, purple text means a link. On the \"Before you come\" page, the section headings are also purple, but tapping them does nothing."
      ar: "في هذا التطبيق، النص البنفسجي يعني رابطًا. وفي صفحة «قبل أن تأتي»، عناوين الأقسام بنفسجية أيضًا، لكن الضغط عليها لا يفعل شيئًا."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &heads
        - { kind: heading, color: brand, text: { en: "What to bring", ar: "ماذا تُحضر" } }
        - { kind: text, text: { en: "Pencil and paper. No laptop needed.", ar: "قلم وورق. لا تحتاج إلى Laptop." }, gap: xs }
        - { kind: heading, color: brand, text: { en: "How to find the room", ar: "كيف تصل إلى القاعة" }, gap: m }
        - { kind: text, text: { en: "Lift to floor 1, Room 2.", ar: "المصعد إلى الطابق 1، القاعة 2." }, gap: xs }
        - { kind: link, text: { en: "Open the map", ar: "افتح الخريطة" }, gap: xs }
    options:
      - id: black
        text: { en: "Headings in near-black; purple stays only on the map link", ar: "العناوين بلون قريب من الأسود؛ ويبقى البنفسجي على رابط الخريطة فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: { en: "What to bring", ar: "ماذا تُحضر" } }
            - { kind: text, text: { en: "Pencil and paper. No laptop needed.", ar: "قلم وورق. لا تحتاج إلى Laptop." }, gap: xs }
            - { kind: heading, text: { en: "How to find the room", ar: "كيف تصل إلى القاعة" }, gap: m }
            - { kind: text, text: { en: "Lift to floor 1, Room 2.", ar: "المصعد إلى الطابق 1، القاعة 2." }, gap: xs }
            - { kind: link, text: { en: "Open the map", ar: "افتح الخريطة" }, gap: xs }
      - id: underline
        text: { en: "Keep the purple headings and underline them so they look finished", ar: "أبقِ العناوين البنفسجية وضع تحتها خطًا حتى تبدو مكتملة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: link, px: 17, weight: bold, text: { en: "What to bring", ar: "ماذا تُحضر" } }
            - { kind: text, text: { en: "Pencil and paper. No laptop needed.", ar: "قلم وورق. لا تحتاج إلى Laptop." }, gap: xs }
            - { kind: link, px: 17, weight: bold, text: { en: "How to find the room", ar: "كيف تصل إلى القاعة" }, gap: m }
            - { kind: text, text: { en: "Lift to floor 1, Room 2.", ar: "المصعد إلى الطابق 1، القاعة 2." }, gap: xs }
            - { kind: link, text: { en: "Open the map", ar: "افتح الخريطة" }, gap: xs }
      - id: keep
        text: { en: "Keep them; purple headings match the brand", ar: "أبقِها؛ فالعناوين البنفسجية تناسب لون العلامة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks: *heads
    answer: [black]
    misconceptions:
      - id: MC-P10-054
        when: [underline, keep]
        feedback:
          en: "Purple already means \"tap here\" in this app. Purple headings, underlined or not, invite taps that do nothing, and make people doubt the real map link."
          ar: "البنفسجي يعني «اضغط هنا» في هذا التطبيق. والعناوين البنفسجية، بخط تحتها أو بدونه، تدعو إلى ضغطات لا تفعل شيئًا، وتجعل الناس يشكّون في رابط الخريطة الحقيقي."
    hints:
      - { en: "In this app, what does purple text promise?", ar: "في هذا التطبيق، بماذا يعد النص البنفسجي؟" }
      - { en: "People tap the headings and nothing happens. Where should purple stay?", ar: "يضغط الناس على العناوين فلا يحدث شيء. أين يجب أن يبقى اللون البنفسجي؟" }
    correct:
      en: "Purple only where you can tap."
      ar: "البنفسجي فقط حيث يمكنك الضغط."
    explain:
      en: "A link color is a promise: tap this and something happens. Keep it for links and buttons, and headings stand out through size and weight instead."
      ar: "لون الرابط وعد: اضغط هنا وسيحدث شيء. احتفظ به للروابط والأزرار، ولتبرز العناوين بالحجم والسُمك بدلًا منه."

  - id: S05
    type: tune
    skill: SK-P10-U03-07
    part: guided
    rules: [R06, R15]
    value:
      en: "Color consistency (NN/g): if you use red as a warning color on one screen, it should not mean something different elsewhere."
      ar: "ثبات الألوان (NN/g): إذا استخدمت الأحمر كلون تحذير في شاشة، فلا يجب أن يعني شيئًا مختلفًا في مكان آخر."
    ref: { url: "https://www.nngroup.com/articles/color-enhance-design/", quote: "If you use red as a warning color on one screen" }
    scenario:
      en: "In this app, red means full, error or a problem. To make the price \"pop\", a designer set it in bold red."
      ar: "في هذا التطبيق، الأحمر يعني مكتمل أو خطأ أو مشكلة. وليبرز السعر، كتبه أحد المصمّمين بالأحمر وبخط Bold."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks: &redprice
        - { kind: heading, text: "@W2e" }
        - { kind: meta, text: "@W2f", gap: xs }
        - { kind: meta, weight: bold, color: red, text: "@W2g", gap: xs }
        - { kind: button, text: "@W2h", gap: m }
    options:
      - id: keep
        text: { en: "Keep the red; it gets the price noticed", ar: "أبقِ الأحمر؛ فهو يلفت النظر إلى السعر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks: *redprice
      - id: green
        text: { en: "Make the price green instead, so it feels positive", ar: "اجعل السعر أخضر بدلًا من ذلك، حتى يبدو إيجابيًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: "@W2e" }
            - { kind: meta, text: "@W2f", gap: xs }
            - { kind: meta, weight: bold, color: green, text: "@W2g", gap: xs }
            - { kind: button, text: "@W2h", gap: m }
      - id: plain
        text: { en: "Show the price in near-black, like the date", ar: "اعرض السعر بلون قريب من الأسود، مثل التاريخ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: "@W2e" }
            - { kind: meta, text: "@W2f", gap: xs }
            - { kind: meta, text: "@W2g", gap: xs }
            - { kind: button, text: "@W2h", gap: m }
    answer: [plain]
    misconceptions:
      - id: MC-P10-055
        when: [keep, green]
        feedback:
          en: "Red and green already mean status here: full or open, error or OK. A red price looks like a problem; a green one looks like a discount or \"available\". A plain fact gets plain text."
          ar: "الأحمر والأخضر يعنيان الحالة هنا: مكتمل أو متاح، خطأ أو صحيح. السعر الأحمر يبدو مشكلة، والأخضر يبدو خصمًا أو «متاحًا». والمعلومة العادية تُكتب بنص عادي."
    hints:
      - { en: "What does red mean everywhere else in this app?", ar: "ماذا يعني الأحمر في كل مكان آخر في هذا التطبيق؟" }
      - { en: "Is the price a problem or a warning, or just a fact?", ar: "هل السعر مشكلة أو تحذير، أم مجرد معلومة؟" }
    correct:
      en: "A plain fact in plain text."
      ar: "معلومة عادية بنص عادي."
    explain:
      en: "Status colors are worth protecting. Each time red is used just for decoration, it means a little less when there's a real problem."
      ar: "ألوان الحالة تستحق الحماية. فكل مرة يُستخدم فيها الأحمر للزينة فقط، يقلّ معناه قليلًا حين توجد مشكلة حقيقية."

  - id: S06
    type: compare
    skill: SK-P10-U03-06
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02: color isn't the problem, color alone is. NN/g: use additional cues with color. Here words carry the status, and color adds fast scanning."
      ar: "مقارنة مع الخطوة 2: المشكلة ليست في اللون، بل في اللون وحده. NN/g: استخدم إشارات إضافية مع اللون. هنا تحمل الكلمات الحالة، ويضيف اللون سرعة في المسح."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "use additional cues (such as strokes, patterns) to communicate important information" }
    scenario:
      en: "The full list has 20 sessions. People scroll it looking for one that's open."
      ar: "القائمة الكاملة فيها 20 جلسة. ويمرّر الناس فيها بحثًا عن جلسة متاحة."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: small, text: { en: "17 November · Open", ar: "17 نوفمبر · متاح" }, gap: xs }
          - { kind: heading, text: "@W2e", gap: m }
          - { kind: small, text: { en: "18 November · Full", ar: "18 نوفمبر · مكتمل" }, gap: xs }
          - { kind: heading, text: { en: "Test With Five People", ar: "اختبر مع خمسة أشخاص" }, gap: m }
          - { kind: small, text: { en: "20 November · Open", ar: "20 نوفمبر · متاح" }, gap: xs }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@W2a" }
          - { kind: chip, text: { en: "17 November · Open", ar: "17 نوفمبر · متاح" }, gap: xs }
          - { kind: heading, text: "@W2e", gap: m }
          - { kind: chip, tone: bad, text: { en: "18 November · Full", ar: "18 نوفمبر · مكتمل" }, gap: xs }
          - { kind: heading, text: { en: "Test With Five People", ar: "اختبر مع خمسة أشخاص" }, gap: m }
          - { kind: chip, text: { en: "20 November · Open", ar: "20 نوفمبر · متاح" }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: friendly, text: { en: "Colorful pages feel friendlier", ar: "الصفحات الملوّنة تبدو أكثر ودًّا" } }
        - { id: extra, text: { en: "The words work for everyone, and the color adds a quick way to scan", ar: "الكلمات تصل إلى الجميع، واللون يضيف طريقة سريعة للمسح" } }
        - { id: color, text: { en: "Color is the clearest way to show a status", ar: "اللون هو أوضح طريقة لعرض الحالة" } }
      answer: [extra]
      misconceptions:
        - id: MC-P10-052
          when: [color]
          feedback:
            en: "Color alone was the problem with the dots. B works because the words are there; the color is a bonus."
            ar: "اللون وحده كان مشكلة النقاط. وB تنجح لأن الكلمات موجودة؛ واللون إضافة."
        - id: MC-P10-050
          when: [friendly]
          feedback:
            en: "It's not about mood. The color has a job here: it lets people spot the open sessions in a long list."
            ar: "الأمر لا يتعلّق بالشعور. للّون وظيفة هنا: يجعل الناس يلاحظون الجلسات المتاحة في قائمة طويلة."
    misconceptions:
      - id: MC-P10-050
        when: [a]
        feedback:
          en: "A works for everyone, but every line looks the same, so people must read all 20. Color is fine as an extra signal next to words."
          ar: "A تصل إلى الجميع، لكن كل سطر يبدو مثل غيره، فعلى الناس قراءة الـ 20 كلها. واللون مناسب كإشارة إضافية بجانب الكلمات."
    hints:
      - { en: "Imagine someone who can't tell red from green scrolling the 20 sessions.", ar: "تخيّل شخصًا لا يميّز الأحمر من الأخضر وهو يمرّر بين 20 جلسة." }
      - { en: "Which version still shows open and full without colour?", ar: "أي نسخة ما زالت توضّح المتاح والممتلئ بدون ألوان؟" }
    correct:
      en: "Words first, color as a helper."
      ar: "الكلمات أولًا، واللون مساعد."
    explain:
      en: "The rule is \"never color alone\", not \"no color\". With the words in place, a consistent green and red make a long list much faster to scan."
      ar: "القاعدة هي «لا تعتمد على اللون وحده»، لا «لا تستخدم اللون». ومع وجود الكلمات، يجعل الأخضر والأحمر الثابتان القائمة الطويلة أسرع كثيرًا في المسح."

  - id: S07
    type: tune
    skill: SK-P10-U03-06
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Grayscale test (NN/g): turn the design into grayscale and see if you can still understand it; a color change alone is not enough to signal a change."
      ar: "حالة جديدة. اختبار الأبيض والأسود (NN/g): حوّل التصميم إلى Grayscale وانظر هل ما زلت تفهمه؛ فتغيير اللون وحده لا يكفي للإشارة إلى تغيير."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "Turn your design into grayscale and see if you can correctly understand the design." }
    scenario:
      en: "Youssef's bus now leaves from platform 6, not 4. The ticket shows the change only by turning the platform number orange. Below, every version is shown in grayscale, as a test."
      ar: "حافلة يوسف تغادر الآن من الرصيف 6، لا 4. والتذكرة تُظهر التغيير فقط بتحويل رقم الرصيف إلى البرتقالي. وتحت، كل نسخة معروضة بالأبيض والأسود كاختبار."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now, in grayscale", ar: "الآن، بالأبيض والأسود" }
      gray: true
      blocks: &ticket
        - { kind: title, text: "@B1b" }
        - { kind: meta, text: { en: "Departs 07:30", ar: "المغادرة 07:30" }, gap: s }
        - { kind: meta, color: orange, text: { en: "Platform 6", ar: "رصيف 6" }, gap: xs }
        - { kind: meta, text: "@B1d", gap: xs }
        - { kind: button, text: "@B1e", gap: m }
    options:
      - id: brighter
        text: { en: "A brighter orange, and make the number bigger", ar: "برتقالي أكثر لمعانًا، مع تكبير الرقم" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: title, text: "@B1b" }
            - { kind: meta, text: { en: "Departs 07:30", ar: "المغادرة 07:30" }, gap: s }
            - { kind: meta, px: 18, color: orange, text: { en: "Platform 6", ar: "رصيف 6" }, gap: xs }
            - { kind: meta, text: "@B1d", gap: xs }
            - { kind: button, text: "@B1e", gap: m }
      - id: words
        text: { en: "Add a line in words: \"⚠ Platform changed: now 6 (was 4)\"", ar: "أضف سطرًا بالكلمات: «⚠ تغيّر الرصيف: الآن 6 (كان 4)»" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: title, text: "@B1b" }
            - { kind: meta, text: { en: "Departs 07:30", ar: "المغادرة 07:30" }, gap: s }
            - { kind: meta, weight: bold, color: orange, text: { en: "⚠ Platform changed: now 6 (was 4)", ar: "⚠ تغيّر الرصيف: الآن 6 (كان 4)" }, gap: xs }
            - { kind: meta, text: "@B1d", gap: xs }
            - { kind: button, text: "@B1e", gap: m }
      - id: box
        text: { en: "Put the orange platform number in an orange box", ar: "ضع رقم الرصيف البرتقالي داخل صندوق برتقالي" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: title, text: "@B1b" }
            - { kind: meta, text: { en: "Departs 07:30", ar: "المغادرة 07:30" }, gap: s }
            - { kind: chip, tone: warn, text: { en: "Platform 6", ar: "رصيف 6" }, gap: xs }
            - { kind: meta, text: "@B1d", gap: xs }
            - { kind: button, text: "@B1e", gap: m }
    answer: [words]
    misconceptions:
      - id: MC-P10-052
        when: [brighter, box]
        feedback:
          en: "Look at it in grayscale: nothing says the platform changed. Youssef might go to platform 4 out of habit. Say what changed in words."
          ar: "انظر إليها بالأبيض والأسود: لا شيء يقول إن الرصيف تغيّر. وقد يذهب يوسف إلى الرصيف 4 بحكم العادة. قل ما تغيّر بالكلمات."
    hints:
      - { en: "Look at the grayscale versions. Can you see that the platform changed?", ar: "انظر إلى النسخ الرمادية. هل ترى أن الرصيف تغيّر؟" }
      - { en: "A brighter orange or a box still relies on colour. What doesn't?", ar: "البرتقالي الأفتح أو المربع ما زالا يعتمدان على اللون. ما الذي لا يعتمد عليه؟" }
    correct:
      en: "Say the change in words."
      ar: "قل التغيير بالكلمات."
    explain:
      en: "A change is news, and color can't say what happened. In grayscale only the version with words still works, for people who can't see the color and for screen readers too."
      ar: "التغيير خبر، واللون لا يستطيع أن يقول ما حدث. وبالأبيض والأسود، لا تنجح إلا النسخة التي فيها كلمات، لمن لا يرى اللون ولقارئ الشاشة (Screen reader) أيضًا."

  - id: S08
    type: card
    part: recap
    icons: [eye, ok, target, warn]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Never color alone:** replaced dots with words, and kept color as a helper.\n- **Grayscale test:** checked that a change still shows without color.\n- **Link color:** kept it for things you can tap.\n- **Status colors:** kept red and green for status, not decoration.\n\nNext: a skill check on a new page."
      ar: "- **لا تعتمد على اللون وحده:** استبدلت النقاط بكلمات، وأبقيت اللون مساعدًا.\n- **اختبار الأبيض والأسود:** تأكّدت أن التغيير يظهر دون لون.\n- **لون الروابط:** احتفظت به لما يمكن الضغط عليه.\n- **ألوان الحالة:** أبقيت الأحمر والأخضر للحالة، لا للزينة.\n\nالتالي: اختبار مهارة على صفحة جديدة."
