            - { kind: text, px: 11, color: faint, text: *ay_2, gap: xs }
            - { kind: text, px: 11, color: faint, text: *ay_3, gap: xs }
            - { kind: text, px: 11, color: faint, text: *ay_4, gap: xs }
            - { kind: text, px: 11, color: faint, text: *ay_5, gap: xs }
            - { kind: text, px: 11, color: faint, text: *ay_6, gap: xs }
            - { kind: text, px: 11, color: faint, text: *ay_7, gap: xs }
            - { kind: button, text: *ay_b, gap: m }
      - id: cut
        text: { en: "Show the three key facts in readable text, and move the rest behind \"All details\"", ar: "اعرض المعلومات الثلاث المهمة بنص مقروء، وانقل الباقي خلف «كل التفاصيل»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *ay_t }
            - { kind: text, text: *ay_1, gap: s }
            - { kind: text, text: *ay_2, gap: xs }
            - { kind: text, text: *ay_3, gap: xs }
            - { kind: link, text: { en: "All details", ar: "كل التفاصيل" }, gap: s }
            - { kind: button, text: *ay_b, gap: m }
      - id: keep
        text: { en: "Keep it; pale details are what make the page calm", ar: "أبقِها؛ فالتفاصيل الباهتة هي ما يجعل الصفحة هادئة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: title, text: *ay_t }
            - { kind: small, color: faint, text: *ay_1, gap: s }
            - { kind: small, color: faint, text: *ay_2, gap: xs }
            - { kind: small, color: faint, text: *ay_3, gap: xs }
            - { kind: small, color: faint, text: *ay_4, gap: xs }
            - { kind: small, color: faint, text: *ay_5, gap: xs }
            - { kind: small, color: faint, text: *ay_6, gap: xs }
            - { kind: small, color: faint, text: *ay_7, gap: xs }
            - { kind: button, text: *ay_b, gap: m }
    answer: [cut]
    misconceptions:
      - id: MC-P10-044
        when: [fainter, keep]
        feedback:
          en: "Fading hides the clutter, and the facts Ayman needs along with it. The page is still just as full. Remove what most people don't need, and keep the rest readable."
          ar: "الإبهات يُخفي الزحام، ويُخفي معه المعلومات التي يحتاجها أيمن. وما زالت الصفحة ممتلئة كما هي. احذف ما لا يحتاجه معظم الناس، وأبقِ الباقي مقروءًا."
    correct:
      en: "Right. Fewer lines, and every one readable."
      ar: "صحيح. أسطر أقل، وكلها مقروءة."
    explain:
      en: "The page felt busy because it showed too much, not because the text was too dark. Cutting to three facts calms it down, and the full list is one tap away."
      ar: "بدت الصفحة مزدحمة لأنها تعرض الكثير، لا لأن النص كان داكنًا جدًا. الاكتفاء بثلاث معلومات يهدّئها، والقائمة الكاملة على بُعد ضغطة واحدة."

  # SK-P10-U03-05: know when large text may use 3:1
  - id: S09
    type: tune
    skill: SK-P10-U03-05
    part: retest
    value:
      en: "Re-test, large text (NN/g, citing WCAG): text that is at least 18pt (24px), or 14pt (about 19px) bold, may use 3:1. A 14px bold label doesn't qualify; a 28px heading does."
      ar: "إعادة اختبار، النص الكبير (NN/g نقلًا عن WCAG): النص الذي لا يقل عن 18pt (أي 24px)، أو 14pt (نحو 19px) بخط Bold، يكفيه 3:1. تسمية بحجم 14px بخط Bold لا تنطبق عليها القاعدة؛ وعنوان بحجم 28px تنطبق عليه."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "For text that is at least 18pt or 14pt bold, the ratio is a bit more generous at 3:1." }
    scenario:
      en: "Nour is going to a book fair. On its page, the 28px heading and a 14px bold note about the entry time are both light grey (3.0:1)."
      ar: "تذهب نور إلى معرض كتاب. في صفحته، العنوان بحجم 28px وملاحظة بحجم 14px بخط Bold عن موعد الدخول، كلاهما رمادي فاتح (3.0:1)."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: text, px: 28, color: pale, text: &nr_h { en: "Book fair", ar: "معرض الكتاب" } }
        - { kind: text, px: 14, weight: bold, color: pale, text: &nr_n { en: "Last entry at 21:00", ar: "آخر دخول الساعة 21:00" }, gap: s }
        - { kind: text, text: &nr_b { en: "Hall 3, Fair Grounds. Free for students.", ar: "القاعة 3، أرض المعارض. مجاني للطلاب." }, gap: s }
    options:
      - id: note
        text: { en: "Darken the 14px note; the 28px heading can stay light grey", ar: "اجعل الملاحظة بحجم 14px أغمق؛ والعنوان بحجم 28px يمكن أن يبقى رماديًا فاتحًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 28, color: pale, text: *nr_h }
            - { kind: text, px: 14, weight: bold, text: *nr_n, gap: s }
            - { kind: text, text: *nr_b, gap: s }
      - id: heading
        text: { en: "Darken the heading; keep the note light grey because it's bold", ar: "اجعل العنوان أغمق؛ وأبقِ الملاحظة رمادية فاتحة لأنها Bold" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 28, text: *nr_h }
            - { kind: text, px: 14, weight: bold, color: pale, text: *nr_n, gap: s }
            - { kind: text, text: *nr_b, gap: s }
      - id: none
        text: { en: "Keep both; anything big or bold can use 3.0:1", ar: "أبقِ الاثنين؛ فأي نص كبير أو Bold يكفيه 3.0:1" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 28, color: pale, text: *nr_h }
            - { kind: text, px: 14, weight: bold, color: pale, text: *nr_n, gap: s }
            - { kind: text, text: *nr_b, gap: s }
    answer: [note]
    misconceptions:
      - id: MC-P10-048
        when: [heading, none]
        feedback:
          en: "Bold doesn't make 14px text large. Large starts at 24px, or about 19px bold. The note still needs 4.5:1, while the 28px heading may stay at 3:1."
          ar: "الخط الـ Bold لا يجعل نصًا بحجم 14px كبيرًا. يبدأ النص الكبير من 24px، أو نحو 19px بخط Bold. فما زالت الملاحظة تحتاج 4.5:1، بينما يمكن أن يبقى العنوان بحجم 28px على 3:1."
    correct:
      en: "Right. The small note gets darker; the big heading may stay."
      ar: "صحيح. الملاحظة الصغيرة تصبح أغمق؛ والعنوان الكبير يمكن أن يبقى."
    explain:
      en: "Large letters stay readable at a lower contrast, so 28px may use 3:1. At 14px, even bold, the letters are too thin and small for that, and the entry time is something Nour must not miss."
      ar: "الحروف الكبيرة تبقى مقروءة بتباين أقل، لذا يكفي 3:1 لحجم 28px. أما بحجم 14px، حتى بالخط الـ Bold، فالحروف أصغر وأرفع من ذلك، وموعد الدخول شيء يجب ألا يفوت نور."

  - id: S10
    type: tune
    skill: SK-P10-U03-05
    part: retest
    value:
      en: "Re-test, large text (NN/g, citing WCAG): 3:1 is enough only from 18pt (24px), or 14pt (about 19px) bold. Here the grey is fixed, so the size has to reach the large-text line."
      ar: "إعادة اختبار، النص الكبير (NN/g نقلًا عن WCAG): تكفي 3:1 فقط من 18pt (أي 24px)، أو 14pt (نحو 19px) بخط Bold. هنا الرمادي ثابت، فيجب أن يصل الحجم إلى حدّ النص الكبير."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "For text that is at least 18pt or 14pt bold, the ratio is a bit more generous at 3:1." }
    scenario:
      en: "Hoda is designing a sale banner. The brand team insists the line \"Ends Friday\" stays light grey (3.0:1). She can change only its size and weight."
      ar: "تصمّم هدى لافتة تخفيضات. يصرّ فريق العلامة على أن يبقى سطر «ينتهي الجمعة» رماديًا فاتحًا (3.0:1). ويمكنها تغيير حجمه وثقله فقط."
    prompt:
      en: "Try each size. Which one should ship?"
      ar: "جرّب كل حجم. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: text, px: 26, weight: bold, text: &hd_h { en: "30% off all shoes", ar: "خصم 30% على كل الأحذية" } }
        - { kind: text, px: 14, color: pale, text: &hd_e { en: "Ends Friday", ar: "ينتهي الجمعة" }, gap: s }
        - { kind: button, text: &hd_b { en: "Shop the sale", ar: "تسوّق التخفيضات" }, gap: m }
    options:
      - id: b16
        text: { en: "16px bold", ar: "16px بخط Bold" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 26, weight: bold, text: *hd_h }
            - { kind: text, px: 16, weight: bold, color: pale, text: *hd_e, gap: s }
            - { kind: button, text: *hd_b, gap: m }
      - id: r20
        text: { en: "20px regular", ar: "20px بخط عادي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 26, weight: bold, text: *hd_h }
            - { kind: text, px: 20, color: pale, text: *hd_e, gap: s }
            - { kind: button, text: *hd_b, gap: m }
      - id: b20
        text: { en: "20px bold", ar: "20px بخط Bold" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, px: 26, weight: bold, text: *hd_h }
            - { kind: text, px: 20, weight: bold, color: pale, text: *hd_e, gap: s }
            - { kind: button, text: *hd_b, gap: m }
    answer: [b20]
    misconceptions:
      - id: MC-P10-048
        when: [b16, r20]
        feedback:
          en: "Neither reaches large text. Bold text counts from about 19px, and regular text from 24px. 16px bold and 20px regular both still need 4.5:1."
          ar: "لا يصل أيّ منهما إلى النص الكبير. النص الـ Bold يُحسب كبيرًا من نحو 19px، والعادي من 24px. فـ 16px بخط Bold و20px بخط عادي كلاهما ما زال يحتاج 4.5:1."
    correct:
      en: "Right. 20px bold is large text, so 3:1 is enough."
      ar: "صحيح. 20px بخط Bold نص كبير، فيكفيه 3:1."
    explain:
      en: "The 3:1 allowance depends on both size and weight together: 24px and up, or about 19px and up when bold. If the color can't change, the size has to cross that line."
      ar: "يعتمد السماح بـ 3:1 على الحجم والثقل معًا: 24px فما فوق، أو نحو 19px فما فوق بخط Bold. وإذا كان اللون لا يتغيّر، فيجب أن يتجاوز الحجم هذا الحدّ."

  # SK-P10-U03-06: never rely on color alone
  - id: S11
    type: tune
    skill: SK-P10-U03-06
    part: retest
    value:
      en: "Re-test, color alone (NN/g): use additional cues to communicate important information. A red border alone fails people who can't tell red apart; a message and an icon don't."
      ar: "إعادة اختبار، اللون وحده (NN/g): استخدم إشارات إضافية لتوصيل المعلومات المهمة. الإطار الأحمر وحده لا يصل إلى من لا يميّزون الأحمر؛ أما الرسالة والأيقونة فتصلان."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "use additional cues (such as strokes, patterns) to communicate important information" }
    scenario:
      en: "Magdy is signing up for a gym. When he taps Create account, the phone field turns red, and nothing else changes. Magdy can't tell red from grey well."
      ar: "يسجّل مجدي في نادٍ رياضي. عندما يضغط «أنشئ الحساب»، يتحوّل حقل الهاتف إلى الأحمر، ولا يتغيّر أي شيء آخر. ومجدي لا يميّز الأحمر من الرمادي جيدًا."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: field, label: &mg_n { en: "Full name", ar: "الاسم بالكامل" }, filled: true, text: &mg_nv { en: "Magdy Samir", ar: "مجدي سمير" } }
        - { kind: field, label: &mg_p { en: "Phone", ar: "الهاتف" }, filled: true, text: "0101234567", tone: bad, gap: s }
        - { kind: button, text: &mg_b { en: "Create account", ar: "أنشئ الحساب" }, gap: m }
    options:
      - id: thicker
        text: { en: "Make the red border thicker and brighter", ar: "اجعل الإطار الأحمر أعرض وأكثر لمعانًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *mg_n, filled: true, text: *mg_nv }
            - { kind: field, label: { en: "Phone", ar: "الهاتف" }, filled: true, text: "0101234567", tone: bad, focus: true, gap: s }
            - { kind: button, text: *mg_b, gap: m }
      - id: message
        text: { en: "Keep the red, and add a message with an icon under the field", ar: "أبقِ الأحمر، وأضف رسالة مع أيقونة تحت الحقل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *mg_n, filled: true, text: *mg_nv }
            - { kind: field, label: *mg_p, filled: true, text: "0101234567", tone: bad, error: { en: "⚠ Phone numbers have 11 digits. Check the number.", ar: "⚠ رقم الهاتف 11 رقمًا. راجع الرقم." }, gap: s }
            - { kind: button, text: *mg_b, gap: m }
      - id: key
        text: { en: "Add a line at the top: \"Fields in red have a problem\"", ar: "أضف سطرًا في الأعلى: «الحقول الحمراء بها مشكلة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, color: red, text: { en: "Fields in red have a problem", ar: "الحقول الحمراء بها مشكلة" } }
            - { kind: field, label: *mg_n, filled: true, text: *mg_nv, gap: s }
            - { kind: field, label: *mg_p, filled: true, text: "0101234567", tone: bad, gap: s }
            - { kind: button, text: *mg_b, gap: m }
    answer: [message]
    misconceptions:
      - id: MC-P10-052
        when: [thicker, key]
        feedback:
          en: "Both still depend on Magdy seeing which field is red. A thicker border or a color key doesn't help if red and grey look alike to him. Say what's wrong, next to the field."
          ar: "كلاهما ما زال يعتمد على أن يرى مجدي أي حقل أحمر. الإطار الأعرض أو مفتاح الألوان لا يفيد إذا بدا له الأحمر والرمادي متشابهين. قل ما المشكلة، بجانب الحقل."
    correct:
      en: "Right. The message works with or without color."
      ar: "صحيح. الرسالة تعمل باللون أو دونه."
    explain:
      en: "Red is still useful as an extra signal. The words and the icon carry the meaning, so Magdy knows which field is wrong and how to fix it, whatever colors he sees."
      ar: "ما زال الأحمر مفيدًا كإشارة إضافية. الكلمات والأيقونة تحمل المعنى، فيعرف مجدي أي حقل خطأ وكيف يصلحه، أيًّا كانت الألوان التي يراها."

  - id: S12
    type: tune
    skill: SK-P10-U03-06
    part: retest
    value:
      en: "Re-test, grayscale check (NN/g): turn your design into grayscale and see if you can still understand it. Brighter or different colors fail the same check."
      ar: "إعادة اختبار، فحص الأبيض والأسود (NN/g): حوّل التصميم إلى الأبيض والأسود وانظر هل ما زلت تفهمه. الألوان الأكثر لمعانًا أو المختلفة تفشل في الفحص نفسه."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "Turn your design into grayscale and see if you can correctly understand the design." }
    scenario:
      en: "Osama books a tennis court for the weekend. Free times are green and taken times are red. Each result below is shown in grayscale, as a check for people who can't see the colors."
      ar: "يحجز أسامة ملعب تنس لعطلة نهاية الأسبوع. الأوقات المتاحة خضراء والمحجوزة حمراء. كل نتيجة بالأسفل معروضة بالأبيض والأسود، كفحص لمن لا يرون الألوان."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now, in grayscale", ar: "الآن، بالأبيض والأسود" }
      gray: true
      blocks:
        - { kind: heading, text: &os_h { en: "Court 2 · Friday", ar: "الملعب 2 · الجمعة" } }
        - { kind: text, color: green, text: &os_1 { en: "16:00", ar: "16:00" }, gap: s }
        - { kind: text, color: red, text: &os_2 { en: "17:00", ar: "17:00" }, gap: xs }
        - { kind: text, color: red, text: &os_3 { en: "18:00", ar: "18:00" }, gap: xs }
        - { kind: text, color: green, text: &os_4 { en: "19:00", ar: "19:00" }, gap: xs }
    options:
      - id: words
        text: { en: "Add \"Free\" or \"Taken\" next to each time, and grey out taken times", ar: "أضف «متاح» أو «محجوز» بجانب كل وقت، واجعل الأوقات المحجوزة باهتة" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: heading, text: *os_h }
            - kind: row
              gap: s
              blocks:
                - { kind: text, color: green, text: *os_1 }
                - { kind: chip, text: { en: "Free", ar: "متاح" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: text, color: faint, text: *os_2 }
                - { kind: chip, tone: bad, text: { en: "Taken", ar: "محجوز" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: text, color: faint, text: *os_3 }
                - { kind: chip, tone: bad, text: { en: "Taken", ar: "محجوز" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: text, color: green, text: *os_4 }
                - { kind: chip, text: { en: "Free", ar: "متاح" } }
      - id: brighter
        text: { en: "Use a brighter green and red, in bold", ar: "استخدم أخضر وأحمر أكثر لمعانًا، بخط Bold" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: heading, text: *os_h }
            - { kind: text, weight: bold, color: green, text: *os_1, gap: s }
            - { kind: text, weight: bold, color: red, text: *os_2, gap: xs }
            - { kind: text, weight: bold, color: red, text: *os_3, gap: xs }
            - { kind: text, weight: bold, color: green, text: *os_4, gap: xs }
      - id: orange
        text: { en: "Change taken times from red to orange", ar: "غيّر الأوقات المحجوزة من الأحمر إلى البرتقالي" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          gray: true
          blocks:
            - { kind: heading, text: *os_h }
            - { kind: text, color: green, text: *os_1, gap: s }
            - { kind: text, color: orange, text: *os_2, gap: xs }
            - { kind: text, color: orange, text: *os_3, gap: xs }
            - { kind: text, color: green, text: *os_4, gap: xs }
    answer: [words]
    misconceptions:
      - id: MC-P10-052
        when: [brighter, orange]
        feedback:
          en: "In grayscale the times still look the same, so Osama can't tell free from taken. Any fix that only changes color fails this check."
          ar: "بالأبيض والأسود ما زالت الأوقات متشابهة، فلا يستطيع أسامة التمييز بين المتاح والمحجوز. أي حل يغيّر اللون فقط يفشل في هذا الفحص."
    correct:
      en: "Right. Even in grayscale, every time says what it is."
      ar: "صحيح. حتى بالأبيض والأسود، كل وقت يقول ما هو."
    explain:
      en: "Words and a faded look carry the meaning, so the screen still works without color. The green and red can stay as an extra hint for those who see them."
      ar: "الكلمات والشكل الباهت تحمل المعنى، فتعمل الشاشة دون لون. ويمكن أن يبقى الأخضر والأحمر كتلميح إضافي لمن يراهما."

  # SK-P10-U03-07: keep color meanings consistent
  - id: S13
    type: tune
    skill: SK-P10-U03-07
    part: retest
    value:
      en: "Re-test, link color (NN/g): never show text in your chosen link colors unless it's a link. Underlining non-links makes the false promise stronger."
      ar: "إعادة اختبار، لون الروابط (NN/g): لا تعرض نصًا بلون الروابط إلا إذا كان رابطًا. وضع خط تحت ما ليس رابطًا يجعل الوعد الكاذب أقوى."
    ref: { url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/", quote: "Never show text in your chosen link colors" }
    scenario:
      en: "In a news app, purple text means a link. On each article card, the writer's name is purple too, but tapping it does nothing. Readers keep tapping it."
      ar: "في تطبيق أخبار، النص البنفسجي يعني رابطًا. وفي كل بطاقة مقال، اسم الكاتب بنفسجي أيضًا، لكن الضغط عليه لا يفعل شيئًا. والقرّاء يظلّون يضغطونه."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &nw_h { en: "New metro line opens in May", ar: "خط مترو جديد يفتتح في مايو" } }
        - { kind: meta, color: brand, text: &nw_w { en: "By Salma Hassan", ar: "بقلم سلمى حسن" }, gap: xs }
        - { kind: text, text: &nw_x { en: "The line will link the east and the airport in 25 minutes.", ar: "سيربط الخط الشرق بالمطار في 25 دقيقة." }, gap: s }
        - { kind: link, text: &nw_r { en: "Read more", ar: "اقرأ المزيد" }, gap: xs }
    options:
      - id: underline
        text: { en: "Underline the writer's name too, so it matches the link style", ar: "ضع خطًا تحت اسم الكاتب أيضًا، ليطابق شكل الروابط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *nw_h }
            - { kind: link, px: 13, text: *nw_w, gap: xs }
            - { kind: text, text: *nw_x, gap: s }
            - { kind: link, text: *nw_r, gap: xs }
      - id: keep
        text: { en: "Keep it purple; the writer's name deserves the brand color", ar: "أبقِه بنفسجيًا؛ فاسم الكاتب يستحق لون العلامة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *nw_h }
            - { kind: meta, color: brand, text: *nw_w, gap: xs }
            - { kind: text, text: *nw_x, gap: s }
            - { kind: link, text: *nw_r, gap: xs }
      - id: grey
        text: { en: "Writer's name in grey; purple stays only on Read more", ar: "اسم الكاتب بالرمادي؛ ويبقى البنفسجي على «اقرأ المزيد» فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *nw_h }
            - { kind: meta, text: *nw_w, gap: xs }
            - { kind: text, text: *nw_x, gap: s }
            - { kind: link, text: *nw_r, gap: xs }
    answer: [grey]
    misconceptions:
      - id: MC-P10-054
        when: [underline, keep]
        feedback:
          en: "Purple already means \"tap here\" in this app. A purple name, underlined or not, keeps inviting taps that do nothing, and readers start to doubt the real links."
          ar: "البنفسجي يعني «اضغط هنا» في هذا التطبيق. اسم بنفسجي، بخط تحته أو دونه، يظلّ يدعو إلى ضغطات لا تفعل شيئًا، فيبدأ القرّاء بالشكّ في الروابط الحقيقية."
    correct:
      en: "Right. Purple only where you can tap."
      ar: "صحيح. البنفسجي فقط حيث يمكنك الضغط."
    explain:
      en: "A link color is a promise that something happens on tap. Keeping it for links means readers can trust it every time they see it."
      ar: "لون الروابط وعد بأن شيئًا سيحدث عند الضغط. حفظه للروابط يعني أن القرّاء يثقون به كلما رأوه."

  - id: S14
    type: tune
    skill: SK-P10-U03-07
    part: retest
    value:
      en: "Re-test, color meaning (NN/g): if you use red as a warning color on one screen, it shouldn't mean something else on another. A red or green badge borrows a status meaning it doesn't have."
      ar: "إعادة اختبار، معنى اللون (NN/g): إذا استخدمت الأحمر كلون تحذير في شاشة، فلا يجب أن يعني شيئًا آخر في شاشة أخرى. الشارة الحمراء أو الخضراء تستعير معنى حالة ليس لها."
    ref: { url: "https://www.nngroup.com/articles/color-enhance-design/", quote: "If you use red as a warning color on one screen" }
    scenario:
      en: "In Ghada's banking app, red means a failed payment or a problem, and green means money received. A new savings feature has a red \"New\" badge to catch the eye."
      ar: "في تطبيق البنك الخاص بغادة، الأحمر يعني دفعة فاشلة أو مشكلة، والأخضر يعني أموالًا وصلت. وميزة الادّخار الجديدة عليها شارة «جديد» حمراء لتلفت النظر."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &gh_h { en: "Your accounts", ar: "حساباتك" } }
        - { kind: meta, text: &gh_a { en: "Current account · 8,240 EGP", ar: "الحساب الجاري · 8,240 جنيهًا" }, gap: s }
        - kind: row
          gap: m
          blocks:
            - { kind: text, weight: bold, text: &gh_s { en: "Savings goals", ar: "أهداف الادّخار" } }
            - { kind: chip, tone: bad, text: &gh_n { en: "New", ar: "جديد" } }
        - { kind: small, text: &gh_d { en: "Put money aside for something you want.", ar: "ضع مالًا جانبًا لشيء تريده." }, gap: xs }
    options:
      - id: keep
        text: { en: "Keep the red badge; it's the best way to catch the eye", ar: "أبقِ الشارة الحمراء؛ فهي أفضل طريقة للفت النظر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *gh_h }
            - { kind: meta, text: *gh_a, gap: s }
            - kind: row
              gap: m
              blocks:
                - { kind: text, weight: bold, text: *gh_s }
                - { kind: chip, tone: bad, text: *gh_n }
            - { kind: small, text: *gh_d, gap: xs }
      - id: plain
        text: { en: "Make the badge a plain grey chip", ar: "اجعل الشارة علامة رمادية عادية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *gh_h }
            - { kind: meta, text: *gh_a, gap: s }
            - kind: row
              gap: m
              blocks:
                - { kind: text, weight: bold, text: *gh_s }
                - { kind: chip, tone: off, text: *gh_n }
            - { kind: small, text: *gh_d, gap: xs }
      - id: green
        text: { en: "Make the badge text green, a friendlier color", ar: "اجعل نص الشارة أخضر، لون ألطف" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *gh_h }
            - { kind: meta, text: *gh_a, gap: s }
            - kind: row
              gap: m
              blocks:
                - { kind: text, weight: bold, text: *gh_s }
                - { kind: small, weight: bold, color: green, text: *gh_n }
            - { kind: small, text: *gh_d, gap: xs }
    answer: [plain]
    misconceptions:
      - id: MC-P10-055
        when: [keep, green]
        feedback:
          en: "Red and green already mean status in this app: a problem, or money received. A red badge looks like an error, and a green one like a payment. \"New\" isn't a status."
          ar: "الأحمر والأخضر يعنيان حالة في هذا التطبيق: مشكلة، أو أموال وصلت. الشارة الحمراء تبدو كخطأ، والخضراء كدفعة. و«جديد» ليس حالة."
    correct:
      en: "Right. A plain badge for a plain fact."
      ar: "صحيح. شارة عادية لمعلومة عادية."
    explain:
      en: "Status colors are worth protecting in a banking app. Each time red is used just to catch the eye, Ghada learns to ignore it, and it means less when a payment really fails."
      ar: "ألوان الحالة تستحق الحماية في تطبيق بنكي. كلما استُخدم الأحمر للفت النظر فقط، تتعلّم غادة أن تتجاهله، فيقلّ معناه عندما تفشل دفعة فعلًا."
