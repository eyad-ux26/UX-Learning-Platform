      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: title, text: &ay_t { en: "Steel kettle · 950 EGP", ar: "غلاية ستانلس · 950 جنيهًا" } }
        - { kind: small, color: faint, text: &ay_1 { en: "1.7 litres", ar: "سعة 1.7 لتر" }, gap: s }
        - { kind: small, color: faint, text: &ay_2 { en: "2200 W", ar: "قدرة 2200 واط" }, gap: xs }
        - { kind: small, color: faint, text: &ay_3 { en: "2-year warranty", ar: "ضمان سنتين" }, gap: xs }
        - { kind: small, color: faint, text: &ay_4 { en: "Model KT-17S", ar: "موديل KT-17S" }, gap: xs }
        - { kind: small, color: faint, text: &ay_5 { en: "Cable 75 cm", ar: "طول السلك 75 سم" }, gap: xs }
        - { kind: small, color: faint, text: &ay_6 { en: "Weight 1.1 kg", ar: "الوزن 1.1 كجم" }, gap: xs }
        - { kind: small, color: faint, text: &ay_7 { en: "Box: kettle, base, manual", ar: "في العلبة: الغلاية والقاعدة والدليل" }, gap: xs }
        - { kind: button, text: &ay_b { en: "Add to cart", ar: "أضِف إلى السلّة" }, gap: m }
    options:
