id: P01-U04
free: false
title:
  en: "Errors people can fix"
  ar: "أخطاء يستطيع الناس إصلاحها"
skill:
  en: "Show each form error where the problem is, in words that say how to fix it, at the right moment, without losing what people typed."
  ar: "اعرض كل خطأ في النموذج حيث توجد المشكلة، بكلمات تقول كيف يُصلح، في الوقت المناسب، دون أن يضيع ما كتبه الناس."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P01-U04-01
    title: { en: "Show the error next to its field", ar: "اعرض الخطأ بجوار حقله" }
    can_do: { en: "Place each error message right by the field it is about, where people look while fixing it.", ar: "ضع كل رسالة خطأ بجوار الحقل الذي تخصّه مباشرة، حيث ينظر الناس أثناء الإصلاح." }
  - id: SK-P01-U04-02
    title: { en: "Say what's wrong and how to fix it", ar: "قل ما الخطأ وكيف يُصلح" }
    can_do: { en: "Write errors in plain words that name the problem and the fix, with no codes or jargon.", ar: "اكتب الأخطاء بكلمات بسيطة تذكر المشكلة والحل، بلا أكواد أو مصطلحات تقنية." }
  - id: SK-P01-U04-03
    title: { en: "Don't blame the person", ar: "لا تلُم الشخص" }
    can_do: { en: "Phrase errors politely, about the input, not about what the person did wrong.", ar: "صُغ الأخطاء بأدب، عن المُدخل نفسه، لا عن خطأ ارتكبه الشخص." }
  - id: SK-P01-U04-04
    title: { en: "Wait until people leave the field", ar: "انتظر حتى يغادر الناس الحقل" }
    can_do: { en: "Check a field when the person moves on, not while they are still typing.", ar: "تحقّق من الحقل حين ينتقل الشخص لغيره، لا وهو ما زال يكتب." }
  - id: SK-P01-U04-05
    title: { en: "Keep what people typed", ar: "احتفظ بما كتبه الناس" }
    can_do: { en: "Keep every answer, including the wrong one, so people fix it instead of starting over.", ar: "احتفظ بكل إجابة، حتى الخاطئة، ليُصلحها الناس بدل أن يبدؤوا من جديد." }
  - id: SK-P01-U04-06
    title: { en: "Signal errors with more than color", ar: "أظهر الخطأ بأكثر من اللون" }
    can_do: { en: "Mark an error with words and an icon too, not only a red border.", ar: "علّم الخطأ بكلمات وأيقونة أيضًا، لا بإطار أحمر فقط." }
  - id: SK-P01-U04-07
    title: { en: "Sum up errors at the top of long forms", ar: "اجمع الأخطاء أعلى النماذج الطويلة" }
    can_do: { en: "On a long form, add a short list of errors at the top, and keep each error by its field too.", ar: "في النموذج الطويل، أضف قائمة قصيرة بالأخطاء في الأعلى، مع إبقاء كل خطأ بجوار حقله أيضًا." }
