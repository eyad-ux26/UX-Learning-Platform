id: P01-U02-L03
mode: lesson
minutes: 8
title:
  en: "Short lists show, long lists search"
  ar: "القوائم القصيرة تُعرض، والطويلة يُبحث فيها"
review_labels:
  MC-P01-014: { en: "Order options the way people expect", ar: "رتّب الخيارات كما يتوقّع الناس" }
  MC-P01-015: { en: "Don't preselect a guess for a personal answer", ar: "لا تحدّد تخمينًا مسبقًا لإجابة شخصية" }
  MC-P01-016: { en: "Long lists need a way to search", ar: "القوائم الطويلة تحتاج طريقة للبحث" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "27 radio buttons", ar: "27 زر راديو" }
    body:
      en: "Abdelrahman lives in Ismailia. The library form lists all 27 governorates as radio buttons, alphabetically.\n\nHere's the first screen of three."
      ar: "يعيش عبد الرحمن في الإسماعيلية. ونموذج المكتبة يعرض المحافظات الـ27 كلها كأزرار راديو، بالترتيب الأبجدي.\n\nهذه أول شاشة من ثلاث."
    mock:
      blocks:
        - { kind: heading, text: "@F5gov" }
        - { kind: radio, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: xs }
        - { kind: radio, text: { en: "Aswan", ar: "أسوان" }, gap: xs }
        - { kind: radio, text: { en: "Asyut", ar: "أسيوط" }, gap: xs }
        - { kind: radio, text: { en: "Beheira", ar: "البحيرة" }, gap: xs }
        - { kind: radio, text: { en: "Beni Suef", ar: "بني سويف" }, gap: xs }
        - { kind: radio, text: { en: "Cairo", ar: "القاهرة" }, gap: xs }
        - { kind: radio, text: { en: "Dakahlia", ar: "الدقهلية" }, gap: xs }
        - { kind: radio, text: { en: "Damietta", ar: "دمياط" }, gap: xs }
        - { kind: small, text: { en: "… 19 more below", ar: "… 19 أخرى بالأسفل" }, gap: s }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Which control gets Abdelrahman to Ismailia in the fewest steps?"
      ar: "أي عنصر تحكّم يوصل عبد الرحمن إلى الإسماعيلية بأقل خطوات؟"
    options:
      - { id: select, text: { en: "A dropdown", ar: "قائمة منسدلة" } }
      - { id: search, text: { en: "A field where he types \"Ism\" and picks Ismailia", ar: "حقل يكتب فيه «إسم» ويختار الإسماعيلية" } }
      - { id: keep, text: { en: "Keep the radio buttons; scrolling is fine", ar: "أبقِ أزرار الراديو؛ التمرير لا بأس به" } }
    reveal:
      en: "A dropdown hides the scroll instead of removing it. Typing a few letters gets him there fastest. For long lists, let people search."
      ar: "القائمة المنسدلة تخفي التمرير بدل أن تزيله. وكتابة بضعة حروف توصله أسرع. في القوائم الطويلة، دع الناس يبحثون."

  - id: S03
    type: card
    part: concept
    title: { en: "Match the control to the length", ar: "طابق عنصر التحكّم مع طول القائمة" }
    body:
      en: "Once you know it's one answer or many, look at how many options there are.\n\n- **A few options** (about five or fewer): show them all as radio buttons or checkboxes. People compare at a glance.\n- **A medium list** (around 6 to 15): a dropdown is fine, in a sensible order.\n- **A long list** (dozens or more): let people type to filter, and still let them scroll.\n\nOrder matters too: times in time order, sizes from small to large, places alphabetically in the reader's language.\n\nAnd be careful with defaults. Preselecting the most common answer for something personal, like a governorate, means some people submit a wrong answer without noticing."
      ar: "بعد أن تعرف إن كانت الإجابة واحدة أم عدة، انظر إلى عدد الخيارات.\n\n- **خيارات قليلة** (نحو خمسة أو أقل): اعرضها كلها كأزرار راديو أو مربعات اختيار. فيقارنها الناس بنظرة.\n- **قائمة متوسطة** (نحو 6 إلى 15): القائمة المنسدلة مناسبة، بترتيب منطقي.\n- **قائمة طويلة** (عشرات أو أكثر): دع الناس يكتبون للتصفية، مع إمكانية التمرير.\n\nوالترتيب مهم أيضًا: الأوقات بترتيبها الزمني، والمقاسات من الصغير إلى الكبير، والأماكن أبجديًا بلغة القارئ.\n\nواحذر من القيم الافتراضية. تحديد الإجابة الأكثر شيوعًا مسبقًا لشيء شخصي، مثل المحافظة، يعني أن بعض الناس سيرسلون إجابة خاطئة دون أن ينتبهوا."

  - id: S04
    type: sort
    part: guided
    confidence: true
    rules: [R06, R15, U39]
    prompt:
      en: "Which control fits each list?"
      ar: "أي عنصر تحكّم يناسب كل قائمة؟"
    items:
      - { id: card, text: { en: "Card type: Adult or Child (2)", ar: "نوع البطاقة: بالغ أو طفل (2)" } }
      - { id: gov, text: { en: "Governorate (27)", ar: "المحافظة (27)" } }
      - { id: spec, text: { en: "Specialty (12)", ar: "التخصص (12)" } }
      - { id: country, text: { en: "Country (195)", ar: "الدولة (195)" } }
      - { id: slots, text: { en: "Open time slots today (4)", ar: "المواعيد المتاحة اليوم (4)" } }
    buckets:
      - { id: show, label: { en: "Show them all", ar: "اعرضها كلها" } }
      - { id: drop, label: { en: "Dropdown", ar: "قائمة منسدلة" } }
      - { id: search, label: { en: "Type to search", ar: "اكتب للبحث" } }
    answer:
      show: [card, slots]
      drop: [spec]
      search: [gov, country]
    also_ok:
      - answer: { show: [card, slots], drop: [], search: [spec, gov, country] }
        feedback:
          en: "Also fine: search works for 12 options too, especially if people know the name."
          ar: "صحيح أيضًا: البحث يصلح لـ12 خيارًا أيضًا، خاصة إن كان الناس يعرفون الاسم."
    misconceptions:
      - id: MC-P01-010
        when: { item: card, bucket: drop }
        feedback:
          en: "Two options in a dropdown means a tap just to see the other one. Show both."
          ar: "خياران في قائمة منسدلة يعني ضغطة لمجرد رؤية الآخر. اعرض الاثنين."
      - id: MC-P01-016
        when: { item: country, bucket: drop }
        feedback:
          en: "195 countries in a dropdown is a long scroll on a phone. Let people type a few letters."
          ar: "195 دولة في قائمة منسدلة تمرير طويل على الهاتف. دع الناس يكتبون بضعة حروف."
    hints:
      - { en: "Count first: a few, a dozen, or dozens?", ar: "عُدّ أولًا: قليل، أم نحو دزينة، أم عشرات؟" }
    correct:
      en: "Show a few, drop down a dozen, search dozens."
      ar: "اعرض القليل، واستخدم القائمة المنسدلة للدزينة، والبحث للعشرات."
    explain:
      en: "The numbers are a guide, not a law. Long labels or small screens can move the line."
      ar: "الأرقام دليل، لا قانون. التسميات الطويلة أو الشاشات الصغيرة قد تغيّر الحد."

  - id: S05
    type: compare
    part: guided
    rules: [R06, U39]
    prompt:
      en: "Which governorate control gets Abdelrahman to Ismailia in fewer steps?"
      ar: "أي عنصر تحكّم للمحافظة يوصل عبد الرحمن إلى الإسماعيلية بخطوات أقل؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: "@F5gov" }
          - { kind: radio, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: xs }
          - { kind: radio, text: { en: "Aswan", ar: "أسوان" }, gap: xs }
          - { kind: radio, text: { en: "Asyut", ar: "أسيوط" }, gap: xs }
          - { kind: small, text: { en: "… 24 more", ar: "… 24 أخرى" }, gap: xs }
    b:
      mock:
        blocks:
          - { kind: field, focus: true, filled: true, label: "@F5gov", text: { en: "Ism", ar: "إسم" } }
          - kind: group
            gap: xs
            blocks:
              - { kind: text, text: { en: "Ismailia", ar: "الإسماعيلية" } }
    answer: b
    misconceptions:
      - id: MC-P01-016
        when: [a]
        feedback:
          en: "A shows every option, which helps with five, not with 27. He'd scroll past 15 governorates to reach Ismailia."
          ar: "A تعرض كل الخيارات، وهذا يفيد مع خمسة، لا مع 27. سيمرّر عبر 15 محافظة ليصل إلى الإسماعيلية."
    hints:
      - { en: "He knows the name. What's the quickest way to use that?", ar: "هو يعرف الاسم. ما أسرع طريقة للاستفادة من ذلك؟" }
    correct:
      en: "Three letters, one tap."
      ar: "ثلاثة حروف، وضغطة واحدة."
    explain:
      en: "Match both spellings people use, like \"Ismailia\" and \"Ismailiya\", and Arabic with or without \"ال\"."
      ar: "طابق كل الكتابات التي يستخدمها الناس، مثل «Ismailia» و«Ismailiya»، والعربية مع «ال» أو بدونها."

  - id: S06
    type: choose
    part: guided
    rules: [R11, U39]
    prompt:
      en: "The clinic's time slot dropdown lists: 10:00, 11:30, 16:00, 9:00. What's wrong?"
      ar: "قائمة المواعيد في العيادة تعرض: 10:00، 11:30، 16:00، 9:00. ما الخطأ؟"
    options:
      - { id: order, text: { en: "Times should be in time order: 9:00 first", ar: "يجب أن تكون الأوقات بترتيبها الزمني: 9:00 أولًا" } }
      - { id: nothing, text: { en: "Nothing; it's sorted like text", ar: "لا شيء؛ إنها مرتّبة كنص" } }
      - { id: show, text: { en: "It should be a text field", ar: "يجب أن يكون حقل نص" } }
    answer: [order]
    misconceptions:
      - id: MC-P01-014
        when: [nothing]
        feedback:
          en: "Sorted as text, 9 comes after 1. People scan times in time order and may never see 9:00."
          ar: "عند الترتيب كنص، يأتي 9 بعد 1. والناس يتصفّحون الأوقات بترتيبها الزمني، وقد لا يرون 9:00 أبدًا."
    hints:
      - { en: "How do people expect times to be ordered?", ar: "كيف يتوقّع الناس ترتيب الأوقات؟" }
    correct:
      en: "Times in time order; 09:00 written with two digits so it lines up."
      ar: "الأوقات بترتيبها الزمني؛ و09:00 برقمين حتى تتحاذى."
    explain:
      en: "With only four slots, showing them as buttons would be even better: Nour sees the morning and afternoon options at once."
      ar: "مع أربعة مواعيد فقط، عرضها كأزرار أفضل: ترى نور خيارات الصباح والمساء معًا."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, U39]
    prompt:
      en: "Most library members live in Cairo, but Abdelrahman lives in Ismailia. Which field makes sure he picks his own governorate?"
      ar: "أغلب أعضاء المكتبة يعيشون في القاهرة، لكن عبد الرحمن يعيش في الإسماعيلية. أي حقل يضمن أن يختار محافظته بنفسه؟"
    a:
      mock:
        blocks:
          - { kind: select, label: "@F5gov", text: { en: "Cairo", ar: "القاهرة" }, filled: true }
    b:
      mock:
        blocks:
          - { kind: select, label: "@F5gov", text: { en: "Choose your governorate", ar: "اختر محافظتك" } }
    answer: b
    misconceptions:
      - id: MC-P01-015
        when: [a]
        feedback:
          en: "Abdelrahman scrolls past a field that already looks filled in, and his card is registered in Cairo. A guessed default turns into a silent error."
          ar: "يمرّ عبد الرحمن على حقل يبدو ممتلئًا أصلًا، فتُسجَّل بطاقته في القاهرة. والقيمة الافتراضية المخمّنة تتحوّل إلى خطأ صامت."
    correct:
      en: "B makes him choose, so the answer is really his."
      ar: "B تجعله يختار، فتكون الإجابة إجابته فعلًا."
    explain:
      en: "Defaults are great when they're safe and easy to see, like quantity 1. For personal facts, let people choose."
      ar: "القيم الافتراضية رائعة حين تكون آمنة وسهلة الرؤية، مثل الكمية 1. أما المعلومات الشخصية فدع الناس يختارونها."

  - id: S08
    type: fix
    part: independent
    rules: [R07, U39]
    prompt:
      en: "Tamer's delivery form has an \"Area\" dropdown with 120 Cairo neighbourhoods in no particular order. Which fix lets him find his area fastest?"
      ar: "نموذج توصيل تامر فيه قائمة منسدلة «المنطقة» بها 120 حيًا في القاهرة بلا ترتيب معيّن. أي إصلاح يجعله يجد منطقته أسرع؟"
    mock:
      blocks:
        - { kind: select, label: { en: "Area", ar: "المنطقة" }, text: { en: "Choose your area", ar: "اختر منطقتك" } }
    options:
      - { id: search, text: { en: "Let him type to filter, and sort the list alphabetically", ar: "دعه يكتب للتصفية، ورتّب القائمة أبجديًا" } }
      - { id: sort, text: { en: "Just sort the dropdown alphabetically", ar: "رتّب القائمة المنسدلة أبجديًا فقط" } }
      - { id: radios, text: { en: "Show all 120 as radio buttons", ar: "اعرض الـ120 كلها كأزرار راديو" } }
    answer: [search]
    misconceptions:
      - id: MC-P01-016
        when: [sort]
        feedback:
          en: "Sorting helps, but he'd still scroll through dozens of names on a small screen."
          ar: "الترتيب يساعد، لكنه سيظل يمرّر عبر عشرات الأسماء على شاشة صغيرة."
      - id: MC-P01-016
        when: [radios]
        feedback:
          en: "120 radio buttons is many screens of scrolling."
          ar: "120 زر راديو تعني شاشات كثيرة من التمرير."
    hints:
      - { en: "Tamer knows the name of his area.", ar: "تامر يعرف اسم منطقته." }
    correct:
      en: "Typing \"Maa\" finds Maadi in a second; the sorted list still helps people who browse."
      ar: "كتابة «معا» تجد المعادي في ثانية؛ والقائمة المرتّبة تساعد من يتصفّحون."
    explain:
      en: "Both together: search for speed, a sensible order for browsing."
      ar: "الاثنان معًا: البحث للسرعة، والترتيب المنطقي للتصفّح."

  - id: S09
    type: choose
    part: independent
    confidence: true
    multi: true
    rules: [R07, U39]
    prompt:
      en: "Nour picks one specialty from 12. Which controls would work well? Pick all that apply."
      ar: "تختار نور تخصصًا واحدًا من 12. أي عناصر التحكّم تعمل جيدًا؟ اختر كل ما ينطبق."
    options:
      - { id: drop, text: { en: "A dropdown, sorted alphabetically", ar: "قائمة منسدلة مرتّبة أبجديًا" } }
      - { id: search, text: { en: "A field she can type in to filter", ar: "حقل تكتب فيه للتصفية" } }
      - { id: checks, text: { en: "12 checkboxes", ar: "12 مربع اختيار" } }
    answer: [drop, search]
    misconceptions:
      - id: MC-P01-009
        when: [checks]
        feedback:
          en: "One appointment has one specialty. Checkboxes would let her tick several."
          ar: "الموعد الواحد له تخصص واحد. ومربعات الاختيار ستسمح لها بتحديد عدة تخصصات."
    hints:
      - { en: "First: one answer or many? Then: how long is the list?", ar: "أولًا: إجابة واحدة أم عدة؟ ثم: كم طول القائمة؟" }
    correct:
      en: "One answer from a medium list: a sorted dropdown or a search both work."
      ar: "إجابة واحدة من قائمة متوسطة: القائمة المنسدلة المرتّبة أو البحث، كلاهما يعمل."
    explain:
      en: "Two questions, in order: how many can be true, then how many options there are."
      ar: "سؤالان بالترتيب: كم إجابة يمكن أن تكون صحيحة، ثم كم عدد الخيارات."

  - id: S10
    type: card
    part: recap
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- A few options: show them. A dozen: a dropdown is fine. Dozens: let people search.\n- Order lists the way people expect: times by time, places alphabetically in their language.\n- Don't preselect a guess for something personal.\n- Decide one-or-many first, then the length.\n\nNext: the unit skill check."
      ar: "- خيارات قليلة: اعرضها. دزينة: القائمة المنسدلة مناسبة. عشرات: دع الناس يبحثون.\n- رتّب القوائم كما يتوقّع الناس: الأوقات زمنيًا، والأماكن أبجديًا بلغتهم.\n- لا تحدّد تخمينًا مسبقًا لشيء شخصي.\n- قرّر واحدة أم عدة أولًا، ثم انظر إلى الطول.\n\nالدرس التالي: اختبار مهارة الوحدة."
