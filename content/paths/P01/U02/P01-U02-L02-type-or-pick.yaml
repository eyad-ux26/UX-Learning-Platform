id: P01-U02-L02
mode: lesson
minutes: 8
title:
  en: "Type it or pick it?"
  ar: "تكتبها أم تختارها؟"
review_labels:
  MC-P01-012: { en: "Let people type what they know by heart", ar: "دع الناس يكتبون ما يحفظونه" }
  MC-P01-013: { en: "Let people pick what only the system knows", ar: "دع الناس يختارون ما لا يعرفه إلا النظام" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Back to 1991", ar: "العودة إلى 1991" }
    body:
      en: "The clinic asks for Nour's date of birth. Tapping the field opens a calendar on today's month, October 2026.\n\nNour was born in March 1991."
      ar: "تسأل العيادة عن تاريخ ميلاد نور. والضغط على الحقل يفتح تقويمًا على الشهر الحالي، أكتوبر 2026.\n\nونور مولودة في مارس 1991."
    mock:
      blocks:
        - { kind: select, label: "@F5dob", text: { en: "Choose a date", ar: "اختر تاريخًا" }, gap: s }
        - kind: group
          gap: s
          blocks:
            - { kind: heading, text: { en: "◀  October 2026  ▶", ar: "◀  أكتوبر 2026  ▶" } }
            - { kind: small, text: { en: "Su  Mo  Tu  We  Th  Fr  Sa", ar: "أحد  اثنين  ثلاثاء  أربعاء  خميس  جمعة  سبت" }, gap: s }
            - { kind: small, text: { en: "…", ar: "…" }, gap: xs }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "How many taps on ◀ to reach March 1991?"
      ar: "كم ضغطة على ◀ للوصول إلى مارس 1991؟"
    options:
      - { id: few, text: { en: "About 35", ar: "نحو 35" } }
      - { id: hundreds, text: { en: "About 400", ar: "نحو 400" } }
      - { id: year, text: { en: "She'll find a year picker", ar: "ستجد منتقيًا للسنة" } }
    reveal:
      en: "About 427, unless she spots a hidden year picker. She knows the date by heart. Typing it would take seconds."
      ar: "نحو 427، إلا إذا اكتشفت منتقيًا مخفيًا للسنة. هي تحفظ التاريخ عن ظهر قلب. وكتابته تستغرق ثواني."

  - id: S03
    type: card
    part: concept
    title: { en: "Who knows the answer: the person or the system?", ar: "من يعرف الإجابة: الشخص أم النظام؟" }
    body:
      en: "- **The person knows it by heart:** let them type. Date of birth, phone number, name, ID number. Open the right keyboard, like a number pad for numbers. For a date of birth, three short fields (Day, Month, Year) are quick and clear.\n- **Only the system knows the options:** let them pick. Available appointment days, open time slots, the clinic's specialties. People can't type what they can't know.\n- **A calendar helps** when the day of the week matters, like booking next Tuesday. It hurts for dates far away that people already know.\n- **Small numbers**, like a quantity from 1 to 5, work well with − and + buttons."
      ar: "- **الشخص يحفظ الإجابة:** دعه يكتبها. تاريخ الميلاد، ورقم الهاتف، والاسم، ورقم البطاقة. وافتح لوحة المفاتيح المناسبة، مثل لوحة الأرقام للأرقام. ولتاريخ الميلاد، ثلاثة حقول قصيرة (اليوم، الشهر، السنة) سريعة وواضحة.\n- **النظام وحده يعرف الخيارات:** دعه يختار. أيام المواعيد المتاحة، والأوقات الفارغة، وتخصصات العيادة. لا يستطيع الناس كتابة ما لا يمكنهم معرفته.\n- **التقويم يساعد** حين يهم يوم الأسبوع، مثل الحجز يوم الثلاثاء القادم. ويضرّ مع التواريخ البعيدة التي يعرفها الناس أصلًا.\n- **الأعداد الصغيرة**، مثل كمية من 1 إلى 5، تعمل جيدًا مع زرّي − و+."

  - id: S04
    type: sort
    part: guided
    confidence: true
    rules: [R06, R15, U39]
    prompt:
      en: "Should Nour type it or pick it?"
      ar: "هل تكتبها نور أم تختارها؟"
    items:
      - { id: dob, text: "@F5dob" }
      - { id: date, text: "@F5date" }
      - { id: phone, text: "@F1phone" }
      - { id: slot, text: { en: "Time slot", ar: "الموعد المتاح" } }
      - { id: spec, text: "@F5spec" }
      - { id: nid, text: "@F1nid" }
    buckets:
      - { id: type, label: { en: "Type it", ar: "تكتبها" } }
      - { id: pick, label: { en: "Pick it", ar: "تختارها" } }
    answer:
      type: [dob, phone, nid]
      pick: [date, slot, spec]
    misconceptions:
      - id: MC-P01-013
        when: { item: date, bucket: type }
        feedback:
          en: "Nour doesn't know which days the doctor is free. If she types a date, it may well be unavailable."
          ar: "نور لا تعرف الأيام التي يكون فيها الطبيب متاحًا. وإذا كتبت تاريخًا، فقد يكون غير متاح."
      - id: MC-P01-012
        when: { item: dob, bucket: pick }
        feedback:
          en: "She knows her birthday by heart. Picking it from a calendar is the 427-tap problem."
          ar: "هي تحفظ تاريخ ميلادها. واختياره من تقويم هو مشكلة الـ427 ضغطة."
    hints:
      - { en: "Does Nour already know the answer, or does only the clinic know the options?", ar: "هل تعرف نور الإجابة أصلًا، أم أن العيادة وحدها تعرف الخيارات؟" }
    correct:
      en: "What she knows, she types. What the clinic knows, she picks."
      ar: "ما تعرفه، تكتبه. وما تعرفه العيادة، تختاره."
    explain:
      en: "Same question for every field: who holds the answer?"
      ar: "السؤال نفسه لكل حقل: من يملك الإجابة؟"

  - id: S05
    type: compare
    part: guided
    rules: [R06, U39]
    prompt:
      en: "Which date of birth field needs fewer taps for Nour?"
      ar: "أي حقل لتاريخ الميلاد يحتاج من نور نقرات أقل؟"
    a:
      mock:
        blocks:
          - { kind: select, label: "@F5dob", text: { en: "Choose a date", ar: "اختر تاريخًا" } }
          - { kind: small, text: { en: "Opens a calendar on today's month", ar: "يفتح تقويمًا على الشهر الحالي" }, gap: xs }
    b:
      mock:
        blocks:
          - { kind: heading, text: "@F5dob" }
          - kind: row
            gap: s
            blocks:
              - { kind: field, label: { en: "Day", ar: "اليوم" }, text: "14", filled: true }
              - { kind: field, label: { en: "Month", ar: "الشهر" }, text: "3", filled: true }
              - { kind: field, label: { en: "Year", ar: "السنة" }, text: "1991", filled: true }
    answer: b
    misconceptions:
      - id: MC-P01-012
        when: [a]
        feedback:
          en: "The calendar makes Nour scroll back 35 years for a date she could type in seconds."
          ar: "التقويم يجعل نور ترجع 35 سنة لتاريخ يمكنها كتابته في ثوانٍ."
    hints:
      - { en: "She knows all three numbers already.", ar: "هي تعرف الأرقام الثلاثة أصلًا." }
    correct:
      en: "Three short fields with a number pad: done in seconds."
      ar: "ثلاثة حقول قصيرة مع لوحة أرقام: تنتهي في ثوانٍ."
    explain:
      en: "Labelling each box Day, Month, Year also avoids the 03/04 confusion between date formats."
      ar: "تسمية كل خانة باليوم والشهر والسنة تتجنّب أيضًا الالتباس بين صيغ التاريخ مثل 03/04."

  - id: S06
    type: choose
    part: guided
    rules: [R11, U39, U26]
    prompt:
      en: "Now the appointment date. The doctor is only in on some days. Which control?"
      ar: "الآن تاريخ الموعد. الطبيب موجود في بعض الأيام فقط. أي عنصر تحكّم؟"
    options:
      - { id: calendar, text: { en: "A calendar that shows available days, with full days clearly marked", ar: "تقويم يُظهر الأيام المتاحة، مع تعليم الأيام المكتملة بوضوح" } }
      - { id: typed, text: { en: "A text field: DD/MM/YYYY", ar: "حقل نص: يوم/شهر/سنة" } }
      - { id: three, text: { en: "Three fields: Day, Month, Year", ar: "ثلاثة حقول: اليوم، الشهر، السنة" } }
    answer: [calendar]
    misconceptions:
      - id: MC-P01-013
        when: [typed, three]
        feedback:
          en: "Typing works for dates Nour knows. Here she'd be guessing which days are free, and finding out only after an error."
          ar: "الكتابة تصلح للتواريخ التي تعرفها نور. أما هنا فستخمّن الأيام المتاحة، ولن تعرف إلا بعد ظهور خطأ."
    hints:
      - { en: "Who knows which days are available?", ar: "من يعرف الأيام المتاحة؟" }
    correct:
      en: "She sees which days work, and that Tuesday is next week."
      ar: "ترى الأيام المناسبة، وترى أن الثلاثاء في الأسبوع القادم."
    explain:
      en: "Mark full days with a word or symbol, not color alone, and say why they can't be picked."
      ar: "علّم الأيام المكتملة بكلمة أو رمز، لا باللون وحده، ووضّح لماذا لا يمكن اختيارها."

  - id: S07
    type: compare
    part: contrast
    rules: [R11, U39]
    prompt:
      en: "Nour taps the mobile number field. Which keyboard should open?"
      ar: "تضغط نور على حقل رقم الموبايل. أي لوحة مفاتيح يجب أن تفتح؟"
    a:
      mock:
        blocks:
          - { kind: field, focus: true, label: "@F1phone", text: "" }
          - { kind: banner, text: { en: "Q W E R T Y U I O P", ar: "ض ص ث ق ف غ ع ه خ ح" }, gap: m }
    b:
      mock:
        blocks:
          - { kind: field, focus: true, label: "@F1phone", text: "" }
          - { kind: banner, text: { en: "1  2  3  ·  4  5  6  ·  7  8  9  ·  0", ar: "1  2  3  ·  4  5  6  ·  7  8  9  ·  0" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P01-012
        when: [a]
        feedback:
          en: "With a letter keyboard she has to switch to numbers first, every time."
          ar: "مع لوحة الحروف يجب أن تنتقل إلى الأرقام أولًا، في كل مرة."
    correct:
      en: "The number pad: big keys, only what's needed."
      ar: "لوحة الأرقام: مفاتيح كبيرة، وفقط ما يلزم."
    explain:
      en: "In the spec, say which keyboard each field opens. Developers set it with one attribute (inputmode or type=\"tel\")."
      ar: "اذكر في المواصفات أي لوحة مفاتيح يفتحها كل حقل. والمطوّرون يضبطونها بخاصية واحدة (inputmode أو type=\"tel\")."

  - id: S08
    type: choose
    part: independent
    rules: [R07, U39]
    prompt:
      en: "Tamer can order 1 to 10 sandwiches. Most people order 1 or 2. Which control?"
      ar: "يمكن لتامر طلب من 1 إلى 10 ساندويتشات. وأغلب الناس يطلبون 1 أو 2. أي عنصر تحكّم؟"
    options:
      - { id: stepper, text: { en: "− 1 + buttons, starting at 1", ar: "زرّا − 1 +، يبدأ من 1" } }
      - { id: text, text: { en: "An empty text field", ar: "حقل نص فارغ" } }
      - { id: list, text: { en: "A dropdown from 1 to 100", ar: "قائمة منسدلة من 1 إلى 100" } }
    answer: [stepper]
    misconceptions:
      - id: MC-P01-012
        when: [text]
        feedback:
          en: "An empty field makes everyone type, even though almost everyone wants 1."
          ar: "الحقل الفارغ يجعل الجميع يكتبون، مع أن الجميع تقريبًا يريد 1."
      - id: MC-P01-010
        when: [list]
        feedback:
          en: "A hundred options for an answer that's almost always 1 or 2. And the limit is 10."
          ar: "مئة خيار لإجابة تكون غالبًا 1 أو 2. والحد الأقصى 10 أصلًا."
    hints:
      - { en: "What's the most common answer, and how far is it from the start?", ar: "ما الإجابة الأكثر شيوعًا، وكم تبعد عن البداية؟" }
    correct:
      en: "It starts at the common answer, and one tap adds another."
      ar: "يبدأ من الإجابة الشائعة، وضغطة واحدة تضيف واحدًا."
    explain:
      en: "Make the − and + buttons big enough to tap, and stop at 10."
      ar: "اجعل زرّي − و+ كبيرين بما يكفي للضغط، وتوقّف عند 10."

  - id: S09
    type: choose
    part: independent
    confidence: true
    multi: true
    rules: [R07, U39]
    prompt:
      en: "Abdelrahman's library card form. Which should he type? Pick all that apply."
      ar: "نموذج بطاقة مكتبة عبد الرحمن. أيّها يجب أن يكتبه؟ اختر كل ما ينطبق."
    options:
      - { id: name, text: "@F4full" }
      - { id: gov, text: { en: "Governorate (27 options)", ar: "المحافظة (27 خيارًا)" } }
      - { id: nid, text: "@F1nid" }
      - { id: kind, text: { en: "Card type: Adult or Child", ar: "نوع البطاقة: بالغ أو طفل" } }
    answer: [name, nid]
    misconceptions:
      - id: MC-P01-013
        when: [gov, kind]
        feedback:
          en: "Those have a fixed set of answers the library defines. Let him pick, so the spelling always matches."
          ar: "هذه لها مجموعة إجابات ثابتة تحدّدها المكتبة. دعه يختار، حتى تتطابق الكتابة دائمًا."
    hints:
      - { en: "Which have a fixed list of possible answers?", ar: "أيّها له قائمة ثابتة من الإجابات الممكنة؟" }
    correct:
      en: "He types his name and ID; he picks the governorate and card type."
      ar: "يكتب اسمه ورقمه القومي؛ ويختار المحافظة ونوع البطاقة."
    explain:
      en: "27 governorates is a long list. Next lesson: how to make long lists easy."
      ar: "27 محافظة قائمة طويلة. الدرس التالي: كيف تجعل القوائم الطويلة سهلة."

  - id: S10
    type: card
    part: recap
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- What people know by heart, they type. Open the right keyboard.\n- What only the system knows, they pick.\n- Calendars for near dates where the weekday matters; typed fields for known dates like a birthday.\n- Small numbers: − and + buttons starting at the common answer.\n\nNext: short lists and long lists."
      ar: "- ما يحفظه الناس، يكتبونه. وافتح لوحة المفاتيح المناسبة.\n- ما لا يعرفه إلا النظام، يختارونه.\n- التقويم للتواريخ القريبة حين يهم يوم الأسبوع؛ والحقول المكتوبة للتواريخ المعروفة مثل تاريخ الميلاد.\n- الأعداد الصغيرة: زرّا − و+ يبدآن من الإجابة الشائعة.\n\nالدرس التالي: القوائم القصيرة والقوائم الطويلة."
