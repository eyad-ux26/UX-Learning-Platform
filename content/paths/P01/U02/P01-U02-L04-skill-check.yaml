id: P01-U02-L04
mode: check
minutes: 7
title:
  en: "Skill check: pick the right control"
  ar: "اختبار المهارة: اختر عنصر التحكّم المناسب"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Laila's home cleaning booking", ar: "حجز تنظيف منزل ليلى" }
    body:
      en: "Laila lives in Heliopolis. She's booking a cleaning with ironing, on a day the company has a free team. She has a cat, and her building's door code is 0427.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "تعيش ليلى في مصر الجديدة. وهي تحجز تنظيفًا مع كيّ الملابس، في يوم فيه فريق متاح لدى الشركة. ولديها قطة، ورمز باب عمارتها 0427.\n\nهذا اختبار مهارة: دون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      blocks:
        - { kind: title, text: "@F6a" }
        - { kind: heading, text: "@F6addons", gap: m }
        - { kind: check, selected: true, text: "@F6iron", gap: xs }
        - { kind: check, text: "@F6windows", gap: xs }
        - { kind: check, selected: true, text: "@F6none", gap: xs }
        - { kind: field, label: "@F6hours", text: "3", filled: true, gap: m }
        - { kind: select, label: "@F6area", text: "@F6nasr", filled: true, gap: s }
        - { kind: toggle, text: "@F6sms", gap: m }
        - { kind: button, text: "@F6btn", gap: m }

  - id: S02
    type: choose
    part: check
    rules: [R07, U40]
    prompt:
      en: "Laila ticked Ironing, then No add-ons, and both stayed ticked. What should happen when she ticks No add-ons?"
      ar: "حدّدت ليلى كيّ الملابس، ثم «دون إضافات»، وبقي الاثنان محدّدين. ماذا يجب أن يحدث حين تحدّد «دون إضافات»؟"
    options:
      - { id: clear, text: { en: "Ironing is unticked straight away", ar: "يُلغى تحديد كيّ الملابس فورًا" } }
      - { id: error, text: { en: "An error appears when she books", ar: "تظهر رسالة خطأ حين تحجز" } }
      - { id: keep, text: { en: "Both stay; the team will ask her", ar: "يبقى الاثنان؛ وسيسألها الفريق" } }
    answer: [clear]
    misconceptions:
      - id: MC-P01-017
        when: [error, keep]
        feedback:
          en: "\"No add-ons\" and \"Ironing\" can't both be true. The form should clear the conflict the moment it happens."
          ar: "«دون إضافات» و«كيّ الملابس» لا يجتمعان. يجب أن يُزيل النموذج التعارض لحظة حدوثه."
    explain:
      en: "\"None\" clears the others, and ticking an add-on clears \"None\"."
      ar: "«لا شيء» يُلغي الباقي، وتحديد إضافة يُلغي «لا شيء»."

  - id: S03
    type: match
    part: check
    rules: [R06, R07, U39]
    prompt:
      en: "Match each question on Laila's form to the control it needs."
      ar: "طابق كل سؤال في نموذج ليلى مع عنصر التحكّم الذي يحتاجه."
    left:
      - { id: hours, text: { en: "Hours of cleaning (2 to 8, usually 3)", ar: "ساعات التنظيف (من 2 إلى 8، غالبًا 3)" } }
      - { id: code, text: { en: "Building door code, like 0427", ar: "رمز باب العمارة، مثل 0427" } }
      - { id: area, text: { en: "Area (60 neighbourhoods)", ar: "المنطقة (60 حيًا)" } }
      - { id: pets, text: { en: "Pets at home: the team must know either way", ar: "حيوانات أليفة في المنزل: يجب أن يعرف الفريق في الحالتين" } }
    right:
      - { id: stepper, text: { en: "Stepper starting at 3", ar: "أزرار − و+ تبدأ من 3" } }
      - { id: text, text: { en: "Text field with the number pad", ar: "حقل نصي مع لوحة الأرقام" } }
      - { id: search, text: { en: "Search field", ar: "حقل بحث" } }
      - { id: yesno, text: { en: "Yes / No radio buttons", ar: "أزرار راديو نعم / لا" } }
    answer: { hours: stepper, code: text, area: search, pets: yesno }
    misconceptions:
      - id: MC-P01-021
        when: { left: code, right: stepper }
        feedback:
          en: "A door code isn't a quantity. Nobody wants to tap + 427 times, and the leading 0 matters."
          ar: "رمز الباب ليس كمية. لا أحد يريد الضغط على + 427 مرة، والصفر في أوله مهم."
      - id: MC-P01-023
        when: { left: hours, right: text }
        feedback:
          en: "Most people want 3 hours. A stepper already shows it, and one tap changes it."
          ar: "أغلب الناس يريدون 3 ساعات. وأزرار − و+ تعرضها أصلًا، وضغطة واحدة تغيّرها."
      - id: MC-P01-020
        when: { left: pets, right: text }
        feedback:
          en: "The team needs a clear yes or no before they arrive. Ask Yes / No."
          ar: "يحتاج الفريق إلى نعم أو لا واضحة قبل الوصول. اسأل نعم / لا."
    explain:
      en: "Small usual count: stepper. A code: text with digits. Dozens of places: search. A question that must be answered: Yes / No."
      ar: "عدد صغير معتاد: أزرار − و+. رمز: نص من أرقام. عشرات الأماكن: بحث. سؤال يجب أن يُجاب: نعم / لا."

  - id: S04
    type: choose
    part: check
    rules: [R07, U40]
    prompt:
      en: "\"Text me when the team is on the way\" is a toggle inside the booking form, above \"Book cleaning\". Nothing is saved until she books. Which control fits?"
      ar: "«أرسل لي رسالة حين يكون الفريق في الطريق» مفتاح تبديل داخل نموذج الحجز، فوق «احجز التنظيف». ولا شيء يُحفظ قبل الحجز. أي عنصر تحكّم يناسب؟"
    options:
      - { id: check, text: { en: "A checkbox, saved with the booking", ar: "مربع اختيار، يُحفظ مع الحجز" } }
      - { id: toggle, text: { en: "Keep the toggle", ar: "أبقِ مفتاح التبديل" } }
      - { id: select, text: { en: "A Yes / No dropdown", ar: "قائمة منسدلة نعم / لا" } }
    answer: [check]
    misconceptions:
      - id: MC-P01-018
        when: [toggle]
        feedback:
          en: "A toggle promises it works now. Here it waits for the booking, so a checkbox tells the truth."
          ar: "مفتاح التبديل يَعِد بأنه يعمل فورًا. وهنا ينتظر الحجز، فمربع الاختيار يقول الحقيقة."
      - id: MC-P01-010
        when: [select]
        feedback:
          en: "Two options hidden in a dropdown take an extra tap to see. A checkbox is one tap, and empty clearly means no."
          ar: "خياران مخفيّان في قائمة منسدلة يحتاجان ضغطة إضافية لرؤيتهما. أما مربع الاختيار فضغطة واحدة، والفراغ فيه يعني «لا» بوضوح."
    explain:
      en: "In a form that waits for a submit button, use checkboxes. Save toggles for settings that apply at once."
      ar: "في نموذج ينتظر زر الإرسال، استخدم مربعات اختيار. واترك مفاتيح التبديل للإعدادات التي تُطبَّق فورًا."

  - id: S05
    type: compare
    part: check
    rules: [R11, U39]
    prompt:
      en: "Most bookings come from Nasr City. Which area field is fast for those customers and still makes sure Laila picks Heliopolis?"
      ar: "أغلب الحجوزات من مدينة نصر. أي حقل للمنطقة سريع لهؤلاء العملاء، ويضمن مع ذلك أن تختار ليلى مصر الجديدة؟"
    a:
      mock:
        blocks:
          - { kind: select, label: "@F6area", text: "@F6nasr", filled: true }
    b:
      mock:
        blocks:
          - { kind: field, label: "@F6area", text: { en: "Search your area", ar: "ابحث عن منطقتك" } }
          - { kind: small, text: { en: "Common", ar: "الأكثر طلبًا" }, gap: s }
          - { kind: radio, text: "@F6nasr", gap: xs }
          - { kind: radio, text: { en: "Heliopolis", ar: "مصر الجديدة" }, gap: xs }
    answer: b
    misconceptions:
      - id: MC-P01-015
        when: [a]
        feedback:
          en: "Nasr City already looks chosen. If Laila doesn't notice, the team goes to the wrong area."
          ar: "مدينة نصر تبدو مختارة أصلًا. وإن لم تنتبه ليلى، يذهب الفريق إلى المنطقة الخاطئة."
    explain:
      en: "Pinning gives common answers one tap without choosing for anyone."
      ar: "التثبيت يجعل الإجابات الشائعة على بُعد ضغطة واحدة، دون الاختيار نيابةً عن أحد."

  - id: S06
    type: choose
    part: check
    rules: [R07, U40]
    prompt:
      en: "Laila types \"مصر الجديده\", with ه instead of ة, and gets \"No results\". What's the fix?"
      ar: "تكتب ليلى «مصر الجديده»، بالهاء بدل التاء المربوطة، فيظهر «لا توجد نتائج». ما الإصلاح؟"
    options:
      - { id: match, text: { en: "Treat ه and ة (and أ / ا, ى / ي) as the same letter", ar: "اعتبار ه وة (وأ وا، وى وي) حرفًا واحدًا" } }
      - { id: tip, text: { en: "Tell her to check her spelling", ar: "أن يُطلب منها التأكّد من الإملاء" } }
      - { id: list, text: { en: "Replace search with a 60-item dropdown", ar: "استبدال البحث بقائمة منسدلة من 60 عنصرًا" } }
    answer: [match]
    misconceptions:
      - id: MC-P01-024
        when: [tip]
        feedback:
          en: "Her spelling is how most people type on a phone. The search should understand it."
          ar: "طريقة كتابتها هي طريقة أغلب الناس على الهاتف. يجب أن يفهمها البحث."
      - id: MC-P01-016
        when: [list]
        feedback:
          en: "Sixty items means a long scroll for everyone. Fix the search instead."
          ar: "ستون عنصرًا تعني تمريرًا طويلًا للجميع. أصلِح البحث بدلًا من ذلك."
    explain:
      en: "Forgiving search treats common Arabic letter variants as one letter."
      ar: "البحث المتسامح يعتبر أشكال الحروف العربية الشائعة حرفًا واحدًا."

  - id: S07
    type: compare
    part: check
    rules: [R06, U40]
    prompt:
      en: "Teams are free only on some days. Which calendar stops Laila from picking a day with no team?"
      ar: "الفرق متاحة في بعض الأيام فقط. أي تقويم يمنع ليلى من اختيار يوم لا فريق فيه؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: { en: "November", ar: "نوفمبر" } }
          - { kind: text, text: { en: "Every day can be picked.", ar: "كل الأيام قابلة للاختيار." }, gap: s }
          - { kind: small, text: { en: "If no team is free, you'll see an error after you book.", ar: "إذا لم يكن هناك فريق متاح، سيظهر خطأ بعد الحجز." }, color: muted, gap: xs }
    b:
      mock:
        blocks:
          - { kind: heading, text: { en: "November", ar: "نوفمبر" } }
          - { kind: text, text: { en: "Days with no free team are greyed out and can't be picked.", ar: "الأيام التي لا فريق متاح فيها رمادية ولا يمكن اختيارها." }, gap: s }
          - { kind: small, text: { en: "Fully booked days are shown in grey.", ar: "الأيام المحجوزة بالكامل تظهر باللون الرمادي." }, color: muted, gap: xs }
    answer: b
    misconceptions:
      - id: MC-P01-013
        when: [a]
        feedback:
          en: "Laila can't know which days are free. Only the system does, so it should show her before she picks."
          ar: "لا تستطيع ليلى أن تعرف الأيام المتاحة. النظام وحده يعرف، فعليه أن يُظهرها قبل أن تختار."
    explain:
      en: "Block what isn't possible, and say why it's blocked."
      ar: "امنع ما ليس ممكنًا، وقل سبب المنع."

  - id: S08
    type: fix
    part: check
    rules: [R07, U39]
    prompt:
      en: "At the end, the form asks \"How did you hear about us?\". Laila heard on a neighbourhood WhatsApp group and picks Other. Which fix lets the company learn that?"
      ar: "في النهاية يسأل النموذج «كيف عرفت عنّا؟». سمعت ليلى عن الشركة من مجموعة واتساب للحي، فتختار «أخرى». أي إصلاح يجعل الشركة تعرف ذلك؟"
    mock:
      blocks:
        - { kind: heading, text: { en: "How did you hear about us?", ar: "كيف عرفت عنّا؟" } }
        - { kind: radio, text: { en: "Facebook", ar: "فيسبوك" }, gap: xs }
        - { kind: radio, text: { en: "A friend", ar: "صديق" }, gap: xs }
        - { kind: radio, selected: true, text: { en: "Other", ar: "أخرى" }, gap: xs }
    options:
      - { id: field, text: { en: "A text field appears next to Other", ar: "يظهر حقل نصي بجانب «أخرى»" } }
      - { id: more, text: { en: "Add every possible source to the list", ar: "إضافة كل المصادر الممكنة إلى القائمة" } }
      - { id: remove, text: { en: "Remove Other so she must pick one", ar: "حذف «أخرى» حتى تضطر إلى الاختيار" } }
    answer: [field]
    misconceptions:
      - id: MC-P01-019
        when: [more, remove]
        feedback:
          en: "Other only says \"not these\". A field next to it is what turns it into a real answer."
          ar: "«أخرى» تقول فقط «ليس هذه». والحقل بجانبها هو ما يحوّلها إلى إجابة حقيقية."
    explain:
      en: "Keep the list short, and let Other bring its own field."
      ar: "اجعل القائمة قصيرة، ودع «أخرى» تأتي بحقلها."
