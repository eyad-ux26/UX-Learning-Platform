  # SK-P01-U02-06: pick the right control for numbers
  - id: S11
    type: tune
    skill: SK-P01-U02-06
    part: retest
    speaker: tarek
    value:
      en: "Re-test, input steppers (NN/g): use steppers for numeric fields with a clear most frequent value, and start on that value. Most people buy two tickets."
      ar: "إعادة اختبار، الـ Steppers (NN/g): استخدم الـ Stepper للحقول الرقمية التي لها قيمة شائعة واضحة، وابدأ بهذه القيمة. معظم الناس يشترون تذكرتين."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Use steppers for numerical fields with a clear most frequently selected value." }
    scenario:
      en: "In our cinema app, Lotfy buys tickets. People buy 1 to 10, and most buy 2. Right now the number of tickets is an empty text field."
      ar: "في تطبيق السينما عندنا، يشتري لطفي تذاكر. الناس يشترون من 1 إلى 10، ومعظمهم يشترون 2. والآن عدد التذاكر حقل نصّي فارغ."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يجعل لطفي يختار عدد التذاكر المعتاد بأقل جهد؟"
    mock:
      app: shasha
      appbar: { title: { en: Tickets, ar: التذاكر }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: field, label: &lt_l { en: "Tickets", ar: "التذاكر" }, text: "" }
      footer:
        - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" } }
    options:
      - id: stepper
        text: { en: "A stepper that starts at 2", ar: "Stepper (عدّاد بزرّي + و−) يبدأ من 2" }
        mock:
          app: shasha
          appbar: { title: { en: Tickets, ar: التذاكر }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: stepper, label: *lt_l, text: "2" }
          footer:
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" } }
      - id: slider
        text: { en: "A slider from 1 to 10", ar: "Slider (شريط سحب) من 1 إلى 10" }
        mock:
          app: shasha
          appbar: { title: { en: Tickets, ar: التذاكر }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: slider, label: *lt_l, min: 1, max: 10, from: 1, to: 2, format: { en: "{b} tickets", ar: "{b} تذاكر" } }
          footer:
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" } }
      - id: dropdown
        text: { en: "A dropdown from 1 to 10, with nothing selected", ar: "قائمة منسدلة من 1 إلى 10، بلا اختيار مسبق" }
        mock:
          app: shasha
          appbar: { title: { en: Tickets, ar: التذاكر }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: select, label: *lt_l, text: { en: "Select…", ar: "اختر…" } }
          footer:
            - { kind: button, text: { en: "Choose seats", ar: "اختر المقاعد" } }
    answer: [stepper]
    misconceptions:
      - id: MC-P01-022
        when: [slider]
        feedback:
          en: "Sliders are for rough values on a long range. Hitting exactly 2 on a thin track is fiddly, especially on a phone."
          ar: "الـ Slider للقيم التقريبية على مدى طويل. الوصول إلى 2 بالضبط على مسار رفيع أمر مزعج، خصوصًا على الهاتف."
      - id: MC-P01-023
        when: [dropdown]
        feedback:
          en: "Most people want 2, yet everyone has to open the list and pick it. A stepper already on 2 lets most buyers move straight on."
          ar: "معظم الناس يريدون 2، ومع ذلك يجب على الجميع فتح القائمة واختيارها. الـ Stepper الذي يبدأ من 2 يتيح لمعظم المشترين المتابعة مباشرة."
    correct:
      en: "Right. Most people don't touch it; the rest tap + or −."
      ar: "صحيح. معظم الناس لا يلمسونه؛ والباقون يضغطون + أو −."
    explain:
      en: "A small range with a clear usual value is exactly what a stepper is for. Starting on 2 means no action for most buyers and one or two taps for everyone else."
      ar: "المدى الصغير ذو القيمة المعتادة الواضحة هو بالضبط ما صُمّم له الـ Stepper. البدء من 2 يعني أن معظم المشترين لا يضغطون شيئًا، والباقين ضغطة أو اثنتين."

  - id: S12
    type: tune
    skill: SK-P01-U02-06
    part: retest
    speaker: sara
    value:
      en: "Re-test, input steppers (NN/g): steppers aren't suitable for large adjustments. 150 cards need typing, not 100 taps."
      ar: "إعادة اختبار، الـ Steppers (NN/g): الـ Stepper لا يناسب التغييرات الكبيرة. 150 بطاقة تحتاج الكتابة، لا 100 ضغطة."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Steppers are not suitable for a large number adjustments." }
    scenario:
      en: "I'm designing a print shop's order form. Safaa needs exactly 150 wedding invitations. Orders range from 50 to 1,000. Quantity is a stepper that starts at 50 and moves by 1."
      ar: "أصمّم نموذج الطلب لمطبعة. تحتاج صفاء 150 دعوة زفاف بالضبط. والطلبات من 50 إلى 1,000. والكمية Stepper يبدأ من 50 ويزيد واحدًا في كل ضغطة."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يجعل صفاء تُدخل 150 دعوة بأسرع شكل؟"
    mock:
      app: taba
      appbar: { title: { en: Wedding cards, ar: بطاقات الزفاف }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: stepper, label: &sf_l { en: "Number of cards", ar: "عدد البطاقات" }, text: "50" }
        - { kind: small, color: muted, text: &sf_r { en: "50 to 1,000 cards", ar: "من 50 إلى 1,000 بطاقة" }, gap: xs }
    options:
      - id: keep
        text: { en: "Keep the stepper; + and − are easy to use", ar: "أبقِ الـ Stepper؛ فـ + و− سهلان" }
        mock:
          app: taba
          appbar: { title: { en: Wedding cards, ar: بطاقات الزفاف }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: stepper, label: *sf_l, text: "50" }
            - { kind: small, color: muted, text: { en: "100 taps on + to reach 150", ar: "100 ضغطة على + للوصول إلى 150" }, gap: xs }
      - id: slider
        text: { en: "A slider from 50 to 1,000", ar: "Slider من 50 إلى 1,000" }
        mock:
          app: taba
          appbar: { title: { en: Wedding cards, ar: بطاقات الزفاف }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: slider, label: *sf_l, min: 50, max: 1000, from: 50, to: 160, format: { en: "{b} cards", ar: "{b} بطاقة" } }
      - id: type
        text: { en: "A number field she types into, with the number pad", ar: "حقل رقم تكتب فيه، بلوحة الأرقام" }
        mock:
          app: taba
          appbar: { title: { en: Wedding cards, ar: بطاقات الزفاف }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *sf_l, filled: true, text: "150" }
            - { kind: small, color: muted, text: *sf_r, gap: xs }
    answer: [type]
    misconceptions:
      - id: MC-P01-023
        when: [keep]
        feedback:
          en: "Going from 50 to 150 takes 100 taps. Steppers are for small changes around a usual value, not for large exact numbers."
          ar: "الانتقال من 50 إلى 150 يحتاج 100 ضغطة. الـ Stepper للتغييرات الصغيرة حول قيمة معتادة، لا للأرقام الكبيرة الدقيقة."
      - id: MC-P01-022
        when: [slider]
        feedback:
          en: "On a track from 50 to 1,000, each pixel jumps several cards, so landing on exactly 150 is luck. Sliders are for rough values."
          ar: "على مسار من 50 إلى 1,000، كل حركة صغيرة تقفز عدة بطاقات، فالوصول إلى 150 بالضبط مسألة حظ. الـ Slider للقيم التقريبية."
    correct:
      en: "Right. She types 150 and moves on."
      ar: "صحيح. تكتب 150 وتتابع."
    explain:
      en: "Safaa knows her exact number and it's far from the start. Typing it takes three key presses; no other control comes close."
      ar: "صفاء تعرف عددها بالضبط، وهو بعيد عن البداية. كتابته تحتاج ثلاث ضغطات؛ ولا يوجد عنصر آخر بهذه السرعة."

  # SK-P01-U02-07: treat codes as text made of digits
  - id: S13
    type: tune
    skill: SK-P01-U02-07
    part: retest
    speaker: karim
    value:
      en: "Re-test, mobile input checklist (NN/g): what's the right keyboard for this field? A verification code is text made of digits: a number field drops its leading zero."
      ar: "إعادة اختبار، قائمة تحقّق حقول الهاتف (NN/g): ما لوحة المفاتيح المناسبة لهذا الحقل؟ رمز التحقّق نص من أرقام: حقل الأرقام يحذف الصفر الأول."
    ref: { url: "https://www.nngroup.com/articles/mobile-input-checklist/", quote: "What is the right keyboard for this field?" }
    scenario:
      en: "I'm building a bank app's login. Emad gets a text message with a 6-digit code: 048213. I'm choosing the field type."
      ar: "أبني تسجيل الدخول لتطبيق بنك. تصل عماد رسالة فيها رمز من 6 أرقام: 048213. وأنا أختار نوع الحقل."
    prompt:
      en: "Try each field. Which one should ship?"
      ar: "جرّب كل حقل. أيّ حقل يتيح لعماد أن يكتب الرمز 048213 بسرعة ويُقبل كما هو؟"
    start: number
    options:
      - id: number
        text: { en: "A number field, with up and down arrows", ar: "حقل أرقام، بأسهم للأعلى والأسفل" }
        mock:
          app: rasid
          appbar: { title: { en: Sign in, ar: تسجيل الدخول }, back: true }
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: &em_l { en: "Code from the text message", ar: "الرمز من الرسالة" }, filled: true, text: "48213" }
                - { kind: small, text: "▲▼" }
            - { kind: small, color: red, text: { en: "Wrong code.", ar: "الرمز غير صحيح." }, gap: xs }
      - id: pad
        text: { en: "A text field that opens the number pad", ar: "حقل نصّي يفتح لوحة الأرقام" }
        mock:
          app: rasid
          appbar: { title: { en: Sign in, ar: تسجيل الدخول }, back: true }
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          blocks:
            - { kind: field, label: *em_l, filled: true, text: "048213" }
            - { kind: small, color: muted, text: { en: "Keyboard: 1 2 3 number pad", ar: "لوحة المفاتيح: لوحة أرقام 1 2 3" }, gap: xs }
      - id: full
        text: { en: "A plain text field with the full keyboard", ar: "حقل نصّي عادي بلوحة المفاتيح الكاملة" }
        mock:
          app: rasid
          appbar: { title: { en: Sign in, ar: تسجيل الدخول }, back: true }
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          blocks:
            - { kind: field, label: *em_l, filled: true, text: "048213" }
            - { kind: small, color: muted, text: { en: "Keyboard: letters first; tap 123 for digits", ar: "لوحة المفاتيح: الحروف أولًا؛ اضغط 123 للأرقام" }, gap: xs }
    answer: [pad]
    misconceptions:
      - id: MC-P01-021
        when: [number, full]
        feedback:
          en: "A number field treats the code as an amount and drops the 0, so Emad's correct code is rejected. The full keyboard keeps it, but hides the digits he needs behind an extra tap. A code is text made of digits: a text field with the number pad."
          ar: "حقل الأرقام يتعامل مع الرمز كمبلغ ويحذف الصفر، فيُرفض رمز عماد الصحيح. ولوحة المفاتيح الكاملة تحافظ عليه، لكنها تُخفي الأرقام خلف ضغطة إضافية. فالرمز نص مكوّن من أرقام، ويناسبه حقل نصّي بلوحة أرقام."
    correct:
      en: "Right. Every digit kept, and the right keys ready."
      ar: "صحيح. كل الأرقام محفوظة، والمفاتيح المناسبة جاهزة."
    explain:
      en: "Codes, IDs and card numbers are made of digits but aren't amounts. A text field keeps leading zeros, and asking for the number pad gives Emad big, easy keys."
      ar: "الرموز والأرقام التعريفية وأرقام البطاقات مكوّنة من أرقام لكنها ليست مبالغ. الحقل النصّي يحافظ على الأصفار في البداية، وطلب لوحة الأرقام يعطي عماد مفاتيح كبيرة وسهلة."

  - id: S14
    type: tune
    skill: SK-P01-U02-07
    part: retest
    speaker: tarek
    value:
      en: "Re-test, mobile input checklist (NN/g): what's the right keyboard for this field? A card number is 16 digits of text: number pad, no arrows, grouped for reading."
      ar: "إعادة اختبار، قائمة تحقّق حقول الهاتف (NN/g): ما لوحة المفاتيح المناسبة لهذا الحقل؟ رقم البطاقة 16 رقمًا من النص: لوحة أرقام، بلا أسهم، ومقسّم ليسهل قراءته."
    ref: { url: "https://www.nngroup.com/articles/mobile-input-checklist/", quote: "What is the right keyboard for this field?" }
    scenario:
      en: "In our course app, Bahaa pays with his card. He types the 16-digit number from the card in his hand. My team is choosing the field type."
      ar: "في تطبيق الدورات عندنا، يدفع بهاء ببطاقته. يكتب الرقم المكوّن من 16 رقمًا من البطاقة التي في يده. وفريقي يختار نوع الحقل."
    prompt:
      en: "Try each field. Which one should ship?"
      ar: "جرّب كل حقل. أيّ حقل يجعل بهاء يكتب رقم بطاقته بسرعة ويطابقه مع البطاقة بسهولة؟"
    start: number
    options:
      - id: pad
        text: { en: "A text field with the number pad, shown in groups of four", ar: "حقل نصّي بلوحة الأرقام، يُعرض في مجموعات من أربعة" }
        mock:
          app: { name: { en: Ostaz, ar: أستاذ }, color: '#2F9E44', icon: pencil-simple, domain: ostaz.example }
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          caption: { en: "After Bahaa types his number", ar: "بعد أن يكتب بهاء رقمه" }
          blocks:
            - { kind: field, label: &bh_l { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4417 1234 5678 9113" }
            - { kind: small, color: muted, text: { en: "Keyboard: 1 2 3 number pad", ar: "لوحة المفاتيح: لوحة أرقام 1 2 3" }, gap: xs }
      - id: number
        text: { en: "A number field, with up and down arrows", ar: "حقل أرقام، بأسهم للأعلى والأسفل" }
        mock:
          app: { name: { en: Ostaz, ar: أستاذ }, color: '#2F9E44', icon: pencil-simple, domain: ostaz.example }
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          caption: { en: "After Bahaa types his number", ar: "بعد أن يكتب بهاء رقمه" }
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: *bh_l, filled: true, text: "⁦4.417123456789e15⁩" }
                - { kind: small, text: "▲▼" }
      - id: full
        text: { en: "A plain text field with the full keyboard, no spaces", ar: "حقل نصّي عادي بلوحة المفاتيح الكاملة، بلا مسافات" }
        mock:
          app: { name: { en: Ostaz, ar: أستاذ }, color: '#2F9E44', icon: pencil-simple, domain: ostaz.example }
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          caption: { en: "After Bahaa types his number", ar: "بعد أن يكتب بهاء رقمه" }
          blocks:
            - { kind: field, label: *bh_l, filled: true, text: "4417123456789113" }
            - { kind: small, color: muted, text: { en: "Keyboard: letters first; tap 123 for digits", ar: "لوحة المفاتيح: الحروف أولًا؛ اضغط 123 للأرقام" }, gap: xs }
    answer: [pad]
    misconceptions:
      - id: MC-P01-021
        when: [number, full]
        feedback:
          en: "A number field can turn a long card number into a math value and offers arrows that make no sense. The full keyboard hides the digits and an unbroken 16-digit string is hard to check. A card number is text made of digits."
          ar: "حقل الأرقام قد يحوّل رقم البطاقة الطويل إلى قيمة حسابية ويعرض أسهمًا بلا معنى. ولوحة المفاتيح الكاملة تُخفي الأرقام، وسلسلة من 16 رقمًا متّصلة يصعب مراجعتها. رقم البطاقة نص من أرقام."
    correct:
      en: "Right. Easy to type and easy to check."
      ar: "صحيح. سهل الكتابة وسهل المراجعة."
    explain:
      en: "The number pad makes typing fast, and groups of four match how the number is printed on the card, so Bahaa can compare them at a glance."
      ar: "لوحة الأرقام تجعل الكتابة سريعة، والمجموعات الرباعية تطابق طريقة طباعة الرقم على البطاقة، فيستطيع بهاء المقارنة بنظرة."

  # SK-P01-U02-08: make long lists searchable and forgiving
  - id: S15
    type: tune
    skill: SK-P01-U02-08
    part: retest
    speaker: mona
    value:
      en: "Re-test, dropdowns (NN/g): a type-to-filter combobox works well for long lists of predictable options such as universities. Ninety names in a plain dropdown means scrolling."
      ar: "إعادة اختبار، القوائم المنسدلة (NN/g): الـ Combobox الذي يُضيّق القائمة بالكتابة يعمل جيدًا مع القوائم الطويلة المتوقّعة مثل الجامعات. تسعون اسمًا في قائمة منسدلة عادية تعني تمريرًا طويلًا."
    ref: { url: "https://www.nngroup.com/articles/dropdown-list/", quote: "This pattern works well for long lists of predictable options such as countries, states, languages, and universities." }
    scenario:
      en: "My team is reviewing a scholarship form. Soad must pick her university from a list of about 90. Most applicants come from two big universities; Soad studies at a smaller one in Assiut."
      ar: "يراجع فريقي نموذجًا لمنحة دراسية. يجب أن تختار سعاد جامعتها من قائمة فيها نحو 90 جامعة. معظم المتقدّمين من جامعتين كبيرتين؛ وسعاد تدرس في جامعة أصغر في أسيوط."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يجعل سعاد تصل إلى جامعتها في أسيوط بأسرع شكل؟"
    start: az
    options:
      - id: az
        text: { en: "A plain dropdown, sorted A to Z", ar: "قائمة منسدلة عادية، مرتّبة أبجديًا" }
        mock:
          app: { name: { en: Minha, ar: منحة }, color: '#5F3DC4', icon: graduation-cap, domain: minha.example }
          appbar: { title: { en: Scholarship, ar: المنحة }, back: true }
          blocks:
            - { kind: select, label: &so_l { en: "University", ar: "الجامعة" }, text: { en: "Select…", ar: "اختر…" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Al-Azhar University", ar: "جامعة الأزهر" } }
                - { kind: meta, text: { en: "Alexandria University", ar: "جامعة الإسكندرية" }, gap: xs }
                - { kind: small, text: { en: "… 88 more", ar: "… 88 جامعة أخرى" }, gap: xs }
      - id: preselect
        text: { en: "Preselect the most common university", ar: "اختر الجامعة الأكثر شيوعًا مسبقًا" }
        mock:
          app: { name: { en: Minha, ar: منحة }, color: '#5F3DC4', icon: graduation-cap, domain: minha.example }
          appbar: { title: { en: Scholarship, ar: المنحة }, back: true }
          blocks:
            - { kind: select, label: *so_l, filled: true, text: { en: "Cairo University", ar: "جامعة القاهرة" } }
      - id: search
        text: { en: "A box she types into, and the list narrows as she types", ar: "مربع تكتب فيه، فتقصر القائمة مع كل حرف" }
        mock:
          app: { name: { en: Minha, ar: منحة }, color: '#5F3DC4', icon: graduation-cap, domain: minha.example }
          appbar: { title: { en: Scholarship, ar: المنحة }, back: true }
          blocks:
            - { kind: field, label: *so_l, filled: true, text: { en: "Assi", ar: "أسيو" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: meta, weight: bold, text: { en: "Assiut University", ar: "جامعة أسيوط" } }
                - { kind: meta, text: { en: "Assiut University, New Valley branch", ar: "جامعة أسيوط، فرع الوادي الجديد" }, gap: xs }
    answer: [search]
    misconceptions:
      - id: MC-P01-016
        when: [az]
        feedback:
          en: "With about 90 names, Soad has to scroll and scan a long list on a small screen. Let her type a few letters instead."
          ar: "مع نحو 90 اسمًا، يجب أن تمرّر سعاد وتبحث في قائمة طويلة على شاشة صغيرة. دعها تكتب بضعة حروف بدلًا من ذلك."
      - id: MC-P01-015
        when: [preselect]
        feedback:
          en: "A preselected university is a guess about Soad. If she doesn't notice, her application goes in under the wrong university. Help her find hers; don't pick it for her."
          ar: "الجامعة المختارة مسبقًا تخمين عن سعاد. إذا لم تنتبه، يُقدَّم طلبها باسم الجامعة الخطأ. ساعدها على إيجاد جامعتها؛ ولا تخترها نيابة عنها."
    correct:
      en: "Right. A few letters, and her university is on top."
      ar: "صحيح. تكتب بضعة حروف، فتظهر جامعتها في الأعلى."
    explain:
      en: "For long, predictable lists, typing beats scrolling. People know the name they're looking for, so a box that narrows the list as they type gets them there fastest."
      ar: "في القوائم الطويلة التي يعرف الناس ما فيها، الكتابة أسرع من التمرير. الناس يعرفون الاسم الذي يبحثون عنه، فالمربع الذي يضيّق القائمة مع الكتابة يوصلهم أسرع."

  - id: S16
    type: tune
    skill: SK-P01-U02-08
    part: retest
    speaker: rami
    value:
      en: "Re-test, site search (NN/g): query suggestions help people fix spelling errors while typing. \"Alexandaria\" is one letter off; suggest the match."
      ar: "إعادة اختبار، البحث في الموقع (NN/g): اقتراحات البحث تساعد الناس على تصحيح الأخطاء الإملائية أثناء الكتابة. «Alexandaria» تختلف بحرف واحد؛ اقترح النتيجة الصحيحة."
    ref: { url: "https://www.nngroup.com/articles/internal-website-search/", quote: "Oftentimes query suggestions will assist users in adjusting spelling errors while they are typing the query." }
    scenario:
      en: "I'm designing a bus ticket app. In the \"To\" field, Nabil types the city quickly with one thumb: \"Alexandaria\"."
      ar: "أصمّم تطبيقًا لتذاكر الحافلات. في حقل «إلى» يكتب نبيل اسم المدينة بسرعة بإبهام واحد: «اسكندريه»."
    prompt:
      en: "Try each response. Which one should ship?"
      ar: "جرّب كل استجابة. أيّ استجابة توصل نبيل إلى الإسكندرية رغم خطئه في الكتابة؟"
    start: none
    options:
      - id: none
        text: { en: "Show \"No results\"", ar: "اعرض «لا توجد نتائج»" }
        mock:
          app: rehla
          appbar: { title: { en: Search buses, ar: ابحث عن حافلة }, back: true }
          blocks:
            - { kind: field, label: &nb_l { en: "To", ar: "إلى" }, filled: true, text: { en: "Alexandaria", ar: "اسكندريه" } }
            - { kind: small, text: { en: "No results.", ar: "لا توجد نتائج." }, gap: xs }
      - id: suggest
        text: { en: "Suggest the closest match", ar: "اقترح أقرب نتيجة" }
        mock:
          app: rehla
          appbar: { title: { en: Search buses, ar: ابحث عن حافلة }, back: true }
          blocks:
            - { kind: field, label: *nb_l, filled: true, text: { en: "Alexandaria", ar: "اسكندريه" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: small, text: { en: "Did you mean:", ar: "هل تقصد:" } }
                - { kind: text, weight: bold, text: { en: "Alexandria", ar: "الإسكندرية" }, gap: xs }
      - id: list
        text: { en: "Show the full list of cities, A to Z", ar: "اعرض قائمة المدن كاملة أبجديًا" }
        mock:
          app: rehla
          appbar: { title: { en: Search buses, ar: ابحث عن حافلة }, back: true }
          blocks:
            - { kind: field, label: *nb_l, filled: true, text: { en: "Alexandaria", ar: "اسكندريه" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: text, text: { en: "Abu Simbel", ar: "أبو سمبل" } }
                - { kind: text, text: { en: "Al Arish", ar: "العريش" }, gap: xs }
                - { kind: small, text: { en: "… 58 more", ar: "… 58 مدينة أخرى" }, gap: xs }
    answer: [suggest]
    misconceptions:
      - id: MC-P01-024
        when: [none, list]
        feedback:
          en: "Nabil is one letter away from the right city. \"No results\" makes him hunt for his typo, and the full list throws away what he typed. Suggest the match."
          ar: "ما كتبه نبيل يختلف بحرف واحد عن اسم المدينة. «لا توجد نتائج» تجعله يبحث عن خطئه، والقائمة الكاملة تتجاهل ما كتبه. اقترح النتيجة الصحيحة."
    correct:
      en: "Right. One tap, and he's going to Alexandria."
      ar: "صحيح. بضغطة واحدة، يختار نبيل الإسكندرية."
    explain:
      en: "People rarely type place names perfectly, especially names with several spellings. A close-match suggestion turns a typo into one tap instead of a dead end."
      ar: "نادرًا ما يكتب الناس أسماء الأماكن بدقة، خصوصًا الأسماء التي لها أكثر من طريقة كتابة. اقتراح أقرب نتيجة يحوّل الخطأ الإملائي إلى ضغطة واحدة بدل طريق مسدود."
