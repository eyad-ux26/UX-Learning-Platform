steps:
  # SK-P01-U02-01: use a toggle only for instant settings
  - id: S01
    type: tune
    skill: SK-P01-U02-01
    part: retest
    speaker: karim
    value:
      en: "Re-test, toggle switches (NN/g): a toggle inside a form with a Save button confuses people, because they can't be sure whether it took effect. Inside a form, use a checkbox."
      ar: "إعادة اختبار، مفاتيح الـ Toggle (NN/g): الـ Toggle داخل نموذج فيه زر حفظ يُربك الناس، لأنهم لا يعرفون هل طُبّق اختيارهم. داخل النموذج، استخدم Checkbox."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "This scenario confuses users because they can’t be sure whether their toggle choice will take immediate effect." }
    scenario:
      en: "I'm building a marketplace app. Yehia edits his seller profile, and nothing on the page is saved until he taps Save. Above the button there's a toggle: \"Show my phone number to buyers\"."
      ar: "أبني تطبيقًا للبيع والشراء. يعدّل يحيى ملفه كبائع، ولا شيء في الصفحة يُحفظ حتى يضغط «حفظ». وفوق الزر يوجد Toggle (مفتاح تشغيل وإيقاف): «أظهر رقم هاتفي للمشترين»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تعمل مثل بقية صفحة يحيى، فلا يُحفظ شيء قبل الضغط على زر «حفظ»؟"
    mock:
      app: { name: { en: Bayya', ar: بيّاع }, color: '#F76707', icon: tag, domain: bayya.example }
      appbar: { title: { en: "Seller profile", ar: "ملف البائع" }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: field, label: &yh_n { en: "Shop name", ar: "اسم المتجر" }, filled: true, text: { en: "Yehia's Bikes", ar: "دراجات يحيى" }, gap: m }
        - { kind: toggle, text: &yh_s { en: "Show my phone number to buyers", ar: "أظهر رقم هاتفي للمشترين" }, gap: m }
      footer:
        - { kind: button, text: { en: "Save", ar: "حفظ" } }
    options:
      - id: keep
        text: { en: "Keep the toggle; it's a clear on/off choice", ar: "أبقِ الـ Toggle؛ فهو اختيار تشغيل وإيقاف واضح" }
        mock:
          app: { name: { en: Bayya', ar: بيّاع }, color: '#F76707', icon: tag, domain: bayya.example }
          appbar: { title: { en: "Seller profile", ar: "ملف البائع" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *yh_n, filled: true, text: { en: "Yehia's Bikes", ar: "دراجات يحيى" }, gap: m }
            - { kind: toggle, text: *yh_s, gap: m }
          footer:
            - { kind: button, text: { en: "Save", ar: "حفظ" } }
      - id: check
        text: { en: "Use a checkbox, saved with the rest of the form", ar: "استخدم Checkbox (مربع اختيار) يُحفظ مع بقية النموذج" }
        mock:
          app: { name: { en: Bayya', ar: بيّاع }, color: '#F76707', icon: tag, domain: bayya.example }
          appbar: { title: { en: "Seller profile", ar: "ملف البائع" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *yh_n, filled: true, text: { en: "Yehia's Bikes", ar: "دراجات يحيى" }, gap: m }
            - { kind: check, text: *yh_s, gap: m }
          footer:
            - { kind: button, text: { en: "Save", ar: "حفظ" } }
      - id: note
        text: { en: "Keep the toggle, and add \"Changes apply when you save\" under it", ar: "أبقِ الـ Toggle، وأضف تحته «تُطبّق التغييرات عند الحفظ»" }
        mock:
          app: { name: { en: Bayya', ar: بيّاع }, color: '#F76707', icon: tag, domain: bayya.example }
          appbar: { title: { en: "Seller profile", ar: "ملف البائع" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *yh_n, filled: true, text: { en: "Yehia's Bikes", ar: "دراجات يحيى" }, gap: m }
            - { kind: toggle, text: *yh_s, gap: m }
            - { kind: small, color: muted, text: { en: "Changes apply when you save.", ar: "تُطبّق التغييرات عند الحفظ." }, gap: xs }
          footer:
            - { kind: button, text: { en: "Save", ar: "حفظ" } }
    answer: [check]
    misconceptions:
      - id: MC-P01-018
        when: [keep, note]
        feedback:
          en: "A toggle looks like it acts the moment you flip it. Yehia may flip it, leave the page, and think his number is hidden. A note fights the control instead of fixing it."
          ar: "الـ Toggle يبدو كأنه يعمل لحظة تحريكه. قد يحرّكه يحيى ويغادر الصفحة، ويظن أن رقمه مخفي. والملاحظة ترقّع عنصرًا غير مناسب بدل أن تستبدله."
    correct:
      en: "Right. A checkbox waits for Save, like the rest of the form."
      ar: "صحيح. الـ Checkbox ينتظر الحفظ، مثل بقية النموذج."
    explain:
      en: "People expect a toggle to work instantly and a checkbox to wait for a button. In a form that saves together, the checkbox tells Yehia the truth."
      ar: "يتوقّع الناس أن يعمل الـ Toggle فورًا، وأن ينتظر الـ Checkbox الضغط على زر. في نموذج يُحفظ دفعة واحدة، يُظهر الـ Checkbox ليحيى ما سيحدث فعلًا."

  - id: S02
    type: tune
    skill: SK-P01-U02-01
    part: retest
    speaker: rami
    value:
      en: "Re-test, toggle switches (NN/g): separate controls that produce instant results from those that require a button. A setting that can apply at once deserves a toggle, not a checkbox and an Apply button."
      ar: "إعادة اختبار، مفاتيح الـ Toggle (NN/g): افصل العناصر التي تعطي نتيجة فورية عن التي تحتاج زرًا. الإعداد الذي يمكن تطبيقه فورًا يستحق Toggle، لا Checkbox وزر «تطبيق»."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "Separate controls that produce instant results from those that require clicking a command button." }
    scenario:
      en: "I'm designing a news app. Nashwa reads at night and wants dark mode. In our settings, every other option changes at once. Dark mode is a checkbox, with an Apply button at the bottom of the screen."
      ar: "أصمّم تطبيقًا للأخبار. تقرأ نشوى ليلًا وتريد الوضع الداكن. في إعداداتنا، كل الخيارات الأخرى تتغيّر فورًا. أما الوضع الداكن فهو Checkbox، مع زر «تطبيق» في أسفل الشاشة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل الوضع الداكن يعمل مثل باقي إعدادات نشوى؟"
    mock:
      app: khabar
      appbar: { title: { en: "Settings", ar: "الإعدادات" }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: toggle, selected: true, text: &nw_n { en: "Breaking news alerts", ar: "تنبيهات الأخبار العاجلة" }, gap: m }
        - { kind: check, text: &nw_d { en: "Dark mode", ar: "الوضع الداكن" }, gap: s }
      footer:
        - { kind: button, emphasis: low, text: { en: "Apply", ar: "تطبيق" } }
    options:
      - id: toggle
        text: { en: "Make dark mode a toggle that switches at once, and remove Apply", ar: "اجعل الوضع الداكن Toggle يتغيّر فورًا، واحذف زر «تطبيق»" }
        mock:
          app: khabar
          appbar: { title: { en: "Settings", ar: "الإعدادات" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: toggle, selected: true, text: *nw_n, gap: m }
            - { kind: toggle, text: *nw_d, gap: s }
      - id: keep
        text: { en: "Keep the checkbox and the Apply button", ar: "أبقِ الـ Checkbox وزر «تطبيق»" }
        mock:
          app: khabar
          appbar: { title: { en: "Settings", ar: "الإعدادات" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: toggle, selected: true, text: *nw_n, gap: m }
            - { kind: check, text: *nw_d, gap: s }
          footer:
            - { kind: button, emphasis: low, text: { en: "Apply", ar: "تطبيق" } }
      - id: radios
        text: { en: "Use On and Off radio buttons, with the Apply button", ar: "استخدم Radio buttons (أزرار اختيار واحد) «تشغيل» و«إيقاف»، مع زر «تطبيق»" }
        mock:
          app: khabar
          appbar: { title: { en: "Settings", ar: "الإعدادات" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: toggle, selected: true, text: *nw_n, gap: m }
            - { kind: small, text: *nw_d, gap: s }
            - { kind: radio, text: { en: "On", ar: "تشغيل" }, gap: xs }
            - { kind: radio, selected: true, text: { en: "Off", ar: "إيقاف" }, gap: xs }
          footer:
            - { kind: button, emphasis: low, text: { en: "Apply", ar: "تطبيق" } }
    answer: [toggle]
    misconceptions:
      - id: MC-P01-018
        when: [keep, radios]
        feedback:
          en: "Everything else on this screen works at once, so Nashwa expects dark mode to as well. A control that waits for a far-away Apply button breaks that pattern, and she may never press it."
          ar: "كل شيء آخر في هذه الشاشة يعمل فورًا، فتتوقّع نشوى أن يعمل الوضع الداكن كذلك. والعنصر الذي ينتظر زر «تطبيق» في أسفل الشاشة يخالف هذا النمط، وقد لا تضغطه أبدًا."
    correct:
      en: "Right. An instant setting gets an instant control."
      ar: "صحيح. الإعداد الذي يتغيّر فورًا يناسبه عنصر يعمل فورًا."
    explain:
      en: "Dark mode can change the moment Nashwa flips it, and she sees the result right away. A toggle says exactly that, and matches the other settings on the screen."
      ar: "يمكن أن يتغيّر الوضع الداكن لحظة تحريكه، وترى نشوى النتيجة فورًا. والـ Toggle يوحي بذلك تمامًا، ويتّفق مع بقية الإعدادات في الشاشة."

  # SK-P01-U02-02: one answer or several, shown not hidden
  - id: S03
    type: tune
    skill: SK-P01-U02-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test, dropdowns (NN/g): when a handful of options fits on screen, a dropdown adds more friction than value. Three delivery slots, one answer: radio buttons."
      ar: "إعادة اختبار، القوائم المنسدلة (NN/g): عندما تتّسع الشاشة لعدد قليل من الخيارات، تضيف القائمة المنسدلة عناءً أكثر من فائدتها. ثلاث فترات توصيل وإجابة واحدة: Radio buttons."
    ref: { url: "https://www.nngroup.com/articles/dropdown-list/", quote: "When a handful of options can comfortably fit on screen, a dropdown adds more friction than real value." }
    scenario:
      en: "Galal orders groceries from my shop for tomorrow. He must pick one delivery slot out of three: morning, afternoon or evening. Right now they're inside a dropdown."
      ar: "يطلب جلال بقالة من متجري ليوم غد. يجب أن يختار فترة توصيل واحدة من ثلاث: صباحًا أو ظهرًا أو مساءً. وحاليًا تظهر داخل قائمة منسدلة (Dropdown)."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يُظهر لجلال الفترات الثلاث ويتيح له اختيار واحدة بضغطة؟"
    mock:
      app: sallah
      appbar: { title: { en: "Delivery tomorrow", ar: "التوصيل غدًا" }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: select, label: &gl_l { en: "Delivery slot", ar: "فترة التوصيل" }, text: { en: "Select…", ar: "اختر…" }, gap: m }
      footer:
        - { kind: button, text: { en: "Continue", ar: "متابعة" } }
    options:
      - id: dropdown
        text: { en: "Keep the dropdown; it saves space", ar: "أبقِ القائمة المنسدلة؛ فهي توفّر المساحة" }
        mock:
          app: sallah
          appbar: { title: { en: "Delivery tomorrow", ar: "التوصيل غدًا" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: select, label: *gl_l, text: { en: "Select…", ar: "اختر…" }, gap: m }
          footer:
            - { kind: button, text: { en: "Continue", ar: "متابعة" } }
      - id: checks
        text: { en: "Three checkboxes, so every slot is visible", ar: "ثلاثة Checkboxes، حتى تظهر كل الفترات" }
        mock:
          app: sallah
          appbar: { title: { en: "Delivery tomorrow", ar: "التوصيل غدًا" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, text: *gl_l, gap: m }
            - { kind: check, text: &gl_1 { en: "Morning, 9:00 to 12:00", ar: "صباحًا، من 9:00 إلى 12:00" }, gap: xs }
            - { kind: check, text: &gl_2 { en: "Afternoon, 12:00 to 16:00", ar: "ظهرًا، من 12:00 إلى 16:00" }, gap: xs }
            - { kind: check, text: &gl_3 { en: "Evening, 16:00 to 20:00", ar: "مساءً، من 16:00 إلى 20:00" }, gap: xs }
          footer:
            - { kind: button, text: { en: "Continue", ar: "متابعة" } }
      - id: radios
        text: { en: "Three radio buttons, all visible", ar: "ثلاثة Radio buttons، كلها ظاهرة" }
        mock:
          app: sallah
          appbar: { title: { en: "Delivery tomorrow", ar: "التوصيل غدًا" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, text: *gl_l, gap: m }
            - { kind: radio, text: *gl_1, gap: xs }
            - { kind: radio, text: *gl_2, gap: xs }
            - { kind: radio, text: *gl_3, gap: xs }
          footer:
            - { kind: button, text: { en: "Continue", ar: "متابعة" } }
    answer: [radios]
    misconceptions:
      - id: MC-P01-031
        when: [dropdown]
        feedback:
          en: "Three options fit easily on screen. Inside a dropdown, Galal must open it to see them, then tap again to choose. Show them."
          ar: "ثلاثة خيارات تتّسع بسهولة في الشاشة. داخل القائمة المنسدلة، يجب أن يفتحها جلال ليراها، ثم يضغط مرة أخرى ليختار. اعرضها."
      - id: MC-P01-032
        when: [checks]
        feedback:
          en: "Checkboxes say \"pick any number\", but Galal can only have one slot. He may tick two and get an error. One answer means radio buttons."
          ar: "الـ Checkboxes تقول «اختر أي عدد»، لكن جلال يمكنه اختيار فترة واحدة فقط. قد يختار اثنتين ويظهر له خطأ. الإجابة الواحدة تعني Radio buttons."
    correct:
      en: "Right. All three visible, one tap to choose."
      ar: "صحيح. الثلاثة ظاهرة، وضغطة واحدة للاختيار."
    explain:
      en: "Radio buttons show every option and say \"pick one\". For a few choices, they're faster than a dropdown and clearer than checkboxes."
      ar: "الـ Radio buttons تعرض كل الخيارات وتقول «اختر واحدًا». للخيارات القليلة، هي أسرع من القائمة المنسدلة وأوضح من الـ Checkboxes."

  - id: S04
    type: tune
    skill: SK-P01-U02-02
    part: retest
    speaker: hana
    value:
      en: "Re-test, checkboxes (NN/g): a checkbox list lets people select one, several, all or none. Class interests are any number; radio buttons lose answers."
      ar: "إعادة اختبار، الـ Checkboxes (NN/g): قائمة الـ Checkboxes تتيح اختيار واحد أو عدة أو الكل أو لا شيء. الاهتمامات بالحصص أي عدد؛ والـ Radio buttons تُضيع إجابات."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/", quote: "A checkbox list allows users the unique ability to select one, several, all, or no items from a list." }
    scenario:
      en: "Amal joins my gym. Our form asks which classes interest her, so we can send their timetables. She likes swimming and yoga. The question uses radio buttons."
      ar: "تنضمّ آمال إلى نادينا. يسأل نموذجنا عن الحصص التي تهمّها، حتى نرسل لها مواعيدها. وهي تحب السباحة واليوغا. والسؤال يستخدم Radio buttons."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يتيح لآمال أن تختار السباحة واليوغا معًا؟"
    mock:
      app: nashat
      appbar: { title: { en: Join, ar: اشترك }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &am_q { en: "Which classes interest you?", ar: "أي الحصص تهمّك؟" } }
        - { kind: radio, selected: true, text: &am_1 { en: "Swimming", ar: "السباحة" }, gap: s }
        - { kind: radio, text: &am_2 { en: "Yoga", ar: "اليوغا" }, gap: xs }
        - { kind: radio, text: &am_3 { en: "Boxing", ar: "الملاكمة" }, gap: xs }
        - { kind: radio, text: &am_4 { en: "Spinning", ar: "الدرّاجات الثابتة" }, gap: xs }
    options:
      - id: dropdown
        text: { en: "A dropdown with the four classes", ar: "قائمة منسدلة فيها الحصص الأربع" }
        mock:
          app: nashat
          appbar: { title: { en: Join, ar: اشترك }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: select, label: *am_q, filled: true, text: *am_1 }
      - id: checks
        text: { en: "Four checkboxes", ar: "أربعة Checkboxes" }
        mock:
          app: nashat
          appbar: { title: { en: Join, ar: اشترك }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *am_q }
            - { kind: check, selected: true, text: *am_1, gap: s }
            - { kind: check, selected: true, text: *am_2, gap: xs }
            - { kind: check, text: *am_3, gap: xs }
            - { kind: check, text: *am_4, gap: xs }
      - id: keep
        text: { en: "Keep the radio buttons; she can pick her favourite", ar: "أبقِ الـ Radio buttons؛ يمكنها اختيار المفضّلة لديها" }
        mock:
          app: nashat
          appbar: { title: { en: Join, ar: اشترك }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *am_q }
            - { kind: radio, selected: true, text: *am_1, gap: s }
            - { kind: radio, text: *am_2, gap: xs }
            - { kind: radio, text: *am_3, gap: xs }
            - { kind: radio, text: *am_4, gap: xs }
    answer: [checks]
    misconceptions:
      - id: MC-P01-032
        when: [dropdown, keep]
        feedback:
          en: "Both take only one answer, so Amal loses yoga and never gets its timetable. Interests can be several. Use checkboxes."
          ar: "كلاهما يقبل إجابة واحدة فقط، فتخسر آمال اليوغا ولا تصلها مواعيدها أبدًا. وقد تهتمّ بأكثر من حصة. استخدم Checkboxes."
    correct:
      en: "Right. Any number of classes, all visible."
      ar: "صحيح. أي عدد من الحصص، وكلها ظاهرة."
    explain:
      en: "Ask yourself how many answers are possible. Interests can be none, one or all four, which is exactly what a checkbox list allows."
      ar: "اسأل نفسك كم إجابة ممكنة. قد لا تهتمّ بأي حصة، أو بواحدة، أو بالأربع، وهذا بالضبط ما تسمح به قائمة الـ Checkboxes."

  # SK-P01-U02-03: choose defaults with care
  - id: S05
    type: tune
    skill: SK-P01-U02-03
    part: retest
    speaker: mona
    value:
      en: "Re-test, radio defaults (NN/g): a presumptuous or alienating choice is the most valid reason not to preselect. A guessed gender is personal, wrong for many, and easy to miss."
      ar: "إعادة اختبار، القيم الافتراضية (NN/g): الاختيار المتسرّع أو المُنفّر هو أقوى سبب لعدم الاختيار المسبق. تخمين النوع أمر شخصي، وخطأ بالنسبة لكثيرين، ويسهل ألا يُلاحظ."
    ref: { url: "https://www.nngroup.com/articles/radio-buttons-default-selection/", quote: "This is probably the most valid reason for not selecting a radio button by default." }
    scenario:
      en: "My team is reviewing Hamdy's charity form. It asks donors for their gender for a yearly report. Most past donors were men, so the form preselects \"Man\". Many women donate too."
      ar: "يراجع فريقي نموذج جمعية حمدي الخيرية. يسأل المتبرّعين عن نوعهم لتقرير سنوي. معظم المتبرّعين السابقين رجال، فيختار النموذج «رجل» مسبقًا. وكثير من النساء يتبرّعن أيضًا."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تعطي جمعية حمدي بيانات صحيحة عن نوع كل متبرّع؟"
    mock:
      app: { name: { en: Yad Charity, ar: جمعية يد }, color: '#0CA678', icon: hand-heart, domain: yad.example }
      appbar: { title: { en: Donate, ar: تبرّع }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &hm_q { en: "Gender", ar: "النوع" } }
        - { kind: radio, selected: true, text: &hm_m { en: "Man", ar: "رجل" }, gap: s }
        - { kind: radio, text: &hm_w { en: "Woman", ar: "امرأة" }, gap: xs }
        - { kind: radio, text: &hm_n { en: "Prefer not to say", ar: "أفضّل عدم الإجابة" }, gap: xs }
    options:
      - id: none
        text: { en: "Nothing preselected; donors choose", ar: "لا شيء مختار مسبقًا؛ والمتبرّع يختار" }
        mock:
          app: { name: { en: Yad Charity, ar: جمعية يد }, color: '#0CA678', icon: hand-heart, domain: yad.example }
          appbar: { title: { en: Donate, ar: تبرّع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hm_q }
            - { kind: radio, text: *hm_m, gap: s }
            - { kind: radio, text: *hm_w, gap: xs }
            - { kind: radio, text: *hm_n, gap: xs }
      - id: keep
        text: { en: "Keep \"Man\"; it's right for most donors", ar: "أبقِ «رجل»؛ فهو صحيح لمعظم المتبرّعين" }
        mock:
          app: { name: { en: Yad Charity, ar: جمعية يد }, color: '#0CA678', icon: hand-heart, domain: yad.example }
          appbar: { title: { en: Donate, ar: تبرّع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hm_q }
            - { kind: radio, selected: true, text: *hm_m, gap: s }
            - { kind: radio, text: *hm_w, gap: xs }
            - { kind: radio, text: *hm_n, gap: xs }
      - id: neutral
        text: { en: "Preselect \"Prefer not to say\", to be neutral", ar: "اختر «أفضّل عدم الإجابة» مسبقًا، لتكون محايدًا" }
        mock:
          app: { name: { en: Yad Charity, ar: جمعية يد }, color: '#0CA678', icon: hand-heart, domain: yad.example }
          appbar: { title: { en: Donate, ar: تبرّع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *hm_q }
            - { kind: radio, text: *hm_m, gap: s }
            - { kind: radio, text: *hm_w, gap: xs }
            - { kind: radio, selected: true, text: *hm_n, gap: xs }
    answer: [none]
    misconceptions:
      - id: MC-P01-015
        when: [keep, neutral]
        feedback:
          en: "Both guess something personal for the donor. Women who don't notice are counted as men, and \"Prefer not to say\" fills the report with answers nobody gave. Let each donor choose."
          ar: "كلاهما يخمّن شيئًا شخصيًا عن المتبرّع. النساء اللواتي لا ينتبهن يُحسبن رجالًا، و«أفضّل عدم الإجابة» يملأ التقرير بإجابات لم يعطها أحد. دع كل متبرّع يختار."
    correct:
      en: "Right. A personal answer is the person's to give."
      ar: "صحيح. الإجابة الشخصية يعطيها صاحبها."
    explain:
      en: "Defaults are great for safe, common settings. For facts about a person, a guess is presumptuous and quietly creates wrong data. Leave it empty."
      ar: "القيم الافتراضية (Defaults) رائعة للإعدادات الآمنة الشائعة. أما المعلومات عن الشخص، فتخمينها افتراضٌ في غير محلّه، ويصنع بيانات خاطئة دون أن ينتبه أحد. اترك الحقل فارغًا."

  - id: S06
    type: tune
    skill: SK-P01-U02-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test, radio defaults (NN/g): select one radio button by default in most cases. Free standard shipping is safe and chosen by most; a paid default is not."
      ar: "إعادة اختبار، القيم الافتراضية (NN/g): اختر Radio button افتراضيًا في معظم الحالات. الشحن العادي المجاني آمن ويختاره الأغلبية؛ أما الافتراضي المدفوع فلا."
    ref: { url: "https://www.nngroup.com/articles/radio-buttons-default-selection/", quote: "Select a single radio button by default in most cases." }
    scenario:
      en: "Sahar buys a phone case from my shop. Nine out of ten people choose free standard shipping; express costs 60 EGP. Right now nothing is selected, and my form stops anyone who skips it."
      ar: "تشتري سحر جراب هاتف من متجري. تسعة من كل عشرة يختارون الشحن العادي المجاني؛ والسريع بـ 60 جنيهًا. وحاليًا لا شيء مختار، ونموذجي يمنع من لم يختر من المتابعة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل سحر تتابع فورًا بالخيار الذي يريده أغلب الناس؟"
    mock:
      app: dar
      appbar: { title: { en: Checkout, ar: الدفع }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: heading, text: &sh_q { en: "Shipping", ar: "الشحن" } }
        - { kind: radio, text: &sh_s { en: "Standard, 3 to 5 days · Free", ar: "عادي، من 3 إلى 5 أيام · مجاني" }, gap: s }
        - { kind: radio, text: &sh_e { en: "Express, next day · 60 EGP", ar: "سريع، اليوم التالي · 60 جنيهًا" }, gap: xs }
        - { kind: small, color: red, text: { en: "Choose a shipping option.", ar: "اختر طريقة الشحن." }, gap: s }
    options:
      - id: none
        text: { en: "Keep nothing selected; people should choose for themselves", ar: "اترك الخيارين بلا اختيار مسبق؛ ليختار الناس بأنفسهم" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *sh_q }
            - { kind: radio, text: *sh_s, gap: s }
            - { kind: radio, text: *sh_e, gap: xs }
            - { kind: small, color: red, text: { en: "Choose a shipping option.", ar: "اختر طريقة الشحن." }, gap: s }
      - id: express
        text: { en: "Preselect Express, so more people get it faster", ar: "اختر السريع مسبقًا، حتى يحصل عدد أكبر على توصيل أسرع" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *sh_q }
            - { kind: radio, text: *sh_s, gap: s }
            - { kind: radio, selected: true, text: *sh_e, gap: xs }
      - id: standard
        text: { en: "Preselect Standard; anyone can switch to Express", ar: "اختر العادي مسبقًا؛ ويمكن لأي أحد التحويل إلى السريع" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: heading, text: *sh_q }
            - { kind: radio, selected: true, text: *sh_s, gap: s }
            - { kind: radio, text: *sh_e, gap: xs }
    answer: [standard]
    misconceptions:
      - id: MC-P01-033
        when: [none]
        feedback:
          en: "Defaults aren't bad in general. Here most people want the free option, it's harmless and easy to change, so starting on it saves almost everyone a step and an error."
          ar: "القيم الافتراضية ليست سيئة عمومًا. هنا معظم الناس يريدون الخيار المجاني، وهو آمن وسهل التغيير، فالبدء به يوفّر خطوة وخطأً على الجميع تقريبًا."
      - id: MC-P01-015
        when: [express]
        feedback:
          en: "A paid default guesses that Sahar wants to spend more. Many won't notice and will pay 60 EGP they didn't choose. A default should be safe."
          ar: "اختيار الشحن المدفوع مسبقًا يفترض أن سحر تريد أن تدفع أكثر. كثيرون لن ينتبهوا وسيدفعون 60 جنيهًا لم يختاروها. يجب أن يكون الافتراضي آمنًا."
    correct:
      en: "Right. The common, free choice is ready."
      ar: "صحيح. الخيار الشائع المجاني جاهز."
    explain:
      en: "A good default is what most people want and costs nothing if left alone. Free standard shipping is both, and Express is still one tap away."
      ar: "الافتراضي الجيد هو ما يريده معظم الناس ولا يكلّف شيئًا إذا تُرك. الشحن العادي المجاني كذلك، والسريع متاح بضغطة واحدة."

  # SK-P01-U02-04: let people type what they know
  - id: S07
    type: tune
    skill: SK-P01-U02-04
    part: retest
    speaker: tarek
    value:
      en: "Re-test, dropdowns (NN/g): for readily known values, typing is often faster than selecting from a dropdown. A car's model year is four digits its owner knows."
      ar: "إعادة اختبار، القوائم المنسدلة (NN/g): للقيم المعروفة، الكتابة غالبًا أسرع من الاختيار من قائمة منسدلة. سنة صنع السيارة أربعة أرقام يعرفها صاحبها."
    ref: { url: "https://www.nngroup.com/articles/dropdown-list/", quote: "For readily known values — ages, birthdates, heights — typing is often faster than selecting from a dropdown." }
    scenario:
      en: "In the insurance app I manage, Tawfik gets a car quote. He's asked for his car's model year: 2014. The field is a dropdown that lists every year from 2027 back to 1970."
      ar: "في تطبيق التأمين الذي أديره، يطلب توفيق عرض سعر لسيارته. يُسأل عن سنة صنعها: 2014. والحقل قائمة منسدلة فيها كل السنوات من 2027 حتى 1970."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّ عنصر يجعل توفيق يُدخل سنة سيارته 2014 بأسرع شكل؟"
    mock:
      app: aman
      appbar: { title: { en: Car quote, ar: عرض سعر السيارة }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: select, label: &tw_l { en: "Model year", ar: "سنة الصنع" }, text: { en: "Select…", ar: "اختر…" } }
        - kind: group
          gap: xs
          blocks:
            - { kind: meta, text: "2027" }
            - { kind: meta, text: "2026", gap: xs }
            - { kind: meta, text: "2025", gap: xs }
            - { kind: small, text: { en: "… 55 more", ar: "… 55 سنة أخرى" }, gap: xs }
    options:
      - id: type
        text: { en: "A short field he types the year into, with the number pad", ar: "حقل قصير يكتب فيه السنة، بلوحة الأرقام" }
        mock:
          app: aman
          appbar: { title: { en: Car quote, ar: عرض سعر السيارة }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *tw_l, filled: true, text: "2014", hint: { en: "For example 2014", ar: "مثلًا 2014" } }
      - id: oldest
        text: { en: "Keep the dropdown, but start it from the oldest year", ar: "أبقِ القائمة المنسدلة، لكن ابدأها من أقدم سنة" }
        mock:
          app: aman
          appbar: { title: { en: Car quote, ar: عرض سعر السيارة }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: select, label: *tw_l, text: { en: "Select…", ar: "اختر…" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: meta, text: "1970" }
                - { kind: meta, text: "1971", gap: xs }
                - { kind: meta, text: "1972", gap: xs }
                - { kind: small, text: { en: "… 55 more", ar: "… 55 سنة أخرى" }, gap: xs }
      - id: calendar
        text: { en: "A calendar picker", ar: "تقويم لاختيار التاريخ (Date picker)" }
        mock:
          app: aman
          appbar: { title: { en: Car quote, ar: عرض سعر السيارة }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: *tw_l, text: { en: "Pick a date", ar: "اختر تاريخًا" } }
            - kind: group
              gap: xs
              blocks:
                - { kind: small, weight: bold, text: { en: "‹ October 2026 ›", ar: "‹ أكتوبر 2026 ›" } }
                - { kind: small, text: { en: "Tap ‹ to go back month by month", ar: "اضغط ‹ للرجوع شهرًا بعد شهر" }, gap: xs }
    answer: [type]
    misconceptions:
      - id: MC-P01-012
        when: [oldest, calendar]
        feedback:
          en: "Tawfik knows \"2014\" by heart. Scrolling through dozens of years, or flipping back 150 months, turns four keystrokes into a hunt."
          ar: "توفيق يحفظ «2014». التمرير بين عشرات السنوات، أو الرجوع 150 شهرًا، يحوّل أربع ضغطات إلى بحث طويل."
    correct:
      en: "Right. Four digits, typed in a second."
      ar: "صحيح. أربعة أرقام، تُكتب في ثانية."
    explain:
      en: "When people know the answer by heart, typing is the fastest route. Lists and calendars help people find what they don't know, not what they already do."
      ar: "عندما يحفظ الناس الإجابة، تكون الكتابة أسرع طريق. القوائم والتقاويم تساعد الناس على إيجاد ما لا يعرفونه، لا ما يعرفونه بالفعل."

