  # SK-P01-U02-06: pick the right control for numbers
  - id: S11
    type: tune
    skill: SK-P01-U02-06
    part: retest
    value:
      en: "Re-test, input steppers (NN/g): use steppers for numeric fields with a clear most frequent value, and start on that value. Most people buy two tickets."
      ar: "إعادة اختبار، الـ Steppers (NN/g): استخدم الـ Stepper للحقول الرقمية التي لها قيمة شائعة واضحة، وابدأ بهذه القيمة. معظم الناس يشترون تذكرتين."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Use steppers for numerical fields with a clear most frequently selected value." }
    scenario:
      en: "Lotfy buys cinema tickets. People buy 1 to 10, and most buy 2. Right now the number of tickets is an empty text field."
      ar: "يشتري لطفي تذاكر سينما. الناس يشترون من 1 إلى 10، ومعظمهم يشترون 2. والآن عدد التذاكر حقل نصّي فارغ."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: field, label: &lt_l { en: "Tickets", ar: "التذاكر" }, text: "" }
        - { kind: button, text: &lt_b { en: "Choose seats", ar: "اختر المقاعد" }, gap: m }
    options:
      - id: stepper
        text: { en: "A stepper that starts at 2", ar: "Stepper يبدأ من 2" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: stepper, label: *lt_l, text: "2" }
            - { kind: button, text: *lt_b, gap: m }
      - id: slider
        text: { en: "A slider from 1 to 10", ar: "Slider من 1 إلى 10" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: slider, label: *lt_l, min: 1, max: 10, from: 1, to: 2, format: { en: "{b} tickets", ar: "{b} تذاكر" } }
            - { kind: button, text: *lt_b, gap: m }
      - id: dropdown
        text: { en: "A dropdown from 1 to 10, with nothing selected", ar: "قائمة منسدلة من 1 إلى 10، بلا اختيار مسبق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: select, label: *lt_l, text: { en: "Select…", ar: "اختر…" } }
            - { kind: button, text: *lt_b, gap: m }
    answer: [stepper]
    misconceptions:
      - id: MC-P01-022
        when: [slider]
        feedback:
          en: "Sliders are for rough values on a long range. Hitting exactly 2 on a thin track is fiddly, especially on a phone."
          ar: "الـ Slider للقيم التقريبية على مدى طويل. الوصول إلى 2 بالضبط على مسار رفيع أمر مزعج، خصوصًا على الهاتف."
      - id: MC-P01-023
        when: [dropdown]
        feedback:
          en: "Most people want 2, yet everyone has to open the list and pick it. A stepper already on 2 lets most buyers move straight on."
          ar: "معظم الناس يريدون 2، ومع ذلك يجب على الجميع فتح القائمة واختيارها. الـ Stepper الذي يبدأ من 2 يتيح لمعظم المشترين المتابعة مباشرة."
    correct:
      en: "Right. Most people don't touch it; the rest tap + or −."
      ar: "صحيح. معظم الناس لا يلمسونه؛ والباقون يضغطون + أو −."
    explain:
      en: "A small range with a clear usual value is exactly what a stepper is for. Starting on 2 means no action for most buyers and one or two taps for everyone else."
      ar: "المدى الصغير ذو القيمة المعتادة الواضحة هو بالضبط ما صُمّم له الـ Stepper. البدء من 2 يعني لا شيء لمعظم المشترين، وضغطة أو اثنتين للباقين."

  - id: S12
    type: tune
    skill: SK-P01-U02-06
    part: retest
    value:
      en: "Re-test, input steppers (NN/g): steppers aren't suitable for large adjustments. 150 cards need typing, not 100 taps."
      ar: "إعادة اختبار، الـ Steppers (NN/g): الـ Stepper لا يناسب التغييرات الكبيرة. 150 بطاقة تحتاج الكتابة، لا 100 ضغطة."
    ref: { url: "https://www.nngroup.com/articles/input-steppers/", quote: "Steppers are not suitable for a large number adjustments." }
    scenario:
      en: "Safaa orders printed wedding invitations. She needs exactly 150. Orders range from 50 to 1,000. Quantity is a stepper that starts at 50 and moves by 1."
      ar: "تطلب صفاء دعوات زفاف مطبوعة. تحتاج 150 بالضبط. والطلبات من 50 إلى 1,000. والكمية Stepper يبدأ من 50 ويزيد واحدًا في كل ضغطة."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: stepper, label: &sf_l { en: "Number of cards", ar: "عدد البطاقات" }, text: "50" }
        - { kind: small, color: muted, text: &sf_r { en: "50 to 1,000 cards", ar: "من 50 إلى 1,000 بطاقة" }, gap: xs }
    options:
      - id: keep
        text: { en: "Keep the stepper; + and − are easy to use", ar: "أبقِ الـ Stepper؛ فـ + و− سهلان" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: stepper, label: *sf_l, text: "50" }
            - { kind: small, color: muted, text: { en: "100 taps on + to reach 150", ar: "100 ضغطة على + للوصول إلى 150" }, gap: xs }
      - id: slider
        text: { en: "A slider from 50 to 1,000", ar: "Slider من 50 إلى 1,000" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: slider, label: *sf_l, min: 50, max: 1000, from: 50, to: 160, format: { en: "{b} cards", ar: "{b} بطاقة" } }
      - id: type
        text: { en: "A number field she types into, with the number pad", ar: "حقل رقم تكتب فيه، بلوحة الأرقام" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: *sf_l, filled: true, text: "150" }
            - { kind: small, color: muted, text: *sf_r, gap: xs }
    answer: [type]
    misconceptions:
      - id: MC-P01-023
        when: [keep]
        feedback:
          en: "Going from 50 to 150 takes 100 taps. Steppers are for small changes around a usual value, not for large exact numbers."
          ar: "الانتقال من 50 إلى 150 يحتاج 100 ضغطة. الـ Stepper للتغييرات الصغيرة حول قيمة معتادة، لا للأرقام الكبيرة الدقيقة."
      - id: MC-P01-022
        when: [slider]
        feedback:
          en: "On a track from 50 to 1,000, each pixel jumps several cards, so landing on exactly 150 is luck. Sliders are for rough values."
          ar: "على مسار من 50 إلى 1,000، كل نقطة تقفز عدة بطاقات، فالوصول إلى 150 بالضبط مسألة حظ. الـ Slider للقيم التقريبية."
    correct:
      en: "Right. She types 150 and moves on."
      ar: "صحيح. تكتب 150 وتتابع."
    explain:
      en: "Safaa knows her exact number and it's far from the start. Typing it takes three key presses; no other control comes close."
      ar: "صفاء تعرف عددها بالضبط، وهو بعيد عن البداية. كتابته تحتاج ثلاث ضغطات؛ ولا يقترب أي عنصر آخر من ذلك."

  # SK-P01-U02-07: treat codes as text made of digits
  - id: S13
    type: tune
    skill: SK-P01-U02-07
    part: retest
    value:
      en: "Re-test, mobile input checklist (NN/g): what's the right keyboard for this field? A verification code is text made of digits: a number field drops its leading zero."
      ar: "إعادة اختبار، قائمة تحقّق حقول الهاتف (NN/g): ما لوحة المفاتيح المناسبة لهذا الحقل؟ رمز التحقّق نص من أرقام: حقل الأرقام يحذف الصفر الأول."
    ref: { url: "https://www.nngroup.com/articles/mobile-input-checklist/", quote: "What is the right keyboard for this field?" }
    scenario:
      en: "Emad logs in to his bank app. A text message gives him a 6-digit code: 048213. The developer is choosing the field type."
      ar: "يسجّل عماد الدخول في تطبيق البنك. تصله رسالة فيها رمز من 6 أرقام: 048213. والمطوّر يختار نوع الحقل."
    prompt:
      en: "Try each field. Which one should ship?"
      ar: "جرّب كل حقل. أيّها يجب أن يُطلق؟"
    start: number
    options:
      - id: number
        text: { en: "A number field, with up and down arrows", ar: "حقل أرقام، بأسهم للأعلى والأسفل" }
        mock:
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          width: 300
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: &em_l { en: "Code from the text message", ar: "الرمز من الرسالة" }, filled: true, text: "48213" }
                - { kind: small, text: "▲▼" }
            - { kind: small, color: red, text: { en: "Wrong code.", ar: "رمز خطأ." }, gap: xs }
      - id: pad
        text: { en: "A text field that opens the number pad", ar: "حقل نصّي يفتح لوحة الأرقام" }
        mock:
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          width: 300
          blocks:
            - { kind: field, label: *em_l, filled: true, text: "048213" }
            - { kind: small, color: muted, text: { en: "Keyboard: 1 2 3 number pad", ar: "لوحة المفاتيح: لوحة أرقام 1 2 3" }, gap: xs }
      - id: full
        text: { en: "A plain text field with the full keyboard", ar: "حقل نصّي عادي بلوحة المفاتيح الكاملة" }
        mock:
          caption: { en: "After Emad types 048213", ar: "بعد أن يكتب عماد 048213" }
          width: 300
          blocks:
            - { kind: field, label: *em_l, filled: true, text: "048213" }
            - { kind: small, color: muted, text: { en: "Keyboard: letters first; tap 123 for digits", ar: "لوحة المفاتيح: الحروف أولًا؛ اضغط 123 للأرقام" }, gap: xs }
    answer: [pad]
    misconceptions:
      - id: MC-P01-021
        when: [number, full]
        feedback:
          en: "A number field treats the code as an amount and drops the 0, so Emad's correct code is rejected. The full keyboard keeps it, but hides the digits he needs behind an extra tap. A code is text made of digits: a text field with the number pad."
          ar: "حقل الأرقام يتعامل مع الرمز كمبلغ ويحذف الصفر، فيُرفض رمز عماد الصحيح. ولوحة المفاتيح الكاملة تحافظ عليه، لكنها تُخفي الأرقام خلف ضغطة إضافية. الرمز نص من أرقام: حقل نصّي بلوحة أرقام."
    correct:
      en: "Right. Every digit kept, and the right keys ready."
      ar: "صحيح. كل الأرقام محفوظة، والمفاتيح المناسبة جاهزة."
    explain:
      en: "Codes, IDs and card numbers are made of digits but aren't amounts. A text field keeps leading zeros, and asking for the number pad gives Emad big, easy keys."
      ar: "الرموز والأرقام التعريفية وأرقام البطاقات مكوّنة من أرقام لكنها ليست مبالغ. الحقل النصّي يحافظ على الأصفار الأولى، وطلب لوحة الأرقام يعطي عماد مفاتيح كبيرة وسهلة."

  - id: S14
    type: tune
    skill: SK-P01-U02-07
    part: retest
    value:
      en: "Re-test, mobile input checklist (NN/g): what's the right keyboard for this field? A card number is 16 digits of text: number pad, no arrows, grouped for reading."
      ar: "إعادة اختبار، قائمة تحقّق حقول الهاتف (NN/g): ما لوحة المفاتيح المناسبة لهذا الحقل؟ رقم البطاقة 16 رقمًا من النص: لوحة أرقام، بلا أسهم، ومقسّم ليسهل قراءته."
    ref: { url: "https://www.nngroup.com/articles/mobile-input-checklist/", quote: "What is the right keyboard for this field?" }
    scenario:
