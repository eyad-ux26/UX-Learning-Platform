        when: [after, type]
        feedback:
          en: "Adham can't know which times are free; only the shop can. Making him guess and then rejecting him wastes his tries. Show him the free ones."
          ar: "لا يستطيع أدهم معرفة الأوقات المتاحة؛ المحل وحده يعرف. فإذا جعلته يخمّن ثم رفضت اختياره، ضيّعت محاولاته. اعرض له المتاح."
