id: P01-U02-L01
mode: lesson
minutes: 8
title:
  en: "Choices with rules"
  ar: "اختيارات لها قواعد"
review_labels:
  MC-P01-017: { en: "\"None of these\" clears the other boxes", ar: "«لا شيء» يُلغي المربعات الأخرى" }
  MC-P01-018: { en: "A toggle acts now; a checkbox waits for submit", ar: "مفتاح التبديل يعمل فورًا، ومربع الاختيار ينتظر الإرسال" }
  MC-P01-019: { en: "\"Other\" needs a place to say what", ar: "«أخرى» تحتاج مكانًا لكتابة التفاصيل" }
  MC-P01-020: { en: "An empty checkbox can't tell \"no\" from \"skipped\"", ar: "المربع الفارغ لا يفرّق بين «لا» و«تخطّيت»" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Two surprises at the clinic", ar: "مفاجأتان في العيادة" }
    body:
      en: "Nour filled in the clinic app's health form and pressed Save. The doctor received: **Allergies: Penicillin, None.**\n\nLater she switched reminders off on the same screen and closed the app. The reminders kept coming."
      ar: "ملأت نور النموذج الصحي في تطبيق العيادة وضغطت «حفظ». فوصل للطبيب: **الحساسية: البنسلين، لا شيء.**\n\nوبعد ذلك أطفأت التذكيرات من الشاشة نفسها وأغلقت التطبيق. لكن التذكيرات استمرت."
    mock:
      blocks:
        - { kind: title, text: { en: "Health form", ar: "النموذج الصحي" } }
        - { kind: heading, text: { en: "Allergies", ar: "الحساسية" }, gap: m }
        - { kind: check, selected: true, text: { en: "Penicillin", ar: "البنسلين" }, gap: xs }
        - { kind: check, text: { en: "Peanuts", ar: "الفول السوداني" }, gap: xs }
        - { kind: check, selected: true, text: { en: "None", ar: "لا شيء" }, gap: xs }
        - { kind: toggle, text: { en: "Remind me before visits", ar: "ذكّرني قبل المواعيد" }, gap: m }
        - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Why did the reminders keep coming after Nour switched them off?"
      ar: "لماذا استمرت التذكيرات بعد أن أطفأتها نور؟"
    options:
      - { id: save, text: { en: "The switch only counted after Save, and she didn't press it", ar: "المفتاح لا يُحتسب إلا بعد «حفظ»، وهي لم تضغطه" } }
      - { id: bug, text: { en: "The app has a bug", ar: "في التطبيق خطأ برمجي" } }
      - { id: user, text: { en: "She switched the wrong thing off", ar: "أطفأت شيئًا آخر" } }
    reveal:
      en: "The switch waited for Save. But a switch looks like a light switch: people expect it to work the moment they flip it. Nour did what the control promised."
      ar: "المفتاح كان ينتظر «حفظ». لكن المفتاح يشبه مفتاح الإضاءة: يتوقّع الناس أن يعمل لحظة تحريكه. ونور فعلت ما وعد به عنصر التحكّم."

  - id: S03
    type: card
    part: concept
    title: { en: "Four rules beyond radio and checkbox", ar: "أربع قواعد بعد أزرار الراديو ومربعات الاختيار" }
    body:
      en: "One answer: radio buttons. Any number: checkboxes. That's the start. Then:\n\n- **Toggle** (a switch) acts **now**, like a light. Use it for settings. In a form that waits for Save or Submit, use a checkbox.\n- **Segmented control** (2 to 4 joined buttons) switches a view, like Day / Week.\n- **\"None of these\"** clears the other boxes, and ticking another box clears it.\n- **\"Other\"** shows a text field so people can say what.\n\nAnd an empty single checkbox can mean \"no\" or \"I skipped it\". When you need a real answer, ask Yes / No."
      ar: "إجابة واحدة: أزرار راديو. أي عدد: مربعات اختيار. هذه البداية. وبعدها:\n\n- **مفتاح التبديل (Toggle)** يعمل **فورًا**، مثل مفتاح الإضاءة. استخدمه للإعدادات. وفي نموذج ينتظر «حفظ» أو «إرسال»، استخدم مربع اختيار.\n- **الأزرار المقسّمة (Segmented control)**، من 2 إلى 4 أزرار متصلة، تبدّل طريقة العرض، مثل يوم / أسبوع.\n- **«لا شيء مما سبق»** يُلغي المربعات الأخرى، وتحديد مربع آخر يُلغيه.\n- **«أخرى»** تُظهر حقلًا نصيًا ليكتب الناس ما يقصدونه.\n\nوالمربع الواحد الفارغ قد يعني «لا» أو «تخطّيت السؤال». حين تحتاج إجابة حقيقية، اسأل نعم / لا."

  - id: S04
    type: match
    part: guided
    rules: [R07, U39]
    prompt:
      en: "Match each need in the clinic app to its control."
      ar: "طابق كل حاجة في تطبيق العيادة مع عنصر التحكّم المناسب."
    left:
      - { id: dark, text: { en: "Dark mode in Settings, applied at once", ar: "الوضع الداكن في الإعدادات، يُطبَّق فورًا" } }
      - { id: view, text: { en: "Show the doctor's schedule by day or by week", ar: "عرض جدول الطبيب باليوم أو بالأسبوع" } }
      - { id: symptoms, text: { en: "Symptoms today, any number", ar: "الأعراض اليوم، أي عدد" } }
      - { id: meds, text: { en: "Regular medicine: the doctor must know either way", ar: "أدوية منتظمة: يجب أن يعرف الطبيب في الحالتين" } }
    right:
      - { id: toggle, text: { en: "Toggle", ar: "مفتاح تبديل" } }
      - { id: seg, text: { en: "Segmented control", ar: "أزرار مقسّمة" } }
      - { id: checks, text: { en: "Checkboxes", ar: "مربعات اختيار" } }
      - { id: yesno, text: { en: "Yes / No radio buttons", ar: "أزرار راديو نعم / لا" } }
    answer: { dark: toggle, view: seg, symptoms: checks, meds: yesno }
    misconceptions:
      - id: MC-P01-018
        when: { left: dark, right: checks }
        feedback:
          en: "Dark mode changes the screen the moment it's picked. Instant settings are what toggles are for."
          ar: "الوضع الداكن يغيّر الشاشة لحظة اختياره. والإعدادات الفورية هي ما صُنع له مفتاح التبديل."
      - id: MC-P01-020
        when: { left: meds, right: checks }
        feedback:
          en: "An empty box could mean \"no medicine\" or \"didn't answer\". Yes / No forces a real answer."
          ar: "المربع الفارغ قد يعني «لا أدوية» أو «لم تُجب». أما نعم / لا فتفرض إجابة حقيقية."
      - id: MC-P01-018
        when: { left: view, right: toggle }
        feedback:
          en: "A toggle is on or off. Day and Week are two named views, shown side by side: a segmented control."
          ar: "مفتاح التبديل إما يعمل أو لا. أما يوم وأسبوع فطريقتا عرض لكل منهما اسم، تظهران جنبًا إلى جنب: أزرار مقسّمة."
    hints:
      - { en: "Start with the one that changes the screen instantly.", ar: "ابدأ بالذي يغيّر الشاشة فورًا." }
    correct:
      en: "Toggle for instant settings, segments for views, checkboxes for many, Yes / No when silence isn't an answer."
      ar: "مفتاح تبديل للإعدادات الفورية، وأزرار مقسّمة لطرق العرض، ومربعات للعدة، ونعم / لا حين لا يكون الصمت إجابة."
    explain:
      en: "Each control promises a behaviour. Pick the one whose promise matches what really happens."
      ar: "كل عنصر تحكّم يَعِد بسلوك معيّن. اختر العنصر الذي يطابق وعدُه ما يحدث فعلًا."

  - id: S05
    type: choose
    part: guided
    confidence: true
    rules: [R07, U40]
    prompt:
      en: "Nour ticks Penicillin, then ticks None. What should the form do at that moment?"
      ar: "تحدّد نور البنسلين، ثم تحدّد «لا شيء». ماذا يجب أن يفعل النموذج في تلك اللحظة؟"
    options:
      - { id: clear, text: { en: "Untick Penicillin, so only None stays ticked", ar: "يُلغي تحديد البنسلين، فيبقى «لا شيء» وحده" } }
      - { id: keep, text: { en: "Keep both ticked; she can sort it out", ar: "يُبقي الاثنين محدّدين؛ ويمكنها أن تصحّح" } }
      - { id: error, text: { en: "Show an error when she presses Save", ar: "يُظهر رسالة خطأ حين تضغط «حفظ»" } }
    answer: [clear]
    misconceptions:
      - id: MC-P01-017
        when: [keep]
        feedback:
          en: "That's exactly how the doctor got \"Penicillin, None\". The form knows these can't both be true, so it should act on it."
          ar: "هكذا بالضبط وصل للطبيب «البنسلين، لا شيء». النموذج يعرف أنهما لا يجتمعان، فعليه أن يتصرّف."
      - id: MC-P01-017
        when: [error]
        feedback:
          en: "An error after Save makes her fix what the form could have prevented. Clear the conflict as it happens."
          ar: "رسالة الخطأ بعد «حفظ» تجعلها تصلح ما كان النموذج قادرًا على منعه. أزِل التعارض لحظة حدوثه."
    hints:
      - { en: "Can someone be allergic to penicillin and have no allergies?", ar: "هل يمكن أن يكون لدى أحد حساسية من البنسلين ولا حساسية لديه في الوقت نفسه؟" }
    correct:
      en: "None clears the rest, and ticking anything else clears None."
      ar: "«لا شيء» يُلغي الباقي، وتحديد أي شيء آخر يُلغي «لا شيء»."
    explain:
      en: "\"None of these\" behaves like a radio button inside a checkbox group. Make that rule visible by clearing the others straight away."
      ar: "«لا شيء مما سبق» يتصرّف مثل زر راديو داخل مجموعة مربعات. أظهِر هذه القاعدة بإلغاء الباقي فورًا."

  - id: S06
    type: compare
    part: contrast
    rules: [R11, U40]
    prompt:
      en: "Nour switches reminders off and closes the app. In which version are the reminders really off?"
      ar: "تُطفئ نور التذكيرات وتغلق التطبيق. في أي نسخة تكون التذكيرات مطفأة فعلًا؟"
    a:
      mock:
        blocks:
          - { kind: heading, text: { en: "Settings", ar: "الإعدادات" } }
          - { kind: toggle, text: { en: "Remind me before visits", ar: "ذكّرني قبل المواعيد" }, gap: s }
          - { kind: toggle, selected: true, text: { en: "Show prices", ar: "اعرض الأسعار" }, gap: xs }
          - { kind: button, text: { en: "Save changes", ar: "احفظ التغييرات" }, gap: l }
    b:
      mock:
        blocks:
          - { kind: heading, text: { en: "Settings", ar: "الإعدادات" } }
          - { kind: toggle, text: { en: "Remind me before visits", ar: "ذكّرني قبل المواعيد" }, gap: s }
          - { kind: small, text: { en: "Saved. You won't get reminders.", ar: "تم الحفظ. لن تصلك تذكيرات." }, color: green, gap: xs }
          - { kind: toggle, selected: true, text: { en: "Show prices", ar: "اعرض الأسعار" }, gap: s }
    answer: b
    reason:
      prompt: { en: "Why?", ar: "لماذا؟" }
      options:
        - { id: instant, text: { en: "A switch looks like it acts at once, and in B it does", ar: "المفتاح يبدو أنه يعمل فورًا، وفي B يعمل فعلًا" } }
        - { id: fewer, text: { en: "B has fewer buttons", ar: "في B أزرار أقل" } }
        - { id: green, text: { en: "B uses green text", ar: "B تستخدم نصًا أخضر" } }
      answer: [instant]
      misconceptions:
        - id: MC-P01-018
          when: [fewer, green]
          feedback:
            en: "That's a side effect. What matters is that B saves the moment Nour flips the switch, as a switch promises, and says so."
            ar: "هذا أثر جانبي. المهم أن B تحفظ لحظة تحريك نور للمفتاح، كما يَعِد المفتاح، وتقول ذلك."
    misconceptions:
      - id: MC-P01-018
        when: [a]
        feedback:
          en: "In A the switch looks off, but nothing is saved until \"Save changes\". Nour closed the app first, so reminders are still on."
          ar: "في A يبدو المفتاح مطفأً، لكن لا شيء يُحفظ قبل «احفظ التغييرات». ونور أغلقت التطبيق قبلها، فالتذكيرات ما زالت تعمل."
    correct:
      en: "B saves as she flips, and confirms it."
      ar: "B تحفظ لحظة التحريك، وتؤكّد ذلك."
    explain:
      en: "If a screen needs a Save button, use checkboxes on it. If you use toggles, save each one instantly."
      ar: "إذا احتاجت الشاشة زر «حفظ»، فاستخدم فيها مربعات اختيار. وإذا استخدمت مفاتيح تبديل، فاحفظ كل واحد فورًا."

  - id: S07
    type: fix
    part: independent
    rules: [R07, U39]
    prompt:
      en: "Tamer's restaurant asks \"How did you find us?\". He picks Other. Which fix lets the restaurant learn where he found them?"
      ar: "يسأل مطعم تامر «كيف عرفتنا؟». فيختار «أخرى». أي إصلاح يجعل المطعم يعرف من أين عرفه؟"
    mock:
      blocks:
        - { kind: heading, text: { en: "How did you find us?", ar: "كيف عرفتنا؟" } }
        - { kind: radio, text: { en: "A friend", ar: "صديق" }, gap: xs }
        - { kind: radio, text: { en: "Instagram", ar: "إنستغرام" }, gap: xs }
        - { kind: radio, selected: true, text: { en: "Other", ar: "أخرى" }, gap: xs }
        - { kind: button, text: { en: "Send", ar: "أرسل" }, gap: m }
    options:
      - { id: field, text: { en: "Show a short text field when Other is picked", ar: "أظهِر حقلًا نصيًا قصيرًا حين تُختار «أخرى»" } }
      - { id: more, text: { en: "Add ten more options so nobody needs Other", ar: "أضِف عشرة خيارات أخرى حتى لا يحتاج أحد إلى «أخرى»" } }
      - { id: remove, text: { en: "Remove Other", ar: "احذف «أخرى»" } }
    answer: [field]
    misconceptions:
      - id: MC-P01-019
        when: [more]
        feedback:
          en: "A longer list is slower for everyone, and someone will still not fit. Keep the list short and let Other explain itself."
          ar: "القائمة الأطول أبطأ على الجميع، وسيبقى من لا يجد خياره. اجعل القائمة قصيرة ودع «أخرى» تشرح نفسها."
      - id: MC-P01-019
        when: [remove]
        feedback:
          en: "Then Tamer has to pick something untrue, and the restaurant learns the wrong thing."
          ar: "عندها يضطر تامر إلى اختيار شيء غير صحيح، ويعرف المطعم معلومة خاطئة."
    hints:
      - { en: "What does the restaurant know after he picks Other?", ar: "ماذا يعرف المطعم بعد أن يختار «أخرى»؟" }
    correct:
      en: "Other plus a field: the short list stays short and every answer is real."
      ar: "«أخرى» مع حقل: القائمة القصيرة تبقى قصيرة وكل إجابة حقيقية."
    explain:
      en: "On its own, Other only says \"not these\". A field that appears next to it turns it into an answer."
      ar: "«أخرى» وحدها تقول فقط «ليس هذه». والحقل الذي يظهر بجانبها يحوّلها إلى إجابة."

  - id: S08
    type: choose
    part: independent
    confidence: true
    rules: [R07, U39]
    prompt:
      en: "Samir's football camp form has one checkbox: \"My child has had the measles vaccine\". 40 parents leave it empty. What does the camp know about those 40?"
      ar: "في نموذج معسكر سمير مربع اختيار واحد: «طفلي حصل على تطعيم الحصبة». ترك 40 وليّ أمر المربع فارغًا. ماذا يعرف المعسكر عن هؤلاء الأربعين؟"
    options:
      - { id: unknown, text: { en: "Nothing for sure: \"not vaccinated\" and \"skipped it\" look the same", ar: "لا شيء مؤكد: «لم يُطعَّم» و«تخطّى السؤال» يبدوان متشابهين" } }
      - { id: no, text: { en: "Their children aren't vaccinated", ar: "أطفالهم غير مُطعَّمين" } }
      - { id: skip, text: { en: "The parents didn't read the question", ar: "أولياء الأمور لم يقرؤوا السؤال" } }
    answer: [unknown]
    misconceptions:
      - id: MC-P01-020
        when: [no, skip]
        feedback:
          en: "Either could be true, and the form can't tell which. For a health question the camp must act on, ask Yes / No and require an answer."
          ar: "قد يكون أيّهما صحيحًا، ولا يستطيع النموذج أن يميّز. ولسؤال صحي يجب أن يتصرّف المعسكر بناءً عليه، اسأل نعم / لا واجعل الإجابة إلزامية."
    correct:
      en: "An empty box is silent. Yes / No makes every parent say."
      ar: "المربع الفارغ صامت. أما نعم / لا فتجعل كل وليّ أمر يجيب."
    explain:
      en: "A single checkbox is right when empty clearly means no, like \"Send me the newsletter\". When both answers matter, use Yes / No."
      ar: "المربع الواحد مناسب حين يعني الفراغ «لا» بوضوح، مثل «أرسل لي النشرة». وحين تهمّ الإجابتان، استخدم نعم / لا."

  - id: S09
    type: card
    part: recap
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- A toggle acts now. On a screen with a Save button, use checkboxes.\n- A segmented control switches views.\n- \"None of these\" clears the other boxes.\n- \"Other\" brings its own text field.\n- When silence isn't an answer, ask Yes / No.\n\nNext lesson: typing, picking, and the controls in between."
      ar: "- مفتاح التبديل يعمل فورًا. وفي شاشة فيها زر «حفظ»، استخدم مربعات اختيار.\n- الأزرار المقسّمة تبدّل طريقة العرض.\n- «لا شيء مما سبق» يُلغي المربعات الأخرى.\n- «أخرى» تأتي بحقلها النصي.\n- حين لا يكون الصمت إجابة، اسأل نعم / لا.\n\nالدرس التالي: الكتابة والاختيار، وما بينهما من عناصر تحكّم."
