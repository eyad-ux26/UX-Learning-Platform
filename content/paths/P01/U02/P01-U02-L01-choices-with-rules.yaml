id: P01-U02-L01
mode: lesson
minutes: 8
title:
  en: "One, many, or a switch"
  ar: "خيار واحد، أم عدة خيارات، أم مفتاح؟"
sources:
  - title: { en: "Toggle-Switch Guidelines (NN/g)", ar: "إرشادات مفتاح التبديل Toggle (NN/g)" }
    url: "https://www.nngroup.com/articles/toggle-switch-guidelines/"
  - title: { en: "Checkboxes: Design Guidelines (NN/g)", ar: "الـ Checkboxes: إرشادات التصميم (NN/g)" }
    url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/"
  - title: { en: "Does Your Form Really Need a Dropdown List? (NN/g)", ar: "هل يحتاج نموذجك فعلًا إلى قائمة منسدلة؟ (NN/g)" }
    url: "https://www.nngroup.com/articles/dropdown-list/"
  - title: { en: "Radio Buttons: Always Select One? (NN/g)", ar: "الـ Radio buttons: هل نحدّد واحدًا دائمًا؟ (NN/g)" }
    url: "https://www.nngroup.com/articles/radio-buttons-default-selection/"
review_labels:
  MC-P01-015: { en: "Don't preselect a guess for a personal answer", ar: "لا تحدّد تخمينًا مسبقًا لإجابة شخصية" }
  MC-P01-018: { en: "A toggle acts now; a checkbox waits for submit", ar: "الـ Toggle يعمل فورًا، والـ Checkbox ينتظر الإرسال" }
  MC-P01-031: { en: "Show a few options; don't hide them in a dropdown", ar: "اعرض الخيارات القليلة؛ لا تُخفِها في قائمة منسدلة" }
  MC-P01-032: { en: "One answer: radio buttons; several: checkboxes", ar: "إجابة واحدة: Radio buttons؛ عدة إجابات: Checkboxes" }
  MC-P01-033: { en: "A safe, common default saves a step", ar: "القيمة الافتراضية الشائعة والآمنة توفّر خطوة" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Nour's reminders", ar: "تذكيرات نور" }
    body:
      en: "Nour opened her profile in the clinic app to update her phone number. On the same screen, she switched visit reminders off. Then she closed the app without pressing Save.\n\nThe reminders kept coming."
      ar: "فتحت نور ملفها الشخصي في تطبيق العيادة لتحديث رقم هاتفها. وفي الشاشة نفسها، أطفأت تذكيرات المواعيد. ثم أغلقت التطبيق دون أن تضغط «حفظ».\n\nوظلّت التذكيرات تصل."
    mock:
      width: 300
      blocks: &profnow
        - { kind: title, text: { en: "My profile", ar: "ملفي الشخصي" } }
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "⁦010 9876 5432⁩", gap: m }
        - { kind: toggle, text: { en: "Visit reminders", ar: "تذكيرات المواعيد" }, gap: m }
        - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }

  - id: S02
    type: tune
    part: try
    rules: [R12]
    value:
      en: "Try first. Toggle switches (NN/g): toggles should give immediate results. A toggle inside a form with a Save button leaves people unsure whether it took effect; separate instant controls from ones that wait for a button."
      ar: "جرّب أولًا. مفاتيح التبديل (NN/g): يجب أن يعطي الـ Toggle نتيجة فورية. ووضعه داخل نموذج فيه زر «حفظ» يترك الناس غير متأكّدين هل نُفّذ التغيير؛ فافصل العناصر الفورية عن تلك التي تنتظر زرًا."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "Separate controls that produce instant results from those that require clicking a command button." }
    scenario:
      en: "The profile screen needs its Save button for the phone number. The team wants to keep the reminders setting on the same screen."
      ar: "شاشة الملف الشخصي تحتاج زر «حفظ» من أجل رقم الهاتف. ويريد الفريق إبقاء إعداد التذكيرات في الشاشة نفسها."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: *profnow
    options:
      - id: note
        text: { en: "Keep the toggle; add \"Press Save to apply changes\"", ar: "أبقِ الـ Toggle؛ وأضف «اضغط حفظ لتطبيق التغييرات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "My profile", ar: "ملفي الشخصي" } }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "⁦010 9876 5432⁩", gap: m }
            - { kind: toggle, text: { en: "Visit reminders", ar: "تذكيرات المواعيد" }, gap: m }
            - { kind: small, text: { en: "Press Save to apply changes.", ar: "اضغط «حفظ» لتطبيق التغييرات." }, gap: s }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: s }
      - id: check
        text: { en: "Use a checkbox that's saved with the form", ar: "استخدم Checkbox يُحفظ مع النموذج" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "My profile", ar: "ملفي الشخصي" } }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "⁦010 9876 5432⁩", gap: m }
            - { kind: check, selected: true, text: { en: "Send me visit reminders", ar: "أرسل لي تذكيرات المواعيد" }, gap: m }
            - { kind: button, text: { en: "Save", ar: "حفظ" }, gap: m }
      - id: keep
        text: { en: "Keep it as it is; people know to press Save", ar: "أبقِه كما هو؛ فالناس يعرفون أن يضغطوا «حفظ»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *profnow
    answer: [check]
    misconceptions:
      - id: MC-P01-018
        when: [keep]
        feedback:
          en: "A toggle looks like a light switch, so Nour expected it to work the moment she flipped it. On a screen that waits for Save, it breaks that promise."
          ar: "الـ Toggle يشبه مفتاح الإضاءة، فتوقّعت نور أن يعمل لحظة تحريكه. وفي شاشة تنتظر «حفظ»، يُخلف هذا الوعد."
      - id: MC-P01-018
        when: [note]
        feedback:
          en: "The note fights the control. The switch still says \"done\"; few people read the line under it. Use a control that waits, like a checkbox."
          ar: "الملاحظة تعارض العنصر. فالمفتاح ما زال يقول «تمّ»؛ وقليلون يقرؤون السطر تحته. استخدم عنصرًا ينتظر، مثل الـ Checkbox."
    correct:
      en: "In a form that waits for Save, use a checkbox."
      ar: "في نموذج ينتظر «حفظ»، استخدم Checkbox."
    explain:
      en: "A checkbox doesn't promise instant action, so it fits a form that applies changes on Save. Keep toggles for settings that work the moment you flip them."
      ar: "الـ Checkbox لا يَعِد بتنفيذ فوري، لذلك يناسب نموذجًا يطبّق التغييرات عند «حفظ». واحتفظ بالـ Toggle للإعدادات التي تعمل لحظة تحريكها."

  - id: S03
    type: card
    part: concept
    icons: [form, list, clock, idea]
    title: { en: "Each control makes a promise", ar: "كل عنصر تحكّم يَعِد بشيء" }
    body:
      en: "People read a control's shape before its label. Pick the one whose promise matches what happens.\n\n- **Radio buttons:** pick exactly one. All the choices are visible.\n- **Checkboxes:** pick any number, including none. Each box works on its own.\n- **Toggle:** on or off, right now. Use it for settings that apply instantly.\n- **Dropdown:** hides the choices behind a tap. With only a few options, show them as radio buttons instead.\n- **A default choice** saves a step when one answer is common and safe. Don't preselect a guess about someone's personal life."
      ar: "يقرأ الناس شكل العنصر قبل تسميته. فاختر العنصر الذي يطابق وعدُه ما يحدث فعلًا.\n\n- **الـ Radio buttons:** اختر واحدًا فقط. وكل الخيارات ظاهرة.\n- **الـ Checkboxes:** اختر أي عدد، حتى لا شيء. وكل مربع يعمل وحده.\n- **الـ Toggle:** تشغيل أو إيقاف، الآن. استخدمه للإعدادات التي تُطبَّق فورًا.\n- **القائمة المنسدلة (Dropdown):** تُخفي الخيارات خلف ضغطة. ومع خيارات قليلة، اعرضها كـ Radio buttons بدلًا منها.\n- **الخيار الافتراضي** يوفّر خطوة حين تكون إجابة واحدة شائعة وآمنة. ولا تحدّد مسبقًا تخمينًا عن حياة شخص الخاصة."

  - id: S04
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "Dropdown lists (NN/g): when a handful of options fits on screen, a dropdown adds more friction than value. Radio buttons show every choice and take one tap."
      ar: "القوائم المنسدلة (NN/g): حين تتّسع الشاشة لعدد قليل من الخيارات، تضيف القائمة المنسدلة عناءً أكثر من فائدتها. والـ Radio buttons تعرض كل خيار وتحتاج ضغطة واحدة."
    ref: { url: "https://www.nngroup.com/articles/dropdown-list/", quote: "When a handful of options can comfortably fit on screen, a dropdown adds more friction than real value." }
    scenario:
      en: "Nour is booking a visit. It can be in person or a video call, never both."
      ar: "تحجز نور موعدًا. ويمكن أن يكون حضوريًا أو مكالمة فيديو، ولا يكون الاثنين معًا."
    prompt:
      en: "Try each control for the visit type. Which one should ship?"
      ar: "جرّب كل عنصر لنوع الزيارة. أيّها يجب أن يُطلق؟"
    start: dropdown
    options:
      - id: dropdown
        text: { en: "A dropdown", ar: "قائمة منسدلة" }
        mock:
          width: 300
          blocks:
            - { kind: select, label: { en: "Visit type", ar: "نوع الزيارة" }, text: { en: "Select…", ar: "اختر…" } }
      - id: checks
        text: { en: "Two checkboxes", ar: "مربّعا Checkbox" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Visit type", ar: "نوع الزيارة" } }
            - { kind: check, text: { en: "In person", ar: "حضوري" }, gap: xs }
            - { kind: check, text: { en: "Video call", ar: "مكالمة فيديو" }, gap: xs }
      - id: radios
        text: { en: "Two radio buttons", ar: "زرّا Radio" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Visit type", ar: "نوع الزيارة" } }
            - { kind: radio, text: { en: "In person", ar: "حضوري" }, gap: xs }
            - { kind: radio, text: { en: "Video call", ar: "مكالمة فيديو" }, gap: xs }
    answer: [radios]
    misconceptions:
      - id: MC-P01-031
        when: [dropdown]
        feedback:
          en: "Nour has to open it to find out there are only two choices, then tap again. Two options fit on screen; show them."
          ar: "على نور أن تفتحها لتكتشف أن هناك خيارين فقط، ثم تضغط مرة أخرى. والخياران يتّسعان على الشاشة؛ فاعرضهما."
      - id: MC-P01-032
        when: [checks]
        feedback:
          en: "Checkboxes say \"pick any\", so Nour could tick both, or neither. A visit is one or the other: that's a radio choice."
          ar: "الـ Checkboxes تقول «اختر أيًّا منها»، فقد تحدّد نور الاثنين، أو لا شيء. والزيارة إما هذا أو ذاك: وهذا اختيار Radio."
    correct:
      en: "One of a few: radio buttons."
      ar: "واحد من خيارات قليلة: Radio buttons."
    explain:
      en: "Radio buttons show every choice at once and allow exactly one. For two to about five options, they're the fastest and clearest."
      ar: "الـ Radio buttons تعرض كل الخيارات مرة واحدة وتسمح باختيار واحد فقط. ومن خيارين إلى نحو خمسة، هي الأسرع والأوضح."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "Checkboxes (NN/g): a checkbox list lets people select one, several, all, or none. Allergies are any number, so radio buttons or a single-select dropdown lose answers."
      ar: "الـ Checkboxes (NN/g): قائمة الـ Checkboxes تتيح اختيار واحد أو عدة أو الكل أو لا شيء. والحساسية قد تكون أي عدد، فالـ Radio buttons أو القائمة المنسدلة ذات الاختيار الواحد تُضيّع إجابات."
    ref: { url: "https://www.nngroup.com/articles/checkboxes-design-guidelines/", quote: "A checkbox list allows users the unique ability to select one, several, all, or no items from a list." }
    scenario:
      en: "Nour is allergic to penicillin and to nuts. The health form asks about common allergies."
      ar: "لدى نور حساسية من البنسلين ومن المكسّرات. ونموذج الصحة يسأل عن أنواع الحساسية الشائعة."
    prompt:
      en: "Try each control. Which one lets Nour tell the doctor everything?"
      ar: "جرّب كل عنصر. أيّها يتيح لنور أن تخبر الطبيب بكل شيء؟"
    start: radio
    options:
      - id: radio
        text: { en: "Radio buttons", ar: "Radio buttons" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Allergies", ar: "الحساسية" } }
            - { kind: radio, selected: true, text: { en: "Penicillin", ar: "البنسلين" }, gap: xs }
            - { kind: radio, text: { en: "Nuts", ar: "المكسّرات" }, gap: xs }
            - { kind: radio, text: { en: "Latex", ar: "اللاتكس" }, gap: xs }
      - id: check
        text: { en: "Checkboxes", ar: "Checkboxes" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Allergies (tick all that apply)", ar: "الحساسية (حدّد كل ما ينطبق)" } }
            - { kind: check, selected: true, text: { en: "Penicillin", ar: "البنسلين" }, gap: xs }
            - { kind: check, selected: true, text: { en: "Nuts", ar: "المكسّرات" }, gap: xs }
            - { kind: check, text: { en: "Latex", ar: "اللاتكس" }, gap: xs }
      - id: select
        text: { en: "A dropdown", ar: "قائمة منسدلة" }
        mock:
          width: 300
          blocks:
            - { kind: select, label: { en: "Allergies", ar: "الحساسية" }, filled: true, text: { en: "Penicillin", ar: "البنسلين" } }
    answer: [check]
    misconceptions:
      - id: MC-P01-032
        when: [radio, select]
        feedback:
          en: "This control allows one answer. When Nour picks nuts, penicillin disappears, and the doctor never learns about it."
          ar: "هذا العنصر يسمح بإجابة واحدة. فحين تختار نور المكسّرات، يختفي البنسلين، ولا يعرف الطبيب به أبدًا."
    correct:
      en: "Any number of answers: checkboxes."
      ar: "أي عدد من الإجابات: Checkboxes."
    explain:
      en: "Each checkbox works on its own, so Nour can tick both allergies. The label \"tick all that apply\" removes any doubt."
      ar: "كل Checkbox يعمل وحده، فتستطيع نور تحديد نوعي الحساسية. وعبارة «حدّد كل ما ينطبق» تُزيل أي شك."

  - id: S06
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "Radio-button defaults (NN/g): a presumptuous or alienating choice is the most valid reason not to preselect. A guessed marital status is presumptuous, wrong for many, and easy to leave unchanged."
      ar: "الخيار الافتراضي في الـ Radio buttons (NN/g): الاختيار المتسرّع في الافتراض أو المنفّر هو أقوى سبب لعدم التحديد المسبق. والحالة الاجتماعية المخمّنة افتراض متسرّع، وخاطئة لكثيرين، وسهل أن تُترك دون تغيير."
    ref: { url: "https://www.nngroup.com/articles/radio-buttons-default-selection/", quote: "This is probably the most valid reason for not selecting a radio button by default." }
    scenario:
      en: "The doctor needs Nour's marital status for some treatments. Most of the clinic's patients are married, so the form preselects \"Married\"."
      ar: "يحتاج الطبيب الحالة الاجتماعية لنور لبعض العلاجات. وأغلب مرضى العيادة متزوّجون، فيحدّد النموذج «متزوّج» مسبقًا."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &marnow
        - { kind: small, weight: bold, text: { en: "Marital status", ar: "الحالة الاجتماعية" } }
        - { kind: radio, selected: true, text: { en: "Married", ar: "متزوّج" }, gap: xs }
        - { kind: radio, text: { en: "Single", ar: "أعزب" }, gap: xs }
        - { kind: radio, text: { en: "Divorced", ar: "مطلّق" }, gap: xs }
        - { kind: radio, text: { en: "Widowed", ar: "أرمل" }, gap: xs }
    options:
      - id: none
        text: { en: "No option selected; she chooses", ar: "بلا خيار محدّد؛ وهي تختار" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Marital status", ar: "الحالة الاجتماعية" } }
            - { kind: radio, text: { en: "Married", ar: "متزوّج" }, gap: xs }
            - { kind: radio, text: { en: "Single", ar: "أعزب" }, gap: xs }
            - { kind: radio, text: { en: "Divorced", ar: "مطلّق" }, gap: xs }
            - { kind: radio, text: { en: "Widowed", ar: "أرمل" }, gap: xs }
      - id: keep
        text: { en: "Keep \"Married\" preselected; it's the most common", ar: "أبقِ «متزوّج» محدّدًا مسبقًا؛ فهو الأكثر شيوعًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *marnow
      - id: hide
        text: { en: "Move it into a dropdown, with \"Married\" showing", ar: "انقله إلى قائمة منسدلة، تظهر فيها «متزوّج»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: select, label: { en: "Marital status", ar: "الحالة الاجتماعية" }, filled: true, text: { en: "Married", ar: "متزوّج" } }
    answer: [none]
    misconceptions:
      - id: MC-P01-015
        when: [keep]
        feedback:
          en: "For a single patient in a hurry, \"Married\" stays and the doctor's record is wrong. A personal answer shouldn't start as a guess."
          ar: "إذا كان المريض أعزب ومستعجلًا، فستبقى «متزوّج» ويصبح سجل الطبيب خاطئًا. والإجابة الشخصية لا يجب أن تبدأ بتخمين."
      - id: MC-P01-015
        when: [hide]
        feedback:
          en: "Same guess, now harder to see: a filled dropdown looks already answered. People rarely open it to check."
          ar: "التخمين نفسه، لكنه الآن أصعب في الرؤية: القائمة المنسدلة الممتلئة تبدو مُجابة بالفعل. ونادرًا ما يفتحها الناس للتحقّق."
    correct:
      en: "Let her choose a personal answer."
      ar: "دعها تختار الإجابة الشخصية."
    explain:
      en: "A default is a suggestion, and people often keep suggestions. For something personal, no suggestion is the respectful and accurate choice."
      ar: "الخيار الافتراضي اقتراح، والناس كثيرًا ما يُبقون الاقتراحات. وفي الأمور الشخصية، عدم الاقتراح هو الخيار المحترم والدقيق."

  - id: S07
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S06: defaults aren't bad in general. Radio-button defaults (NN/g): select one by default in most cases. A common, harmless setting like reminder timing should start on the usual choice."
      ar: "مقارنة مع الخطوة 6: الخيار الافتراضي ليس سيئًا بشكل عام. الخيار الافتراضي في الـ Radio buttons (NN/g): حدّد خيارًا افتراضيًا في أغلب الحالات. والإعداد الشائع غير الضار، مثل توقيت التذكير، يجب أن يبدأ بالاختيار المعتاد."
    ref: { url: "https://www.nngroup.com/articles/radio-buttons-default-selection/", quote: "Select a single radio button by default in most cases." }
    scenario:
      en: "Nour turns reminders on. Almost everyone wants theirs one day before; either choice is easy to change later."
      ar: "تشغّل نور التذكيرات. وأغلب الناس يريدون التذكير قبل يوم؛ وأي اختيار سهل التغيير لاحقًا."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      mock:
        width: 300
        blocks:
          - { kind: small, weight: bold, text: { en: "Remind me", ar: "ذكّرني" } }
          - { kind: radio, text: { en: "1 day before", ar: "قبل الموعد بيوم" }, gap: xs }
          - { kind: radio, text: { en: "2 hours before", ar: "قبل الموعد بساعتين" }, gap: xs }
          - { kind: radio, text: { en: "Both", ar: "الاثنان" }, gap: xs }
    b:
      mock:
        width: 300
        blocks:
          - { kind: small, weight: bold, text: { en: "Remind me", ar: "ذكّرني" } }
          - { kind: radio, selected: true, text: { en: "1 day before", ar: "قبل الموعد بيوم" }, gap: xs }
          - { kind: radio, text: { en: "2 hours before", ar: "قبل الموعد بساعتين" }, gap: xs }
          - { kind: radio, text: { en: "Both", ar: "الاثنان" }, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is a default right here, but wrong for marital status?", ar: "لماذا يصحّ الخيار الافتراضي هنا، ويخطئ في الحالة الاجتماعية؟" }
      options:
        - { id: safe, text: { en: "It's the usual choice, and leaving it costs nothing", ar: "إنه الاختيار المعتاد، وتركه لا يكلّف شيئًا" } }
        - { id: always, text: { en: "Radio buttons always need a default", ar: "الـ Radio buttons تحتاج دائمًا خيارًا افتراضيًا" } }
        - { id: short, text: { en: "The list is shorter", ar: "القائمة أقصر" } }
      answer: [safe]
      misconceptions:
        - id: MC-P01-033
          when: [always, short]
          feedback:
            en: "Length and habit aren't the reason. It's about the cost of a wrong default: here it's a slightly early reminder; there it's a wrong medical record."
            ar: "الطول والعادة ليسا السبب. السبب هو كلفة الخيار الافتراضي الخاطئ: هنا تذكير أبكر قليلًا؛ وهناك سجل طبي خاطئ."
    misconceptions:
      - id: MC-P01-033
        when: [a]
        feedback:
          en: "A makes everyone choose, though nearly all pick \"1 day before\". With a safe, common answer, start there."
          ar: "A تجعل الجميع يختارون، مع أن أغلبهم يختار «قبل الموعد بيوم». ومع إجابة شائعة وآمنة، ابدأ بها."
    correct:
      en: "Common and harmless: preselect it."
      ar: "شائع وغير ضار: حدّده مسبقًا."
    explain:
      en: "Ask what happens if someone leaves the default. If the answer is \"nothing bad\", a default saves a step. If it's a wrong record, let them choose."
      ar: "اسأل ماذا يحدث إذا ترك أحد الخيار الافتراضي. إذا كانت الإجابة «لا شيء سيئ»، فالخيار الافتراضي يوفّر خطوة. وإذا كانت سجلًا خاطئًا، فدعه يختار."

  - id: S08
    type: tune
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Toggle switches (NN/g): a toggle inside a form that waits for a button leaves people unsure whether their choice took effect. Tamer's checkout only applies choices on Place order."
      ar: "حالة جديدة. مفاتيح التبديل (NN/g): الـ Toggle داخل نموذج ينتظر زرًا يترك الناس غير متأكّدين هل نُفّذ اختيارهم. وصفحة الدفع عند تامر تطبّق الاختيارات فقط عند «أكّد الطلب»."
    ref: { url: "https://www.nngroup.com/articles/toggle-switch-guidelines/", quote: "This scenario confuses users because they can’t be sure whether their toggle choice will take immediate effect." }
    scenario:
      en: "Tamer's checkout has a \"Leave it at the door\" switch above Place order. Nothing is sent to the driver until he places the order."
      ar: "في صفحة الدفع عند تامر مفتاح «اتركه عند الباب» فوق «أكّد الطلب». ولا يُرسل شيء للسائق حتى يؤكّد الطلب."
    prompt:
      en: "Try each control. Which one should ship?"
      ar: "جرّب كل عنصر. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &doornow
        - { kind: field, label: "@F2addr", filled: true, text: { en: "12 Nile St, 3rd floor", ar: "12 شارع النيل، الدور الثالث" } }
        - { kind: toggle, text: { en: "Leave it at the door", ar: "اتركه عند الباب" }, gap: m }
        - { kind: button, text: "@F2btn", gap: m }
    options:
      - id: select
        text: { en: "A dropdown: Yes / No", ar: "قائمة منسدلة: نعم / لا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: "@F2addr", filled: true, text: { en: "12 Nile St, 3rd floor", ar: "12 شارع النيل، الدور الثالث" } }
            - { kind: select, label: { en: "Leave it at the door?", ar: "تتركه عند الباب؟" }, text: { en: "Select…", ar: "اختر…" }, gap: m }
            - { kind: button, text: "@F2btn", gap: m }
      - id: keep
        text: { en: "Keep the switch", ar: "أبقِ المفتاح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *doornow
      - id: check
        text: { en: "A checkbox, sent with the order", ar: "Checkbox يُرسل مع الطلب" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: "@F2addr", filled: true, text: { en: "12 Nile St, 3rd floor", ar: "12 شارع النيل، الدور الثالث" } }
            - { kind: check, text: { en: "Leave it at the door", ar: "اتركه عند الباب" }, gap: m }
            - { kind: button, text: "@F2btn", gap: m }
    answer: [check]
    misconceptions:
      - id: MC-P01-018
        when: [keep]
        feedback:
          en: "Flipping the switch looks like it's done. Tamer might flip it, change his mind about ordering, and wonder whether the driver was told."
          ar: "تحريك المفتاح يبدو كأن الأمر تمّ. وقد يحرّكه تامر، ثم يغيّر رأيه في الطلب، ويتساءل هل أُبلغ السائق."
      - id: MC-P01-031
        when: [select]
        feedback:
          en: "A yes/no hidden in a dropdown takes two taps and hides the choice. One checkbox says it in one tap."
          ar: "سؤال نعم/لا مخفي في قائمة منسدلة يحتاج ضغطتين ويُخفي الاختيار. وCheckbox واحد يقولها بضغطة واحدة."
    correct:
      en: "Part of the order: a checkbox."
      ar: "جزء من الطلب: Checkbox."
    explain:
      en: "The choice only matters once he places the order, so it belongs with the order. A checkbox waits for the button, like the rest of the form."
      ar: "الاختيار لا يهم إلا عند تأكيد الطلب، فمكانه مع الطلب. والـ Checkbox ينتظر الزر، مثل باقي النموذج."

  - id: S09
    type: card
    part: recap
    icons: [form, list, clock, idea]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Toggle or checkbox:** used checkboxes in forms that wait for Save or a submit button.\n- **One of a few:** showed two choices as radio buttons, not a dropdown.\n- **Any number:** used checkboxes so every allergy reached the doctor.\n- **Personal answers:** left them unselected.\n- **Safe, common choices:** preselected them to save a step.\n\nNext lesson: typing, picking, and the controls in between."
      ar: "- **Toggle أم Checkbox:** استخدمت الـ Checkboxes في النماذج التي تنتظر «حفظ» أو زر إرسال.\n- **واحد من خيارات قليلة:** عرضت خيارين كـ Radio buttons، لا كقائمة منسدلة.\n- **أي عدد:** استخدمت الـ Checkboxes لتصل كل أنواع الحساسية إلى الطبيب.\n- **الإجابات الشخصية:** تركتها دون تحديد.\n- **الاختيارات الشائعة والآمنة:** حدّدتها مسبقًا لتوفير خطوة.\n\nالدرس التالي: الكتابة والاختيار والعناصر بينهما."
