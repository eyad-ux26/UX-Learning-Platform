          ar: "كلاهما ما زال يفترض أن للاسم جزأين. «Arjun Arjun» لن يطابق جواز السفر عند الباب، واسم العائلة الاختياري ما زال يسأل أي جزء يوضع أين. حقل واحد للاسم الكامل يناسب كل الأسماء."
