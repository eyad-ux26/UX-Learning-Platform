  # SK-P01-U01-07: accept numbers the way people write them
  - id: S13
    type: tune
    skill: SK-P01-U01-07
    part: retest
    value:
      en: "Re-test, international sites (NN/g): allow international phone numbers with a varying number of digits and a country code. A Saudi number is real and valid."
      ar: "إعادة اختبار، المواقع الدولية (NN/g): اسمح بأرقام الهواتف الدولية بعدد أرقام مختلف ومع مفتاح الدولة. الرقم السعودي رقم حقيقي وصالح."
    ref: { url: "https://www.nngroup.com/articles/international-sites-requirements/", quote: "For phone numbers, allow for international numbers containing a varying number of digits and a country code." }
    scenario:
      en: "Shereen lives in Riyadh and sends a gift to her mother in Cairo. She types her own mobile, ⁦+966 55 123 4567⁩, so the courier can reach her. The form only accepts 11 digits starting with 01."
      ar: "تعيش شيرين في الرياض وترسل هدية لأمها في القاهرة. تكتب رقم موبايلها ⁦+966 55 123 4567⁩، حتى يستطيع المندوب الوصول إليها. والنموذج يقبل فقط 11 رقمًا تبدأ بـ 01."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: title, text: &sh_t { en: "Sender's details", ar: "بيانات المرسِل" } }
        - { kind: field, tone: bad, label: &sh_p { en: "Your mobile *", ar: "موبايلك *" }, filled: true, text: "⁦+966 55 123 4567⁩", error: { en: "Enter a valid number.", ar: "أدخل رقمًا صالحًا." }, gap: m }
        - { kind: button, text: &sh_b { en: "Send gift", ar: "أرسل الهدية" }, gap: m }
    options:
      - id: hint
        text: { en: "Add a hint: \"Format: 01XXXXXXXXX\"", ar: "أضف تلميحًا: «الصيغة: 01XXXXXXXXX»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *sh_t }
            - { kind: field, label: *sh_p, text: "", hint: { en: "Format: 01XXXXXXXXX", ar: "الصيغة: 01XXXXXXXXX" }, gap: m }
            - { kind: button, text: *sh_b, gap: m }
      - id: egypt
        text: { en: "Add a country list with only Egypt in it", ar: "أضف قائمة دول فيها مصر فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *sh_t }
            - { kind: select, label: { en: "Country", ar: "الدولة" }, filled: true, text: { en: "Egypt (+20)", ar: "مصر (+20)" }, gap: m }
            - { kind: field, label: *sh_p, text: "", gap: s }
            - { kind: button, text: *sh_b, gap: m }
      - id: accept
        text: { en: "Accept any country code, spaces and length, and tidy it up behind the scenes", ar: "اقبل أي مفتاح دولة وأي مسافات وأي طول، ونظّم الرقم في الخلفية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *sh_t }
            - { kind: field, label: *sh_p, filled: true, text: "⁦+966 55 123 4567⁩", gap: m }
            - { kind: small, color: green, text: { en: "✓ Saudi Arabia number", ar: "✓ رقم من السعودية" }, gap: xs }
            - { kind: button, text: *sh_b, gap: m }
    answer: [accept]
    misconceptions:
      - id: MC-P01-007
        when: [hint, egypt]
        feedback:
          en: "Both still reject a real number. Shereen doesn't have an Egyptian mobile, so a hint or an Egypt-only list leaves her stuck. Accept the number she has."
          ar: "كلاهما ما زال يرفض رقمًا حقيقيًا. شيرين ليس لديها موبايل مصري، فالتلميح أو القائمة التي فيها مصر فقط يتركانها عالقة. اقبل الرقم الذي لديها."
    correct:
      en: "Right. Her real number works."
      ar: "صحيح. رقمها الحقيقي يعمل."
    explain:
      en: "Phone numbers vary by country in length and format. Accept the country code and spaces, and let the system store the number in the form it needs."
      ar: "تختلف أرقام الهواتف بين الدول في طولها وصيغتها. اقبل مفتاح الدولة والمسافات، ودع النظام يحفظ الرقم بالصيغة التي يحتاجها."

  - id: S14
    type: tune
    skill: SK-P01-U01-07
    part: retest
    value:
      en: "Re-test, mobile input checklist (NN/g): do you allow users to enter the number in whatever format they like? Dashes are a common way to write numbers; the system can remove them."
      ar: "إعادة اختبار، قائمة تحقّق حقول الهاتف (NN/g): هل تسمح للمستخدمين بإدخال الرقم بأي صيغة يحبّونها؟ الشَرطات طريقة شائعة لكتابة الأرقام؛ ويمكن للنظام حذفها."
    ref: { url: "https://www.nngroup.com/articles/mobile-input-checklist/", quote: "Do you allow users to enter it in whatever format they like?" }
    scenario:
      en: "Kamal books a car service. He types his mobile the way he always writes it, ⁦0100-123-4567⁩. The form rejects it because of the dashes."
      ar: "يحجز كمال صيانة لسيارته. يكتب رقم موبايله كما يكتبه دائمًا، ⁦0100-123-4567⁩. فيرفضه النموذج بسبب الشَرطات."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل حل. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: title, text: &km_t { en: "Book a service", ar: "احجز صيانة" } }
        - { kind: field, tone: bad, label: &km_p { en: "Mobile *", ar: "الموبايل *" }, filled: true, text: "⁦0100-123-4567⁩", error: { en: "Invalid number.", ar: "رقم غير صالح." }, gap: m }
        - { kind: button, text: &km_b { en: "Book", ar: "احجز" }, gap: m }
    options:
      - id: accept
        text: { en: "Accept dashes and spaces, and remove them behind the scenes", ar: "اقبل الشَرطات والمسافات، واحذفها في الخلفية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *km_t }
            - { kind: field, label: *km_p, filled: true, text: "⁦0100 123 4567⁩", gap: m }
            - { kind: button, text: *km_b, gap: m }
      - id: error
        text: { en: "Make the error clearer: \"Numbers only, no dashes or spaces\"", ar: "اجعل الخطأ أوضح: «أرقام فقط، بدون شَرطات أو مسافات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *km_t }
            - { kind: field, tone: bad, label: *km_p, filled: true, text: "⁦0100-123-4567⁩", error: { en: "Numbers only, no dashes or spaces.", ar: "أرقام فقط، بدون شَرطات أو مسافات." }, gap: m }
            - { kind: button, text: *km_b, gap: m }
      - id: boxes
        text: { en: "Split the field into three boxes of 4, 3 and 4 digits", ar: "قسّم الحقل إلى ثلاثة مربعات: 4 و3 و4 أرقام" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *km_t }
            - { kind: small, text: *km_p, gap: m }
            - kind: row
              gap: xs
              blocks:
                - { kind: field, text: "0100" }
                - { kind: field, text: "123" }
                - { kind: field, text: "4567" }
            - { kind: button, text: *km_b, gap: m }
    answer: [accept]
    misconceptions:
      - id: MC-P01-007
        when: [error, boxes]
        feedback:
          en: "Both make Kamal do the system's work: retype his number, or split it and jump between boxes. Paste or type it any way he likes, and clean it up in the code."
          ar: "كلاهما يجعل كمال يقوم بعمل النظام: يعيد كتابة رقمه، أو يقسّمه ويتنقّل بين المربعات. دعه يلصقه أو يكتبه بأي طريقة، ونظّفه في الكود."
    correct:
      en: "Right. The system tidies the number, not Kamal."
      ar: "صحيح. النظام هو من ينظّم الرقم، لا كمال."
    explain:
      en: "Dashes and spaces make numbers easier for people to read and check. Removing them is easy for the system, so there's no reason to reject them."
      ar: "الشَرطات والمسافات تجعل الأرقام أسهل في القراءة والمراجعة. وحذفها سهل على النظام، فلا سبب لرفضها."

  # SK-P01-U01-08: use labels and formats people understand
  - id: S15
    type: tune
    skill: SK-P01-U01-08
    part: retest
    value:
      en: "Re-test, cognitive load in forms (NN/g): form labels and instructions should be immediately understandable. Technical terms need a plain question, not a tooltip."
      ar: "إعادة اختبار، العبء الذهني في النماذج (NN/g): يجب أن تكون عناوين النموذج وتعليماته مفهومة فورًا. المصطلحات التقنية تحتاج سؤالًا بسيطًا، لا تلميحًا منبثقًا."
    ref: { url: "https://www.nngroup.com/articles/4-principles-reduce-cognitive-load/", quote: "Form labels and instructions should be immediately understandable." }
    scenario:
      en: "Afaf orders home internet. The form asks \"Line type: ADSL, VDSL or FTTH\". The company really needs to know if her building has a fibre box. Afaf has no idea what the letters mean."
      ar: "تطلب عفاف إنترنت منزليًا. النموذج يسأل «نوع الخط: ADSL أو VDSL أو FTTH». والشركة تحتاج فعلًا أن تعرف هل في عمارتها صندوق ألياف. وعفاف لا تعرف ماذا تعني هذه الحروف."
    prompt:
      en: "Try each version of the question. Which one should ship?"
      ar: "جرّب كل نسخة من السؤال. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: heading, text: &af_q { en: "Line type *", ar: "نوع الخط *" } }
        - { kind: radio, text: "ADSL", gap: s }
        - { kind: radio, text: "VDSL", gap: xs }
        - { kind: radio, text: "FTTH", gap: xs }
    options:
      - id: tooltip
        text: { en: "Keep the choices, and add an ⓘ with technical definitions", ar: "أبقِ الخيارات، وأضف ⓘ فيها تعريفات تقنية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Line type * ⓘ", ar: "نوع الخط * ⓘ" } }
            - { kind: small, color: muted, text: { en: "FTTH: fibre-to-the-home, GPON-based…", ar: "FTTH: ألياف حتى المنزل، تعتمد على GPON…" }, gap: xs }
            - { kind: radio, text: "ADSL", gap: s }
            - { kind: radio, text: "VDSL", gap: xs }
            - { kind: radio, text: "FTTH", gap: xs }
      - id: acronyms
        text: { en: "Spell out the full technical names of the three line types", ar: "اكتب الأسماء التقنية الكاملة لأنواع الخطوط الثلاثة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *af_q }
            - { kind: radio, text: "Asymmetric Digital Subscriber Line", gap: s }
            - { kind: radio, text: "Very-high-bit-rate DSL", gap: xs }
            - { kind: radio, text: "Fibre To The Home", gap: xs }
      - id: plain
        text: { en: "Ask in everyday words: \"Is there a fibre box in your building?\"", ar: "اسأل بكلمات يومية: «هل يوجد صندوق ألياف في عمارتك؟»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Is there a fibre box in your building? *", ar: "هل يوجد صندوق ألياف في عمارتك؟ *" } }
            - { kind: small, color: muted, text: { en: "A small white box near the entrance, often with the company's name.", ar: "صندوق أبيض صغير قرب المدخل، عليه اسم الشركة غالبًا." }, gap: xs }
            - { kind: radio, text: { en: "Yes", ar: "نعم" }, gap: s }
            - { kind: radio, text: { en: "No", ar: "لا" }, gap: xs }
            - { kind: radio, text: { en: "I'm not sure", ar: "لست متأكّدة" }, gap: xs }
    answer: [plain]
    misconceptions:
      - id: MC-P01-008
        when: [tooltip, acronyms]
        feedback:
          en: "Longer technical words are still technical. Afaf can't tell which line she has, so she'll guess. Ask about the real need in words she uses."
          ar: "الكلمات التقنية الأطول ما زالت تقنية. لا تستطيع عفاف معرفة أي خط لديها، فستخمّن. اسأل عن الحاجة الحقيقية بكلمات تستخدمها."
    correct:
      en: "Right. A question Afaf can answer by looking."
      ar: "صحيح. سؤال تستطيع عفاف الإجابة عنه بالنظر."
    explain:
      en: "The company needs one fact: is fibre in the building? Asking that in plain words, with \"I'm not sure\", gets a true answer instead of a guess."
      ar: "الشركة تحتاج معلومة واحدة: هل الألياف موجودة في العمارة؟ السؤال عنها بكلمات بسيطة، مع «لست متأكّدة»، يأتي بإجابة صحيحة بدل التخمين."

  - id: S16
    type: tune
    skill: SK-P01-U01-08
    part: retest
    value:
      en: "Re-test, international sites (NN/g): for dates, always spell out the name of the month. 05/06 reads as May or June depending on where you're from."
      ar: "إعادة اختبار، المواقع الدولية (NN/g): في التواريخ، اكتب اسم الشهر دائمًا. 05/06 تُقرأ مايو أو يونيو حسب البلد الذي جئت منه."
    ref: { url: "https://www.nngroup.com/articles/international-sites-requirements/", quote: "For dates, the main guideline is: Always spell out the name of the month." }
    scenario:
      en: "Raouf books a visa appointment. The confirmation shows 05/06/2027. He isn't sure if it means 5 June or 6 May, and he can't afford to miss it."
      ar: "يحجز رؤوف موعدًا للتأشيرة. التأكيد يعرض 05/06/2027. وهو ليس متأكّدًا هل يعني 5 يونيو أم 6 مايو، ولا يستطيع أن يفوّته."
    prompt:
      en: "Try each way of showing the date. Which one should ship?"
      ar: "جرّب كل طريقة لعرض التاريخ. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: title, text: &ra_t { en: "Appointment booked", ar: "تم حجز الموعد" } }
        - { kind: meta, weight: bold, text: "05/06/2027 · 09:30", gap: s }
        - { kind: small, text: &ra_n { en: "Bring your passport and two photos.", ar: "أحضر جواز سفرك وصورتين." }, gap: s }
    options:
      - id: note
        text: { en: "Keep the numbers, and add \"Format: DD/MM/YYYY\" under it", ar: "أبقِ الأرقام، وأضف «الصيغة: يوم/شهر/سنة» تحته" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *ra_t }
            - { kind: meta, weight: bold, text: "05/06/2027 · 09:30", gap: s }
            - { kind: small, color: muted, text: { en: "Format: DD/MM/YYYY", ar: "الصيغة: يوم/شهر/سنة" }, gap: xs }
            - { kind: small, text: *ra_n, gap: s }
      - id: words
        text: { en: "Write the month as a word: Saturday 5 June 2027", ar: "اكتب الشهر بالكلمات: السبت 5 يونيو 2027" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *ra_t }
            - { kind: meta, weight: bold, text: { en: "Saturday 5 June 2027 · 09:30", ar: "السبت 5 يونيو 2027 · 09:30" }, gap: s }
            - { kind: small, text: *ra_n, gap: s }
      - id: iso
        text: { en: "Use the international format: 2027-06-05", ar: "استخدم الصيغة الدولية: 2027-06-05" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: *ra_t }
            - { kind: meta, weight: bold, text: "2027-06-05 · 09:30", gap: s }
            - { kind: small, text: *ra_n, gap: s }
    answer: [words]
    misconceptions:
      - id: MC-P01-030
        when: [note, iso]
        feedback:
          en: "Raouf still has to decode the numbers, and many people misread both formats. A month written as a word can't be confused."
          ar: "ما زال على رؤوف أن يفكّ الأرقام، وكثيرون يخطئون في قراءة الصيغتين. الشهر المكتوب بالكلمات لا يمكن الخلط فيه."
    correct:
      en: "Right. No one can misread June."
      ar: "صحيح. لا أحد يخطئ في قراءة يونيو."
    explain:
      en: "Day-month order differs between countries, so number-only dates are a guess. Writing the month, and the weekday too, makes the appointment impossible to misread."
      ar: "يختلف ترتيب اليوم والشهر بين الدول، فالتواريخ الرقمية فقط تخمين. كتابة الشهر، واليوم أيضًا، تجعل الموعد مستحيل الخطأ في قراءته."
