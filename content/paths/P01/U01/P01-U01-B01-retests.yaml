      ar: "يحجز أشرف تذاكر حفلة له ولصديق من الخارج. جواز سفر صديقه فيه اسم واحد فقط. والنموذج يطلب «الاسم الأول» و«اسم العائلة» لكل ضيف إلزاميًا."
    prompt:
      en: "Try each version of the guest form. Which one should ship?"
      ar: "جرّب كل نسخة من نموذج الضيوف. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: heading, text: &as_h { en: "Guest 2", ar: "الضيف 2" } }
        - { kind: field, label: { en: "First name *", ar: "الاسم الأول *" }, filled: true, text: "Arjun", gap: s }
        - { kind: field, tone: bad, label: { en: "Last name *", ar: "اسم العائلة *" }, text: "", error: { en: "Last name is required.", ar: "اسم العائلة إلزامي." }, gap: s }
    options:
      - id: optional
        text: { en: "Keep both fields, and make Last name optional", ar: "أبقِ الحقلين، واجعل اسم العائلة اختياريًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *as_h }
            - { kind: field, label: { en: "First name *", ar: "الاسم الأول *" }, filled: true, text: "Arjun", gap: s }
            - { kind: field, label: { en: "Last name (optional)", ar: "اسم العائلة (اختياري)" }, text: "", gap: s }
      - id: full
        text: { en: "One field: \"Full name, as on the passport\"", ar: "حقل واحد: «الاسم الكامل كما في جواز السفر»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *as_h }
            - { kind: field, label: { en: "Full name, as on the passport *", ar: "الاسم الكامل كما في جواز السفر *" }, filled: true, text: "Arjun", gap: s }
      - id: repeat
        text: { en: "Add a hint: \"Only one name? Type it in both fields\"", ar: "أضف تلميحًا: «لديك اسم واحد؟ اكتبه في الحقلين»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: *as_h }
            - { kind: field, label: { en: "First name *", ar: "الاسم الأول *" }, filled: true, text: "Arjun", gap: s }
            - { kind: field, label: { en: "Last name *", ar: "اسم العائلة *" }, filled: true, text: "Arjun", hint: { en: "Only one name? Type it in both fields.", ar: "لديك اسم واحد؟ اكتبه في الحقلين." }, gap: s }
    answer: [full]
    misconceptions:
