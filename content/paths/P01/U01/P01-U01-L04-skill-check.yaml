id: P01-U01-L04
mode: check
minutes: 7
title:
  en: "Skill check: ask only what you need"
  ar: "اختبار المهارة: اسأل فقط عمّا تحتاجه"
sources:
  - title: { en: "Less Effort, More Completion: The EAS Framework for Simplifying Forms (NN/g)", ar: "جهد أقل وإكمال أكثر: إطار EAS لتبسيط النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/"
  - title: { en: "Marking Required Fields in Forms (NN/g)", ar: "تمييز الحقول الإلزامية في النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/required-fields/"
  - title: { en: "Few Guesses, More Success: 4 Principles to Reduce Cognitive Load in Forms (NN/g)", ar: "تخمين أقل ونجاح أكثر: 4 مبادئ لتخفيف العبء الذهني في النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/4-principles-reduce-cognitive-load/"
  - title: { en: "International Sites: Minimum Requirements (NN/g)", ar: "المواقع الدولية: الحد الأدنى من المتطلبات (NN/g)" }
    url: "https://www.nngroup.com/articles/international-sites-requirements/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Samir's football camp form", ar: "نموذج معسكر كرة القدم لسمير" }
    body:
      en: "Samir wants to register his 9-year-old son, Youssef, for a summer football camp. The academy's form looks like this.\n\nYour job: help the academy fix it, one decision at a time.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "يريد سمير تسجيل ابنه يوسف، 9 سنوات، في معسكر صيفي لكرة القدم. ونموذج الأكاديمية يبدو هكذا.\n\nمهمّتك: ساعد الأكاديمية على إصلاحه، قرارًا بعد قرار.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks: &campfull
        - { kind: title, text: "@F3a" }
        - { kind: field, label: "@F3child", text: "", gap: m }
        - { kind: field, label: "@F3age", text: "", gap: s }
        - { kind: field, label: "@F3parent", text: "", gap: s }
        - { kind: field, label: "@F3med", text: "", gap: s }
        - { kind: field, label: "@F3school", text: "", gap: s }
        - { kind: field, label: "@F3income", text: "", gap: s }
        - { kind: field, label: "@F3photo", text: "", gap: s }
        - { kind: button, text: "@F3btn", gap: m }

  - id: S02
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, EAS framework (NN/g): ask whether each question is needed now. Income has no use; the school isn't used; the badge photo can wait until the first day."
      ar: "اختبار مهارة، إطار EAS (NN/g): اسأل هل كل سؤال مطلوب الآن. الدخل لا فائدة له؛ والمدرسة لا تُستخدم؛ وصورة البطاقة يمكن أن تنتظر حتى اليوم الأول."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "Do we need this information now?" }
    scenario:
      en: "To register, the academy needs to know who Youssef is, his age group, a parent to call, and any health needs. The badge photo is taken on the first day. Nothing uses the school or the income."
      ar: "لإتمام التسجيل، تحتاج الأكاديمية أن تعرف من هو يوسف، وفئته العمرية، ووليّ أمر للاتصال به، وأي احتياجات صحية. وصورة البطاقة تُلتقط في اليوم الأول. ولا شيء يستخدم المدرسة أو الدخل."
    prompt:
      en: "Try each version of the form. Which one should ship?"
      ar: "جرّب كل نسخة من النموذج. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: *campfull
    options:
      - id: optional
        text: { en: "Keep all seven; mark school, income and photo optional", ar: "أبقِ السبعة؛ واجعل المدرسة والدخل والصورة اختيارية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F3a" }
            - { kind: field, label: "@F3child", text: "", gap: m }
            - { kind: field, label: "@F3age", text: "", gap: s }
            - { kind: field, label: "@F3parent", text: "", gap: s }
            - { kind: field, label: "@F3med", text: "", gap: s }
            - { kind: field, label: { en: "School name (optional)", ar: "اسم المدرسة (اختياري)" }, text: "", gap: s }
            - { kind: field, label: { en: "Monthly family income (optional)", ar: "دخل الأسرة الشهري (اختياري)" }, text: "", gap: s }
            - { kind: field, label: { en: "Photo of the child (optional)", ar: "صورة الطفل (اختياري)" }, text: "", gap: s }
            - { kind: button, text: "@F3btn", gap: m }
      - id: income
        text: { en: "Remove the income only", ar: "احذف الدخل فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F3a" }
            - { kind: field, label: "@F3child", text: "", gap: m }
            - { kind: field, label: "@F3age", text: "", gap: s }
            - { kind: field, label: "@F3parent", text: "", gap: s }
            - { kind: field, label: "@F3med", text: "", gap: s }
            - { kind: field, label: "@F3school", text: "", gap: s }
            - { kind: field, label: "@F3photo", text: "", gap: s }
            - { kind: button, text: "@F3btn", gap: m }
      - id: needed
        text: { en: "Keep the four it needs now; the photo on day one", ar: "أبقِ الأربعة المطلوبة الآن؛ والصورة في اليوم الأول" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F3a" }
            - { kind: field, label: "@F3child", text: "", gap: m }
            - { kind: field, label: "@F3age", text: "", gap: s }
            - { kind: field, label: "@F3parent", text: "", gap: s }
            - { kind: field, label: "@F3med", text: "", gap: s }
            - { kind: button, text: "@F3btn", gap: m }
            - { kind: small, text: { en: "Day one: badge photo at the gate", ar: "اليوم الأول: صورة البطاقة عند البوابة" }, gap: l }
    answer: [needed]
    misconceptions:
      - id: MC-P01-005
        when: [optional]
        feedback:
          en: "Marked optional, they're still on the form, and many parents will fill them in just in case. Remove what has no use; move what can wait."
          ar: "حتى مع وسمها كاختيارية، ما زالت في النموذج، وسيملؤها كثير من الآباء احتياطًا. احذف ما لا فائدة له؛ وانقل ما يمكن أن ينتظر."
      - id: MC-P01-002
        when: [income]
        feedback:
          en: "A good start, but the school is never used, and the photo isn't needed until the first day. Ask only what registering needs."
          ar: "بداية جيدة، لكن المدرسة لا تُستخدم أبدًا، والصورة لا تلزم قبل اليوم الأول. اسأل فقط عمّا يحتاجه التسجيل."
    explain:
      en: "From Lesson 1: keep what the task needs now, move what can wait, and remove what nobody uses."
      ar: "من الدرس 1: أبقِ ما تحتاجه المهمة الآن، وانقل ما يمكن أن ينتظر، واحذف ما لا يستخدمه أحد."

  - id: S03
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, EAS framework (NN/g): a simple, clear explanation reassures people and builds trust. Health details are personal; say who sees them and why."
      ar: "اختبار مهارة، إطار EAS (NN/g): الشرح البسيط الواضح يطمئن الناس ويبني الثقة. والتفاصيل الصحية شخصية؛ فوضّح من يراها ولماذا."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "A simple, clear explanation reassures users, builds trust, and helps them understand the rationale behind each question." }
    scenario:
      en: "Youssef has a mild nut allergy. Samir isn't sure he wants to write it down for an academy he doesn't know yet."
      ar: "لدى يوسف حساسية خفيفة من المكسّرات. ولا يعرف سمير هل يريد كتابتها لأكاديمية لا يعرفها بعد."
    prompt:
      en: "Try each version of the health field. Which one should ship?"
      ar: "جرّب كل نسخة من حقل الصحة. أيّها يجب أن يُطلق؟"
    start: bare
    options:
      - id: why
        text: { en: "Say who sees it and what it's for", ar: "وضّح من يراه وما الغرض منه" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F3med", text: "", hint: { en: "Only Youssef's coaches see this, so they know what to do in an emergency.", ar: "لا يرى هذا إلا مدرّبو يوسف، ليعرفوا ماذا يفعلون في حالة طارئة." } }
      - id: bare
        text: { en: "Just the label", ar: "التسمية فقط" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F3med", text: "" }
      - id: legal
        text: { en: "Add \"We collect this as required by our policies\"", ar: "أضف «نجمع هذا وفقًا لسياساتنا»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F3med", text: "", hint: { en: "We collect this as required by our policies.", ar: "نجمع هذا وفقًا لسياساتنا." } }
    answer: [why]
    misconceptions:
      - id: MC-P01-027
        when: [bare]
        feedback:
          en: "Samir has to guess who reads it and why. A worried parent may leave it vague, which is the worst outcome for Youssef."
          ar: "على سمير أن يخمّن من يقرؤه ولماذا. والوالد القلق قد يكتبه بشكل مبهم، وهذه أسوأ نتيجة ليوسف."
      - id: MC-P01-027
        when: [legal]
        feedback:
          en: "That says the academy wants it, not why it helps Youssef. Name who sees it and what they'll do with it."
          ar: "هذا يقول إن الأكاديمية تريده، لا لماذا يساعد يوسف. اذكر من يراه وماذا سيفعل به."
    explain:
      en: "From Lesson 1: when you ask something personal, say why, right at the field."
      ar: "من الدرس 1: حين تسأل عن شيء شخصي، وضّح السبب، عند الحقل مباشرة."

  - id: S04
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, marking required fields (NN/g): mark every required field, and label the few optional ones. A note at the top is skipped or forgotten."
      ar: "اختبار مهارة، تمييز الحقول الإلزامية (NN/g): ميّز كل حقل إلزامي، وسمِّ القليل الاختياري. والملاحظة في الأعلى تُتخطّى أو تُنسى."
    ref: { url: "https://www.nngroup.com/articles/required-fields/", quote: "People don’t read instructions at the top of forms." }
    scenario:
      en: "After trimming, every field is required except a new one: \"What should the coaches call him?\""
      ar: "بعد الحذف، كل الحقول إلزامية إلا حقلًا جديدًا: «بماذا يناديه المدرّبون؟»"
    prompt:
      en: "Try each way of marking the form. Which one should ship?"
      ar: "جرّب كل طريقة لتمييز الحقول. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: field, label: "@F3child", text: "" }
        - { kind: field, label: "@F3age", text: "", gap: s }
        - { kind: field, label: "@F3parent", text: "", gap: s }
        - { kind: field, label: "@F3med", text: "", gap: s }
        - { kind: field, label: { en: "What should the coaches call him?", ar: "بماذا يناديه المدرّبون؟" }, text: "", gap: s }
    options:
      - id: note
        text: { en: "A note at the top: \"All fields required except the last\"", ar: "ملاحظة في الأعلى: «كل الحقول إلزامية ما عدا الأخير»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, text: { en: "All fields are required except the last one.", ar: "كل الحقول إلزامية ما عدا الأخير." } }
            - { kind: field, label: "@F3child", text: "", gap: s }
            - { kind: field, label: "@F3age", text: "", gap: s }
            - { kind: field, label: "@F3parent", text: "", gap: s }
            - { kind: field, label: "@F3med", text: "", gap: s }
            - { kind: field, label: { en: "What should the coaches call him?", ar: "بماذا يناديه المدرّبون؟" }, text: "", gap: s }
      - id: both
        text: { en: "A star on each required field, \"(optional)\" on the last", ar: "نجمة على كل حقل إلزامي، و«(اختياري)» على الأخير" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, text: { en: "* Required", ar: "* إلزامي" } }
            - { kind: field, label: { en: "Child's full name *", ar: "اسم الطفل الكامل *" }, text: "", gap: s }
            - { kind: field, label: { en: "Child's date of birth *", ar: "تاريخ ميلاد الطفل *" }, text: "", gap: s }
            - { kind: field, label: { en: "Parent's mobile number *", ar: "رقم موبايل وليّ الأمر *" }, text: "", gap: s }
            - { kind: field, label: { en: "Allergies or medical conditions *", ar: "حساسية أو حالات طبية *" }, text: "", gap: s }
            - { kind: field, label: { en: "What should the coaches call him? (optional)", ar: "بماذا يناديه المدرّبون؟ (اختياري)" }, text: "", gap: s }
      - id: optonly
        text: { en: "Only \"(optional)\" on the last field", ar: "«(اختياري)» على الحقل الأخير فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: "@F3child", text: "" }
            - { kind: field, label: "@F3age", text: "", gap: s }
            - { kind: field, label: "@F3parent", text: "", gap: s }
            - { kind: field, label: "@F3med", text: "", gap: s }
            - { kind: field, label: { en: "What should the coaches call him? (optional)", ar: "بماذا يناديه المدرّبون؟ (اختياري)" }, text: "", gap: s }
    answer: [both]
    misconceptions:
      - id: MC-P01-028
        when: [note]
        feedback:
          en: "Samir may skip the note, or forget it by the last field. Put the answer on each field."
          ar: "قد يتخطّى سمير الملاحظة، أو ينساها عند الحقل الأخير. ضع الإجابة عند كل حقل."
      - id: MC-P01-028
        when: [optonly]
        feedback:
          en: "Nothing tells Samir that the other four must be filled in. If he doesn't notice the word at the end, he guesses. Star the required ones too."
          ar: "لا شيء يخبر سمير أن الأربعة الأخرى يجب ملؤها. وإذا لم يلاحظ الكلمة في النهاية، فسيخمّن. ضع نجمة على الإلزامية أيضًا."
    explain:
      en: "From Lesson 2: a star on every required field, and \"(optional)\" on the ones people may skip."
      ar: "من الدرس 2: نجمة على كل حقل إلزامي، و«(اختياري)» على الحقول التي يمكن تخطّيها."

  - id: S05
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, cognitive load in forms (NN/g): communicate requirements and set expectations upfront. The coaches only use the nickname if a parent gives one, so the check is wrong, not the label."
      ar: "اختبار مهارة، العبء الذهني في النماذج (NN/g): وضّح المتطلبات وحدّد التوقعات مسبقًا. والمدرّبون يستخدمون اسم الدلع فقط إذا أعطاه الوالد، فالتحقق هو الخطأ، لا التسمية."
    ref: { url: "https://www.nngroup.com/articles/4-principles-reduce-cognitive-load/", quote: "Communicate requirements and set expectations upfront." }
    scenario:
      en: "Samir leaves the nickname empty and presses Register. The coaches only use a nickname if a parent gives one."
      ar: "يترك سمير اسم الدلع فارغًا ويضغط «سجّل». والمدرّبون يستخدمون اسم الدلع فقط إذا أعطاه الوالد."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &nickerr
        - { kind: field, tone: bad, label: { en: "What should the coaches call him? (optional)", ar: "بماذا يناديه المدرّبون؟ (اختياري)" }, text: "", error: { en: "This field is required.", ar: "هذا الحقل إلزامي." } }
        - { kind: button, text: "@F3btn", gap: m }
    options:
      - id: star
        text: { en: "Make the label required: add a star", ar: "اجعل التسمية إلزامية: أضف نجمة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "What should the coaches call him? *", ar: "بماذا يناديه المدرّبون؟ *" }, text: "" }
            - { kind: button, text: "@F3btn", gap: m }
      - id: keep
        text: { en: "Keep it; the error explains what to do", ar: "أبقِه؛ فرسالة الخطأ توضّح ما يجب فعله" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *nickerr
      - id: check
        text: { en: "Fix the check so an empty nickname goes through", ar: "أصلِح التحقق ليمرّ اسم الدلع الفارغ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "What should the coaches call him? (optional)", ar: "بماذا يناديه المدرّبون؟ (اختياري)" }, text: "" }
            - { kind: button, text: "@F3btn", gap: m }
            - { kind: small, color: green, text: { en: "Youssef is registered!", ar: "تمّ تسجيل يوسف!" }, gap: s }
    answer: [check]
    misconceptions:
      - id: MC-P01-004
        when: [star]
        feedback:
          en: "The label and the check now agree, but every parent must invent a nickname the academy doesn't need. Fix the check."
          ar: "الآن تتّفق التسمية مع التحقق، لكن على كل والد أن يخترع اسم دلع لا تحتاجه الأكاديمية. أصلِح التحقق."
      - id: MC-P01-004
        when: [keep]
        feedback:
          en: "The label said he could skip it, and the form punished him for trusting it. Make them agree."
          ar: "قالت التسمية إنه يستطيع تخطّيه، ثم عاقبه النموذج لأنه صدّقها. اجعلهما يتّفقان."
    explain:
      en: "From Lesson 2: decide what the task needs, then make the label and the check say the same thing."
      ar: "من الدرس 2: قرّر ما تحتاجه المهمة، ثم اجعل التسمية والتحقق يقولان الشيء نفسه."

  - id: S06
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, international sites (NN/g): separate first and last name fields are a prescription for confusion. One full-name field fits every family."
      ar: "اختبار مهارة، المواقع الدولية (NN/g): الحقول المنفصلة للاسم الأول واسم العائلة وصفة للارتباك. وحقل واحد للاسم الكامل يناسب كل عائلة."
    ref: { url: "https://www.nngroup.com/articles/international-sites-requirements/", quote: "Offering separate fields for first name and last name is a prescription for confusion." }
    scenario:
      en: "The developer wants to split the child's name so the system can sort by family name."
      ar: "يريد المطوّر تقسيم اسم الطفل ليتمكّن النظام من الترتيب حسب اسم العائلة."
    prompt:
      en: "Try each way of asking for Youssef's name. Which one should ship?"
      ar: "جرّب كل طريقة لطلب اسم يوسف. أيّها يجب أن تُطلق؟"
    start: split
    options:
      - id: one
        text: { en: "One field: \"Child's full name, as on his birth certificate\"", ar: "حقل واحد: «اسم الطفل الكامل، كما في شهادة الميلاد»" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Child's full name, as on his birth certificate *", ar: "اسم الطفل الكامل، كما في شهادة الميلاد *" }, filled: true, text: { en: "Youssef Samir Abdelaziz Farid", ar: "يوسف سمير عبد العزيز فريد" } }
      - id: split
        text: { en: "Two fields: first name and last name", ar: "حقلان: الاسم الأول واسم العائلة" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Child's first name *", ar: "الاسم الأول للطفل *" }, text: "" }
            - { kind: field, label: { en: "Child's last name *", ar: "اسم عائلة الطفل *" }, text: "", gap: s }
      - id: three
        text: { en: "Three fields: name, father's name, family name", ar: "ثلاثة حقول: الاسم، اسم الأب، اسم العائلة" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: { en: "Child's name *", ar: "اسم الطفل *" }, text: "" }
            - { kind: field, label: { en: "Father's name *", ar: "اسم الأب *" }, text: "", gap: s }
            - { kind: field, label: { en: "Family name *", ar: "اسم العائلة *" }, text: "", gap: s }
    answer: [one]
    misconceptions:
      - id: MC-P01-006
        when: [split]
        feedback:
          en: "Samir has to decide where \"Samir Abdelaziz\" goes, and the next family's names won't fit two boxes either. One field."
          ar: "على سمير أن يقرّر أين يكتب «سمير عبد العزيز»، وأسماء العائلة التالية لن تناسب خانتين أيضًا. حقل واحد."
      - id: MC-P01-006
        when: [three]
        feedback:
          en: "This fits some families and fails others. Names don't share one structure; let each family type theirs."
          ar: "هذا يناسب بعض العائلات ويفشل مع غيرها. الأسماء ليس لها بنية واحدة؛ فدع كل عائلة تكتب اسمها."
    explain:
      en: "From Lesson 3: one full-name field, typed as on the official document, fits every naming pattern."
      ar: "من الدرس 3: حقل واحد للاسم الكامل، يُكتب كما في الوثيقة الرسمية، يناسب كل أنماط الأسماء."

  - id: S07
    type: tune
    part: check
    rules: [R19]
    value:
      en: "Skill check, international sites (NN/g): allow phone numbers with a country code and a varying number of digits. ⁦+20 10 1234 5678⁩ is the same number as ⁦010 1234 5678⁩."
      ar: "اختبار مهارة، المواقع الدولية (NN/g): اسمح بأرقام الهواتف مع رمز الدولة وبعدد أرقام متغيّر. والرقم ‎⁦+20 10 1234 5678⁩ هو نفسه ⁦010 1234 5678⁩."
    ref: { url: "https://www.nngroup.com/articles/international-sites-requirements/", quote: "For phone numbers, allow for international numbers containing a varying number of digits and a country code." }
    scenario:
      en: "Samir pastes his number from his contacts, with the country code. The form rejects it."
      ar: "يلصق سمير رقمه من جهات الاتصال، مع رمز الدولة. فيرفضه النموذج."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: field, tone: bad, label: "@F3parent", filled: true, text: "⁦+20 10 1234 5678⁩", error: { en: "Use 11 digits starting with 0.", ar: "استخدم 11 رقمًا تبدأ بـ 0." } }
    options:
      - id: hint
        text: { en: "Add a hint: \"Start with 0, no country code\"", ar: "أضف تلميحًا: «ابدأ بـ 0، بدون رمز الدولة»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: "@F3parent", text: "", hint: { en: "Start with 0, no country code, no spaces.", ar: "ابدأ بـ 0، بدون رمز الدولة، بدون مسافات." } }
      - id: accept
        text: { en: "Accept it with or without the country code and spaces", ar: "اقبله برمز الدولة أو بدونه، وبالمسافات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: "@F3parent", filled: true, text: "⁦+20 10 1234 5678⁩" }
            - { kind: small, color: green, text: { en: "✓ Saved", ar: "✓ تم الحفظ" }, gap: xs }
      - id: picker
        text: { en: "Split it: a country box and an 11-digit box", ar: "قسّمه: خانة للدولة وخانة من 11 رقمًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, text: "@F3parent" }
            - kind: row
              gap: s
              blocks:
                - { kind: field, text: "⁦+20⁩" }
                - { kind: field, tone: bad, filled: true, text: "⁦10 1234 5678⁩" }
            - { kind: small, color: red, text: { en: "Use 11 digits starting with 0.", ar: "استخدم 11 رقمًا تبدأ بـ 0." }, gap: xs }
    answer: [accept]
    misconceptions:
      - id: MC-P01-007
        when: [hint]
        feedback:
          en: "The number was right. Now Samir has to edit a pasted number by hand on his phone. Let the system tidy it."
          ar: "الرقم كان صحيحًا. والآن على سمير أن يعدّل رقمًا ملصوقًا بيده على هاتفه. دع النظام يرتّبه."
      - id: MC-P01-007
        when: [picker]
        feedback:
          en: "Splitting it still forces one exact shape, and his pasted number breaks again. Accept the number as people write it."
          ar: "التقسيم ما زال يفرض شكلًا واحدًا محدّدًا، فيفشل رقمه الملصوق مرة أخرى. اقبل الرقم كما يكتبه الناس."
    explain:
      en: "From Lesson 3: accept the formats people actually use, country codes included, and tidy them in the system."
      ar: "من الدرس 3: اقبل الصيغ التي يستخدمها الناس فعلًا، بما فيها رموز الدول، ورتّبها في النظام."
