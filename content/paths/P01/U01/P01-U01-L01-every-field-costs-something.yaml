id: P01-U01-L01
mode: lesson
minutes: 8
title:
  en: "Every field costs something"
  ar: "لكل حقل ثمن"
sources:
  - title: { en: "Less Effort, More Completion: The EAS Framework for Simplifying Forms (NN/g)", ar: "جهد أقل وإكمال أكثر: إطار EAS لتبسيط النماذج (NN/g)" }
    url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/"
  - title: { en: "Website Forms Usability: Top 10 Recommendations (NN/g)", ar: "سهولة استخدام النماذج: أهم 10 توصيات (NN/g)" }
    url: "https://www.nngroup.com/articles/web-form-design/"
review_labels:
  MC-P01-001: { en: "Ask for what the task needs now", ar: "اسأل عمّا تحتاجه المهمة الآن" }
  MC-P01-002: { en: "\"Might be useful later\" isn't a reason to ask", ar: "«قد يفيد لاحقًا» ليس سببًا للسؤال" }
  MC-P01-005: { en: "Many optional fields mean too many fields", ar: "كثرة الحقول الاختيارية تعني كثرة الحقول" }
  MC-P01-026: { en: "Shortest isn't the goal; essential is", ar: "الهدف ليس الأقصر؛ بل الضروري" }
  MC-P01-027: { en: "Say why you ask for personal details", ar: "وضّح لماذا تطلب المعلومات الشخصية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana wants to try a gym", ar: "هناء تريد تجربة نادٍ رياضي" }
    body:
      en: "Hana saw an offer for a free 3-day trial at a gym near her work. She taps \"Try it free\" on her phone during her lunch break.\n\nThis is the form she gets."
      ar: "رأت هناء عرضًا لتجربة مجانية لمدة 3 أيام في نادٍ رياضي قريب من عملها. ضغطت «جرّبه مجانًا» على هاتفها في استراحة الغداء.\n\nوهذا هو النموذج الذي ظهر لها."
    mock:
      width: 300
      blocks: &trialfull
        - { kind: title, text: "@F1a" }
        - { kind: field, label: "@F1name", text: "", gap: m }
        - { kind: field, label: "@F1phone", text: "", gap: s }
        - { kind: field, label: "@F1dob", text: "", gap: s }
        - { kind: field, label: "@F1gender", text: "", gap: s }
        - { kind: field, label: "@F1nid", text: "", gap: s }
        - { kind: field, label: "@F1addr", text: "", gap: s }
        - { kind: field, label: "@F1hear", text: "", gap: s }
        - { kind: button, text: "@F1btn", gap: m }

  - id: S02
    type: tune
    part: try
    rules: [R12]
    value:
      en: "Try first. EAS framework (NN/g): asking for unnecessary information adds effort and can make people question your intentions. A national ID for a free trial is the clearest case."
      ar: "جرّب أولًا. إطار EAS (NN/g): طلب معلومات غير ضرورية يزيد الجهد وقد يجعل الناس يشكّون في نواياك. والرقم القومي لتجربة مجانية أوضح مثال."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "Asking for unnecessary information increases user effort and can cause users to question your intentions." }
    prompt:
      en: "The gym can remove one field today. Try each one. Which should go first?"
      ar: "يستطيع النادي حذف حقل واحد اليوم. جرّب كل واحد. أيّها يجب أن يُحذف أولًا؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: *trialfull
    options:
      - id: phone
        text: { en: "Remove the mobile number", ar: "احذف رقم الموبايل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1dob", text: "", gap: s }
            - { kind: field, label: "@F1gender", text: "", gap: s }
            - { kind: field, label: "@F1nid", text: "", gap: s }
            - { kind: field, label: "@F1addr", text: "", gap: s }
            - { kind: field, label: "@F1hear", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
      - id: nid
        text: { en: "Remove the national ID number", ar: "احذف الرقم القومي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: field, label: "@F1dob", text: "", gap: s }
            - { kind: field, label: "@F1gender", text: "", gap: s }
            - { kind: field, label: "@F1addr", text: "", gap: s }
            - { kind: field, label: "@F1hear", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
      - id: name
        text: { en: "Remove the full name", ar: "احذف الاسم الكامل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1phone", text: "", gap: m }
            - { kind: field, label: "@F1dob", text: "", gap: s }
            - { kind: field, label: "@F1gender", text: "", gap: s }
            - { kind: field, label: "@F1nid", text: "", gap: s }
            - { kind: field, label: "@F1addr", text: "", gap: s }
            - { kind: field, label: "@F1hear", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
    answer: [nid]
    misconceptions:
      - id: MC-P01-001
        when: [phone, name]
        feedback:
          en: "The front desk needs to know who Hana is and how to reach her, so those fields earn their place. A national ID for a free 3-day trial is personal, and nothing explains why it's needed."
          ar: "يحتاج الاستقبال أن يعرف من هي هناء وكيف يتواصل معها، فهذان الحقلان لهما مكانهما. أما الرقم القومي لتجربة مجانية لثلاثة أيام فهو شخصي، ولا شيء يوضّح لماذا يُطلب."
    correct:
      en: "The national ID: personal, and the trial doesn't need it."
      ar: "الرقم القومي: شخصي، والتجربة لا تحتاجه."
    explain:
      en: "Every field costs time. A personal question the task doesn't explain also costs trust, and people start to wonder what the data is really for."
      ar: "كل حقل يكلّف وقتًا. والسؤال الشخصي الذي لا تبرّره المهمة يكلّف ثقة أيضًا، فيبدأ الناس في التساؤل عن الغرض الحقيقي من البيانات."

  - id: S03
    type: card
    part: concept
    icons: [target, clock, none, idea]
    title: { en: "A field is a question you make someone answer", ar: "الحقل سؤال تُلزم شخصًا بالإجابة عنه" }
    body:
      en: "Each field costs the person time, effort and a little trust. Forms that feel quick get finished. For every field, ask:\n\n- **Is it essential?** If the task can't happen without it, keep it.\n- **Is it needed now?** If it can wait until later, ask later.\n- **Will anyone use it?** If there's no clear use for the answer, don't ask.\n- **Is it personal?** Then say why you're asking and how you'll use it."
      ar: "كل حقل يكلّف الشخص وقتًا وجهدًا وقليلًا من الثقة. والنماذج التي تبدو سريعة تُكمَل. لكل حقل، اسأل:\n\n- **هل هو ضروري؟** إذا كانت المهمة لا تتم بدونه، فأبقِه.\n- **هل نحتاجه الآن؟** إذا كان يمكن أن ينتظر، فاسأل عنه لاحقًا.\n- **هل سيستخدمه أحد؟** إذا لم يكن للإجابة استخدام واضح، فلا تسأل.\n- **هل هو شخصي؟** فوضّح لماذا تسأل وكيف ستستخدمه."

  - id: S04
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "EAS framework (NN/g): not every question needs to be asked immediately. If it can wait, postpone it. Making questions optional still leaves them on the form."
      ar: "إطار EAS (NN/g): ليس كل سؤال يجب أن يُطرح فورًا. إذا كان يمكن أن ينتظر، فأجّله. وجعل الأسئلة اختيارية يُبقيها في النموذج رغم ذلك."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "If it can wait, postpone it." }
    scenario:
      en: "The gym does need Hana's national ID and date of birth, but only if she signs up as a member after the trial."
      ar: "يحتاج النادي فعلًا الرقم القومي وتاريخ ميلاد هناء، لكن فقط إذا اشتركت كعضو بعد التجربة."
    prompt:
      en: "Try each version of the trial form. Which one should ship?"
      ar: "جرّب كل نسخة من نموذج التجربة. أيّها يجب أن تُطلق؟"
    start: optional
    options:
      - id: later
        text: { en: "Ask for them on the membership form, if she joins", ar: "اسأل عنهما في نموذج الاشتراك، إن اشتركت" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
            - { kind: small, text: { en: "Membership form, later: national ID, date of birth", ar: "نموذج الاشتراك، لاحقًا: الرقم القومي، تاريخ الميلاد" }, gap: l }
      - id: optional
        text: { en: "Keep them on the trial form, marked optional", ar: "أبقِهما في نموذج التجربة، مع وسمهما بأنهما اختياريان" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: field, label: { en: "Date of birth (optional)", ar: "تاريخ الميلاد (اختياري)" }, text: "", gap: s }
            - { kind: field, label: { en: "National ID number (optional)", ar: "الرقم القومي (اختياري)" }, text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
      - id: now
        text: { en: "Keep them required on the trial form, so it's done once", ar: "أبقِهما إلزاميين في نموذج التجربة، لتنتهي منهما مرة واحدة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: field, label: "@F1dob", text: "", gap: s }
            - { kind: field, label: "@F1nid", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
    answer: [later]
    misconceptions:
      - id: MC-P01-005
        when: [optional]
        feedback:
          en: "Optional fields are still there to read and wonder about, and many people fill them in anyway, just in case. If it can wait, move it."
          ar: "الحقول الاختيارية ما زالت موجودة للقراءة والتفكير، وكثير من الناس يملؤونها على أي حال، احتياطًا. إذا كان يمكن أن ينتظر، فانقله."
      - id: MC-P01-001
        when: [now]
        feedback:
          en: "Most trial visitors never become members, so they'd all give a national ID for nothing. Ask the people who join, when they join."
          ar: "أغلب زوّار التجربة لا يصبحون أعضاء، فسيعطي كلهم رقمهم القومي بلا فائدة. اسأل من يشترك، حين يشترك."
    correct:
      en: "Ask at the moment it's needed."
      ar: "اسأل في اللحظة التي تحتاجه فيها."
    explain:
      en: "Moving a question to the right moment loses nothing. The people who join answer it then, and now they have a reason to."
      ar: "نقل السؤال إلى اللحظة المناسبة لا يُضيّع شيئًا. من يشترك سيجيب عنه حينها، ولديه الآن سبب لذلك."

  - id: S05
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "EAS framework (NN/g): start with the bare minimum needed at this stage, then gradually request more. Marketing's question can move after sign-up."
      ar: "إطار EAS (NN/g): ابدأ بأقل ما تحتاجه في هذه المرحلة، ثم اطلب المزيد تدريجيًا. وسؤال التسويق يمكن أن ينتقل إلى ما بعد التسجيل."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "Start by asking for the bare minimum needed at this stage, then gradually request more, to avoid overwhelming users upfront." }
    scenario:
      en: "Marketing wants to keep \"How did you hear about us?\" as a required field on the trial form. They do use the answers to plan their ads."
      ar: "يريد فريق التسويق إبقاء «كيف عرفت عنّا؟» حقلًا إلزاميًا في نموذج التجربة. وهم يستخدمون الإجابات فعلًا لتخطيط إعلاناتهم."
    prompt:
      en: "Try each option. Which one should ship?"
      ar: "جرّب كل خيار. أيّها يجب أن يُطلق؟"
    start: keep
    options:
      - id: keep
        text: { en: "Keep it required on the form", ar: "أبقِه إلزاميًا في النموذج" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: field, label: "@F1hear", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
      - id: delete
        text: { en: "Delete it and tell marketing no", ar: "احذفه وارفض طلب التسويق" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: "@F1a" }
            - { kind: field, label: "@F1name", text: "", gap: m }
            - { kind: field, label: "@F1phone", text: "", gap: s }
            - { kind: button, text: "@F1btn", gap: m }
            - { kind: small, text: { en: "Marketing gets no answers.", ar: "لا يحصل التسويق على أي إجابات." }, gap: l }
      - id: after
        text: { en: "Ask it after she's signed up, as an optional one-tap question", ar: "اسأل عنه بعد أن تسجّل، كسؤال اختياري بضغطة واحدة" }
        mock:
          width: 300
          blocks:
            - { kind: title, text: { en: "You're booked! See you tomorrow.", ar: "تمّ حجزك! نراك غدًا." } }
            - { kind: meta, text: { en: "One quick question, if you like: how did you hear about us?", ar: "سؤال سريع، إن أحببت: كيف عرفت عنّا؟" }, gap: m }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, text: { en: "Friend", ar: "صديق" } }
                - { kind: chip, text: { en: "Social media", ar: "مواقع التواصل" } }
                - { kind: chip, text: { en: "Walked past", ar: "مررت بالمكان" } }
    answer: [after]
    misconceptions:
      - id: MC-P01-001
        when: [keep]
        feedback:
          en: "The answer helps the gym, not Hana's sign-up. Required, it stands between her and her trial."
          ar: "الإجابة تفيد النادي، لا تسجيل هناء. وإذا كانت إلزامية، فهي تقف بينها وبين تجربتها."
      - id: MC-P01-002
        when: [delete]
        feedback:
          en: "Marketing really uses the answer, so deleting it loses something. Ask it at a better moment instead."
          ar: "التسويق يستخدم الإجابة فعلًا، فحذفها يُضيّع شيئًا. اسأل عنها في لحظة أفضل بدلًا من ذلك."
    correct:
      en: "The minimum first, the extra question after."
      ar: "الحد الأدنى أولًا، والسؤال الإضافي بعده."
    explain:
      en: "Hana's sign-up stays short, and marketing still gets answers from people who are happy to tap one."
      ar: "يبقى تسجيل هناء قصيرًا، ويحصل التسويق مع ذلك على إجابات من الناس الذين يسعدهم الضغط على واحدة."

  - id: S06
    type: tune
    part: guided
    rules: [R06, R15]
    value:
      en: "EAS framework (NN/g): people are more likely to finish a form when they understand how their data will be used. Explain personal fields at the field."
      ar: "إطار EAS (NN/g): يزيد احتمال إكمال الناس للنموذج حين يفهمون كيف ستُستخدم بياناتهم. وضّح سبب الحقول الشخصية عند الحقل نفسه."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "Users will be more likely to complete the form when they understand how their data will be used." }
    scenario:
      en: "The trial form now asks only for Hana's name and mobile number. She hesitates at the mobile: she doesn't want sales calls."
      ar: "نموذج التجربة يطلب الآن اسم هناء ورقم موبايلها فقط. لكنها تتردّد عند الموبايل: فهي لا تريد مكالمات بيع."
    prompt:
      en: "Try each version of the mobile field. Which one should ship?"
      ar: "جرّب كل نسخة من حقل الموبايل. أيّها يجب أن يُطلق؟"
    start: none
    options:
      - id: none
        text: { en: "Just the label", ar: "التسمية فقط" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F1phone", text: "" }
      - id: policy
        text: { en: "Add a link to the privacy policy at the bottom", ar: "أضف رابطًا لسياسة الخصوصية في الأسفل" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F1phone", text: "" }
            - { kind: button, text: "@F1btn", gap: m }
            - { kind: link, text: { en: "Privacy policy", ar: "سياسة الخصوصية" }, gap: s }
      - id: why
        text: { en: "Add a line that says what it's for", ar: "أضف سطرًا يوضّح الغرض منه" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: "@F1phone", text: "", hint: { en: "We'll text you once to confirm your visit. No marketing.", ar: "سنرسل لك رسالة واحدة لتأكيد زيارتك. بدون رسائل تسويقية." } }
    answer: [why]
    misconceptions:
      - id: MC-P01-027
        when: [none]
        feedback:
          en: "Hana has to guess what the number is for, and her guess is sales calls. Tell her, right at the field."
          ar: "على هناء أن تخمّن الغرض من الرقم، وتخمينها هو مكالمات البيع. أخبرها، عند الحقل مباشرة."
      - id: MC-P01-027
        when: [policy]
        feedback:
          en: "A policy link is useful, but few people open it at the moment they hesitate. One plain line at the field answers her worry."
          ar: "رابط السياسة مفيد، لكن قليلين يفتحونه في لحظة التردّد. وسطر واضح واحد عند الحقل يجيب عن قلقها."
    correct:
      en: "Say why, where the question is."
      ar: "وضّح السبب، حيث يوجد السؤال."
    explain:
      en: "A short reason at the field turns a worrying question into a fair one. It also stops you asking for things you can't explain."
      ar: "السبب القصير عند الحقل يحوّل السؤال المقلق إلى سؤال عادل. كما يمنعك من طلب أشياء لا تستطيع تبريرها."

  - id: S07
    type: compare
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02 to S05: cutting is not the goal in itself. EAS (NN/g): forms should ask only for essential information. A form that drops an essential field is short and broken."
      ar: "مقارنة مع الخطوات 2 إلى 5: الحذف ليس هدفًا في حدّ ذاته. EAS (NN/g): يجب أن تطلب النماذج المعلومات الضرورية فقط. والنموذج الذي يحذف حقلًا ضروريًا قصير ومعطّل."
    ref: { url: "https://www.nngroup.com/articles/eas-framework-simplify-forms/", quote: "Forms should only ask for essential information" }
    scenario:
      en: "Tamer is ordering lunch to his office. The team wants the checkout as short as possible."
      ar: "يطلب تامر غداءً إلى مكتبه. ويريد الفريق صفحة الدفع أقصر ما يمكن."
    prompt:
      en: "Which delivery form should ship?"
      ar: "أي نموذج توصيل يجب أن يُطلق؟"
    a:
      mock:
        width: 300
        blocks:
          - { kind: title, text: "@F2a" }
          - { kind: field, label: "@F2addr", text: "", gap: m }
          - { kind: button, text: "@F2btn", gap: m }
    b:
      mock:
        width: 300
        blocks:
          - { kind: title, text: "@F2a" }
          - { kind: field, label: "@F2addr", text: "", gap: m }
          - { kind: field, label: "@F2phone", text: "", gap: s }
          - { kind: field, label: { en: "Note for the driver (optional)", ar: "ملاحظة للسائق (اختياري)" }, text: "", gap: s }
          - { kind: button, text: "@F2btn", gap: m }
    answer: b
    reason:
      prompt: { en: "Why is the longer form better here?", ar: "لماذا النموذج الأطول أفضل هنا؟" }
      options:
        - { id: more, text: { en: "More fields look more professional", ar: "الحقول الأكثر تبدو أكثر احترافية" } }
        - { id: need, text: { en: "The driver needs a way to reach Tamer when he arrives", ar: "يحتاج السائق طريقة للوصول إلى تامر حين يصل" } }
        - { id: data, text: { en: "The restaurant gets more data", ar: "يحصل المطعم على بيانات أكثر" } }
      answer: [need]
      misconceptions:
        - id: MC-P01-026
          when: [more, data]
          feedback:
            en: "Neither is a reason to ask. The phone stays because the delivery fails without it."
            ar: "لا هذا ولا ذاك سبب للسؤال. يبقى الهاتف لأن التوصيل يفشل بدونه."
    misconceptions:
      - id: MC-P01-026
        when: [a]
        feedback:
          en: "A is shorter, but the driver can't call Tamer from the lobby, and the lunch goes cold. Keep what the task needs."
          ar: "A أقصر، لكن السائق لا يستطيع الاتصال بتامر من مدخل المبنى، فيبرد الغداء. أبقِ ما تحتاجه المهمة."
    correct:
      en: "Essential, not shortest."
      ar: "الضروري، لا الأقصر."
    explain:
      en: "Cut what the task doesn't use, and keep what it can't work without. The optional note stays because it's light and helps the driver."
      ar: "احذف ما لا تستخدمه المهمة، وأبقِ ما لا تعمل بدونه. والملاحظة الاختيارية تبقى لأنها خفيفة وتساعد السائق."

  - id: S08
    type: tune
    part: independent
    rules: [R14, R19]
    value:
      en: "New case. Forms usability (NN/g): first, eliminate as many optional fields as possible. A job title has no use in a lunch order, and a birthday belongs where people share extras."
      ar: "حالة جديدة. سهولة استخدام النماذج (NN/g): أولًا، احذف أكبر عدد ممكن من الحقول الاختيارية. المسمّى الوظيفي لا فائدة له في طلب غداء، وعيد الميلاد مكانه حيث يشارك الناس الإضافات."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "First, eliminate as many optional fields as possible" }
    scenario:
      en: "The restaurant's form also asks Tamer for his job title, and his birthday \"for a gift\". Nothing in the delivery uses either one."
      ar: "يسأل نموذج المطعم تامر أيضًا عن مسمّاه الوظيفي، وعن عيد ميلاده «لهدية». ولا شيء في التوصيل يستخدم أيًّا منهما."
    prompt:
      en: "Try each fix. Which one should ship?"
      ar: "جرّب كل إصلاح. أيّها يجب أن يُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: title, text: "@F2a" }
        - { kind: field, label: "@F2addr", text: "", gap: m }
        - { kind: field, label: "@F2phone", text: "", gap: s }
        - { kind: field, label: "@F2job", text: "", gap: s }
        - { kind: field, label: "@F2bday", text: "", gap: s }
        - { kind: button, text: "@F2btn", gap: m }
    options:
      - id: optional
        text: { en: "Mark the job title and birthday as optional", ar: "اجعل المسمّى الوظيفي وعيد الميلاد اختياريين" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F2a" }
            - { kind: field, label: "@F2addr", text: "", gap: m }
            - { kind: field, label: "@F2phone", text: "", gap: s }
            - { kind: field, label: { en: "Job title (optional)", ar: "المسمّى الوظيفي (اختياري)" }, text: "", gap: s }
            - { kind: field, label: { en: "Your birthday, for a gift (optional)", ar: "عيد ميلادك، لهدية (اختياري)" }, text: "", gap: s }
            - { kind: button, text: "@F2btn", gap: m }
      - id: profile
        text: { en: "Remove the job title; offer the birthday in his profile", ar: "احذف المسمّى الوظيفي؛ واعرض عيد الميلاد في ملفه الشخصي" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F2a" }
            - { kind: field, label: "@F2addr", text: "", gap: m }
            - { kind: field, label: "@F2phone", text: "", gap: s }
            - { kind: button, text: "@F2btn", gap: m }
            - { kind: small, text: { en: "Profile, any time: \"Add your birthday and get a gift\"", ar: "الملف الشخصي، في أي وقت: «أضف عيد ميلادك واحصل على هدية»" }, gap: l }
      - id: bottom
        text: { en: "Move both below the Place order button", ar: "انقلهما أسفل زر «أكّد الطلب»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: "@F2a" }
            - { kind: field, label: "@F2addr", text: "", gap: m }
            - { kind: field, label: "@F2phone", text: "", gap: s }
            - { kind: button, text: "@F2btn", gap: m }
            - { kind: field, label: "@F2job", text: "", gap: m }
            - { kind: field, label: "@F2bday", text: "", gap: s }
    answer: [profile]
    misconceptions:
      - id: MC-P01-005
        when: [optional]
        feedback:
          en: "Now the order has two optional questions nobody needs for lunch. Remove what has no use, and move the extra to where it fits."
          ar: "الآن في الطلب سؤالان اختياريان لا يحتاجهما أحد للغداء. احذف ما لا فائدة له، وانقل الإضافة إلى المكان المناسب لها."
      - id: MC-P01-002
        when: [bottom]
        feedback:
          en: "They're still on the order form, and now in a confusing place: is the order placed or not? Take them off the order."
          ar: "ما زالا في نموذج الطلب، والآن في مكان مربك: هل تمّ الطلب أم لا؟ أخرِجهما من الطلب."
    correct:
      en: "The order stays about lunch."
      ar: "يبقى الطلب عن الغداء."
    explain:
      en: "No use, no field. And an extra that some people want, like a birthday gift, goes where they choose to share it."
      ar: "لا فائدة، لا حقل. والإضافة التي يريدها بعض الناس، مثل هدية عيد الميلاد، تذهب حيث يختارون مشاركتها."

  - id: S09
    type: card
    part: recap
    icons: [target, clock, none, idea]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Essential only:** removed the field the task didn't need.\n- **Ask later:** moved membership questions to the membership form.\n- **Minimum first:** asked marketing's question after sign-up.\n- **Say why:** explained the personal field at the field.\n- **Not just short:** kept the field the delivery can't work without.\n\nNext lesson: required or optional, and how to show it."
      ar: "- **الضروري فقط:** حذفت الحقل الذي لا تحتاجه المهمة.\n- **اسأل لاحقًا:** نقلت أسئلة الاشتراك إلى نموذج الاشتراك.\n- **الحد الأدنى أولًا:** طرحت سؤال التسويق بعد التسجيل.\n- **وضّح السبب:** شرحت الحقل الشخصي عند الحقل نفسه.\n- **ليس الأقصر فقط:** أبقيت الحقل الذي لا يعمل التوصيل بدونه.\n\nالدرس التالي: إلزامي أم اختياري، وكيف توضّح ذلك."
