id: P01-U01-L01
mode: lesson
minutes: 8
title:
  en: "Every field costs something"
  ar: "لكل حقل ثمن"
review_labels:
  MC-P01-001: { en: "Ask for what the task needs now", ar: "اسأل عمّا تحتاجه المهمة الآن" }
  MC-P01-002: { en: "\"Might be useful later\" isn't a reason to ask", ar: "«قد يفيد لاحقًا» ليس سببًا للسؤال" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana wants to try a gym", ar: "هناء تريد تجربة نادٍ رياضي" }
    body:
      en: "Hana saw an offer for a free 3-day trial at a gym near her work. She taps \"Try it free\" on her phone during her lunch break.\n\nThis is the form she gets."
      ar: "رأت هناء عرضًا لتجربة مجانية لمدة 3 أيام في نادٍ رياضي قريب من عملها. ضغطت «جرّبه مجانًا» على هاتفها في استراحة الغداء.\n\nوهذا هو النموذج الذي ظهر لها."
    mock:
      blocks:
        - { kind: title, text: "@F1a" }
        - { kind: field, label: "@F1name", text: "", gap: m }
        - { kind: field, label: "@F1phone", text: "", gap: s }
        - { kind: field, label: "@F1email", text: "", gap: s }
        - { kind: field, label: "@F1dob", text: "", gap: s }
        - { kind: field, label: "@F1gender", text: "", gap: s }
        - { kind: field, label: "@F1nid", text: "", gap: s }
        - { kind: field, label: "@F1addr", text: "", gap: s }
        - { kind: field, label: "@F1hear", text: "", gap: s }
        - { kind: button, text: "@F1btn", gap: m }

  - id: S02
    type: predict
    part: try
    any_ok: true
    rules: [R12]
    prompt:
      en: "Hana has ten minutes. What do you think she does?"
      ar: "لدى هناء عشر دقائق. ماذا تتوقّع أن تفعل؟"
    options:
      - { id: fill, text: { en: "Fills in all eight fields", ar: "تملأ الحقول الثمانية كلها" } }
      - { id: later, text: { en: "Decides to do it later", ar: "تقرّر أن تكمله لاحقًا" } }
      - { id: quit, text: { en: "Wonders why a free trial needs her national ID, and leaves", ar: "تتساءل لماذا تحتاج تجربة مجانية رقمها القومي، وتغادر" } }
    reveal:
      en: "Many people choose \"later\" and never come back, or leave when a question feels too personal for what they're doing. Every extra field is a reason to stop."
      ar: "كثيرون يختارون «لاحقًا» ولا يعودون أبدًا، أو يغادرون حين يبدو سؤال شخصيًا أكثر مما يتطلّبه ما يفعلونه. كل حقل إضافي سبب للتوقّف."

  - id: S03
    type: card
    part: concept
    title: { en: "A field is a question you make someone answer", ar: "الحقل سؤال تُلزم شخصًا بالإجابة عنه" }
    body:
      en: "Each field costs the person time, effort and a little trust. It's also one more place to make a mistake.\n\nFor every field, ask:\n- **Does this task need it now?** A free trial needs a way to identify Hana and reach her.\n- **Can it wait?** Some things only matter if she becomes a member.\n- **Will anyone use it?** If not, don't ask.\n\n\"It might be useful one day\" isn't a reason. Ask for it on the day it's useful, and tell people why."
      ar: "كل حقل يكلّف الشخص وقتًا وجهدًا وقليلًا من الثقة. وهو أيضًا مكان إضافي لارتكاب خطأ.\n\nلكل حقل، اسأل:\n- **هل تحتاجه هذه المهمة الآن؟** التجربة المجانية تحتاج طريقة للتعرّف على هناء والتواصل معها.\n- **هل يمكنه الانتظار؟** بعض الأشياء لا تهم إلا إذا أصبحت عضوًا.\n- **هل سيستخدمه أحد؟** إن لم يكن، فلا تسأل.\n\n«قد يفيد يومًا ما» ليس سببًا. اسأل عنه في اليوم الذي يفيد فيه، وأخبر الناس لماذا."

  - id: S04
    type: sort
    part: guided
    confidence: true
    rules: [R06, R15, U39]
    prompt:
      en: "For Hana's free trial, when should the gym ask for each one?"
      ar: "في تجربة هناء المجانية، متى يجب أن يسأل النادي عن كل منها؟"
    items:
      - { id: name, text: "@F1name" }
      - { id: nid, text: "@F1nid" }
      - { id: phone, text: "@F1phone" }
      - { id: addr, text: "@F1addr" }
      - { id: dob, text: "@F1dob" }
      - { id: gender, text: "@F1gender" }
    buckets:
      - { id: now, label: { en: "Ask now", ar: "اسأل الآن" } }
      - { id: later, label: { en: "Ask if she joins", ar: "اسأل إن اشتركت" } }
      - { id: never, label: { en: "Don't ask", ar: "لا تسأل" } }
    answer:
      now: [name, phone]
      later: [nid, dob]
      never: [addr, gender]
    also_ok:
      - answer: { now: [name, phone], later: [nid, dob, addr], never: [gender] }
        feedback:
          en: "That works too, if the membership contract needs an address."
          ar: "هذا يصلح أيضًا، إذا كان عقد الاشتراك يحتاج عنوانًا."
    misconceptions:
      - id: MC-P01-001
        when: { item: nid, bucket: now }
        feedback:
          en: "A free trial doesn't need her national ID. If the gym must record it, that's when she signs a membership."
          ar: "التجربة المجانية لا تحتاج رقمها القومي. إذا كان على النادي تسجيله، فذلك عند توقيع الاشتراك."
      - id: MC-P01-002
        when: { item: addr, bucket: now }
        feedback:
          en: "What would the gym do with her home address during a 3-day trial? If there's no answer, don't ask."
          ar: "ماذا سيفعل النادي بعنوان سكنها خلال تجربة 3 أيام؟ إذا لم توجد إجابة، فلا تسأل."
      - id: MC-P01-002
        when: { item: gender, bucket: now }
        feedback:
          en: "Nothing in the trial depends on it. If a women-only hour exists, ask about that choice directly."
          ar: "لا شيء في التجربة يعتمد عليه. وإذا وُجدت ساعات للسيدات فقط، فاسأل عن هذا الاختيار مباشرة."
    hints:
      - { en: "What does the front desk need when Hana arrives tomorrow?", ar: "ماذا يحتاج موظف الاستقبال حين تصل هناء غدًا؟" }
    correct:
      en: "Two fields now: who she is and how to reach her. The rest waits or goes."
      ar: "حقلان الآن: من هي وكيف يمكن الوصول إليها. والباقي ينتظر أو يُحذف."
    explain:
      en: "Moving questions to the moment they matter doesn't lose anything. People who join will answer them then, with a reason to."
      ar: "نقل الأسئلة إلى اللحظة التي تهم فيها لا يُضيّع شيئًا. من يشترك سيجيب عنها حينها، ولديه سبب لذلك."

  - id: S05
    type: choose
    part: guided
    rules: [R11, U39]
    prompt:
      en: "Marketing wants to keep \"How did you hear about us?\" as a required field. What's the best response?"
      ar: "يريد فريق التسويق إبقاء «كيف عرفت عنّا؟» حقلًا إلزاميًا. ما أفضل رد؟"
    options:
      - { id: after, text: { en: "Ask it after she's signed up, as an optional one-tap question", ar: "اسأل عنه بعد أن تسجّل، كسؤال اختياري بضغطة واحدة" } }
      - { id: keep, text: { en: "Keep it required; the data is valuable", ar: "أبقِه إلزاميًا؛ البيانات قيّمة" } }
      - { id: remove, text: { en: "Delete it and tell marketing no", ar: "احذفه وارفض طلب التسويق" } }
    answer: [after]
    misconceptions:
      - id: MC-P01-001
        when: [keep]
        feedback:
          en: "Valuable to the gym, not to Hana's task. A required question that isn't about her goal is a reason to leave."
          ar: "قيّمة للنادي، لا لمهمة هناء. والسؤال الإلزامي الذي لا يخص هدفها سبب للمغادرة."
    hints:
      - { en: "Can marketing still get an answer without blocking the sign-up?", ar: "هل يمكن للتسويق الحصول على إجابة دون أن يعطّل التسجيل؟" }
    correct:
      en: "Marketing still gets answers, and Hana's sign-up isn't blocked by them."
      ar: "يحصل التسويق على إجابات، ولا يتعطّل تسجيل هناء بسببها."
    explain:
      en: "Deleting it works too, but finding a better moment usually keeps everyone on board."
      ar: "الحذف يصلح أيضًا، لكن إيجاد لحظة أفضل غالبًا يُرضي الجميع."

  - id: S06
    type: compare
    part: contrast
    rules: [R11, U39]
    prompt:
      en: "Which trial form would you rather fill in on your lunch break?"
      ar: "أي نموذج تجربة تفضّل ملأه في استراحة الغداء؟"
    a:
      mock:
        blocks:
          - { kind: title, text: "@F1a" }
          - { kind: field, label: "@F1name", text: "", gap: m }
          - { kind: field, label: "@F1phone", text: "", gap: s }
          - { kind: field, label: "@F1dob", text: "", gap: s }
          - { kind: field, label: "@F1nid", text: "", gap: s }
          - { kind: field, label: "@F1addr", text: "", gap: s }
          - { kind: button, text: "@F1btn", gap: m }
    b:
      mock:
        blocks:
          - { kind: title, text: "@F1a" }
          - { kind: field, label: "@F1name", text: "", gap: m }
          - { kind: field, label: "@F1phone", text: "", hint: { en: "We'll text you to confirm. No marketing.", ar: "سنرسل لك رسالة للتأكيد. بدون رسائل تسويقية." }, gap: s }
          - { kind: button, text: "@F1btn", gap: m }
    answer: b
    misconceptions:
      - id: MC-P01-001
        when: [a]
        feedback:
          en: "A asks for five things, three of which the trial doesn't use. B asks for two and says why it needs the phone."
          ar: "A تطلب خمسة أشياء، ثلاثة منها لا تستخدمها التجربة. أما B فتطلب اثنين وتوضّح لماذا تحتاج الهاتف."
    reason:
      prompt: { en: "What else makes B better?", ar: "ما الذي يجعل B أفضل أيضًا؟" }
      options:
        - { id: why, text: { en: "It says what the phone number is for", ar: "توضّح الغرض من رقم الهاتف" } }
        - { id: short, text: { en: "Short forms always look more modern", ar: "النماذج القصيرة تبدو أحدث دائمًا" } }
      answer: [why]
    correct:
      en: "Fewer questions, and the one personal detail comes with a reason."
      ar: "أسئلة أقل، والمعلومة الشخصية الوحيدة تأتي مع سببها."
    explain:
      en: "Saying why you ask builds trust, especially for phone numbers, which people protect from spam."
      ar: "توضيح سبب السؤال يبني الثقة، خاصة مع أرقام الهواتف التي يحميها الناس من الرسائل المزعجة."

  - id: S07
    type: spot
    part: independent
    rules: [R07, U39]
    prompt:
      en: "Tamer is ordering lunch to his office. Which field doesn't belong in this form?"
      ar: "يطلب تامر غداءً إلى مكتبه. أي حقل لا مكان له في هذا النموذج؟"
    mock:
      blocks:
        - { kind: title, text: "@F2a" }
        - { kind: field, label: "@F2addr", text: "", gap: m, region: addr }
        - { kind: field, label: "@F2phone", text: "", gap: s, region: phone }
        - { kind: field, label: "@F2job", text: "", gap: s, region: job }
        - { kind: field, label: "@F2note", text: "", gap: s, region: note }
        - { kind: button, text: "@F2btn", gap: m }
    regions:
      - { id: addr, label: "@F2addr" }
      - { id: phone, label: "@F2phone" }
      - { id: job, label: "@F2job" }
      - { id: note, label: "@F2note" }
    answer: [job]
    misconceptions:
      - id: MC-P01-001
        when: [addr, phone]
        feedback:
          en: "The driver needs that one to deliver. Look for the field nothing in the delivery uses."
          ar: "السائق يحتاج هذا ليوصل الطلب. ابحث عن الحقل الذي لا يستخدمه أي شيء في التوصيل."
      - id: MC-P01-001
        when: [note]
        feedback:
          en: "A note like \"3rd floor, ask for Tamer\" helps the driver. It just shouldn't be required."
          ar: "ملاحظة مثل «الطابق الثالث، اسأل عن تامر» تساعد السائق. لكن يجب ألا تكون إلزامية."
    hints:
      - { en: "Which one would the driver never look at?", ar: "أيّها لن ينظر إليه السائق أبدًا؟" }
    correct:
      en: "His job title doesn't help anyone deliver lunch."
      ar: "مسمّاه الوظيفي لا يساعد أحدًا على توصيل الغداء."
    explain:
      en: "Address and phone are needed. The note is useful but optional. The job title is data collection for its own sake."
      ar: "العنوان والهاتف ضروريان. والملاحظة مفيدة لكنها اختيارية. أما المسمّى الوظيفي فجمعُ بيانات لذاتها."

  - id: S08
    type: choose
    part: independent
    rules: [R07, U39]
    prompt:
      en: "The restaurant also wants \"Your birthday, for a gift\". Where does it fit best?"
      ar: "يريد المطعم أيضًا «عيد ميلادك، لهدية». أين يناسب أكثر؟"
    options:
      - { id: profile, text: { en: "In his profile, optional, whenever he likes", ar: "في ملفه الشخصي، اختياريًا، متى شاء" } }
      - { id: order, text: { en: "In the order form, required", ar: "في نموذج الطلب، إلزاميًا" } }
      - { id: orderopt, text: { en: "In the order form, optional", ar: "في نموذج الطلب، اختياريًا" } }
    answer: [profile]
    misconceptions:
      - id: MC-P01-001
        when: [order]
        feedback:
          en: "Tamer is hungry and wants his lunch. A required birthday blocks the order for a gift he didn't ask for."
          ar: "تامر جائع ويريد غداءه. وعيد الميلاد الإلزامي يعطّل الطلب من أجل هدية لم يطلبها."
      - id: MC-P01-002
        when: [orderopt]
        feedback:
          en: "Better, but it still adds a question to the order. The profile is where people go to share extras."
          ar: "أفضل، لكنه ما زال يضيف سؤالًا إلى الطلب. والملف الشخصي هو حيث يشارك الناس الإضافات."
    hints:
      - { en: "What is Tamer trying to do right now?", ar: "ماذا يحاول تامر أن يفعل الآن؟" }
    correct:
      en: "The order stays focused on lunch, and the gift is there if he wants it."
      ar: "يبقى الطلب مركّزًا على الغداء، والهدية موجودة إن أرادها."
    explain:
      en: "Same rule as the gym: ask when it matters to the person, not when it's convenient for the company."
      ar: "القاعدة نفسها في النادي: اسأل حين يهم الأمر الشخص، لا حين يناسب الشركة."

  - id: S09
    type: choose
    part: independent
    confidence: true
    multi: true
    rules: [R07, U39]
    prompt:
      en: "Which questions help you decide whether a field belongs? Pick all that apply."
      ar: "أي الأسئلة تساعدك على تقرير ما إذا كان الحقل في مكانه؟ اختر كل ما ينطبق."
    options:
      - { id: need, text: { en: "Does this task need it now?", ar: "هل تحتاجه هذه المهمة الآن؟" } }
      - { id: use, text: { en: "Who will use the answer, and for what?", ar: "من سيستخدم الإجابة، ولأي غرض؟" } }
      - { id: wait, text: { en: "Could we ask it later, when it matters?", ar: "هل يمكن أن نسأل عنه لاحقًا، حين يهم؟" } }
      - { id: maybe, text: { en: "Might it be useful one day?", ar: "هل قد يفيد يومًا ما؟" } }
    answer: [need, use, wait]
    misconceptions:
      - id: MC-P01-002
        when: [maybe]
        feedback:
          en: "Almost any data might be useful one day. That question lets every field in."
          ar: "أي بيانات تقريبًا قد تفيد يومًا ما. هذا السؤال يُدخل كل الحقول."
    hints:
      - { en: "Which question could justify any field at all?", ar: "أي سؤال يمكن أن يبرّر أي حقل على الإطلاق؟" }
    correct:
      en: "Need now, who uses it, and could it wait."
      ar: "الحاجة الآن، ومن يستخدمه، وهل يمكنه الانتظار."
    explain:
      en: "These three questions are your filter for every form in this path."
      ar: "هذه الأسئلة الثلاثة هي مصفاتك لكل نموذج في هذا المسار."

  - id: S10
    type: card
    part: recap
    title: { en: "What to remember", ar: "ما يجب تذكّره" }
    body:
      en: "- Every field costs time, effort and trust, and adds a chance to fail.\n- Ask what the task needs now. Move the rest to the moment it matters.\n- If no one will use the answer, don't ask.\n- When you ask for something personal, say why.\n\nNext: required or optional, and how to say which."
      ar: "- كل حقل يكلّف وقتًا وجهدًا وثقة، ويضيف فرصة للفشل.\n- اسأل عمّا تحتاجه المهمة الآن. وانقل الباقي إلى اللحظة التي يهم فيها.\n- إذا لم يستخدم أحد الإجابة، فلا تسأل.\n- حين تطلب شيئًا شخصيًا، وضّح السبب.\n\nالدرس التالي: إلزامي أم اختياري، وكيف توضّح ذلك."
