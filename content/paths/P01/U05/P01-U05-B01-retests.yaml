id: P01-U05-B01
mode: bank
title:
  en: "Re-tests: forms everyone can finish"
  ar: "إعادة اختبار: نماذج يستطيع الجميع إكمالها"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Keyboard-Only Navigation for Improved Accessibility (NN/g)", ar: "التنقّل بلوحة المفاتيح فقط لتحسين الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/keyboard-accessibility/"
  - title: { en: "Touch Targets on Touchscreens (NN/g)", ar: "أهداف اللمس على الشاشات التي تعمل باللمس (NN/g)" }
    url: "https://www.nngroup.com/articles/touch-target-size/"
  - title: { en: "Reset and Cancel Buttons (NN/g)", ar: "أزرار Reset وCancel (NN/g)" }
    url: "https://www.nngroup.com/articles/reset-and-cancel-buttons/"
steps:
  # SK-P01-U05-01: keep keyboard focus visible
  - id: S01
    type: tune
    skill: SK-P01-U05-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test, keyboard accessibility (NN/g): removing the keyboard focus indicator is catastrophic for keyboard users."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): حذف مؤشّر تركيز لوحة المفاتيح كارثة لمستخدميها."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "I manage the product for a food ordering site. To match the new brand, the team removed the focus ring from all fields. Raafat orders by keyboard and has tabbed into the delivery notes."
      ar: "أنا مدير المنتج لموقع طلب طعام. ولتتناسب مع الهوية الجديدة، حذف الفريق إطار التركيز من كل الحقول. ويطلب رأفت بلوحة المفاتيح، ووصل بـ Tab إلى ملاحظات التوصيل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: none
    options:
      - id: none
        text: { en: "Keep it: no focus ring", ar: "أبقِه: بلا إطار تركيز" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: &fo_a { en: "Address", ar: "العنوان" }, filled: true, text: { en: "18 Merghany St", ar: "18 شارع الميرغني" } }
            - { kind: field, label: &fo_n { en: "Notes for the driver", ar: "ملاحظات للسائق" }, text: "", gap: s }
            - { kind: button, text: &fo_b { en: "Place order", ar: "أكّد الطلب" }, gap: m }
      - id: ring
        text: { en: "Bring back a clear ring, in the brand color", ar: "أعِد إطارًا واضحًا، بلون الهوية" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *fo_a, filled: true, text: { en: "18 Merghany St", ar: "18 شارع الميرغني" } }
            - { kind: field, label: *fo_n, text: "", focus: true, gap: s }
            - { kind: button, text: *fo_b, gap: m }
      - id: cursor
        text: { en: "No ring; the blinking cursor is enough", ar: "بلا إطار؛ المؤشّر الوامض يكفي" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *fo_a, filled: true, text: { en: "18 Merghany St", ar: "18 شارع الميرغني" } }
            - { kind: field, label: *fo_n, text: "|", filled: true, gap: s }
            - { kind: button, text: *fo_b, gap: m }
    answer: [ring]
    misconceptions:
      - id: MC-P01-052
        when: [none, cursor]
        feedback:
          en: "A thin cursor is easy to miss, and buttons and links don't have one at all. When Raafat tabs to Place order, nothing would show it."
          ar: "المؤشّر الرفيع يسهل أن يفوت، والأزرار والروابط ليس فيها مؤشّر أصلًا. وحين يصل رأفت بـ Tab إلى «أكّد الطلب»، لن يظهر أي شيء."
    correct:
      en: "Right. The ring can match the brand and still be clear."
      ar: "صحيح. الإطار يمكن أن يناسب الهوية ويظل واضحًا."
    explain:
      en: "Restyle the focus ring if you want, but never remove it. It's the only way keyboard users see where they are."
      ar: "غيّر شكل إطار التركيز إن أردت، لكن لا تحذفه أبدًا. فهو الطريقة الوحيدة ليرى مستخدمو لوحة المفاتيح أين هم."

  - id: S02
    type: tune
    skill: SK-P01-U05-01
    part: retest
    speaker: hana
    value:
      en: "Re-test, keyboard accessibility (NN/g): losing the focus indicator is catastrophic. A ring the same color as the border is, in practice, no ring."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): فقدان مؤشّر التركيز كارثة. والإطار بلون الحدود نفسه هو عمليًا لا إطار."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "On my gym's site, the focused field's border turns from light grey to a slightly darker grey. Amal, who uses the keyboard, said she keeps losing her place."
      ar: "في موقع نادينا، يتحوّل إطار الحقل المُركَّز عليه من رمادي فاتح إلى رمادي أغمق قليلًا. وقالت آمال، التي تستخدم لوحة المفاتيح، إنها تفقد مكانها باستمرار."
    prompt:
      en: "Tab is on \"Preferred time\". Try each version. Which one should ship?"
      ar: "Tab الآن على «الوقت المفضّل». جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: grey
    options:
      - id: ring
        text: { en: "A thick ring in a strong color, with a small gap around the field", ar: "إطار عريض بلون قوي، مع مسافة صغيرة حول الحقل" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: &gy_c { en: "Class", ar: "الحصة" }, filled: true, text: { en: "Spinning", ar: "سبينينج" } }
            - { kind: field, label: &gy_t { en: "Preferred time", ar: "الوقت المفضّل" }, text: "", focus: true, gap: s }
      - id: grey
        text: { en: "Keep the slightly darker grey border", ar: "أبقِ الإطار الرمادي الأغمق قليلًا" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *gy_c, filled: true, text: { en: "Spinning", ar: "سبينينج" } }
            - { kind: field, label: *gy_t, text: "", gap: s }
      - id: labelbold
        text: { en: "Keep the border, and make the label bold", ar: "أبقِ الإطار، واجعل العنوان عريضًا" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *gy_c, filled: true, text: { en: "Spinning", ar: "سبينينج" } }
            - { kind: field, label: *gy_t, text: "", gap: s }
    answer: [ring]
    misconceptions:
      - id: MC-P01-052
        when: [grey, labelbold]
        feedback:
          en: "Look at the preview: can you tell which field Amal is in? Labels are already bold and the grey barely changes. Focus has to stand out."
          ar: "انظر إلى المعاينة: هل تعرف في أي حقل آمال؟ العناوين عريضة أصلًا، والرمادي بالكاد يتغيّر. والتركيز يجب أن يبرز."
    correct:
      en: "Right. You can spot it in a second."
      ar: "صحيح. تلاحظه في ثانية."
    explain:
      en: "A focus style only works if it's obvious at a glance: strong color, enough thickness, around the element itself."
      ar: "شكل التركيز لا ينجح إلا إن كان واضحًا بنظرة: لون قوي، وسُمك كافٍ، حول العنصر نفسه."

  # SK-P01-U05-02: make Tab follow the layout
  - id: S03
    type: tune
    skill: SK-P01-U05-02
    part: retest
    speaker: mona
    value:
      en: "Re-test, keyboard accessibility (NN/g): tab order is normally coded to reflect the layout, top to bottom. A newsletter box in the middle of the order breaks the path."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يُبرمَج عادةً ليعكس التخطيط، من أعلى إلى أسفل. ومربع النشرة البريدية في منتصف الترتيب يكسر المسار."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "My team designs a university's contact form. The footer's newsletter field sits at the bottom of the page, but Tab goes there right after the Name field. Osama typed his question into it."
      ar: "يصمّم فريقي نموذج التواصل لجامعة. وحقل النشرة البريدية في أسفل الصفحة، لكن Tab يذهب إليه بعد حقل الاسم مباشرة. فكتب أسامة سؤاله فيه."
    prompt:
      en: "Try each tab order. Which one should ship?"
      ar: "جرّب كل ترتيب لـ Tab. أيّها يجب أن يُطلق؟"
    start: jump
    options:
      - id: jump
        text: { en: "Keep it: Name, then the footer, then back up", ar: "أبقِه: الاسم، ثم أسفل الصفحة، ثم العودة لأعلى" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: &un_n { en: "Name", ar: "الاسم" }, text: "" }
            - { kind: field, label: &un_q { en: "Your question", ar: "سؤالك" }, text: "", gap: s }
            - { kind: button, text: &un_s { en: "Send", ar: "أرسل" }, gap: m }
            - { kind: divider, gap: l }
            - { kind: field, label: &un_e { en: "Newsletter email", ar: "بريد النشرة" }, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Name → Newsletter email → Your question → Send", ar: "ترتيب Tab: الاسم ← بريد النشرة ← سؤالك ← أرسل" }, gap: m }
      - id: page
        text: { en: "Top to bottom: the form, then the footer", ar: "من أعلى إلى أسفل: النموذج، ثم أسفل الصفحة" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *un_n, text: "" }
            - { kind: field, label: *un_q, text: "", gap: s }
            - { kind: button, text: *un_s, gap: m }
            - { kind: divider, gap: l }
            - { kind: field, label: *un_e, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Name → Your question → Send → Newsletter email", ar: "ترتيب Tab: الاسم ← سؤالك ← أرسل ← بريد النشرة" }, gap: m }
      - id: label
        text: { en: "Keep the order, and label the footer box more clearly", ar: "أبقِ الترتيب، وأوضح عنوان مربع الأسفل" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *un_n, text: "" }
            - { kind: field, label: *un_q, text: "", gap: s }
            - { kind: button, text: *un_s, gap: m }
            - { kind: divider, gap: l }
            - { kind: field, label: { en: "Newsletter email (not for questions)", ar: "بريد النشرة (ليس للأسئلة)" }, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Name → Newsletter email → Your question → Send", ar: "ترتيب Tab: الاسم ← بريد النشرة ← سؤالك ← أرسل" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [jump, label]
        feedback:
          en: "Osama follows Tab, not the page. A clearer label doesn't stop the jump. Make Tab go down the page in order."
          ar: "أسامة يتبع Tab، لا الصفحة. والعنوان الأوضح لا يمنع القفزة. اجعل Tab ينزل في الصفحة بالترتيب."
    correct:
      en: "Right. Tab now reads the page like Osama does."
      ar: "صحيح. Tab الآن يقرأ الصفحة كما يقرؤها أسامة."
    explain:
      en: "Tab should never jump to another part of the page and back. Match the order people see."
      ar: "يجب ألّا يقفز Tab إلى جزء آخر من الصفحة ثم يعود. طابِق الترتيب الذي يراه الناس."

  - id: S04
    type: tune
    skill: SK-P01-U05-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test, keyboard accessibility (NN/g): tab order is normally coded to reflect the layout. City first and street last is backwards from what the form shows."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يُبرمَج عادةً ليعكس التخطيط. والمدينة أولًا والشارع أخيرًا عكس ما يعرضه النموذج."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "My shop's address form shows Street, Building, then City. Tab goes City, Street, Building. Mervat typed her street name into City."
      ar: "نموذج العنوان في متجري يعرض الشارع، ثم العمارة، ثم المدينة. وTab يذهب: المدينة، الشارع، العمارة. فكتبت ميرفت اسم شارعها في المدينة."
    prompt:
      en: "Try each tab order. Which one should ship?"
      ar: "جرّب كل ترتيب لـ Tab. أيّها يجب أن يُطلق؟"
    start: city
    options:
      - id: move
        text: { en: "Move City to the top of the screen", ar: "انقل المدينة إلى أعلى الشاشة" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: &ad_c { en: "City", ar: "المدينة" }, text: "" }
            - { kind: field, label: &ad_s { en: "Street", ar: "الشارع" }, text: "", gap: s }
            - { kind: field, label: &ad_b { en: "Building", ar: "العمارة" }, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: City → Street → Building", ar: "ترتيب Tab: المدينة ← الشارع ← العمارة" }, gap: m }
      - id: city
        text: { en: "Keep it: City first for Tab", ar: "أبقِه: المدينة أولًا في Tab" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *ad_s, text: "" }
            - { kind: field, label: *ad_b, text: "", gap: s }
            - { kind: field, label: *ad_c, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: City → Street → Building", ar: "ترتيب Tab: المدينة ← الشارع ← العمارة" }, gap: m }
      - id: page
        text: { en: "Fix the code: Street, Building, City", ar: "أصلح الكود: الشارع، العمارة، المدينة" }
        mock:
          width: 300
          blocks:
            - { kind: field, label: *ad_s, text: "" }
            - { kind: field, label: *ad_b, text: "", gap: s }
            - { kind: field, label: *ad_c, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Street → Building → City", ar: "ترتيب Tab: الشارع ← العمارة ← المدينة" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [city]
        feedback:
          en: "Mervat reads Street first and types it, but Tab put her in City. The order has to match the screen."
          ar: "تقرأ ميرفت «الشارع» أولًا فتكتبه، لكن Tab وضعها في المدينة. والترتيب يجب أن يطابق الشاشة."
      - id: MC-P01-053
        when: [move]
        feedback:
          en: "It matches, but the layout was fine. Changing the screen for everyone to hide a code problem is backwards. Fix the code."
          ar: "متطابق، لكن التخطيط كان سليمًا. وتغيير الشاشة للجميع لإخفاء مشكلة في الكود عكس المطلوب. أصلح الكود."
    correct:
      en: "Right. The screen stays, and Tab follows it."
      ar: "صحيح. الشاشة تبقى، وTab يتبعها."
    explain:
      en: "Decide the layout for people, then make the code follow it."
      ar: "حدّد التخطيط من أجل الناس، ثم اجعل الكود يتبعه."

  # SK-P01-U05-03: make every control reachable by keyboard
  - id: S05
    type: tune
    skill: SK-P01-U05-03
    part: retest
    speaker: rami
    value:
      en: "Re-test, keyboard accessibility (NN/g): using only HTML links, buttons and form fields makes sure every element can be tabbed to. Star pictures aren't any of those."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): استخدام روابط وأزرار وحقول HTML فقط يضمن أن يصل Tab إلى كل عنصر. وصور النجوم ليست منها."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Alternatively, using only HTML links, buttons, and form fields will ensure that all elements can be tabbed to." }
    scenario:
      en: "I'm designing the review form for a delivery app. The 5 stars are pictures with a click script. Bahaa rates by keyboard, and Tab skips the stars, so his review can't be sent."
      ar: "أصمّم نموذج التقييم لتطبيق توصيل. والنجوم الخمس صور مع كود للضغط. ويقيّم بهاء بلوحة المفاتيح، وTab يتخطّى النجوم، فلا يمكن إرسال تقييمه."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: pics
    options:
      - id: pics
        text: { en: "Keep the star pictures", ar: "أبقِ صور النجوم" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: &rv_h { en: "Rate your delivery", ar: "قيّم التوصيل" } }
            - { kind: heading, text: "☆ ☆ ☆ ☆ ☆", gap: xs }
            - { kind: small, color: brand, text: &rv_skip { en: "Tab goes: Comment → Send (stars skipped)", ar: "ترتيب Tab: تعليق ← أرسل (النجوم يتخطّاها)" }, gap: m }
      - id: bigger
        text: { en: "Make the stars bigger and yellow", ar: "اجعل النجوم أكبر وصفراء" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *rv_h }
            - { kind: title, color: orange, text: "☆ ☆ ☆ ☆ ☆", gap: xs }
            - { kind: small, color: brand, text: *rv_skip, gap: m }
      - id: radios
        text: { en: "Build the stars as 5 real radio buttons", ar: "ابنِ النجوم كـ 5 Radio buttons حقيقية" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *rv_h }
            - { kind: heading, text: "★ ★ ★ ★ ☆", gap: xs }
            - { kind: small, color: brand, text: { en: "Tab goes: Stars (arrows to choose 1 to 5) → Comment → Send", ar: "ترتيب Tab: النجوم (الأسهم للاختيار من 1 إلى 5) ← تعليق ← أرسل" }, gap: m }
    answer: [radios]
    misconceptions:
      - id: MC-P01-054
        when: [pics, bigger]
        feedback:
          en: "Bigger, brighter pictures are still pictures. Tab skips them, and Bahaa can't send a review."
          ar: "الصور الأكبر والأفتح ما زالت صورًا. وTab يتخطّاها، فلا يستطيع بهاء إرسال التقييم."
    correct:
      en: "Right. Same stars on screen, now on the Tab path."
      ar: "صحيح. النجوم نفسها على الشاشة، والآن في مسار Tab."
    explain:
      en: "Any clickable thing needs to be built from a real control. The look can stay the same."
      ar: "أي شيء قابل للضغط يجب أن يُبنى من عنصر حقيقي. ويمكن أن يبقى الشكل كما هو."

  - id: S06
    type: tune
    skill: SK-P01-U05-03
    part: retest
    speaker: nour
    value:
      en: "Re-test, keyboard accessibility (NN/g): keyboard users must be able to access all interactive elements. Doctor cards that only respond to a click lock them out of booking."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): يجب أن يصل مستخدمو لوحة المفاتيح إلى كل العناصر التفاعلية. وبطاقات الأطباء التي لا تستجيب إلا للضغط تمنعهم من الحجز."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Keyboard users must be able to access all interactive elements, not just the main navigation or in-line links." }
    scenario:
      en: "On my clinic's site, patients choose a doctor by clicking a card. The cards are plain boxes in the code. Medhat, who uses the keyboard, can't select any doctor."
      ar: "في موقع عيادتي، يختار المرضى الطبيب بالضغط على بطاقة. والبطاقات مربعات عادية في الكود. ومدحت، الذي يستخدم لوحة المفاتيح، لا يستطيع اختيار أي طبيب."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: cards
    options:
      - id: cards
        text: { en: "Keep the plain cards", ar: "أبقِ البطاقات العادية" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: small, weight: bold, text: &dr_1 { en: "Dr. Safaa Hamed · Skin", ar: "د. صفاء حامد · جلدية" } }
            - kind: group
              gap: s
              blocks:
                - { kind: small, weight: bold, text: &dr_2 { en: "Dr. Ayman Fouad · Bones", ar: "د. أيمن فؤاد · عظام" } }
            - { kind: small, color: brand, text: { en: "Tab goes: Book (cards skipped)", ar: "ترتيب Tab: احجز (البطاقات يتخطّاها)" }, gap: m }
      - id: hover
        text: { en: "Add a shadow when the mouse hovers", ar: "أضف ظلًّا حين يمرّ الماوس فوقها" }
        mock:
          width: 300
          blocks:
            - kind: group
              tone: tint
              blocks:
                - { kind: small, weight: bold, text: *dr_1 }
            - kind: group
              gap: s
              blocks:
                - { kind: small, weight: bold, text: *dr_2 }
            - { kind: small, color: brand, text: { en: "Tab goes: Book (cards skipped)", ar: "ترتيب Tab: احجز (البطاقات يتخطّاها)" }, gap: m }
      - id: radio
        text: { en: "Put a real radio button in each card", ar: "ضع Radio button حقيقيًا في كل بطاقة" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: radio, text: *dr_1 }
            - kind: group
              gap: s
              blocks:
                - { kind: radio, text: *dr_2 }
            - { kind: small, color: brand, text: { en: "Tab goes: Doctors (arrows to choose) → Book", ar: "ترتيب Tab: الأطباء (الأسهم للاختيار) ← احجز" }, gap: m }
    answer: [radio]
    misconceptions:
      - id: MC-P01-054
        when: [cards, hover]
        feedback:
          en: "A hover shadow helps mouse users only. Medhat still can't reach a card, so he can't choose a doctor."
          ar: "ظل المرور يساعد مستخدمي الماوس فقط. وما زال مدحت لا يصل إلى أي بطاقة، فلا يستطيع اختيار طبيب."
    correct:
      en: "Right. The cards keep their look and join the Tab path."
      ar: "صحيح. البطاقات تحتفظ بشكلها وتدخل مسار Tab."
    explain:
      en: "A choice people click must be a real control underneath: a radio, checkbox, button or link."
      ar: "الاختيار الذي يضغطه الناس يجب أن يكون عنصرًا حقيقيًا في الأساس: Radio أو Checkbox أو زر أو رابط."

  # SK-P01-U05-04: let people close pop-ups
  - id: S07
    type: tune
    skill: SK-P01-U05-04
    part: retest
    speaker: sara
    value:
      en: "Re-test, keyboard accessibility (NN/g): people must be able to close pop-ups, or they're stuck inside them."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): يجب أن يستطيع الناس إغلاق النوافذ المنبثقة، وإلا علقوا بداخلها."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "It is extremely important for users to be able to close pop-ups or they will be stuck inside them." }
    scenario:
      en: "I'm designing a furniture shop's product page. Tapping a photo opens it full screen. On a computer, it closes only by clicking the small × image. Lamia uses the keyboard and couldn't get back to the order form."
      ar: "أصمّم صفحة منتج لمتجر أثاث. الضغط على صورة يفتحها بملء الشاشة. وعلى الكمبيوتر، لا تُغلق إلا بالضغط على صورة × صغيرة. ولمياء تستخدم لوحة المفاتيح ولم تستطع العودة إلى نموذج الطلب."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: ximg
    options:
      - id: ximg
        text: { en: "Keep the × image", ar: "أبقِ صورة الـ ×" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: small, color: muted, text: "×" }
                - { kind: image, size: m, text: { en: "Sofa, side view", ar: "كنبة، منظر جانبي" }, gap: xs }
            - { kind: small, color: brand, text: { en: "Tab: nothing to reach (stuck)", ar: "Tab: لا شيء يصل إليه (عالقة)" }, gap: m }
      - id: close
        text: { en: "Make × a real Close button, and let Esc close it", ar: "اجعل × زر إغلاق حقيقيًا، ودع Esc يغلقها" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: button, style: plain, text: { en: "× Close", ar: "× إغلاق" } }
                - { kind: image, size: m, text: { en: "Sofa, side view", ar: "كنبة، منظر جانبي" }, gap: xs }
            - { kind: small, color: brand, text: { en: "Tab goes: Close. Esc closes it too, and focus returns to the photo.", ar: "ترتيب Tab: إغلاق. وEsc يغلقها أيضًا، ويعود التركيز إلى الصورة." }, gap: m }
      - id: big
        text: { en: "Make the × image bigger", ar: "كبّر صورة الـ ×" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: heading, text: "×" }
                - { kind: image, size: m, text: { en: "Sofa, side view", ar: "كنبة، منظر جانبي" }, gap: xs }
            - { kind: small, color: brand, text: { en: "Tab: nothing to reach (stuck)", ar: "Tab: لا شيء يصل إليه (عالقة)" }, gap: m }
    answer: [close]
    misconceptions:
      - id: MC-P01-055
        when: [ximg, big]
        feedback:
          en: "A bigger picture of an × is still a picture. Tab can't reach it, and Esc does nothing, so Lamia stays stuck."
          ar: "صورة الـ × الأكبر ما زالت صورة. لا يصل إليها Tab، وEsc لا يفعل شيئًا، فتبقى لمياء عالقة."
    correct:
      en: "Right. Two keyboard exits, and she's back at the photo."
      ar: "صحيح. مخرجان بلوحة المفاتيح، وتعود إلى الصورة."
    explain:
      en: "Every pop-up needs a real Close button and Esc, and should return focus to where it opened."
      ar: "كل نافذة منبثقة تحتاج زر إغلاق حقيقيًا وEsc، ويجب أن تُعيد التركيز إلى حيث فُتحت."

  - id: S08
    type: tune
    skill: SK-P01-U05-04
    part: retest
    speaker: karim
    value:
      en: "Re-test, keyboard accessibility (NN/g): people must be able to close pop-ups. A menu that closes only by swiping traps keyboard users."
      ar: "إعادة اختبار، الإتاحة بلوحة المفاتيح (NN/g): يجب أن يستطيع الناس إغلاق النوافذ المنبثقة. والقائمة التي لا تُغلق إلا بالسحب تحبس مستخدمي لوحة المفاتيح."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "It is extremely important for users to be able to close pop-ups or they will be stuck inside them." }
    scenario:
      en: "I'm building a pharmacy's web app. The side menu slides over the order form and closes only by swiping it away. Emad, on a tablet with a keyboard, opened it and couldn't close it."
      ar: "أبني تطبيق ويب لصيدلية. القائمة الجانبية تنزلق فوق نموذج الطلب، ولا تُغلق إلا بسحبها بعيدًا. وعماد، الذي يستخدم جهازًا لوحيًا مع لوحة مفاتيح، فتحها ولم يستطع إغلاقها."
    prompt:
      en: "Try each version of the menu. Which one should ship?"
      ar: "جرّب كل نسخة للقائمة. أيّها يجب أن تُطلق؟"
    start: swipe
    options:
      - id: swipe
        text: { en: "Keep it: swipe to close", ar: "أبقِه: اسحب للإغلاق" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: link, text: &mn_1 { en: "My orders", ar: "طلباتي" } }
                - { kind: link, text: &mn_2 { en: "Prescriptions", ar: "الروشتات" }, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: My orders → Prescriptions → My orders … (stuck)", ar: "ترتيب Tab: طلباتي ← الروشتات ← طلباتي … (عالق)" }, gap: m }
      - id: hint
        text: { en: "Keep swipe, and add \"Swipe left to close\"", ar: "أبقِ السحب، وأضف «اسحب للإغلاق»" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: small, color: muted, text: { en: "Swipe to close", ar: "اسحب للإغلاق" } }
                - { kind: link, text: *mn_1, gap: s }
                - { kind: link, text: *mn_2, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: My orders → Prescriptions → My orders … (stuck)", ar: "ترتيب Tab: طلباتي ← الروشتات ← طلباتي … (عالق)" }, gap: m }
      - id: close
        text: { en: "Add a Close button first in the menu, and let Esc close it", ar: "أضف زر إغلاق أولًا في القائمة، ودع Esc يغلقها" }
        mock:
          width: 300
          blocks:
            - kind: group
              blocks:
                - { kind: button, style: plain, text: { en: "Close menu", ar: "أغلق القائمة" } }
                - { kind: link, text: *mn_1, gap: xs }
                - { kind: link, text: *mn_2, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Close menu → My orders → Prescriptions. Esc closes it too.", ar: "ترتيب Tab: أغلق القائمة ← طلباتي ← الروشتات. وEsc يغلقها أيضًا." }, gap: m }
    answer: [close]
    misconceptions:
      - id: MC-P01-055
        when: [swipe, hint]
        feedback:
          en: "Swiping needs a touch screen. Emad is on the keyboard, so telling him to swipe doesn't help. Swipe can stay, as long as Close and Esc work too."
          ar: "السحب يحتاج شاشة لمس. وعماد يستخدم لوحة المفاتيح، فإخباره بالسحب لا يفيد. يمكن أن يبقى السحب، بشرط أن يعمل زر الإغلاق وEsc أيضًا."
    correct:
      en: "Right. Swipe for touch, Close and Esc for the keyboard."
      ar: "صحيح. السحب للمس، وزر الإغلاق وEsc للوحة المفاتيح."
    explain:
      en: "Gestures are extra ways out, never the only one. A Close button and Esc work for everyone."
      ar: "الإيماءات طرق إضافية للخروج، لا الطريقة الوحيدة أبدًا. وزر الإغلاق وEsc يعملان للجميع."

  # SK-P01-U05-05: make touch targets big and spaced
  - id: S09
    type: tune
    skill: SK-P01-U05-05
    part: retest
    speaker: tarek
    value:
      en: "Re-test, touch targets (NN/g): the minimum size should be 1 cm × 1 cm. Rating numbers 5 mm wide are half that."
      ar: "إعادة اختبار، أهداف اللمس (NN/g): الحد الأدنى للحجم 1 سم × 1 سم. وأرقام التقييم التي عرضها 5 مم نصف ذلك."
    ref: { url: "https://www.nngroup.com/articles/touch-target-size/", quote: "its minimum size should be 1cm × 1cm (0.4in x 0.4in)" }
    scenario:
      en: "I manage the product for a ride app. After each ride, people rate the driver from 1 to 5. Each number is about 5 mm wide. Hazem gave a driver 4 when he meant 5."
      ar: "أنا مدير المنتج لتطبيق مشاوير. بعد كل مشوار، يقيّم الناس السائق من 1 إلى 5. وعرض كل رقم نحو 5 مم. فأعطى حازم السائق 4 وهو يقصد 5."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: small
    options:
      - id: small
        text: { en: "Keep the small numbers", ar: "أبقِ الأرقام الصغيرة" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: &rd_h { en: "Rate your driver", ar: "قيّم السائق" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, tone: off, text: "1" }
                - { kind: chip, tone: off, text: "2" }
                - { kind: chip, tone: off, text: "3" }
                - { kind: chip, tone: off, text: "4" }
                - { kind: chip, tone: off, text: "5" }
      - id: big
        text: { en: "Make each number a button at least 1 cm wide and tall", ar: "اجعل كل رقم زرًا عرضه وارتفاعه 1 سم على الأقل" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *rd_h }
            - kind: row
              gap: s
              blocks:
                - { kind: button, emphasis: low, text: "1" }
                - { kind: button, emphasis: low, text: "2" }
                - { kind: button, emphasis: low, text: "3" }
                - { kind: button, emphasis: low, text: "4" }
                - { kind: button, emphasis: low, text: "5" }
      - id: confirm
        text: { en: "Keep them small, and ask \"Did you mean 4?\" after each tap", ar: "أبقِها صغيرة، واسأل «هل تقصد 4؟» بعد كل ضغطة" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *rd_h }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, tone: off, text: "1" }
                - { kind: chip, tone: off, text: "2" }
                - { kind: chip, tone: off, text: "3" }
                - { kind: chip, tone: dark, text: "4" }
                - { kind: chip, tone: off, text: "5" }
            - { kind: small, color: muted, text: { en: "Did you mean 4? Yes / No", ar: "هل تقصد 4؟ نعم / لا" }, gap: s }
    answer: [big]
    misconceptions:
      - id: MC-P01-056
        when: [small, confirm]
        feedback:
          en: "The numbers are still about 5 mm, so mis-taps keep happening. A question after every tap makes everyone pay for a target that's too small."
          ar: "الأرقام ما زالت نحو 5 مم، فتستمر الضغطات الخاطئة. والسؤال بعد كل ضغطة يجعل الجميع يدفع ثمن هدف صغير جدًا."
    correct:
      en: "Right. Each number now fits a fingertip."
      ar: "صحيح. كل رقم الآن يناسب طرف الإصبع."
    explain:
      en: "Fix the size of the target, not the consequences of missing it."
      ar: "أصلح حجم الهدف، لا عواقب إخطائه."

  - id: S10
    type: tune
    skill: SK-P01-U05-05
    part: retest
    speaker: hana
    value:
      en: "Re-test, touch targets (NN/g): to avoid accidental taps, targets must be big enough and also spaced well enough."
      ar: "إعادة اختبار، أهداف اللمس (NN/g): لتجنّب الضغطات العرضية، يجب أن تكون الأهداف كبيرة بما يكفي ومتباعدة بما يكفي أيضًا."
    ref: { url: "https://www.nngroup.com/articles/touch-target-size/", quote: "To avoid accidental taps, targets must first be big enough, and then also spaced well enough" }
    scenario:
      en: "In my gym's app, members pick their training days from 7 checkboxes in one tight row. Nevine ticked Wednesday every time she meant Thursday."
      ar: "في تطبيق نادينا، يختار الأعضاء أيام التمرين من 7 خانات اختيار في صف واحد ضيق. وكانت نيفين تعلّم الأربعاء كل مرة تقصد فيها الخميس."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: row
    options:
      - id: row
        text: { en: "Keep the 7 boxes in one tight row", ar: "أبقِ الخانات السبع في صف واحد ضيق" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: &dy_h { en: "Training days", ar: "أيام التمرين" } }
            - { kind: small, text: { en: "☐Sa ☐Su ☐Mo ☐Tu ☐We ☐Th ☐Fr", ar: "☐سبت ☐أحد ☐اثنين ☐ثلاثاء ☐أربعاء ☐خميس ☐جمعة" }, gap: xs }
      - id: list
        text: { en: "One full-width row per day, each at least 1 cm tall, with space between", ar: "صف بعرض الشاشة لكل يوم، ارتفاعه 1 سم على الأقل، مع مسافات" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *dy_h }
            - { kind: check, text: { en: "Saturday", ar: "السبت" }, gap: s }
            - { kind: check, text: { en: "Sunday", ar: "الأحد" }, gap: m }
            - { kind: check, text: { en: "Monday", ar: "الاثنين" }, gap: m }
            - { kind: small, color: muted, text: { en: "…and 4 more days", ar: "…و4 أيام أخرى" }, gap: s }
      - id: letters
        text: { en: "Keep one row, with bigger letters", ar: "أبقِ صفًا واحدًا، بحروف أكبر" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *dy_h }
            - { kind: heading, text: { en: "☐Sa ☐Su ☐Mo ☐Tu ☐We ☐Th ☐Fr", ar: "☐سبت ☐أحد ☐اثنين ☐ثلاثاء ☐أربعاء ☐خميس ☐جمعة" }, gap: xs }
    answer: [list]
    misconceptions:
      - id: MC-P01-056
        when: [row, letters]
        feedback:
          en: "Seven boxes squeezed into one phone row leave each one tiny and touching its neighbours. Bigger letters don't add space."
          ar: "سبع خانات محشورة في صف واحد على الهاتف تجعل كل واحدة صغيرة وملاصقة لجارتها. والحروف الأكبر لا تضيف مسافة."
    correct:
      en: "Right. Each day gets its own row, big and apart."
      ar: "صحيح. كل يوم له صفّه الخاص، كبير ومنفصل."
    explain:
      en: "When targets don't fit side by side at 1 cm each, stack them. Size first, then space."
      ar: "حين لا تتّسع الأهداف جنبًا إلى جنب بـ 1 سم لكل منها، رتّبها فوق بعضها. الحجم أولًا، ثم المسافة."

  # SK-P01-U05-06: don't put Clear next to Submit
  - id: S11
    type: tune
    skill: SK-P01-U05-06
    part: retest
    speaker: mona
    value:
      en: "Re-test, Reset and Cancel buttons (NN/g): people click Reset by mistake when they meant Submit."
      ar: "إعادة اختبار، أزرار Reset وCancel (NN/g): يضغط الناس Reset بالخطأ وهم يقصدون الإرسال."
    ref: { url: "https://www.nngroup.com/articles/reset-and-cancel-buttons/", quote: "The worst problem about Reset is that users click the button by mistake when they wanted to click Submit." }
    scenario:
      en: "My team designs a university's course survey with 20 questions. At the end, \"Reset answers\" sits beside \"Submit\". Some students submit empty surveys after hitting the wrong one."
      ar: "يصمّم فريقي استبيان مقررات لجامعة فيه 20 سؤالًا. وفي النهاية، «امسح الإجابات» بجوار «أرسل». وبعض الطلاب يرسلون استبيانات فارغة بعد ضغط الزر الخطأ."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: both
    options:
      - id: swap
        text: { en: "Keep both, but put Submit first", ar: "أبقِ الزرّين، لكن ضع «أرسل» أولًا" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: &sv_h { en: "20 of 20 answered", ar: "أُجيب 20 من 20" } }
            - kind: row
              gap: m
              blocks:
                - { kind: button, text: &sv_s { en: "Submit", ar: "أرسل" } }
                - { kind: button, emphasis: low, text: &sv_r { en: "Reset answers", ar: "امسح الإجابات" } }
      - id: none
        text: { en: "Remove \"Reset answers\"", ar: "احذف «امسح الإجابات»" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *sv_h }
            - { kind: button, text: *sv_s, gap: m }
      - id: both
        text: { en: "Keep \"Reset answers\" beside Submit", ar: "أبقِ «امسح الإجابات» بجوار «أرسل»" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *sv_h }
            - kind: row
              gap: m
              blocks:
                - { kind: button, emphasis: low, text: *sv_r }
                - { kind: button, text: *sv_s }
    answer: [none]
    misconceptions:
      - id: MC-P01-057
        when: [both, swap]
        feedback:
          en: "Swapping sides only changes which way the slip goes. As long as Reset sits next to Submit, 20 answers are one tap from gone."
          ar: "تبديل الأماكن يغيّر فقط اتجاه الزلّة. وطالما Reset بجوار «أرسل»، فالإجابات العشرون على بُعد ضغطة من الضياع."
    correct:
      en: "Right. Nothing next to Submit can wipe the survey."
      ar: "صحيح. لا شيء بجوار «أرسل» يمكن أن يمسح الاستبيان."
    explain:
      en: "Students change answers one question at a time. A button that erases all 20 isn't worth the risk."
      ar: "يغيّر الطلاب إجاباتهم سؤالًا سؤالًا. والزر الذي يمسح العشرين كلها لا يستحق المخاطرة."

  - id: S12
    type: tune
    skill: SK-P01-U05-06
    part: retest
    speaker: nour
    value:
      en: "Re-test, Reset and Cancel buttons (NN/g): people click Reset by mistake when they meant Submit. A Clear form button next to Save is the same risk."
      ar: "إعادة اختبار، أزرار Reset وCancel (NN/g): يضغط الناس Reset بالخطأ وهم يقصدون الإرسال. وزر «امسح النموذج» بجوار «احفظ» هو الخطر نفسه."
    ref: { url: "https://www.nngroup.com/articles/reset-and-cancel-buttons/", quote: "The worst problem about Reset is that users click the button by mistake when they wanted to click Submit." }
    scenario:
      en: "Our nurses fill in a long medical history form on a tablet for each new patient. \"Clear form\" sits right next to \"Save\". Nurse Sabah lost a 15-minute interview with Mr. Kamal."
      ar: "تملأ الممرّضات عندنا استمارة تاريخ مرضي طويلة على جهاز لوحي لكل مريض جديد. و«امسح النموذج» بجوار «احفظ» مباشرة. وفقدت الممرّضة صباح مقابلة استغرقت 15 دقيقة مع السيد كمال."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: both
    options:
      - id: both
        text: { en: "Keep \"Clear form\" beside Save", ar: "أبقِ «امسح النموذج» بجوار «احفظ»" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: &mh_h { en: "Medical history · Kamal Ragab", ar: "التاريخ المرضي · كمال رجب" } }
            - kind: row
              gap: m
              blocks:
                - { kind: button, emphasis: low, text: &mh_c { en: "Clear form", ar: "امسح النموذج" } }
                - { kind: button, text: &mh_s { en: "Save", ar: "احفظ" } }
      - id: danger
        text: { en: "Keep it, and make it red", ar: "أبقِه، واجعله أحمر" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *mh_h }
            - kind: row
              gap: m
              blocks:
                - { kind: button, style: danger, text: *mh_c }
                - { kind: button, text: *mh_s }
      - id: none
        text: { en: "Remove \"Clear form\"; keep only Save", ar: "احذف «امسح النموذج»؛ وأبقِ «احفظ» فقط" }
        mock:
          width: 300
          blocks:
            - { kind: small, weight: bold, text: *mh_h }
            - { kind: button, text: *mh_s, gap: m }
    answer: [none]
    misconceptions:
      - id: MC-P01-057
        when: [both, danger]
        feedback:
          en: "Red catches the eye but not the finger. Next to Save, one slip still loses a whole interview. Remove it."
          ar: "الأحمر يلفت العين لا الإصبع. وبجوار «احفظ»، تظل زلّة واحدة تُضيّع مقابلة كاملة. احذفه."
    correct:
      en: "Right. Save stands alone, and the interview is safe."
      ar: "صحيح. «احفظ» وحده، والمقابلة في أمان."
    explain:
      en: "The end of a long form is for saving the work. Nothing that wipes it belongs there."
      ar: "نهاية النموذج الطويل لحفظ العمل. ولا مكان هناك لأي شيء يمسحه."
