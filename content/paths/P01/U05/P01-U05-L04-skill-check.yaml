id: P01-U05-L04
mode: check
minutes: 7
title:
  en: "Skill check: forms everyone can finish"
  ar: "اختبار المهارة: نماذج يستطيع الجميع إكمالها"
summary:
  en: "Review a bus ticket form for keyboard, screen reader and touch users on your own."
  ar: "راجع بنفسك نموذج تذاكر حافلات لمستخدمي لوحة المفاتيح وقارئ الشاشة (Screen reader) واللمس."
speaker: sara
sources:
  - title: { en: "Keyboard-Only Navigation for Improved Accessibility (NN/g)", ar: "التنقّل بلوحة المفاتيح فقط لتحسين الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/keyboard-accessibility/"
  - title: { en: "Touch Targets on Touchscreens (NN/g)", ar: "أهداف اللمس على الشاشات التي تعمل باللمس (NN/g)" }
    url: "https://www.nngroup.com/articles/touch-target-size/"
  - title: { en: "Reset and Cancel Buttons (NN/g)", ar: "أزرار Reset وCancel (NN/g)" }
    url: "https://www.nngroup.com/articles/reset-and-cancel-buttons/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Ismail books a bus ticket", ar: "إسماعيل يحجز تذكرة حافلة" }
    body:
      en: "I'm reviewing a bus ticket booking form before it launches. Our tester Ismail is blind and uses a keyboard with a screen reader. Our second tester, Samah, tries the same form on her phone.\n\nBoth got stuck in different places. Your job: fix each one so both of them can finish.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "أراجع نموذج حجز تذاكر حافلات قبل إطلاقه. ومختبِرنا إسماعيل كفيف ويستخدم لوحة المفاتيح مع قارئ شاشة. والمختبرة الثانية، سماح، تجرّب النموذج نفسه على هاتفها.\n\nعلق كلاهما في أماكن مختلفة. مهمّتك: أصلح كل مشكلة ليُكمل الاثنان.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: rehla
      frame: wide
      url: rehla.example/search
      navbar:
        links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
        active: 0
      blocks:
        - { kind: field, label: { en: "From", ar: "من" }, filled: true, text: { en: "Cairo", ar: "القاهرة" } }
        - { kind: field, label: { en: "To", ar: "إلى" }, filled: true, text: { en: "Luxor", ar: "الأقصر" }, gap: s }
        - { kind: field, label: { en: "Date", ar: "التاريخ" }, text: "", gap: s }
        - { kind: button, text: { en: "Find buses", ar: "ابحث عن رحلات" }, gap: m }

  - id: S02
    type: tune
    skill: SK-P01-U05-01
    part: check
    rules: [R19]
    value:
      en: "Skill check, keyboard accessibility (NN/g): removing the focus indicator is catastrophic for keyboard users."
      ar: "اختبار مهارة، الإتاحة بلوحة المفاتيح (NN/g): حذف مؤشّر التركيز كارثة لمستخدمي لوحة المفاتيح."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "Ismail works with a sighted colleague, Fathy, who follows his screen to help. Neither can tell which field Tab is on: the form has no focus ring."
      ar: "يعمل إسماعيل مع زميل مبصر، فتحي، يتابع شاشته ليساعده. ولا يستطيع أيٌّ منهما معرفة الحقل الذي يقف عنده Tab: النموذج بلا إطار تركيز (Focus ring)."
    prompt:
      en: "Tab is on the Date field. Try each version. Which one should ship?"
      ar: "Tab الآن على حقل التاريخ. جرّب كل نسخة. أيّ نسخة تُظهر لفتحي الحقل الذي يقف عنده Tab؟"
    start: none
    options:
      - id: ring
        text: { en: "A clear focus ring on whatever Tab is on", ar: "إطار تركيز واضح على أي عنصر يقف عنده Tab" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: &bs_f { en: "From", ar: "من" }, filled: true, text: &bs_fv { en: "Cairo", ar: "القاهرة" } }
            - { kind: field, label: &bs_t { en: "To", ar: "إلى" }, filled: true, text: &bs_tv { en: "Luxor", ar: "الأقصر" }, gap: s }
            - { kind: field, label: &bs_d { en: "Date", ar: "التاريخ" }, text: "", focus: true, gap: s }
      - id: none
        text: { en: "Keep it: no ring", ar: "اتركه كما هو: بلا إطار" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: *bs_f, filled: true, text: *bs_fv }
            - { kind: field, label: *bs_t, filled: true, text: *bs_tv, gap: s }
            - { kind: field, label: *bs_d, text: "", gap: s }
      - id: firstonly
        text: { en: "A ring on the first field only, to show where to start", ar: "إطار على الحقل الأول فقط، ليوضّح نقطة البداية" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: *bs_f, filled: true, text: *bs_fv, focus: true }
            - { kind: field, label: *bs_t, filled: true, text: *bs_tv, gap: s }
            - { kind: field, label: *bs_d, text: "", gap: s }
    answer: [ring]
    misconceptions:
      - id: MC-P01-052
        when: [none, firstonly]
        feedback:
          en: "Tab is on Date, but the preview either shows nothing or points at From. The ring has to follow Tab to every stop."
          ar: "Tab على التاريخ، لكن المعاينة إما لا تُظهر شيئًا أو تشير إلى «من». والإطار يجب أن يتبع Tab إلى كل محطة."
    explain:
      en: "From Lesson 1: the focus ring is the keyboard's pointer. It must be clear and move with Tab."
      ar: "من الدرس 1: إطار التركيز بمثابة مؤشّر لوحة المفاتيح. يجب أن يكون واضحًا ويتحرّك مع Tab."

  - id: S03
    type: tune
    skill: SK-P01-U05-02
    part: check
    rules: [R19]
    value:
      en: "Skill check, keyboard accessibility (NN/g): the tab order is normally coded to reflect the page layout, top to bottom."
      ar: "اختبار مهارة، الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يُبرمَج عادةً ليعكس تخطيط الصفحة، من أعلى إلى أسفل."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "Ismail's screen reader reads \"To\" before \"From\", because the developer added the \"To\" field first."
      ar: "قارئ الشاشة عند إسماعيل يقرأ «إلى» قبل «من»، لأن المطوّر أضاف حقل «إلى» أولًا."
    prompt:
      en: "Try each tab order. Which one should ship?"
      ar: "جرّب كل ترتيب لـ Tab. أيّ ترتيب يجعل قارئ شاشة إسماعيل يقرأ الحقول كما تظهر على الشاشة الآن؟"
    start: code
    options:
      - id: code
        text: { en: "Keep the order it was built in", ar: "أبقِ الترتيب الذي بُني به" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: *bs_f, text: "" }
            - { kind: field, label: *bs_t, text: "", gap: s }
            - { kind: field, label: *bs_d, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: To → From → Date", ar: "ترتيب Tab: إلى ← من ← التاريخ" }, gap: m }
      - id: swap
        text: { en: "Swap the fields on screen so To is on top", ar: "بدّل الحقلين على الشاشة ليكون «إلى» في الأعلى" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: *bs_t, text: "" }
            - { kind: field, label: *bs_f, text: "", gap: s }
            - { kind: field, label: *bs_d, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: To → From → Date", ar: "ترتيب Tab: إلى ← من ← التاريخ" }, gap: m }
      - id: page
        text: { en: "Fix the code so Tab goes From, To, Date", ar: "أصلح الكود ليكون Tab: من، إلى، التاريخ" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: field, label: *bs_f, text: "" }
            - { kind: field, label: *bs_t, text: "", gap: s }
            - { kind: field, label: *bs_d, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: From → To → Date", ar: "ترتيب Tab: من ← إلى ← التاريخ" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [code]
        feedback:
          en: "Ismail hears \"To\" first and types Cairo there. Tab order must match the page."
          ar: "يسمع إسماعيل «إلى» أولًا فيكتب القاهرة فيه. وترتيب Tab يجب أن يطابق الصفحة."
      - id: MC-P01-053
        when: [swap]
        feedback:
          en: "It matches now, but every trip form in the world starts with \"From\". Change the code, not what everyone else expects."
          ar: "متطابق الآن، لكن كل نماذج الرحلات تبدأ بـ «من». غيّر الكود، لا ما يتوقّعه الجميع."
    explain:
      en: "From Lesson 1: when code order and screen order differ, fix the code so Tab follows the page."
      ar: "من الدرس 1: حين يختلف ترتيب الكود عن ترتيب الشاشة، أصلح الكود ليتبع Tab الصفحة."

  - id: S04
    type: tune
    skill: SK-P01-U05-03
    part: check
    rules: [R19]
    value:
      en: "Skill check, keyboard accessibility (NN/g): keyboard users must be able to access all interactive elements. Painted + and − icons aren't on the Tab path."
      ar: "اختبار مهارة، الإتاحة بلوحة المفاتيح (NN/g): يجب أن يصل مستخدمو لوحة المفاتيح إلى كل العناصر التفاعلية. وأيقونتا + و− المرسومتان ليستا في مسار Tab."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Keyboard users must be able to access all interactive elements, not just the main navigation or in-line links." }
    scenario:
      en: "Ismail travels with his son. The number of passengers changes with + and − icons, built as pictures with a click script. Tab skips them, so he can only book one seat."
      ar: "يسافر إسماعيل مع ابنه. وعدد الركّاب يتغيّر بأيقونتي + و−، مبنيّتين كصورتين مع كود للضغط. ويتخطّاهما Tab، فلا يستطيع حجز إلا مقعد واحد."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل إسماعيل يُضيف ابنه كراكب بلوحة المفاتيح؟"
    start: pics
    options:
      - id: pics
        text: { en: "Keep the picture icons", ar: "أبقِ الأيقونات المصوّرة" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: stepper, label: &ps_l { en: "Passengers", ar: "الركّاب" }, text: "1" }
            - { kind: small, color: brand, text: &ps_skip { en: "Tab goes: Date → Find buses (skips − and +)", ar: "ترتيب Tab: التاريخ ← ابحث عن رحلات (يتخطّى − و+)" }, gap: m }
      - id: buttons
        text: { en: "Rebuild − and + as real buttons", ar: "أعد بناء − و+ كأزرار حقيقية" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: stepper, label: *ps_l, text: "2" }
            - { kind: small, color: brand, text: { en: "Tab goes: Date → Fewer (−) → More (+) → Find buses", ar: "ترتيب Tab: التاريخ ← أقل (−) ← أكثر (+) ← ابحث عن رحلات" }, gap: m }
      - id: tip
        text: { en: "Add a tip: \"Click + to add passengers\"", ar: "أضف تلميحًا: «اضغط + لإضافة ركّاب»" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - { kind: stepper, label: *ps_l, text: "1" }
            - { kind: small, color: muted, text: { en: "Click + to add passengers.", ar: "اضغط + لإضافة ركّاب." }, gap: xs }
            - { kind: small, color: brand, text: *ps_skip, gap: m }
    answer: [buttons]
    misconceptions:
      - id: MC-P01-054
        when: [pics, tip]
        feedback:
          en: "Tab still skips + and −, so telling Ismail to click them doesn't help. Real buttons put them on his path."
          ar: "ما زال Tab يتخطّى + و−، فإخبار إسماعيل بالضغط عليهما لا يفيد. والأزرار الحقيقية تجعل Tab يصل إليهما."
    explain:
      en: "From Lesson 2: anything clickable must be a real control, so Tab reaches it."
      ar: "من الدرس 2: كل ما يمكن الضغط عليه يجب أن يكون عنصرًا حقيقيًا، ليصل إليه Tab."

  - id: S05
    type: tune
    skill: SK-P01-U05-04
    part: check
    rules: [R19]
    value:
      en: "Skill check, keyboard accessibility (NN/g): people must be able to close pop-ups, or they're stuck inside them."
      ar: "اختبار مهارة، الإتاحة بلوحة المفاتيح (NN/g): يجب أن يستطيع الناس إغلاق النوافذ المنبثقة، وإلا علقوا بداخلها."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "It is extremely important for users to be able to close pop-ups or they will be stuck inside them." }
    scenario:
      en: "\"See bus photos\" opens a gallery pop-up. It closes only when you click the dark area around it. Ismail opened it by mistake."
      ar: "«شاهد صور الحافلة» يفتح معرض صور منبثقًا. ولا يُغلق إلا بالضغط على المساحة الداكنة حوله. وفتحه إسماعيل بالخطأ."
    prompt:
      en: "Try each version of the gallery. Which one should ship?"
      ar: "جرّب كل نسخة للمعرض. أيّ نسخة يستطيع إسماعيل أن يخرج منها بلوحة المفاتيح متى أراد؟"
    start: outside
    options:
      - id: outside
        text: { en: "Keep it: click outside to close", ar: "اتركه كما هو: اضغط خارجه للإغلاق" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - kind: group
              blocks:
                - { kind: image, size: s, text: { en: "Bus photo 1 of 6", ar: "صورة الحافلة 1 من 6" } }
                - { kind: button, emphasis: low, text: &gl_n { en: "Next photo", ar: "الصورة التالية" }, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Next photo → Next photo … (no way out)", ar: "ترتيب Tab: الصورة التالية ← الصورة التالية … (بلا مخرج)" }, gap: m }
      - id: end
        text: { en: "Close it by itself after the last photo", ar: "أغلِقه تلقائيًا بعد آخر صورة" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - kind: group
              blocks:
                - { kind: image, size: s, text: { en: "Bus photo 1 of 6", ar: "صورة الحافلة 1 من 6" } }
                - { kind: button, emphasis: low, text: *gl_n, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Next photo × 6, then it closes", ar: "ترتيب Tab: الصورة التالية 6 مرات، ثم يُغلق" }, gap: m }
      - id: close
        text: { en: "A Close button on the Tab path, and Esc closes it", ar: "زر إغلاق يصل إليه Tab، وEsc يغلقه" }
        mock:
          app: rehla
          frame: wide
          url: rehla.example/search
          navbar:
            links: [{ en: Buses, ar: الحافلات }, { en: My tickets, ar: تذاكري }, { en: Help, ar: المساعدة }]
            active: 0
          blocks:
            - kind: group
              blocks:
                - { kind: button, style: plain, text: { en: "Close photos", ar: "أغلق الصور" } }
                - { kind: image, size: s, text: { en: "Bus photo 1 of 6", ar: "صورة الحافلة 1 من 6" }, gap: xs }
                - { kind: button, emphasis: low, text: *gl_n, gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Close photos → Next photo. Esc closes it too.", ar: "ترتيب Tab: أغلق الصور ← الصورة التالية. وEsc يغلقه أيضًا." }, gap: m }
    answer: [close]
    misconceptions:
      - id: MC-P01-055
        when: [outside, end]
        feedback:
          en: "Ismail can't click outside, and he shouldn't have to sit through 6 photos he can't see to get out. Give him Close and Esc."
          ar: "لا يستطيع إسماعيل الضغط بالخارج، ولا يصح أن يمرّ على 6 صور لا يراها ليخرج. أعطِه زر إغلاق وEsc."
    explain:
      en: "From Lesson 2: every pop-up needs a reachable Close button and Esc, so people leave when they choose."
      ar: "من الدرس 2: كل نافذة منبثقة تحتاج زر إغلاق يصل إليه Tab، وEsc، ليخرج الناس متى اختاروا."

  - id: S06
    type: tune
    skill: SK-P01-U05-05
    part: check
    rules: [R19]
    value:
      en: "Skill check, touch targets (NN/g): to avoid accidental taps, targets must be big enough and spaced well enough."
      ar: "اختبار مهارة، أهداف اللمس (NN/g): لتجنّب الضغطات العرضية، يجب أن تكون الأهداف كبيرة بما يكفي ومتباعدة بما يكفي."
    ref: { url: "https://www.nngroup.com/articles/touch-target-size/", quote: "To avoid accidental taps, targets must first be big enough, and then also spaced well enough" }
    scenario:
      en: "On her phone, Samah picks a departure time from a list of links, each about 4 mm tall with no space between them. She booked the 6 pm bus instead of the 7 pm."
      ar: "على هاتفها، تختار سماح وقت الرحلة من قائمة روابط، ارتفاع كل منها نحو 4 مم بلا مسافات بينها. فحجزت رحلة السادسة بدل السابعة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل سماح تضغط وقت الرحلة الذي تقصده من أول مرة؟"
    start: links
    options:
      - id: links
        text: { en: "Keep the small links, packed together", ar: "أبقِ الروابط الصغيرة المتلاصقة" }
        mock:
          app: rehla
          appbar: { title: { en: Departure time, ar: موعد الانطلاق }, back: true }
          blocks:
            - { kind: link, text: &dp_6 { en: "6:00 pm · 210 EGP", ar: "6:00 م · 210 جنيه" } }
            - { kind: link, text: &dp_7 { en: "7:00 pm · 210 EGP", ar: "7:00 م · 210 جنيه" }, gap: xs }
            - { kind: link, text: &dp_9 { en: "9:30 pm · 180 EGP", ar: "9:30 م · 180 جنيه" }, gap: xs }
      - id: rows
        text: { en: "Make each time a full-width button at least 1 cm tall, with space between", ar: "اجعل كل وقت زرًا بعرض الشاشة وارتفاع 1 سم على الأقل، مع مسافة بينها" }
        mock:
          app: rehla
          appbar: { title: { en: Departure time, ar: موعد الانطلاق }, back: true }
          blocks:
            - { kind: button, emphasis: low, text: *dp_6 }
            - { kind: button, emphasis: low, text: *dp_7, gap: m }
          footer:
            - { kind: button, emphasis: low, text: { en: "9:30 pm · 180 EGP", ar: "9:30 م · 180 جنيه" } }
      - id: zoom
        text: { en: "Keep the links, and add \"Pinch to zoom\"", ar: "أبقِ الروابط، وأضف «باعد بإصبعيك للتكبير»" }
        mock:
          app: rehla
          appbar: { title: { en: Departure time, ar: موعد الانطلاق }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Pinch to zoom.", ar: "باعد بإصبعيك للتكبير." } }
            - { kind: link, text: *dp_6, gap: xs }
            - { kind: link, text: *dp_7, gap: xs }
            - { kind: link, text: *dp_9, gap: xs }
    answer: [rows]
    misconceptions:
      - id: MC-P01-056
        when: [links, zoom]
        feedback:
          en: "4 mm with no gap is far below 1 cm, so Samah's thumb lands on the neighbour. Asking her to zoom passes our problem to her."
          ar: "4 مم بلا مسافة أقل بكثير من 1 سم، فيقع إبهام سماح على الرابط المجاور. وطلب التكبير منها ينقل مشكلتنا إليها."
    explain:
      en: "From Lesson 3: at least 1 cm per target, and space between them."
      ar: "من الدرس 3: 1 سم على الأقل لكل هدف، ومسافة بين الأهداف."

  - id: S07
    type: tune
    skill: SK-P01-U05-06
    part: check
    rules: [R19]
    value:
      en: "Skill check, Reset and Cancel buttons (NN/g): people click Reset by mistake when they meant Submit."
      ar: "اختبار مهارة، أزرار Reset وCancel (NN/g): يضغط الناس Reset بالخطأ وهم يقصدون الإرسال."
    ref: { url: "https://www.nngroup.com/articles/reset-and-cancel-buttons/", quote: "The worst problem about Reset is that users click the button by mistake when they wanted to click Submit." }
    scenario:
      en: "The last screen has \"Start over\" beside \"Book seats\". \"Start over\" empties every step. Samah hit it once while trying to book."
      ar: "الشاشة الأخيرة فيها «ابدأ من جديد» بجوار «احجز المقاعد». و«ابدأ من جديد» يُفرغ كل الخطوات. وضغطته سماح مرة وهي تحاول الحجز."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تحمي حجز سماح من الضياع بضغطة خطأ، وتتركها تصحّح ما تريد؟"
    start: both
    options:
      - id: both
        text: { en: "Keep \"Start over\" beside \"Book seats\"", ar: "أبقِ «ابدأ من جديد» بجوار «احجز المقاعد»" }
        mock:
          app: rehla
          appbar: { title: { en: Book seats, ar: احجز المقاعد }, back: true }
          blocks:
            - { kind: small, weight: bold, text: &bk_s { en: "Cairo → Luxor · 2 seats · 420 EGP", ar: "القاهرة ← الأقصر · مقعدان · 420 جنيه" } }
            - kind: row
              gap: m
              blocks:
                - { kind: button, emphasis: low, text: &bk_r { en: "Start over", ar: "ابدأ من جديد" } }
                - { kind: button, text: &bk_b { en: "Book seats", ar: "احجز المقاعد" } }
      - id: confirm
        text: { en: "Keep it, but ask \"Are you sure?\" first", ar: "أبقِ الزر، لكن اسأل «هل أنت متأكد؟» أولًا" }
        mock:
          app: rehla
          appbar: { title: { en: Book seats, ar: احجز المقاعد }, back: true }
          blocks:
            - { kind: small, weight: bold, text: *bk_s }
            - kind: row
              gap: m
              blocks:
                - { kind: button, emphasis: low, text: *bk_r }
                - { kind: button, text: *bk_b }
            - { kind: small, color: muted, text: { en: "\"Start over\" opens: Are you sure? Yes / No", ar: "«ابدأ من جديد» يفتح: هل أنت متأكد؟ نعم / لا" }, gap: s }
      - id: none
        text: { en: "Remove \"Start over\"; each step keeps its own Edit", ar: "احذف «ابدأ من جديد»؛ ولكل خطوة زر «تعديل» خاص بها" }
        mock:
          app: rehla
          appbar: { title: { en: Book seats, ar: احجز المقاعد }, back: true }
          blocks:
            - { kind: small, weight: bold, text: *bk_s }
            - { kind: small, color: muted, text: { en: "Trip · Edit    Seats · Edit", ar: "الرحلة · تعديل    المقاعد · تعديل" }, gap: xs }
          footer:
            - { kind: button, text: { en: "Book seats", ar: "احجز المقاعد" } }
    answer: [none]
    misconceptions:
      - id: MC-P01-057
        when: [both, confirm]
        feedback:
          en: "A button that wipes everything still sits where Samah taps to finish. A dialog only adds a scary step. Let people edit one step instead."
          ar: "ما زال الزر الذي يمسح كل شيء في المكان الذي تضغط فيه سماح للإنهاء. ونافذة التأكيد تضيف خطوة مخيفة فقط. دع الناس يعدّلون خطوة واحدة بدلًا من ذلك."
    explain:
      en: "From Lesson 3: keep the end of a form for the main action, and let people change one part instead of wiping all of it."
      ar: "من الدرس 3: اترك نهاية النموذج للإجراء الرئيسي، ودع الناس يغيّرون جزءًا واحدًا بدل مسح كل شيء."
