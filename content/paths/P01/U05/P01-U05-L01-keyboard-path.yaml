id: P01-U05-L01
mode: lesson
minutes: 8
title:
  en: "A form you can finish without a mouse"
  ar: "نموذج تُكمله بلا ماوس"
summary:
  en: "Make a travel booking form work by keyboard, with visible focus and a sensible Tab order."
  ar: "اجعل نموذج حجز السفر يعمل بلوحة المفاتيح، مع تركيز (Focus) ظاهر وترتيب Tab منطقي."
speaker: karim
sources:
  - title: { en: "Keyboard-Only Navigation for Improved Accessibility (NN/g)", ar: "التنقّل بلوحة المفاتيح فقط لتحسين الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/keyboard-accessibility/"
review_labels:
  MC-P01-052: { en: "Never remove the focus ring", ar: "لا تحذف إطار التركيز أبدًا" }
  MC-P01-053: { en: "Tab order follows the layout", ar: "ترتيب Tab يتبع ترتيب الصفحة" }
  MC-P01-054: { en: "Every control must be reachable by keyboard", ar: "يجب أن يصل المستخدم إلى كل عنصر بلوحة المفاتيح" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Nabil and the Tab key", ar: "نبيل وزر Tab" }
    body:
      en: "I built a booking form for a travel agency. Nabil has a hand tremor, so he uses the keyboard instead of a mouse: Tab to move, Enter to press.\n\nOn our form, he pressed Tab and couldn't see where he was. Then Tab jumped from his name straight to the Pay button. He booked by phone instead."
      ar: "بنيت نموذج حجز لوكالة سفر. نبيل عنده رعشة في يده، فيستخدم لوحة المفاتيح بدل الماوس: Tab للتنقّل، وEnter للضغط.\n\nفي نموذجنا، ضغط Tab ولم يعرف أين هو في الصفحة. ثم قفز Tab من اسمه مباشرة إلى زر الدفع. فحجز بالهاتف بدلًا من ذلك."
    mock:
      app: zad
      frame: wide
      url: zad.example/book
      navbar:
        links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
        active: 0
      blocks:
        - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
        - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
        - { kind: field, label: { en: "Travel date", ar: "تاريخ السفر" }, text: "", gap: s }
        - { kind: button, text: { en: "Pay", ar: "ادفع" }, gap: m }

  - id: S02
    type: tune
    skill: SK-P01-U05-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Keyboard accessibility (NN/g): removing the keyboard focus indicator is catastrophic for keyboard users. Without it, Nabil can't tell which field he's in."
      ar: "جرّب أولًا. الإتاحة بلوحة المفاتيح (NN/g): حذف مؤشّر التركيز كارثة لمستخدمي لوحة المفاتيح. وبدونه، لا يعرف نبيل في أي حقل هو."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "Our designer removed the focus ring because \"it looked messy\". Nabil has pressed Tab twice, so he's in the Email field."
      ar: "حذف مصمّمنا إطار التركيز (Focus ring) لأنه «بدا غير مرتّب». وضغط نبيل Tab مرتين، فهو الآن في حقل البريد."
    prompt:
      en: "Try each version of what Nabil sees. Which one should ship?"
      ar: "جرّب كل نسخة لما يراه نبيل. أيّ نسخة تُظهر لنبيل الحقل الذي وصل إليه؟"
    start: none
    options:
      - id: none
        text: { en: "Keep it: no focus ring", ar: "اتركه كما هو: بلا إطار تركيز" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: &nb_n { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: field, label: &nb_e { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
            - { kind: field, label: &nb_d { en: "Travel date", ar: "تاريخ السفر" }, text: "", gap: s }
      - id: ring
        text: { en: "Bring back a clear focus ring", ar: "أعِد إطار تركيز واضحًا" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *nb_n, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: field, label: *nb_e, text: "", focus: true, gap: s }
            - { kind: field, label: *nb_d, text: "", gap: s }
      - id: label
        text: { en: "No ring; make the focused field's label purple", ar: "بلا إطار؛ اجعل عنوان الحقل الذي عليه التركيز بنفسجيًا" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *nb_n, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: small, weight: bold, color: brand, text: *nb_e, gap: s }
            - { kind: field, text: "", gap: xs }
            - { kind: field, label: *nb_d, text: "", gap: s }
    answer: [ring]
    misconceptions:
      - id: MC-P01-052
        when: [none]
        feedback:
          en: "Look at the preview: which field is Nabil in? Nothing says. He'd have to type and see where the letters land."
          ar: "انظر إلى المعاينة: في أي حقل نبيل؟ لا شيء يوضّح ذلك. سيضطر أن يكتب ويرى أين تظهر الحروف."
      - id: MC-P01-052
        when: [label]
        feedback:
          en: "A slightly different label color is hard to spot, and gone for people who don't see purple well. A ring around the field is obvious."
          ar: "لون العنوان المختلف قليلًا صعب الملاحظة، ولا يراه من لا يميّز البنفسجي جيدًا. أما الإطار حول الحقل فواضح."
    hints:
      - { en: "Cover the scenario. Can you tell from the preview where Nabil is?", ar: "تجاهل الوصف. هل تعرف من المعاينة أين نبيل؟" }
      - { en: "Which version marks the field itself, in a way you can't miss?", ar: "أي نسخة تميّز الحقل نفسه، بطريقة لا يمكن أن تفوتك؟" }
    correct:
      en: "The ring shows Nabil exactly where he is."
      ar: "الإطار يُظهر لنبيل أين هو بالضبط."
    explain:
      en: "For keyboard users, the focus ring is the mouse pointer. Remove it and they're lost. Style it to fit the brand if you like, but keep it clear."
      ar: "بالنسبة إلى مستخدمي لوحة المفاتيح، إطار التركيز بمثابة مؤشّر الماوس. احذفه فيضيعون. يمكنك تصميمه ليناسب هوية المنتج، لكن أبقِه واضحًا."

  - id: S03
    type: card
    part: concept
    icons: [eye, order, tap, ok]
    title: { en: "Some people never touch a mouse", ar: "بعض الناس لا يلمسون الماوس أبدًا" }
    body:
      en: "People with a tremor, people who are blind, and fast typists move through forms with the keyboard: Tab to the next thing, Shift+Tab back, Enter or Space to press.\n\n- **Focus you can see:** the thing Tab is on needs a clear ring. Never remove it.\n- **Order that matches the page:** Tab should move the way people read the form, top to bottom.\n- **Everything reachable:** every button, link and field must be on the Tab path.\n- **Pop-ups that close:** Esc and a Close button must work, or people get stuck."
      ar: "أصحاب الرعشة، والمكفوفون، ومن يكتبون بسرعة يتنقّلون في النماذج بلوحة المفاتيح: Tab للعنصر التالي، وShift+Tab للرجوع، وEnter أو المسافة للضغط.\n\n- **تركيز (Focus) ظاهر:** العنصر الذي يقف عنده Tab يحتاج إطارًا واضحًا. لا تحذفه أبدًا.\n- **ترتيب يطابق الصفحة:** يجب أن يتحرّك Tab كما يقرأ الناس النموذج، من أعلى إلى أسفل.\n- **كل شيء في المتناول:** كل زر ورابط وحقل يجب أن يصل إليه Tab.\n- **نوافذ تُغلق:** يجب أن يعمل Esc وزر الإغلاق، وإلا علق الناس."

  - id: S04
    type: tune
    skill: SK-P01-U05-02
    part: guided
    rules: [R06, R15]
    value:
      en: "Keyboard accessibility (NN/g): the tab order is normally coded to follow the page layout, top to bottom. When the Pay button comes second, Nabil skips the fields between."
      ar: "الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يُبرمَج عادةً ليتبع تخطيط الصفحة، من أعلى إلى أسفل. وحين يأتي زر الدفع ثانيًا، يتخطّى نبيل الحقول التي بينهما."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "In our code, the Pay button comes right after the name field, because we added it early. On screen it's at the bottom."
      ar: "في الكود عندنا، يأتي زر الدفع بعد حقل الاسم مباشرة، لأننا أضفناه مبكّرًا. أما على الشاشة فهو في الأسفل."
    prompt:
      en: "Try each tab order. Which one should ship?"
      ar: "جرّب كل ترتيب لـ Tab. أيّها يجب أن يُطلق؟"
    start: code
    options:
      - id: code
        text: { en: "Keep the order of the code", ar: "أبقِ ترتيب الكود" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *nb_n, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: field, label: *nb_e, text: "", gap: s }
            - { kind: field, label: *nb_d, text: "", gap: s }
            - { kind: button, text: &nb_p { en: "Pay", ar: "ادفع" }, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Full name → Pay → Email → Travel date", ar: "ترتيب Tab: الاسم الكامل ← ادفع ← البريد ← تاريخ السفر" }, gap: m }
      - id: page
        text: { en: "Match the page: top to bottom", ar: "طابِق الصفحة: من أعلى إلى أسفل" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *nb_n, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: field, label: *nb_e, text: "", gap: s }
            - { kind: field, label: *nb_d, text: "", gap: s }
            - { kind: button, text: *nb_p, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Full name → Email → Travel date → Pay", ar: "ترتيب Tab: الاسم الكامل ← البريد ← تاريخ السفر ← ادفع" }, gap: m }
      - id: move
        text: { en: "Move Pay up under the name, to match the code", ar: "انقل «ادفع» لأعلى تحت الاسم، ليطابق الكود" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *nb_n, filled: true, text: { en: "Nabil Saad", ar: "نبيل سعد" } }
            - { kind: button, text: *nb_p, gap: s }
            - { kind: field, label: *nb_e, text: "", gap: m }
            - { kind: field, label: *nb_d, text: "", gap: s }
            - { kind: small, color: brand, text: { en: "Tab goes: Full name → Pay → Email → Travel date", ar: "ترتيب Tab: الاسم الكامل ← ادفع ← البريد ← تاريخ السفر" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [code]
        feedback:
          en: "Nabil reads the form top to bottom, but Tab takes him to Pay second. He may pay before filling in his email and date, or think the form is broken."
          ar: "يقرأ نبيل النموذج من أعلى إلى أسفل، لكن Tab يأخذه إلى «ادفع» ثانيًا. قد يدفع قبل أن يكتب بريده وتاريخ سفره، أو يظن أن النموذج معطّل."
      - id: MC-P01-053
        when: [move]
        feedback:
          en: "Now the order matches, but Pay sits above the fields it pays for, for everyone. Fix the order in the code, not the layout."
          ar: "الآن الترتيب متطابق، لكن «ادفع» صار فوق الحقول التي يدفع مقابلها، للجميع. أصلح الترتيب في الكود، لا التخطيط."
    hints:
      - { en: "Read the form with your eyes, then read the Tab line. Do they match?", ar: "اقرأ النموذج بعينيك، ثم اقرأ سطر Tab. هل يتطابقان؟" }
      - { en: "Which version keeps Pay last on screen and last for Tab?", ar: "أي نسخة تُبقي «ادفع» الأخير على الشاشة والأخير في Tab؟" }
    correct:
      en: "Tab moves the way the form reads."
      ar: "Tab يتحرّك كما يُقرأ النموذج."
    explain:
      en: "Keyboard users expect Tab to follow what they see. When the code order and the screen order differ, change the code."
      ar: "يتوقّع مستخدمو لوحة المفاتيح أن يتبع Tab ما يرونه. وحين يختلف ترتيب الكود عن ترتيب الشاشة، غيّر الكود."

  - id: S05
    type: words
    skill: SK-P01-U05-01
    part: guided
    confidence: true
    rules: [R06, R15]
    value:
      en: "Keyboard accessibility (NN/g): removing the focus indicator is catastrophic for keyboard users. A spec note has to protect the ring on every interactive element."
      ar: "الإتاحة بلوحة المفاتيح (NN/g): حذف مؤشّر التركيز كارثة لمستخدمي لوحة المفاتيح. وملاحظة المواصفات يجب أن تحمي الإطار على كل عنصر تفاعلي."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "I'm writing the handoff notes for the next version, so no one removes the ring again."
      ar: "أكتب ملاحظات التسليم (Handoff) للنسخة القادمة، حتى لا يحذف أحد الإطار مرة أخرى."
    prompt:
      en: "Which note should go in the spec?"
      ar: "أي ملاحظة يجب أن تُكتب في المواصفات (Spec)؟"
    options:
      - { id: hover, text: { en: "\"Show a ring when the mouse hovers over a field.\"", ar: "«اعرض إطارًا حين يمرّ الماوس فوق الحقل.»" } }
      - { id: first, text: { en: "\"Show a focus ring on the first field, to start people off.\"", ar: "«اعرض إطار تركيز على الحقل الأول، ليبدأ الناس منه.»" } }
      - { id: all, text: { en: "\"Every field, button and link shows a clear focus ring when Tab reaches it.\"", ar: "«كل حقل وزر ورابط يعرض إطار تركيز واضحًا حين يصل إليه Tab.»" } }
    answer: [all]
    misconceptions:
      - id: MC-P01-052
        when: [hover, first]
        feedback:
          en: "Nabil doesn't hover, and he needs the ring on every stop, not just the first. The ring follows Tab everywhere."
          ar: "نبيل لا يستخدم الماوس، ويحتاج الإطار في كل محطة، لا في الأولى فقط. الإطار يتبع Tab في كل مكان."
    hints:
      - { en: "Which note still helps someone who never uses a mouse?", ar: "أي ملاحظة ما زالت تساعد من لا يستخدم الماوس أبدًا؟" }
      - { en: "Where does Nabil need to see focus: on one field, or on every stop?", ar: "أين يحتاج نبيل أن يرى التركيز: في حقل واحد، أم في كل محطة؟" }
    correct:
      en: "A ring on every stop Tab makes."
      ar: "إطار في كل محطة يقف عندها Tab."
    explain:
      en: "Focus is for the keyboard, not the mouse. Every element Tab can reach needs a ring people can see."
      ar: "التركيز للوحة المفاتيح، لا للماوس. وكل عنصر يصل إليه Tab يحتاج إطارًا يراه الناس."

  - id: S06
    type: tune
    skill: SK-P01-U05-02
    part: guided
    rules: [R06, R15]
    value:
      en: "Keyboard accessibility (NN/g): the tab order should reflect the layout. A promo code field that comes first for Tab but last on screen confuses keyboard users."
      ar: "الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يجب أن يعكس التخطيط. وحقل كود الخصم الذي يأتي أولًا في Tab وأخيرًا على الشاشة يُربك مستخدمي لوحة المفاتيح."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "The agency's payment page has the card fields first and a promo code field at the bottom. Because the promo box is a separate piece of code, Tab lands on it before the card number."
      ar: "صفحة الدفع في الوكالة فيها حقول البطاقة أولًا وحقل كود الخصم في الأسفل. ولأن مربع الخصم جزء منفصل من الكود، يصل إليه Tab قبل رقم البطاقة."
    prompt:
      en: "Try each tab order. Which one should ship?"
      ar: "جرّب كل ترتيب لـ Tab. أيّها يجب أن يُطلق؟"
    start: promo
    options:
      - id: promo
        text: { en: "Keep it: promo code first", ar: "اتركه كما هو: كود الخصم أولًا" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: &pm_c { en: "Card number", ar: "رقم البطاقة" }, text: "" }
            - { kind: field, label: &pm_x { en: "Expiry date", ar: "تاريخ الانتهاء" }, text: "", gap: s }
            - { kind: field, label: &pm_p { en: "Promo code (optional)", ar: "كود الخصم (اختياري)" }, text: "", gap: s }
            - { kind: button, text: &pm_b { en: "Pay 6,400 EGP", ar: "ادفع 6,400 جنيه" }, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Promo code → Card number → Expiry date → Pay", ar: "ترتيب Tab: كود الخصم ← رقم البطاقة ← تاريخ الانتهاء ← ادفع" }, gap: m }
      - id: skip
        text: { en: "Take the promo code out of the Tab order", ar: "أخرج كود الخصم من ترتيب Tab" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *pm_c, text: "" }
            - { kind: field, label: *pm_x, text: "", gap: s }
            - { kind: field, label: *pm_p, text: "", gap: s }
            - { kind: button, text: *pm_b, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Card number → Expiry date → Pay", ar: "ترتيب Tab: رقم البطاقة ← تاريخ الانتهاء ← ادفع" }, gap: m }
      - id: page
        text: { en: "Card number, expiry, promo code, then Pay", ar: "رقم البطاقة، ثم الانتهاء، ثم كود الخصم، ثم ادفع" }
        mock:
          app: zad
          frame: wide
          url: zad.example/book
          navbar:
            links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
            active: 0
          blocks:
            - { kind: field, label: *pm_c, text: "" }
            - { kind: field, label: *pm_x, text: "", gap: s }
            - { kind: field, label: *pm_p, text: "", gap: s }
            - { kind: button, text: *pm_b, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Card number → Expiry date → Promo code → Pay", ar: "ترتيب Tab: رقم البطاقة ← تاريخ الانتهاء ← كود الخصم ← ادفع" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [promo]
        feedback:
          en: "Nabil starts typing his card number and it lands in the promo box. The order has to match what he sees."
          ar: "يبدأ نبيل كتابة رقم بطاقته فيظهر في مربع الخصم. والترتيب يجب أن يطابق ما يراه."
      - id: MC-P01-054
        when: [skip]
        feedback:
          en: "Now the order is right, but Nabil can never reach the promo code, so he pays full price. Keep it in the order, in its place."
          ar: "الآن الترتيب صحيح، لكن نبيل لا يستطيع الوصول إلى كود الخصم أبدًا، فيدفع السعر كاملًا. أبقِه في الترتيب، في مكانه."
    hints:
      - { en: "Does the Tab line match the form from top to bottom?", ar: "هل يطابق سطر Tab النموذج من أعلى إلى أسفل؟" }
      - { en: "Can Nabil still reach every field?", ar: "هل ما زال نبيل يستطيع الوصول إلى كل حقل؟" }
    correct:
      en: "Same order as the screen, and nothing left out."
      ar: "الترتيب نفسه الذي على الشاشة، ولم يُستبعد أي حقل."
    explain:
      en: "Tab order is a path through the whole form. It follows the layout and includes every control, optional ones too."
      ar: "ترتيب Tab يمرّ بالنموذج كله. يتبع التخطيط (Layout) ويشمل كل عنصر، حتى الاختيارية."

  - id: S07
    type: compare
    skill: SK-P01-U05-01
    part: contrast
    rules: [R11, R15]
    value:
      en: "Contrast with S02: both versions here mark focus somehow. Keyboard accessibility (NN/g): losing the focus indicator is catastrophic. A ring on the field works; a small color change elsewhere barely counts."
      ar: "مقارنة مع الخطوة 2: النسختان هنا تعلّمان التركيز بطريقة ما. الإتاحة بلوحة المفاتيح (NN/g): فقدان مؤشّر التركيز كارثة. والإطار على الحقل ينجح؛ أما تغيير لون صغير في مكان آخر فبالكاد يُحسب."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "Removing the keyboard focus indicator is catastrophic for keyboard users." }
    scenario:
      en: "Two designers sent me focus styles for the agency's search form. In both, Nabil has tabbed to the \"Return date\" field."
      ar: "أرسل لي مصمّمان شكلين للتركيز في نموذج البحث بالوكالة. وفي الاثنين، وصل نبيل بـ Tab إلى حقل «تاريخ العودة»."
    prompt:
      en: "Which focus style should ship?"
      ar: "أيّ شكل للتركيز يُظهر لنبيل فورًا أنه في «تاريخ العودة»؟"
    a:
      label: { en: "Label tint", ar: "لون العنوان" }
      mock:
        app: zad
        frame: wide
        url: zad.example/book
        navbar:
          links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
          active: 0
        blocks:
          - { kind: field, label: { en: "Leaving on", ar: "تاريخ الذهاب" }, filled: true, text: "12/01/2027" }
          - { kind: small, weight: bold, color: brand, text: { en: "Return date", ar: "تاريخ العودة" }, gap: s }
          - { kind: field, text: "", gap: xs }
    b:
      label: { en: "Ring", ar: "إطار" }
      mock:
        app: zad
        frame: wide
        url: zad.example/book
        navbar:
          links: [{ en: Flights, ar: الطيران }, { en: Hotels, ar: الفنادق }, { en: My trips, ar: رحلاتي }]
          active: 0
        blocks:
          - { kind: field, label: { en: "Leaving on", ar: "تاريخ الذهاب" }, filled: true, text: "12/01/2027" }
          - { kind: field, label: { en: "Return date", ar: "تاريخ العودة" }, text: "", focus: true, gap: s }
    answer: b
    reason:
      prompt: { en: "What makes B work?", ar: "ما الذي يجعل B ناجحًا؟" }
      options:
        - { id: brand, text: { en: "It uses the brand color", ar: "يستخدم لون الهوية" } }
        - { id: obvious, text: { en: "It marks the field itself, big enough to spot at a glance", ar: "يميّز الحقل نفسه، بحجم يُلاحَظ بنظرة" } }
        - { id: both, text: { en: "Both are just as clear; it's taste", ar: "الاثنان واضحان بالقدر نفسه؛ إنها مسألة ذوق" } }
      answer: [obvious]
      misconceptions:
        - id: MC-P01-052
          when: [brand, both]
          feedback:
            en: "Both use the same purple. The difference is size and place: a thin color change on the label versus a ring around the field Nabil will type in."
            ar: "كلاهما يستخدم البنفسجي نفسه. والفرق في الحجم والمكان: تغيير لون رفيع في العنوان، مقابل إطار حول الحقل الذي سيكتب فيه نبيل."
    misconceptions:
      - id: MC-P01-052
        when: [a]
        feedback:
          en: "Squint at A: the empty box looks like every other box. A label tint is easy to miss, so in practice it works like no focus at all."
          ar: "انظر إلى A سريعًا: المربع الفارغ يبدو مثل أي مربع. ولون العنوان لا يُلاحَظ بسهولة، فهو عمليًا كأنه لا تركيز."
    hints:
      - { en: "Glance at each for one second. In which one do you know where Nabil is?", ar: "انظر إلى كل واحد ثانية واحدة. في أيّهما تعرف أين نبيل؟" }
    correct:
      en: "A ring around the field is focus you can't miss."
      ar: "الإطار حول الحقل تركيز لا يفوتك."
    explain:
      en: "Focus has to be found at a glance. Mark the element itself, with enough contrast and size; small color shifts don't do that."
      ar: "التركيز يجب أن يُرى بنظرة. ميّز العنصر نفسه، بتباين وحجم كافيين؛ وتغيّرات اللون الصغيرة لا تفعل ذلك."

  - id: S08
    type: tune
    skill: SK-P01-U05-02
    part: independent
    speaker: nour
    rules: [R14, R19]
    value:
      en: "New case. Keyboard accessibility (NN/g): tab order is coded to reflect the page layout, top to bottom. A form built in a different order than it looks sends keyboard users jumping."
      ar: "حالة جديدة. الإتاحة بلوحة المفاتيح (NN/g): ترتيب Tab يُبرمَج ليعكس تخطيط الصفحة، من أعلى إلى أسفل. والنموذج المبني بترتيب مختلف عن شكله يجعل مستخدمي لوحة المفاتيح يقفزون."
    ref: { url: "https://www.nngroup.com/articles/keyboard-accessibility/", quote: "On most websites the tab order will be coded to reflect the page layout; that is top to bottom and left to right." }
    scenario:
      en: "Patients book appointments on my clinic's website. Our new developer built the date and time first, then moved the patient's name to the top of the screen. Hoda, who is blind, said Tab \"asks for the time before my name\"."
      ar: "يحجز المرضى مواعيدهم من موقع عيادتي. وبنى المطوّر الجديد التاريخ والوقت أولًا، ثم نقل اسم المريض إلى أعلى الشاشة. وقالت هدى، وهي كفيفة، إن Tab «يسألني عن الوقت قبل اسمي»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: built
    options:
      - id: built
        text: { en: "Keep it: the order it was built in", ar: "اتركه كما هو: بالترتيب الذي بُني به" }
        mock:
          app: raha
          frame: wide
          url: raha.example/book
          navbar:
            links: [{ en: Doctors, ar: الأطباء }, { en: Book, ar: احجز }, { en: My visits, ar: زياراتي }]
            active: 1
          blocks:
            - { kind: field, label: &ck_n { en: "Patient name", ar: "اسم المريض" }, text: "" }
            - { kind: field, label: &ck_d { en: "Day", ar: "اليوم" }, text: "", gap: s }
            - { kind: field, label: &ck_t { en: "Time", ar: "الوقت" }, text: "", gap: s }
            - { kind: button, text: &ck_b { en: "Book", ar: "احجز" }, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Day → Time → Patient name → Book", ar: "ترتيب Tab: اليوم ← الوقت ← اسم المريض ← احجز" }, gap: m }
      - id: note
        text: { en: "Keep the order, and add a note: \"Fill in your name last\"", ar: "أبقِ الترتيب، وأضف ملاحظة: «اكتب اسمك في النهاية»" }
        mock:
          app: raha
          frame: wide
          url: raha.example/book
          navbar:
            links: [{ en: Doctors, ar: الأطباء }, { en: Book, ar: احجز }, { en: My visits, ar: زياراتي }]
            active: 1
          blocks:
            - { kind: small, color: muted, text: { en: "Fill in your name last.", ar: "اكتب اسمك في النهاية." } }
            - { kind: field, label: *ck_n, text: "", gap: s }
            - { kind: field, label: *ck_d, text: "", gap: s }
            - { kind: field, label: *ck_t, text: "", gap: s }
            - { kind: button, text: *ck_b, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Day → Time → Patient name → Book", ar: "ترتيب Tab: اليوم ← الوقت ← اسم المريض ← احجز" }, gap: m }
      - id: page
        text: { en: "Order Tab the way the page reads", ar: "رتّب Tab كما تُقرأ الصفحة" }
        mock:
          app: raha
          frame: wide
          url: raha.example/book
          navbar:
            links: [{ en: Doctors, ar: الأطباء }, { en: Book, ar: احجز }, { en: My visits, ar: زياراتي }]
            active: 1
          blocks:
            - { kind: field, label: *ck_n, text: "" }
            - { kind: field, label: *ck_d, text: "", gap: s }
            - { kind: field, label: *ck_t, text: "", gap: s }
            - { kind: button, text: *ck_b, gap: m }
            - { kind: small, color: brand, text: { en: "Tab goes: Patient name → Day → Time → Book", ar: "ترتيب Tab: اسم المريض ← اليوم ← الوقت ← احجز" }, gap: m }
    answer: [page]
    misconceptions:
      - id: MC-P01-053
        when: [built, note]
        feedback:
          en: "The build order is our history, not Hoda's problem. A note asks her to work around our bug. Fix the order so Tab follows the page."
          ar: "ترتيب البناء شأننا نحن، لا مشكلة هدى. والملاحظة تطلب منها أن تتحايل على خطئنا. أصلح الترتيب ليتبع Tab الصفحة."
    correct:
      en: "Tab and the screen now tell the same story."
      ar: "الآن يتّفق Tab مع الشاشة."
    explain:
      en: "Whatever order the code was written in, Tab should move the way the form reads. Check it by tabbing through before launch."
      ar: "أيًّا كان ترتيب كتابة الكود، يجب أن يتحرّك Tab كما يُقرأ النموذج. اختبره بالتنقّل بـ Tab قبل الإطلاق."

  - id: S09
    type: card
    part: recap
    icons: [eye, order, tap, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Focus you can see:** brought back a clear ring instead of nothing or a label tint.\n- **A spec that protects it:** asked for a ring on every field, button and link.\n- **Tab follows the page:** fixed the order in the code instead of moving Pay up or adding a note.\n- **Nothing left out:** kept the optional promo code on the Tab path, in its place.\n\nNext: controls that the keyboard can't reach, and pop-ups that trap people."
      ar: "- **تركيز ظاهر:** أعدت إطارًا واضحًا بدل حذفه أو تلوين العنوان.\n- **مواصفات تحميه:** طلبت إطارًا على كل حقل وزر ورابط.\n- **Tab يتبع الصفحة:** أصلحت الترتيب في الكود بدل نقل «ادفع» لأعلى أو إضافة ملاحظة.\n- **لم يُستبعد شيء:** أبقيت كود الخصم الاختياري في ترتيب Tab، في مكانه.\n\nالتالي: عناصر لا تصل إليها لوحة المفاتيح، ونوافذ تحبس الناس."
