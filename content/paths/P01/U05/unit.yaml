id: P01-U05
free: false
title:
  en: "Forms everyone can finish"
  ar: "نماذج يستطيع الجميع إكمالها"
skill:
  en: "Make a form work by keyboard and by touch: visible focus, a sensible tab order, reachable controls, pop-ups that close, big targets, and no buttons that wipe the work."
  ar: "اجعل النموذج يعمل بلوحة المفاتيح وباللمس: تركيز ظاهر، وترتيب Tab منطقي، وعناصر يمكن الوصول إليها، ونوافذ تُغلق، وأهداف كبيرة، وبلا أزرار تمسح العمل."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P01-U05-01
    title: { en: "Keep keyboard focus visible", ar: "أبقِ تركيز لوحة المفاتيح ظاهرًا" }
    can_do: { en: "Keep a clear focus ring on every field, button and link, so keyboard users see where they are.", ar: "أبقِ إطار تركيز (Focus) واضحًا على كل حقل وزر ورابط، ليرى مستخدمو لوحة المفاتيح أين هم." }
  - id: SK-P01-U05-02
    title: { en: "Make Tab follow the layout", ar: "اجعل Tab يتبع ترتيب الصفحة" }
    can_do: { en: "Order fields so Tab moves through them the way the page reads, top to bottom.", ar: "رتّب الحقول بحيث ينتقل Tab بينها كما تُقرأ الصفحة، من أعلى إلى أسفل." }
  - id: SK-P01-U05-03
    title: { en: "Make every control reachable by keyboard", ar: "اجعل كل عنصر يمكن الوصول إليه بلوحة المفاتيح" }
    can_do: { en: "Build controls from real buttons, links and fields, so Tab reaches every one of them.", ar: "ابنِ العناصر من أزرار وروابط وحقول حقيقية، ليصل Tab إليها كلها." }
  - id: SK-P01-U05-04
    title: { en: "Let people close pop-ups", ar: "دع الناس يغلقون النوافذ المنبثقة" }
    can_do: { en: "Give every pop-up a Close button that keyboard users can reach, and let Esc close it.", ar: "أعطِ كل نافذة منبثقة زر إغلاق يصل إليه مستخدمو لوحة المفاتيح، واجعل Esc يغلقها." }
  - id: SK-P01-U05-05
    title: { en: "Make touch targets big and spaced", ar: "اجعل أهداف اللمس كبيرة ومتباعدة" }
    can_do: { en: "Make each tap target at least 1 cm by 1 cm, with space between neighbours.", ar: "اجعل كل هدف لمس 1 سم × 1 سم على الأقل، مع مسافة بينه وبين ما يجاوره." }
  - id: SK-P01-U05-06
    title: { en: "Don't put Clear next to Submit", ar: "لا تضع «مسح» بجوار «إرسال»" }
    can_do: { en: "Leave out Reset or Clear buttons that wipe a form, especially next to the submit button.", ar: "استغنِ عن أزرار Reset أو «مسح» التي تُفرغ النموذج، خاصة بجوار زر الإرسال." }
