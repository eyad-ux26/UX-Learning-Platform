id: P01-U03-L02
mode: lesson
minutes: 8
title:
  en: "Where labels sit, how fields line up"
  ar: "أين توضع العناوين، وكيف تُرتّب الحقول"
summary:
  en: "Place labels and line up fields so nobody types into the wrong box."
  ar: "ضع العناوين ورتّب الحقول حتى لا يكتب أحد في المربع الخطأ."
speaker: youssef
sources:
  - title: { en: "Group Form Elements Effectively Using White Space (NN/g)", ar: "اجمع عناصر النموذج بفعالية باستخدام المسافات (NN/g)" }
    url: "https://www.nngroup.com/articles/form-design-white-space/"
  - title: { en: "Website Forms Usability: Top 10 Recommendations (NN/g)", ar: "سهولة استخدام نماذج المواقع: أهم 10 توصيات (NN/g)" }
    url: "https://www.nngroup.com/articles/web-form-design/"
review_labels:
  MC-P01-038: { en: "A label belongs nearest its own field", ar: "العنوان مكانه الأقرب إلى حقله" }
  MC-P01-039: { en: "On phones, labels go above fields", ar: "على الهاتف، العناوين فوق الحقول" }
  MC-P01-040: { en: "Two columns break the path down the form", ar: "العمودان يربكان ترتيب ملء النموذج" }
  MC-P01-041: { en: "Group related fields under a heading", ar: "اجمع الحقول المترابطة تحت عنوان رئيسي" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Nada's phone number", ar: "رقم هاتف ندى" }
    body:
      en: "Nada created an account in my shop's app. Our sign-up form has labels, but each one sits halfway between two boxes.\n\nShe typed her email into the phone box, got an error, and gave up."
      ar: "أنشأت ندى حسابًا في تطبيق متجري. ونموذج التسجيل عندنا فيه عناوين، لكن كل عنوان يقع في منتصف المسافة بين مربعين.\n\nكتبت بريدها في مربع الهاتف، فظهر خطأ، فتركت التسجيل."
    mock:
      app: dar
      appbar: { title: { en: "Create your account", ar: "أنشئ حسابك" }, back: true }
      blocks: &signnow
        - { kind: small, weight: bold, text: { en: "Full name", ar: "الاسم الكامل" }, gap: m }
        - { kind: field, text: "", gap: m }
        - { kind: small, weight: bold, text: { en: "Mobile number", ar: "رقم الموبايل" }, gap: m }
        - { kind: field, text: "", gap: m }
        - { kind: small, weight: bold, text: { en: "Email", ar: "البريد الإلكتروني" }, gap: m }
        - { kind: field, text: "", gap: m }

  - id: S02
    type: tune
    skill: SK-P01-U03-04
    part: try
    rules: [R12]
    value:
      en: "Try first. White space in forms (NN/g): items near each other appear related, so place each label closer to its own field than to other fields. Equal gaps leave people guessing."
      ar: "جرّب أولًا. المسافات في النماذج (NN/g): العناصر المتقاربة تبدو مترابطة، لذلك ضع كل عنوان أقرب إلى حقله منه إلى الحقول الأخرى. والمسافات المتساوية تترك الناس يخمّنون."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "Place the label closer to the associated text field than to other text fields." }
    prompt:
      en: "Try each spacing. Which one should ship?"
      ar: "جرّب كل توزيع للمسافات. أيّ توزيع يجعل ندى تعرف بوضوح أيّ عنوان يخصّ أيّ حقل؟"
    mock:
      app: dar
      appbar: { title: { en: "Create your account", ar: "أنشئ حسابك" }, back: true }
      caption: { en: "Now", ar: "الآن" }
      blocks: *signnow
    options:
      - id: lines
        text: { en: "Keep the gaps, and add a line between fields", ar: "أبقِ المسافات، وأضف خطًّا بين الحقول" }
        mock:
          app: dar
          appbar: { title: { en: "Create your account", ar: "أنشئ حسابك" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: small, weight: bold, text: { en: "Full name", ar: "الاسم الكامل" }, gap: m }
            - { kind: field, text: "", gap: m }
            - { kind: divider, gap: s }
            - { kind: small, weight: bold, text: { en: "Mobile number", ar: "رقم الموبايل" }, gap: s }
            - { kind: field, text: "", gap: m }
            - { kind: divider, gap: s }
            - { kind: small, weight: bold, text: { en: "Email", ar: "البريد الإلكتروني" }, gap: s }
            - { kind: field, text: "", gap: m }
      - id: tight
        text: { en: "Each label right on top of its field, more space before the next", ar: "كل عنوان فوق حقله مباشرة، ومسافة أكبر قبل الحقل التالي" }
        mock:
          app: dar
          appbar: { title: { en: "Create your account", ar: "أنشئ حسابك" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, text: "", gap: m }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "", gap: l }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: l }
      - id: bold
        text: { en: "Keep the gaps, and make the labels bigger", ar: "أبقِ المسافات، واجعل العناوين أكبر" }
        mock:
          app: dar
          appbar: { title: { en: "Create your account", ar: "أنشئ حسابك" }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: text, weight: bold, text: { en: "Full name", ar: "الاسم الكامل" }, gap: m }
            - { kind: field, text: "", gap: m }
            - { kind: text, weight: bold, text: { en: "Mobile number", ar: "رقم الموبايل" }, gap: m }
            - { kind: field, text: "", gap: m }
            - { kind: text, weight: bold, text: { en: "Email", ar: "البريد الإلكتروني" }, gap: m }
            - { kind: field, text: "", gap: m }
    answer: [tight]
    misconceptions:
      - id: MC-P01-038
        when: [lines, bold]
        feedback:
          en: "Each label is still as close to the box below it as to the box above it, so \"Mobile number\" could belong to either. Move it next to its own field."
          ar: "ما زال كل عنوان قريبًا من المربع تحته بقدر قربه من المربع فوقه، فقد يخصّ «رقم الموبايل» أيًّا منهما. ضعه بجوار حقله."
    hints:
      - { en: "In the Now screen, is \"Mobile number\" nearer the box above it or the one below?", ar: "في شاشة «الآن»، هل «رقم الموبايل» أقرب إلى المربع فوقه أم تحته؟" }
      - { en: "Which version makes the gap itself say which box a label belongs to?", ar: "أي نسخة تجعل المسافة نفسها توضّح لأي مربع ينتمي العنوان؟" }
    correct:
      en: "A label hugs its own field; the bigger gap separates fields."
      ar: "العنوان ملاصق لحقله؛ والمسافة الأكبر تفصل بين الحقول."
    explain:
      en: "People pair things that are close together. Keep each label tight to its field and leave a clearly bigger gap before the next one, and nobody has to guess."
      ar: "يربط الناس بين الأشياء المتقاربة. اجعل كل عنوان ملاصقًا لحقله، واترك مسافة أكبر بوضوح قبل الحقل التالي، فلن يضطر أحد إلى التخمين."

  - id: S03
    type: card
    part: concept
    icons: [space, phone, list, group]
    title: { en: "Layout tells people what goes where", ar: "التخطيط (Layout) يخبر الناس بما يُكتب وأين" }
    body:
      en: "Before reading a word, people use position and spacing to understand a form.\n\n- **Close means related:** a label sits nearer its own field than any other field.\n- **Above, on phones:** put labels right above their fields on phones and short forms.\n- **One column:** fields in a single column give one clear path down the form.\n- **Groups with a heading:** related fields sit together under a short heading, like \"Delivery\" or \"Payment\"."
      ar: "قبل قراءة أي كلمة، يستخدم الناس المكان والمسافات لفهم النموذج.\n\n- **القريب مترابط:** العنوان أقرب إلى حقله من أي حقل آخر.\n- **فوق، على الهاتف:** ضع العناوين فوق حقولها مباشرة على الهواتف وفي النماذج القصيرة.\n- **عمود واحد:** الحقول في عمود واحد تعطي ترتيبًا واحدًا واضحًا من الأعلى إلى الأسفل.\n- **مجموعات بعنوان رئيسي:** ضع الحقول المترابطة معًا تحت عنوان رئيسي قصير، مثل «التوصيل» أو «الدفع»."

  - id: S04
    type: tune
    skill: SK-P01-U03-04
    part: guided
    rules: [R06, R15]
    value:
      en: "Form usability (NN/g): put labels immediately above the field for mobile and shorter forms. Beside the field on a narrow phone, long labels squeeze the box or wrap awkwardly."
      ar: "سهولة استخدام النماذج (NN/g): ضع العناوين فوق الحقل مباشرة على الهاتف وفي النماذج القصيرة. وبجانب الحقل على هاتف ضيّق، تضغط العناوين الطويلة المربع أو تنكسر بشكل غريب."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "immediately above the field for mobile and shorter desktop forms" }
    scenario:
      en: "Our checkout was copied from the laptop design: each label sits to the left of its box. On a 320 px phone, the labels and boxes share one narrow line."
      ar: "صفحة الدفع عندنا منسوخة من تصميم الـ Laptop: كل عنوان بجانب مربعه. وعلى هاتف بعرض 320 px، يتقاسم العنوان والمربع سطرًا واحدًا ضيقًا."
    prompt:
      en: "Try each layout on the small phone. Which one should ship?"
      ar: "جرّب كل تخطيط على الهاتف الصغير. أيّ تخطيط يُظهر ما يكتبه الناس كاملًا ويُبقي العنوان ظاهرًا؟"
    start: beside
    options:
      - id: beside
        text: { en: "Labels beside the boxes, as on the laptop", ar: "العناوين بجانب المربعات، كما على الـ Laptop" }
        mock:
          app: dar
          frame: small
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          width: 280
          caption: "320 px"
          blocks:
            - kind: row
              blocks:
                - { kind: small, weight: bold, text: { en: "Building and street", ar: "العمارة والشارع" } }
                - { kind: field, text: "" }
            - kind: row
              gap: s
              blocks:
                - { kind: small, weight: bold, text: { en: "Nearest landmark", ar: "أقرب علامة مميّزة" } }
                - { kind: field, text: "" }
      - id: above
        text: { en: "Each label right above its box", ar: "كل عنوان فوق مربعه مباشرة" }
        mock:
          app: dar
          frame: small
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          width: 280
          caption: "320 px"
          blocks:
            - { kind: field, label: { en: "Building and street", ar: "العمارة والشارع" }, text: "" }
            - { kind: field, label: { en: "Nearest landmark", ar: "أقرب علامة مميّزة" }, text: "", gap: m }
      - id: inside
        text: { en: "Labels inside the boxes, to save room", ar: "العناوين داخل المربعات، لتوفير المساحة" }
        mock:
          app: dar
          frame: small
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          width: 280
          caption: "320 px"
          blocks:
            - { kind: field, text: { en: "Building and street", ar: "العمارة والشارع" } }
            - { kind: field, text: { en: "Nearest landmark", ar: "أقرب علامة مميّزة" }, gap: s }
    answer: [above]
    misconceptions:
      - id: MC-P01-039
        when: [beside]
        feedback:
          en: "Half the width goes to the label, so the box is too narrow to show what people type, and long labels wrap into the next row. On phones, stack them."
          ar: "نصف العرض يذهب للعنوان، فيصبح المربع أضيق من أن يعرض ما يُكتب، وتنكسر العناوين الطويلة إلى السطر التالي. على الهاتف، ضع العنوان فوق المربع."
      - id: MC-P01-034
        when: [inside]
        feedback:
          en: "It saves room, but the label disappears the moment someone types. You saw this in the last lesson: labels belong outside."
          ar: "يوفّر مساحة، لكن العنوان يختفي لحظة الكتابة. رأيت هذا في الدرس الماضي: العناوين مكانها بالخارج."
    hints:
      - { en: "How wide is the box people type into in each version?", ar: "ما عرض المربع الذي يكتب فيه الناس في كل نسخة؟" }
      - { en: "Which version gives the box the full width and keeps the label visible?", ar: "أي نسخة تعطي المربع العرض الكامل وتُبقي العنوان ظاهرًا؟" }
    correct:
      en: "On a phone, the label goes right above its field."
      ar: "على الهاتف، يوضع العنوان فوق حقله مباشرة."
    explain:
      en: "Above the field, a label can be as long as it needs and the box gets the full width. People read straight down: label, box, label, box."
      ar: "فوق الحقل، يمكن أن يكون العنوان بالطول الذي يحتاجه، ويأخذ المربع العرض الكامل. ويقرأ الناس إلى الأسفل مباشرة: عنوان، مربع، عنوان، مربع."

  - id: S05
    type: tune
    skill: SK-P01-U03-05
    part: guided
    rules: [R06, R15]
    value:
      en: "Form usability (NN/g): present fields in a single column; multiple columns interrupt the vertical momentum of moving down the form, and people skip or misorder fields."
      ar: "سهولة استخدام النماذج (NN/g): اعرض الحقول في عمود واحد؛ فالأعمدة المتعدّدة تقطع الحركة المستمرة إلى أسفل النموذج، فيتخطّى الناس حقولًا أو يملؤونها بترتيب خاطئ."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Multiple columns interrupt the vertical momentum of moving down the form." }
    scenario:
      en: "On tablets, my team put the sign-up fields in two columns to make the form look shorter. Several customers left the right-hand fields empty."
      ar: "على الأجهزة اللوحية، وضع فريقي حقول التسجيل في عمودين ليبدو النموذج أقصر. وترك عدد من العملاء حقول العمود الثاني فارغة."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّ تخطيط يجعل العملاء يملؤون كل الحقول دون أن يتخطّوا شيئًا؟"
    mock:
      app: dar
      frame: tablet
      appbar: { title: { en: Create account, ar: إنشاء حساب }, back: true }
      caption: { en: "Now", ar: "الآن" }
      width: 340
      blocks: &twocol
        - kind: row
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, text: "" }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "" }
        - kind: row
          gap: m
          blocks:
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "" }
            - { kind: field, label: { en: "City", ar: "المدينة" }, text: "" }
      footer:
        - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" } }
    options:
      - id: keep
        text: { en: "Keep two columns; it looks shorter", ar: "أبقِ العمودين؛ فالنموذج يبدو أقصر" }
        mock:
          app: dar
          frame: tablet
          appbar: { title: { en: Create account, ar: إنشاء حساب }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks: *twocol
          footer:
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" } }
      - id: number
        text: { en: "Keep two columns, and number the fields 1 to 4", ar: "أبقِ العمودين، ورقّم الحقول من 1 إلى 4" }
        mock:
          app: dar
          frame: tablet
          appbar: { title: { en: Create account, ar: إنشاء حساب }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: { en: "1. Full name", ar: "1. الاسم الكامل" }, text: "" }
                - { kind: field, label: { en: "2. Mobile number", ar: "2. رقم الموبايل" }, text: "" }
            - kind: row
              gap: m
              blocks:
                - { kind: field, label: { en: "3. Email", ar: "3. البريد الإلكتروني" }, text: "" }
                - { kind: field, label: { en: "4. City", ar: "4. المدينة" }, text: "" }
          footer:
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" } }
      - id: one
        text: { en: "One column, one field under the other", ar: "عمود واحد، حقل تحت الآخر" }
        mock:
          app: dar
          frame: tablet
          appbar: { title: { en: Create account, ar: إنشاء حساب }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, text: "" }
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: "", gap: m }
            - { kind: field, label: { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: m }
            - { kind: field, label: { en: "City", ar: "المدينة" }, text: "", gap: m }
          footer:
            - { kind: button, text: { en: "Create account", ar: "أنشئ الحساب" } }
    answer: [one]
    misconceptions:
      - id: MC-P01-040
        when: [keep]
        feedback:
          en: "Looking shorter isn't the goal. With two columns, people go down the first one and miss the second, which is what happened. One column has one path."
          ar: "أن يبدو أقصر ليس الهدف. مع عمودين، ينزل الناس في العمود الأول ويفوتهم الثاني، وهذا ما حدث. أما العمود الواحد فله ترتيب واحد."
      - id: MC-P01-040
        when: [number]
        feedback:
          en: "Numbers make people zigzag on purpose: across, back, across. One column needs no numbers because the order is simply top to bottom."
          ar: "الأرقام تجعل الناس يتنقّلون عمدًا بين العمودين ذهابًا وإيابًا. والعمود الواحد لا يحتاج أرقامًا لأن الترتيب ببساطة من الأعلى إلى الأسفل."
    hints:
      - { en: "In two columns, after Full name, which field comes next: the one beside it or the one below?", ar: "في العمودين، بعد «الاسم الكامل»، أي حقل يأتي: الذي بجانبه أم الذي تحته؟" }
      - { en: "Which layout has only one possible order?", ar: "أي تخطيط له ترتيب واحد ممكن فقط؟" }
    correct:
      en: "One column: one clear path, nothing skipped."
      ar: "عمود واحد: ترتيب واحد واضح، ولا شيء يُتخطّى."
    explain:
      en: "A form is filled in order, so give it one order. In a single column, every field sits on the path down to the button."
      ar: "النموذج يُملأ بالترتيب، فأعطه ترتيبًا واحدًا. في العمود الواحد، كل حقل يقع في الطريق إلى الزر."

  - id: S06
    type: tune
    skill: SK-P01-U03-05
    part: guided
    rules: [R06, R15]
    value:
      en: "White space in forms (NN/g): grouping related fields together helps people make sense of what they must fill in, and a group heading can add context."
      ar: "المسافات في النماذج (NN/g): جمع الحقول المترابطة معًا يساعد الناس على فهم ما عليهم ملؤه، وعنوان المجموعة يضيف سياقًا."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "Grouping related fields together helps users make sense of the information that they must fill in." }
    scenario:
      en: "Our checkout now has eight fields in one even list: three about the person receiving the order, three about the address, and two about payment."
      ar: "صفحة الدفع عندنا فيها الآن ثمانية حقول في قائمة واحدة متساوية: ثلاثة عن مستلم الطلب، وثلاثة عن العنوان، واثنان عن الدفع."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّ نسخة تجعل العملاء يعرفون بنظرة أين بيانات المستلم والعنوان والدفع؟"
    start: list
    options:
      - id: list
        text: { en: "One even list of eight fields", ar: "قائمة واحدة متساوية من ثمانية حقول" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: { en: "Receiver's name", ar: "اسم المستلم" }, text: "" }
            - { kind: field, label: { en: "Receiver's mobile", ar: "موبايل المستلم" }, text: "", gap: s }
            - { kind: field, label: { en: "Area", ar: "المنطقة" }, text: "", gap: s }
            - { kind: field, label: { en: "Street and building", ar: "الشارع والعمارة" }, text: "", gap: s }
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, text: "", gap: s }
            - { kind: small, text: { en: "+ 3 more fields", ar: "+ 3 حقول أخرى" }, gap: s }
      - id: groups
        text: { en: "Three groups, each under a short heading", ar: "ثلاث مجموعات، كل منها تحت عنوان رئيسي قصير" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: heading, text: { en: "Who receives it", ar: "من يستلم الطلب" } }
            - { kind: field, label: { en: "Receiver's name", ar: "اسم المستلم" }, text: "", gap: s }
            - { kind: field, label: { en: "Receiver's mobile", ar: "موبايل المستلم" }, text: "", gap: s }
            - { kind: heading, text: { en: "Where to deliver", ar: "عنوان التوصيل" }, gap: l }
            - { kind: field, label: { en: "Area", ar: "المنطقة" }, text: "", gap: s }
            - { kind: field, label: { en: "Street and building", ar: "الشارع والعمارة" }, text: "", gap: s }
            - { kind: heading, text: { en: "Payment", ar: "الدفع" }, gap: l }
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, text: "", gap: s }
      - id: cards
        text: { en: "Each field in its own card with a shadow", ar: "كل حقل في بطاقة مستقلة بظل" }
        mock:
          app: dar
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: group, tone: tint, blocks: [{ kind: field, label: { en: "Receiver's name", ar: "اسم المستلم" }, text: "" }] }
            - { kind: group, tone: tint, gap: s, blocks: [{ kind: field, label: { en: "Receiver's mobile", ar: "موبايل المستلم" }, text: "" }] }
            - { kind: group, tone: tint, gap: s, blocks: [{ kind: field, label: { en: "Area", ar: "المنطقة" }, text: "" }] }
            - { kind: group, tone: tint, gap: s, blocks: [{ kind: field, label: { en: "Street and building", ar: "الشارع والعمارة" }, text: "" }] }
            - { kind: small, text: { en: "+ 4 more cards", ar: "+ 4 بطاقات أخرى" }, gap: s }
    answer: [groups]
    misconceptions:
      - id: MC-P01-041
        when: [list]
        feedback:
          en: "Eight equal fields make one long wall. People can't see that the order has three parts, or how far along they are."
          ar: "ثمانية حقول متساوية تبدو كتلة واحدة طويلة. ولا يرى الناس أن الطلب من ثلاثة أجزاء، ولا إلى أين وصلوا."
      - id: MC-P01-041
        when: [cards]
        feedback:
          en: "A card around every field separates everything equally, so nothing looks related. Group the fields that belong together."
          ar: "بطاقة حول كل حقل تفصل كل شيء بالتساوي، فلا يبدو أي شيء مترابطًا. اجمع الحقول التي تخصّ موضوعًا واحدًا."
    hints:
      - { en: "The eight fields are really about three things. Which version shows that?", ar: "الحقول الثمانية في الحقيقة عن ثلاثة أشياء. أي نسخة تُظهر ذلك؟" }
      - { en: "Which version puts related fields close together and unrelated ones apart?", ar: "أي نسخة تقرّب الحقول المترابطة وتُبعد غير المترابطة؟" }
    correct:
      en: "Related fields together, under a short heading."
      ar: "الحقول المترابطة معًا، تحت عنوان رئيسي قصير."
    explain:
      en: "Groups turn one long form into three short tasks. The headings tell people what each part is about, and the spacing shows where it ends."
      ar: "المجموعات تحوّل نموذجًا طويلًا واحدًا إلى ثلاث مهام قصيرة. والعناوين الرئيسية تخبر الناس عمّا يخصّه كل جزء، والمسافات تُظهر أين ينتهي."

  - id: S07
    type: compare
    skill: SK-P01-U03-04
    part: contrast
    confidence: true
    rules: [R11, R15]
    value:
      en: "Contrast with S02: here both versions use tight spacing, but B puts each label under its field, so it sits right on top of the next field. White space in forms (NN/g): items near each other appear related."
      ar: "مقارنة مع الخطوة 2: هنا تستخدم النسختان مسافات ضيقة، لكن B تضع كل عنوان تحت حقله، فيقع مباشرة فوق الحقل التالي. المسافات في النماذج (NN/g): العناصر المتقاربة تبدو مترابطة."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "items near each other appear related" }
    scenario:
      en: "A designer suggested putting the label under each box, \"like a caption\". Both versions below use the same tight spacing."
      ar: "اقترح أحد المصمّمين وضع العنوان تحت كل مربع، «مثل التعليق على صورة». والنسختان أدناه بالمسافات الضيقة نفسها."
    prompt:
      en: "Which version should ship?"
      ar: "أيّ نسخة تجعل كل عنوان يقود العين مباشرة إلى مربعه الصحيح؟"
    a:
      mock:
        app: dar
        appbar: { title: { en: Delivery address, ar: عنوان التوصيل }, back: true }
        blocks:
          - { kind: field, label: { en: "Area", ar: "المنطقة" }, text: "" }
          - { kind: field, label: { en: "Street and building", ar: "الشارع والعمارة" }, text: "", gap: l }
          - { kind: field, label: { en: "Floor and flat", ar: "الدور والشقة" }, text: "", gap: l }
    b:
      mock:
        app: dar
        appbar: { title: { en: Delivery address, ar: عنوان التوصيل }, back: true }
        blocks:
          - { kind: field, text: "" }
          - { kind: small, weight: bold, text: { en: "Area", ar: "المنطقة" }, gap: xs }
          - { kind: field, text: "", gap: l }
          - { kind: small, weight: bold, text: { en: "Street and building", ar: "الشارع والعمارة" }, gap: xs }
          - { kind: field, text: "", gap: l }
          - { kind: small, weight: bold, text: { en: "Floor and flat", ar: "الدور والشقة" }, gap: xs }
    answer: a
    reason:
      prompt: { en: "Why does B confuse people?", ar: "لماذا تُربك B الناس؟" }
      options:
        - { id: next, text: { en: "Each label also sits right above the next box", ar: "كل عنوان يقع أيضًا فوق المربع التالي مباشرة" } }
        - { id: font, text: { en: "Its labels are in a smaller font", ar: "عناوينها بخط أصغر" } }
        - { id: count, text: { en: "It has more lines on the screen", ar: "فيها أسطر أكثر على الشاشة" } }
      answer: [next]
      misconceptions:
        - id: MC-P01-038
          when: [font, count]
          feedback:
            en: "Size and line count aren't the problem. People read a label, then look for the box under it, and in B that's the wrong box."
            ar: "الحجم وعدد الأسطر ليسا المشكلة. يقرأ الناس العنوان، ثم يبحثون عن المربع تحته، وفي B هذا هو المربع الخطأ."
    misconceptions:
      - id: MC-P01-038
        when: [b]
        feedback:
          en: "In B, \"Area\" sits under the first box and right on top of the second. People read down, so many will type the area into the second box."
          ar: "في B، تقع «المنطقة» تحت المربع الأول ومباشرة فوق الثاني. والناس يقرؤون إلى الأسفل، فسيكتب كثيرون المنطقة في المربع الثاني."
    hints:
      - { en: "In B, which box is right under the word \"Area\"?", ar: "في B، أي مربع يقع مباشرة تحت كلمة «المنطقة»؟" }
      - { en: "When people read a label, where do they expect its box?", ar: "حين يقرأ الناس عنوانًا، أين يتوقّعون مربعه؟" }
    correct:
      en: "Label above its box, so nothing sits between them."
      ar: "العنوان فوق مربعه، فلا يفصل بينهما شيء."
    explain:
      en: "Tight spacing isn't enough on its own. The label has to be on the side people read first, above, so the box they meet next is the right one."
      ar: "المسافة الضيقة وحدها لا تكفي. يجب أن يكون العنوان في الجهة التي يقرؤها الناس أولًا، أي فوق، ليكون المربع الذي يصلون إليه بعده هو الصحيح."

  - id: S08
    type: tune
    skill: SK-P01-U03-05
    part: independent
    speaker: hana
    rules: [R14, R19]
    value:
      en: "New case. Form usability (NN/g): visually group related labels and fields, in a single column. The gym form mixes the member's details with the emergency contact's, side by side."
      ar: "حالة جديدة. سهولة استخدام النماذج (NN/g): اجمع العناوين والحقول المترابطة بصريًا، في عمود واحد. ونموذج النادي يخلط بيانات العضو ببيانات جهة الطوارئ، جنبًا إلى جنب."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Visually group related labels and fields." }
    scenario:
      en: "My gym's membership form shows the member's details in one column and an emergency contact in the column beside it. Several new members wrote their own mobile number as the emergency number."
      ar: "نموذج الاشتراك في ناديّ يعرض بيانات العضو في عمود، وبيانات شخص للطوارئ في العمود المجاور. وكتب عدد من الأعضاء الجدد رقمهم هم كرقم للطوارئ."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّ تخطيط يجعل الأعضاء الجدد يكتبون رقم شخص آخر في خانة الطوارئ؟"
    mock:
      app: nashat
      appbar: { title: { en: Membership, ar: العضوية }, back: true }
      caption: { en: "Now", ar: "الآن" }
      width: 340
      blocks: &gymnow
        - kind: row
          blocks:
            - { kind: field, label: { en: "Your name", ar: "اسمك" }, text: "" }
            - { kind: field, label: { en: "Contact name", ar: "اسم شخص للطوارئ" }, text: "" }
        - kind: row
          gap: m
          blocks:
            - { kind: field, label: { en: "Your mobile", ar: "رقم موبايلك" }, text: "" }
            - { kind: field, label: { en: "Contact mobile", ar: "رقم شخص للطوارئ" }, text: "" }
    options:
      - id: stack
        text: { en: "One column: your details, then \"In an emergency, call\"", ar: "عمود واحد: بياناتك، ثم «في حالة الطوارئ، اتصل بـ»" }
        mock:
          app: nashat
          appbar: { title: { en: Membership, ar: العضوية }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks:
            - { kind: heading, text: { en: "Your details", ar: "بياناتك" } }
            - { kind: field, label: { en: "Your name", ar: "اسمك" }, text: "", gap: s }
            - { kind: field, label: { en: "Your mobile", ar: "رقم موبايلك" }, text: "", gap: s }
            - { kind: heading, text: { en: "In an emergency, call", ar: "في حالة الطوارئ، اتصل بـ" }, gap: l }
            - { kind: field, label: { en: "Their name", ar: "اسمه" }, text: "", gap: s }
            - { kind: field, label: { en: "Their mobile", ar: "رقم موبايله" }, text: "", gap: s }
      - id: color
        text: { en: "Keep both columns; tint the emergency column", ar: "أبقِ العمودين؛ ولوّن عمود الطوارئ" }
        mock:
          app: nashat
          appbar: { title: { en: Membership, ar: العضوية }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: { en: "Your name", ar: "اسمك" }, text: "" }
                - { kind: group, tone: tint, blocks: [{ kind: field, label: { en: "Contact name", ar: "اسم شخص للطوارئ" }, text: "" }] }
            - kind: row
              gap: m
              blocks:
                - { kind: field, label: { en: "Your mobile", ar: "رقم موبايلك" }, text: "" }
                - { kind: group, tone: tint, blocks: [{ kind: field, label: { en: "Contact mobile", ar: "رقم شخص للطوارئ" }, text: "" }] }
      - id: keep
        text: { en: "Keep it; the labels say whose details they are", ar: "أبقِ النموذج كما هو؛ فالعناوين توضّح لمن كل بيانات" }
        mock:
          app: nashat
          appbar: { title: { en: Membership, ar: العضوية }, back: true }
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 340
          blocks: *gymnow
    answer: [stack]
    misconceptions:
      - id: MC-P01-040
        when: [keep, color]
        feedback:
          en: "Side by side, \"Your mobile\" and \"Contact mobile\" look like a pair, and people fill the row from left to right. One column with a heading per person keeps the two sets apart."
          ar: "حين يكونان جنبًا إلى جنب، يبدو «رقم موبايلك» و«رقم شخص للطوارئ» كزوج، ويملأ الناس السطر من جهة إلى أخرى. وعمود واحد بعنوان رئيسي لكل شخص يفصل المجموعتين."
    hints:
      - { en: "Which fields belong to the member, and which to someone else?", ar: "أي الحقول تخصّ العضو، وأيها تخصّ شخصًا آخر؟" }
      - { en: "Which layout puts each person's fields together, one after the other?", ar: "أي تخطيط يجمع حقول كل شخص معًا، واحدًا بعد الآخر؟" }
    correct:
      en: "One column, one group per person."
      ar: "عمود واحد، ومجموعة لكل شخص."
    explain:
      en: "Two people's details are two groups. Stacking them, each under its own heading, makes the switch from \"you\" to \"them\" impossible to miss."
      ar: "بيانات شخصين هي مجموعتان. ووضع إحداهما تحت الأخرى، كلٌّ تحت عنوانها الرئيسي، يجعل الانتقال من «أنت» إلى «هو» واضحًا لا يُفوَّت."

  - id: S09
    type: card
    part: recap
    icons: [space, phone, list, group]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Close means related:** moved each label next to its own field, with a bigger gap before the next.\n- **Above on phones:** stacked labels over fields on a small screen.\n- **Label first:** kept labels above, never below, their boxes.\n- **One column:** replaced two columns that made people skip fields.\n- **Groups:** split a long checkout, and a gym form, into groups with headings.\n\nNext lesson: say the rules before people type."
      ar: "- **القريب مترابط:** نقلت كل عنوان بجوار حقله، مع مسافة أكبر قبل الحقل التالي.\n- **فوق على الهاتف:** وضعت العناوين فوق الحقول على الشاشة الصغيرة.\n- **العنوان أولًا:** أبقيت العناوين فوق مربعاتها، لا تحتها أبدًا.\n- **عمود واحد:** استبدلت عمودين جعلا الناس يتخطّون حقولًا.\n- **المجموعات:** قسّمت صفحة دفع طويلة، ونموذج نادٍ، إلى مجموعات بعناوين رئيسية.\n\nالدرس التالي: اذكر القواعد قبل أن يكتب الناس."
