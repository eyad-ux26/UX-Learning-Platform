id: P01-U03
free: false
title:
  en: "Keep labels and hints in sight"
  ar: "أبقِ العناوين والتلميحات ظاهرة"
skill:
  en: "Label every field so its meaning stays visible while people type, and say the rules before they start."
  ar: "ضع عنوانًا لكل حقل يبقى ظاهرًا أثناء الكتابة، واذكر القواعد قبل أن يبدأ الناس."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P01-U03-01
    title: { en: "Label fields outside the box", ar: "ضع عنوان الحقل خارج المربع" }
    can_do: { en: "Give every field a visible label outside it, instead of placeholder text that vanishes.", ar: "أعطِ كل حقل عنوانًا ظاهرًا خارجه، بدل نص داخلي (Placeholder) يختفي." }
  - id: SK-P01-U03-02
    title: { en: "Keep hints visible while typing", ar: "أبقِ التلميحات ظاهرة أثناء الكتابة" }
    can_do: { en: "Put format hints and examples outside the field, where they stay while people type.", ar: "ضع تلميحات الصيغة والأمثلة خارج الحقل، حيث تبقى أثناء الكتابة." }
  - id: SK-P01-U03-03
    title: { en: "Don't hide what people need in a tooltip", ar: "لا تُخفِ ما يحتاجه الناس في Tooltip" }
    can_do: { en: "Show information people need to finish on the screen, not behind an info icon or hover.", ar: "اعرض المعلومات التي يحتاجها الناس لإكمال المهمة على الشاشة، لا خلف أيقونة معلومات أو تمرير الماوس." }
  - id: SK-P01-U03-04
    title: { en: "Put each label right above its field", ar: "ضع كل عنوان فوق حقله مباشرة" }
    can_do: { en: "Place each label above its own field and closer to it than to any other field.", ar: "ضع كل عنوان فوق حقله، وأقرب إليه من أي حقل آخر." }
  - id: SK-P01-U03-05
    title: { en: "One column, grouped", ar: "عمود واحد، في مجموعات" }
    can_do: { en: "Lay out fields in a single column, with related fields grouped under a short heading.", ar: "رتّب الحقول في عمود واحد، مع جمع الحقول المترابطة تحت عنوان رئيسي قصير." }
  - id: SK-P01-U03-06
    title: { en: "Say the rules before people type", ar: "اذكر القواعد قبل أن يكتب الناس" }
    can_do: { en: "State exact requirements, like password rules or a required format, before the person types.", ar: "اذكر الشروط بدقة، مثل قواعد كلمة المرور أو الصيغة المطلوبة، قبل أن يكتب الشخص." }
