steps:
  # SK-P01-U03-01: label fields outside the box
  - id: S01
    type: tune
    skill: SK-P01-U03-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test, placeholders (NN/g): the best fix is a clear, visible label outside the field. With grey text only, Adel can't check which city went in which box once both are typed."
      ar: "إعادة اختبار، النص الداخلي (NN/g): أفضل حل هو عنوان واضح وظاهر خارج الحقل. ومع النص الرمادي وحده، لا يستطيع عادل التأكّد أيّ مدينة كتبها في أيّ مربع بعد ملء الاثنين."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "the best solution is to have clear, visible labels that are placed outside empty form fields." }
    scenario:
      en: "I manage the product for a car rental site. Adel books a car from Cairo and returns it in Hurghada. Our two city boxes have no labels, only grey text inside: \"Pick-up city\" and \"Return city\". Once he types, the grey text is gone."
      ar: "أنا مدير المنتج لموقع تأجير سيارات. يحجز عادل سيارة يستلمها في القاهرة ويسلّمها في الغردقة. ومربّعا المدينتين عندنا بلا عناوين، فقط نص رمادي بالداخل: «مدينة الاستلام» و«مدينة التسليم». وحين يكتب، يختفي النص الرمادي."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: grey
    options:
      - id: grey
        text: { en: "Keep the grey text inside each box", ar: "أبقِ النص الرمادي داخل كل مربع" }
        mock:
          app: dawra
          frame: wide
          url: dawra.example
          blocks:
            - { kind: title, text: &cr_t { en: "Book a car", ar: "احجز سيارة" } }
            - { kind: field, filled: true, text: { en: "Cairo", ar: "القاهرة" }, gap: m }
            - { kind: field, filled: true, text: { en: "Hurghada", ar: "الغردقة" }, gap: s }
            - { kind: button, text: &cr_b { en: "See cars", ar: "اعرض السيارات" }, gap: m }
      - id: dark
        text: { en: "Make the text inside darker and bold", ar: "اجعل النص الداخلي أغمق وعريضًا" }
        mock:
          app: dawra
          frame: wide
          url: dawra.example
          blocks:
            - { kind: title, text: *cr_t }
            - { kind: field, filled: true, text: { en: "Cairo", ar: "القاهرة" }, gap: m }
            - { kind: field, filled: true, text: { en: "Hurghada", ar: "الغردقة" }, gap: s }
            - { kind: button, text: *cr_b, gap: m }
      - id: label
        text: { en: "Put a label above each box", ar: "ضع عنوانًا فوق كل مربع" }
        mock:
          app: dawra
          frame: wide
          url: dawra.example
          blocks:
            - { kind: title, text: *cr_t }
            - { kind: field, label: { en: "Pick-up city", ar: "مدينة الاستلام" }, filled: true, text: { en: "Cairo", ar: "القاهرة" }, gap: m }
            - { kind: field, label: { en: "Return city", ar: "مدينة التسليم" }, filled: true, text: { en: "Hurghada", ar: "الغردقة" }, gap: s }
            - { kind: button, text: *cr_b, gap: m }
    answer: [label]
    misconceptions:
      - id: MC-P01-034
        when: [grey, dark]
        feedback:
          en: "Look at the preview: both boxes are filled, and nothing says which is pick-up and which is return. Styling the text inside doesn't help, because it's gone once Adel types."
          ar: "انظر إلى المعاينة: المربعان ممتلئان، ولا شيء يقول أيّهما للاستلام وأيّهما للتسليم. وتغيير شكل النص الداخلي لا يفيد، لأنه يختفي حين يكتب عادل."
    correct:
      en: "Right. The labels stay, so Adel can check his cities before he books."
      ar: "صحيح. العناوين تبقى، فيستطيع عادل مراجعة المدينتين قبل الحجز."
    explain:
      en: "Text inside a field disappears exactly when people need to check their answers. A label outside the field is still there after typing."
      ar: "النص داخل الحقل يختفي في اللحظة التي يحتاج فيها الناس لمراجعة إجاباتهم. أما العنوان خارج الحقل فيبقى بعد الكتابة."

  - id: S02
    type: tune
    skill: SK-P01-U03-01
    part: retest
    speaker: mona
    value:
      en: "Re-test, placeholders (NN/g): people may mistake a placeholder for data that was filled in for them. A dose box that seems filled gets skipped, and the pharmacist has to call."
      ar: "إعادة اختبار، النص الداخلي (NN/g): قد يظن الناس أن النص الداخلي بيانات مُعبّأة لهم. ومربع الجرعة الذي يبدو ممتلئًا يُتخطّى، فيضطر الصيدلي إلى الاتصال."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "Users may mistake a placeholder for data that was automatically filled in." }
    scenario:
      en: "I'm designing a pharmacy refill form. Half the requests arrive without a dose. The dose box shows \"500 mg\" in light grey until someone types, and Laila thought we already knew her dose."
      ar: "أصمّم نموذجًا لإعادة صرف الأدوية من صيدلية. نصف الطلبات تصل بلا جرعة. ومربع الجرعة يعرض «500 mg» بلون رمادي فاتح حتى يكتب أحد، وظنّت ليلى أننا نعرف جرعتها بالفعل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: inside
    options:
      - id: outside
        text: { en: "Label above, example under the box, box empty", ar: "عنوان فوق المربع، ومثال تحته، والمربع فارغ" }
        mock:
          app: dawaa
          appbar: { title: { en: Refill, ar: إعادة صرف }, back: true }
          blocks:
            - { kind: field, label: &ph_m { en: "Medicine", ar: "الدواء" }, filled: true, text: { en: "Metformin", ar: "Metformin" } }
            - { kind: field, label: { en: "Dose", ar: "الجرعة" }, hint: { en: "As written on the box, for example 500 mg", ar: "كما هي مكتوبة على العلبة، مثل 500 mg" }, text: "", gap: m }
      - id: inside
        text: { en: "Keep \"500 mg\" in grey inside the box", ar: "أبقِ «500 mg» بالرمادي داخل المربع" }
        mock:
          app: dawaa
          appbar: { title: { en: Refill, ar: إعادة صرف }, back: true }
          blocks:
            - { kind: field, label: *ph_m, filled: true, text: { en: "Metformin", ar: "Metformin" } }
            - { kind: field, text: "500 mg", gap: m }
      - id: prefix
        text: { en: "Change the grey text to \"e.g. 500 mg\"", ar: "غيّر النص الرمادي إلى «مثال: 500 mg»" }
        mock:
          app: dawaa
          appbar: { title: { en: Refill, ar: إعادة صرف }, back: true }
          blocks:
            - { kind: field, label: *ph_m, filled: true, text: { en: "Metformin", ar: "Metformin" } }
            - { kind: field, text: { en: "e.g. 500 mg", ar: "مثال: 500 mg" }, gap: m }
    answer: [outside]
    misconceptions:
      - id: MC-P01-036
        when: [inside]
        feedback:
          en: "To Laila, \"500 mg\" in a box looks like an answer. That's why she skipped it."
          ar: "بالنسبة إلى ليلى، «500 mg» داخل المربع تبدو إجابة. ولهذا تخطّته."
      - id: MC-P01-034
        when: [prefix]
        feedback:
          en: "\"e.g.\" helps a little, but the box still has no label, and the example vanishes when she types. Both need to sit outside the box."
          ar: "كلمة «مثال» تساعد قليلًا، لكن المربع ما زال بلا عنوان، والمثال يختفي حين تكتب. يجب أن يكون الاثنان خارج المربع."
    correct:
      en: "Right. An empty box with a label looks like a question waiting for an answer."
      ar: "صحيح. المربع الفارغ مع عنوان يبدو سؤالًا ينتظر إجابة."
    explain:
      en: "Grey text inside a box can pass for a value someone already entered. Keep the box empty, name it above, and put the example below."
      ar: "النص الرمادي داخل المربع قد يبدو قيمة أدخلها أحد بالفعل. اترك المربع فارغًا، وسمّه بعنوان فوقه، وضع المثال تحته."

  # SK-P01-U03-02: keep hints visible while typing
  - id: S03
    type: tune
    skill: SK-P01-U03-02
    part: retest
    speaker: sara
    value:
      en: "Re-test, placeholders (NN/g): hints and instructions should stay visible and sit outside the field. A digit count is useless if it disappears at the first digit."
      ar: "إعادة اختبار، النص الداخلي (NN/g): التلميحات والتعليمات يجب أن تبقى ظاهرة وتوضع خارج الحقل. وعدد الأرقام لا يفيد إن اختفى مع أول رقم."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "Hints and instructions should also be persistent and placed outside of the field." }
    scenario:
      en: "I'm building a school sign-up form. Shady types his son's national ID, which has 14 digits. The hint \"14 digits, on the birth certificate\" sits inside the box, and he's typed 9 digits so far."
      ar: "أبني نموذج تسجيل لمدرسة. يكتب شادي الرقم القومي لابنه، وهو 14 رقمًا. والتلميح «14 رقمًا، تجده في شهادة الميلاد» داخل المربع، وقد كتب 9 أرقام حتى الآن."
    prompt:
      en: "Try each place for the hint. Which one should ship?"
      ar: "جرّب كل مكان للتلميح. أيّها يجب أن يُطلق؟"
    start: inside
    options:
      - id: inside
        text: { en: "Inside the box", ar: "داخل المربع" }
        mock:
          app: { name: { en: Fasli, ar: فصلي }, color: '#F59F00', icon: backpack, domain: fasli.example }
          appbar: { title: { en: Sign up, ar: التسجيل }, back: true }
          blocks:
            - { kind: field, label: &sc_l { en: "Child's national ID", ar: "الرقم القومي للطفل" }, filled: true, focus: true, text: "⁦318 0520 01⁩" }
      - id: below
        text: { en: "Under the box", ar: "تحت المربع" }
        mock:
          app: { name: { en: Fasli, ar: فصلي }, color: '#F59F00', icon: backpack, domain: fasli.example }
          appbar: { title: { en: Sign up, ar: التسجيل }, back: true }
          blocks:
            - { kind: field, label: *sc_l, filled: true, focus: true, text: "⁦318 0520 01⁩", hint: { en: "14 digits, on the birth certificate", ar: "14 رقمًا، تجده في شهادة الميلاد" } }
      - id: tip
        text: { en: "Behind an ⓘ next to the label", ar: "خلف ⓘ بجوار العنوان" }
        mock:
          app: { name: { en: Fasli, ar: فصلي }, color: '#F59F00', icon: backpack, domain: fasli.example }
          appbar: { title: { en: Sign up, ar: التسجيل }, back: true }
          blocks:
            - { kind: field, label: { en: "Child's national ID ⓘ", ar: "الرقم القومي للطفل ⓘ" }, filled: true, focus: true, text: "⁦318 0520 01⁩" }
    answer: [below]
    misconceptions:
      - id: MC-P01-035
        when: [inside]
        feedback:
          en: "In the preview, Shady is mid-typing and the hint is gone. He needs \"14 digits\" now, to know how many are left."
          ar: "في المعاينة، شادي في منتصف الكتابة والتلميح اختفى. وهو يحتاج «14 رقمًا» الآن، ليعرف كم تبقّى."
      - id: MC-P01-037
        when: [tip]
        feedback:
          en: "The digit count is needed by everyone, so it can't wait behind an icon that most people never open."
          ar: "عدد الأرقام يحتاجه الجميع، فلا يصح أن ينتظر خلف أيقونة لا يفتحها أغلب الناس."
    correct:
      en: "Right. Under the box, the hint is still there at digit 9."
      ar: "صحيح. تحت المربع، يبقى التلميح ظاهرًا عند الرقم التاسع."
    explain:
      en: "A hint helps while people type and when they check. Outside the box, nothing they type can hide it."
      ar: "التلميح يساعد أثناء الكتابة وعند المراجعة. وخارج المربع، لا شيء يكتبونه يخفيه."

  - id: S04
    type: tune
    skill: SK-P01-U03-02
    part: retest
    speaker: karim
    value:
      en: "Re-test, placeholders (NN/g): a placeholder combined with a label is a step forward, but the hint inside still vanishes. The expiry format belongs outside the field."
      ar: "إعادة اختبار، النص الداخلي (NN/g): الجمع بين العنوان والنص الداخلي خطوة للأمام، لكن التلميح بالداخل ما زال يختفي. وصيغة تاريخ الانتهاء مكانها خارج الحقل."
    ref: { url: "https://www.nngroup.com/articles/form-design-placeholders/", quote: "Using placeholder text in combination with form labels is a step in the right direction" }
    scenario:
      en: "I'm working on a card payment form. The \"Expiry date\" field has \"MM/YY\" in grey inside it. Reem typed \"2\", stopped, and wondered whether the month comes first."
      ar: "أعمل على نموذج دفع بالبطاقة. حقل «تاريخ الانتهاء» بداخله «MM/YY» بالرمادي. كتبت ريم «2»، ثم توقّفت، وتساءلت: هل الشهر أولًا؟"
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: inside
    options:
      - id: inside
        text: { en: "Keep \"MM/YY\" inside the field", ar: "أبقِ «MM/YY» داخل الحقل" }
        mock:
          app: zad
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: &ex_l { en: "Expiry date", ar: "تاريخ الانتهاء" }, filled: true, focus: true, text: "2" }
      - id: error
        text: { en: "Say the format only if her date is wrong", ar: "اذكر الصيغة فقط إن كان تاريخها خطأ" }
        mock:
          app: zad
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: *ex_l, filled: true, focus: true, text: "2" }
      - id: below
        text: { en: "Under the field: \"Month then year, like 08/27\"", ar: "تحت الحقل: «الشهر ثم السنة، مثل 08/27»" }
        mock:
          app: zad
          appbar: { title: { en: Payment, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: *ex_l, filled: true, focus: true, text: "2", hint: { en: "Month then year, like 08/27", ar: "الشهر ثم السنة، مثل 08/27" } }
    answer: [below]
    misconceptions:
      - id: MC-P01-035
        when: [inside]
        feedback:
          en: "The preview shows it: one digit in, and \"MM/YY\" is gone. That's the moment Reem got stuck."
          ar: "المعاينة توضّح ذلك: رقم واحد، واختفت «MM/YY». وهذه هي اللحظة التي توقّفت فيها ريم."
      - id: MC-P01-042
        when: [error]
        feedback:
          en: "Reem is unsure now, before she's wrong. An error later makes her guess first and fix after."
          ar: "ريم مترددة الآن، قبل أن تخطئ. والخطأ لاحقًا يجعلها تخمّن أولًا ثم تصلح بعد ذلك."
    correct:
      en: "Right. The format stays under the field while she types."
      ar: "صحيح. الصيغة تبقى تحت الحقل أثناء الكتابة."
    explain:
      en: "Formats like month-then-year are what people check halfway through. Keep them in sight outside the field."
      ar: "الصيغ مثل «الشهر ثم السنة» هي ما يراجعه الناس في منتصف الكتابة. أبقِها ظاهرة خارج الحقل."

  # SK-P01-U03-03: don't hide what people need in a tooltip
  - id: S05
    type: tune
    skill: SK-P01-U03-03
    part: retest
    speaker: hana
    value:
      en: "Re-test, tooltips (NN/g): users shouldn't have to find a tooltip to complete their task. If the gate checks the name against an ID, everyone needs that rule."
      ar: "إعادة اختبار، الـ Tooltip (NN/g): يجب ألّا يحتاج المستخدم إلى العثور على Tooltip ليُكمل مهمّته. وإن كانت البوابة تطابق الاسم مع البطاقة، فالجميع يحتاج هذه القاعدة."
    ref: { url: "https://www.nngroup.com/articles/tooltip-guidelines/", quote: "Users shouldn’t need to find a tooltip in order to complete their task." }
    scenario:
      en: "My gym runs a charity race, and people buy tickets for friends on our site. At the gate, staff check that the name on the ticket matches the guest's ID. Basma bought tickets with nicknames, because \"Use the name on your ID\" was behind the ⓘ."
      ar: "ينظّم نادينا سباقًا خيريًا، ويشتري الناس تذاكر لأصدقائهم من موقعنا. عند البوابة، يتأكّد الموظفون أن الاسم على التذكرة يطابق بطاقة الضيف. واشترت بسمة تذاكر بأسماء الدلع، لأن عبارة «اكتب الاسم كما في بطاقتك» كانت خلف ⓘ."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: tip
    options:
      - id: visible
        text: { en: "Show the rule under the label", ar: "اعرض القاعدة تحت العنوان" }
        mock:
          app: nashat
          frame: wide
          url: nashat.example/charity-race
          blocks:
            - { kind: field, label: { en: "Guest name", ar: "اسم الضيف" }, hintFirst: true, hint: { en: "Use the name on the guest's ID. We check it at the gate.", ar: "اكتب الاسم كما في بطاقة الضيف. نتحقّق منه عند البوابة." }, text: "" }
            - { kind: button, text: &tk_b { en: "Buy ticket", ar: "اشترِ التذكرة" }, gap: m }
      - id: tip
        text: { en: "Keep the rule in the ⓘ tooltip", ar: "أبقِ القاعدة في Tooltip الـ ⓘ" }
        mock:
          app: nashat
          frame: wide
          url: nashat.example/charity-race
          blocks:
            - { kind: field, label: { en: "Guest name ⓘ", ar: "اسم الضيف ⓘ" }, text: "" }
            - { kind: button, text: *tk_b, gap: m }
      - id: faq
        text: { en: "Put the rule in the FAQ, linked under the button", ar: "ضع القاعدة في الأسئلة الشائعة، برابط تحت الزر" }
        mock:
          app: nashat
          frame: wide
          url: nashat.example/charity-race
          blocks:
            - { kind: field, label: { en: "Guest name", ar: "اسم الضيف" }, text: "" }
            - { kind: button, text: *tk_b, gap: m }
            - { kind: link, text: { en: "Ticket FAQ", ar: "أسئلة شائعة عن التذاكر" }, gap: s }
    answer: [visible]
    misconceptions:
      - id: MC-P01-037
        when: [tip, faq]
        feedback:
          en: "Every buyer needs this rule, or a guest is turned away at the gate. A rule everyone needs can't wait behind an icon or a link."
          ar: "كل مشترٍ يحتاج هذه القاعدة، وإلا رُدّ ضيف عند البوابة. والقاعدة التي يحتاجها الجميع لا تنتظر خلف أيقونة أو رابط."
    correct:
      en: "Right. Basma reads the rule before she types a single name."
      ar: "صحيح. تقرأ بسمة القاعدة قبل أن تكتب أي اسم."
    explain:
      en: "Tooltips and help pages are for extra detail. If skipping the info breaks the task, show it on the page."
      ar: "الـ Tooltip وصفحات المساعدة للتفاصيل الإضافية. وإن كان تخطّي المعلومة يُفسد المهمة، فاعرضها على الصفحة."

  - id: S06
    type: tune
    skill: SK-P01-U03-03
    part: retest
    speaker: rami
    value:
      en: "Re-test, tooltips (NN/g): tooltips usually aren't available on touchscreens. A delivery rule hidden in a hover tip never reaches phone shoppers."
      ar: "إعادة اختبار، الـ Tooltip (NN/g): الـ Tooltip غالبًا غير متاح على شاشات اللمس. وقاعدة التوصيل المخفية في تلميح يظهر بالمرور لا تصل أبدًا لمن يتسوّق من هاتفه."
    ref: { url: "https://www.nngroup.com/articles/tooltip-guidelines/", quote: "They are not normally available on touchscreens." }
    scenario:
      en: "I'm working on a furniture shop's checkout. Our trucks can't reach upper floors without a lift, so we need to know. Ziad shops on his phone. \"Tell us if the building has no lift\" shows only when you hover over the address."
      ar: "أعمل على صفحة الدفع لمتجر أثاث. شاحناتنا لا تستطيع التوصيل للأدوار العليا بلا مصعد، لذا نحتاج أن نعرف. ويتسوّق زياد من هاتفه. وعبارة «أخبرنا إن لم يكن في العمارة مصعد» تظهر فقط عند تمرير الماوس فوق العنوان."
    prompt:
      en: "Try each version on Ziad's phone. Which one should ship?"
      ar: "جرّب كل نسخة على هاتف زياد. أيّها يجب أن تُطلق؟"
    start: hover
    options:
      - id: hover
        text: { en: "Keep the hover tooltip", ar: "أبقِ التلميح الذي يظهر بالمرور" }
        mock:
          app: beit
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: &fu_a { en: "Address", ar: "العنوان" }, text: "" }
            - { kind: field, label: &fu_f { en: "Floor", ar: "الدور" }, text: "", gap: s }
      - id: field
        text: { en: "Add a visible question: \"Is there a lift?\"", ar: "أضف سؤالًا ظاهرًا: «هل يوجد مصعد؟»" }
        mock:
          app: beit
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: *fu_a, text: "" }
            - { kind: field, label: *fu_f, text: "", gap: s }
            - { kind: small, weight: bold, text: { en: "Is there a lift?", ar: "هل يوجد مصعد؟" }, gap: m }
            - { kind: radio, text: { en: "Yes", ar: "نعم" }, gap: xs }
            - { kind: radio, text: { en: "No", ar: "لا" }, gap: xs }
      - id: drop
        text: { en: "Remove the tip; the driver can call", ar: "احذف التلميح؛ يمكن للسائق أن يتصل" }
        mock:
          app: beit
          appbar: { title: { en: Checkout, ar: الدفع }, back: true }
          blocks:
            - { kind: field, label: *fu_a, text: "" }
            - { kind: field, label: *fu_f, text: "", gap: s }
    answer: [field]
    misconceptions:
      - id: MC-P01-037
        when: [hover, drop]
        feedback:
          en: "On a phone there's no hover, so Ziad sees the same screen either way: nothing asks about the lift, and the truck arrives unprepared."
          ar: "لا يوجد مرور بالماوس على الهاتف، فيرى زياد الشاشة نفسها في الحالتين: لا شيء يسأل عن المصعد، وتصل الشاحنة غير مستعدة."
    correct:
      en: "Right. A visible question works on every screen, and we get the answer we need."
      ar: "صحيح. السؤال الظاهر يعمل على كل شاشة، ونحصل على الإجابة التي نحتاجها."
    explain:
      en: "Hover doesn't exist on touchscreens. If we need the info, ask for it on the page."
      ar: "المرور بالماوس غير موجود على شاشات اللمس. وإن كنا نحتاج المعلومة، فلنسأل عنها على الصفحة."

  # SK-P01-U03-04: put each label right above its field
  - id: S07
    type: tune
    skill: SK-P01-U03-04
    part: retest
    speaker: nour
    value:
      en: "Re-test, white space in forms (NN/g): place the label closer to its own field than to other fields. With equal gaps, a label floats between two boxes."
      ar: "إعادة اختبار، المساحات البيضاء في النماذج (NN/g): ضع العنوان أقرب إلى حقله من الحقول الأخرى. ومع مسافات متساوية، يطفو العنوان بين مربعين."
    ref: { url: "https://www.nngroup.com/articles/form-design-white-space/", quote: "Place the label closer to the associated text field than to other text fields." }
    scenario:
      en: "I'm designing a blood donation form. Hoda typed her weight into the box meant for her age. Every label sits exactly halfway between the box above it and the box below it."
      ar: "أصمّم نموذجًا للتبرّع بالدم. كتبت هدى وزنها في المربع المخصّص لعمرها. وكل عنوان يقع في منتصف المسافة تمامًا بين المربع الذي فوقه والمربع الذي تحته."
    prompt:
      en: "Try each spacing. Which one should ship?"
      ar: "جرّب كل توزيع للمسافات. أيّها يجب أن يُطلق؟"
    start: even
    options:
      - id: even
        text: { en: "Keep the even gaps", ar: "أبقِ المسافات المتساوية" }
        mock:
          app: { name: { en: Nabda, ar: نبضة }, color: '#C92A2A', icon: drop, domain: nabda.example }
          appbar: { title: { en: Donate blood, ar: تبرّع بالدم }, back: true }
          blocks:
            - { kind: small, weight: bold, text: &bd_a { en: "Age", ar: "العمر" } }
            - { kind: field, text: "", gap: m }
            - { kind: small, weight: bold, text: &bd_w { en: "Weight (kg)", ar: "الوزن (كجم)" }, gap: m }
            - { kind: field, text: "", gap: m }
            - { kind: small, weight: bold, text: &bd_d { en: "Last donation date", ar: "تاريخ آخر تبرّع" }, gap: m }
            - { kind: field, text: "", gap: m }
      - id: close
        text: { en: "Each label close above its box, more space before the next label", ar: "كل عنوان قريب فوق مربعه، ومسافة أكبر قبل العنوان التالي" }
        mock:
          app: { name: { en: Nabda, ar: نبضة }, color: '#C92A2A', icon: drop, domain: nabda.example }
          appbar: { title: { en: Donate blood, ar: تبرّع بالدم }, back: true }
          blocks:
            - { kind: small, weight: bold, text: *bd_a }
            - { kind: field, text: "", gap: xs }
            - { kind: small, weight: bold, text: *bd_w, gap: l }
            - { kind: field, text: "", gap: xs }
            - { kind: small, weight: bold, text: *bd_d, gap: l }
            - { kind: field, text: "", gap: xs }
      - id: lines
        text: { en: "Keep the gaps, and add a line between fields", ar: "أبقِ المسافات، وأضف خطًا بين الحقول" }
        mock:
          app: { name: { en: Nabda, ar: نبضة }, color: '#C92A2A', icon: drop, domain: nabda.example }
          appbar: { title: { en: Donate blood, ar: تبرّع بالدم }, back: true }
          blocks:
            - { kind: small, weight: bold, text: *bd_a }
            - { kind: field, text: "", gap: m }
            - { kind: divider, gap: s }
            - { kind: small, weight: bold, text: *bd_w, gap: s }
            - { kind: field, text: "", gap: m }
            - { kind: divider, gap: s }
            - { kind: small, weight: bold, text: *bd_d, gap: s }
            - { kind: field, text: "", gap: m }
    answer: [close]
    misconceptions:
      - id: MC-P01-038
        when: [even, lines]
        feedback:
          en: "In the preview, \"Weight\" is as close to the age box as to its own. Lines add clutter but don't fix that; only moving the label closer to its box does."
          ar: "في المعاينة، «الوزن» قريب من مربع العمر بقدر قربه من مربعه. والخطوط تزيد الزحام ولا تحلّ ذلك؛ الحل الوحيد أن يقترب العنوان من مربعه."
    correct:
      en: "Right. Each label hugs its own box, so each pair reads as one."
      ar: "صحيح. كل عنوان ملتصق بمربعه، فيُقرأ كل زوج كوحدة واحدة."
    explain:
      en: "People link things that sit close together. A small gap under the label and a bigger one before the next label make the pairs obvious."
      ar: "يربط الناس بين الأشياء المتقاربة. ومسافة صغيرة تحت العنوان، وأكبر قبل العنوان التالي، تجعل الأزواج واضحة."

  - id: S08
    type: tune
    skill: SK-P01-U03-04
    part: retest
    speaker: hana
    value:
      en: "Re-test, form design (NN/g): put labels right above the field on mobile and short desktop forms. Beside the field, a 320 px screen leaves the box too narrow to read."
      ar: "إعادة اختبار، تصميم النماذج (NN/g): ضع العناوين فوق الحقل مباشرة على الهاتف وفي النماذج القصيرة على الكمبيوتر. وبجوار الحقل، تترك شاشة 320 px مربعًا أضيق من أن يُقرأ."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "immediately above the field for mobile and shorter desktop forms" }
    scenario:
      en: "In my gym's phone app, the \"Book a class\" form shows each label beside its field. On Omar's small phone, the class name and the coach's name get cut off."
      ar: "في تطبيق الهاتف الخاص بنادينا، نموذج «احجز حصة» يعرض كل عنوان بجوار حقله. وعلى هاتف عمر الصغير، يُقصّ اسم الحصة واسم المدرّب."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّها يجب أن يُطلق؟"
    start: beside
    options:
      - id: beside
        text: { en: "Keep labels beside the fields", ar: "أبقِ العناوين بجوار الحقول" }
        mock:
          app: nashat
          frame: small
          appbar: { title: { en: Book a class, ar: احجز حصة }, back: true }
          width: 240
          blocks:
            - kind: row
              blocks:
                - { kind: small, weight: bold, text: &gy_c { en: "Class", ar: "الحصة" } }
                - { kind: field, filled: true, text: { en: "Morning sp…", ar: "سباحة صب…" } }
            - kind: row
              gap: s
              blocks:
                - { kind: small, weight: bold, text: &gy_k { en: "Coach", ar: "المدرّب" } }
                - { kind: field, filled: true, text: { en: "Captain Wa…", ar: "كابتن ولي…" } }
      - id: short
        text: { en: "Keep them beside, with shorter labels", ar: "أبقِها بجوار الحقول، بعناوين أقصر" }
        mock:
          app: nashat
          frame: small
          appbar: { title: { en: Book a class, ar: احجز حصة }, back: true }
          width: 240
          blocks:
            - kind: row
              blocks:
                - { kind: small, weight: bold, text: { en: "Cls", ar: "حصة" } }
                - { kind: field, filled: true, text: { en: "Morning sp…", ar: "سباحة صب…" } }
            - kind: row
              gap: s
              blocks:
                - { kind: small, weight: bold, text: { en: "Coach", ar: "مدرّب" } }
                - { kind: field, filled: true, text: { en: "Captain Wa…", ar: "كابتن ولي…" } }
      - id: above
        text: { en: "Put each label above its field", ar: "ضع كل عنوان فوق حقله" }
        mock:
          app: nashat
          frame: small
          appbar: { title: { en: Book a class, ar: احجز حصة }, back: true }
          width: 240
          blocks:
            - { kind: field, label: *gy_c, filled: true, text: { en: "Morning swimming", ar: "سباحة صباحية" } }
            - { kind: field, label: *gy_k, filled: true, text: { en: "Captain Walid", ar: "كابتن وليد" }, gap: s }
    answer: [above]
    misconceptions:
      - id: MC-P01-039
        when: [beside, short]
        feedback:
          en: "Side by side, the label eats half the width, so the answers are cut off. Shorter labels are harder to understand and the boxes are still narrow."
          ar: "جنبًا إلى جنب، يأخذ العنوان نصف العرض، فتُقصّ الإجابات. والعناوين الأقصر أصعب في الفهم والمربعات ما زالت ضيقة."
    correct:
      en: "Right. Above the field, each box gets the full width of the phone."
      ar: "صحيح. فوق الحقل، يأخذ كل مربع عرض الهاتف كله."
    explain:
      en: "On a narrow screen, a label above the field leaves the whole width for the answer, and the eye moves straight down."
      ar: "على الشاشة الضيقة، العنوان فوق الحقل يترك العرض كله للإجابة، وتتحرّك العين إلى الأسفل مباشرة."

  # SK-P01-U03-05: one column, grouped
  - id: S09
    type: tune
    skill: SK-P01-U03-05
    part: retest
    speaker: mona
    value:
      en: "Re-test, form design (NN/g): multiple columns interrupt the movement down the form. In two columns, people skip the second column or fill fields in the wrong order."
      ar: "إعادة اختبار، تصميم النماذج (NN/g): الأعمدة المتعددة تقطع الحركة إلى أسفل النموذج. وفي عمودين، يتخطّى الناس العمود الثاني أو يملؤون الحقول بترتيب خاطئ."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Multiple columns interrupt the vertical momentum of moving down the form." }
    scenario:
      en: "I'm designing a job application form. Many applications arrive without a graduation year. The form has two columns of fields side by side, and that field is the last one in the second column."
      ar: "أصمّم نموذجًا للتقدّم لوظيفة. طلبات كثيرة تصل بلا سنة التخرّج. والنموذج فيه عمودان من الحقول متجاوران، وهذا الحقل هو الأخير في العمود الثاني."
    prompt:
      en: "Try each layout. Which one should ship?"
      ar: "جرّب كل تخطيط. أيّها يجب أن يُطلق؟"
    start: two
    options:
      - id: two
        text: { en: "Keep two columns", ar: "أبقِ العمودين" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: &jb_n { en: "Full name", ar: "الاسم الكامل" }, text: "" }
                - { kind: field, label: &jb_u { en: "University", ar: "الجامعة" }, text: "" }
            - kind: row
              gap: s
              blocks:
                - { kind: field, label: &jb_p { en: "Phone", ar: "الهاتف" }, text: "" }
                - { kind: field, label: &jb_y { en: "Graduation year", ar: "سنة التخرّج" }, text: "" }
            - { kind: button, text: &jb_b { en: "Apply", ar: "قدّم الطلب" }, gap: m }
      - id: one
        text: { en: "Put every field in one column", ar: "ضع كل الحقول في عمود واحد" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply
          blocks:
            - { kind: field, label: *jb_n, text: "" }
            - { kind: field, label: *jb_p, text: "", gap: s }
            - { kind: field, label: *jb_u, text: "", gap: s }
            - { kind: field, label: *jb_y, text: "", gap: s }
            - { kind: button, text: *jb_b, gap: m }
      - id: star
        text: { en: "Keep two columns, and mark the year as required", ar: "أبقِ العمودين، وعلّم السنة كحقل مطلوب" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/apply
          blocks:
            - kind: row
              blocks:
                - { kind: field, label: *jb_n, text: "" }
                - { kind: field, label: *jb_u, text: "" }
            - kind: row
              gap: s
              blocks:
                - { kind: field, label: *jb_p, text: "" }
                - { kind: field, label: { en: "Graduation year *", ar: "سنة التخرّج *" }, text: "" }
            - { kind: button, text: *jb_b, gap: m }
    answer: [one]
    misconceptions:
      - id: MC-P01-040
        when: [two, star]
        feedback:
          en: "The problem is the path, not the field. In two columns, people go down the first one to the button and miss the other. A star doesn't change the path."
          ar: "المشكلة في المسار، لا في الحقل. في عمودين، ينزل الناس في العمود الأول حتى الزر ويفوتهم الآخر. والنجمة لا تغيّر المسار."
    correct:
      en: "Right. In one column, every field is on the way to the button."
      ar: "صحيح. في عمود واحد، كل حقل يقع في الطريق إلى الزر."
    explain:
      en: "One column gives one path: top to bottom, nothing to skip. Two columns make people choose a direction, and some choose wrong."
      ar: "العمود الواحد يعطي مسارًا واحدًا: من أعلى إلى أسفل، بلا شيء يُتخطّى. والعمودان يجعلان الناس يختارون اتجاهًا، وبعضهم يختار خطأ."

  - id: S10
    type: tune
    skill: SK-P01-U03-05
    part: retest
    speaker: sara
    value:
      en: "Re-test, form design (NN/g): visually group related labels and fields. A heading over each group shows where the guest details end and the stay details begin."
      ar: "إعادة اختبار، تصميم النماذج (NN/g): اجمع العناوين والحقول المرتبطة بصريًا. والعنوان الرئيسي فوق كل مجموعة يوضّح أين تنتهي بيانات الضيف وتبدأ بيانات الإقامة."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Visually group related labels and fields." }
    scenario:
      en: "I'm designing a hotel booking form with six fields in one long list: name, phone, email, check-in, check-out, guests. Fatma kept scrolling up to check whether she had entered her dates yet."
      ar: "أصمّم نموذج حجز فندق فيه ستة حقول في قائمة واحدة طويلة: الاسم، الهاتف، البريد، تاريخ الوصول، تاريخ المغادرة، عدد الضيوف. وظلّت فاطمة تصعد لأعلى لتتأكّد هل أدخلت تواريخها أم لا."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: list
    options:
      - id: list
        text: { en: "Keep one long list", ar: "أبقِ القائمة الطويلة" }
        mock:
          app: nuzul
          frame: wide
          url: nuzul.example/book
          blocks:
            - { kind: field, label: &ht_n { en: "Full name", ar: "الاسم الكامل" }, text: "" }
            - { kind: field, label: &ht_p { en: "Phone", ar: "الهاتف" }, text: "", gap: s }
            - { kind: field, label: &ht_e { en: "Email", ar: "البريد الإلكتروني" }, text: "", gap: s }
            - { kind: field, label: &ht_i { en: "Check-in", ar: "تاريخ الوصول" }, text: "", gap: s }
            - { kind: field, label: &ht_o { en: "Check-out", ar: "تاريخ المغادرة" }, text: "", gap: s }
            - { kind: field, label: &ht_g { en: "Guests", ar: "عدد الضيوف" }, text: "", gap: s }
      - id: steps
        text: { en: "Number every field from 1 to 6", ar: "رقّم كل حقل من 1 إلى 6" }
        mock:
          app: nuzul
          frame: wide
          url: nuzul.example/book
          blocks:
            - { kind: field, label: { en: "1. Full name", ar: "1. الاسم الكامل" }, text: "" }
            - { kind: field, label: { en: "2. Phone", ar: "2. الهاتف" }, text: "", gap: s }
            - { kind: field, label: { en: "3. Email", ar: "3. البريد الإلكتروني" }, text: "", gap: s }
            - { kind: field, label: { en: "4. Check-in", ar: "4. تاريخ الوصول" }, text: "", gap: s }
            - { kind: field, label: { en: "5. Check-out", ar: "5. تاريخ المغادرة" }, text: "", gap: s }
            - { kind: field, label: { en: "6. Guests", ar: "6. عدد الضيوف" }, text: "", gap: s }
      - id: groups
        text: { en: "Two groups with headings: \"Your details\" and \"Your stay\"", ar: "مجموعتان بعنوانين: «بياناتك» و«إقامتك»" }
        mock:
          app: nuzul
          frame: wide
          url: nuzul.example/book
          blocks:
            - { kind: heading, text: { en: "Your details", ar: "بياناتك" } }
            - { kind: field, label: *ht_n, text: "", gap: xs }
            - { kind: field, label: *ht_p, text: "", gap: s }
            - { kind: field, label: *ht_e, text: "", gap: s }
            - { kind: heading, text: { en: "Your stay", ar: "إقامتك" }, gap: l }
            - { kind: field, label: *ht_i, text: "", gap: xs }
            - { kind: field, label: *ht_o, text: "", gap: s }
            - { kind: field, label: *ht_g, text: "", gap: s }
    answer: [groups]
    misconceptions:
      - id: MC-P01-041
        when: [list, steps]
        feedback:
          en: "Six fields in a row look alike, with or without numbers. Fatma wants to know where her dates are, and only a heading tells her that."
          ar: "ستة حقول متتالية تبدو متشابهة، بأرقام أو بدونها. وفاطمة تريد أن تعرف أين تواريخها، ولا يخبرها بذلك إلا عنوان رئيسي."
    correct:
      en: "Right. Fatma sees two parts and finds \"Your stay\" at a glance."
      ar: "صحيح. ترى فاطمة جزأين، وتجد «إقامتك» بنظرة واحدة."
    explain:
      en: "Grouping turns a long list into a few short parts, and headings name what each part is for."
      ar: "التجميع يحوّل القائمة الطويلة إلى أجزاء قصيرة قليلة، والعناوين الرئيسية تسمّي غرض كل جزء."

  # SK-P01-U03-06: say the rules before people type
  - id: S11
    type: tune
    skill: SK-P01-U03-06
    part: retest
    speaker: hana
    value:
      en: "Re-test, form design (NN/g): don't make users guess obscure requirements. A PIN rule that appears only after a failed try makes Dina guess twice."
      ar: "إعادة اختبار، تصميم النماذج (NN/g): لا تجعل المستخدم يخمّن الشروط الغامضة. وقاعدة الرمز السري التي تظهر فقط بعد محاولة فاشلة تجعل دينا تخمّن مرتين."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "Don’t make users guess your obscure password requirements." }
    scenario:
      en: "Members open our gym door with a PIN from our app. The PIN must be 6 digits and can't be all the same digit or in order, like 123456. Dina typed 111111, and only then saw the rules in red."
      ar: "يفتح الأعضاء باب نادينا برمز سري من تطبيقنا. يجب أن يكون الرمز السري 6 أرقام، ولا يكون كله رقمًا واحدًا مكرّرًا أو أرقامًا متتالية، مثل 123456. كتبت دينا 111111، وعندها فقط رأت الشروط باللون الأحمر."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: after
    options:
      - id: strong
        text: { en: "Show \"Choose a strong PIN\" under the label", ar: "اعرض «اختر رمزًا قويًا» تحت العنوان" }
        mock:
          app: nashat
          appbar: { title: { en: Door PIN, ar: رمز الباب }, back: true }
          blocks:
            - { kind: field, label: &pn_l { en: "New PIN", ar: "الرمز السري الجديد" }, hintFirst: true, hint: { en: "Choose a strong PIN", ar: "اختر رمزًا قويًا" }, text: "" }
      - id: after
        text: { en: "Keep the rules in the error after a wrong PIN", ar: "أبقِ الشروط في رسالة الخطأ بعد رمز خاطئ" }
        mock:
          app: nashat
          appbar: { title: { en: Door PIN, ar: رمز الباب }, back: true }
          blocks:
            - { kind: field, label: *pn_l, text: "" }
      - id: exact
        text: { en: "Show the exact rules under the label", ar: "اعرض الشروط بدقة تحت العنوان" }
        mock:
          app: nashat
          appbar: { title: { en: Door PIN, ar: رمز الباب }, back: true }
          blocks:
            - { kind: field, label: *pn_l, hintFirst: true, hint: { en: "6 digits. Not all the same, and not in order like 123456.", ar: "6 أرقام. ليست كلها متشابهة، وليست متتالية مثل 123456." }, text: "" }
    answer: [exact]
    misconceptions:
      - id: MC-P01-042
        when: [after]
        feedback:
          en: "Dina has to fail once to learn the rules. Shown before she types, they cost her nothing."
          ar: "على دينا أن تفشل مرة لتعرف الشروط. ولو ظهرت قبل الكتابة، لما كلّفتها شيئًا."
      - id: MC-P01-043
        when: [strong]
        feedback:
          en: "\"Strong\" means something different to everyone. Dina may think 111111 is fine. Say what the app checks."
          ar: "كلمة «قوي» تعني شيئًا مختلفًا لكل شخص. وقد تظن دينا أن 111111 مقبول. اذكر ما يتحقّق منه التطبيق."
    correct:
      en: "Right. Dina knows all three rules before her first digit."
      ar: "صحيح. تعرف دينا الشروط الثلاثة قبل أول رقم تكتبه."
    explain:
      en: "If the system checks a rule, say that exact rule before people type. Then the first try can be the right one."
      ar: "إن كان النظام يتحقّق من قاعدة، فاذكرها بدقة قبل أن يكتب الناس. فتكون المحاولة الأولى هي الصحيحة."

  - id: S12
    type: tune
    skill: SK-P01-U03-06
    part: retest
    speaker: karim
    value:
      en: "Re-test, form design (NN/g): if a field needs a specific format, state the exact instructions. \"A valid file\" tells Amr nothing about PDF or 2 MB."
      ar: "إعادة اختبار، تصميم النماذج (NN/g): إن كان الحقل يحتاج صيغة معيّنة، فاذكر التعليمات بدقة. وعبارة «ملف صالح» لا تخبر عمرو بشيء عن PDF أو 2 MB."
    ref: { url: "https://www.nngroup.com/articles/web-form-design/", quote: "If a field requires a specific format or type of input, state the exact instructions." }
    scenario:
      en: "I'm building a careers page. We accept CVs only as PDF, up to 2 MB. Amr uploaded a 6 MB Word file and got rejected. Under the upload button, we say \"Upload a valid file\"."
      ar: "أبني صفحة الوظائف. نقبل السيرة الذاتية بصيغة PDF فقط، وحتى 2 MB. رفع عمرو ملف Word حجمه 6 MB ورُفض. وتحت زر الرفع نكتب «ارفع ملفًا صالحًا»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    start: valid
    options:
      - id: valid
        text: { en: "Keep \"Upload a valid file\"", ar: "أبقِ «ارفع ملفًا صالحًا»" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/careers
          blocks:
            - { kind: small, weight: bold, text: &cv_l { en: "Your CV", ar: "سيرتك الذاتية" } }
            - { kind: button, emphasis: low, text: &cv_b { en: "Choose file", ar: "اختر ملفًا" }, gap: xs }
            - { kind: small, color: muted, text: { en: "Upload a valid file", ar: "ارفع ملفًا صالحًا" }, gap: xs }
      - id: exact
        text: { en: "Change it to \"PDF only, up to 2 MB\"", ar: "غيّرها إلى «PDF فقط، حتى 2 MB»" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/careers
          blocks:
            - { kind: small, weight: bold, text: *cv_l }
            - { kind: button, emphasis: low, text: *cv_b, gap: xs }
            - { kind: small, color: muted, text: { en: "PDF only, up to 2 MB", ar: "PDF فقط، حتى 2 MB" }, gap: xs }
      - id: none
        text: { en: "Remove the line; the error will explain", ar: "احذف السطر؛ رسالة الخطأ ستشرح" }
        mock:
          app: wazifa
          frame: wide
          url: wazifa.example/careers
          blocks:
            - { kind: small, weight: bold, text: *cv_l }
            - { kind: button, emphasis: low, text: *cv_b, gap: xs }
    answer: [exact]
    misconceptions:
      - id: MC-P01-043
        when: [valid]
        feedback:
          en: "Amr thought his Word file was valid. A rule only helps if it names the format and size we check."
          ar: "ظنّ عمرو أن ملف Word صالح. والقاعدة لا تفيد إلا إن ذكرت الصيغة والحجم اللذين نتحقّق منهما."
      - id: MC-P01-042
        when: [none]
        feedback:
          en: "Then Amr learns the rules only after a failed upload. Telling him first saves the extra try."
          ar: "عندها يعرف عمرو الشروط فقط بعد رفع فاشل. وإخباره أولًا يوفّر عليه المحاولة الزائدة."
    correct:
      en: "Right. Amr can check his file before he picks it."
      ar: "صحيح. يستطيع عمرو أن يراجع ملفّه قبل أن يختاره."
    explain:
      en: "Exact rules (type and size) let people get it right the first time. Vague words or a later error make them guess."
      ar: "الشروط الدقيقة (النوع والحجم) تجعل الناس ينجحون من المرة الأولى. والكلمات المبهمة أو الخطأ اللاحق تجعلهم يخمّنون."
