id: P13-U01
free: true
title:
  en: "Let AI draft, you decide"
  ar: "دع الذكاء الاصطناعي يكتب المسوّدة، وقرّر أنت"
skill:
  en: "Use AI for fast drafts and many ideas, then edit, choose and check them yourself, and keep real users in the picture."
  ar: "استخدم الذكاء الاصطناعي لمسوّدات سريعة وأفكار كثيرة، ثم حرّرها واختر منها وتحقّق منها بنفسك، ولا تستغنِ عن المستخدمين الحقيقيين."
skills:
  - id: SK-P13-U01-01
    title: { en: "Treat AI output as a first draft", ar: "تعامل مع ناتج الذكاء الاصطناعي كمسوّدة أولى" }
    can_do: { en: "Use AI to get a first draft fast, then edit it and check every fact before anyone else sees it.", ar: "استخدم الذكاء الاصطناعي لتحصل على مسوّدة أولى بسرعة، ثم حرّرها وتحقّق من كل معلومة قبل أن يراها أحد." }
  - id: SK-P13-U01-02
    title: { en: "Ask for many ideas, then pick", ar: "اطلب أفكارًا كثيرة، ثم اختر" }
    can_do: { en: "Ask for several very different versions, then use your own judgment to choose the few worth testing.", ar: "اطلب عدة نسخ مختلفة جدًا، ثم استخدم حكمك لتختار القليل الذي يستحق الاختبار." }
  - id: SK-P13-U01-03
    title: { en: "Keep real users in the loop", ar: "لا تستغنِ عن المستخدمين الحقيقيين" }
    can_do: { en: "Use AI to prepare and organize research, but not to replace real people; AI-made respondents miss the less common answers.", ar: "استخدم الذكاء الاصطناعي لتجهيز البحث وتنظيمه، لا لاستبدال الناس الحقيقيين؛ فالمشاركون الذين يصنعهم الذكاء الاصطناعي تفوتهم الإجابات الأقل شيوعًا." }
  - id: SK-P13-U01-04
    title: { en: "Check what AI learned from", ar: "انتبه لما تعلّم منه الذكاء الاصطناعي" }
    can_do: { en: "Spot answers shaped by mostly English, Western or simply wrong internet content, and fix them for your users.", ar: "اكتشف الإجابات المتأثّرة بمحتوى الإنترنت، وأغلبه إنجليزي وغربي أو خاطئ أحيانًا، وأصلحها لتناسب مستخدميك." }
