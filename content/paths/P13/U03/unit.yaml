id: P13-U03
free: false
title:
  en: "Check what AI tells you"
  ar: "تحقّق ممّا يخبرك به الذكاء الاصطناعي"
skill:
  en: "Catch made-up facts, keep the AI from just agreeing with you, and judge AI reviews and AI features on more than one lucky answer."
  ar: "اكتشف المعلومات المُختلَقة، وامنع الذكاء الاصطناعي من مجرد موافقتك، وقيّم مراجعاته وميزاته بأكثر من إجابة واحدة محظوظة."
skills:
  - id: SK-P13-U03-01
    title: { en: "Catch made-up facts", ar: "اكتشف المعلومات المُختلَقة (Hallucinations)" }
    can_do: { en: "Expect confident but false facts and fake sources, and check every fact at its original source before you use it.", ar: "توقّع معلومات خاطئة تُقال بثقة ومصادر مزيّفة، وتحقّق من كل معلومة في مصدرها الأصلي قبل أن تستخدمها." }
  - id: SK-P13-U03-02
    title: { en: "Don't let AI just agree with you", ar: "لا تدع الذكاء الاصطناعي يوافقك فقط" }
    can_do: { en: "Ask without giving your opinion, start a new chat for a fresh view, and don't trust an answer that flips when you push back.", ar: "اسأل دون أن تذكر رأيك، وابدأ محادثة جديدة لرأي لم يتأثّر بكلامك، ولا تثق بإجابة تنقلب حين تعترض." }
  - id: SK-P13-U03-03
    title: { en: "Treat AI reviews as leads", ar: "تعامل مع مراجعات الذكاء الاصطناعي كمؤشّرات" }
    can_do: { en: "Use AI design reviews as leads to check, knowing some suggestions are wrong and deeper problems are often missed.", ar: "استخدم مراجعات التصميم من الذكاء الاصطناعي كمؤشّرات تتحقّق منها، وأنت تعرف أن بعض اقتراحاتها خاطئة وأن المشكلات الأعمق تفوتها غالبًا." }
  - id: SK-P13-U03-04
    title: { en: "Judge AI on many answers, not one", ar: "قيّم الذكاء الاصطناعي بإجابات كثيرة، لا بواحدة" }
    can_do: { en: "Test an AI tool or feature with many real inputs, several times each, before you trust it.", ar: "اختبر أداة أو ميزة ذكاء اصطناعي بمدخلات حقيقية كثيرة، وعدة مرات لكل منها، قبل أن تثق بها." }
