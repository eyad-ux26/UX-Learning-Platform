id: P13-U03-B01
mode: bank
title:
  en: "Re-tests: check what AI tells you"
  ar: "إعادة اختبار: تحقّق ممّا يخبرك به الذكاء الاصطناعي"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "AI Hallucinations: What Designers Need to Know (NN/g)", ar: "هلوسة الذكاء الاصطناعي: ما يحتاج المصممون معرفته (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-hallucinations/"
  - title: { en: "Sycophancy in Generative-AI Chatbots (NN/g)", ar: "التملّق في روبوتات المحادثة بالذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/sycophancy-generative-ai-chatbots/"
  - title: { en: "Demand Accuracy from AI: Lessons from Baymard Institute (NN/g)", ar: "اطلب الدقة من الذكاء الاصطناعي: دروس من Baymard Institute (NN/g)" }
    url: "https://www.nngroup.com/articles/baymard-ai-tool-accuracy/"
  - title: { en: "One AI Output Is an Example, Not an Evaluation (NN/g)", ar: "ناتج واحد من الذكاء الاصطناعي مثال، لا تقييم (NN/g)" }
    url: "https://www.nngroup.com/articles/eval-ai-output/"
steps:
  - id: S01
    type: choose
    skill: SK-P13-U03-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. AI Hallucinations (NN/g): AI doesn't know when it has gotten something right; it isn't a fact database."
      ar: "إعادة اختبار. هلوسة الذكاء الاصطناعي (NN/g): الذكاء الاصطناعي لا يعرف متى أصاب؛ فهو ليس قاعدة بيانات للحقائق."
    ref: { url: "https://www.nngroup.com/articles/ai-hallucinations/", quote: "Fundamentally, the problem is that LLMs don't know when they've gotten something correct" }
    scenario:
      en: "I asked AI if our gym should offer shorter classes. It said: \"Research shows 74% of gym members prefer 20-minute classes.\" No source was given."
      ar: "سألت الذكاء الاصطناعي هل يجب أن يقدّم نادينا حصصًا أقصر. فقال: «تُظهر الأبحاث أن 74% من أعضاء النوادي يفضّلون حصص الـ20 دقيقة.» ولم يذكر أي مصدر."
    prompt:
      en: "How should I treat that number?"
      ar: "كيف أتعامل مع هذا الرقم؟"
    options:
      - { id: precise, text: { en: "Trust it. A number that exact must come from somewhere", ar: "أثق به. فرقم بهذه الدقة لا بد أن يكون له مصدر" } }
      - { id: guess, text: { en: "As a guess until I find the real research, or ask our own members", ar: "كتخمين حتى أجد البحث الحقيقي، أو أسأل أعضاءنا أنفسهم" } }
      - { id: round, text: { en: "Round it to \"about 70%\" to be safe", ar: "أقرّبه إلى «نحو 70%» لأكون في أمان" } }
    answer: [guess]
    misconceptions:
      - id: MC-P13-018
        when: [precise, round]
        feedback:
          en: "Exact numbers can be made up too. Rounding a made-up number doesn't make it real."
          ar: "الأرقام الدقيقة قد تكون مُختلَقة أيضًا. وتقريب رقم مُختلَق لا يجعله حقيقيًا."
    correct:
      en: "Right. No source, no fact."
      ar: "صحيح. بلا مصدر، لا معلومة."
    explain:
      en: "AI can't tell its true facts from its false ones. Find the source, or get your own data."
      ar: "الذكاء الاصطناعي لا يميّز معلوماته الصحيحة من الخاطئة. ابحث عن المصدر، أو اجمع بياناتك."

  - id: S02
    type: choose
    skill: SK-P13-U03-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Sycophancy (NN/g): catching false AI information is harder if you don't already know the topic."
      ar: "إعادة اختبار. التملّق (NN/g): اكتشاف المعلومات الخاطئة من الذكاء الاصطناعي أصعب إذا لم تكن تعرف الموضوع أصلًا."
    ref: { url: "https://www.nngroup.com/articles/sycophancy-generative-ai-chatbots/", quote: "Catching false information is harder if you don't already have some expertise in the topic." }
    scenario:
      en: "Our food app is launching in Saudi Arabia. I know nothing about its e-invoice rules, so I asked AI. Its answer sounds detailed and sure."
      ar: "سنطلق تطبيق الطعام في السعودية. ولا أعرف شيئًا عن قواعد الفواتير الإلكترونية هناك، فسألت الذكاء الاصطناعي. وإجابته تبدو مفصّلة وواثقة."
    prompt:
      en: "How much can I rely on it?"
      ar: "إلى أي حدّ أستطيع الاعتماد عليها؟"
    options:
      - { id: start, text: { en: "Use it as a start, then check with official sources or a local expert", ar: "أستخدمها كبداية، ثم أتحقّق من المصادر الرسمية أو من خبير محلّي" } }
      - { id: full, text: { en: "Fully. It's detailed, so it's probably right", ar: "تمامًا. فهي مفصّلة، إذن صحيحة على الأرجح" } }
      - { id: spot, text: { en: "I'll read it carefully and spot any errors myself", ar: "سأقرؤها بعناية وأكتشف أي أخطاء بنفسي" } }
    answer: [start]
    misconceptions:
      - id: MC-P13-018
        when: [full]
        feedback:
          en: "Detail isn't proof. AI can be detailed and wrong at the same time."
          ar: "التفصيل ليس دليلًا. فالذكاء الاصطناعي قد يكون مفصّلًا ومخطئًا في الوقت نفسه."
      - id: MC-P13-007
        when: [spot]
        feedback:
          en: "When you don't know a topic, wrong answers look just like right ones. You need an expert source."
          ar: "حين لا تعرف موضوعًا، تبدو الإجابات الخاطئة مثل الصحيحة تمامًا. فتحتاج مصدرًا خبيرًا."
    correct:
      en: "Right. The less you know, the more you check."
      ar: "صحيح. كلما قلّت معرفتك، زاد تحقّقك."
    explain:
      en: "In a topic you don't know, you can't catch AI's mistakes. Check with experts."
      ar: "في موضوع لا تعرفه، لا تستطيع اكتشاف أخطاء الذكاء الاصطناعي. فتحقّق مع الخبراء."

  - id: S03
    type: choose
    skill: SK-P13-U03-02
    part: retest
    speaker: mona
    value:
      en: "Re-test. Sycophancy (NN/g): AI adapts its answers to agree with the user's view, even when that view isn't true."
      ar: "إعادة اختبار. التملّق (NN/g): الذكاء الاصطناعي يكيّف إجاباته ليوافق رأي المستخدم، حتى حين لا يكون هذا الرأي صحيحًا."
    ref: { url: "https://www.nngroup.com/articles/sycophancy-generative-ai-chatbots/", quote: "Sycophancy refers to instances in which an AI model adapts responses to align with the user's view, even if the view is not objectively true." }
    scenario:
      en: "I'm about to ask AI: \"Our users hate long forms, so a one-field sign-up is always best, right?\""
      ar: "أنا على وشك أن أسأل الذكاء الاصطناعي: «مستخدمونا يكرهون النماذج الطويلة، إذن التسجيل بحقل واحد هو الأفضل دائمًا، صح؟»"
    prompt:
      en: "What's the better question?"
      ar: "ما السؤال الأفضل؟"
    options:
      - { id: same, text: { en: "The same one. It's what I want to know", ar: "السؤال نفسه. فهذا ما أريد معرفته" } }
      - { id: strong, text: { en: "\"Confirm that one-field sign-up is always best.\"", ar: "«أكّد أن التسجيل بحقل واحد هو الأفضل دائمًا.»" } }
      - { id: open, text: { en: "\"For a bill-payment app, what are the trade-offs of short and longer sign-up forms?\"", ar: "«في تطبيق لدفع الفواتير، ما المكاسب والخسائر لنماذج التسجيل القصيرة والأطول؟»" } }
    answer: [open]
    misconceptions:
      - id: MC-P13-020
        when: [same, strong]
        feedback:
          en: "Both tell the AI what you think. It will likely just agree."
          ar: "كلاهما يخبر الذكاء الاصطناعي برأيك. وعلى الأرجح سيوافقك فقط."
    correct:
      en: "Right. An open question gets a real answer."
      ar: "صحيح. السؤال المفتوح يأتيك بإجابة حقيقية."
    explain:
      en: "Ask about trade-offs, not for agreement."
      ar: "اسأل عن المكاسب والخسائر، ولا تطلب منه أن يوافقك."

  - id: S04
    type: choose
    skill: SK-P13-U03-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Sycophancy (NN/g): just saying \"I dislike this argument\" can make a model change its answer completely."
      ar: "إعادة اختبار. التملّق (NN/g): مجرد قول «لا يعجبني هذا الرأي» قد يجعل النموذج يغيّر إجابته تمامًا."
    ref: { url: "https://www.nngroup.com/articles/sycophancy-generative-ai-chatbots/", quote: "For example, stating I dislike this argument is enough for a language model to fundamentally change a response to a given prompt." }
    scenario:
      en: "AI said our shop should show delivery costs before checkout. I replied, \"I don't like that idea.\" Now it says delivery costs are better left for the last step."
      ar: "قال الذكاء الاصطناعي إن متجرنا يجب أن يُظهر تكلفة التوصيل قبل صفحة الدفع. فرددت: «لا تعجبني هذه الفكرة.» والآن يقول إن الأفضل أن تُترك تكلفة التوصيل للخطوة الأخيرة."
    prompt:
      en: "What should I take from this?"
      ar: "ماذا أستنتج من هذا؟"
    options:
      - { id: agree, text: { en: "It agrees with me now, so I was right", ar: "إنه يوافقني الآن، إذن كنت محقًا" } }
      - { id: pressure, text: { en: "It changed because of my reaction, not new facts. I should decide with research and user data", ar: "غيّر رأيه بسبب ردّ فعلي، لا بسبب معلومات جديدة. ويجب أن أقرّر بالبحث وبيانات المستخدمين" } }
      - { id: first, text: { en: "Its first answer is always the true one", ar: "إجابته الأولى هي الصحيحة دائمًا" } }
    answer: [pressure]
    misconceptions:
      - id: MC-P13-020
        when: [agree]
        feedback:
          en: "It agreed because you pushed. That isn't evidence."
          ar: "لقد وافق لأنك ضغطت. وهذا ليس دليلًا."
      - id: MC-P13-021
        when: [first]
        feedback:
          en: "Neither answer is proof. A flip only shows the AI bends to your view."
          ar: "ولا إجابة من الاثنتين دليل. فالتراجع يُظهر فقط أن الذكاء الاصطناعي يميل إلى رأيك."
    correct:
      en: "Right. Feelings changed its answer; facts should decide yours."
      ar: "صحيح. المشاعر غيّرت إجابته، والحقائق يجب أن تحدّد قرارك."
    explain:
      en: "When the AI flips to match you, go back to real evidence."
      ar: "حين يتراجع الذكاء الاصطناعي ليوافقك، ارجع إلى الأدلة الحقيقية."

  - id: S05
    type: choose
    skill: SK-P13-U03-03
    part: retest
    speaker: nour
    value:
      en: "Re-test. Demand Accuracy from AI (NN/g): following an AI recommendation without question can lower conversion, and the team may not know why."
      ar: "إعادة اختبار. اطلب الدقة من الذكاء الاصطناعي (NN/g): اتّباع اقتراح الذكاء الاصطناعي دون تفكير قد يُخفض نسبة التحويل، وقد لا يعرف الفريق السبب."
    ref: { url: "https://www.nngroup.com/articles/baymard-ai-tool-accuracy/", quote: "If the team followed that recommendation unquestioningly, it may inadvertently decrease the conversion rate and not even realize why it happened." }
    scenario:
      en: "An AI review of our clinic app says: \"Remove doctor photos from the booking list to make it cleaner.\" Patients often pick a doctor they've seen before."
      ar: "تقول مراجعة بالذكاء الاصطناعي لتطبيق العيادة: «احذف صور الأطباء من قائمة الحجز لتصبح أنظف.» والمرضى كثيرًا ما يختارون طبيبًا رأوه من قبل."
    prompt:
      en: "What should I do with this suggestion?"
      ar: "ماذا أفعل بهذا الاقتراح؟"
    options:
      - { id: do, text: { en: "Remove the photos. Cleaner is better", ar: "أحذف الصور. فالأنظف أفضل" } }
      - { id: drop, text: { en: "Stop using AI reviews", ar: "أتوقّف عن استخدام مراجعات الذكاء الاصطناعي" } }
      - { id: test, text: { en: "Check it against how patients choose, and test before removing anything", ar: "أقارنه بطريقة اختيار المرضى، وأختبر قبل أن أحذف أي شيء" } }
    answer: [test]
    misconceptions:
      - id: MC-P13-022
        when: [do]
        feedback:
          en: "Patients use the photos to find their doctor. Removing them could cut bookings."
          ar: "المرضى يستخدمون الصور ليجدوا طبيبهم. وحذفها قد يقلّل الحجوزات."
      - id: MC-P13-002
        when: [drop]
        feedback:
          en: "Some AI suggestions are useful. Check them instead of dropping them all."
          ar: "بعض اقتراحات الذكاء الاصطناعي مفيدة. تحقّق منها بدلًا من التخلّي عنها كلها."
    correct:
      en: "Right. Check it against your users first."
      ar: "صحيح. قارنه بمستخدميك أولًا."
    explain:
      en: "A neat-sounding AI fix can hurt. Check it against how your users really behave."
      ar: "اقتراح الذكاء الاصطناعي قد يبدو مرتّبًا ويضرّ مع ذلك. قارنه بسلوك مستخدميك الحقيقي."

  - id: S06
    type: choose
    skill: SK-P13-U03-03
    part: retest
    speaker: rami
    value:
      en: "Re-test. Demand Accuracy from AI (NN/g): AI tools that scan pages usually find only some types of issues, like contrast or white space, not all UX problems."
      ar: "إعادة اختبار. اطلب الدقة من الذكاء الاصطناعي (NN/g): أدوات الذكاء الاصطناعي التي تفحص الصفحات تكتشف عادةً بعض أنواع المشكلات فقط، مثل التباين أو المسافات، لا كل مشكلات تجربة المستخدم."
    ref: { url: "https://www.nngroup.com/articles/baymard-ai-tool-accuracy/", quote: "An AI-powered tool designed to scan pages for identifiable UX problems is typically capable of detecting only some types of issues (e.g. poor visual contrast, inconsistent copy, or insufficient white space), rather than addressing all types of UX issues." }
    scenario:
      en: "An AI tool scanned our bus app and found no problems: good contrast, consistent words, enough space. My manager says our UX is done."
      ar: "فحصت أداة ذكاء اصطناعي تطبيق الحافلات ولم تجد أي مشكلة: تباين جيد، وكلمات موحّدة، ومسافات كافية. ومديري يقول إن تجربة المستخدم عندنا اكتملت."
    prompt:
      en: "What do I tell him?"
      ar: "ماذا أقول له؟"
    options:
      - { id: done, text: { en: "He's right. The tool checked everything", ar: "إنه محق. فالأداة فحصت كل شيء" } }
      - { id: surface, text: { en: "The tool checks only some surface issues. We still need to see if riders can plan trips easily", ar: "الأداة تفحص بعض المشكلات السطحية فقط. وما زلنا نحتاج أن نرى هل يخطّط الركّاب لرحلاتهم بسهولة" } }
      - { id: rerun, text: { en: "Run the scan again to be sure", ar: "نشغّل الفحص مرة أخرى لنتأكّد" } }
    answer: [surface]
    misconceptions:
      - id: MC-P13-023
        when: [done, rerun]
        feedback:
          en: "A clean scan only means no surface issues. Whether riders can do their tasks needs real users."
          ar: "حين لا يجد الفحص مشكلات، فهذا يعني فقط عدم وجود مشكلات سطحية. أما هل يُنجز الركّاب مهامّهم فيحتاج مستخدمين حقيقيين."
    correct:
      en: "Right. No surface issues isn't the same as good UX."
      ar: "صحيح. غياب المشكلات السطحية لا يعني أن تجربة المستخدم جيدة."
    explain:
      en: "Know what an AI tool can't see. Test the rest with people."
      ar: "اعرف ما لا تستطيع أداة الذكاء الاصطناعي رؤيته. واختبر الباقي مع الناس."

  - id: S07
    type: choose
    skill: SK-P13-U03-04
    part: retest
    speaker: sara
    value:
      en: "Re-test. One AI Output Is an Example (NN/g): one good output shows the system can do a task, not how often or how reliably it will."
      ar: "إعادة اختبار. ناتج واحد مثال (NN/g): الناتج الجيد الواحد يُظهر أن النظام يستطيع أداء المهمة، لا كم مرة ولا بأي ثقة سيؤدّيها."
    ref: { url: "https://www.nngroup.com/articles/eval-ai-output/", quote: "One good output demonstrates that a system can perform a task. It does not show how often or how reliably the system will do so." }
    scenario:
      en: "A company showed us an AI tool that sorts customer complaints into topics. In their demo, it sorted one complaint perfectly."
      ar: "عرضت علينا شركة أداة ذكاء اصطناعي تفرز شكاوى العملاء حسب الموضوع. وفي عرضهم التجريبي، فرزت شكوى واحدة فرزًا ممتازًا."
    prompt:
      en: "What should we ask for before we decide?"
      ar: "ماذا نطلب من الشركة قبل أن نقرّر؟"
    options:
      - { id: another, text: { en: "A second demo with a different complaint", ar: "عرض تجريبي ثانٍ بشكوى مختلفة" } }
      - { id: trial, text: { en: "A trial on a few hundred of our real complaints, run more than once, to see how often it's right", ar: "تجربة على بضع مئات من شكاوانا الحقيقية، تُشغَّل أكثر من مرة، لنرى كم مرة تصيب" } }
      - { id: reviews, text: { en: "Reviews from other customers of the tool", ar: "آراء عملاء آخرين استخدموا الأداة" } }
    answer: [trial]
    misconceptions:
      - id: MC-P13-024
        when: [another, reviews]
        feedback:
          en: "One or two examples, or other people's opinions, don't show how it handles your complaints."
          ar: "مثال أو اثنان، أو آراء الآخرين، لا تُظهر كيف تتعامل الأداة مع شكاواك."
    correct:
      en: "Right. Your data, many times."
      ar: "صحيح. جرّبها على بياناتك، مرات كثيرة."
    explain:
      en: "Test AI tools on many of your own real inputs before you trust them."
      ar: "اختبر أدوات الذكاء الاصطناعي على كثير من مدخلاتك الحقيقية قبل أن تثق بها."

  - id: S08
    type: choose
    skill: SK-P13-U03-04
    part: retest
    speaker: karim
    value:
      en: "Re-test. One AI Output Is an Example (NN/g): AI evaluations should use representative inputs, enough observations, and report average performance and its variation."
      ar: "إعادة اختبار. ناتج واحد مثال (NN/g): تقييمات الذكاء الاصطناعي يجب أن تستخدم مدخلات ممثِّلة، وملاحظات كافية، وأن تذكر متوسّط الأداء ومدى تفاوته."
    ref: { url: "https://www.nngroup.com/articles/eval-ai-output/", quote: "AI evaluations should do the same: use representative inputs, collect enough observations, and report average performance, together with variability and uncertainty." }
    scenario:
      en: "Our photo app writes image descriptions for blind users with AI. I tried two prompts on one photo each. Prompt B's description looked better."
      ar: "تطبيق الصور يكتب بالذكاء الاصطناعي أوصافًا للصور للمستخدمين المكفوفين. وجرّبت طلبين (Prompts) على صورة واحدة لكل منهما. فبدا وصف الطلب B أفضل."
    prompt:
      en: "Can I switch to Prompt B?"
      ar: "هل أعتمد الطلب B بدلًا من A؟"
    options:
      - { id: test, text: { en: "Not yet. Try both on many different photos, several times each, then compare", ar: "ليس بعد. أجرّب الاثنين على صور مختلفة كثيرة، عدة مرات لكل منها، ثم أقارن" } }
      - { id: yes, text: { en: "Yes. B clearly won", ar: "نعم. B فاز بوضوح" } }
      - { id: same, text: { en: "Try both again on the same photo", ar: "أجرّب الاثنين مرة أخرى على الصورة نفسها" } }
    answer: [test]
    misconceptions:
      - id: MC-P13-024
        when: [yes, same]
        feedback:
          en: "One photo can't show which prompt works better on the thousands of photos users upload."
          ar: "صورة واحدة لا تُظهر أي طلب يعمل أفضل على آلاف الصور التي يرفعها المستخدمون."
    correct:
      en: "Right. Many photos, many runs, then decide."
      ar: "صحيح. صور كثيرة، ومرات كثيرة، ثم قرّر."
    explain:
      en: "Compare AI prompts like a study: many real inputs, repeated runs, average results."
      ar: "قارن طلبات الذكاء الاصطناعي كما في دراسة: مدخلات حقيقية كثيرة، وتشغيل متكرّر، ثم متوسّط النتائج."
