id: P13-U05-B01
mode: bank
title:
  en: "Re-tests: design with AI, keep the judgment"
  ar: "إعادة اختبار: صمّم بالذكاء الاصطناعي، والقرار لك"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "AI Design Tools Are Marginally Better: Status Update (NN/g)", ar: "أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا: تحديث للوضع (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-design-tools-update-2/"
  - title: { en: "Prompt to Design Interfaces (NN/g)", ar: "من الطلب إلى تصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/vague-prototyping/"
  - title: { en: "Leverage AI for Mock Tables and Charts When Testing Prototypes (NN/g)", ar: "استخدم الذكاء الاصطناعي لجداول ورسوم تجريبية حين تختبر النماذج الأولية (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-data-prototype-testing/"
steps:
  - id: S01
    type: choose
    skill: SK-P13-U05-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. AI Design Tools Are Marginally Better (NN/g): unlike broad AI that takes any input, narrow-scope AI specializes in one or a few specific tasks."
      ar: "إعادة اختبار. أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): على عكس الذكاء الاصطناعي الواسع الذي يقبل أي مُدخل، يتخصّص الذكاء الاصطناعي المحدود في مهمة واحدة أو مهام قليلة محدّدة."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "Unlike broad AIs (like ChatGPT), which accept a wide range of inputs and produce an equally wide array of outputs, narrow-scope AIs specialize in one or few specific tasks." }
    scenario:
      en: "I'm updating our gym app on my own. I have 30 classes that need short descriptions, and I want a new app design."
      ar: "أحدّث تطبيق النادي بنفسي. ولديّ 30 حصة تحتاج أوصافًا قصيرة، وأريد تصميمًا جديدًا للتطبيق."
    prompt:
      en: "Where will AI help me most?"
      ar: "أين سيساعدني الذكاء الاصطناعي أكثر؟"
    options:
      - { id: app, text: { en: "Generate the whole new app design from one sentence", ar: "توليد تصميم التطبيق الجديد كاملًا من جملة واحدة" } }
      - { id: desc, text: { en: "Draft the 30 class descriptions from my notes, then I edit them", ar: "كتابة مسوّدات أوصاف الحصص الثلاثين من ملاحظاتي، ثم أحرّرها" } }
      - { id: prices, text: { en: "Decide the new membership prices", ar: "تحديد أسعار الاشتراك الجديدة" } }
    answer: [desc]
    misconceptions:
      - id: MC-P13-032
        when: [app, prices]
        feedback:
          en: "Big, open jobs are where AI falls short. Thirty similar descriptions are exactly its kind of job."
          ar: "الذكاء الاصطناعي يقصّر في المهام الكبيرة المفتوحة. أما ثلاثون وصفًا متشابهًا فهي المهمة التي يُتقنها."
    correct:
      en: "Right. Many similar small pieces: a perfect AI job."
      ar: "صحيح. قطع صغيرة متشابهة كثيرة: مهمة مثالية للذكاء الاصطناعي."
    explain:
      en: "Give AI the narrow, repeated work, and keep the big decisions."
      ar: "أعطِ الذكاء الاصطناعي العمل المحدود المتكرّر، واحتفظ بالقرارات الكبيرة."

  - id: S02
    type: choose
    skill: SK-P13-U05-01
    part: retest
    speaker: youssef
    value:
      en: "Re-test. AI Design Tools Are Marginally Better (NN/g): AI images work well as placeholders; using them in final designs isn't recommended, since trust can drop if users notice."
      ar: "إعادة اختبار. أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): صور الذكاء الاصطناعي تصلح كصور مؤقتة؛ واستخدامها في التصاميم النهائية غير مُستحسن، لأن الثقة قد تنهار إذا لاحظ المستخدمون."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "While we do not recommend you do so, since user trust can plummet if they notice AI use, it does work in a pinch when resources are scarce." }
    scenario:
      en: "I need product photos for 50 items. Some are for next week's prototype test, and the rest are for the live shop."
      ar: "أحتاج صورًا لـ50 منتجًا. بعضها لاختبار النموذج الأولي الأسبوع القادم، والباقي للمتجر الفعلي."
    prompt:
      en: "How should I use AI images?"
      ar: "كيف أستخدم صور الذكاء الاصطناعي؟"
    options:
      - { id: all, text: { en: "Use AI images everywhere. They look great and cost nothing", ar: "أستخدم صور الذكاء الاصطناعي في كل مكان. فهي تبدو رائعة ولا تكلّف شيئًا" } }
      - { id: none, text: { en: "Never use them, not even in the prototype", ar: "لا أستخدمها أبدًا، ولا حتى في النموذج الأولي" } }
      - { id: proto, text: { en: "Use them in the prototype, and use real photos of the real products in the live shop", ar: "أستخدمها في النموذج الأولي، وأستخدم صورًا حقيقية للمنتجات الحقيقية في المتجر الفعلي" } }
    answer: [proto]
    misconceptions:
      - id: MC-P13-032
        when: [all]
        feedback:
          en: "Shoppers need to see the real product. If they spot AI photos, they may stop trusting the shop."
          ar: "المتسوّقون يحتاجون أن يروا المنتج الحقيقي. وإذا لاحظوا صور الذكاء الاصطناعي، قد يتوقّفون عن الثقة بالمتجر."
      - id: MC-P13-002
        when: [none]
        feedback:
          en: "For a quick test, AI placeholders save time and money. Just keep them out of the live shop."
          ar: "في اختبار سريع، الصور المؤقتة (Placeholders) من الذكاء الاصطناعي توفّر الوقت والمال. فقط أبقِها خارج المتجر الفعلي."
    correct:
      en: "Right. Placeholders for tests, real photos for buyers."
      ar: "صحيح. صور مؤقتة للاختبار، وصور حقيقية للمشترين."
    explain:
      en: "AI placeholders are a good small job. Real products need real photos."
      ar: "الصور المؤقتة من الذكاء الاصطناعي مهمة صغيرة جيدة. والمنتجات الحقيقية تحتاج صورًا حقيقية."

  - id: S03
    type: choose
    skill: SK-P13-U05-02
    part: retest
    speaker: tarek
    value:
      en: "Re-test. AI Design Tools Are Marginally Better (NN/g): no AI tool supports design systems well yet, and a prototype of random design elements isn't helpful."
      ar: "إعادة اختبار. أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): لا توجد بعد أداة ذكاء اصطناعي تدعم أنظمة التصميم جيدًا، والنموذج الأولي المكوّن من عناصر عشوائية غير مفيد."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "Currently, no genAI tool effectively supports design systems; this limitation lowers their utility within design teams." }
    scenario:
      en: "AI generated a new restaurant page for our food app. The buttons, fonts and cards look nothing like the rest of our app. A teammate wants to ship it as is."
      ar: "ولّد الذكاء الاصطناعي صفحة مطعم جديدة لتطبيق الطعام. والأزرار والخطوط والبطاقات لا تشبه بقية تطبيقنا أبدًا. ويريد زميل أن يطلقها كما هي."
    prompt:
      en: "What do I tell my teammate?"
      ar: "ماذا أقول لزميلي؟"
    options:
      - { id: idea, text: { en: "Let's keep its good ideas and rebuild the page with our design system", ar: "لنحتفظ بأفكارها الجيدة ونُعيد بناء الصفحة بنظام التصميم (Design system) عندنا" } }
      - { id: ship, text: { en: "Ship it. A fresh look is good", ar: "لنطلقها. فالشكل الجديد جيد" } }
      - { id: colors, text: { en: "Just change its colors to ours and ship it", ar: "لنغيّر ألوانها إلى ألواننا فقط ونطلقها" } }
    answer: [idea]
    misconceptions:
      - id: MC-P13-033
        when: [ship, colors]
        feedback:
          en: "A page that doesn't match the app confuses users and is harder for developers to keep. Colors alone won't fix that."
          ar: "الصفحة التي لا تشبه بقية التطبيق تُربك المستخدمين ويصعب على المطوّرين صيانتها. والألوان وحدها لن تُصلح ذلك."
    correct:
      en: "Right. Its ideas, our system."
      ar: "صحيح. أفكارها، ونظامنا."
    explain:
      en: "AI screens ignore your design system. Use their ideas, then build with your own parts."
      ar: "شاشات الذكاء الاصطناعي تتجاهل نظام التصميم عندك. استخدم أفكارها، ثم ابنِ بمكوّناتك (Components)."

  - id: S04
    type: choose
    skill: SK-P13-U05-02
    part: retest
    speaker: karim
    value:
      en: "Re-test. Prompt to Design Interfaces (NN/g): repetition without purpose only adds noise and distracts users from the key content."
      ar: "إعادة اختبار. من الطلب إلى تصميم الواجهات (NN/g): التكرار بلا هدف يضيف ضوضاء فقط ويشتّت المستخدمين عن المحتوى الأساسي."
    ref: { url: "https://www.nngroup.com/articles/vague-prototyping/", quote: "Repetition without purpose only adds noise to the interface and distracts users from the key content." }
    scenario:
      en: "I'm coding an order screen the AI tool generated. It shows the order status twice: as a progress bar and as a step list right under it."
      ar: "أبرمج شاشة طلب ولّدتها أداة الذكاء الاصطناعي. وهي تُظهر حالة الطلب مرتين: كشريط تقدّم (Progress bar)، وكقائمة خطوات تحته مباشرة."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    options:
      - { id: both, text: { en: "Code both. The AI must have had a reason", ar: "أبرمج الاثنين. فلا بد أن للذكاء الاصطناعي سببًا" } }
      - { id: ask, text: { en: "Ask the designer to keep one, since the repeat adds noise", ar: "أطلب من المصمم أن يُبقي واحدًا، لأن التكرار يزحم الشاشة" } }
      - { id: third, text: { en: "Add a status text too, to be extra clear", ar: "أضيف نص حالة أيضًا، ليكون أوضح" } }
    answer: [ask]
    misconceptions:
      - id: MC-P13-034
        when: [both, third]
        feedback:
          en: "AI often repeats things for no reason. Showing the same status twice only crowds the screen."
          ar: "الذكاء الاصطناعي كثيرًا ما يكرّر الأشياء بلا سبب. وإظهار الحالة نفسها مرتين يزحم الشاشة فقط."
    correct:
      en: "Right. One clear status is enough."
      ar: "صحيح. حالة واحدة واضحة تكفي."
    explain:
      en: "Watch for repeats in AI screens. Each one costs space and attention."
      ar: "انتبه للتكرار في شاشات الذكاء الاصطناعي. فكل تكرار يأخذ مساحة وانتباهًا."

  - id: S05
    type: choose
    skill: SK-P13-U05-03
    part: retest
    speaker: sara
    value:
      en: "Re-test. Prompt to Design Interfaces (NN/g): when crafting prompts, clarity and specificity matter more than length."
      ar: "إعادة اختبار. من الطلب إلى تصميم الواجهات (NN/g): حين تكتب الطلبات، الوضوح والتحديد أهم من الطول."
    ref: { url: "https://www.nngroup.com/articles/vague-prototyping/", quote: "When crafting prompts, clarity and specificity matter more than sheer length." }
    scenario:
      en: "I want AI ideas for a card-settings screen in our banking app. My first prompt: \"Design a trendy card settings page.\""
      ar: "أريد أفكارًا من الذكاء الاصطناعي لشاشة إعدادات البطاقة في تطبيقنا البنكي. وطلبي الأول: «صمّم صفحة إعدادات بطاقة عصرية.»"
    prompt:
      en: "Which rewrite is best?"
      ar: "أي صياغة للطلب تعطيني أفكارًا مفيدة لهذه الشاشة؟"
    options:
      - { id: longer, text: { en: "\"Design a very trendy, very modern, very clean, very beautiful card settings page.\"", ar: "«صمّم صفحة إعدادات بطاقة عصرية جدًا، وحديثة جدًا، وبسيطة جدًا، وجميلة جدًا.»" } }
      - { id: brand, text: { en: "\"Make it like a famous global bank's app.\"", ar: "«اجعلها مثل تطبيق بنك عالمي مشهور.»" } }
      - { id: clear, text: { en: "\"Flat design in our attached design system. Toggles for freeze card, online payments and limits, with the freeze toggle first.\"", ar: "«تصميم مسطّح (Flat design) بنظام التصميم المرفق. مفاتيح (Toggles) لإيقاف البطاقة، والدفع الإلكتروني، والحدود، ومفتاح الإيقاف أولًا.»" } }
    answer: [clear]
    misconceptions:
      - id: MC-P13-035
        when: [longer]
        feedback:
          en: "More vague words are still vague. Say the style and what the screen must show."
          ar: "الكلمات الغامضة الإضافية تبقى غامضة. قل الأسلوب وما يجب أن تُظهره الشاشة."
      - id: MC-P13-036
        when: [brand]
        feedback:
          en: "Another bank's look fits its own users. Describe what yours need."
          ar: "شكل بنك آخر يناسب مستخدميه. صِف ما يحتاجه مستخدموك."
    correct:
      en: "Right. Short, precise and specific."
      ar: "صحيح. قصير، ودقيق، ومحدّد."
    explain:
      en: "A precise prompt beats a long vague one. Name the style, the parts and the order."
      ar: "الطلب الدقيق أفضل من الطويل الغامض. سمِّ الأسلوب، والأجزاء، والترتيب."

  - id: S06
    type: choose
    skill: SK-P13-U05-03
    part: retest
    speaker: mona
    value:
      en: "Re-test. Prompt to Design Interfaces (NN/g): early in the process, use lightweight visual references, like moodboards, inspiration images or screenshots of your design system."
      ar: "إعادة اختبار. من الطلب إلى تصميم الواجهات (NN/g): في بداية العمل، استخدم مراجع بصرية بسيطة، مثل لوحات الإلهام، أو صور ملهمة، أو صور لنظام التصميم عندك."
    ref: { url: "https://www.nngroup.com/articles/vague-prototyping/", quote: "When you’re still early in the design process or lack the resources to produce polished assets, use lightweight visual references instead, such moodboards, inspiration images, or screenshots of your design system." }
    scenario:
      en: "My team is exploring early ideas for a rewards screen. AI keeps giving us styles that don't feel like our app. Nobody has time for polished mockups."
      ar: "يستكشف فريقي أفكارًا أولى لشاشة مكافآت. والذكاء الاصطناعي يعطينا أساليب لا تشبه تطبيقنا. ولا أحد لديه وقت لنماذج تصميم مصقولة (Mockups)."
    prompt:
      en: "What should we add to the prompt?"
      ar: "ماذا نضيف إلى الطلب؟"
    options:
      - { id: ref, text: { en: "A screenshot of our design system and two screens from our app", ar: "صورة لنظام التصميم عندنا وشاشتين من تطبيقنا" } }
      - { id: mock, text: { en: "Nothing until someone makes a full high-fidelity mockup", ar: "لا شيء حتى يصنع أحدٌ نموذجًا كاملًا عالي الدقة (High-fidelity mockup)" } }
      - { id: words, text: { en: "\"Make it feel like our app.\"", ar: "«اجعلها تشبه تطبيقنا.»" } }
    answer: [ref]
    misconceptions:
      - id: MC-P13-035
        when: [words]
        feedback:
          en: "The AI doesn't know what your app looks like. Show it."
          ar: "الذكاء الاصطناعي لا يعرف شكل تطبيقك. فأرِه إياه."
      - id: MC-P13-016
        when: [mock]
        feedback:
          en: "You don't need polish to guide the AI. A quick screenshot is enough for early ideas."
          ar: "لست بحاجة إلى تصميم مصقول لتوجيه الذكاء الاصطناعي. فصورة سريعة تكفي للأفكار الأولى."
    correct:
      en: "Right. A quick reference beats a description."
      ar: "صحيح. المرجع السريع أفضل من الوصف."
    explain:
      en: "Show the AI your look with a simple reference. Words alone can't describe it."
      ar: "أرِ الذكاء الاصطناعي شكل تطبيقك بمرجع بسيط. فالكلمات وحدها لا تصفه."

  - id: S07
    type: choose
    skill: SK-P13-U05-04
    part: retest
    speaker: nour
    value:
      en: "Re-test. Mock Tables and Charts (NN/g): set plausible ranges for the values in your mock data."
      ar: "إعادة اختبار. الجداول والرسوم التجريبية (NN/g): حدّد نطاقات معقولة للقيم في بياناتك التجريبية."
    ref: { url: "https://www.nngroup.com/articles/ai-data-prototype-testing/", quote: "Plausible ranges: Determine a realistic range to bound values in the table." }
    scenario:
      en: "We'll test a new results screen with our doctors. The AI's mock data shows a patient's blood pressure as 300/20."
      ar: "سنختبر شاشة نتائج جديدة مع أطبائنا. والبيانات التجريبية من الذكاء الاصطناعي تُظهر ضغط دم أحد المرضى 300/20."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    options:
      - { id: keep, text: { en: "Keep it. Doctors know it's a prototype", ar: "أُبقيها. فالأطباء يعرفون أنه نموذج أولي" } }
      - { id: ranges, text: { en: "Ask AI again with realistic ranges, like 90 to 140 for the top number, and check the results", ar: "أطلب من الذكاء الاصطناعي مرة أخرى مع نطاقات واقعية، مثل من 90 إلى 140 للرقم الأعلى، وأراجع النتائج" } }
      - { id: remove, text: { en: "Remove all numbers from the prototype", ar: "أحذف كل الأرقام من النموذج الأولي" } }
    answer: [ranges]
    misconceptions:
      - id: MC-P13-037
        when: [keep, remove]
        feedback:
          en: "Doctors will spot impossible numbers at once, and talk about them instead of the design. And without numbers, there's nothing to test."
          ar: "الأطباء سيلاحظون الأرقام المستحيلة فورًا، ويتحدّثون عنها بدلًا من التصميم. ودون أرقام، لا يوجد ما يُختبر."
    correct:
      en: "Right. Believable numbers keep the test on the design."
      ar: "صحيح. الأرقام القابلة للتصديق تُبقي تركيز الاختبار على التصميم."
    explain:
      en: "Give AI realistic ranges, then check its numbers before the test."
      ar: "أعطِ الذكاء الاصطناعي نطاقات واقعية، ثم راجع أرقامه قبل الاختبار."

  - id: S08
    type: choose
    skill: SK-P13-U05-04
    part: retest
    speaker: rami
    value:
      en: "Re-test. Mock Tables and Charts (NN/g): never share sensitive or identifying data with AI tools unless your company has approved them."
      ar: "إعادة اختبار. الجداول والرسوم التجريبية (NN/g): لا تشارك أبدًا بيانات حسّاسة أو تكشف هوية أصحابها مع أدوات الذكاء الاصطناعي إلا إذا وافقت عليها شركتك."
    ref: { url: "https://www.nngroup.com/articles/ai-data-prototype-testing/", quote: "We recommend that you never share sensitive or identifying data with genAI tools unless your company has verified and approved their use." }
    scenario:
      en: "I need a realistic rider profile screen for a test. A teammate sends me a file with 2,000 real riders' names, phones and home stations, and says: \"Paste it into the AI, it's quicker.\""
      ar: "أحتاج شاشة ملف شخصي واقعية لراكب من أجل اختبار. ويرسل لي زميل ملفًا فيه أسماء 2,000 راكب حقيقي وهواتفهم ومحطاتهم القريبة من بيوتهم، ويقول: «الصقه في الذكاء الاصطناعي، أسرع.»"
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    options:
      - { id: paste, text: { en: "Paste it. It's only for a prototype", ar: "ألصقه. فهو لنموذج أولي فقط" } }
      - { id: few, text: { en: "Paste only 20 of the riders", ar: "ألصق 20 راكبًا فقط" } }
      - { id: mock, text: { en: "Don't paste it. Ask AI to make up realistic riders instead", ar: "لا ألصقه. وأطلب من الذكاء الاصطناعي أن يخترع ركّابًا واقعيين بدلًا من ذلك" } }
    answer: [mock]
    misconceptions:
      - id: MC-P13-038
        when: [paste, few]
        feedback:
          en: "Even 20 real riders is private data shared with an outside tool. Made-up riders work just as well."
          ar: "حتى بيانات 20 راكبًا حقيقيًا بيانات خاصة، وستُشارَك مع أداة خارجية. والركّاب المُخترَعون يؤدّون الغرض نفسه."
    correct:
      en: "Right. Realistic, not real."
      ar: "صحيح. واقعي، لا حقيقي."
    explain:
      en: "Keep real personal data out of AI tools. Ask for realistic made-up data."
      ar: "أبقِ البيانات الشخصية الحقيقية بعيدًا عن أدوات الذكاء الاصطناعي. واطلب بيانات مُخترَعة واقعية."
