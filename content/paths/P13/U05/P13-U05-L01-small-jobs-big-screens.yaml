id: P13-U05-L01
mode: lesson
minutes: 7
title:
  en: "Small jobs and generated screens"
  ar: "المهام الصغيرة والشاشات المولَّدة"
summary:
  en: "Pick the design jobs AI does well for a banking app, and fix a screen it generated."
  ar: "اختر مهام التصميم التي يُتقنها الذكاء الاصطناعي لتطبيق بنكي، وأصلح شاشة ولّدها."
speaker: sara
sources:
  - title: { en: "AI Design Tools Are Marginally Better: Status Update (NN/g)", ar: "أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا: تحديث للوضع (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-design-tools-update-2/"
  - title: { en: "Prompt to Design Interfaces (NN/g)", ar: "من الطلب إلى تصميم الواجهات (NN/g)" }
    url: "https://www.nngroup.com/articles/vague-prototyping/"
review_labels:
  MC-P13-006: { en: "AI can't predict what your users will do", ar: "الذكاء الاصطناعي لا يستطيع توقّع ما سيفعله مستخدموك" }
  MC-P13-032: { en: "Design AI helps most with small, repetitive jobs", ar: "أدوات التصميم بالذكاء الاصطناعي تساعد أكثر في المهام الصغيرة المتكرّرة" }
  MC-P13-033: { en: "Polished doesn't mean usable", ar: "الشكل الأنيق لا يعني سهولة الاستخدام" }
  MC-P13-034: { en: "AI layouts often stress the wrong things", ar: "تصاميم الذكاء الاصطناعي كثيرًا ما تبرز الأشياء الخطأ" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "One sentence, a whole feature?", ar: "جملة واحدة، وميزة كاملة؟" }
    body:
      en: "I'm a product designer on a banking app. My manager watched a demo: someone typed one sentence and got a full app.\n\nNow he wants me to make our new savings goals feature the same way, and fast."
      ar: "أنا مصممة منتجات في تطبيق بنكي. وشاهد مديري عرضًا: كتب شخص جملة واحدة فحصل على تطبيق كامل.\n\nوالآن يريدني أن أصنع ميزة أهداف الادخار الجديدة بالطريقة نفسها، وبسرعة."
    mock:
      app: fikra
      frame: wide
      url: fikra.example/design
      blocks:
      - kind: heading
        text: {en: New design, ar: تصميم جديد}
      - kind: field
        label: {en: Prompt, ar: الطلب}
        text: {en: Design a savings goals feature for a banking app., ar: صمّم ميزة أهداف ادخار لتطبيق بنكي.}
        filled: true
        icon: sparkle
        gap: s
      - kind: button
        text: {en: Generate, ar: ولِّد}
        icon: sparkle
        gap: s

  - id: S02
    type: choose
    skill: SK-P13-U05-01
    part: try
    rules: [R12]
    value:
      en: "Try first. AI Design Tools Are Marginally Better (NN/g): the AI tools designers actually use every day are narrow; they focus on one specific task."
      ar: "جرّب أولًا. أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): أدوات الذكاء الاصطناعي التي يستخدمها المصممون فعلًا كل يوم محدودة؛ تركّز على مهمة واحدة محدّدة."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "Based on interactions with practicing designers, we’ve found that the most helpful tools (actually adopted by designers for everyday work) are decidedly narrow — that is, they are usually focused on completing one specific task." }
    prompt:
      en: "Which job is AI most likely to save me real time on today?"
      ar: "في أي مهمة سيوفّر عليّ الذكاء الاصطناعي وقتًا حقيقيًا اليوم؟"
    options:
      - { id: whole, text: { en: "Making the whole savings feature from one sentence", ar: "صنع ميزة الادخار كاملة من جملة واحدة" } }
      - { id: decide, text: { en: "Deciding which savings features our customers need", ar: "تحديد ميزات الادخار التي يحتاجها عملاؤنا" } }
      - { id: layers, text: { en: "Renaming the 300 messy layers in my design file", ar: "إعادة تسمية الطبقات (Layers) الـ300 الفوضوية في ملف التصميم" } }
    answer: [layers]
    misconceptions:
      - id: MC-P13-032
        when: [whole]
        feedback:
          en: "Full-feature generators still fall short. AI shines on one small, repetitive job at a time."
          ar: "مولّدات الميزات الكاملة ما زالت قاصرة. والذكاء الاصطناعي يتألّق في مهمة صغيرة متكرّرة واحدة كل مرة."
      - id: MC-P13-006
        when: [decide]
        feedback:
          en: "Only research with real customers can tell you what they need."
          ar: "البحث مع العملاء الحقيقيين فقط يخبرك بما يحتاجونه."
    hints:
      - { en: "Which job is boring, repetitive and the same every time?", ar: "أي مهمة مملّة ومتكرّرة ومتشابهة كل مرة؟" }
      - { en: "Small and clear beats big and open.", ar: "الصغير الواضح أفضل من الكبير المفتوح." }
    correct:
      en: "Right. A narrow, tedious job is where AI helps most."
      ar: "صحيح. في المهمة المحدودة المملّة يساعد الذكاء الاصطناعي أكثر."
    explain:
      en: "Today's design AI is best at one repetitive task at a time, not at whole products."
      ar: "أدوات التصميم بالذكاء الاصطناعي اليوم أفضل في مهمة متكرّرة واحدة كل مرة، لا في منتجات كاملة."

  - id: S03
    type: card
    part: concept
    icons: [layers, eye, warn, ok]
    title: { en: "What design AI does well today", ar: "ما تُتقنه أدوات التصميم بالذكاء الاصطناعي اليوم" }
    body:
      en: "**Small jobs: a real help.** Renaming layers, rewriting placeholder text, building a color palette, finding similar designs, making placeholder images.\n\n**Whole screens: ideas only.** Tools that generate full screens or prototypes are best for exploring ideas. Their screens often feel \"pieced together\":\n- Clutter and repeated information\n- The wrong thing made the biggest\n- An order that doesn't make sense\n- Parts that ignore your design system\n\nA polished screen can still be a poor design. Judge it on how easy it is to use."
      ar: "**المهام الصغيرة: مساعدة حقيقية.** إعادة تسمية الطبقات (Layers)، وإعادة كتابة النصوص المؤقتة (Placeholder text)، وبناء لوحة ألوان (Color palette)، وإيجاد تصاميم مشابهة، وصنع صور مؤقتة.\n\n**الشاشات الكاملة: أفكار فقط.** الأدوات التي تولّد شاشات أو نماذج أولية كاملة أفضل لاستكشاف الأفكار. وشاشاتها كثيرًا ما تبدو «مركّبة من قطع متفرّقة»:\n- زحام ومعلومات مكرّرة\n- الشيء الخطأ هو الأكبر\n- ترتيب غير منطقي\n- أجزاء تتجاهل نظام التصميم (Design system) عندك\n\nالشاشة الأنيقة قد تكون تصميمًا سيئًا. فاحكم عليها بسهولة استخدامها."

  - id: S04
    type: choose
    skill: SK-P13-U05-01
    part: guided
    confidence: true
    rules: [R06]
    value:
      en: "AI Design Tools Are Marginally Better (NN/g): narrow tools use what AI is good at: automating repetitive tasks with targeted suggestions based on pattern recognition."
      ar: "أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): الأدوات المحدودة تستغلّ ما يُتقنه الذكاء الاصطناعي: أتمتة المهام المتكرّرة باقتراحات موجّهة مبنية على التعرّف على الأنماط."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "these narrow tools take advantage of what current genAI is good at — automating repetitive tasks with targeted suggestions based on strong pattern recognition." }
    scenario:
      en: "I have two hours left today. Here are three jobs on my list."
      ar: "بقيت لي ساعتان اليوم. وهذه ثلاث مهام في قائمتي."
    prompt:
      en: "Which one should I hand to AI?"
      ar: "أيّ مهمة أعطيها للذكاء الاصطناعي في الساعتين الباقيتين؟"
    options:
      - { id: home, text: { en: "Decide what goes on the new home screen", ar: "تحديد ما يوضع في الشاشة الرئيسية الجديدة" } }
      - { id: text, text: { en: "Write 3 versions of placeholder text for 20 goal cards", ar: "كتابة 3 نسخ من النص المؤقت لـ20 بطاقة هدف" } }
      - { id: flow, text: { en: "Design the full flow for opening a savings account", ar: "تصميم كل خطوات فتح حساب ادخار (Flow)" } }
    answer: [text]
    misconceptions:
      - id: MC-P13-032
        when: [home, flow]
        feedback:
          en: "These need judgment about users and the business. Give AI the repetitive job and keep these for yourself."
          ar: "هذه تحتاج فهمًا للمستخدمين ولأهداف العمل. أعطِ الذكاء الاصطناعي المهمة المتكرّرة واحتفظ بهذه لنفسك."
    hints:
      - { en: "Which job is the same small thing, many times?", ar: "أي مهمة هي الشيء الصغير نفسه، مرات كثيرة؟" }
    correct:
      en: "Right. Repetitive and low-risk: perfect for AI."
      ar: "صحيح. متكرّرة وقليلة الخطر: مثالية للذكاء الاصطناعي."
    explain:
      en: "Hand AI the repetitive work. Keep the decisions about users for yourself."
      ar: "أعطِ الذكاء الاصطناعي العمل المتكرّر. واحتفظ بالقرارات المتعلّقة بالمستخدمين لنفسك."

  - id: S05
    type: tune
    skill: SK-P13-U05-02
    part: guided
    rules: [R06]
    value:
      en: "Prompt to Design Interfaces (NN/g): AI-generated interfaces often put visual emphasis on the wrong element, because the model doesn't understand what matters for the goal."
      ar: "من الطلب إلى تصميم الواجهات (NN/g): الواجهات التي يولّدها الذكاء الاصطناعي كثيرًا ما تبرز العنصر الخطأ، لأن النموذج لا يفهم ما المهمّ لتحقيق الهدف."
    ref: { url: "https://www.nngroup.com/articles/vague-prototyping/", quote: "This is a common flaw of AI-generated interfaces, which often place visual emphasis on the wrong element, as the model doesn’t have a contextual understanding of what is essential for the goal." }
    scenario:
      en: "I tried the generator anyway, to get ideas. Customers open this screen mainly to add money to a goal."
      ar: "جرّبت المولّد على أي حال، لأحصل على أفكار. والعملاء يفتحون هذه الشاشة غالبًا ليضيفوا مالًا إلى هدف."
    prompt:
      en: "Tap each option to see the change. Which change fixes the screen's biggest problem?"
      ar: "اضغط على كل خيار لترى التغيير. أي تغيير يُصلح أكبر مشكلة في الشاشة؟"
    mock:
      app: rasid
      appbar:
        title: {en: Savings, ar: الادخار}
        back: true
      caption: {en: AI-generated screen, ar: شاشة ولّدها الذكاء الاصطناعي}
      blocks:
      - kind: title
        text:
          en: "3"
          ar: "3"
        gap: s
      - kind: small
        text: {en: active goals, ar: أهداف نشطة}
        color: muted
      - kind: listitem
        icon: car
        text:
          en: "Car · 40%"
          ar: "سيارة · 40%"
        gap: s
      - kind: small
        text:
          en: "Car progress: 40% done"
          ar: "هدف السيارة: اكتمل 40%"
        gap: xs
      - kind: button
        text: {en: Add money, ar: أضف مالًا}
        style: text
        gap: s
    options:
      - id: icons
        text: { en: "Add a colorful icon next to each goal", ar: "أضف أيقونة ملوّنة بجانب كل هدف" }
        mock:
          app: rasid
          appbar:
            title: {en: Savings, ar: الادخار}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: title
            text:
              en: "3"
              ar: "3"
            gap: s
          - kind: small
            text: {en: active goals, ar: أهداف نشطة}
            color: muted
          - kind: chip
            text:
              en: "\U0001F697 Car · 40%"
              ar: "\U0001F697 سيارة · 40%"
            gap: s
          - kind: small
            text:
              en: "Car progress: 40% done"
              ar: "هدف السيارة: اكتمل 40%"
            gap: xs
          - kind: button
            text: {en: Add money, ar: أضف مالًا}
            style: text
            gap: s
      - id: focus
        text: { en: "Remove the repeated line, shrink the big \"3\", and make \"Add money\" the main button", ar: "احذف السطر المكرّر، وصغّر الرقم «3» الكبير، واجعل «أضف مالًا» الزر الرئيسي" }
        mock:
          app: rasid
          appbar:
            title: {en: Savings, ar: الادخار}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: small
            text:
              en: "3 active goals"
              ar: "3 أهداف نشطة"
            color: muted
          - kind: listitem
            icon: car
            text:
              en: "Car · 40%"
              ar: "سيارة · 40%"
            sub:
              en: "12,000 of 30,000 EGP"
              ar: "12,000 من 30,000 جنيه"
            gap: s
          - {kind: progress, value: 40, gap: xs}
          - kind: button
            text: {en: Add money, ar: أضف مالًا}
            gap: s
      - id: chart
        text: { en: "Add a chart of all three goals at the top", ar: "أضف رسمًا بيانيًا للأهداف الثلاثة في الأعلى" }
        mock:
          app: rasid
          appbar:
            title: {en: Savings, ar: الادخار}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: chart
            type: bar
            values: [40, 15, 70]
            labels: [{ en: "Car", ar: "سيارة" }, { en: "Hajj", ar: "حج" }, { en: "Home", ar: "منزل" }]
            gap: s
          - kind: title
            text:
              en: "3"
              ar: "3"
            gap: s
          - kind: small
            text: {en: active goals, ar: أهداف نشطة}
            color: muted
          - kind: listitem
            icon: car
            text:
              en: "Car · 40%"
              ar: "سيارة · 40%"
            gap: s
          - kind: small
            text:
              en: "Car progress: 40% done"
              ar: "هدف السيارة: اكتمل 40%"
            gap: xs
          - kind: button
            text: {en: Add money, ar: أضف مالًا}
            style: text
            gap: s
    answer: [focus]
    misconceptions:
      - id: MC-P13-034
        when: [icons, chart]
        feedback:
          en: "That adds more on top. The real problem: a huge \"3\" gets the attention, while \"Add money\", the main job, is small."
          ar: "هذا يضيف المزيد فوق الموجود. والمشكلة الحقيقية: الرقم «3» الضخم يأخذ الانتباه، بينما «أضف مالًا»، المهمة الأساسية، صغير."
    hints:
      - { en: "Why do customers open this screen?", ar: "لماذا يفتح العملاء هذه الشاشة؟" }
      - { en: "What's the biggest thing on the screen now?", ar: "ما أكبر شيء في الشاشة الآن؟" }
    correct:
      en: "Right. The main job is now the main thing."
      ar: "صحيح. المهمة الأساسية أصبحت الشيء الأبرز."
    explain:
      en: "AI doesn't know your users' main goal. Fix what it makes big, and remove what it repeats."
      ar: "الذكاء الاصطناعي لا يعرف هدف مستخدميك الأساسي. فأصلح ما يكبّره، واحذف ما يكرّره."

  - id: S06
    type: compare
    skill: SK-P13-U05-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: a polished AI screen vs a plain wireframe. Prompt to Design Interfaces (NN/g): don't confuse visual fidelity with design quality."
      ar: "مقارنة: شاشة لامعة من الذكاء الاصطناعي مقابل مخطّط بسيط. من الطلب إلى تصميم الواجهات (NN/g): لا تخلط بين الدقة البصرية وجودة التصميم."
    ref: { url: "https://www.nngroup.com/articles/vague-prototyping/", quote: "Finally, don’t confuse visual fidelity with design quality." }
    scenario:
      en: "My manager has to pick one of these goal screens to build on."
      ar: "يجب أن يختار مديري واحدة من شاشتي الأهداف هاتين ليُبنى عليها."
    prompt:
      en: "Which one is the better design to build on?"
      ar: "أي شاشة نبني عليها لتُظهر للعميل ما يحتاجه بوضوح؟"
    a:
      label: { en: "A: a full-color screen in our brand colors", ar: "A: شاشة ملوّنة بالكامل بألوان علامتنا" }
      mock:
        app: rasid
        appbar:
          title: {en: Car, ar: سيارة}
          back: true
        blocks:
        - kind: title
          text: {en: Your Car Goal 🚗, ar: هدف السيارة 🚗}
        - {kind: progress, value: 40, ring: true, size: l, gap: s}
        - kind: badge
          text:
            en: "40% complete"
            ar: "اكتمل 40%"
          gap: xs
        - kind: small
          text:
            en: "Progress: 40%"
            ar: "التقدّم: 40%"
          gap: xs
        - kind: button
          text: {en: Add money, ar: أضف مالًا}
          style: text
          gap: s
    b:
      label: { en: "B: a gray wireframe", ar: "B: مخطّط رمادي (Wireframe)" }
      mock:
        app: rasid
        appbar:
          title: {en: Car, ar: سيارة}
          back: true
        gray: true
        blocks:
        - kind: heading
          text: {en: Car, ar: سيارة}
        - kind: text
          text:
            en: "12,000 of 30,000 EGP · 40%"
            ar: "12,000 من 30,000 جنيه · 40%"
          gap: xs
        - {kind: progress, value: 40, gap: xs}
        - kind: small
          text:
            en: "Next deposit: 1,500 EGP on the 1st"
            ar: "الإيداع التالي: 1,500 جنيه في أول الشهر"
          color: muted
          gap: xs
        - kind: button
          text: {en: Add money, ar: أضف مالًا}
          gap: s
    answer: b
    reason:
      prompt: { en: "Why is B the better design?", ar: "لماذا B هو التصميم الأفضل؟" }
      options:
        - { id: gray, text: { en: "Gray designs are always better", ar: "التصاميم الرمادية أفضل دائمًا" } }
        - { id: clear, text: { en: "It shows the amounts and next step clearly, with no repeats, and the main action stands out", ar: "تُظهر المبالغ والخطوة التالية بوضوح، بلا تكرار، والفعل الأساسي بارز" } }
        - { id: short, text: { en: "It has fewer colors", ar: "فيها ألوان أقل" } }
      answer: [clear]
      misconceptions:
        - id: MC-P13-033
          when: [gray, short]
          feedback:
            en: "Color isn't the point. B wins on content and order: the amounts, the next deposit and a clear main button."
            ar: "اللون ليس هو المقصود. B تفوز بالمحتوى والترتيب: المبالغ، والإيداع التالي، وزر رئيسي واضح."
    misconceptions:
      - id: MC-P13-033
        when: [a]
        feedback:
          en: "A looks finished, but says 40% three times and never shows the money. Polish hides the problems."
          ar: "A تبدو جاهزة، لكنها تقول 40% ثلاث مرات ولا تُظهر المال أبدًا. والشكل الأنيق يُخفي المشكلات."
    hints:
      - { en: "How many times does A show 40%?", ar: "كم مرة تُظهر A نسبة 40%؟" }
      - { en: "Which one tells you how much you've saved?", ar: "أيّهما تخبرك كم ادّخرت؟" }
    correct:
      en: "Right. Clear beats shiny."
      ar: "صحيح. الوضوح أهم من الشكل الأنيق."
    explain:
      en: "Judge a design on clarity and usability. A polished AI screen can still be a poor one."
      ar: "احكم على التصميم بوضوحه وسهولة استخدامه. فالشاشة الأنيقة من الذكاء الاصطناعي قد تكون سيئة."

  - id: S07
    type: choose
    skill: SK-P13-U05-02
    part: guided
    rules: [R06]
    value:
      en: "AI Design Tools Are Marginally Better (NN/g): for now, wireframe and prototype generators work best for ideation, as starting points."
      ar: "أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): حاليًا، مولّدات المخطّطات والنماذج الأولية أفضل لتوليد الأفكار، كنقاط بداية."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "At present, wireframe and prototype tools work best for ideation, possibly as starting points for newer designers or freelancers." }
    scenario:
      en: "The generator gave me 3 versions of the goals screen. One has a nice idea: a \"round up my change\" switch."
      ar: "أعطاني المولّد 3 نسخ من شاشة الأهداف. وفي إحداها فكرة جميلة: مفتاح (Toggle) «قرّب المبلغ وادّخر الفرق»."
    prompt:
      en: "How should I use the 3 versions?"
      ar: "كيف أستخدم النسخ الثلاث؟"
    options:
      - { id: ideas, text: { en: "Take the good ideas, like the switch, and design the screen myself in our design system", ar: "آخذ الأفكار الجيدة، مثل المفتاح، وأصمّم الشاشة بنفسي في نظام التصميم عندنا" } }
      - { id: ship, text: { en: "Pick the best-looking one and send it to the developers", ar: "أختار أجمل نسخة وأرسلها إلى المطوّرين" } }
      - { id: ignore, text: { en: "Ignore all 3. Generated screens are useless", ar: "أتجاهل الثلاث. فالشاشات المولَّدة بلا فائدة" } }
    answer: [ideas]
    misconceptions:
      - id: MC-P13-033
        when: [ship]
        feedback:
          en: "Generated screens don't follow your design system and often have layout problems. Use them for ideas."
          ar: "الشاشات المولَّدة لا تتّبع نظام التصميم عندك، وكثيرًا ما تكون فيها مشكلات في الترتيب. استخدمها للأفكار."
      - id: MC-P13-002
        when: [ignore]
        feedback:
          en: "The switch idea is worth keeping. Ideas are what these tools are good for."
          ar: "فكرة المفتاح تستحق الاحتفاظ بها. والأفكار هي ما تُتقنه هذه الأدوات."
    hints:
      - { en: "What's useful in the 3 versions: the layout, or the ideas?", ar: "ما المفيد في النسخ الثلاث: الترتيب، أم الأفكار؟" }
    correct:
      en: "Right. Keep the ideas, design the screen."
      ar: "صحيح. احتفظ بالأفكار، وصمّم الشاشة."
    explain:
      en: "Use generated screens to spark ideas. The real design is still your job."
      ar: "استخدم الشاشات المولَّدة لتحصل على أفكار. والتصميم الحقيقي يبقى مهمّتك."

  - id: S08
    type: choose
    skill: SK-P13-U05-01
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. AI Design Tools Are Marginally Better (NN/g): narrow AI is more likely to meet a specific need and be understood by the people using it."
      ar: "حالة جديدة. أدوات التصميم بالذكاء الاصطناعي أفضل قليلًا (NN/g): الذكاء الاصطناعي المحدود أكثر قدرة على تلبية حاجة محدّدة وأن يفهمه من يستخدمه."
    ref: { url: "https://www.nngroup.com/articles/ai-design-tools-update-2/", quote: "It’s more likely to meet a specific user need and be understood by those using it." }
    scenario:
      en: "I'm the front-end developer on our photo app. I have a free afternoon and want AI to take some work off my plate."
      ar: "أنا مطوّر الواجهة الأمامية (Front-end) في تطبيق الصور. ولديّ وقت فراغ بعد الظهر، وأريد أن يخفّف الذكاء الاصطناعي عنّي بعض العمل."
    prompt:
      en: "Which job should I give it?"
      ar: "أي مهمة أعطيها للذكاء الاصطناعي؟"
    options:
      - { id: app, text: { en: "Build a whole new checkout from one sentence and ship it", ar: "بناء صفحة دفع جديدة كاملة من جملة واحدة وإطلاقها" } }
      - { id: nav, text: { en: "Decide how the app's menu should be organized", ar: "تحديد طريقة تنظيم قائمة التطبيق" } }
      - { id: names, text: { en: "Turn our 80 messy icon file names into one consistent naming style", ar: "تحويل أسماء ملفات الأيقونات الـ80 الفوضوية إلى أسلوب تسمية موحّد" } }
    answer: [names]
    misconceptions:
      - id: MC-P13-032
        when: [app]
        feedback:
          en: "Whole-product generators still miss a lot. A narrow, repetitive job is where AI is reliable."
          ar: "مولّدات المنتجات الكاملة لا يزال يفوتها الكثير. أما المهمة المحدودة المتكرّرة فيمكن الاعتماد فيها على الذكاء الاصطناعي."
      - id: MC-P13-006
        when: [nav]
        feedback:
          en: "Menu structure depends on how users think. That needs research, not a guess."
          ar: "تنظيم القائمة يعتمد على طريقة تفكير المستخدمين. وهذا يحتاج بحثًا، لا تخمينًا."
    correct:
      en: "Right. Narrow, boring, easy to check."
      ar: "صحيح. محدودة، ومملّة، وسهلة المراجعة."
    explain:
      en: "Pick AI jobs that are narrow and repetitive, so the result is easy to check."
      ar: "اختر للذكاء الاصطناعي مهامًا محدودة ومتكرّرة، حتى تكون نتيجتها سهلة المراجعة."

  - id: S09
    type: card
    part: recap
    icons: [layers, eye, warn, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Small jobs first:** renaming layers, not the whole feature.\n- **Repetitive work to AI:** placeholder text for 20 cards.\n- **Fix the emphasis:** the main action became the main thing.\n- **Clear beats shiny:** the plain wireframe was the better design.\n- **Ideas, not screens:** you kept the switch and designed the rest.\n- **Narrow and checkable:** consistent icon names.\n\nNext: better design prompts and realistic data."
      ar: "- **المهام الصغيرة أولًا:** إعادة تسمية الطبقات، لا الميزة كاملة.\n- **العمل المتكرّر للذكاء الاصطناعي:** نصوص مؤقتة لـ20 بطاقة.\n- **أصلح التركيز:** الفعل الأساسي أصبح الأبرز.\n- **الوضوح أهم من الشكل الأنيق:** المخطّط البسيط كان التصميم الأفضل.\n- **أفكار، لا شاشات:** احتفظت بالمفتاح وصمّمت الباقي.\n- **محدودة وقابلة للمراجعة:** أسماء أيقونات موحّدة.\n\nالتالي: طلبات تصميم أفضل وبيانات واقعية."
