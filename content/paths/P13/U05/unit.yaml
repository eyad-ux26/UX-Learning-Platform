id: P13-U05
free: false
title:
  en: "Design with AI, keep the judgment"
  ar: "صمّم بالذكاء الاصطناعي، واحتفظ بالحكم"
skill:
  en: "Give AI the small, tedious design jobs, treat generated screens as ideas, write specific design prompts, and feed prototypes realistic data."
  ar: "أعطِ الذكاء الاصطناعي مهام التصميم الصغيرة المملّة، وتعامل مع الشاشات التي يولّدها كأفكار، واكتب طلبات تصميم محدّدة، وضع في النماذج الأولية بيانات واقعية."
skills:
  - id: SK-P13-U05-01
    title: { en: "Give AI the small jobs", ar: "أعطِ الذكاء الاصطناعي المهام الصغيرة" }
    can_do: { en: "Use AI for narrow, repetitive design tasks, like renaming layers or drafting placeholder text, not for whole products.", ar: "استخدم الذكاء الاصطناعي في مهام التصميم المحدودة والمتكرّرة، مثل إعادة تسمية الطبقات أو كتابة نصوص مؤقتة، لا في منتجات كاملة." }
  - id: SK-P13-U05-02
    title: { en: "Treat AI screens as ideas", ar: "تعامل مع شاشات الذكاء الاصطناعي كأفكار" }
    can_do: { en: "Use generated layouts for ideas, spot clutter, repeats and wrong emphasis, and judge usability, not polish.", ar: "استخدم التصاميم المولَّدة كأفكار، واكتشف الزحام والتكرار والتركيز الخاطئ، واحكم على قابلية الاستخدام لا على اللمعان." }
  - id: SK-P13-U05-03
    title: { en: "Write specific design prompts", ar: "اكتب طلبات تصميم محدّدة" }
    can_do: { en: "Name a clear visual style, attach a simple reference, give real content, and don't ask AI to copy a famous brand.", ar: "سمِّ أسلوبًا بصريًا واضحًا، وأرفق مرجعًا بسيطًا، وأعطِ محتوى حقيقيًا، ولا تطلب من الذكاء الاصطناعي تقليد علامة تجارية مشهورة." }
  - id: SK-P13-U05-04
    title: { en: "Feed prototypes realistic data", ar: "ضع في النماذج الأولية بيانات واقعية" }
    can_do: { en: "Have AI make mock data that fits your users, formats and test tasks, without pasting sensitive real data into it.", ar: "اجعل الذكاء الاصطناعي يصنع بيانات تجريبية تناسب مستخدميك وصيغهم ومهام اختبارك، دون أن تلصق فيه بيانات حقيقية حسّاسة." }
