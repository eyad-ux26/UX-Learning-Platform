id: P13-U04-L01
mode: lesson
minutes: 7
title:
  en: "Plan with AI, watch for yourself"
  ar: "خطّط بالذكاء الاصطناعي، وراقب بنفسك"
summary:
  en: "Fix AI-drafted test tasks and documents for a food app, and decide what AI can't observe."
  ar: "أصلح مهام الاختبار ومستنداته التي كتبها الذكاء الاصطناعي لتطبيق طعام، وقرّر ما لا يستطيع الذكاء الاصطناعي ملاحظته."
speaker: tarek
sources:
  - title: { en: "Accelerating Research with AI (NN/g)", ar: "تسريع البحث بالذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/research-with-ai/"
  - title: { en: "AI-Powered Tools for UX Research (NN/g)", ar: "أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/"
review_labels:
  MC-P13-001: { en: "AI's first draft isn't finished work", ar: "مسوّدة الذكاء الاصطناعي الأولى ليست عملًا نهائيًا" }
  MC-P13-011: { en: "AI doesn't know your situation unless you tell it", ar: "الذكاء الاصطناعي لا يعرف موقفك إلا إذا أخبرته" }
  MC-P13-025: { en: "AI-written tasks can lead users to the answer", ar: "المهام التي يكتبها الذكاء الاصطناعي قد تقود المستخدمين إلى الإجابة" }
  MC-P13-026: { en: "AI can't see what users do", ar: "الذكاء الاصطناعي لا يرى ما يفعله المستخدمون" }
  MC-P13-027: { en: "What users say isn't always what they do", ar: "ما يقوله المستخدمون ليس دائمًا ما يفعلونه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "A study in a day", ar: "دراسة في يوم واحد" }
    body:
      en: "I'm the product manager of a food delivery app. Next week we test our new reorder feature with 6 customers.\n\nAI is helping me get ready: it drafted the test tasks and the consent form. And a tool says it can analyze all 6 sessions for us automatically."
      ar: "أنا مدير المنتج في تطبيق لتوصيل الطعام. والأسبوع القادم نختبر ميزة إعادة الطلب الجديدة مع 6 عملاء.\n\nوالذكاء الاصطناعي يساعدني في التحضير: فقد كتب مسوّدة مهام الاختبار ونموذج الموافقة (consent form). وأداة تقول إنها تستطيع تحليل الجلسات الست تلقائيًا بدلًا منا."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Reorder test · plan", ar: "اختبار إعادة الطلب · الخطة" } }
        - { kind: small, text: { en: "✓ Tasks (AI draft)", ar: "✓ المهام (مسوّدة الذكاء الاصطناعي)" }, gap: xs }
        - { kind: small, text: { en: "✓ Consent form (AI draft)", ar: "✓ نموذج الموافقة (مسوّدة الذكاء الاصطناعي)" }, gap: xs }
        - { kind: small, text: { en: "? Analysis: \"Auto-analyze sessions\"", ar: "؟ التحليل: «تحليل الجلسات تلقائيًا»" }, gap: xs }

  - id: S02
    type: choose
    skill: SK-P13-U04-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Accelerating Research with AI (NN/g): AI often writes test tasks that lead or prime users, even with good examples and clear guidance."
      ar: "جرّب أولًا. تسريع البحث بالذكاء الاصطناعي (NN/g): الذكاء الاصطناعي كثيرًا ما يكتب مهام اختبار توجّه المستخدمين أو تُلمّح لهم، حتى مع أمثلة جيدة وإرشادات واضحة."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "AI often writes tasks that can be leading or priming, even when you provide it with good examples or explicit guidance on dos and don’ts." }
    scenario:
      en: "Here is the AI's second task: \"Tap the new Reorder button on the home screen to order your last meal again.\""
      ar: "هذه هي المهمة الثانية التي كتبها الذكاء الاصطناعي: «اضغط على زر إعادة الطلب الجديد في الشاشة الرئيسية لتطلب وجبتك الأخيرة مرة أخرى.»"
    prompt:
      en: "What's wrong with this task?"
      ar: "ما المشكلة في هذه المهمة؟"
    options:
      - { id: short, text: { en: "It's too short", ar: "إنها قصيرة جدًا" } }
      - { id: leads, text: { en: "It names the button and says where it is, so we won't learn if people can find it", ar: "تذكر اسم الزر وتقول أين هو، فلن نعرف هل يستطيع الناس إيجاده" } }
      - { id: fine, text: { en: "Nothing. It's clear", ar: "لا شيء. إنها واضحة" } }
    answer: [leads]
    misconceptions:
      - id: MC-P13-025
        when: [short, fine]
        feedback:
          en: "It's clear, but it gives the answer away. A better task: \"You loved last Friday's meal. Get it again.\""
          ar: "إنها واضحة، لكنها تكشف الإجابة. مهمة أفضل: «أعجبتك وجبة الجمعة الماضية. اطلبها مرة أخرى.»"
    hints:
      - { en: "What are we trying to learn in this test?", ar: "ماذا نحاول أن نتعلّم في هذا الاختبار؟" }
      - { en: "Does the task tell people where to tap?", ar: "هل تخبر المهمة الناس أين يضغطون؟" }
    correct:
      en: "Right. The task gives the answer away."
      ar: "صحيح. المهمة تكشف الإجابة."
    explain:
      en: "AI tasks often name the button or the steps. Rewrite them as a goal in the user's words."
      ar: "مهام الذكاء الاصطناعي كثيرًا ما تذكر اسم الزر أو الخطوات. أعد كتابتها كهدف بكلمات المستخدم."

  - id: S03
    type: card
    part: concept
    icons: [list, eye, warn, ok]
    title: { en: "Where AI helps in research, and where it can't", ar: "أين يساعد الذكاء الاصطناعي في البحث، وأين لا يستطيع" }
    body:
      en: "**Planning: a big help.** AI drafts questions, test tasks and documents fast.\n- Watch for tasks that give the answer away.\n- Give it your own template for documents, then check what it filled in.\n- Ideally, an experienced researcher reviews the final list.\n\n**Usability tests: it can't watch.** AI tools work from words: transcripts and notes. But in a usability test, what people do matters more than what they say.\n- People say one thing and do another.\n- They don't mention every tap.\n- So watch the sessions or recordings yourself."
      ar: "**التخطيط: مساعدة كبيرة.** الذكاء الاصطناعي يكتب مسوّدات الأسئلة ومهام الاختبار والمستندات بسرعة.\n- انتبه للمهام التي تكشف الإجابة.\n- أعطِه قالبك الخاص للمستندات، ثم تحقّق ممّا ملأه.\n- والأفضل أن يراجع باحث متمرّس القائمة النهائية.\n\n**اختبارات قابلية الاستخدام: لا يستطيع المراقبة.** أدوات الذكاء الاصطناعي تعمل من الكلمات: النصوص المكتوبة والملاحظات. لكن في اختبار قابلية الاستخدام، ما يفعله الناس أهم ممّا يقولونه.\n- الناس يقولون شيئًا ويفعلون غيره.\n- ولا يذكرون كل ضغطة.\n- لذلك راقب الجلسات أو تسجيلاتها بنفسك."

  - id: S04
    type: choose
    skill: SK-P13-U04-01
    part: guided
    confidence: true
    rules: [R06]
    value:
      en: "Accelerating Research with AI (NN/g): watch for mistakes in how AI fills in documents; for example, double-check the data-collection permissions in a consent form."
      ar: "تسريع البحث بالذكاء الاصطناعي (NN/g): انتبه للأخطاء في طريقة ملء الذكاء الاصطناعي للمستندات؛ مثلًا، تحقّق مرة أخرى من أذونات جمع البيانات في نموذج الموافقة."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "For example, double-check that the correct data-collection permissions are outlined in your consent form." }
    scenario:
      en: "AI filled in our consent form template. We'll record each customer's screen and voice."
      ar: "ملأ الذكاء الاصطناعي قالب نموذج الموافقة عندنا. وسنسجّل شاشة كل عميل وصوته."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Consent form", ar: "نموذج الموافقة" } }
        - { kind: small, text: { en: "We will take written notes during the session. No recordings will be made.", ar: "سنكتب ملاحظات أثناء الجلسة. ولن يتم أي تسجيل." }, gap: xs }
        - { kind: small, text: { en: "Session length: 45 minutes. Gift: 200 EGP voucher.", ar: "مدة الجلسة: 45 دقيقة. الهدية: قسيمة بقيمة 200 جنيه." }, gap: xs }
    prompt:
      en: "What should I do before sending it?"
      ar: "ماذا أفعل قبل إرساله؟"
    options:
      - { id: send, text: { en: "Send it. It used our own template", ar: "أرسله. فقد استخدم قالبنا نحن" } }
      - { id: look, text: { en: "Fix the layout and the logo first", ar: "أصلح التنسيق والشعار أولًا" } }
      - { id: perm, text: { en: "Fix \"No recordings\", since we record screen and voice, and check every other detail", ar: "أصلح «لن يتم أي تسجيل»، لأننا نسجّل الشاشة والصوت، وأتحقّق من كل تفصيلة أخرى" } }
    answer: [perm]
    misconceptions:
      - id: MC-P13-001
        when: [send, look]
        feedback:
          en: "A template doesn't stop wrong details. This form tells customers we won't record them, but we will."
          ar: "القالب لا يمنع التفاصيل الخاطئة. فهذا النموذج يخبر العملاء أننا لن نسجّلهم، بينما سنفعل."
    hints:
      - { en: "Compare the form with what we'll actually do.", ar: "قارن النموذج بما سنفعله فعلًا." }
      - { en: "Which detail matters most to the customer's consent?", ar: "أي تفصيلة هي الأهم لموافقة العميل؟" }
    correct:
      en: "Right. Customers must agree to what really happens."
      ar: "صحيح. يجب أن يوافق العملاء على ما يحدث فعلًا."
    explain:
      en: "Check every detail AI fills in, most of all what you collect from people."
      ar: "تحقّق من كل تفصيلة يملؤها الذكاء الاصطناعي، وأهمّها ما تجمعه من الناس."

  - id: S05
    type: choose
    skill: SK-P13-U04-01
    part: guided
    rules: [R06]
    value:
      en: "Accelerating Research with AI (NN/g): when AI fills in research documents, give it a template as a starting point."
      ar: "تسريع البحث بالذكاء الاصطناعي (NN/g): حين يملأ الذكاء الاصطناعي مستندات البحث، أعطِه قالبًا كنقطة بداية."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "When asking AI tools to complete research-related documentation, provide them with a template as a starting point." }
    scenario:
      en: "Now I need a short screener: questions that pick the right 6 customers for the test."
      ar: "والآن أحتاج استبيان اختيار (screener) قصيرًا: أسئلة تختار العملاء الستة المناسبين للاختبار."
    prompt:
      en: "What's the best way to ask AI for it?"
      ar: "ما أفضل طريقة لأطلبه من الذكاء الاصطناعي؟"
    options:
      - { id: template, text: { en: "Give it our usual screener template, plus who we need: people who ordered at least twice last month", ar: "أعطيه قالب الاختيار المعتاد عندنا، مع من نحتاجهم: أشخاص طلبوا مرتين على الأقل الشهر الماضي" } }
      - { id: bare, text: { en: "\"Write a screener for a food app test.\"", ar: "«اكتب استبيان اختيار لاختبار تطبيق طعام.»" } }
      - { id: web, text: { en: "Ask it to copy a screener from the internet", ar: "أطلب منه أن ينسخ استبيان اختيار من الإنترنت" } }
    answer: [template]
    misconceptions:
      - id: MC-P13-011
        when: [bare, web]
        feedback:
          en: "Without your template and who you need, the AI will guess, and may pick the wrong people."
          ar: "دون قالبك ومن تحتاجهم، سيخمّن الذكاء الاصطناعي، وقد يختار الأشخاص الخطأ."
    hints:
      - { en: "What does the AI need to know to pick the right customers?", ar: "ماذا يحتاج الذكاء الاصطناعي أن يعرف ليختار العملاء المناسبين؟" }
    correct:
      en: "Right. Your template, your criteria."
      ar: "صحيح. قالبك، ومعاييرك."
    explain:
      en: "A good starting template helps AI avoid mistakes. Then you still check the result."
      ar: "القالب الجيد يساعد الذكاء الاصطناعي على تجنّب الأخطاء. ثم تتحقّق أنت من النتيجة."

  - id: S06
    type: compare
    skill: SK-P13-U04-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: a summary of what a user said vs notes on what they did. Accelerating Research with AI (NN/g): people often say one thing but do another, or do something without talking about it."
      ar: "مقارنة: ملخّص ما قاله المستخدم مقابل ملاحظات ما فعله. تسريع البحث بالذكاء الاصطناعي (NN/g): الناس كثيرًا ما يقولون شيئًا ويفعلون غيره، أو يفعلون شيئًا دون أن يتحدّثوا عنه."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "People often say one thing but do another — or do something but not talk about it." }
    scenario:
      en: "We ran a pilot session. Here are two write-ups of the same customer."
      ar: "أجرينا جلسة تجريبية. وهذان تقريران عن العميل نفسه."
    prompt:
      en: "Which one tells us more about the reorder feature?"
      ar: "أيّهما يخبرنا أكثر عن ميزة إعادة الطلب؟"
    a:
      label: { en: "A: made from the session transcript", ar: "A: مصنوع من النص المكتوب للجلسة" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Customer 1 found reordering easy. Quote: \"Oh, this is simple.\"", ar: "وجد العميل 1 إعادة الطلب سهلة. اقتباس: «آه، هذا بسيط.»" } }
    b:
      label: { en: "B: made from watching the screen recording", ar: "B: مصنوع من مشاهدة تسجيل الشاشة" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "Customer 1 said \"Oh, this is simple\", then opened Search, typed the restaurant's name and ordered from the menu. Never saw the Reorder button.", ar: "قال العميل 1 «آه، هذا بسيط»، ثم فتح البحث، وكتب اسم المطعم، وطلب من القائمة. ولم يرَ زر إعادة الطلب أبدًا." } }
    answer: b
    reason:
      prompt: { en: "Why does B tell us more?", ar: "لماذا تخبرنا B أكثر؟" }
      options:
        - { id: long, text: { en: "It's longer", ar: "إنها أطول" } }
        - { id: did, text: { en: "It shows what the customer did: he never used the feature at all", ar: "تُظهر ما فعله العميل: لم يستخدم الميزة أصلًا" } }
        - { id: quote, text: { en: "It has the same quote", ar: "فيها الاقتباس نفسه" } }
      answer: [did]
      misconceptions:
        - id: MC-P13-027
          when: [long, quote]
          feedback:
            en: "The key is the actions. The words say \"simple\", but he never found the Reorder button."
            ar: "المهم هو الأفعال. فالكلمات تقول «بسيط»، لكنه لم يجد زر إعادة الطلب أبدًا."
    misconceptions:
      - id: MC-P13-027
        when: [a]
        feedback:
          en: "A trusts his words. He said \"simple\" about search, while the feature we're testing went unseen."
          ar: "A تثق بكلماته. فقد قال «بسيط» عن البحث، بينما لم يرَ أحد الميزة التي نختبرها."
    hints:
      - { en: "Did the customer use the Reorder button?", ar: "هل استخدم العميل زر إعادة الطلب؟" }
    correct:
      en: "Right. The recording shows a problem the words hide."
      ar: "صحيح. التسجيل يُظهر مشكلة تُخفيها الكلمات."
    explain:
      en: "In usability tests, actions beat words. A transcript alone can tell the opposite story."
      ar: "في اختبارات قابلية الاستخدام، الأفعال أهم من الكلمات. والنص المكتوب وحده قد يروي القصة المعاكسة."

  - id: S07
    type: choose
    skill: SK-P13-U04-02
    part: guided
    rules: [R06]
    value:
      en: "AI-Powered Tools for UX Research (NN/g): never analyze usability tests based only on what participants say."
      ar: "أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g): لا تحلّل اختبارات قابلية الاستخدام أبدًا بناءً على ما يقوله المشاركون فقط."
    ref: { url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/", quote: "However, you should never analyze usability tests based only on what participants say!" }
    scenario:
      en: "The auto-analysis tool reads each session's transcript and writes the findings. It costs less than one researcher's day."
      ar: "أداة التحليل التلقائي تقرأ النص المكتوب لكل جلسة وتكتب النتائج. وتكلّف أقل من يوم عمل لباحث واحد."
    prompt:
      en: "How should we use it?"
      ar: "كيف نستخدمها؟"
    options:
      - { id: all, text: { en: "For all 6 sessions, so nobody has to watch them", ar: "للجلسات الست كلها، حتى لا يحتاج أحد أن يشاهدها" } }
      - { id: think, text: { en: "It's fine for usability tests, because customers think aloud", ar: "مناسبة لاختبارات قابلية الاستخدام، لأن العملاء يفكّرون بصوت عالٍ" } }
      - { id: watch, text: { en: "Use it as a backup summary, but we watch the 6 sessions ourselves", ar: "نستخدمها كملخّص احتياطي، لكننا نشاهد الجلسات الست بأنفسنا" } }
    answer: [watch]
    misconceptions:
      - id: MC-P13-026
        when: [all]
        feedback:
          en: "The tool reads words only. It can't see where customers tapped or got stuck."
          ar: "الأداة تقرأ الكلمات فقط. ولا تستطيع أن ترى أين ضغط العملاء أو أين تعثّروا."
      - id: MC-P13-027
        when: [think]
        feedback:
          en: "Thinking aloud helps, but people don't say every action, and sometimes say the opposite of what they do."
          ar: "التفكير بصوت عالٍ يساعد، لكن الناس لا يذكرون كل فعل، وأحيانًا يقولون عكس ما يفعلون."
    hints:
      - { en: "What did the pilot session show us?", ar: "ماذا أظهرت لنا الجلسة التجريبية؟" }
    correct:
      en: "Right. People watch; the tool only reads."
      ar: "صحيح. الناس يشاهدون، والأداة تقرأ فقط."
    explain:
      en: "Transcript tools can help with notes, but someone must watch what users actually do."
      ar: "أدوات النصوص المكتوبة تساعد في الملاحظات، لكن يجب أن يشاهد أحدٌ ما يفعله المستخدمون فعلًا."

  - id: S08
    type: choose
    skill: SK-P13-U04-02
    part: independent
    speaker: hana
    rules: [R14]
    value:
      en: "New case. Accelerating Research with AI (NN/g): in usability tests, AI notetakers miss important behavior because they can't see what users are doing."
      ar: "حالة جديدة. تسريع البحث بالذكاء الاصطناعي (NN/g): في اختبارات قابلية الاستخدام، يفوّت مدوّنو الملاحظات بالذكاء الاصطناعي سلوكًا مهمًا لأنهم لا يرون ما يفعله المستخدمون."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "If using a notetaker during usability testing, your notes will miss important behavioral observations because AI notetakers can't “see” what users are doing." }
    scenario:
      en: "I tested class booking in our gym app with 5 members, but I couldn't watch. An AI notetaker was on the calls. Its notes say: \"All members booked a class. No issues.\""
      ar: "اختبرت حجز الحصص في تطبيق النادي مع 5 أعضاء، لكنني لم أستطع المشاهدة. وكان مدوّن ملاحظات بالذكاء الاصطناعي في المكالمات. وملاحظاته تقول: «كل الأعضاء حجزوا حصة. لا مشكلات.»"
    prompt:
      en: "Can I say booking works well?"
      ar: "هل أستطيع أن أقول إن الحجز يعمل جيدًا؟"
    options:
      - { id: yes, text: { en: "Yes. The notes say there were no issues", ar: "نعم. فالملاحظات تقول إنه لا توجد مشكلات" } }
      - { id: watch, text: { en: "Not yet. I watch the recordings to see how they booked and where they hesitated", ar: "ليس بعد. أشاهد التسجيلات لأرى كيف حجزوا وأين تردّدوا" } }
      - { id: ask, text: { en: "Ask the notetaker for more detail on each member", ar: "أطلب من مدوّن الملاحظات تفاصيل أكثر عن كل عضو" } }
    answer: [watch]
    misconceptions:
      - id: MC-P13-026
        when: [yes, ask]
        feedback:
          en: "The notetaker only heard them. A member could take 5 tries and still say nothing."
          ar: "مدوّن الملاحظات سمعهم فقط. وقد يحاول عضو 5 مرات ولا يقول شيئًا."
    correct:
      en: "Right. Watch how they did it, not just that they did it."
      ar: "صحيح. شاهد كيف فعلوها، لا أنهم فعلوها فقط."
    explain:
      en: "AI notes cover what was said. For usability, watch what was done."
      ar: "ملاحظات الذكاء الاصطناعي تغطّي ما قيل. وفي قابلية الاستخدام، شاهد ما فُعل."

  - id: S09
    type: card
    part: recap
    icons: [list, eye, warn, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **A leading task:** you rewrote it as a goal, without the button's name.\n- **A wrong consent form:** \"No recordings\" was false, so you fixed it.\n- **A template first:** for the screener, with your criteria.\n- **Words vs actions:** \"This is simple\", but he never found the button.\n- **Watch the sessions:** a transcript tool can only read.\n- **Notes aren't observations:** watch the recordings.\n\nNext: analyzing data with AI."
      ar: "- **مهمة موجِّهة:** أعدت كتابتها كهدف، دون اسم الزر.\n- **نموذج موافقة خاطئ:** «لن يتم أي تسجيل» غير صحيحة، فأصلحتها.\n- **القالب أولًا:** لاستبيان الاختيار، مع معاييرك.\n- **الكلمات مقابل الأفعال:** «هذا بسيط»، لكنه لم يجد الزر أبدًا.\n- **شاهد الجلسات:** أداة النصوص تقرأ فقط.\n- **الملاحظات ليست مشاهدة:** شاهد التسجيلات.\n\nالتالي: تحليل البيانات بالذكاء الاصطناعي."
