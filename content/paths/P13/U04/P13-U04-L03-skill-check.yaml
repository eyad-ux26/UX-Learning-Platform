id: P13-U04-L03
mode: check
minutes: 5
title:
  en: "Skill check: research faster with AI"
  ar: "اختبار المهارة: ابحث أسرع بالذكاء الاصطناعي"
summary:
  en: "Use AI to plan, run and analyze a small study for an online shop, on your own."
  ar: "استخدم الذكاء الاصطناعي بنفسك لتخطّط دراسة صغيرة لمتجر إلكتروني وتجريها وتحلّلها."
speaker: youssef
sources:
  - title: { en: "Accelerating Research with AI (NN/g)", ar: "تسريع البحث بالذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/research-with-ai/"
  - title: { en: "AI-Powered Tools for UX Research (NN/g)", ar: "أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Youssef's shop study", ar: "دراسة متجر يوسف" }
    body:
      en: "I own an online electronics shop. Many people leave at checkout, and I want to know why. I'm testing checkout with 5 customers, with AI helping at every step.\n\nYour job: decide how to use AI at each step.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أملك متجرًا إلكترونيًا للأجهزة. وكثير من الناس يغادرون عند صفحة الدفع، وأريد أن أعرف السبب. فأختبر صفحة الدفع مع 5 عملاء، والذكاء الاصطناعي يساعدني في كل خطوة.\n\nمهمّتك: قرّر كيف تستخدم الذكاء الاصطناعي في كل خطوة.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Checkout test", ar: "اختبار صفحة الدفع" } }
        - { kind: meta, text: { en: "Plan · Test · Analyze", ar: "التخطيط · الاختبار · التحليل" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P13-U04-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Accelerating Research with AI (NN/g): AI often writes test tasks that lead or prime users."
      ar: "اختبار مهارة. تسريع البحث بالذكاء الاصطناعي (NN/g): الذكاء الاصطناعي كثيرًا ما يكتب مهام اختبار توجّه المستخدمين أو تُلمّح لهم."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "AI often writes tasks that can be leading or priming, even when you provide it with good examples or explicit guidance on dos and don’ts." }
    scenario:
      en: "AI wrote this task: \"Add the headphones to your cart, then use the blue Checkout button at the top right to pay with a card.\""
      ar: "كتب الذكاء الاصطناعي هذه المهمة: «أضف السمّاعات إلى السلة، ثم استخدم زر إتمام الشراء الأزرق في أعلى اليمين لتدفع بالبطاقة.»"
    prompt:
      en: "How should the task read instead?"
      ar: "كيف يجب أن تكون المهمة بدلًا من ذلك؟"
    options:
      - { id: same, text: { en: "Keep it. Clear steps help customers finish", ar: "أُبقيها. فالخطوات الواضحة تساعد العملاء على الإنهاء" } }
      - { id: shorter, text: { en: "\"Click Checkout and pay.\"", ar: "«اضغط إتمام الشراء وادفع.»" } }
      - { id: goal, text: { en: "\"You want these headphones as a gift. Buy them and have them sent to your home.\"", ar: "«تريد هذه السمّاعات كهدية. اشترِها واجعلها تُرسل إلى بيتك.»" } }
    answer: [goal]
    misconceptions:
      - id: MC-P13-025
        when: [same, shorter]
        feedback:
          en: "Naming the button tells customers where to go. Then we can't see if they'd find it alone."
          ar: "ذكر اسم الزر يخبر العملاء إلى أين يذهبون. فلا نستطيع أن نرى هل كانوا سيجدونه وحدهم."
    explain:
      en: "From Lesson 1: give a goal, not the steps or the button's name."
      ar: "من الدرس 1: أعطِ هدفًا، لا الخطوات ولا اسم الزر."

  - id: S03
    type: choose
    skill: SK-P13-U04-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. AI-Powered Tools for UX Research (NN/g): never analyze usability tests based only on what participants say."
      ar: "اختبار مهارة. أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g): لا تحلّل اختبارات قابلية الاستخدام أبدًا بناءً على ما يقوله المشاركون فقط."
    ref: { url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/", quote: "However, you should never analyze usability tests based only on what participants say!" }
    scenario:
      en: "The sessions are done. An AI tool read the 5 transcripts and wrote: \"Checkout is smooth. Customers called it 'easy' and 'fast'.\""
      ar: "انتهت الجلسات. وقرأت أداة ذكاء اصطناعي النصوص الخمسة وكتبت: «صفحة الدفع سلسة. وصفها العملاء بأنها \"سهلة\" و\"سريعة\".»"
    prompt:
      en: "What should I do with this finding?"
      ar: "ماذا أفعل بهذه النتيجة؟"
    options:
      - { id: watch, text: { en: "Watch the screen recordings to see what customers actually did before I trust it", ar: "أشاهد تسجيلات الشاشة لأرى ما فعله العملاء فعلًا قبل أن أثق بها" } }
      - { id: trust, text: { en: "Trust it. Five customers said it was easy", ar: "أثق بها. فخمسة عملاء قالوا إنها سهلة" } }
      - { id: rerun, text: { en: "Run the AI tool again on the same transcripts", ar: "أشغّل أداة الذكاء الاصطناعي مرة أخرى على النصوص نفسها" } }
    answer: [watch]
    misconceptions:
      - id: MC-P13-027
        when: [trust]
        feedback:
          en: "People often call something easy after struggling with it. And many still leave at checkout."
          ar: "الناس كثيرًا ما يصفون شيئًا بأنه سهل بعد أن يتعثّروا فيه. وما زال كثيرون يغادرون عند صفحة الدفع."
      - id: MC-P13-026
        when: [rerun]
        feedback:
          en: "The tool still reads only words. It can't see the taps, pauses and wrong turns."
          ar: "الأداة ما زالت تقرأ الكلمات فقط. ولا ترى الضغطات والتوقّفات والطرق الخاطئة."
    explain:
      en: "From Lesson 1: in usability tests, watch what people do, not just what they say."
      ar: "من الدرس 1: في اختبارات قابلية الاستخدام، راقب ما يفعله الناس، لا ما يقولونه فقط."

  - id: S04
    type: choose
    skill: SK-P13-U04-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Accelerating Research with AI (NN/g): review any suggested codes or groupings, because AI can misunderstand meaning and tag data incorrectly."
      ar: "اختبار مهارة. تسريع البحث بالذكاء الاصطناعي (NN/g): راجع أي تصنيفات أو مجموعات مقترحة، لأن الذكاء الاصطناعي قد يُسيء فهم المعنى ويصنّف البيانات خطأ."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "Review any suggested codes or groupings because AI can sometimes misunderstand the meaning and can organize or tag data incorrectly." }
    scenario:
      en: "I also have 300 reviews from people who left at checkout. AI grouped them: \"Price\", \"Delivery\", \"Other\". Under \"Delivery\" are both \"delivery fee is too high\" and \"no delivery to my city\"."
      ar: "لديّ أيضًا 300 تقييم من أشخاص غادروا عند صفحة الدفع. وجمّعها الذكاء الاصطناعي في: «السعر»، و«التوصيل»، و«أخرى». وتحت «التوصيل» يوجد «رسوم التوصيل مرتفعة جدًا» و«لا يوجد توصيل إلى مدينتي» معًا."
    prompt:
      en: "What should I do with these groups?"
      ar: "ماذا أفعل بهذه المجموعات؟"
    options:
      - { id: use, text: { en: "Report them: delivery is our second-biggest problem", ar: "أقدّمها كنتيجة: التوصيل مشكلتنا الثانية الأكبر" } }
      - { id: review, text: { en: "Review and split them: a fee problem and a coverage problem need different fixes", ar: "أراجعها وأقسّمها: مشكلة الرسوم ومشكلة التغطية تحتاجان حلولًا مختلفة" } }
      - { id: ask, text: { en: "Ask the AI to make fewer groups", ar: "أطلب من الذكاء الاصطناعي أن يصنع مجموعات أقل" } }
    answer: [review]
    misconceptions:
      - id: MC-P13-028
        when: [use, ask]
        feedback:
          en: "The AI grouped by the word \"delivery\". The real problems are different and need different fixes."
          ar: "جمّع الذكاء الاصطناعي حسب كلمة «التوصيل». والمشكلات الحقيقية مختلفة وتحتاج حلولًا مختلفة."
    explain:
      en: "From Lesson 2: AI groups by shared words. Check what each group really means."
      ar: "من الدرس 2: الذكاء الاصطناعي يجمّع حسب الكلمات المشتركة. تحقّق ممّا تعنيه كل مجموعة فعلًا."

  - id: S05
    type: choose
    skill: SK-P13-U04-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Accelerating Research with AI (NN/g): AI transcription has higher error rates for some languages or accents."
      ar: "اختبار مهارة. تسريع البحث بالذكاء الاصطناعي (NN/g): نسخ الكلام بالذكاء الاصطناعي تزيد أخطاؤه في بعض اللغات أو اللكنات."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "Higher error rates for some languages or accents" }
    scenario:
      en: "One customer from Upper Egypt spoke in a strong local dialect. Her AI transcript has strange words in it, and I want to quote her in my report."
      ar: "تحدّثت عميلة من صعيد مصر بلهجة محلية قوية. ونصّها المكتوب بالذكاء الاصطناعي فيه كلمات غريبة، وأريد أن أقتبس كلامها في تقريري."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    options:
      - { id: check, text: { en: "Listen to the recording and fix her quotes before using them", ar: "أستمع إلى التسجيل وأصلح اقتباساتها قبل أن أستخدمها" } }
      - { id: skip, text: { en: "Leave her out of the report", ar: "أستبعدها من التقرير" } }
      - { id: asis, text: { en: "Quote the transcript as it is", ar: "أقتبس النص كما هو" } }
    answer: [check]
    misconceptions:
      - id: MC-P13-030
        when: [asis]
        feedback:
          en: "Transcripts are weaker with strong dialects. You could quote words she never said."
          ar: "النصوص أضعف مع اللهجات القوية. وقد تقتبس كلمات لم تقلها أبدًا."
      - id: MC-P13-008
        when: [skip]
        feedback:
          en: "Her view matters, and voices like hers are easy to lose. Fix the transcript instead."
          ar: "رأيها مهمّ، وأصوات مثل صوتها يسهل أن تضيع. أصلح النص بدلًا من ذلك."
    explain:
      en: "From Lesson 2: check AI transcripts against the recording, especially with dialects."
      ar: "من الدرس 2: قارن نصوص الذكاء الاصطناعي بالتسجيل، خاصة مع اللهجات."
