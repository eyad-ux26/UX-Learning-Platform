id: P13-U04
free: false
title:
  en: "Research faster with AI"
  ar: "ابحث أسرع بالذكاء الاصطناعي"
skill:
  en: "Use AI to plan studies and speed up analysis, while you review its drafts, watch what users do, and check its themes, transcripts and cleaned data."
  ar: "استخدم الذكاء الاصطناعي لتخطيط الدراسات وتسريع التحليل، على أن تراجع أنت مسوّداته، وتراقب ما يفعله المستخدمون، وتتحقّق من مجموعاته ونصوصه وبياناته المنظّفة."
skills:
  - id: SK-P13-U04-01
    title: { en: "Plan studies with AI, then review", ar: "خطّط الدراسات بالذكاء الاصطناعي، ثم راجع" }
    can_do: { en: "Let AI draft tasks, questions and study documents from your template, then fix leading wording and filled-in mistakes.", ar: "دع الذكاء الاصطناعي يكتب مسوّدات المهام والأسئلة ومستندات الدراسة من قالبك، ثم أصلح الصياغة الموجِّهة والأخطاء في البيانات المملوءة." }
  - id: SK-P13-U04-02
    title: { en: "Watch what users do", ar: "راقب ما يفعله المستخدمون" }
    can_do: { en: "Don't let AI analyze usability tests from transcripts or notes alone; it can't see what users do.", ar: "لا تدع الذكاء الاصطناعي يحلّل اختبارات قابلية الاستخدام من النصوص أو الملاحظات وحدها؛ فهو لا يرى ما يفعله المستخدمون." }
  - id: SK-P13-U04-03
    title: { en: "Treat AI themes as a first pass", ar: "تعامل مع مجموعات الذكاء الاصطناعي (Themes) كخطوة أولى" }
    can_do: { en: "Use AI groupings and summaries to start analysis, then review them against the data and its context.", ar: "استخدم تجميعات الذكاء الاصطناعي وملخّصاته لتبدأ التحليل، ثم راجعها على البيانات وسياقها." }
  - id: SK-P13-U04-04
    title: { en: "Spot-check transcripts and cleaned data", ar: "افحص عيّنات من النصوص والبيانات المنظّفة" }
    can_do: { en: "Check AI transcripts, translations and removed personal data against the original, especially for Arabic dialects and quotes you'll use.", ar: "قارن نصوص الذكاء الاصطناعي وترجماته والبيانات الشخصية المحذوفة بالأصل، خاصة في اللهجات العربية والاقتباسات التي ستستخدمها." }
