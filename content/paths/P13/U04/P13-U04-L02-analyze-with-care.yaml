id: P13-U04-L02
mode: lesson
minutes: 7
title:
  en: "Let AI start the analysis"
  ar: "دع الذكاء الاصطناعي يبدأ التحليل"
summary:
  en: "Review AI themes, summaries, transcripts and cleaned data from 12 bill-app interviews."
  ar: "راجع مجموعات الذكاء الاصطناعي وملخّصاته ونصوصه وبياناته المنظّفة من 12 مقابلة لتطبيق فواتير."
speaker: mona
sources:
  - title: { en: "Accelerating Research with AI (NN/g)", ar: "تسريع البحث بالذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/research-with-ai/"
  - title: { en: "AI-Powered Tools for UX Research (NN/g)", ar: "أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g)" }
    url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/"
review_labels:
  MC-P13-002: { en: "AI makes mistakes, but that's no reason to avoid it", ar: "الذكاء الاصطناعي يخطئ، لكن هذا ليس سببًا لتجنّبه" }
  MC-P13-028: { en: "AI themes are a first pass, not findings", ar: "مجموعات الذكاء الاصطناعي خطوة أولى، لا نتائج" }
  MC-P13-029: { en: "A vague AI insight isn't a finding", ar: "الاستنتاج الغامض من الذكاء الاصطناعي ليس نتيجة" }
  MC-P13-030: { en: "AI transcripts and translations make mistakes", ar: "نصوص الذكاء الاصطناعي وترجماته فيها أخطاء" }
  MC-P13-031: { en: "Auto-cleaned data can lose or keep the wrong things", ar: "البيانات المنظّفة تلقائيًا قد تفقد أشياء أو تُبقي أشياء خطأ" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "A report in 20 minutes", ar: "تقرير في 20 دقيقة" }
    body:
      en: "I lead design on a bill-payment app. We interviewed 12 customers, in Egyptian Arabic, about how they pay their bills.\n\nAn AI research tool did the rest: it wrote transcripts, translated them, removed personal details and grouped the quotes into themes. The full report took 20 minutes."
      ar: "أقود التصميم في تطبيق لدفع الفواتير. وأجرينا مقابلات مع 12 عميلًا، باللهجة المصرية، عن طريقة دفعهم لفواتيرهم.\n\nوقامت أداة بحث بالذكاء الاصطناعي بالباقي: كتبت النصوص، وترجمتها، وحذفت البيانات الشخصية، وجمعت الاقتباسات في مجموعات (themes). واستغرق التقرير كاملًا 20 دقيقة."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Themes (AI)", ar: "المجموعات (الذكاء الاصطناعي)" } }
        - { kind: small, text: { en: "Ease of use · 23%", ar: "سهولة الاستخدام · 23%" }, gap: xs }
        - { kind: small, text: { en: "Payments · 36%", ar: "المدفوعات · 36%" }, gap: xs }
        - { kind: small, text: { en: "Other · 41%", ar: "أخرى · 41%" }, gap: xs }

  - id: S02
    type: choose
    skill: SK-P13-U04-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Accelerating Research with AI (NN/g): AI-generated clusters are rarely perfect, especially when the notes aren't clear at first glance."
      ar: "جرّب أولًا. تسريع البحث بالذكاء الاصطناعي (NN/g): المجموعات التي يصنعها الذكاء الاصطناعي نادرًا ما تكون مثالية، خاصة حين لا تكون الملاحظات واضحة من النظرة الأولى."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "AI-generated clusters are rarely perfect, especially if the content of the stickies is not obvious at first glance." }
    prompt:
      en: "What do these themes tell us?"
      ar: "ماذا تخبرنا هذه المجموعات؟"
    options:
      - { id: done, text: { en: "Our two main findings: ease of use and payments", ar: "نتيجتانا الرئيسيتان: سهولة الاستخدام والمدفوعات" } }
      - { id: first, text: { en: "A rough first pass. With 41% in \"Other\", we need to read the data and group it ourselves", ar: "خطوة أولى تقريبية. فمع 41% في «أخرى»، نحتاج أن نقرأ البيانات ونجمّعها بأنفسنا" } }
      - { id: nothing, text: { en: "Nothing. AI analysis is useless", ar: "لا شيء. فتحليل الذكاء الاصطناعي بلا فائدة" } }
    answer: [first]
    misconceptions:
      - id: MC-P13-028
        when: [done]
        feedback:
          en: "\"Ease of use\" and \"Payments\" are broad labels, and almost half the data didn't fit anywhere. That's a start, not findings."
          ar: "«سهولة الاستخدام» و«المدفوعات» عناوين واسعة، وقرابة نصف البيانات لم تدخل في أي مجموعة. هذه بداية، لا نتائج."
      - id: MC-P13-002
        when: [nothing]
        feedback:
          en: "It saved time on a first sort. Now people need to finish the job."
          ar: "لقد وفّر الوقت في الفرز الأول. والآن يحتاج الناس أن يُكملوا العمل."
    hints:
      - { en: "How much of the data landed in \"Other\"?", ar: "كم من البيانات وقع في «أخرى»؟" }
      - { en: "Do the two labels say what the problem is?", ar: "هل يقول العنوانان ما المشكلة؟" }
    correct:
      en: "Right. A head start, not the answer."
      ar: "صحيح. بداية سريعة، لا الإجابة."
    explain:
      en: "AI groups help you start. You still read the data and decide what the themes really are."
      ar: "تجميعات الذكاء الاصطناعي تساعدك على البدء. وما زلت تقرأ البيانات وتقرّر ما المجموعات فعلًا."

  - id: S03
    type: card
    part: concept
    icons: [list, search, warn, ok]
    title: { en: "AI starts the analysis, you finish it", ar: "الذكاء الاصطناعي يبدأ التحليل، وأنت تُنهيه" }
    body:
      en: "AI speeds up the first steps: transcripts, summaries, first groupings and removing personal details. But:\n\n- **Themes are rough.** AI often groups by shared words, misses things, and can even make up insights.\n- **Summaries can be vague.** \"Make it easier\" isn't a finding.\n- **Context needs you.** Was the person led by the question? Did they mean the opposite?\n- **Transcripts and translations make mistakes,** more so with dialects, accents and several speakers.\n- **Cleaning tools make mistakes,** too: they can remove useful details or miss private ones.\n\nCheck samples against the original, always."
      ar: "الذكاء الاصطناعي يسرّع الخطوات الأولى: النصوص، والملخّصات، والتجميع الأول، وحذف البيانات الشخصية. لكن:\n\n- **المجموعات تقريبية.** الذكاء الاصطناعي كثيرًا ما يجمّع حسب الكلمات المشتركة، ويفوّت أشياء، وقد يختلق استنتاجات.\n- **الملخّصات قد تكون غامضة.** «اجعلها أسهل» ليست نتيجة.\n- **السياق يحتاجك.** هل قاد السؤالُ الشخصَ إلى إجابته؟ هل كان يقصد العكس؟\n- **النصوص والترجمات فيها أخطاء،** وأكثر مع اللهجات واللكنات وتعدّد المتحدّثين.\n- **أدوات التنظيف تخطئ أيضًا:** قد تحذف تفاصيل مفيدة أو تُبقي بيانات خاصة.\n\nقارن عيّنات بالأصل، دائمًا."

  - id: S04
    type: choose
    skill: SK-P13-U04-03
    part: guided
    confidence: true
    rules: [R06]
    value:
      en: "AI-Powered Tools for UX Research (NN/g): AI tools often gave extremely vague summaries and recommendations."
      ar: "أدوات الذكاء الاصطناعي لبحث تجربة المستخدم (NN/g): أدوات الذكاء الاصطناعي كثيرًا ما أعطت ملخّصات وتوصيات غامضة جدًا."
    ref: { url: "https://www.nngroup.com/articles/ai-powered-tools-limitations/", quote: "The AI tools often gave extremely vague summaries and recommendations." }
    scenario:
      en: "The AI's top recommendation is: \"Make the payment process easier and clearer for users.\""
      ar: "التوصية الأولى من الذكاء الاصطناعي هي: «اجعل عملية الدفع أسهل وأوضح للمستخدمين.»"
    prompt:
      en: "Can the team act on this?"
      ar: "هل يستطيع الفريق التصرّف بناءً على هذا؟"
    options:
      - { id: vague, text: { en: "Not really. It doesn't say what's hard, where, or for whom. We need specifics from the interviews", ar: "ليس فعلًا. لا تقول ما الصعب، ولا أين، ولا لمن. نحتاج تفاصيل من المقابلات" } }
      - { id: yes, text: { en: "Yes. It's the top recommendation", ar: "نعم. إنها التوصية الأولى" } }
      - { id: more, text: { en: "Yes, once we ask the AI to make it sound more confident", ar: "نعم، بعد أن نطلب من الذكاء الاصطناعي أن يجعلها تبدو أكثر ثقة" } }
    answer: [vague]
    misconceptions:
      - id: MC-P13-029
        when: [yes, more]
        feedback:
          en: "\"Easier and clearer\" fits any product. A real finding names the problem, like: \"6 of 12 couldn't find where to enter the meter number.\""
          ar: "«أسهل وأوضح» تناسب أي منتج. والنتيجة الحقيقية تسمّي المشكلة، مثل: «6 من 12 لم يجدوا أين يُدخلون رقم العدّاد.»"
    hints:
      - { en: "Would a designer know what to change tomorrow?", ar: "هل سيعرف المصمم ماذا يغيّر غدًا؟" }
      - { en: "Could this sentence be about any app?", ar: "هل يمكن أن تكون هذه الجملة عن أي تطبيق؟" }
    correct:
      en: "Right. Vague advice fits every app, so it helps none."
      ar: "صحيح. النصيحة الغامضة تناسب كل التطبيقات، فلا تساعد أيًّا منها."
    explain:
      en: "A useful finding says what went wrong, where, and how often. Go back to the data for that."
      ar: "النتيجة المفيدة تقول ما الذي حدث خطأ، وأين، وكم مرة. فارجع إلى البيانات لتعرف ذلك."

  - id: S05
    type: choose
    skill: SK-P13-U04-03
    part: guided
    rules: [R06]
    value:
      en: "Accelerating Research with AI (NN/g): for thematic analysis, a human perspective is needed to connect the dots, for example, asking if the interviewer primed the participant."
      ar: "تسريع البحث بالذكاء الاصطناعي (NN/g): في تحليل المجموعات (Thematic analysis)، نحتاج نظرة بشرية لتربط النقاط، مثل أن تسأل هل وجّه المُحاوِر المشارك إلى إجابته."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "For thematic analysis, a human perspective is needed to connect the dots in ways AI (currently) can’t." }
    scenario:
      en: "The AI counted this as a strong positive: \"Yes, autopay is great.\" In the transcript, the interviewer had just said: \"Autopay is our favorite feature. Don't you love it?\""
      ar: "اعتبر الذكاء الاصطناعي هذا رأيًا إيجابيًا قويًا: «أيوه، الدفع التلقائي حلو.» وفي النص، كان المُحاوِر قد قال قبلها مباشرة: «الدفع التلقائي ميزتنا المفضّلة. ألا تحبّه؟»"
    prompt:
      en: "How should we treat that quote?"
      ar: "كيف نتعامل مع هذا الاقتباس؟"
    options:
      - { id: count, text: { en: "Count it as positive, like the AI did", ar: "نعتبره إيجابيًا، كما فعل الذكاء الاصطناعي" } }
      - { id: delete, text: { en: "Delete the whole interview", ar: "نحذف المقابلة كلها" } }
      - { id: weigh, text: { en: "Mark it as led by the question and give it less weight", ar: "نعلّمه كإجابة وجّهها السؤال، ونعطيه وزنًا أقل" } }
    answer: [weigh]
    misconceptions:
      - id: MC-P13-028
        when: [count]
        feedback:
          en: "The AI saw positive words. It missed that the question pushed the customer to agree."
          ar: "رأى الذكاء الاصطناعي كلمات إيجابية. وفاته أن السؤال دفع العميل إلى الموافقة."
      - id: MC-P13-002
        when: [delete]
        feedback:
          en: "The rest of the interview may be fine. Just weigh this answer for what it is."
          ar: "بقية المقابلة قد تكون سليمة. فقط أعطِ هذه الإجابة وزنها الحقيقي."
    hints:
      - { en: "What came right before the customer's answer?", ar: "ماذا جاء قبل إجابة العميل مباشرة؟" }
    correct:
      en: "Right. Context changes what a quote means."
      ar: "صحيح. السياق يغيّر معنى الاقتباس."
    explain:
      en: "AI reads the words. You judge how they were collected and what they mean."
      ar: "الذكاء الاصطناعي يقرأ الكلمات. وأنت تحكم كيف جُمعت وماذا تعني."

  - id: S06
    type: compare
    skill: SK-P13-U04-04
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: two cleaning results. Accelerating Research with AI (NN/g): cleaning tools make mistakes; one removed the names of tools a participant was reviewing, thinking it was protecting their privacy."
      ar: "مقارنة: نتيجتا تنظيف. تسريع البحث بالذكاء الاصطناعي (NN/g): أدوات التنظيف تخطئ؛ فإحداها حذفت أسماء الأدوات التي كان المشارك يقيّمها، ظنًّا أنها تحمي خصوصيته."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "The system mistakenly thought it was protecting the participant’s privacy by removing the name of the company they worked for, but in reality, it removed information about which tool the participant was reviewing." }
    scenario:
      en: "We need to remove customers' personal details before sharing transcripts. We tried the tool with two settings on the same line."
      ar: "نحتاج أن نحذف البيانات الشخصية للعملاء قبل مشاركة النصوص. فجرّبنا الأداة بإعدادين على السطر نفسه."
    prompt:
      en: "Which result can we share with the team?"
      ar: "أي نتيجة نستطيع مشاركتها مع الفريق؟"
    a:
      label: { en: "A: cleaning setting 1", ar: "A: إعداد التنظيف 1" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "\"I'm [REMOVED], I left [REMOVED] for you because [REMOVED] charged me twice. Call me on [REMOVED].\"", ar: "«أنا [محذوف]، سبت [محذوف] وجيت لكم لأن [محذوف] خصم مني مرتين. كلّمني على [محذوف].»" } }
    b:
      label: { en: "B: cleaning setting 2", ar: "B: إعداد التنظيف 2" }
      mock:
        width: 300
        blocks:
          - { kind: small, text: { en: "\"I'm [NAME], I left QuickBill for you because QuickBill charged me twice. Call me on [PHONE].\"", ar: "«أنا [الاسم]، سبت QuickBill وجيت لكم لأن QuickBill خصم مني مرتين. كلّمني على [الهاتف].»" } }
    answer: b
    reason:
      prompt: { en: "Why is B the one to share?", ar: "لماذا B هي التي نشاركها؟" }
      options:
        - { id: tags, text: { en: "Its tags look nicer", ar: "علاماتها تبدو أجمل" } }
        - { id: right, text: { en: "It removes the person's name and phone, but keeps the app they switched from, which the study needs", ar: "تحذف اسم الشخص وهاتفه، لكنها تُبقي التطبيق الذي انتقل منه، وهذا ما تحتاجه الدراسة" } }
        - { id: less, text: { en: "It removes less, and less is always better", ar: "تحذف أقل، والأقل أفضل دائمًا" } }
      answer: [right]
      misconceptions:
        - id: MC-P13-031
          when: [tags, less]
          feedback:
            en: "The point is what was removed. Private details go; useful research details stay."
            ar: "المهم هو ما حُذف. البيانات الخاصة تُحذف، وتفاصيل البحث المفيدة تبقى."
    misconceptions:
      - id: MC-P13-031
        when: [a]
        feedback:
          en: "A is private, but useless: we lost which app the customer left and why."
          ar: "A خاصة، لكنها بلا فائدة: فقدنا التطبيق الذي تركه العميل وسبب تركه."
    hints:
      - { en: "In each line, what was removed besides the name and phone?", ar: "في كل سطر، ما الذي حُذف غير الاسم والهاتف؟" }
    correct:
      en: "Right. Safe and still useful."
      ar: "صحيح. آمنة ومفيدة في الوقت نفسه."
    explain:
      en: "Check what a cleaning tool removed and what it kept. It can get both wrong."
      ar: "تحقّق ممّا حذفته أداة التنظيف وممّا أبقته. فقد تخطئ في الاثنين."

  - id: S07
    type: choose
    skill: SK-P13-U04-04
    part: guided
    rules: [R06]
    value:
      en: "Accelerating Research with AI (NN/g): double-check transcriptions; AI makes mistakes, especially with several speakers and poor audio."
      ar: "تسريع البحث بالذكاء الاصطناعي (NN/g): تحقّق من النصوص المكتوبة مرة أخرى؛ فالذكاء الاصطناعي يخطئ، خاصة مع تعدّد المتحدّثين وضعف جودة الصوت."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "Double-check transcriptions: AI-powered transcription can make mistakes, especially when there are multiple speakers and poor-quality audio." }
    scenario:
      en: "I want to quote a customer in our report. The AI's English translation says: \"Paying the bill in the app is very heavy.\" In Egyptian Arabic, «تقيل» here means slow and annoying."
      ar: "أريد أن أقتبس كلام عميل في تقريرنا. وترجمة الذكاء الاصطناعي الإنجليزية تقول: «Paying the bill in the app is very heavy.» وكلمة «تقيل» هنا باللهجة المصرية تعني بطيئًا ومزعجًا."
    prompt:
      en: "What should I do with the AI's transcripts and translations?"
      ar: "ماذا أفعل بنصوص الذكاء الاصطناعي وترجماته؟"
    options:
      - { id: fix, text: { en: "Fix this line, then check every quote I use against the recording", ar: "أصلح هذا السطر، ثم أقارن كل اقتباس أستخدمه بالتسجيل" } }
      - { id: one, text: { en: "Fix this one line and use the rest as they are", ar: "أصلح هذا السطر وحده وأستخدم الباقي كما هو" } }
      - { id: drop, text: { en: "Stop using AI transcripts and type all 12 by hand", ar: "أتوقّف عن استخدام نصوص الذكاء الاصطناعي وأكتب الـ12 كلها يدويًا" } }
    answer: [fix]
    misconceptions:
      - id: MC-P13-030
        when: [one]
        feedback:
          en: "If it missed one dialect word, it missed others. Check every quote before you use it."
          ar: "إذا فاتته كلمة واحدة من اللهجة، ففاتته غيرها. تحقّق من كل اقتباس قبل أن تستخدمه."
      - id: MC-P13-002
        when: [drop]
        feedback:
          en: "The transcripts still save hours. Check the parts you rely on instead."
          ar: "النصوص ما زالت توفّر ساعات. تحقّق من الأجزاء التي تعتمد عليها بدلًا من ذلك."
    hints:
      - { en: "Is one wrong word likely to be the only one?", ar: "هل يُرجَّح أن تكون الكلمة الخاطئة الوحيدة؟" }
    correct:
      en: "Right. Check against the recording before you quote."
      ar: "صحيح. قارن بالتسجيل قبل أن تقتبس."
    explain:
      en: "AI transcripts and translations are weaker with dialects. Check the quotes that matter."
      ar: "نصوص الذكاء الاصطناعي وترجماته أضعف مع اللهجات. تحقّق من الاقتباسات المهمّة."

  - id: S08
    type: choose
    skill: SK-P13-U04-03
    part: independent
    speaker: rami
    rules: [R14]
    value:
      en: "New case. Accelerating Research with AI (NN/g): never rely on AI for all your analysis; it might miss, misinterpret or even make up insights."
      ar: "حالة جديدة. تسريع البحث بالذكاء الاصطناعي (NN/g): لا تعتمد على الذكاء الاصطناعي في كل تحليلك؛ فقد يفوّت استنتاجات، أو يُسيء فهمها، أو حتى يختلقها."
    ref: { url: "https://www.nngroup.com/articles/research-with-ai/", quote: "It might miss, misinterpret, or even manufacture insights." }
    scenario:
      en: "The AI summary of 8 rider interviews says: \"Riders want live bus times\", with 3 quotes. I searched the transcripts, and one of the quotes isn't in any of them."
      ar: "ملخّص الذكاء الاصطناعي لـ8 مقابلات مع الركّاب يقول: «الركّاب يريدون مواعيد الحافلات المباشرة»، مع 3 اقتباسات. وبحثت في النصوص، فلم أجد أحد الاقتباسات في أي منها."
    prompt:
      en: "What should I do with the summary?"
      ar: "ماذا أفعل بالملخّص؟"
    options:
