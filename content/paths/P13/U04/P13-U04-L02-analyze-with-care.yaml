      en: "- **Rough themes:** 41% in \"Other\" meant reading the data yourself.\n- **Vague advice:** \"easier and clearer\" fits any app, so you went back for specifics.\n- **Context:** a led answer gets less weight.\n- **Smart cleaning:** remove the person's details, keep the research details.\n- **Dialect check:** «تقيل» isn't \"heavy\", so check quotes against the recording.\n- **A made-up quote:** check every insight before sharing.\n\nNext: a skill check on this unit."
