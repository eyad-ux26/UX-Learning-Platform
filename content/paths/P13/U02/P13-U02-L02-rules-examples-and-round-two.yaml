id: P13-U02-L02
mode: lesson
minutes: 7
title:
  en: "Rules, examples and round two"
  ar: "القواعد، والأمثلة، والجولة الثانية"
summary:
  en: "Add rules and examples to a shop's prompt, then check and improve what the AI returns."
  ar: "أضف قواعد وأمثلة إلى طلب لمتجر إلكتروني، ثم راجع ما يعيده الذكاء الاصطناعي وحسّنه."
speaker: youssef
sources:
  - title: { en: "CARE: Structure for Crafting AI Prompts (NN/g)", ar: "CARE: بنية لكتابة طلبات الذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/careful-prompts/"
review_labels:
  MC-P13-001: { en: "AI's first draft isn't finished work", ar: "مسوّدة الذكاء الاصطناعي الأولى ليست عملًا نهائيًا" }
  MC-P13-013: { en: "AI can't guess your limits and guidelines", ar: "الذكاء الاصطناعي لا يستطيع تخمين حدودك وإرشاداتك" }
  MC-P13-014: { en: "Examples show the AI what you mean", ar: "الأمثلة تُري الذكاء الاصطناعي ما تقصده" }
  MC-P13-015: { en: "Check that the AI followed every instruction", ar: "تحقّق أن الذكاء الاصطناعي نفّذ كل تعليمة" }
  MC-P13-016: { en: "A longer prompt isn't better by itself", ar: "الطلب الأطول ليس أفضل في حدّ ذاته" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Good context, wrong style", ar: "سياق جيد، وأسلوب خاطئ" }
    body:
      en: "I design an online electronics shop. When a product sells out, we show a short message on its page.\n\nMy prompt had context and a clear ask: 5 messages for a sold-out phone. The AI got the situation right, but wrote jokes, and the messages are too long for the space."
      ar: "أصمّم متجرًا إلكترونيًا للأجهزة. وحين يَنفد منتج، نعرض رسالة قصيرة في صفحته.\n\nكان في طلبي سياق وطلب واضح: 5 رسائل لهاتف نفد. ففهم الذكاء الاصطناعي الموقف جيدًا، لكنه كتب نكاتًا، والرسائل أطول من المساحة المتاحة."
    mock:
      width: 300
      blocks:
        - { kind: heading, text: { en: "Nova X phone", ar: "هاتف Nova X" } }
        - { kind: chip, text: { en: "Sold out", ar: "نفدت الكمية" }, gap: xs }
        - { kind: small, text: { en: "Whoa, everyone wanted this one! 🏃 Our shelves are as empty as a phone at 1% battery, but don't worry, more are coming soon, probably, we hope!", ar: "واو، الجميع أراد هذا الهاتف! 🏃 رفوفنا فارغة مثل هاتف بطاريته 1%، لكن لا تقلق، المزيد قادم قريبًا، على الأغلب، نأمل ذلك!" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P13-U02-03
    part: try
    rules: [R12]
    value:
      en: "Try first. CARE (NN/g): AI produces better results if you give guardrails and constraints that show what you want it to do or avoid."
      ar: "جرّب أولًا. CARE (NN/g): الذكاء الاصطناعي يعطي نتائج أفضل إذا أعطيته حدودًا وقيودًا توضّح ما تريده أن يفعله أو يتجنّبه."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Generative AI will produce better results if you provide guardrails and constraints that help it understand what you want it to do or avoid." }
    prompt:
      en: "What should I add to my prompt?"
      ar: "ماذا أضيف إلى طلبي؟"
    options:
      - { id: rules, text: { en: "Rules: \"No jokes. Under 80 characters. Say when it's back, if we know.\"", ar: "قواعد: «بلا نكات. أقل من 80 حرفًا. قل متى يعود، إن كنا نعرف.»" } }
      - { id: again, text: { en: "Nothing. Just ask again until it gets it right", ar: "لا شيء. أطلب مرة أخرى حتى يصيب" } }
      - { id: care, text: { en: "\"Please be careful this time.\"", ar: "«من فضلك كن حذرًا هذه المرة.»" } }
    answer: [rules]
    misconceptions:
      - id: MC-P13-013
        when: [again, care]
        feedback:
          en: "The AI can't know your length limit or tone unless you write them down."
          ar: "الذكاء الاصطناعي لا يستطيع أن يعرف حدّ الطول أو النبرة إلا إذا كتبتهما."
    hints:
      - { en: "Did my prompt say anything about length or jokes?", ar: "هل قال طلبي شيئًا عن الطول أو النكات؟" }
      - { en: "Pick the option the AI could actually follow.", ar: "اختر الخيار الذي يستطيع الذكاء الاصطناعي تنفيذه فعلًا." }
    correct:
      en: "Right. Clear rules it can follow."
      ar: "صحيح. قواعد واضحة يستطيع اتّباعها."
    explain:
      en: "Write down your limits and tone. The AI can't guess them."
      ar: "اكتب حدودك ونبرتك. فالذكاء الاصطناعي لا يستطيع تخمينها."

  - id: S03
    type: card
    part: concept
    icons: [list, idea, check, edit]
    title: { en: "Rules, examples, then round two", ar: "القواعد، والأمثلة، ثم الجولة الثانية" }
    body:
      en: "**Rules** can be writing guidelines (\"use plain words\", \"don't blame the user\"), your brand's tone, and limits like space or a character count.\n\n**Examples** show what you want and don't want. You can paste the current text and say what's wrong with it.\n\n**Round two:** the first answer is rarely ready.\n- Check that every instruction was followed.\n- Ask again with any missing details.\n- Combine the best parts with your own ideas.\n\nA full prompt takes time. For a tiny task, doing it yourself can be faster."
      ar: "**القواعد** قد تكون إرشادات كتابة («استخدم كلمات بسيطة»، «لا تلُم المستخدم»)، ونبرة علامتك التجارية، وحدودًا مثل المساحة أو عدد الحروف.\n\n**الأمثلة** تُري ما تريده وما لا تريده. ويمكنك لصق النص الحالي وقول ما الخطأ فيه.\n\n**الجولة الثانية:** الإجابة الأولى نادرًا ما تكون جاهزة.\n- تحقّق أن كل تعليمة نُفّذت.\n- اطلب مرة أخرى بأي تفاصيل ناقصة.\n- اجمع أفضل الأجزاء مع أفكارك.\n\nالطلب الكامل يأخذ وقتًا. وفي مهمة صغيرة جدًا، قد يكون عملك بنفسك أسرع."

  - id: S04
    type: choose
    skill: SK-P13-U02-03
    part: guided
    confidence: true
    rules: [R06]
    value:
      en: "CARE (NN/g): good or bad, examples of what you do or don't want help the AI understand what you need."
      ar: "CARE (NN/g): سواء كانت جيدة أو سيئة، أمثلة ما تريده وما لا تريده تساعد الذكاء الاصطناعي على فهم ما تحتاجه."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Whether good or bad, providing examples of what you do (or don’t) want the generative AI chatbot to produce can help it better understand what you need." }
    scenario:
      en: "The rules are in. Now I want to add examples."
      ar: "القواعد موجودة. والآن أريد أن أضيف أمثلة."
    prompt:
      en: "Which examples help the AI most?"
      ar: "أي أمثلة تساعد الذكاء الاصطناعي أكثر؟"
    options:
      - { id: brands, text: { en: "\"Write it like the best brands do.\"", ar: "«اكتبها كما تفعل أفضل العلامات التجارية.»" } }
      - { id: none, text: { en: "No examples. The AI already knows what good looks like", ar: "بلا أمثلة. فالذكاء الاصطناعي يعرف أصلًا كيف يبدو الجيد" } }
      - { id: pair, text: { en: "\"Good: 'Back in stock on May 3. Want an alert?' Bad: 'Oopsie! All gone 🙈', too playful for someone who wanted to buy.\"", ar: "«جيد: \"يعود للمخزون يوم 3 مايو. هل تريد تنبيهًا؟\" سيئ: \"أوبس! نفد كله 🙈\"، مَرِح أكثر من اللازم لشخص أراد الشراء.»" } }
    answer: [pair]
    misconceptions:
      - id: MC-P13-014
        when: [brands, none]
        feedback:
          en: "\"Good\" means different things to different people. A real good and bad example shows exactly what you mean."
          ar: "كلمة «جيد» تعني أشياء مختلفة لأناس مختلفين. والمثال الحقيقي الجيد والسيئ يُري ما تقصده بالضبط."
    hints:
      - { en: "Which option shows the AI real text?", ar: "أي خيار يُري الذكاء الاصطناعي نصًا حقيقيًا؟" }
      - { en: "A bad example with a reason helps too.", ar: "المثال السيئ مع السبب يساعد أيضًا." }
    correct:
      en: "Right. One good, one bad, and why."
      ar: "صحيح. مثال جيد، ومثال سيئ، والسبب."
    explain:
      en: "Show, don't describe. Real examples tell the AI the style you want and the one to avoid."
      ar: "أرِه، ولا تَصِف. الأمثلة الحقيقية تخبر الذكاء الاصطناعي بالأسلوب الذي تريده والذي يتجنّبه."

  - id: S05
    type: choose
    skill: SK-P13-U02-04
    part: guided
    rules: [R06]
    value:
      en: "CARE (NN/g): check whether the AI followed your instructions; detailed prompts make it more likely that a detail is missed."
      ar: "CARE (NN/g): تحقّق هل نفّذ الذكاء الاصطناعي تعليماتك؛ فالطلبات المفصّلة تزيد احتمال أن تفوته تفصيلة."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Check whether the AI chatbot followed instructions." }
    scenario:
      en: "My new prompt said: no jokes, under 80 characters. Here are the 5 messages."
      ar: "قال طلبي الجديد: بلا نكات، وأقل من 80 حرفًا. وهذه هي الرسائل الخمس."
    mock:
      width: 300
      blocks:
        - { kind: small, text: { en: "1. Sold out. Back on May 3.", ar: "1. نفدت الكمية. يعود يوم 3 مايو." } }
        - { kind: small, text: { en: "2. Gone in a flash! ⚡ Even our robots are sad about it.", ar: "2. اختفى في لمح البصر! ⚡ حتى روبوتاتنا حزينة." }, gap: xs }
        - { kind: small, text: { en: "3. Sold out. Want an alert when it's back?", ar: "3. نفدت الكمية. هل تريد تنبيهًا حين يعود؟" }, gap: xs }
        - { kind: small, text: { en: "4. We're very sorry, but this product has sold out because of high demand, and new stock should arrive on May 3, so please check back then.", ar: "4. نعتذر كثيرًا، لكن هذا المنتج نفد بسبب الطلب الكبير، ومن المتوقّع وصول كمية جديدة يوم 3 مايو، فيرجى العودة حينها." }, gap: xs }
        - { kind: small, text: { en: "5. Out of stock. See similar phones.", ar: "5. غير متوفّر. شاهد هواتف مشابهة." }, gap: xs }
    prompt:
      en: "What should I do next?"
      ar: "ماذا أفعل بعد ذلك؟"
    options:
      - { id: use, text: { en: "Use all 5. I gave it rules, so it followed them", ar: "أستخدم الخمس كلها. أعطيته قواعد، فاتّبعها" } }
      - { id: retry, text: { en: "Point out that 2 breaks \"no jokes\" and 4 is too long, and ask it to fix them", ar: "أوضّح أن 2 تخالف «بلا نكات» وأن 4 طويلة جدًا، وأطلب منه أن يصلحهما" } }
      - { id: restart, text: { en: "Delete the rules and start a new short prompt", ar: "أحذف القواعد وأبدأ طلبًا قصيرًا جديدًا" } }
    answer: [retry]
    misconceptions:
      - id: MC-P13-015
        when: [use]
        feedback:
          en: "Rules don't guarantee anything. Message 2 has a joke and message 4 is far over 80 characters."
          ar: "القواعد لا تضمن شيئًا. فالرسالة 2 فيها نكتة، والرسالة 4 تتجاوز 80 حرفًا بكثير."
      - id: MC-P13-013
        when: [restart]
        feedback:
          en: "Without rules you'd get the jokes back. Keep them and ask for a fix."
          ar: "دون قواعد ستعود النكات. أبقِها واطلب الإصلاح."
    hints:
      - { en: "Read each message against the two rules.", ar: "اقرأ كل رسالة وقارنها بالقاعدتين." }
    correct:
      en: "Right. Check each rule, then ask for a fix."
      ar: "صحيح. راجع كل قاعدة، ثم اطلب الإصلاح."
    explain:
      en: "The AI often skips a rule or two. Check every answer against your instructions."
      ar: "الذكاء الاصطناعي كثيرًا ما يتخطّى قاعدة أو اثنتين. فراجع كل إجابة مقارنةً بتعليماتك."

  - id: S06
    type: compare
    skill: SK-P13-U02-04
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: AI text as written vs AI text combined with your own. CARE (NN/g): as you refine AI outputs, pick the ideas or wording you want and modify or combine them with your own."
      ar: "مقارنة: نص الذكاء الاصطناعي كما هو مقابل دمجه مع عملك. CARE (NN/g): حين تحسّن نتائج الذكاء الاصطناعي، اختر الأفكار أو الكلمات التي تريدها، وعدّلها أو ادمجها مع عملك."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "As you refine the AI outputs, pick out the ideas or language you want to use and modify or combine them with your own." }
    scenario:
      en: "The AI fixed its messages. Two versions are ready for the sold-out page."
      ar: "أصلح الذكاء الاصطناعي رسائله. ونسختان جاهزتان لصفحة المنتج النافد."
    prompt:
      en: "Which one should go on the page?"
      ar: "أيّهما يجب أن تظهر في الصفحة؟"
    a:
      label: { en: "A: message 1 as the AI wrote it", ar: "A: الرسالة 1 كما كتبها الذكاء الاصطناعي" }
      mock:
        width: 300
        blocks:
          - { kind: chip, text: { en: "Sold out", ar: "نفدت الكمية" } }
          - { kind: small, text: { en: "Sold out. Back on May 3.", ar: "نفدت الكمية. يعود يوم 3 مايو." }, gap: xs }
    b:
      label: { en: "B: messages 1 and 3 joined, plus a button", ar: "B: الرسالتان 1 و3 معًا، مع زر" }
      mock:
        width: 300
        blocks:
          - { kind: chip, text: { en: "Sold out", ar: "نفدت الكمية" } }
          - { kind: small, text: { en: "Sold out. Back on May 3.", ar: "نفدت الكمية. يعود يوم 3 مايو." }, gap: xs }
          - { kind: button, text: { en: "Alert me when it's back", ar: "نبّهني حين يعود" }, gap: s }
    answer: b
    misconceptions:
      - id: MC-P13-001
        when: [a]
        feedback:
          en: "A tells people the date, but leaves them with nothing to do. B adds the next step."
          ar: "A تخبر الناس بالتاريخ، لكن لا تترك لهم شيئًا يفعلونه. وB تضيف الخطوة التالية."
    hints:
      - { en: "After reading, what can the shopper do in each version?", ar: "بعد القراءة، ماذا يستطيع المتسوّق أن يفعل في كل نسخة؟" }
    correct:
      en: "Right. The best parts of the AI's work, plus your UX judgment."
      ar: "صحيح. أفضل أجزاء عمل الذكاء الاصطناعي، مع حكمك في تجربة المستخدم."
    explain:
      en: "You don't have to pick one AI answer. Combine the best parts and add what it missed."
      ar: "لست مضطرًا لاختيار إجابة واحدة من الذكاء الاصطناعي. اجمع أفضل الأجزاء وأضف ما فاته."

  - id: S07
    type: choose
    skill: SK-P13-U02-04
    part: guided
    rules: [R06]
    value:
      en: "CARE (NN/g): writing and refining careful prompts can take more time than doing the task the old-fashioned way."
      ar: "CARE (NN/g): كتابة الطلبات المدروسة وتحسينها قد تأخذ وقتًا أكثر من أداء المهمة بالطريقة التقليدية."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "It can take significant amounts of time to craft and iterate on CAREful prompts — sometimes more time than you’d have spent just doing a task the old-fashioned way." }
    scenario:
      en: "My manager wants one button changed from \"Buy\" to \"Add to cart\"."
      ar: "يريد مديري تغيير زر واحد من «اشترِ» إلى «أضف إلى السلة»."
    prompt:
      en: "How should I do it?"
      ar: "كيف أنفّذ ذلك؟"
    options:
      - { id: self, text: { en: "Change it myself. It takes ten seconds", ar: "أغيّره بنفسي. فهذا يأخذ عشر ثوانٍ" } }
      - { id: full, text: { en: "Write a full prompt with context, ask, rules and examples", ar: "أكتب طلبًا كاملًا فيه السياق والطلب والقواعد والأمثلة" } }
      - { id: quick, text: { en: "Ask AI for 20 versions of the label first", ar: "أطلب من الذكاء الاصطناعي 20 نسخة من العنوان أولًا" } }
    answer: [self]
    misconceptions:
      - id: MC-P13-016
        when: [full, quick]
        feedback:
          en: "The words are already decided. A prompt would take longer than the change itself."
          ar: "الكلمات مقرّرة أصلًا. والطلب سيأخذ وقتًا أطول من التغيير نفسه."
    hints:
      - { en: "Is there anything left to decide here?", ar: "هل بقي شيء لنقرّره هنا؟" }
    correct:
      en: "Right. Not every task needs AI."
      ar: "صحيح. ليست كل مهمة تحتاج الذكاء الاصطناعي."
    explain:
      en: "Use careful prompts when they save time. For tiny, clear tasks, just do it."
      ar: "استخدم الطلبات المدروسة حين توفّر الوقت. وفي المهام الصغيرة الواضحة، نفّذها بنفسك."

  - id: S08
    type: choose
    skill: SK-P13-U02-03
    part: independent
    speaker: sara
    rules: [R14]
    value:
      en: "New case. CARE (NN/g): rules can include brand-specific tone-of-voice guidelines and design limits like space or a maximum character count."
      ar: "حالة جديدة. CARE (NN/g): القواعد قد تشمل إرشادات نبرة العلامة التجارية، وحدود التصميم مثل المساحة أو أقصى عدد للحروف."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "We can also include product or brand-specific rules, such as tone-of-voice guidelines, and design constraints to consider, such as the amount of space in which the copy should fit or a maximum character count." }
    scenario:
      en: "In our banking app, a money transfer can fail. I'm asking AI for the message. Our bank's guide says: calm, clear, never casual."
      ar: "في تطبيقنا البنكي، قد يفشل تحويل الأموال. وأطلب من الذكاء الاصطناعي الرسالة. ودليل بنكنا يقول: هادئ، وواضح، وغير عامّي أبدًا."
    prompt:
      en: "Which rules should I add to the prompt?"
      ar: "أي قواعد أضيفها إلى الطلب؟"
    options:
      - { id: creative, text: { en: "\"Be creative and surprise me.\"", ar: "«كن مبدعًا وفاجئني.»" } }
      - { id: guide, text: { en: "\"Calm and clear, never casual. Don't blame the user. Say what to do next. Max 2 sentences.\"", ar: "«هادئ وواضح، وغير عامّي أبدًا. لا تلُم المستخدم. قل ما الخطوة التالية. جملتان كحدّ أقصى.»" } }
      - { id: legal, text: { en: "\"Include every legal detail so the bank is safe.\"", ar: "«اذكر كل التفاصيل القانونية حتى يكون البنك في أمان.»" } }
    answer: [guide]
    misconceptions:
      - id: MC-P13-013
        when: [creative, legal]
        feedback:
          en: "That works against what you need. Give the AI your bank's tone and the space you have."
          ar: "هذا يعمل ضدّ ما تحتاجه. أعطِ الذكاء الاصطناعي نبرة بنكك والمساحة المتاحة."
    correct:
      en: "Right. Your tone guide and your limits, written down."
      ar: "صحيح. دليل نبرتك وحدودك، مكتوبة."
    explain:
      en: "Turn your brand's tone and your screen's limits into rules the AI can follow."
      ar: "حوّل نبرة علامتك التجارية وحدود شاشتك إلى قواعد يستطيع الذكاء الاصطناعي اتّباعها."

  - id: S09
    type: card
    part: recap
    icons: [list, idea, check, edit]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Rules:** no jokes, under 80 characters, say when it's back.\n- **Examples:** one good, one bad, and why.\n- **Check every rule:** two messages broke them, so you asked for a fix.\n- **Combine:** the AI's words plus your alert button.\n- **Skip AI when it's faster:** a one-word button change.\n- **Your guide as rules:** the bank's tone and a 2-sentence limit.\n\nNext: a skill check on this unit."
      ar: "- **القواعد:** بلا نكات، وأقل من 80 حرفًا، وقل متى يعود.\n- **الأمثلة:** مثال جيد، ومثال سيئ، والسبب.\n- **راجع كل قاعدة:** رسالتان خالفتاها، فطلبت الإصلاح.\n- **ادمج:** كلمات الذكاء الاصطناعي مع زر التنبيه الذي أضفته.\n- **اترك الذكاء الاصطناعي حين يكون أسرع:** تغيير كلمة في زر.\n- **دليلك كقواعد:** نبرة البنك وحدّ الجملتين.\n\nالتالي: اختبار مهارات هذه الوحدة."
