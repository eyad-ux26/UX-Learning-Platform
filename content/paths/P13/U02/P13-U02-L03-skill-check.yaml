id: P13-U02-L03
mode: check
minutes: 5
title:
  en: "Skill check: write prompts that work"
  ar: "اختبار المهارة: اكتب طلبات تعطيك ما تحتاجه"
summary:
  en: "Build and check one AI prompt for a clinic app's cancel message, on your own."
  ar: "ابنِ بنفسك طلبًا للذكاء الاصطناعي لرسالة إلغاء موعد في تطبيق عيادة، وراجع نتيجته."
speaker: nour
sources:
  - title: { en: "CARE: Structure for Crafting AI Prompts (NN/g)", ar: "CARE: بنية لكتابة طلبات الذكاء الاصطناعي (NN/g)" }
    url: "https://www.nngroup.com/articles/careful-prompts/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Nour's clinic app", ar: "تطبيق العيادة الذي تديره نور" }
    body:
      en: "I manage a clinic, and patients book with us through our app. Sometimes a doctor cancels, and we have to tell the patient. I want AI to help write that message.\n\nYour job: build the prompt with me, part by part, then check what comes back.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أدير عيادة، ويحجز المرضى عندنا من خلال تطبيقنا. وأحيانًا يلغي الطبيب الموعد، فيجب أن نخبر المريض. وأريد أن يساعدني الذكاء الاصطناعي في كتابة هذه الرسالة.\n\nمهمّتك: ابنِ الطلب معي، جزءًا بعد جزء، ثم راجع ما يعود.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Afia", ar: "عافية" } }
        - { kind: meta, text: { en: "Appointments · Results · Messages", ar: "المواعيد · النتائج · الرسائل" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P13-U02-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. CARE (NN/g): give context that is relevant to the task."
      ar: "اختبار مهارة. CARE (NN/g): أعطِ السياق المهمّ للمهمة."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Focus on what’s relevant for the task." }
    prompt:
      en: "Which context should start the prompt?"
      ar: "أي سياق يجب أن يبدأ به الطلب؟"
    options:
      - { id: clinic, text: { en: "\"Our clinic has 12 doctors and won an award last year.\"", ar: "«في عيادتنا 12 طبيبًا، وفازت بجائزة العام الماضي.»" } }
      - { id: moment, text: { en: "\"In our clinic app, patients get this message when their doctor cancels. Many are older, and some are anxious about their health.\"", ar: "«في تطبيق عيادتنا، يصل هذا الإشعار للمرضى حين يلغي طبيبهم الموعد. وكثير منهم كبار في السن، وبعضهم قلقون على صحتهم.»" } }
      - { id: none, text: { en: "No context. Just the ask", ar: "بلا سياق. الطلب فقط" } }
    answer: [moment]
    misconceptions:
      - id: MC-P13-017
        when: [clinic]
        feedback:
          en: "Nice facts, but they don't help write a cancel message."
          ar: "معلومات جميلة، لكنها لا تساعد في كتابة رسالة الإلغاء."
      - id: MC-P13-011
        when: [none]
        feedback:
          en: "Without context, the AI doesn't know who reads this or how they feel."
          ar: "دون سياق، لا يعرف الذكاء الاصطناعي من يقرأ الرسالة ولا بماذا يشعر."
    explain:
      en: "From Lesson 1: say what the product is, who the users are, and when they see this."
      ar: "من الدرس 1: قل ما المنتج، ومن المستخدمون، ومتى يرون هذا."

  - id: S03
    type: choose
    skill: SK-P13-U02-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. CARE (NN/g): be specific in the ask: output, number of options and format."
      ar: "اختبار مهارة. CARE (NN/g): كن محدّدًا في الطلب: الناتج، وعدد الخيارات، والشكل."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Whether you phrase the ask as a question or command, it’s important to be specific." }
    prompt:
      en: "Which ask comes next?"
      ar: "أي طلب يأتي بعد ذلك؟"
    options:
      - { id: help, text: { en: "\"Can you help me with this?\"", ar: "«هل تستطيع مساعدتي في هذا؟»" } }
      - { id: one, text: { en: "\"Write the message.\"", ar: "«اكتب الرسالة.»" } }
      - { id: spec, text: { en: "\"You're a UX writer. Write 6 versions of the cancel message, each with a way to rebook. Show them in a table.\"", ar: "«أنت كاتب تجربة مستخدم. اكتب 6 نسخ من رسالة الإلغاء، في كل منها طريقة لإعادة الحجز. واعرضها في جدول.»" } }
    answer: [spec]
    misconceptions:
      - id: MC-P13-012
        when: [help, one]
        feedback:
          en: "The AI still has to guess how many, what each must include, and how to show them."
          ar: "ما زال الذكاء الاصطناعي مضطرًا أن يخمّن كم نسخة، وماذا تحتوي كل منها، وكيف يعرضها."
    explain:
      en: "From Lesson 1: name the role, the output, how many and the format."
      ar: "من الدرس 1: حدّد الدور، والناتج، وكم نسخة، والشكل."

  - id: S04
    type: choose
    skill: SK-P13-U02-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. CARE (NN/g): to improve an existing message, include it in your prompt and say what you don't like about it."
      ar: "اختبار مهارة. CARE (NN/g): لتحسين رسالة موجودة، ضعها في طلبك وقل ما الذي لا يعجبك فيها."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "For example, if you’re trying to improve an existing error message, include it in your prompt and describe what you don’t like about it or what needs improvement." }
    scenario:
      en: "Today the app sends: \"Appointment #4471 status: CANCELLED by provider.\" Patients call us, worried and confused."
      ar: "اليوم يرسل التطبيق: «حالة الموعد رقم 4471: أُلغي من مقدّم الخدمة.» فيتّصل بنا المرضى قلقين ومرتبكين."
    prompt:
      en: "What should I add to the prompt?"
      ar: "ماذا أضيف إلى الطلب؟"
    options:
      - { id: example, text: { en: "The current message, with: \"Too cold and technical. Patients don't know what to do next.\"", ar: "الرسالة الحالية، مع: «باردة وتقنية جدًا. والمرضى لا يعرفون ماذا يفعلون بعدها.»" } }
      - { id: better, text: { en: "\"Make it better than what we have.\"", ar: "«اجعلها أفضل مما لدينا.»" } }
      - { id: nothing, text: { en: "Nothing. The AI knows what a good message looks like", ar: "لا شيء. فالذكاء الاصطناعي يعرف كيف تبدو الرسالة الجيدة" } }
    answer: [example]
    misconceptions:
      - id: MC-P13-014
        when: [better, nothing]
        feedback:
          en: "The AI hasn't seen what you have. Paste it and say what's wrong."
          ar: "الذكاء الاصطناعي لم يرَ ما لديك. الصقها وقل ما الخطأ فيها."
    explain:
      en: "From Lesson 2: a bad example with a reason shows the AI what to avoid."
      ar: "من الدرس 2: المثال السيئ مع السبب يُري الذكاء الاصطناعي ما يجب أن يتجنّبه."

  - id: S05
    type: choose
    skill: SK-P13-U02-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. CARE (NN/g): check whether the AI followed instructions, and ask it to try again without missing any details."
      ar: "اختبار مهارة. CARE (NN/g): تحقّق هل نفّذ الذكاء الاصطناعي التعليمات، واطلب منه أن يحاول مرة أخرى دون أن يفوّت أي تفصيلة."
    ref: { url: "https://www.nngroup.com/articles/careful-prompts/", quote: "Check whether the AI chatbot followed instructions." }
    scenario:
      en: "The AI sent back 6 messages in a table. 4 include a way to rebook. 2 don't."
      ar: "أعاد الذكاء الاصطناعي 6 رسائل في جدول. 4 منها فيها طريقة لإعادة الحجز. و2 لا."
    prompt:
      en: "What should I do?"
      ar: "ماذا أفعل؟"
    options:
      - { id: fine, text: { en: "Pick any of the 6. Most followed the rules", ar: "أختار أيًّا من الست. فأغلبها اتّبع القواعد" } }
      - { id: aipick, text: { en: "Ask the AI which one is best and use that", ar: "أسأل الذكاء الاصطناعي أيّها الأفضل وأستخدمه" } }
      - { id: check, text: { en: "Drop or fix the 2 without rebooking, then choose from the rest myself", ar: "أحذف الاثنتين اللتين بلا إعادة حجز أو أصلحهما، ثم أختار من الباقي بنفسي" } }
    answer: [check]
    misconceptions:
      - id: MC-P13-015
        when: [fine]
        feedback:
          en: "Two of them break your rule. A patient who gets one won't know how to rebook."
          ar: "اثنتان منها تخالفان قاعدتك. والمريض الذي تصله إحداهما لن يعرف كيف يعيد الحجز."
      - id: MC-P13-004
        when: [aipick]
        feedback:
          en: "The AI may pick one of the two that broke the rule. Checking and choosing is your job."
          ar: "قد يختار الذكاء الاصطناعي إحدى الرسالتين المخالفتين. والمراجعة والاختيار مهمّتك."
    explain:
      en: "From Lesson 2: check every answer against your rules before you use it."
      ar: "من الدرس 2: راجع كل إجابة مقارنةً بقواعدك قبل أن تستخدمها."
