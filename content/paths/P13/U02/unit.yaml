id: P13-U02
free: false
title:
  en: "Write prompts that work"
  ar: "اكتب طلبات (Prompts) تعطيك ما تحتاجه"
skill:
  en: "Write AI prompts with context, a specific ask, rules and examples, then check the result and refine it."
  ar: "اكتب طلبات (Prompts) للذكاء الاصطناعي فيها سياق، ومطلوب محدّد، وقواعد، وأمثلة، ثم راجع النتيجة وحسّنها."
skills:
  - id: SK-P13-U02-01
    title: { en: "Give the AI context", ar: "أعطِ الذكاء الاصطناعي السياق" }
    can_do: { en: "Tell the AI about your product, your users and the exact situation, and leave out details that don't matter for the task.", ar: "أخبر الذكاء الاصطناعي عن منتجك ومستخدميك والموقف بالضبط، واترك التفاصيل التي لا تهمّ المهمة." }
  - id: SK-P13-U02-02
    title: { en: "Make a specific ask", ar: "حدّد المطلوب بدقة" }
    can_do: { en: "Say what role the AI plays, what to produce, how many, in which steps and in what format.", ar: "حدّد الدور الذي يقوم به الذكاء الاصطناعي، وماذا ينتج، وكم نسخة، وبأي خطوات، وبأي شكل." }
  - id: SK-P13-U02-03
    title: { en: "Add rules and examples", ar: "أضف قواعد وأمثلة" }
    can_do: { en: "Give limits, tone and guidelines, plus good and bad examples, so the AI knows what you want and what to avoid.", ar: "أعطِ حدودًا ونبرة وإرشادات، مع أمثلة جيدة وسيئة، حتى يعرف الذكاء الاصطناعي ما تريده وما يجب أن يتجنّبه." }
  - id: SK-P13-U02-04
    title: { en: "Check and refine the result", ar: "راجع النتيجة وحسّنها" }
    can_do: { en: "Check that every instruction was followed, ask again with what's missing, combine the best parts with your own, and skip AI when doing it yourself is faster.", ar: "تحقّق من تنفيذ كل تعليمة، واطلب مرة أخرى بما ينقص، واجمع أفضل الأجزاء مع عملك، واترك الذكاء الاصطناعي حين يكون عملك بنفسك أسرع." }
