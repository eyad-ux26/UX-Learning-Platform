id: P05-U04-L02
mode: lesson
minutes: 7
title:
  en: "Links and buttons that make sense when heard"
  ar: "روابط وأزرار مفهومة حين تُسمع"
summary:
  en: "Rewrite a shop's vague links and labels, and move focus when a panel opens."
  ar: "أعد كتابة روابط وعناوين غامضة في متجر، وانقل التركيز حين تُفتح لوحة."
speaker: youssef
sources:
  - title: { en: "\"Learn More\" Links: You Can Do Better (NN/g)", ar: "روابط «اعرف المزيد»: يمكنك أفضل من ذلك (NN/g)" }
    url: "https://www.nngroup.com/articles/learn-more-links/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Writing Hyperlinks: Salient, Descriptive, Start with Keyword (NN/g)", ar: "كتابة الروابط: بارزة، وواضحة، وتبدأ بالكلمة المهمة (NN/g)" }
    url: "https://www.nngroup.com/articles/writing-links/"
review_labels:
  MC-P05-041: { en: "Links must make sense alone", ar: "الروابط يجب أن تكون مفهومة وحدها" }
  MC-P05-042: { en: "Put the key word first", ar: "ضع الكلمة المهمة أولًا" }
  MC-P05-043: { en: "Move focus to what just opened", ar: "انقل التركيز إلى ما فُتح للتو" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Learn more, learn more, learn more\"", ar: "«اعرف المزيد، اعرف المزيد، اعرف المزيد»" }
    body:
      en: "My shop's help page has three short sections, and each one ends with a \"Learn more\" link.\n\nA blind customer asked his screen reader for the list of links on the page. This is what he heard."
      ar: "صفحة المساعدة في متجري فيها ثلاثة أقسام قصيرة، وكل قسم ينتهي برابط «اعرف المزيد».\n\nوطلب عميل كفيف من قارئ الشاشة قائمة الروابط في الصفحة. وهذا ما سمعه."
    mock:
      width: 300
      blocks:
        - { kind: banner, text: { en: "🔊 \"Learn more, link. Learn more, link. Learn more, link.\"", ar: "🔊 «اعرف المزيد، رابط. اعرف المزيد، رابط. اعرف المزيد، رابط.»" } }

  - id: S02
    type: tune
    skill: SK-P05-U04-04
    part: try
    rules: [R12]
    value:
      en: "Try first. \"Learn More\" Links (NN/g): as a standalone link, the lack of descriptive keywords is a serious accessibility problem; screen reader users often hear a list of links with no context."
      ar: "جرّب أولًا. روابط «اعرف المزيد» (NN/g): الرابط الذي لا يحمل كلمات واضحة مشكلة كبيرة للإتاحة؛ فمستخدمو قارئ الشاشة كثيرًا ما يسمعون قائمة روابط بلا سياق."
    ref: { url: "https://www.nngroup.com/articles/learn-more-links/", quote: "Finally, as a standalone link, the lack of descriptive keywords is a serious problem for accessibility." }
    prompt:
      en: "Tap each option to see the change. Which one tells the customer where each link goes?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يخبر العميل إلى أين يذهب كل رابط؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &helpnow
        - { kind: meta, weight: bold, text: { en: "Delivery", ar: "التوصيل" } }
        - { kind: link, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
        - { kind: meta, weight: bold, text: { en: "Returns", ar: "الإرجاع" }, gap: s }
        - { kind: link, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
        - { kind: meta, weight: bold, text: { en: "Warranty", ar: "الضمان" }, gap: s }
        - { kind: link, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
    options:
      - id: bold
        text: { en: "Keep \"Learn more\", but make the links bold", ar: "أبقِ «اعرف المزيد»، لكن اجعل الروابط عريضة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: meta, weight: bold, text: { en: "Delivery", ar: "التوصيل" } }
            - { kind: link, weight: bold, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Returns", ar: "الإرجاع" }, gap: s }
            - { kind: link, weight: bold, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Warranty", ar: "الضمان" }, gap: s }
            - { kind: link, weight: bold, text: { en: "Learn more", ar: "اعرف المزيد" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"Learn more, link. Learn more, link. Learn more, link.\"", ar: "🔊 «اعرف المزيد، رابط. اعرف المزيد، رابط. اعرف المزيد، رابط.»" }, gap: m }
      - id: words
        text: { en: "Name each link by where it goes", ar: "سمِّ كل رابط بالمكان الذي يذهب إليه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: meta, weight: bold, text: { en: "Delivery", ar: "التوصيل" } }
            - { kind: link, text: { en: "Delivery times and fees", ar: "مواعيد التوصيل ورسومه" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Returns", ar: "الإرجاع" }, gap: s }
            - { kind: link, text: { en: "How to return an item", ar: "طريقة إرجاع منتج" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Warranty", ar: "الضمان" }, gap: s }
            - { kind: link, text: { en: "Warranty rules", ar: "شروط الضمان" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"Delivery times and fees, link. How to return an item, link. Warranty rules, link.\"", ar: "🔊 «مواعيد التوصيل ورسومه، رابط. طريقة إرجاع منتج، رابط. شروط الضمان، رابط.»" }, gap: m }
      - id: click
        text: { en: "Change each link to \"Click here\"", ar: "غيّر كل رابط إلى «اضغط هنا»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: meta, weight: bold, text: { en: "Delivery", ar: "التوصيل" } }
            - { kind: link, text: { en: "Click here", ar: "اضغط هنا" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Returns", ar: "الإرجاع" }, gap: s }
            - { kind: link, text: { en: "Click here", ar: "اضغط هنا" }, gap: xs }
            - { kind: meta, weight: bold, text: { en: "Warranty", ar: "الضمان" }, gap: s }
            - { kind: link, text: { en: "Click here", ar: "اضغط هنا" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"Click here, link. Click here, link. Click here, link.\"", ar: "🔊 «اضغط هنا، رابط. اضغط هنا، رابط. اضغط هنا، رابط.»" }, gap: m }
    answer: [words]
    misconceptions:
      - id: MC-P05-041
        when: [bold, click]
        feedback:
          en: "The customer still hears three links with the same words. Each link has to say where it goes."
          ar: "ما زال العميل يسمع ثلاثة روابط بنفس الكلمات. ويجب أن يقول كل رابط إلى أين يذهب."
    hints:
      - { en: "Listen to what the screen reader says in each option.", ar: "استمع إلى ما يقوله قارئ الشاشة في كل خيار." }
      - { en: "Which option gives each link its own words?", ar: "أي خيار يعطي كل رابط كلماته الخاصة؟" }
    correct:
      en: "Right. Now every link makes sense on its own."
      ar: "صحيح. الآن كل رابط مفهوم وحده."
    explain:
      en: "Sighted people read the heading above a link. Screen reader users often hear the link alone, so the link must carry the meaning."
      ar: "المبصر يقرأ العنوان فوق الرابط. أما مستخدم قارئ الشاشة فكثيرًا ما يسمع الرابط وحده، فيجب أن يحمل الرابط المعنى."

  - id: S03
    type: card
    part: concept
    icons: [ear, text, order, target]
    title: { en: "Words that work when heard", ar: "كلمات تعمل حين تُسمع" }
    body:
      en: "- **Heard alone:** screen reader users often jump from link to link, or heading to heading. They hear each one without the text around it.\n- **Say where it goes:** \"How to return an item\", not \"Learn more\" or \"Click here\". Give each link on a page different words.\n- **Key word first:** many people swipe on after the first few words. Start with the word they're looking for: \"Search the shop\", not \"Phones, cases and more. Search\".\n- **Move focus to what opened:** when a menu or panel opens, move the screen reader's focus into it. If not, people hear nothing new and think the button didn't work."
      ar: "- **تُسمع وحدها:** مستخدمو قارئ الشاشة كثيرًا ما يقفزون من رابط إلى رابط، أو من عنوان إلى عنوان. ويسمعون كل واحد دون النص الذي حوله.\n- **قل إلى أين يذهب:** «طريقة إرجاع منتج»، لا «اعرف المزيد» أو «اضغط هنا». وأعطِ كل رابط في الصفحة كلمات مختلفة.\n- **الكلمة المهمة أولًا:** كثيرون ينتقلون بعد أول كلمات قليلة. فابدأ بالكلمة التي يبحثون عنها: «ابحث في المتجر»، لا «هواتف وجرابات والمزيد. بحث».\n- **انقل التركيز إلى ما فُتح:** حين تُفتح قائمة أو لوحة، انقل تركيز قارئ الشاشة إليها. وإلا لن يسمع الناس شيئًا جديدًا، وسيظنون أن الزر لم يعمل."

  - id: S04
    type: choose
    skill: SK-P05-U04-04
    part: guided
    rules: [R06]
    value:
      en: "Screen-Reader Users on Mobile (NN/g): many screen reader users swipe on without hearing the whole label; if the first words don't seem relevant, they move on. A search label must start with \"Search\"."
      ar: "مستخدمو قارئ الشاشة على الهاتف (NN/g): كثير منهم ينتقلون دون سماع العنوان كاملًا؛ وإذا لم تبدُ أول الكلمات مهمة، ينتقلون. فعنوان البحث يجب أن يبدأ بـ «ابحث»."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "If the first few words of the label don’t seem relevant, they’ll swipe and quickly move on." }
    scenario:
      en: "In our app, the search box is read like this. A customer swiped past it three times and said there's no search."
      ar: "في تطبيقنا، يُقرأ مربع البحث هكذا. ومرّ عليه أحد العملاء ثلاث مرات، وقال إنه لا يوجد بحث."
    prompt:
      en: "Which label should the search box have?"
      ar: "أي عنوان يجب أن يكون لمربع البحث؟"
    mock:
      width: 300
      blocks:
        - { kind: field, text: { en: "Phones, cases, chargers and more", ar: "هواتف وجرابات وشواحن والمزيد" } }
        - { kind: banner, text: { en: "🔊 \"Phones, cases, chargers and more. Search field.\"", ar: "🔊 «هواتف وجرابات وشواحن والمزيد. حقل بحث.»" }, gap: s }
    options:
      - { id: search, text: { en: "\"Search the shop\"", ar: "«ابحث في المتجر»" } }
      - { id: long, text: { en: "\"Find phones, cases, chargers and more in our shop\"", ar: "«اعثر على الهواتف والجرابات والشواحن والمزيد في متجرنا»" } }
      - { id: keep, text: { en: "Keep it; it shows what we sell", ar: "يبقى كما هو؛ فهو يوضّح ما نبيعه" } }
    answer: [search]
    misconceptions:
      - id: MC-P05-042
        when: [long, keep]
        feedback:
          en: "Both start with product names, so people move on before they hear that it's a search box. Start with \"Search\"."
          ar: "الاثنان يبدآن بأسماء منتجات، فينتقل الناس قبل أن يسمعوا أنه مربع بحث. ابدأ بـ «ابحث»."
    hints:
      - { en: "What are the first words the customer hears now?", ar: "ما أول الكلمات التي يسمعها العميل الآن؟" }
      - { en: "Which label starts with the word the customer is looking for?", ar: "أي عنوان يبدأ بالكلمة التي يبحث عنها العميل؟" }
    correct:
      en: "Right. The key word comes first."
      ar: "صحيح. الكلمة المهمة تأتي أولًا."
    explain:
      en: "People decide from the first few words. Put the job of the control at the start."
      ar: "الناس يقرّرون من أول كلمات قليلة. فضع وظيفة العنصر في البداية."

  - id: S05
    type: tune
    skill: SK-P05-U04-05
    part: guided
    rules: [R06]
    value:
      en: "Screen-Reader Users on Mobile (NN/g): in a good design, when the Filter button opens an overlay, the screen reader's focus goes straight to the top of the overlay."
      ar: "مستخدمو قارئ الشاشة على الهاتف (NN/g): في التصميم الجيد، حين يفتح زر الفلترة لوحة فوق الصفحة، ينتقل تركيز قارئ الشاشة مباشرة إلى أعلى اللوحة."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "When the user selects the Filter button in the Target app, a Filter overlay is displayed, and the screen-reader focus is taken directly to the top of the overlay." }
    scenario:
      en: "In our app, tapping \"Filter\" opens a panel over the product list. The screen reader's focus stays on the Filter button."
      ar: "في تطبيقنا، الضغط على «فلترة» يفتح لوحة فوق قائمة المنتجات. لكن تركيز قارئ الشاشة يبقى على زر الفلترة."
    prompt:
      en: "Tap each option to see the change. Which one tells a screen reader user that the panel opened?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يخبر مستخدم قارئ الشاشة أن اللوحة فُتحت؟"
    mock:
      caption: { en: "Now (just after tapping Filter)", ar: "الآن (بعد الضغط على فلترة مباشرة)" }
      width: 300
      blocks:
        - { kind: button, style: plain, ring: brand, text: { en: "Filter", ar: "فلترة" } }
        - kind: group
          gap: s
          blocks:
            - { kind: heading, text: { en: "Filters", ar: "الفلاتر" } }
            - { kind: check, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
        - { kind: banner, text: { en: "🔊 \"Filter, button.\"", ar: "🔊 «فلترة، زر.»" }, gap: s }
    options:
      - id: sound
        text: { en: "Play a short sound when the panel opens", ar: "شغّل صوتًا قصيرًا حين تُفتح اللوحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: button, style: plain, ring: brand, text: { en: "Filter", ar: "فلترة" } }
            - kind: group
              gap: s
              blocks:
                - { kind: heading, text: { en: "Filters", ar: "الفلاتر" } }
                - { kind: check, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"(ding) Filter, button.\"", ar: "🔊 «(رنّة) فلترة، زر.»" }, gap: s }
      - id: leave
        text: { en: "Leave it; people can swipe until they find the panel", ar: "اتركه؛ يستطيع الناس التنقّل حتى يجدوا اللوحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: button, style: plain, ring: brand, text: { en: "Filter", ar: "فلترة" } }
            - kind: group
              gap: s
              blocks:
                - { kind: heading, text: { en: "Filters", ar: "الفلاتر" } }
                - { kind: check, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"Filter, button.\"", ar: "🔊 «فلترة، زر.»" }, gap: s }
      - id: move
        text: { en: "Move the focus to the top of the panel when it opens", ar: "انقل التركيز إلى أعلى اللوحة حين تُفتح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: button, style: plain, text: { en: "Filter", ar: "فلترة" } }
            - kind: group
              gap: s
              blocks:
                - { kind: heading, ring: brand, text: { en: "Filters", ar: "الفلاتر" } }
                - { kind: check, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
            - { kind: banner, text: { en: "🔊 \"Filters, heading.\"", ar: "🔊 «الفلاتر، عنوان.»" }, gap: s }
    answer: [move]
    misconceptions:
      - id: MC-P05-043
        when: [sound, leave]
        feedback:
          en: "The customer still hears \"Filter, button\", as if nothing happened, and doesn't know where the panel is. Move the focus into it."
          ar: "ما زال العميل يسمع «فلترة، زر»، كأن شيئًا لم يحدث، ولا يعرف أين اللوحة. انقل التركيز إليها."
    hints:
      - { en: "After tapping, what does the customer hear in each option?", ar: "بعد الضغط، ماذا يسمع العميل في كل خيار؟" }
      - { en: "Which option takes the customer to the panel?", ar: "أي خيار يأخذ العميل إلى اللوحة؟" }
    correct:
      en: "Right. Focus moves to the panel, so the customer hears it opened."
      ar: "صحيح. ينتقل التركيز إلى اللوحة، فيسمع العميل أنها فُتحت."
    explain:
      en: "Sighted people see the panel appear. Screen reader users only know if the focus goes there."
      ar: "المبصر يرى اللوحة تظهر. أما مستخدم قارئ الشاشة فلا يعرف إلا إذا انتقل التركيز إليها."

  - id: S06
    type: compare
    skill: SK-P05-U04-04
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: descriptive links vs vague, repeated ones. Writing Hyperlinks (NN/g): links understandable out of context are good; vague or duplicate links are useless for screen reader users."
      ar: "مقارنة: روابط واضحة مقابل روابط غامضة ومتكرّرة. كتابة الروابط (NN/g): الروابط المفهومة خارج سياقها جيدة؛ والروابط الغامضة أو المكرّرة بلا فائدة لمستخدمي قارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/writing-links/", quote: "The links that are understandable out of context, such as how to post a Tweet, are good." }
    scenario:
      en: "Two designers wrote the links on a phone's product page. This is what a screen reader user hears in the list of links."
      ar: "كتب مصمّمان الروابط في صفحة منتج لهاتف. وهذا ما يسمعه مستخدم قارئ الشاشة في قائمة الروابط."
    prompt:
      en: "Which page lets the customer pick the right link from the list alone?"
      ar: "أي صفحة تجعل العميل يختار الرابط الصحيح من القائمة وحدها؟"
    a:
      label: { en: "A: Each link says what it opens", ar: "A: كل رابط يقول ماذا يفتح" }
      mock:
        width: 300
        blocks:
          - { kind: banner, text: { en: "🔊 \"Compare phone models, link. Delivery to your area, link. Phone warranty, link.\"", ar: "🔊 «قارن موديلات الهواتف، رابط. التوصيل إلى منطقتك، رابط. ضمان الهاتف، رابط.»" } }
    b:
      label: { en: "B: Links say \"Read more\" or \"here\"", ar: "B: الروابط تقول «اقرأ المزيد» أو «هنا»" }
      mock:
        width: 300
        blocks:
          - { kind: banner, text: { en: "🔊 \"Read more, link. Read more, link. Here, link.\"", ar: "🔊 «اقرأ المزيد، رابط. اقرأ المزيد، رابط. هنا، رابط.»" } }
    answer: a
    reason:
      prompt: { en: "Why is A better for screen reader users?", ar: "لماذا A أفضل لمستخدمي قارئ الشاشة؟" }
      options:
        - { id: short, text: { en: "Shorter links are always better", ar: "الروابط الأقصر أفضل دائمًا" } }
        - { id: alone, text: { en: "They often hear links without the text around them, so each link must say where it goes", ar: "كثيرًا ما يسمعون الروابط دون النص حولها، فيجب أن يقول كل رابط إلى أين يذهب" } }
        - { id: more, text: { en: "A has more links", ar: "في A روابط أكثر" } }
      answer: [alone]
      misconceptions:
        - id: MC-P05-041
          when: [short, more]
          feedback:
            en: "Both have three links, and B's are shorter. What matters is that A's links make sense without the page around them."
            ar: "في الاثنين ثلاثة روابط، وروابط B أقصر. المهم أن روابط A مفهومة دون الصفحة حولها."
    misconceptions:
      - id: MC-P05-041
        when: [b]
        feedback:
          en: "In B, the customer can't tell the links apart. \"Read more\" about what? \"Here\" is where?"
          ar: "في B، لا يستطيع العميل التفريق بين الروابط. «اقرأ المزيد» عن ماذا؟ و«هنا» أين؟"
    hints:
      - { en: "Close your eyes and listen. Which list tells you where to go?", ar: "أغمض عينيك واستمع. أي قائمة تخبرك إلى أين تذهب؟" }
      - { en: "In which page could you choose a link without seeing anything else?", ar: "في أي صفحة تستطيع اختيار رابط دون أن ترى شيئًا آخر؟" }
    correct:
      en: "Right. Each link stands on its own."
      ar: "صحيح. كل رابط مفهوم وحده."
    explain:
      en: "Test your links by reading them as a list. If a link only makes sense with the text around it, rewrite it."
      ar: "اختبر روابطك بقراءتها كقائمة. وإذا كان الرابط مفهومًا فقط مع النص حوله، فأعد كتابته."

  - id: S07
    type: choose
    skill: SK-P05-U04-05
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. Screen-Reader Users on Mobile (NN/g): it's confusing when a user taps a button and the screen reader's focus stays in the same place, as if nothing happened."
      ar: "حالة جديدة. مستخدمو قارئ الشاشة على الهاتف (NN/g): من المُربك أن يضغط المستخدم زرًا ويبقى تركيز قارئ الشاشة في نفس المكان، كأن شيئًا لم يحدث."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "It is equally confusing when a user takes an action (e.g., tapping a button), yet the screen reader's focus remains in the same place as if nothing has happened." }
    scenario:
      en: "In a notes app I'm building, the + button opens a small menu: New note, New list, New photo. After tapping +, the screen reader still says \"Add, button.\""
      ar: "في تطبيق ملاحظات أبنيه، يفتح زر + قائمة صغيرة: ملاحظة جديدة، قائمة جديدة، صورة جديدة. وبعد الضغط على +، ما زال قارئ الشاشة يقول «إضافة، زر.»"
    prompt:
      en: "What should happen when the menu opens?"
      ar: "ماذا يجب أن يحدث حين تُفتح القائمة؟"
    mock:
      width: 300
      blocks:
        - { kind: button, style: plain, ring: brand, text: "+" }
        - kind: group
          gap: xs
          blocks:
            - { kind: meta, text: { en: "New note", ar: "ملاحظة جديدة" } }
            - { kind: meta, text: { en: "New list", ar: "قائمة جديدة" }, gap: xs }
            - { kind: meta, text: { en: "New photo", ar: "صورة جديدة" }, gap: xs }
        - { kind: banner, text: { en: "🔊 \"Add, button.\"", ar: "🔊 «إضافة، زر.»" }, gap: s }
    options:
      - { id: bigger, text: { en: "Make the + button bigger, so it's easier to find", ar: "كبّر زر +، ليسهل إيجاده" } }
      - { id: move, text: { en: "Move focus to \"New note\", the first item in the menu", ar: "انقل التركيز إلى «ملاحظة جديدة»، أول عنصر في القائمة" } }
      - { id: rename, text: { en: "Rename the button to \"Add, opens a menu below\"", ar: "غيّر اسم الزر إلى «إضافة، تفتح قائمة بالأسفل»" } }
    answer: [move]
    misconceptions:
      - id: MC-P05-043
        when: [bigger, rename]
        feedback:
          en: "The user still hears the same button after tapping, and must hunt for the menu. Move focus to its first item."
          ar: "ما زال المستخدم يسمع نفس الزر بعد الضغط، ويجب أن يبحث عن القائمة. انقل التركيز إلى أول عنصر فيها."
    hints:
      - { en: "After tapping +, what does the user hear now?", ar: "بعد الضغط على +، ماذا يسمع المستخدم الآن؟" }
      - { en: "Where should the user be after the menu opens?", ar: "أين يجب أن يكون المستخدم بعد أن تُفتح القائمة؟" }
    correct:
      en: "Right. The user hears \"New note\" and knows the menu opened."
      ar: "صحيح. يسمع المستخدم «ملاحظة جديدة»، ويعرف أن القائمة فُتحت."
    explain:
      en: "Whenever a tap opens something, the focus should follow it."
      ar: "كلما فتحت ضغطةٌ شيئًا، يجب أن يتبعه التركيز."

  - id: S08
    type: card
    part: recap
    icons: [ear, text, order, target]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Links that make sense alone:** you replaced \"Learn more\" with where each link goes.\n- **Key word first:** you started the search label with \"Search\".\n- **Test as a list:** you chose the product page whose links work without the page.\n- **Focus follows:** you moved focus into the filter panel and the + menu.\n\nNext lesson: charts, timetables and other big images."
      ar: "- **روابط مفهومة وحدها:** استبدلت «اعرف المزيد» بوجهة كل رابط.\n- **الكلمة المهمة أولًا:** بدأت عنوان البحث بـ «ابحث».\n- **اختبر كقائمة:** اخترت صفحة المنتج التي تعمل روابطها دون الصفحة.\n- **التركيز يتبع:** نقلت التركيز إلى لوحة الفلاتر وقائمة +.\n\nالدرس التالي: الرسوم البيانية والجداول والصور الكبيرة الأخرى."
