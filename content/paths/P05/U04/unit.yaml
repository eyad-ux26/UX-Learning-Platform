id: P05-U04
free: false
title:
  en: "Screen readers and meaning"
  ar: "قارئ الشاشة والمعنى"
skill:
  en: "Make images, links and buttons make sense when they're heard, not seen."
  ar: "اجعل الصور والروابط والأزرار مفهومة حين تُسمع، لا حين تُرى."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P05-U04-01
    title: { en: "Decide what an image needs", ar: "قرّر ماذا تحتاج الصورة" }
    can_do: { en: "Leave alt text empty for decorative images, say the action for clickable ones, and say the message for informative ones.", ar: "اترك النص البديل فارغًا للصور الزخرفية، واكتب الإجراء للصور القابلة للضغط، واكتب الرسالة للصور التي تحمل معلومة." }
  - id: SK-P05-U04-02
    title: { en: "Write short, useful alt text", ar: "اكتب نصًا بديلًا قصيرًا ومفيدًا" }
    can_do: { en: "Keep alt text under about 150 characters, put the key words first, skip \"image of\", and don't repeat the caption.", ar: "اجعل النص البديل أقل من نحو 150 حرفًا، وضع الكلمات المهمة أولًا، ولا تكتب «صورة لـ»، ولا تكرّر التعليق المكتوب." }
  - id: SK-P05-U04-03
    title: { en: "Give charts and big images a text version", ar: "أعطِ الرسوم البيانية والصور الكبيرة نسخة نصية" }
    can_do: { en: "Put the data of a chart, timetable or map on the page as text, and keep the alt text to its main point.", ar: "ضع بيانات الرسم البياني أو الجدول أو الخريطة في الصفحة كنص، واجعل النص البديل للفكرة الرئيسية فقط." }
  - id: SK-P05-U04-04
    title: { en: "Write labels that make sense alone", ar: "اكتب عناوين مفهومة وحدها" }
    can_do: { en: "Make each link and control say where it goes or what it does, with the key word first, never just \"Learn more\".", ar: "اجعل كل رابط وعنصر يقول إلى أين يذهب أو ماذا يفعل، والكلمة المهمة أولًا، لا «اعرف المزيد» فقط." }
  - id: SK-P05-U04-05
    title: { en: "Move focus to what just opened", ar: "انقل التركيز إلى ما فُتح للتو" }
    can_do: { en: "When a menu or panel opens, move the screen reader's focus into it, so people know something happened.", ar: "حين تُفتح قائمة أو لوحة، انقل تركيز قارئ الشاشة إليها، ليعرف الناس أن شيئًا حدث." }
