    body:
      en: "- **Decorative:** you left the receptionist photo's alt text empty.\n- **Clickable:** you named the 📞 icon by its action, and the logo by where it goes.\n- **No repeats:** you left a doctor's photo empty because the caption says who she is.\n- **The message:** you put the opening hours into the alt text.\n\nNext lesson: links and buttons that make sense when heard."
      ar: "- **زخرفية:** تركت النص البديل لصورة الاستقبال فارغًا.\n- **قابلة للضغط:** سمّيت أيقونة 📞 بإجرائها، والشعار بوجهته.\n- **بلا تكرار:** تركت صورة الطبيبة فارغة لأن التعليق يقول من هي.\n- **الرسالة:** وضعت مواعيد العمل في النص البديل.\n\nالدرس التالي: روابط وأزرار مفهومة حين تُسمع."
