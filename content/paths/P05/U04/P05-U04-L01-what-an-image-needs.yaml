id: P05-U04-L01
mode: lesson
minutes: 7
title:
  en: "What does this image need to say?"
  ar: "ماذا يجب أن تقول هذه الصورة؟"
summary:
  en: "Decide what each image on a clinic website should say to a screen reader."
  ar: "قرّر ماذا يجب أن تقول كل صورة في موقع عيادة لقارئ الشاشة."
speaker: nour
sources:
  - title: { en: "Write Alt Text Based on Purpose (NN/g)", ar: "اكتب النص البديل حسب الغرض (NN/g)" }
    url: "https://www.nngroup.com/articles/write-alt-text/"
  - title: { en: "5 Visual Treatments that Improve Accessibility (NN/g)", ar: "5 معالجات بصرية تحسّن الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-treatments-accessibility/"
review_labels:
  MC-P05-035: { en: "Decorative images get empty alt text", ar: "الصور الزخرفية نصّها البديل فارغ" }
  MC-P05-036: { en: "Clickable images say the action", ar: "الصور القابلة للضغط تقول الإجراء" }
  MC-P05-037: { en: "Informative images say the message", ar: "الصور التي تحمل معلومة تقول الرسالة" }
  MC-P05-038: { en: "Short, key words first, no \"image of\"", ar: "قصير، والكلمات المهمة أولًا، بلا «صورة لـ»" }
  MC-P05-039: { en: "Don't repeat the caption", ar: "لا تكرّر التعليق المكتوب" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Image, image, image…\"", ar: "«صورة، صورة، صورة…»" }
    body:
      en: "Our clinic's website has many images. A blind patient told us his screen reader keeps reading long descriptions of photos, and he gives up before he finds the booking button.\n\nThe text a screen reader reads for an image is called alt text."
      ar: "في موقع عيادتنا صور كثيرة. وأخبرنا مريض كفيف أن قارئ الشاشة يظل يقرأ له أوصافًا طويلة للصور، فيتوقّف قبل أن يصل إلى زر الحجز.\n\nالنص الذي يقرؤه قارئ الشاشة للصورة اسمه النص البديل (Alt text)."
    mock:
      reader: { en: "Image of a smiling young woman with a headset sitting at a white reception desk with green plants behind her.", ar: "صورة لشابة مبتسمة تضع سماعة وتجلس على مكتب استقبال أبيض وخلفها نباتات خضراء." }
      app: raha
      frame: wide
      url: raha.example
      navbar: { links: [ { en: "Doctors", ar: "الأطباء" }, { en: "Services", ar: "الخدمات" } ], actions: [ { icon: phone } ] }
      blocks:
        - { kind: image, art: woman-1, text: { en: "Smiling receptionist at a desk", ar: "موظفة استقبال مبتسمة على مكتب" } }
        - { kind: button, text: { en: "Book a visit", ar: "احجز موعدًا" }, gap: m }

  - id: S02
    type: choose
    skill: SK-P05-U04-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Write Alt Text (NN/g): an image is decorative if people can do every task and understand everything without it. Its alt text should be empty so the screen reader skips it."
      ar: "جرّب أولًا. اكتب النص البديل (NN/g): الصورة زخرفية إذا استطاع الناس إنجاز كل مهمة وفهم كل شيء بدونها. ونصّها البديل يجب أن يكون فارغًا ليتخطّاها قارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/write-alt-text/", quote: "An image is decorative if users can complete all tasks and understand all information on the page without it." }
    scenario:
      en: "The receptionist photo is there to make the page feel friendly. It tells patients nothing they need."
      ar: "صورة موظفة الاستقبال موجودة لتجعل الصفحة ودودة. ولا تخبر المرضى بأي شيء يحتاجونه."
    prompt:
      en: "What should the photo's alt text be?"
      ar: "ماذا يجب أن يكون النص البديل (Alt text) للصورة؟"
    options:
      - { id: more, text: { en: "A fuller description, so blind patients don't miss anything", ar: "وصف أكمل، حتى لا يفوت المرضى المكفوفين أي شيء" } }
      - { id: short, text: { en: "\"Receptionist.\"", ar: "«موظفة استقبال.»" } }
      - { id: empty, text: { en: "Empty, so the screen reader skips the photo", ar: "فارغ، ليتخطّى قارئ الشاشة الصورة" } }
    answer: [empty]
    misconceptions:
      - id: MC-P05-035
        when: [more, short]
        feedback:
          en: "The photo carries no information patients need. Any alt text only adds words they must listen to before reaching the booking button."
          ar: "الصورة لا تحمل معلومة يحتاجها المرضى. وأي نص بديل يضيف كلمات عليهم سماعها قبل الوصول إلى زر الحجز."
    hints:
      - { en: "Does a patient need this photo to book a visit?", ar: "هل يحتاج المريض هذه الصورة ليحجز موعدًا؟" }
      - { en: "Which option saves the patient's time?", ar: "أي خيار يوفّر وقت المريض؟" }
    correct:
      en: "Right. Decorative images should be skipped."
      ar: "صحيح. الصور الزخرفية يجب أن تُتخطّى."
    explain:
      en: "Empty alt text doesn't hide anything useful. It saves screen reader users time for what matters."
      ar: "النص البديل الفارغ لا يُخفي شيئًا مفيدًا. بل يوفّر وقت مستخدم قارئ الشاشة لما يهمّه."

  - id: S03
    type: card
    part: concept
    icons: [none, tap, idea, text, cut]
    title: { en: "Three kinds of images", ar: "ثلاثة أنواع من الصور" }
    body:
      en: "Ask: why is this image here?\n\n- **Decorative (for looks):** leave the alt text empty, so the screen reader skips it.\n- **Clickable (a link or button):** say what happens, not what it looks like. A 📞 icon: \"Call the clinic.\"\n- **Informative (it tells something):** say the message it adds. If it has important words, include them.\n- **Short:** about 150 characters or less, key words first. Don't start with \"image of\"; the screen reader already says it's an image.\n- **No repeats:** if the caption already says it, don't say it again in the alt text."
      ar: "اسأل: لماذا هذه الصورة هنا؟\n\n- **زخرفية (Decorative، للشكل فقط):** اترك النص البديل فارغًا، ليتخطّاها قارئ الشاشة.\n- **قابلة للضغط (رابط أو زر):** قل ماذا يحدث، لا كيف تبدو. أيقونة 📞: «اتصل بالعيادة.»\n- **تحمل معلومة:** قل الرسالة التي تضيفها. وإذا كان فيها كلمات مهمة، اكتبها.\n- **قصير:** نحو 150 حرفًا أو أقل، والكلمات المهمة أولًا. ولا تبدأ بـ «صورة لـ»؛ فقارئ الشاشة يقول إنها صورة أصلًا.\n- **بلا تكرار:** إذا كان التعليق المكتوب تحت الصورة يقول المعنى، فلا تكرّره في النص البديل."

  - id: S04
    type: choose
    skill: SK-P05-U04-01
    part: guided
    rules: [R06]
    value:
      en: "Write Alt Text (NN/g): alt text for functional images should not describe the image; it should describe what happens when it's clicked or tapped."
      ar: "اكتب النص البديل (NN/g): النص البديل للصور الوظيفية لا يصف الصورة؛ بل يصف ما يحدث عند الضغط عليها."
    ref: { url: "https://www.nngroup.com/articles/write-alt-text/", quote: "Alt text for functional images should not describe the image; instead, it should describe what will happen when the image is clicked or tapped." }
    scenario:
      en: "At the top of every page, there's a 📞 icon with no words. Tapping it calls the clinic."
      ar: "في أعلى كل صفحة أيقونة 📞 بدون كلمات. والضغط عليها يتصل بالعيادة."
    prompt:
      en: "What should the icon's alt text be?"
      ar: "ماذا يجب أن يكون النص البديل للأيقونة؟"
    mock:
      app: raha
      frame: wide
      url: raha.example
      navbar:
        links: [ { en: "Doctors", ar: "الأطباء" }, { en: "Services", ar: "الخدمات" } ]
        actions: [ { icon: phone, aria: { en: "Call the clinic", ar: "اتصل بالعيادة" } } ]
      blocks:
        - { kind: image, art: clinic }
        - { kind: heading, text: { en: "Care close to home", ar: "رعاية قريبة منك" }, gap: s }
        - { kind: button, icon: calendar-plus, text: { en: "Book a visit", ar: "احجز زيارة" }, gap: s }
    options:
      - { id: call, text: { en: "\"Call the clinic.\"", ar: "«اتصل بالعيادة.»" } }
      - { id: icon, text: { en: "\"Green phone icon.\"", ar: "«أيقونة هاتف خضراء.»" } }
      - { id: none, text: { en: "Empty; it's only an icon", ar: "فارغ؛ إنها مجرد أيقونة" } }
    answer: [call]
    misconceptions:
      - id: MC-P05-036
        when: [icon]
        feedback:
          en: "Patients don't need to know it's green. They need to know what tapping it does."
          ar: "المريض لا يحتاج أن يعرف أنها خضراء. يحتاج أن يعرف ماذا يحدث حين يضغطها."
      - id: MC-P05-036
        when: [none]
        feedback:
          en: "This icon does something and has no words next to it. Empty alt text would leave a button with no name."
          ar: "هذه الأيقونة تفعل شيئًا، وليس بجانبها كلمات. والنص البديل الفارغ يترك زرًا بلا اسم."
    hints:
      - { en: "Is this image only for looks, or does it do something?", ar: "هل هذه الصورة للشكل فقط، أم تفعل شيئًا؟" }
      - { en: "For clickable images, say what happens.", ar: "للصور القابلة للضغط، قل ماذا يحدث." }
    correct:
      en: "Right. Say the action, not the look."
      ar: "صحيح. قل الإجراء، لا الشكل."
    explain:
      en: "A clickable image is a button. Its alt text is the button's name."
      ar: "الصورة القابلة للضغط زر. ونصّها البديل هو اسم الزر."

  - id: S05
    type: choose
    skill: SK-P05-U04-02
    part: guided
    rules: [R06]
    value:
      en: "5 Visual Treatments (NN/g): alt text should not replicate the caption, since the screen reader reads both. Here the caption already says everything."
      ar: "5 معالجات بصرية (NN/g): النص البديل يجب ألا يكرّر التعليق المكتوب، لأن قارئ الشاشة يقرأ الاثنين. وهنا التعليق يقول كل شيء."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "The ALT text should not replicate the caption of the image (since both will be read by the screen reader)." }
    scenario:
      en: "On the \"Our doctors\" page, each photo has a caption under it with the doctor's name and specialty."
      ar: "في صفحة «أطباؤنا»، تحت كل صورة تعليق مكتوب فيه اسم الطبيب وتخصّصه."
    prompt:
      en: "What should the alt text of Dr. Salma's photo be?"
      ar: "ماذا يجب أن يكون النص البديل لصورة د. سلمى؟"
    mock:
      app: raha
      frame: wide
      url: raha.example/doctors
      navbar: { links: [ { en: "Doctors", ar: "الأطباء" }, { en: "Services", ar: "الخدمات" } ], active: 0, actions: [ { icon: phone } ] }
      blocks:
        - { kind: image, art: doctor }
        - { kind: meta, text: { en: "Dr. Salma Adel, children's doctor", ar: "د. سلمى عادل، طبيبة أطفال" }, gap: xs }
    options:
      - { id: repeat, text: { en: "\"Dr. Salma Adel, children's doctor.\"", ar: "«د. سلمى عادل، طبيبة أطفال.»" } }
      - { id: empty, text: { en: "Empty, because the caption already says who she is", ar: "فارغ، لأن التعليق يقول من هي أصلًا" } }
      - { id: photo, text: { en: "\"Photo of a doctor.\"", ar: "«صورة طبيبة.»" } }
    answer: [empty]
    misconceptions:
      - id: MC-P05-039
        when: [repeat]
        feedback:
          en: "The screen reader reads the alt text and then the caption, so patients would hear the same line twice."
          ar: "قارئ الشاشة يقرأ النص البديل ثم التعليق، فيسمع المريض نفس السطر مرتين."
      - id: MC-P05-038
        when: [photo]
        feedback:
          en: "\"Photo of\" adds nothing; the screen reader already says it's an image. And the caption already names her."
          ar: "«صورة» لا تضيف شيئًا؛ فقارئ الشاشة يقول إنها صورة أصلًا. والتعليق يذكر اسمها بالفعل."
    hints:
      - { en: "What will the screen reader read right after the photo?", ar: "ماذا سيقرأ قارئ الشاشة بعد الصورة مباشرة؟" }
      - { en: "Does the photo add anything the caption doesn't say?", ar: "هل تضيف الصورة شيئًا لا يقوله التعليق؟" }
    correct:
      en: "Right. The caption does the job; no need to say it twice."
      ar: "صحيح. التعليق يكفي؛ لا داعي لتكرار المعنى مرتين."
    explain:
      en: "Alt text is for what the image adds. When the words next to it already say it, leave the alt text empty."
      ar: "النص البديل لما تضيفه الصورة. وحين تقول الكلمات بجانبها المعنى، اترك النص البديل فارغًا."

  - id: S06
    type: compare
    skill: SK-P05-U04-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: a vague label vs the image's words. Write Alt Text (NN/g): if an image's text is short and important to its message, include the exact words in the alt text."
      ar: "مقارنة: وصف عام مقابل كلمات الصورة. اكتب النص البديل (NN/g): إذا كان نص الصورة قصيرًا ومهمًا لرسالتها، فاكتب نفس الكلمات في النص البديل."
    ref: { url: "https://www.nngroup.com/articles/write-alt-text/", quote: "If the text is short enough to fit with about 150 characters and is an important part of the image's message, include the exact words in the alt text." }
    scenario:
      en: "Our opening hours are shown only as an image on the home page. Two people wrote its alt text."
      ar: "مواعيد العمل عندنا معروضة كصورة فقط في الصفحة الرئيسية. وكتب شخصان النص البديل لها."
    prompt:
      en: "Which alt text lets a blind patient know when to come?"
      ar: "أي نص بديل يجعل المريض الكفيف يعرف متى يأتي؟"
    a:
      label: { en: "A: \"Image showing our opening hours.\"", ar: "A: «صورة تعرض مواعيد العمل.»" }
      mock:
        reader: { en: "Image showing our opening hours.", ar: "صورة تعرض مواعيد العمل." }
        app: raha
        frame: wide
        url: raha.example
        navbar: { links: [ { en: "Doctors", ar: "الأطباء" }, { en: "Services", ar: "الخدمات" } ], actions: [ { icon: phone } ] }
        blocks:
          - { kind: image, size: s, text: { en: "Sun–Thu 9:00–21:00 · Fri–Sat closed", ar: "الأحد–الخميس 9:00–21:00 · الجمعة والسبت مغلق" } }
    b:
      label: { en: "B: \"Open Sunday to Thursday, 9:00 to 21:00. Closed Friday and Saturday.\"", ar: "B: «مفتوح من الأحد إلى الخميس، من 9:00 إلى 21:00. مغلق الجمعة والسبت.»" }
      mock:
        reader: { en: "Open Sunday to Thursday, 9:00 to 21:00. Closed Friday and Saturday.", ar: "مفتوح من الأحد إلى الخميس، من 9:00 إلى 21:00. مغلق الجمعة والسبت." }
        app: raha
        frame: wide
        url: raha.example
        navbar: { links: [ { en: "Doctors", ar: "الأطباء" }, { en: "Services", ar: "الخدمات" } ], actions: [ { icon: phone } ] }
        blocks:
          - { kind: image, size: s, text: { en: "Sun–Thu 9:00–21:00 · Fri–Sat closed", ar: "الأحد–الخميس 9:00–21:00 · الجمعة والسبت مغلق" } }
    answer: b
    reason:
      prompt: { en: "Why is B better?", ar: "لماذا B أفضل؟" }
      options:
        - { id: words, text: { en: "The words in the image are the message, and they fit in one short line", ar: "كلمات الصورة هي الرسالة، ويمكن كتابتها في سطر قصير واحد" } }
        - { id: long, text: { en: "Longer alt text is always better", ar: "النص البديل الأطول أفضل دائمًا" } }
        - { id: image, text: { en: "A says \"image\", which screen readers can't read", ar: "A يقول «صورة»، وقارئ الشاشة لا يستطيع قراءتها" } }
      answer: [words]
      misconceptions:
        - id: MC-P05-037
          when: [long, image]
          feedback:
            en: "The point is the message. The hours are the reason the image is there, and they're short enough to say in full."
            ar: "المهم هو الرسالة. المواعيد هي سبب وجود الصورة، وهي قصيرة بما يكفي لتُقال كاملة."
    misconceptions:
      - id: MC-P05-037
        when: [a]
        feedback:
          en: "A says there are hours, but not what they are. The patient still doesn't know when to come."
          ar: "A يقول إن هناك مواعيد، لكن لا يقول ما هي. وما زال المريض لا يعرف متى يأتي."
    hints:
      - { en: "Listen to each one. Do you know when the clinic is open?", ar: "استمع إلى كل واحد. هل تعرف متى تفتح العيادة؟" }
      - { en: "Which one gives the message the image carries?", ar: "أي واحد يعطي الرسالة التي تحملها الصورة؟" }
    correct:
      en: "Right. Say the message, not \"there is an image\"."
      ar: "صحيح. قل الرسالة، لا «توجد صورة»."
    explain:
      en: "When an image holds important words, those words are the alt text. Better still, show them as real text on the page."
      ar: "حين تحمل الصورة كلمات مهمة، فهذه الكلمات هي النص البديل. والأفضل أن تعرضها كنص حقيقي في الصفحة."

  - id: S07
    type: choose
    skill: SK-P05-U04-01
    part: independent
    speaker: sara
    rules: [R14]
    value:
      en: "New case. Write Alt Text (NN/g): the same logo needs different alt text by context. A logo that links to the home page should describe that function: \"[Name] home.\""
      ar: "حالة جديدة. اكتب النص البديل (NN/g): نفس الشعار يحتاج نصًا بديلًا مختلفًا حسب السياق. والشعار الذي يربط بالصفحة الرئيسية يجب أن يصف هذه الوظيفة: «الصفحة الرئيسية لـ [الاسم].»"
    ref: { url: "https://www.nngroup.com/articles/write-alt-text/", quote: "The UT Austin logo in the top left corner links back to the homepage. The alt text should describe this function." }
    scenario:
      en: "I'm designing an insurance company's website. The logo at the top of every page links to the home page. A developer wrote its alt text."
      ar: "أصمّم موقع شركة تأمين. والشعار في أعلى كل صفحة يربط بالصفحة الرئيسية. وكتب أحد المطوّرين نصّه البديل."
    prompt:
      en: "Which alt text should the logo have?"
      ar: "أي نص بديل يجب أن يكون للشعار؟"
    mock:
      reader: { en: "Logo of Aman, a blue shield with a tick inside.", ar: "شعار أمان، درع أزرق وبداخله علامة صح." }
      app: aman
      frame: wide
      url: aman.example/car-insurance
      navbar:
        links: [ { en: "Car", ar: "السيارات" }, { en: "Health", ar: "الصحة" }, { en: "Claims", ar: "المطالبات" } ]
        active: 0
      blocks:
        - { kind: heading, text: { en: "Car insurance from 250 EGP a month", ar: "تأمين السيارات من 250 جنيهًا شهريًا" } }
        - { kind: image, art: car, gap: s }
        - { kind: button, text: { en: "Get a quote", ar: "اعرف السعر" }, gap: s }
    options:
      - { id: keep, text: { en: "Keep it; it describes the logo well", ar: "يبقى كما هو؛ فهو يصف الشعار جيدًا" } }
      - { id: home, text: { en: "\"Aman home.\"", ar: "«الصفحة الرئيسية لأمان.»" } }
      - { id: empty, text: { en: "Empty; logos are decorative", ar: "فارغ؛ فالشعارات زخرفية" } }
    answer: [home]
    misconceptions:
      - id: MC-P05-036
        when: [keep]
        feedback:
          en: "Here the logo is a link. People need to know where it goes, not what the shield looks like."
          ar: "الشعار هنا رابط. والناس يحتاجون أن يعرفوا إلى أين يذهب، لا شكل الدرع."
      - id: MC-P05-035
        when: [empty]
        feedback:
          en: "This logo does something: it goes home. Empty alt text would leave a link with no name."
          ar: "هذا الشعار يفعل شيئًا: يذهب إلى الصفحة الرئيسية. والنص البديل الفارغ يترك رابطًا بلا اسم."
    hints:
      - { en: "What happens when someone taps the logo?", ar: "ماذا يحدث حين يضغط أحد على الشعار؟" }
      - { en: "For clickable images, say the action.", ar: "للصور القابلة للضغط، قل الإجراء." }
    correct:
      en: "Right. A linked logo says where it goes."
      ar: "صحيح. الشعار المرتبط برابط يقول إلى أين يذهب."
    explain:
      en: "Ask why the image is there. In the header, the logo is a home link, so its alt text names the destination."
      ar: "اسأل لماذا الصورة هنا. في رأس الصفحة، الشعار رابط للصفحة الرئيسية، فنصّه البديل يذكر الوجهة."

