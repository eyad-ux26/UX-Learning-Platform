id: P05
title:
  en: "Make UX Accessible"
  ar: "تصميم يناسب الجميع (Accessibility)"
subtitle:
  en: "Find and remove the barriers that stop people with disabilities, older users and everyone else from finishing their tasks."
  ar: "اكتشف العوائق التي تمنع ذوي الإعاقة وكبار السن وغيرهم من إكمال مهامهم، وأزِلها."
