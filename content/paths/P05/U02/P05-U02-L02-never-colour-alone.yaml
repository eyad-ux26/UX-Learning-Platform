id: P05-U02-L02
mode: lesson
minutes: 7
title:
  en: "Colour can't be the only sign"
  ar: "لا تجعل اللون العلامة الوحيدة"
summary:
  en: "Add a second sign to colour on order dots, links, seats and a calendar."
  ar: "أضف علامة ثانية إلى اللون في نقاط الطلبات والروابط والمقاعد والتقويم."
speaker: karim
sources:
  - title: { en: "5 Visual Treatments that Improve Accessibility (NN/g)", ar: "5 معالجات بصرية تحسّن الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-treatments-accessibility/"
  - title: { en: "Guidelines for Visualizing Links (NN/g)", ar: "إرشادات لإظهار الروابط (NN/g)" }
    url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/"
review_labels:
  MC-P05-018: { en: "Colour alone can't carry meaning", ar: "اللون وحده لا يكفي لنقل المعنى" }
  MC-P05-019: { en: "A colour legend is still colour alone", ar: "مفتاح الألوان ما زال يعتمد على اللون وحده" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Which order is late?", ar: "أي طلب متأخر؟" }
    body:
      en: "I'm building order tracking for a pharmacy app. Each order has a dot: green means delivered, orange means on the way, red means late.\n\nSome customers still call to ask which of their orders is late."
      ar: "أصمّم صفحة متابعة الطلبات في تطبيق صيدلية. لكل طلب نقطة: الأخضر يعني تم التوصيل، والبرتقالي يعني في الطريق، والأحمر يعني متأخر.\n\nومع ذلك، يتصل بعض العملاء ليسألوا: أي طلباتهم متأخر؟"
    mock:
      app: nasij
      blocks: &ordersnow
        - { kind: heading, text: { en: "My orders", ar: "طلباتي" } }
        - kind: row
          gap: s
          blocks:
            - { kind: meta, text: { en: "Order 1042", ar: "طلب 1042" } }
            - { kind: text, color: green, text: "●" }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "Order 1043", ar: "طلب 1043" } }
            - { kind: text, color: red, text: "●" }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "Order 1044", ar: "طلب 1044" } }
            - { kind: text, color: orange, text: "●" }

  - id: S02
    type: tune
    skill: SK-P05-U02-03
    part: try
    rules: [R12]
    value:
      en: "Try first. 5 Visual Treatments (NN/g): people with colour blindness or low vision may not tell apart things that differ by colour alone. A word next to the dot works for everyone."
      ar: "جرّب أولًا. 5 معالجات بصرية (NN/g): من لا يميّزون الألوان أو نظرهم ضعيف قد لا يفرّقون بين عناصر تختلف في اللون فقط. والكلمة بجانب النقطة تناسب الجميع."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "Individuals who have color blindness or low visual acuity may not be able to distinguish between elements differentiated by color alone." }
    prompt:
      en: "Tap each option to see the change. Which one lets every customer see which order is late?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل كل العملاء يعرفون أي طلب متأخر؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: nasij
      blocks: *ordersnow
    options:
      - id: bright
        text: { en: "Use stronger, brighter colours for the dots", ar: "استخدم ألوانًا أقوى وأوضح للنقاط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nasij
          blocks:
            - { kind: heading, text: { en: "My orders", ar: "طلباتي" } }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: { en: "Order 1042", ar: "طلب 1042" } }
                - { kind: text, color: green, weight: bold, px: 22, text: "●" }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1043", ar: "طلب 1043" } }
                - { kind: text, color: red, weight: bold, px: 22, text: "●" }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1044", ar: "طلب 1044" } }
                - { kind: text, color: orange, weight: bold, px: 22, text: "●" }
      - id: legend
        text: { en: "Add a line on top: \"Green: delivered · Orange: on the way · Red: late\"", ar: "أضف سطرًا في الأعلى: «أخضر: تم التوصيل · برتقالي: في الطريق · أحمر: متأخر»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nasij
          blocks:
            - { kind: heading, text: { en: "My orders", ar: "طلباتي" } }
            - { kind: small, color: muted, text: { en: "Green: delivered · Orange: on the way · Red: late", ar: "أخضر: تم التوصيل · برتقالي: في الطريق · أحمر: متأخر" }, gap: xs }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: { en: "Order 1042", ar: "طلب 1042" } }
                - { kind: text, color: green, text: "●" }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1043", ar: "طلب 1043" } }
                - { kind: text, color: red, text: "●" }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1044", ar: "طلب 1044" } }
                - { kind: text, color: orange, text: "●" }
      - id: word
        text: { en: "Write the status next to each dot", ar: "اكتب الحالة بجانب كل نقطة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nasij
          blocks:
            - { kind: heading, text: { en: "My orders", ar: "طلباتي" } }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: { en: "Order 1042", ar: "طلب 1042" } }
                - { kind: chip, text: { en: "● Delivered", ar: "● تم التوصيل" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1043", ar: "طلب 1043" } }
                - { kind: chip, tone: bad, text: { en: "● Late", ar: "● متأخر" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: meta, text: { en: "Order 1044", ar: "طلب 1044" } }
                - { kind: chip, tone: warn, text: { en: "● On the way", ar: "● في الطريق" } }
    answer: [word]
    misconceptions:
      - id: MC-P05-018
        when: [bright]
        feedback:
          en: "Brighter red is still red. Someone who can't tell red from green still sees three dots that look the same."
          ar: "الأحمر الأقوى ما زال أحمر. ومن لا يفرّق بين الأحمر والأخضر يرى ثلاث نقاط متشابهة."
      - id: MC-P05-019
        when: [legend]
        feedback:
          en: "The line explains the colours, but customers still have to tell the colours apart to use it."
          ar: "السطر يشرح الألوان، لكن العميل ما زال يحتاج أن يميّز الألوان ليستفيد منه."
    hints:
      - { en: "Imagine the three dots all look the same colour to you.", ar: "تخيّل أن النقاط الثلاث تبدو لك بنفس اللون." }
      - { en: "Which option tells you the status without seeing any colour?", ar: "أي خيار يخبرك بالحالة دون أن ترى أي لون؟" }
    correct:
      en: "Right. Now the word says it, and the colour just helps."
      ar: "صحيح. الآن الكلمة تقول الحالة، واللون مجرد مساعدة."
    explain:
      en: "Many people can't tell some colours apart, like red and green. A second sign, such as a word, works for everyone."
      ar: "كثير من الناس لا يميّزون بعض الألوان، مثل الأحمر والأخضر. والعلامة الثانية، مثل كلمة، تناسب الجميع."

  - id: S03
    type: card
    part: concept
    icons: [color, ok, text, eye]
    title: { en: "Colour helps, but never alone", ar: "اللون يساعد، لكن ليس وحده" }
    body:
      en: "Some people can't tell certain colours apart, like red and green. Others see colours weakly.\n\n- **Add a second sign:** a word, an icon, a ✕ or ✓, or a line or pattern.\n- **Different words are enough:** \"Paid\" in green and \"Unpaid\" in red is fine. The words already differ.\n- **Links inside text:** underline them. A link shown only by its colour is easy to miss.\n- **The grayscale test:** turn the screen to black and white (grayscale). If you still understand everything, it works."
      ar: "بعض الناس لا يميّزون ألوانًا معيّنة، مثل الأحمر والأخضر. وآخرون يرون الألوان ضعيفة.\n\n- **أضف علامة ثانية:** كلمة، أو أيقونة، أو ✕ أو ✓، أو خط أو نقش.\n- **الكلمات المختلفة تكفي:** «مدفوع» بالأخضر و«غير مدفوع» بالأحمر لا مشكلة فيهما. فالكلمتان مختلفتان أصلًا.\n- **الروابط داخل النص:** ضع تحتها خطًا. فالرابط الذي يظهر بلونه فقط قد لا يلاحظه القارئ.\n- **اختبار الأبيض والأسود:** حوّل الشاشة إلى الأبيض والأسود (Grayscale). إذا ظللت تفهم كل شيء، فالتصميم جيد."

  - id: S04
    type: tune
    skill: SK-P05-U02-03
    part: guided
    rules: [R06]
    value:
      en: "Guidelines for Visualizing Links (NN/g): underlined links matter for low-vision users, and underlining is essential when links are red or green."
      ar: "إرشادات لإظهار الروابط (NN/g): الخط تحت الرابط مهم لضعاف النظر، وهو ضروري إذا كان لون الروابط أحمر أو أخضر."
    ref: { url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/", quote: "underlined links are important for low-vision users' accessibility" }
    scenario:
      en: "In the app's help page, a sentence has a link to the return guide. The link is only purple; it has no underline. The screens below are shown in grayscale."
      ar: "في صفحة المساعدة بالتطبيق، توجد جملة فيها رابط إلى دليل الإرجاع. الرابط بنفسجي فقط، وليس تحته خط. والشاشات بالأسفل معروضة بالأبيض والأسود."
    prompt:
      en: "Tap each option to see the change. Which one still shows the link in grayscale?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُبقي الرابط واضحًا بالأبيض والأسود؟"
    mock:
      caption: { en: "Now, in grayscale", ar: "الآن، بالأبيض والأسود" }
      app: nasij
      appbar: { title: { en: "Help", ar: "المساعدة" }, back: true }
      gray: true
      blocks: &helpnow
        - { kind: heading, text: { en: "Returns", ar: "الإرجاع" } }
        - { kind: text, text: { en: "You can return most items within 14 days. To start, read", ar: "يمكنك إرجاع أغلب المنتجات خلال 14 يومًا. لتبدأ، اقرأ" }, gap: s }
        - { kind: text, color: brand, text: { en: "our return guide.", ar: "دليل الإرجاع." }, gap: xs }
    options:
      - id: red
        text: { en: "Make the link red, so it stands out more", ar: "اجعل الرابط أحمر، ليبرز أكثر" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          app: nasij
          appbar: { title: { en: "Help", ar: "المساعدة" }, back: true }
          gray: true
          blocks:
            - { kind: heading, text: { en: "Returns", ar: "الإرجاع" } }
            - { kind: text, text: { en: "You can return most items within 14 days. To start, read", ar: "يمكنك إرجاع أغلب المنتجات خلال 14 يومًا. لتبدأ، اقرأ" }, gap: s }
            - { kind: text, color: red, text: { en: "our return guide.", ar: "دليل الإرجاع." }, gap: xs }
      - id: underline
        text: { en: "Keep it purple and underline it", ar: "أبقِه بنفسجيًا وضع تحته خطًا" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          app: nasij
          appbar: { title: { en: "Help", ar: "المساعدة" }, back: true }
          gray: true
          blocks:
            - { kind: heading, text: { en: "Returns", ar: "الإرجاع" } }
            - { kind: text, text: { en: "You can return most items within 14 days. To start, read", ar: "يمكنك إرجاع أغلب المنتجات خلال 14 يومًا. لتبدأ، اقرأ" }, gap: s }
            - { kind: link, text: { en: "our return guide.", ar: "دليل الإرجاع." }, gap: xs }
      - id: keep
        text: { en: "Change nothing; purple is our brand's link colour", ar: "لا تغيّر شيئًا؛ البنفسجي هو لون الروابط في هويتنا" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          app: nasij
          appbar: { title: { en: "Help", ar: "المساعدة" }, back: true }
          gray: true
          blocks: *helpnow
    answer: [underline]
    misconceptions:
      - id: MC-P05-018
        when: [red, keep]
        feedback:
          en: "In grayscale, the link looks like the rest of the sentence. A link needs a sign that isn't colour, like an underline."
          ar: "بالأبيض والأسود، يبدو الرابط مثل باقي الجملة. فالرابط يحتاج علامة غير اللون، مثل خط تحته."
    hints:
      - { en: "In the grayscale screens, can you find the link?", ar: "في الشاشات بالأبيض والأسود، هل تجد الرابط؟" }
      - { en: "Which option adds something that isn't a colour?", ar: "أي خيار يضيف شيئًا ليس لونًا؟" }
    correct:
      en: "Right. The underline shows the link even without colour."
      ar: "صحيح. الخط يُظهر الرابط حتى بدون لون."
    explain:
      en: "An underline is the clearest sign of a link inside text. Red or green links are the worst choice, because those are the colours many people confuse."
      ar: "الخط تحت الكلمة هو أوضح علامة للرابط داخل النص. والروابط الحمراء أو الخضراء أسوأ اختيار، لأن كثيرين يخلطون بين هذين اللونين."

  - id: S05
    type: tune
    skill: SK-P05-U02-03
    part: guided
    rules: [R06]
    value:
      en: "5 Visual Treatments (NN/g): use cues beyond colour, such as strokes or patterns, for important information. A ✕ on taken seats is such a cue."
      ar: "5 معالجات بصرية (NN/g): استخدم علامات غير اللون، مثل الخطوط أو النقوش، للمعلومات المهمة. والعلامة ✕ على المقاعد المحجوزة مثال على ذلك."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "It is thus important to use additional cues (such as strokes, patterns) to communicate important information." }
    scenario:
      en: "A cinema app shows a seat map. Free seats are green and taken seats are red."
      ar: "تطبيق سينما يعرض خريطة المقاعد. المقاعد الفارغة خضراء، والمحجوزة حمراء."
    prompt:
      en: "Tap each option to see the change. Which one lets every customer see which seats are taken?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل كل العملاء يعرفون المقاعد المحجوزة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: shasha
      appbar: { title: { en: "Pick your seats", ar: "اختر مقاعدك" }, back: true }
      blocks: &seatsnow
        - { kind: small, color: muted, text: { en: "Screen this way", ar: "الشاشة في هذا الاتجاه" } }
        - kind: row
          gap: s
          blocks:
            - { kind: chip, tone: bad, text: "A1" }
            - { kind: chip, text: "A2" }
            - { kind: chip, text: "A3" }
            - { kind: chip, tone: bad, text: "A4" }
        - kind: row
          gap: xs
          blocks:
            - { kind: chip, text: "B1" }
            - { kind: chip, tone: bad, text: "B2" }
            - { kind: chip, tone: bad, text: "B3" }
            - { kind: chip, text: "B4" }
    options:
      - id: cross
        text: { en: "Show taken seats as grey with a ✕ instead of a number", ar: "اعرض المقاعد المحجوزة باللون الرمادي مع ✕ بدل الرقم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick your seats", ar: "اختر مقاعدك" }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Screen this way", ar: "الشاشة في هذا الاتجاه" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, tone: off, text: "✕" }
                - { kind: chip, text: "A2" }
                - { kind: chip, text: "A3" }
                - { kind: chip, tone: off, text: "✕" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, text: "B1" }
                - { kind: chip, tone: off, text: "✕" }
                - { kind: chip, tone: off, text: "✕" }
                - { kind: chip, text: "B4" }
      - id: darker
        text: { en: "Use a darker green and a darker red", ar: "استخدم أخضر أغمق وأحمر أغمق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick your seats", ar: "اختر مقاعدك" }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Screen this way", ar: "الشاشة في هذا الاتجاه" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, tone: bad, weight: bold, text: "A1" }
                - { kind: chip, tone: dark, text: "A2" }
                - { kind: chip, tone: dark, text: "A3" }
                - { kind: chip, tone: bad, weight: bold, text: "A4" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, tone: dark, text: "B1" }
                - { kind: chip, tone: bad, weight: bold, text: "B2" }
                - { kind: chip, tone: bad, weight: bold, text: "B3" }
                - { kind: chip, tone: dark, text: "B4" }
      - id: legend
        text: { en: "Add a key under the map: \"Green: free · Red: taken\"", ar: "أضف مفتاحًا للألوان تحت الخريطة: «أخضر: فارغ · أحمر: محجوز»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick your seats", ar: "اختر مقاعدك" }, back: true }
          blocks:
            - { kind: small, color: muted, text: { en: "Screen this way", ar: "الشاشة في هذا الاتجاه" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, tone: bad, text: "A1" }
                - { kind: chip, text: "A2" }
                - { kind: chip, text: "A3" }
                - { kind: chip, tone: bad, text: "A4" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, text: "B1" }
                - { kind: chip, tone: bad, text: "B2" }
                - { kind: chip, tone: bad, text: "B3" }
                - { kind: chip, text: "B4" }
            - { kind: small, color: muted, text: { en: "Green: free · Red: taken", ar: "أخضر: فارغ · أحمر: محجوز" }, gap: s }
    answer: [cross]
    misconceptions:
      - id: MC-P05-018
        when: [darker]
        feedback:
          en: "Darker red and green are still red and green. People who confuse them still see one colour."
          ar: "الأحمر والأخضر الأغمق ما زالا أحمر وأخضر. ومن يخلط بينهما ما زال يرى لونًا واحدًا."
      - id: MC-P05-019
        when: [legend]
        feedback:
          en: "The key only explains the colours. To use it, you still have to tell red from green."
          ar: "المفتاح يشرح الألوان فقط. ولتستفيد منه، ما زلت تحتاج أن تفرّق بين الأحمر والأخضر."
    hints:
      - { en: "Picture the map with red and green looking the same.", ar: "تخيّل الخريطة والأحمر والأخضر يبدوان بنفس اللون." }
      - { en: "Which option changes the shape on the seat, not only its colour?", ar: "أي خيار يغيّر الشكل على المقعد، لا لونه فقط؟" }
    correct:
      en: "Right. The ✕ shows a taken seat without any colour."
      ar: "صحيح. العلامة ✕ تُظهر المقعد المحجوز بدون أي لون."
    explain:
      en: "A key that explains colours doesn't help people who can't see the colours. Change the seat itself."
      ar: "مفتاح الألوان لا يفيد من لا يرى الألوان. غيّر المقعد نفسه."

  - id: S06
    type: compare
    skill: SK-P05-U02-03
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: coloured words vs coloured bars. Guidelines for Visualizing Links (NN/g): green \"okay\" and red \"error\" are fine, because the different words are the extra cue."
      ar: "مقارنة: كلمات ملوّنة مقابل أشرطة ملوّنة. إرشادات لإظهار الروابط (NN/g): «تم» بالأخضر و«خطأ» بالأحمر لا مشكلة فيهما، لأن اختلاف الكلمات هو العلامة الإضافية."
    ref: { url: "https://www.nngroup.com/articles/guidelines-for-visualizing-links/", quote: "The fact that the word meanings are clearly different provides the required redundant cue for color-blind users." }
    scenario:
      en: "Two designers made the bills screen of a phone company app. You did the grayscale test on both."
      ar: "صمّم مصمّمان شاشة الفواتير في تطبيق شركة اتصالات. وأجريت اختبار الأبيض والأسود على التصميمين."
    prompt:
      en: "In grayscale, which screen still shows which bill is unpaid?"
      ar: "بالأبيض والأسود، أي شاشة ما زالت توضّح أي فاتورة غير مدفوعة؟"
    a:
      label: { en: "A: Each bill has a green or red bar, with no word", ar: "A: لكل فاتورة شريط أخضر أو أحمر، بدون كلمة" }
      mock:
        app: shabaka
        appbar: { title: { en: "Bills", ar: "الفواتير" }, back: true }
        gray: true
        blocks:
          - kind: row
            blocks:
              - { kind: meta, text: { en: "September · 220 EGP", ar: "سبتمبر · 220 جنيه" } }
              - { kind: chip, text: "▬▬" }
          - kind: row
            gap: s
            blocks:
              - { kind: meta, text: { en: "October · 240 EGP", ar: "أكتوبر · 240 جنيه" } }
              - { kind: chip, tone: bad, text: "▬▬" }
    b:
      label: { en: "B: Each bill says \"Paid\" in green or \"Unpaid\" in red", ar: "B: كل فاتورة مكتوب عليها «مدفوعة» بالأخضر أو «غير مدفوعة» بالأحمر" }
      mock:
        app: shabaka
        appbar: { title: { en: "Bills", ar: "الفواتير" }, back: true }
        gray: true
        blocks:
          - kind: row
            blocks:
              - { kind: meta, text: { en: "September · 220 EGP", ar: "سبتمبر · 220 جنيه" } }
              - { kind: chip, text: { en: "Paid", ar: "مدفوعة" } }
          - kind: row
            gap: s
            blocks:
              - { kind: meta, text: { en: "October · 240 EGP", ar: "أكتوبر · 240 جنيه" } }
              - { kind: chip, tone: bad, text: { en: "Unpaid", ar: "غير مدفوعة" } }
    answer: b
    reason:
      prompt: { en: "Why does B pass the test even though it uses red and green?", ar: "لماذا ينجح B في الاختبار مع أنه يستخدم الأحمر والأخضر؟" }
      options:
        - { id: green, text: { en: "Green is easy to see for everyone", ar: "الأخضر سهل الرؤية للجميع" } }
        - { id: words, text: { en: "The words are different, so colour is only extra help", ar: "الكلمات مختلفة، فاللون مجرد مساعدة إضافية" } }
        - { id: chips, text: { en: "Rounded chips are always clearer than bars", ar: "الـ Chips المستديرة أوضح دائمًا من الأشرطة" } }
      answer: [words]
      misconceptions:
        - id: MC-P05-018
          when: [green, chips]
          feedback:
            en: "The shape and colour are the same in A and B. What B adds is a word that means something different."
            ar: "الشكل واللون نفسهما في A وB. ما يضيفه B هو كلمة لها معنى مختلف."
    misconceptions:
      - id: MC-P05-018
        when: [a]
        feedback:
          en: "In grayscale, A's two bars look almost the same. B's words still say \"Paid\" and \"Unpaid\"."
          ar: "بالأبيض والأسود، يبدو الشريطان في A متشابهين تقريبًا. أما كلمات B فما زالت تقول «مدفوعة» و«غير مدفوعة»."
    hints:
      - { en: "Look at both screens. Can you read the bill status in each?", ar: "انظر إلى الشاشتين. هل تستطيع قراءة حالة الفاتورة في كل منهما؟" }
      - { en: "Which screen gives the status in words?", ar: "أي شاشة تعطي الحالة بالكلمات؟" }
    correct:
      en: "Right. Colour is fine when the words already tell the story."
      ar: "صحيح. اللون لا مشكلة فيه حين تقول الكلمات المعنى أصلًا."
    explain:
      en: "You don't have to remove colour. Just make sure it's never the only sign."
      ar: "لست مضطرًا لحذف اللون. فقط تأكّد أنه ليس العلامة الوحيدة أبدًا."

  - id: S07
    type: tune
    skill: SK-P05-U02-03
    part: independent
    speaker: nour
    rules: [R14]
    value:
      en: "New case. 5 Visual Treatments (NN/g): the grayscale trick. If you can't understand the design in grayscale, you need a cue besides colour."
      ar: "حالة جديدة. 5 معالجات بصرية (NN/g): حيلة الأبيض والأسود. إذا لم تفهم التصميم بالأبيض والأسود، فأنت تحتاج علامة غير اللون."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "Turn your design into grayscale and see if you can correctly understand the design." }
    scenario:
      en: "Patients book a doctor at our clinic through a calendar. Days with free times are green. Full days are red."
      ar: "يحجز المرضى موعدًا مع الطبيب في عيادتنا عبر تقويم. الأيام التي فيها مواعيد شاغرة خضراء، والأيام الممتلئة حمراء."
    prompt:
      en: "Tap each option to see the change. Which one lets every patient see which days are full?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل كل المرضى يعرفون الأيام الممتلئة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: raha
      appbar: { title: { en: "Book a visit", ar: "احجز زيارة" }, back: true }
      blocks: &daysnow
        - { kind: heading, text: { en: "Pick a day in November", ar: "اختر يومًا في نوفمبر" } }
        - kind: row
          gap: s
          blocks:
            - { kind: chip, text: "5" }
            - { kind: chip, tone: bad, text: "6" }
            - { kind: chip, text: "7" }
        - kind: row
          gap: xs
          blocks:
            - { kind: chip, tone: bad, text: "8" }
            - { kind: chip, text: "9" }
            - { kind: chip, tone: bad, text: "11" }
    options:
      - id: legend
        text: { en: "Add a key: \"Green: free · Red: full\"", ar: "أضف مفتاحًا للألوان: «أخضر: متاح للحجز · أحمر: ممتلئ»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Book a visit", ar: "احجز زيارة" }, back: true }
          blocks:
            - { kind: heading, text: { en: "Pick a day in November", ar: "اختر يومًا في نوفمبر" } }
            - { kind: small, color: muted, text: { en: "Green: free · Red: full", ar: "أخضر: متاح للحجز · أحمر: ممتلئ" }, gap: xs }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, text: "5" }
                - { kind: chip, tone: bad, text: "6" }
                - { kind: chip, text: "7" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, tone: bad, text: "8" }
                - { kind: chip, text: "9" }
                - { kind: chip, tone: bad, text: "11" }
      - id: full
        text: { en: "Grey out full days and write \"Full\" on them", ar: "اجعل الأيام الممتلئة رمادية واكتب عليها «ممتلئ»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Book a visit", ar: "احجز زيارة" }, back: true }
          blocks:
            - { kind: heading, text: { en: "Pick a day in November", ar: "اختر يومًا في نوفمبر" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, text: "5" }
                - { kind: chip, tone: off, text: { en: "6 · Full", ar: "6 · ممتلئ" } }
                - { kind: chip, text: "7" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, tone: off, text: { en: "8 · Full", ar: "8 · ممتلئ" } }
                - { kind: chip, text: "9" }
                - { kind: chip, tone: off, text: { en: "11 · Full", ar: "11 · ممتلئ" } }
      - id: tap
        text: { en: "When a patient taps a full day, show \"This day is full\"", ar: "حين يضغط المريض على يوم ممتلئ، اعرض «هذا اليوم ممتلئ»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: raha
          appbar: { title: { en: "Book a visit", ar: "احجز زيارة" }, back: true }
          blocks:
            - { kind: heading, text: { en: "Pick a day in November", ar: "اختر يومًا في نوفمبر" } }
            - kind: row
              gap: s
              blocks:
                - { kind: chip, text: "5" }
                - { kind: chip, tone: bad, text: "6" }
                - { kind: chip, text: "7" }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, tone: bad, text: "8" }
                - { kind: chip, text: "9" }
                - { kind: chip, tone: bad, text: "11" }
            - { kind: banner, text: { en: "After tapping 6: \"This day is full.\"", ar: "بعد الضغط على 6: «هذا اليوم ممتلئ.»" }, gap: s }
    answer: [full]
    misconceptions:
      - id: MC-P05-019
        when: [legend]
        feedback:
          en: "The key still asks patients to tell red from green. Do the grayscale test: the days still look alike."
          ar: "المفتاح ما زال يطلب من المريض أن يفرّق بين الأحمر والأخضر. جرّب اختبار الأبيض والأسود: الأيام ما زالت متشابهة."
      - id: MC-P05-018
        when: [tap]
        feedback:
          en: "Patients find out only after tapping each day. Before they tap, the calendar still shows full days by colour alone."
          ar: "المريض يعرف فقط بعد أن يضغط على كل يوم. وقبل الضغط، ما زال التقويم يُظهر الأيام الممتلئة باللون وحده."
    hints:
      - { en: "Picture each option in black and white.", ar: "تخيّل كل خيار بالأبيض والأسود." }
      - { en: "Which option adds a word?", ar: "أي خيار يضيف كلمة؟" }
    correct:
      en: "Right. \"Full\" works in any colour, for every patient."
      ar: "صحيح. كلمة «ممتلئ» يفهمها كل المرضى، بأي لون كانت."
    explain:
      en: "Before you finish a screen, check it in grayscale. If something is lost, add a word, an icon or a mark."
      ar: "قبل أن تُنهي أي شاشة، افحصها بالأبيض والأسود. وإذا ضاع شيء، أضف كلمة أو أيقونة أو علامة."

  - id: S08
    type: card
    part: recap
    icons: [text, ok, color, eye]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Words with colour:** you wrote each order's status next to its dot.\n- **Shapes with colour:** you marked taken seats with a ✕.\n- **Links:** you underlined a link so it shows without colour.\n- **Grayscale test:** you checked which screen still made sense in black and white.\n\nNext lesson: text on photos and dark screens."
      ar: "- **كلمات مع اللون:** كتبت حالة كل طلب بجانب نقطته.\n- **أشكال مع اللون:** علّمت المقاعد المحجوزة بـ ✕.\n- **الروابط:** وضعت خطًا تحت الرابط ليظهر بدون لون.\n- **اختبار الأبيض والأسود:** عرفت أي شاشة ما زالت مفهومة بالأبيض والأسود.\n\nالدرس التالي: النص فوق الصور وفي الشاشات الداكنة."
