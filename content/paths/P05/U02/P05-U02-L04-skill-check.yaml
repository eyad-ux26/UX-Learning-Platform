id: P05-U02-L04
mode: check
minutes: 6
title:
  en: "Skill check: colour and contrast"
  ar: "اختبار المهارة: الألوان والتباين"
summary:
  en: "Check five parts of a shop's new design for contrast and colour, on your own."
  ar: "افحص خمسة أجزاء من التصميم الجديد لمتجر من ناحية التباين والألوان، بنفسك."
speaker: youssef
sources:
  - title: { en: "5 Visual Treatments that Improve Accessibility (NN/g)", ar: "5 معالجات بصرية تحسّن الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/visual-treatments-accessibility/"
  - title: { en: "Low-Contrast Text Is Not the Answer (NN/g)", ar: "النص منخفض التباين ليس هو الحل (NN/g)" }
    url: "https://www.nngroup.com/articles/low-contrast/"
  - title: { en: "Ensure High Contrast for Text Over Images (NN/g)", ar: "اضمن تباينًا عاليًا للنص فوق الصور (NN/g)" }
    url: "https://www.nngroup.com/articles/text-over-images/"
  - title: { en: "Dark Mode: How Users Think About It and Issues to Avoid (NN/g)", ar: "الوضع الداكن: كيف يراه المستخدمون، وأخطاء يجب تجنّبها (NN/g)" }
    url: "https://www.nngroup.com/articles/dark-mode-users-issues/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Youssef's shop gets a new look", ar: "متجر يوسف بشكل جديد" }
    body:
      en: "I sell phone accessories online. Our app has a new design, with a dark mode too. Before we launch, I want to be sure everyone can see and read it.\n\nYour job: check five parts of the new design.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أبيع إكسسوارات الهواتف أونلاين. ولتطبيقنا تصميم جديد، وفيه وضع داكن أيضًا. وقبل أن نطلقه، أريد أن أتأكّد أن الجميع يستطيعون رؤيته وقراءته.\n\nمهمّتك: افحص خمسة أجزاء من التصميم الجديد.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: image, size: m, tone: photo-dark, text: { en: "Sale: up to 30% off", ar: "تخفيضات حتى 30%" } }
        - { kind: title, text: { en: "Fast charger 20W", ar: "شاحن سريع 20 واط" }, gap: s }
        - { kind: text, weight: bold, text: { en: "350 EGP", ar: "350 جنيه" }, gap: xs }
        - { kind: button, text: { en: "Add to cart", ar: "أضف إلى السلة" }, gap: m }

  - id: S02
    type: choose
    skill: SK-P05-U02-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. 5 Visual Treatments (NN/g): normal text needs at least 4.5:1; large or bold text can go down to 3:1. The 28 px bold headline passes at 3:1; the 12 px footer doesn't."
      ar: "اختبار مهارة. 5 معالجات بصرية (NN/g): النص العادي يحتاج 4.5:1 على الأقل؛ والنص الكبير أو العريض يكفيه 3:1. فالعنوان 28 بكسل العريض ينجح بـ 3:1؛ ونص التذييل 12 بكسل لا ينجح."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "According to the WCAG, the color-contrast ratio between text and its background should be at least 4.5:1." }
    scenario:
      en: "On our home page, the headline and the footer note use the same grey. Its contrast with white is 3:1."
      ar: "في الصفحة الرئيسية، العنوان وملاحظة التذييل (Footer) بنفس الرمادي. وتباينه مع الأبيض 3:1."
    prompt:
      en: "Which text must be made darker to meet the minimum contrast?"
      ar: "أي نص يجب أن نجعله أغمق ليحقّق الحد الأدنى للتباين؟"
    mock:
      width: 300
      blocks:
        - { kind: text, px: 28, weight: bold, color: pale, text: { en: "New cables are here", ar: "وصلت الكابلات الجديدة" } }
        - { kind: small, color: muted, text: { en: "28 px, bold", ar: "28 بكسل، عريض" }, gap: xs }
        - { kind: divider, gap: m }
        - { kind: text, px: 12, color: pale, text: { en: "Prices include VAT. Delivery in 2–4 days.", ar: "الأسعار شاملة الضريبة. التوصيل خلال 2–4 أيام." }, gap: m }
        - { kind: small, color: muted, text: { en: "12 px, regular", ar: "12 بكسل، عادي" }, gap: xs }
    options:
      - { id: both, text: { en: "Both texts", ar: "النصّان كلاهما" } }
      - { id: headline, text: { en: "Only the headline", ar: "العنوان فقط" } }
      - { id: footer, text: { en: "Only the footer note", ar: "ملاحظة التذييل فقط" } }
    answer: [footer]
    misconceptions:
      - id: MC-P05-015
        when: [both, headline]
        feedback:
          en: "The headline is large and bold, so 3:1 is enough for it. The small footer note needs 4.5:1."
          ar: "العنوان كبير وعريض، فيكفيه 3:1. أما ملاحظة التذييل الصغيرة فتحتاج 4.5:1."
    explain:
      en: "From Lesson 1: check size with colour. 3:1 is fine only for large or bold text."
      ar: "من الدرس 1: افحص الحجم مع اللون. فالـ 3:1 يكفي فقط للنص الكبير أو العريض."

  - id: S03
    type: tune
    skill: SK-P05-U02-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Low-Contrast Text (NN/g): disabled features are dimmed or greyed out by convention, so a pale \"Cancel order\" looks unavailable. Make it smaller and lower, not paler."
      ar: "اختبار مهارة. النص منخفض التباين (NN/g): المتعارف عليه أن العناصر المعطّلة باهتة أو رمادية، فيبدو «إلغاء الطلب» الباهت غير متوفّر. صغّره وانقله للأسفل، ولا تجعله باهتًا."
    ref: { url: "https://www.nngroup.com/articles/low-contrast/", quote: "by convention, disabled features are dimmed or grayed out. Low contrast treatments risk sending users the wrong signal about the availability of an option." }
    scenario:
      en: "On the order page, \"Track order\" is the main button. \"Cancel order\" is less important, so the designer made it light grey."
      ar: "في صفحة الطلب، «تتبّع الطلب» هو الزر الأساسي. و«إلغاء الطلب» أقل أهمية، فجعله المصمّم رماديًا فاتحًا."
    prompt:
      en: "Tap each option to see the change. Which one keeps \"Cancel order\" less loud, but clearly working?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُبقي «إلغاء الطلب» أقل بروزًا، لكن واضحًا أنه يعمل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: title, text: { en: "Order 2210", ar: "طلب 2210" } }
        - { kind: meta, text: { en: "Arrives Thursday", ar: "يصل يوم الخميس" }, gap: xs }
        - { kind: button, text: { en: "Track order", ar: "تتبّع الطلب" }, gap: m }
        - { kind: button, style: plain, color: faint, text: { en: "Cancel order", ar: "إلغاء الطلب" }, gap: s }
    options:
      - id: keep
        text: { en: "Keep it light grey; it should look less important", ar: "أبقِه رماديًا فاتحًا؛ يجب أن يبدو أقل أهمية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Order 2210", ar: "طلب 2210" } }
            - { kind: meta, text: { en: "Arrives Thursday", ar: "يصل يوم الخميس" }, gap: xs }
            - { kind: button, text: { en: "Track order", ar: "تتبّع الطلب" }, gap: m }
            - { kind: button, style: plain, color: faint, text: { en: "Cancel order", ar: "إلغاء الطلب" }, gap: s }
      - id: plain
        text: { en: "Make it a small text button in dark grey, with space above it", ar: "اجعله زرًا نصيًا صغيرًا بالرمادي الغامق، مع مسافة فوقه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Order 2210", ar: "طلب 2210" } }
            - { kind: meta, text: { en: "Arrives Thursday", ar: "يصل يوم الخميس" }, gap: xs }
            - { kind: button, text: { en: "Track order", ar: "تتبّع الطلب" }, gap: m }
            - { kind: button, style: plain, color: muted, text: { en: "Cancel order", ar: "إلغاء الطلب" }, gap: l }
      - id: red
        text: { en: "Make it a filled red button, so nobody misses it", ar: "اجعله زرًا أحمر ممتلئًا، حتى لا يفوت أحدًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Order 2210", ar: "طلب 2210" } }
            - { kind: meta, text: { en: "Arrives Thursday", ar: "يصل يوم الخميس" }, gap: xs }
            - { kind: button, text: { en: "Track order", ar: "تتبّع الطلب" }, gap: m }
            - { kind: button, style: danger, text: { en: "Cancel order", ar: "إلغاء الطلب" }, gap: s }
    answer: [plain]
    misconceptions:
      - id: MC-P05-016
        when: [keep]
        feedback:
          en: "Light grey looks turned off, so customers who need to cancel may think they can't."
          ar: "الرمادي الفاتح يبدو معطّلًا، فقد يظن العميل الذي يريد الإلغاء أنه لا يستطيع."
      - id: MC-P05-017
        when: [red]
        feedback:
          en: "Now Cancel is as loud as Track. Make it quieter with size and space, while keeping it dark."
          ar: "الآن صار الإلغاء بارزًا مثل التتبّع. قلّل بروزه بالحجم والمسافة، مع إبقائه غامقًا."
    explain:
      en: "From Lesson 1: make things quieter with size, place and space, not with pale grey."
      ar: "من الدرس 1: قلّل بروز العناصر بالحجم والمكان والمسافة، لا بالرمادي الفاتح."

  - id: S04
    type: tune
    skill: SK-P05-U02-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. 5 Visual Treatments (NN/g): if you're not sure colour is enough, try the grayscale trick. Selected filters shown only by fill colour fail it; a ✓ passes."
      ar: "اختبار مهارة. 5 معالجات بصرية (NN/g): إذا لم تكن متأكّدًا أن اللون يكفي، جرّب حيلة الأبيض والأسود. والفلاتر المختارة التي يميّزها لون الخلفية فقط تفشل فيها؛ والعلامة ✓ تنجح."
    ref: { url: "https://www.nngroup.com/articles/visual-treatments-accessibility/", quote: "try the grayscale trick" }
    scenario:
      en: "Customers filter cables by type. A selected filter turns green; the others stay grey. The screens below are in grayscale."
      ar: "يفلتر العملاء الكابلات حسب النوع. الفلتر المختار يصير أخضر، والباقي يبقى رماديًا. والشاشات بالأسفل بالأبيض والأسود."
    prompt:
      en: "Tap each option to see the change. Which one shows the selected filters in grayscale?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُظهر الفلاتر المختارة بالأبيض والأسود؟"
    mock:
      caption: { en: "Now, in grayscale", ar: "الآن، بالأبيض والأسود" }
      width: 300
      gray: true
      blocks:
        - { kind: small, color: muted, text: { en: "Cable type", ar: "نوع الكابل" } }
        - kind: row
          gap: xs
          blocks:
            - { kind: chip, text: "USB-C" }
            - { kind: chip, tone: off, text: "Lightning" }
            - { kind: chip, text: "Micro-USB" }
    options:
      - id: check
        text: { en: "Add a ✓ to each selected filter", ar: "أضف ✓ إلى كل فلتر مختار" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          width: 300
          gray: true
          blocks:
            - { kind: small, color: muted, text: { en: "Cable type", ar: "نوع الكابل" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, text: "✓ USB-C" }
                - { kind: chip, tone: off, text: "Lightning" }
                - { kind: chip, text: "✓ Micro-USB" }
      - id: brighter
        text: { en: "Use a brighter green for selected filters", ar: "استخدم أخضر أقوى للفلاتر المختارة" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          width: 300
          gray: true
          blocks:
            - { kind: small, color: muted, text: { en: "Cable type", ar: "نوع الكابل" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, tone: dark, text: "USB-C" }
                - { kind: chip, tone: off, text: "Lightning" }
                - { kind: chip, tone: dark, text: "Micro-USB" }
      - id: key
        text: { en: "Add a note: \"Green filters are on\"", ar: "أضف ملاحظة: «الفلاتر الخضراء مفعّلة»" }
        mock:
          caption: { en: "After this change, in grayscale", ar: "بعد هذا التغيير، بالأبيض والأسود" }
          width: 300
          gray: true
          blocks:
            - { kind: small, color: muted, text: { en: "Cable type · Green filters are on", ar: "نوع الكابل · الفلاتر الخضراء مفعّلة" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: chip, text: "USB-C" }
                - { kind: chip, tone: off, text: "Lightning" }
                - { kind: chip, text: "Micro-USB" }
    answer: [check]
    misconceptions:
      - id: MC-P05-018
        when: [brighter]
        feedback:
          en: "A brighter green is still only colour. In grayscale, the filters still look almost the same."
          ar: "الأخضر الأقوى ما زال لونًا فقط. وبالأبيض والأسود، ما زالت الفلاتر متشابهة تقريبًا."
      - id: MC-P05-019
        when: [key]
        feedback:
          en: "The note explains the colour, but you still need to see green to use it."
          ar: "الملاحظة تشرح اللون، لكنك ما زلت تحتاج أن ترى الأخضر لتستفيد منها."
    explain:
      en: "From Lesson 2: give every colour a second sign, and check in grayscale."
      ar: "من الدرس 2: أعطِ كل لون علامة ثانية، وافحص بالأبيض والأسود."

  - id: S05
    type: tune
    skill: SK-P05-U02-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Text Over Images (NN/g): consider all possible images before choosing a technique; a fix can work for one photo and fail for others. A dark fade works for every photo."
      ar: "اختبار مهارة. النص فوق الصور (NN/g): فكّر في كل الصور المحتملة قبل اختيار الحل؛ فالحل قد ينجح مع صورة ويفشل مع أخرى. والتدرّج الغامق يعمل مع كل الصور."
    ref: { url: "https://www.nngroup.com/articles/text-over-images/", quote: "Consider all possible images that may be used before deciding on a technique for handling text-overlay contrast." }
    scenario:
      en: "Our sale banner puts white text straight on the product photo. It looked fine this week, on black headphones. Next week's photo is white earbuds."
      ar: "بانر التخفيضات يضع النص الأبيض مباشرة على صورة المنتج. وكان واضحًا هذا الأسبوع، على سماعات سوداء. وصورة الأسبوع القادم سماعات بيضاء."
    prompt:
      en: "Tap each option to see the change. Which one keeps the banner text readable every week?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُبقي نص البانر مقروءًا كل أسبوع؟"
    mock:
      caption: { en: "Now (next week's photo)", ar: "الآن (صورة الأسبوع القادم)" }
      width: 300
      blocks:
        - { kind: image, size: l, tone: photo-light, text: { en: "Earbuds: 20% off", ar: "سماعات: خصم 20%" } }
    options:
      - id: nothing
        text: { en: "Change nothing; it passed this week", ar: "لا تغيّر شيئًا؛ فقد نجح هذا الأسبوع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: image, size: l, tone: photo-light, text: { en: "Earbuds: 20% off", ar: "سماعات: خصم 20%" } }
      - id: darkphoto
        text: { en: "Shoot the earbuds on a dark table instead", ar: "صوّر السماعات على طاولة غامقة بدلًا من ذلك" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: image, size: l, tone: photo-dark, text: { en: "Earbuds: 20% off", ar: "سماعات: خصم 20%" } }
      - id: fade
        text: { en: "Add a dark fade at the bottom of the banner, and put the text there", ar: "أضف تدرّجًا غامقًا أسفل البانر، وضع النص هناك" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: image, size: l, tone: photo-fade, text: { en: "Earbuds: 20% off", ar: "سماعات: خصم 20%" } }
    answer: [fade]
    misconceptions:
      - id: MC-P05-021
        when: [nothing, darkphoto]
        feedback:
          en: "That fixes one week. The next light photo brings the problem back. A fade behind the text works for every photo."
          ar: "هذا يُصلح أسبوعًا واحدًا. وأول صورة فاتحة بعدها تُعيد المشكلة. والتدرّج خلف النص يعمل مع كل الصور."
    explain:
      en: "From Lesson 3: put a dark area behind white text, and make sure it works on the lightest photo."
      ar: "من الدرس 3: ضع منطقة غامقة خلف النص الأبيض، وتأكّد أنها تعمل مع أفتح صورة."

  - id: S06
    type: tune
    skill: SK-P05-U02-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. Dark Mode issues (NN/g): use the darkest colours for elements at the bottom and the lightest for elements on top. A filter sheet the same black as the page has no visible edge."
      ar: "اختبار مهارة. أخطاء الوضع الداكن (NN/g): استخدم الألوان الأغمق للعناصر في الأسفل، والأفتح للعناصر في الأعلى. ولوحة الفلاتر بنفس سواد الصفحة ليس لها حافة ظاهرة."
    ref: { url: "https://www.nngroup.com/articles/dark-mode-users-issues/", quote: "use the darkest colors for the page elements on the bottom, and the lightest colors for the elements on top" }
    scenario:
      en: "In dark mode, tapping \"Filter\" opens a panel over the product list. The panel is the same black as the page."
      ar: "في الوضع الداكن، الضغط على «فلترة» يفتح لوحة فوق قائمة المنتجات. واللوحة بنفس سواد الصفحة."
    prompt:
      en: "Tap each option to see the change. Which one shows clearly that the panel sits on top of the list?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يوضّح أن اللوحة فوق القائمة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - kind: group
          tone: night
          blocks:
            - { kind: meta, text: { en: "Fast charger 20W · 350 EGP", ar: "شاحن سريع 20 واط · 350 جنيه" } }
            - { kind: meta, text: { en: "USB-C cable · 120 EGP", ar: "كابل USB-C · 120 جنيه" }, gap: s }
            - { kind: divider, gap: s }
            - { kind: heading, text: { en: "Filter", ar: "فلترة" }, gap: s }
            - { kind: check, selected: true, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
    options:
      - id: line
        text: { en: "Add a thin grey line at the top of the panel", ar: "أضف خطًا رماديًا رفيعًا أعلى اللوحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: group
              tone: night
              blocks:
                - { kind: meta, text: { en: "Fast charger 20W · 350 EGP", ar: "شاحن سريع 20 واط · 350 جنيه" } }
                - { kind: meta, text: { en: "USB-C cable · 120 EGP", ar: "كابل USB-C · 120 جنيه" }, gap: s }
                - { kind: divider, gap: s }
                - { kind: divider, gap: xs }
                - { kind: heading, text: { en: "Filter", ar: "فلترة" }, gap: s }
                - { kind: check, selected: true, text: { en: "In stock only", ar: "المتوفّر فقط" }, gap: xs }
      - id: lighter
        text: { en: "Make the panel a lighter grey than the page", ar: "اجعل اللوحة رمادية أفتح من الصفحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: group
              tone: night
              blocks:
                - { kind: meta, text: { en: "Fast charger 20W · 350 EGP", ar: "شاحن سريع 20 واط · 350 جنيه" } }
