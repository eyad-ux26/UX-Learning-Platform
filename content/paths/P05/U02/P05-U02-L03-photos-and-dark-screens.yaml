id: P05-U02-L03
mode: lesson
minutes: 7
title:
  en: "Text on photos and dark screens"
  ar: "النص فوق الصور وفي الشاشات الداكنة"
summary:
  en: "Keep white text readable on trip photos, and fix colours and cards in dark mode."
  ar: "اجعل النص الأبيض مقروءًا فوق صور الرحلات، وأصلح الألوان والبطاقات في الوضع الداكن."
speaker: rami
sources:
  - title: { en: "Ensure High Contrast for Text Over Images (NN/g)", ar: "اضمن تباينًا عاليًا للنص فوق الصور (NN/g)" }
    url: "https://www.nngroup.com/articles/text-over-images/"
  - title: { en: "Dark Mode: How Users Think About It and Issues to Avoid (NN/g)", ar: "الوضع الداكن: كيف يراه المستخدمون، وأخطاء يجب تجنّبها (NN/g)" }
    url: "https://www.nngroup.com/articles/dark-mode-users-issues/"
review_labels:
  MC-P05-020: { en: "White text needs a dark area behind it", ar: "النص الأبيض يحتاج منطقة غامقة خلفه" }
  MC-P05-021: { en: "Check the lightest photo that can appear", ar: "افحص أفتح صورة يمكن أن تظهر" }
  MC-P05-022: { en: "Strong colours blur on dark screens", ar: "الألوان القوية تتشوّش على الشاشات الداكنة" }
  MC-P05-023: { en: "Thin lines vanish on dark; use lighter cards", ar: "الخطوط الرفيعة تختفي على الداكن؛ استخدم بطاقات أفتح" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Beautiful trip photos", ar: "صور رحلات جميلة" }
    body:
      en: "Our travel app shows each trip as a big photo with the place name in white on top. In the design file it looked great.\n\nIn the live app, people scroll past some trips without reading their names."
      ar: "يعرض تطبيق الرحلات عندنا كل رحلة كصورة كبيرة، واسم المكان مكتوب فوقها بالأبيض. في ملف التصميم كان الشكل رائعًا.\n\nلكن في التطبيق الفعلي، يمرّ الناس على بعض الرحلات دون أن يقرؤوا أسماءها."
    mock:
      app: zad
      appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: image, size: m, tone: photo-dark, text: { en: "Cairo by night", ar: "القاهرة ليلًا" } }
        - { kind: image, size: m, tone: photo-light, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" }, gap: s }

  - id: S02
    type: tune
    skill: SK-P05-U02-04
    part: try
    rules: [R12]
    value:
      en: "Try first. Text Over Images (NN/g): light or faded backgrounds don't suit white text because the colours are too similar; darken the background behind the text."
      ar: "جرّب أولًا. النص فوق الصور (NN/g): الخلفيات الفاتحة أو الباهتة لا تناسب النص الأبيض لأن اللونين متقاربان جدًا؛ اجعل الخلفية خلف النص أغمق."
    ref: { url: "https://www.nngroup.com/articles/text-over-images/", quote: "Light-colored or faded backgrounds are not well-suited to white text because the colors are too similar." }
    prompt:
      en: "Tap each option to see the change. Which one makes the trip name easy to read?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل اسم الرحلة سهل القراءة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: zad
      appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: image, size: l, tone: photo-light, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
    options:
      - id: bigger
        text: { en: "Make the white text bigger", ar: "كبّر النص الأبيض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-light, px: 28, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
      - id: fade
        text: { en: "Add a dark fade at the bottom of the photo, and put the name there", ar: "أضف تدرّجًا غامقًا أسفل الصورة، وضع الاسم هناك" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-fade, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
      - id: busy
        text: { en: "Use a more colourful photo, so the card looks livelier", ar: "استخدم صورة ألوانها أكثر، لتبدو البطاقة أكثر حيوية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-busy, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
    answer: [fade]
    misconceptions:
      - id: MC-P05-020
        when: [bigger, busy]
        feedback:
          en: "The text is still white on a light photo. White text needs a dark area right behind it."
          ar: "النص ما زال أبيض فوق صورة فاتحة. والنص الأبيض يحتاج منطقة غامقة خلفه مباشرة."
    hints:
      - { en: "Look at the colour of the photo right behind the words.", ar: "انظر إلى لون الصورة خلف الكلمات مباشرة." }
      - { en: "Which option makes the area behind the white text darker?", ar: "أي خيار يجعل المنطقة خلف النص الأبيض أغمق؟" }
    correct:
      en: "Right. The dark fade gives the white text a dark background."
      ar: "صحيح. التدرّج الغامق يعطي النص الأبيض خلفية غامقة."
    explain:
      en: "Contrast is about what's right behind the text. Darken that part, and you keep the photo too."
      ar: "التباين يتعلّق بما خلف النص مباشرة. اجعل هذا الجزء أغمق، وتبقى الصورة كما هي تقريبًا."

  - id: S03
    type: card
    part: concept
    icons: [contrast, layers, color, group]
    title: { en: "Photos and dark mode need extra care", ar: "الصور والوضع الداكن يحتاجان عناية إضافية" }
    body:
      en: "- **White text needs dark behind it:** on a light or busy photo, darken the part behind the text. Use a dark fade at the bottom, a dark see-through box, or a blur.\n- **Test the worst photo:** a fix that works on one photo can fail on another. Check it on the lightest, busiest photo that can appear.\n- **Dark mode, soft colours:** strong, bright colours (like a deep blue) blur on dark backgrounds. Use softer, lighter versions.\n- **Dark mode, lighter cards:** thin grey lines disappear on dark screens. Put content on cards a bit lighter than the page. The higher the layer, the lighter it is."
      ar: "- **النص الأبيض يحتاج خلفية غامقة:** على الصورة الفاتحة أو المزدحمة، اجعل الجزء خلف النص أغمق. استخدم تدرّجًا غامقًا في الأسفل، أو مربعًا غامقًا شفافًا، أو تمويهًا (Blur).\n- **اختبر أسوأ صورة:** الحل الذي ينجح مع صورة قد يفشل مع أخرى. افحصه على أفتح صورة وأكثرها ازدحامًا يمكن أن تظهر.\n- **الوضع الداكن (Dark mode)، ألوان هادئة:** الألوان القوية الزاهية (مثل الأزرق الغامق) تتشوّش على الخلفيات الداكنة. استخدم درجات أهدأ وأفتح منها.\n- **الوضع الداكن، بطاقات أفتح:** الخطوط الرمادية الرفيعة تختفي على الشاشات الداكنة. ضع المحتوى على بطاقات أفتح قليلًا من الصفحة. وكلما كانت الطبقة أعلى، كانت أفتح."

  - id: S04
    type: choose
    skill: SK-P05-U02-04
    part: guided
    rules: [R06]
    value:
      en: "Text Over Images (NN/g): consider every image that may be used; a fix can work for one image and fail for others, so check the worst-case image."
      ar: "النص فوق الصور (NN/g): فكّر في كل الصور التي قد تُستخدم؛ فالحل قد ينجح مع صورة ويفشل مع غيرها، لذلك افحص أسوأ صورة."
    ref: { url: "https://www.nngroup.com/articles/text-over-images/", quote: "ensure that the chosen method will provide a high enough contrast for the worst-case background image and text placement" }
    scenario:
      en: "Our designer checked the white trip names on the Cairo night photo, and the contrast passed. The app shows many different photos, like the three below."
      ar: "فحصت مصمّمتنا أسماء الرحلات البيضاء على صورة القاهرة ليلًا، ونجح التباين. والتطبيق يعرض صورًا كثيرة مختلفة، مثل الثلاث بالأسفل."
    prompt:
      en: "Before approving, which photo should she check the white names on?"
      ar: "قبل الموافقة، على أي صورة يجب أن تفحص الأسماء البيضاء؟"
    mock:
      app: zad
      appbar: { logo: true, actions: [ { icon: magnifying-glass, aria: { en: "Search", ar: "بحث" } } ] }
      blocks:
        - { kind: image, size: s, tone: photo-dark, text: { en: "Cairo by night", ar: "القاهرة ليلًا" } }
        - { kind: image, size: s, tone: photo-busy, text: { en: "Khan el-Khalili", ar: "خان الخليلي" }, gap: s }
        - { kind: image, size: s, tone: photo-light, text: { en: "Dahab beach", ar: "شاطئ دهب" }, gap: s }
    options:
      - { id: light, text: { en: "The beach photo, because it's the lightest", ar: "صورة الشاطئ، لأنها الأفتح" } }
      - { id: night, text: { en: "The Cairo night photo, because it's our most popular trip", ar: "صورة القاهرة ليلًا، لأنها أشهر رحلة عندنا" } }
      - { id: none, text: { en: "No more checks; one photo passed, so the style passes", ar: "لا داعي لفحص آخر؛ نجحت صورة واحدة، إذن نجح الشكل كله" } }
    answer: [light]
    misconceptions:
      - id: MC-P05-021
        when: [night, none]
        feedback:
          en: "White text is easy on a dark photo. The real test is the lightest photo, where white text is hardest to read."
          ar: "النص الأبيض سهل على الصورة الغامقة. والاختبار الحقيقي هو أفتح صورة، حيث يكون النص الأبيض أصعب في القراءة."
    hints:
      - { en: "On which photo is the white name hardest to read?", ar: "على أي صورة يكون الاسم الأبيض أصعب في القراءة؟" }
      - { en: "If the text passes on the hardest photo, it passes on the easier ones too.", ar: "إذا نجح النص على أصعب صورة، فسينجح على الأسهل أيضًا." }
    correct:
      en: "Right. Test the hardest case: the lightest photo."
      ar: "صحيح. اختبر أصعب حالة: أفتح صورة."
    explain:
      en: "Photos change, but the style stays. Make sure it works on the worst photo, and it works on all of them."
      ar: "الصور تتغيّر، لكن الشكل ثابت. تأكّد أنه يعمل على أسوأ صورة، فيعمل على كل الصور."

  - id: S05
    type: tune
    skill: SK-P05-U02-05
    part: guided
    rules: [R06]
    value:
      en: "Dark Mode issues (NN/g): highly saturated colours on dark backgrounds have poor visibility and can fail WCAG contrast. Use a lighter, less saturated tone."
      ar: "أخطاء الوضع الداكن (NN/g): الألوان شديدة التشبّع على الخلفيات الداكنة ضعيفة الوضوح وقد لا تحقّق تباين WCAG. استخدم درجة أفتح وأقل تشبّعًا."
    ref: { url: "https://www.nngroup.com/articles/dark-mode-users-issues/", quote: "Highly saturated colors on dark backgrounds have poor visibility and do not comply with accessibility guidelines" }
    scenario:
      en: "Our app now has dark mode. The designer kept our brand blue for the prices and the \"See trip\" link."
      ar: "صار في تطبيقنا وضع داكن (Dark mode). وأبقى المصمّم أزرق هويتنا للأسعار ولرابط «شاهد الرحلة»."
    prompt:
      en: "Tap each option to see the change. Which one makes the price and link easy to read?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل السعر والرابط سهلَي القراءة؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: zad
      theme: dark
      appbar: { title: { en: "Trip", ar: "الرحلة" }, back: true }
      blocks:
        - kind: group
          tone: night
          blocks:
            - { kind: image, art: desert, size: m }
            - { kind: heading, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
            - { kind: text, color: neon, text: { en: "From 4,500 EGP", ar: "من 4,500 جنيه" }, gap: xs }
            - { kind: text, color: neon, text: { en: "See trip", ar: "شاهد الرحلة" }, gap: s }
    options:
      - id: bold
        text: { en: "Keep the brand blue, but make it bold", ar: "أبقِ أزرق الهوية، لكن اجعله عريضًا (Bold)" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          theme: dark
          appbar: { title: { en: "Trip", ar: "الرحلة" }, back: true }
          blocks:
            - kind: group
              tone: night
              blocks:
                - { kind: image, art: desert, size: m }
                - { kind: heading, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
                - { kind: text, color: neon, weight: bold, text: { en: "From 4,500 EGP", ar: "من 4,500 جنيه" }, gap: xs }
                - { kind: text, color: neon, weight: bold, text: { en: "See trip", ar: "شاهد الرحلة" }, gap: s }
      - id: same
        text: { en: "Change nothing; the brand colour must look the same everywhere", ar: "لا تغيّر شيئًا؛ لون الهوية يجب أن يبقى نفسه في كل مكان" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          theme: dark
          appbar: { title: { en: "Trip", ar: "الرحلة" }, back: true }
          blocks:
            - kind: group
              tone: night
              blocks:
                - { kind: image, art: desert, size: m }
                - { kind: heading, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
                - { kind: text, color: neon, text: { en: "From 4,500 EGP", ar: "من 4,500 جنيه" }, gap: xs }
                - { kind: text, color: neon, text: { en: "See trip", ar: "شاهد الرحلة" }, gap: s }
      - id: soft
        text: { en: "In dark mode, use a lighter, softer version of the blue", ar: "في الوضع الداكن، استخدم درجة أفتح وأهدأ من الأزرق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: zad
          theme: dark
          appbar: { title: { en: "Trip", ar: "الرحلة" }, back: true }
          blocks:
            - kind: group
              tone: night
              blocks:
                - { kind: image, art: desert, size: m }
                - { kind: heading, text: { en: "Siwa · 3 nights", ar: "سيوة · 3 ليالٍ" } }
                - { kind: text, color: sky, text: { en: "From 4,500 EGP", ar: "من 4,500 جنيه" }, gap: xs }
                - { kind: text, color: sky, text: { en: "See trip", ar: "شاهد الرحلة" }, gap: s }
    answer: [soft]
    misconceptions:
      - id: MC-P05-022
        when: [bold, same]
        feedback:
          en: "A strong blue blurs on a dark background, bold or not. A lighter blue is still your brand, and people can read it."
          ar: "الأزرق القوي يتشوّش على الخلفية الداكنة، عريضًا كان أم لا. والأزرق الأفتح ما زال لون هويتك، ويستطيع الناس قراءته."
    hints:
      - { en: "Look at how the blue sits on the dark background.", ar: "انظر كيف يبدو الأزرق على الخلفية الداكنة." }
      - { en: "Which option changes the colour itself?", ar: "أي خيار يغيّر اللون نفسه؟" }
    correct:
      en: "Right. A softer blue reads well on dark."
      ar: "صحيح. الأزرق الأهدأ سهل القراءة على الداكن."
    explain:
      en: "Dark mode needs its own colour versions. Keep the same colour family, but lighter and less strong."
      ar: "الوضع الداكن يحتاج درجات ألوان خاصة به. أبقِ نفس عائلة اللون، لكن أفتح وأقل قوة."

  - id: S06
    type: compare
    skill: SK-P05-U02-05
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: thin dividers vs lighter cards on dark. Dark Mode issues (NN/g): thin grey dividers get swallowed on very dark backgrounds; use the lightest colours for elements on top."
      ar: "مقارنة: خطوط رفيعة مقابل بطاقات أفتح على الداكن. أخطاء الوضع الداكن (NN/g): الخطوط الرمادية الرفيعة تختفي على الخلفيات الداكنة جدًا؛ استخدم الألوان الأفتح للعناصر التي في الأعلى."
    ref: { url: "https://www.nngroup.com/articles/dark-mode-users-issues/", quote: "Thin, gray dividers are easily swallowed up on very dark backgrounds." }
    scenario:
      en: "In dark mode, the \"My bookings\" screen lists three trips. Two designers separated them in different ways."
      ar: "في الوضع الداكن، تعرض شاشة «حجوزاتي» ثلاث رحلات. وفصل مصمّمان بينها بطريقتين مختلفتين."
    prompt:
      en: "Which screen makes it clear where each booking starts and ends?"
      ar: "أي شاشة توضّح أين تبدأ كل رحلة وأين تنتهي؟"
    a:
      label: { en: "A: Each booking sits on a card a bit lighter than the page", ar: "A: كل رحلة على بطاقة أفتح قليلًا من الصفحة" }
      mock:
        app: zad
        theme: dark
        appbar: { title: { en: "My bookings", ar: "حجوزاتي" }, back: true }
        blocks:
          - kind: group
            tone: night
            blocks:
              - kind: group
                tone: raised
                blocks:
                  - { kind: meta, text: { en: "Siwa · 12 Dec", ar: "سيوة · 12 ديسمبر" } }
                  - { kind: small, text: { en: "2 travellers", ar: "مسافران" } }
              - kind: group
                tone: raised
                gap: s
                blocks:
                  - { kind: meta, text: { en: "Dahab · 3 Jan", ar: "دهب · 3 يناير" } }
                  - { kind: small, text: { en: "1 traveller", ar: "مسافر واحد" } }
              - kind: group
                tone: raised
                gap: s
                blocks:
                  - { kind: meta, text: { en: "Aswan · 20 Feb", ar: "أسوان · 20 فبراير" } }
                  - { kind: small, text: { en: "4 travellers", ar: "4 مسافرين" } }
    b:
      label: { en: "B: Bookings are separated by thin grey lines", ar: "B: الرحلات مفصولة بخطوط رمادية رفيعة" }
      mock:
        app: zad
        theme: dark
        appbar: { title: { en: "My bookings", ar: "حجوزاتي" }, back: true }
        blocks:
          - kind: group
            tone: night
            blocks:
              - { kind: meta, text: { en: "Siwa · 12 Dec", ar: "سيوة · 12 ديسمبر" } }
              - { kind: small, text: { en: "2 travellers", ar: "مسافران" } }
              - { kind: divider, gap: s }
              - { kind: meta, text: { en: "Dahab · 3 Jan", ar: "دهب · 3 يناير" }, gap: s }
              - { kind: small, text: { en: "1 traveller", ar: "مسافر واحد" } }
              - { kind: divider, gap: s }
              - { kind: meta, text: { en: "Aswan · 20 Feb", ar: "أسوان · 20 فبراير" }, gap: s }
              - { kind: small, text: { en: "4 travellers", ar: "4 مسافرين" } }
    answer: a
    reason:
      prompt: { en: "Why does A work better in dark mode?", ar: "لماذا يعمل A أفضل في الوضع الداكن؟" }
      options:
        - { id: lines, text: { en: "Thin grey lines almost disappear on a dark page; lighter cards stay visible", ar: "الخطوط الرمادية الرفيعة تكاد تختفي على الصفحة الداكنة؛ والبطاقات الأفتح تبقى ظاهرة" } }
        - { id: modern, text: { en: "Cards look more modern than lines", ar: "البطاقات تبدو أحدث من الخطوط" } }
        - { id: space, text: { en: "Cards take less space on the screen", ar: "البطاقات تأخذ مساحة أقل من الشاشة" } }
      answer: [lines]
      misconceptions:
        - id: MC-P05-023
          when: [modern, space]
          feedback:
            en: "It's about seeing, not style. On a dark page, thin grey lines nearly vanish, so the groups blend together."
            ar: "الأمر يتعلّق بالرؤية، لا بالشكل. على الصفحة الداكنة، تكاد الخطوط الرفيعة تختفي، فتختلط الرحلات ببعضها."
    misconceptions:
      - id: MC-P05-023
        when: [b]
        feedback:
          en: "Look at B: the lines are almost invisible, so the three trips run together. Lighter cards show each one clearly."
          ar: "انظر إلى B: الخطوط تكاد لا تُرى، فتختلط الرحلات الثلاث. والبطاقات الأفتح تُظهر كل رحلة بوضوح."
    hints:
      - { en: "In B, can you see the lines between the trips?", ar: "في B، هل ترى الخطوط بين الرحلات؟" }
      - { en: "Which way of separating stays visible on a dark page?", ar: "أي طريقة فصل تبقى ظاهرة على صفحة داكنة؟" }
    correct:
      en: "Right. Lighter cards show the groups; thin lines vanish."
      ar: "صحيح. البطاقات الأفتح تُظهر المجموعات؛ والخطوط الرفيعة تختفي."
    explain:
      en: "In light mode, shadows show layers. In dark mode, use lighter fills: the page is darkest, and each layer on top is a bit lighter."
      ar: "في الوضع الفاتح، الظلال تُظهر الطبقات. وفي الوضع الداكن، استخدم ألوانًا أفتح: الصفحة هي الأغمق، وكل طبقة فوقها أفتح قليلًا."

  - id: S07
    type: tune
    skill: SK-P05-U02-04
    part: independent
    speaker: tarek
    rules: [R14]
    value:
      en: "New case. Text Over Images (NN/g): use a semi-opaque overlay behind the text, a blur, a text shadow or outline. Asking for darker photos fails as soon as a light photo comes."
      ar: "حالة جديدة. النص فوق الصور (NN/g): استخدم طبقة شبه شفافة خلف النص، أو تمويهًا، أو ظلًا أو إطارًا للنص. وطلب صور أغمق يفشل مع أول صورة فاتحة."
    ref: { url: "https://www.nngroup.com/articles/text-over-images/", quote: "Use effects such as a semiopaque overlay (either covering the entire image or just the text portion), a blur, a text shadow or outline, or a combination of these techniques." }
    scenario:
      en: "Our restaurant app's home banner shows the dish of the day. The photo changes every day, and the dish name sits on it in white."
      ar: "في الشاشة الرئيسية لتطبيق مطعمنا، يعرض البانر طبق اليوم. والصورة تتغيّر كل يوم، واسم الطبق مكتوب فوقها بالأبيض."
    prompt:
      en: "Tap each option to see the change. Which one keeps the name readable on any day's photo?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُبقي الاسم مقروءًا على صورة أي يوم؟"
    mock:
      caption: { en: "Now (today's photo)", ar: "الآن (صورة اليوم)" }
      app: lamma
      appbar: { logo: true, actions: [ { icon: shopping-bag, aria: { en: "Basket", ar: "السلة" } } ] }
      blocks:
        - { kind: image, size: l, tone: photo-light, text: { en: "Today: Koshari", ar: "طبق اليوم: كشري" } }
    options:
      - id: darkphoto
        text: { en: "Ask the photographer to send only dark photos", ar: "اطلب من المصوّر أن يرسل صورًا غامقة فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamma
          appbar: { logo: true, actions: [ { icon: shopping-bag, aria: { en: "Basket", ar: "السلة" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-dark, text: { en: "Today: Koshari", ar: "طبق اليوم: كشري" } }
      - id: box
        text: { en: "Put a dark see-through box behind the name", ar: "ضع مربعًا غامقًا شفافًا خلف الاسم" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamma
          appbar: { logo: true, actions: [ { icon: shopping-bag, aria: { en: "Basket", ar: "السلة" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-box, text: { en: "Today: Koshari", ar: "طبق اليوم: كشري" } }
      - id: bigger
        text: { en: "Make the name bigger and bold", ar: "كبّر الاسم واجعله عريضًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamma
          appbar: { logo: true, actions: [ { icon: shopping-bag, aria: { en: "Basket", ar: "السلة" } } ] }
          blocks:
            - { kind: image, size: l, tone: photo-light, px: 28, text: { en: "Today: Koshari", ar: "طبق اليوم: كشري" } }
    answer: [box]
    misconceptions:
      - id: MC-P05-021
        when: [darkphoto]
        feedback:
          en: "That works only until a light photo comes. The box works on every photo, light or dark."
          ar: "هذا ينجح فقط حتى تأتي صورة فاتحة. أما المربع فيعمل مع كل صورة، فاتحة أو غامقة."
      - id: MC-P05-020
        when: [bigger]
        feedback:
          en: "Big white text on a light photo is still white on light. It needs a dark area behind it."
          ar: "النص الأبيض الكبير على صورة فاتحة ما زال أبيض على فاتح. ويحتاج منطقة غامقة خلفه."
    hints:
      - { en: "Tomorrow's photo may be light or dark. Which option works for both?", ar: "صورة الغد قد تكون فاتحة أو غامقة. أي خيار يعمل مع الحالتين؟" }
      - { en: "Which option darkens the area behind the name, whatever the photo?", ar: "أي خيار يجعل المنطقة خلف الاسم أغمق، مهما كانت الصورة؟" }
    correct:
      en: "Right. The box keeps the name readable on any photo."
      ar: "صحيح. المربع يُبقي الاسم مقروءًا على أي صورة."
    explain:
      en: "When photos change, fix the design, not the photos. A dark box, a fade or a blur behind the text works every day."
      ar: "حين تتغيّر الصور، أصلح التصميم لا الصور. فالمربع الغامق أو التدرّج أو التمويه خلف النص يعمل كل يوم."

  - id: S08
    type: card
    part: recap
    icons: [contrast, layers, color, group]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Dark behind white text:** you added a fade and a box behind names on photos.\n- **Worst photo:** you tested the lightest photo, not the easiest one.\n- **Softer colours:** you used a lighter blue in dark mode.\n- **Lighter cards:** you showed groups on a dark page with cards, not thin lines.\n\nNext: the skill check, with all five ideas from this unit."
      ar: "- **خلفية غامقة للنص الأبيض:** أضفت تدرّجًا ومربعًا خلف الأسماء على الصور.\n- **أسوأ صورة:** اختبرت أفتح صورة، لا الأسهل.\n- **ألوان أهدأ:** استخدمت أزرق أفتح في الوضع الداكن.\n- **بطاقات أفتح:** أظهرت المجموعات على الصفحة الداكنة ببطاقات، لا بخطوط رفيعة.\n\nالتالي: اختبار المهارة، بكل الأفكار الخمس في هذه الوحدة."
