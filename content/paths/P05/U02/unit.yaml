id: P05-U02
free: false
title:
  en: "Colour and contrast"
  ar: "الألوان والتباين"
skill:
  en: "Make text and signals easy to see for everyone, including people with weak or colour-blind eyes."
  ar: "اجعل النصوص والإشارات سهلة الرؤية للجميع، ومنهم من نظرهم ضعيف أو لا يميّزون بعض الألوان."
skills:
  - id: SK-P05-U02-01
    title: { en: "Keep text dark enough to read", ar: "اجعل النص غامقًا بما يكفي للقراءة" }
    can_do: { en: "Give text at least 4.5:1 contrast with its background, or 3:1 when it's large or bold.", ar: "اجعل التباين بين النص وخلفيته 4.5:1 على الأقل، أو 3:1 إذا كان النص كبيرًا أو عريضًا." }
  - id: SK-P05-U02-02
    title: { en: "Make things quieter without fading them", ar: "قلّل أهمية العنصر دون أن تجعله باهتًا" }
    can_do: { en: "Lower an element's importance with size, place or fewer items, not pale grey that looks disabled.", ar: "قلّل أهمية العنصر بالحجم أو المكان أو تقليل العناصر، لا باللون الرمادي الفاتح الذي يبدو معطّلًا." }
  - id: SK-P05-U02-03
    title: { en: "Never use colour alone", ar: "لا تعتمد على اللون وحده" }
    can_do: { en: "Add a second sign to colour, like a word, an icon or a mark, and check the screen in grayscale.", ar: "أضف إلى اللون علامة ثانية، مثل كلمة أو أيقونة أو رمز، وافحص الشاشة بالأبيض والأسود." }
  - id: SK-P05-U02-04
    title: { en: "Keep text on photos readable", ar: "اجعل النص فوق الصور سهل القراءة" }
    can_do: { en: "Darken the photo behind the text, and check it with the lightest photo that can appear.", ar: "اجعل الصورة أغمق خلف النص، وافحص النتيجة مع أفتح صورة يمكن أن تظهر." }
  - id: SK-P05-U02-05
    title: { en: "Make dark mode readable", ar: "اجعل الوضع الداكن سهل القراءة" }
    can_do: { en: "In dark mode, use soft light colours instead of strong ones, and separate cards with a lighter fill.", ar: "في الوضع الداكن، استخدم ألوانًا فاتحة هادئة بدل الألوان القوية، وافصل البطاقات بلون أفتح." }
