id: P05-U05
free: false
title:
  en: "Touch, motion and time"
  ar: "اللمس والحركة والوقت"
skill:
  en: "Make gestures, animation and moving content work for people who can't swipe, get dizzy or read slowly."
  ar: "اجعل الإيماءات والحركة والمحتوى المتحرّك مناسبة لمن لا يستطيع السحب، أو يصيبه الدوار، أو يقرأ ببطء."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P05-U05-01
    title: { en: "Give every gesture a visible option", ar: "أعطِ كل إيماءة خيارًا ظاهرًا" }
    can_do: { en: "Put a visible button or menu next to any swipe, drag or long press, so people who can't see or do the gesture can still act.", ar: "ضع زرًا أو قائمة ظاهرة بجانب أي سحب أو جرّ أو ضغطة طويلة، ليستطيع من لا يرى الإيماءة أو لا يقدر عليها أن يُكمل." }
  - id: SK-P05-U05-02
    title: { en: "Make slips easy to undo", ar: "اجعل التراجع عن الأخطاء سهلًا" }
    can_do: { en: "After an easy gesture deletes something, offer a clear Undo or ask first, and keep the item visible while people act on it.", ar: "حين تحذف إيماءة سهلة شيئًا، أعطِ زر تراجع واضحًا أو اسأل أولًا، وأبقِ العنصر ظاهرًا أثناء التعامل معه." }
  - id: SK-P05-U05-03
    title: { en: "Respect \"Reduce motion\"", ar: "احترم إعداد «تقليل الحركة»" }
    can_do: { en: "Avoid flashing, and remove parallax, scroll effects and big moving animations when people turn on \"Reduce motion\".", ar: "تجنّب الوميض، وأزِل حركة الخلفية (Parallax) وتأثيرات التمرير والحركات الكبيرة حين يشغّل الناس «تقليل الحركة»." }
  - id: SK-P05-U05-04
    title: { en: "Keep animations short", ar: "اجعل الحركات قصيرة" }
    can_do: { en: "Keep most animations between 100 and 500 ms, about 100 ms for small feedback, and never make people wait through one.", ar: "اجعل أغلب الحركات بين 100 و500 جزء من الثانية، ونحو 100 للاستجابات الصغيرة، ولا تجعل الناس ينتظرون حركة لينتهوا." }
  - id: SK-P05-U05-05
    title: { en: "Give people time to read", ar: "أعطِ الناس وقتًا ليقرؤوا" }
    can_do: { en: "Don't move content on its own, and don't let important messages vanish after a few seconds.", ar: "لا تجعل المحتوى يتحرّك وحده، ولا تجعل الرسائل المهمة تختفي بعد ثوانٍ." }
