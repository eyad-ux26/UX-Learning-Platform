id: P05-U01-L03
mode: lesson
minutes: 8
title:
  en: "Who gets stuck, and why"
  ar: "من يواجه مشكلات، ولماذا"
speaker: nour
sources:
  - title: { en: "Usability for Older Adults: Challenges and Changes (NN/g)", ar: "قابلية الاستخدام لكبار السن: التحديات والتغيّرات (NN/g)" }
    url: "https://www.nngroup.com/articles/usability-for-senior-citizens/"
  - title: { en: "Inclusive Design (NN/g)", ar: "التصميم الشامل (NN/g)" }
    url: "https://www.nngroup.com/articles/inclusive-design/"
  - title: { en: "Accessible Design for Users With Disabilities (NN/g)", ar: "التصميم المتاح لذوي الإعاقة (NN/g)" }
    url: "https://www.nngroup.com/articles/accessible-design-for-users-with-disabilities/"
review_labels:
  MC-P05-009: { en: "Clean up the format yourself; don't reject it", ar: "نظّف طريقة الكتابة بنفسك؛ لا ترفضها" }
  MC-P05-010: { en: "Let people type instead of forcing a hard picker", ar: "دع الناس يكتبون بدل أداة اختيار صعبة" }
  MC-P05-011: { en: "Real names have spaces, dashes and length", ar: "الأسماء الحقيقية فيها مسافات وشرطات، وقد تكون طويلة" }
  MC-P05-012: { en: "Let text follow the person's size setting", ar: "اجعل النص يتبع حجم الخط الذي اختاره الشخص" }
  MC-P05-013: { en: "Offer dark mode; don't force it", ar: "اترك الوضع الداكن اختيارًا؛ لا تفرضه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mrs. Fatma books a check-up", ar: "السيدة فاطمة تحجز موعد فحص" }
    body:
      en: "Mrs. Fatma is 72. She books her check-ups in our clinic app. Last week, she called reception three times for help.\n\nThe app said her phone number was wrong. She couldn't set the time on the time wheel. And the text was too small for her to read."
      ar: "السيدة فاطمة عمرها 72 سنة. وتحجز مواعيد الفحص في تطبيق عيادتنا. والأسبوع الماضي، اتصلت بالاستقبال ثلاث مرات تطلب المساعدة.\n\nقال لها التطبيق إن رقم هاتفها خطأ. ولم تستطع ضبط الوقت على عجلة الوقت. وكان الخط صغيرًا جدًا عليها."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Book a check-up", ar: "احجز موعد فحص" } }
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Numbers only", ar: "أرقام فقط" }, gap: m }
        - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" }, gap: m }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "10:29" }
            - { kind: text, weight: bold, text: "10:30" }
            - { kind: small, color: faint, text: "10:31" }
        - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }

  - id: S02
    type: tune
    skill: SK-P05-U01-04
    part: try
    rules: [R12]
    value:
      en: "Try first. Usability for Older Adults (NN/g): older users were often punished for typing dashes or brackets in phone and card numbers. Accept them and strip them yourself; a clearer error still makes people redo it."
      ar: "جرّب أولًا. قابلية الاستخدام لكبار السن (NN/g): كثيرًا ما رفضت التطبيقات أرقام الهاتف والبطاقات لأن كبار السن كتبوها بشرطات أو أقواس. اقبلها واحذفها بنفسك؛ فالرسالة الأوضح ما زالت تجبر الناس على الإعادة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "punished for entering hyphens or parentheses in telephone or credit-card numbers" }
    scenario:
      en: "Mrs. Fatma typed her mobile number with dashes: 010-1234-5678. The app says \"Numbers only\"."
      ar: "كتبت السيدة فاطمة رقم موبايلها بشرطات: 010-1234-5678. فقال التطبيق «أرقام فقط»."
    prompt:
      en: "Tap each option to see the change. Which one lets Mrs. Fatma book with the number exactly as she typed it?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يسمح للسيدة فاطمة بالحجز بالرقم كما كتبته بالضبط؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &phonenow
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Numbers only", ar: "أرقام فقط" } }
    options:
      - id: accept
        text: { en: "Accept the number, and let the app remove the dashes by itself", ar: "اقبل الرقم، واجعل التطبيق يحذف الشرطات بنفسه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678" }
            - { kind: small, color: green, text: { en: "✓ Saved", ar: "✓ تم الحفظ" }, gap: xs }
      - id: clear
        text: { en: "Keep saying no, but with a clearer message", ar: "استمرّ في رفض الرقم، لكن برسالة أوضح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Please type numbers only, with no dashes or spaces.", ar: "من فضلك اكتب الأرقام فقط، بدون شرطات أو مسافات." } }
      - id: boxes
        text: { en: "Split the number into three boxes", ar: "قسّم الرقم إلى ثلاثة مربعات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Mobile number", ar: "رقم الموبايل" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: field, text: "010" }
                - { kind: field, text: "1234" }
                - { kind: field, text: "5678" }
    answer: [accept]
    misconceptions:
      - id: MC-P05-009
        when: [clear]
        feedback:
          en: "A clearer message still says no: Mrs. Fatma has to find the dashes and delete them one by one. The app can remove them in a second."
          ar: "الرسالة الأوضح ما زالت ترفض الرقم: على السيدة فاطمة أن تجد الشرطات وتحذفها واحدة واحدة. والتطبيق يستطيع حذفها في ثانية."
      - id: MC-P05-009
        when: [boxes]
        feedback:
          en: "Three boxes bring new problems: moving from box to box, and numbers that don't split the same way. The app can read the number the way she types it."
          ar: "المربعات الثلاثة تأتي بمشكلات جديدة: الانتقال من مربع لآخر، وأرقام لا تنقسم بنفس الطريقة. والتطبيق يستطيع أن يقرأ الرقم كما تكتبه هي."
    hints:
      - { en: "Is the number itself wrong, or only the way it's written?", ar: "هل الرقم نفسه خطأ، أم طريقة كتابته فقط؟" }
      - { en: "Who can remove the dashes more easily: Mrs. Fatma, or the app?", ar: "من يستطيع حذف الشرطات بسهولة أكبر: السيدة فاطمة، أم التطبيق؟" }
    correct:
      en: "Right. Accept it as she typed it, and clean it up yourself."
      ar: "صحيح. اقبله كما كتبته، ونظّفه أنت."
    explain:
      en: "Her number was right; only the dashes looked \"wrong\". Accept spaces and dashes, and remove them in the code. People shouldn't have to fix what the app can fix."
      ar: "رقمها كان صحيحًا؛ والشرطات فقط بدت «خطأ». اقبل المسافات والشرطات، واحذفها في الكود. فلا يجب أن يُصلح الناس ما يستطيع التطبيق إصلاحه."

  - id: S03
    type: card
    part: concept
    icons: [person, type, form, size, eye]
    title: { en: "Who gets stuck, and why", ar: "من يواجه مشكلات، ولماذا" }
    body:
      en: "Our eyes, hands and memory change as we get older. By their 40s, many people already need bigger text. Older people make more typing mistakes, and find small controls hard to use.\n\n- **Accept what people type:** take dashes, spaces and real names as they are, and clean them up yourself.\n- **Let people type:** a box they can type in is better than a wheel or picker that's hard to control.\n- **Text that grows:** let text follow the phone's text size, and add a bigger-text button on reading screens.\n- **Dark mode is a choice:** some eyes read better on a dark screen, and others don't. Offer it; don't force it."
      ar: "العين واليد والذاكرة تتغيّر مع العمر. ففي سن الأربعين، يحتاج كثير من الناس خطًا أكبر. وكبار السن يخطئون في الكتابة أكثر، ويصعب عليهم استخدام العناصر الصغيرة.\n\n- **اقبل ما يكتبه الناس:** خذ الشرطات والمسافات والأسماء الحقيقية كما هي، ونظّفها أنت.\n- **دع الناس يكتبون:** المربع الذي يكتبون فيه أفضل من عجلة أو أداة اختيار صعبة التحكّم.\n- **خط يكبر:** اجعل النص يتبع حجم الخط في الهاتف، وأضف زرًا لتكبير النص في شاشات القراءة.\n- **الوضع الداكن اختيار:** بعض العيون تقرأ أفضل على شاشة داكنة، وبعضها لا. اعرضه كاختيار؛ ولا تفرضه."

  - id: S04
    type: tune
    skill: SK-P05-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Usability for Older Adults (NN/g): many apps accepted input in only one form; a participant fighting a finicky time selector asked why she couldn't just type the time. A typed time field removes the fiddly control; a bigger wheel is still a wheel."
      ar: "قابلية الاستخدام لكبار السن (NN/g): كثير من التطبيقات قبلت الإدخال بشكل واحد فقط؛ وسألت مشاركة تعبت مع أداة الوقت: لماذا لا أكتب الوقت ببساطة؟ مربع الوقت يُلغي الأداة الصعبة؛ والعجلة الأكبر تبقى عجلة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "Many sites and apps accepted user inputs in only one form" }
    scenario:
      en: "Mrs. Fatma wants 10:30. The time wheel moves one minute each time she moves it a little. Her finger keeps going past 10:30."
      ar: "تريد السيدة فاطمة الساعة 10:30. وعجلة الوقت تتحرّك دقيقة واحدة مع كل حركة صغيرة. وإصبعها يتجاوز 10:30 في كل مرة."
    prompt:
      en: "Tap each option to see the change. Which one lets Mrs. Fatma set 10:30 most easily?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل السيدة فاطمة تضبط 10:30 بأسهل شكل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &wheelnow
        - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" } }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "10:36" }
            - { kind: text, weight: bold, text: "10:37" }
            - { kind: small, color: faint, text: "10:38" }
    options:
      - id: big
        text: { en: "Keep the wheel, with bigger numbers", ar: "أبقِ العجلة، مع أرقام أكبر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" } }
            - kind: group
              tone: plain
              gap: xs
              blocks:
                - { kind: text, color: pale, px: 20, text: "10:36" }
                - { kind: text, weight: bold, px: 26, text: "10:37" }
                - { kind: text, color: pale, px: 20, text: "10:38" }
      - id: type
        text: { en: "A box where she can type the time", ar: "مربع تكتب فيه الوقت" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Time", ar: "الوقت" }, filled: true, text: "10:30", hint: { en: "For example 10:30", ar: "مثلًا 10:30" } }
      - id: keep
        text: { en: "Keep the wheel; it never gives a wrong time", ar: "أبقِ العجلة؛ فهي لا تسمح بوقت خطأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *wheelnow
    answer: [type]
    misconceptions:
      - id: MC-P05-010
        when: [big, keep]
        feedback:
          en: "The wheel itself is the problem: she needs a very steady finger to stop at one exact minute out of sixty. Bigger numbers don't make her finger steadier."
          ar: "العجلة نفسها هي المشكلة: تحتاج إصبعًا ثابتًا جدًا لتتوقّف عند دقيقة واحدة من ستين. والأرقام الأكبر لا تجعل الإصبع أثبت."
    hints:
      - { en: "What does the wheel need from her hand?", ar: "ماذا تحتاج العجلة من يدها؟" }
      - { en: "Mrs. Fatma already knows the time she wants. Which option lets her just enter it?", ar: "السيدة فاطمة تعرف الوقت الذي تريده. أي خيار يسمح لها أن تُدخله ببساطة؟" }
    correct:
      en: "Right. Let her type the time she already knows."
      ar: "صحيح. دعها تكتب الوقت الذي تعرفه."
    explain:
      en: "A wheel or picker that needs exact moves needs a steady hand. A box she can type in only asks for the time she already knows."
      ar: "العجلة أو أداة الاختيار التي تحتاج حركة دقيقة، تحتاج يدًا ثابتة. أما المربع فلا يطلب منها إلا الوقت الذي تعرفه."

  - id: S05
    type: tune
    skill: SK-P05-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Inclusive Design (NN/g): last-name restrictions like character limits or no hyphens exclude real people. Arabic names in Latin letters often have spaces, hyphens and length."
      ar: "التصميم الشامل (NN/g): قيود الاسم مثل حدّ عدد الحروف أو منع الشرطات تستبعد أشخاصًا حقيقيين. والأسماء العربية المكتوبة بحروف إنجليزية كثيرًا ما يكون فيها مسافات وشرطات وطول."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "Restrictions like character limits, no hyphens, or restrictions on names that are spelled the same as inappropriate English words can make some people feel excluded." }
    scenario:
      en: "Our sign-up form asks for the name in English letters. It accepts letters only, up to 12. Mrs. Fatma's son wants to sign her up as \"Fatma Abdel-Aziz El-Sayed\", as it's written on her ID."
      ar: "نموذج التسجيل عندنا يطلب الاسم بالحروف الإنجليزية. ويقبل الحروف فقط، وحتى 12 حرفًا. ويريد ابن السيدة فاطمة أن يسجّلها باسم «Fatma Abdel-Aziz El-Sayed»، كما هو مكتوب في بطاقتها."
    prompt:
      en: "Tap each option to see the change. Which one lets him enter her name exactly as it is on her ID?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يسمح له بكتابة اسمها كما هو في البطاقة بالضبط؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &namenow
        - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: "Fatma Abdel-", tone: bad, error: { en: "Letters only, up to 12", ar: "حروف فقط، حتى 12 حرفًا" } }
    options:
      - id: first
        text: { en: "Ask for the first name only", ar: "اطلب الاسم الأول فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, filled: true, text: "Fatma" }
      - id: rule
        text: { en: "Keep the rule, and explain it above the box", ar: "أبقِ القاعدة، واشرحها فوق المربع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, hintFirst: true, hint: { en: "Letters only, no spaces or dashes, up to 12", ar: "حروف فقط، بدون مسافات أو شرطات، حتى 12 حرفًا" }, filled: true, text: "FatmaAbdelAz" }
      - id: allow
        text: { en: "Allow spaces, dashes, the ' sign and long names", ar: "اسمح بالمسافات والشرطات وعلامة ' والأسماء الطويلة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: "Fatma Abdel-Aziz El-Sayed" }
    answer: [allow]
    misconceptions:
      - id: MC-P05-011
        when: [rule]
        feedback:
          en: "Now the rule is clear, but he still can't enter her real name. Her clinic record won't match her ID."
          ar: "صارت القاعدة واضحة، لكنه ما زال لا يستطيع كتابة اسمها الحقيقي. ولن يتطابق ملفها في العيادة مع بطاقتها."
      - id: MC-P05-011
        when: [first]
        feedback:
          en: "The clinic needs her full name to find her file. Asking for less hides the problem; it doesn't fix the rule."
          ar: "العيادة تحتاج اسمها الكامل لتجد ملفها. وطلب جزء من الاسم يُخفي المشكلة، ولا يُصلح القاعدة."
    hints:
      - { en: "Is her name wrong, or is the rule wrong?", ar: "هل اسمها خطأ، أم القاعدة خطأ؟" }
      - { en: "In which option does the box show her full name?", ar: "في أي خيار يظهر اسمها الكامل في المربع؟" }
    correct:
      en: "Right. Make the box fit real names."
      ar: "صحيح. اجعل المربع يناسب الأسماء الحقيقية."
    explain:
      en: "Real names have spaces, dashes, the ' sign and many parts. A box that says no to them tells people: this app isn't for you."
      ar: "الأسماء الحقيقية فيها مسافات وشرطات وعلامة ' وأجزاء كثيرة. والمربع الذي يرفضها يقول للناس: هذا التطبيق ليس لك."

  - id: S06
    type: tune
    skill: SK-P05-U01-05
    part: guided
    rules: [R06]
    value:
      en: "Accessible Design for Users With Disabilities (NN/g): never set text in absolute sizes; use relative sizes so text grows with the person's setting. People need bigger text long before old age."
      ar: "التصميم المتاح لذوي الإعاقة (NN/g): لا تثبّت حجم الخط أبدًا؛ استخدم أحجامًا نسبية ليكبر الخط مع إعداد الشخص. والناس يحتاجون خطًا أكبر قبل الشيخوخة بكثير."
    ref: { url: "https://www.nngroup.com/articles/accessible-design-for-users-with-disabilities/", quote: "never encode information with absolute font sizes but use relative sizes instead" }
    scenario:
      en: "Mrs. Fatma set her phone's text size to the biggest. Our app doesn't follow that setting: its text always stays at 13 px."
      ar: "ضبطت السيدة فاطمة حجم الخط في هاتفها على أكبر حجم. لكن تطبيقنا لا يتبع هذا الإعداد: الخط فيه يبقى دائمًا 13 بكسل."
    prompt:
      en: "Tap each option to see the change. Which one lets Mrs. Fatma read the text in the size she chose?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل السيدة فاطمة تقرأ النص بالحجم الذي اختارته؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &sizenow
        - { kind: heading, px: 15, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
        - { kind: text, px: 13, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك تعالي قبل الموعد بعشر دقائق، ومعك بطاقتك." }, gap: xs }
    options:
      - id: follow
        text: { en: "Let the text follow her phone's size, and let the screen grow with it", ar: "اجعل النص يتبع حجم الخط في هاتفها، ودع الشاشة تتّسع معه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 24, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
            - { kind: text, px: 21, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك تعالي قبل الموعد بعشر دقائق، ومعك بطاقتك." }, gap: xs }
      - id: fixed
        text: { en: "Keep the text size fixed so the screen stays neat", ar: "أبقِ حجم الخط ثابتًا لتبقى الشاشة مرتّبة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *sizenow
      - id: bold
        text: { en: "Keep 13 px, but make all the text bold", ar: "أبقِ 13 بكسل، لكن اجعل كل النص عريضًا (Bold)" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 15, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
            - { kind: text, px: 13, weight: bold, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك تعالي قبل الموعد بعشر دقائق، ومعك بطاقتك." }, gap: xs }
    answer: [follow]
    misconceptions:
      - id: MC-P05-012
        when: [fixed, bold]
        feedback:
          en: "Mrs. Fatma already told her phone she needs bigger text. An app that ignores it cancels her choice. And bold text at 13 px is still small."
          ar: "السيدة فاطمة أخبرت هاتفها أنها تحتاج خطًا أكبر. والتطبيق الذي يتجاهل ذلك يُلغي اختيارها. والخط العريض بحجم 13 بكسل يبقى صغيرًا."
    hints:
      - { en: "What did Mrs. Fatma already change on her phone?", ar: "ماذا غيّرت السيدة فاطمة في هاتفها؟" }
      - { en: "Which option follows that setting?", ar: "أي خيار يتبع هذا الإعداد؟" }
    correct:
      en: "Right. Her setting matters more than a neat screen."
      ar: "صحيح. إعدادها أهم من شاشة مرتّبة."
    explain:
      en: "Don't fix the text size. Let it grow with the phone's setting, and design screens that can stretch. A neat screen that nobody can read helps no one."
      ar: "لا تثبّت حجم الخط. دعه يكبر مع إعداد الهاتف، وصمّم شاشات تتّسع. فالشاشة المرتّبة التي لا يستطيع أحد قراءتها لا تفيد أحدًا."

  - id: S07
    type: compare
    skill: SK-P05-U01-05
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: dark mode can help some readers, but not everyone. Inclusive Design (NN/g): for older eyes with cataracts, consider (but don't enforce) a dark-mode option, and use the phone's dark-mode setting."
      ar: "مقارنة: الوضع الداكن قد يساعد بعض القرّاء، لا الجميع. التصميم الشامل (NN/g): لكبار السن المصابين بالمياه البيضاء، فكّر في خيار للوضع الداكن (دون فرضه)، واستفد من إعداد الوضع الداكن في الهاتف."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "consider (but do not enforce) a dark-mode option for your UIs" }
    scenario:
      en: "Some older patients say our bright white screens are hard to read. Others are happy with them. My team designed two versions of the display settings."
      ar: "بعض المرضى كبار السن يقولون إن شاشاتنا البيضاء الساطعة صعبة القراءة. وآخرون مرتاحون لها. وصمّم فريقي نسختين من إعدادات العرض."
    prompt:
      en: "Which version works for both kinds of patients?"
      ar: "أي نسخة تناسب النوعين من المرضى؟"
    a:
      label: { en: "Version A", ar: "النسخة A" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Display", ar: "العرض" } }
          - { kind: banner, text: { en: "New look: the app is now dark for everyone.", ar: "شكل جديد: التطبيق الآن داكن للجميع." }, gap: m }
    b:
      label: { en: "Version B", ar: "النسخة B" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Display", ar: "العرض" } }
          - { kind: small, weight: bold, text: { en: "Theme", ar: "المظهر" }, gap: m }
          - { kind: segmented, options: [{ en: "Light", ar: "فاتح" }, { en: "Dark", ar: "داكن" }, { en: "Like my phone", ar: "مثل هاتفي" }], value: 2, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better for older patients?", ar: "لماذا B أفضل للمرضى كبار السن؟" }
      options:
        - { id: battery, text: { en: "Dark screens use less battery", ar: "الشاشات الداكنة تستهلك بطارية أقل" } }
        - { id: choice, text: { en: "Dark helps some eyes and not others, so each person picks", ar: "الداكن يساعد بعض العيون دون غيرها، فيختار كل شخص ما يناسبه" } }
        - { id: light, text: { en: "Light screens are always easier to read", ar: "الشاشات الفاتحة أسهل في القراءة دائمًا" } }
      answer: [choice]
      misconceptions:
        - id: MC-P05-013
          when: [battery, light]
          feedback:
            en: "Neither is the reason. Some eyes, like eyes with cataracts, read better on dark; many others read better on light. So let each person choose, starting from their phone's setting."
            ar: "لا هذا ولا ذاك هو السبب. بعض العيون، مثل المصابة بالمياه البيضاء، تقرأ أفضل على الداكن؛ وعيون كثيرة غيرها تقرأ أفضل على الفاتح. لذلك دع كل شخص يختار، والبداية من إعداد هاتفه."
    misconceptions:
      - id: MC-P05-013
        when: [a]
        feedback:
          en: "Making everything dark swaps one problem for another: patients who read better on white now have trouble. Offer dark as a choice."
          ar: "جعل كل شيء داكنًا يستبدل مشكلة بمشكلة: فالمرضى الذين يقرؤون أفضل على الأبيض سيتعبون الآن. اعرض الداكن كاختيار."
    hints:
      - { en: "Do all older patients find white screens hard to read?", ar: "هل كل المرضى كبار السن يجدون الشاشات البيضاء صعبة القراءة؟" }
      - { en: "Which version still works for a patient who reads better on white?", ar: "أي نسخة ما زالت تناسب مريضًا يقرأ أفضل على الأبيض؟" }
    correct:
      en: "Right. Offer dark mode; don't force it."
      ar: "صحيح. اعرض الوضع الداكن كاختيار؛ ولا تفرضه."
    explain:
      en: "Different eyes need different screens. Start from the phone's own setting, and let people switch, so nobody is stuck with the wrong one."
      ar: "العيون المختلفة تحتاج شاشات مختلفة. ابدأ من إعداد الهاتف نفسه، ودع الناس يغيّرون، حتى لا يُجبَر أحد على الشاشة التي لا تناسبه."

  - id: S08
    type: tune
    skill: SK-P05-U01-05
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. Inclusive Design (NN/g): the most common complaint from older users was text that's hard to read; use legible fonts and offer a button to increase the font size. Lighter text makes it worse."
      ar: "حالة جديدة. التصميم الشامل (NN/g): أكثر شكوى من كبار السن كانت صعوبة قراءة النص؛ استخدم خطوطًا واضحة وأضف زرًا لتكبير الخط. والنص الأفتح يزيد المشكلة."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "offer a button for users to increase the font size" }
    scenario:
      en: "My spice shop's app has long recipe pages. Many of my customers are older, and some say the recipes are hard to read."
      ar: "تطبيق متجر التوابل الذي أملكه فيه صفحات وصفات طويلة. وكثير من عملائي كبار في السن، وبعضهم يقول إن الوصفات صعبة القراءة."
    prompt:
      en: "Tap each option to see the change. Which one makes the recipe easier for them to read?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل قراءة الوصفة أسهل عليهم؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &recipenow
        - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
        - { kind: text, px: 13, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
    options:
      - id: light
        text: { en: "Make the text a lighter grey, for a softer look", ar: "اجعل لون النص رماديًا أفتح، ليبدو أهدأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
            - { kind: text, px: 13, color: pale, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
      - id: keep
        text: { en: "Change nothing; it's the same size as the rest of the app", ar: "لا تغيّر شيئًا؛ فهو بنفس حجم باقي النصوص في التطبيق" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *recipenow
      - id: button
        text: { en: "Add an \"A A\" button that makes the recipe text bigger", ar: "أضف زر «A A» يكبّر نص الوصفة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: row
              blocks:
                - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
                - { kind: chip, text: "A A" }
            - { kind: text, px: 20, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
    answer: [button]
    misconceptions:
      - id: MC-P05-012
        when: [keep]
        feedback:
          en: "Being the same as the rest of the app doesn't help: customers already say this text is hard to read. On long reading screens, give them a way to make it bigger."
          ar: "أن يكون مثل باقي التطبيق لا يفيد: فالعملاء يقولون إن هذا النص صعب القراءة. وفي شاشات القراءة الطويلة، أعطهم طريقة لتكبيره."
      - id: MC-P05-012
        when: [light]
        feedback:
          en: "Lighter grey is closer to the white background, so the text gets harder to read, not easier."
          ar: "الرمادي الأفتح أقرب إلى لون الخلفية البيضاء، فيصبح النص أصعب في القراءة، لا أسهل."
    hints:
      - { en: "What exactly do customers say is wrong with the recipes?", ar: "ما المشكلة التي يقولها العملاء عن الوصفات بالضبط؟" }
      - { en: "Which option makes the words themselves bigger?", ar: "أي خيار يكبّر الكلمات نفسها؟" }
    correct:
      en: "Right. Give readers a button to make text bigger."
      ar: "صحيح. أعطِ القرّاء زرًا لتكبير النص."
    explain:
      en: "On long reading screens, a text-size button people can see lets anyone make the words bigger with one tap, and the lines still fit the screen."
      ar: "في شاشات القراءة الطويلة، زر حجم الخط الظاهر يسمح لأي شخص بتكبير الكلمات بضغطة واحدة، وتبقى الأسطر داخل الشاشة."

  - id: S09
    type: card
    part: recap
    icons: [type, form, size, eye]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Phone numbers:** you accepted dashes and let the app remove them.\n- **Time:** you let Mrs. Fatma type 10:30 instead of fighting a wheel.\n- **Names:** you let the box take real names with dashes and spaces.\n- **Text size:** you made text follow the phone's setting, and gave readers a bigger-text button.\n- **Dark mode:** you offered it as a choice instead of forcing it.\n\nNext: the skill check."
      ar: "- **أرقام الهاتف:** قبلت الشرطات، وجعلت التطبيق يحذفها بنفسه.\n- **الوقت:** تركت السيدة فاطمة تكتب 10:30 بدل التعب مع العجلة.\n- **الأسماء:** جعلت المربع يقبل الأسماء الحقيقية بشرطاتها ومسافاتها.\n- **حجم الخط:** جعلت النص يتبع إعداد الهاتف، وأعطيت القرّاء زرًا لتكبيره.\n- **الوضع الداكن:** عرضته كاختيار، ولم تفرضه.\n\nالتالي: اختبار المهارة."
