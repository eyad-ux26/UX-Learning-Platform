id: P05-U01-L03
mode: lesson
minutes: 8
title:
  en: "Who gets blocked, and by what"
  ar: "من يتعثّر، وبماذا"
speaker: nour
sources:
  - title: { en: "Usability for Older Adults: Challenges and Changes (NN/g)", ar: "قابلية الاستخدام لكبار السن: التحديات والتغيّرات (NN/g)" }
    url: "https://www.nngroup.com/articles/usability-for-senior-citizens/"
  - title: { en: "Inclusive Design (NN/g)", ar: "التصميم الشامل (NN/g)" }
    url: "https://www.nngroup.com/articles/inclusive-design/"
  - title: { en: "Accessible Design for Users With Disabilities (NN/g)", ar: "التصميم المتاح لذوي الإعاقة (NN/g)" }
    url: "https://www.nngroup.com/articles/accessible-design-for-users-with-disabilities/"
review_labels:
  MC-P05-009: { en: "Clean up the format yourself; don't reject it", ar: "نظّف الصيغة بنفسك؛ لا ترفضها" }
  MC-P05-010: { en: "Let people type instead of forcing a fiddly picker", ar: "دع الناس يكتبون بدل إجبارهم على أداة اختيار مُتعبة" }
  MC-P05-011: { en: "Real names have spaces, dashes and length", ar: "الأسماء الحقيقية فيها مسافات وشرطات وطول" }
  MC-P05-012: { en: "Let text follow the person's size setting", ar: "اجعل النص يتبع إعداد الحجم عند الشخص" }
  MC-P05-013: { en: "Offer dark mode; don't force it", ar: "قدّم الوضع الداكن؛ لا تفرضه" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Mrs. Fatma books a check-up", ar: "السيدة فاطمة تحجز فحصًا" }
    body:
      en: "Mrs. Fatma is 72 and books her check-ups in our clinic app. Last week she called reception three times.\n\nThe app rejected her phone number. She couldn't set the time on the time wheel. And the text was too small for her to read."
      ar: "السيدة فاطمة عمرها 72 عامًا، وتحجز فحوصاتها في تطبيق عيادتنا. والأسبوع الماضي اتصلت بالاستقبال ثلاث مرات.\n\nرفض التطبيق رقم هاتفها. ولم تستطع ضبط الوقت على عجلة الوقت. وكان النص أصغر من أن تقرأه."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Book a check-up", ar: "احجز فحصًا" } }
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Numbers only", ar: "أرقام فقط" }, gap: m }
        - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" }, gap: m }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "10:29" }
            - { kind: text, weight: bold, text: "10:30" }
            - { kind: small, color: faint, text: "10:31" }
        - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }

  - id: S02
    type: tune
    skill: SK-P05-U01-04
    part: try
    rules: [R12]
    value:
      en: "Try first. Usability for Older Adults (NN/g): older users were often punished for typing dashes or brackets in phone and card numbers. Accept them and strip them yourself; a clearer error still makes people redo it."
      ar: "جرّب أولًا. قابلية الاستخدام لكبار السن (NN/g): كثيرًا ما عوقب كبار السن على كتابة شرطات أو أقواس في أرقام الهاتف والبطاقات. اقبلها واحذفها بنفسك؛ فالرسالة الأوضح ما زالت تجبر الناس على الإعادة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "punished for entering hyphens or parentheses in telephone or credit-card numbers" }
    prompt:
      en: "Mrs. Fatma typed her number with dashes. Try each version. Which one should ship?"
      ar: "كتبت السيدة فاطمة رقمها بشرطات. جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &phonenow
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Numbers only", ar: "أرقام فقط" } }
    options:
      - id: accept
        text: { en: "Accept it, and remove the dashes in the background", ar: "اقبله، واحذف الشرطات في الخلفية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678" }
            - { kind: small, color: green, text: { en: "✓ Saved", ar: "✓ تم الحفظ" }, gap: xs }
      - id: clear
        text: { en: "Keep rejecting it, with a clearer message", ar: "استمرّ في رفضه، مع رسالة أوضح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "010-1234-5678", tone: bad, error: { en: "Please type digits only, with no dashes or spaces.", ar: "من فضلك اكتب الأرقام فقط، دون شرطات أو مسافات." } }
      - id: boxes
        text: { en: "Split the number into three boxes", ar: "قسّم الرقم إلى ثلاثة مربعات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Mobile number", ar: "رقم الموبايل" } }
            - kind: row
              gap: xs
              blocks:
                - { kind: field, text: "010" }
                - { kind: field, text: "1234" }
                - { kind: field, text: "5678" }
    answer: [accept]
    misconceptions:
      - id: MC-P05-009
        when: [clear]
        feedback:
          en: "A clearer message is still a rejection: Mrs. Fatma has to find the dashes and delete them one by one. The app can remove them in a split second."
          ar: "الرسالة الأوضح ما زالت رفضًا: على السيدة فاطمة أن تجد الشرطات وتحذفها واحدة واحدة. والتطبيق يستطيع حذفها في لحظة."
      - id: MC-P05-009
        when: [boxes]
        feedback:
          en: "Three boxes add new problems: jumping between boxes, and numbers that don't split the same way. The app can read the number as she types it."
          ar: "ثلاثة مربعات تضيف مشكلات جديدة: التنقّل بين المربعات، وأرقام لا تنقسم بالطريقة نفسها. والتطبيق يستطيع قراءة الرقم كما تكتبه."
    hints:
      - { en: "Is anything wrong with the number itself, or only with how it's written?", ar: "هل في الرقم نفسه خطأ، أم في طريقة كتابته فقط؟" }
      - { en: "Who can remove dashes more easily: Mrs. Fatma, or the app?", ar: "من يستطيع حذف الشرطات بسهولة أكبر: السيدة فاطمة، أم التطبيق؟" }
    correct:
      en: "Right. Accept the format, then clean it up yourself."
      ar: "صحيح. اقبل الصيغة، ثم نظّفها بنفسك."
    explain:
      en: "Her number was right; only the dashes were \"wrong\". Accept spaces and dashes, and remove them in the code. Nobody has to fix what the app can fix."
      ar: "رقمها كان صحيحًا؛ والشرطات فقط كانت «خطأ». اقبل المسافات والشرطات، واحذفها في الكود. فلا يضطر أحد لإصلاح ما يستطيع التطبيق إصلاحه."

  - id: S03
    type: card
    part: concept
    icons: [person, type, form, size, eye]
    title: { en: "Who gets blocked, and by what", ar: "من يتعثّر، وبماذا" }
    body:
      en: "Eyes, hands and memory change with age. By their 40s, many people already need bigger text. Older users make more typing mistakes and struggle with small, fiddly controls.\n\n- **Accept what people type:** take dashes, spaces and real names as they are, and clean them up yourself.\n- **Let people type:** a box they can type in beats a fiddly wheel or picker.\n- **Text that grows:** let text follow the phone's text size, and offer a bigger-text button on reading screens.\n- **Dark mode as a choice:** some eyes read better on a dark screen, others don't. Offer it; don't force it."
      ar: "تتغيّر العين واليد والذاكرة مع العمر. ففي الأربعينيات، يحتاج كثير من الناس نصًا أكبر. ويخطئ كبار السن في الكتابة أكثر، ويتعبون مع العناصر الصغيرة الدقيقة.\n\n- **اقبل ما يكتبه الناس:** خذ الشرطات والمسافات والأسماء الحقيقية كما هي، ونظّفها بنفسك.\n- **دع الناس يكتبون:** المربع الذي يكتبون فيه أفضل من عجلة أو أداة اختيار مُتعبة.\n- **نص يكبر:** اجعل النص يتبع حجم الخط في الهاتف، وقدّم زرًا لتكبير النص في شاشات القراءة.\n- **الوضع الداكن اختيار:** بعض العيون تقرأ أفضل على شاشة داكنة، وبعضها لا. قدّمه؛ ولا تفرضه."

  - id: S04
    type: tune
    skill: SK-P05-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Usability for Older Adults (NN/g): many apps accepted input in only one form; a participant fighting a finicky time selector asked why she couldn't just type the time. A typed time field removes the fiddly control; a bigger wheel is still a wheel."
      ar: "قابلية الاستخدام لكبار السن (NN/g): كثير من التطبيقات قبلت الإدخال بشكل واحد فقط؛ وسألت مشاركة تصارع أداة وقت مُتعبة لماذا لا تستطيع أن تكتب الوقت ببساطة. حقل الوقت المكتوب يزيل العنصر المُتعب؛ والعجلة الأكبر تظل عجلة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "Many sites and apps accepted user inputs in only one form" }
    scenario:
      en: "Mrs. Fatma wants 10:30. The time wheel moves one minute per notch, and her finger keeps overshooting."
      ar: "تريد السيدة فاطمة الساعة 10:30. وعجلة الوقت تتحرّك دقيقة مع كل درجة، وإصبعها يتجاوز الوقت في كل مرة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &wheelnow
        - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" } }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "10:36" }
            - { kind: text, weight: bold, text: "10:37" }
            - { kind: small, color: faint, text: "10:38" }
    options:
      - id: big
        text: { en: "Keep the wheel, with bigger numbers", ar: "أبقِ العجلة، بأرقام أكبر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Time", ar: "الوقت" } }
            - kind: group
              tone: plain
              gap: xs
              blocks:
                - { kind: text, color: pale, px: 20, text: "10:36" }
                - { kind: text, weight: bold, px: 26, text: "10:37" }
                - { kind: text, color: pale, px: 20, text: "10:38" }
      - id: type
        text: { en: "A time box she can type in", ar: "مربع للوقت تكتب فيه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Time", ar: "الوقت" }, filled: true, text: "10:30", hint: { en: "For example 10:30", ar: "مثلًا 10:30" } }
      - id: keep
        text: { en: "Keep the wheel; it can't produce an invalid time", ar: "أبقِ العجلة؛ فهي لا تسمح بوقت غير صالح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *wheelnow
    answer: [type]
    misconceptions:
      - id: MC-P05-010
        when: [big, keep]
        feedback:
          en: "The wheel itself is the problem: it needs a steady finger to stop at one exact minute out of sixty. Bigger numbers don't make the finger steadier."
          ar: "العجلة نفسها هي المشكلة: تحتاج إصبعًا ثابتًا ليتوقّف عند دقيقة واحدة بالضبط من ستين. والأرقام الأكبر لا تجعل الإصبع أثبت."
    hints:
      - { en: "What does the wheel ask of her hand?", ar: "ماذا تطلب العجلة من يدها؟" }
      - { en: "Mrs. Fatma already knows the exact time she wants. Which version lets her just enter it?", ar: "السيدة فاطمة تعرف الوقت الذي تريده بالضبط. أي نسخة تتيح لها أن تُدخله ببساطة؟" }
    correct:
      en: "Right. Let her type the time she already knows."
      ar: "صحيح. دعها تكتب الوقت الذي تعرفه."
    explain:
      en: "A precise wheel or picker needs a steady hand. A box she can type in asks only for the time she already knows."
      ar: "العجلة أو أداة الاختيار الدقيقة تحتاج يدًا ثابتة. أما المربع الذي تكتب فيه فلا يطلب إلا الوقت الذي تعرفه."

  - id: S05
    type: tune
    skill: SK-P05-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Inclusive Design (NN/g): last-name restrictions like character limits or no hyphens exclude real people. Arabic names in Latin letters often have spaces, hyphens and length."
      ar: "التصميم الشامل (NN/g): قيود اسم العائلة مثل حدّ الأحرف أو منع الشرطات تستبعد أشخاصًا حقيقيين. والأسماء العربية بالحروف اللاتينية كثيرًا ما تحتوي مسافات وشرطات وطولًا."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "Restrictions like character limits, no hyphens, or restrictions on names that are spelled the same as inappropriate English words can make some people feel excluded." }
    scenario:
      en: "Our English sign-up form accepts letters only, up to 12. Mrs. Fatma's son wants to register her as \"Fatma Abdel-Aziz El-Sayed\"."
      ar: "نموذج التسجيل الإنجليزي عندنا يقبل الحروف فقط، حتى 12 حرفًا. ويريد ابن السيدة فاطمة تسجيلها باسم «Fatma Abdel-Aziz El-Sayed»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &namenow
        - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: "Fatma Abdel-", tone: bad, error: { en: "Letters only, up to 12", ar: "حروف فقط، حتى 12 حرفًا" } }
    options:
      - id: first
        text: { en: "Ask for the first name only", ar: "اطلب الاسم الأول فقط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "First name", ar: "الاسم الأول" }, filled: true, text: "Fatma" }
      - id: rule
        text: { en: "Keep the rule, and explain it in a hint above the box", ar: "أبقِ القاعدة، واشرحها في تلميح فوق المربع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, hintFirst: true, hint: { en: "Letters only, no spaces or dashes, up to 12", ar: "حروف فقط، دون مسافات أو شرطات، حتى 12 حرفًا" }, filled: true, text: "FatmaAbdelAz" }
      - id: allow
        text: { en: "Allow spaces, hyphens, apostrophes and long names", ar: "اسمح بالمسافات والشرطات والفواصل العليا والأسماء الطويلة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Full name", ar: "الاسم الكامل" }, filled: true, text: "Fatma Abdel-Aziz El-Sayed" }
    answer: [allow]
    misconceptions:
      - id: MC-P05-011
        when: [rule]
        feedback:
          en: "A hint makes the rule clear, but she still can't enter her real name. The doctor's record and her ID won't match."
          ar: "التلميح يوضّح القاعدة، لكنها ما زالت لا تستطيع إدخال اسمها الحقيقي. ولن يتطابق سجل الطبيب مع بطاقتها."
      - id: MC-P05-011
        when: [first]
        feedback:
          en: "The clinic needs her full name to find her record. Dropping it hides the problem instead of fixing the rule."
          ar: "العيادة تحتاج اسمها الكامل لتجد سجلّها. وحذفه يُخفي المشكلة بدل إصلاح القاعدة."
    hints:
      - { en: "Is her name wrong, or is the rule wrong?", ar: "هل اسمها خطأ، أم القاعدة خطأ؟" }
      - { en: "Which version lets her enter her name exactly as it is on her ID?", ar: "أي نسخة تتيح لها إدخال اسمها كما هو في بطاقتها تمامًا؟" }
    correct:
      en: "Right. Fit the field to real names."
      ar: "صحيح. اجعل الحقل يناسب الأسماء الحقيقية."
    explain:
      en: "Real names have spaces, hyphens, apostrophes and many parts. A field that rejects them tells people they don't belong here."
      ar: "الأسماء الحقيقية فيها مسافات وشرطات وفواصل عليا وأجزاء كثيرة. والحقل الذي يرفضها يقول للناس إنهم ليسوا من أهل هذا المكان."

  - id: S06
    type: tune
    skill: SK-P05-U01-05
    part: guided
    rules: [R06]
    value:
      en: "Accessible Design for Users With Disabilities (NN/g): never set text in absolute sizes; use relative sizes so text grows with the person's setting. People need bigger text long before old age."
      ar: "التصميم المتاح لذوي الإعاقة (NN/g): لا تضبط النص بأحجام مطلقة أبدًا؛ استخدم أحجامًا نسبية ليكبر النص مع إعداد الشخص. والناس يحتاجون نصًا أكبر قبل الشيخوخة بكثير."
    ref: { url: "https://www.nngroup.com/articles/accessible-design-for-users-with-disabilities/", quote: "never encode information with absolute font sizes but use relative sizes instead" }
    scenario:
      en: "Mrs. Fatma set her phone's text size to the largest. Our app ignores that setting: its text stays at 13 px."
      ar: "ضبطت السيدة فاطمة حجم الخط في هاتفها على الأكبر. وتطبيقنا يتجاهل هذا الإعداد: يبقى نصه 13 بكسل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &sizenow
        - { kind: heading, px: 15, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
        - { kind: text, px: 13, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك احضري قبل الموعد بعشر دقائق ومعك بطاقتك." }, gap: xs }
    options:
      - id: follow
        text: { en: "Let the text follow her phone's size, and let the layout grow", ar: "اجعل النص يتبع حجم الخط في هاتفها، ودع التصميم يتّسع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 24, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
            - { kind: text, px: 21, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك احضري قبل الموعد بعشر دقائق ومعك بطاقتك." }, gap: xs }
      - id: fixed
        text: { en: "Keep the text fixed so the layout stays tidy", ar: "أبقِ النص ثابتًا ليظل التصميم مرتّبًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *sizenow
      - id: bold
        text: { en: "Keep 13 px, but make all the text bold", ar: "أبقِ 13 بكسل، لكن اجعل كل النص عريضًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 15, text: { en: "Your next visit", ar: "زيارتك القادمة" } }
            - { kind: text, px: 13, weight: bold, text: { en: "Sunday 10:30 with Dr. Mai. Please arrive 10 minutes early and bring your ID.", ar: "الأحد 10:30 مع د. مي. من فضلك احضري قبل الموعد بعشر دقائق ومعك بطاقتك." }, gap: xs }
    answer: [follow]
    misconceptions:
      - id: MC-P05-012
        when: [fixed, bold]
        feedback:
          en: "Mrs. Fatma already told her phone she needs bigger text. An app that ignores it undoes her choice, and bold letters at 13 px are still small."
          ar: "السيدة فاطمة أخبرت هاتفها بالفعل أنها تحتاج نصًا أكبر. والتطبيق الذي يتجاهل ذلك يُلغي اختيارها، والحروف العريضة بحجم 13 بكسل تظل صغيرة."
    hints:
      - { en: "What has Mrs. Fatma already done on her phone?", ar: "ماذا فعلت السيدة فاطمة بالفعل في هاتفها؟" }
      - { en: "Which version respects that setting?", ar: "أي نسخة تحترم هذا الإعداد؟" }
    correct:
      en: "Right. Her setting should win over our layout."
      ar: "صحيح. إعدادها يجب أن يغلب تصميمنا."
    explain:
      en: "Use relative text sizes so text grows with the phone's setting, and design layouts that can stretch. A tidy layout nobody can read helps no one."
      ar: "استخدم أحجامًا نسبية للنص ليكبر مع إعداد الهاتف، وصمّم تخطيطات تتّسع. فالتصميم المرتّب الذي لا يستطيع أحد قراءته لا يفيد أحدًا."

  - id: S07
    type: compare
    skill: SK-P05-U01-05
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: dark mode can help some readers, but not everyone. Inclusive Design (NN/g): for older eyes with cataracts, consider (but don't enforce) a dark-mode option, and use the phone's dark-mode setting."
      ar: "مقارنة: الوضع الداكن قد يساعد بعض القرّاء، لا الجميع. التصميم الشامل (NN/g): للعيون الأكبر سنًا المصابة بالمياه البيضاء، فكّر في خيار للوضع الداكن (دون فرضه)، واستفد من إعداد الوضع الداكن في الهاتف."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "consider (but do not enforce) a dark-mode option for your UIs" }
    scenario:
      en: "Some older patients find our bright white screens hard to read. My team designed two versions of the display settings."
      ar: "يجد بعض المرضى الأكبر سنًا أن شاشاتنا البيضاء الساطعة صعبة القراءة. وصمّم فريقي نسختين من إعدادات العرض."
    prompt:
      en: "Which version should ship?"
      ar: "أي نسخة يجب أن تُطلق؟"
    a:
      label: { en: "Version A", ar: "النسخة A" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Display", ar: "العرض" } }
          - { kind: banner, text: { en: "New look: the app is now dark for everyone.", ar: "مظهر جديد: التطبيق الآن داكن للجميع." }, gap: m }
    b:
      label: { en: "Version B", ar: "النسخة B" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Display", ar: "العرض" } }
          - { kind: small, weight: bold, text: { en: "Theme", ar: "المظهر" }, gap: m }
          - { kind: segmented, options: [{ en: "Light", ar: "فاتح" }, { en: "Dark", ar: "داكن" }, { en: "Like my phone", ar: "مثل هاتفي" }], value: 2, gap: xs }
    answer: b
    reason:
      prompt: { en: "Why is B better for older patients?", ar: "لماذا B أفضل للمرضى الأكبر سنًا؟" }
      options:
        - { id: battery, text: { en: "Dark screens save battery", ar: "الشاشات الداكنة توفّر البطارية" } }
        - { id: choice, text: { en: "Dark helps some eyes and not others, so each person picks", ar: "الداكن يساعد بعض العيون دون غيرها، فيختار كل شخص" } }
        - { id: light, text: { en: "Light screens are always easier to read", ar: "الشاشات الفاتحة أسهل في القراءة دائمًا" } }
      answer: [choice]
      misconceptions:
        - id: MC-P05-013
          when: [battery, light]
          feedback:
            en: "Neither is the reason. Some eyes, like those with cataracts, read better on dark; many others read better on light. So let each person choose, starting from their phone's setting."
            ar: "ولا أيّهما هو السبب. بعض العيون، مثل المصابة بالمياه البيضاء، تقرأ أفضل على الداكن؛ وكثير غيرها يقرأ أفضل على الفاتح. لذلك دع كل شخص يختار، بدءًا من إعداد هاتفه."
    misconceptions:
      - id: MC-P05-013
        when: [a]
        feedback:
          en: "Forcing dark mode swaps one problem for another: patients who read better on light screens now struggle. Offer it as a choice."
          ar: "فرض الوضع الداكن يستبدل مشكلة بأخرى: فالمرضى الذين يقرؤون أفضل على الشاشات الفاتحة سيتعبون الآن. قدّمه كاختيار."
    hints:
      - { en: "Do all older patients find white screens hard to read?", ar: "هل يجد كل المرضى الأكبر سنًا الشاشات البيضاء صعبة القراءة؟" }
      - { en: "Which version still works for a patient who reads better on white?", ar: "أي نسخة ما زالت تناسب مريضًا يقرأ أفضل على الأبيض؟" }
    correct:
      en: "Right. Offer dark mode; don't force it."
      ar: "صحيح. قدّم الوضع الداكن؛ ولا تفرضه."
    explain:
      en: "Different eyes need different screens. Start from the phone's own setting and let people switch, so nobody is locked into the wrong one."
      ar: "العيون المختلفة تحتاج شاشات مختلفة. ابدأ من إعداد الهاتف نفسه ودع الناس يغيّرون، حتى لا يُحبس أحد في الشاشة الخطأ."

  - id: S08
    type: tune
    skill: SK-P05-U01-05
    part: independent
    speaker: youssef
    rules: [R14]
    value:
      en: "New case. Inclusive Design (NN/g): the most common complaint from older users was text that's hard to read; use legible fonts and offer a button to increase the font size. Lighter text makes it worse."
      ar: "حالة جديدة. التصميم الشامل (NN/g): أكثر شكوى شائعة من كبار السن كانت النص الصعب القراءة؛ استخدم خطوطًا واضحة وقدّم زرًا لتكبير الخط. والنص الأفتح يزيد الأمر سوءًا."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "offer a button for users to increase the font size" }
    scenario:
      en: "My spice shop's app has long recipe pages. Many of my customers are older, and some say the recipes are hard to read."
      ar: "تطبيق متجري للتوابل فيه صفحات وصفات طويلة. وكثير من عملائي كبار في السن، ويقول بعضهم إن الوصفات صعبة القراءة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &recipenow
        - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
        - { kind: text, px: 13, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
    options:
      - id: light
        text: { en: "Make the text lighter grey for a softer look", ar: "اجعل النص رماديًا أفتح لمظهر أهدأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
            - { kind: text, px: 13, color: pale, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
      - id: keep
        text: { en: "Keep it; it's the same size as the rest of the app", ar: "أبقِه؛ فهو بحجم باقي نصوص التطبيق نفسه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *recipenow
      - id: button
        text: { en: "Add an \"A A\" button to make the recipe text bigger", ar: "أضف زر «A A» لتكبير نص الوصفة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: row
              blocks:
                - { kind: title, text: { en: "Koshari spice mix", ar: "خلطة توابل الكشري" } }
                - { kind: chip, text: "A A" }
            - { kind: text, px: 20, text: { en: "Toast the cumin and coriander for two minutes, then grind them with…", ar: "حمّص الكمّون والكزبرة لدقيقتين، ثم اطحنهما مع…" }, gap: s }
    answer: [button]
    misconceptions:
      - id: MC-P05-012
        when: [keep]
        feedback:
          en: "Matching the rest of the app doesn't help: customers already say this text is hard to read. On long reading screens, give them a way to make it bigger."
          ar: "التطابق مع باقي التطبيق لا يفيد: فالعملاء يقولون بالفعل إن هذا النص صعب القراءة. وفي شاشات القراءة الطويلة، أعطهم طريقة لتكبيره."
      - id: MC-P05-012
        when: [light]
        feedback:
          en: "Lighter grey lowers the contrast, so the text gets harder to read, not easier."
          ar: "الرمادي الأفتح يقلّل التباين، فيصبح النص أصعب في القراءة، لا أسهل."
    hints:
      - { en: "What exactly do customers say is wrong with the recipes?", ar: "ما الذي يقول العملاء بالضبط إنه خطأ في الوصفات؟" }
      - { en: "Which version makes the words themselves bigger?", ar: "أي نسخة تكبّر الكلمات نفسها؟" }
    correct:
      en: "Right. Give readers a bigger-text button."
      ar: "صحيح. امنح القرّاء زرًا لتكبير النص."
    explain:
      en: "On long reading screens, a visible text-size button lets anyone make the words bigger in one tap, while the lines still fit the screen."
      ar: "في شاشات القراءة الطويلة، زر حجم النص الظاهر يتيح لأي شخص تكبير الكلمات بضغطة واحدة، مع بقاء الأسطر داخل الشاشة."

  - id: S09
    type: card
    part: recap
    icons: [type, form, size, eye]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Phone numbers:** accepted dashes and cleaned them up in the background.\n- **Time:** let Mrs. Fatma type 10:30 instead of fighting a wheel.\n- **Names:** let the field take real names with hyphens and spaces.\n- **Text size:** made text follow the phone's setting, and gave readers a bigger-text button.\n- **Dark mode:** offered it as a choice instead of forcing it.\n\nNext: the skill check."
      ar: "- **أرقام الهاتف:** قبلت الشرطات ونظّفتها في الخلفية.\n- **الوقت:** تركت السيدة فاطمة تكتب 10:30 بدل صراع العجلة.\n- **الأسماء:** جعلت الحقل يقبل الأسماء الحقيقية بشرطاتها ومسافاتها.\n- **حجم النص:** جعلت النص يتبع إعداد الهاتف، وأعطيت القرّاء زرًا لتكبيره.\n- **الوضع الداكن:** قدّمته كاختيار بدل فرضه.\n\nالتالي: اختبار المهارة."
