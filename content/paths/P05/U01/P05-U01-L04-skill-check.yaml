id: P05-U01-L04
mode: check
minutes: 6
title:
  en: "Skill check: see the barriers"
  ar: "اختبار المهارة: اكتشف العوائق"
speaker: hana
sources:
  - title: { en: "Accessibility Is Not Enough (NN/g)", ar: "الإتاحة وحدها لا تكفي (NN/g)" }
    url: "https://www.nngroup.com/articles/accessibility-is-not-enough/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Direct Access vs. Sequential Access: UX Definition (NN/g)", ar: "الوصول المباشر مقابل الوصول المتسلسل (NN/g)" }
    url: "https://www.nngroup.com/articles/direct-vs-sequential-access/"
  - title: { en: "Usability for Older Adults: Challenges and Changes (NN/g)", ar: "قابلية الاستخدام لكبار السن: التحديات والتغيّرات (NN/g)" }
    url: "https://www.nngroup.com/articles/usability-for-senior-citizens/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana's new gym app", ar: "تطبيق نادي هناء الجديد" }
    body:
      en: "My gym's new app lets members book classes. Rasha, one of our members, is blind and uses a screen reader. Some of our members are over 60.\n\nYour job: decide what's ready, what to change, and how to check it.\n\nThis is a skill check: no hints, and you'll see how you did at the end."
      ar: "تطبيق النادي الجديد الذي أملكه يتيح للأعضاء حجز الحصص. رشا إحدى عضواتنا، وهي كفيفة وتستخدم قارئ الشاشة. وبعض أعضائنا تجاوزوا الستين.\n\nمهمّتك: حدّد ما هو جاهز، وما يجب تغييره، وكيف تتحقّق منه.\n\nهذا اختبار مهارة: بدون تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Book a class", ar: "احجز حصة" } }
        - { kind: image, size: s, text: { en: "Yoga · Sunday 8:00", ar: "يوغا · الأحد 8:00" }, gap: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 12", ar: "1 من 12" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, text: { en: "11 digits", ar: "11 رقمًا" }, gap: m }
        - { kind: button, text: { en: "Book", ar: "احجز" }, gap: m }

  - id: S02
    type: choose
    skill: SK-P05-U01-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Accessibility Is Not Enough (NN/g): accessibility is necessary but not nearly sufficient; the focus is how well the design helps disabled users do typical tasks. 25 minutes against 2 means it isn't ready."
      ar: "اختبار مهارة. الإتاحة وحدها لا تكفي (NN/g): الإتاحة ضرورية لكنها بعيدة عن الكفاية؛ والتركيز على مدى مساعدة التصميم لذوي الإعاقة في المهام المعتادة. و25 دقيقة مقابل دقيقتين تعني أنه غير جاهز."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "Accessibility is a necessary, but not nearly sufficient, objective." }
    scenario:
      en: "Our developer's accessibility checklist is all green. In a trial, Rasha took 25 minutes to book a class with her screen reader. Other members took about 2."
      ar: "قائمة الإتاحة عند مطوّرنا كلها خضراء. وفي تجربة، احتاجت رشا 25 دقيقة لحجز حصة بقارئ الشاشة. واحتاج باقي الأعضاء نحو دقيقتين."
    prompt:
      en: "What should we do about the launch?"
      ar: "ماذا يجب أن نفعل بشأن الإطلاق؟"
    options:
      - id: phone
        text: { en: "Launch, and add a phone line so screen reader users can book by phone", ar: "أطلقه، وأضف خطًا هاتفيًا ليحجز مستخدمو قارئ الشاشة بالهاتف" }
      - id: fix
        text: { en: "Fix what slowed Rasha down, and have her try again before launch", ar: "أصلح ما أبطأ رشا، واجعلها تجرّب مرة أخرى قبل الإطلاق" }
      - id: launch
        text: { en: "Launch; the checklist is all green", ar: "أطلقه؛ فقائمة التحقّق كلها خضراء" }
    answer: [fix]
    misconceptions:
      - id: MC-P05-001
        when: [launch]
        feedback:
          en: "Green checks don't mean Rasha can book easily: she needed more than ten times as long as others. The task decides, not the checklist."
          ar: "البنود الخضراء لا تعني أن رشا تستطيع الحجز بسهولة: فقد احتاجت أكثر من عشرة أضعاف وقت غيرها. والمهمة هي الحَكَم، لا قائمة التحقّق."
      - id: MC-P05-003
        when: [phone]
        feedback:
          en: "A phone line is a separate, slower road. Rasha should be able to book in the app, like everyone else."
          ar: "الخط الهاتفي طريق منفصل وأبطأ. ويجب أن تستطيع رشا الحجز في التطبيق، مثل الجميع."
    explain:
      en: "From Lesson 1: accessible means disabled people finish the real task easily and fast, with the same features."
      ar: "من الدرس 1: المتاح يعني أن يُكمل ذوو الإعاقة المهمة الحقيقية بسهولة وسرعة، بالميزات نفسها."

  - id: S03
    type: tune
    skill: SK-P05-U01-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Direct vs. sequential access (NN/g): carousels make people go through every item one by one to reach the last. Twelve classes need a list people can jump through."
      ar: "اختبار مهارة. الوصول المباشر مقابل المتسلسل (NN/g): الـ Carousel يجبر الناس على المرور بكل عنصر واحدًا واحدًا للوصول إلى الأخير. واثنتا عشرة حصة تحتاج قائمة يقفز الناس خلالها."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "users must go through all the items in the carousel one by one in order to get to the last one" }
    scenario:
      en: "This week's 12 classes are in a carousel, one card at a time. Rasha wants Thursday's swimming class, card 10."
      ar: "حصص هذا الأسبوع الـ 12 موجودة في Carousel، بطاقة واحدة في كل مرة. وتريد رشا حصة السباحة يوم الخميس، وهي البطاقة 10."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &classnow
        - { kind: image, size: s, text: { en: "Yoga · Sunday 8:00", ar: "يوغا · الأحد 8:00" } }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 12", ar: "1 من 12" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }
    options:
      - id: list
        text: { en: "A list grouped by day, with each class as a link", ar: "قائمة مجمّعة حسب اليوم، وكل حصة رابط" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Sunday", ar: "الأحد" } }
            - { kind: link, text: { en: "Yoga · 8:00", ar: "يوغا · 8:00" }, gap: xs }
            - { kind: link, text: { en: "Spinning · 18:00", ar: "دراجات ثابتة · 18:00" }, gap: xs }
            - { kind: small, color: muted, text: { en: "… Monday to Wednesday …", ar: "… من الاثنين إلى الأربعاء …" }, gap: s }
            - { kind: heading, text: { en: "Thursday", ar: "الخميس" }, gap: s }
            - { kind: link, text: { en: "Swimming · 17:00", ar: "سباحة · 17:00" }, gap: xs }
      - id: dots
        text: { en: "Add dots under the carousel to show how many cards there are", ar: "أضف نقاطًا تحت الـ Carousel توضّح عدد البطاقات" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: image, size: s, text: { en: "Yoga · Sunday 8:00", ar: "يوغا · الأحد 8:00" } }
            - { kind: small, color: muted, text: "● ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○", gap: xs }
      - id: auto
        text: { en: "Let the cards move by themselves every 4 seconds", ar: "اجعل البطاقات تتحرّك وحدها كل 4 ثوانٍ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: image, size: s, text: { en: "Yoga · Sunday 8:00", ar: "يوغا · الأحد 8:00" } }
            - { kind: meta, text: { en: "1 / 12 · next in 4 s", ar: "1 من 12 · التالي بعد 4 ثوانٍ" }, gap: xs }
    answer: [list]
    misconceptions:
      - id: MC-P05-006
        when: [dots, auto]
        feedback:
          en: "Still one class at a time: Rasha passes 9 cards before swimming. Show the classes as links she can jump to."
          ar: "ما زالت حصة واحدة في كل مرة: تمرّ رشا بـ 9 بطاقات قبل السباحة. اعرض الحصص كروابط تقفز إليها."
    explain:
      en: "From Lesson 2: give direct access. A list by day lets anyone jump straight to the class they want."
      ar: "من الدرس 2: وفّر وصولًا مباشرًا. والقائمة حسب اليوم تتيح لأي شخص القفز مباشرة إلى الحصة التي يريدها."

  - id: S04
    type: tune
    skill: SK-P05-U01-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Usability for Older Adults (NN/g): users were punished for typing dashes or brackets in phone numbers. Accept the country code and spaces, and clean the number yourself."
      ar: "اختبار مهارة. قابلية الاستخدام لكبار السن (NN/g): عوقب المستخدمون على كتابة شرطات أو أقواس في أرقام الهاتف. اقبل رمز الدولة والمسافات، ونظّف الرقم بنفسك."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "punished for entering hyphens or parentheses in telephone or credit-card numbers" }
    scenario:
      en: "Mr. Hamdy, 66, typed his number the way it's printed on his card: with +20 and spaces. The app says \"Enter 11 digits\"."
      ar: "كتب الأستاذ حمدي، 66 عامًا، رقمه كما هو مطبوع على بطاقته: مع ⁦+20⁩ ومسافات. فقال التطبيق «أدخل 11 رقمًا»."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "+20 100 123 4567", tone: bad, error: { en: "Enter 11 digits", ar: "أدخل 11 رقمًا" } }
    options:
      - id: accept
        text: { en: "Accept +20 and spaces, and turn it into the 11 digits in the background", ar: "اقبل ⁦+20⁩ والمسافات، وحوّله إلى الأرقام الـ 11 في الخلفية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "+20 100 123 4567" }
            - { kind: small, color: green, text: { en: "✓ Saved", ar: "✓ تم الحفظ" }, gap: xs }
      - id: example
        text: { en: "Keep the rule, and show an example: 01001234567", ar: "أبقِ القاعدة، واعرض مثالًا: 01001234567" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, hintFirst: true, hint: { en: "For example 01001234567", ar: "مثلًا 01001234567" }, filled: true, text: "+20 100 123 4567", tone: bad, error: { en: "Enter 11 digits", ar: "أدخل 11 رقمًا" } }
      - id: block
        text: { en: "Stop the keyboard from typing + and spaces at all", ar: "امنع لوحة المفاتيح من كتابة ⁦+⁩ والمسافات أصلًا" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Mobile number", ar: "رقم الموبايل" }, filled: true, text: "201001234567", tone: bad, error: { en: "Enter 11 digits", ar: "أدخل 11 رقمًا" } }
    answer: [accept]
    misconceptions:
      - id: MC-P05-009
        when: [example, block]
        feedback:
          en: "His number is right; only the format differs. The app can drop +20 and the spaces itself, instead of making him rewrite it."
          ar: "رقمه صحيح؛ والصيغة فقط مختلفة. والتطبيق يستطيع حذف ⁦+20⁩ والمسافات بنفسه، بدل أن يجبره على إعادة كتابته."
    explain:
      en: "From Lesson 3: accept input the way people give it, and clean it up in the code."
      ar: "من الدرس 3: اقبل الإدخال كما يكتبه الناس، ونظّفه في الكود."

  - id: S05
    type: tune
    skill: SK-P05-U01-05
    part: check
    rules: [R19]
    value:
      en: "Skill check. Usability for Older Adults (NN/g): people in their 40s already need somewhat larger text than designers in their 20s. A schedule locked at a small size ignores members who set bigger text on their phones."
      ar: "اختبار مهارة. قابلية الاستخدام لكبار السن (NN/g): الناس في الأربعينيات يحتاجون بالفعل نصًا أكبر قليلًا مما يحتاجه المصممون في العشرينيات. والجدول المثبّت على حجم صغير يتجاهل الأعضاء الذين ضبطوا نصًا أكبر في هواتفهم."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "people in their 40s already have sufficiently reduced eyesight to require somewhat larger font sizes than eagle-eyed designers in their 20s" }
    scenario:
      en: "Our designers locked the weekly schedule at 12 px so the whole week fits on one screen. Many members have set bigger text on their phones."
      ar: "ثبّت مصمّمونا جدول الأسبوع على 12 بكسل ليظهر الأسبوع كله في شاشة واحدة. وكثير من الأعضاء ضبطوا نصًا أكبر في هواتفهم."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &schednow
        - { kind: heading, px: 14, text: { en: "This week", ar: "هذا الأسبوع" } }
        - { kind: text, px: 12, text: { en: "Sun 8:00 Yoga · Mon 18:00 Spinning · Tue 7:00 Pilates · Wed 19:00 Boxing · Thu 17:00 Swimming", ar: "الأحد 8:00 يوغا · الاثنين 18:00 دراجات ثابتة · الثلاثاء 7:00 بيلاتس · الأربعاء 19:00 ملاكمة · الخميس 17:00 سباحة" }, gap: xs }
    options:
      - id: keep
        text: { en: "Keep it locked at 12 px so the week fits on one screen", ar: "أبقِه مثبّتًا على 12 بكسل ليظهر الأسبوع في شاشة واحدة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *schednow
      - id: follow
        text: { en: "Let it follow each phone's text size, and let the list scroll", ar: "اجعله يتبع حجم الخط في كل هاتف، ودع القائمة تُمرَّر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 22, text: { en: "This week", ar: "هذا الأسبوع" } }
            - { kind: text, px: 19, text: { en: "Sun 8:00 Yoga", ar: "الأحد 8:00 يوغا" }, gap: xs }
            - { kind: text, px: 19, text: { en: "Mon 18:00 Spinning", ar: "الاثنين 18:00 دراجات ثابتة" }, gap: xs }
            - { kind: text, px: 19, text: { en: "Tue 7:00 Pilates", ar: "الثلاثاء 7:00 بيلاتس" }, gap: xs }
            - { kind: small, color: muted, text: { en: "Scroll for more", ar: "مرّر لترى المزيد" }, gap: xs }
      - id: caps
        text: { en: "Keep 12 px, and write the class names in capitals", ar: "أبقِ 12 بكسل، واكتب أسماء الحصص بحروف كبيرة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, px: 14, text: { en: "This week", ar: "هذا الأسبوع" } }
            - { kind: text, px: 12, weight: bold, text: { en: "Sun 8:00 YOGA · Mon 18:00 SPINNING · Tue 7:00 PILATES · Wed 19:00 BOXING · Thu 17:00 SWIMMING", ar: "الأحد 8:00 يوغا · الاثنين 18:00 دراجات ثابتة · الثلاثاء 7:00 بيلاتس · الأربعاء 19:00 ملاكمة · الخميس 17:00 سباحة" }, gap: xs }
    answer: [follow]
    misconceptions:
      - id: MC-P05-012
        when: [keep, caps]
        feedback:
          en: "Members already asked their phones for bigger text. Locking the size overrules them, and the text stays small. Let it grow and scroll."
          ar: "طلب الأعضاء من هواتفهم نصًا أكبر بالفعل. وتثبيت الحجم يُلغي طلبهم، ويبقى النص صغيرًا. دعه يكبر ويُمرَّر."
    explain:
      en: "From Lesson 3: text should follow the person's size setting, even if the layout has to grow."
      ar: "من الدرس 3: يجب أن يتبع النص إعداد الحجم عند الشخص، حتى لو احتاج التصميم أن يتّسع."

  - id: S06
    type: choose
    skill: SK-P05-U01-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Challenges for Screen-Reader Users on Mobile (NN/g): there's no substitute for testing with real users who have disabilities, on the tools they use every day."
      ar: "اختبار مهارة. تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): لا بديل عن الاختبار مع مستخدمين حقيقيين من ذوي الإعاقة، بالأدوات التي يستخدمونها كل يوم."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "there is no substitute for testing it with real users that have disabilities" }
    scenario:
      en: "After the fixes, we want to check the booking flow once more before launch."
      ar: "بعد الإصلاحات، نريد التحقّق من مسار الحجز مرة أخرى قبل الإطلاق."
    prompt:
      en: "Which check will show us what still blocks members?"
      ar: "أي طريقة تحقّق ستكشف لنا ما زال يعيق الأعضاء؟"
    options:
      - id: team
        text: { en: "Our team closes their eyes and books with the screen reader on the office phone", ar: "يغمض فريقنا أعينهم ويحجزون بقارئ الشاشة على هاتف المكتب" }
      - id: tool
        text: { en: "Run an automatic accessibility checker on every screen", ar: "شغّل أداة فحص إتاحة آلية على كل الشاشات" }
      - id: members
        text: { en: "Rasha and other members who use screen readers or bigger text book a class on their own phones", ar: "تحجز رشا وأعضاء آخرون يستخدمون قارئ الشاشة أو النص الكبير حصة على هواتفهم" }
    answer: [members]
    misconceptions:
      - id: MC-P05-005
        when: [team]
        feedback:
          en: "Our team doesn't use screen readers daily, and the office phone isn't set up the way members' phones are. We'd mostly find our own inexperience."
          ar: "فريقنا لا يستخدم قارئ الشاشة يوميًا، وهاتف المكتب ليس مضبوطًا كهواتف الأعضاء. وسنكتشف في الغالب قلّة خبرتنا نحن."
      - id: MC-P05-001
        when: [tool]
        feedback:
          en: "An automatic checker tests rules, like the checklist that was already green. It can't tell how long Rasha needs to book."
          ar: "أداة الفحص الآلية تختبر القواعد، مثل قائمة التحقّق التي كانت خضراء بالفعل. ولا تستطيع أن تعرف كم تحتاج رشا لتحجز."
    explain:
      en: "From Lesson 1: check with real users, on their own devices and settings."
      ar: "من الدرس 1: تحقّق مع مستخدمين حقيقيين، على أجهزتهم وبإعداداتهم."
