id: P05-U01-L01
mode: lesson
minutes: 8
title:
  en: "Passing the audit isn't the finish line"
  ar: "اجتياز التدقيق ليس خط النهاية"
speaker: tarek
sources:
  - title: { en: "Beyond Accessibility: Treating Users with Disabilities as People (NN/g)", ar: "ما بعد الإتاحة: التعامل مع ذوي الإعاقة كمستخدمين (NN/g)" }
    url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/"
  - title: { en: "Accessibility Is Not Enough (NN/g)", ar: "الإتاحة وحدها لا تكفي (NN/g)" }
    url: "https://www.nngroup.com/articles/accessibility-is-not-enough/"
  - title: { en: "Alternative Interfaces for Accessibility (NN/g)", ar: "واجهات بديلة من أجل الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Conducting Mobile Accessibility Research with Screen-Reader Users (NN/g)", ar: "إجراء بحث الإتاحة على الهاتف مع مستخدمي قارئ الشاشة (NN/g)" }
    url: "https://www.nngroup.com/articles/mobile-accessibility-research/"
review_labels:
  MC-P05-001: { en: "A passed checklist isn't proof people can finish", ar: "اجتياز قائمة التحقّق ليس دليلًا على أن الناس يُكملون المهمة" }
  MC-P05-002: { en: "Reachable isn't the same as easy and fast", ar: "إمكانية الوصول لا تعني السهولة والسرعة" }
  MC-P05-003: { en: "A separate version must have the same content and features", ar: "النسخة المنفصلة يجب أن تحمل المحتوى والميزات نفسها" }
  MC-P05-004: { en: "A plugin or a promise doesn't replace testing with real users", ar: "الإضافة الجاهزة أو الوعد لا يغنيان عن الاختبار مع مستخدمين حقيقيين" }
  MC-P05-005: { en: "Test on people's own devices and settings", ar: "اختبر على أجهزة الناس وإعداداتهم" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Adel's monthly medicine", ar: "دواء عادل الشهري" }
    body:
      en: "Our pharmacy app passed an accessibility audit last month: 52 of 52 checks, all green.\n\nThis week Adel, a customer who is blind and uses a screen reader (an app that reads the screen aloud), emailed us. He tried to reorder his monthly medicine and gave up after 20 minutes. Most customers do it in under one."
      ar: "اجتاز تطبيق الصيدلية عندنا تدقيقًا للإتاحة (Accessibility audit) الشهر الماضي: 52 بندًا من 52، كلها خضراء.\n\nوهذا الأسبوع راسلنا عادل، وهو عميل كفيف يستخدم قارئ الشاشة (Screen reader، تطبيق يقرأ الشاشة بصوت مسموع). حاول إعادة طلب دوائه الشهري، واستسلم بعد 20 دقيقة. وأغلب العملاء يفعلون ذلك في أقل من دقيقة."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Accessibility audit", ar: "تدقيق الإتاحة" } }
        - { kind: chip, text: { en: "Passed", ar: "ناجح" }, gap: s }
        - { kind: text, text: { en: "52 of 52 checks passed", ar: "52 بندًا ناجحًا من 52" }, gap: m }
        - { kind: line, gap: s }
        - { kind: small, text: { en: "Email from Adel: \"I couldn't reorder my medicine.\"", ar: "رسالة من عادل: «لم أستطع إعادة طلب دوائي»." }, gap: m }

  - id: S02
    type: choose
    skill: SK-P05-U01-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Accessibility Is Not Enough (NN/g): meeting every high-priority checkpoint doesn't mean disabled users can use the site. The test is whether they can do the task."
      ar: "جرّب أولًا. الإتاحة وحدها لا تكفي (NN/g): تحقيق كل البنود عالية الأولوية لا يعني أن ذوي الإعاقة يستطيعون استخدام الموقع. والمعيار هو قدرتهم على إنجاز المهمة."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "even if you meet every high-priority checkpoint, users with disabilities might still be completely incapable of using your site" }
    prompt:
      en: "Is the reorder flow ready for screen reader users?"
      ar: "هل مسار إعادة الطلب جاهز لمستخدمي قارئ الشاشة؟"
    options:
      - id: no
        text: { en: "No. A screen reader user couldn't finish a main task", ar: "لا. مستخدم لقارئ الشاشة لم يستطع إكمال مهمة أساسية" }
      - id: yes
        text: { en: "Yes. It passed every check, so Adel's case is a one-off", ar: "نعم. فقد اجتاز كل البنود، وحالة عادل استثناء" }
      - id: phone
        text: { en: "Yes, if we add a support number for people who get stuck", ar: "نعم، إذا أضفنا رقم دعم لمن يتعثّر" }
    answer: [no]
    misconceptions:
      - id: MC-P05-001
        when: [yes]
        feedback:
          en: "The checks test parts of the screen, one rule at a time. None of them asked whether a blind customer can reorder medicine. Adel's 20 minutes answers that."
          ar: "البنود تختبر أجزاء الشاشة، قاعدةً بعد قاعدة. ولم يسأل أيّ منها هل يستطيع عميل كفيف إعادة طلب دوائه. ودقائق عادل العشرون أجابت عن ذلك."
      - id: MC-P05-003
        when: [phone]
        feedback:
          en: "A phone line sends Adel down a different, slower road for the same task. The app itself still blocks him."
          ar: "رقم الهاتف يرسل عادل في طريق آخر أبطأ للمهمة نفسها. والتطبيق نفسه ما زال يعيقه."
    hints:
      - { en: "What was Adel trying to do, and did he manage it?", ar: "ماذا كان عادل يحاول أن يفعل، وهل نجح؟" }
      - { en: "Which tells you more about his experience: the audit score, or what happened when he tried?", ar: "أيّهما يخبرك أكثر عن تجربته: درجة التدقيق، أم ما حدث حين حاول؟" }
    correct:
      en: "Right. The task decides, not the score."
      ar: "صحيح. المهمة هي الحَكَم، لا الدرجة."
    explain:
      en: "A checklist checks rules one by one. Whether people can actually finish a task is a separate question, and only watching them answers it."
      ar: "قائمة التحقّق تفحص القواعد واحدة واحدة. أما قدرة الناس فعلًا على إكمال المهمة فسؤال آخر، لا يجيب عنه إلا مراقبتهم وهم يحاولون."

  - id: S03
    type: card
    part: concept
    icons: [ok, clock, layers, person, ear]
    title: { en: "Accessible isn't the same as easy to use", ar: "المتاح ليس بالضرورة سهل الاستخدام" }
    body:
      en: "- **A pass isn't proof:** a screen can meet every checklist rule and still stop people from finishing.\n- **Possible isn't enough:** what counts is how easily and how fast a disabled person finishes the task. A ramp at the back of the building is accessible, but far.\n- **Same content, same features:** a separate \"accessible version\" with less in it isn't equal access.\n- **A range, not two groups:** many people see a little less or tire faster. It's a range, not yes or no.\n- **Their own tools:** screen reader users set up their own tools. A website's add-on menu can't replace them; testing with real users shows what blocks them."
      ar: "- **النجاح في البنود ليس دليلًا:** قد تحقّق الشاشة كل قواعد قائمة التحقّق، وتظل تمنع الناس من إكمال مهمتهم.\n- **الممكن لا يكفي:** المهم هو مدى سهولة وسرعة إكمال الشخص ذي الإعاقة للمهمة. فالمنحدر خلف المبنى متاح، لكنه بعيد.\n- **المحتوى نفسه والميزات نفسها:** «النسخة المتاحة» المنفصلة التي تحمل أقل لا تُعدّ وصولًا متساويًا.\n- **مدى واسع، لا فئتان:** كثير من الناس يرون أقل قليلًا أو يتعبون أسرع. الأمر درجات، لا نعم أو لا.\n- **أدواتهم الخاصة:** مستخدمو قارئ الشاشة يضبطون أدواتهم بأنفسهم. وقائمة الإضافات في الموقع لا تحلّ محلّها؛ والاختبار مع مستخدمين حقيقيين يكشف ما يعيقهم."

  - id: S04
    type: compare
    skill: SK-P05-U01-01
    part: guided
    rules: [R06]
    value:
      en: "Alternative Interfaces for Accessibility (NN/g): whatever the user group, every version must offer the same functionality and the same content. A 'simple' version without saved prescriptions isn't equal access."
      ar: "واجهات بديلة من أجل الإتاحة (NN/g): أيًّا كانت فئة المستخدمين، يجب أن تقدّم كل نسخة الوظائف نفسها والمحتوى نفسه. والنسخة «المبسّطة» بلا الوصفات المحفوظة ليست وصولًا متساويًا."
    ref: { url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/", quote: "Regardless of the targeted user group, all designs must offer the same functionality and provide access to the same content." }
    scenario:
      en: "Our developers proposed two fixes. A: a separate \"Accessible version\" link in the footer that opens a simple page. B: fix the labels and order on the normal reorder screen."
      ar: "اقترح المطوّرون عندنا حلّين. A: رابط «النسخة المتاحة» في أسفل الصفحة يفتح صفحة بسيطة منفصلة. B: إصلاح التسميات والترتيب في شاشة إعادة الطلب العادية."
    prompt:
      en: "Which fix should we ship?"
      ar: "أي حلّ يجب أن نطلقه؟"
    a:
      label: { en: "Separate simple page", ar: "صفحة بسيطة منفصلة" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Order (simple)", ar: "الطلب (مبسّط)" } }
          - { kind: field, label: { en: "Medicine name", ar: "اسم الدواء" }, text: { en: "Type the name", ar: "اكتب الاسم" }, gap: m }
          - { kind: field, label: { en: "Quantity", ar: "الكمية" }, text: "1", filled: true, gap: s }
          - { kind: small, color: muted, text: { en: "Saved prescriptions and offers are not available here.", ar: "الوصفات المحفوظة والعروض غير متوفرة هنا." }, gap: s }
          - { kind: button, text: { en: "Send order", ar: "أرسل الطلب" }, gap: m }
    b:
      label: { en: "Same screen, fixed", ar: "الشاشة نفسها بعد الإصلاح" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "My prescriptions", ar: "وصفاتي" } }
          - { kind: text, weight: bold, text: { en: "Metformin 500 mg, monthly", ar: "ميتفورمين 500 ملجم، شهريًا" }, gap: m }
          - { kind: small, text: { en: "Last ordered 2 October", ar: "آخر طلب: 2 أكتوبر" }, gap: xs }
          - { kind: button, text: { en: "Reorder Metformin", ar: "أعد طلب ميتفورمين" }, gap: s }
    answer: b
    misconceptions:
      - id: MC-P05-003
        when: [a]
        feedback:
          en: "A drops Adel's saved prescription, so he must type a medicine name he may not spell exactly. A separate road with less on it isn't equal access."
          ar: "A تُسقط الوصفة المحفوظة لعادل، فعليه أن يكتب اسم دواء قد لا يعرف تهجئته تمامًا. والطريق المنفصل الذي يحمل أقل ليس وصولًا متساويًا."
    hints:
      - { en: "Compare what each screen offers: which one still has Adel's saved prescription?", ar: "قارن ما تقدّمه كل شاشة: أيّهما ما زالت تحمل وصفة عادل المحفوظة؟" }
      - { en: "Would other customers accept the simple page as their only way to order?", ar: "هل يقبل باقي العملاء الصفحة البسيطة طريقًا وحيدًا للطلب؟" }
    correct:
      en: "Right. Fix the real screen, so everyone gets the same features."
      ar: "صحيح. أصلح الشاشة الحقيقية، ليحصل الجميع على الميزات نفسها."
    explain:
      en: "Every version must have the same content and features. Fixing the one screen everyone uses also stops a side page from falling behind the main app."
      ar: "يجب أن تحمل كل نسخة المحتوى والميزات نفسها. وإصلاح الشاشة التي يستخدمها الجميع يمنع أيضًا صفحة جانبية من أن تتأخّر عن التطبيق الأساسي."

  - id: S05
    type: tune
    skill: SK-P05-U01-01
    part: guided
    rules: [R06]
    value:
      en: "Beyond Accessibility (NN/g): usability isn't only whether a task is possible, but how easy and fast it is (the ramp at the back of the building). 'My orders' after 14 offers is reachable, but slow by screen reader."
      ar: "ما بعد الإتاحة (NN/g): قابلية الاستخدام ليست فقط إمكانية أداء المهمة، بل مدى سهولتها وسرعتها (المنحدر خلف المبنى). و«طلباتي» بعد 14 عرضًا يمكن الوصول إليها، لكنها بطيئة بقارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/", quote: "It is also a matter of how easy and fast it is for them to do so." }
    scenario:
      en: "A screen reader reads our home screen from top to bottom, one item per swipe. Adel hears 14 offers before he reaches \"My orders\" at the bottom."
      ar: "يقرأ قارئ الشاشة الشاشة الرئيسية عندنا من الأعلى إلى الأسفل، عنصرًا مع كل سحبة. فيسمع عادل 14 عرضًا قبل أن يصل إلى «طلباتي» في الأسفل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &homenow
        - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
        - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: s }
        - { kind: image, size: s, text: { en: "Offer 2 of 14", ar: "العرض 2 من 14" }, gap: s }
        - { kind: small, color: muted, text: { en: "… 12 more offers …", ar: "… 12 عرضًا آخر …" }, gap: s }
        - { kind: button, style: plain, text: { en: "My orders", ar: "طلباتي" }, gap: s }
    options:
      - id: keep
        text: { en: "Keep it: he can reach \"My orders\", so it's accessible", ar: "أبقِه: يستطيع الوصول إلى «طلباتي»، فهو متاح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *homenow
      - id: top
        text: { en: "Put \"Reorder my medicine\" at the top, before the offers", ar: "ضع «أعد طلب دوائي» في الأعلى، قبل العروض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
            - { kind: button, text: { en: "Reorder my medicine", ar: "أعد طلب دوائي" }, gap: s }
            - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: m }
            - { kind: small, color: muted, text: { en: "… 13 more offers …", ar: "… 13 عرضًا آخر …" }, gap: s }
      - id: note
        text: { en: "Add a line at the top: \"Screen reader users: My orders is at the bottom\"", ar: "أضف سطرًا في الأعلى: «لمستخدمي قارئ الشاشة: طلباتي في الأسفل»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
            - { kind: small, text: { en: "Screen reader users: My orders is at the bottom.", ar: "لمستخدمي قارئ الشاشة: «طلباتي» في الأسفل." }, gap: xs }
            - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: s }
            - { kind: image, size: s, text: { en: "Offer 2 of 14", ar: "العرض 2 من 14" }, gap: s }
            - { kind: small, color: muted, text: { en: "… 12 more offers …", ar: "… 12 عرضًا آخر …" }, gap: s }
            - { kind: button, style: plain, text: { en: "My orders", ar: "طلباتي" }, gap: s }
    answer: [top]
    misconceptions:
      - id: MC-P05-002
        when: [keep]
        feedback:
          en: "Reachable after 14 swipes is the ramp at the back of the building. It works, but it costs Adel far more time than anyone else."
          ar: "الوصول بعد 14 سحبة هو المنحدر خلف المبنى. إنه يعمل، لكنه يكلّف عادل وقتًا أكثر بكثير من غيره."
      - id: MC-P05-002
        when: [note]
        feedback:
          en: "The note tells Adel where the door is but leaves it far away. He still has to pass all 14 offers to get there."
          ar: "الملاحظة تخبر عادل أين الباب، لكنها تتركه بعيدًا. وما زال عليه أن يمرّ بالعروض الـ 14 كلها ليصل إليه."
    hints:
      - { en: "Count how many swipes Adel needs before he can start his task in each version.", ar: "عُدّ كم سحبة يحتاج عادل قبل أن يبدأ مهمته في كل نسخة." }
      - { en: "Which version makes his main task as quick for him as it is for others?", ar: "أي نسخة تجعل مهمته الأساسية سريعة له كما هي لغيره؟" }
    correct:
      en: "Right. Put the main task first, for everyone."
      ar: "صحيح. ضع المهمة الأساسية أولًا، للجميع."
    explain:
      en: "Accessible means more than possible. Moving the main task to the top makes it quick by screen reader, and quicker for sighted customers too."
      ar: "المتاح يعني أكثر من الممكن. ونقل المهمة الأساسية إلى الأعلى يجعلها سريعة بقارئ الشاشة، وأسرع للعملاء المبصرين أيضًا."

  - id: S06
    type: choose
    skill: SK-P05-U01-02
    part: guided
    rules: [R06]
    value:
      en: "Challenges for Screen-Reader Users on Mobile (NN/g): no screen reader user in the study opened the accessibility menus on their own; they already have a built-in screen reader. Most issues are structural and no plugin fixes them."
      ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): لم يفتح أي مستخدم لقارئ الشاشة في الدراسة قوائم الإتاحة من تلقاء نفسه؛ فلديهم قارئ شاشة مدمج. وأغلب المشكلات في بنية التصميم، ولا تصلحها إضافة."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "Most accessibility issues are structural and cannot be fixed by a simple plugin." }
    scenario:
      en: "My manager found a ready-made accessibility menu: one line of code adds a floating button with text size, contrast and its own screen reader. He wants to add it and close Adel's complaint."
      ar: "وجد مديري قائمة إتاحة جاهزة (Accessibility menu): سطر برمجي واحد يضيف زرًا عائمًا فيه حجم الخط والتباين وقارئ شاشة خاص بها. ويريد أن يضيفها ويُغلق شكوى عادل."
    prompt:
      en: "What should we do before we call the reorder flow fixed?"
      ar: "ماذا يجب أن نفعل قبل أن نعتبر مسار إعادة الطلب قد أُصلح؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
        - { kind: image, size: m, text: { en: "Offers", ar: "العروض" }, gap: s }
        - { kind: pill, text: { en: "♿ Accessibility menu", ar: "♿ قائمة الإتاحة" }, gap: m }
    options:
      - id: menu
        text: { en: "Add the menu; its screen reader covers Adel", ar: "أضف القائمة؛ فقارئ الشاشة فيها يكفي عادل" }
      - id: menutest
        text: { en: "Add the menu, then ask Adel to try its screen reader", ar: "أضف القائمة، ثم اطلب من عادل تجربة قارئ الشاشة فيها" }
      - id: users
        text: { en: "Watch a few screen reader users reorder with their own screen readers, and fix what blocks them", ar: "راقب عددًا من مستخدمي قارئ الشاشة يعيدون الطلب بقارئات شاشاتهم، وأصلح ما يعيقهم" }
    answer: [users]
    misconceptions:
      - id: MC-P05-004
        when: [menu, menutest]
        feedback:
          en: "Adel already has a screen reader built into his phone, set up the way he likes it. To use the menu's reader he'd have to switch his own off. And the menu doesn't change the screen's order or labels, which is what blocked him."
          ar: "لدى عادل قارئ شاشة مدمج في هاتفه، مضبوط كما يحب. ولكي يستخدم قارئ القائمة عليه أن يُطفئ قارئه. والقائمة لا تغيّر ترتيب الشاشة ولا تسمياتها، وهذا ما أعاقه."
    hints:
      - { en: "What does Adel already use to hear his phone?", ar: "ماذا يستخدم عادل أصلًا ليسمع هاتفه؟" }
      - { en: "Does a floating button change the order and labels of the reorder screen?", ar: "هل يغيّر زر عائم ترتيب شاشة إعادة الطلب وتسمياتها؟" }
    correct:
      en: "Right. Test with real users and fix the screen itself."
      ar: "صحيح. اختبر مع مستخدمين حقيقيين وأصلح الشاشة نفسها."
    explain:
      en: "Screen reader users rely on the reader built into their phone. What blocks them is usually the screen's structure: order, labels, where things are. Only watching them use it shows which parts to fix."
      ar: "يعتمد مستخدمو قارئ الشاشة على القارئ المدمج في هواتفهم. وما يعيقهم عادةً هو بنية الشاشة: الترتيب والتسميات ومواضع العناصر. ولا يكشف الأجزاء التي يجب إصلاحها إلا مراقبتهم وهم يستخدمونها."

  - id: S07
    type: compare
    skill: SK-P05-U01-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: both plans test with screen reader users; only the device differs. Mobile accessibility research (NN/g): have participants use their own device; they know where things are and how their reader is set up, and a researcher's phone would hinder them."
      ar: "مقارنة: الخطتان تختبران مع مستخدمي قارئ الشاشة؛ والفرق في الجهاز فقط. بحث الإتاحة على الهاتف (NN/g): اجعل المشاركين يستخدمون أجهزتهم؛ فهم يعرفون مواضع الأشياء وضبط القارئ عندهم، وهاتف الباحث يعيقهم."
    ref: { url: "https://www.nngroup.com/articles/mobile-accessibility-research/", quote: "Have participants use their own device." }
    scenario:
      en: "We're inviting 5 customers who use screen readers to try the new reorder screen. Our team wrote two plans."
      ar: "سندعو 5 عملاء يستخدمون قارئ الشاشة لتجربة شاشة إعادة الطلب الجديدة. وكتب فريقنا خطتين."
    prompt:
      en: "Which plan will show us what really blocks them?"
      ar: "أي خطة ستكشف لنا ما يعيقهم فعلًا؟"
    a:
      label: { en: "Plan A", ar: "الخطة A" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Test plan A", ar: "خطة الاختبار A" } }
          - { kind: text, text: { en: "Each person uses our office test phone, with the screen reader on at default speed.", ar: "يستخدم كل شخص هاتف الاختبار في مكتبنا، وقارئ الشاشة يعمل على السرعة الافتراضية." }, gap: s }
    b:
      label: { en: "Plan B", ar: "الخطة B" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Test plan B", ar: "خطة الاختبار B" } }
          - { kind: text, text: { en: "Each person uses their own phone, with their own screen reader settings.", ar: "يستخدم كل شخص هاتفه، بإعدادات قارئ الشاشة الخاصة به." }, gap: s }
    answer: b
    reason:
      prompt: { en: "Why does Plan B give truer results?", ar: "لماذا تعطي الخطة B نتائج أصدق؟" }
      options:
        - { id: own, text: { en: "On a strange phone, people struggle with the phone instead of our app", ar: "على هاتف غريب، يتعثّر الناس مع الهاتف بدل تطبيقنا" } }
        - { id: same, text: { en: "Every participant then has the same setup", ar: "لأن كل المشاركين سيكون لديهم الإعداد نفسه" } }
        - { id: cheap, text: { en: "We don't have to buy test phones", ar: "لأننا لن نحتاج إلى شراء هواتف اختبار" } }
      answer: [own]
      misconceptions:
        - id: MC-P05-005
          when: [same, cheap]
          feedback:
            en: "Cost and sameness aren't the point. People know where things are on their own phone and how fast their reader talks. A strange phone adds problems that aren't ours."
            ar: "الكلفة والتشابه ليسا المقصود. فالناس يعرفون مواضع الأشياء في هواتفهم وسرعة كلام القارئ عندهم. والهاتف الغريب يضيف مشكلات ليست من تطبيقنا."
    misconceptions:
      - id: MC-P05-005
        when: [a]
        feedback:
          en: "On our phone, people would fight unfamiliar settings and speed. We'd be testing the phone, not our reorder screen."
          ar: "على هاتفنا، سيصارع الناس إعدادات وسرعة غير مألوفة. وسنكون نختبر الهاتف، لا شاشة إعادة الطلب."
    hints:
      - { en: "Think about how much a screen reader user changes their phone over the years: speed, gestures, voice.", ar: "فكّر في كم يغيّر مستخدم قارئ الشاشة في هاتفه عبر السنين: السرعة والإيماءات والصوت." }
      - { en: "In which plan would any trouble come from our screen alone?", ar: "في أي خطة ستأتي أي مشكلة من شاشتنا وحدها؟" }
    correct:
      en: "Right. Their own phone, their own settings."
      ar: "صحيح. هواتفهم وإعداداتهم."
    explain:
      en: "Screen reader users tune their phones closely. On their own device, any trouble they hit comes from our design, which is what we need to find."
      ar: "مستخدمو قارئ الشاشة يضبطون هواتفهم بدقة. وعلى أجهزتهم، أي مشكلة يواجهونها تأتي من تصميمنا، وهذا ما نريد اكتشافه."

  - id: S08
    type: choose
    skill: SK-P05-U01-02
    part: independent
    speaker: hana
    rules: [R14]
    value:
      en: "New case. Accessibility Is Not Enough (NN/g): never trust a vendor's sales staff on user experience; check for yourself by having a few disabled people do real tasks with their own assistive technology."
      ar: "حالة جديدة. الإتاحة وحدها لا تكفي (NN/g): لا تثق في فريق مبيعات المورّد في أمور تجربة المستخدم؛ وتحقّق بنفسك بأن يؤدي عدد من ذوي الإعاقة مهامّ حقيقية بتقنياتهم المساعدة."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "the only good advice here is to check for yourself" }
    scenario:
      en: "I'm choosing a class-booking system for my gym. The vendor says it's \"fully accessible\" and shows a certificate. Two of our members use screen readers, and one uses a screen magnifier."
      ar: "أختار نظامًا لحجز الحصص في النادي الذي أملكه. يقول المورّد إنه «متاح بالكامل» ويعرض شهادة. واثنان من أعضائنا يستخدمان قارئ الشاشة، وعضوة تستخدم مكبّر الشاشة (Screen magnifier)."
    prompt:
      en: "What should I do before I sign?"
      ar: "ماذا يجب أن أفعل قبل أن أوقّع؟"
    options:
      - id: try
        text: { en: "Ask those three members to book a class in it, on their own phones", ar: "أن يحجز هؤلاء الأعضاء الثلاثة حصة فيه، على هواتفهم" }
      - id: cert
        text: { en: "Sign now; the certificate proves it's accessible", ar: "التوقيع الآن؛ فالشهادة تُثبت أنه متاح" }
      - id: list
        text: { en: "Ask the vendor for the full list of checks it passed", ar: "طلب القائمة الكاملة للبنود التي اجتازها النظام من المورّد" }
    answer: [try]
    misconceptions:
      - id: MC-P05-004
        when: [cert]
        feedback:
          en: "The vendor wants to sell, and a certificate only says rules were met. It can't tell you whether your members can book a class."
          ar: "المورّد يريد أن يبيع، والشهادة تقول فقط إن القواعد تحقّقت. ولا تخبرك هل يستطيع أعضاؤك حجز حصة."
      - id: MC-P05-001
        when: [list]
        feedback:
          en: "A longer list is still a list of rules. A system can pass them all and still block people from booking."
          ar: "القائمة الأطول تظل قائمة قواعد. وقد يجتازها النظام كلها ويظل يمنع الناس من الحجز."
    hints:
      - { en: "Who has the most to gain from calling the system accessible?", ar: "من المستفيد الأكبر من وصف النظام بأنه متاح؟" }
      - { en: "Which option shows you real people doing the real task?", ar: "أي خيار يُريك أشخاصًا حقيقيين يؤدّون المهمة الحقيقية؟" }
    correct:
      en: "Right. Check it yourself with the people who'll use it."
      ar: "صحيح. تحقّق بنفسك مع من سيستخدمونه."
    explain:
      en: "An hour with a few members, on their own phones and tools, tells you more than any certificate. You'll see if they can book, and where they get stuck."
      ar: "ساعة مع بعض الأعضاء، على هواتفهم وبأدواتهم، تخبرك أكثر من أي شهادة. سترى هل يستطيعون الحجز، وأين يتعثّرون."

  - id: S09
    type: card
    part: recap
    icons: [ok, clock, layers, person]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **The task decides:** judged the reorder flow by Adel's 20 minutes, not by 52 green checks.\n- **Same features:** fixed the real screen instead of adding a thinner side page.\n- **Easy and fast:** moved the main task to the top, so it's quick by screen reader too.\n- **Real users, own tools:** tested with people's own phones and settings, and checked a vendor's claim yourself.\n\nNext lesson: why a screen reader turns a screen into a line, and how to give people shortcuts."
      ar: "- **المهمة هي الحَكَم:** حكمت على مسار إعادة الطلب بدقائق عادل العشرين، لا بـ 52 بندًا أخضر.\n- **الميزات نفسها:** أصلحت الشاشة الحقيقية بدل إضافة صفحة جانبية أفقر.\n- **سهل وسريع:** نقلت المهمة الأساسية إلى الأعلى، لتكون سريعة بقارئ الشاشة أيضًا.\n- **مستخدمون حقيقيون بأدواتهم:** اختبرت على هواتف الناس وإعداداتهم، وتحقّقت بنفسك من ادعاء المورّد.\n\nالدرس التالي: لماذا يحوّل قارئ الشاشة الشاشة إلى خط واحد، وكيف تمنح الناس طرقًا مختصرة."
