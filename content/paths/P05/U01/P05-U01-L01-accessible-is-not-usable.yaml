id: P05-U01-L01
mode: lesson
minutes: 8
title:
  en: "Passing the checklist isn't enough"
  ar: "النجاح في الـ Checklist لا يكفي"
summary:
  en: "A pharmacy app passed its checklist. Judge it by whether a blind customer can order easily."
  ar: "تطبيق صيدلية نجح في الـ Checklist. احكم عليه: هل يطلب العميل الكفيف بسهولة؟"
speaker: tarek
sources:
  - title: { en: "Beyond Accessibility: Treating Users with Disabilities as People (NN/g)", ar: "ما بعد الإتاحة: التعامل مع ذوي الإعاقة كمستخدمين (NN/g)" }
    url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/"
  - title: { en: "Accessibility Is Not Enough (NN/g)", ar: "الإتاحة وحدها لا تكفي (NN/g)" }
    url: "https://www.nngroup.com/articles/accessibility-is-not-enough/"
  - title: { en: "Alternative Interfaces for Accessibility (NN/g)", ar: "واجهات بديلة من أجل الإتاحة (NN/g)" }
    url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/"
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Conducting Mobile Accessibility Research with Screen-Reader Users (NN/g)", ar: "إجراء بحث الإتاحة على الهاتف مع مستخدمي قارئ الشاشة (NN/g)" }
    url: "https://www.nngroup.com/articles/mobile-accessibility-research/"
review_labels:
  MC-P05-001: { en: "A passed checklist isn't proof people can finish", ar: "النجاح في الـ Checklist لا يعني أن الناس يُنهون المهمة" }
  MC-P05-002: { en: "Possible isn't the same as easy and fast", ar: "الممكن ليس مثل السهل والسريع" }
  MC-P05-003: { en: "A separate version must have the same content and features", ar: "النسخة المنفصلة يجب أن يكون فيها كل المحتوى والميزات" }
  MC-P05-004: { en: "A plugin or a promise doesn't replace testing with real users", ar: "الإضافة الجاهزة أو الوعد لا يغنيان عن الاختبار مع مستخدمين حقيقيين" }
  MC-P05-005: { en: "Test on people's own phones and settings", ar: "اختبر على هواتف الناس وبإعداداتهم" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Adel can't reorder his medicine", ar: "عادل لا يستطيع طلب دوائه" }
    body:
      en: "Last month, our pharmacy app passed an accessibility check: 52 of 52 points, all green. Accessibility means people with disabilities can use the app.\n\nThis week, Adel emailed us. He is blind and uses a screen reader (an app that reads the screen out loud). He tried to order his monthly medicine again, and gave up after 20 minutes. Most customers do it in less than one minute."
      ar: "الشهر الماضي، نجح تطبيق الصيدلية عندنا في فحص الـ Accessibility (أن يستطيع ذوو الإعاقة استخدام التطبيق): 52 بندًا من 52، كلها خضراء.\n\nوهذا الأسبوع، أرسل لنا عادل رسالة. عادل كفيف، ويستخدم قارئ الشاشة (Screen reader)، وهو تطبيق يقرأ ما على الشاشة بصوت عالٍ. حاول أن يطلب دواءه الشهري مرة أخرى، وتوقّف بعد 20 دقيقة. وأغلب العملاء يطلبونه في أقل من دقيقة."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Accessibility check", ar: "فحص الـ Accessibility" } }
        - { kind: chip, text: { en: "Passed", ar: "ناجح" }, gap: s }
        - { kind: text, text: { en: "52 of 52 points passed", ar: "نجح 52 بندًا من 52" }, gap: m }
        - { kind: line, gap: s }
        - { kind: small, text: { en: "Email from Adel: \"I couldn't reorder my medicine.\"", ar: "رسالة من عادل: «لم أستطع أن أطلب دوائي مرة أخرى»." }, gap: m }

  - id: S02
    type: choose
    skill: SK-P05-U01-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Accessibility Is Not Enough (NN/g): meeting every high-priority checkpoint doesn't mean disabled users can use the site. The test is whether they can do the task."
      ar: "جرّب أولًا. الإتاحة وحدها لا تكفي (NN/g): النجاح في كل البنود المهمة لا يعني أن ذوي الإعاقة يستطيعون استخدام الموقع. المقياس هو: هل يُنهون المهمة؟"
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "even if you meet every high-priority checkpoint, users with disabilities might still be completely incapable of using your site" }
    prompt:
      en: "The app passed all 52 points, but Adel couldn't order. Is the app good enough for blind customers now?"
      ar: "نجح التطبيق في البنود الـ 52 كلها، لكن عادل لم يستطع الطلب. هل التطبيق مناسب الآن للعملاء المكفوفين؟"
    options:
      - id: no
        text: { en: "No. A blind customer couldn't finish a main task", ar: "لا. عميل كفيف لم يستطع إنهاء مهمة أساسية" }
      - id: yes
        text: { en: "Yes. It passed every point, so Adel's case is rare", ar: "نعم. نجح في كل البنود، وحالة عادل نادرة" }
      - id: phone
        text: { en: "Yes, if we add a phone number for people who get stuck", ar: "نعم، إذا أضفنا رقم هاتف لمن يواجه مشكلة" }
    answer: [no]
    misconceptions:
      - id: MC-P05-001
        when: [yes]
        feedback:
          en: "Each point checks one small rule on the screen. None of them asks: can a blind customer order his medicine? Adel's 20 minutes answer that question."
          ar: "كل بند يفحص قاعدة صغيرة واحدة في الشاشة. ولا يوجد بند يسأل: هل يستطيع عميل كفيف أن يطلب دواءه؟ والجواب جاء من عادل: 20 دقيقة ولم ينجح."
      - id: MC-P05-003
        when: [phone]
        feedback:
          en: "A phone number gives Adel a different, slower way to do the same thing. The app itself still stops him."
          ar: "رقم الهاتف يعطي عادل طريقة أخرى أبطأ لنفس الطلب. والتطبيق نفسه ما زال يوقفه."
    hints:
      - { en: "What was Adel trying to do, and did he manage it?", ar: "ماذا كان عادل يحاول أن يفعل؟ وهل نجح؟" }
      - { en: "Which tells you more: the 52 green points, or what happened when Adel tried?", ar: "أيهما يخبرك أكثر: البنود الـ 52 الخضراء، أم ما حدث حين حاول عادل؟" }
    correct:
      en: "Right. What matters is whether people can finish the task, not the score."
      ar: "صحيح. المهم هو هل يُنهي الناس المهمة، لا الدرجة."
    explain:
      en: "A checklist checks rules one by one. It can't tell you if people can really finish a task. Only watching them try can tell you that."
      ar: "الـ Checklist يفحص القواعد واحدة بعد الأخرى. لكنه لا يخبرك هل يُنهي الناس المهمة فعلًا. وهذا لا تعرفه إلا حين تراهم يحاولون."

  - id: S03
    type: card
    part: concept
    icons: [ok, clock, layers, person, ear]
    title: { en: "Passing the rules isn't the same as easy to use", ar: "النجاح في القواعد لا يعني سهولة الاستخدام" }
    body:
      en: "- **Passing isn't proof:** a screen can pass every rule on the checklist and still stop people from finishing.\n- **Possible isn't enough:** what counts is how easy and fast it is for a disabled person. A ramp at the back of a building lets wheelchair users in, but it's far away.\n- **Same content, same features:** a separate \"accessible version\" with fewer things in it isn't equal.\n- **Not two groups:** many people see a bit less or get tired faster. It's a range, not yes or no.\n- **Their own tools:** blind people set up the screen reader on their own phone. A website's add-on menu can't replace it. Testing with real users shows what stops them."
      ar: "- **النجاح ليس دليلًا:** قد تنجح الشاشة في كل قواعد الـ Checklist، ومع ذلك تمنع الناس من إنهاء مهمتهم.\n- **الممكن لا يكفي:** المهم هو: ما مدى سهولة المهمة وسرعتها للشخص ذي الإعاقة؟ فالمنحدر الموجود خلف المبنى يُدخل مستخدم الكرسي المتحرّك، لكنه بعيد.\n- **نفس المحتوى ونفس الميزات:** «النسخة الخاصة بذوي الإعاقة» إذا كان فيها أشياء أقل، فهي ليست عادلة.\n- **ليسوا فئتين فقط:** كثير من الناس يرون أقل قليلًا، أو يتعبون أسرع. الأمر درجات، لا «نعم أو لا».\n- **أدواتهم الخاصة:** المكفوفون يضبطون قارئ الشاشة على هواتفهم بأنفسهم. وقائمة الأدوات التي يضيفها الموقع لا تحلّ محلّه. والاختبار مع مستخدمين حقيقيين يكشف ما يوقفهم."

  - id: S04
    type: compare
    skill: SK-P05-U01-01
    part: guided
    rules: [R06]
    value:
      en: "Alternative Interfaces for Accessibility (NN/g): whatever the user group, every version must offer the same functionality and the same content. A 'simple' version without saved prescriptions isn't equal access."
      ar: "واجهات بديلة من أجل الإتاحة (NN/g): أيًّا كانت فئة المستخدمين، يجب أن تقدّم كل نسخة نفس الوظائف ونفس المحتوى. والنسخة «المبسّطة» بلا الوصفات المحفوظة ليست عادلة."
    ref: { url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/", quote: "Regardless of the targeted user group, all designs must offer the same functionality and provide access to the same content." }
    scenario:
      en: "Adel can't order his medicine in our app. Our developers have two ideas to fix this."
      ar: "عادل لا يستطيع طلب دوائه من تطبيقنا. والمطوّرون عندنا عندهم فكرتان لحل المشكلة."
    prompt:
      en: "Which idea gives Adel everything other customers get?"
      ar: "أي فكرة تعطي عادل كل ما يحصل عليه باقي العملاء؟"
    a:
      label: { en: "A: Make a separate, simple page only for blind customers", ar: "A: نعمل صفحة بسيطة منفصلة للعملاء المكفوفين فقط" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Order (simple)", ar: "الطلب (مبسّط)" } }
          - { kind: field, label: { en: "Medicine name", ar: "اسم الدواء" }, text: { en: "Type the name", ar: "اكتب الاسم" }, gap: m }
          - { kind: field, label: { en: "Quantity", ar: "الكمية" }, text: "1", filled: true, gap: s }
          - { kind: small, color: muted, text: { en: "Saved prescriptions and offers are not available here.", ar: "الوصفات المحفوظة والعروض غير موجودة هنا." }, gap: s }
          - { kind: button, text: { en: "Send order", ar: "أرسل الطلب" }, gap: m }
    b:
      label: { en: "B: Fix our normal order screen so it works with a screen reader", ar: "B: نُصلح شاشة الطلب العادية لتعمل مع قارئ الشاشة" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "My prescriptions", ar: "وصفاتي" } }
          - { kind: text, weight: bold, text: { en: "Metformin 500 mg, monthly", ar: "ميتفورمين 500 ملجم، شهريًا" }, gap: m }
          - { kind: small, text: { en: "Last ordered 2 October", ar: "آخر طلب: 2 أكتوبر" }, gap: xs }
          - { kind: button, text: { en: "Reorder Metformin", ar: "اطلب ميتفورمين مرة أخرى" }, gap: s }
          - { kind: link, text: { en: "This week's offers", ar: "عروض هذا الأسبوع" }, gap: s }
          - { kind: chip, text: { en: "✓ Works with a screen reader", ar: "✓ يعمل مع قارئ الشاشة" }, gap: m }
    answer: b
    misconceptions:
      - id: MC-P05-003
        when: [a]
        feedback:
          en: "Page A has no saved prescriptions, so Adel must type the medicine name himself, and he may not know the exact spelling. A separate page with fewer features isn't equal."
          ar: "الصفحة A ليس فيها الوصفات المحفوظة، فعلى عادل أن يكتب اسم الدواء بنفسه، وقد لا يعرف طريقة كتابته بالضبط. والصفحة المنفصلة التي فيها ميزات أقل ليست عادلة."
    hints:
      - { en: "Compare the two screens: which one still shows Adel's saved prescription?", ar: "قارن الشاشتين: أيهما ما زالت تعرض وصفة عادل المحفوظة؟" }
      - { en: "Would other customers be happy if the simple page were their only way to order?", ar: "هل يرضى باقي العملاء لو كانت الصفحة البسيطة هي طريقتهم الوحيدة للطلب؟" }
    correct:
      en: "Right. Fix the real screen, so everyone gets the same features."
      ar: "صحيح. أصلح الشاشة الأصلية، ليحصل الجميع على نفس الميزات."
    explain:
      en: "Every version must have the same content and features. When you fix the one screen everyone uses, there's no side page that gets forgotten later."
      ar: "يجب أن يكون في كل نسخة نفس المحتوى ونفس الميزات. وحين تُصلح الشاشة التي يستخدمها الجميع، لا تبقى صفحة جانبية تُنسى بعد ذلك."

  - id: S05
    type: tune
    skill: SK-P05-U01-01
    part: guided
    rules: [R06]
    value:
      en: "Beyond Accessibility (NN/g): usability isn't only whether a task is possible, but how easy and fast it is (the ramp at the back of the building). 'My orders' after 14 offers is reachable, but slow by screen reader."
      ar: "ما بعد الإتاحة (NN/g): سهولة الاستخدام ليست فقط أن تكون المهمة ممكنة، بل مدى سهولتها وسرعتها (مثل المنحدر خلف المبنى). و«طلباتي» بعد 14 عرضًا يمكن الوصول إليها، لكنها بطيئة بقارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/", quote: "It is also a matter of how easy and fast it is for them to do so." }
    scenario:
      en: "A screen reader reads our home screen from top to bottom. Adel swipes to hear the next item. He hears 14 offers before he reaches \"My orders\" at the bottom."
      ar: "قارئ الشاشة يقرأ الشاشة الرئيسية عندنا من الأعلى إلى الأسفل. ويسحب عادل بإصبعه ليسمع العنصر التالي. فيسمع 14 عرضًا قبل أن يصل إلى «طلباتي» في الأسفل."
    prompt:
      en: "Tap each option to see the change. Which change lets Adel start his order fastest?"
      ar: "اضغط على كل خيار لترى التغيير. أي تغيير يجعل عادل يبدأ طلبه بأسرع شكل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &homenow
        - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
        - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: s }
        - { kind: image, size: s, text: { en: "Offer 2 of 14", ar: "العرض 2 من 14" }, gap: s }
        - { kind: small, color: muted, text: { en: "… 12 more offers …", ar: "… 12 عرضًا آخر …" }, gap: s }
        - { kind: button, style: plain, text: { en: "My orders", ar: "طلباتي" }, gap: s }
    options:
      - id: keep
        text: { en: "Change nothing: he can reach \"My orders\" in the end", ar: "لا تغيّر شيئًا: فهو يصل إلى «طلباتي» في النهاية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *homenow
      - id: top
        text: { en: "Put \"Reorder my medicine\" at the top, before the offers", ar: "ضع زر «اطلب دوائي مرة أخرى» في الأعلى، قبل العروض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
            - { kind: button, text: { en: "Reorder my medicine", ar: "اطلب دوائي مرة أخرى" }, gap: s }
            - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: m }
            - { kind: small, color: muted, text: { en: "… 13 more offers …", ar: "… 13 عرضًا آخر …" }, gap: s }
      - id: note
        text: { en: "Add a line at the top: \"Screen reader users: My orders is at the bottom\"", ar: "أضف سطرًا في الأعلى: «لمستخدمي قارئ الشاشة: طلباتي في الأسفل»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
            - { kind: small, text: { en: "Screen reader users: My orders is at the bottom.", ar: "لمستخدمي قارئ الشاشة: «طلباتي» في الأسفل." }, gap: xs }
            - { kind: image, size: s, text: { en: "Offer 1 of 14", ar: "العرض 1 من 14" }, gap: s }
            - { kind: image, size: s, text: { en: "Offer 2 of 14", ar: "العرض 2 من 14" }, gap: s }
            - { kind: small, color: muted, text: { en: "… 12 more offers …", ar: "… 12 عرضًا آخر …" }, gap: s }
            - { kind: button, style: plain, text: { en: "My orders", ar: "طلباتي" }, gap: s }
    answer: [top]
    misconceptions:
      - id: MC-P05-002
        when: [keep]
        feedback:
          en: "Reaching it after 14 swipes is like the ramp at the back of the building. It works, but it costs Adel much more time than anyone else."
          ar: "الوصول بعد 14 سحبة مثل المنحدر خلف المبنى. يعمل، لكنه يأخذ من عادل وقتًا أكثر بكثير من غيره."
      - id: MC-P05-002
        when: [note]
        feedback:
          en: "The line tells Adel where \"My orders\" is, but it's still far away. He still has to pass all 14 offers to get there."
          ar: "السطر يخبر عادل بمكان «طلباتي»، لكنها ما زالت بعيدة. وما زال عليه أن يمرّ على الـ 14 عرضًا كلها ليصل إليها."
    hints:
      - { en: "In each option, count how many swipes Adel needs before he can start.", ar: "في كل خيار، عُدّ كم سحبة يحتاج عادل قبل أن يبدأ." }
      - { en: "Which option makes his task as quick for him as it is for others?", ar: "أي خيار يجعل المهمة سريعة له كما هي سريعة لغيره؟" }
    correct:
      en: "Right. Put the main task first, for everyone."
      ar: "صحيح. ضع المهمة الأساسية أولًا، للجميع."
    explain:
      en: "Possible isn't enough; it should be quick. With the main task at the top, it's fast with a screen reader, and faster for everyone else too."
      ar: "الممكن لا يكفي؛ يجب أن تكون المهمة سريعة. وحين تكون المهمة الأساسية في الأعلى، تصبح سريعة بقارئ الشاشة، وأسرع لباقي العملاء أيضًا."

  - id: S06
    type: choose
    skill: SK-P05-U01-02
    part: guided
    rules: [R06]
    value:
      en: "Challenges for Screen-Reader Users on Mobile (NN/g): no screen reader user in the study opened the accessibility menus on their own; they already have a built-in screen reader. Most issues are structural and no plugin fixes them."
      ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): لم يفتح أي مستخدم لقارئ الشاشة في الدراسة قوائم الإتاحة من نفسه؛ فلديهم قارئ شاشة في الهاتف. وأغلب المشكلات في بناء الشاشة نفسها، ولا تُصلحها إضافة."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "Most accessibility issues are structural and cannot be fixed by a simple plugin." }
    scenario:
      en: "My manager found a ready-made accessibility menu. One line of code adds a floating button with text size, colours and its own screen reader. He wants to add it and close Adel's complaint."
      ar: "وجد مديري قائمة أدوات جاهزة للـ Accessibility. سطر واحد من الكود يضيف زرًا عائمًا فيه حجم الخط والألوان وقارئ شاشة خاص به. ويريد أن يضيفها ويُغلق شكوى عادل."
    prompt:
      en: "What should we do before we say Adel's problem is fixed?"
      ar: "ماذا نفعل قبل أن نقول إن مشكلة عادل انحلّت؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Pharmacy", ar: "الصيدلية" } }
        - { kind: image, size: m, text: { en: "Offers", ar: "العروض" }, gap: s }
        - { kind: pill, text: { en: "♿ Accessibility menu", ar: "♿ قائمة الأدوات" }, gap: m }
    options:
      - id: menu
        text: { en: "Add the menu; its screen reader is enough for Adel", ar: "نضيف القائمة؛ فقارئ الشاشة الذي فيها يكفي عادل" }
      - id: menutest
        text: { en: "Add the menu, then ask Adel to try its screen reader", ar: "نضيف القائمة، ثم نطلب من عادل أن يجرّب قارئ الشاشة الذي فيها" }
      - id: users
        text: { en: "Watch a few blind customers order with their own screen readers, and fix what stops them", ar: "نراقب بعض العملاء المكفوفين وهم يطلبون بقارئ الشاشة الخاص بهم، ونُصلح ما يوقفهم" }
    answer: [users]
    misconceptions:
      - id: MC-P05-004
        when: [menu, menutest]
        feedback:
          en: "Adel already has a screen reader on his phone, set up the way he likes. To use the menu's reader, he'd have to turn his own off. And the menu doesn't change the order or names on the screen, which is what stopped him."
          ar: "عند عادل قارئ شاشة في هاتفه، مضبوط كما يحب. ولكي يستخدم قارئ القائمة، عليه أن يُطفئ قارئه. والقائمة لا تغيّر ترتيب الشاشة ولا أسماء العناصر، وهذا بالضبط ما أوقفه."
    hints:
      - { en: "What does Adel already use to hear his phone?", ar: "ماذا يستخدم عادل أصلًا ليسمع هاتفه؟" }
      - { en: "Does a floating button change the order and names on the order screen?", ar: "هل يغيّر الزر العائم ترتيب شاشة الطلب وأسماء عناصرها؟" }
    correct:
      en: "Right. Test with real users and fix the screen itself."
      ar: "صحيح. اختبر مع مستخدمين حقيقيين، وأصلح الشاشة نفسها."
    explain:
      en: "Blind people use the screen reader that comes with their phone. What stops them is usually how the screen is built: the order, the names, where things are. Watching them use it shows you what to fix."
      ar: "المكفوفون يستخدمون قارئ الشاشة الموجود في هواتفهم. وما يوقفهم غالبًا هو طريقة بناء الشاشة: الترتيب، والأسماء، ومكان كل عنصر. وحين تراقبهم وهم يستخدمونها، تعرف ما يجب إصلاحه."

  - id: S07
    type: compare
    skill: SK-P05-U01-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: both plans test with screen reader users; only the device differs. Mobile accessibility research (NN/g): have participants use their own device; they know where things are and how their reader is set up, and a researcher's phone would hinder them."
      ar: "مقارنة: الخطتان تختبران مع مستخدمي قارئ الشاشة؛ والفرق في الهاتف فقط. بحث الإتاحة على الهاتف (NN/g): اجعل المشاركين يستخدمون أجهزتهم؛ فهم يعرفون أماكن الأشياء وضبط القارئ عندهم، وهاتف الباحث يُربكهم."
    ref: { url: "https://www.nngroup.com/articles/mobile-accessibility-research/", quote: "Have participants use their own device." }
    scenario:
      en: "We'll invite 5 blind customers to try our new order screen. We wrote two plans for the test."
      ar: "سندعو 5 عملاء مكفوفين ليجرّبوا شاشة الطلب الجديدة. وكتبنا خطتين للاختبار."
    prompt:
      en: "Which plan shows us the problems in our app, not problems with a phone they don't know?"
      ar: "أي خطة تكشف لنا مشكلات تطبيقنا، لا مشكلات هاتف لا يعرفونه؟"
    a:
      label: { en: "A: Everyone uses our office phone", ar: "A: الكل يستخدم هاتف المكتب عندنا" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Test plan A", ar: "خطة الاختبار A" } }
          - { kind: text, text: { en: "Each person uses our office test phone. The screen reader is on its default settings.", ar: "كل شخص يستخدم هاتف الاختبار الموجود في مكتبنا. وقارئ الشاشة على الإعدادات الأصلية." }, gap: s }
    b:
      label: { en: "B: Each person uses their own phone", ar: "B: كل شخص يستخدم هاتفه" }
      mock:
        width: 300
        blocks:
          - { kind: heading, text: { en: "Test plan B", ar: "خطة الاختبار B" } }
          - { kind: text, text: { en: "Each person uses their own phone, with their own screen reader settings.", ar: "كل شخص يستخدم هاتفه، بإعدادات قارئ الشاشة التي يستخدمها كل يوم." }, gap: s }
    answer: b
    reason:
      prompt: { en: "Why does Plan B give us truer results?", ar: "لماذا تعطينا الخطة B نتائج أصدق؟" }
      options:
        - { id: own, text: { en: "On a phone they don't know, people struggle with the phone instead of our app", ar: "على هاتف لا يعرفونه، يتعب الناس مع الهاتف نفسه بدل تطبيقنا" } }
        - { id: same, text: { en: "Every person will have the same setup", ar: "لأن كل الأشخاص سيكون عندهم نفس الإعدادات" } }
        - { id: cheap, text: { en: "We don't have to buy test phones", ar: "لأننا لن نحتاج إلى شراء هواتف للاختبار" } }
      answer: [own]
      misconceptions:
        - id: MC-P05-005
          when: [same, cheap]
          feedback:
            en: "Cost and same setup aren't the point. People know where things are on their own phone and how fast their reader talks. A phone they don't know adds problems that aren't from our app."
            ar: "السعر وتشابه الإعدادات ليسا السبب. الناس يعرفون أماكن الأشياء في هواتفهم، وسرعة كلام القارئ عندهم. والهاتف الذي لا يعرفونه يضيف مشكلات ليست من تطبيقنا."
    misconceptions:
      - id: MC-P05-005
        when: [a]
        feedback:
          en: "On our phone, people would fight settings and a speed they don't know. We'd be testing the phone, not our order screen."
          ar: "على هاتفنا، سيتعب الناس مع إعدادات وسرعة لا يعرفونها. وسنكون نختبر الهاتف، لا شاشة الطلب."
    hints:
      - { en: "Think about how much a blind person changes on their phone over the years: speed, gestures, voice.", ar: "فكّر: كم يغيّر الشخص الكفيف في هاتفه على مرّ السنين؟ السرعة، وحركات الأصابع، والصوت." }
      - { en: "In which plan would any problem come only from our screen?", ar: "في أي خطة ستأتي أي مشكلة من شاشتنا فقط؟" }
    correct:
      en: "Right. Their own phone, their own settings."
      ar: "صحيح. هواتفهم، وإعداداتهم."
    explain:
      en: "Screen reader users set up their phones in detail. On their own phone, any problem they hit comes from our design, and that's what we want to find."
      ar: "مستخدمو قارئ الشاشة يضبطون هواتفهم بالتفصيل. وعلى هواتفهم، أي مشكلة تقابلهم تأتي من تصميمنا، وهذا ما نريد أن نكتشفه."

  - id: S08
    type: choose
    skill: SK-P05-U01-02
    part: independent
    speaker: hana
    rules: [R14]
    value:
      en: "New case. Accessibility Is Not Enough (NN/g): never trust a vendor's sales staff on user experience; check for yourself by having a few disabled people do real tasks with their own assistive technology."
      ar: "حالة جديدة. الإتاحة وحدها لا تكفي (NN/g): لا تصدّق فريق المبيعات في أمور تجربة المستخدم؛ وتحقّق بنفسك بأن يجرّب بعض ذوي الإعاقة مهامّ حقيقية بأدواتهم المساعدة."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "the only good advice here is to check for yourself" }
    scenario:
      en: "I'm choosing a class-booking system for my gym. The company selling it says it's \"fully accessible\" and shows a certificate. Two of our members are blind and use screen readers. One member uses a screen magnifier (a tool that makes part of the screen bigger)."
      ar: "أختار نظامًا لحجز الحصص في النادي الذي أملكه. الشركة التي تبيعه تقول إنه «مناسب تمامًا لذوي الإعاقة» وتعرض شهادة. اثنان من أعضائنا مكفوفان ويستخدمان قارئ الشاشة. وعضوة تستخدم مكبّر الشاشة (Screen magnifier)، وهو أداة تكبّر جزءًا من الشاشة."
    prompt:
      en: "What should I do before I sign the contract?"
      ar: "ماذا أفعل قبل أن أوقّع العقد؟"
    options:
      - id: try
        text: { en: "Ask those three members to book a class with it, on their own phones", ar: "أطلب من هؤلاء الأعضاء الثلاثة أن يحجزوا حصة به، على هواتفهم" }
      - id: cert
        text: { en: "Sign now; the certificate proves it works for them", ar: "أوقّع الآن؛ فالشهادة تُثبت أنه يناسبهم" }
      - id: list
        text: { en: "Ask the company for the full list of points it passed", ar: "أطلب من الشركة القائمة الكاملة للبنود التي نجح فيها" }
    answer: [try]
    misconceptions:
      - id: MC-P05-004
        when: [cert]
        feedback:
          en: "The company wants to sell, and a certificate only says some rules were met. It can't tell you if your members can book a class."
          ar: "الشركة تريد أن تبيع، والشهادة تقول فقط إن بعض القواعد تحقّقت. ولا تخبرك هل يستطيع أعضاؤك حجز حصة."
      - id: MC-P05-001
        when: [list]
        feedback:
          en: "A longer list is still a list of rules. A system can pass them all and still stop people from booking."
          ar: "القائمة الأطول تبقى قائمة قواعد. وقد ينجح النظام فيها كلها، ويظل يمنع الناس من الحجز."
    hints:
      - { en: "Who gains the most from saying the system works for everyone?", ar: "من المستفيد الأكبر من القول إن النظام يناسب الجميع؟" }
      - { en: "Which option shows you real people doing the real task?", ar: "أي خيار يُريك أشخاصًا حقيقيين يقومون بالمهمة الحقيقية؟" }
    correct:
      en: "Right. Check it yourself with the people who will use it."
      ar: "صحيح. تأكّد بنفسك مع الناس الذين سيستخدمونه."
    explain:
      en: "One hour with a few members, on their own phones and tools, tells you more than any certificate. You'll see if they can book, and where they get stuck."
      ar: "ساعة واحدة مع بعض الأعضاء، على هواتفهم وبأدواتهم، تخبرك أكثر من أي شهادة. سترى هل يستطيعون الحجز، وأين يتوقّفون."

  - id: S09
    type: card
    part: recap
    icons: [ok, clock, layers, person]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **The task decides:** you judged the app by Adel's 20 minutes, not by 52 green points.\n- **Same features:** you fixed the real screen instead of adding a side page with less in it.\n- **Easy and fast:** you moved the main task to the top, so it's quick with a screen reader too.\n- **Real users, own tools:** you tested on people's own phones and settings, and checked a seller's claim yourself.\n\nNext lesson: why a screen reader reads one thing at a time, and how to give people shortcuts."
      ar: "- **العبرة بالمهمة:** حكمت على التطبيق بالـ 20 دقيقة التي قضاها عادل، لا بالـ 52 بندًا الأخضر.\n- **نفس الميزات:** أصلحت الشاشة الأصلية بدل إضافة صفحة جانبية فيها أشياء أقل.\n- **سهل وسريع:** نقلت المهمة الأساسية إلى الأعلى، لتكون سريعة بقارئ الشاشة أيضًا.\n- **مستخدمون حقيقيون بأدواتهم:** اختبرت على هواتف الناس وبإعداداتهم، وتأكّدت بنفسك من كلام الشركة.\n\nالدرس التالي: لماذا يقرأ قارئ الشاشة شيئًا واحدًا في كل مرة، وكيف تعطي الناس طرقًا مختصرة."
