id: P05-U01-L02
mode: lesson
minutes: 8
title:
  en: "One thing at a time"
  ar: "شيء واحد في كل مرة"
speaker: sara
sources:
  - title: { en: "Challenges for Screen-Reader Users on Mobile (NN/g)", ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/"
  - title: { en: "Direct Access vs. Sequential Access: UX Definition (NN/g)", ar: "الوصول المباشر مقابل الوصول المتسلسل (NN/g)" }
    url: "https://www.nngroup.com/articles/direct-vs-sequential-access/"
review_labels:
  MC-P05-006: { en: "A one-at-a-time sequence makes people pass everything before their item", ar: "التسلسل الذي يعرض عنصرًا واحدًا في كل مرة يجبر الناس على المرور بكل ما قبل ما يريدون" }
  MC-P05-007: { en: "Search is a shortcut; don't hide it", ar: "البحث طريق مختصر؛ لا تُخفِه" }
  MC-P05-008: { en: "A fixed order fits content read from start to end", ar: "الترتيب الثابت يناسب محتوى يُقرأ من البداية إلى النهاية" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Kamal looks for this week's offer", ar: "كمال يبحث عن عرض الأسبوع" }
    body:
      en: "I'm redesigning the home screen of a bookshop app. Kamal, a customer who is blind, uses a screen reader. He wanted this week's offer on Arabic novels.\n\nThe offers sit in a carousel (slides that show one at a time). He had to move through them one by one. The novels offer was slide 6 of 8."
      ar: "أعيد تصميم الشاشة الرئيسية لتطبيق مكتبة لبيع الكتب. كمال عميل كفيف يستخدم قارئ الشاشة، وكان يريد عرض هذا الأسبوع على الروايات العربية.\n\nالعروض موجودة في Carousel (شرائح تظهر واحدة بعد الأخرى). فاضطر إلى المرور عليها واحدة واحدة. وكان عرض الروايات هو الشريحة 6 من 8."
    mock:
      width: 300
      blocks: &carousel
        - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
        - { kind: image, size: m, text: { en: "Offer: children's books", ar: "عرض: كتب الأطفال" }, gap: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 8", ar: "1 من 8" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }

  - id: S02
    type: tune
    skill: SK-P05-U01-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Direct vs. sequential access (NN/g): carousels force people through items one by one. Give links to each item so people pick any in any order, or show several at once."
      ar: "جرّب أولًا. الوصول المباشر مقابل المتسلسل (NN/g): الـ Carousel يُجبر الناس على المرور بالعناصر واحدًا واحدًا. ضع روابط لكل عنصر ليختار الناس أيّها بأي ترتيب، أو اعرض عدة عناصر معًا."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "provide links to the stories in the carousels to let people select them in any order or, at least, present more than one item at once" }
    prompt:
      en: "Try each version. Which one lets Kamal reach the novels offer fastest?"
      ar: "جرّب كل نسخة. أيّها تجعل كمال يصل إلى عرض الروايات أسرع؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: *carousel
    options:
      - id: auto
        text: { en: "Make the slides change by themselves every 3 seconds", ar: "اجعل الشرائح تتغيّر وحدها كل 3 ثوانٍ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
            - { kind: image, size: m, text: { en: "Offer: children's books", ar: "عرض: كتب الأطفال" }, gap: s }
            - { kind: meta, text: { en: "1 / 8 · next slide in 3 s", ar: "1 من 8 · الشريحة التالية بعد 3 ثوانٍ" }, gap: xs }
      - id: list
        text: { en: "Show the 8 offers as a short list of titled links", ar: "اعرض العروض الثمانية كقائمة قصيرة من الروابط بعناوينها" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
            - { kind: heading, text: { en: "This week's offers", ar: "عروض هذا الأسبوع" }, gap: s }
            - { kind: link, text: { en: "Children's books: 20% off", ar: "كتب الأطفال: خصم 20%" }, gap: xs }
            - { kind: link, text: { en: "Cookbooks: buy 2, get 1", ar: "كتب الطبخ: اشترِ 2 واحصل على 1" }, gap: xs }
            - { kind: link, text: { en: "Arabic novels: 30% off", ar: "الروايات العربية: خصم 30%" }, gap: xs }
            - { kind: link, text: { en: "See all 8 offers", ar: "اعرض العروض الثمانية" }, gap: xs }
      - id: bigger
        text: { en: "Make the Next button bigger and easier to find", ar: "كبّر زر «التالي» واجعله أسهل في الإيجاد" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
            - { kind: image, size: m, text: { en: "Offer: children's books", ar: "عرض: كتب الأطفال" }, gap: s }
            - { kind: meta, text: { en: "1 / 8", ar: "1 من 8" }, gap: xs }
            - { kind: button, text: { en: "Next offer", ar: "العرض التالي" }, gap: xs }
    answer: [list]
    misconceptions:
      - id: MC-P05-006
        when: [bigger]
        feedback:
          en: "A bigger Next button is easier to find, but Kamal still has to press it 5 times and hear 5 offers he doesn't want."
          ar: "زر «التالي» الأكبر أسهل في الإيجاد، لكن على كمال أن يضغطه 5 مرات ويسمع 5 عروض لا يريدها."
      - id: MC-P05-006
        when: [auto]
        feedback:
          en: "Moving slides are still one at a time, and now they move while the screen reader is reading. Kamal can't choose the offer he wants."
          ar: "الشرائح المتحرّكة ما زالت واحدة في كل مرة، وهي الآن تتحرّك أثناء قراءة قارئ الشاشة. ولا يستطيع كمال اختيار العرض الذي يريده."
    hints:
      - { en: "In each version, what does Kamal have to go through before the novels offer?", ar: "في كل نسخة، بماذا يجب أن يمرّ كمال قبل عرض الروايات؟" }
      - { en: "Which version lets him pick the offer he wants without passing the others one by one?", ar: "أي نسخة تتيح له اختيار العرض الذي يريده دون المرور بالبقية واحدًا واحدًا؟" }
    correct:
      en: "Right. Links let him jump straight to the offer."
      ar: "صحيح. الروابط تجعله يقفز إلى العرض مباشرة."
    explain:
      en: "In a carousel, the 6th slide comes only after the first 5. A list of titled links lets anyone go straight to the one they want."
      ar: "في الـ Carousel، لا تأتي الشريحة السادسة إلا بعد الخمس الأولى. وقائمة الروابط بعناوينها تتيح لأي شخص الذهاب مباشرة إلى ما يريد."

  - id: S03
    type: card
    part: concept
    icons: [ear, order, list, text, search]
    title: { en: "A screen reader reads one thing at a time", ar: "قارئ الشاشة يقرأ شيئًا واحدًا في كل مرة" }
    body:
      en: "A sighted person sees the whole screen and looks straight at what they want. A screen reader reads one item, then waits for a swipe. To reach the 10th item, you pass the 9 before it.\n\n- **Direct beats one-by-one:** let people jump straight to what they want.\n- **Carousels:** give each slide a titled link, or show several at once.\n- **Long pages:** put a short list of jump links at the top.\n- **Videos:** add a text summary or transcript (the words of the video as text) people can scan.\n- **Search:** keep it easy to find; it's the fastest shortcut."
      ar: "يرى الشخص المبصر الشاشة كلها وينظر مباشرة إلى ما يريد. أما قارئ الشاشة فيقرأ عنصرًا واحدًا ثم ينتظر سحبة. ولكي تصل إلى العنصر العاشر، تمرّ بالتسعة التي قبله.\n\n- **المباشر أفضل من واحد تلو الآخر:** دع الناس يقفزون مباشرة إلى ما يريدون.\n- **الـ Carousels:** ضع لكل شريحة رابطًا بعنوانها، أو اعرض عدة شرائح معًا.\n- **الصفحات الطويلة:** ضع في أعلاها قائمة قصيرة من روابط القفز (Jump links).\n- **الفيديو:** أضف ملخصًا نصيًا أو نصًا مكتوبًا لكلام الفيديو (Transcript) يستطيع الناس تصفّحه.\n- **البحث:** اجعله سهل الإيجاد؛ فهو أسرع طريق مختصر."

  - id: S04
    type: tune
    skill: SK-P05-U01-03
    part: guided
    rules: [R06]
    value:
      en: "Direct vs. sequential access (NN/g): on a long page, people can't tell what's further down. A linked table of contents at the top (a mini-IA) shows what's there and lets them jump to it. Next/Previous pages are still one-by-one."
      ar: "الوصول المباشر مقابل المتسلسل (NN/g): في الصفحة الطويلة لا يعرف الناس ما في الأسفل. وفهرس من الروابط في أعلى الصفحة يُظهر ما فيها ويتيح القفز إليه. أما صفحات «التالي/السابق» فما زالت واحدًا تلو الآخر."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "provide a mini-IA: a linked page table of contents at the top of the page" }
    scenario:
      en: "Our \"Delivery and returns\" help page is one long page with 7 topics. Kamal needs the returns deadline, which is the 6th topic."
      ar: "صفحة المساعدة «التوصيل والإرجاع» عندنا صفحة واحدة طويلة فيها 7 مواضيع. ويحتاج كمال إلى مهلة الإرجاع، وهي الموضوع السادس."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &helpnow
        - { kind: title, text: { en: "Delivery and returns", ar: "التوصيل والإرجاع" } }
        - { kind: heading, text: { en: "1. Delivery areas", ar: "1. مناطق التوصيل" }, gap: m }
        - { kind: text, text: { en: "We deliver to all governorates. Cairo and Giza orders arrive in…", ar: "نوصّل إلى كل المحافظات. وتصل طلبات القاهرة والجيزة خلال…" }, gap: xs }
        - { kind: heading, text: { en: "2. Delivery fees", ar: "2. رسوم التوصيل" }, gap: m }
        - { kind: text, text: { en: "Orders over 500 EGP ship free. Smaller orders…", ar: "الطلبات فوق 500 جنيه توصيلها مجاني. والطلبات الأصغر…" }, gap: xs }
        - { kind: small, color: muted, text: { en: "… 5 more topics below …", ar: "… 5 مواضيع أخرى في الأسفل …" }, gap: m }
    options:
      - id: top
        text: { en: "Add a \"Back to top\" button at the bottom", ar: "أضف زر «العودة إلى الأعلى» في الأسفل" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Delivery and returns", ar: "التوصيل والإرجاع" } }
            - { kind: heading, text: { en: "1. Delivery areas", ar: "1. مناطق التوصيل" }, gap: m }
            - { kind: text, text: { en: "We deliver to all governorates. Cairo and Giza orders arrive in…", ar: "نوصّل إلى كل المحافظات. وتصل طلبات القاهرة والجيزة خلال…" }, gap: xs }
            - { kind: small, color: muted, text: { en: "… 6 more topics below …", ar: "… 6 مواضيع أخرى في الأسفل …" }, gap: m }
            - { kind: button, style: plain, text: { en: "↑ Back to top", ar: "↑ العودة إلى الأعلى" }, gap: m }
      - id: pages
        text: { en: "Split it into 7 pages with Next and Previous buttons", ar: "قسّمها إلى 7 صفحات بزرّي «التالي» و«السابق»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Delivery and returns", ar: "التوصيل والإرجاع" } }
            - { kind: meta, text: { en: "Topic 1 of 7", ar: "الموضوع 1 من 7" }, gap: xs }
            - { kind: heading, text: { en: "Delivery areas", ar: "مناطق التوصيل" }, gap: m }
            - { kind: text, text: { en: "We deliver to all governorates. Cairo and Giza orders arrive in…", ar: "نوصّل إلى كل المحافظات. وتصل طلبات القاهرة والجيزة خلال…" }, gap: xs }
            - { kind: button, text: { en: "Next topic", ar: "الموضوع التالي" }, gap: m }
      - id: jump
        text: { en: "Add links to the 7 topics at the top of the page", ar: "أضف روابط للمواضيع السبعة في أعلى الصفحة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Delivery and returns", ar: "التوصيل والإرجاع" } }
            - { kind: small, weight: bold, text: { en: "On this page", ar: "في هذه الصفحة" }, gap: s }
            - { kind: link, text: { en: "Delivery areas", ar: "مناطق التوصيل" }, gap: xs }
            - { kind: link, text: { en: "Delivery fees", ar: "رسوم التوصيل" }, gap: xs }
            - { kind: small, color: muted, text: { en: "… 3 more …", ar: "… 3 روابط أخرى …" }, gap: xs }
            - { kind: link, text: { en: "Returns deadline", ar: "مهلة الإرجاع" }, gap: xs }
            - { kind: link, text: { en: "Refunds", ar: "استرداد المبلغ" }, gap: xs }
            - { kind: heading, text: { en: "1. Delivery areas", ar: "1. مناطق التوصيل" }, gap: m }
    answer: [jump]
    misconceptions:
      - id: MC-P05-006
        when: [pages]
        feedback:
          en: "Seven pages with Next is still one-by-one: Kamal opens 5 pages he doesn't need before the returns deadline."
          ar: "سبع صفحات بزر «التالي» ما زالت واحدة تلو الأخرى: يفتح كمال 5 صفحات لا يحتاجها قبل مهلة الإرجاع."
      - id: MC-P05-006
        when: [top]
        feedback:
          en: "Back to top helps after he's read everything. He still has to go through topics 1 to 5 to get to the 6th."
          ar: "زر العودة إلى الأعلى يفيد بعد أن يقرأ كل شيء. وما زال عليه أن يمرّ بالمواضيع من 1 إلى 5 ليصل إلى السادس."
    hints:
      - { en: "Where does Kamal start, and where is the returns deadline?", ar: "من أين يبدأ كمال، وأين توجد مهلة الإرجاع؟" }
      - { en: "Which version tells him at the start what's on the page and takes him straight there?", ar: "أي نسخة تخبره في البداية بما في الصفحة وتنقله إليه مباشرة؟" }
    correct:
      en: "Right. Jump links show what's there and go straight to it."
      ar: "صحيح. روابط القفز تُظهر ما في الصفحة وتنقلك إليه مباشرة."
    explain:
      en: "A short list of links at the top tells everyone what the page holds and lets them skip to it. It helps sighted people on a phone as much as Kamal."
      ar: "قائمة الروابط القصيرة في الأعلى تخبر الجميع بما تحمله الصفحة وتتيح لهم القفز إليه. وهي تفيد المبصرين على الهاتف بقدر ما تفيد كمال."

  - id: S05
    type: choose
    skill: SK-P05-U01-03
    part: guided
    rules: [R06]
    value:
      en: "Direct vs. sequential access (NN/g): video is the most sequential medium. With a video, also give a transcript or at least a detailed text summary people can scan for the part they need."
      ar: "الوصول المباشر مقابل المتسلسل (NN/g): الفيديو أكثر الوسائط تسلسلًا. ومع الفيديو، قدّم أيضًا نصًا مكتوبًا أو على الأقل ملخصًا نصيًا مفصّلًا يتصفّحه الناس للجزء الذي يحتاجونه."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "at least a detailed text summary that allows people to quickly scan the information for relevant details" }
    scenario:
      en: "Our \"How to return a book\" help is a 4-minute video and nothing else. Kamal only needs step 3: where to drop the book."
      ar: "شرح «كيف ترجع كتابًا» عندنا فيديو مدته 4 دقائق، ولا شيء غيره. ويحتاج كمال الخطوة 3 فقط: أين يسلّم الكتاب."
    prompt:
      en: "Which change lets Kamal reach step 3 directly?"
      ar: "أي تغيير يجعل كمال يصل إلى الخطوة 3 مباشرة؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "How to return a book", ar: "كيف ترجع كتابًا" } }
        - { kind: image, size: m, text: { en: "▶ Video · 4:00", ar: "▶ فيديو · 4:00" }, gap: s }
    options:
      - id: steps
        text: { en: "Add the steps under the video as numbered text", ar: "أضف الخطوات تحت الفيديو كنص مرقّم" }
      - id: short
        text: { en: "Cut the video down to 2 minutes", ar: "اختصر الفيديو إلى دقيقتين" }
      - id: speed
        text: { en: "Add a button to play the video at double speed", ar: "أضف زرًا لتشغيل الفيديو بسرعة مضاعفة" }
    answer: [steps]
    misconceptions:
      - id: MC-P05-006
        when: [short, speed]
        feedback:
          en: "A shorter or faster video is still watched from the start. Kamal still sits through steps 1 and 2 to hear step 3."
          ar: "الفيديو الأقصر أو الأسرع ما زال يُشاهَد من البداية. فما زال على كمال أن ينتظر الخطوتين 1 و2 ليسمع الخطوة 3."
    hints:
      - { en: "In a video, can Kamal skip to step 3 without knowing the exact minute?", ar: "في الفيديو، هل يستطيع كمال القفز إلى الخطوة 3 دون أن يعرف الدقيقة بالضبط؟" }
      - { en: "Which option gives him something his screen reader can jump through?", ar: "أي خيار يعطيه شيئًا يستطيع قارئ الشاشة القفز خلاله؟" }
    correct:
      en: "Right. Text steps can be scanned; a video can't."
      ar: "صحيح. الخطوات المكتوبة يمكن تصفّحها؛ والفيديو لا."
    explain:
      en: "Numbered text lets a screen reader user, or anyone in a hurry, jump to step 3. Keep the video for those who like to watch."
      ar: "النص المرقّم يتيح لمستخدم قارئ الشاشة، أو لأي مستعجل، القفز إلى الخطوة 3. وأبقِ الفيديو لمن يحب المشاهدة."

  - id: S06
    type: tune
    skill: SK-P05-U01-03
    part: guided
    rules: [R06]
    value:
      en: "Challenges for Screen-Reader Users on Mobile (NN/g): screen reader users rely on in-page or site search whenever they can, because it lets them jump straight to what they want. Hiding search behind a menu removes their best shortcut."
      ar: "تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): يعتمد مستخدمو قارئ الشاشة على البحث في الصفحة أو الموقع كلما أمكن، لأنه يوصلهم مباشرة إلى ما يريدون. وإخفاء البحث خلف قائمة يحرمهم أفضل طريق مختصر."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "it helps them jump straight to what they are looking for" }
    scenario:
      en: "To make room for a bigger banner, my team wants to move the search box into the ☰ menu."
      ar: "لإفساح المجال لبانر أكبر، يريد فريقي نقل مربع البحث إلى القائمة ☰."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &searchnow
        - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
        - { kind: field, text: { en: "Search books or authors", ar: "ابحث عن كتاب أو كاتب" }, gap: s }
        - { kind: image, size: s, text: { en: "Banner", ar: "بانر" }, gap: s }
    options:
      - id: menu
        text: { en: "Move search into the ☰ menu; make the banner bigger", ar: "انقل البحث إلى القائمة ☰؛ وكبّر البانر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - kind: row
              blocks:
                - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
                - { kind: meta, text: "☰" }
            - { kind: image, size: l, text: { en: "Banner", ar: "بانر" }, gap: s }
      - id: keep
        text: { en: "Keep the search box at the top of the screen", ar: "أبقِ مربع البحث في أعلى الشاشة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *searchnow
      - id: bottom
        text: { en: "Move search below the banner and the offers", ar: "انقل البحث أسفل البانر والعروض" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Bookshop", ar: "المكتبة" } }
            - { kind: image, size: l, text: { en: "Banner", ar: "بانر" }, gap: s }
            - { kind: small, color: muted, text: { en: "… offers …", ar: "… العروض …" }, gap: s }
            - { kind: field, text: { en: "Search books or authors", ar: "ابحث عن كتاب أو كاتب" }, gap: s }
    answer: [keep]
    misconceptions:
      - id: MC-P05-007
        when: [menu]
        feedback:
          en: "For Kamal, search is the fastest way in: type a title, land on it. Inside a menu, he has to find the menu first, then find search inside it."
          ar: "البحث عند كمال أسرع طريق للدخول: يكتب العنوان فيصل إليه. وداخل القائمة، عليه أن يجد القائمة أولًا، ثم يجد البحث داخلها."
      - id: MC-P05-007
        when: [bottom]
        feedback:
          en: "Below the banner and offers, Kamal has to swipe past all of them to reach the one thing that would skip them."
          ar: "أسفل البانر والعروض، على كمال أن يمرّ بها كلها ليصل إلى الشيء الوحيد الذي كان سيُغنيه عنها."
    hints:
      - { en: "For someone who hears the screen one item at a time, what's the quickest way to a book?", ar: "لمن يسمع الشاشة عنصرًا عنصرًا، ما أسرع طريق إلى كتاب؟" }
      - { en: "In which version does he reach search before anything else?", ar: "في أي نسخة يصل إلى البحث قبل أي شيء آخر؟" }
    correct:
      en: "Right. Keep the shortcut where it's found first."
      ar: "صحيح. أبقِ الطريق المختصر حيث يُعثر عليه أولًا."
    explain:
      en: "Search lets screen reader users skip the line and go straight to what they want. Keep it visible and near the top."
      ar: "البحث يتيح لمستخدمي قارئ الشاشة تخطّي الطابور والذهاب مباشرة إلى ما يريدون. فأبقِه ظاهرًا وقريبًا من الأعلى."

  - id: S07
    type: compare
    skill: SK-P05-U01-03
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: one-by-one isn't always wrong. Direct vs. sequential access (NN/g): sequential access is the right choice when people are expected to go through all the content in a set order, like a novel. Offers are unrelated, so they need direct access."
      ar: "مقارنة: العرض واحدًا تلو الآخر ليس خطأ دائمًا. الوصول المباشر مقابل المتسلسل (NN/g): الوصول المتسلسل هو الاختيار الصحيح حين يُتوقَّع أن يمرّ الناس بالمحتوى كله بترتيب محدّد، مثل الرواية. أما العروض فغير مترابطة، فتحتاج وصولًا مباشرًا."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "Sequential access is the method of choice if you expect users to access all the content in a prescribed order." }
    scenario:
      en: "Our app also has an e-book reader. Two screens use a single \"Next\" button."
      ar: "في تطبيقنا أيضًا قارئ للكتب الإلكترونية. وشاشتان تستخدمان زر «التالي» وحده."
    prompt:
      en: "Which screen can keep its one-at-a-time \"Next\" button?"
      ar: "أي شاشة يمكن أن تُبقي زر «التالي» الذي يعرض شيئًا واحدًا في كل مرة؟"
    a:
      label: { en: "Reading a novel", ar: "قراءة رواية" }
      mock:
        width: 300
        blocks:
          - { kind: meta, text: { en: "Chapter 3 of 12", ar: "الفصل 3 من 12" } }
          - { kind: text, text: { en: "The train left the station before dawn, and Mariam still hadn't…", ar: "غادر القطار المحطة قبل الفجر، ومريم لم…" }, gap: s }
          - { kind: button, text: { en: "Next chapter", ar: "الفصل التالي" }, gap: m }
    b:
      label: { en: "This week's offers", ar: "عروض هذا الأسبوع" }
      mock:
        width: 300
        blocks:
          - { kind: meta, text: { en: "Offer 3 of 8", ar: "العرض 3 من 8" } }
          - { kind: image, size: s, text: { en: "Cookbooks: buy 2, get 1", ar: "كتب الطبخ: اشترِ 2 واحصل على 1" }, gap: s }
          - { kind: button, text: { en: "Next offer", ar: "العرض التالي" }, gap: m }
    answer: a
    reason:
      prompt: { en: "Why does one-at-a-time fit the novel?", ar: "لماذا يناسب العرض واحدًا تلو الآخر الرواية؟" }
      options:
        - { id: order, text: { en: "Readers go through every chapter, in order", ar: "القرّاء يمرّون بكل فصل، بالترتيب" } }
        - { id: fewer, text: { en: "It has fewer items than the offers", ar: "لأن عناصرها أقل من العروض" } }
        - { id: text, text: { en: "Text is easier for a screen reader than images", ar: "لأن النص أسهل على قارئ الشاشة من الصور" } }
      answer: [order]
      misconceptions:
        - id: MC-P05-008
          when: [fewer, text]
          feedback:
            en: "The novel has more items (12 chapters), not fewer. What matters is that readers want all of it in order, while people want only some offers."
            ar: "الرواية فيها عناصر أكثر (12 فصلًا)، لا أقل. والمهم أن القرّاء يريدونها كلها بالترتيب، بينما يريد الناس بعض العروض فقط."
    misconceptions:
      - id: MC-P05-008
        when: [b]
        feedback:
          en: "Offers aren't read in order: each person wants one or two. Making them go one by one wastes their time. A novel is read from start to end, so Next fits it."
          ar: "العروض لا تُقرأ بالترتيب: كل شخص يريد عرضًا أو اثنين. وإجبارهم على المرور بها واحدًا واحدًا يضيّع وقتهم. أما الرواية فتُقرأ من البداية إلى النهاية، فيناسبها «التالي»."
    hints:
      - { en: "Does a reader of a novel want every chapter, or just one?", ar: "هل يريد قارئ الرواية كل الفصول، أم فصلًا واحدًا فقط؟" }
      - { en: "Does someone browsing offers want all 8, in order?", ar: "هل يريد من يتصفّح العروض الثمانية كلها، بالترتيب؟" }
    correct:
      en: "Right. One-by-one fits content people read in order."
      ar: "صحيح. واحدًا تلو الآخر يناسب محتوى يقرؤه الناس بالترتيب."
    explain:
      en: "Ask whether people want all of it in a set order. A story, yes: Next fits. Offers, news or search results, no: give direct access."
      ar: "اسأل: هل يريد الناس المحتوى كله بترتيب محدّد؟ القصة، نعم: فيناسبها «التالي». والعروض أو الأخبار أو نتائج البحث، لا: فقدّم وصولًا مباشرًا."

  - id: S08
    type: tune
    skill: SK-P05-U01-03
    part: independent
    speaker: nour
    rules: [R14]
    value:
      en: "New case. Direct vs. sequential access (NN/g): carousels are only for short lists, and long lists never belong in them. 24 doctors in a slider means up to 23 swipes; a list grouped by specialty with links lets people jump."
      ar: "حالة جديدة. الوصول المباشر مقابل المتسلسل (NN/g): الـ Carousels للقوائم القصيرة فقط، والقوائم الطويلة لا مكان لها فيها. و24 طبيبًا في شرائح تعني حتى 23 سحبة؛ والقائمة المجمّعة حسب التخصص مع الروابط تتيح القفز."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "Search results or long lists never belong in carousels" }
    scenario:
      en: "Our clinic's website shows its 24 doctors in a slider, one card at a time. Patients usually look for one specialty, like skin or children."
      ar: "يعرض موقع عيادتنا أطباءنا الـ 24 في شرائح، بطاقة واحدة في كل مرة. والمرضى يبحثون عادةً عن تخصص واحد، مثل الجلدية أو الأطفال."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &docsnow
        - { kind: title, text: { en: "Our doctors", ar: "أطباؤنا" } }
        - { kind: image, size: s, text: { en: "Dr. Hesham · Heart", ar: "د. هشام · القلب" }, gap: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 24", ar: "1 من 24" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }
    options:
      - id: arrows
        text: { en: "Add arrows on both sides and dots under the slider", ar: "أضف أسهمًا على الجانبين ونقاطًا تحت الشرائح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Our doctors", ar: "أطباؤنا" } }
            - kind: row
              gap: s
              blocks:
                - { kind: meta, text: "‹" }
                - { kind: image, size: s, text: { en: "Dr. Hesham · Heart", ar: "د. هشام · القلب" } }
                - { kind: meta, text: "›" }
            - { kind: small, color: muted, text: "● ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○", gap: xs }
      - id: list
        text: { en: "A list grouped by specialty, with links to each specialty at the top", ar: "قائمة مجمّعة حسب التخصص، مع روابط لكل تخصص في الأعلى" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Our doctors", ar: "أطباؤنا" } }
            - kind: row
              gap: s
              blocks:
                - { kind: link, text: { en: "Heart", ar: "القلب" } }
                - { kind: link, text: { en: "Skin", ar: "الجلدية" } }
                - { kind: link, text: { en: "Children", ar: "الأطفال" } }
                - { kind: link, text: { en: "More", ar: "المزيد" } }
            - { kind: heading, text: { en: "Heart", ar: "القلب" }, gap: m }
            - { kind: text, text: { en: "Dr. Hesham · Dr. Laila · Dr. Amir", ar: "د. هشام · د. ليلى · د. أمير" }, gap: xs }
            - { kind: heading, text: { en: "Skin", ar: "الجلدية" }, gap: m }
            - { kind: text, text: { en: "Dr. Mai · Dr. Sherif", ar: "د. مي · د. شريف" }, gap: xs }
      - id: auto
        text: { en: "Let the slider move by itself so patients see every doctor", ar: "اجعل الشرائح تتحرّك وحدها ليرى المرضى كل الأطباء" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Our doctors", ar: "أطباؤنا" } }
            - { kind: image, size: s, text: { en: "Dr. Hesham · Heart", ar: "د. هشام · القلب" }, gap: s }
            - { kind: meta, text: { en: "1 / 24 · next in 3 s", ar: "1 من 24 · التالي بعد 3 ثوانٍ" }, gap: xs }
    answer: [list]
    misconceptions:
      - id: MC-P05-006
        when: [arrows, auto]
        feedback:
          en: "Still one doctor at a time: a patient who wants a children's doctor may wait or swipe through 20 cards first. 24 items is far too many for a slider."
          ar: "ما زال طبيبًا واحدًا في كل مرة: قد ينتظر المريض الذي يريد طبيب أطفال أو يمرّ بـ 20 بطاقة أولًا. و24 عنصرًا أكثر بكثير مما تحتمله الشرائح."
    hints:
      - { en: "How do patients look for a doctor: by going through all 24, or by specialty?", ar: "كيف يبحث المرضى عن طبيب: بالمرور بالأطباء الـ 24 كلهم، أم حسب التخصص؟" }
      - { en: "Which version lets a patient go straight to one specialty?", ar: "أي نسخة تتيح للمريض الذهاب مباشرة إلى تخصص واحد؟" }
    correct:
      en: "Right. Long lists don't belong in a slider."
      ar: "صحيح. القوائم الطويلة لا مكان لها في الشرائح."
    explain:
      en: "Group by what people look for and link to each group. Patients, sighted or not, get to the right doctor in a couple of steps."
      ar: "جمّع حسب ما يبحث عنه الناس، وضع رابطًا لكل مجموعة. فيصل المرضى، مبصرين أو لا، إلى الطبيب المناسب في خطوتين."

  - id: S09
    type: card
    part: recap
    icons: [ear, list, text, search, order]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Carousels:** turned 8 slides into titled links Kamal can pick from.\n- **Long pages:** added jump links to the 7 topics.\n- **Videos:** added numbered text steps people can scan.\n- **Search:** kept it at the top, as the fastest shortcut.\n- **When order is right:** kept Next for a novel, read from start to end.\n\nNext lesson: who else gets blocked, and by what."
      ar: "- **الـ Carousels:** حوّلت 8 شرائح إلى روابط بعناوينها يختار منها كمال.\n- **الصفحات الطويلة:** أضفت روابط قفز إلى المواضيع السبعة.\n- **الفيديو:** أضفت خطوات مكتوبة مرقّمة يتصفّحها الناس.\n- **البحث:** أبقيته في الأعلى، كأسرع طريق مختصر.\n- **حين يكون الترتيب صحيحًا:** أبقيت «التالي» لرواية تُقرأ من البداية إلى النهاية.\n\nالدرس التالي: من غيرهم يتعثّر، وبماذا."
