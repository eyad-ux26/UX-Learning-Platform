id: P05-U01
free: true
title:
  en: "See the barriers"
  ar: "اكتشف العوائق"
skill:
  en: "Judge a design by whether people with disabilities can finish the task easily, and spot what blocks them."
  ar: "احكم على التصميم بقدرة ذوي الإعاقة على إكمال المهمة بسهولة، واكتشف ما يعيقهم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P05-U01-01
    title: { en: "Judge by the task, not the checklist", ar: "احكم بالمهمة، لا بقائمة التحقّق" }
    can_do: { en: "Count a design as accessible only when disabled people get the same content and features, and finish the task in reasonable time.", ar: "اعتبر التصميم متاحًا فقط حين يحصل ذوو الإعاقة على المحتوى والميزات نفسها، ويُكملون المهمة في وقت معقول." }
  - id: SK-P05-U01-02
    title: { en: "Check with real users and their own tools", ar: "تحقّق مع مستخدمين حقيقيين وأدواتهم" }
    can_do: { en: "Verify with disabled people on their own devices and assistive technology, instead of trusting a plugin, a vendor or a lab phone.", ar: "تحقّق مع أشخاص من ذوي الإعاقة على أجهزتهم وتقنياتهم المساعدة، بدل الثقة في إضافة جاهزة أو مورّد أو هاتف المختبر." }
  - id: SK-P05-U01-03
    title: { en: "Give direct access, not a forced sequence", ar: "وفّر وصولًا مباشرًا، لا تسلسلًا إجباريًا" }
    can_do: { en: "Replace carousels, long unbroken pages and video-only help with links, jump links, visible search and text people can reach directly.", ar: "استبدل الـ Carousels والصفحات الطويلة بلا فواصل والشرح بالفيديو فقط، بروابط وروابط قفز وبحث ظاهر ونص يصل إليه الناس مباشرة." }
  - id: SK-P05-U01-04
    title: { en: "Accept input the way people give it", ar: "اقبل الإدخال كما يكتبه الناس" }
    can_do: { en: "Accept spaces, dashes and real names, and let people type a value instead of forcing a fiddly picker.", ar: "اقبل المسافات والشرطات والأسماء الحقيقية، ودع الناس يكتبون القيمة بدل إجبارهم على أداة اختيار مُتعبة." }
  - id: SK-P05-U01-05
    title: { en: "Let people adapt text and theme", ar: "دع الناس يكيّفون النص والمظهر" }
    can_do: { en: "Let text follow the phone's text size, offer a bigger-text control on reading screens, and offer dark mode without forcing it.", ar: "اجعل النص يتبع حجم الخط في الهاتف، وقدّم زرًا لتكبير النص في شاشات القراءة، وقدّم الوضع الداكن دون فرضه." }
