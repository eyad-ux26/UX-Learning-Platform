id: P05-U01
free: true
title:
  en: "See the barriers"
  ar: "اكتشف ما يعيق المستخدمين"
skill:
  en: "Judge a design by whether people with disabilities can finish their task easily, and spot what stops them."
  ar: "احكم على التصميم بسؤال واحد: هل يُنهي ذوو الإعاقة مهمتهم بسهولة؟ واكتشف ما يوقفهم."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P05-U01-01
    title: { en: "Judge by the task, not the checklist", ar: "العبرة بإنجاز المهمة، لا بالـ Checklist" }
    can_do: { en: "Call a design accessible only when disabled people get the same content and features, and finish the task in a normal time.", ar: "لا تعتبر التصميم مناسبًا لذوي الإعاقة إلا إذا حصلوا على المحتوى والميزات نفسها، وأنهوا المهمة في وقت عادي." }
  - id: SK-P05-U01-02
    title: { en: "Test with real users and their own tools", ar: "اختبر مع مستخدمين حقيقيين وبأدواتهم" }
    can_do: { en: "Test with disabled people on their own phones and assistive tools, instead of trusting a plugin, a seller's promise or an office phone.", ar: "اختبر مع أشخاص من ذوي الإعاقة على هواتفهم وبأدواتهم المساعدة، ولا تكتفِ بإضافة جاهزة أو وعد من شركة أو هاتف المكتب." }
  - id: SK-P05-U01-03
    title: { en: "Let people jump straight to what they want", ar: "دع الناس يصلون مباشرة إلى ما يريدون" }
    can_do: { en: "Replace carousels, long pages and video-only help with links, a list of topics at the top, visible search and text people can jump to.", ar: "بدل الـ Carousel والصفحات الطويلة والشرح بالفيديو فقط، استخدم روابط، وقائمة مواضيع في أعلى الصفحة، وبحثًا ظاهرًا، ونصًا يقفز إليه الناس." }
  - id: SK-P05-U01-04
    title: { en: "Accept input the way people type it", ar: "اقبل ما يكتبه الناس كما هو" }
    can_do: { en: "Accept spaces, dashes and real names, and let people type a value instead of forcing a hard-to-use picker.", ar: "اقبل المسافات والشرطات والأسماء الحقيقية، ودع الناس يكتبون القيمة بدل أداة اختيار صعبة." }
  - id: SK-P05-U01-05
    title: { en: "Let people change text size and theme", ar: "دع الناس يغيّرون حجم الخط والمظهر" }
    can_do: { en: "Let text follow the phone's text size, add a bigger-text button on reading screens, and offer dark mode without forcing it.", ar: "اجعل النص يتبع حجم الخط في الهاتف، وأضف زرًا لتكبير النص في شاشات القراءة، واترك الوضع الداكن اختيارًا لا إجبارًا." }
