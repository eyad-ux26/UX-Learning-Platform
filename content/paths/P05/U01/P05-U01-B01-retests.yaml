steps:
  # SK-P05-U01-01: judge by the task, not the checklist
  - id: S01
    type: choose
    skill: SK-P05-U01-01
    part: retest
    speaker: karim
    value:
      en: "Re-test. Alternative Interfaces for Accessibility (NN/g): every version must offer the same functionality and content. A 'Lite' version without bill payments sends screen reader users to a poorer app."
      ar: "إعادة اختبار. واجهات بديلة من أجل الإتاحة (NN/g): يجب أن تقدّم كل نسخة الوظائف والمحتوى نفسها. ونسخة «Lite» بلا دفع الفواتير ترسل مستخدمي قارئ الشاشة إلى تطبيق أفقر."
    ref: { url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/", quote: "Regardless of the targeted user group, all designs must offer the same functionality and provide access to the same content." }
    scenario:
      en: "I build a banking app. Screen reader users are sent to a \"Lite\" version we made for them. It has transfers and balances, but no bill payments."
      ar: "أبني تطبيقًا بنكيًا. ويُوجَّه مستخدمو قارئ الشاشة إلى نسخة «Lite» صنعناها لهم. فيها التحويلات والأرصدة، لكن ليس فيها دفع الفواتير."
    prompt:
      en: "What should we do?"
      ar: "ماذا يجب أن نفعل؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Bank Lite", ar: "البنك Lite" } }
        - { kind: button, style: plain, text: { en: "Balances", ar: "الأرصدة" }, gap: s }
        - { kind: button, style: plain, text: { en: "Transfers", ar: "التحويلات" }, gap: xs }
        - { kind: small, color: muted, text: { en: "Bill payments: use the main app", ar: "دفع الفواتير: استخدم التطبيق الأساسي" }, gap: s }
    options:
      - id: note
        text: { en: "Keep Lite, with a note that bills are paid in the main app", ar: "أبقِ Lite، مع ملاحظة أن الفواتير تُدفع في التطبيق الأساسي" }
      - id: main
        text: { en: "Make the main app work with screen readers, so they get every feature", ar: "اجعل التطبيق الأساسي يعمل مع قارئ الشاشة، ليحصلوا على كل الميزات" }
      - id: rare
        text: { en: "Keep Lite as it is; few people pay bills in the app", ar: "أبقِ Lite كما هو؛ فقليلون يدفعون الفواتير في التطبيق" }
    answer: [main]
    misconceptions:
      - id: MC-P05-003
        when: [note, rare]
        feedback:
          en: "Screen reader users get fewer features than everyone else, and the note sends them to the app that blocks them. Equal access means the same features."
          ar: "يحصل مستخدمو قارئ الشاشة على ميزات أقل من الجميع، والملاحظة ترسلهم إلى التطبيق الذي يعيقهم. والوصول المتساوي يعني الميزات نفسها."
    correct:
      en: "Right. One app, every feature, for everyone."
      ar: "صحيح. تطبيق واحد، بكل الميزات، للجميع."
    explain:
      en: "A separate version tends to have less and to fall behind. Make the main app work with screen readers instead."
      ar: "النسخة المنفصلة تميل إلى أن تحمل أقل وأن تتأخّر. فاجعل التطبيق الأساسي يعمل مع قارئ الشاشة بدلًا منها."

  - id: S02
    type: tune
    skill: SK-P05-U01-01
    part: retest
    speaker: mona
    value:
      en: "Re-test. Beyond Accessibility (NN/g): usability is also how easy and fast a task is, not only whether it's possible. A seat map that works with a magnifier but takes 12 minutes needs a faster route."
      ar: "إعادة اختبار. ما بعد الإتاحة (NN/g): قابلية الاستخدام تعني أيضًا سهولة المهمة وسرعتها، لا إمكانيتها فقط. وخريطة المقاعد التي تعمل مع المكبّر لكنها تستغرق 12 دقيقة تحتاج طريقًا أسرع."
    ref: { url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/", quote: "It is also a matter of how easy and fast it is for them to do so." }
    scenario:
      en: "My team designs a cinema app. Ziad has low vision and uses a screen magnifier, which shows a small part of the screen at a time. He can pick seats on our seat map, but it takes him 12 minutes. Others take about one."
      ar: "يصمّم فريقي تطبيقًا للسينما. زياد ضعيف البصر ويستخدم مكبّر الشاشة، الذي يُظهر جزءًا صغيرًا من الشاشة في كل مرة. يستطيع اختيار المقاعد من خريطة المقاعد عندنا، لكن ذلك يستغرق 12 دقيقة. وغيره يحتاج نحو دقيقة."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &seatnow
        - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
        - { kind: image, size: m, text: { en: "Seat map: 180 small seats", ar: "خريطة المقاعد: 180 مقعدًا صغيرًا" }, gap: s }
        - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    options:
      - id: keep
        text: { en: "Keep it; the map works with a magnifier", ar: "أبقِها؛ فالخريطة تعمل مع المكبّر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *seatnow
      - id: help
        text: { en: "Add a help page on using the map with a magnifier", ar: "أضف صفحة مساعدة عن استخدام الخريطة مع المكبّر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
            - { kind: link, text: { en: "How to use the seat map with a magnifier", ar: "كيف تستخدم خريطة المقاعد مع المكبّر" }, gap: xs }
            - { kind: image, size: m, text: { en: "Seat map: 180 small seats", ar: "خريطة المقاعد: 180 مقعدًا صغيرًا" }, gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: best
        text: { en: "Add \"Best 2 seats together\" above the map, for everyone", ar: "أضف «أفضل مقعدين متجاورين» فوق الخريطة، للجميع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
            - { kind: button, text: { en: "Best 2 seats together", ar: "أفضل مقعدين متجاورين" }, gap: s }
            - { kind: small, color: muted, text: { en: "or choose on the map", ar: "أو اختر من الخريطة" }, gap: s }
            - { kind: image, size: m, text: { en: "Seat map: 180 small seats", ar: "خريطة المقاعد: 180 مقعدًا صغيرًا" }, gap: xs }
    answer: [best]
    misconceptions:
      - id: MC-P05-002
        when: [keep, help]
        feedback:
          en: "Possible isn't the same as easy: Ziad still spends 12 minutes searching the map piece by piece. Give him, and everyone, a quick road."
          ar: "الممكن لا يعني السهل: ما زال زياد يقضي 12 دقيقة يبحث في الخريطة جزءًا جزءًا. امنحه، وامنح الجميع، طريقًا سريعًا."
    correct:
      en: "Right. A one-step choice makes it fast for everyone."
      ar: "صحيح. الاختيار بخطوة واحدة يجعلها سريعة للجميع."
    explain:
      en: "Count how long disabled people take, not only whether they can. A quick route next to the map helps Ziad most, and saves others time too."
      ar: "احسب الوقت الذي يحتاجه ذوو الإعاقة، لا قدرتهم فقط. والطريق السريع بجانب الخريطة يفيد زياد أكثر، ويوفّر وقت غيره أيضًا."

  # SK-P05-U01-02: check with real users and their own tools
  - id: S03
    type: choose
    skill: SK-P05-U01-02
    part: retest
    speaker: rami
    value:
      en: "Re-test. Accessibility Is Not Enough (NN/g): ask a few disabled people to try real tasks, using their own screen readers, magnifiers or other assistive technology. A designer with eyes closed isn't a screen reader user."
      ar: "إعادة اختبار. الإتاحة وحدها لا تكفي (NN/g): اطلب من عدد من ذوي الإعاقة تجربة مهام حقيقية، بقارئات الشاشة أو المكبّرات أو التقنيات المساعدة الخاصة بهم. والمصمم المغمض العينين ليس مستخدمًا لقارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "It's important that these employees use their own screen readers, screen magnifiers, keyguards, or mouse replacements" }
    scenario:
      en: "I'm testing our food delivery app for accessibility. My plan: turn on the screen reader on my phone, close my eyes, and order a meal."
      ar: "أختبر تطبيق توصيل الطعام عندنا من ناحية الإتاحة. وخطتي: أشغّل قارئ الشاشة في هاتفي، وأغمض عينيّ، وأطلب وجبة."
    prompt:
      en: "Which plan will show what really blocks screen reader users?"
      ar: "أي خطة ستكشف ما يعيق مستخدمي قارئ الشاشة فعلًا؟"
    options:
      - id: me
        text: { en: "My plan is enough to find the problems", ar: "خطتي تكفي لاكتشاف المشكلات" }
      - id: two
        text: { en: "Do it myself, then ask a colleague to repeat it", ar: "أن أجرّبه بنفسي، ثم أطلب من زميل أن يكرّر التجربة" }
      - id: users
        text: { en: "Ask 4 or 5 people who use screen readers daily to order on their own phones", ar: "أن أطلب من 4 أو 5 أشخاص يستخدمون قارئ الشاشة يوميًا أن يطلبوا على هواتفهم" }
    answer: [users]
    misconceptions:
      - id: MC-P05-005
        when: [me, two]
        feedback:
          en: "A beginner with a screen reader gets stuck on the screen reader itself. Daily users, on their own phones, show what in our app blocks them."
          ar: "المبتدئ في قارئ الشاشة يتعثّر في القارئ نفسه. أما من يستخدمونه يوميًا، على هواتفهم، فيكشفون ما يعيقهم في تطبيقنا."
    correct:
      en: "Right. Real users, their own tools."
      ar: "صحيح. مستخدمون حقيقيون، بأدواتهم."
    explain:
      en: "Testing yourself is a quick first look, not proof. People who use assistive technology every day, on their own devices, show the real barriers."
      ar: "تجربتك بنفسك نظرة أولى سريعة، لا دليل. أما من يستخدمون التقنيات المساعدة كل يوم، على أجهزتهم، فيكشفون العوائق الحقيقية."

  - id: S04
    type: choose
    skill: SK-P05-U01-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Challenges for Screen-Reader Users on Mobile (NN/g): not one screen reader user opened the accessibility menus on their own. A toolbar subscription doesn't replace testing with customers and fixing the structure."
      ar: "إعادة اختبار. تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): لم يفتح أي مستخدم لقارئ الشاشة قوائم الإتاحة من تلقاء نفسه. والاشتراك في شريط أدوات لا يغني عن الاختبار مع العملاء وإصلاح البنية."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "not one user opened the menus of their own accord" }
    scenario:
      en: "A company offers my online shop an accessibility toolbar for 300 EGP a month. They say it \"makes your site accessible in one click\"."
      ar: "تعرض عليّ شركة شريط أدوات للإتاحة لمتجري الإلكتروني مقابل 300 جنيه شهريًا. ويقولون إنه «يجعل موقعك متاحًا بضغطة واحدة»."
    prompt:
      en: "What should I do?"
      ar: "ماذا يجب أن أفعل؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Spice shop", ar: "متجر التوابل" } }
        - { kind: image, size: s, text: { en: "Products", ar: "المنتجات" }, gap: s }
        - { kind: pill, text: { en: "♿ Accessibility toolbar", ar: "♿ شريط الإتاحة" }, gap: m }
    options:
      - id: test
        text: { en: "Watch a few customers who use screen readers shop on their own phones, and fix what they hit", ar: "مراقبة عدد من العملاء الذين يستخدمون قارئ الشاشة وهم يتسوّقون على هواتفهم، وإصلاح ما يتعثّرون فيه" }
      - id: buy
        text: { en: "Subscribe; the toolbar makes the shop accessible", ar: "الاشتراك؛ فالشريط يجعل المتجر متاحًا" }
      - id: both
        text: { en: "Subscribe, and add a page saying the shop is accessible", ar: "الاشتراك، وإضافة صفحة تقول إن المتجر متاح" }
    answer: [test]
    misconceptions:
      - id: MC-P05-004
        when: [buy, both]
        feedback:
          en: "Screen reader users already have a reader on their phone and tend to ignore these toolbars. The toolbar doesn't change the shop's order or labels, so the barriers stay."
          ar: "مستخدمو قارئ الشاشة لديهم قارئ في هواتفهم بالفعل، ويميلون إلى تجاهل هذه الأشرطة. والشريط لا يغيّر ترتيب المتجر ولا تسمياته، فتبقى العوائق."
    correct:
      en: "Right. Watch real customers and fix the shop itself."
      ar: "صحيح. راقب عملاء حقيقيين وأصلح المتجر نفسه."
    explain:
      en: "Most barriers are in the structure of the screens. Real customers show where they are; a toolbar on top doesn't remove them."
      ar: "أغلب العوائق في بنية الشاشات. والعملاء الحقيقيون يكشفون مواضعها؛ والشريط الذي يوضع فوقها لا يزيلها."

  # SK-P05-U01-03: give direct access, not a forced sequence
  - id: S05
    type: tune
    skill: SK-P05-U01-03
    part: retest
    speaker: hana
    value:
      en: "Re-test. Direct vs. sequential access (NN/g): carousels are fine only for short lists people can finish in 3–4 steps. Ten stories, one at a time, should become several at once with titled links."
      ar: "إعادة اختبار. الوصول المباشر مقابل المتسلسل (NN/g): الـ Carousels مقبولة فقط للقوائم القصيرة التي يُنهيها الناس في 3 إلى 4 خطوات. وعشر قصص، واحدة في كل مرة، يجب أن تصبح عدة قصص معًا بروابط معنونة."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "carousels are ok only for short lists" }
    scenario:
      en: "My gym's website shows 10 member stories in a slider, one at a time. Each story is about a different goal: weight loss, back pain, running a race…"
      ar: "يعرض موقع النادي الذي أملكه 10 قصص لأعضاء في شرائح، واحدة في كل مرة. وكل قصة عن هدف مختلف: إنقاص الوزن، آلام الظهر، الجري في سباق…"
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &storiesnow
        - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
        - { kind: image, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: فقدت 12 كيلو" }, gap: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 10", ar: "1 من 10" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }
    options:
      - id: arrows
        text: { en: "Add bigger arrows on both sides", ar: "أضف أسهمًا أكبر على الجانبين" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - kind: row
              gap: s
              blocks:
                - { kind: title, text: "‹" }
                - { kind: image, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: فقدت 12 كيلو" } }
                - { kind: title, text: "›" }
      - id: several
        text: { en: "Show 3 stories at once by goal, with a link to all 10", ar: "اعرض 3 قصص معًا حسب الهدف، مع رابط للقصص العشر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - { kind: link, text: { en: "Weight loss: Salma lost 12 kg", ar: "إنقاص الوزن: سلمى فقدت 12 كيلو" }, gap: xs }
            - { kind: link, text: { en: "Back pain: Magdy trains pain-free", ar: "آلام الظهر: مجدي يتمرّن دون ألم" }, gap: xs }
            - { kind: link, text: { en: "Running: Dina finished her first 10 km", ar: "الجري: دينا أنهت أول 10 كيلومترات" }, gap: xs }
            - { kind: link, text: { en: "All 10 stories by goal", ar: "القصص العشر حسب الهدف" }, gap: s }
      - id: auto
        text: { en: "Make the slider move by itself every 5 seconds", ar: "اجعل الشرائح تتحرّك وحدها كل 5 ثوانٍ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - { kind: image, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: فقدت 12 كيلو" }, gap: s }
            - { kind: meta, text: { en: "1 / 10 · next in 5 s", ar: "1 من 10 · التالي بعد 5 ثوانٍ" }, gap: xs }
    answer: [several]
    misconceptions:
      - id: MC-P05-006
        when: [arrows, auto]
        feedback:
          en: "Still one story at a time: someone with back pain may pass up to 9 stories to find theirs. Ten is too many for a slider."
          ar: "ما زالت قصة واحدة في كل مرة: قد يمرّ من يعاني آلام الظهر بتسع قصص ليجد قصته. وعشر قصص أكثر مما تحتمله الشرائح."
    correct:
      en: "Right. Show several, and link to the rest."
      ar: "صحيح. اعرض عدة قصص، واربط بالباقي."
    explain:
      en: "Titled links by goal let people jump to the story that matches them, by screen reader or by eye."
      ar: "الروابط المعنونة حسب الهدف تتيح للناس القفز إلى القصة التي تناسبهم، بقارئ الشاشة أو بالعين."

  - id: S06
    type: choose
    skill: SK-P05-U01-03
    part: retest
    speaker: karim
    value:
      en: "Re-test. Direct vs. sequential access (NN/g): video is the most sequential medium. If you provide a video, also give a transcript or a detailed text summary people can scan."
      ar: "إعادة اختبار. الوصول المباشر مقابل المتسلسل (NN/g): الفيديو أكثر الوسائط تسلسلًا. وإذا قدّمت فيديو، فقدّم أيضًا نصًا مكتوبًا أو ملخصًا نصيًا مفصّلًا يتصفّحه الناس."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "If you provide a video, make sure that you also provide, if not a transcription, at least a detailed text summary" }
    scenario:
      en: "In the cooking app I'm building, each recipe is only a 6-minute video. Users mid-cooking often just need the amount of one ingredient."
      ar: "في تطبيق الطبخ الذي أبنيه، كل وصفة عبارة عن فيديو مدته 6 دقائق فقط. والمستخدمون أثناء الطبخ يحتاجون غالبًا كمية مكوّن واحد فقط."
    prompt:
      en: "Which change lets people reach one ingredient amount directly?"
      ar: "أي تغيير يجعل الناس يصلون إلى كمية مكوّن واحد مباشرة؟"
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Molokhia with chicken", ar: "ملوخية بالفراخ" } }
        - { kind: image, size: m, text: { en: "▶ Video · 6:00", ar: "▶ فيديو · 6:00" }, gap: s }
    options:
      - id: replay
        text: { en: "Add a \"Back 10 seconds\" button to the video", ar: "أضف زر «رجوع 10 ثوانٍ» إلى الفيديو" }
      - id: autoplay
        text: { en: "Make the video play as soon as the recipe opens", ar: "اجعل الفيديو يعمل فور فتح الوصفة" }
      - id: text
        text: { en: "Add the ingredients and steps as text under the video", ar: "أضف المكوّنات والخطوات كنص تحت الفيديو" }
    answer: [text]
    misconceptions:
      - id: MC-P05-006
        when: [replay, autoplay]
        feedback:
          en: "Both keep people inside the video, moving through it in order. Text lets anyone, including screen reader users, jump straight to the ingredient."
          ar: "الخياران يُبقيان الناس داخل الفيديو، يتحرّكون خلاله بالترتيب. أما النص فيتيح لأي شخص، ومنهم مستخدمو قارئ الشاشة، القفز مباشرة إلى المكوّن."
    correct:
      en: "Right. Text can be scanned; video can't."
      ar: "صحيح. النص يمكن تصفّحه؛ والفيديو لا."
    explain:
      en: "Keep the video, and put the recipe in text beside it, so people can jump to the line they need."
      ar: "أبقِ الفيديو، وضع الوصفة نصًا بجانبه، ليقفز الناس إلى السطر الذي يحتاجونه."

  # SK-P05-U01-04: accept input the way people give it
  - id: S07
    type: tune
    skill: SK-P05-U01-04
    part: retest
    speaker: mona
    value:
      en: "Re-test. Usability for Older Adults (NN/g): users were punished for typing hyphens or parentheses in phone and credit-card numbers. Accept the spaces printed on the card and remove them in code."
      ar: "إعادة اختبار. قابلية الاستخدام لكبار السن (NN/g): عوقب المستخدمون على كتابة شرطات أو أقواس في أرقام الهاتف وبطاقات الائتمان. اقبل المسافات المطبوعة على البطاقة واحذفها في الكود."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "punished for entering hyphens or parentheses in telephone or credit-card numbers" }
    scenario:
      en: "In the checkout my team designs, Mr. Sami typed his card number with spaces, the way it's printed on his card. The field rejects it."
      ar: "في صفحة الدفع التي يصمّمها فريقي، كتب الأستاذ سامي رقم بطاقته بمسافات، كما هو مطبوع عليها. فرفضه الحقل."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks:
        - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Invalid card number", ar: "رقم بطاقة غير صالح" } }
    options:
      - id: hint
        text: { en: "Add a hint: \"No spaces\"", ar: "أضف تلميحًا: «دون مسافات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, hintFirst: true, hint: { en: "No spaces", ar: "دون مسافات" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Invalid card number", ar: "رقم بطاقة غير صالح" } }
      - id: accept
        text: { en: "Accept the spaces and remove them in the background", ar: "اقبل المسافات واحذفها في الخلفية" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111" }
            - { kind: small, color: green, text: { en: "✓ Visa", ar: "✓ Visa" }, gap: xs }
      - id: message
        text: { en: "Change the error to \"Please remove the spaces\"", ar: "غيّر رسالة الخطأ إلى «من فضلك احذف المسافات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Please remove the spaces", ar: "من فضلك احذف المسافات" } }
    answer: [accept]
    misconceptions:
      - id: MC-P05-009
        when: [hint, message]
        feedback:
          en: "The card number is right; the spaces just copy the card. A hint or a kinder error still makes Mr. Sami do work the code can do."
          ar: "رقم البطاقة صحيح؛ والمسافات تنقل شكل البطاقة فقط. والتلميح أو رسالة الخطأ الألطف ما زالا يجعلان الأستاذ سامي يقوم بعمل يستطيع الكود أن يقوم به."
    correct:
      en: "Right. Accept it as typed."
      ar: "صحيح. اقبله كما كُتب."
    explain:
      en: "People copy numbers the way they see them. Accept spaces and dashes, and clean them up in code."
      ar: "ينقل الناس الأرقام كما يرونها. فاقبل المسافات والشرطات، ونظّفها في الكود."

  - id: S08
    type: tune
    skill: SK-P05-U01-04
    part: retest
    speaker: sara
    value:
      en: "Re-test. Usability for Older Adults (NN/g): interfaces are often inflexible and unforgiving of errors; a participant asked why she couldn't just type the time. A typed time box replaces the fiddly wheel."
      ar: "إعادة اختبار. قابلية الاستخدام لكبار السن (NN/g): الواجهات كثيرًا ما تكون جامدة ولا تتسامح مع الأخطاء؛ وسألت مشاركة لماذا لا تستطيع أن تكتب الوقت ببساطة. ومربع الوقت المكتوب يحلّ محلّ العجلة المُتعبة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "Interfaces in websites and apps are often inflexible and unforgiving of errors." }
    scenario:
      en: "I'm designing a medicine reminder app. Uncle Mahmoud, 70, sets a reminder for 8:15 on a wheel that moves one minute per notch. He keeps landing on 8:13 or 8:17."
      ar: "أصمّم تطبيقًا لتذكير الدواء. يضبط عمّ محمود، 70 عامًا، تذكيرًا للساعة 8:15 على عجلة تتحرّك دقيقة مع كل درجة. ويقف في كل مرة على 8:13 أو 8:17."
    prompt:
      en: "Try each version. Which one should ship?"
      ar: "جرّب كل نسخة. أيّها يجب أن تُطلق؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      width: 300
      blocks: &medwheel
        - { kind: small, weight: bold, text: { en: "Remind me at", ar: "ذكّرني الساعة" } }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "8:12" }
            - { kind: text, weight: bold, text: "8:13" }
            - { kind: small, color: faint, text: "8:14" }
    options:
      - id: type
        text: { en: "A time box he can type 8:15 into", ar: "مربع للوقت يكتب فيه 8:15" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: field, label: { en: "Remind me at", ar: "ذكّرني الساعة" }, filled: true, text: "8:15", hint: { en: "For example 8:15", ar: "مثلًا 8:15" } }
      - id: buzz
        text: { en: "Keep the wheel, and make the phone buzz at each minute", ar: "أبقِ العجلة، واجعل الهاتف يهتز مع كل دقيقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks:
            - { kind: small, weight: bold, text: { en: "Remind me at", ar: "ذكّرني الساعة" } }
            - kind: group
              tone: plain
              gap: xs
              blocks:
                - { kind: small, color: faint, text: "8:12" }
                - { kind: text, weight: bold, text: "8:13" }
                - { kind: small, color: faint, text: "8:14" }
            - { kind: small, color: muted, text: { en: "📳 Buzzes at each minute", ar: "📳 يهتز مع كل دقيقة" }, gap: xs }
      - id: keep
        text: { en: "Keep the wheel; it can't produce an invalid time", ar: "أبقِ العجلة؛ فهي لا تسمح بوقت غير صالح" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          width: 300
          blocks: *medwheel
    answer: [type]
    misconceptions:
      - id: MC-P05-010
        when: [buzz, keep]
        feedback:
          en: "The wheel still needs a steady finger to stop on one exact minute. Uncle Mahmoud knows the time he wants; let him type it."
          ar: "العجلة ما زالت تحتاج إصبعًا ثابتًا ليتوقّف عند دقيقة واحدة بالضبط. وعمّ محمود يعرف الوقت الذي يريده؛ فدعه يكتبه."
    correct:
      en: "Right. Let him type the time."
      ar: "صحيح. دعه يكتب الوقت."
    explain:
      en: "When people know the exact value, typing it beats a control that needs a steady hand."
      ar: "حين يعرف الناس القيمة بالضبط، تكون كتابتها أفضل من عنصر يحتاج يدًا ثابتة."

  # SK-P05-U01-05: let people adapt text and theme
  - id: S09
    type: choose
    skill: SK-P05-U01-05
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Inclusive Design (NN/g): to make reading screens more inclusive, offer a button for users to increase the font size. Removing it because few people tap it removes it from the people who need it most."
      ar: "إعادة اختبار. التصميم الشامل (NN/g): لجعل شاشات القراءة أشمل، قدّم زرًا يتيح للمستخدمين تكبير الخط. وحذفه لأن قليلين يضغطونه يحرم منه أكثر من يحتاجونه."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "offer a button for users to increase the font size" }
    scenario:
      en: "In our news app, only 6% of readers tap the \"A A\" text-size button on articles. The designers want to remove it to clean up the article header."
      ar: "في تطبيق الأخبار عندنا، 6% فقط من القرّاء يضغطون زر حجم النص «A A» في المقالات. ويريد المصممون حذفه لتنظيف رأس المقال."
    prompt:
      en: "What should we do with the button?"
      ar: "ماذا يجب أن نفعل بالزر؟"
    mock:
      width: 300
      blocks:
        - kind: row
          blocks:
            - { kind: meta, text: { en: "Economy · 5 min read", ar: "اقتصاد · قراءة 5 دقائق" } }
            - { kind: chip, text: "A A" }
        - { kind: title, text: { en: "Bread prices stay the same this month", ar: "أسعار الخبز ثابتة هذا الشهر" }, gap: s }
    options:
      - id: keep
        text: { en: "Keep it on article screens", ar: "أبقِه في شاشات المقالات" }
      - id: remove
        text: { en: "Remove it; 6% is too few to keep it", ar: "احذفه؛ فـ 6% نسبة قليلة لإبقائه" }
      - id: bury
        text: { en: "Move it to Settings › Display › Advanced", ar: "انقله إلى الإعدادات › العرض › متقدّم" }
    answer: [keep]
    misconceptions:
      - id: MC-P05-012
        when: [remove, bury]
        feedback:
          en: "The 6% are likely the readers who can't read the default size. Removing or hiding the button takes away exactly what they need, right where they read."
          ar: "الـ 6% على الأرجح هم القرّاء الذين لا يستطيعون قراءة الحجم الافتراضي. وحذف الزر أو إخفاؤه يأخذ منهم بالضبط ما يحتاجونه، في مكان القراءة نفسه."
    correct:
      en: "Right. Keep it where people read."
      ar: "صحيح. أبقِه حيث يقرأ الناس."
    explain:
      en: "A small share of users can be the ones who can't read without it. Keep a bigger-text button on long reading screens."
      ar: "النسبة الصغيرة من المستخدمين قد تكون هي التي لا تستطيع القراءة بدونه. فأبقِ زر تكبير النص في شاشات القراءة الطويلة."

  - id: S10
    type: compare
    skill: SK-P05-U01-05
    part: retest
    speaker: rami
    value:
      en: "Re-test. Inclusive Design (NN/g): consider a dark-mode option without enforcing it, and use the dark-mode settings phones already offer. A dark-only redesign locks out people who read better on light screens."
      ar: "إعادة اختبار. التصميم الشامل (NN/g): فكّر في خيار للوضع الداكن دون فرضه، واستفد من إعدادات الوضع الداكن التي توفّرها الهواتف. والتصميم الداكن فقط يُغلق الباب أمام من يقرؤون أفضل على الشاشات الفاتحة."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "take advantage of any dark-mode APIs that various operating systems may offer" }
    scenario:
      en: "Our team is redesigning a banking app. I proposed two ways to handle the theme."
      ar: "يعيد فريقنا تصميم تطبيق بنكي. واقترحت طريقتين للتعامل مع المظهر."
    prompt:
      en: "Which proposal should ship?"
      ar: "أي اقتراح يجب أن يُطلق؟"
    a:
      label: { en: "Proposal A", ar: "الاقتراح A" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Theme", ar: "المظهر" } }
          - { kind: text, text: { en: "Follows your phone's light or dark setting. You can change it here.", ar: "يتبع إعداد الفاتح أو الداكن في هاتفك. ويمكنك تغييره هنا." }, gap: s }
          - { kind: segmented, options: [{ en: "Light", ar: "فاتح" }, { en: "Dark", ar: "داكن" }, { en: "Like my phone", ar: "مثل هاتفي" }], value: 2, gap: s }
    b:
      label: { en: "Proposal B", ar: "الاقتراح B" }
      mock:
        width: 300
        blocks:
          - { kind: title, text: { en: "Theme", ar: "المظهر" } }
          - { kind: text, text: { en: "Our new look is dark only, to match the brand.", ar: "مظهرنا الجديد داكن فقط، ليتناسب مع الهوية." }, gap: s }
    answer: a
    misconceptions:
      - id: MC-P05-013
        when: [b]
        feedback:
          en: "Dark helps some eyes and hurts others. Dark-only locks out customers who read better on light screens, and ignores the setting they chose on their phone."
          ar: "الداكن يساعد بعض العيون ويُتعب غيرها. والداكن فقط يُغلق الباب أمام العملاء الذين يقرؤون أفضل على الشاشات الفاتحة، ويتجاهل الإعداد الذي اختاروه في هواتفهم."
    correct:
      en: "Right. Follow the phone, and let people choose."
      ar: "صحيح. اتبع الهاتف، ودع الناس يختارون."
    explain:
      en: "Start from the person's phone setting and let them switch. Offer dark mode; don't force it."
      ar: "ابدأ من إعداد هاتف الشخص ودعه يغيّر. قدّم الوضع الداكن؛ ولا تفرضه."
