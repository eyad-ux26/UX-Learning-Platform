steps:
  # SK-P05-U01-01: judge by the task, not the checklist
  - id: S01
    type: choose
    skill: SK-P05-U01-01
    part: retest
    speaker: karim
    value:
      en: "Re-test. Alternative Interfaces for Accessibility (NN/g): every version must offer the same functionality and content. A 'Lite' version without bill payments sends screen reader users to a poorer app."
      ar: "إعادة اختبار. واجهات بديلة من أجل الإتاحة (NN/g): يجب أن تقدّم كل نسخة نفس الوظائف ونفس المحتوى. ونسخة «Lite» بلا دفع الفواتير تعطي مستخدمي قارئ الشاشة تطبيقًا أقل."
    ref: { url: "https://www.nngroup.com/articles/alternative-interfaces-for-accessibility/", quote: "Regardless of the targeted user group, all designs must offer the same functionality and provide access to the same content." }
    scenario:
      en: "I build a banking app. We made a \"Lite\" version for people who use screen readers, and we send them there. It has transfers and balances, but no bill payments."
      ar: "أبني تطبيقًا لبنك. وصنعنا نسخة «Lite» لمن يستخدمون قارئ الشاشة (Screen reader)، ونرسلهم إليها. فيها التحويلات والرصيد، لكن ليس فيها دفع الفواتير."
    prompt:
      en: "What should we do so screen reader users get every feature?"
      ar: "ماذا نفعل ليحصل مستخدمو قارئ الشاشة على كل الميزات؟"
    mock:
      app: rasid
      appbar: { title: { en: "Rasid Lite", ar: "رصيد Lite" } }
      blocks:
        - { kind: small, color: muted, text: { en: "The simple version for screen reader users", ar: "النسخة المبسّطة لمستخدمي قارئ الشاشة" } }
        - { kind: listitem, icon: wallet, text: { en: "Balances", ar: "الرصيد" }, chevron: true, gap: s }
        - { kind: listitem, icon: arrows-left-right, text: { en: "Transfers", ar: "التحويلات" }, chevron: true }
        - { kind: listitem, icon: receipt, text: { en: "Bill payments", ar: "دفع الفواتير" }, sub: { en: "Not here: use the main app", ar: "غير موجود هنا: استخدم التطبيق الأساسي" } }
    options:
      - id: note
        text: { en: "Keep Lite, with a note that bills are paid in the main app", ar: "نُبقي Lite، مع ملاحظة أن الفواتير تُدفع في التطبيق الأساسي" }
      - id: main
        text: { en: "Make the main app work with screen readers", ar: "نجعل التطبيق الأساسي يعمل مع قارئ الشاشة" }
      - id: rare
        text: { en: "Keep Lite as it is; few people pay bills in the app", ar: "نُبقي Lite كما هو؛ فقليلون يدفعون الفواتير في التطبيق" }
    answer: [main]
    misconceptions:
      - id: MC-P05-003
        when: [note, rare]
        feedback:
          en: "Screen reader users get fewer features than everyone else, and the note sends them to the app that doesn't work for them. Equal means the same features."
          ar: "مستخدمو قارئ الشاشة يحصلون على ميزات أقل من غيرهم، والملاحظة ترسلهم إلى التطبيق الذي لا يعمل معهم. والمساواة تعني نفس الميزات."
    correct:
      en: "Right. One app, every feature, for everyone."
      ar: "صحيح. تطبيق واحد، بكل الميزات، للجميع."
    explain:
      en: "A separate version usually has less in it, and falls behind over time. Make the main app work with screen readers instead."
      ar: "النسخة المنفصلة غالبًا ميزاتها أقل، ولا تلحق بالتحديثات مع الوقت. فاجعل التطبيق الأساسي يعمل مع قارئ الشاشة بدلًا منها."

  - id: S02
    type: tune
    skill: SK-P05-U01-01
    part: retest
    speaker: mona
    value:
      en: "Re-test. Beyond Accessibility (NN/g): usability is also how easy and fast a task is, not only whether it's possible. A seat map that works with a magnifier but takes 12 minutes needs a faster route."
      ar: "إعادة اختبار. ما بعد الإتاحة (NN/g): سهولة الاستخدام تعني أيضًا سهولة المهمة وسرعتها، لا أنها ممكنة فقط. وخريطة المقاعد التي تعمل مع المكبّر لكنها تأخذ 12 دقيقة تحتاج طريقًا أسرع."
    ref: { url: "https://www.nngroup.com/articles/beyond-accessibility-treating-users-with-disabilities-as-people/", quote: "It is also a matter of how easy and fast it is for them to do so." }
    scenario:
      en: "My team designs a cinema app. Ziad sees very little, so he uses a screen magnifier: it shows a small part of the screen, very big. He can choose seats on our seat map, but it takes him 12 minutes. Others need about one minute."
      ar: "يصمّم فريقي تطبيقًا للسينما. زياد نظره ضعيف جدًا، فيستخدم مكبّر الشاشة (Screen magnifier): يعرض جزءًا صغيرًا من الشاشة بحجم كبير. يستطيع زياد اختيار المقاعد من خريطة المقاعد عندنا، لكن ذلك يأخذ منه 12 دقيقة، وغيره يحتاج نحو دقيقة."
    prompt:
      en: "Tap each option to see the change. Which one makes choosing seats quick for Ziad?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل اختيار المقاعد سريعًا لزياد؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: shasha
      appbar: { title: { en: "Pick 2 seats", ar: "اختر مقعدين" }, back: true }
      blocks: &seatnow
        - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
        - { kind: seatmap, rows: 10, cols: 18, aisle: 9, taken: [ [0,3], [0,4], [2,8], [2,9], [4,12], [6,2], [7,15] ], gap: s }
        - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
    options:
      - id: keep
        text: { en: "Change nothing; the map works with a magnifier", ar: "لا تغيّر شيئًا؛ فالخريطة تعمل مع المكبّر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick 2 seats", ar: "اختر مقعدين" }, back: true }
          blocks: *seatnow
      - id: help
        text: { en: "Add a help page on using the map with a magnifier", ar: "أضف صفحة مساعدة تشرح استخدام الخريطة مع المكبّر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick 2 seats", ar: "اختر مقعدين" }, back: true }
          blocks:
            - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
            - { kind: link, text: { en: "How to use the seat map with a magnifier", ar: "كيف تستخدم خريطة المقاعد مع المكبّر" }, gap: xs }
            - { kind: seatmap, rows: 10, cols: 18, aisle: 9, taken: [ [0,3], [0,4], [2,8], [2,9], [4,12], [6,2], [7,15] ], gap: s }
            - { kind: button, text: { en: "Continue", ar: "متابعة" }, gap: m }
      - id: best
        text: { en: "Add a \"Best 2 seats together\" button above the map, for everyone", ar: "أضف زر «أفضل مقعدين متجاورين» فوق الخريطة، للجميع" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: shasha
          appbar: { title: { en: "Pick 2 seats", ar: "اختر مقعدين" }, back: true }
          blocks:
            - { kind: title, text: { en: "Pick 2 seats", ar: "اختر مقعدين" } }
            - { kind: button, text: { en: "Best 2 seats together", ar: "أفضل مقعدين متجاورين" }, gap: s }
            - { kind: small, color: muted, text: { en: "or choose on the map", ar: "أو اختر من الخريطة" }, gap: s }
            - { kind: seatmap, rows: 10, cols: 18, aisle: 9, taken: [ [0,3], [0,4], [2,8], [2,9], [4,12], [6,2], [7,15] ], gap: xs }
    answer: [best]
    misconceptions:
      - id: MC-P05-002
        when: [keep, help]
        feedback:
          en: "Possible isn't the same as easy: Ziad still spends 12 minutes searching the map piece by piece. Give him, and everyone, a quick way."
          ar: "أن يستطيع زياد ذلك لا يعني أنه سهل: ما زال يقضي 12 دقيقة يبحث في الخريطة جزءًا جزءًا. أعطه، وأعطِ الجميع، طريقة سريعة."
    correct:
      en: "Right. A one-tap choice makes it fast for everyone."
      ar: "صحيح. الاختيار بضغطة واحدة يجعل الحجز سريعًا للجميع."
    explain:
      en: "Count how long disabled people take, not only whether they can do it. A quick way next to the map helps Ziad most, and saves others time too."
      ar: "لا تسأل فقط: هل يستطيع ذوو الإعاقة؟ بل اسأل: كم يأخذ منهم ذلك؟ والطريقة السريعة بجوار الخريطة تفيد زياد أكثر، وتوفّر وقت غيره أيضًا."

  # SK-P05-U01-02: test with real users and their own tools
  - id: S03
    type: choose
    skill: SK-P05-U01-02
    part: retest
    speaker: rami
    value:
      en: "Re-test. Accessibility Is Not Enough (NN/g): ask a few disabled people to try real tasks, using their own screen readers, magnifiers or other assistive technology. A designer with eyes closed isn't a screen reader user."
      ar: "إعادة اختبار. الإتاحة وحدها لا تكفي (NN/g): اطلب من بعض ذوي الإعاقة تجربة مهام حقيقية، بقارئ الشاشة أو المكبّر أو الأدوات المساعدة الخاصة بهم. والمصمم المغمض العينين ليس مستخدمًا لقارئ الشاشة."
    ref: { url: "https://www.nngroup.com/articles/accessibility-is-not-enough/", quote: "It's important that these employees use their own screen readers, screen magnifiers, keyguards, or mouse replacements" }
    scenario:
      en: "I want to test our food delivery app with screen readers. My plan: turn on the screen reader on my phone, close my eyes, and order a meal."
      ar: "أريد أن أختبر تطبيق توصيل الطعام عندنا مع قارئ الشاشة. وخطتي: أشغّل قارئ الشاشة في هاتفي، وأغمض عينيّ، وأطلب وجبة."
    prompt:
      en: "Which test will show what really stops screen reader users?"
      ar: "أي اختبار سيكشف ما يوقف مستخدمي قارئ الشاشة فعلًا؟"
    mock:
      app: mudawwana
      appbar: { title: { en: "Screen reader test plan", ar: "خطة اختبار قارئ الشاشة" }, back: true }
      blocks:
        - { kind: heading, text: { en: "Food delivery app · order a meal", ar: "تطبيق توصيل الطعام · اطلب وجبة" } }
        - { kind: list, style: number, gap: s, items: [ { en: "Turn on the screen reader on my phone", ar: "أشغّل قارئ الشاشة على هاتفي" }, { en: "Close my eyes", ar: "أغمض عينيّ" }, { en: "Order a meal and note where I get stuck", ar: "أطلب وجبة وأكتب أين أتوقّف" } ] }
    options:
      - id: me
        text: { en: "My plan is enough to find the problems", ar: "خطتي تكفي لاكتشاف المشكلات" }
      - id: two
        text: { en: "Try it myself, then ask a colleague to do the same", ar: "أجرّبه بنفسي، ثم أطلب من زميل أن يفعل نفس الشيء" }
      - id: users
        text: { en: "Ask 4 or 5 people who use screen readers every day to order on their own phones", ar: "أطلب من 4 أو 5 أشخاص يستخدمون قارئ الشاشة كل يوم أن يطلبوا من هواتفهم" }
    answer: [users]
    misconceptions:
      - id: MC-P05-005
        when: [me, two]
        feedback:
          en: "Someone new to screen readers gets stuck on the screen reader itself. Daily users, on their own phones, show what in our app stops them."
          ar: "من يجرّب قارئ الشاشة لأول مرة يتعثّر في القارئ نفسه. أما من يستخدمونه كل يوم، على هواتفهم، فيكشفون ما يوقفهم في تطبيقنا."
    correct:
      en: "Right. Real users, their own tools."
      ar: "صحيح. مستخدمون حقيقيون، بأدواتهم."
    explain:
      en: "Trying it yourself is a quick first look, not proof. People who use these tools every day, on their own phones, show the real problems."
      ar: "تجربتك بنفسك نظرة أولى سريعة، لا دليل. أما من يستخدمون هذه الأدوات كل يوم، على هواتفهم، فيكشفون المشكلات الحقيقية."

  - id: S04
    type: choose
    skill: SK-P05-U01-02
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Challenges for Screen-Reader Users on Mobile (NN/g): not one screen reader user opened the accessibility menus on their own. A toolbar subscription doesn't replace testing with customers and fixing the structure."
      ar: "إعادة اختبار. تحديات مستخدمي قارئ الشاشة على الهاتف (NN/g): لم يفتح أي مستخدم لقارئ الشاشة قوائم الأدوات من نفسه. والاشتراك في شريط أدوات لا يغني عن الاختبار مع العملاء وإصلاح الشاشات نفسها."
    ref: { url: "https://www.nngroup.com/articles/screen-reader-users-on-mobile/", quote: "not one user opened the menus of their own accord" }
    scenario:
      en: "A company offers my online shop an accessibility toolbar for 300 EGP a month. They say it \"makes your site work for people with disabilities in one click\"."
      ar: "عرضت عليّ شركة شريط أدوات للـ Accessibility (مناسبة الموقع لذوي الإعاقة) لمتجري الإلكتروني، مقابل 300 جنيه في الشهر. وتقول إنه «يجعل موقعك مناسبًا لذوي الإعاقة بضغطة واحدة»."
    prompt:
      en: "What should I do so blind customers can really shop in my store?"
      ar: "ماذا أفعل ليستطيع العملاء المكفوفون الشراء فعلًا من متجري؟"
    mock:
      app: dar
      frame: wide
      navbar: { links: [ { en: "Kitchen", ar: "المطبخ" }, { en: "TVs", ar: "التلفزيونات" }, { en: "Offers", ar: "العروض" } ], actions: [ { icon: shopping-cart } ] }
      blocks:
        - { kind: title, text: { en: "Kitchen appliances", ar: "أجهزة المطبخ" } }
        - kind: row
          gap: s
          blocks:
            - { kind: card, art: fridge, blocks: [ { kind: small, text: { en: "Fridge 16 ft", ar: "ثلاجة 16 قدم" } }, { kind: price, text: { en: "EGP 21,500", ar: "21,500 جنيه" } } ] }
            - { kind: card, art: washing-machine, blocks: [ { kind: small, text: { en: "Washer 8 kg", ar: "غسالة 8 كجم" } }, { kind: price, text: { en: "EGP 14,900", ar: "14,900 جنيه" } } ] }
      fab: { icon: wheelchair, text: { en: "Accessibility toolbar · EGP 300/month", ar: "شريط Accessibility · 300 جنيه شهريًا" } }
    options:
      - id: test
        text: { en: "Watch a few blind customers shop on their own phones, and fix where they get stuck", ar: "أراقب بعض العملاء المكفوفين وهم يشترون من هواتفهم، وأُصلح ما يتعثّرون فيه" }
      - id: buy
        text: { en: "Subscribe; the toolbar fixes the shop", ar: "أشترك؛ فالشريط يُصلح المتجر" }
      - id: both
        text: { en: "Subscribe, and add a page saying the shop works for everyone", ar: "أشترك، وأضيف صفحة تقول إن المتجر يناسب الجميع" }
    answer: [test]
    misconceptions:
      - id: MC-P05-004
        when: [buy, both]
        feedback:
          en: "Blind customers already have a screen reader on their phone, and they usually don't use these toolbars. The toolbar doesn't change the order or names in the shop, so the problems stay."
          ar: "العملاء المكفوفون عندهم قارئ شاشة في هواتفهم، وغالبًا لا يستخدمون هذه الأشرطة. والشريط لا يغيّر ترتيب المتجر ولا أسماء العناصر، فتبقى المشكلات."
    correct:
      en: "Right. Watch real customers, and fix the shop itself."
      ar: "صحيح. راقب عملاء حقيقيين، وأصلح المتجر نفسه."
    explain:
      en: "Most problems are in how the screens are built. Real customers show you where they are. A toolbar on top doesn't remove them."
      ar: "أغلب المشكلات في طريقة بناء الشاشات. والعملاء الحقيقيون يُرونك مكانها. والشريط الذي يوضع فوق الشاشة لا يُزيلها."

  # SK-P05-U01-03: let people jump straight to what they want
  - id: S05
    type: tune
    skill: SK-P05-U01-03
    part: retest
    speaker: hana
    value:
      en: "Re-test. Direct vs. sequential access (NN/g): carousels are fine only for short lists people can finish in 3–4 steps. Ten stories, one at a time, should become several at once with titled links."
      ar: "إعادة اختبار. الوصول المباشر مقابل المتسلسل (NN/g): الـ Carousel مقبول فقط للقوائم القصيرة التي يُنهيها الناس في 3 إلى 4 خطوات. وعشر قصص، واحدة في كل مرة، يجب أن تصبح عدة قصص معًا بروابط لها أسماء."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "carousels are ok only for short lists" }
    scenario:
      en: "My gym's website shows 10 member stories in a slider, one at a time. Each story is about a different goal: losing weight, back pain, running a race…"
      ar: "موقع النادي الرياضي الذي أملكه يعرض 10 قصص لأعضاء في Slider (شرائح تتبدّل)، قصة واحدة في كل مرة. وكل قصة عن هدف مختلف: إنقاص الوزن، آلام الظهر، الجري في سباق…"
    prompt:
      en: "Tap each option to see the change. Which one gets a visitor with back pain to the back pain story fastest?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يُوصل زائرًا يعاني آلام الظهر إلى قصة آلام الظهر بأسرع شكل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: nashat
      frame: wide
      url: nashat.example/stories
      blocks: &storiesnow
        - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
        - { kind: image, art: woman-1, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: خسرت 12 كيلو" }, gap: s }
        - kind: row
          gap: xs
          blocks:
            - { kind: meta, text: { en: "1 / 10", ar: "1 من 10" } }
            - { kind: button, style: plain, text: { en: "Next ›", ar: "التالي ‹" } }
    options:
      - id: arrows
        text: { en: "Add bigger arrows on both sides", ar: "أضف أسهمًا أكبر على الجانبين" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nashat
          frame: wide
          url: nashat.example/stories
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - kind: row
              gap: s
              blocks:
                - { kind: title, text: "‹" }
                - { kind: image, art: woman-1, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: خسرت 12 كيلو" } }
                - { kind: title, text: "›" }
      - id: several
        text: { en: "Show 3 stories at once, named by goal, with a link to all 10", ar: "اعرض 3 قصص معًا، كل قصة باسم هدفها، مع رابط للقصص العشر" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nashat
          frame: wide
          url: nashat.example/stories
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - { kind: link, text: { en: "Weight loss: Salma lost 12 kg", ar: "إنقاص الوزن: سلمى خسرت 12 كيلو" }, gap: xs }
            - { kind: link, text: { en: "Back pain: Magdy trains pain-free", ar: "آلام الظهر: مجدي يتمرّن دون ألم" }, gap: xs }
            - { kind: link, text: { en: "Running: Dina finished her first 10 km", ar: "الجري: دينا أنهت أول 10 كيلومترات" }, gap: xs }
            - { kind: link, text: { en: "All 10 stories by goal", ar: "القصص العشر حسب الهدف" }, gap: s }
      - id: auto
        text: { en: "Make the slider move by itself every 5 seconds", ar: "اجعل الـ Slider يتحرّك وحده كل 5 ثوانٍ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: nashat
          frame: wide
          url: nashat.example/stories
          blocks:
            - { kind: heading, text: { en: "Member stories", ar: "قصص الأعضاء" } }
            - { kind: image, art: woman-1, size: s, text: { en: "Salma: lost 12 kg", ar: "سلمى: خسرت 12 كيلو" }, gap: s }
            - { kind: meta, text: { en: "1 / 10 · next in 5 s", ar: "1 من 10 · التالي بعد 5 ثوانٍ" }, gap: xs }
    answer: [several]
    misconceptions:
      - id: MC-P05-006
        when: [arrows, auto]
        feedback:
          en: "It's still one story at a time: someone with back pain may go through up to 9 stories to find theirs. Ten is too many for a slider."
          ar: "ما زالت قصة واحدة في كل مرة: قد يمرّ من يعاني آلام الظهر على 9 قصص ليجد قصته. وعشر قصص كثيرة على Slider واحد."
    correct:
      en: "Right. Show several, and link to the rest."
      ar: "صحيح. اعرض عدة قصص، وضع رابطًا للباقي."
    explain:
      en: "Links named by goal let people jump to the story that fits them, whether they listen with a screen reader or look with their eyes."
      ar: "حين يحمل كل رابط اسم الهدف، يصل الناس مباشرة إلى القصة التي تناسبهم، سواء استمعوا بقارئ الشاشة أو قرأوا بأعينهم."

  - id: S06
    type: tune
    skill: SK-P05-U01-03
    part: retest
    speaker: karim
    value:
      en: "Re-test. Direct vs. sequential access (NN/g): video is the most sequential medium. If you provide a video, also give a transcript or a detailed text summary people can scan."
      ar: "إعادة اختبار. الوصول المباشر مقابل المتسلسل (NN/g): الفيديو أكثر وسيلة تُتابَع بالترتيب. وإذا قدّمت فيديو، فقدّم أيضًا كلامه مكتوبًا أو ملخصًا مكتوبًا مفصّلًا يبحث فيه الناس."
    ref: { url: "https://www.nngroup.com/articles/direct-vs-sequential-access/", quote: "If you provide a video, make sure that you also provide, if not a transcription, at least a detailed text summary" }
    scenario:
      en: "In the cooking app I'm building, each recipe is only a 6-minute video. While cooking, people often need just one thing, like how much of one ingredient to add."
      ar: "في تطبيق الطبخ الذي أبنيه، كل وصفة هي فيديو مدته 6 دقائق فقط. وأثناء الطبخ، يحتاج الناس غالبًا شيئًا واحدًا، مثل كمية مكوّن واحد."
    prompt:
      en: "Which change lets people find one ingredient's amount straight away?"
      ar: "أي تغيير يجعل الناس يجدون كمية مكوّن واحد فورًا؟"
    mock:
      app: tabkha
      appbar:
        title: {en: Recipe, ar: الوصفة}
        back: true
      blocks:
      - kind: title
        text: {en: Molokhia with chicken, ar: ملوخية بالفراخ}
      - kind: image
        art: food-grill
        size: m
        text:
          en: "▶ Video · 6:00"
          ar: "▶ فيديو · 6:00"
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: replay
        text: { en: "Add a \"Back 10 seconds\" button to the video", ar: "أضف زر «رجوع 10 ثوانٍ» إلى الفيديو" }
        mock:
          app: tabkha
          appbar:
            title: {en: Recipe, ar: الوصفة}
            back: true
          blocks:
          - kind: title
            text: {en: Molokhia with chicken, ar: ملوخية بالفراخ}
          - kind: image
            art: food-grill
            size: m
            text:
              en: "▶ Video · 6:00"
              ar: "▶ فيديو · 6:00"
            gap: s
          - kind: button
            text: {en: Back 10 seconds, ar: رجوع 10 ثوانٍ}
            icon: arrow-counter-clockwise
            style: outline
            gap: xs
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: autoplay
        text: { en: "Make the video start as soon as the recipe opens", ar: "اجعل الفيديو يبدأ فور فتح الوصفة" }
        mock:
          app: tabkha
          appbar:
            title: {en: Recipe, ar: الوصفة}
            back: true
          blocks:
          - kind: title
            text: {en: Molokhia with chicken, ar: ملوخية بالفراخ}
          - kind: image
            art: food-grill
            size: m
            text:
              en: "❚❚ Playing · 0:03"
              ar: "❚❚ يعمل · 0:03"
            gap: s
            note: {en: Starts as soon as the recipe opens, ar: يبدأ فور فتح الوصفة}
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: text
        text: { en: "Add the ingredients and steps as text under the video", ar: "أضف المكوّنات والخطوات مكتوبة تحت الفيديو" }
        mock:
          app: tabkha
          appbar:
            title: {en: Recipe, ar: الوصفة}
            back: true
          blocks:
          - kind: title
            text: {en: Molokhia with chicken, ar: ملوخية بالفراخ}
          - kind: image
            art: food-grill
            size: m
            text:
              en: "▶ Video · 6:00"
              ar: "▶ فيديو · 6:00"
            gap: s
          - kind: heading
            text: {en: Ingredients, ar: المكوّنات}
            gap: m
          - kind: list
            style: bullet
            gap: xs
            items:
            - en: "Molokhia: 500 g"
              ar: "ملوخية: 500 جم"
            - en: "Chicken: 1 whole"
              ar: "فرخة: واحدة كاملة"
            - en: "Garlic: 6 cloves"
              ar: "ثوم: 6 فصوص"
            - en: "Ground coriander: 1 tbsp"
              ar: "كزبرة مطحونة: ملعقة كبيرة"
          - kind: heading
            text: {en: Steps, ar: الخطوات}
            gap: m
          - kind: list
            style: number
            gap: xs
            items:
            - {en: Boil the chicken for 40 minutes., ar: اسلق الفرخة 40 دقيقة.}
            - {en: Add the molokhia to the stock and stir., ar: أضف الملوخية إلى المرق وقلّب.}
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [text]
    misconceptions:
      - id: MC-P05-006
        when: [replay, autoplay]
        feedback:
          en: "Both keep people inside the video, watching it in order. Text lets anyone, including screen reader users, jump straight to the ingredient."
          ar: "الخياران يُبقيان الناس داخل الفيديو، يشاهدونه بالترتيب. أما النص فيوصل أي شخص، ومنهم مستخدمو قارئ الشاشة، إلى المكوّن مباشرة."
    correct:
      en: "Right. You can jump through text; you can't do that in a video."
      ar: "صحيح. في النص تصل إلى ما تريد مباشرة؛ وفي الفيديو لا."
    explain:
      en: "Keep the video, and put the recipe in text next to it, so people can jump to the line they need."
      ar: "أبقِ الفيديو، وضع الوصفة مكتوبة بجواره، ليصل الناس مباشرة إلى السطر الذي يحتاجونه."

  # SK-P05-U01-04: accept input the way people type it
  - id: S07
    type: tune
    skill: SK-P05-U01-04
    part: retest
    speaker: mona
    value:
      en: "Re-test. Usability for Older Adults (NN/g): users were punished for typing hyphens or parentheses in phone and credit-card numbers. Accept the spaces printed on the card and remove them in code."
      ar: "إعادة اختبار. قابلية الاستخدام لكبار السن (NN/g): رُفضت أرقام الهاتف والبطاقات لأن أصحابها كتبوها بشرطات أو أقواس. اقبل المسافات المطبوعة على البطاقة واحذفها في الكود."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "punished for entering hyphens or parentheses in telephone or credit-card numbers" }
    scenario:
      en: "In the payment page my team designs, Mr. Sami typed his card number with spaces, the way it's printed on his bank card. The box says it's wrong."
      ar: "في صفحة الدفع التي يصمّمها فريقي، كتب الأستاذ سامي رقم بطاقته البنكية بمسافات، كما هو مطبوع عليها. فظهرت رسالة تقول إن الرقم خطأ."
    prompt:
      en: "Tap each option to see the change. Which one lets Mr. Sami pay with the number as he typed it?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يسمح للأستاذ سامي بالدفع بالرقم كما كتبه؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: lamha
      appbar: { title: { en: "Payment", ar: "الدفع" }, back: true }
      blocks:
        - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Invalid card number", ar: "رقم البطاقة غير صحيح" } }
    options:
      - id: hint
        text: { en: "Add a hint above the box: \"No spaces\"", ar: "أضف تلميحًا فوق المربع: «بدون مسافات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamha
          appbar: { title: { en: "Payment", ar: "الدفع" }, back: true }
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, hintFirst: true, hint: { en: "No spaces", ar: "بدون مسافات" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Invalid card number", ar: "رقم البطاقة غير صحيح" } }
      - id: accept
        text: { en: "Accept the spaces, and let the app remove them", ar: "اقبل المسافات، واجعل التطبيق يحذفها بنفسه" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamha
          appbar: { title: { en: "Payment", ar: "الدفع" }, back: true }
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111" }
            - { kind: small, color: green, text: { en: "✓ Visa", ar: "✓ Visa" }, gap: xs }
      - id: message
        text: { en: "Change the error to \"Please remove the spaces\"", ar: "غيّر رسالة الخطأ إلى «من فضلك احذف المسافات»" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: lamha
          appbar: { title: { en: "Payment", ar: "الدفع" }, back: true }
          blocks:
            - { kind: field, label: { en: "Card number", ar: "رقم البطاقة" }, filled: true, text: "4111 1111 1111 1111", tone: bad, error: { en: "Please remove the spaces", ar: "من فضلك احذف المسافات" } }
    answer: [accept]
    misconceptions:
      - id: MC-P05-009
        when: [hint, message]
        feedback:
          en: "The card number is right; the spaces just copy how the card looks. A hint or a kinder message still makes Mr. Sami do work the code can do."
          ar: "رقم البطاقة صحيح؛ والمسافات مجرد شكله على البطاقة. والتلميح أو الرسالة الألطف ما زالا يُحمّلان الأستاذ سامي عملًا يستطيع الكود فعله."
    correct:
      en: "Right. Accept it as he typed it."
      ar: "صحيح. اقبله كما كتبه."
    explain:
      en: "People copy numbers the way they see them. Accept spaces and dashes, and clean them up in the code."
      ar: "الناس ينقلون الأرقام كما يرونها. فاقبل المسافات والشرطات، ونظّفها في الكود."

  - id: S08
    type: tune
    skill: SK-P05-U01-04
    part: retest
    speaker: sara
    value:
      en: "Re-test. Usability for Older Adults (NN/g): interfaces are often inflexible and unforgiving of errors; a participant asked why she couldn't just type the time. A typed time box replaces the fiddly wheel."
      ar: "إعادة اختبار. قابلية الاستخدام لكبار السن (NN/g): الواجهات كثيرًا ما تكون جامدة ولا تسامح الأخطاء؛ وسألت مشاركة: لماذا لا أكتب الوقت ببساطة؟ ومربع كتابة الوقت يحلّ محلّ العجلة الصعبة."
    ref: { url: "https://www.nngroup.com/articles/usability-for-senior-citizens/", quote: "Interfaces in websites and apps are often inflexible and unforgiving of errors." }
    scenario:
      en: "I'm designing an app that reminds people to take their medicine. Uncle Mahmoud, 70, wants a reminder at 8:15. The wheel moves one minute with each small move. He keeps stopping at 8:13 or 8:17."
      ar: "أصمّم تطبيقًا يذكّر الناس بمواعيد الدواء. عمّ محمود، 70 سنة، يريد تذكيرًا الساعة 8:15. وعجلة اختيار الوقت (Time picker) تتحرّك دقيقة مع كل حركة صغيرة، فيقف كل مرة على 8:13 أو 8:17."
    prompt:
      en: "Tap each option to see the change. Which one lets Uncle Mahmoud set 8:15 most easily?"
      ar: "اضغط على كل خيار لترى التغيير. أي خيار يجعل عمّ محمود يضبط 8:15 بأسهل شكل؟"
    mock:
      caption: { en: "Now", ar: "الآن" }
      app: dawaa
      appbar: { title: { en: "New reminder", ar: "تذكير جديد" }, back: true }
      blocks: &medwheel
        - { kind: small, weight: bold, text: { en: "Remind me at", ar: "ذكّرني الساعة" } }
        - kind: group
          tone: plain
          gap: xs
          blocks:
            - { kind: small, color: faint, text: "8:12" }
            - { kind: text, weight: bold, text: "8:13" }
            - { kind: small, color: faint, text: "8:14" }
    options:
      - id: type
        text: { en: "A box where he can type 8:15", ar: "مربع يكتب فيه 8:15" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dawaa
          appbar: { title: { en: "New reminder", ar: "تذكير جديد" }, back: true }
          blocks:
            - { kind: field, label: { en: "Remind me at", ar: "ذكّرني الساعة" }, filled: true, text: "8:15", hint: { en: "For example 8:15", ar: "مثلًا 8:15" } }
      - id: buzz
        text: { en: "Keep the wheel, and make the phone vibrate at each minute", ar: "أبقِ العجلة، واجعل الهاتف يهتز مع كل دقيقة" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dawaa
          appbar: { title: { en: "New reminder", ar: "تذكير جديد" }, back: true }
          blocks:
            - { kind: small, weight: bold, text: { en: "Remind me at", ar: "ذكّرني الساعة" } }
            - kind: group
              tone: plain
              gap: xs
              blocks:
                - { kind: small, color: faint, text: "8:12" }
                - { kind: text, weight: bold, text: "8:13" }
                - { kind: small, color: faint, text: "8:14" }
            - { kind: small, color: muted, text: { en: "📳 Vibrates at each minute", ar: "📳 يهتز مع كل دقيقة" }, gap: xs }
      - id: keep
        text: { en: "Keep the wheel; it never gives a wrong time", ar: "أبقِ العجلة؛ فهي لا تسمح بوقت خطأ" }
        mock:
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          app: dawaa
          appbar: { title: { en: "New reminder", ar: "تذكير جديد" }, back: true }
          blocks: *medwheel
    answer: [type]
    misconceptions:
      - id: MC-P05-010
        when: [buzz, keep]
        feedback:
          en: "The wheel still needs a steady finger to stop at one exact minute. Uncle Mahmoud knows the time he wants; let him type it."
          ar: "ما زالت العجلة تحتاج إصبعًا ثابتًا لتقف عند دقيقة بعينها. وعمّ محمود يعرف الوقت الذي يريده؛ فدعه يكتبه."
    correct:
      en: "Right. Let him type the time."
      ar: "صحيح. دعه يكتب الوقت."
    explain:
      en: "When people know the exact value, typing it is better than a control that needs a steady hand."
      ar: "حين يعرف الناس القيمة بالضبط، تكون كتابتها أفضل من عنصر يحتاج يدًا ثابتة."

  # SK-P05-U01-05: let people change text size and theme
  - id: S09
    type: tune
    skill: SK-P05-U01-05
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Inclusive Design (NN/g): to make reading screens more inclusive, offer a button for users to increase the font size. Removing it because few people tap it removes it from the people who need it most."
      ar: "إعادة اختبار. التصميم الشامل (NN/g): لتناسب شاشات القراءة عددًا أكبر من الناس، أضف زرًا يسمح بتكبير الخط. وحذفه لأن قليلين يضغطونه يأخذه من أكثر الناس حاجة إليه."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "offer a button for users to increase the font size" }
    scenario:
      en: "In our news app, only 6% of readers use the \"A A\" button that makes article text bigger. The designers want to remove it, so the top of the article looks cleaner."
      ar: "في تطبيق الأخبار عندنا، 6% فقط من القرّاء يستخدمون زر «A A» الذي يكبّر نص المقال. والمصممون يريدون حذفه، ليبدو أعلى المقال أنظف."
    prompt:
      en: "What should we do with the button, so readers who need bigger text can still read?"
      ar: "ماذا نفعل بالزر، حتى يستطيع من يحتاج خطًا أكبر أن يقرأ؟"
    mock:
      app: mirsad
      appbar:
        logo: true
        actions:
        - icon: bookmark-simple
          aria: {en: Save, ar: حفظ}
      blocks:
      - kind: row
        blocks:
        - kind: meta
          text: {en: Economy · 5 min read, ar: اقتصاد · 5 دقائق قراءة}
        - {kind: chip, text: A A}
      - kind: title
        text: {en: Bread prices stay the same this month, ar: أسعار الخبز ثابتة هذا الشهر}
        gap: s
      caption: {en: Now, ar: الآن}
    options:
      - id: keep
        text: { en: "Keep it on article screens", ar: "نُبقيه في شاشات المقالات" }
        mock:
          app: mirsad
          appbar:
            logo: true
            actions:
            - icon: bookmark-simple
              aria: {en: Save, ar: حفظ}
          blocks:
          - kind: row
            blocks:
            - kind: meta
              text: {en: Economy · 5 min read, ar: اقتصاد · 5 دقائق قراءة}
            - {kind: chip, text: A A}
          - kind: title
            text: {en: Bread prices stay the same this month, ar: أسعار الخبز ثابتة هذا الشهر}
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: remove
        text: { en: "Remove it; 6% is too few people", ar: "نحذفه؛ فـ 6% عدد قليل" }
        mock:
          app: mirsad
          appbar:
            logo: true
            actions:
            - icon: bookmark-simple
              aria: {en: Save, ar: حفظ}
          blocks:
          - kind: row
            blocks:
            - kind: meta
              text: {en: Economy · 5 min read, ar: اقتصاد · 5 دقائق قراءة}
          - kind: title
            text: {en: Bread prices stay the same this month, ar: أسعار الخبز ثابتة هذا الشهر}
            gap: s
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: bury
        text: { en: "Move it to Settings › Display › Advanced", ar: "ننقله إلى الإعدادات › العرض › متقدّم" }
        mock:
          app: mirsad
          appbar:
            title: {en: Advanced, ar: متقدّم}
            back: true
          blocks:
          - kind: small
            text: {en: Settings › Display › Advanced, ar: الإعدادات › العرض › متقدّم}
            color: muted
          - kind: listitem
            text: {en: Text size, ar: حجم النص}
            icon: text-aa
            chevron: true
            gap: s
          - kind: listitem
            text: {en: Data saver, ar: توفير البيانات}
            icon: cell-signal-low
            toggle: false
          - kind: listitem
            text: {en: Clear cache, ar: مسح الذاكرة المؤقتة}
            icon: trash
            chevron: true
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [keep]
    misconceptions:
      - id: MC-P05-012
        when: [remove, bury]
        feedback:
          en: "The 6% are probably the readers who can't read the normal size. Removing or hiding the button takes away exactly what they need, right where they read."
          ar: "الـ 6% غالبًا هم القرّاء الذين لا يستطيعون قراءة الحجم العادي. وحذف الزر أو إخفاؤه يأخذ منهم ما يحتاجونه بالضبط، في مكان القراءة نفسه."
    correct:
      en: "Right. Keep it where people read."
      ar: "صحيح. أبقِه حيث يقرأ الناس."
    explain:
      en: "A small number of users may be the ones who can't read without it. Keep a bigger-text button on long reading screens."
      ar: "قد يكون هذا العدد الصغير هم من لا يستطيعون القراءة بدونه. فأبقِ زر تكبير الخط في شاشات القراءة الطويلة."

  - id: S10
    type: compare
    skill: SK-P05-U01-05
    part: retest
    speaker: rami
    value:
      en: "Re-test. Inclusive Design (NN/g): consider a dark-mode option without enforcing it, and use the dark-mode settings phones already offer. A dark-only redesign locks out people who read better on light screens."
      ar: "إعادة اختبار. التصميم الشامل (NN/g): فكّر في خيار للوضع الداكن دون فرضه، واستفد من إعداد الوضع الداكن الموجود في الهواتف. والتصميم الداكن فقط يُتعب من يقرؤون أفضل على الشاشات الفاتحة."
    ref: { url: "https://www.nngroup.com/articles/inclusive-design/", quote: "take advantage of any dark-mode APIs that various operating systems may offer" }
    scenario:
      en: "We're redesigning a banking app. Some customers read better on dark screens, and others on light ones. I have two ideas for the colours."
      ar: "نعيد تصميم تطبيق بنك. بعض العملاء يقرؤون أفضل على الشاشات الداكنة، وآخرون على الفاتحة. وعندي فكرتان للألوان."
    prompt:
      en: "Which idea works for both groups of customers?"
      ar: "أي فكرة تناسب المجموعتين من العملاء؟"
    a:
      label: { en: "A: Follow the phone's setting, and let people change it", ar: "A: نتبع إعداد الهاتف، ونسمح للناس بتغييره" }
      mock:
        app: rasid
        appbar: { title: { en: "Display", ar: "العرض" }, back: true }
        blocks:
          - { kind: small, weight: bold, text: { en: "Theme", ar: "المظهر" } }
          - { kind: small, text: { en: "Follows your phone's light or dark setting. You can change it here.", ar: "يتبع الوضع الفاتح أو الداكن المختار في هاتفك. ويمكنك تغييره من هنا." }, gap: xs }
          - { kind: segmented, options: [ { en: "Light", ar: "فاتح" }, { en: "Dark", ar: "داكن" }, { en: "Like my phone", ar: "حسب الهاتف" } ], value: 2, gap: s }
    b:
      label: { en: "B: Make the app dark only, to match our brand", ar: "B: نجعل التطبيق داكنًا فقط، ليناسب هوية البنك" }
      mock:
        app: rasid
        theme: dark
        appbar: { logo: true }
        blocks:
          - { kind: banner, tone: info, icon: moon, text: { en: "Our new look is dark only, to match our brand.", ar: "شكلنا الجديد داكن فقط، ليناسب هوية البنك." } }
          - kind: card
            gap: m
            blocks:
              - { kind: small, text: { en: "Current account", ar: "الحساب الجاري" } }
              - { kind: price, size: l, text: { en: "EGP 12,400", ar: "12,400 جنيه" } }
    answer: a
    misconceptions:
      - id: MC-P05-013
        when: [b]
        feedback:
          en: "Dark helps some eyes and tires others. Dark-only shuts out customers who read better on light screens, and ignores the setting they chose on their phone."
          ar: "الداكن يساعد بعض العيون ويُتعب غيرها. والداكن فقط يُتعب العملاء الذين يقرؤون أفضل على الشاشات الفاتحة، ويتجاهل الإعداد الذي اختاروه في هواتفهم."
    correct:
      en: "Right. Follow the phone, and let people choose."
      ar: "صحيح. اتبع إعداد الهاتف، ودع الناس يختارون."
    explain:
      en: "Start from the person's phone setting, and let them switch. Offer dark mode; don't force it."
      ar: "ابدأ من إعداد هاتف الشخص، ودعه يغيّره. اعرض الوضع الداكن (Dark mode) كاختيار، ولا تفرضه."
