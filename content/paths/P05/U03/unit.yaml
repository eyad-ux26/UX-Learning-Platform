id: P05-U03
free: false
title:
  en: "Keyboard and focus"
  ar: "لوحة المفاتيح والتركيز"
skill:
  en: "Make a site work for people who use only the keyboard: test it, show where they are, and let them skip and reach everything."
  ar: "اجعل الموقع يعمل لمن يستخدمون لوحة المفاتيح فقط: اختبره، وأظهر لهم أين هم، ودعهم يتخطّون القوائم ويصلون إلى كل شيء."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P05-U03-01
    title: { en: "Test it with the keyboard", ar: "اختبره بلوحة المفاتيح" }
    can_do: { en: "Put the mouse away and do the main task with Tab and Enter, checking you can see where you are, reach everything, and move in page order.", ar: "ابعد الماوس وأنجز المهمة الأساسية بـ Tab وEnter، وتأكّد أنك ترى أين أنت، وتصل إلى كل شيء، وتتحرّك بترتيب الصفحة." }
  - id: SK-P05-U03-02
    title: { en: "Restyle focus, never remove it", ar: "غيّر شكل التركيز، ولا تحذفه أبدًا" }
    can_do: { en: "Replace the default focus with a clear outline that fits the brand and shows on every background, not a colour change alone.", ar: "استبدل التركيز الافتراضي بإطار واضح يناسب الهوية ويظهر على كل خلفية، لا بتغيير اللون وحده." }
  - id: SK-P05-U03-03
    title: { en: "Let people skip long menus", ar: "دع الناس يتخطّون القوائم الطويلة" }
    can_do: { en: "Add a \"Skip to main content\" link that appears when tabbing and lands on the main heading.", ar: "أضف رابط «انتقل إلى المحتوى الرئيسي» يظهر عند الضغط على Tab، ويُوصل إلى العنوان الرئيسي." }
  - id: SK-P05-U03-04
    title: { en: "Make dropdowns work with keys", ar: "اجعل القوائم المنسدلة تعمل بالمفاتيح" }
    can_do: { en: "Let arrow keys move through options without picking, Enter pick, and a typed letter jump to matching options.", ar: "اجعل الأسهم تتنقّل بين الخيارات دون اختيار، وEnter يختار، والحرف المكتوب يقفز إلى الخيارات التي تبدأ به." }
  - id: SK-P05-U03-05
    title: { en: "Don't hide controls behind hover", ar: "لا تُخفِ العناصر خلف مرور الماوس" }
    can_do: { en: "Give hover menus and carousel controls a keyboard way in, like a clickable top-level page or buttons Tab can reach.", ar: "أعطِ قوائم الـ Hover وأزرار الـ Carousel طريقًا بلوحة المفاتيح، مثل صفحة رئيسية قابلة للضغط أو أزرار يصل إليها Tab." }
