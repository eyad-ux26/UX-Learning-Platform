id: P15-U03
free: false
title:
  en: "Pick the right tone"
  ar: "اختر النبرة المناسبة"
skill:
  en: "Hear the tone of a text, fit it to how people feel in the moment, stay serious without sounding cold, and keep one voice while the tone changes."
  ar: "اسمع نبرة النص، واجعلها تناسب شعور الناس في اللحظة، وكن جادًا دون أن تبدو باردًا، وحافظ على صوت واحد بينما تتغيّر النبرة."
skills:
  - id: SK-P15-U03-01
    title: { en: "Hear the tone", ar: "اسمع النبرة" }
    can_do: { en: "Place a text on the 4 tone scales (formal or casual, serious or funny, respectful or irreverent, matter-of-fact or enthusiastic) and change one without the others.", ar: "حدّد مكان النص على مقاييس النبرة الأربعة (رسمي أو ودّي، جاد أو مضحك، محترم أو ساخر، محايد أو متحمّس)، وغيّر واحدًا منها دون الباقي." }
  - id: SK-P15-U03-02
    title: { en: "Fit the tone to the moment", ar: "اجعل النبرة تناسب اللحظة" }
    can_do: { en: "Choose a tone that fits how people feel right now: calm and clear when they are worried or frustrated, warmer when the news is good.", ar: "اختر نبرة تناسب شعور الناس الآن: هادئة وواضحة حين يكونون قلقين أو منزعجين، وأكثر دفئًا حين يكون الخبر سعيدًا." }
  - id: SK-P15-U03-03
    title: { en: "Be serious without being cold", ar: "كن جادًا دون أن تكون باردًا" }
    can_do: { en: "Write about money, health and safety in plain, friendly words, without jokes that cost trust.", ar: "اكتب عن المال والصحة والأمان بكلمات بسيطة وودّية، دون نكات تُفقدك الثقة." }
  - id: SK-P15-U03-04
    title: { en: "One voice, many tones", ar: "صوت واحد ونبرات كثيرة" }
    can_do: { en: "Keep the brand's personality the same everywhere, describe the tone in a few words, and check it with real users instead of guessing.", ar: "حافظ على شخصية العلامة نفسها في كل مكان، وصِف النبرة بكلمات قليلة، وتحقّق منها مع مستخدمين حقيقيين بدل التخمين." }
