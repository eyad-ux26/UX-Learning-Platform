id: P15-U03-B01
mode: bank
title:
  en: "Re-tests: pick the right tone"
  ar: "إعادة اختبار: اختر النبرة المناسبة"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "The Four Dimensions of Tone of Voice (NN/g)", ar: "الأبعاد الأربعة لنبرة الصوت (NN/g)" }
    url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/"
  - title: { en: "The Impact of Tone of Voice on Users' Brand Perception (NN/g)", ar: "أثر نبرة الصوت على نظرة المستخدمين للعلامة التجارية (NN/g)" }
    url: "https://www.nngroup.com/articles/tone-voice-users/"
steps:
  - id: S01
    type: choose
    skill: SK-P15-U03-01
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Four Dimensions of Tone (NN/g): a tone can fall at either extreme of each scale, or anywhere in between; move only the scale you mean to."
      ar: "إعادة اختبار. أبعاد النبرة الأربعة (NN/g): النبرة قد تقع في أحد طرفي كل مقياس، أو في أي مكان بينهما؛ فحرّك المقياس الذي تقصده فقط."
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "Tones could fall at either extreme of each dimension, or somewhere in between." }
    scenario:
      en: "In my food app, the message after ordering says: \"Your order has been received and is being processed.\" I want it more casual, but not jokey."
      ar: "في تطبيق الطعام الذي أديره، الرسالة بعد الطلب تقول: «تمّ استلام طلبك وجارٍ تجهيزه.» وأريدها أكثر ودًّا، دون مزاح."
    prompt:
      en: "Which message is more casual, and still not trying to be funny?"
      ar: "أي رسالة أكثر ودًّا، ولا تحاول أن تكون مضحكة؟"
    options:
      - { id: formal, text: { en: "\"We hereby confirm receipt of your order.\"", ar: "«نؤكّد لكم بموجب هذا استلام طلبكم.»" } }
      - { id: casual, text: { en: "\"Got your order. We're cooking it now.\"", ar: "«وصلنا طلبك. ونحضّره الآن.»" } }
      - { id: funny, text: { en: "\"Yum! 🍕🤤 The chef is dancing in the kitchen!\"", ar: "«يمّي! 🍕🤤 الطاهي يرقص في المطبخ!»" } }
    answer: [casual]
    misconceptions:
      - id: MC-P15-016
        when: [funny]
        feedback:
          en: "Casual, yes, but it's also a joke now. And people can't tell their order is being made."
          ar: "ودّية نعم، لكنها أصبحت نكتة أيضًا. ولا يعرف الناس منها أن طلبهم يُحضَّر."
      - id: MC-P15-017
        when: [formal]
        feedback:
          en: "\"We hereby confirm\" is even more formal. It went the wrong way."
          ar: "«نؤكّد لكم بموجب هذا» أكثر رسمية. فقد تحرّكت في الاتجاه الخطأ."
    correct:
      en: "Right. Everyday words, no joke."
      ar: "صحيح. كلمات يومية، دون نكتة."
    explain:
      en: "Casual comes from plain words. You don't need humor to sound relaxed."
      ar: "الودّ يأتي من الكلمات البسيطة. ولا تحتاج المزاح لتبدو مرتاحًا."

  - id: S02
    type: choose
    skill: SK-P15-U03-01
    part: retest
    speaker: karim
    value:
      en: "Re-test. Four Dimensions of Tone (NN/g): the matter-of-fact vs enthusiastic scale asks whether the writing is excited about the subject, or dry and matter-of-fact."
      ar: "إعادة اختبار. أبعاد النبرة الأربعة (NN/g): مقياس الحياد مقابل الحماس يسأل: هل النص متحمّس للموضوع، أم جاف ومحايد؟"
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "Or is the writing dry and matter-of-fact?" }
    scenario:
      en: "I'm coding a work app. After every file upload it shows: \"WOW!!! Your file is uploaded!!! 🎉🎉🎉\" People upload 50 files a day, and they find it too much. My lead asked for a calmer message, not a formal one."
      ar: "أبرمج تطبيقًا للعمل. وبعد رفع كل ملف يعرض: «واو!!! تمّ رفع ملفك!!! 🎉🎉🎉» والناس يرفعون 50 ملفًا في اليوم، ويجدونها مبالغًا فيها. وطلبت قائدة فريقي رسالة أهدأ، لا رسمية."
    prompt:
      en: "Which message is matter-of-fact, without becoming formal?"
      ar: "أي رسالة محايدة، دون أن تصبح رسمية؟"
    options:
      - { id: plain, text: { en: "\"File uploaded.\"", ar: "«تمّ رفع الملف.»" } }
      - { id: formal, text: { en: "\"We hereby confirm the successful upload of the selected file.\"", ar: "«نؤكّد بموجب هذا نجاح رفع الملف المحدّد.»" } }
      - { id: rock, text: { en: "\"Boom! Uploaded! You rock 😎\"", ar: "«بوم! تمّ الرفع! أنت رائع 😎»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P15-017
        when: [formal]
        feedback:
          en: "Calmer, but now it's stiff and formal too. You moved two scales."
          ar: "أهدأ، لكنها أصبحت متكلّفة ورسمية أيضًا. فحرّكت مقياسين."
      - id: MC-P15-016
        when: [rock]
        feedback:
          en: "Still very excited, and now it's jokey too. Fifty times a day, it gets tiring."
          ar: "ما زالت متحمّسة جدًا، وأصبحت مازحة أيضًا. وخمسون مرة في اليوم أمر متعب."
    correct:
      en: "Right. Calm, plain, and still casual."
      ar: "صحيح. هادئة، وبسيطة، وما زالت ودّية."
    explain:
      en: "For something people do 50 times a day, less excitement is better. Keep the words plain."
      ar: "مع شيء يفعله الناس 50 مرة في اليوم، الحماس الأقل أفضل. وأبقِ الكلمات بسيطة."

  - id: S03
    type: choose
    skill: SK-P15-U03-02
    part: retest
    speaker: mona
    value:
      en: "Re-test. Tone of Voice and Users (NN/g): if users arrive frustrated at an error page, they don't want the error message to be a joke."
      ar: "إعادة اختبار. النبرة والمستخدمون (NN/g): إن وصل المستخدمون إلى صفحة خطأ وهم منزعجون، فلا يريدون أن تكون رسالة الخطأ نكتة."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "If your users are arriving frustrated at an error page, do you really think they want that error message to be a joke?" }
    scenario:
      en: "In our bill app, people who enter the wrong PIN 3 times get locked out for 30 minutes, often while a bill is due."
      ar: "في تطبيق الفواتير، من يُدخل رمز PIN خطأ 3 مرات يُغلق حسابه 30 دقيقة، وغالبًا بينما تكون فاتورة مستحقّة."
    prompt:
      en: "Which message fits people who have just been locked out?"
      ar: "أي رسالة تناسب من أُغلق حسابه للتو؟"
    options:
      - { id: joke, text: { en: "\"Forgot again? 🙈 Time for a coffee break!\"", ar: "«نسيت مرة أخرى؟ 🙈 حان وقت استراحة القهوة!»" } }
      - { id: cold, text: { en: "\"Access denied. Account locked.\"", ar: "«تمّ رفض الدخول. الحساب مغلق.»" } }
      - { id: calm, text: { en: "\"For your safety, we've locked your account for 30 minutes. Forgot your PIN? Reset it now.\"", ar: "«لحمايتك، أغلقنا حسابك لمدة 30 دقيقة. نسيت رمز PIN؟ أعد تعيينه الآن.»" } }
    answer: [calm]
    misconceptions:
      - id: MC-P15-020
        when: [joke]
        feedback:
          en: "Someone worried about a due bill won't laugh. This sounds like we're mocking them."
          ar: "من يقلق بشأن فاتورة مستحقّة لن يضحك. ويبدو هذا كأننا نسخر منه."
      - id: MC-P15-017
        when: [cold]
        feedback:
          en: "No joke, but it's cold and gives no way out. For how long? What now?"
          ar: "لا نكتة، لكنها باردة ولا تعطي حلًا. لكم من الوقت؟ وماذا الآن؟"
    correct:
      en: "Right. Calm, and it gives them a next step."
      ar: "صحيح. هادئة، وتعطيهم خطوة تالية."
    explain:
      en: "A frustrated reader needs calm and a way forward, not a joke."
      ar: "القارئ المنزعج يحتاج الهدوء وطريقًا للأمام، لا نكتة."

  - id: S04
    type: choose
    skill: SK-P15-U03-02
    part: retest
    speaker: hana
    value:
      en: "Re-test. Four Dimensions of Tone (NN/g): consider your users' emotions and information needs for each piece of content."
      ar: "إعادة اختبار. أبعاد النبرة الأربعة (NN/g): راعِ مشاعر مستخدميك واحتياجاتهم من المعلومات في كل نص."
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "Consider the characteristics and preferences of your users, but also their emotions and information needs for each piece of content." }
    scenario:
      en: "A member just finished her 100th class at my gym. She has been coming for a year."
      ar: "أنهت إحدى العضوات حصتها رقم 100 في ناديّ. وهي تأتي منذ سنة."
    prompt:
      en: "Which message fits her moment?"
      ar: "أي رسالة تناسب لحظتها؟"
    options:
      - { id: dry, text: { en: "\"Class count: 100.\"", ar: "«عدد الحصص: 100.»" } }
      - { id: proud, text: { en: "\"100 classes! A whole year of showing up. Well done 🎉\"", ar: "«100 حصة! سنة كاملة من الالتزام. أحسنتِ 🎉»" } }
      - { id: tease, text: { en: "\"100 classes and you still can't touch your toes? 😜\"", ar: "«100 حصة وما زلتِ لا تلمسين أصابع قدميك؟ 😜»" } }
    answer: [proud]
    misconceptions:
      - id: MC-P15-017
        when: [dry]
        feedback:
          en: "True, but it misses the moment. A big win can sound happy."
          ar: "صحيحة، لكنها تفوّت اللحظة. والإنجاز الكبير يمكن أن يبدو سعيدًا."
      - id: MC-P15-020
        when: [tease]
        feedback:
          en: "Teasing about her body on her big day can hurt. Humor fails easily."
          ar: "المشاكسة بشأن جسدها في يومها المميّز قد تؤذي. والمزاح يفشل بسهولة."
    correct:
      en: "Right. Happy and proud, without teasing."
      ar: "صحيح. سعيدة وفخورة، دون مشاكسة."
    explain:
      en: "When the moment is a win, let the tone celebrate it."
      ar: "حين تكون اللحظة إنجازًا، دع النبرة تحتفل به."

  - id: S05
    type: choose
    skill: SK-P15-U03-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Tone of Voice and Users (NN/g): an exciting, chummy or funny tone won't be ideal for all organizations; remember this when stakeholders ask to \"add a joke\"."
      ar: "إعادة اختبار. النبرة والمستخدمون (NN/g): النبرة المثيرة أو المفرطة في الودّ أو المضحكة لا تناسب كل مؤسسة؛ تذكّر هذا حين يُطلب منك «أضف نكتة»."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "An exciting, chummy, or funny tone of voice won't be ideal for all organizations." }
    scenario:
      en: "My shop sells phones. On the warranty page, people check what happens if their phone breaks. My nephew wants to add a joke."
      ar: "متجري يبيع الهواتف. وفي صفحة الضمان، يتأكّد الناس مما يحدث إن تعطّل هاتفهم. وابن أخي يريد إضافة نكتة."
    prompt:
      en: "Which text is friendly and makes people trust the warranty?"
      ar: "أي نص ودّي ويجعل الناس يثقون بالضمان؟"
    options:
      - { id: plain, text: { en: "\"If your phone stops working within 2 years, bring it to any of our shops. We'll fix it or replace it for free.\"", ar: "«إن توقّف هاتفك عن العمل خلال سنتين، أحضره إلى أي فرع من فروعنا. وسنصلحه أو نستبدله مجانًا.»" } }
      - { id: joke, text: { en: "\"Dropped your phone in the soup? 🍜😂 Happens! We've (probably) got you.\"", ar: "«أسقطت هاتفك في الشوربة؟ 🍜😂 يحدث! نحن معك (على الأرجح).»" } }
      - { id: legal, text: { en: "\"The warranty shall cover manufacturing defects pursuant to the terms herein.\"", ar: "«يغطّي الضمان عيوب التصنيع وفقًا للشروط الواردة هنا.»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P15-018
        when: [joke]
        feedback:
          en: "Funny, but \"(probably)\" makes people doubt the warranty. Jokes here cost trust."
          ar: "مضحكة، لكن «(على الأرجح)» تجعل الناس يشكّون في الضمان. والنكات هنا تُفقد الثقة."
      - id: MC-P15-017
        when: [legal]
        feedback:
          en: "Serious, but cold. People must work out what \"pursuant to the terms herein\" means."
          ar: "جادة، لكنها باردة. وعلى الناس أن يفهموا بأنفسهم معنى «وفقًا للشروط الواردة هنا»."
    correct:
      en: "Right. Plain, friendly, and clear about what you get."
      ar: "صحيح. بسيطة، وودّية، وواضحة فيما ستحصل عليه."
    explain:
      en: "When people check a promise, they want to trust it. Plain words do that better than jokes or legal words."
      ar: "حين يتأكّد الناس من وعد، يريدون أن يثقوا به. والكلمات البسيطة تفعل ذلك أفضل من النكات والكلمات القانونية."

  - id: S06
    type: compare
    skill: SK-P15-U03-03
    part: retest
    speaker: sara
    value:
      en: "Re-test. Tone of Voice and Users (NN/g): for a hospital, many participants found that a light, conversational tone conveyed empathy, which was meaningful to them."
      ar: "إعادة اختبار. النبرة والمستخدمون (NN/g): مع المستشفى، وجد كثير من المشاركين أن النبرة الخفيفة الحوارية تُظهر التعاطف، وكان ذلك مهمًا لهم."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "But many participants found that a light, conversational tone conveyed empathy, which was meaningful to them." }
    scenario:
      en: "Our bank now offers health insurance. People open the claim page when they or a family member has been ill. We wrote two versions."
      ar: "بنكنا يقدّم الآن التأمين الصحي. ويفتح الناس صفحة المطالبات حين يمرضون هم أو أحد أفراد أسرتهم. وكتبنا نسختين."
    prompt:
      en: "Which version shows care and stays serious?"
      ar: "أي نسخة تُظهر الاهتمام وتبقى جادة؟"
    a:
      label: { en: "A: Plain words that say what happens next.", ar: "A: كلمات بسيطة تقول ماذا سيحدث بعد ذلك." }
      mock:
        app: rasid
        appbar:
          title: {en: Health insurance, ar: التأمين الصحي}
          back: true
        footer:
        - kind: button
          text: {en: Send claim, ar: أرسل المطالبة}
        blocks:
        - {kind: image, art: doctor, size: s}
        - kind: heading
          text: {en: Make a claim, ar: قدّم مطالبة}
          gap: m
        - kind: text
          text:
            en: "We hope you're feeling better. Send us your bills, and we'll reply within 3 working days."
            ar: نتمنّى أن تكون بخير الآن. أرسل لنا فواتيرك، وسنرد خلال 3 أيام عمل.
          gap: xs
        - kind: listitem
          icon: paperclip
          text: {en: Add your bills, ar: أضف فواتيرك}
          sub: {en: Photos or PDF, ar: صور أو PDF}
          chevron: true
          gap: m
    b:
      label: { en: "B: Formal words about review and approval.", ar: "B: كلمات رسمية عن المراجعة والموافقة." }
      mock:
        app: rasid
        appbar:
          title: {en: Health insurance, ar: التأمين الصحي}
          back: true
        footer:
        - kind: button
          text: {en: Send claim, ar: أرسل المطالبة}
        blocks:
        - {kind: image, art: doctor, size: s}
        - kind: heading
          text: {en: Make a claim, ar: قدّم مطالبة}
          gap: m
        - kind: text
          text: {en: Submitted claims shall be subject to review and approval in accordance with policy provisions., ar: تخضع المطالبات المقدَّمة للمراجعة والموافقة وفقًا لأحكام الوثيقة.}
          gap: xs
        - kind: listitem
          icon: paperclip
          text: {en: Add your bills, ar: أضف فواتيرك}
          sub: {en: Photos or PDF, ar: صور أو PDF}
          chevron: true
          gap: m
    answer: a
    misconceptions:
      - id: MC-P15-017
        when: [b]
        feedback:
          en: "B is serious, but cold, at a moment when people may be tired and worried."
          ar: "B جادة، لكنها باردة، في لحظة قد يكون فيها الناس متعبين وقلقين."
    correct:
      en: "Right. Kind, serious, and clear about the next step."
      ar: "صحيح. لطيفة، وجادة، وواضحة في الخطوة التالية."
    explain:
      en: "On health and money, a light, kind tone shows you care. Keep it serious by giving clear facts."
      ar: "في الصحة والمال، النبرة الخفيفة اللطيفة تُظهر اهتمامك. وتبقى جادة حين تعطي معلومات واضحة."

  - id: S07
    type: choose
    skill: SK-P15-U03-04
    part: retest
    speaker: nour
    value:
      en: "Re-test. Tone of Voice and Users (NN/g): ask users prompting but vague questions, such as \"If this website were a person, who would it be? Why?\", to hear how they read the writing's personality."
      ar: "إعادة اختبار. النبرة والمستخدمون (NN/g): اسأل المستخدمين أسئلة مفتوحة غير موجِّهة، مثل «لو كان هذا الموقع شخصًا، فمن سيكون؟ ولماذا؟»، لتعرف كيف يرون شخصية النص."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "If this website were a person, who would it be? Why?" }
    scenario:
      en: "We rewrote our clinic app in a calmer tone. I want to hear how patients see it, without putting words in their mouths."
      ar: "أعدنا كتابة تطبيق العيادة بنبرة أهدأ. وأريد أن أعرف كيف يراه المرضى، دون أن أضع الكلمات على ألسنتهم."
    prompt:
      en: "Which question should I ask patients?"
      ar: "أي سؤال أطرحه على المرضى؟"
    options:
      - { id: calm, text: { en: "\"Don't you think the new text sounds calm?\"", ar: "«ألا ترى أن النص الجديد يبدو هادئًا؟»" } }
      - { id: rate, text: { en: "\"From 1 to 10, how much do you like the app?\"", ar: "«من 1 إلى 10، كم يعجبك التطبيق؟»" } }
      - { id: person, text: { en: "\"If this app were a person, who would it be? Why?\"", ar: "«لو كان هذا التطبيق شخصًا، فمن سيكون؟ ولماذا؟»" } }
    answer: [person]
    misconceptions:
      - id: MC-P15-022
        when: [calm]
        feedback:
          en: "This tells patients the answer you want. Many will just agree."
          ar: "هذا يخبر المرضى بالجواب الذي تريده. وكثيرون سيوافقون فقط."
      - id: MC-P15-022
        when: [rate]
        feedback:
          en: "A score says nothing about tone. You won't learn how the text sounds to them."
          ar: "الدرجة لا تقول شيئًا عن النبرة. ولن تعرف كيف يبدو النص لهم."
    correct:
      en: "Right. Open, and it doesn't lead them."
      ar: "صحيح. سؤال مفتوح، ولا يوجّههم."
    explain:
      en: "Ask in a way that lets people describe the personality they hear, in their own words."
      ar: "اسأل بطريقة تسمح للناس أن يصفوا الشخصية التي يسمعونها، بكلماتهم الخاصة."

  - id: S08
    type: choose
    skill: SK-P15-U03-04
    part: retest
    speaker: rami
    value:
      en: "Re-test. Four Dimensions of Tone (NN/g): tone of voice applies to all touchpoints, not just site or app copy, including email and other channels."
      ar: "إعادة اختبار. أبعاد النبرة الأربعة (NN/g): نبرة الصوت تشمل كل نقاط التواصل، لا نصوص الموقع أو التطبيق فقط، بما فيها البريد والقنوات الأخرى."
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "Tone of voice applies to all touchpoints, not just to your site or app copy." }
    scenario:
      en: "Our bus app sounds friendly. But the text messages people get with their tickets sound like a robot: \"TKT#4821 CONFIRMED. BOARDING PER SCHEDULE.\""
      ar: "تطبيق الحافلات يبدو ودّيًا. لكن الرسائل النصية التي تصل الناس مع تذاكرهم تبدو كأنها من آلة: «تذكرة#4821 مؤكدة. الصعود حسب الجدول.»"
    prompt:
      en: "What should I do with the text messages?"
      ar: "ماذا أفعل بالرسائل النصية؟"
    options:
      - { id: keep, text: { en: "Keep them as they are, since text messages are official", ar: "أتركها كما هي، لأن الرسائل النصية رسمية" } }
      - { id: same, text: { en: "Write them in the app's friendly voice: \"Your seat is booked: 14, Cairo → Alexandria, 9:00 AM. Have a good trip!\"", ar: "أكتبها بصوت التطبيق الودّي: «حُجز مقعدك: 14، القاهرة ← الإسكندرية، 9:00 صباحًا. رحلة سعيدة!»" } }
      - { id: jokes, text: { en: "Copy the app's jokes and emojis into every text message", ar: "أنقل نكات التطبيق ورموزه التعبيرية إلى كل رسالة نصية" } }
    answer: [same]
    misconceptions:
      - id: MC-P15-021
        when: [keep]
        feedback:
          en: "People don't see two companies; they see one. A robot voice in one place breaks the personality."
          ar: "الناس لا يرون شركتين، بل شركة واحدة. والصوت الآلي في مكان واحد يكسر الشخصية."
      - id: MC-P15-021
        when: [jokes]
        feedback:
          en: "Same voice doesn't mean copying every joke. A ticket text needs clear facts first."
          ar: "الصوت نفسه لا يعني نسخ كل نكتة. ورسالة التذكرة تحتاج المعلومات الواضحة أولًا."
    correct:
      en: "Right. Same friendly voice, and the facts people need."
      ar: "صحيح. نفس الصوت الودّي، والمعلومات التي يحتاجها الناس."
    explain:
      en: "Your voice covers every place you talk to people: app, email, text messages."
      ar: "صوتك يشمل كل مكان تخاطب فيه الناس: التطبيق، والبريد، والرسائل النصية."
