id: P15-U03-L03
mode: check
minutes: 5
title:
  en: "Skill check: pick the right tone"
  ar: "اختبار المهارة: اختر النبرة المناسبة"
summary:
  en: "Choose the tone for four gym app messages on your own, from a pep talk to a failed payment."
  ar: "اختر بنفسك نبرة أربع رسائل في تطبيق نادٍ رياضي، من رسالة تشجيع إلى دفع فشل."
speaker: hana
sources:
  - title: { en: "The Four Dimensions of Tone of Voice (NN/g)", ar: "الأبعاد الأربعة لنبرة الصوت (NN/g)" }
    url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/"
  - title: { en: "The Impact of Tone of Voice on Users' Brand Perception (NN/g)", ar: "أثر نبرة الصوت على نظرة المستخدمين للعلامة التجارية (NN/g)" }
    url: "https://www.nngroup.com/articles/tone-voice-users/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Hana's gym app", ar: "تطبيق النادي الذي تملكه هناء" }
    body:
      en: "I own a gym, and our app talks to members every day: reminders, payments, and the rules for canceling.\n\nYour job: pick the right tone for four messages.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أملك ناديًا رياضيًا، وتطبيقنا يخاطب الأعضاء كل يوم: تذكيرات، ومدفوعات، وقواعد إلغاء الاشتراك.\n\nمهمّتك: اختر النبرة المناسبة لأربع رسائل.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: nashat
      appbar: {logo: true}
      tabbar:
        active: 0
        items:
        - icon: house
          text: {en: Home, ar: الرئيسية}
        - icon: calendar-blank
          text: {en: Classes, ar: الحصص}
        - icon: identification-card
          text: {en: My plan, ar: اشتراكي}
        - icon: user
          text: {en: Account, ar: حسابي}
      blocks:
      - kind: card
        art: gym
        blocks:
        - kind: heading
          text: {en: Spinning · 7 AM, ar: دراجات · 7 ص}
        - kind: small
          text: {en: Tomorrow · Coach Omar, ar: غدًا · المدرب عمر}
          color: muted
      - kind: listitem
        icon: identification-card
        text: {en: Monthly plan, ar: الاشتراك الشهري}
        sub: {en: Renews 1 April, ar: يتجدّد 1 أبريل}
        value:
          en: EGP 850
          ar: "850 جنيه"
        gap: m

  - id: S02
    type: choose
    skill: SK-P15-U03-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Four Dimensions of Tone (NN/g): every piece of copy sits somewhere on four scales: formal-casual, serious-funny, respectful-irreverent, matter-of-fact-enthusiastic."
      ar: "اختبار مهارة. أبعاد النبرة الأربعة (NN/g): كل نص يقع في مكان ما على أربعة مقاييس: رسمي-ودّي، جاد-مضحك، محترم-ساخر، محايد-متحمّس."
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "Think of each of the four dimensions as a spectrum" }
    scenario:
      en: "Our morning reminder says: \"Rise and shine, champ! 💪🔥 Your 7 AM class is waiting!\""
      ar: "تذكيرنا الصباحي يقول: «انهض يا بطل! 💪🔥 حصتك في السابعة صباحًا بانتظارك!»"
    prompt:
      en: "Which words describe the tone of this reminder?"
      ar: "أي كلمات تصف نبرة هذا التذكير؟"
    options:
      - { id: formal, text: { en: "Formal and matter-of-fact", ar: "رسمية ومحايدة" } }
      - { id: cold, text: { en: "Serious and irreverent", ar: "جادة وساخرة" } }
      - { id: hype, text: { en: "Casual, enthusiastic and respectful", ar: "ودّية ومتحمّسة ومحترمة" } }
    answer: [hype]
    misconceptions:
      - id: MC-P15-016
        when: [formal, cold]
        feedback:
          en: "\"Champ\", the emojis and the exclamation marks make it casual and excited. It cheers people on; it doesn't mock them."
          ar: "«يا بطل» والرموز التعبيرية وعلامات التعجّب تجعلها ودّية ومتحمّسة. وهي تشجّع الناس، ولا تسخر منهم."
    explain:
      en: "From Lesson 1: name each scale on its own. Excited and casual can still be respectful."
      ar: "من الدرس 1: سمِّ كل مقياس وحده. فالنبرة المتحمّسة الودّية يمكن أن تبقى محترمة."

  - id: S03
    type: choose
    skill: SK-P15-U03-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. Tone of Voice and Users (NN/g): consider the concerns of your readers and their emotional state when choosing a tone."
      ar: "اختبار مهارة. النبرة والمستخدمون (NN/g): راعِ مخاوف قرّائك وحالتهم العاطفية حين تختار النبرة."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "Remember to consider the concerns of your readers and their emotional state when choosing a tone." }
    scenario:
      en: "A member's monthly payment failed. Her card was declined, and she may lose her plan. She's probably worried."
      ar: "فشل الدفع الشهري لإحدى العضوات. رُفضت بطاقتها، وقد تفقد اشتراكها. وهي على الأرجح قلقة."
    prompt:
      en: "Which message fits how she feels?"
      ar: "أي رسالة تناسب شعورها؟"
    options:
      - { id: calm, text: { en: "\"Your payment didn't go through. Update your card by Friday to keep your plan.\"", ar: "«لم يتمّ الدفع. حدّث بطاقتك قبل يوم الجمعة لتحافظ على اشتراكك.»" } }
      - { id: hype, text: { en: "\"Uh-oh, champ! 💪😅 Your card dropped the ball!\"", ar: "«أوه يا بطل! 💪😅 بطاقتك خذلتك هذه المرة!»" } }
      - { id: legal, text: { en: "\"Payment declined. Membership subject to suspension.\"", ar: "«رُفض الدفع. العضوية عرضة للإيقاف.»" } }
    answer: [calm]
    misconceptions:
      - id: MC-P15-021
        when: [hype]
        feedback:
          en: "Same pep-talk tone as the morning reminder. For a money problem, it feels like we're not taking it seriously."
          ar: "نفس نبرة التشجيع في التذكير الصباحي. ومع مشكلة مالية، يبدو أننا لا نأخذ الأمر بجدّية."
      - id: MC-P15-017
        when: [legal]
        feedback:
          en: "Clear, but cold and a bit scary. It doesn't tell her what to do."
          ar: "واضحة، لكنها باردة ومخيفة قليلًا. ولا تخبرها بما عليها فعله."
    explain:
      en: "From Lesson 2: in a worrying moment, be calm and clear, and give people a way to fix it."
      ar: "من الدرس 2: في لحظة مقلقة، كن هادئًا وواضحًا، وأعطِ الناس طريقة للإصلاح."

  - id: S04
    type: choose
    skill: SK-P15-U03-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Tone of Voice and Users (NN/g): a conversational but serious tone can be successful even for a bank; an exciting, chummy or funny tone won't suit every organization."
      ar: "اختبار مهارة. النبرة والمستخدمون (NN/g): النبرة الحوارية الجادة قد تنجح حتى مع بنك؛ والنبرة المثيرة أو المفرطة في الودّ أو المضحكة لا تناسب كل مؤسسة."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "a conversational but serious tone can be successful for a bank." }
    scenario:
      en: "Members read our cancellation page before they decide to stop paying. It's about their money and their contract."
      ar: "يقرأ الأعضاء صفحة الإلغاء قبل أن يقرّروا التوقّف عن الدفع. وهي تخصّ أموالهم وعقدهم."
    prompt:
      en: "Which text is friendly and makes members trust what it says?"
      ar: "أي نص ودّي ويجعل الأعضاء يثقون بما يقوله؟"
    options:
      - { id: legal, text: { en: "\"Termination of membership shall be effective upon expiry of the current billing period.\"", ar: "«يسري إنهاء العضوية عند انتهاء فترة الفوترة الحالية.»" } }
      - { id: plain, text: { en: "\"You can cancel any time. You can still use the gym until the end of the month you've paid for.\"", ar: "«يمكنك الإلغاء في أي وقت. وتستطيع استخدام النادي حتى نهاية الشهر الذي دفعت ثمنه.»" } }
      - { id: guilt, text: { en: "\"Leaving us already? 😢 Your muscles will miss you! 💔\"", ar: "«ستتركنا بهذه السرعة؟ 😢 عضلاتك ستشتاق إليك! 💔»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P15-017
        when: [legal]
        feedback:
          en: "Serious, but cold and hard to read. Members must work out what \"termination\" means for them."
          ar: "جادة، لكنها باردة وصعبة القراءة. وعلى الأعضاء أن يفهموا بأنفسهم ماذا يعني «الإنهاء» لهم."
      - id: MC-P15-018
        when: [guilt]
        feedback:
          en: "Jokes on a money-and-contract page cost trust. It also hides the facts members came for."
          ar: "النكات في صفحة عن المال والعقد تُفقد الثقة. كما أنها تُخفي المعلومات التي جاء الأعضاء من أجلها."
    explain:
      en: "From Lesson 1: serious topics need plain, friendly words, not legal words or jokes."
      ar: "من الدرس 1: المواضيع الجادة تحتاج كلمات بسيطة وودّية، لا كلمات قانونية ولا نكاتًا."

  - id: S05
    type: choose
    skill: SK-P15-U03-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Four Dimensions of Tone (NN/g): you might choose a casual tone for the whole site, but vary the amount of humor across it."
      ar: "اختبار مهارة. أبعاد النبرة الأربعة (NN/g): قد تختار نبرة ودّية للموقع كله، لكن تغيّر مقدار المزاح من مكان لآخر."
    ref: { url: "https://www.nngroup.com/articles/tone-of-voice-dimensions/", quote: "You might decide on a casual tone for your site-wide content strategy, but vary the amount of humor in your copy across the site." }
    scenario:
      en: "Members love our upbeat, casual style. I'm writing the rule for the whole app."
      ar: "الأعضاء يحبّون أسلوبنا الودّي المتفائل. وأكتب القاعدة للتطبيق كله."
    prompt:
      en: "Which rule keeps the gym sounding like us and fits every moment?"
      ar: "أيّ قاعدة تحافظ على صوت النادي وتناسب كل لحظة؟"
    options:
      - { id: same, text: { en: "\"Be upbeat and playful in every message, so we always sound the same.\"", ar: "«كن متفائلًا ومرحًا في كل رسالة، حتى نبدو دائمًا بنفس الطريقة.»" } }
      - { id: split, text: { en: "\"Be playful in the app, but formal in emails.\"", ar: "«كن مرحًا في التطبيق، ورسميًا في رسائل البريد.»" } }
      - { id: vary, text: { en: "\"Always casual and kind. Playful for wins and reminders; calm for payments, injuries and cancelling.\"", ar: "«ودّيون ولطفاء دائمًا. مرحون في الإنجازات والتذكيرات، وهادئون في المدفوعات والإصابات والإلغاء.»" } }
    answer: [vary]
    misconceptions:
      - id: MC-P15-021
        when: [same]
        feedback:
          en: "One voice doesn't mean one tone. Playful jokes in a message about an injury would hurt."
          ar: "الصوت الواحد لا يعني نبرة واحدة. والمزاح في رسالة عن إصابة سيؤذي."
      - id: MC-P15-021
        when: [split]
        feedback:
          en: "This splits the gym into two personalities. Tone should follow the moment, not the channel."
          ar: "هذا يقسم النادي إلى شخصيتين. والنبرة يجب أن تتبع اللحظة، لا وسيلة التواصل."
    explain:
      en: "From Lesson 2: keep one voice everywhere, and change how playful you are with the moment."
      ar: "من الدرس 2: حافظ على صوت واحد في كل مكان، وغيّر مقدار المرح حسب اللحظة."
