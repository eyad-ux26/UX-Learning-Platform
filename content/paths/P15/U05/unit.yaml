id: P15-U05
free: false
title:
  en: "Words for empty screens and alerts"
  ar: "كلمات للشاشات الفارغة والتنبيهات"
skill:
  en: "Turn empty screens into a clear next step, and write notifications people agree to and are glad to get."
  ar: "حوّل الشاشات الفارغة إلى خطوة تالية واضحة، واكتب إشعارات يوافق عليها الناس ويسعدون بوصولها."
skills:
  - id: SK-P15-U05-01
    title: { en: "Explain the empty screen", ar: "اشرح الشاشة الفارغة" }
    can_do: { en: "Say what will appear in an empty area and how to fill it, and never say \"nothing here\" while content is still loading.", ar: "قل ما الذي سيظهر في المساحة الفارغة وكيف تُملأ، ولا تقل أبدًا «لا يوجد شيء» بينما المحتوى ما زال يُحمَّل." }
  - id: SK-P15-U05-02
    title: { en: "Give a direct way to start", ar: "أعطِ طريقًا مباشرًا للبدء" }
    can_do: { en: "Put a button or link in the empty screen that starts the task, instead of only telling people where to go.", ar: "ضع في الشاشة الفارغة زرًّا أو رابطًا يبدأ المهمة، بدل أن تخبر الناس فقط إلى أين يذهبون." }
  - id: SK-P15-U05-03
    title: { en: "Ask for notifications at the right time", ar: "اطلب الإذن بالإشعارات في الوقت المناسب" }
    can_do: { en: "Ask after people have seen the app's value, and say what the notifications will be about.", ar: "اطلب بعد أن يرى الناس فائدة التطبيق، وقل موضوع الإشعارات." }
  - id: SK-P15-U05-04
    title: { en: "Send notifications worth reading", ar: "أرسل إشعارات تستحق القراءة" }
    can_do: { en: "Send only what matters to this person, and combine many updates into one message.", ar: "أرسل فقط ما يهمّ هذا الشخص، واجمع التحديثات الكثيرة في رسالة واحدة." }
