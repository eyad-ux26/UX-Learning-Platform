id: P15-U05-L01
mode: lesson
minutes: 7
title:
  en: "Empty screens that help"
  ar: "شاشات فارغة تساعد"
summary:
  en: "Rewrite the empty screens in a shop's app so new customers know what goes there and how to start."
  ar: "أعد كتابة الشاشات الفارغة في تطبيق متجر حتى يعرف العملاء الجدد ما يوضع فيها وكيف يبدؤون."
speaker: youssef
sources:
  - title: { en: "Designing Empty States in Complex Applications: 3 Guidelines (NN/g)", ar: "تصميم الحالات الفارغة في التطبيقات المعقّدة: 3 إرشادات (NN/g)" }
    url: "https://www.nngroup.com/articles/empty-state-interface-design/"
review_labels:
  MC-P15-030: { en: "A blank or \"No data\" screen leaves people wondering what goes there", ar: "الشاشة الفارغة أو «لا توجد بيانات» تترك الناس يتساءلون عمّا يوضع فيها" }
  MC-P15-031: { en: "Saying \"nothing here\" while loading is worse than saying nothing", ar: "قول «لا يوجد شيء» أثناء التحميل أسوأ من الصمت" }
  MC-P15-032: { en: "Instructions alone aren't a way to start; give a button", ar: "التعليمات وحدها ليست طريقًا للبدء؛ أعطِ زرًّا" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Is the app broken?", ar: "هل التطبيق معطّل؟" }
    body:
      en: "I own a home-appliances shop, and we just launched our app. New customers open \"Saved items\" and see an empty white screen.\n\nSome of them messaged us: \"Is the app broken?\" Nothing was broken. They just hadn't saved anything yet."
      ar: "أملك متجرًا للأجهزة المنزلية، وأطلقنا تطبيقنا للتو. والعملاء الجدد يفتحون «المحفوظات» فيرون شاشة بيضاء فارغة.\n\nراسلنا بعضهم: «هل التطبيق معطّل؟» لم يكن شيء معطّلًا. هم فقط لم يحفظوا شيئًا بعد."
    mock:
      app: dar
      appbar:
        title: {en: Saved items, ar: المحفوظات}
      tabbar:
        active: 0
        items:
        - icon: house
          text: {en: Home, ar: الرئيسية}
        - icon: squares-four
          text: {en: Departments, ar: الأقسام}
        - icon: package
          text: {en: Orders, ar: طلباتي}
        - icon: shopping-cart
          text: {en: Cart, ar: السلة}
        - icon: user
          text: {en: Account, ar: حسابي}
      blocks:
      - {kind: image, art: box, size: m}
      - kind: heading
        text: {en: Nothing saved yet, ar: لا شيء محفوظ بعد}
        gap: m
        tone: faint
      - {kind: divider, gap: s}
      - {kind: divider, gap: xl}

  - id: S02
    type: choose
    skill: SK-P15-U05-01
    part: try
    rules: [R12]
    value:
      en: "Try first. Empty States (NN/g): when content doesn't exist yet, tell the user what could be displayed and how to fill the area; one app says \"Star your favorites to list them here\"."
      ar: "جرّب أولًا. الحالات الفارغة (NN/g): حين لا يوجد محتوى بعد، أخبر المستخدم بما يمكن أن يظهر وكيف تُملأ المساحة؛ فأحد التطبيقات يقول «ضع نجمة على مفضّلاتك لتظهر هنا»."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "Tell the user what could be displayed, and how to populate the area with that content." }
    prompt:
      en: "Which text should the empty \"Saved items\" screen show?"
      ar: "أي نص يجب أن تعرضه شاشة «المحفوظات» الفارغة؟"
    options:
      - { id: nodata, text: { en: "\"No items.\"", ar: "«لا توجد عناصر.»" } }
      - { id: cue, text: { en: "\"Tap ♡ on any product to save it here.\"", ar: "«اضغط ♡ على أي منتج لتحفظه هنا.»" } }
      - { id: cute, text: { en: "\"Nothing to see here… yet 🦗\"", ar: "«لا شيء هنا… حتى الآن 🦗»" } }
    answer: [cue]
    misconceptions:
      - id: MC-P15-030
        when: [nodata, cute]
        feedback:
          en: "It says the screen is empty, which people can see. It doesn't say what goes here, or how to add it."
          ar: "تقول إن الشاشة فارغة، والناس يرون ذلك. لكنها لا تقول ما الذي يوضع هنا، ولا كيف يُضاف."
    hints:
      - { en: "What would a new customer need to know to fill this screen?", ar: "ماذا يحتاج العميل الجديد أن يعرف ليملأ هذه الشاشة؟" }
      - { en: "Look for the text that teaches how to save something.", ar: "ابحث عن النص الذي يعلّم كيف يُحفظ شيء." }
    correct:
      en: "Right. It says what goes here, and how."
      ar: "صحيح. يقول ما الذي يوضع هنا، وكيف."
    explain:
      en: "An empty screen is a chance to teach. One line can explain the feature right when people need it."
      ar: "الشاشة الفارغة فرصة للتعليم. فسطر واحد يمكنه أن يشرح الميزة في اللحظة التي يحتاجها الناس."

  - id: S03
    type: card
    part: concept
    icons: [none, idea, tap, clock]
    title: { en: "Empty is a message, too", ar: "الفراغ رسالة أيضًا" }
    body:
      en: "When a screen has nothing to show, people wonder: is it loading? Is it broken? Did I do something wrong?\n\n- **Say what goes here, and how to add it:** \"Tap ♡ on any product to save it here.\"\n- **Give a direct way to start:** a button like \"Add address\", not just directions to another screen.\n- **Be honest about loading:** while content loads, show that it's loading. Say \"No orders yet\" only when you know there are none."
      ar: "حين لا يكون في الشاشة ما تعرضه، يتساءل الناس: هل ما زالت تُحمَّل؟ هل هي معطّلة؟ هل أخطأت في شيء؟\n\n- **قل ما الذي يوضع هنا، وكيف يُضاف:** «اضغط ♡ على أي منتج لتحفظه هنا.»\n- **أعطِ طريقًا مباشرًا للبدء:** زرًّا مثل «أضف عنوانًا»، لا مجرد إرشادات إلى شاشة أخرى.\n- **كن صادقًا بشأن التحميل:** أثناء تحميل المحتوى، أظهِر أنه يُحمَّل. وقل «لا توجد طلبات بعد» فقط حين تعرف أنه لا توجد."

  - id: S04
    type: choose
    skill: SK-P15-U05-01
    part: guided
    rules: [R06]
    value:
      en: "Empty States (NN/g): a common, harmful case is showing \"No records\" while content is still loading, then replacing it; inaccurate status messages for empty states are particularly harmful."
      ar: "الحالات الفارغة (NN/g): حالة شائعة وضارة هي عرض «لا توجد سجلات» بينما المحتوى ما زال يُحمَّل، ثم استبدالها؛ ورسائل الحالة غير الدقيقة في الشاشات الفارغة ضارة بشكل خاص."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "Inaccurate system-status messages for empty states are particularly harmful." }
    scenario:
      en: "When customers open \"My orders\", it says \"You have no orders\" for 3 seconds. Then their orders appear. Some leave before that and call us, worried."
      ar: "حين يفتح العملاء «طلباتي»، تظهر عبارة «ليس لديك طلبات» لمدة 3 ثوانٍ. ثم تظهر طلباتهم. وبعضهم يخرج قبل ذلك ويتصل بنا قلقًا."
    prompt:
      en: "What should this screen show?"
      ar: "ماذا يجب أن تعرض هذه الشاشة؟"
    options:
      - { id: faster, text: { en: "Keep the text, and try to make loading faster", ar: "أبقي النص، وأحاول جعل التحميل أسرع" } }
      - { id: blank, text: { en: "Show a blank screen until the orders load", ar: "أعرض شاشة فارغة حتى تُحمَّل الطلبات" } }
      - { id: honest, text: { en: "\"Loading your orders…\" with a spinner, and \"No orders yet\" only if there really are none", ar: "«جارٍ تحميل طلباتك…» مع مؤشّر تحميل، و«لا توجد طلبات بعد» فقط إن لم توجد فعلًا" } }
    answer: [honest]
    misconceptions:
      - id: MC-P15-031
        when: [faster]
        feedback:
          en: "Even for one second, \"You have no orders\" is false. People who believe it may never see their orders."
          ar: "حتى لثانية واحدة، عبارة «ليس لديك طلبات» غير صحيحة. ومن يصدّقها قد لا يرى طلباته أبدًا."
      - id: MC-P15-030
        when: [blank]
        feedback:
          en: "A blank screen makes people wonder if it's broken or still working."
          ar: "الشاشة الفارغة تجعل الناس يتساءلون هل هي معطّلة أم ما زالت تعمل."
    hints:
      - { en: "During those 3 seconds, what's really happening?", ar: "خلال هذه الثواني الثلاث، ما الذي يحدث فعلًا؟" }
      - { en: "Pick the option where every message is true when it's shown.", ar: "اختر الخيار الذي تكون فيه كل رسالة صحيحة وقت ظهورها." }
    correct:
      en: "Right. Say it's loading while it loads."
      ar: "صحيح. قل إنها تُحمَّل أثناء التحميل."
    explain:
      en: "\"Nothing here\" must mean nothing is here. Until you know, say it's loading."
      ar: "«لا يوجد شيء» يجب أن تعني أنه لا يوجد شيء فعلًا. وحتى تعرف، قل إنها تُحمَّل."

  - id: S05
    type: tune
    skill: SK-P15-U05-02
    part: guided
    rules: [R06]
    value:
      en: "Empty States (NN/g): instead of only describing what to do, give brief explicit instructions, or better, link directly to the steps that fill the empty state."
      ar: "الحالات الفارغة (NN/g): بدل أن تصف فقط ما يجب فعله، أعطِ تعليمات قصيرة وواضحة، أو الأفضل، رابطًا مباشرًا إلى الخطوات التي تملأ الشاشة الفارغة."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "A better approach is to provide brief yet explicit instructions or, better yet, link directly to the steps that need to be taken to complete tasks associated with populating the empty state." }
    scenario:
      en: "New customers have no delivery addresses yet. This is what they see at checkout."
      ar: "العملاء الجدد ليس لديهم عناوين توصيل بعد. وهذا ما يرونه عند الدفع."
    prompt:
      en: "Tap each option to see the change. Which version gets people to add an address fastest?"
      ar: "اضغط على كل خيار لترى التغيير. أي نسخة تجعل الناس يضيفون عنوانًا بأسرع طريقة؟"
    mock:
      app: dar
      appbar:
        title: {en: Checkout, ar: إتمام الطلب}
        back: true
      caption: {en: Now, ar: الآن}
      blocks:
      - kind: progress
        value: 50
        label: {en: Step 2 of 4, ar: الخطوة 2 من 4}
      - kind: heading
        text: {en: Delivery address, ar: عنوان التوصيل}
        gap: m
      - {kind: icon, icon: map-pin-line, size: l, color: muted, gap: m}
      - kind: small
        text:
          en: "You have no saved addresses. To add one, go to Settings > Account > Addresses."
          ar: "ليس لديك عناوين محفوظة. لتضيف عنوانًا، اذهب إلى الإعدادات > الحساب > العناوين."
        color: muted
        gap: xs
    options:
      - id: button
        text: { en: "Add an \"Add address\" button right here", ar: "أضف زر «أضف عنوانًا» هنا مباشرة" }
        mock:
          app: dar
          appbar:
            title: {en: Checkout, ar: إتمام الطلب}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: progress
            value: 50
            label: {en: Step 2 of 4, ar: الخطوة 2 من 4}
          - kind: heading
            text: {en: Delivery address, ar: عنوان التوصيل}
            gap: m
          - {kind: icon, icon: map-pin-line, size: l, color: muted, gap: m}
          - kind: small
            text: {en: Add an address so we know where to deliver., ar: أضف عنوانًا لنعرف أين نوصّل طلبك.}
            color: muted
            gap: xs
          - kind: button
            text: {en: Add address, ar: أضف عنوانًا}
            icon: plus
            gap: s
      - id: bold
        text: { en: "Make the directions bold", ar: "اجعل الإرشادات بخط Bold" }
        mock:
          app: dar
          appbar:
            title: {en: Checkout, ar: إتمام الطلب}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: progress
            value: 50
            label: {en: Step 2 of 4, ar: الخطوة 2 من 4}
          - kind: heading
            text: {en: Delivery address, ar: عنوان التوصيل}
            gap: m
          - {kind: icon, icon: map-pin-line, size: l, color: muted, gap: m}
          - kind: small
            text:
              en: "You have no saved addresses. To add one, go to **Settings > Account > Addresses**."
              ar: "ليس لديك عناوين محفوظة. لتضيف عنوانًا، اذهب إلى **الإعدادات > الحساب > العناوين**."
            color: muted
            gap: xs
      - id: short
        text: { en: "Shorten it to \"No addresses\"", ar: "اختصره إلى «لا توجد عناوين»" }
        mock:
          app: dar
          appbar:
            title: {en: Checkout, ar: إتمام الطلب}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: progress
            value: 50
            label: {en: Step 2 of 4, ar: الخطوة 2 من 4}
          - kind: heading
            text: {en: Delivery address, ar: عنوان التوصيل}
            gap: m
          - {kind: icon, icon: map-pin-line, size: l, color: muted, gap: m}
          - kind: small
            text: {en: No addresses, ar: لا توجد عناوين}
            color: muted
            gap: xs
    answer: [button]
    misconceptions:
      - id: MC-P15-032
        when: [bold]
        feedback:
          en: "Easier to see, but people still have to leave checkout and dig through 3 screens."
          ar: "أسهل في الرؤية، لكن على الناس أن يغادروا صفحة الدفع ويبحثوا في 3 شاشات."
      - id: MC-P15-030
        when: [short]
        feedback:
          en: "Shorter, but now people don't know how to add one at all."
          ar: "أقصر، لكن الناس الآن لا يعرفون كيف يضيفون عنوانًا على الإطلاق."
    hints:
      - { en: "Where are people right now? Do they want to leave?", ar: "أين الناس الآن؟ هل يريدون المغادرة؟" }
      - { en: "The fastest path starts on this screen.", ar: "أسرع طريق يبدأ من هذه الشاشة." }
    correct:
      en: "Right. One tap, and they never leave checkout."
      ar: "صحيح. ضغطة واحدة، ولا يغادرون صفحة الدفع أبدًا."
    explain:
      en: "Don't send people somewhere else to fill an empty screen. Bring the action to them."
      ar: "لا ترسل الناس إلى مكان آخر ليملؤوا الشاشة الفارغة. بل أحضِر الفعل إليهم."

  - id: S06
    type: compare
    skill: SK-P15-U05-02
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: a status message only vs a message with a direct path. Empty States (NN/g): provide direct pathways (links) to getting started with the key tasks that fill the empty state."
      ar: "مقارنة: رسالة حالة فقط مقابل رسالة مع طريق مباشر. الحالات الفارغة (NN/g): وفّر طرقًا مباشرة (روابط) للبدء في المهام الأساسية التي تملأ الشاشة الفارغة."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "Provide direct pathways (i.e., links) to getting started with key tasks related to populating the empty state." }
    scenario:
      en: "We added gift cards. Most customers have none yet, so the \"Gift cards\" screen is empty. We wrote two versions."
      ar: "أضفنا بطاقات الهدايا. ومعظم العملاء ليس لديهم أي بطاقة بعد، فشاشة «بطاقات الهدايا» فارغة. وكتبنا نسختين."
    prompt:
      en: "Which version helps people start using gift cards?"
      ar: "أي نسخة تساعد الناس على البدء في استخدام بطاقات الهدايا؟"
    a:
      label: { en: "A: The message explains, and a button starts the task.", ar: "A: الرسالة تشرح، وزر يبدأ المهمة." }
      mock:
        app: dar
        appbar:
          title: {en: Gift cards, ar: بطاقات الهدايا}
          back: true
        blocks:
        - {kind: image, art: box, size: m}
        - kind: small
          text: {en: Send a gift card to a friend in 2 minutes. Cards you get will show here too., ar: أرسل بطاقة هدية لصديق في دقيقتين. والبطاقات التي تصلك ستظهر هنا أيضًا.}
          color: muted
          gap: xs
        - kind: button
          text: {en: Send a gift card, ar: أرسل بطاقة هدية}
          gap: s
    b:
      label: { en: "B: The message says there are none.", ar: "B: الرسالة تقول إنه لا توجد بطاقات." }
      mock:
        app: dar
        appbar:
          title: {en: Gift cards, ar: بطاقات الهدايا}
          back: true
        blocks:
        - {kind: image, art: box, size: m}
        - kind: small
          text: {en: You have no gift cards. Gift cards can be bought in the Gifts section., ar: ليس لديك بطاقات هدايا. ويمكن شراء بطاقات الهدايا من قسم الهدايا.}
          color: muted
          gap: xs
    answer: a
    reason:
      prompt: { en: "Why does A work better?", ar: "لماذا تنجح A أكثر؟" }
      options:
        - { id: path, text: { en: "It says what the screen is for, and starts the task in one tap", ar: "تقول ما الغرض من الشاشة، وتبدأ المهمة بضغطة واحدة" } }
        - { id: friendly, text: { en: "It sounds friendlier", ar: "تبدو أكثر ودًّا" } }
        - { id: longer, text: { en: "Longer text is always more helpful", ar: "النص الأطول أكثر فائدة دائمًا" } }
      answer: [path]
      misconceptions:
        - id: MC-P15-032
          when: [friendly, longer]
          feedback:
            en: "Tone and length aren't the main difference. A gives a way to start right here."
            ar: "النبرة والطول ليسا الفرق الأساسي. A تعطي طريقًا للبدء هنا مباشرة."
    misconceptions:
      - id: MC-P15-032
        when: [b]
        feedback:
          en: "B points to another section and stops there. People have to go and find it themselves."
          ar: "B تشير إلى قسم آخر وتتوقّف. وعلى الناس أن يذهبوا ويبحثوا عنه بأنفسهم."
    hints:
      - { en: "In which version can people act without leaving the screen?", ar: "في أي نسخة يستطيع الناس التصرّف دون مغادرة الشاشة؟" }
      - { en: "Look for a button.", ar: "ابحث عن زر." }
    correct:
      en: "Right. Explain, then let them start."
      ar: "صحيح. اشرح، ثم دعهم يبدؤون."
    explain:
      en: "An empty screen should answer \"what now?\" with an action, not only with words."
      ar: "الشاشة الفارغة يجب أن تجيب عن «ماذا الآن؟» بفعل، لا بالكلمات فقط."

  - id: S07
    type: choose
    skill: SK-P15-U05-01
    part: guided
    rules: [R06]
    value:
      en: "Empty States (NN/g): an empty alerts panel misses a chance to educate; a brief message can say what alerts are and how to start using them."
      ar: "الحالات الفارغة (NN/g): لوحة التنبيهات الفارغة تُضيع فرصة للتعليم؛ ورسالة قصيرة يمكنها أن تقول ما التنبيهات وكيف تبدأ في استخدامها."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "A brief dialogue could provide information about what alerts are and how to get started using them." }
    scenario:
      en: "We have a \"Price alerts\" screen. Almost nobody knows what it does, and it's empty for everyone at first."
      ar: "عندنا شاشة «تنبيهات الأسعار». ولا يعرف أحد تقريبًا ما تفعله، وهي فارغة للجميع في البداية."
    prompt:
      en: "Which empty-screen text teaches people the feature?"
      ar: "أي نص للشاشة الفارغة يعلّم الناس الميزة؟"
    options:
      - { id: none, text: { en: "\"No alerts.\"", ar: "«لا توجد تنبيهات.»" } }
      - { id: name, text: { en: "\"Price alerts: 0\"", ar: "«تنبيهات الأسعار: 0»" } }
      - { id: teach, text: { en: "\"Get a message when a price drops. Tap 🔔 on any product to set an alert.\"", ar: "«تصلك رسالة حين ينخفض السعر. اضغط 🔔 على أي منتج لتضبط تنبيهًا.»" } }
    answer: [teach]
    misconceptions:
      - id: MC-P15-030
        when: [none, name]
        feedback:
          en: "True, but people still don't know what an alert is or why they'd want one."
          ar: "صحيح، لكن الناس ما زالوا لا يعرفون ما التنبيه ولماذا قد يريدونه."
    hints:
      - { en: "Most people don't know what this feature does yet.", ar: "معظم الناس لا يعرفون ما تفعله هذه الميزة بعد." }
      - { en: "Pick the text that explains the feature and how to start.", ar: "اختر النص الذي يشرح الميزة وكيف تبدأ." }
    correct:
      en: "Right. What it is, why it helps, and how to start."
      ar: "صحيح. ما هي، ولماذا تفيد، وكيف تبدأ."
    explain:
      en: "Teach a feature where people find it empty. That's when they're curious."
      ar: "علّم الميزة حيث يجدها الناس فارغة. ففي تلك اللحظة يكونون فضوليين."

  - id: S08
    type: choose
    skill: SK-P15-U05-02
    part: independent
    speaker: hana
    rules: [R14]
    value:
      en: "New case. Empty States (NN/g): an empty state can offer direct pathways into the workflow, so users get started with key tasks from right there."
      ar: "حالة جديدة. الحالات الفارغة (NN/g): الشاشة الفارغة يمكن أن تقدّم طرقًا مباشرة إلى سير العمل، فيبدأ المستخدمون المهام الأساسية من هناك."
    ref: { url: "https://www.nngroup.com/articles/empty-state-interface-design/", quote: "empty states can also be used to provide direct pathways for getting users started with key tasks" }
    scenario:
      en: "New members open \"My workouts\" in my gym app before their first class. It's empty."
      ar: "يفتح الأعضاء الجدد «تماريني» في تطبيق ناديّ قبل حصتهم الأولى. وهي فارغة."
    prompt:
      en: "Which empty screen gets new members moving?"
      ar: "أي شاشة فارغة تجعل الأعضاء الجدد يبدؤون؟"
    options:
      - { id: motto, text: { en: "\"No pain, no gain! 💪\"", ar: "«لا نجاح بلا تعب! 💪»" } }
      - { id: start, text: { en: "\"Your workouts will show here after your first class.\" with a \"Book your first class\" button", ar: "«ستظهر تمارينك هنا بعد حصتك الأولى.» مع زر «احجز حصتك الأولى»" } }
      - { id: menu, text: { en: "\"No workouts yet. Book a class from the Classes tab.\"", ar: "«لا توجد تمارين بعد. احجز حصة من تبويب الحصص.»" } }
    answer: [start]
    misconceptions:
      - id: MC-P15-030
        when: [motto]
        feedback:
          en: "Motivating, maybe, but it doesn't say what this screen is for or what to do."
          ar: "قد تكون محفّزة، لكنها لا تقول ما الغرض من الشاشة ولا ماذا يفعلون."
      - id: MC-P15-032
        when: [menu]
        feedback:
          en: "Clear, but it sends people to another tab instead of letting them book right here."
          ar: "واضحة، لكنها ترسل الناس إلى تبويب آخر بدل أن تتيح لهم الحجز هنا مباشرة."
    correct:
      en: "Right. It explains, and the first step is one tap away."
      ar: "صحيح. تشرح، والخطوة الأولى على بُعد ضغطة واحدة."
    explain:
      en: "Explain what will appear, then put the first step in reach."
      ar: "اشرح ما الذي سيظهر، ثم ضع الخطوة الأولى في المتناول."

  - id: S09
    type: card
    part: recap
    icons: [idea, tap, clock, ok]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Taught the feature:** \"Tap ♡ on any product to save it here.\"\n- **Honest loading:** \"Loading your orders…\", never a false \"no orders\".\n- **A direct path:** \"Add address\" right at checkout.\n- **Action, not directions:** \"Send a gift card\" beat \"buy them in the Gifts section\".\n- **Explain new features:** what price alerts are, and how to set one.\n\nNext lesson: notifications people want."
      ar: "- **علّمت الميزة:** «اضغط ♡ على أي منتج لتحفظه هنا.»\n- **تحميل صادق:** «جارٍ تحميل طلباتك…»، لا «لا توجد طلبات» غير صحيحة أبدًا.\n- **طريق مباشر:** «أضف عنوانًا» في صفحة الدفع نفسها.\n- **فعل لا إرشادات:** «أرسل بطاقة هدية» تفوّقت على «اشترِها من قسم الهدايا».\n- **اشرح الميزات الجديدة:** ما تنبيهات الأسعار، وكيف تضبط واحدًا.\n\nالدرس التالي: إشعارات يريدها الناس."
