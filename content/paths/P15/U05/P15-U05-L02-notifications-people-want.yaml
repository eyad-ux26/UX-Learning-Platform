id: P15-U05-L02
mode: lesson
minutes: 7
title:
  en: "Notifications people want"
  ar: "إشعارات يريدها الناس"
summary:
  en: "Decide when a bus app asks for notifications, what it says, and which alerts are worth sending."
  ar: "قرّر متى يطلب تطبيق حافلات الإذن بالإشعارات، وماذا يقول، وأي تنبيهات تستحق الإرسال."
speaker: rami
sources:
  - title: { en: "5 Mistakes in Designing Mobile Push Notifications (NN/g)", ar: "5 أخطاء في تصميم إشعارات الهاتف (NN/g)" }
    url: "https://www.nngroup.com/articles/push-notification/"
review_labels:
  MC-P15-033: { en: "Asking for notifications before people see any value", ar: "طلب الإذن بالإشعارات قبل أن يرى الناس أي فائدة" }
  MC-P15-034: { en: "The ask must say what the notifications will be about", ar: "طلب الإذن يجب أن يقول موضوع الإشعارات" }
  MC-P15-035: { en: "Many notifications at once irritate; combine them", ar: "الإشعارات الكثيرة دفعة واحدة مزعجة؛ فاجمعها" }
  MC-P15-036: { en: "Notifications about things that don't concern this person", ar: "إشعارات عن أشياء لا تخصّ هذا الشخص" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "\"Don't Allow\"", ar: "«عدم السماح»" }
    body:
      en: "I'm a junior designer on our bus-ticket app. The moment people open it for the first time, it asks: \"Rehla would like to send you notifications.\"\n\nMost tap \"Don't Allow\". Then they miss delay alerts we could have sent them."
      ar: "أنا مصمم مبتدئ في تطبيق تذاكر الحافلات. وفي اللحظة التي يفتح فيها الناس التطبيق لأول مرة، يسألهم: «يريد تطبيق رحلة أن يرسل لك إشعارات.»\n\nمعظمهم يضغط «عدم السماح». ثم تفوتهم تنبيهات التأخير التي كان يمكن أن نرسلها لهم."
    mock:
      app: rehla
      appbar: {logo: true}
      tabbar:
        active: 0
        items:
        - icon: magnifying-glass
          text: {en: Search, ar: البحث}
        - icon: ticket
          text: {en: My trips, ar: رحلاتي}
        - icon: bell
          text: {en: Alerts, ar: التنبيهات}
        - icon: user
          text: {en: Account, ar: حسابي}
      overlay:
        type: dialog
        blocks:
        - kind: heading
          text:
            en: "\"Rehla\" would like to send you notifications"
            ar: يريد «رحلة» أن يرسل لك إشعارات
        - kind: small
          text:
            en: "Notifications may include alerts, sounds and icon badges."
            ar: قد تشمل الإشعارات تنبيهات وأصواتًا وشارات على الأيقونة.
          color: muted
          gap: s
        - kind: row
          gap: m
          blocks:
          - kind: button
            text:
              en: "Don't Allow"
              ar: "عدم السماح"
            style: text
          - kind: button
            text: {en: Allow, ar: "السماح"}
            style: text
      blocks:
      - kind: searchbar
        text:
          en: "Where to?"
          ar: إلى أين؟
      - {kind: image, art: bus, size: m, gap: m}
      - kind: heading
        text: {en: Welcome to Rehla, ar: مرحبًا بك في رحلة}
        gap: s

  - id: S02
    type: choose
    skill: SK-P15-U05-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Push Notifications (NN/g): asking on first launch is so common that people barely read it and tap Don't Allow; use reciprocity and offer value first."
      ar: "جرّب أولًا. الإشعارات (NN/g): الطلب عند أول فتح شائع جدًا حتى إن الناس بالكاد يقرؤونه ويضغطون «لا تسمح»؛ فاستخدم مبدأ المعاملة بالمثل وقدّم فائدة أولًا."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "Instead, apps should take advantage of the reciprocity principle and offer users some value first." }
    prompt:
      en: "When should the app ask people to turn on notifications?"
      ar: "متى يجب أن يطلب التطبيق من الناس تشغيل الإشعارات؟"
    options:
      - { id: first, text: { en: "On first launch, so nobody misses the question", ar: "عند أول فتح، حتى لا يفوت السؤال أحدًا" } }
      - { id: always, text: { en: "Every time the app opens, until they say yes", ar: "في كل مرة يُفتح فيها التطبيق، حتى يوافقوا" } }
      - { id: after, text: { en: "Right after their first booking: \"Want an alert if your bus is late or the gate changes?\"", ar: "بعد أول حجز مباشرة: «هل تريد تنبيهًا إن تأخّرت حافلتك أو تغيّرت البوابة؟»" } }
    answer: [after]
    misconceptions:
      - id: MC-P15-033
        when: [first, always]
        feedback:
          en: "At that point, people haven't seen anything useful from the app. They have no reason to say yes."
          ar: "في تلك اللحظة، لم يرَ الناس أي شيء مفيد من التطبيق. وليس لديهم سبب للموافقة."
    hints:
      - { en: "When does a bus alert start to matter to someone?", ar: "متى يصبح تنبيه الحافلة مهمًا لشخص ما؟" }
      - { en: "People say yes more when they've already got something from the app.", ar: "الناس يوافقون أكثر حين يكونون قد حصلوا على شيء من التطبيق بالفعل." }
    correct:
      en: "Right. After booking, a delay alert is clearly useful."
      ar: "صحيح. بعد الحجز، يكون تنبيه التأخير مفيدًا بوضوح."
    explain:
      en: "Ask when the value is obvious. Right after a booking, people know why they'd want alerts."
      ar: "اطلب حين تكون الفائدة واضحة. فبعد الحجز مباشرة، يعرف الناس لماذا قد يريدون التنبيهات."

  - id: S03
    type: card
    part: concept
    icons: [clock, text, layers, target]
    title: { en: "Earn the right to interrupt", ar: "اجعل كل مقاطعة تستحقّ" }
    body:
      en: "Every notification interrupts someone. Make each one worth it.\n\n- **Ask at the right time:** after people have seen what the app does for them.\n- **Say what they'll get:** \"Alerts for delays and gate changes\", not \"We'd like to send you notifications\".\n- **Don't send bursts:** combine many updates into one message.\n- **Only what matters to them:** news about their own trip, not other people's."
      ar: "كل إشعار يقاطع شخصًا ما. فاجعل كل واحد يستحق ذلك.\n\n- **اطلب في الوقت المناسب:** بعد أن يرى الناس ما يقدّمه التطبيق لهم.\n- **قل ما سيحصلون عليه:** «تنبيهات التأخير وتغيير البوابة»، لا «نودّ أن نرسل لك إشعارات».\n- **لا ترسل سيلًا من الإشعارات:** اجمع التحديثات الكثيرة في رسالة واحدة.\n- **فقط ما يهمّهم:** أخبار رحلتهم هم، لا رحلات الآخرين."

  - id: S04
    type: words
    skill: SK-P15-U05-03
    part: guided
    rules: [R06]
    value:
      en: "Push Notifications (NN/g): the generic \"X would like to send you notifications\" focuses on what the company wants, not what the user gains; tell people what notifications will be about."
      ar: "الإشعارات (NN/g): العبارة العامة «يريد X أن يرسل لك إشعارات» تركّز على ما تريده الشركة، لا على ما يكسبه المستخدم؛ فأخبر الناس عمّا ستكون الإشعارات."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "Tell people what notifications will be about to increase the chance that they will accept your request." }
    scenario:
      en: "Before the phone's own pop-up, we show our own short message after the first booking."
      ar: "بعد أول حجز، وقبل أن تظهر نافذة النظام في الهاتف، نعرض رسالة قصيرة منّا."
    prompt:
      en: "Which message gives people a reason to say yes?"
      ar: "أي رسالة تعطي الناس سببًا للموافقة؟"
    options:
      - { id: want, text: { en: "\"We'd love to stay in touch! Turn on notifications.\"", ar: "«يسعدنا أن نبقى على تواصل! شغّل الإشعارات.»" } }
      - { id: value, text: { en: "\"Get an alert if your bus is late or your gate changes.\"", ar: "«احصل على تنبيه إن تأخّرت حافلتك أو تغيّرت بوابتك.»" } }
      - { id: news, text: { en: "\"Turn on notifications for news, offers and more.\"", ar: "«شغّل الإشعارات للأخبار والعروض والمزيد.»" } }
    answer: [value]
    misconceptions:
      - id: MC-P15-034
        when: [want]
        feedback:
          en: "This is about what we want. It doesn't say what people will get."
          ar: "هذه عمّا نريده نحن. ولا تقول ما الذي سيحصل عليه الناس."
      - id: MC-P15-036
        when: [news]
        feedback:
          en: "\"News, offers and more\" sounds like ads. Many people will say no to that."
          ar: "«الأخبار والعروض والمزيد» تبدو كالإعلانات. وكثيرون سيرفضون ذلك."
    hints:
      - { en: "Which message is about the traveler, not the company?", ar: "أي رسالة تخصّ المسافر، لا الشركة؟" }
      - { en: "Look for a specific alert people would want.", ar: "ابحث عن تنبيه محدد يريده الناس." }
    correct:
      en: "Right. People know exactly what they'll get."
      ar: "صحيح. الناس يعرفون بالضبط ما سيحصلون عليه."
    explain:
      en: "Name the alerts and why they help. A clear benefit makes \"Allow\" an easy choice."
      ar: "سمِّ التنبيهات ولماذا تفيد. فالفائدة الواضحة تجعل «اسمح» خيارًا سهلًا."

  - id: S05
    type: fix
    skill: SK-P15-U05-04
    part: guided
    rules: [R06]
    value:
      en: "Push Notifications (NN/g): bursts of notifications overwhelm and irritate users; if you have more than five to send at once, combine them into a single message."
      ar: "الإشعارات (NN/g): دفعات الإشعارات ترهق المستخدمين وتزعجهم؛ وإن كان لديك أكثر من خمسة إشعارات لإرسالها معًا، فاجمعها في رسالة واحدة."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "If you have more than five notifications that you need to send at once, combine them into a single message." }
    scenario:
      en: "Prices dropped on 6 trips that one traveler saved. The app sent 6 notifications in one minute."
      ar: "انخفضت أسعار 6 رحلات حفظها أحد المسافرين. فأرسل التطبيق 6 إشعارات في دقيقة واحدة."
    mock:
      app: rehla
      screen: lock
      blocks:
      - kind: notification
        title: {en: Price drop, ar: انخفاض سعر}
        text: {en: Cairo → Alexandria, ar: القاهرة ← الإسكندرية}
        time: {en: now, ar: الآن}
      - kind: notification
        title: {en: Price drop, ar: انخفاض سعر}
        text: {en: Cairo → Luxor, ar: القاهرة ← الأقصر}
        time: {en: now, ar: الآن}
      - kind: notification
        title: {en: Price drop, ar: انخفاض سعر}
        text: {en: Cairo → Aswan, ar: القاهرة ← أسوان}
        time: {en: now, ar: الآن}
      - kind: notification
        title: {en: Price drop, ar: انخفاض سعر}
        text: {en: Giza → Hurghada, ar: الجيزة ← الغردقة}
        time: {en: now, ar: الآن}
      - kind: small
        text:
          en: "+ 2 more"
          ar: "+ 2 أخرى"
        color: muted
        gap: xs
    prompt:
      en: "What should the app send instead?"
      ar: "ماذا يجب أن يرسل التطبيق بدلًا من ذلك؟"
    options:
      - { id: one, text: { en: "One notification: \"Prices dropped on 6 trips you saved. Cairo → Luxor is now EGP 380.\"", ar: "إشعارًا واحدًا: «انخفضت أسعار 6 رحلات حفظتها. القاهرة ← الأقصر الآن بـ 380 جنيهًا.»" } }
      - { id: spread, text: { en: "The same 6 notifications, one every hour", ar: "نفس الإشعارات الستة، واحدًا كل ساعة" } }
      - { id: vague, text: { en: "One notification: \"Something changed! Open the app 👀\"", ar: "إشعارًا واحدًا: «شيء ما تغيّر! افتح التطبيق 👀»" } }
    answer: [one]
    misconceptions:
      - id: MC-P15-035
        when: [spread]
        feedback:
          en: "Now the traveler is interrupted 6 times in a day instead of 6 times in a minute. Still too many."
          ar: "الآن يُقاطَع المسافر 6 مرات في اليوم بدل 6 مرات في الدقيقة. وما زال هذا كثيرًا."
      - id: MC-P15-036
        when: [vague]
        feedback:
          en: "One message, but it says nothing. People can't tell if it matters to them."
          ar: "رسالة واحدة، لكنها لا تقول شيئًا. ولا يعرف الناس هل تهمّهم."
    hints:
      - { en: "Can one message carry all 6 updates?", ar: "هل يمكن لرسالة واحدة أن تحمل التحديثات الستة؟" }
      - { en: "The best message also shows the most useful detail.", ar: "أفضل رسالة تُظهر أيضًا أهمّ تفصيل مفيد." }
    correct:
      en: "Right. One message, all the news, and a useful detail."
      ar: "صحيح. رسالة واحدة، وكل الأخبار، وتفصيل مفيد."
    explain:
      en: "Bundle updates that arrive together. One clear message beats six interruptions."
      ar: "اجمع التحديثات التي تصل معًا. فرسالة واحدة واضحة أفضل من ست مقاطعات."

  - id: S06
    type: compare
    skill: SK-P15-U05-04
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: relevant vs irrelevant. Push Notifications (NN/g): any notification is an interruption, and when the message is irrelevant to us, the interruption is irritating."
      ar: "مقارنة: مهمّ مقابل غير مهمّ. الإشعارات (NN/g): كل إشعار مقاطعة، وحين لا تخصّنا الرسالة تصبح المقاطعة مزعجة."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "When the message is irrelevant to us, the interruption is irritating." }
    scenario:
      en: "Marketing wants to send more notifications. These are two they suggested for the same traveler, who has a 9:00 bus tomorrow."
      ar: "يريد فريق التسويق إرسال إشعارات أكثر. وهذان إشعاران اقترحهما للمسافر نفسه، الذي لديه حافلة الساعة 9:00 غدًا."
    prompt:
      en: "Which notification is worth interrupting this traveler for?"
      ar: "أي إشعار يستحق مقاطعة هذا المسافر؟"
    a:
      label: { en: "A: News about other people's trips.", ar: "A: أخبار عن رحلات أشخاص آخرين." }
      mock:
        app: rehla
        screen: lock
        blocks:
        - kind: notification
          title: {en: Rehla, ar: رحلة}
          text:
            en: "\U0001F68C Someone near you just booked a trip to Aswan!"
            ar: "\U0001F68C شخص بالقرب منك حجز للتو رحلة إلى أسوان!"
          time: {en: now, ar: الآن}
    b:
      label: { en: "B: A change to this traveler's own trip.", ar: "B: تغيير في رحلة هذا المسافر نفسه." }
      mock:
        app: rehla
        screen: lock
        blocks:
        - kind: notification
          title: {en: Gate change, ar: تغيير البوابة}
          text:
            en: "\U0001F68C Your 9:00 bus to Alexandria now leaves from Gate 4."
            ar: "\U0001F68C حافلتك الساعة 9:00 إلى الإسكندرية تغادر الآن من البوابة 4."
          time: {en: now, ar: الآن}
    answer: b
    reason:
      prompt: { en: "Why is B worth sending?", ar: "لماذا يستحق B الإرسال؟" }
      options:
        - { id: own, text: { en: "It's about the traveler's own trip, and they need it to catch the bus", ar: "يخصّ رحلة المسافر نفسه، ويحتاجه ليلحق بالحافلة" } }
        - { id: short, text: { en: "It's shorter", ar: "لأنه أقصر" } }
        - { id: emoji, text: { en: "It has a bus emoji", ar: "لأن فيه رمز حافلة" } }
      answer: [own]
      misconceptions:
        - id: MC-P15-036
          when: [short, emoji]
          feedback:
            en: "Both have the emoji and are about the same length. B matters because it's about their trip."
            ar: "في الاثنين الرمز نفسه، وطولهما متقارب. B مهمّ لأنه يخصّ رحلة المسافر."
    misconceptions:
      - id: MC-P15-036
        when: [a]
        feedback:
          en: "Someone else's trip doesn't concern this traveler. It's an interruption with nothing in it for them."
          ar: "رحلة شخص آخر لا تخصّ هذا المسافر. فهي مقاطعة لا تقدّم له شيئًا."
    hints:
      - { en: "Which one would this traveler be upset to miss?", ar: "أيهما سينزعج المسافر إن فاته؟" }
      - { en: "Ask: does this concern this person?", ar: "اسأل: هل يخصّ هذا الشخص؟" }
    correct:
      en: "Right. Send what concerns them, skip the rest."
      ar: "صحيح. أرسل ما يخصّهم، واترك الباقي."
    explain:
      en: "Every irrelevant notification teaches people to ignore you, or to turn notifications off."
      ar: "كل إشعار لا يخصّ الشخص يعلّمه أن يتجاهلك، أو أن يوقف الإشعارات."

  - id: S07
    type: choose
    skill: SK-P15-U05-04
    part: guided
    rules: [R06]
    value:
      en: "Push Notifications (NN/g): don't send notifications for every little thing; provide relevant content aimed to inform and engage."
      ar: "الإشعارات (NN/g): لا ترسل إشعارًا لكل شيء صغير؛ بل قدّم محتوى مهمًا يُخبر ويشجّع على التفاعل."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "Instead, provide relevant content aimed to inform and engage." }
    scenario:
      en: "A traveler's booking for Friday is confirmed. The current notification says: \"You have an update!\""
      ar: "تأكّد حجز أحد المسافرين ليوم الجمعة. والإشعار الحالي يقول: «لديك تحديث!»"
    prompt:
      en: "Which notification tells the traveler what they need without opening the app?"
      ar: "أي إشعار يخبر المسافر بما يحتاجه دون أن يفتح التطبيق؟"
    options:
      - { id: tap, text: { en: "\"Tap to see your update 👉\"", ar: "«اضغط لترى تحديثك 👉»" } }
      - { id: hello, text: { en: "\"Hi! We have news for you 😊\"", ar: "«مرحبًا! لدينا أخبار لك 😊»" } }
      - { id: clear, text: { en: "\"Booked: Friday, 9:00 AM, Cairo → Alexandria, seat 14.\"", ar: "«تمّ الحجز: الجمعة، 9:00 صباحًا، القاهرة ← الإسكندرية، المقعد 14.»" } }
    answer: [clear]
    misconceptions:
      - id: MC-P15-036
        when: [tap, hello]
        feedback:
          en: "It hides the news to make people open the app. They can't tell if it matters, and it feels like a trick."
          ar: "يُخفي الخبر ليجعل الناس يفتحون التطبيق. ولا يعرفون هل يهمّهم، ويبدو كحيلة."
    hints:
      - { en: "What does the traveler want to know?", ar: "ماذا يريد المسافر أن يعرف؟" }
      - { en: "Pick the one you could read and put the phone away.", ar: "اختر الإشعار الذي تقرؤه ثم تضع الهاتف جانبًا." }
    correct:
      en: "Right. The facts are in the notification itself."
      ar: "صحيح. المعلومات داخل الإشعار نفسه."
    explain:
      en: "Put the news in the notification. People trust alerts that give them something every time."
      ar: "ضع الخبر داخل الإشعار. فالناس يثقون بالتنبيهات التي تعطيهم شيئًا في كل مرة."

  - id: S08
    type: choose
    skill: SK-P15-U05-03
    part: independent
    speaker: nour
    rules: [R14]
    value:
      en: "New case. Push Notifications (NN/g): let people experience the app first, and only later ask them to accept notifications."
      ar: "حالة جديدة. الإشعارات (NN/g): دع الناس يجرّبون التطبيق أولًا، ثم اطلب منهم لاحقًا قبول الإشعارات."
    ref: { url: "https://www.nngroup.com/articles/push-notification/", quote: "Allow them to experience the app and only in a later session ask them to accept notifications." }
    scenario:
      en: "Our clinic app asks for notifications on the welcome screen. I want more patients to get visit reminders."
      ar: "تطبيق العيادة يطلب الإذن بالإشعارات في شاشة الترحيب. وأريد أن يصل تذكير الزيارات إلى مرضى أكثر."
    prompt:
      en: "What's the best change?"
      ar: "ما التغيير الذي يجعل الأعضاء الجدد يرون فائدة التذكيرات حين يُطلب منهم الإذن؟"
    options:
      - { id: louder, text: { en: "Keep it on the welcome screen, but make the Allow button bigger", ar: "أبقيه في شاشة الترحيب، لكن أكبّر زر «اسمح»" } }
      - { id: booked, text: { en: "After a patient books a visit, ask: \"Want a reminder the day before your visit?\"", ar: "بعد أن يحجز المريض زيارة، أسأل: «هل تريد تذكيرًا قبل زيارتك بيوم؟»" } }
      - { id: generic, text: { en: "Ask on the welcome screen with \"Allow notifications to get the best experience\"", ar: "أسأل في شاشة الترحيب بعبارة «اسمح بالإشعارات لتحصل على أفضل تجربة»" } }
    answer: [booked]
    misconceptions:
      - id: MC-P15-033
        when: [louder]
        feedback:
          en: "A bigger button doesn't fix the timing. New patients still have no reason to say yes."
          ar: "الزر الأكبر لا يصلح التوقيت. فالمرضى الجدد ما زالوا بلا سبب للموافقة."
      - id: MC-P15-034
        when: [generic]
        feedback:
          en: "\"The best experience\" says nothing. Patients can't tell what they'll get."
          ar: "«أفضل تجربة» لا تقول شيئًا. ولا يعرف المرضى ما الذي سيحصلون عليه."
    correct:
      en: "Right. The right moment, and a clear reason."
      ar: "صحيح. اللحظة المناسبة، وسبب واضح."
    explain:
      en: "Ask when the notification would clearly help, and say what it will be."
      ar: "اطلب حين يكون الإشعار مفيدًا بوضوح، وقل ما الذي سيصلهم."

  - id: S09
    type: card
    part: recap
    icons: [clock, text, layers, target]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Right moment:** ask after the first booking, not on first launch.\n- **Say what they get:** \"Get an alert if your bus is late or your gate changes.\"\n- **No bursts:** 6 price drops became one message.\n- **Only what concerns them:** a gate change, not someone else's trip.\n- **News inside:** \"Booked: Friday, 9:00 AM…\", not \"You have an update!\".\n\nNext: a skill check on this unit."
      ar: "- **اللحظة المناسبة:** اطلب بعد أول حجز، لا عند أول فتح.\n- **قل ما سيحصلون عليه:** «احصل على تنبيه إن تأخّرت حافلتك أو تغيّرت بوابتك.»\n- **لا سيل من الإشعارات:** أصبحت 6 انخفاضات في الأسعار رسالة واحدة.\n- **فقط ما يخصّهم:** تغيير البوابة، لا رحلة شخص آخر.\n- **الخبر في الداخل:** «تمّ الحجز: الجمعة، 9:00 صباحًا…»، لا «لديك تحديث!».\n\nالتالي: اختبار مهارات هذه الوحدة."
