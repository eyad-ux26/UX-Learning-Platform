id: P15-U02
free: false
title:
  en: "Say more with fewer words"
  ar: "قل أكثر بكلمات أقل"
skill:
  en: "Cut the words readers don't need, keep the ones that make the meaning clear, say who does what, and write facts as numbers."
  ar: "احذف الكلمات التي لا يحتاجها القارئ، وأبقِ ما يوضّح المعنى، وقل من يفعل ماذا، واكتب الحقائق بالأرقام."
skills:
  - id: SK-P15-U02-01
    title: { en: "Cut filler, repeats and fancy words", ar: "احذف الحشو والتكرار والكلمات المتكلّفة" }
    can_do: { en: "Remove warm-up sentences, words like \"very\", repeated ideas and fancy words like \"utilize\", without losing meaning.", ar: "احذف جمل التمهيد، وكلمات مثل «جدًا»، والأفكار المكرّرة، والكلمات المتكلّفة، دون أن يضيع المعنى." }
  - id: SK-P15-U02-02
    title: { en: "Keep the words that make it clear", ar: "أبقِ الكلمات التي توضّح المعنى" }
    can_do: { en: "Add or keep a few words when they tell people what will happen or what they need to decide.", ar: "أضف أو أبقِ بعض الكلمات حين تخبر الناس بما سيحدث أو بما يحتاجونه ليقرّروا." }
  - id: SK-P15-U02-03
    title: { en: "Say who does what", ar: "قل من يفعل ماذا" }
    can_do: { en: "Write active sentences that name who must act, and positive steps instead of double negatives.", ar: "اكتب جملًا تذكر من عليه أن يتصرّف، وخطوات مثبتة بدل النفي المزدوج." }
  - id: SK-P15-U02-04
    title: { en: "Write facts as numbers", ar: "اكتب الحقائق بالأرقام" }
    can_do: { en: "Use digits for specific facts, explain unusual units, and keep words for numbers that aren't exact facts.", ar: "استخدم الأرقام للحقائق المحددة، واشرح الوحدات غير المألوفة، واترك الكلمات للأعداد التي ليست حقائق دقيقة." }
