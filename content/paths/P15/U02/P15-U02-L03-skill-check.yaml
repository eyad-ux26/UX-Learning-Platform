id: P15-U02-L03
mode: check
minutes: 5
title:
  en: "Skill check: say more with fewer words"
  ar: "اختبار المهارة: قل أكثر بكلمات أقل"
summary:
  en: "Edit a bus-ticket app's text on your own: cut, keep what's needed, name who acts, and use digits."
  ar: "حرّر وحدك نصوص تطبيق لتذاكر الحافلات: احذف، وأبقِ الضروري، واذكر الفاعل، واستخدم الأرقام."
speaker: rami
sources:
  - title: { en: "Tips and Tricks for Rewriting Content for Brevity (NN/g)", ar: "نصائح لإعادة كتابة المحتوى باختصار (NN/g)" }
    url: "https://www.nngroup.com/articles/rewriting-content-brevity/"
  - title: { en: "The 3 C's of Microcopy: Clarity, Concision, and Character (NN/g)", ar: "قواعد الـ Microcopy الثلاث: الوضوح والإيجاز والشخصية (NN/g)" }
    url: "https://www.nngroup.com/articles/3-cs-microcopy/"
  - title: { en: "Show Numbers as Numerals When Writing for Online Readers (NN/g)", ar: "اكتب الأعداد بالأرقام لقرّاء الإنترنت (NN/g)" }
    url: "https://www.nngroup.com/articles/web-writing-show-numbers-as-numerals/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Rami's first app", ar: "أول تطبيق لرامي" }
    body:
      en: "I'm a junior designer, and this is my first app at work: a bus-ticket app. People book on their phones, often while standing in the station.\n\nYour job: fix four pieces of my text.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "أنا مصمم مبتدئ، وهذا أول تطبيق أعمل عليه: تطبيق لتذاكر الحافلات. والناس يحجزون من هواتفهم، وغالبًا وهم واقفون في المحطة.\n\nمهمّتك: أصلح أربعة من نصوصي.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      app: rehla
      appbar: {logo: true}
      tabbar:
        active: 0
        items:
        - icon: magnifying-glass
          text: {en: Search, ar: البحث}
        - icon: ticket
          text: {en: My trips, ar: رحلاتي}
        - icon: bell
          text: {en: Alerts, ar: التنبيهات}
        - icon: user
          text: {en: Account, ar: حسابي}
      blocks:
      - kind: searchbar
        text: {en: Cairo → Alexandria · Today, ar: القاهرة ← الإسكندرية · اليوم}
        filled: true
      - kind: listitem
        icon: bus
        text:
          en: "9:00 AM → 1:30 PM"
          ar: "9:00 ص ← 1:30 م"
        sub:
          en: "1 stop · 18 seats left"
          ar: توقّف واحد · 18 مقعدًا متاحًا
        value:
          en: EGP 180
          ar: "180 جنيه"
        gap: m
      - kind: listitem
        icon: bus
        text:
          en: "11:00 AM → 3:15 PM"
          ar: "11:00 ص ← 3:15 م"
        sub: {en: Direct · 4 seats left, ar: مباشر · 4 مقاعد متاحة}
        value:
          en: EGP 210
          ar: "210 جنيه"

  - id: S02
    type: words
    skill: SK-P15-U02-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. Rewriting for Brevity (NN/g): an opening clause like \"As we all know\" offers nothing important and is better removed."
      ar: "اختبار مهارة. الاختصار (NN/g): عبارة افتتاحية مثل «كما نعلم جميعًا» لا تضيف شيئًا مهمًا، ومن الأفضل حذفها."
    ref: { url: "https://www.nngroup.com/articles/rewriting-content-brevity/", quote: "In the remove example, the dependent clause offers nothing important and is better off removed." }
    scenario:
      en: "On the trip screen I wrote: \"As we all know, buses on this route can sometimes get full, so it is really very important to book your seat early.\""
      ar: "في شاشة الرحلة كتبت: «كما نعلم جميعًا، قد تمتلئ الحافلات على هذا الخط أحيانًا، لذلك من المهم حقًا جدًا أن تحجز مقعدك مبكرًا.»"
    prompt:
      en: "Which line keeps the meaning and cuts the empty words?"
      ar: "أي سطر يحتفظ بالمعنى ويحذف الكلمات الفارغة؟"
    options:
      - { id: know, text: { en: "\"As we all know, this route fills up. Book early.\"", ar: "«كما نعلم جميعًا، هذا الخط يمتلئ. احجز مبكرًا.»" } }
      - { id: note, text: { en: "\"Please note: it is very important to book early.\"", ar: "«يرجى الانتباه: من المهم جدًا أن تحجز مبكرًا.»" } }
      - { id: plain, text: { en: "\"This route often fills up. Book your seat early.\"", ar: "«هذا الخط يمتلئ كثيرًا. احجز مقعدك مبكرًا.»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P15-003
        when: [know]
        feedback:
          en: "\"As we all know\" is still there. It's a warm-up that tells people nothing."
          ar: "«كما نعلم جميعًا» ما زالت موجودة. وهي تمهيد لا يخبر الناس بشيء."
      - id: MC-P15-008
        when: [note]
        feedback:
          en: "\"Please note\" and \"very important\" add words, and the reason, a full bus, is gone."
          ar: "«يرجى الانتباه» و«من المهم جدًا» تضيفان كلمات، والسبب، أي امتلاء الحافلة، اختفى."
    explain:
      en: "From Lesson 1: cut warm-ups and words like \"very\". Keep the fact and the action."
      ar: "من الدرس 1: احذف التمهيد وكلمات مثل «جدًا». وأبقِ المعلومة والفعل."

  - id: S03
    type: choose
    skill: SK-P15-U02-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. 3 C's of Microcopy (NN/g): a sold-out button that says the problem and the solution, in a few words, reduces friction."
      ar: "اختبار مهارة. قواعد الـ Microcopy الثلاث (NN/g): زر نفاد الكمية الذي يقول المشكلة والحل بكلمات قليلة يقلّل العوائق."
    ref: { url: "https://www.nngroup.com/articles/3-cs-microcopy/", quote: "concisely informs users of the problem and the solution, reducing friction." }
    scenario:
      en: "When a trip has no seats left, its button says \"Unavailable\". People tap it again and again, then leave the app."
      ar: "حين لا يبقى في الرحلة مقاعد، يقول زرّها «غير متاح». فيضغط الناس عليه مرة بعد مرة، ثم يخرجون من التطبيق."
    prompt:
      en: "Which button label tells people why they can't book, and what they can do next?"
      ar: "أي نص للزر يخبر الناس لماذا لا يستطيعون الحجز، وماذا يمكنهم أن يفعلوا بعد ذلك؟"
    options:
      - { id: notify, text: { en: "\"Sold out · Tell me if a seat opens\"", ar: "«نفدت المقاعد · أخبرني إن توفّر مقعد»" } }
      - { id: soldout, text: { en: "\"Sold out\"", ar: "«نفدت المقاعد»" } }
      - { id: sorry, text: { en: "\"Sorry!\"", ar: "«نعتذر!»" } }
    answer: [notify]
    misconceptions:
      - id: MC-P15-010
        when: [soldout, sorry]
        feedback:
          en: "This is short, but people still don't know what they can do. Many will just leave."
          ar: "هذا قصير، لكن الناس ما زالوا لا يعرفون ماذا يمكنهم أن يفعلوا. وكثيرون سيغادرون التطبيق ببساطة."
    explain:
      en: "From Lesson 1: clear comes first. A few extra words are worth it when they give people a next step."
      ar: "من الدرس 1: الوضوح أولًا. وبعض الكلمات الزائدة تستحق مكانها حين تعطي الناس خطوة تالية."

  - id: S04
    type: choose
    skill: SK-P15-U02-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Rewriting for Brevity (NN/g): to spot passive voice, add \"by zombies\" to the end of the sentence; if it still makes sense, it is passive."
      ar: "اختبار مهارة. الاختصار (NN/g): لتكتشف المبني للمجهول، أضف «بواسطة الزومبي» إلى آخر الجملة؛ فإن بقي لها معنى فهي مبنية للمجهول."
    ref: { url: "https://www.nngroup.com/articles/rewriting-content-brevity/", quote: "If the sentence still makes sense, then it is passive." }
    scenario:
      en: "On the booking screen I wrote: \"The seat must be chosen before payment.\" Many people pay first, because they think the app picks a seat for them."
      ar: "في شاشة الحجز كتبت: «يجب أن يُختار المقعد قبل الدفع.» وكثيرون يدفعون أولًا، لأنهم يظنون أن التطبيق يختار لهم مقعدًا."
    prompt:
      en: "Which rewrite tells people that choosing the seat is their job?"
      ar: "أي صياغة تخبر الناس أن اختيار المقعد مهمتهم هم؟"
    options:
      - { id: selection, text: { en: "\"Seat selection is required before payment.\"", ar: "«اختيار المقعد مطلوب قبل الدفع.»" } }
      - { id: choose, text: { en: "\"Choose your seat, then pay.\"", ar: "«اختر مقعدك، ثم ادفع.»" } }
      - { id: assigned, text: { en: "\"Seats are chosen before payment is made.\"", ar: "«تُختار المقاعد قبل أن يتم الدفع.»" } }
    answer: [choose]
    misconceptions:
      - id: MC-P15-011
        when: [selection, assigned]
        feedback:
          en: "Who chooses? This still doesn't say, so people may keep thinking the app does it."
          ar: "من يختار؟ ما زالت الجملة لا تقول، فقد يبقى الناس يظنون أن التطبيق يفعل ذلك."
    explain:
      en: "From Lesson 2: name who must act. Speaking to people as \"you\" makes their task clear."
      ar: "من الدرس 2: اذكر من عليه أن يتصرّف. ومخاطبة الناس مباشرة توضّح لهم مهمتهم."

  - id: S05
    type: tune
    skill: SK-P15-U02-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. Show Numbers as Numerals (NN/g): digits enhance the scannability of web content."
      ar: "اختبار مهارة. اكتب الأعداد بالأرقام (NN/g): الأرقام تجعل المحتوى أسهل في التصفّح السريع."
    ref: { url: "https://www.nngroup.com/articles/web-writing-show-numbers-as-numerals/", quote: "Digits enhance the scannability of web content." }
    scenario:
      en: "This is the trip summary people check before they pay."
      ar: "هذا ملخص الرحلة الذي يراجعه الناس قبل أن يدفعوا."
    prompt:
      en: "Tap each option to see the change. Which summary lets people check the trip length and the stop at a glance?"
      ar: "اضغط على كل خيار لترى التغيير. أي ملخص يجعل الناس يعرفون مدة الرحلة والتوقّف بنظرة سريعة؟"
    mock:
      app: rehla
      appbar:
        title: {en: Review your trip, ar: راجع رحلتك}
        back: true
      caption: {en: Now, ar: الآن}
      footer:
      - kind: button
        text: {en: Pay EGP 180, ar: ادفع 180 جنيهًا}
      blocks:
      - kind: card
        blocks:
        - kind: row
          blocks:
          - kind: heading
            text: {en: Cairo → Alexandria, ar: القاهرة ← الإسكندرية}
          - kind: price
            text:
              en: EGP 180
              ar: "180 جنيه"
        - kind: small
          text:
            en: "Today · 9:00 AM · Seat 12"
            ar: "اليوم · 9:00 ص · المقعد 12"
          color: muted
          gap: xs
        - {kind: divider, gap: s}
        - kind: meta
          text: {en: Trip summary, ar: ملخص الرحلة}
          weight: bold
          gap: s
        - kind: text
          text:
            en: "The trip takes about four and a half hours, with one stop of twenty minutes."
            ar: تستغرق الرحلة نحو أربع ساعات ونصف، مع توقّف واحد مدته عشرون دقيقة.
          gap: xs
    options:
      - id: bold
        text: { en: "Make the number words bold", ar: "اجعل الأعداد المكتوبة بالحروف بخط Bold" }
        mock:
          app: rehla
          appbar:
            title: {en: Review your trip, ar: راجع رحلتك}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          footer:
          - kind: button
            text: {en: Pay EGP 180, ar: ادفع 180 جنيهًا}
          blocks:
          - kind: card
            blocks:
            - kind: row
              blocks:
              - kind: heading
                text: {en: Cairo → Alexandria, ar: القاهرة ← الإسكندرية}
              - kind: price
                text:
                  en: EGP 180
                  ar: "180 جنيه"
            - kind: small
              text:
                en: "Today · 9:00 AM · Seat 12"
                ar: "اليوم · 9:00 ص · المقعد 12"
              color: muted
              gap: xs
            - {kind: divider, gap: s}
            - kind: meta
              text: {en: Trip summary, ar: ملخص الرحلة}
              weight: bold
              gap: s
            - kind: text
              text:
                en: "The trip takes about **four and a half hours**, with **one** stop of **twenty minutes**."
                ar: "تستغرق الرحلة نحو **أربع ساعات ونصف**، مع توقّف **واحد** مدته **عشرون دقيقة**."
              gap: xs
      - id: vague
        text: { en: "Shorten it to \"A few hours, with a short break.\"", ar: "اختصره إلى «بضع ساعات، مع استراحة قصيرة.»" }
        mock:
          app: rehla
          appbar:
            title: {en: Review your trip, ar: راجع رحلتك}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          footer:
          - kind: button
            text: {en: Pay EGP 180, ar: ادفع 180 جنيهًا}
          blocks:
          - kind: card
            blocks:
            - kind: row
              blocks:
              - kind: heading
                text: {en: Cairo → Alexandria, ar: القاهرة ← الإسكندرية}
              - kind: price
                text:
                  en: EGP 180
                  ar: "180 جنيه"
            - kind: small
              text:
                en: "Today · 9:00 AM · Seat 12"
                ar: "اليوم · 9:00 ص · المقعد 12"
              color: muted
              gap: xs
            - {kind: divider, gap: s}
            - kind: meta
              text: {en: Trip summary, ar: ملخص الرحلة}
              weight: bold
              gap: s
            - kind: text
              text:
                en: "A few hours, with a short break."
                ar: بضع ساعات، مع استراحة قصيرة.
              gap: xs
      - id: digits
        text: { en: "Write the times as digits", ar: "اكتب الأوقات بالأرقام" }
        mock:
          app: rehla
          appbar:
            title: {en: Review your trip, ar: راجع رحلتك}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          footer:
          - kind: button
            text: {en: Pay EGP 180, ar: ادفع 180 جنيهًا}
          blocks:
          - kind: card
            blocks:
            - kind: row
              blocks:
              - kind: heading
                text: {en: Cairo → Alexandria, ar: القاهرة ← الإسكندرية}
              - kind: price
                text:
                  en: EGP 180
                  ar: "180 جنيه"
            - kind: small
              text:
                en: "Today · 9:00 AM · Seat 12"
                ar: "اليوم · 9:00 ص · المقعد 12"
              color: muted
              gap: xs
            - {kind: divider, gap: s}
            - kind: meta
              text: {en: Trip summary, ar: ملخص الرحلة}
              weight: bold
              gap: s
            - kind: text
              text:
                en: "About 4 h 30 min, with 1 stop of 20 min."
                ar: نحو 4 ساعات و30 دقيقة، مع توقّف واحد مدته 20 دقيقة.
              gap: xs
    answer: [digits]
    misconceptions:
      - id: MC-P15-013
        when: [bold]
        feedback:
          en: "Bold words still read slower than digits. \"4 h 30 min\" is faster to spot than \"four and a half hours\"."
          ar: "الكلمات بخط Bold ما زالت أبطأ في القراءة من الأرقام. و«4 ساعات و30 دقيقة» أسرع في الرؤية من «أربع ساعات ونصف»."
      - id: MC-P15-010
        when: [vague]
        feedback:
          en: "\"A few hours\" hides the real length. People planning their day need the exact time."
          ar: "«بضع ساعات» تُخفي المدة الحقيقية. ومن يخطّط ليومه يحتاج الوقت الدقيق."
    explain:
      en: "From Lesson 2: digits stand out when people scan for a fact, like how long a trip takes."
      ar: "من الدرس 2: الأرقام تبرز حين يبحث الناس عن معلومة، مثل مدة الرحلة."
