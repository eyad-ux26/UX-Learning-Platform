id: P15-U02-B01
mode: bank
title:
  en: "Re-tests: say more with fewer words"
  ar: "إعادة اختبار: قل أكثر بكلمات أقل"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "Tips and Tricks for Rewriting Content for Brevity (NN/g)", ar: "نصائح لإعادة كتابة المحتوى باختصار (NN/g)" }
    url: "https://www.nngroup.com/articles/rewriting-content-brevity/"
  - title: { en: "The 3 C's of Microcopy: Clarity, Concision, and Character (NN/g)", ar: "قواعد الـ Microcopy الثلاث: الوضوح والإيجاز والشخصية (NN/g)" }
    url: "https://www.nngroup.com/articles/3-cs-microcopy/"
  - title: { en: "Passive Voice Is Redeemed for Web Headings (NN/g)", ar: "صيغة المبني للمجهول مقبولة في عناوين الويب (NN/g)" }
    url: "https://www.nngroup.com/articles/passive-voice-is-redeemed-for-web/"
  - title: { en: "Show Numbers as Numerals When Writing for Online Readers (NN/g)", ar: "اكتب الأعداد بالأرقام لقرّاء الإنترنت (NN/g)" }
    url: "https://www.nngroup.com/articles/web-writing-show-numbers-as-numerals/"
steps:
  - id: S01
    type: choose
    skill: SK-P15-U02-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. Rewriting for Brevity (NN/g): \"kill your darlings\"; a friendly opening like \"Let's face it\" did not add enough value to justify the extra length."
      ar: "إعادة اختبار. الاختصار (NN/g): «تخلَّ عن العبارات التي تحبها»؛ فبداية ودّية مثل «لنعترف بذلك» لم تضف قيمة تبرّر الطول الزائد."
    ref: { url: "https://www.nngroup.com/articles/rewriting-content-brevity/", quote: "it did not add enough value to justify the extra length." }
    scenario:
      en: "I wrote the text on my gym's coaching page, and I love it: \"Let's face it: working out alone is hard. That's exactly why our truly amazing coaches are here for you. Each coach builds a plan that fits your level.\""
      ar: "كتبت نص صفحة المدرّبين في ناديّ، وأنا أحبه: «لنكن صريحين: التمرين وحدك صعب. ولهذا تحديدًا مدرّبونا الرائعون حقًا هنا من أجلك. كل مدرّب يضع خطة تناسب مستواك.»"
    prompt:
      en: "Which version keeps what people need to know, and cuts the rest?"
      ar: "أي نسخة تحتفظ بما يحتاج الناس أن يعرفوه، وتحذف الباقي؟"
    options:
      - { id: face, text: { en: "\"Let's face it: working out alone is hard. Our coaches are here for you.\"", ar: "«لنكن صريحين: التمرين وحدك صعب. مدرّبونا هنا من أجلك.»" } }
      - { id: plan, text: { en: "\"Each coach builds a plan that fits your level.\"", ar: "«كل مدرّب يضع خطة تناسب مستواك.»" } }
      - { id: amazing, text: { en: "\"Our truly amazing coaches are here for you.\"", ar: "«مدرّبونا الرائعون حقًا هنا من أجلك.»" } }
    answer: [plan]
    misconceptions:
      - id: MC-P15-003
        when: [face]
        feedback:
          en: "The friendly opening stayed, and the one useful fact, a plan for your level, was cut."
          ar: "بقيت البداية الودّية، وحُذفت المعلومة المفيدة الوحيدة، أي الخطة التي تناسب مستواك."
      - id: MC-P15-008
        when: [amazing]
        feedback:
          en: "\"Truly amazing\" is praise, not a fact. People still don't know what the coaches do."
          ar: "«الرائعون حقًا» مديح، لا معلومة. والناس ما زالوا لا يعرفون ماذا يفعل المدرّبون."
    correct:
      en: "Right. One line, and it says what you get."
      ar: "صحيح. سطر واحد، ويقول ما ستحصل عليه."
    explain:
      en: "Even lines you love must earn their place. Keep the one that tells people what they get."
      ar: "حتى السطور التي تحبها يجب أن تستحق مكانها. أبقِ السطر الذي يخبر الناس بما سيحصلون عليه."

  - id: S02
    type: words
    skill: SK-P15-U02-01
    part: retest
    speaker: karim
    value:
      en: "Re-test. Rewriting for Brevity (NN/g): expletives like \"There is\" and \"It is\" take up space but add little; rearrange the sentence to remove them."
      ar: "إعادة اختبار. الاختصار (NN/g): بدايات مثل «هناك» و«إنه» تشغل مساحة ولا تضيف الكثير؛ أعد ترتيب الجملة لتحذفها."
    ref: { url: "https://www.nngroup.com/articles/rewriting-content-brevity/", quote: "Luckily, expletives are easy to correct. Just rearrange the sentence to remove the expletive." }
    scenario:
      en: "I'm building the upload screen. The developer text I wrote says: \"There is a problem that has occurred with the uploading of your file, and it was not uploaded.\""
      ar: "أبني شاشة رفع الملفات. والنص الذي كتبته يقول: «هناك مشكلة قد حدثت أثناء عملية رفع ملفك، ولم يتم رفعه.»"
    prompt:
      en: "Which message says the same thing in the fewest clear words?"
      ar: "أي رسالة تقول نفس الشيء بأقل عدد من الكلمات الواضحة؟"
    options:
      - { id: short, text: { en: "\"Your file didn't upload. Try again.\"", ar: "«لم يُرفع ملفك. حاول مرة أخرى.»" } }
      - { id: there, text: { en: "\"There was an upload problem with your file.\"", ar: "«هناك مشكلة في رفع ملفك.»" } }
      - { id: error, text: { en: "\"Error.\"", ar: "«خطأ.»" } }
    answer: [short]
    misconceptions:
      - id: MC-P15-009
        when: [there]
        feedback:
          en: "Shorter, but it still starts with \"There was\", and it doesn't tell people what to do."
          ar: "أقصر، لكنها ما زالت تبدأ بـ «هناك»، ولا تخبر الناس بما عليهم فعله."
      - id: MC-P15-010
        when: [error]
        feedback:
          en: "One word, but people don't know what failed or what to do next."
          ar: "كلمة واحدة، لكن الناس لا يعرفون ما الذي فشل ولا ماذا يفعلون بعد ذلك."
    correct:
      en: "Right. What happened, then what to do."
      ar: "صحيح. ماذا حدث، ثم ماذا تفعل."
    explain:
      en: "Start with the real subject, \"your file\". Words like \"There is\" only push it later."
      ar: "ابدأ بالموضوع الحقيقي، «ملفك». فكلمات مثل «هناك» تؤخّره فقط."

  - id: S03
    type: choose
    skill: SK-P15-U02-02
    part: retest
    speaker: sara
    value:
      en: "Re-test. 3 C's of Microcopy (NN/g): clarity includes appropriate terminology, so users are informed of what words and phrases mean; a card page for students explained terms new to them."
      ar: "إعادة اختبار. قواعد الـ Microcopy الثلاث (NN/g): الوضوح يشمل اختيار المصطلحات المناسبة، حتى يعرف المستخدمون معنى الكلمات والعبارات؛ فصفحة بطاقات للطلاب شرحت المصطلحات الجديدة عليهم."
    ref: { url: "https://www.nngroup.com/articles/3-cs-microcopy/", quote: "Appropriate terminology, so users are informed of what words and phrases mean" }
    scenario:
      en: "I'm designing a banking app for university students. Most have never bought in instalments. The offer card says only: \"BNPL for 6 months\"."
      ar: "أصمّم تطبيقًا بنكيًا لطلاب الجامعة. ومعظمهم لم يشتروا بالتقسيط من قبل. وبطاقة العرض تقول فقط: «BNPL لمدة 6 أشهر»."
    prompt:
      en: "Which offer line will these students understand, and still read quickly?"
      ar: "أي سطر للعرض سيفهمه هؤلاء الطلاب، ويقرؤونه بسرعة أيضًا؟"
    options:
      - { id: apr, text: { en: "\"BNPL for 6 months. Terms apply.\"", ar: "«BNPL لمدة 6 أشهر. تُطبَّق الشروط والأحكام.»" } }
      - { id: long, text: { en: "A paragraph that explains how instalment plans are worked out", ar: "فقرة تشرح كيف تُحسب خطط التقسيط" } }
      - { id: plain, text: { en: "\"Buy now, pay over 6 months: no extra cost on what you buy\"", ar: "«اشترِ الآن وقسّط على 6 أشهر: دون أي تكلفة إضافية على ما تشتريه»" } }
    answer: [plain]
    misconceptions:
      - id: MC-P15-010
        when: [apr]
        feedback:
          en: "Short, but these students don't know what \"BNPL\" means. Short only works if it's clear."
          ar: "قصير، لكن هؤلاء الطلاب لا يعرفون معنى «BNPL». والنص القصير ينجح فقط إن كان واضحًا."
      - id: MC-P15-009
        when: [long]
        feedback:
          en: "Clear, but far more than people need to decide. Most will skip the paragraph."
          ar: "واضحة، لكنها أكثر بكثير مما يحتاجه الناس ليقرّروا. ومعظمهم سيتجاوز الفقرة."
    correct:
      en: "Right. A few plain words explain the term."
      ar: "صحيح. كلمات بسيطة قليلة تشرح المصطلح."
    explain:
      en: "Write for the people reading. If a term may be new to them, add the few words that explain it."
      ar: "اكتب لمن يقرأ. وإن كان المصطلح جديدًا عليهم، فأضف الكلمات القليلة التي تشرحه."

  - id: S04
    type: compare
    skill: SK-P15-U02-02
    part: retest
    speaker: tarek
    value:
      en: "Re-test. 3 C's of Microcopy (NN/g): clear microcopy includes relevance, so users know why something applies or is valuable to them."
      ar: "إعادة اختبار. قواعد الـ Microcopy الثلاث (NN/g): النص الواضح يشمل الصلة، حتى يعرف المستخدمون لماذا يخصّهم الشيء أو لماذا يفيدهم."
    ref: { url: "https://www.nngroup.com/articles/3-cs-microcopy/", quote: "Relevance, so users know why something applies or is valuable to them" }
    scenario:
      en: "In my food app's checkout, many people skip the optional \"Building number\" field. Then drivers call them, lost. We wrote two versions of the hint under the field."
      ar: "في صفحة الدفع بتطبيق الطعام الذي أديره، يتجاوز كثيرون حقل «رقم المبنى» الاختياري. ثم يتصل بهم السائقون وهم تائهون. وكتبنا نسختين من الملاحظة تحت الحقل."
    prompt:
      en: "Which hint gives people a reason to fill in the field?"
      ar: "أي ملاحظة تعطي الناس سببًا ليملؤوا الحقل؟"
    a:
      label: { en: "A: The hint says why the number helps them.", ar: "A: الملاحظة تقول لماذا يفيدهم الرقم." }
      mock:
        app: lamma
        appbar:
          title: {en: Delivery details, ar: تفاصيل التوصيل}
          back: true
        footer:
        - kind: button
          text: {en: Place order · EGP 185, ar: اطلب الآن · 185 جنيه}
        blocks:
        - kind: listitem
          icon: map-pin
          text:
            en: "Home · 12 Nile St, Giza"
            ar: المنزل · 12 شارع النيل، الجيزة
          chevron: true
        - kind: field
          label: {en: Building number (optional), ar: رقم المبنى (اختياري)}
          text: {en: e.g. 14, ar: مثلًا 14}
          hint: {en: So the driver finds you faster., ar: ليجدك السائق أسرع.}
          gap: m
        - kind: field
          label: {en: Floor (optional), ar: الدور (اختياري)}
          text: {en: e.g. 3, ar: مثلًا 3}
          gap: s
    b:
      label: { en: "B: The hint asks for the number again.", ar: "B: الملاحظة تطلب الرقم مرة أخرى." }
      mock:
        app: lamma
        appbar:
          title: {en: Delivery details, ar: تفاصيل التوصيل}
          back: true
        footer:
        - kind: button
          text: {en: Place order · EGP 185, ar: اطلب الآن · 185 جنيه}
        blocks:
        - kind: listitem
          icon: map-pin
          text:
            en: "Home · 12 Nile St, Giza"
            ar: المنزل · 12 شارع النيل، الجيزة
          chevron: true
        - kind: field
          label: {en: Building number (optional), ar: رقم المبنى (اختياري)}
          text: {en: e.g. 14, ar: مثلًا 14}
          hint: {en: Enter your building number., ar: أدخل رقم المبنى.}
          gap: m
        - kind: field
          label: {en: Floor (optional), ar: الدور (اختياري)}
          text: {en: e.g. 3, ar: مثلًا 3}
          gap: s
    answer: a
    misconceptions:
      - id: MC-P15-009
        when: [b]
        feedback:
          en: "B repeats the label. It adds words, but gives no reason to fill the field in."
          ar: "B تكرّر اسم الحقل. فتضيف كلمات، لكنها لا تعطي سببًا لملئه."
    correct:
      en: "Right. Five words that answer \"why should I?\""
      ar: "صحيح. كلمات قليلة تجيب عن «لماذا أفعل ذلك؟»"
    explain:
      en: "Keep words that tell people why something matters to them. Cut words that only repeat."
      ar: "أبقِ الكلمات التي تخبر الناس لماذا يهمّهم الشيء. واحذف الكلمات التي تكرّر فقط."

  - id: S05
    type: tune
    skill: SK-P15-U02-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Passive Voice Redeemed (NN/g): positive statements beat negative ones, and double negatives are almost always horrible; the simpler the translation to the user's mental model, the easier the text is."
      ar: "إعادة اختبار. المبني للمجهول (NN/g): الجمل المثبتة أفضل من المنفية، والنفي المزدوج سيئ غالبًا؛ وكلما كانت الترجمة بين النص وتصوّر المستخدم أبسط، كان النص أسهل."
    ref: { url: "https://www.nngroup.com/articles/passive-voice-is-redeemed-for-web/", quote: "the simpler the translation between the text and the user's mental model, the easier the writing is to understand." }
    scenario:
      en: "This is the returns note on my shop's product pages. Customers keep asking if they can return things."
      ar: "هذه ملاحظة الإرجاع في صفحات المنتجات بمتجري. والعملاء يسألون باستمرار هل يمكنهم إرجاع المنتجات."
    mock:
      app: dar
      appbar:
        title: {en: Fridges, ar: ثلاجات}
        back: true
      footer:
      - kind: button
        text: {en: Add to cart, ar: أضف إلى السلة}
      blocks:
      - {kind: image, art: fridge, size: m}
      - kind: heading
        text: {en: Dar Cool 400 L fridge, ar: ثلاجة دار كول 400 لتر}
        gap: s
      - kind: price
        text:
          en: "EGP 24,500"
          ar: "24,500 جنيه"
      - kind: accordion
        text: {en: Returns, ar: الإرجاع}
        open: true
        gap: m
        blocks:
        - kind: small
          text:
            en: "Items can't be returned unless they are not used and it has not been more than 14 days."
            ar: لا يمكن إرجاع المنتجات إلا إذا لم تُستخدم ولم يمرّ أكثر من 14 يومًا.
          color: muted
      - kind: accordion
        text: {en: Delivery, ar: التوصيل}
        open: false
      caption: {en: Now, ar: الآن}
    prompt:
      en: "Which rewrite tells customers clearly when they can return something?"
      ar: "أي صياغة تخبر العملاء بوضوح متى يمكنهم إرجاع منتج؟"
    options:
      - id: no
        text:
          en: "\"No returns on used items or after 14 days.\""
          ar: «لا إرجاع للمنتجات المستعملة أو بعد 14 يومًا.»
        mock:
          app: dar
          appbar:
            title: {en: Fridges, ar: ثلاجات}
            back: true
          footer:
          - kind: button
            text: {en: Add to cart, ar: أضف إلى السلة}
          blocks:
          - {kind: image, art: fridge, size: m}
          - kind: heading
            text: {en: Dar Cool 400 L fridge, ar: ثلاجة دار كول 400 لتر}
            gap: s
          - kind: price
            text:
              en: "EGP 24,500"
              ar: "24,500 جنيه"
          - kind: accordion
            text: {en: Returns, ar: الإرجاع}
            open: true
            gap: m
            blocks:
            - kind: small
              text: {en: No returns on used items or after 14 days., ar: لا إرجاع للمنتجات المستعملة أو بعد 14 يومًا.}
              color: muted
          - kind: accordion
            text: {en: Delivery, ar: التوصيل}
            open: false
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: policy
        text:
          en: "\"Returns are handled under our returns policy.\""
          ar: «يتم التعامل مع الإرجاع حسب سياسة الإرجاع.»
        mock:
          app: dar
          appbar:
            title: {en: Fridges, ar: ثلاجات}
            back: true
          footer:
          - kind: button
            text: {en: Add to cart, ar: أضف إلى السلة}
          blocks:
          - {kind: image, art: fridge, size: m}
          - kind: heading
            text: {en: Dar Cool 400 L fridge, ar: ثلاجة دار كول 400 لتر}
            gap: s
          - kind: price
            text:
              en: "EGP 24,500"
              ar: "24,500 جنيه"
          - kind: accordion
            text: {en: Returns, ar: الإرجاع}
            open: true
            gap: m
            blocks:
            - kind: small
              text: {en: Returns are handled under our returns policy., ar: يتم التعامل مع الإرجاع حسب سياسة الإرجاع.}
              color: muted
          - kind: accordion
            text: {en: Delivery, ar: التوصيل}
            open: false
          caption: {en: After this change, ar: بعد هذا التغيير}
      - id: can
        text:
          en: "\"You can return any unused item within 14 days.\""
          ar: «يمكنك إرجاع أي منتج غير مستخدم خلال 14 يومًا.»
        mock:
          app: dar
          appbar:
            title: {en: Fridges, ar: ثلاجات}
            back: true
          footer:
          - kind: button
            text: {en: Add to cart, ar: أضف إلى السلة}
          blocks:
          - {kind: image, art: fridge, size: m}
          - kind: heading
            text: {en: Dar Cool 400 L fridge, ar: ثلاجة دار كول 400 لتر}
            gap: s
          - kind: price
            text:
              en: "EGP 24,500"
              ar: "24,500 جنيه"
          - kind: accordion
            text: {en: Returns, ar: الإرجاع}
            open: true
            gap: m
            blocks:
            - kind: small
              text: {en: You can return any unused item within 14 days., ar: يمكنك إرجاع أي منتج غير مستخدم خلال 14 يومًا.}
              color: muted
          - kind: accordion
            text: {en: Delivery, ar: التوصيل}
            open: false
          caption: {en: After this change, ar: بعد هذا التغيير}
    answer: [can]
    misconceptions:
      - id: MC-P15-012
        when: [no]
        feedback:
          en: "Clearer, but it still says what customers can't do. They must turn it around to learn what they can do."
          ar: "أوضح، لكنها ما زالت تقول ما لا يستطيع العملاء فعله. فعليهم أن يعكسوا المعنى ليعرفوا ما يستطيعون فعله."
      - id: MC-P15-011
        when: [policy]
        feedback:
          en: "Handled by whom, and how? Customers learn nothing about when they can return an item."
          ar: "من يتعامل معه، وكيف؟ لا يعرف العملاء منها شيئًا عن متى يمكنهم الإرجاع."
    correct:
      en: "Right. It says who, what and until when, in one positive line."
      ar: "صحيح. تقول من وماذا وحتى متى، في سطر واحد بصيغة إيجابية."
    explain:
      en: "Write the rule as what people can do. They get it on the first read."
      ar: "اكتب القاعدة كشيء يستطيع الناس فعله. فيفهمونها من القراءة الأولى."

  - id: S06
    type: choose
    skill: SK-P15-U02-03
    part: retest
    speaker: mona
    value:
      en: "Re-test. Passive Voice Redeemed (NN/g): when a sentence doesn't state the actor, users may misinterpret who's doing the action, like a tax rule readers thought applied to employees."
      ar: "إعادة اختبار. المبني للمجهول (NN/g): حين لا تذكر الجملة الفاعل، قد يخطئ المستخدمون في فهم من يقوم بالفعل، مثل قاعدة ضريبية ظن القرّاء أنها على الموظفين."
    ref: { url: "https://www.nngroup.com/articles/passive-voice-is-redeemed-for-web/", quote: "This style can also lead to additional usability problems if users misinterpret who's doing the action." }
    scenario:
      en: "Shops can now take payments through our app. Their sign-up page says: \"A service fee of 1% will be charged on each payment.\" Shop owners think their customers pay it, so they don't add it to their prices."
      ar: "تستطيع المتاجر الآن استقبال المدفوعات عبر تطبيقنا. وصفحة التسجيل تقول: «سيتم تحصيل رسوم خدمة بنسبة 1% على كل دفعة.» فيظن أصحاب المتاجر أن عملاءهم هم من يدفعونها، فلا يضيفونها إلى أسعارهم."
    prompt:
      en: "Which rewrite makes it clear who pays the fee?"
      ar: "أي صياغة توضّح من يدفع الرسوم؟"
    options:
      - { id: fee, text: { en: "\"A 1% fee applies to each payment.\"", ar: "«تُطبّق رسوم 1% على كل دفعة.»" } }
      - { id: you, text: { en: "\"You pay a 1% fee on each payment you receive.\"", ar: "«تدفع أنت رسومًا بنسبة 1% على كل دفعة تستلمها.»" } }
      - { id: charged, text: { en: "\"Each payment will be charged at 1%.\"", ar: "«ستُحتسب على كل دفعة نسبة 1%.»" } }
    answer: [you]
    misconceptions:
      - id: MC-P15-011
        when: [fee, charged]
        feedback:
          en: "Still no actor. Shop owners can keep thinking their customers pay the fee."
          ar: "ما زال الفاعل غائبًا. وقد يبقى أصحاب المتاجر يظنون أن عملاءهم يدفعون الرسوم."
    correct:
      en: "Right. \"You pay\" leaves no doubt about who."
      ar: "صحيح. «تدفع أنت» لا تترك شكًا في الفاعل."
    explain:
      en: "When the wrong guess costs money, never leave out who does the action."
      ar: "حين يكون للتخمين الخطأ ثمن مالي، لا تحذف أبدًا من يقوم بالفعل."

  - id: S07
    type: choose
    skill: SK-P15-U02-04
    part: retest
    speaker: nour
    value:
      en: "Re-test. Show Numbers as Numerals (NN/g): use numerals even when the number is the first word in a sentence or bullet point."
      ar: "إعادة اختبار. اكتب الأعداد بالأرقام (NN/g): استخدم الأرقام حتى حين يكون العدد أول كلمة في الجملة أو في نقطة من قائمة."
    ref: { url: "https://www.nngroup.com/articles/web-writing-show-numbers-as-numerals/", quote: "Use numerals even when the number is the first word in a sentence or bullet point." }
    scenario:
      en: "Our clinic's page has a list. One item says: \"Twelve doctors work on Fridays\". I was taught never to start a line with a digit."
      ar: "في صفحة عيادتنا قائمة. أحد عناصرها يقول: «اثنا عشر طبيبًا يعملون يوم الجمعة». وقد تعلّمت ألا أبدأ سطرًا برقم أبدًا."
    prompt:
      en: "How should this list item be written?"
      ar: "كيف يُكتب عنصر القائمة هذا؟"
    options:
      - { id: digits, text: { en: "\"12 doctors work on Fridays\"", ar: "«12 طبيبًا يعملون يوم الجمعة»" } }
      - { id: words, text: { en: "Keep \"Twelve\", because the line starts with it", ar: "أترك «اثنا عشر»، لأن السطر يبدأ بها" } }
      - { id: many, text: { en: "\"Many doctors work on Fridays\"", ar: "«أطباء كثيرون يعملون يوم الجمعة»" } }
    answer: [digits]
    misconceptions:
      - id: MC-P15-013
        when: [words]
        feedback:
          en: "On a screen, the start of a line is where people look first. A digit there is even easier to spot."
          ar: "على الشاشة، بداية السطر هي أول ما ينظر إليه الناس. والرقم هناك يلفت النظر أسرع."
      - id: MC-P15-015
        when: [many]
        feedback:
          en: "12 is an exact fact. \"Many\" hides it, and patients lose useful information."
          ar: "12 حقيقة دقيقة. و«كثيرون» تُخفيها، فيفقد المرضى معلومة مفيدة."
    correct:
      en: "Right. Digits work at the start of a line too."
      ar: "صحيح. الأرقام مناسبة في بداية السطر أيضًا."
    explain:
      en: "Old print rules say to spell out a first number. On screens, digits win, even at the start."
      ar: "قواعد الطباعة القديمة تقول: اكتب العدد الأول بالحروف. أما على الشاشات فالأرقام أفضل، حتى في البداية."

  - id: S08
    type: choose
    skill: SK-P15-U02-04
    part: retest
    speaker: rami
    value:
      en: "Re-test. Show Numbers as Numerals (NN/g): the general usability guideline to explain unusual units will probably stay valid forever."
      ar: "إعادة اختبار. اكتب الأعداد بالأرقام (NN/g): قاعدة شرح الوحدات غير المألوفة ستبقى صحيحة على الأرجح دائمًا."
    ref: { url: "https://www.nngroup.com/articles/web-writing-show-numbers-as-numerals/", quote: "the general usability guideline to explain unusual units will probably stay valid forever." }
    scenario:
      en: "I'm helping on a fitness app. After a workout it shows \"Energy used: 1,200 kJ\". Most of our users count calories, not kJ."
      ar: "أساعد في تصميم تطبيق لياقة. وبعد التمرين يعرض «الطاقة المستهلكة: 1200 kJ». ومعظم مستخدمينا يحسبون السعرات الحرارية، لا الـ kJ."
    prompt:
      en: "Which line helps these users understand the number?"
      ar: "أي سطر يساعد هؤلاء المستخدمين على فهم العدد؟"
    options:
      - { id: words, text: { en: "\"Energy used: one thousand two hundred kJ\"", ar: "«الطاقة المستهلكة: ألف ومئتا kJ»" } }
      - { id: great, text: { en: "\"Great workout! 💪\"", ar: "«تمرين رائع! 💪»" } }
      - { id: explain, text: { en: "\"Energy used: 1,200 kJ (about 290 calories)\"", ar: "«الطاقة المستهلكة: 1200 kJ (نحو 290 سعرة حرارية)»" } }
    answer: [explain]
    misconceptions:
      - id: MC-P15-013
        when: [words]
        feedback:
          en: "Writing the number in words makes it slower to read, and kJ is still unexplained."
          ar: "كتابة العدد بالحروف تجعل قراءته أبطأ، والـ kJ ما زالت بلا شرح."
      - id: MC-P15-010
        when: [great]
        feedback:
          en: "Friendly, but the fact people came for is gone."
          ar: "ودّية، لكن المعلومة التي جاء الناس من أجلها اختفت."
    correct:
      en: "Right. Keep the number, and put it in a unit they know."
      ar: "صحيح. أبقِ العدد، وأضف ما يساويه بوحدة يعرفونها."
    explain:
      en: "If your readers think in another unit, show that unit next to it."
      ar: "إن كان قرّاؤك يفكّرون بوحدة أخرى، فاعرض تلك الوحدة بجانب الوحدة الأصلية."
