id: P15-U01-L02
mode: lesson
minutes: 7
title:
  en: "Headings and lists people can scan"
  ar: "عناوين وقوائم تُفهم من نظرة"
summary:
  en: "Fix a gym's membership page with clear headings and the right kind of list."
  ar: "أصلح صفحة اشتراكات نادٍ رياضي بعناوين واضحة ونوع القائمة المناسب."
speaker: hana
sources:
  - title: { en: "Headings Are Pick-Up Lines (NN/g)", ar: "العناوين هي أول ما يجذب القارئ (NN/g)" }
    url: "https://www.nngroup.com/articles/headings-pickup-lines/"
  - title: { en: "7 Tips for Presenting Bulleted Lists in Digital Content (NN/g)", ar: "7 نصائح لعرض القوائم النقطية في المحتوى الرقمي (NN/g)" }
    url: "https://www.nngroup.com/articles/presenting-bulleted-lists/"
  - title: { en: "The Impact of Tone of Voice on Users' Brand Perception (NN/g)", ar: "أثر نبرة الصوت على نظرة المستخدمين للعلامة التجارية (NN/g)" }
    url: "https://www.nngroup.com/articles/tone-voice-users/"
review_labels:
  MC-P15-004: { en: "A clever heading hides what's below", ar: "العنوان الذكي يُخفي ما تحته" }
  MC-P15-005: { en: "A paragraph hides separate items", ar: "الفقرة تُخفي العناصر المنفصلة" }
  MC-P15-006: { en: "Numbers make options look like steps", ar: "الأرقام تجعل الخيارات تبدو كخطوات" }
  MC-P15-007: { en: "List items that start differently are harder to scan", ar: "العناصر التي تبدأ بشكل مختلف أصعب في التصفّح" }
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "A page nobody reads", ar: "صفحة لا يقرؤها أحد" }
    body:
      en: "I own a gym. Our membership page has all the answers: prices, what's included, how to pay, and the rules.\n\nBut people still ask at the desk. The page is one long block of text under fun headings."
      ar: "أملك ناديًا رياضيًا. وصفحة الاشتراكات عندنا فيها كل الإجابات: الأسعار، وما يشمله الاشتراك، وطرق الدفع، والقواعد.\n\nلكن الناس ما زالوا يسألون في الاستقبال. فالصفحة كتلة نص طويلة تحت عناوين مَرِحة."
    mock:
      app: nashat
      appbar:
        title: {en: Membership, ar: الاشتراك}
        back: true
      blocks:
      - {kind: image, art: gym, size: m}
      - kind: heading
        text:
          en: "Get ready to sweat!"
          ar: "استعدّ للعرق!"
        gap: m
      - kind: text
        text:
          en: "Your membership includes the gym floor, two group classes a week, a locker and one session with a trainer. You can pay by card, in cash at the desk or by mobile wallet…"
          ar: اشتراكك يشمل صالة الأجهزة، وحصتين جماعيتين في الأسبوع، وخزانة، وجلسة واحدة مع مدرّب. ويمكنك الدفع بالبطاقة، أو نقدًا في الاستقبال، أو بالمحفظة الإلكترونية…
        gap: xs
      - kind: heading
        text: {en: The fine print, ar: الكلام الصغير}
        gap: m

  - id: S02
    type: choose
    skill: SK-P15-U01-03
    part: try
    rules: [R12]
    value:
      en: "Try first. Headings Are Pick-Up Lines (NN/g): useful headings are specific. Avoid broad and generic headings."
      ar: "جرّب أولًا. العناوين (NN/g): العناوين المفيدة محددة. وتجنّب العناوين العامة الواسعة."
    ref: { url: "https://www.nngroup.com/articles/headings-pickup-lines/", quote: "Useful headings are specific." }
    prompt:
      en: "I want a heading above our prices. Which heading tells a visitor exactly what is in that section?"
      ar: "أريد عنوانًا فوق الأسعار. أي عنوان يخبر الزائر بالضبط بما في هذا القسم؟"
    options:
      - { id: invest, text: { en: "\"Invest in yourself\"", ar: "«استثمر في نفسك»" } }
      - { id: plans, text: { en: "\"Our plans\"", ar: "«خططنا»" } }
      - { id: prices, text: { en: "\"Prices: monthly and yearly\"", ar: "«الأسعار: شهري وسنوي»" } }
    answer: [prices]
    misconceptions:
      - id: MC-P15-004
        when: [invest]
        feedback:
          en: "\"Invest in yourself\" sounds nice, but it could sit above anything: classes, coaching or prices."
          ar: "«استثمر في نفسك» عبارة لطيفة، لكنها تصلح فوق أي شيء: الحصص أو التدريب أو الأسعار."
      - id: MC-P15-004
        when: [plans]
        feedback:
          en: "\"Our plans\" is too broad. It could mean training plans, not prices."
          ar: "«خططنا» عامة جدًا. وقد تعني خطط التمرين، لا الأسعار."
    hints:
      - { en: "Imagine the heading with nothing under it. Could you guess the content?", ar: "تخيّل العنوان بلا شيء تحته. هل تستطيع تخمين المحتوى؟" }
      - { en: "Which heading names the thing itself?", ar: "أي عنوان يذكر الشيء نفسه باسمه؟" }
    correct:
      en: "Right. It names what's below, in plain words."
      ar: "صحيح. يذكر ما تحته بكلمات بسيطة."
    explain:
      en: "People scan headings to decide where to look. A specific heading sends them to the right place."
      ar: "الناس يتصفّحون العناوين ليقرّروا أين ينظرون. والعنوان المحدد يرسلهم للمكان الصحيح."

  - id: S03
    type: card
    part: concept
    icons: [text, list, order, eye]
    title: { en: "Headings that say it, lists that show it", ar: "عناوين تقول، وقوائم تُظهر" }
    body:
      en: "- **Specific headings:** say what's below in plain words. A heading must make sense alone, for example in search results or a shared link.\n- **No clever headings:** jokes and slogans hide what the section is about.\n- **Lists for 3 or more items:** put related items on separate lines, so the eye can count and compare them.\n- **Numbers only for order:** number a list when the order or the count matters, like steps. Otherwise use bullets.\n- **Start items the same way:** for example, every item starts with a verb."
      ar: "- **عناوين محددة:** قل ما تحت العنوان بكلمات بسيطة. ويجب أن يُفهم العنوان وحده، مثلًا في نتائج البحث أو في رابط مُرسَل.\n- **لا عناوين ذكية:** النكات والشعارات تُخفي موضوع القسم.\n- **قوائم لـ 3 عناصر أو أكثر:** ضع العناصر المترابطة في سطور منفصلة، حتى تعدّها العين وتقارن بينها.\n- **أرقام للترتيب فقط:** رقّم القائمة حين يهمّ الترتيب أو العدد، مثل الخطوات. وإلا فاستخدم النقاط.\n- **ابدأ العناصر بنفس الطريقة:** مثلًا، كل عنصر يبدأ بفعل."

  - id: S04
    type: tune
    skill: SK-P15-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Bulleted Lists (NN/g): vertical lists are best for three or more items you want to draw attention to; the eye finds them faster than items inside a paragraph."
      ar: "القوائم النقطية (NN/g): القوائم الرأسية أفضل حين يكون عندك ثلاثة عناصر أو أكثر تريد لفت النظر إليها، والعين تجدها أسرع من العناصر داخل فقرة."
    ref: { url: "https://www.nngroup.com/articles/presenting-bulleted-lists/", quote: "Vertical lists are best when you have three or more items that you want to attract attention to." }
    scenario:
      en: "Visitors keep asking what the membership includes. Today it's one sentence: the gym floor, two classes a week, a locker and one trainer session."
      ar: "الزوار يسألون دائمًا عمّا يشمله الاشتراك. واليوم هو جملة واحدة: صالة الأجهزة، وحصتان في الأسبوع، وخزانة، وجلسة مع مدرّب."
    prompt:
      en: "Tap each option to see the change. Which version lets a visitor see the 4 things at a glance?"
      ar: "اضغط على كل خيار لترى التغيير. أي نسخة تجعل الزائر يرى الأشياء الأربعة من نظرة؟"
    mock:
      app: nashat
      appbar:
        title: {en: My plan, ar: اشتراكي}
        back: true
      caption: {en: Now, ar: الآن}
      blocks:
      - kind: card
        blocks:
        - kind: badge
          text: {en: Monthly plan, ar: اشتراك شهري}
        - kind: price
          text:
            en: EGP 850
            ar: "850 جنيه"
          per: {en: / month, ar: / شهريًا}
          gap: s
        - kind: heading
          text:
            en: "What's included"
            ar: ما يشمله الاشتراك
          gap: m
        - kind: text
          text:
            en: "Your membership includes the gym floor, two group classes a week, a locker and one session with a trainer."
            ar: اشتراكك يشمل صالة الأجهزة، وحصتين جماعيتين في الأسبوع، وخزانة، وجلسة واحدة مع مدرّب.
          gap: xs
    options:
      - id: list
        text: { en: "Put each item on its own line with a bullet", ar: "ضع كل عنصر في سطر خاص به مع نقطة" }
        mock:
          app: nashat
          appbar:
            title: {en: My plan, ar: اشتراكي}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: card
            blocks:
            - kind: badge
              text: {en: Monthly plan, ar: اشتراك شهري}
            - kind: price
              text:
                en: EGP 850
                ar: "850 جنيه"
              per: {en: / month, ar: / شهريًا}
              gap: s
            - kind: heading
              text:
                en: "What's included"
                ar: ما يشمله الاشتراك
              gap: m
            - kind: list
              style: bullet
              items:
              - en: "Gym floor, any time"
                ar: صالة الأجهزة في أي وقت
              - en: "2 group classes a week"
                ar: حصتان جماعيتان في الأسبوع
              - {en: A locker, ar: خزانة}
              - en: "1 session with a trainer"
                ar: جلسة واحدة مع مدرّب
              gap: xs
      - id: bold
        text: { en: "Keep the sentence, make the 4 items bold", ar: "أبقِ الجملة، واجعل العناصر الأربعة بخط عريض" }
        mock:
          app: nashat
          appbar:
            title: {en: My plan, ar: اشتراكي}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: card
            blocks:
            - kind: badge
              text: {en: Monthly plan, ar: اشتراك شهري}
            - kind: price
              text:
                en: EGP 850
                ar: "850 جنيه"
              per: {en: / month, ar: / شهريًا}
              gap: s
            - kind: heading
              text:
                en: "What's included"
                ar: ما يشمله الاشتراك
              gap: m
            - kind: text
              text:
                en: "Your membership includes the **gym floor**, **two group classes a week**, a **locker** and **one session with a trainer**."
                ar: "اشتراكك يشمل **صالة الأجهزة**، و**حصتين جماعيتين في الأسبوع**، و**خزانة**، و**جلسة واحدة مع مدرّب**."
              gap: xs
      - id: longer
        text: { en: "Explain each item in a full paragraph", ar: "اشرح كل عنصر في فقرة كاملة" }
        mock:
          app: nashat
          appbar:
            title: {en: My plan, ar: اشتراكي}
            back: true
          caption: {en: After this change, ar: بعد هذا التغيير}
          blocks:
          - kind: card
            blocks:
            - kind: badge
              text: {en: Monthly plan, ar: اشتراك شهري}
            - kind: price
              text:
                en: EGP 850
                ar: "850 جنيه"
              per: {en: / month, ar: / شهريًا}
              gap: s
            - kind: heading
              text:
                en: "What's included"
                ar: ما يشمله الاشتراك
              gap: m
            - kind: text
              text:
                en: "First, you can use the gym floor whenever we are open, with all the machines and free weights. On top of that, you can join two group classes every week, and there are many to choose from…"
                ar: أولًا، يمكنك استخدام صالة الأجهزة في أي وقت نكون فيه مفتوحين، بكل الأجهزة والأوزان الحرة. وفوق ذلك، يمكنك حضور حصتين جماعيتين كل أسبوع، وهناك حصص كثيرة للاختيار…
              gap: xs
    answer: [list]
    misconceptions:
      - id: MC-P15-005
        when: [bold, longer]
        feedback:
          en: "The items are still hidden inside sentences. The eye has to read the whole text to count them."
          ar: "العناصر ما زالت مخفية داخل الجمل. والعين مضطرة لقراءة النص كله لتعدّها."
    hints:
      - { en: "In which version can you count the 4 items without reading?", ar: "في أي نسخة تستطيع أن تعدّ العناصر الأربعة دون قراءة؟" }
      - { en: "Separate lines let the eye jump from item to item.", ar: "السطور المنفصلة تجعل العين تقفز من عنصر لآخر." }
    correct:
      en: "Right. Four lines, four things."
      ar: "صحيح. أربعة سطور، أربعة أشياء."
    explain:
      en: "A vertical list shows how many items there are and lets people find the one they care about."
      ar: "القائمة الرأسية تُظهر عدد العناصر، وتجعل الناس يجدون العنصر الذي يهمّهم."

  - id: S05
    type: choose
    skill: SK-P15-U01-04
    part: guided
    confidence: true
    rules: [R06]
    value:
      en: "Bulleted Lists (NN/g): if order or count doesn't matter, don't number the list. In tests, people thought they had to complete every numbered item when they only needed one."
      ar: "القوائم النقطية (NN/g): إذا لم يكن الترتيب أو العدد مهمًا فلا ترقّم القائمة. وفي الاختبارات ظنّ الناس أن عليهم تنفيذ كل عنصر مرقّم، بينما كانوا يحتاجون واحدًا فقط."
    ref: { url: "https://www.nngroup.com/articles/presenting-bulleted-lists/", quote: "in our user-testing studies, people erroneously thought that they had to complete all steps in a numbered list, when they only needed to choose one option." }
    scenario:
      en: "Members can pay in one of three ways: by card, in cash at the desk, or by mobile wallet. Our page shows them as a numbered list."
      ar: "يستطيع الأعضاء الدفع بإحدى ثلاث طرق: بالبطاقة، أو نقدًا في الاستقبال، أو بالمحفظة الإلكترونية. وصفحتنا تعرضها كقائمة مرقّمة."
    mock:
      app: nashat
      appbar:
        title: {en: Pay for your plan, ar: ادفع اشتراكك}
        back: true
      footer:
      - kind: button
        text: {en: Continue, ar: متابعة}
      blocks:
      - kind: price
        text:
          en: EGP 850
          ar: "850 جنيه"
        per: {en: / month, ar: / شهريًا}
      - kind: heading
        text: {en: How to pay, ar: طرق الدفع}
        gap: m
      - kind: list
        style: number
        items:
        - {en: Card, ar: البطاقة}
        - {en: Cash at the desk, ar: نقدًا في الاستقبال}
        - {en: Mobile wallet, ar: المحفظة الإلكترونية}
        gap: xs
    prompt:
      en: "What should I change so members see they need only one way?"
      ar: "ماذا أغيّر حتى يرى الأعضاء أنهم يحتاجون طريقة واحدة فقط؟"
    options:
      - { id: keep, text: { en: "Nothing. Numbers make any list easier to follow", ar: "لا شيء. الأرقام تجعل أي قائمة أسهل" } }
      - { id: bullets, text: { en: "Use bullets instead of numbers, with the lead-in \"Pay in any one of these ways:\"", ar: "استخدم نقاطًا بدل الأرقام، مع جملة تمهيد: «ادفع بأي طريقة من هذه:»" } }
      - { id: sentence, text: { en: "Put the three ways in one sentence", ar: "ضع الطرق الثلاث في جملة واحدة" } }
    answer: [bullets]
    misconceptions:
      - id: MC-P15-006
        when: [keep]
        feedback:
          en: "Numbers say \"do 1, then 2, then 3\". Members may think they must pay all three ways, or in that order."
          ar: "الأرقام تقول «افعل 1 ثم 2 ثم 3». فقد يظنّ الأعضاء أن عليهم الدفع بالطرق الثلاث، أو بهذا الترتيب."
      - id: MC-P15-005
        when: [sentence]
        feedback:
          en: "Three options are easier to compare on separate lines. Just drop the numbers."
          ar: "ثلاثة خيارات أسهل للمقارنة في سطور منفصلة. فقط احذف الأرقام."
    hints:
      - { en: "Does the order of these 3 ways matter?", ar: "هل ترتيب هذه الطرق الثلاث مهم؟" }
      - { en: "What do numbers usually tell a reader?", ar: "ماذا تقول الأرقام عادةً للقارئ؟" }
    correct:
      en: "Right. Bullets for choices, numbers for steps."
      ar: "صحيح. النقاط للخيارات، والأرقام للخطوات."
    explain:
      en: "Number a list only when order or count matters, like the steps to book a class. Choices get bullets and a clear lead-in."
      ar: "رقّم القائمة فقط حين يهمّ الترتيب أو العدد، مثل خطوات حجز حصة. أما الخيارات فلها نقاط وجملة تمهيد واضحة."

  - id: S06
    type: choose
    skill: SK-P15-U01-04
    part: guided
    rules: [R06]
    value:
      en: "Bulleted Lists (NN/g): structure each item the same way; start every item with the same part of speech, such as a verb."
      ar: "القوائم النقطية (NN/g): ابنِ كل عنصر بنفس الطريقة، وابدأ كل عنصر بنفس نوع الكلمة، مثل الفعل."
    ref: { url: "https://www.nngroup.com/articles/presenting-bulleted-lists/", quote: "Make sure each bulleted-list item starts with the same part of speech (e.g., noun, verb) and that they are all either fragments or complete sentences." }
    scenario:
      en: "Our gym rules list mixes different kinds of sentences."
      ar: "قائمة قواعد النادي عندنا تخلط أنواعًا مختلفة من الجمل."
    mock:
      app: nashat
      appbar:
        title: {en: Gym rules, ar: قواعد النادي}
        back: true
      blocks:
      - {kind: image, art: gym, size: s}
      - kind: heading
        text: {en: Gym rules, ar: قواعد النادي}
        gap: m
      - kind: list
        style: bullet
        items:
        - {en: Bring a towel, ar: أحضِر منشفة}
        - {en: Clean shoes are required on the floor, ar: الأحذية النظيفة مطلوبة في الصالة}
        - en: "Phones? Not on the floor, please"
          ar: الهاتف؟ ليس في الصالة من فضلك
        - {en: It is important to put weights back, ar: من المهم إعادة الأوزان لمكانها}
        gap: xs
    prompt:
      en: "Which rewrite makes the rules easiest to scan?"
      ar: "أي صياغة تجعل القواعد أسهل في التصفّح؟"
    options:
      - { id: mixed, text: { en: "Keep the items, but add \"Rule:\" before each one", ar: "أبقِ العناصر، لكن أضف «قاعدة:» قبل كل واحد" } }
      - { id: para, text: { en: "Join all four rules into one friendly paragraph", ar: "اجمع القواعد الأربع في فقرة واحدة لطيفة" } }
      - { id: verbs, text: { en: "Start every item with a verb: \"Bring a towel · Wear clean shoes · Keep your phone in the locker · Put weights back\"", ar: "ابدأ كل عنصر بفعل: «أحضِر منشفة · البس حذاءً نظيفًا · اترك هاتفك في الخزانة · أعِد الأوزان لمكانها»" } }
    answer: [verbs]
    misconceptions:
      - id: MC-P15-007
        when: [mixed]
        feedback:
          en: "Now every item starts with the same word, \"Rule:\". The first words can't tell the rules apart, and the mixed sentences stay."
          ar: "الآن كل عنصر يبدأ بنفس الكلمة «قاعدة:». فلا تفرّق الكلمات الأولى بين القواعد، وتبقى الجمل المختلطة."
      - id: MC-P15-005
        when: [para]
        feedback:
          en: "A paragraph hides the four rules. Keep the list and fix how each item starts."
          ar: "الفقرة تُخفي القواعد الأربع. أبقِ القائمة وأصلح طريقة بداية كل عنصر."
    hints:
      - { en: "Look at the first word of each rule in the list now.", ar: "انظر إلى أول كلمة في كل قاعدة في القائمة الآن." }
      - { en: "Which option makes every rule start the same kind of way, with a different word?", ar: "أي خيار يجعل كل القواعد تبدأ بنفس النوع، لكن بكلمة مختلفة؟" }
    correct:
      en: "Right. Same shape, different first words."
      ar: "صحيح. نفس الشكل، وكلمات أولى مختلفة."
    explain:
      en: "When every item starts with a verb, people read the list as a set of things to do, and each first word is different."
      ar: "حين يبدأ كل عنصر بفعل، يقرأ الناس القائمة كمجموعة أشياء يفعلونها، وتكون أول كلمة مختلفة في كل عنصر."

  - id: S07
    type: compare
    skill: SK-P15-U01-03
    part: contrast
    confidence: true
    rules: [R11]
    value:
      en: "Contrast: clever vs plain heading. Tone of Voice (NN/g): funny or clever headlines often fail at the job of a headline, which is telling people what is below it."
      ar: "مقارنة: عنوان ذكي مقابل عنوان بسيط. نبرة الصوت (NN/g): العناوين المضحكة أو الذكية تفشل غالبًا في مهمة العنوان، وهي أن يخبر الناس بما تحته."
    ref: { url: "https://www.nngroup.com/articles/tone-voice-users/", quote: "Funny or clever headlines often fail to serve the actual purpose of headlines" }
    scenario:
      en: "We post the class times on our home page and share the link in our WhatsApp group."
      ar: "ننشر مواعيد الحصص على الصفحة الرئيسية، ونرسل الرابط في مجموعة الواتساب."
    prompt:
      en: "Which heading tells members, even in the shared link, that this is the class schedule?"
      ar: "أي عنوان يخبر الأعضاء، حتى في الرابط المُرسَل، بأن هذا جدول الحصص؟"
    a:
      label: { en: "A: A heading that names the schedule and the week.", ar: "A: عنوان يذكر الجدول والأسبوع." }
      mock:
        app: nashat
        appbar: {logo: true}
        tabbar:
          active: 0
          items:
          - icon: house
            text: {en: Home, ar: الرئيسية}
          - icon: calendar-blank
            text: {en: Classes, ar: الحصص}
          - icon: identification-card
            text: {en: My plan, ar: اشتراكي}
          - icon: user
            text: {en: Account, ar: حسابي}
        blocks:
        - kind: card
          blocks:
          - kind: heading
            text:
              en: "Class times: 10 to 16 March"
              ar: "مواعيد الحصص: من 10 إلى 16 مارس"
          - kind: meta
            text: {en: Yoga · Spinning · Boxing, ar: يوغا · دراجات · ملاكمة}
            gap: xs
          - kind: row
            blocks:
            - kind: badge
              text: {en: Yoga 7 PM, ar: يوغا 7 م}
              tone: neutral
            - kind: badge
              text: {en: Spinning 8 PM, ar: دراجات 8 م}
              tone: neutral
            gap: s
          - kind: button
            text: {en: See all classes, ar: كل الحصص}
            style: outline
            gap: m
    b:
      label: { en: "B: A fun heading with a slogan.", ar: "B: عنوان مرح فيه شعار." }
      mock:
        app: nashat
        appbar: {logo: true}
        tabbar:
          active: 0
          items:
          - icon: house
            text: {en: Home, ar: الرئيسية}
          - icon: calendar-blank
            text: {en: Classes, ar: الحصص}
          - icon: identification-card
            text: {en: My plan, ar: اشتراكي}
          - icon: user
            text: {en: Account, ar: حسابي}
        blocks:
        - kind: card
          blocks:
          - kind: heading
            text: {en: Find your rhythm 🔥, ar: اعثر على إيقاعك 🔥}
          - kind: meta
            text: {en: Yoga · Spinning · Boxing, ar: يوغا · دراجات · ملاكمة}
            gap: xs
          - kind: row
            blocks:
            - kind: badge
              text: {en: Yoga 7 PM, ar: يوغا 7 م}
              tone: neutral
            - kind: badge
              text: {en: Spinning 8 PM, ar: دراجات 8 م}
              tone: neutral
            gap: s
          - kind: button
            text: {en: See all classes, ar: كل الحصص}
            style: outline
            gap: m
    answer: a
    reason:
      prompt: { en: "Why is A better?", ar: "لماذا A أفضل؟" }
      options:
        - { id: alone, text: { en: "It says what's below even when the heading appears alone, as in the shared link", ar: "يقول ما تحته حتى حين يظهر العنوان وحده، كما في الرابط المُرسَل" } }
        - { id: emoji, text: { en: "Emojis are never allowed in headings", ar: "الرموز التعبيرية ممنوعة دائمًا في العناوين" } }
        - { id: long, text: { en: "Longer headings always work better", ar: "العناوين الأطول تعمل دائمًا أفضل" } }
      answer: [alone]
      misconceptions:
        - id: MC-P15-004
          when: [emoji, long]
          feedback:
            en: "The emoji and the length are not the problem. B fails because \"Find your rhythm\" doesn't say it's a schedule."
            ar: "المشكلة ليست في الرمز ولا في الطول. B تفشل لأن «اعثر على إيقاعك» لا تقول إنه جدول."
    misconceptions:
      - id: MC-P15-004
        when: [b]
        feedback:
          en: "In the WhatsApp preview, members see only \"Find your rhythm\". Nothing says it's this week's class times."
          ar: "في معاينة الواتساب يرى الأعضاء «اعثر على إيقاعك» فقط. ولا شيء يقول إنها مواعيد حصص هذا الأسبوع."
    hints:
      - { en: "Cover the class names. What does each heading tell you alone?", ar: "غطِّ أسماء الحصص. ماذا يخبرك كل عنوان وحده؟" }
      - { en: "In a shared link, often only the heading shows.", ar: "في الرابط المُرسَل، كثيرًا ما يظهر العنوان وحده." }
    correct:
      en: "Right. A plain heading works anywhere it appears."
      ar: "صحيح. العنوان البسيط يعمل في أي مكان يظهر فيه."
    explain:
      en: "Headings often travel alone: in search results, chats and notifications. Write them so they still make sense there."
      ar: "العناوين كثيرًا ما تنتقل وحدها: في نتائج البحث والمحادثات والإشعارات. فاكتبها بحيث تُفهم هناك أيضًا."

  - id: S08
    type: choose
    skill: SK-P15-U01-03
    part: independent
    speaker: karim
    rules: [R14]
    value:
      en: "New case. Headings Are Pick-Up Lines (NN/g): on the web, headlines usually appear out of context, such as in search results, so they must make sense alone."
      ar: "حالة جديدة. العناوين (NN/g): على الإنترنت تظهر العناوين غالبًا خارج سياقها، مثل نتائج البحث، لذلك يجب أن تُفهم وحدها."
    ref: { url: "https://www.nngroup.com/articles/headings-pickup-lines/", quote: "Make sure the headline works out of context." }
    scenario:
      en: "I'm building the help centre for a banking app. When people search, they see only the article titles. One article explains how to get a new card PIN by SMS."
      ar: "أبني مركز المساعدة لتطبيق بنك. وحين يبحث الناس، يرون عناوين المقالات فقط. وإحدى المقالات تشرح كيف تحصل على رقم سري (PIN) جديد للبطاقة برسالة نصية."
    prompt:
      en: "Which title helps someone who forgot their PIN pick the right article from the results?"
      ar: "أي عنوان يساعد من نسي رقمه السري على اختيار المقالة الصحيحة من النتائج؟"
    mock:
      app: rasid
      appbar:
        title: {en: Help, ar: المساعدة}
        back: true
      blocks:
      - kind: searchbar
        text: {en: forgot pin, ar: نسيت الرقم السري}
        filled: true
      - kind: small
        text:
          en: "3 results"
          ar: "3 نتائج"
        color: muted
        gap: s
    options:
      - { id: know, text: { en: "\"Everything you need to know about your card\"", ar: "«كل ما تحتاج معرفته عن بطاقتك»" } }
      - { id: pin, text: { en: "\"Get a new card PIN by SMS\"", ar: "«احصل على رقم سري جديد للبطاقة برسالة نصية»" } }
      - { id: worry, text: { en: "\"Forgot something? Don't worry!\"", ar: "«نسيت شيئًا؟ لا تقلق!»" } }
    answer: [pin]
    misconceptions:
      - id: MC-P15-004
        when: [know, worry]
        feedback:
          en: "In a list of results, this title could be about anything. People skip titles that don't name their problem."
          ar: "في قائمة النتائج، هذا العنوان يصلح لأي موضوع. والناس يتجاوزون العناوين التي لا تذكر مشكلتهم."
    hints:
      - { en: "The person sees only the title. Which one names their exact task?", ar: "الشخص يرى العنوان فقط. أي عنوان يذكر مهمّته بالضبط؟" }
      - { en: "Look for the words \"PIN\" and \"new\".", ar: "ابحث عن كلمتي «الرقم السري» و«جديد»." }
    correct:
      en: "Right. It names the task, and it works on its own."
      ar: "صحيح. يذكر المهمة، ويُفهم وحده."
    explain:
      en: "A title in search results has no page around it. It has to say exactly what the article helps with."
      ar: "العنوان في نتائج البحث ليس حوله صفحة. فيجب أن يقول بالضبط في أي شيء تساعد المقالة."

  - id: S09
    type: card
    part: recap
    icons: [text, list, order, eye]
    title: { en: "What you did", ar: "ماذا تعلّمت" }
    body:
      en: "- **Specific headings:** you chose \"Prices: monthly and yearly\" and \"Get a new card PIN by SMS\".\n- **No slogans:** you kept \"Find your rhythm\" off the schedule.\n- **Vertical lists:** you split the membership sentence into 4 lines.\n- **Bullets for choices:** you removed the numbers from the ways to pay.\n- **Same start:** you began every rule with a verb.\n\nNext: the skill check."
      ar: "- **عناوين محددة:** اخترت «الأسعار: شهري وسنوي» و«احصل على رقم سري جديد للبطاقة برسالة نصية».\n- **بلا شعارات:** أبعدت «اعثر على إيقاعك» عن الجدول.\n- **قوائم رأسية:** قسّمت جملة الاشتراك إلى 4 سطور.\n- **نقاط للخيارات:** حذفت الأرقام من طرق الدفع.\n- **بداية واحدة:** بدأت كل قاعدة بفعل.\n\nالتالي: اختبار المهارة."
