id: P15-U01
free: true
title:
  en: "Write for people who scan"
  ar: "اكتب لمن يقرأ بسرعة"
skill:
  en: "Put the words people look for first, lead with the main point, and use headings and lists that work at a glance."
  ar: "ضع الكلمات التي يبحث عنها الناس في البداية، وابدأ بالفكرة الأهم، واستخدم عناوين وقوائم تُفهم من نظرة."
# The skills this unit makes measurable. Every graded step names one in `skill`,
# and each skill needs 4+ versions in 4+ different scenarios (see docs/learning-model.md).
skills:
  - id: SK-P15-U01-01
    title: { en: "Put the meaning in the first two words", ar: "ضع المعنى في أول كلمتين" }
    can_do: { en: "Start titles, links, buttons and list items with the words that carry the meaning, not with filler like \"Introducing\" or \"Click here to\".", ar: "ابدأ العناوين والروابط والأزرار وعناصر القوائم بالكلمات التي تحمل المعنى، لا بكلمات حشو مثل «نقدّم لكم» أو «اضغط هنا لـ»." }
  - id: SK-P15-U01-02
    title: { en: "Lead with the main point", ar: "ابدأ بالفكرة الأهم" }
    can_do: { en: "Put the most important fact first in a message or page, so people who stop after one line still get it.", ar: "ضع أهم معلومة أولًا في الرسالة أو الصفحة، حتى يفهمها من يتوقّف بعد سطر واحد." }
  - id: SK-P15-U01-03
    title: { en: "Write headings that say what's below", ar: "اكتب عناوين تقول ما تحتها" }
    can_do: { en: "Use specific, plain headings that still make sense when shown alone, instead of clever or vague ones.", ar: "استخدم عناوين محددة وبسيطة تُفهم حتى لو ظهرت وحدها، بدل العناوين الذكية أو المبهمة." }
  - id: SK-P15-U01-04
    title: { en: "Use lists the right way", ar: "استخدم القوائم بالطريقة الصحيحة" }
    can_do: { en: "Turn 3 or more related items into a vertical list, start every item the same way, and number it only when order or count matters.", ar: "حوّل 3 عناصر مترابطة أو أكثر إلى قائمة رأسية، وابدأ كل عنصر بنفس الطريقة، ورقّمها فقط حين يهمّ الترتيب أو العدد." }
