id: P15
title:
  en: "Write Words That Work"
  ar: "كلمات تُفهم من أول قراءة (UX Writing)"
subtitle:
  en: "Write screen text people can scan, understand and act on, in a tone that fits the moment."
  ar: "اكتب نصوص الشاشات (UX writing) بحيث يتصفّحها الناس بسرعة ويفهمونها ويتصرّفون بها، وبنبرة تناسب الموقف."
