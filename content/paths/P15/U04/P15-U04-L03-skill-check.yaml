id: P15-U04-L03
mode: check
minutes: 5
title:
  en: "Skill check: labels that say what happens"
  ar: "اختبار المهارة: نصوص تقول ماذا سيحدث"
summary:
  en: "Fix four labels in a banking app on your own: a button, a switch, a confirmation and a link."
  ar: "أصلح بنفسك أربعة نصوص في تطبيق بنكي: زرًّا، ومفتاحًا، ورسالة تأكيد، ورابطًا."
speaker: sara
sources:
  - title: { en: "UI Copy: UX Guidelines for Command Names and Keyboard Shortcuts (NN/g)", ar: "نصوص الواجهة: إرشادات لأسماء الأوامر واختصارات لوحة المفاتيح (NN/g)" }
    url: "https://www.nngroup.com/articles/ui-copy/"
  - title: { en: "Confirmation Dialogs Can Prevent User Errors (If Not Overused) (NN/g)", ar: "رسائل التأكيد تمنع أخطاء المستخدمين (إن لم نُكثر منها) (NN/g)" }
    url: "https://www.nngroup.com/articles/confirmation-dialog/"
  - title: { en: "\"Learn More\" Links: You Can Do Better (NN/g)", ar: "روابط «اعرف المزيد»: يمكنك أن تفعل أفضل (NN/g)" }
    url: "https://www.nngroup.com/articles/learn-more-links/"
steps:
  - id: S01
    type: card
    part: hook
    title: { en: "Sara's banking app", ar: "التطبيق البنكي الذي تصمّمه سارة" }
    body:
      en: "Back to our banking app. People move real money here, so every label must say exactly what will happen.\n\nYour job: fix four labels.\n\nThis is a skill check: there are no hints, and you'll see your result at the end."
      ar: "نعود إلى تطبيقنا البنكي. والناس يحرّكون أموالًا حقيقية هنا، فكل نص يجب أن يقول بالضبط ما سيحدث.\n\nمهمّتك: أصلح أربعة نصوص.\n\nهذا اختبار مهارة: لا توجد تلميحات، وسترى نتيجتك في النهاية."
    mock:
      width: 300
      blocks:
        - { kind: title, text: { en: "Rasid", ar: "رصيد" } }
        - { kind: meta, text: { en: "Accounts · Transfers · Cards", ar: "الحسابات · التحويلات · البطاقات" }, gap: s }

  - id: S02
    type: choose
    skill: SK-P15-U04-01
    part: check
    rules: [R19]
    value:
      en: "Skill check. UI Copy (NN/g): use just enough text to accurately describe the command, in no more than 2–4 words."
      ar: "اختبار مهارة. نصوص الواجهة (NN/g): استخدم ما يكفي من الكلمات لوصف الأمر بدقة، في 2 إلى 4 كلمات لا أكثر."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "Use just enough text to accurately describe the command and include no more than 2–4 words." }
    scenario:
      en: "On the last screen of a transfer, people check the amount and the name. The button says \"Submit\". Tapping it sends the money."
      ar: "في آخر شاشة من التحويل، يراجع الناس المبلغ والاسم. والزر يقول «إرسال». والضغط عليه يحوّل المال."
    prompt:
      en: "Which label says exactly what this button does?"
      ar: "أي نص يقول بالضبط ما يفعله هذا الزر؟"
    options:
      - { id: next, text: { en: "\"Next\"", ar: "«التالي»" } }
      - { id: long, text: { en: "\"Click to confirm and complete your transfer request\"", ar: "«اضغط لتأكيد طلب التحويل وإكماله»" } }
      - { id: send, text: { en: "\"Send EGP 500\"", ar: "«حوّل 500 جنيه»" } }
    answer: [send]
    misconceptions:
      - id: MC-P15-023
        when: [next]
        feedback:
          en: "\"Next\" sounds like there's another step. People won't know the money goes the moment they tap."
          ar: "«التالي» توحي بأن هناك خطوة أخرى. ولن يعرف الناس أن المال سيُحوَّل لحظة الضغط."
      - id: MC-P15-001
        when: [long]
        feedback:
          en: "Too many words before the point, and it still doesn't say how much."
          ar: "كلمات كثيرة قبل المقصود، وما زال لا يقول كم المبلغ."
    explain:
      en: "From Lesson 1: a specific verb, plus what it acts on, in a few words."
      ar: "من الدرس 1: فعل محدد، ومعه ما يقع عليه، في كلمات قليلة."

  - id: S03
    type: tune
    skill: SK-P15-U04-02
    part: check
    rules: [R19]
    value:
      en: "Skill check. UI Copy (NN/g): a changeable label communicates the state the system will move into, while saving space."
      ar: "اختبار مهارة. نصوص الواجهة (NN/g): النص المتبدّل يوضّح الحالة التي سينتقل إليها النظام، ويوفّر المساحة."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "This type of changeable label helps to communicate subsequent states while preserving space in the interface." }
    scenario:
      en: "People can freeze a lost card. This card is frozen right now. The button under it says \"Card frozen\"."
      ar: "يستطيع الناس تجميد البطاقة المفقودة. وهذه البطاقة مجمّدة الآن. والزر تحتها يقول «البطاقة مجمّدة»."
    prompt:
      en: "Tap each option to see the change. Which label tells people what tapping will do?"
      ar: "اضغط على كل خيار لترى التغيير. أي نص يخبر الناس بما ستفعله الضغطة؟"
    mock:
      width: 300
      caption: { en: "Now", ar: "الآن" }
      blocks:
        - { kind: meta, weight: bold, text: { en: "Debit card ·· 4821", ar: "بطاقة الخصم ·· 4821" } }
        - { kind: chip, tone: warn, text: { en: "Frozen", ar: "مجمّدة" }, gap: xs }
        - { kind: button, style: plain, text: { en: "Card frozen", ar: "البطاقة مجمّدة" }, gap: s }
    options:
      - id: unfreeze
        text: { en: "\"Unfreeze card\"", ar: "«ألغِ تجميد البطاقة»" }
        mock:
          width: 300
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: meta, weight: bold, text: { en: "Debit card ·· 4821", ar: "بطاقة الخصم ·· 4821" } }
            - { kind: chip, tone: warn, text: { en: "Frozen", ar: "مجمّدة" }, gap: xs }
            - { kind: button, style: plain, text: { en: "Unfreeze card", ar: "ألغِ تجميد البطاقة" }, gap: s }
      - id: freeze
        text: { en: "\"Freeze card\"", ar: "«جمّد البطاقة»" }
        mock:
          width: 300
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: meta, weight: bold, text: { en: "Debit card ·· 4821", ar: "بطاقة الخصم ·· 4821" } }
            - { kind: chip, tone: warn, text: { en: "Frozen", ar: "مجمّدة" }, gap: xs }
            - { kind: button, style: plain, text: { en: "Freeze card", ar: "جمّد البطاقة" }, gap: s }
      - id: status
        text: { en: "\"Status: frozen\"", ar: "«الحالة: مجمّدة»" }
        mock:
          width: 300
          caption: { en: "After this change", ar: "بعد هذا التغيير" }
          blocks:
            - { kind: meta, weight: bold, text: { en: "Debit card ·· 4821", ar: "بطاقة الخصم ·· 4821" } }
            - { kind: chip, tone: warn, text: { en: "Frozen", ar: "مجمّدة" }, gap: xs }
            - { kind: button, style: plain, text: { en: "Status: frozen", ar: "الحالة: مجمّدة" }, gap: s }
    answer: [unfreeze]
    misconceptions:
      - id: MC-P15-024
        when: [status, freeze]
        feedback:
          en: "This doesn't name what the tap will do. The card is already frozen, so the only action left is to unfreeze it."
          ar: "هذا لا يذكر ما ستفعله الضغطة. فالبطاقة مجمّدة أصلًا، والفعل الوحيد المتبقّي هو إلغاء التجميد."
    explain:
      en: "From Lesson 1: the label names the next state. The chip already shows the current one."
      ar: "من الدرس 1: النص يذكر الحالة التالية. والشارة تُظهر الحالة الحالية أصلًا."

  - id: S04
    type: choose
    skill: SK-P15-U04-03
    part: check
    rules: [R19]
    value:
      en: "Skill check. Confirmation Dialogs (NN/g): be specific and tell users the consequence of their action, instead of asking \"Are you sure?\"."
      ar: "اختبار مهارة. رسائل التأكيد (NN/g): كن محددًا وأخبر المستخدمين بنتيجة فعلهم، بدل أن تسأل «هل أنت متأكد؟»."
    ref: { url: "https://www.nngroup.com/articles/confirmation-dialog/", quote: "Be specific and inform users about the consequence of their action." }
    scenario:
      en: "People can remove a saved person they send money to. Then they must add the person's account number again to send to them."
      ar: "يستطيع الناس حذف شخص محفوظ يحوّلون إليه المال. وبعدها عليهم إضافة رقم حسابه مرة أخرى ليحوّلوا إليه."
    prompt:
      en: "Which confirmation helps people avoid removing the wrong person?"
      ar: "أي رسالة تأكيد تساعد الناس على تجنّب حذف الشخص الخطأ؟"
    options:
      - { id: sure, text: { en: "\"Are you sure?\" with OK and Cancel", ar: "«هل أنت متأكد؟» مع «موافق» و«إلغاء»" } }
      - { id: named, text: { en: "\"Remove Ahmed Samir (·· 7730)? To send him money again, you'll need his account number.\" with Keep Ahmed and Remove Ahmed", ar: "«حذف أحمد سمير (·· 7730)؟ لتحوّل إليه مرة أخرى، ستحتاج إلى رقم حسابه.» مع «أبقِ أحمد» و«احذف أحمد»" } }
      - { id: remove, text: { en: "\"Remove this person?\" with No and Yes", ar: "«حذف هذا الشخص؟» مع «لا» و«نعم»" } }
    answer: [named]
    misconceptions:
      - id: MC-P15-027
        when: [sure, remove]
        feedback:
          en: "No name, no result, and generic buttons. People will tap through without checking."
          ar: "لا اسم، ولا نتيجة، وأزرار عامة. وسيضغط الناس ويتابعون دون تحقّق."
    explain:
      en: "From Lesson 2: name the item and the result, and let each button say what it does."
      ar: "من الدرس 2: اذكر العنصر والنتيجة، ودع كل زر يقول ما يفعله."

  - id: S05
    type: choose
    skill: SK-P15-U04-04
    part: check
    rules: [R19]
    value:
      en: "Skill check. \"Learn More\" Links (NN/g): the best fix is usually to use keywords that describe the link's destination, front-loaded."
      ar: "اختبار مهارة. روابط «اعرف المزيد» (NN/g): أفضل حل غالبًا هو استخدام كلمات تصف وجهة الرابط، في أوله."
    ref: { url: "https://www.nngroup.com/articles/learn-more-links/", quote: "Option 1: Use keywords that describe the link's destination." }
    scenario:
      en: "Under the card offer, a link says \"Learn more\". It opens a table of all the card's fees."
      ar: "تحت عرض البطاقة رابط يقول «اعرف المزيد». وهو يفتح جدولًا بكل رسوم البطاقة."
    prompt:
      en: "Which link label is best?"
      ar: "أي نص للرابط هو الأفضل؟"
    options:
      - { id: details, text: { en: "\"More details\"", ar: "«تفاصيل أكثر»" } }
      - { id: benefits, text: { en: "\"Discover all the benefits\"", ar: "«اكتشف كل المزايا»" } }
      - { id: fees, text: { en: "\"See all card fees\"", ar: "«شاهد كل رسوم البطاقة»" } }
    answer: [fees]
    misconceptions:
      - id: MC-P15-028
        when: [details]
        feedback:
          en: "Still vague. Details about what: the card, the offer, or the fees?"
          ar: "ما زال غامضًا. تفاصيل عن ماذا: البطاقة، أم العرض، أم الرسوم؟"
      - id: MC-P15-029
        when: [benefits]
        feedback:
          en: "The page shows fees, not benefits. People expecting good news will feel misled."
          ar: "الصفحة تعرض الرسوم، لا المزايا. ومن ينتظر أخبارًا جيدة سيشعر بأنه خُدع."
    explain:
      en: "From Lesson 2: say what the link opens, and say it truthfully."
      ar: "من الدرس 2: قل ما يفتحه الرابط، وقله بصدق."
