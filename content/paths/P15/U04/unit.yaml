id: P15-U04
free: false
title:
  en: "Labels that say what happens"
  ar: "نصوص تقول ماذا سيحدث"
skill:
  en: "Write buttons, confirmations and links that tell people exactly what will happen before they tap."
  ar: "اكتب أزرارًا ورسائل تأكيد وروابط تخبر الناس بما سيحدث بالضبط قبل أن يضغطوا."
skills:
  - id: SK-P15-U04-01
    title: { en: "Start buttons with a clear verb", ar: "ابدأ الأزرار بفعل واضح" }
    can_do: { en: "Label buttons with a specific verb, and a noun when needed, in 2 to 4 words, and use the same label for the same action everywhere.", ar: "اكتب على الأزرار فعلًا محددًا، واسمًا عند الحاجة، في 2 إلى 4 كلمات، واستخدم نفس النص لنفس الفعل في كل مكان." }
  - id: SK-P15-U04-02
    title: { en: "Name the next state", ar: "سمِّ الحالة التالية" }
    can_do: { en: "Label a switching button with what it will do next, like Pause while playing, and name style changes with the style itself, like Bold.", ar: "اكتب على الزر المتبدّل ما سيفعله بعد الضغط، مثل «إيقاف مؤقت» أثناء التشغيل، وسمِّ تغييرات الشكل باسم الشكل نفسه، مثل Bold." }
  - id: SK-P15-U04-03
    title: { en: "Write confirmations people read", ar: "اكتب رسائل تأكيد يقرؤها الناس" }
    can_do: { en: "Name the item and the result in a confirmation, and give buttons that say what each choice does, like Delete file and Keep file.", ar: "اذكر العنصر والنتيجة في رسالة التأكيد، وضع أزرارًا تقول ما يفعله كل خيار، مثل «احذف الملف» و«أبقِ الملف»." }
  - id: SK-P15-U04-04
    title: { en: "Write links that keep their promise", ar: "اكتب روابط تفي بوعدها" }
    can_do: { en: "Write link labels that make sense on their own, say where they lead, and lead exactly there.", ar: "اكتب روابط مفهومة وحدها، تقول إلى أين تأخذك، وتأخذك إلى هناك بالضبط." }
