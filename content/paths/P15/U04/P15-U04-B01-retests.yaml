id: P15-U04-B01
mode: bank
title:
  en: "Re-tests: labels that say what happens"
  ar: "إعادة اختبار: نصوص (Labels) تقول ماذا سيحدث"
# Held back for the mastery round: each step is a new case for one skill, never shown in a lesson.
sources:
  - title: { en: "UI Copy: UX Guidelines for Command Names and Keyboard Shortcuts (NN/g)", ar: "نصوص الواجهة: إرشادات لأسماء الأوامر واختصارات لوحة المفاتيح (NN/g)" }
    url: "https://www.nngroup.com/articles/ui-copy/"
  - title: { en: "Confirmation Dialogs Can Prevent User Errors (If Not Overused) (NN/g)", ar: "رسائل التأكيد تمنع أخطاء المستخدمين (إن لم نُكثر منها) (NN/g)" }
    url: "https://www.nngroup.com/articles/confirmation-dialog/"
  - title: { en: "Better Link Labels: 4Ss for Encouraging Clicks (NN/g)", ar: "روابط أفضل: أربع صفات تشجّع على الضغط (NN/g)" }
    url: "https://www.nngroup.com/articles/better-link-labels/"
  - title: { en: "\"Learn More\" Links: You Can Do Better (NN/g)", ar: "روابط «اعرف المزيد»: يمكنك أن تفعل أفضل (NN/g)" }
    url: "https://www.nngroup.com/articles/learn-more-links/"
steps:
  - id: S01
    type: words
    skill: SK-P15-U04-01
    part: retest
    speaker: hana
    value:
      en: "Re-test. UI Copy (NN/g): transparent command names help users bridge the gulf of execution, the gap between what they want and how to do it."
      ar: "إعادة اختبار. نصوص الواجهة (NN/g): أسماء الأوامر الواضحة تساعد المستخدمين على عبور الفجوة بين ما يريدونه وكيف يفعلونه."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "Transparent command names and command shortcuts help users bridge the gulf of execution" }
    scenario:
      en: "In my gym app, members pick a yoga class at 6 PM. The button under it says \"Submit\"."
      ar: "في تطبيق ناديّ، يختار الأعضاء حصة يوغا في السادسة مساءً. والزر تحتها يقول «إرسال»."
    prompt:
      en: "Which label tells members what the button does?"
      ar: "أي نص يخبر الأعضاء بما يفعله الزر؟"
    options:
      - { id: ok, text: { en: "\"OK\"", ar: "«موافق»" } }
      - { id: book, text: { en: "\"Book class\"", ar: "«احجز الحصة»" } }
      - { id: go, text: { en: "\"Let's go! 🔥\"", ar: "«هيّا بنا! 🔥»" } }
    answer: [book]
    misconceptions:
      - id: MC-P15-023
        when: [ok]
        feedback:
          en: "\"OK\" to what? Members can't tell if this books the class or just closes the screen."
          ar: "«موافق» على ماذا؟ لا يعرف الأعضاء هل هذا يحجز الحصة أم يغلق الشاشة فقط."
      - id: MC-P15-025
        when: [go]
        feedback:
          en: "Fun, but it doesn't say the class will be booked."
          ar: "ممتع، لكنه لا يقول إن الحصة ستُحجز."
    correct:
      en: "Right. Verb plus what it books."
      ar: "صحيح. فعل ومعه ما يحجزه."
    explain:
      en: "Name the action people want to take. Then they don't have to wonder."
      ar: "سمِّ الفعل الذي يريد الناس القيام به. فلا يحتاجون إلى التساؤل."

  - id: S02
    type: choose
    skill: SK-P15-U04-01
    part: retest
    speaker: nour
    value:
      en: "Re-test. UI Copy (NN/g): when the verb alone doesn't make the action or the affected element clear, add a noun, like Delete Folder rather than Delete."
      ar: "إعادة اختبار. نصوص الواجهة (NN/g): حين لا يوضّح الفعل وحده الفعل أو العنصر المتأثّر، أضف اسمًا، مثل «احذف المجلّد» بدل «احذف»."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "When the resulting action or the element impacted is not clear from the verb or adjective alone, use a noun after the verb to disambiguate the context" }
    scenario:
      en: "On a patient's visit screen, there's one \"Delete\" button for the appointment and another for the uploaded X-ray. Both just say \"Delete\"."
      ar: "في شاشة زيارة المريض زر «احذف» للموعد، وزر آخر لصورة الأشعة المرفوعة. والاثنان يقولان «احذف» فقط."
    prompt:
      en: "How should these buttons be labeled?"
      ar: "كيف يُكتب نص هذين الزرّين؟"
    options:
      - { id: noun, text: { en: "\"Cancel appointment\" and \"Delete X-ray\"", ar: "«ألغِ الموعد» و«احذف صورة الأشعة»" } }
      - { id: icon, text: { en: "Keep \"Delete\" on both, and add a trash icon", ar: "أُبقي «احذف» على الاثنين، وأضيف رمز سلة المهملات" } }
      - { id: remove, text: { en: "\"Delete\" and \"Remove\"", ar: "«احذف» و«أزِل»" } }
    answer: [noun]
    misconceptions:
      - id: MC-P15-023
        when: [icon]
        feedback:
          en: "The icon says \"delete\" too. Patients still can't tell which button deletes what."
          ar: "الرمز يقول «احذف» أيضًا. والمرضى ما زالوا لا يعرفون أي زر يحذف ماذا."
      - id: MC-P15-026
        when: [remove]
        feedback:
          en: "Two words for the same kind of action, and still no hint of what each one affects."
          ar: "كلمتان لنفس نوع الفعل، وما زال لا يوجد ما يدلّ على ما يتأثّر بكل منهما."
    correct:
      en: "Right. Each button names what it affects."
      ar: "صحيح. كل زر يذكر الشيء الذي يعمل عليه."
    explain:
      en: "When two buttons could act on different things, add the noun."
      ar: "حين يمكن أن يعمل زرّان على أشياء مختلفة، أضف اسم الشيء."

  - id: S03
    type: choose
    skill: SK-P15-U04-02
    part: retest
    speaker: mona
    value:
      en: "Re-test. UI Copy (NN/g): Show Tab Bar becomes Hide Tab Bar when the tab bar is visible; the label names the desired state."
      ar: "إعادة اختبار. نصوص الواجهة (NN/g): «أظهر شريط التبويب» يصبح «أخفِ شريط التبويب» حين يكون الشريط ظاهرًا؛ فالنص يذكر الحالة المطلوبة."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "Show Tab Bar (left) becomes Hide Tab Bar (right) when the tab bar is visible." }
    scenario:
      en: "In our bill app, people can hide their balance in public. Right now the balance is showing on screen."
      ar: "في تطبيق الفواتير، يستطيع الناس إخفاء رصيدهم أمام الآخرين. والرصيد الآن ظاهر على الشاشة."
    prompt:
      en: "What should the button next to the balance say right now?"
      ar: "ماذا يجب أن يقول الزر بجانب الرصيد الآن؟"
    options:
      - { id: show, text: { en: "\"Show balance\"", ar: "«أظهر الرصيد»" } }
      - { id: visible, text: { en: "\"Balance visible\"", ar: "«الرصيد ظاهر»" } }
      - { id: hide, text: { en: "\"Hide balance\"", ar: "«أخفِ الرصيد»" } }
    answer: [hide]
    misconceptions:
      - id: MC-P15-024
        when: [show, visible]
        feedback:
          en: "The balance is already showing. The button must offer what's next: hiding it."
          ar: "الرصيد ظاهر أصلًا. والزر يجب أن يعرض الخطوة التالية: إخفاءه."
    correct:
      en: "Right. It offers the opposite of what's on screen."
      ar: "صحيح. يعرض عكس ما على الشاشة."
    explain:
      en: "A show/hide button always names what will happen next. When the balance is hidden, it says \"Show balance\"."
      ar: "زر الإظهار والإخفاء يذكر دائمًا ما سيحدث بعد الضغط. وحين يكون الرصيد مخفيًا، يقول «أظهر الرصيد»."

  - id: S04
    type: choose
    skill: SK-P15-U04-02
    part: retest
    speaker: rami
    value:
      en: "Re-test. UI Copy (NN/g): a playing video shows a Pause button, which signals the state it will move into after the tap."
      ar: "إعادة اختبار. نصوص الواجهة (NN/g): الفيديو أثناء التشغيل يُظهر زر «إيقاف مؤقت»، فهو يدلّ على الحالة التي سينتقل إليها بعد الضغط."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "For example, when a video is playing, we see a Pause button, which signals the state the video will move into as a result of clicking the icon." }
    scenario:
      en: "Our bus app reads out each stop. The sound is on now. I'm adding a text label next to the speaker icon."
      ar: "تطبيق الحافلات يقرأ اسم كل محطة بصوت مسموع. والصوت يعمل الآن. وأضيف نصًا بجانب رمز السمّاعة."
    prompt:
      en: "Which label should sit next to the icon right now?"
      ar: "أي نص يجب أن يكون بجانب الرمز الآن؟"
    options:
      - { id: mute, text: { en: "\"Mute\"", ar: "«اكتم الصوت»" } }
      - { id: on, text: { en: "\"Sound on\"", ar: "«الصوت يعمل»" } }
      - { id: toggle, text: { en: "\"Sound on/off\"", ar: "«الصوت تشغيل/إيقاف»" } }
    answer: [mute]
    misconceptions:
      - id: MC-P15-024
        when: [on]
        feedback:
          en: "People can already hear it's on. The label should say what the tap does."
          ar: "الناس يسمعون أن الصوت يعمل. والنص يجب أن يقول ما تفعله الضغطة."
      - id: MC-P15-023
        when: [toggle]
        feedback:
          en: "Both states at once. People can't tell which one a tap will give them."
          ar: "الحالتان معًا. ولا يعرف الناس أيهما ستعطيهم الضغطة."
    correct:
      en: "Right. While the sound plays, the label offers \"Mute\"."
      ar: "صحيح. أثناء تشغيل الصوت، يعرض النص «اكتم الصوت»."
    explain:
      en: "Same rule as Pause and Play: name the next state."
      ar: "نفس قاعدة زر الإيقاف المؤقت والتشغيل (Pause/Play): سمِّ الحالة التالية."

  - id: S05
    type: choose
    skill: SK-P15-U04-03
    part: retest
    speaker: youssef
    value:
      en: "Re-test. Confirmation Dialogs (NN/g): explain what is about to happen in user-centric terms that make it likely the user would recognize a mistake."
      ar: "إعادة اختبار. رسائل التأكيد (NN/g): اشرح ما سيحدث بكلمات من عالم المستخدم، بحيث يُرجَّح أن يلاحظ خطأه."
    ref: { url: "https://www.nngroup.com/articles/confirmation-dialog/", quote: "explain what this is, in user-centric terms that are easy to understand and make it likely that the user would recognize a mistake." }
    scenario:
      en: "In my shop's admin app, I can delete a product. If I do, its 3 open orders are canceled too."
      ar: "في تطبيق إدارة متجري، أستطيع حذف منتج. وإن فعلت، تُلغى طلباته الثلاثة المفتوحة أيضًا."
    prompt:
      en: "Which confirmation would make me stop if I tapped the wrong product?"
      ar: "أي رسالة تأكيد ستجعلني أتوقّف إن ضغطت على المنتج الخطأ؟"
    options:
      - { id: id, text: { en: "\"Delete item #SKU-2291? This action is permanent.\"", ar: "«حذف العنصر #SKU-2291؟ هذا الإجراء نهائي.»" } }
      - { id: named, text: { en: "\"Delete Red kettle 1.7 L? Its 3 open orders will be canceled.\"", ar: "«حذف الغلاية الحمراء 1.7 لتر؟ ستُلغى طلباتها الثلاثة المفتوحة.»" } }
      - { id: sure, text: { en: "\"Are you sure you want to delete?\"", ar: "«هل أنت متأكد أنك تريد الحذف؟»" } }
    answer: [named]
    misconceptions:
      - id: MC-P15-027
        when: [id, sure]
        feedback:
          en: "A code or nothing at all. I can't tell it's the wrong product, and I don't know orders will be canceled."
          ar: "خيار يذكر رمزًا فقط، وآخر لا يذكر المنتج أصلًا. لن أعرف أنه المنتج الخطأ، ولا أن طلبات ستُلغى."
    correct:
      en: "Right. A name I recognize, and the real cost."
      ar: "صحيح. اسم أعرفه، وما سيحدث فعلًا بعد الحذف."
    explain:
      en: "Use the words people know, like the product name, not an internal code."
      ar: "استخدم الكلمات التي يعرفها الناس، مثل اسم المنتج، لا رمزًا داخليًا."

  - id: S06
    type: choose
    skill: SK-P15-U04-03
    part: retest
    speaker: karim
    value:
      en: "Re-test. UI Copy (NN/g): avoid the generic OK in confirmation dialogs; a calendar dialog uses Discard, which reinforces the action."
      ar: "إعادة اختبار. نصوص الواجهة (NN/g): تجنّب «موافق» العامة في رسائل التأكيد؛ فأحد التقويمات يستخدم «تجاهل»، مما يؤكّد الفعل."
    ref: { url: "https://www.nngroup.com/articles/ui-copy/", quote: "Avoid using the generic phrase OK for button labels in confirmation dialogs." }
    scenario:
      en: "In our photo app, people edit a caption and then tap Back. A pop-up asks: \"Discard your changes?\" Its buttons are \"OK\" and \"Cancel\"."
      ar: "في تطبيق الصور، يعدّل الناس تعليقًا ثم يضغطون «رجوع». فتسأل نافذة: «تجاهل تعديلاتك؟» وأزرارها «موافق» و«إلغاء»."
    prompt:
      en: "Which buttons should the pop-up have?"
      ar: "أي أزرار يجب أن تكون في النافذة؟"
    options:
      - { id: yesno, text: { en: "\"Yes\" and \"No\"", ar: "«نعم» و«لا»" } }
      - { id: okback, text: { en: "\"OK\" and \"Go back\"", ar: "«موافق» و«رجوع»" } }
      - { id: named, text: { en: "\"Discard changes\" and \"Keep editing\"", ar: "«تجاهل التعديلات» و«تابِع التعديل»" } }
    answer: [named]
    misconceptions:
      - id: MC-P15-027
        when: [yesno, okback]
        feedback:
          en: "People tap these out of habit. \"OK\" could lose their changes without them noticing."
          ar: "يضغط الناس هذه الأزرار بحكم العادة. و«موافق» قد تُضيع تعديلاتهم دون أن ينتبهوا."
    correct:
      en: "Right. Each button says what happens to the changes."
      ar: "صحيح. كل زر يقول ما سيحدث للتعديلات."
    explain:
      en: "In a confirmation, the buttons should repeat the action, so a habit tap still lands safely."
      ar: "في رسالة التأكيد، الأزرار يجب أن تكرّر الفعل، حتى لا يخسر الناس شيئًا إن ضغطوا بحكم العادة."

  - id: S07
    type: choose
    skill: SK-P15-U04-04
    part: retest
    speaker: sara
    value:
      en: "Re-test. \"Learn More\" Links (NN/g): the phrase is most dangerous when used alone, because of its ambiguity and poor information scent; several Learn More links on one page make people wonder if they go to the same place."
      ar: "إعادة اختبار. روابط «اعرف المزيد» (NN/g): العبارة أخطر حين تُستخدم وحدها، بسبب غموضها وضعف دلالتها؛ وعدة روابط «اعرف المزيد» في صفحة واحدة تجعل الناس يتساءلون هل تذهب إلى المكان نفسه."
    ref: { url: "https://www.nngroup.com/articles/learn-more-links/", quote: "The phrase is most dangerous when used alone because of its ambiguity and poor information scent." }
    scenario:
      en: "Our bank's tips page has four articles. Each one ends with a \"Read more\" link. Screen-reader users hear \"Read more, Read more, Read more, Read more\"."
      ar: "في صفحة النصائح ببنكنا أربع مقالات. وكل واحدة تنتهي برابط «اقرأ المزيد». ومن يستخدم قارئ الشاشة (Screen reader) يسمع: «اقرأ المزيد، اقرأ المزيد، اقرأ المزيد، اقرأ المزيد»."
    prompt:
      en: "What's the best fix?"
      ar: "ما الإصلاح الذي يجعل كل رابط مفهومًا وحده، حتى لمن يسمعه؟"
    options:
      - { id: number, text: { en: "Number them: \"Read more 1\", \"Read more 2\"…", ar: "أرقّمها: «اقرأ المزيد 1»، «اقرأ المزيد 2»…" } }
      - { id: name, text: { en: "Name each one: \"Read: 5 ways to save on fees\", \"Read: spotting fake bank calls\"…", ar: "أسمّي كل واحد: «اقرأ: 5 طرق لتوفير الرسوم»، «اقرأ: كيف تكتشف مكالمات البنك المزيّفة»…" } }
      - { id: button, text: { en: "Turn each \"Read more\" into a big button", ar: "أحوّل كل «اقرأ المزيد» إلى زر كبير" } }
    answer: [name]
    misconceptions:
      - id: MC-P15-028
        when: [number, button]
        feedback:
          en: "The links still don't say where they go. Bigger or numbered, \"Read more\" is still a guess."
          ar: "الروابط ما زالت لا تقول إلى أين تأخذك. فـ «اقرأ المزيد» تبقى تخمينًا، كبيرة كانت أو مرقّمة."
    correct:
      en: "Right. Each link now stands on its own."
      ar: "صحيح. كل رابط الآن مفهوم وحده."
    explain:
      en: "Put the topic in the link. It helps people who scan, and people who listen."
      ar: "ضع الموضوع داخل الرابط. فهذا يساعد من يتصفّح بسرعة، ومن يستمع."

  - id: S08
    type: choose
    skill: SK-P15-U04-04
    part: retest
    speaker: tarek
    value:
      en: "Re-test. Better Link Labels (NN/g): when links set expectations that aren't met, they slowly corrode the user's trust in the site and the organization."
      ar: "إعادة اختبار. روابط أفضل (NN/g): حين تضع الروابط توقّعات لا تتحقّق، فإنها تُضعف ثقة المستخدم بالموقع وبالمؤسسة شيئًا فشيئًا."
    ref: { url: "https://www.nngroup.com/articles/better-link-labels/", quote: "When links set expectations that aren't met, they slowly corrode the user's trust in the site and the organization it represents." }
    scenario:
      en: "On the menu page, new visitors see an \"Order now\" button. It opens a sign-up form first. Many close the app at that point."
      ar: "في صفحة القائمة، يرى الزوّار الجدد زر «اطلب الآن». لكنه يفتح نموذج تسجيل أولًا. وكثيرون يغلقون التطبيق عند هذه النقطة."
    prompt:
      en: "Which label sets the right expectation for new visitors?"
      ar: "أيّ نص يخبر الزوّار الجدد بما سيحدث حين يضغطون؟"
    options:
      - { id: signup, text: { en: "\"Sign up to order\"", ar: "«سجّل لتطلب»" } }
      - { id: order, text: { en: "\"Order now!\"", ar: "«اطلب الآن!»" } }
      - { id: start, text: { en: "\"Get started\"", ar: "«ابدأ»" } }
    answer: [signup]
    misconceptions:
      - id: MC-P15-029
        when: [order]
        feedback:
          en: "It still promises ordering, and then shows a form. That broken promise is why people leave."
          ar: "ما زال يَعِد بالطلب، ثم يعرض نموذجًا. وهذا الوعد الذي لا يتحقّق هو سبب مغادرة الناس."
      - id: MC-P15-028
        when: [start]
        feedback:
          en: "Vague. People can't tell that they'll need to sign up."
          ar: "غامض. لا يعرف الناس منه أنهم سيحتاجون إلى التسجيل."
    correct:
      en: "Right. No surprise on the next screen."
      ar: "صحيح. لا مفاجأة في الشاشة التالية."
    explain:
      en: "Tell people about the extra step before they tap. A kept promise builds trust."
      ar: "أخبر الناس بالخطوة الإضافية قبل أن يضغطوا. فالوعد الذي يُوفى به يبني الثقة."
